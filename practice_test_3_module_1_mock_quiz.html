vidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The review article emphasizes that scholars have produced abundant research on major port cities but only a ______ research on smaller inland trading towns, even though those towns shaped regional exchange in important ways.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這篇評論文章強調，學者們對主要港口城市已有大量研究，但對較小的內陸貿易城鎮卻只有 ______ 研究，儘管這些城鎮以重要的方式塑造了區域交流。", "opts": {"A": "defense of", "B": "parallel to", "C": "catalog of", "D": "lack of"}, "optsZh": {"A": "defense of（對…的辯護）", "B": "parallel to（與…平行）", "C": "catalog of（…的目錄）", "D": "lack of（…的缺乏）"}, "answer": "D", "expl": "Lack of means an absence or shortage.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "arguments given in support of something", "zh": "對…的辯護", "word": "defense of"}, "B": {"pos": "adj. phr.", "en": "similar to or happening alongside something", "zh": "與…平行；與…相似", "word": "parallel to"}, "C": {"pos": "n. phr.", "en": "a complete list of items", "zh": "…的目錄", "word": "catalog of"}, "D": {"pos": "n. phr.", "en": "the state of not having enough of something", "zh": "…的缺乏", "word": "lack of"}}}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Words in Context: shortage or scarcity.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Marine biologists know a great deal about coral bleaching in shallow reefs, yet there remains a ______ evidence about how deeper reef communities respond to repeated heat waves.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Marine biologists know a great deal about coral bleaching in shallow reefs, yet there remains a ______ evidence about how deeper reef communities respond to repeated heat waves.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n海洋生物學家對淺海珊瑚礁的白化現象已有大量了解，但關於較深處的珊瑚礁群落如何因應反覆的熱浪，證據仍然 ______。", "opts": {"A": "scarcity of", "B": "profusion of", "C": "sequence of", "D": "quarrel about"}, "optsZh": {"A": "scarcity of（…的缺乏）", "B": "profusion of（大量的…）", "C": "sequence of（一連串的…）", "D": "quarrel about（關於…的爭吵）"}, "answer": "A", "expl": "Scarcity of means not enough of something.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a situation in which there is not enough of something", "zh": "…的缺乏", "word": "scarcity of"}, "B": {"pos": "n. phr.", "en": "a very large amount of something", "zh": "大量的…", "word": "profusion of"}, "C": {"pos": "n. phr.", "en": "a series of related things in order", "zh": "一連串的…", "word": "sequence of"}, "D": {"pos": "n. phr.", "en": "an angry argument about something", "zh": "關於…的爭吵", "word": "quarrel about"}}}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Words in Context: shortage or scarcity.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=broad\" target=\"_blank\" rel=\"noopener\" data-w=\"broad\" data-pos=\"adj.\" data-en=\"wide; including many different people or things\" data-zh=\"廣泛的；寬廣的\">broader<\/a> patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The committee could compare dozens of reports on primary schools, but it found only a ______ studies dealing with adult literacy programs in remote mountain districts.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The committee could compare dozens of reports on primary schools, but it found only a ______ studies dealing with adult literacy programs in remote mountain districts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n委員會可以比較數十份關於小學的報告，但它只找到 ______ 探討偏遠山區成人識字計畫的研究。", "opts": {"A": "preference for", "B": "summary of", "C": "dearth of", "D": "flood of"}, "optsZh": {"A": "preference for（對…的偏好）", "B": "summary of（…的摘要）", "C": "dearth of（…的缺乏）", "D": "flood of（大量的…）"}, "answer": "C", "expl": "Dearth of means a shortage.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a greater liking for one thing than another", "zh": "對…的偏好", "word": "preference for"}, "B": {"pos": "n. phr.", "en": "a short statement of the main points", "zh": "…的摘要", "word": "summary of"}, "C": {"pos": "n. phr.", "en": "a lack or shortage of something", "zh": "…的缺乏", "word": "dearth of"}, "D": {"pos": "n. phr.", "en": "a very large number of things arriving at once", "zh": "大量的…", "word": "flood of"}}}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Words in Context: shortage or scarcity.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In the introduction, the economist explains that there is a ______ data on informal childcare arrangements, making it difficult to estimate how much unpaid care contributes to household finances.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In the introduction, the economist explains that there is a ______ data on informal childcare arrangements, making it difficult to estimate how much unpaid care contributes to household finances.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在引言中，這位經濟學家解釋，關於非正式托育安排的資料 ______，因此很難估計無償照顧對家庭財務有多少貢獻。", "opts": {"A": "shortage of", "B": "surfeit of", "C": "resemblance to", "D": "record of"}, "optsZh": {"A": "shortage of（…的短缺）", "B": "surfeit of（過量的…）", "C": "resemblance to（與…相似）", "D": "record of（…的紀錄）"}, "answer": "A", "expl": "Shortage of means an insufficient amount.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a situation in which there is not enough of something", "zh": "…的短缺", "word": "shortage of"}, "B": {"pos": "n. phr.", "en": "an amount that is too large", "zh": "過量的…", "word": "surfeit of"}, "C": {"pos": "n. phr.", "en": "the state of looking like something", "zh": "與…相似", "word": "resemblance to"}, "D": {"pos": "n. phr.", "en": "written information kept about something", "zh": "…的紀錄", "word": "record of"}}}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Literary purpose: identify the main purpose of a descriptive excerpt.", "vocab": false, "body": "The following text is from Sarah Orne Jewett&#x27;s 1899 short story &#x27;Martha&#x27;s Lady.&#x27;<br><br>Miss Pyne sat by the window watching, in her best dress, looking <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stately\" target=\"_blank\" rel=\"noopener\" data-w=\"stately\" data-pos=\"adj.\" data-en=\"dignified and impressive\" data-zh=\"莊嚴的；威嚴的\">stately<\/a> and calm; she <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=seldom\" target=\"_blank\" rel=\"noopener\" data-w=\"seldom\" data-pos=\"adv.\" data-en=\"not often\" data-zh=\"很少；不常\">seldom<\/a> went out now, and it was almost time for the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=carriage\" target=\"_blank\" rel=\"noopener\" data-w=\"carriage\" data-pos=\"n.\" data-en=\"a vehicle pulled by horses\" data-zh=\"馬車\">carriage<\/a>. Martha was just coming in from the garden with the strawberries, and with more flowers in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=apron\" target=\"_blank\" rel=\"noopener\" data-w=\"apron\" data-pos=\"n.\" data-en=\"a piece of cloth worn over the front of clothes to keep them clean\" data-zh=\"圍裙\">apron<\/a>. It was a bright cool evening in June, the golden robins sang in the elms, and the sun was going down behind the apple-trees at the foot of the garden. The beautiful old house stood wide open to the long-expected guest.", "bodyPlain": "The following text is from Sarah Orne Jewett's 1899 short story 'Martha's Lady.'\n\nMiss Pyne sat by the window watching, in her best dress, looking stately and calm; she seldom went out now, and it was almost time for the carriage. Martha was just coming in from the garden with the strawberries, and with more flowers in her apron. It was a bright cool evening in June, the golden robins sang in the elms, and the sun was going down behind the apple-trees at the foot of the garden. The beautiful old house stood wide open to the long-expected guest.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自 Sarah Orne Jewett 1899 年的短篇小說〈Martha's Lady〉（Martha 的夫人）。\nPyne 小姐穿著她最好的衣服坐在窗邊望著，神情莊重而平靜；她現在很少出門，而馬車差不多快到了。Martha 正從花園帶著草莓走進來，圍裙裡還兜著更多的花。那是六月一個晴朗涼爽的傍晚，金黃色的知更鳥在榆樹上歌唱，太陽正從花園盡頭的蘋果樹後落下。這棟美麗的老房子敞開大門，迎接那位期待已久的客人。", "opts": {"A": "To convey the worries brought about by a new guest", "B": "To describe how the characters have changed over time", "C": "To contrast the activity indoors with the stillness outside", "D": "To depict the setting as the characters await a visitor's arrival"}, "optsZh": {"A": "傳達一位新客人所帶來的憂慮", "B": "描述角色們如何隨時間改變", "C": "對比室內的活動與屋外的寂靜", "D": "在角色們等待一位訪客到來時描繪場景"}, "answer": "D", "expl": "The excerpt describes the setting (the evening, the garden, the open house) while Miss Pyne and Martha prepare for 'the long-expected guest.'", "explZh": "這段文字描寫 Pyne 小姐與 Martha 準備迎接「期待已久的客人」時的場景（傍晚、花園、敞開的房子）。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Literary purpose: identify the main purpose of a descriptive excerpt.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n在一篇短篇小說的節錄中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園帶著花回來。敘述停留在傍晚的光線、已準備好的房間，以及一位期待已久的訪客即將到來的種種細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To argue that the characters should leave the house", "C": "To summarize a conflict between two relatives", "D": "To explain why music has lost its importance"}, "optsZh": {"A": "在角色們為某人的到來做準備時，描繪場景與氣氛", "B": "主張這些角色應該離開這棟房子", "C": "概述兩位親戚之間的衝突", "D": "解釋為什麼音樂已失去其重要性"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Literary purpose: identify the main purpose of a descriptive excerpt.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一首詩描寫說話者在黎明時分站在港口邊，看著船隻啟航。這首詩並未敘述一段已完成的旅程，而是強調薄霧、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To list the technical features of a harbor", "B": "To compare several forms of transportation", "C": "To criticize sailors for taking unnecessary risks", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "列出一座港口的技術特點", "B": "比較幾種不同的交通方式", "C": "批評水手們冒不必要的風險", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Literary purpose: identify the main purpose of a descriptive excerpt.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一段小說節錄呈現節慶餐會前擁擠的廚房。敘述者注意到擦亮的碗、精心排列的椅子，以及每當屋外響起腳步聲時家人們便停下動作的樣子——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To describe a completed celebration from beginning to end", "B": "To depict preparations that reveal anticipation within a family", "C": "To contrast rural and urban customs", "D": "To explain why the family dislikes visitors"}, "optsZh": {"A": "從頭到尾描述一場已經結束的慶祝活動", "B": "描繪顯露出一家人期待之情的準備工作", "C": "對比鄉村與都市的風俗", "D": "解釋為什麼這家人不喜歡訪客"}, "answer": "B", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Literary purpose: identify the main purpose of a descriptive excerpt.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；相反地，它著重描寫課前那些安靜的例行儀式。", "opts": {"A": "To argue that early classes should be canceled", "B": "To recount a student's entire academic career", "C": "To evaluate the quality of a school's curriculum", "D": "To describe the moments before a significant daily activity begins"}, "optsZh": {"A": "主張應該取消早上的課程", "B": "敘述一名學生完整的求學經歷", "C": "評估一所學校課程的品質", "D": "描述一項重要的日常活動開始前的時刻"}, "answer": "D", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Literary purpose: identify the main purpose of a descriptive excerpt.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一段文學作品呈現雨後的花園：濕漉漉的小徑、明亮的葉子，以及一張放在樹下的長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To compare two different seasons", "B": "To give instructions for maintaining a garden", "C": "To establish a reflective mood before a character acts", "D": "To reveal the full contents of a letter"}, "optsZh": {"A": "比較兩個不同的季節", "B": "提供照顧花園的指示", "C": "在角色採取行動之前營造一種沉思的氛圍", "D": "揭露一封信的完整內容"}, "answer": "C", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Text Structure: identify the function of a sentence that frames a research problem.", "vocab": false, "body": "Astronomers are confident that the star Betelgeuse will eventually consume all the helium in its core and explode in a supernova. They are much less confident, however, about when this will happen, since that depends on internal characteristics of Betelgeuse that are largely unknown. Astrophysicist Sarafina El-Badry Nance and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> recently investigated whether acoustic waves in the star could be used to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> internal stellar states but <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that this method could not sufficiently reveal Betelgeuse&#x27;s internal characteristics to allow its evolutionary state to be firmly fixed.", "bodyPlain": "Astronomers are confident that the star Betelgeuse will eventually consume all the helium in its core and explode in a supernova. They are much less confident, however, about when this will happen, since that depends on internal characteristics of Betelgeuse that are largely unknown. Astrophysicist Sarafina El-Badry Nance and colleagues recently investigated whether acoustic waves in the star could be used to determine internal stellar states but concluded that this method could not sufficiently reveal Betelgeuse's internal characteristics to allow its evolutionary state to be firmly fixed.", "stem": "Which choice best describes the function of the second sentence in the overall structure of the text?", "stemZh": "哪個選項最能描述第二句在全文整體結構中的功能？", "bodyZh": "天文學家相當確定，參宿四（Betelgeuse）這顆恆星終將耗盡其核心中所有的氦，並爆炸成超新星。然而，他們對這件事何時會發生就沒那麼有把握了，因為那取決於參宿四大部分仍屬未知的內部特性。天體物理學家 Sarafina El-Badry Nance 與同事最近研究了恆星中的聲波能否用來判定恆星的內部狀態，但結論是這種方法無法充分揭示參宿四的內部特性，因此無法確定其演化階段。", "opts": {"A": "It explains how the work of Nance and colleagues was received by others in the field.", "B": "It presents the central finding reported by Nance and colleagues.", "C": "It identifies the problem that Nance and colleagues attempted to solve but did not.", "D": "It describes a serious limitation of the method used by Nance and colleagues."}, "optsZh": {"A": "它說明 Nance 與同事的研究如何受到該領域其他人的評價。", "B": "它呈現 Nance 與同事所報告的核心發現。", "C": "它指出 Nance 與同事試圖解決卻未能解決的問題。", "D": "它描述 Nance 與同事所用方法的一項嚴重限制。"}, "answer": "C", "expl": "The second sentence states the problem — astronomers do not know when Betelgeuse will explode — which Nance's team tried but failed to solve.", "explZh": "第二句提出問題：天文學家不知道參宿四何時會爆炸；Nance 的團隊試圖解決但未能成功。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Text Structure: identify the function of a sentence that frames a research problem.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一篇科學文章首先說明，每當彗星接近太陽時，它的表面就會改變。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述一項研究，它測試雷達能否解決這個問題，卻發現訊號穿透得不夠深。", "opts": {"A": "It offers evidence that radar is always reliable.", "B": "It states the study's final conclusion.", "C": "It describes how other researchers criticized the work.", "D": "It identifies the uncertainty that motivated the study."}, "optsZh": {"A": "它提供了雷達永遠可靠的證據。", "B": "它陳述了這項研究的最終結論。", "C": "它描述了其他研究人員如何批評這項研究。", "D": "它指出了促成這項研究的不確定之處。"}, "answer": "D", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Text Structure: identify the function of a sentence that frames a research problem.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一篇考古學文章開頭指出，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不清楚，因為附近的道路幾乎沒有留下任何實體痕跡。文章接著討論一個團隊在陶器中尋找化學特徵，但只得出初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It summarizes the team's strongest result.", "C": "It contradicts the claim made in the first sentence.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它界定了後續研究試圖解決的問題。", "B": "它概述了這個團隊最有力的研究結果。", "C": "它反駁了第一句中提出的主張。", "D": "它將討論從考古學轉移開來。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Text Structure: identify the function of a sentence that frames a research problem.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇生物學文章指出，某種植物能夠在長期乾旱中存活。接下來的句子說明，科學家仍不確定是哪一種細胞機制使它得以存活。文章其餘部分描述一項排除了其中一種可能機制的實驗。", "opts": {"A": "It lists the materials used in the experiment.", "B": "It introduces a gap in knowledge that the experiment examines.", "C": "It proves that drought has no effect on plants.", "D": "It gives a historical overview of plant classification."}, "optsZh": {"A": "它列出了實驗中使用的材料。", "B": "它引出了這項實驗所探討的知識缺口。", "C": "它證明了乾旱對植物沒有影響。", "D": "它提供了植物分類的歷史概述。"}, "answer": "B", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Text Structure: identify the function of a sentence that frames a research problem.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A literary analysis begins by noting that a novel&#x27;s ending has often been described as optimistic. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文學分析的開頭指出，一部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋很難站得住腳，因為最後一章包含了好幾個禁錮的意象。段落的其餘部分解釋這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It provides biographical information about the novelist.", "B": "It summarizes the novel's publication history.", "C": "It raises a difficulty with a common interpretation.", "D": "It introduces an unrelated theme."}, "optsZh": {"A": "它提供了關於這位小說家的生平資料。", "B": "它概述了這部小說的出版歷史。", "C": "它提出了一個常見詮釋所面臨的難題。", "D": "它引入了一個不相關的主題。"}, "answer": "C", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Text Structure: identify the function of a sentence that frames a research problem.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一篇科技文章首先說，自主水下載具能夠繪製海底地圖。下一句解釋，它們在狹窄的洞穴中常常失效，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師針對這些條件測試一套新的導航系統。", "opts": {"A": "It announces that the technology is already flawless.", "B": "It gives a personal anecdote about engineers.", "C": "It compares underwater vehicles with aircraft.", "D": "It explains the limitation that the new system is meant to address."}, "optsZh": {"A": "它宣稱這項技術已經完美無缺。", "B": "它提供了一則關於工程師的個人軼事。", "C": "它將水下載具與飛機加以比較。", "D": "它說明了新系統所要解決的限制。"}, "answer": "D", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Literary detail: infer a character trait supported by narration.", "vocab": false, "body": "The following text is from Jane Austen&#x27;s 1811 novel Sense and Sensibility.<br><br>Elinor, this eldest daughter, whose advice was so <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectual\" target=\"_blank\" rel=\"noopener\" data-w=\"effectual\" data-pos=\"adj.\" data-en=\"producing the intended result\" data-zh=\"有效的\">effectual<\/a>, possessed a strength of understanding, and coolness of judgment, which qualified her, though only nineteen, to be the counsellor of her mother, and enabled her frequently to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=counteract\" target=\"_blank\" rel=\"noopener\" data-w=\"counteract\" data-pos=\"v.\" data-en=\"to reduce the effect of something by acting against it\" data-zh=\"抵消；對抗\">counteract<\/a>, to the advantage of them all, that eagerness of mind in Mrs. Dashwood which must generally have led to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=imprudence\" target=\"_blank\" rel=\"noopener\" data-w=\"imprudence\" data-pos=\"n.\" data-en=\"lack of care or good judgment\" data-zh=\"輕率；不謹慎\">imprudence<\/a>. She had an excellent heart; her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disposition\" target=\"_blank\" rel=\"noopener\" data-w=\"disposition\" data-pos=\"n.\" data-en=\"a person&#x27;s usual character or mood\" data-zh=\"性情；性格\">disposition<\/a> was affectionate, and her feelings were strong; but she knew how to govern them: it was a knowledge which her mother had yet to learn; and which one of her sisters had resolved never to be taught.<br><br>According to the text, what is true about Elinor?", "bodyPlain": "The following text is from Jane Austen's 1811 novel Sense and Sensibility.\n\nElinor, this eldest daughter, whose advice was so effectual, possessed a strength of understanding, and coolness of judgment, which qualified her, though only nineteen, to be the counsellor of her mother, and enabled her frequently to counteract, to the advantage of them all, that eagerness of mind in Mrs. Dashwood which must generally have led to imprudence. She had an excellent heart; her disposition was affectionate, and her feelings were strong; but she knew how to govern them: it was a knowledge which her mother had yet to learn; and which one of her sisters had resolved never to be taught.\n\nAccording to the text, what is true about Elinor?", "stem": "", "stemZh": "", "bodyZh": "以下文字出自 Jane Austen 1811 年的小說《Sense and Sensibility》（理性與感性）。\nElinor 是家中的長女，她的建議十分有效；她擁有強大的理解力和冷靜的判斷力，這使她雖然年僅十九歲，卻足以成為母親的顧問，並經常能為了全家人的利益，抵消 Mrs. Dashwood 那種通常必然會導致輕率行事的急切心思。她有一顆善良的心；她性情溫柔，感情強烈；但她懂得如何駕馭自己的感情：這是她母親尚未學會的，而她的一個妹妹則已下定決心永遠不要學。\n根據本文，關於 Elinor 何者為真？", "opts": {"A": "Elinor often argues with her mother but fails to change her mind.", "B": "Elinor can be overly sensitive with regard to family matters.", "C": "Elinor thinks her mother is a bad role model.", "D": "Elinor is remarkably mature for her age."}, "optsZh": {"A": "Elinor 經常和母親爭論，卻無法改變母親的想法。", "B": "Elinor 在家庭事務上可能過於敏感。", "C": "Elinor 認為她的母親是個壞榜樣。", "D": "以她的年紀而言，Elinor 非常成熟。"}, "answer": "D", "expl": "Though 'only nineteen,' Elinor has strong understanding and cool judgment and serves as her mother's counsellor, so she is remarkably mature for her age.", "explZh": "Elinor 雖然「年僅十九歲」，卻有強大的理解力與冷靜的判斷力，還能當母親的顧問，可見她以年紀而言非常成熟。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Literary detail: infer a character trait supported by narration.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常給年長的親戚建議，因為當別人衝動行事時，她仍能保持冷靜。敘述者強調她的感情是真誠的，但在需要判斷力時，她能克制自己的情緒。", "opts": {"A": "She is admired mainly for her wealth.", "B": "She shows unusual maturity and self-command.", "C": "She refuses to give advice to others.", "D": "She lacks affection for her family."}, "optsZh": {"A": "她主要因財富而受人景仰。", "B": "她展現出不尋常的成熟與自制。", "C": "她拒絕給別人建議。", "D": "她對家人缺乏感情。"}, "answer": "B", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Literary detail: infer a character trait supported by narration.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當她終於提出建議時，屋裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強勢。", "opts": {"A": "The grandmother's influence is quiet but substantial.", "B": "The narrator thinks patience is useless.", "C": "The grandmother avoids family matters entirely.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "祖母的影響力低調卻深遠。", "B": "敘述者認為耐心毫無用處。", "C": "祖母完全避開家務事。", "D": "家人忽視祖母的意見。"}, "answer": "A", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Literary detail: infer a character trait supported by narration.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一則故事描述一位職員，他會注意到別人已經核准的帳簿中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The coworkers are more accurate than the clerk.", "B": "The business fails because of excessive caution.", "C": "The clerk's carefulness is valuable despite being inconvenient.", "D": "The clerk intentionally creates errors."}, "optsZh": {"A": "同事們比這位職員更精確。", "B": "這家店因過度謹慎而倒閉。", "C": "這位職員的細心雖然帶來不便，卻很有價值。", "D": "這位職員故意製造錯誤。"}, "answer": "C", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Literary detail: infer a character trait supported by narration.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=obvious\" target=\"_blank\" rel=\"noopener\" data-w=\"obvious\" data-pos=\"adj.\" data-en=\"easy to see or understand\" data-zh=\"明顯的\">obvious<\/a>. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一段文字指出，一位村莊領袖在做決定前會聆聽每一位發言者，即使答案看似顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader is unable to reach conclusions.", "B": "The leader makes decisions without hearing others.", "C": "The leader values inclusive deliberation.", "D": "The leader dislikes public meetings."}, "optsZh": {"A": "這位領導人無法做出結論。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人重視包容各方的審議。", "D": "這位領導人不喜歡公開會議。"}, "answer": "C", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Literary detail: infer a character trait supported by narration.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在一段節錄中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期的討論中鼓勵大膽推測，但在每一項測量都經過檢查之前，她不會發表任何主張。", "opts": {"A": "She publishes claims before testing them.", "B": "She rejects all imaginative thinking.", "C": "She avoids working with students.", "D": "She combines intellectual openness with rigorous standards."}, "optsZh": {"A": "她在驗證主張之前就將其發表。", "B": "她排斥一切富有想像力的思考。", "C": "她避免與學生共事。", "D": "她兼具開放的求知態度與嚴格的標準。"}, "answer": "D", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "Believing that living in an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=impractical\" target=\"_blank\" rel=\"noopener\" data-w=\"impractical\" data-pos=\"adj.\" data-en=\"not sensible or useful in real situations\" data-zh=\"不實用的\">impractical<\/a> space can heighten awareness and even improve health, conceptual artists Madeline Gins and Shusaku Arakawa designed an apartment building in Japan to be more fanciful than functional. A kitchen counter is chest-high on one side and knee-high on the other; a ceiling has a door to nowhere. The effect is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disorient\" target=\"_blank\" rel=\"noopener\" data-w=\"disorient\" data-pos=\"v.\" data-en=\"to make someone lose their sense of direction\" data-zh=\"使迷失方向\">disorienting<\/a> but <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invigorate\" target=\"_blank\" rel=\"noopener\" data-w=\"invigorate\" data-pos=\"v.\" data-en=\"to give energy and strength to\" data-zh=\"使振奮；使有活力\">invigorating<\/a>: after four years there, filmmaker Nobu Yamaoka reported <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> health benefits.", "bodyPlain": "Believing that living in an impractical space can heighten awareness and even improve health, conceptual artists Madeline Gins and Shusaku Arakawa designed an apartment building in Japan to be more fanciful than functional. A kitchen counter is chest-high on one side and knee-high on the other; a ceiling has a door to nowhere. The effect is disorienting but invigorating: after four years there, filmmaker Nobu Yamaoka reported significant health benefits.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "觀念藝術家 Madeline Gins 與荒川修作（Shusaku Arakawa）相信，住在不實用的空間裡能提高感知力，甚至改善健康，因此他們在日本設計了一棟重奇想、輕實用的公寓大樓。廚房流理台一邊高及胸口、另一邊只到膝蓋；天花板上有一扇通往無處的門。這種效果令人迷失方向卻又使人振奮：在那裡住了四年後，電影製作人山岡信貴（Nobu Yamaoka）表示健康有顯著改善。", "opts": {"A": "Although inhabiting a home surrounded by fanciful features such as those designed by Gins and Arakawa can be rejuvenating, it is unsustainable.", "B": "Designing disorienting spaces like those in the Gins and Arakawa building is the most effective way to create a physically stimulating environment.", "C": "As a filmmaker, Yamaoka has long supported the designs of conceptual artists such as Gins and Arakawa.", "D": "Although impractical, the design of the apartment building by Gins and Arakawa may improve the well-being of the building's residents."}, "optsZh": {"A": "雖然住在像 Gins 與荒川所設計那樣充滿奇想的家中能使人恢復活力，但這是無法長久持續的。", "B": "設計像 Gins 與荒川大樓中那種令人迷失方向的空間，是打造能刺激身體的環境最有效的方式。", "C": "身為電影製作人，山岡長期支持 Gins 與荒川等觀念藝術家的設計。", "D": "Gins 與荒川設計的公寓大樓雖然不實用，卻可能改善住戶的身心健康。"}, "answer": "D", "expl": "The building is impractical ('more fanciful than functional') but a resident reported significant health benefits, so it may improve residents' well-being.", "explZh": "這棟大樓不實用（「重奇想、輕實用」），但住戶表示健康明顯改善，所以它可能改善住戶的身心健康。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n在一篇短篇小說的節錄中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園帶著花回來。敘述停留在傍晚的光線、已準備好的房間，以及一位期待已久的訪客即將到來的種種細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To summarize a conflict between two relatives", "C": "To explain why music has lost its importance", "D": "To argue that the characters should leave the house"}, "optsZh": {"A": "在角色們為某人的到來做準備時，描繪場景與氣氛", "B": "概述兩位親戚之間的衝突", "C": "解釋為什麼音樂已失去其重要性", "D": "主張這些角色應該離開這棟房子"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pi
