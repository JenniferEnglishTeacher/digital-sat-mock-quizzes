 finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Command of Evidence: identify a finding that supports an argument.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "Some songs use a meter also found in older European poetry.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "許多表演者是向親戚學習歌曲的。", "B": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "C": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "D": "有好幾個國家的學者都在研究這項傳統。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Command of Evidence: identify a finding that supports an argument.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "Both towns had some volunteers.", "C": "The program took place in a community.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "兩個城鎮都有一些志工。", "C": "這項計畫在一個社區中進行。", "D": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Inferences: complete a conclusion from historical evidence.", "vocab": false, "body": "Euro-American farmers in what is now the northeastern United States began using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=agricultural\" target=\"_blank\" rel=\"noopener\" data-w=\"agricultural\" data-pos=\"adj.\" data-en=\"relating to farming\" data-zh=\"農業的\">agricultural<\/a> techniques that had been developed by the Haudenosaunee centuries earlier, but few of those farmers had seen Haudenosaunee farms <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=firsthand\" target=\"_blank\" rel=\"noopener\" data-w=\"firsthand\" data-pos=\"adv./adj.\" data-en=\"directly from personal experience\" data-zh=\"第一手地；親身的\">firsthand<\/a>. Barring <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> development, these facts suggest ______", "bodyPlain": "Euro-American farmers in what is now the northeastern United States began using agricultural techniques that had been developed by the Haudenosaunee centuries earlier, but few of those farmers had seen Haudenosaunee farms firsthand. Barring independent development, these facts suggest ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在今日美國東北部的歐裔美國農民開始使用由 Haudenosaunee（易洛魁聯盟）在數世紀前發展出的農業技術，但這些農民中很少有人親眼見過 Haudenosaunee 的農場。排除各自獨立發展的可能性，這些事實顯示 ______", "opts": {"A": "the Euro-American farmers learned the techniques from other people who were more directly influenced by Haudenosaunee farmers.", "B": "the crops raised by Haudenosaunee farmers were not suited to the northeastern United States.", "C": "the techniques developed by the Haudenosaunee were widely used outside the northeastern United States.", "D": "Euro-American farmers only recognized the benefits of Haudenosaunee techniques much later."}, "optsZh": {"A": "這些歐裔美國農民是從其他受 Haudenosaunee 農民更直接影響的人那裡學到這些技術的。", "B": "Haudenosaunee 農民種植的作物不適合美國東北部。", "C": "Haudenosaunee 發展出的技術在美國東北部以外地區被廣泛使用。", "D": "歐裔美國農民直到很久以後才認識到 Haudenosaunee 技術的好處。"}, "answer": "A", "expl": "The farmers used Haudenosaunee techniques without seeing Haudenosaunee farms, so they likely learned them indirectly from other people.", "explZh": "這些農民使用了 Haudenosaunee 的技術卻沒親眼見過其農場，因此很可能是間接從其他人那裡學來的。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Inferences: complete a conclusion from historical evidence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n某個地區的農民採用了一個遙遠原住民族所發明的種植技術，但紀錄顯示，這些農民中很少有人與該民族有直接接觸。如果這項技術並非獨立發明的，證據顯示 ______", "opts": {"A": "the records prove that all farms used identical crops.", "B": "the farmers likely learned it through intermediaries who had more direct contact with the original practitioners.", "C": "the technique could not have been useful in the region.", "D": "the Indigenous nation adopted the technique from those farmers."}, "optsZh": {"A": "這些紀錄證明所有農場都種植完全相同的作物。", "B": "那些農民很可能是透過與最初使用者有更直接接觸的中間人學到這項技術的。", "C": "這項技術在該地區不可能派上用場。", "D": "這個原住民族是從那些農民那裡學到這項技術的。"}, "answer": "B", "expl": "Indirect transmission best explains the evidence.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Inferences: complete a conclusion from historical evidence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Artifacts at a coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Artifacts at a coastal settlement include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一處沿海聚落出土的文物中，包含了在該聚落建立前兩個世紀所製作的珠子。如果珠子的年代與聚落建立的年代都正確，那麼這些珠子很可能 ______", "opts": {"A": "show that dating methods are never useful.", "B": "prove the settlement was founded two centuries earlier.", "C": "were all produced by the settlement's first residents.", "D": "were made elsewhere and reached the settlement through trade, inheritance, or migration."}, "optsZh": {"A": "顯示定年方法從來都沒有用。", "B": "證明這個聚落早了兩個世紀建立。", "C": "全都是由這個聚落最早的居民製作的。", "D": "是在別處製作，再透過貿易、繼承或遷徙傳到這個聚落的。"}, "answer": "D", "expl": "Older objects can move before being deposited at a later site.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Inferences: complete a conclusion from historical evidence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n研究人員將一種植物蛋白質替換成另一個物種的類似蛋白質，而該物種在氣溫上升時並不會改變開花時間。經過改造的植物在溫和氣溫下生長正常，但與未經改造的植物不同，它們在較溫暖的環境下無法提早開花。研究結果顯示 ______", "opts": {"A": "the original protein helps the plant respond to increased temperature.", "B": "all plants accelerate flowering at the same temperature.", "C": "temperature has no effect on the species.", "D": "the replacement protein improves warm-weather flowering."}, "optsZh": {"A": "原本的蛋白質幫助植物對溫度升高做出反應。", "B": "所有植物都在相同的溫度下加速開花。", "C": "溫度對這個物種沒有影響。", "D": "替代的蛋白質能改善溫暖天氣下的開花情形。"}, "answer": "A", "expl": "Only plants with the original protein showed the temperature response.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Inferences: complete a conclusion from historical evidence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=broad\" target=\"_blank\" rel=\"noopener\" data-w=\"broad\" data-pos=\"adj.\" data-en=\"wide; including many different people or things\" data-zh=\"廣泛的；寬廣的\">broader<\/a> patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A study compares students&#x27; reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A study compares students' reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一項研究使用閱讀難度差異極大的謎題來比較學生的推理能力。由於有些學生拿到的是簡單的措辭，另一些學生拿到的則是艱深的技術性描述，研究結果 ______", "opts": {"A": "show that wording never affects performance.", "B": "can be generalized to every kind of test.", "C": "may reflect differences in reading load rather than differences in reasoning ability.", "D": "prove that all students have the same reasoning ability."}, "optsZh": {"A": "顯示措辭從不影響表現。", "B": "可以推廣到每一種測驗。", "C": "可能反映的是閱讀負擔的差異，而非推理能力的差異。", "D": "證明所有學生的推理能力都相同。"}, "answer": "C", "expl": "An uncontrolled task feature limits the conclusion.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Inferences: complete a conclusion from historical evidence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一份手稿主要保存了遷徙之前的歌謠，但其中有幾行提到的地方，是這個群體在遷徙之後才接觸到的。因此，學者推斷 ______", "opts": {"A": "the references to later places must be accidental.", "B": "the manuscript probably combines earlier material with later additions or revisions.", "C": "the scribes were unable to understand the songs.", "D": "none of the songs can predate the migration."}, "optsZh": {"A": "提及後來地點的內容必定是出於偶然。", "B": "這份手稿很可能結合了較早的素材與後來的增補或修訂。", "C": "抄寫員無法理解這些歌曲。", "D": "沒有任何一首歌可能早於這次遷徙。"}, "answer": "B", "expl": "Mixed evidence supports mixed origins.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Inferences: reconcile two pieces of archaeological evidence.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artifact\" target=\"_blank\" rel=\"noopener\" data-w=\"artifact\" data-pos=\"n.\" data-en=\"an object made by people long ago\" data-zh=\"文物；人工製品\">artifacts<\/a> found at Kuulo Kataa may date to the thirteenth century, but other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> supports a fourteenth-century founding date for the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a>. If both the artifact dates and the founding date are correct, this would <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=imply\" target=\"_blank\" rel=\"noopener\" data-w=\"imply\" data-pos=\"v.\" data-en=\"to suggest something without saying it directly\" data-zh=\"暗示\">imply<\/a> ______", "bodyPlain": "Some artifacts found at Kuulo Kataa may date to the thirteenth century, but other evidence supports a fourteenth-century founding date for the settlement. If both the artifact dates and the founding date are correct, this would imply ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在 Kuulo Kataa 發現的一些文物可能可追溯到十三世紀，但其他證據支持這個聚落建立於十四世紀。如果文物的年代與聚落建立的年代都正確，這就意味著 ______", "opts": {"A": "fourteenth-century artifacts are more common at Kuulo Kataa than thirteenth-century artifacts.", "B": "the artifacts originated elsewhere and eventually reached Kuulo Kataa through trade or migration.", "C": "Kuulo Kataa was founded by people who had lived at the site during the thirteenth century.", "D": "excavations at Kuulo Kataa damaged the oldest artifacts at the site."}, "optsZh": {"A": "在 Kuulo Kataa，十四世紀的文物比十三世紀的文物更常見。", "B": "這些文物源自別處，後來透過貿易或遷徙到達 Kuulo Kataa。", "C": "Kuulo Kataa 是由十三世紀時曾住在該地的人所建立的。", "D": "Kuulo Kataa 的挖掘工作損壞了該地最古老的文物。"}, "answer": "B", "expl": "If the artifacts are older than the settlement itself, they must have been made elsewhere and later brought there by trade or migration.", "explZh": "如果文物比聚落本身還古老，它們一定是在別處製造，後來經由貿易或遷徙帶到那裡。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Inferences: reconcile two pieces of archaeological evidence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n某個地區的農民採用了一個遙遠原住民族所發明的種植技術，但紀錄顯示，這些農民中很少有人與該民族有直接接觸。如果這項技術並非獨立發明的，證據顯示 ______", "opts": {"A": "the records prove that all farms used identical crops.", "B": "the Indigenous nation adopted the technique from those farmers.", "C": "the technique could not have been useful in the region.", "D": "the farmers likely learned it through intermediaries who had more direct contact with the original practitioners."}, "optsZh": {"A": "這些紀錄證明所有農場都種植完全相同的作物。", "B": "這個原住民族是從那些農民那裡學到這項技術的。", "C": "這項技術在該地區不可能派上用場。", "D": "那些農民很可能是透過與最初使用者有更直接接觸的中間人學到這項技術的。"}, "answer": "D", "expl": "Indirect transmission best explains the evidence.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Inferences: reconcile two pieces of archaeological evidence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Artifacts at a coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Artifacts at a coastal settlement include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一處沿海聚落出土的文物中，包含了在該聚落建立前兩個世紀所製作的珠子。如果珠子的年代與聚落建立的年代都正確，那麼這些珠子很可能 ______", "opts": {"A": "were made elsewhere and reached the settlement through trade, inheritance, or migration.", "B": "show that dating methods are never useful.", "C": "prove the settlement was founded two centuries earlier.", "D": "were all produced by the settlement's first residents."}, "optsZh": {"A": "是在別處製作，再透過貿易、繼承或遷徙傳到這個聚落的。", "B": "顯示定年方法從來都沒有用。", "C": "證明這個聚落早了兩個世紀建立。", "D": "全都是由這個聚落最早的居民製作的。"}, "answer": "A", "expl": "Older objects can move before being deposited at a later site.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Inferences: reconcile two pieces of archaeological evidence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n研究人員將一種植物蛋白質替換成另一個物種的類似蛋白質，而該物種在氣溫上升時並不會改變開花時間。經過改造的植物在溫和氣溫下生長正常，但與未經改造的植物不同，它們在較溫暖的環境下無法提早開花。研究結果顯示 ______", "opts": {"A": "the replacement protein improves warm-weather flowering.", "B": "temperature has no effect on the species.", "C": "the original protein helps the plant respond to increased temperature.", "D": "all plants accelerate flowering at the same temperature."}, "optsZh": {"A": "替代的蛋白質能改善溫暖天氣下的開花情形。", "B": "溫度對這個物種沒有影響。", "C": "原本的蛋白質幫助植物對溫度升高做出反應。", "D": "所有植物都在相同的溫度下加速開花。"}, "answer": "C", "expl": "Only plants with the original protein showed the temperature response.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Inferences: reconcile two pieces of archaeological evidence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=broad\" target=\"_blank\" rel=\"noopener\" data-w=\"broad\" data-pos=\"adj.\" data-en=\"wide; including many different people or things\" data-zh=\"廣泛的；寬廣的\">broader<\/a> patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A study compares students&#x27; reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A study compares students' reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一項研究使用閱讀難度差異極大的謎題來比較學生的推理能力。由於有些學生拿到的是簡單的措辭，另一些學生拿到的則是艱深的技術性描述，研究結果 ______", "opts": {"A": "prove that all students have the same reasoning ability.", "B": "may reflect differences in reading load rather than differences in reasoning ability.", "C": "show that wording never affects performance.", "D": "can be generalized to every kind of test."}, "optsZh": {"A": "證明所有學生的推理能力都相同。", "B": "可能反映的是閱讀負擔的差異，而非推理能力的差異。", "C": "顯示措辭從不影響表現。", "D": "可以推廣到每一種測驗。"}, "answer": "B", "expl": "An uncontrolled task feature limits the conclusion.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Inferences: reconcile two pieces of archaeological evidence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一份手稿主要保存了遷徙之前的歌謠，但其中有幾行提到的地方，是這個群體在遷徙之後才接觸到的。因此，學者推斷 ______", "opts": {"A": "the manuscript probably combines earlier material with later additions or revisions.", "B": "none of the songs can predate the migration.", "C": "the references to later places must be accidental.", "D": "the scribes were unable to understand the songs."}, "optsZh": {"A": "這份手稿很可能結合了較早的素材與後來的增補或修訂。", "B": "沒有任何一首歌可能早於這次遷徙。", "C": "提及後來地點的內容必定是出於偶然。", "D": "抄寫員無法理解這些歌曲。"}, "answer": "A", "expl": "Mixed evidence supports mixed origins.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "Biologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=replace\" target=\"_blank\" rel=\"noopener\" data-w=\"replace\" data-pos=\"v.\" data-en=\"to take the place of something\" data-zh=\"取代\">replaced<\/a> the ELF3 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protein\" target=\"_blank\" rel=\"noopener\" data-w=\"protein\" data-pos=\"n.\" data-en=\"a substance in living things that is needed for growth\" data-zh=\"蛋白質\">protein<\/a> in Arabidopsis thaliana with a similar protein from stiff brome, a plant that does not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accelerate\" target=\"_blank\" rel=\"noopener\" data-w=\"accelerate\" data-pos=\"v.\" data-en=\"to happen faster or earlier\" data-zh=\"加速；提早\">accelerate<\/a> flowering when temperature increases. At 22 degrees Celsius, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unmodified\" target=\"_blank\" rel=\"noopener\" data-w=\"unmodified\" data-pos=\"adj.\" data-en=\"not changed\" data-zh=\"未經改造的；未修改的\">unmodified<\/a> A. thaliana plants and altered plants showed no difference in flowering time; at 27 degrees Celsius, unmodified plants accelerated flowering, but altered plants did not, suggesting ______", "bodyPlain": "Biologists replaced the ELF3 protein in Arabidopsis thaliana with a similar protein from stiff brome, a plant that does not accelerate flowering when temperature increases. At 22 degrees Celsius, unmodified A. thaliana plants and altered plants showed no difference in flowering time; at 27 degrees Celsius, unmodified plants accelerated flowering, but altered plants did not, suggesting ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "生物學家把阿拉伯芥（Arabidopsis thaliana）中的 ELF3 蛋白質，換成來自短柄草（stiff brome）的一種相似蛋白質；短柄草是一種不會因溫度升高而提早開花的植物。在攝氏 22 度時，未經改造的阿拉伯芥與經改造的植株在開花時間上沒有差異；在攝氏 27 度時，未經改造的植株提早開花，但經改造的植株沒有，這顯示 ______", "opts": {"A": "temperature-sensitive accelerated flowering is unique to A. thaliana.", "B": "A. thaliana increases ELF3 production at higher temperatures.", "C": "ELF3 enables A. thaliana to respond to increased temperatures.", "D": "temperatures of at least 22 degrees Celsius are required for A. thaliana to flower."}, "optsZh": {"A": "受溫度影響而提早開花的現象是阿拉伯芥獨有的。", "B": "阿拉伯芥在較高溫度下會增加 ELF3 的產量。", "C": "ELF3 使阿拉伯芥能夠對溫度升高做出反應。", "D": "阿拉伯芥需要至少攝氏 22 度的溫度才能開花。"}, "answer": "C", "expl": "Without its own ELF3, A. thaliana no longer accelerated flowering at higher temperature, suggesting ELF3 enables its response to increased temperatures.", "explZh": "換掉自身的 ELF3 後，阿拉伯芥在高溫下不再提早開花，顯示 ELF3 使它能對溫度升高做出反應。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n某個地區的農民採用了一個遙遠原住民族所發明的種植技術，但紀錄顯示，這些農民中很少有人與該民族有直接接觸。如果這項技術並非獨立發明的，證據顯示 ______", "opts": {"A": "the Indigenous nation adopted the technique from those farmers.", "B": "the records prove that all farms used identical crops.", "C": "the technique could not have been useful in the region.", "D": "the farmers likely learned it through intermediaries who had more direct contact with the original practitioners."}, "optsZh": {"A": "這個原住民族是從那些農民那裡學到這項技術的。", "B": "這些紀錄證明所有農場都種植完全相同的作物。", "C": "這項技術在該地區不可能派上用場。", "D": "那些農民很可能是透過與最初使用者有更直接接觸的中間人學到這項技術的。"}, "answer": "D", "expl": "Indirect transmission best explains the evidence.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Artifacts at a coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Artifacts at a coastal settlement include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一處沿海聚落出土的文物中，包含了在該聚落建立前兩個世紀所製作的珠子。如果珠子的年代與聚落建立的年代都正確，那麼這些珠子很可能 ______", "opts": {"A": "show that dating methods are never useful.", "B": "were all produced by the settlement's first residents.", "C": "were made elsewhere and reached the settlement through trade, inheritance, or migration.", "D": "prove the settlement was founded two centuries earlier."}, "optsZh": {"A": "顯示定年方法從來都沒有用。", "B": "全都是由這個聚落最早的居民製作的。", "C": "是在別處製作，再透過貿易、繼承或遷徙傳到這個聚落的。", "D": "證明這個聚落早了兩個世紀建立。"}, "answer": "C", "expl": "Older objects can move before being deposited at a later site.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n研究人員將一種植物蛋白質替換成另一個物種的類似蛋白質，而該物種在氣溫上升時並不會改變開花時間。經過改造的植物在溫和氣溫下生長正常，但與未經改造的植物不同，它們在較溫暖的環境下無法提早開花。研究結果顯示 ______", "opts": {"A": "the original protein helps the plant respond to increased temperature.", "B": "temperature has no effect on the species.", "C": "the replacement protein improves warm-weather flowering.", "D": "all plants accelerate flowering at the same temperature."}, "optsZh": {"A": "原本的蛋白質幫助植物對溫度升高做出反應。", "B": "溫度對這個物種沒有影響。", "C": "替代的蛋白質能改善溫暖天氣下的開花情形。", "D": "所有植物都在相同的溫度下加速開花。"}, "answer": "A", "expl": "Only plants with the original protein showed the temperature response.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=broad\" target=\"_blank\" rel=\"noopener\" data-w=\"broad\" data-pos=\"adj.\" data-en=\"wide; including many different people or things\" data-zh=\"廣泛的；寬廣的\">broader<\/a> patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A study compares students&#x27; reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A study compares students' reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一項研究使用閱讀難度差異極大的謎題來比較學生的推理能力。由於有些學生拿到的是簡單的措辭，另一些學生拿到的則是艱深的技術性描述，研究結果 ______", "opts": {"A": "prove that all students have the same reasoning ability.", "B": "may reflect differences in reading load rather than differences in reasoning ability.", "C": "show that wording never affects performance.", "D": "can be generalized to every kind of test."}, "optsZh": {"A": "證明所有學生的推理能力都相同。", "B": "可能反映的是閱讀負擔的差異，而非推理能力的差異。", "C": "顯示措辭從不影響表現。", "D": "可以推廣到每一種測驗。"}, "answer": "B", "expl": "An uncontrolled task feature limits the conclusion.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一份手稿主要保存了遷徙之前的歌謠，但其中有幾行提到的地方，是這個群體在遷徙之後才接觸到的。因此，學者推斷 ______", "opts": {"A": "the scribes were unable to understand the songs.", "B": "the manuscript probably combines earlier material with later additions or revisions.", "C": "none of the songs can predate the migration.", "D": "the references to later places must be accidental."}, "optsZh": {"A": "抄寫員無法理解這些歌曲。", "B": "這份手稿很可能結合了較早的素材與後來的增補或修訂。", "C": "沒有任何一首歌可能早於這次遷徙。", "D": "提及後來地點的內容必定是出於偶然。"}, "answer": "B", "expl": "Mixed evidence supports mixed origins.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: finite verb in a relative clause.", "vocab": false, "body": "Mary Golda Ross was a Cherokee <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=aerospace\" target=\"_blank\" rel=\"noopener\" data-w=\"aerospace\" data-pos=\"adj.\" data-en=\"relating to the science and industry of flight in air and space\" data-zh=\"航太的\">aerospace<\/a> engineer who contributed to NASA&#x27;s Planetary Flight Handbook, which ______ detailed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematical\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematical\" data-pos=\"adj.\" data-en=\"relating to mathematics\" data-zh=\"數學的\">mathematical<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=guidance\" target=\"_blank\" rel=\"noopener\" data-w=\"guidance\" data-pos=\"n.\" data-en=\"advice or information that helps you do something\" data-zh=\"指引；指導\">guidance<\/a> for missions to Mars and Venus.", "bodyPlain": "Mary Golda Ross was a Cherokee aerospace engineer who contributed to NASA's Planetary Flight Handbook, which ______ detailed mathematical guidance for missions to Mars and Venus.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "Mary Golda Ross 是一位切羅基族的航太工程師，她參與撰寫了 NASA 的《行星飛行手冊》，這本手冊 ______ 前往火星和金星任務的詳細數學指引。", "opts": {"A": "provided", "B": "having provided", "C": "to provide", "D": "providing"}, "optsZh": {"A": "provided（一般過去式，作關係子句的主要動詞：正確）", "B": "having provided（分詞 → 關係子句缺少主要動詞：錯誤）", "C": "to provide（不定詞 → 關係子句缺少主要動詞：錯誤）", "D": "providing（分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The relative clause 'which ___' needs a finite verb; 'provided' supplies one.", "explZh": "關係子句「which ___」需要一個限定動詞，「provided」正好符合。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: finite verb in a relative clause.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "including", "B": "having included", "C": "includes", "D": "to include"}, "optsZh": {"A": "including（分詞 → 關係子句缺少主要動詞：錯誤）", "B": "having included（分詞 → 關係子句缺少主要動詞：錯誤）", "C": "includes（限定動詞，作關係子句的主要動詞：正確）", "D": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: finite verb in a relative clause.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices, but", "B": "prices but", "C": "prices,", "D": "prices"}, "optsZh": {"A": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "B": "prices but（but 前缺少逗號：錯誤）", "C": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prices（無標點 → 兩個獨立子句直接相連：錯誤）"}, "answer": "A", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: finite verb in a relative clause.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However", "B": "However;", "C": "however,", "D": "However,"}, "optsZh": {"A": "However（句首轉折詞後缺少逗號：錯誤）", "B": "However;（分號 → 標點錯誤）", "C": "however,（小寫 → 無法作為新句子的開頭：錯誤）", "D": "However,（句首轉折詞後加逗號：正確）"}, "answer": "D", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: finite verb in a relative clause.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever", "C": "; whenever", "D": "whenever,"}, "optsZh": {"A": ". Whenever（句號 → 造成句子片段：錯誤）", "B": "whenever（不加標點，直接接從屬子句：正確）", "C": "; whenever（分號後不是獨立子句：錯誤）", "D": "whenever,（whenever 後不應加逗號：錯誤）"}, "answer": "B", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: finite verb in a relative clause.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the
