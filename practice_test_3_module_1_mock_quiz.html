.", "en": "having many carefully arranged parts or details", "zh": "精心製作的；複雜精細的", "word": "elaborate"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: complexly connected in detailed ways.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Ecologists describe the forest floor as an ______ network of fungi, roots, insects, and decaying leaves, since each element affects nutrient movement in ways that are difficult to separate from the whole system.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Ecologists describe the forest floor as an ______ network of fungi, roots, insects, and decaying leaves, since each element affects nutrient movement in ways that are difficult to separate from the whole system.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n生態學家把森林地表描述為一個由真菌、根系、昆蟲和腐爛落葉構成的 ______ 網絡，因為每個元素影響養分流動的方式，都很難與整個系統分開來看。", "opts": {"A": "complex", "B": "isolated", "C": "decorative", "D": "obvious"}, "optsZh": {"A": "complex（複雜的）", "B": "isolated（孤立的、零星的）", "C": "decorative（裝飾性的）", "D": "obvious（明顯的）"}, "answer": "A", "expl": "Complex means made of many connected parts.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "made of many connected parts; difficult to understand", "zh": "複雜的；錯綜的", "word": "complex"}, "B": {"pos": "adj.", "en": "separate from others; happening only once", "zh": "孤立的；零星的", "word": "isolated"}, "C": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的；裝飾用的", "word": "decorative"}, "D": {"pos": "adj.", "en": "easy to see or understand", "zh": "明顯的", "word": "obvious"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: complexly connected in detailed ways.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The treaty&#x27;s language appears brief, yet its legal consequences are ______: a single clause affects fishing rights, border patrols, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> of three separate regional councils.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The treaty's language appears brief, yet its legal consequences are ______: a single clause affects fishing rights, border patrols, and the authority of three separate regional councils.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這項條約的文字看似簡短，但其法律後果卻是 ______ 的：單單一個條款就影響了捕魚權、邊境巡邏，以及三個不同地區議會的權限。", "opts": {"A": "optional", "B": "minor", "C": "multifaceted", "D": "plain"}, "optsZh": {"A": "optional（可選擇的、非必要的）", "B": "minor（次要的、不重要的）", "C": "multifaceted（多面向的）", "D": "plain（樸素的、明白的）"}, "answer": "C", "expl": "Multifaceted means having many connected aspects.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not required; available as a choice", "zh": "可選擇的；非必要的", "word": "optional"}, "B": {"pos": "adj.", "en": "small or not very important", "zh": "次要的；較小的；不重要的", "word": "minor"}, "C": {"pos": "adj.", "en": "having many different parts or aspects", "zh": "多面向的", "word": "multifaceted"}, "D": {"pos": "adj.", "en": "simple, not decorated; easy to understand", "zh": "樸素的；明白的", "word": "plain"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: complexly connected in detailed ways.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Archaeologists now think the settlement was organized through an ______ web of kinship, trade, and ritual obligations rather than through a single central authority that issued commands to all households.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Archaeologists now think the settlement was organized through an ______ web of kinship, trade, and ritual obligations rather than through a single central authority that issued commands to all households.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n考古學家現在認為，這個聚落是透過一個由親屬、貿易與儀式義務構成的 ______ 網絡來組織的，而不是由單一中央權威向所有家戶發號施令。", "opts": {"A": "transparent", "B": "infrequent", "C": "careless", "D": "interwoven"}, "optsZh": {"A": "transparent（透明的、易懂的）", "B": "infrequent（不常發生的、罕見的）", "C": "careless（粗心的）", "D": "interwoven（交織在一起的）"}, "answer": "D", "expl": "Interwoven means closely connected or combined.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to be seen through; easy to understand", "zh": "透明的；易懂的", "word": "transparent"}, "B": {"pos": "adj.", "en": "not happening often", "zh": "不常發生的；罕見的", "word": "infrequent"}, "C": {"pos": "adj.", "en": "not paying enough attention; causing mistakes", "zh": "粗心的；疏忽的", "word": "careless"}, "D": {"pos": "adj.", "en": "closely connected or mixed together", "zh": "交織在一起的", "word": "interwoven"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: follow or remain faithful to a practice.", "vocab": true, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artisan\" target=\"_blank\" rel=\"noopener\" data-w=\"artisan\" data-pos=\"n.\" data-en=\"a skilled worker who makes things by hand\" data-zh=\"工匠\">artisans<\/a> of the Igun Eronmwon guild in Benin City, Nigeria, typically ______ the bronze- and brass-casting techniques that have been passed down through their families since the thirteenth century, but they don&#x27;t strictly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observe\" target=\"_blank\" rel=\"noopener\" data-w=\"observe\" data-pos=\"v.\" data-en=\"to follow a rule or custom; to watch carefully\" data-zh=\"遵守；觀察\">observe<\/a> every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a>; for example, guild members now use air-conditioning motors instead of handheld <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bellows\" target=\"_blank\" rel=\"noopener\" data-w=\"bellows\" data-pos=\"n.\" data-en=\"a tool that blows air into a fire to make it hotter\" data-zh=\"風箱\">bellows<\/a> to help heat their forges.", "bodyPlain": "The artisans of the Igun Eronmwon guild in Benin City, Nigeria, typically ______ the bronze- and brass-casting techniques that have been passed down through their families since the thirteenth century, but they don't strictly observe every tradition; for example, guild members now use air-conditioning motors instead of handheld bellows to help heat their forges.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "奈及利亞貝南城 Igun Eronmwon 行會的工匠們，通常 ______ 自十三世紀以來在家族中代代相傳的青銅與黃銅鑄造技術，但他們並非嚴格遵守每一項傳統；例如，行會成員現在用冷氣馬達取代手持風箱來幫助加熱熔爐。", "opts": {"A": "experiment with", "B": "adhere to", "C": "improve on", "D": "grapple with"}, "optsZh": {"A": "experiment with（嘗試、實驗）", "B": "adhere to（堅守、遵循）", "C": "improve on（改進）", "D": "grapple with（努力應付、設法解決）"}, "answer": "B", "expl": "The artisans typically follow the inherited techniques 'but ... don't strictly observe every tradition,' so they usually 'adhere to' (follow) them.", "explZh": "工匠們通常遵循傳承的技術，「但並非嚴格遵守每一項傳統」，所以是「adhere to」（堅守、遵循）。", "defs": {"A": {"pos": "phr. v.", "en": "to try new ideas or methods to see what happens", "zh": "嘗試；實驗", "word": "experiment with"}, "B": {"pos": "phr. v.", "en": "to follow a rule, practice, or belief closely", "zh": "堅守；遵循", "word": "adhere to"}, "C": {"pos": "phr. v.", "en": "to do or make something better than before", "zh": "改進；勝過", "word": "improve on"}, "D": {"pos": "phr. v.", "en": "to try hard to deal with a difficult problem", "zh": "努力應付；設法解決", "word": "grapple with"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: follow or remain faithful to a practice.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The ceramicists usually ______ firing methods taught by previous generations, yet they are not opposed to every innovation; several now use digital thermometers to monitor kilns once judged only by color and experience.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The ceramicists usually ______ firing methods taught by previous generations, yet they are not opposed to every innovation; several now use digital thermometers to monitor kilns once judged only by color and experience.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這些陶藝家通常 ______ 前幾代人傳授的燒製方法，但他們並不反對所有創新；有幾位現在使用數位溫度計來監控窯溫，而這在過去只靠觀察顏色和經驗來判斷。", "opts": {"A": "argue with", "B": "adhere to", "C": "wander from", "D": "improve on"}, "optsZh": {"A": "argue with（與…爭論）", "B": "adhere to（堅守、遵循）", "C": "wander from（偏離）", "D": "improve on（改進）"}, "answer": "B", "expl": "Adhere to means follow or stay faithful to a practice.", "explZh": "", "defs": {"A": {"pos": "phr. v.", "en": "to disagree with someone in words", "zh": "與…爭論", "word": "argue with"}, "B": {"pos": "phr. v.", "en": "to follow a rule, practice, or belief closely", "zh": "堅守；遵循", "word": "adhere to"}, "C": {"pos": "phr. v.", "en": "to move away from a planned course", "zh": "偏離", "word": "wander from"}, "D": {"pos": "phr. v.", "en": "to do or make something better than before", "zh": "改進；勝過", "word": "improve on"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: follow or remain faithful to a practice.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Although the theater company experiments with lighting and music, it continues to ______ the older rule that major plot events should occur offstage and be reported through dialogue rather than shown directly.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Although the theater company experiments with lighting and music, it continues to ______ the older rule that major plot events should occur offstage and be reported through dialogue rather than shown directly.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n雖然這個劇團在燈光和音樂上勇於實驗，但它仍繼續 ______ 一項較古老的規則：重大情節應在台下發生，並透過對白轉述，而不是直接演出。", "opts": {"A": "misrepresent", "B": "deviate from", "C": "replace", "D": "observe"}, "optsZh": {"A": "misrepresent（歪曲、不實陳述）", "B": "deviate from（偏離）", "C": "replace（取代）", "D": "observe（遵守；觀察）"}, "answer": "D", "expl": "Observe means comply with or follow a rule or tradition.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to describe something falsely", "zh": "歪曲；不實陳述", "word": "misrepresent"}, "B": {"pos": "phr. v.", "en": "to move away from what is usual or expected", "zh": "偏離", "word": "deviate from"}, "C": {"pos": "v.", "en": "to take the place of something", "zh": "取代", "word": "replace"}, "D": {"pos": "v.", "en": "to follow a rule or custom; to watch carefully", "zh": "遵守；觀察", "word": "observe"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: follow or remain faithful to a practice.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The village council has modernized its recordkeeping, but it still ______ the custom of opening each public meeting with a reading of land-use agreements made by earlier community leaders.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The village council has modernized its recordkeeping, but it still ______ the custom of opening each public meeting with a reading of land-use agreements made by earlier community leaders.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n村議會已經將紀錄保存方式現代化，但它仍然 ______ 每次公開會議開始時朗讀前代社區領袖所訂土地使用協議的習俗。", "opts": {"A": "upholds", "B": "abandons", "C": "questions", "D": "revises"}, "optsZh": {"A": "upholds（維護、堅持）", "B": "abandons（放棄、拋棄）", "C": "questions（質疑）", "D": "revises（修改）"}, "answer": "A", "expl": "Upholds means maintains or supports a custom.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "supports or keeps a tradition, law, or principle", "zh": "維護；堅持", "word": "upholds"}, "B": {"pos": "v.", "en": "stops doing or using something completely", "zh": "放棄；拋棄", "word": "abandons"}, "C": {"pos": "v.", "en": "expresses doubt about something", "zh": "質疑", "word": "questions"}, "D": {"pos": "v.", "en": "changes something to improve or correct it", "zh": "修改；修訂", "word": "revises"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: follow or remain faithful to a practice.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The musicians <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporate<\/a> electric instruments in some performances, but they ______ the rhythmic structure of the older songs, preserving the pattern that listeners associate with ceremonial occasions.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The musicians incorporate electric instruments in some performances, but they ______ the rhythmic structure of the older songs, preserving the pattern that listeners associate with ceremonial occasions.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這些音樂家在某些演出中加入電子樂器，但他們 ______ 老歌的節奏結構，保留聽眾與儀式場合聯想在一起的節奏型態。", "opts": {"A": "dismiss", "B": "borrow", "C": "complicate", "D": "retain"}, "optsZh": {"A": "dismiss（不予理會、駁回）", "B": "borrow（借用）", "C": "complicate（使複雜化）", "D": "retain（保留、保持）"}, "answer": "D", "expl": "Retain means keep or continue to use something.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to decide that something is not worth considering", "zh": "不予理會；否定；駁回", "word": "dismiss"}, "B": {"pos": "v.", "en": "to take and use an idea or thing from another source", "zh": "借用；借鑑", "word": "borrow"}, "C": {"pos": "v.", "en": "to make something more difficult to understand or deal with", "zh": "使複雜化", "word": "complicate"}, "D": {"pos": "v.", "en": "to keep or continue to have something", "zh": "保留；保持", "word": "retain"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: follow or remain faithful to a practice.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> calligrapher may design posters and digital fonts, yet she continues to ______ the discipline&#x27;s traditional stroke order because she believes the sequence shapes the balance of each character.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A contemporary calligrapher may design posters and digital fonts, yet she continues to ______ the discipline's traditional stroke order because she believes the sequence shapes the balance of each character.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一位當代書法家也許會設計海報和數位字型，但她仍繼續 ______ 這門藝術傳統的筆順，因為她相信筆畫順序決定了每個字的平衡。", "opts": {"A": "experiment against", "B": "interfere with", "C": "comply with", "D": "speculate about"}, "optsZh": {"A": "experiment against（不自然的搭配：錯誤）", "B": "interfere with（干擾、妨礙）", "C": "comply with（遵守、依從）", "D": "speculate about（對…推測）"}, "answer": "C", "expl": "Comply with means act according to a rule or practice.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "(not a standard phrase) to test in opposition to something", "zh": "（非慣用搭配）", "word": "experiment against"}, "B": {"pos": "phr. v.", "en": "to prevent something from working or happening properly", "zh": "干擾；妨礙", "word": "interfere with"}, "C": {"pos": "phr. v.", "en": "to obey a rule or request", "zh": "遵守；依從", "word": "comply with"}, "D": {"pos": "phr. v.", "en": "to form guesses about something", "zh": "對…推測", "word": "speculate about"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Words in Context: inferred or supposed without complete proof.", "vocab": true, "body": "Some economic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> ______ that late nineteenth- and early twentieth-century <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">households<\/a> in the United States experienced an economy of scale when it came to food purchases-they assumed that large households spent less on food per person than did small households. Economist Trevon Logan showed, however, that a close look at the available data <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disprove\" target=\"_blank\" rel=\"noopener\" data-w=\"disprove\" data-pos=\"v.\" data-en=\"to show that something is false\" data-zh=\"證明…是錯的\">disproves<\/a> this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=supposition\" target=\"_blank\" rel=\"noopener\" data-w=\"supposition\" data-pos=\"n.\" data-en=\"an idea believed to be true without proof\" data-zh=\"假設；推測\">supposition<\/a>.", "bodyPlain": "Some economic historians ______ that late nineteenth- and early twentieth-century households in the United States experienced an economy of scale when it came to food purchases-they assumed that large households spent less on food per person than did small households. Economist Trevon Logan showed, however, that a close look at the available data disproves this supposition.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "有些經濟史學家 ______，十九世紀末和二十世紀初美國的家庭在購買食物時享有規模經濟——他們假定大家庭每人花在食物上的錢比小家庭少。然而，經濟學家 Trevon Logan 指出，仔細檢視現有資料就能證明這個假設是錯的。", "opts": {"A": "surmised", "B": "contrived", "C": "questioned", "D": "regretted"}, "optsZh": {"A": "surmised（推測、臆測）", "B": "contrived（策劃、捏造）", "C": "questioned（質疑）", "D": "regretted（後悔、遺憾）"}, "answer": "A", "expl": "The historians 'assumed' something that the data later disproved, so they 'surmised' it — inferred it without complete proof.", "explZh": "這些歷史學家「假定」了某件事，後來被資料推翻，所以是「surmised」（在缺乏充分證據下推測）。", "defs": {"A": {"pos": "v.", "en": "guessed or inferred without complete proof", "zh": "推測；臆測", "word": "surmised"}, "B": {"pos": "v.", "en": "arranged or invented something in a clever or artificial way", "zh": "策劃；捏造", "word": "contrived"}, "C": {"pos": "v.", "en": "expressed doubt about something", "zh": "質疑", "word": "questioned"}, "D": {"pos": "v.", "en": "felt sorry about something done", "zh": "後悔；遺憾", "word": "regretted"}}}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Words in Context: inferred or supposed without complete proof.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Earlier historians ______ that urban families saved money by buying coal in larger quantities, but newly examined household ledgers show that delivery fees and storage losses often eliminated the expected savings.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Earlier historians ______ that urban families saved money by buying coal in larger quantities, but newly examined household ledgers show that delivery fees and storage losses often eliminated the expected savings.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n早期的歷史學家 ______ 都市家庭藉由大量購買煤炭來省錢，但新檢視的家庭帳簿顯示，運費和儲存損耗常常抵銷了預期的節省。", "opts": {"A": "regretted", "B": "measured", "C": "surmised", "D": "concealed"}, "optsZh": {"A": "regretted（後悔、遺憾）", "B": "measured（測量）", "C": "surmised（推測、臆測）", "D": "concealed（隱藏的）"}, "answer": "C", "expl": "Surmised means inferred or supposed without complete evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "felt sorry about something done", "zh": "後悔；遺憾", "word": "regretted"}, "B": {"pos": "v.", "en": "found the size or amount of something", "zh": "測量", "word": "measured"}, "C": {"pos": "v.", "en": "guessed or inferred without complete proof", "zh": "推測；臆測", "word": "surmised"}, "D": {"pos": "adj.", "en": "hidden from view or kept secret", "zh": "隱藏的；隱蔽的", "word": "concealed"}}}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Words in Context: inferred or supposed without complete proof.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Because several murals were painted near the same market, scholars once ______ that they were produced by a single workshop; pigment analysis later revealed that at least four unrelated groups contributed to the paintings.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Because several murals were painted near the same market, scholars once ______ that they were produced by a single workshop; pigment analysis later revealed that at least four unrelated groups contributed to the paintings.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n由於好幾幅壁畫都畫在同一個市場附近，學者們曾經 ______ 它們出自同一個工坊；後來的顏料分析顯示，至少有四個互不相關的團體參與了這些畫作。", "opts": {"A": "denied", "B": "lamented", "C": "ensured", "D": "inferred"}, "optsZh": {"A": "denied（否認、拒絕承認）", "B": "lamented（哀嘆、惋惜）", "C": "ensured（確保）", "D": "inferred（推斷）"}, "answer": "D", "expl": "Inferred means concluded from evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "said that something is not true; refused to accept", "zh": "否認；拒絕承認", "word": "denied"}, "B": {"pos": "v.", "en": "expressed sadness or regret about something", "zh": "哀嘆；惋惜", "word": "lamented"}, "C": {"pos": "v.", "en": "made certain that something happened", "zh": "確保了", "word": "ensured"}, "D": {"pos": "v.", "en": "reached a conclusion from evidence and reasoning", "zh": "推斷", "word": "inferred"}}}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Words in Context: inferred or supposed without complete proof.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The research team initially ______ that the fish avoided bright reefs because predators were more visible there, but nighttime observations suggested that food <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=availability\" target=\"_blank\" rel=\"noopener\" data-w=\"availability\" data-pos=\"n.\" data-en=\"the state of being able to be obtained or used\" data-zh=\"可取得性；供應情況\">availability<\/a>, not predation risk, better explained the pattern.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The research team initially ______ that the fish avoided bright reefs because predators were more visible there, but nighttime observations suggested that food availability, not predation risk, better explained the pattern.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n研究團隊起初 ______ 這些魚會避開明亮的礁石，是因為那裡的掠食者更容易被看見，但夜間觀察顯示，較能解釋這種模式的是食物供應，而非被捕食的風險。", "opts": {"A": "resented", "B": "ignored", "C": "supposed", "D": "confirmed"}, "optsZh": {"A": "resented（怨恨、不滿）", "B": "ignored（忽視）", "C": "supposed（認為、假定）", "D": "confirmed（證實了）"}, "answer": "C", "expl": "Supposed means believed or assumed.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "felt angry about something unfair", "zh": "怨恨；不滿", "word": "resented"}, "B": {"pos": "v.", "en": "paid no attention to something", "zh": "忽視", "word": "ignored"}, "C": {"pos": "v.", "en": "thought that something was likely true", "zh": "認為；假定", "word": "supposed"}, "D": {"pos": "v.", "en": "showed that something is definitely true", "zh": "證實了；確認了", "word": "confirmed"}}}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Words in Context: inferred or supposed without complete proof.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Critics long ______ that the anonymous pamphlet was written by a political rival, but a comparison of spelling habits and paper sources now points to a printer who had no direct connection to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaign<\/a>.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Critics long ______ that the anonymous pamphlet was written by a political rival, but a comparison of spelling habits and paper sources now points to a printer who had no direct connection to the campaign.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n評論家長期 ______ 這本匿名小冊子是一位政敵所寫，但比較拼字習慣和紙張來源後，現在的線索指向一位與這場選戰毫無直接關聯的印刷商。", "opts": {"A": "presumed", "B": "implemented", "C": "contrived", "D": "questioned"}, "optsZh": {"A": "presumed（推定、假定）", "B": "implemented（實施、執行）", "C": "contrived（策劃、捏造）", "D": "questioned（質疑）"}, "answer": "A", "expl": "Presumed means assumed to be true.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "supposed something was true without proof", "zh": "推定；假定", "word": "presumed"}, "B": {"pos": "v.", "en": "put a law, plan, or policy into effect", "zh": "實施了；執行了", "word": "implemented"}, "C": {"pos": "v.", "en": "arranged or invented something in a clever or artificial way", "zh": "策劃；捏造", "word": "contrived"}, "D": {"pos": "v.", "en": "expressed doubt about something", "zh": "質疑", "word": "questioned"}}}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Words in Context: inferred or supposed without complete proof.", "vocab": true, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Before the excavation was complete, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> ______ that the building had served a religious purpose because of its unusual orientation; later finds of storage jars and account tablets complicated that early <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a>.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Before the excavation was complete, archaeologists ______ that the building had served a religious purpose because of its unusual orientation; later finds of storage jars and account tablets complicated that early interpretation.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在挖掘完成之前，考古學家因為這棟建築不尋常的朝向而 ______ 它曾有宗教用途；後來發現的儲物罐和帳目泥板使這個早期詮釋變得複雜。", "opts": {"A": "resolved", "B": "conjectured", "C": "prevented", "D": "imitated"}, "optsZh": {"A": "resolved（解決；決心）", "B": "conjectured（推測、臆測）", "C": "prevented（阻止）", "D": "imitated（模仿）"}, "answer": "B", "expl": "Conjectured means formed an opinion from incomplete information.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "solved a problem; decided firmly", "zh": "解決；決心", "word": "resolved"}, "B": {"pos": "v.", "en": "guessed or formed an opinion without complete evidence", "zh": "推測；臆測", "word": "conjectured"}, "C": {"pos": "v.", "en": "stopped something from happening", "zh": "阻止", "word": "prevented"}, "D": {"pos": "v.", "en": "copied someone's behavior or a thing's style", "zh": "模仿了", "word": "imitated"}}}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Words in Context: different in kind or not easily grouped together.", "vocab": true, "body": "The work of Kiowa painter T.C. Cannon derives its power in part from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tension\" target=\"_blank\" rel=\"noopener\" data-w=\"tension\" data-pos=\"n.\" data-en=\"a feeling of strain between different forces or ideas\" data-zh=\"張力；緊張關係\">tension<\/a> among his ______ influences: classic European <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portraiture\" target=\"_blank\" rel=\"noopener\" data-w=\"portraiture\" data-pos=\"n.\" data-en=\"the art of making portraits\" data-zh=\"肖像畫藝術\">portraiture<\/a>, with its realistic treatment of faces; the American pop art movement, with its vivid colors; and flatstyle, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intertribal\" target=\"_blank\" rel=\"noopener\" data-w=\"intertribal\" data-pos=\"adj.\" data-en=\"shared by or happening among different tribes\" data-zh=\"跨部落的\">intertribal<\/a> painting style that rejects the effect of depth typically achieved through shading and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspective<\/a>.", "bodyPlain": "The work of Kiowa painter T.C. Cannon derives its power in part from the tension among his ______ influences: classic European portraiture, with its realistic treatment of faces; the American pop art movement, with its vivid colors; and flatstyle, the intertribal painting style that rejects the effect of depth typically achieved through shading and perspective.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "Kiowa 族畫家 T.C. Cannon 的作品之所以有力量，部分來自他 ______ 的影響來源之間的張力：以寫實手法描繪臉孔的古典歐洲肖像畫；色彩鮮明的美國普普藝術運動；以及平面風格（flatstyle）——一種跨部落的繪畫風格，捨棄通常藉由明暗與透視所營造的深度效果。", "opts": {"A": "complementary", "B": "unknown", "C": "disparate", "D": "interchangeable"}, "optsZh": {"A": "complementary（互補的）", "B": "unknown（未知的）", "C": "disparate（迥然不同的、難以歸類在一起的）", "D": "interchangeable（可互換的）"}, "answer": "C", "expl": "The three influences — realistic European portraiture, vivid pop art, and depth-rejecting flatstyle — are very different, creating 'tension,' so they are 'disparate.'", "explZh": "三種影響（寫實的歐洲肖像、鮮豔的普普藝術、捨棄深度的平面風格）彼此迥異，因而產生「張力」，所以是「disparate」（迥然不同的）。", "defs": {"A": {"pos": "adj.", "en": "combining well so that each improves the other", "zh": "互補的", "word": "complementary"}, "B": {"pos": "adj.", "en": "not known or familiar", "zh": "未知的", "word": "unknown"}, "C": {"pos": "adj.", "en": "very different in kind and not easily compared or grouped together", "zh": "迥然不同的；難以歸類在一起的", "word": "disparate"}, "D": {"pos": "adj.", "en": "able to be exchanged for each other without difference", "zh": "可互換的", "word": "interchangeable"}}}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Words in Context: different in kind or not easily grouped together.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=choreographer\" target=\"_blank\" rel=\"noopener\" data-w=\"choreographer\" data-pos=\"n.\" data-en=\"a person who designs dance movements\" data-zh=\"編舞家\">choreographer<\/a>&#x27;s new work draws from ______ sources: court dances recorded in Renaissance manuals, street styles developed in the 1980s, and slow gestures borrowed from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> performance art.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The choreographer's new work draws from ______ sources: court dances recorded in Renaissance manuals, street styles developed in the 1980s, and slow gestures borrowed from contemporary performance art.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這位編舞家的新作取材自 ______ 的來源：文藝復興時期手冊中記載的宮廷舞蹈、1980 年代發展出的街舞風格，以及借自當代行為藝術的緩慢姿態。", "opts": {"A": "disparate", "B": "predictable", "C": "identical", "D": "interchangeable"}, "optsZh": {"A": "disparate（迥然不同的、難以歸類在一起的）", "B": "predictable（可預測的）", "C": "identical（完全相同的）", "D": "interchangeable（可互換的）"}, "answer": "A", "expl": "Disparate means very different in kind.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "very different in kind and not easily compared or grouped together", "zh": "迥然不同的；難以歸類在一起的", "word": "disparate"}, "B": {"pos": "adj.", "en": "happening in a way that can be expected", "zh": "可預測的；意料之中的", "word": "predictable"}, "C": {"pos": "adj.", "en": "exactly the same", "zh": "完全相同的", "word": "identical"}, "D": {"pos": "adj.", "en": "able to be exchanged for each other without difference", "zh": "可互換的", "word": "interchangeable"}}}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Words in Context: different in kind or not easily grouped together.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The museum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> deliberately places ______ objects beside one another, inviting visitors to compare a handmade fishing net, an industrial steel tool, and a ceremonial garment rather than treating them as parts of one obvious category.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The museum exhibition deliberately places ______ objects beside one another, inviting visitors to compare a handmade fishing net, an industrial steel tool, and a ceremonial garment rather than treating them as parts of one obvious category.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這場博物館展覽刻意把 ______ 物件並排陳列，邀請參觀者比較一張手工漁網、一件工業鋼製工具和一件儀式服裝，而不是把它們當作同一個明顯類別的一部分。", "opts": {"A": "varied", "B": "minor", "C": "redundant", "D": "unknown"}, "optsZh": {"A": "varied（多樣的）", "B": "minor（次要的、不重要的）", "C": "redundant（多餘的、冗贅的）", "D": "unknown（未知的）"}, "answer": "A", "expl": "Varied means diverse or of different kinds.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "including many different types", "zh": "各式各樣的；多變的", "word": "varied"}, "B": {"pos": "adj.", "en": "small or not very important", "zh": "次要的；較小的；不重要的", "word": "minor"}, "C": {"pos": "adj.", "en": "not needed because something else already does the job", "zh": "多餘的；冗贅的", "word": "redundant"}, "D": {"pos": "adj.", "en": "not known or familiar", "zh": "未知的", "word": "unknown"}}}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Words in Context: different in kind or not easily grouped together.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The scholar&#x27;s archive is valuable because it contains ______ materials, including personal letters, ship manifests, oral histories, and botanical drawings that rarely appear together in a single collection.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The scholar's archive is valuable because it contains ______ materials, including personal letters, ship manifests, oral histories, and botanical drawings that rarely appear together in a single collection.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這位學者的檔案很有價值，因為其中包含 ______ 的資料，包括私人信件、船舶貨單、口述歷史和植物素描，這些很少同時出現在單一收藏中。", "opts": {"A": "uniform", "B": "compatible", "C": "heterogeneous", "D": "temporary"}, "optsZh": {"A": "uniform（一致的、統一的）", "B": "compatible（相容的、協調的）", "C": "heterogeneous（異質的、由不同成分組成的）", "D": "temporary（暫時的）"}, "answer": "C", "expl": "Heterogeneous means made up of different kinds.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "the same in all parts or cases", "zh": "一致的；統一的", "word": "uniform"}, "B": {"pos": "adj.", "en": "able to exist or work together without problems", "zh": "相容的；協調的", "word": "compatible"}, "C": {"pos": "adj.", "en": "made up of parts or members that are very different from one another", "zh": "異質的；由不同成分組成的", "word": "heterogeneous"}, "D": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}}}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Words in Context: different in kind or not easily grouped together.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Rather than presenting a single tradition, the festival highlights ______ influences: Andean flute music, West African percussion, French-language poetry, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> electronic sound design.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Rather than presenting a single tradition, the festival highlights ______ influences: Andean flute music, West African percussion, French-language poetry, and experimental electronic sound design.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這個節慶並不只呈現單一傳統，而是突顯 ______ 的影響：安地斯笛樂、西非打擊樂、法語詩歌，以及實驗性的電子音效設計。", "opts": {"A": "hidden", "B": "diverse", "C": "parallel", "D": "minor"}, "optsZh": {"A": "hidden（隱藏的）", "B": "diverse（多樣的、各式各樣的）", "C": "parallel（平行的、相似的）", "D": "minor（次要的、不重要的）"}, "answer": "B", "expl": "Diverse means showing variety or difference.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "kept out of sight; not easily seen", "zh": "隱藏的；隱蔽的", "word": "hidden"}, "B": {"pos": "adj.", "en": "including many different types of people or things", "zh": "多樣的；各式各樣的", "word": "diverse"}, "C": {"pos": "adj.", "en": "similar and happening at the same time", "zh": "平行的；相似的", "word": "parallel"}, "D": {"pos": "adj.", "en": "small or not very important", "zh": "次要的；較小的；不重要的", "word": "minor"}}}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Words in Context: different in kind or not easily grouped together.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The architect&#x27;s design combines ______ elements-austere concrete walls, a garden based on classical Persian layouts, and brightly colored glass panels associated with modern public art.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The architect's design combines ______ elements-austere concrete walls, a garden based on classical Persian layouts, and brightly colored glass panels associated with modern public art.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這位建築師的設計結合了 ______ 的元素——樸素的混凝土牆、以古典波斯布局為本的花園，以及與現代公共藝術相關的色彩鮮豔的玻璃板。", "opts": {"A": "unchanging", "B": "ordinary", "C": "indistinguishable", "D": "contrasting"}, "optsZh": {"A": "unchanging（不變的）", "B": "ordinary（普通的）", "C": "indistinguishable（無法區分的）", "D": "contrasting（對比鮮明的、不同的）"}, "answer": "D", "expl": "Contrasting means noticeably different.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "staying the same", "zh": "不變的", "word": "unchanging"}, "B": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "C": {"pos": "adj.", "en": "so similar that differences cannot be seen", "zh": "無法區分的", "word": "indistinguishable"}, "D": {"pos": "adj.", "en": "very different from one another", "zh": "對比鮮明的；截然不同的", "word": "contrasting"}}}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Words in Context: shortage or scarcity.", "vocab": true, "body": "New and interesting research conducted by Suleiman A. Al-Sweedan and Moath Alhaj is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> by their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a> that though there have been many studies of the effect of high <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=altitude\" target=\"_blank\" rel=\"noopener\" data-w=\"altitude\" data-pos=\"n.\" data-en=\"height above sea level\" data-zh=\"海拔；高度\">altitude<\/a> on blood <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemistry\" target=\"_blank\" rel=\"noopener\" data-w=\"chemistry\" data-pos=\"n.\" data-en=\"the chemical makeup of a substance\" data-zh=\"化學組成；化學\">chemistry<\/a>, there is a ______ studies of the effect on blood chemistry of living in locations below sea level, such as the California towns of Salton City and Seeley.", "bodyPlain": "New and interesting research conducted by Suleiman A. Al-Sweedan and Moath Alhaj is inspired by their observation that though there have been many studies of the effect of high altitude on blood chemistry, there is a ______ studies of the effect on blood chemistry of living in locations below sea level, such as the California towns of Salton City and Seeley.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "由 Suleiman A. Al-Sweedan 與 Moath Alhaj 進行的一項新穎有趣的研究，啟發自他們的觀察：雖然已有許多研究探討高海拔對血液化學的影響，但探討居住在海平面以下地點（例如加州的 Salton City 和 Seeley 等城鎮）對血液化學影響的研究卻 ______。", "opts": {"A": "quarrel about", "B": "paucity of", "C": "profusion of", "D": "verisimilitude in"}, "optsZh": {"A": "quarrel about（關於…的爭吵）", "B": "paucity of（…的缺乏、稀少）", "C": "profusion of（大量的…）", "D": "verisimilitude in（…的逼真性）"}, "answer": "B", "expl": "Many studies exist on high altitude, but 'though' signals a contrast: there are very few studies on living below sea level — a 'paucity of' (shortage of) studies.", "explZh": "雖然有很多高海拔的研究，「though」表示對比：關於住在海平面以下的研究很少，也就是「paucity of」（缺乏）研究。", "defs": {"A": {"pos": "n. phr.", "en": "an angry argument about something", "zh": "關於…的爭吵", "word": "quarrel about"}, "B": {"pos": "n. phr.", "en": "a very small amount; a shortage of something", "zh": "…的缺乏；稀少", "word": "paucity of"}, "C": {"pos": "n. phr.", "en": "a very large amount of something", "zh": "大量的…", "word": "profusion of"}, "D": {"pos": "n. phr.", "en": "the quality of seeming real or true", "zh": "…的逼真性", "word": "verisimilitude in"}}}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Words in Context: shortage or scarcity.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Although hundreds of studies examine how urban heat affects daytime energy use, the researchers noted a ______ comparable studies of nighttime cooling patterns, especially in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> without extensive tree cover.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Although hundreds of studies examine how urban heat affects daytime energy use, the researchers noted a ______ comparable studies of nighttime cooling patterns, especially in neighborhoods without extensive tree cover.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n雖然有數百項研究探討都市高溫如何影響白天的能源使用，研究人員指出，關於夜間降溫模式的同類研究卻 ______，尤其是在缺乏大量樹木覆蓋的社區。", "opts": {"A": "surplus of", "B": "paucity of", "C": "similarity among", "D": "debate over"}, "optsZh": {"A": "surplus of（過剩的…）", "B": "paucity of（…的缺乏、稀少）", "C": "similarity among（…之間的相似處）", "D": "debate over（關於…的爭論）"}, "answer": "B", "expl": "Paucity of means a shortage or scarcity.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "more than is needed", "zh": "過剩的…", "word": "surplus of"}, "B": {"pos": "n. phr.", "en": "a very small amount; a shortage of something", "zh": "…的缺乏；稀少", "word": "paucity of"}, "C": {"pos": "n. phr.", "en": "the ways in which things are alike", "zh": "…之間的相似處", "word": "similarity among"}, "D": {"pos": "n. phr.", "en": "a discussion in which people disagree about something", "zh": "關於…的爭論", "word": "debate over"}}}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Words in Context: shortage or scarcity.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The review article emphasizes that scholars have produced abundant research on major port cities but only a ______ research on smaller inland trading towns, even though those towns shaped regional exchange in important ways.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of e
