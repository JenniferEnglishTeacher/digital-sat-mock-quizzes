ruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "whenever,", "B": ". Whenever", "C": "; whenever", "D": "whenever"}, "optsZh": {"A": "whenever,（whenever 後不應加逗號：錯誤）", "B": ". Whenever（句號 → 造成句子片段：錯誤）", "C": "; whenever（分號後不是獨立子句：錯誤）", "D": "whenever（不加標點，直接接從屬子句：正確）"}, "answer": "D", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: punctuation with however between two independent clauses.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "have expanded", "B": "has expanded", "C": "are expanding", "D": "expand"}, "optsZh": {"A": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）", "B": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）", "C": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "D": "expand（擴大）"}, "answer": "B", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: punctuation with an appositive phrase.", "vocab": false, "body": "Artist Bisa Butler&#x27;s large <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portrait\" target=\"_blank\" rel=\"noopener\" data-w=\"portrait\" data-pos=\"n.\" data-en=\"a painting, drawing, or photograph of a person\" data-zh=\"肖像；畫像\">portraits<\/a> at first appear to be paintings, but on closer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspection\" target=\"_blank\" rel=\"noopener\" data-w=\"inspection\" data-pos=\"n.\" data-en=\"a careful look at something\" data-zh=\"檢查；細看\">inspection<\/a> the portraits reveal themselves to be ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stitch\" target=\"_blank\" rel=\"noopener\" data-w=\"stitch\" data-pos=\"v.\" data-en=\"to sew\" data-zh=\"縫；縫合\">stitching<\/a> barely visible among thousands of pieces of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fabric\" target=\"_blank\" rel=\"noopener\" data-w=\"fabric\" data-pos=\"n.\" data-en=\"cloth\" data-zh=\"布料；織物\">fabric<\/a>.", "bodyPlain": "Artist Bisa Butler's large portraits at first appear to be paintings, but on closer inspection the portraits reveal themselves to be ______ stitching barely visible among thousands of pieces of fabric.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "藝術家 Bisa Butler 的大型肖像乍看像是畫作，但仔細一看，這些肖像原來是 ______ 縫線在成千上萬塊布料之間幾乎看不見。", "opts": {"A": "quilts, and the", "B": "quilts, the", "C": "quilts; the", "D": "quilts. The"}, "optsZh": {"A": "quilts, and the（and 連接後缺少動詞，不是完整子句：錯誤）", "B": "quilts, the（逗號引出補充說明的獨立片語：正確）", "C": "quilts; the（分號後不是獨立子句：錯誤）", "D": "quilts. The（句號 → 後面形成沒有主要動詞的句子片段：錯誤）"}, "answer": "B", "expl": "After 'quilts,' a comma introduces the absolute phrase 'the stitching barely visible ...,' which has no main verb and cannot stand alone.", "explZh": "quilts 後用逗號引出獨立片語「the stitching barely visible …」，這個片語沒有主要動詞，不能自成一句。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: punctuation with an appositive phrase.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "including", "B": "to include", "C": "includes", "D": "having included"}, "optsZh": {"A": "including（分詞 → 關係子句缺少主要動詞：錯誤）", "B": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "C": "includes（限定動詞，作關係子句的主要動詞：正確）", "D": "having included（分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: punctuation with an appositive phrase.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices but", "B": "prices,", "C": "prices, but", "D": "prices"}, "optsZh": {"A": "prices but（but 前缺少逗號：錯誤）", "B": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "D": "prices（無標點 → 兩個獨立子句直接相連：錯誤）"}, "answer": "C", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: punctuation with an appositive phrase.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However,", "B": "however,", "C": "However;", "D": "However"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "however,（小寫 → 無法作為新句子的開頭：錯誤）", "C": "However;（分號 → 標點錯誤）", "D": "However（句首轉折詞後缺少逗號：錯誤）"}, "answer": "A", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: punctuation with an appositive phrase.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "; whenever", "B": ". Whenever", "C": "whenever,", "D": "whenever"}, "optsZh": {"A": "; whenever（分號後不是獨立子句：錯誤）", "B": ". Whenever（句號 → 造成句子片段：錯誤）", "C": "whenever,（whenever 後不應加逗號：錯誤）", "D": "whenever（不加標點，直接接從屬子句：正確）"}, "answer": "D", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: punctuation with an appositive phrase.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "are expanding", "B": "has expanded", "C": "have expanded", "D": "expand"}, "optsZh": {"A": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "B": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）", "C": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）", "D": "expand（擴大）"}, "answer": "B", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: choose the best example transition.", "vocab": false, "body": "Most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conifer\" target=\"_blank\" rel=\"noopener\" data-w=\"conifer\" data-pos=\"n.\" data-en=\"a tree that produces cones and usually has needle-like leaves\" data-zh=\"針葉樹；毬果植物\">conifers<\/a> are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evergreen\" target=\"_blank\" rel=\"noopener\" data-w=\"evergreen\" data-pos=\"adj.\" data-en=\"having leaves all year round\" data-zh=\"常綠的\">evergreen<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=retain\" target=\"_blank\" rel=\"noopener\" data-w=\"retain\" data-pos=\"v.\" data-en=\"to keep or continue to have something\" data-zh=\"保留；保持\">retaining<\/a> their needles throughout the year. However, not all conifer species are evergreen. Larch trees, ______ lose their needles every fall.", "bodyPlain": "Most conifers are evergreen, retaining their needles throughout the year. However, not all conifer species are evergreen. Larch trees, ______ lose their needles every fall.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "大多數針葉樹是常綠的，一年四季都保有針葉。然而，並非所有針葉樹種都是常綠的。落葉松，______ 每年秋天都會掉落針葉。", "opts": {"A": "for instance,", "B": "nevertheless,", "C": "meanwhile,", "D": "in addition,"}, "optsZh": {"A": "for instance,（例如）", "B": "nevertheless,（儘管如此）", "C": "meanwhile,（與此同時）", "D": "in addition,（此外；表補充）"}, "answer": "A", "expl": "Larch trees are an example of conifers that are not evergreen, so 'for instance' fits.", "explZh": "落葉松是非常綠針葉樹的一個例子，所以用「for instance」。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: choose the best example transition.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "to include", "B": "having included", "C": "includes", "D": "including"}, "optsZh": {"A": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "B": "having included（分詞 → 關係子句缺少主要動詞：錯誤）", "C": "includes（限定動詞，作關係子句的主要動詞：正確）", "D": "including（分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: choose the best example transition.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices, but", "B": "prices but", "C": "prices", "D": "prices,"}, "optsZh": {"A": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "B": "prices but（but 前缺少逗號：錯誤）", "C": "prices（無標點 → 兩個獨立子句直接相連：錯誤）", "D": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "A", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: choose the best example transition.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However", "B": "However,", "C": "however,", "D": "However;"}, "optsZh": {"A": "However（句首轉折詞後缺少逗號：錯誤）", "B": "However,（句首轉折詞後加逗號：正確）", "C": "however,（小寫 → 無法作為新句子的開頭：錯誤）", "D": "However;（分號 → 標點錯誤）"}, "answer": "B", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: choose the best example transition.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever,", "C": "; whenever", "D": "whenever"}, "optsZh": {"A": ". Whenever（句號 → 造成句子片段：錯誤）", "B": "whenever,（whenever 後不應加逗號：錯誤）", "C": "; whenever（分號後不是獨立子句：錯誤）", "D": "whenever（不加標點，直接接從屬子句：正確）"}, "answer": "D", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transitions: choose the best example transition.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "expand", "B": "are expanding", "C": "have expanded", "D": "has expanded"}, "optsZh": {"A": "expand（擴大）", "B": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "C": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）", "D": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）"}, "answer": "D", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Rhetorical Synthesis: describe an object for an unfamiliar audience.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken notes about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=woodworker\" target=\"_blank\" rel=\"noopener\" data-w=\"woodworker\" data-pos=\"n.\" data-en=\"a person who makes things from wood\" data-zh=\"木工；木匠\">woodworker<\/a> Sam Maloof&#x27;s rocking chairs. The student wants to describe one of Maloof&#x27;s rocking chairs to an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> with Maloof.", "bodyPlain": "While researching a topic, a student has taken notes about woodworker Sam Maloof's rocking chairs. The student wants to describe one of Maloof's rocking chairs to an audience unfamiliar with Maloof.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一名學生在研究某個主題時，針對木工師傅 Sam Maloof 的搖椅做了筆記。這名學生想要向不熟悉 Maloof 的讀者描述他的一張搖椅。", "opts": {"A": "A Sam Maloof rocking chair has curved wooden rockers, sculpted armrests, and a seat shaped to fit the sitter.", "B": "Sam Maloof was born in California and became widely known for furniture design.", "C": "Some museums display Maloof's furniture as examples of American craft.", "D": "Maloof often made furniture by hand rather than relying only on machines."}, "optsZh": {"A": "Sam Maloof 的搖椅有彎曲的木製搖腳、雕塑般的扶手，以及貼合坐者身形的座椅。", "B": "Sam Maloof 生於加州，並以家具設計聞名。", "C": "有些博物館把 Maloof 的家具作為美國工藝的範例展出。", "D": "Maloof 常以手工製作家具，而不是只依賴機器。"}, "answer": "A", "expl": "Only this choice describes the chair itself (curved rockers, sculpted armrests, shaped seat) for readers who do not know Maloof.", "explZh": "只有這個選項為不認識 Maloof 的讀者描述椅子本身（彎曲搖腳、雕塑扶手、貼合身形的座椅）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Rhetorical Synthesis: describe an object for an unfamiliar audience.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A hand-built chair has a low curved back; its arms are carved from continuous pieces of walnut; the seat is shaped for comfort; the audience does not know the designer.<br><br>Goal: describe the chair to an unfamiliar audience.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A hand-built chair has a low curved back; its arms are carved from continuous pieces of walnut; the seat is shaped for comfort; the audience does not know the designer.\n\nGoal: describe the chair to an unfamiliar audience.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：一張手工打造的椅子有低矮的弧形椅背；扶手由整塊胡桃木雕成；座椅的形狀講求舒適；讀者不認識這位設計者。\n目標：向不熟悉的讀者描述這張椅子。", "opts": {"A": "Some museums collect handmade furniture.", "B": "The hand-built walnut chair has carved arms, a low curved back, and a seat shaped to support the sitter comfortably.", "C": "The designer became well known in American craft circles.", "D": "Walnut is one material used in furniture."}, "optsZh": {"A": "有些博物館收藏手工家具。", "B": "這張手工打造的胡桃木椅有雕刻的扶手、低矮的弧形椅背，以及能舒適支撐坐者的座椅。", "C": "這位設計者在美國工藝界頗負盛名。", "D": "胡桃木是製作家具的材料之一。"}, "answer": "B", "expl": "The choice describes the object itself for an unfamiliar audience.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Rhetorical Synthesis: describe an object for an unfamiliar audience.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A ceramic bowl has a matte black surface; thin silver lines circle the rim; the bowl is wider than it is tall; the audience has never seen the object.<br><br>Goal: describe the bowl to an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> audience.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A ceramic bowl has a matte black surface; thin silver lines circle the rim; the bowl is wider than it is tall; the audience has never seen the object.\n\nGoal: describe the bowl to an unfamiliar audience.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：一個陶碗有霧面的黑色表面；細細的銀線環繞碗緣；碗的寬度大於高度；讀者從未見過這件物品。\n目標：向不熟悉的讀者描述這個碗。", "opts": {"A": "The artist has worked with clay for many years.", "B": "Ceramic bowls have been made in many regions.", "C": "The bowl is a low, wide ceramic vessel with a matte black surface and thin silver lines around its rim.", "D": "Museums sometimes display bowls beside other vessels."}, "optsZh": {"A": "這位藝術家多年來一直從事陶土創作。", "B": "許多地區都製作過陶碗。", "C": "這個碗是一件低矮寬口的陶器，表面為霧面黑色，碗緣環繞著細細的銀線。", "D": "博物館有時會把碗和其他器皿並列展示。"}, "answer": "C", "expl": "The choice gives visible features of the object.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Rhetorical Synthesis: describe an object for an unfamiliar audience.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: A textile has bright red borders; the center contains repeated blue diamond shapes; it is made from wool; the audience does not know the textile.<br><br>Goal: describe the textile to an unfamiliar audience.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A textile has bright red borders; the center contains repeated blue diamond shapes; it is made from wool; the audience does not know the textile.\n\nGoal: describe the textile to an unfamiliar audience.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：一件織品有鮮紅色的邊框；中央有重複的藍色菱形圖案；以羊毛製成；讀者不認識這件織品。\n目標：向不熟悉的讀者描述這件織品。", "opts": {"A": "The wool textile has bright red borders surrounding a center filled with repeated blue diamond shapes.", "B": "The maker learned weaving from relatives.", "C": "Textiles can be made by hand or machine.", "D": "Wool is valued in many cold regions."}, "optsZh": {"A": "這件羊毛織品有鮮紅色的邊框，環繞著布滿重複藍色菱形圖案的中央。", "B": "這位製作者向親戚學習編織。", "C": "織品可以用手工或機器製作。", "D": "羊毛在許多寒冷地區很受重視。"}, "answer": "A", "expl": "The answer describes what the unfamiliar audience would see.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Rhetorical Synthesis: describe an object for an unfamiliar audience.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: A sculpture is made of polished bronze; it shows a dancer leaning forward; one arm forms an arc above the head; the audience is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> with the sculpture.<br><br>Goal: describe the sculpture to an unfamiliar audience.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: A sculpture is made of polished bronze; it shows a dancer leaning forward; one arm forms an arc above the head; the audience is unfamiliar with the sculpture.\n\nGoal: describe the sculpture to an unfamiliar audience.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：一座雕塑以拋光的青銅製成；它呈現一位身體前傾的舞者；一隻手臂在頭頂上方形成一道弧線；讀者不熟悉這座雕塑。\n目標：向不熟悉的讀者描述這座雕塑。", "opts": {"A": "Bronze sculptures can be heavy.", "B": "The sculpture is displayed in a public gallery.", "C": "The artist studied movement for several years.", "D": "The polished bronze sculpture depicts a dancer leaning forward with one arm arcing above the head."}, "optsZh": {"A": "青銅雕塑可能很重。", "B": "這座雕塑在一間公共藝廊展出。", "C": "這位藝術家研究動作好幾年了。", "D": "這座拋光青銅雕塑描繪一位身體前傾的舞者，一隻手臂在頭頂上方形成弧線。"}, "answer": "D", "expl": "The choice identifies material, subject, and form.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Rhetorical Synthesis: describe an object for an unfamiliar audience.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: A handmade lamp has a paper shade; pressed leaves are visible in the shade; the base is dark wood; the audience has not seen the lamp.<br><br>Goal: describe the lamp to an unfamiliar audience.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: A handmade lamp has a paper shade; pressed leaves are visible in the shade; the base is dark wood; the audience has not seen the lamp.\n\nGoal: describe the lamp to an unfamiliar audience.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：一盞手工燈有紙製燈罩；燈罩中可以看到壓花葉片；燈座是深色木頭；讀者沒有見過這盞燈。\n目標：向不熟悉的讀者描述這盞燈。", "opts": {"A": "The maker also designs furniture.", "B": "The handmade lamp combines a dark wooden base with a paper shade in which pressed leaves are visible.", "C": "Paper shades can be fragile.", "D": "Lamps are often used for reading."}, "optsZh": {"A": "這位製作者也設計家具。", "B": "這盞手工燈結合了深色木製燈座與可見壓花葉片的紙製燈罩。", "C": "紙製燈罩可能很脆弱。", "D": "燈常用於閱讀。"}, "answer": "B", "expl": "The choice describes the lamp's appearance.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Rhetorical Synthesis: explain a decline and specify its cause.", "vocab": false, "body": "While researching a topic, a student has taken notes about apple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=variety\" target=\"_blank\" rel=\"noopener\" data-w=\"variety\" data-pos=\"n.\" data-en=\"a type of plant within a species\" data-zh=\"品種；種類\">varieties<\/a>. The student wants to explain the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=decline\" target=\"_blank\" rel=\"noopener\" data-w=\"decline\" data-pos=\"n.\" data-en=\"a decrease in amount or quality\" data-zh=\"減少；衰退\">decline<\/a> in the number of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercially<\/a> grown apple varieties and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specify\" target=\"_blank\" rel=\"noopener\" data-w=\"specify\" data-pos=\"v.\" data-en=\"to state something clearly and exactly\" data-zh=\"具體指出；明確說明\">specify<\/a> why the decline occurred.", "bodyPlain": "While researching a topic, a student has taken notes about apple varieties. The student wants to explain the decline in the number of commercially grown apple varieties and specify why the decline occurred.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一名學生在研究某個主題時，針對蘋果品種做了筆記。這名學生想要說明商業種植的蘋果品種數量減少的情形，並具體指出減少的原因。", "opts": {"A": "Many apple varieties have distinctive flavors and textures.", "B": "Apple growers have cultivated thousands of varieties over time.", "C": "The number of commercially grown apple varieties declined as growers increasingly favored varieties that shipped well and looked uniform in stores.", "D": "Some older apple varieties are preserved in specialty orchards."}, "optsZh": {"A": "許多蘋果品種有獨特的風味和口感。", "B": "蘋果種植者長期以來培育了數千個品種。", "C": "隨著種植者越來越偏好耐運輸、在店中外觀一致的品種，商業種植的蘋果品種數量減少了。", "D": "有些較老的蘋果品種保存在專門果園中。"}, "answer": "C", "expl": "This choice states the decline in commercially grown varieties and gives its cause: growers favored varieties that shipped well and looked uniform.", "explZh": "這個選項說明商業種植品種數量的減少，並指出原因：種植者偏好耐運輸、外觀一致的品種。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Rhetorical Synthesis: explain a decline and specify its cause.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Thousands of fruit varieties were once sold locally; commercial growers later favored fruit that looked uniform and tolerated long shipping; many older varieties became rare.<br><br>Goal: explain the decline and specify its cause.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Thousands of fruit varieties were once sold locally; commercial growers later favored fruit that looked uniform and tolerated long shipping; many older varieties became rare.\n\nGoal: explain the decline and specify its cause.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：過去曾有數千種水果品種在當地販售；商業種植者後來偏好外觀一致、耐得住長途運輸的水果；許多較老的品種變得稀少。\n目標：說明數量的減少並具體指出其原因。", "opts": {"A": "Older fruit varieties sometimes have unusual flavors.", "B": "The number of commercially grown fruit varieties declined because growers increasingly favored uniform varieties that could withstand long-distance shipping.", "C": "Some local growers preserve rare varieties.", "D": "Commercial orchards can contain many trees."}, "optsZh": {"A": "較老的水果品種有時有不尋常的風味。", "B": "由於種植者越來越偏好能承受長途運輸、外觀一致的品種，商業種植的水果品種數量減少了。", "C": "有些在地種植者保存稀有品種。", "D": "商業果園可能有許多樹。"}, "answer": "B", "expl": "The answer gives both the decline and the cause.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Rhetorical Synthesis: explain a decline and specify its cause.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Several regional rice types were once cultivated; supermarkets preferred grains that cooked consistently and packaged easily; farmers shifted toward those varieties.<br><br>Goal: explain the decline and specify its cause.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Several regional rice types were once cultivated; supermarkets preferred grains that cooked consistently and packaged easily; farmers shifted toward those varieties.\n\nGoal: explain the decline and specify its cause.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：過去曾種植好幾種地區性的稻米品種；超市偏好煮起來品質一致、容易包裝的穀物；農民轉而種植那些品種。\n目標：說明數量的減少並具體指出其原因。", "opts": {"A": "Some regional rice varieties remain in seed banks.", "B": "Supermarkets sell many grain products.", "C": "Rice can be grown in many climates.", "D": "Regional rice varieties declined as farmers shifted toward types preferred by supermarkets for consistent cooking and easy packaging."}, "optsZh": {"A": "有些地區性稻米品種仍保存在種子庫中。", "B": "超市販售許多穀物產品。", "C": "稻米可以在許多氣候中種植。", "D": "隨著農民轉而種植超市偏好的、煮起來品質一致且容易包裝的品種，地區性稻米品種逐漸減少。"}, "answer": "D", "expl": "The answer connects the decline to market preference.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Rhetorical Synthesis: explain a decline and specify its cause.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: Many local tomato varieties existed; large distributors wanted tomatoes with thick skins and uniform color; growers planted fewer delicate varieties.<br><br>Goal: explain the decline and specify its cause.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Many local tomato varieties existed; large distributors wanted tomatoes with thick skins and uniform color; growers planted fewer delicate varieties.\n\nGoal: explain the decline and specify its cause.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：過去有許多地方番茄品種；大型經銷商想要皮厚、顏色一致的番茄；種植者減少種植較嬌嫩的品種。\n目標：說明數量的減少並具體指出其原因。", "opts": {"A": "Some gardeners grow heirloom tomatoes.", "B": "Distributors transport produce to stores.", "C": "Tomatoes vary in color and flavor.", "D": "Local tomato varieties became less common because large distributors favored uniform, thick-skinned tomatoes that traveled well."}, "optsZh": {"A": "有些園丁種植傳家番茄品種。", "B": "經銷商把農產品運送到商店。", "C": "番茄的顏色和風味各不相同。", "D": "由於大型經銷商偏好外觀一致、皮厚且耐運輸的番茄，地方番茄品種變得越來越少見。"}, "answer": "D", "expl": "The cause of the decline is clearly specified.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Rhetorical Synthesis: explain a decline and specify its cause.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Older wheat varieties were adapted to local soils; industrial mills preferred wheat with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predictable\" target=\"_blank\" rel=\"noopener\" data-w=\"predictable\" data-pos=\"adj.\" data-en=\"happening in a way that can be expected\" data-zh=\"可預測的；意料之中的\">predictable<\/a> protein levels; farmers increasingly planted mill-preferred varieties.<br><br>Goal: explain the decline and specify its cause.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Older wheat varieties were adapted to local soils; industrial mills preferred wheat with predictable protein levels; farmers increasingly planted mill-preferred varieties.\n\nGoal: explain the decline and specify its cause.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：較老的小麥品種適應當地土壤；工業磨坊偏好蛋白質含量可預測的小麥；農民越來越多種植磨坊偏好的品種。\n目標：說明數量的減少並具體指出其原因。", "opts": {"A": "Older wheat varieties declined as farmers adopted varieties with predictable protein levels preferred by industrial mills.", "B": "Local soils can affect crop yields.", "C": "Wheat has been cultivated for thousands of years.", "D": "Mills turn grain into flour."}, "optsZh": {"A": "隨著農民改種工業磨坊偏好的、蛋白質含量可預測的品種，較老的小麥品種逐漸減少。", "B": "當地土壤可能影響作物產量。", "C": "小麥已被栽種了數千年。", "D": "磨坊把穀物磨成麵粉。"}, "answer": "A", "expl": "The answer explains both what happened and why.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Rhetorical Synthesis: explain a decline and specify its cause.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Many bean varieties were once grown in mountain villages; export buyers wanted beans of a single size and color; farmers reduced the number of varieties they planted.<br><br>Goal: explain the decline and specify its cause.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Many bean varieties were once grown in mountain villages; export buyers wanted beans of a single size and color; farmers reduced the number of varieties they planted.\n\nGoal: explain the decline and specify its cause.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：山村過去曾種植許多豆類品種；出口買家想要大小與顏色單一的豆子；農民減少了他們種植的品種數量。\n目標：說明數量的減少並具體指出其原因。", "opts": {"A": "Some buyers purchase crops for export.", "B": "Beans are a source of protein.", "C": "The number of bean varieties planted in mountain villages declined because export buyers preferred beans of a single size and color.", "D": "Mountain villages often have small farms."}, "optsZh": {"A": "有些買家購買作物用於出口。", "B": "豆類是蛋白質的來源。", "C": "由於出口買家偏好大小與顏色單一的豆子，山村種植的豆類品種數量減少了。", "D": "山村通常有小型農場。"}, "answer": "C", "expl": "The answer states the decline and its commercial cause.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Rhetorical Synthesis: introduce an artist's poetry collection.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken notes about artist and poet Cecilia Vicuna. The student wants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduce<\/a> Vicuna&#x27;s 1983 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=poetry\" target=\"_blank\" rel=\"noopener\" data-w=\"poetry\" data-pos=\"n.\" data-en=\"poems in general\" data-zh=\"詩\">poetry<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a>.", "bodyPlain": "While researching a topic, a student has taken notes about artist and poet Cecilia Vicuna. The student wants to introduce Vicuna's 1983 poetry collection.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一名學生在研究某個主題時，針對藝術家兼詩人 Cecilia Vicuna 做了筆記。這名學生想要介紹 Vicuna 1983 年的詩集。", "opts": {"A": "Cecilia Vicuna works across poetry, performance, and visual art.", "B": "Some of Vicuna's projects respond to political violence and ecological loss.", "C": "Vicuna's 1983 collection Precario/Precarious contains poems that connect fragile handmade objects with broader social and environmental concerns.", "D": "Vicuna has exhibited her visual artwork in museums around the world."}, "optsZh": {"A": "Cecilia Vicuna 的創作橫跨詩歌、行為藝術與視覺藝術。", "B": "Vicuna 的一些作品回應政治暴力與生態流失。", "C": "Vicuna 1983 年的詩集《Precario/Precarious》收錄的詩作，將脆弱的手工物品與更廣泛的社會與環境議題連結起來。", "D": "Vicuna 曾在世界各地的博物館展出她的視覺藝術作品。"}, "answer": "C", "expl": "Only this choice names the 1983 collection (Precario/Precarious) and says what its poems are about, introducing it.", "explZh": "只有這個選項提到 1983 年詩集的名稱《Precario/Precarious》並說明詩作內容，達到介紹的目的。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Rhetorical Synthesis: introduce an artist's poetry collection.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A 1983 poetry collection combines short poems with references to fragile handmade objects; the poet also works in performance and visual art; the audience is unfamiliar with the collection.<br><br>Goal: introduce the poetry collection.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A 1983 poetry collection combines short poems with references to fragile handmade objects; the poet also works in performance and visual art; the audience is unfamiliar with the collection.\n\nGoal: introduce the poetry collection.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh":
