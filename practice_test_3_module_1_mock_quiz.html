conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "has expanded", "B": "are expanding", "C": "expand", "D": "have expanded"}, "optsZh": {"A": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）", "B": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "C": "expand（擴大）", "D": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）"}, "answer": "A", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: punctuation joining independent clauses with but.", "vocab": false, "body": "Typically, underlines, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scribble\" target=\"_blank\" rel=\"noopener\" data-w=\"scribble\" data-pos=\"n.\" data-en=\"careless or untidy writing or drawing\" data-zh=\"塗鴉；潦草的字\">scribbles<\/a>, and notes left in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=margin\" target=\"_blank\" rel=\"noopener\" data-w=\"margin\" data-pos=\"n.\" data-en=\"the empty space at the edge of a page\" data-zh=\"頁緣；邊緣空白\">margins<\/a> by a former owner lower a book&#x27;s ______ when the former owner is a famous poet like Walt Whitman, such markings, known as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=marginalia\" target=\"_blank\" rel=\"noopener\" data-w=\"marginalia\" data-pos=\"n.\" data-en=\"notes written in the margins of a book\" data-zh=\"頁緣註記\">marginalia<\/a>, can be a gold mine to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> scholars.", "bodyPlain": "Typically, underlines, scribbles, and notes left in the margins by a former owner lower a book's ______ when the former owner is a famous poet like Walt Whitman, such markings, known as marginalia, can be a gold mine to literary scholars.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "通常，前任書主在頁緣留下的畫線、塗鴉和筆記會降低一本書的 ______ 當前任書主是像 Walt Whitman 這樣的著名詩人時，這些被稱為「頁緣註記」（marginalia）的痕跡，對文學學者來說可能是一座金礦。", "opts": {"A": "value, but", "B": "value", "C": "value,", "D": "value but"}, "optsZh": {"A": "value, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "B": "value（無標點 → 兩個獨立子句直接相連：錯誤）", "C": "value,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "value but（but 前缺少逗號：錯誤）"}, "answer": "A", "expl": "Two independent clauses ('... lower a book's value' and 'such markings ... can be a gold mine') are joined with a comma plus 'but.'", "explZh": "兩個獨立子句（「…降低書的價值」與「這些痕跡…可能是金礦」）以逗號加 but 連接。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: punctuation joining independent clauses with but.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "having included", "B": "includes", "C": "to include", "D": "including"}, "optsZh": {"A": "having included（分詞 → 關係子句缺少主要動詞：錯誤）", "B": "includes（限定動詞，作關係子句的主要動詞：正確）", "C": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "D": "including（分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English: punctuation joining independent clauses with but.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices", "B": "prices but", "C": "prices,", "D": "prices, but"}, "optsZh": {"A": "prices（無標點 → 兩個獨立子句直接相連：錯誤）", "B": "prices but（but 前缺少逗號：錯誤）", "C": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English: punctuation joining independent clauses with but.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "however,", "B": "However;", "C": "However", "D": "However,"}, "optsZh": {"A": "however,（小寫 → 無法作為新句子的開頭：錯誤）", "B": "However;（分號 → 標點錯誤）", "C": "However（句首轉折詞後缺少逗號：錯誤）", "D": "However,（句首轉折詞後加逗號：正確）"}, "answer": "D", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English: punctuation joining independent clauses with but.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "whenever", "B": "; whenever", "C": "whenever,", "D": ". Whenever"}, "optsZh": {"A": "whenever（不加標點，直接接從屬子句：正確）", "B": "; whenever（分號後不是獨立子句：錯誤）", "C": "whenever,（whenever 後不應加逗號：錯誤）", "D": ". Whenever（句號 → 造成句子片段：錯誤）"}, "answer": "A", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English: punctuation joining independent clauses with but.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "expand", "B": "are expanding", "C": "has expanded", "D": "have expanded"}, "optsZh": {"A": "expand（擴大）", "B": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "C": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）", "D": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）"}, "answer": "C", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "After the United Kingdom began <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=impose\" target=\"_blank\" rel=\"noopener\" data-w=\"impose\" data-pos=\"v.\" data-en=\"to officially force a rule or tax on people\" data-zh=\"強制實施；課徵\">imposing<\/a> taxes on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=single-use\" target=\"_blank\" rel=\"noopener\" data-w=\"single-use\" data-pos=\"adj.\" data-en=\"designed to be used only once\" data-zh=\"一次性的\">single-use<\/a> plastic grocery bags in 2011, plastic-bag <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumption\" target=\"_blank\" rel=\"noopener\" data-w=\"consumption\" data-pos=\"n.\" data-en=\"the amount of something that is used\" data-zh=\"使用量；消耗\">consumption<\/a> decreased by up to ninety ______ taxes are subject to a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rebound\" target=\"_blank\" rel=\"noopener\" data-w=\"rebound\" data-pos=\"n.\" data-en=\"a return to a higher level after a fall\" data-zh=\"反彈；回升\">rebound<\/a> effect, however: after several years, bag use may begin to rise again.", "bodyPlain": "After the United Kingdom began imposing taxes on single-use plastic grocery bags in 2011, plastic-bag consumption decreased by up to ninety ______ taxes are subject to a rebound effect, however: after several years, bag use may begin to rise again.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "英國自 2011 年開始對一次性塑膠購物袋課稅後，塑膠袋的使用量減少了多達百分之九十 ______ 不過，這類稅收會出現反彈效應：幾年之後，塑膠袋的使用量可能又開始上升。", "opts": {"A": "percent, such", "B": "percent and such", "C": "percent. Such", "D": "percent such"}, "optsZh": {"A": "percent, such（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "percent and such（缺少逗號；兩個獨立子句連接不當：錯誤）", "C": "percent. Such（句號分隔兩個獨立句子：正確）", "D": "percent such（無標點 → 連寫句錯誤）"}, "answer": "C", "expl": "'Plastic-bag consumption decreased by up to ninety percent' and 'Such taxes are subject to a rebound effect' are complete sentences, so a period separates them.", "explZh": "「塑膠袋使用量減少多達百分之九十」與「這類稅收會有反彈效應」都是完整句子，所以用句號分開。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "having included", "B": "including", "C": "includes", "D": "to include"}, "optsZh": {"A": "having included（分詞 → 關係子句缺少主要動詞：錯誤）", "B": "including（分詞 → 關係子句缺少主要動詞：錯誤）", "C": "includes（限定動詞，作關係子句的主要動詞：正確）", "D": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices,", "B": "prices", "C": "prices but", "D": "prices, but"}, "optsZh": {"A": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "prices（無標點 → 兩個獨立子句直接相連：錯誤）", "C": "prices but（but 前缺少逗號：錯誤）", "D": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However", "B": "However,", "C": "However;", "D": "however,"}, "optsZh": {"A": "However（句首轉折詞後缺少逗號：錯誤）", "B": "However,（句首轉折詞後加逗號：正確）", "C": "However;（分號 → 標點錯誤）", "D": "however,（小寫 → 無法作為新句子的開頭：錯誤）"}, "answer": "B", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever,", "C": "whenever", "D": "; whenever"}, "optsZh": {"A": ". Whenever（句號 → 造成句子片段：錯誤）", "B": "whenever,（whenever 後不應加逗號：錯誤）", "C": "whenever（不加標點，直接接從屬子句：正確）", "D": "; whenever（分號後不是獨立子句：錯誤）"}, "answer": "C", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "has expanded", "B": "expand", "C": "are expanding", "D": "have expanded"}, "optsZh": {"A": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）", "B": "expand（擴大）", "C": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "D": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）"}, "answer": "A", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English: punctuation before a dependent whenever-clause.", "vocab": false, "body": "A leap second is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=occasion\" target=\"_blank\" rel=\"noopener\" data-w=\"occasion\" data-pos=\"n.\" data-en=\"a special event or time\" data-zh=\"場合\">occasionally<\/a> added to Coordinated Universal Time because ______ time based on the planet&#x27;s rotation lags <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=slightly\" target=\"_blank\" rel=\"noopener\" data-w=\"slightly\" data-pos=\"adv.\" data-en=\"a little\" data-zh=\"稍微；略微\">slightly<\/a> behind time <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measured\" target=\"_blank\" rel=\"noopener\" data-w=\"measured\" data-pos=\"v.\" data-en=\"found the size or amount of something\" data-zh=\"測量\">measured<\/a> by atomic clocks.", "bodyPlain": "A leap second is occasionally added to Coordinated Universal Time because ______ time based on the planet's rotation lags slightly behind time measured by atomic clocks.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "協調世界時偶爾會被加入一秒閏秒，因為 ______ 依地球自轉計算的時間會稍稍落後於原子鐘所測量的時間。", "opts": {"A": "added, whenever", "B": "added; whenever", "C": "added. Whenever", "D": "added whenever"}, "optsZh": {"A": "added, whenever（because 子句中不需逗號隔開 whenever 子句：錯誤）", "B": "added; whenever（分號後不是獨立子句：錯誤）", "C": "added. Whenever（句號 → 造成句子片段：錯誤）", "D": "added whenever（不加標點，直接接 whenever 引導的從屬子句：正確）"}, "answer": "D", "expl": "The 'whenever' clause is essential to the 'because' clause and needs no punctuation before it.", "explZh": "whenever 子句是 because 子句中必要的一部分，前面不需要任何標點。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English: punctuation before a dependent whenever-clause.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "includes", "B": "having included", "C": "to include", "D": "including"}, "optsZh": {"A": "includes（限定動詞，作關係子句的主要動詞：正確）", "B": "having included（分詞 → 關係子句缺少主要動詞：錯誤）", "C": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "D": "including（分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English: punctuation before a dependent whenever-clause.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices,", "B": "prices but", "C": "prices, but", "D": "prices"}, "optsZh": {"A": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "prices but（but 前缺少逗號：錯誤）", "C": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "D": "prices（無標點 → 兩個獨立子句直接相連：錯誤）"}, "answer": "C", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English: punctuation before a dependent whenever-clause.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However,", "B": "However;", "C": "However", "D": "however,"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "However;（分號 → 標點錯誤）", "C": "However（句首轉折詞後缺少逗號：錯誤）", "D": "however,（小寫 → 無法作為新句子的開頭：錯誤）"}, "answer": "A", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English: punctuation before a dependent whenever-clause.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "; whenever", "B": "whenever,", "C": ". Whenever", "D": "whenever"}, "optsZh": {"A": "; whenever（分號後不是獨立子句：錯誤）", "B": "whenever,（whenever 後不應加逗號：錯誤）", "C": ". Whenever（句號 → 造成句子片段：錯誤）", "D": "whenever（不加標點，直接接從屬子句：正確）"}, "answer": "D", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English: punctuation before a dependent whenever-clause.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "have expanded", "B": "has expanded", "C": "are expanding", "D": "expand"}, "optsZh": {"A": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）", "B": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）", "C": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "D": "expand（擴大）"}, "answer": "B", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Standard English: subject-verb agreement with a singular title.", "vocab": false, "body": "Toru Dutt&#x27;s A Sheaf Gleaned in French Fields (1876), a volume of English <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translations<\/a> of French poems, ______ scholars&#x27; understanding of Dutt&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ambition\" target=\"_blank\" rel=\"noopener\" data-w=\"ambition\" data-pos=\"n.\" data-en=\"a strong desire to achieve something\" data-zh=\"抱負；雄心\">ambitions<\/a>.", "bodyPlain": "Toru Dutt's A Sheaf Gleaned in French Fields (1876), a volume of English translations of French poems, ______ scholars' understanding of Dutt's literary ambitions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "Toru Dutt 的《A Sheaf Gleaned in French Fields》（1876），一本將法國詩作譯成英文的詩集，______ 學者對 Dutt 文學抱負的理解。", "opts": {"A": "has enhanced", "B": "are enhancing", "C": "have enhanced", "D": "enhance"}, "optsZh": {"A": "has enhanced（單數現在完成式，與單數主詞（書名）一致：正確）", "B": "are enhancing（複數動詞 → 與單數主詞（書名）不一致：錯誤）", "C": "have enhanced（複數動詞 → 與單數主詞不一致：錯誤）", "D": "enhance（提升、增強）"}, "answer": "A", "expl": "The subject is a single book title, so it takes the singular verb 'has enhanced.'", "explZh": "主詞是一本書的書名（單數），所以用單數動詞「has enhanced」。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Standard English: subject-verb agreement with a singular title.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "having included", "B": "includes", "C": "to include", "D": "including"}, "optsZh": {"A": "having included（分詞 → 關係子句缺少主要動詞：錯誤）", "B": "includes（限定動詞，作關係子句的主要動詞：正確）", "C": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "D": "including（分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Standard English: subject-verb agreement with a singular title.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices, but", "B": "prices", "C": "prices,", "D": "prices but"}, "optsZh": {"A": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "B": "prices（無標點 → 兩個獨立子句直接相連：錯誤）", "C": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prices but（but 前缺少逗號：錯誤）"}, "answer": "A", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Standard English: subject-verb agreement with a singular title.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However", "B": "however,", "C": "However;", "D": "However,"}, "optsZh": {"A": "However（句首轉折詞後缺少逗號：錯誤）", "B": "however,（小寫 → 無法作為新句子的開頭：錯誤）", "C": "However;（分號 → 標點錯誤）", "D": "However,（句首轉折詞後加逗號：正確）"}, "answer": "D", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Standard English: subject-verb agreement with a singular title.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever,", "C": "whenever", "D": "; whenever"}, "optsZh": {"A": ". Whenever（句號 → 造成句子片段：錯誤）", "B": "whenever,（whenever 後不應加逗號：錯誤）", "C": "whenever（不加標點，直接接從屬子句：正確）", "D": "; whenever（分號後不是獨立子句：錯誤）"}, "answer": "C", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: subject-verb agreement with a singular title.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "have expanded", "B": "expand", "C": "has expanded", "D": "are expanding"}, "optsZh": {"A": "have expanded（複數動詞 → 與單數主詞不一致：錯誤）", "B": "expand（擴大）", "C": "has expanded（單數現在完成式，與單數主詞（書名）一致：正確）", "D": "are expanding（複數動詞 → 與單數主詞（書名）不一致：錯誤）"}, "answer": "C", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: punctuation with however between two independent clauses.", "vocab": false, "body": "Gil Scott-Heron is often called the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=godfather\" target=\"_blank\" rel=\"noopener\" data-w=\"godfather\" data-pos=\"n.\" data-en=\"(informal) the founder or leading figure of a movement\" data-zh=\"（某領域的）教父；開創者\">godfather<\/a> of rap, a nickname that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> his influence on hip-hop. Scott-Heron himself resisted the godfather ______ feeling that it did not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encapsulate\" target=\"_blank\" rel=\"noopener\" data-w=\"encapsulate\" data-pos=\"v.\" data-en=\"to express the main points of something briefly\" data-zh=\"概括；總結\">encapsulate<\/a> the full range of his work as a poet, musician, and social critic.", "bodyPlain": "Gil Scott-Heron is often called the godfather of rap, a nickname that highlights his influence on hip-hop. Scott-Heron himself resisted the godfather ______ feeling that it did not encapsulate the full range of his work as a poet, musician, and social critic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "Gil Scott-Heron 常被稱為「饒舌教父」，這個綽號突顯了他對嘻哈音樂的影響。Scott-Heron 本人抗拒「教父」這個 ______ 覺得它無法涵蓋他身為詩人、音樂家和社會評論家的全部作品。", "opts": {"A": "nickname, however", "B": "nickname, however;", "C": "nickname, however,", "D": "nickname; however,"}, "optsZh": {"A": "nickname, however（however 後缺少逗號：錯誤）", "B": "nickname, however;（分號後不是獨立子句：錯誤）", "C": "nickname, however,（只有一個子句，however 為插入語，前後加逗號：正確）", "D": "nickname; however,（分號後不是獨立子句（只是分詞片語）：錯誤）"}, "answer": "C", "expl": "There is only one independent clause ('Scott-Heron himself resisted the godfather nickname'), so 'however' is an interrupter set off by commas on both sides.", "explZh": "句中只有一個獨立子句（Scott-Heron 本人抗拒教父綽號），所以 however 是插入語，前後都加逗號。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: punctuation with however between two independent clauses.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "having included", "B": "to include", "C": "includes", "D": "including"}, "optsZh": {"A": "having included（分詞 → 關係子句缺少主要動詞：錯誤）", "B": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "C": "includes（限定動詞，作關係子句的主要動詞：正確）", "D": "including（分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: punctuation with however between two independent clauses.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices,", "B": "prices, but", "C": "prices", "D": "prices but"}, "optsZh": {"A": "prices,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "prices, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "C": "prices（無標點 → 兩個獨立子句直接相連：錯誤）", "D": "prices but（but 前缺少逗號：錯誤）"}, "answer": "B", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: punctuation with however between two independent clauses.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However,", "B": "However", "C": "However;", "D": "however,"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "However（句首轉折詞後缺少逗號：錯誤）", "C": "However;（分號 → 標點錯誤）", "D": "however,（小寫 → 無法作為新句子的開頭：錯誤）"}, "answer": "A", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: punctuation with however between two independent clauses.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic inst
