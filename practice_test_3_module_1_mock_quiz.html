"數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：一本 1983 年的詩集將短詩與對脆弱手工物品的指涉結合在一起；這位詩人也從事行為藝術與視覺藝術創作；讀者不熟悉這本詩集。\n目標：介紹這本詩集。", "opts": {"A": "The poet's 1983 collection brings together poems about fragile handmade objects and social memory, reflecting her broader work across art forms.", "B": "The collection was published in the twentieth century.", "C": "Performance art can include many media.", "D": "The poet has exhibited visual work internationally."}, "optsZh": {"A": "這位詩人 1983 年的詩集匯集了關於脆弱手工物品與社會記憶的詩，反映了她橫跨多種藝術形式的創作。", "B": "這本詩集出版於二十世紀。", "C": "行為藝術可以包含多種媒材。", "D": "這位詩人曾在國際間展出視覺作品。"}, "answer": "A", "expl": "The choice introduces the work and its focus.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Rhetorical Synthesis: introduce an artist's poetry collection.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A poet&#x27;s 1991 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> explores exile and memory; the book includes prose fragments and lyric poems; the audience has not read the collection.<br><br>Goal: introduce the poetry collection.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A poet's 1991 collection explores exile and memory; the book includes prose fragments and lyric poems; the audience has not read the collection.\n\nGoal: introduce the poetry collection.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：一位詩人 1991 年的詩集探討流亡與記憶；書中包含散文片段與抒情詩；讀者沒有讀過這本詩集。\n目標：介紹這本詩集。", "opts": {"A": "Lyric poems can vary in length.", "B": "The poet has lived in several countries.", "C": "The poet's 1991 collection combines prose fragments and lyric poems to explore exile and memory.", "D": "The book is one of the poet's publications."}, "optsZh": {"A": "抒情詩的長度可能不一。", "B": "這位詩人曾住過好幾個國家。", "C": "這位詩人 1991 年的詩集結合散文片段與抒情詩，探討流亡與記憶。", "D": "這本書是這位詩人的出版作品之一。"}, "answer": "C", "expl": "The choice names the collection's form and central concerns.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Rhetorical Synthesis: introduce an artist's poetry collection.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: A 1978 collection includes poems about factory labor; some poems imitate machine rhythms; the poet also wrote essays on work and technology.<br><br>Goal: introduce the poetry collection.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A 1978 collection includes poems about factory labor; some poems imitate machine rhythms; the poet also wrote essays on work and technology.\n\nGoal: introduce the poetry collection.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：一本 1978 年的詩集收錄關於工廠勞動的詩；有些詩模仿機器的節奏；這位詩人也寫過關於工作與科技的散文。\n目標：介紹這本詩集。", "opts": {"A": "Factories use machines in production.", "B": "The poet's 1978 collection uses poems about factory labor, including pieces that imitate machine rhythms, to examine work and technology.", "C": "The poet also wrote essays.", "D": "The collection was published before 1980."}, "optsZh": {"A": "工廠在生產中使用機器。", "B": "這位詩人 1978 年的詩集以關於工廠勞動的詩（包括模仿機器節奏的作品）來檢視工作與科技。", "C": "這位詩人也寫過散文。", "D": "這本詩集出版於 1980 年以前。"}, "answer": "B", "expl": "The answer introduces the collection specifically.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Rhetorical Synthesis: introduce an artist's poetry collection.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: A 2004 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> pairs poems with drawings; the poems focus on rivers, migration, and family history; the audience is unfamiliar with the collection.<br><br>Goal: introduce the poetry collection.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: A 2004 collection pairs poems with drawings; the poems focus on rivers, migration, and family history; the audience is unfamiliar with the collection.\n\nGoal: introduce the poetry collection.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：一本 2004 年的詩集將詩與素描搭配；這些詩聚焦於河流、遷徙與家族歷史；讀者不熟悉這本詩集。\n目標：介紹這本詩集。", "opts": {"A": "Migration is a common literary theme.", "B": "The poet's family lived near a river.", "C": "Drawings can appear in literary books.", "D": "The 2004 collection pairs drawings with poems about rivers, migration, and family history."}, "optsZh": {"A": "遷徙是常見的文學主題。", "B": "這位詩人的家人住在河邊。", "C": "文學書籍中可能出現插圖。", "D": "這本 2004 年的詩集將素描與關於河流、遷徙和家族歷史的詩搭配在一起。"}, "answer": "D", "expl": "The answer presents the collection and its focus.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Rhetorical Synthesis: introduce an artist's poetry collection.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: A 1965 poetry collection uses spare language; it responds to urban renewal; the poet had previously worked as a journalist.<br><br>Goal: introduce the poetry collection.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: A 1965 poetry collection uses spare language; it responds to urban renewal; the poet had previously worked as a journalist.\n\nGoal: introduce the poetry collection.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：一本 1965 年的詩集使用簡練的語言；它回應都市更新；這位詩人先前曾擔任記者。\n目標：介紹這本詩集。", "opts": {"A": "Journalism and poetry can both address cities.", "B": "The poet's 1965 collection uses spare language to respond to the social effects of urban renewal.", "C": "Urban renewal changed many neighborhoods.", "D": "The poet previously worked as a journalist."}, "optsZh": {"A": "新聞寫作與詩歌都能以城市為題材。", "B": "這位詩人 1965 年的詩集以簡練的語言回應都市更新帶來的社會影響。", "C": "都市更新改變了許多社區。", "D": "這位詩人先前曾擔任記者。"}, "answer": "B", "expl": "The choice introduces the book's style and subject.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Rhetorical Synthesis: describe a research method.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken notes about Terry Kind and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a>&#x27; study of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=medical\" target=\"_blank\" rel=\"noopener\" data-w=\"medical\" data-pos=\"adj.\" data-en=\"relating to medicine or health care\" data-zh=\"醫學的；醫療的\">medical<\/a> schools&#x27; social media use. The student wants to explain the study&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a>.", "bodyPlain": "While researching a topic, a student has taken notes about Terry Kind and colleagues' study of medical schools' social media use. The student wants to explain the study's methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一名學生在研究某個主題時，針對 Terry Kind 與同事關於醫學院使用社群媒體的研究做了筆記。這名學生想要說明這項研究的方法。", "opts": {"A": "Terry Kind and colleagues were interested in how medical schools communicate online.", "B": "The researchers identified medical schools, located their official social media accounts, and recorded the types of content those accounts posted.", "C": "Many institutions now use social media to reach students and the public.", "D": "The study examined communication in a professional educational context."}, "optsZh": {"A": "Terry Kind 與同事對醫學院如何在網路上溝通感興趣。", "B": "研究人員找出各醫學院，查出它們的官方社群媒體帳號，並記錄這些帳號所發布的內容類型。", "C": "許多機構現在使用社群媒體來接觸學生和大眾。", "D": "這項研究探討了專業教育情境中的溝通。"}, "answer": "B", "expl": "This choice explains the methodology: identifying schools, locating their accounts, and recording the types of content posted.", "explZh": "這個選項說明研究方法：找出醫學院、查出其帳號，並記錄貼文內容類型。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Rhetorical Synthesis: describe a research method.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers identified official school accounts; they counted posts by topic; they compared communication patterns across institutions.<br><br>Goal: explain the methodology of a study.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers identified official school accounts; they counted posts by topic; they compared communication patterns across institutions.\n\nGoal: explain the methodology of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：研究人員找出各校的官方帳號；他們依主題計算貼文數量；他們比較不同機構之間的溝通模式。\n目標：說明一項研究的方法。", "opts": {"A": "Communication can influence public perception.", "B": "The researchers studied communication patterns by identifying official accounts, counting posts by topic, and comparing results across institutions.", "C": "The researchers were interested in professional education.", "D": "Many schools use online platforms."}, "optsZh": {"A": "溝通可能影響大眾觀感。", "B": "研究人員藉由找出官方帳號、依主題計算貼文數，並比較不同機構的結果，來研究溝通模式。", "C": "研究人員對專業教育感興趣。", "D": "許多學校使用線上平台。"}, "answer": "B", "expl": "The answer states the study method.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Rhetorical Synthesis: describe a research method.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Researchers selected fifty museum websites; they recorded whether each site offered virtual tours; they compared offerings by museum size.<br><br>Goal: explain the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a> of a study.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Researchers selected fifty museum websites; they recorded whether each site offered virtual tours; they compared offerings by museum size.\n\nGoal: explain the methodology of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：研究人員選了五十個博物館網站；他們記錄每個網站是否提供虛擬導覽；他們依博物館規模比較所提供的內容。\n目標：說明一項研究的方法。", "opts": {"A": "Virtual tours can reach remote audiences.", "B": "Some museums are larger than others.", "C": "The researchers examined museum websites by recording whether each offered virtual tours and comparing the results by museum size.", "D": "Museums maintain public websites."}, "optsZh": {"A": "虛擬導覽可以接觸到遠方的觀眾。", "B": "有些博物館比其他博物館大。", "C": "研究人員檢視博物館網站，記錄每個網站是否提供虛擬導覽，並依博物館規模比較結果。", "D": "博物館設有公開網站。"}, "answer": "C", "expl": "The answer explains how the study was conducted.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Rhetorical Synthesis: describe a research method.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: A team collected restaurant menus; they coded menu items by ingredient type; they compared patterns before and after a local policy change.<br><br>Goal: explain the methodology of a study.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A team collected restaurant menus; they coded menu items by ingredient type; they compared patterns before and after a local policy change.\n\nGoal: explain the methodology of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：一個團隊蒐集餐廳菜單；他們依食材類型為菜單品項編碼；他們比較一項地方政策改變前後的模式。\n目標：說明一項研究的方法。", "opts": {"A": "Local policies can affect businesses.", "B": "Ingredients vary by cuisine.", "C": "Restaurants often revise their menus.", "D": "The team collected menus, coded items by ingredient type, and compared patterns from before and after the policy change."}, "optsZh": {"A": "地方政策可能影響商家。", "B": "食材因菜系而異。", "C": "餐廳常常修改菜單。", "D": "這個團隊蒐集菜單、依食材類型為品項編碼，並比較政策改變前後的模式。"}, "answer": "D", "expl": "The choice describes the procedure.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Rhetorical Synthesis: describe a research method.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Researchers surveyed commuters at three stations; they asked about route choice; they analyzed whether responses differed by travel time.<br><br>Goal: explain the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a> of a study.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Researchers surveyed commuters at three stations; they asked about route choice; they analyzed whether responses differed by travel time.\n\nGoal: explain the methodology of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：研究人員在三個車站調查通勤者；他們詢問路線選擇；他們分析回答是否因通勤時間而異。\n目標：說明一項研究的方法。", "opts": {"A": "Travel time is important to many riders.", "B": "Stations can be crowded during rush hour.", "C": "The researchers surveyed commuters at three stations about route choice and analyzed whether responses varied with travel time.", "D": "Commuters use different routes."}, "optsZh": {"A": "通勤時間對許多乘客很重要。", "B": "車站在尖峰時段可能很擁擠。", "C": "研究人員在三個車站調查通勤者的路線選擇，並分析回答是否隨通勤時間而不同。", "D": "通勤者使用不同的路線。"}, "answer": "C", "expl": "The answer gives the data source and analysis.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Rhetorical Synthesis: describe a research method.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Scholars photographed inscriptions; they transcribed the text; they compared letter forms across sites.<br><br>Goal: explain the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a> of a study.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Scholars photographed inscriptions; they transcribed the text; they compared letter forms across sites.\n\nGoal: explain the methodology of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：學者們拍攝碑文；他們轉寫文字；他們比較各遺址之間的字母形式。\n目標：說明一項研究的方法。", "opts": {"A": "The scholars photographed inscriptions, transcribed the text, and compared letter forms across sites.", "B": "Some sites contain more inscriptions than others.", "C": "Inscriptions can preserve historical information.", "D": "Letter forms changed over time."}, "optsZh": {"A": "學者們拍攝碑文、轉寫文字，並比較各遺址之間的字母形式。", "B": "有些遺址的碑文比其他遺址多。", "C": "碑文可以保存歷史資訊。", "D": "字母形式隨時間改變。"}, "answer": "A", "expl": "The answer explains the research method.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Rhetorical Synthesis: emphasize duration and purpose of work.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken notes about Gullah cultural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preservation\" target=\"_blank\" rel=\"noopener\" data-w=\"preservation\" data-pos=\"n.\" data-en=\"the act of keeping something safe from loss or damage\" data-zh=\"保存；保護\">preservation<\/a>. The student wants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> both the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=duration\" target=\"_blank\" rel=\"noopener\" data-w=\"duration\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"持續時間\">duration<\/a> and purpose of work by individuals who founded museums in 2003.", "bodyPlain": "While researching a topic, a student has taken notes about Gullah cultural preservation. The student wants to emphasize both the duration and purpose of work by individuals who founded museums in 2003.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一名學生在研究某個主題時，針對嘎勒（Gullah）文化保存做了筆記。這名學生想要同時強調 2003 年創立博物館的人士所做工作的持續時間與目的。", "opts": {"A": "Gullah culture developed among African American communities in the coastal southeastern United States.", "B": "Museums can help visitors understand regional history and language.", "C": "Since founding museums in 2003, Cohen and Rodrigues have worked for decades to preserve and teach Gullah history, language, and cultural traditions.", "D": "Cohen and Rodrigues founded museums in different locations."}, "optsZh": {"A": "嘎勒文化在美國東南沿海的非裔美國人社群中發展而成。", "B": "博物館能幫助參觀者了解地方歷史與語言。", "C": "自 2003 年創立博物館以來，Cohen 與 Rodrigues 已花費數十年時間致力於保存並傳授嘎勒的歷史、語言與文化傳統。", "D": "Cohen 與 Rodrigues 在不同地點創立了博物館。"}, "answer": "C", "expl": "'Since founding museums in 2003 ... for decades' shows duration, and 'to preserve and teach Gullah history ...' shows purpose.", "explZh": "「自 2003 年創立博物館以來…數十年」表現持續時間，「保存並傳授嘎勒的歷史…」表現目的。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Rhetorical Synthesis: emphasize duration and purpose of work.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Two organizers founded museums in 2003; the museums preserve language, history, and cultural practices; the organizers continue public education work.<br><br>Goal: emphasize duration and purpose.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Two organizers founded museums in 2003; the museums preserve language, history, and cultural practices; the organizers continue public education work.\n\nGoal: emphasize duration and purpose.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：兩位組織者於 2003 年創立博物館；這些博物館保存語言、歷史與文化習俗；這些組織者持續從事公共教育工作。\n目標：強調持續時間與目的。", "opts": {"A": "Public education can occur in many settings.", "B": "Since founding museums in 2003, the organizers have worked for decades to preserve and teach language, history, and cultural practices.", "C": "The organizers founded more than one museum.", "D": "The museums are cultural institutions."}, "optsZh": {"A": "公共教育可以在許多場合進行。", "B": "自 2003 年創立博物館以來，這些組織者已花費數十年時間致力於保存並傳授語言、歷史與文化習俗。", "C": "這些組織者創立了不只一間博物館。", "D": "這些博物館是文化機構。"}, "answer": "B", "expl": "The choice emphasizes both time and purpose.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Rhetorical Synthesis: emphasize duration and purpose of work.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A historian opened an archive in 1998; the archive protects family letters and photographs; she still leads workshops for descendants.<br><br>Goal: emphasize duration and purpose.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A historian opened an archive in 1998; the archive protects family letters and photographs; she still leads workshops for descendants.\n\nGoal: emphasize duration and purpose.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：一位歷史學家於 1998 年開設一間檔案館；這間檔案館保護家族信件與照片；她至今仍為後代子孫主持工作坊。\n目標：強調持續時間與目的。", "opts": {"A": "The historian founded an archive.", "B": "Workshops can be held in archives.", "C": "The archive contains letters and photographs.", "D": "Since opening the archive in 1998, the historian has spent decades preserving family records and teaching descendants how to use them."}, "optsZh": {"A": "這位歷史學家創立了一間檔案館。", "B": "工作坊可以在檔案館舉辦。", "C": "這間檔案館收藏信件和照片。", "D": "自 1998 年開設這間檔案館以來，這位歷史學家已花費數十年保存家族紀錄，並教導後代如何使用它們。"}, "answer": "D", "expl": "The answer includes duration and purpose.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Rhetorical Synthesis: emphasize duration and purpose of work.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: Community members created a language center in 2005; the center offers classes and records elders&#x27; stories; the work continues.<br><br>Goal: emphasize duration and purpose.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Community members created a language center in 2005; the center offers classes and records elders' stories; the work continues.\n\nGoal: emphasize duration and purpose.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：社區成員於 2005 年創立一個語言中心；這個中心開設課程並記錄長者的故事；這項工作持續進行中。\n目標：強調持續時間與目的。", "opts": {"A": "The center was created in the twenty-first century.", "B": "Since creating the language center in 2005, community members have worked to teach the language and record elders' stories.", "C": "Elders can share important stories.", "D": "The language center offers classes."}, "optsZh": {"A": "這個中心創立於二十一世紀。", "B": "自 2005 年創立語言中心以來，社區成員一直致力於教授這種語言並記錄長者的故事。", "C": "長者能分享重要的故事。", "D": "這個語言中心開設課程。"}, "answer": "B", "expl": "The choice stresses ongoing preservation work.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Rhetorical Synthesis: emphasize duration and purpose of work.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a>/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Two artists founded a cultural festival in 2010; the festival showcases traditional music and dance; they still organize school programs.<br><br>Goal: emphasize duration and purpose.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Two artists founded a cultural festival in 2010; the festival showcases traditional music and dance; they still organize school programs.\n\nGoal: emphasize duration and purpose.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：兩位藝術家於 2010 年創辦一個文化節；這個節慶展演傳統音樂與舞蹈；他們至今仍舉辦學校推廣活動。\n目標：強調持續時間與目的。", "opts": {"A": "School programs can introduce students to art.", "B": "The festival includes music.", "C": "Since founding the festival in 2010, the artists have promoted traditional music and dance through public events and school programs.", "D": "The artists founded a festival."}, "optsZh": {"A": "學校推廣活動可以讓學生接觸藝術。", "B": "這個節慶包含音樂。", "C": "自 2010 年創辦這個節慶以來，這些藝術家透過公開活動與學校推廣計畫推廣傳統音樂與舞蹈。", "D": "這些藝術家創辦了一個節慶。"}, "answer": "C", "expl": "The answer combines duration with purpose.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Rhetorical Synthesis: emphasize duration and purpose of work.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: A librarian began a digitization project in 2001; the project makes rare newspapers available; she continues training volunteers.<br><br>Goal: emphasize duration and purpose.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: A librarian began a digitization project in 2001; the project makes rare newspapers available; she continues training volunteers.\n\nGoal: emphasize duration and purpose.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：一位圖書館員於 2001 年開始一項數位化計畫；這項計畫讓珍貴的舊報紙得以公開取用；她持續培訓志工。\n目標：強調持續時間與目的。", "opts": {"A": "Since beginning the digitization project in 2001, the librarian has worked to make rare newspapers accessible and train volunteers.", "B": "Rare newspapers can be digitized.", "C": "Volunteers often help libraries.", "D": "The project began in 2001."}, "optsZh": {"A": "自 2001 年開始這項數位化計畫以來，這位圖書館員一直致力於讓珍貴的舊報紙可供取用並培訓志工。", "B": "珍貴的舊報紙可以數位化。", "C": "志工常常協助圖書館。", "D": "這項計畫始於 2001 年。"}, "answer": "A", "expl": "The answer gives both time span and purpose.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Rhetorical Synthesis: state a research aim.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken notes about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=woodland\" target=\"_blank\" rel=\"noopener\" data-w=\"woodland\" data-pos=\"n.\" data-en=\"land covered with trees\" data-zh=\"林地\">woodland<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expansion\" target=\"_blank\" rel=\"noopener\" data-w=\"expansion\" data-pos=\"n.\" data-en=\"an increase in size or area\" data-zh=\"擴張；擴展\">expansion<\/a>. The student wants to state the aim of a study by Rogers and Russell.", "bodyPlain": "While researching a topic, a student has taken notes about woodland expansion. The student wants to state the aim of a study by Rogers and Russell.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一名學生在研究某個主題時，針對林地擴張做了筆記。這名學生想要說明 Rogers 與 Russell 一項研究的目的。", "opts": {"A": "Rogers and Russell investigated whether woodland expansion was related to climate patterns.", "B": "Woodland expansion can affect grassland ecosystems.", "C": "Climate patterns vary by region and over time.", "D": "Rogers and Russell compared several environmental factors."}, "optsZh": {"A": "Rogers 與 Russell 研究了林地擴張是否與氣候模式有關。", "B": "林地擴張可能影響草原生態系。", "C": "氣候模式因地區與時間而異。", "D": "Rogers 與 Russell 比較了數個環境因素。"}, "answer": "A", "expl": "'Investigated whether woodland expansion was related to climate patterns' states what the study aimed to find out.", "explZh": "「研究林地擴張是否與氣候模式有關」說明了這項研究想要查明什麼，也就是研究目的。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Rhetorical Synthesis: state a research aim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers compared tree-cover maps with climate records; they wanted to know whether woodland expansion tracked rainfall changes.<br><br>Goal: state the aim of a study.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers compared tree-cover maps with climate records; they wanted to know whether woodland expansion tracked rainfall changes.\n\nGoal: state the aim of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：研究人員比較樹木覆蓋地圖與氣候紀錄；他們想知道林地擴張是否與降雨變化同步。\n目標：說明一項研究的目的。", "opts": {"A": "Rainfall records are one kind of climate data.", "B": "Woodland expansion may affect grasslands.", "C": "The researchers investigated whether woodland expansion was associated with changes in rainfall patterns.", "D": "Tree-cover maps can show where forests grow."}, "optsZh": {"A": "降雨紀錄是氣候資料的一種。", "B": "林地擴張可能影響草原。", "C": "研究人員研究了林地擴張是否與降雨模式的變化有關。", "D": "樹木覆蓋地圖可以顯示森林生長的位置。"}, "answer": "C", "expl": "The answer states the study aim.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Rhetorical Synthesis: state a research aim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A team measured lake levels and temperature records; they wanted to test whether warming was linked to changes in evaporation.<br><br>Goal: state the aim of a study.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A team measured lake levels and temperature records; they wanted to test whether warming was linked to changes in evaporation.\n\nGoal: state the aim of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：一個團隊測量湖泊水位並比對氣溫紀錄；他們想檢驗暖化是否與蒸發量的變化有關。\n目標：說明一項研究的目的。", "opts": {"A": "Temperature records are useful to scientists.", "B": "The team sought to determine whether rising temperatures were linked to changes in lake evaporation.", "C": "Evaporation affects bodies of water.", "D": "Lake levels can be measured over time."}, "optsZh": {"A": "氣溫紀錄對科學家很有用。", "B": "這個團隊試圖確定氣溫上升是否與湖泊蒸發量的變化有關。", "C": "蒸發會影響水體。", "D": "湖泊水位可以長期測量。"}, "answer": "B", "expl": "The answer states the research question.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Rhetorical Synthesis: state a research aim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: Scientists compared bird migration dates with spring temperature data; they wanted to know whether migration timing shifted with warming.<br><br>Goal: state the aim of a study.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Scientists compared bird migration dates with spring temperature data; they wanted to know whether migration timing shifted with warming.\n\nGoal: state the aim of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：科學家比較鳥類遷徙日期與春季氣溫資料；他們想知道遷徙時間是否隨著暖化而改變。\n目標：說明一項研究的目的。", "opts": {"A": "Birds migrate in many regions.", "B": "Spring temperatures vary by year.", "C": "Migration dates can be recorded.", "D": "The scientists examined whether bird migration timing shifted in relation to warmer spring temperatures."}, "optsZh": {"A": "鳥類在許多地區遷徙。", "B": "春季氣溫每年不同。", "C": "遷徙日期可以被記錄下來。", "D": "科學家研究了鳥類遷徙時間是否隨春季氣溫升高而改變。"}, "answer": "D", "expl": "The answer gives the study aim.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Rhetorical Synthesis: state a research aim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=broad\" target=\"_blank\" rel=\"noopener\" data-w=\"broad\" data-pos=\"adj.\" data-en=\"wide; including many different people or things\" data-zh=\"廣泛的；寬廣的\">broader<\/a> patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Researchers studied grassland plots and drought records; they wanted to test whether drought frequency affected plant diversity.<br><br>Goal: state the aim of a study.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Researchers studied grassland plots and drought records; they wanted to test whether drought frequency affected plant diversity.\n\nGoal: state the aim of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：研究人員研究草地樣區與乾旱紀錄；他們想檢驗乾旱頻率是否影響植物多樣性。\n目標：說明一項研究的目的。", "opts": {"A": "Plant diversity can be measured.", "B": "Grasslands contain many plant species.", "C": "Drought records can be compared across years.", "D": "The researchers investigated whether more frequent droughts were associated with changes in plant diversity in grassland plots."}, "optsZh": {"A": "植物多樣性可以被測量。", "B": "草原含有許多植物物種。", "C": "乾旱紀錄可以跨年份比較。", "D": "研究人員研究了乾旱頻率增加是否與草地樣區中植物多樣性的變化有關。"}, "answer": "D", "expl": "The answer states the relationship being studied.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Rhetorical Synthesis: state a research aim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Economists compared rent data with transit expansions; they wanted to determine whether new rail stations affected housing costs.<br><br>Goal: state the aim of a study.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Economists compared rent data with transit expansions; they wanted to determine whether new rail stations affected housing costs.\n\nGoal: state the aim of a study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：經濟學家比較租金資料與大眾運輸的擴展；他們想確定新的鐵路車站是否影響住房成本。\n目標：說明一項研究的目的。", "opts": {"A": "The economists studied whether new rail stations were associated with changes in nearby housing costs.", "B": "Rent data can be collected by neighborhood.", "C": "Housing costs vary across cities.", "D": "Rail stations can change commuting patterns."}, "optsZh": {"A": "這些經濟學家研究了新鐵路車站是否與附近住房成本的變化有關。", "B": "租金資料可以按社區蒐集。", "C": "住房成本因城市而異。", "D": "鐵路車站可能改變通勤模式。"}, "answer": "A", "expl": "The answer directly states the study aim.", "explZh": ""}];
    const SLUG = 'dsat_t3m1';
    const SOURCE = 'Digital SAT Practice Test 3, Module 1';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${g.items.map(q => itemHtml(q, wrong)).join('')}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    function wrongList() {
      const w = loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
  </script>
</body>
</html>
