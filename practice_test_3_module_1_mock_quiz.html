<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 3, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 3, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: broadly adopted or common across a group.", "vocab": true, "body": "In the early 1800s, the Cherokee scholar Sequoyah created the first script, or writing system, for an Indigenous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a> in the United States. Because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=represent\" target=\"_blank\" rel=\"noopener\" data-w=\"represent\" data-pos=\"v.\" data-en=\"to show or stand for something\" data-zh=\"代表；呈現\">represented<\/a> the sounds of spoken Cherokee so <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accurate\" target=\"_blank\" rel=\"noopener\" data-w=\"accurate\" data-pos=\"adj.\" data-en=\"correct and exact, without mistakes\" data-zh=\"準確的\">accurately<\/a>, his script was easy to learn and thus quickly achieved ______ use: by 1830, over 90 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\" data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a> of the Cherokee people could read and write it.", "bodyPlain": "In the early 1800s, the Cherokee scholar Sequoyah created the first script, or writing system, for an Indigenous language in the United States. Because it represented the sounds of spoken Cherokee so accurately, his script was easy to learn and thus quickly achieved ______ use: by 1830, over 90 percent of the Cherokee people could read and write it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "1800 年代初期，切羅基族學者 Sequoyah 為美國境內的一種原住民語言創造了第一套文字，也就是書寫系統。由於這套文字非常準確地呈現了切羅基語口語的發音，它很容易學習，因此很快就達到了 ______ 的使用程度：到了 1830 年，超過 90% 的切羅基人都能讀寫這套文字。", "opts": {"A": "widespread", "B": "careful", "C": "unintended", "D": "infrequent"}, "optsZh": {"A": "widespread（普遍的、廣泛的）", "B": "careful（小心的、仔細的）", "C": "unintended（非預期的、無意的）", "D": "infrequent（不常發生的、罕見的）"}, "answer": "A", "expl": "Because the script was easy to learn and over 90 percent of the Cherokee could read and write it by 1830, its use was 'widespread' (common across the group).", "explZh": "因為這套文字容易學習，而且到 1830 年超過 90% 的切羅基人都能讀寫，所以它的使用「widespread」（普遍、廣泛）。", "defs": {"A": {"pos": "adj.", "en": "existing or happening in many places or among many people", "zh": "普遍的；廣泛的", "word": "widespread"}, "B": {"pos": "adj.", "en": "giving close attention to avoid mistakes", "zh": "小心的；仔細的", "word": "careful"}, "C": {"pos": "adj.", "en": "not planned or meant", "zh": "非預期的；無意的", "word": "unintended"}, "D": {"pos": "adj.", "en": "not happening often", "zh": "不常發生的；罕見的", "word": "infrequent"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: broadly adopted or common across a group.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A linguist studying nineteenth-century schooling found that a newly designed alphabet was not confined to mission classrooms; because adult learners could master it quickly and teach it to neighbors, the script soon became ______ across towns that had previously relied mainly on oral transmission.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A linguist studying nineteenth-century schooling found that a newly designed alphabet was not confined to mission classrooms; because adult learners could master it quickly and teach it to neighbors, the script soon became ______ across towns that had previously relied mainly on oral transmission.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位研究十九世紀學校教育的語言學家發現，一套新設計的字母並不局限於教會學校的教室；由於成年學習者能很快學會並教給鄰居，這套文字很快就在原本主要依賴口耳相傳的城鎮之間變得 ______。", "opts": {"A": "provisional", "B": "decorative", "C": "widespread", "D": "ambiguous"}, "optsZh": {"A": "provisional（暫時的、尚待確認的）", "B": "decorative（裝飾性的）", "C": "widespread（普遍的、廣泛的）", "D": "ambiguous（模糊的、含糊不清的）"}, "answer": "C", "expl": "Widespread means found or used over a large area or by many people.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "temporary and likely to be changed later", "zh": "暫時的；臨時的；有待確認的", "word": "provisional"}, "B": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的；裝飾用的", "word": "decorative"}, "C": {"pos": "adj.", "en": "existing or happening in many places or among many people", "zh": "普遍的；廣泛的", "word": "widespread"}, "D": {"pos": "adj.", "en": "having more than one possible meaning; unclear", "zh": "模糊的；含糊不清的", "word": "ambiguous"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: broadly adopted or common across a group.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. After the coastal city introduced a low-cost ferry pass, ridership was no longer limited to commuters who worked near the harbor. Within a year, the pass had achieved ______ adoption among students, service workers, and older residents who previously considered the ferry too expensive for daily travel.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. After the coastal city introduced a low-cost ferry pass, ridership was no longer limited to commuters who worked near the harbor. Within a year, the pass had achieved ______ adoption among students, service workers, and older residents who previously considered the ferry too expensive for daily travel.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這座沿海城市推出低價渡輪通行證後，搭乘者不再只限於在港口附近工作的通勤族。一年之內，這種通行證已在學生、服務業工作者，以及先前認為渡輪太貴而無法每天搭乘的年長居民之間獲得 ______ 採用。", "opts": {"A": "accidental", "B": "reluctant", "C": "selective", "D": "extensive"}, "optsZh": {"A": "accidental（意外的、偶然的）", "B": "reluctant（不情願的）", "C": "selective（有選擇性的）", "D": "extensive（廣泛的、大規模的）"}, "answer": "D", "expl": "Extensive means broad or far-reaching.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "B": {"pos": "adj.", "en": "not willing to do something", "zh": "不情願的", "word": "reluctant"}, "C": {"pos": "adj.", "en": "choosing carefully; including only some", "zh": "有選擇性的", "word": "selective"}, "D": {"pos": "adj.", "en": "covering a large area or amount", "zh": "廣泛的；大規模的", "word": "extensive"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: broadly adopted or common across a group.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The archive&#x27;s transcription system initially attracted only a few specialists, but its precise symbols and brief training manual made it unusually accessible. By the third annual conference, the method had become ______, appearing in university syllabi, museum catalogs, and community history projects.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The archive's transcription system initially attracted only a few specialists, but its precise symbols and brief training manual made it unusually accessible. By the third annual conference, the method had become ______, appearing in university syllabi, museum catalogs, and community history projects.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這個檔案館的轉寫系統起初只吸引少數專家，但它精確的符號和簡短的訓練手冊使它格外容易上手。到了第三屆年會時，這套方法已變得 ______，出現在大學課程大綱、博物館目錄和社區歷史計畫中。", "opts": {"A": "private", "B": "prevalent", "C": "fragile", "D": "intermittent"}, "optsZh": {"A": "private（私人的）", "B": "prevalent（普遍的、盛行的）", "C": "fragile（脆弱的）", "D": "intermittent（間歇的、斷斷續續的）"}, "answer": "B", "expl": "Prevalent means common or widely existing.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "belonging to or meant for one person or group; not public", "zh": "私人的；私下的", "word": "private"}, "B": {"pos": "adj.", "en": "common or widespread", "zh": "普遍的；盛行的", "word": "prevalent"}, "C": {"pos": "adj.", "en": "easily broken or damaged", "zh": "脆弱的；易碎的", "word": "fragile"}, "D": {"pos": "adj.", "en": "stopping and starting repeatedly", "zh": "間歇的；斷斷續續的", "word": "intermittent"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: broadly adopted or common across a group.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A public-health <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaign<\/a> succeeded because its central message could be translated into several local languages without losing clarity. Rather than remaining a minor initiative in one district, the campaign gained ______ reach, with clinics in nearly every province adopting the same materials.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A public-health campaign succeeded because its central message could be translated into several local languages without losing clarity. Rather than remaining a minor initiative in one district, the campaign gained ______ reach, with clinics in nearly every province adopting the same materials.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一項公共衛生宣導活動之所以成功，是因為它的核心訊息能翻譯成數種當地語言而不失清晰。這項活動沒有停留在單一地區的小型計畫，而是獲得了 ______ 的影響範圍，幾乎每個省份的診所都採用了相同的資料。", "opts": {"A": "broad", "B": "tentative", "C": "narrow", "D": "incidental"}, "optsZh": {"A": "broad（廣泛的）", "B": "tentative（暫定的、試探性的）", "C": "narrow（狹窄的、有限的）", "D": "incidental（附帶的、偶然的）"}, "answer": "A", "expl": "Broad means wide in extent or scope.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "wide; including many different people or things", "zh": "廣泛的；寬廣的", "word": "broad"}, "B": {"pos": "adj.", "en": "not certain or fixed; done as a trial", "zh": "暫定的；試探性的", "word": "tentative"}, "C": {"pos": "adj.", "en": "limited in range or scope", "zh": "狹窄的；有限的", "word": "narrow"}, "D": {"pos": "adj.", "en": "happening as a minor part or result of something else; not essential", "zh": "附帶的；偶然的；次要的", "word": "incidental"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: broadly adopted or common across a group.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The museum expected its online catalog to serve only researchers, yet teachers and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> artists also began using it. The catalog&#x27;s audience thus became ______, extending well beyond the small professional group for whom it had first been designed.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The museum expected its online catalog to serve only researchers, yet teachers and independent artists also began using it. The catalog's audience thus became ______, extending well beyond the small professional group for whom it had first been designed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n博物館原本預期它的線上目錄只會服務研究人員，然而教師與獨立藝術家也開始使用它。因此，這份目錄的使用者變得 ______，遠遠超出它最初設計時所針對的那一小群專業人士。", "opts": {"A": "unverified", "B": "far-reaching", "C": "sporadic", "D": "specialized"}, "optsZh": {"A": "unverified（未經證實的）", "B": "far-reaching（影響深遠的）", "C": "sporadic（零星的、偶發的）", "D": "specialized（專門的）"}, "answer": "B", "expl": "Far-reaching means extending widely in influence or effect.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not proved to be true", "zh": "未經證實的", "word": "unverified"}, "B": {"pos": "adj.", "en": "having a wide influence or many effects", "zh": "影響深遠的", "word": "far-reaching"}, "C": {"pos": "adj.", "en": "happening only occasionally or irregularly", "zh": "零星的；偶發的", "word": "sporadic"}, "D": {"pos": "adj.", "en": "designed for a particular purpose or field", "zh": "專門的", "word": "specialized"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: recognized or accepted as true.", "vocab": true, "body": "When Mexican-American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> Zelia Maria Magdalena Nuttall published her 1886 research paper on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> found at the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Indigenous city of Teotihuacan in present-day Mexico, other researchers readily ______ her work as ground-breaking; this recognition stemmed from her convincing demonstration that the sculptures were much older than had previously been thought.", "bodyPlain": "When Mexican-American archaeologist Zelia Maria Magdalena Nuttall published her 1886 research paper on sculptures found at the ancient Indigenous city of Teotihuacan in present-day Mexico, other researchers readily ______ her work as ground-breaking; this recognition stemmed from her convincing demonstration that the sculptures were much older than had previously been thought.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "當墨西哥裔美國考古學家 Zelia Maria Magdalena Nuttall 在 1886 年發表她關於古代原住民城市 Teotihuacan（位於今墨西哥）出土雕塑的研究論文時，其他研究人員很快就 ______ 她的研究具有開創性；這種肯定源自她令人信服地證明了這些雕塑比先前認為的古老得多。", "opts": {"A": "acknowledged", "B": "ensured", "C": "denied", "D": "underestimated"}, "optsZh": {"A": "acknowledged（承認、認可）", "B": "ensured（確保）", "C": "denied（否認、拒絕承認）", "D": "underestimated（低估）"}, "answer": "A", "expl": "The text mentions 'this recognition' of her work as ground-breaking, so researchers 'acknowledged' (recognized) it.", "explZh": "後文提到對她研究的「這種肯定（recognition）」，因此研究人員是「acknowledged」（承認、認可）她的研究具開創性。", "defs": {"A": {"pos": "v.", "en": "admitted or recognized that something is true or important", "zh": "承認；認可", "word": "acknowledged"}, "B": {"pos": "v.", "en": "made certain that something happened", "zh": "確保了", "word": "ensured"}, "C": {"pos": "v.", "en": "said that something is not true; refused to accept", "zh": "否認；拒絕承認", "word": "denied"}, "D": {"pos": "v.", "en": "thought something was smaller or less important than it really was", "zh": "低估", "word": "underestimated"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: recognized or accepted as true.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For decades, critics treated the composer&#x27;s notebooks as minor curiosities, but the discovery of dated drafts showing that she had developed several innovations before her better-known <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporaries<\/a> led scholars to ______ her role in reshaping twentieth-century chamber music.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For decades, critics treated the composer's notebooks as minor curiosities, but the discovery of dated drafts showing that she had developed several innovations before her better-known contemporaries led scholars to ______ her role in reshaping twentieth-century chamber music.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n數十年來，評論家把這位作曲家的筆記本視為無關緊要的珍玩，但發現的註明日期草稿顯示她比她更知名的同時代人更早發展出數項創新，這促使學者們 ______ 她在重塑二十世紀室內樂上的角色。", "opts": {"A": "dismiss", "B": "obscure", "C": "postpone", "D": "acknowledge"}, "optsZh": {"A": "dismiss（不予理會、駁回）", "B": "obscure（模糊的；鮮為人知的；使隱晦）", "C": "postpone（延後）", "D": "acknowledge（承認）"}, "answer": "D", "expl": "Acknowledge means recognize as true or important.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to decide that something is not worth considering", "zh": "不予理會；否定；駁回", "word": "dismiss"}, "B": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "C": {"pos": "v.", "en": "to delay something until a later time", "zh": "延後；延期", "word": "postpone"}, "D": {"pos": "v.", "en": "to admit or accept that something is true or exists", "zh": "承認；認可；確認", "word": "acknowledge"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: recognized or accepted as true.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Although the astronomer&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> were initially questioned, three <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> observatories later reproduced them with more precise instruments. As a result, the committee was forced to ______ the validity of her original conclusion.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Although the astronomer's measurements were initially questioned, three independent observatories later reproduced them with more precise instruments. As a result, the committee was forced to ______ the validity of her original conclusion.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n雖然這位天文學家的測量結果起初受到質疑，但後來有三座獨立的天文台用更精密的儀器重現了這些結果。因此，委員會不得不 ______ 她原本結論的正確性。", "opts": {"A": "invent", "B": "concede", "C": "withhold", "D": "misplace"}, "optsZh": {"A": "invent（發明、捏造）", "B": "concede（承認、讓步）", "C": "withhold（保留、扣留）", "D": "misplace（放錯地方）"}, "answer": "B", "expl": "Concede means admit that something is true after resistance.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to create something new; to make up something untrue", "zh": "發明；捏造", "word": "invent"}, "B": {"pos": "v.", "en": "to admit, often reluctantly, that something is true", "zh": "（勉強）承認；讓步", "word": "concede"}, "C": {"pos": "v.", "en": "to refuse to give something", "zh": "保留；扣留", "word": "withhold"}, "D": {"pos": "v.", "en": "to put something in the wrong place", "zh": "放錯地方；遺失", "word": "misplace"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: recognized or accepted as true.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The historian&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> of the treaty seemed unlikely until newly translated letters confirmed several of its key details; after that evidence appeared, even skeptical reviewers began to ______ the interpretation as more persuasive than earlier accounts.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The historian's interpretation of the treaty seemed unlikely until newly translated letters confirmed several of its key details; after that evidence appeared, even skeptical reviewers began to ______ the interpretation as more persuasive than earlier accounts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這位歷史學家對該條約的詮釋原本看似不太可能，直到新翻譯的信件證實了其中幾個關鍵細節；那項證據出現之後，連持懷疑態度的評論者也開始 ______ 這個詮釋比先前的說法更有說服力。", "opts": {"A": "recognize", "B": "neglect", "C": "simplify", "D": "distort"}, "optsZh": {"A": "recognize（認可、承認）", "B": "neglect（忽視、疏忽）", "C": "simplify（簡化）", "D": "distort（扭曲）"}, "answer": "A", "expl": "Recognize means accept or identify the significance of something.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to accept that something is true, important, or valuable", "zh": "認可；承認", "word": "recognize"}, "B": {"pos": "v.", "en": "to fail to give enough attention to something", "zh": "忽視；疏忽", "word": "neglect"}, "C": {"pos": "v.", "en": "to make something easier or less complex", "zh": "簡化", "word": "simplify"}, "D": {"pos": "v.", "en": "to change something so that it is no longer accurate", "zh": "扭曲；曲解", "word": "distort"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: recognized or accepted as true.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. When a restoration team demonstrated that the faded marks on the wall formed a complete map rather than random stains, museum officials had to ______ that the room contained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of planning practices previously unknown in the region.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. When a restoration team demonstrated that the faded marks on the wall formed a complete map rather than random stains, museum officials had to ______ that the room contained evidence of planning practices previously unknown in the region.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n當修復團隊證明牆上褪色的痕跡構成一幅完整的地圖、而非隨機的污漬時，博物館人員不得不 ______ 這個房間含有該地區先前未知的規劃做法的證據。", "opts": {"A": "overlook", "B": "deny", "C": "accept", "D": "ensure"}, "optsZh": {"A": "overlook（忽略）", "B": "deny（否認）", "C": "accept（接受、承認）", "D": "ensure（確保）"}, "answer": "C", "expl": "Accept means regard as true or valid.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to fail to notice or consider something", "zh": "忽略", "word": "overlook"}, "B": {"pos": "v.", "en": "to say that something is not true", "zh": "否認；否定", "word": "deny"}, "C": {"pos": "v.", "en": "to agree that something is true or correct", "zh": "接受；承認；認可", "word": "accept"}, "D": {"pos": "v.", "en": "to make certain that something happens", "zh": "確保", "word": "ensure"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: recognized or accepted as true.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The novelist&#x27;s early reviews were often negative, but later critics, paying closer attention to her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> narration, came to ______ the technical sophistication of a book once described as merely eccentric.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The novelist's early reviews were often negative, but later critics, paying closer attention to her experimental narration, came to ______ the technical sophistication of a book once described as merely eccentric.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這位小說家早期得到的書評多半是負面的，但後來的評論家更仔細地留意她實驗性的敘事手法，逐漸 ______ 這本曾被形容為只是古怪之作的書在技巧上的精妙。", "opts": {"A": "replace", "B": "lessen", "C": "appreciate", "D": "imitate"}, "optsZh": {"A": "replace（取代）", "B": "lessen（減少、減輕）", "C": "appreciate（欣賞、賞識）", "D": "imitate（模仿）"}, "answer": "C", "expl": "Appreciate can mean recognize the full worth of something.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to take the place of something", "zh": "取代", "word": "replace"}, "B": {"pos": "v.", "en": "to make something smaller or weaker", "zh": "減少；減輕", "word": "lessen"}, "C": {"pos": "v.", "en": "to recognize the value or quality of something", "zh": "欣賞；賞識", "word": "appreciate"}, "D": {"pos": "v.", "en": "to copy someone's behavior or a thing's style", "zh": "模仿", "word": "imitate"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: put a law, plan, or policy into effect.", "vocab": true, "body": "Like other tribal nations, the Muscogee (Creek) Nation is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=self-governing\" target=\"_blank\" rel=\"noopener\" data-w=\"self-governing\" data-pos=\"adj.\" data-en=\"ruling itself rather than being controlled by another government\" data-zh=\"自治的\">self-governing<\/a>; its National Council generates laws <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=regulate\" target=\"_blank\" rel=\"noopener\" data-w=\"regulate\" data-pos=\"v.\" data-en=\"to control something so it works correctly\" data-zh=\"調節；控制\">regulating<\/a> aspects of community life such as land use and healthcare, while the principal chief and cabinet officials ______ those laws by devising policies and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=administer\" target=\"_blank\" rel=\"noopener\" data-w=\"administer\" data-pos=\"v.\" data-en=\"to manage or provide something officially\" data-zh=\"管理；執行；提供\">administering<\/a> services in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accordance\" target=\"_blank\" rel=\"noopener\" data-w=\"accordance\" data-pos=\"n.\" data-en=\"agreement with a rule (in accordance with = following)\" data-zh=\"依照；一致\">accordance<\/a> with them.", "bodyPlain": "Like other tribal nations, the Muscogee (Creek) Nation is self-governing; its National Council generates laws regulating aspects of community life such as land use and healthcare, while the principal chief and cabinet officials ______ those laws by devising policies and administering services in accordance with them.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "就像其他部落國家一樣，Muscogee（Creek）Nation 是自治的；它的國家議會制定規範社區生活各方面（例如土地使用與醫療保健）的法律，而首席酋長與內閣官員則藉由研擬政策並依法提供服務來 ______ 這些法律。", "opts": {"A": "implement", "B": "presume", "C": "improvise", "D": "mimic"}, "optsZh": {"A": "implement（實施、執行）", "B": "presume（推定、假定）", "C": "improvise（即興創作、臨時湊合）", "D": "mimic（模仿）"}, "answer": "A", "expl": "The council makes the laws, and the chief and officials put them into effect by devising policies and administering services, so they 'implement' the laws.", "explZh": "議會制定法律，而酋長與官員藉由研擬政策、提供服務把法律付諸實行，所以是「implement」（實施）這些法律。", "defs": {"A": {"pos": "v.", "en": "to put a law, plan, or policy into effect", "zh": "實施；執行", "word": "implement"}, "B": {"pos": "v.", "en": "to suppose something is true without proof", "zh": "推定；假定", "word": "presume"}, "C": {"pos": "v.", "en": "to make or perform something without planning", "zh": "即興創作；臨時湊合", "word": "improvise"}, "D": {"pos": "v.", "en": "to copy the way something looks, sounds, or acts", "zh": "模仿", "word": "mimic"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: put a law, plan, or policy into effect.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The city council passes broad environmental ordinances, but the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a> department must ______ those ordinances by designing bus routes, purchasing low-emission vehicles, and creating schedules that make the new standards workable in everyday service.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The city council passes broad environmental ordinances, but the transportation department must ______ those ordinances by designing bus routes, purchasing low-emission vehicles, and creating schedules that make the new standards workable in everyday service.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n市議會通過大方向的環境法規，但交通局必須藉由設計公車路線、購買低排放車輛，以及制定讓新標準在日常服務中可行的時刻表，來 ______ 這些法規。", "opts": {"A": "interrupt", "B": "speculate", "C": "resemble", "D": "implement"}, "optsZh": {"A": "interrupt（打斷、中斷）", "B": "speculate（推測）", "C": "resemble（像、類似）", "D": "implement（實施、執行）"}, "answer": "D", "expl": "Implement means put a plan or law into effect.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to stop something for a short time", "zh": "打斷；中斷", "word": "interrupt"}, "B": {"pos": "v.", "en": "to guess possible answers without enough information", "zh": "推測", "word": "speculate"}, "C": {"pos": "v.", "en": "to look like or be similar to", "zh": "像；類似", "word": "resemble"}, "D": {"pos": "v.", "en": "to put a law, plan, or policy into effect", "zh": "實施；執行", "word": "implement"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: put a law, plan, or policy into effect.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A university&#x27;s faculty senate approved a new advising policy, but individual colleges still needed to ______ it by training advisers, revising degree forms, and informing students how the new requirements would affect course selection.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A university's faculty senate approved a new advising policy, but individual colleges still needed to ______ it by training advisers, revising degree forms, and informing students how the new requirements would affect course selection.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一所大學的教職員評議會通過了新的導師輔導政策，但各學院仍需要藉由訓練導師、修改學位表格，並告知學生新規定將如何影響選課，來 ______ 這項政策。", "opts": {"A": "misinterpret", "B": "enact", "C": "postpone", "D": "question"}, "optsZh": {"A": "misinterpret（誤解）", "B": "enact（制定（法律）；實施）", "C": "postpone（延後）", "D": "question（質疑）"}, "answer": "B", "expl": "Enact means make a policy active or put it into operation.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to understand something wrongly", "zh": "誤解", "word": "misinterpret"}, "B": {"pos": "v.", "en": "to make a law; to put something into action", "zh": "制定（法律）；實施", "word": "enact"}, "C": {"pos": "v.", "en": "to delay something until a later time", "zh": "延後；延期", "word": "postpone"}, "D": {"pos": "v.", "en": "to express doubt about something", "zh": "質疑", "word": "question"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: put a law, plan, or policy into effect.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The treaty established general principles for protecting the wetland, while local agencies were responsible for finding practical ways to ______ those principles, including limits on development and seasonal rules for boat traffic.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The treaty established general principles for protecting the wetland, while local agencies were responsible for finding practical ways to ______ those principles, including limits on development and seasonal rules for boat traffic.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項條約確立了保護濕地的大原則，而地方機關則負責找出實際的方法來 ______ 這些原則，包括限制開發以及制定船隻通行的季節性規定。", "opts": {"A": "apply", "B": "presume", "C": "abandon", "D": "mimic"}, "optsZh": {"A": "apply（應用、施行）", "B": "presume（推定、假定）", "C": "abandon（放棄、拋棄）", "D": "mimic（模仿）"}, "answer": "A", "expl": "Apply means put principles or rules to practical use.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to use something in a particular situation", "zh": "應用；施行", "word": "apply"}, "B": {"pos": "v.", "en": "to suppose something is true without proof", "zh": "推定；假定", "word": "presume"}, "C": {"pos": "v.", "en": "to stop doing or using something completely", "zh": "放棄；拋棄", "word": "abandon"}, "D": {"pos": "v.", "en": "to copy the way something looks, sounds, or acts", "zh": "模仿", "word": "mimic"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: put a law, plan, or policy into effect.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=broad\" target=\"_blank\" rel=\"noopener\" data-w=\"broad\" data-pos=\"adj.\" data-en=\"wide; including many different people or things\" data-zh=\"廣泛的；寬廣的\">broader<\/a> patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. After researchers recommended a new safety protocol, the hospital did not merely endorse the idea; administrators worked to ______ the protocol by changing staff rotations, updating checklists, and reviewing compliance each week.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. After researchers recommended a new safety protocol, the hospital did not merely endorse the idea; administrators worked to ______ the protocol by changing staff rotations, updating checklists, and reviewing compliance each week.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n在研究人員建議一套新的安全規範後，醫院並不只是表示贊同；管理人員藉由調整員工輪班、更新檢查清單，並每週檢查遵行情況，努力 ______ 這套規範。", "opts": {"A": "predict", "B": "execute", "C": "evade", "D": "summarize"}, "optsZh": {"A": "predict（預測）", "B": "execute（執行、實行）", "C": "evade（逃避、規避）", "D": "summarize（摘要、總結）"}, "answer": "B", "expl": "Execute means carry out a plan or procedure.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to say what will happen in the future", "zh": "預測；預言", "word": "predict"}, "B": {"pos": "v.", "en": "to carry out a plan or order", "zh": "執行；實行", "word": "execute"}, "C": {"pos": "v.", "en": "to avoid something, especially in a dishonest way", "zh": "逃避；規避", "word": "evade"}, "D": {"pos": "v.", "en": "to give a short statement of the main points", "zh": "摘要；總結", "word": "summarize"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: put a law, plan, or policy into effect.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The agency&#x27;s board can establish conservation goals, but field officers must ______ them by monitoring habitats, coordinating volunteers, and adjusting practices when local conditions change.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The agency's board can establish conservation goals, but field officers must ______ them by monitoring habitats, coordinating volunteers, and adjusting practices when local conditions change.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n該機構的董事會可以設定保育目標，但外勤人員必須藉由監測棲地、協調志工，並在當地情況改變時調整做法，來 ______ 這些目標。", "opts": {"A": "model after", "B": "argue against", "C": "put into practice", "D": "take for granted"}, "optsZh": {"A": "model after（仿效）", "B": "argue against（反對、駁斥）", "C": "put into practice（付諸實行）", "D": "take for granted（視為理所當然）"}, "answer": "C", "expl": "Put into practice means carry out an idea or plan.", "explZh": "", "defs": {"A": {"pos": "phr. v.", "en": "to design something by copying another thing", "zh": "仿效；以…為範本", "word": "model after"}, "B": {"pos": "phr. v.", "en": "to give reasons why something is wrong", "zh": "反對；駁斥", "word": "argue against"}, "C": {"pos": "phr.", "en": "to start using an idea or plan", "zh": "付諸實行", "word": "put into practice"}, "D": {"pos": "phr.", "en": "to accept something as true without questioning it", "zh": "視為理所當然", "word": "take for granted"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: complexly connected in detailed ways.", "vocab": true, "body": "In the Indigenous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intercropping\" target=\"_blank\" rel=\"noopener\" data-w=\"intercropping\" data-pos=\"n.\" data-en=\"growing two or more crops together in the same field\" data-zh=\"間作；混作\">intercropping<\/a> system known as the Three Sisters, maize, squash, and beans form an ______ web of relations: maize provides the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> on which the bean vines grow; the squash vines cover the soil, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discourage\" target=\"_blank\" rel=\"noopener\" data-w=\"discourage\" data-pos=\"v.\" data-en=\"to make something less likely to happen\" data-zh=\"抑制；使不易發生\">discouraging<\/a> competition from weeds; and the beans aid their two &#x27;sisters&#x27; by enriching the soil with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essential<\/a> nitrogen.", "bodyPlain": "In the Indigenous intercropping system known as the Three Sisters, maize, squash, and beans form an ______ web of relations: maize provides the structure on which the bean vines grow; the squash vines cover the soil, discouraging competition from weeds; and the beans aid their two 'sisters' by enriching the soil with essential nitrogen.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在被稱為「三姊妹」的原住民間作系統中，玉米、南瓜和豆類形成一個 ______ 的關係網：玉米提供豆藤攀爬的支架；南瓜藤覆蓋土壤，抑制雜草的競爭；而豆類則以必需的氮使土壤更肥沃，幫助它的兩位「姊妹」。", "opts": {"A": "indecipherable", "B": "ornamental", "C": "obscure", "D": "intricate"}, "optsZh": {"A": "indecipherable（無法辨認的、難以解讀的）", "B": "ornamental（裝飾用的）", "C": "obscure（模糊的；鮮為人知的；使隱晦）", "D": "intricate（錯綜複雜的、精細的）"}, "answer": "D", "expl": "The colon introduces a detailed description of how the three plants support one another in complex ways, so the web is 'intricate.'", "explZh": "冒號後詳細說明三種作物如何以複雜的方式互相支援，因此這個關係網是「intricate」（錯綜複雜、精細的）。", "defs": {"A": {"pos": "adj.", "en": "impossible to read or understand", "zh": "無法辨認的；難以解讀的", "word": "indecipherable"}, "B": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}, "C": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "D": {"pos": "adj.", "en": "having many small parts connected in complex and detailed ways", "zh": "錯綜複雜的；精細的", "word": "intricate"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: complexly connected in detailed ways.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A traditional irrigation network may look simple from a distance, but its channels, gates, and seasonal rules form an ______ system in which changing the flow at one point can alter water access for several villages downstream.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A traditional irrigation network may look simple from a distance, but its channels, gates, and seasonal rules form an ______ system in which changing the flow at one point can alter water access for several villages downstream.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n傳統的灌溉網絡遠看也許很簡單，但它的水道、閘門與季節性規則構成一個 ______ 的系統，在其中某一點改變水流，就可能改變下游好幾個村莊的用水。", "opts": {"A": "ornamental", "B": "intricate", "C": "temporary", "D": "uniform"}, "optsZh": {"A": "ornamental（裝飾用的）", "B": "intricate（錯綜複雜的、精細的）", "C": "temporary（暫時的）", "D": "uniform（一致的、統一的）"}, "answer": "B", "expl": "Intricate means complex and detailed.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}, "B": {"pos": "adj.", "en": "having many small parts connected in complex and detailed ways", "zh": "錯綜複雜的；精細的", "word": "intricate"}, "C": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}, "D": {"pos": "adj.", "en": "the same in all parts or cases", "zh": "一致的；統一的", "word": "uniform"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: complexly connected in detailed ways.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The critic argues that the novel&#x27;s plot is not a loose sequence of episodes but an ______ arrangement: a minor image introduced in the opening chapter returns later as the key to understanding the narrator&#x27;s final decision.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The critic argues that the novel's plot is not a loose sequence of episodes but an ______ arrangement: a minor image introduced in the opening chapter returns later as the key to understanding the narrator's final decision.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位評論家主張，這部小說的情節並不是鬆散的片段組合，而是 ______ 的安排：開頭一章出現的一個次要意象，後來成為理解敘述者最終決定的關鍵。", "opts": {"A": "illegible", "B": "accidental", "C": "redundant", "D": "elaborate"}, "optsZh": {"A": "illegible（字跡難以辨認的）", "B": "accidental（意外的、偶然的）", "C": "redundant（多餘的、冗贅的）", "D": "elaborate（精心製作的、複雜精細的）"}, "answer": "D", "expl": "Elaborate means carefully developed and complex.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "impossible or very hard to read", "zh": "字跡難以辨認的", "word": "illegible"}, "B": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "C": {"pos": "adj.", "en": "not needed because something else already does the job", "zh": "多餘的；冗贅的", "word": "redundant"}, "D": {"pos": "adj
