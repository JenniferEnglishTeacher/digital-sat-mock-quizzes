<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 9, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 9, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnDlDoc">⬇ Download wrong (Word 錯題講義)</button>
      <label class="scope">下載範圍 <select id="dlScope"><option value="session">本次作答 This attempt</option><option value="all">全部錯題本 All saved</option></select></label>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: arranged means organized", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Ida B. Wells’s 1970 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=autobiography\" target=\"_blank\" rel=\"noopener\" data-w=\"autobiography\" data-pos=\"n.\" data-en=\"a book about a person&#x27;s life written by that person\" data-zh=\"自傳\">autobiography<\/a> A Crusade for Justice. Mr. Watts is a reference to George Frederic Watts, an English painter.<br><br>[Manchester’s] art <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gallery\" target=\"_blank\" rel=\"noopener\" data-w=\"gallery\" data-pos=\"n.\" data-en=\"a room or building where art is shown\" data-zh=\"展覽廳；美術館\">galleries<\/a> are so <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=arranged\" target=\"_blank\" rel=\"noopener\" data-w=\"arranged\" data-pos=\"v.\" data-en=\"put in a particular order or position\" data-zh=\"排列；安排\">arranged<\/a> that the name of every picture is plainly seen and one has no need of a catalogue to pick out the name and the artist. This is a convenience to the general public, which other art galleries, which shall be nameless, might copy to advantage. To her treasure of art Manchester has added Mr. Watts’ latest picture, the Good Samaritan.", "bodyPlain": "The following text is adapted from Ida B. Wells’s 1970 autobiography A Crusade for Justice. Mr. Watts is a reference to George Frederic Watts, an English painter.\n\n[Manchester’s] art galleries are so arranged that the name of every picture is plainly seen and one has no need of a catalogue to pick out the name and the artist. This is a convenience to the general public, which other art galleries, which shall be nameless, might copy to advantage. To her treasure of art Manchester has added Mr. Watts’ latest picture, the Good Samaritan.", "stem": "As used in the text, what does the word “arranged” most nearly mean?", "stemZh": "根據文中用法，arranged 這個字最接近什麼意思？", "bodyZh": "以下文字改編自 Ida B. Wells 1970 年的自傳《A Crusade for Justice》（為正義而戰）。Mr. Watts 指的是英國畫家 George Frederic Watts。\n〔Manchester 的〕美術館 arranged（安排、布置）得讓每幅畫的名稱都清楚可見，參觀者不需要目錄就能找出畫名和畫家。這對一般大眾來說是一種便利，其他某些不便點名的美術館大可仿效而受益。Manchester 在其藝術寶藏中又增添了 Watts 先生的最新畫作《好撒馬利亞人》（the Good Samaritan）。", "opts": {"A": "Organized", "B": "Ranked", "C": "Scheduled", "D": "Discussed"}, "optsZh": {"A": "Organized（有組織地安排、整理）", "B": "Ranked（排名）", "C": "Scheduled（排定時程）", "D": "Discussed（討論）"}, "answer": "A", "expl": "The galleries are 'arranged' so every picture's name is easy to see—that is, they are organized in a clear, helpful way.", "explZh": "美術館的 arranged 讓每幅畫的名稱都清楚可見——也就是以清楚、方便的方式加以布置整理（organized）。", "defs": {"A": {"pos": "v.", "en": "put in a clear, planned order", "zh": "有條理地安排；整理", "word": "Organized"}, "B": {"pos": "v.", "en": "put in order according to quality or importance", "zh": "排名；分等級", "word": "Ranked"}, "C": {"pos": "v.", "en": "planned for a particular time", "zh": "排定時間；安排日程", "word": "Scheduled"}, "D": {"pos": "v.", "en": "talked or written about", "zh": "討論", "word": "Discussed"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: arranged means organized", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The manuscript room is carefully _______ so that visitors can move from early drafts to final editions without needing a separate guide.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The manuscript room is carefully _______ so that visitors can move from early drafts to final editions without needing a separate guide.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。手稿室經過仔細的 _______，讓參觀者不需要另外的導覽，就能從早期草稿一路看到最終版本。", "opts": {"A": "organized", "B": "debated", "C": "scheduled", "D": "ranked"}, "optsZh": {"A": "organized（有組織地安排）", "B": "debated（辯論）", "C": "scheduled（排定時程）", "D": "ranked（排名）"}, "answer": "A", "expl": "Organized means arranged.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "arranged in a planned and orderly way", "zh": "有條理地安排；組織", "word": "organized"}, "B": {"pos": "v.", "en": "discussed different opinions formally", "zh": "辯論；討論", "word": "debated"}, "C": {"pos": "v.", "en": "planned for a particular time", "zh": "排定時間", "word": "scheduled"}, "D": {"pos": "v.", "en": "put in order according to quality or importance", "zh": "排名；分等級", "word": "ranked"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: arranged means organized", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> was _______ by region, with textiles from coastal communities displayed before those from inland villages.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition was _______ by region, with textiles from coastal communities displayed before those from inland villages.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這場展覽按地區 _______，沿海社群的紡織品陳列在內陸村落的紡織品之前。", "opts": {"A": "discussed", "B": "delayed", "C": "ignored", "D": "arranged"}, "optsZh": {"A": "discussed（討論）", "B": "delayed（延誤、推遲）", "C": "ignored（被忽視的）", "D": "arranged（安排、排列）"}, "answer": "D", "expl": "Arranged means organized.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "talked about something", "zh": "討論", "word": "discussed"}, "B": {"pos": "v.", "en": "made something happen later than planned", "zh": "延遲；推遲", "word": "delayed"}, "C": {"pos": "v.", "en": "paid no attention to something", "zh": "忽視", "word": "ignored"}, "D": {"pos": "v.", "en": "put in a particular order or position", "zh": "排列；安排", "word": "arranged"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: arranged means organized", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The archive&#x27;s letters are _______ chronologically, allowing researchers to follow the writer&#x27;s changing views over time.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The archive's letters are _______ chronologically, allowing researchers to follow the writer's changing views over time.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。檔案館的信件按時間順序 _______，讓研究人員能追蹤這位作家觀點隨時間的變化。", "opts": {"A": "hidden", "B": "postponed", "C": "ordered", "D": "ranked"}, "optsZh": {"A": "hidden（隱藏的）", "B": "postponed（延後、延期）", "C": "ordered（依序排列的）", "D": "ranked（排名）"}, "answer": "C", "expl": "Ordered means arranged or organized.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "kept out of sight; not easily seen", "zh": "隱藏的；隱蔽的", "word": "hidden"}, "B": {"pos": "v.", "en": "delayed something to a later time", "zh": "延後；推遲", "word": "postponed"}, "C": {"pos": "v.", "en": "arranged in a particular sequence", "zh": "依序排列", "word": "ordered"}, "D": {"pos": "v.", "en": "put in order according to quality or importance", "zh": "排名；分等級", "word": "ranked"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: arranged means organized", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\ ence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The classroom desks were _______ in a semicircle so that students could see one another during discussion.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The classroom desks were _______ in a semicircle so that students could see one another during discussion.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。教室的課桌被 _______ 成半圓形，讓學生在討論時能看到彼此。", "opts": {"A": "positioned", "B": "ranked", "C": "discussed", "D": "scheduled"}, "optsZh": {"A": "positioned（放置、安置）", "B": "ranked（排名）", "C": "discussed（討論）", "D": "scheduled（排定時程）"}, "answer": "A", "expl": "Positioned means arranged.", "explZh": "" ar, so engineers must plan for both floods and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=drought\" target=\"_blank\" rel=\"noopener\" data-w=\"drought\" data-pos=\"n.\" data-en=\"a long period with little or no rain\" data-zh=\"乾旱\">droughts<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The river's flow is not _______ throughout the year, so engineers must plan for both floods and droughts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這條河的流量一年四季並不 _______，因此工程師必須同時為洪水和乾旱做規劃。", "opts": {"A": "accidental", "B": "confident", "C": "constant", "D": "expensive"}, "optsZh": {"A": "accidental（意外的、偶然的）", "B": "confident（有自信的）", "C": "constant（常數；恆定值）", "D": "expensive（昂貴的）"}, "answer": "C", "expl": "Constant means consistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "B": {"pos": "adj.", "en": "feeling sure of oneself or of something", "zh": "有信心的；自信的；確信的", "word": "confident"}, "C": {"pos": "adj.", "en": "happening all the time or staying the same", "zh": "持續的；不變的", "word": "constant"}, "D": {"pos": "adj.", "en": "costing a lot of money", "zh": "昂貴的", "word": "expensive"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: wave power not consistent", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Because wind speed is rarely _______ from hour to hour, turbines require storage systems or backup sources.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Because wind speed is rarely _______ from hour to hour, turbines require storage systems or backup sources.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。由於風速每小時之間很少 _______，風力渦輪機需要儲能系統或備用電源。", "opts": {"A": "stable", "B": "accidental", "C": "expensive", "D": "confident"}, "optsZh": {"A": "stable（穩定的）", "B": "accidental（意外的、偶然的）", "C": "expensive（昂貴的）", "D": "confident（有自信的）"}, "answer": "A", "expl": "Stable means consistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not likely to change suddenly", "zh": "穩定的", "word": "stable"}, "B": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "C": {"pos": "adj.", "en": "costing a lot of money", "zh": "昂貴的", "word": "expensive"}, "D": {"pos": "adj.", "en": "feeling sure of oneself or of something", "zh": "有信心的；自信的；確信的", "word": "confident"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: wave power not consistent", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The signal from the old satellite is no longer _______; brief <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interruption\" target=\"_blank\" rel=\"noopener\" data-w=\"interruption\" data-pos=\"n.\" data-en=\"a break that stops something from continuing\" data-zh=\"中斷；打斷\">interruptions<\/a> make the data difficult to use.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The signal from the old satellite is no longer _______; brief interruptions make the data difficult to use.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這顆舊衛星的訊號已不再 _______；短暫的中斷使資料難以使用。", "opts": {"A": "confident", "B": "dependable", "C": "expensive", "D": "accidental"}, "optsZh": {"A": "confident（有自信的）", "B": "dependable（可靠的）", "C": "expensive（昂貴的）", "D": "accidental（意外的、偶然的）"}, "answer": "B", "expl": "Dependable means consistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "feeling sure of oneself or of something", "zh": "有信心的；自信的；確信的", "word": "confident"}, "B": {"pos": "adj.", "en": "able to be trusted to work or behave as expected", "zh": "可靠的", "word": "dependable"}, "C": {"pos": "adj.", "en": "costing a lot of money", "zh": "昂貴的", "word": "expensive"}, "D": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: wave power not consistent", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The spring&#x27;s water <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> is unusually _______ even when air temperatures shift dramatically.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The spring's water temperature is unusually _______ even when air temperatures shift dramatically.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。即使氣溫劇烈變化，這處泉水的水溫仍異常 _______。", "opts": {"A": "costly", "B": "secretive", "C": "accidental", "D": "steady"}, "optsZh": {"A": "costly（代價高昂的、昂貴的）", "B": "secretive（隱密的、守口如瓶的）", "C": "accidental（意外的、偶然的）", "D": "steady（穩定的、平穩的）"}, "answer": "D", "expl": "Steady means consistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "costing a lot of money or causing loss", "zh": "昂貴的；代價高的", "word": "costly"}, "B": {"pos": "adj.", "en": "tending to hide feelings, plans, or information", "zh": "隱密的；守口如瓶的", "word": "secretive"}, "C": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "D": {"pos": "adj.", "en": "continuing in a regular, even way", "zh": "穩定的；平穩的", "word": "steady"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: interpret difficult poems", "vocab": true, "body": "Due to their often strange images, highly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=syntax\" target=\"_blank\" rel=\"noopener\" data-w=\"syntax\" data-pos=\"n.\" data-en=\"the way words are arranged to form sentences\" data-zh=\"句法；語法結構\">syntax<\/a>, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opaque\" target=\"_blank\" rel=\"noopener\" data-w=\"opaque\" data-pos=\"adj.\" data-en=\"hard to understand; not clear\" data-zh=\"晦澀的；難懂的\">opaque<\/a> subject matter, many of John Ashbery’s poems can be quite difficult to ______ and thus are the object of heated debate among <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a>.", "bodyPlain": "Due to their often strange images, highly experimental syntax, and opaque subject matter, many of John Ashbery’s poems can be quite difficult to ______ and thus are the object of heated debate among scholars.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "由於 John Ashbery 的許多詩作常有奇特的意象、極具實驗性的句法和晦澀的主題，這些詩可能相當難以 ______，因此成為學者之間激烈爭論的對象。", "opts": {"A": "delegate", "B": "compose", "C": "interpret", "D": "renounce"}, "optsZh": {"A": "delegate（委派、授權）", "B": "compose（創作；組成）", "C": "interpret（詮釋；理解）", "D": "renounce（放棄、宣布放棄）"}, "answer": "C", "expl": "Strange images, experimental syntax, and opaque subject matter make the poems hard to understand, so they are difficult to interpret and debated by scholars.", "explZh": "奇特的意象、實驗性的句法和晦澀的主題使這些詩難以理解，因此難以詮釋（interpret），引起學者爭論。", "defs": {"A": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}, "B": {"pos": "v.", "en": "to write or create something such as music or a poem; to make up", "zh": "創作；組成；構成", "word": "compose"}, "C": {"pos": "v.", "en": "to explain or understand the meaning of something", "zh": "詮釋；解讀；理解", "word": "interpret"}, "D": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: interpret difficult poems", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The poem&#x27;s dense allusions and abrupt shifts make it difficult to _______ without careful attention to historical context.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The poem's dense allusions and abrupt shifts make it difficult to _______ without careful attention to historical context.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這首詩密集的典故和突兀的轉折，使人若不仔細留意歷史背景就很難 _______ 它。", "opts": {"A": "compose", "B": "interpret", "C": "renounce", "D": "delegate"}, "optsZh": {"A": "compose（創作；組成）", "B": "interpret（詮釋；理解）", "C": "renounce（放棄、宣布放棄）", "D": "delegate（委派、授權）"}, "answer": "B", "expl": "Interpret means explain meaning.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to write or create something such as music or a poem; to make up", "zh": "創作；組成；構成", "word": "compose"}, "B": {"pos": "v.", "en": "to explain or understand the meaning of something", "zh": "詮釋；解讀；理解", "word": "interpret"}, "C": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}, "D": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: interpret difficult poems", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Because the inscription is damaged, scholars disagree about how to _______ the final line.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Because the inscription is damaged, scholars disagree about how to _______ the final line.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。由於銘文受損，學者們對於如何 _______ 最後一行看法不一。", "opts": {"A": "compose", "B": "renounce", "C": "delegate", "D": "construe"}, "optsZh": {"A": "compose（創作；組成）", "B": "renounce（放棄、宣布放棄）", "C": "delegate（委派、授權）", "D": "construe（解讀、理解）"}, "answer": "D", "expl": "Construe means interpret.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to write or create something such as music or a poem; to make up", "zh": "創作；組成；構成", "word": "compose"}, "B": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}, "C": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}, "D": {"pos": "v.", "en": "to understand or explain the meaning of something in a particular way", "zh": "解讀；理解", "word": "construe"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: interpret difficult poems", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The film&#x27;s ending is intentionally ambiguous and can be _______ as either hopeful or ironic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The film's ending is intentionally ambiguous and can be _______ as either hopeful or ironic.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這部電影的結局刻意模稜兩可，可以被 _______ 為充滿希望或帶有諷刺意味。", "opts": {"A": "renounced", "B": "composed", "C": "delegated", "D": "read"}, "optsZh": {"A": "renounced（放棄、宣布斷絕）", "B": "composed（組成、創作）", "C": "delegated（委派、授權）", "D": "read（解讀、理解）"}, "answer": "D", "expl": "Read means interpreted.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "formally gave up a claim, belief, or right", "zh": "放棄；宣布斷絕", "word": "renounced"}, "B": {"pos": "v.", "en": "wrote or created (music, poetry, etc.)", "zh": "創作；組成", "word": "composed"}, "C": {"pos": "v.", "en": "gave a task or responsibility to someone else", "zh": "委派；授權", "word": "delegated"}, "D": {"pos": "v.", "en": "to understand or interpret something in a particular way", "zh": "解讀；理解", "word": "read"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: interpret difficult poems", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Archaeologists struggled to _______ the symbols until a bilingual tablet provided clues.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Archaeologists struggled to _______ the symbols until a bilingual tablet provided clues.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。考古學家一直難以 _______ 這些符號，直到一塊雙語石板提供了線索。", "opts": {"A": "decipher", "B": "renounce", "C": "delegate", "D": "compose"}, "optsZh": {"A": "decipher（解讀、破解）", "B": "renounce（放棄、宣布放棄）", "C": "delegate（委派、授權）", "D": "compose（創作；組成）"}, "answer": "A", "expl": "Decipher means interpret.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to figure out the meaning of something difficult to read or understand", "zh": "解讀；破譯；辨認", "word": "decipher"}, "B": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}, "C": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}, "D": {"pos": "v.", "en": "to write or create something such as music or a poem; to make up", "zh": "創作；組成；構成", "word": "compose"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: interpret difficult poems", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The critic argues that the novel should be _______ as a satire rather than as a straightforward romance.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The critic argues that the novel should be _______ as a satire rather than as a straightforward romance.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位評論家主張，這部小說應該被 _______ 為諷刺作品，而不是單純的愛情故事。", "opts": {"A": "delegated", "B": "composed", "C": "understood", "D": "abandoned"}, "optsZh": {"A": "delegated（委派、授權）", "B": "composed（組成、創作）", "C": "understood（理解）", "D": "abandoned（被拋棄的、放棄的）"}, "answer": "C", "expl": "Understood means interpreted.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "gave a task or responsibility to someone else", "zh": "委派；授權", "word": "delegated"}, "B": {"pos": "v.", "en": "wrote or created (music, poetry, etc.)", "zh": "創作；組成", "word": "composed"}, "C": {"pos": "v.", "en": "knew the meaning of", "zh": "理解；明白", "word": "understood"}, "D": {"pos": "v.", "en": "left behind or given up completely", "zh": "拋棄；放棄", "word": "abandoned"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: not confined to Spain", "vocab": true, "body": "Diego Velázquez was the leading artist in the court of King Philip IV of Spain during the seventeenth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=century\" target=\"_blank\" rel=\"noopener\" data-w=\"century\" data-pos=\"n.\" data-en=\"a period of 100 years\" data-zh=\"世紀\">century<\/a>, but his influence was hardly _______ Spain: <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=realist\" target=\"_blank\" rel=\"noopener\" data-w=\"realist\" data-pos=\"adj.\" data-en=\"showing people and things as they really are\" data-zh=\"寫實主義的\">realist<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=impressionist\" target=\"_blank\" rel=\"noopener\" data-w=\"impressionist\" data-pos=\"adj.\" data-en=\"relating to a style of painting that shows the effects of light and color\" data-zh=\"印象派的\">impressionist<\/a> painters around the world employed his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">techniques<\/a> and echoed elements of his style.", "bodyPlain": "Diego Velázquez was the leading artist in the court of King Philip IV of Spain during the seventeenth century, but his influence was hardly _______ Spain: realist and impressionist painters around the world employed his techniques and echoed elements of his style.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "Diego Velázquez 是十七世紀西班牙國王 Philip IV 宮廷中首屈一指的畫家，但他的影響力絕不 _______ 西班牙：世界各地的寫實主義與印象派畫家都運用他的技法，並呼應他風格中的元素。", "opts": {"A": "derived from", "B": "recognized in", "C": "confined to", "D": "repressed by"}, "optsZh": {"A": "derived from（源自；衍生自）", "B": "recognized in（在…受到認可）", "C": "confined to（侷限於…）", "D": "repressed by（受…壓制）"}, "answer": "C", "expl": "Painters 'around the world' used his techniques, so his influence was not limited—'hardly confined to'—Spain.", "explZh": "「世界各地」的畫家都運用他的技法，所以他的影響力絕不侷限於（confined to）西班牙。", "defs": {"A": {"pos": "v. phr.", "en": "coming or developed from", "zh": "源自……；由……衍生", "word": "derived from"}, "B": {"w": "recognized", "pos": "phr.", "en": "acknowledged or accepted as important in a place", "zh": "在…受到認可", "word": "recognized"}, "C": {"w": "confined", "pos": "phr.", "en": "kept within the limits of a place or group", "zh": "侷限於…", "word": "confined"}, "D": {"w": "repressed", "pos": "phr.", "en": "held back or controlled by force", "zh": "受…壓制", "word": "repressed"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: not confined to Spain", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The architect&#x27;s influence was not _______ his home city; builders across the continent adopted his open courtyards and shaded arcades.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The architect's influence was not _______ his home city; builders across the continent adopted his open courtyards and shaded arcades.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位建築師的影響力並不 _______ 他的家鄉城市；整個大陸的建造者都採用了他的開放式中庭和遮蔭拱廊。", "opts": {"A": "repressed by", "B": "derived from", "C": "recognized in", "D": "limited to"}, "optsZh": {"A": "repressed by（受…壓制）", "B": "derived from（源自；衍生自）", "C": "recognized in（在…受到認可）", "D": "limited to（限於…）"}, "answer": "D", "expl": "Limited to means confined to.", "explZh": "", "defs": {"A": {"w": "repressed", "pos": "phr.", "en": "held back or controlled by force", "zh": "受…壓制", "word": "repressed"}, "B": {"pos": "v. phr.", "en": "coming or developed from", "zh": "源自……；由……衍生", "word": "derived from"}, "C": {"w": "recognized", "pos": "phr.", "en": "acknowledged or accepted as important in a place", "zh": "在…受到認可", "word": "recognized"}, "D": {"w": "limited", "pos": "phr.", "en": "existing only within a certain area or group", "zh": "限於…", "word": "limited"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: not confined to Spain", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The singer&#x27;s popularity was hardly _______ one region, as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> of her performances <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulated<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=international\" target=\"_blank\" rel=\"noopener\" data-w=\"international\" data-pos=\"adj.\" data-en=\"involving more than one country\" data-zh=\"國際的\">internationally<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The singer's popularity was hardly _______ one region, as recordings of her performances circulated internationally.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這位歌手的人氣絕不 _______ 單一地區，因為她的演出錄音在國際間流傳。", "opts": {"A": "repressed by", "B": "recognized in", "C": "confined to", "D": "derived from"}, "optsZh": {"A": "repressed by（受…壓制）", "B": "recognized in（在…受到認可）", "C": "confined to（侷限於…）", "D": "derived from（源自；衍生自）"}, "answer": "C", "expl": "Confined to means restricted to.", "explZh": "", "defs": {"A": {"w": "repressed", "pos": "phr.", "en": "held back or controlled by force", "zh": "受…壓制", "word": "repressed"}, "B": {"w": "recognized", "pos": "phr.", "en": "acknowledged or accepted as important in a place", "zh": "在…受到認可", "word": "recognized"}, "C": {"w": "confined", "pos": "phr.", "en": "kept within the limits of a place or group", "zh": "侷限於…", "word": "confined"}, "D": {"pos": "v. phr.", "en": "coming or developed from", "zh": "源自……；由……衍生", "word": "derived from"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: not confined to Spain", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The reform&#x27;s effects were not _______ the capital; rural schools also changed their curricula within a decade.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The reform's effects were not _______ the capital; rural schools also changed their curricula within a decade.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這項改革的影響並不 _______ 首都；鄉村學校也在十年內改變了課程。", "opts": {"A": "restricted to", "B": "derived from", "C": "repressed by", "D": "recognized in"}, "optsZh": {"A": "restricted to（限於…）", "B": "derived from（源自；衍生自）", "C": "repressed by（受…壓制）", "D": "recognized in（在…受到認可）"}, "answer": "A", "expl": "Restricted to means confined to.", "explZh": "", "defs": {"A": {"w": "restricted", "pos": "phr.", "en": "limited to a particular area, group, or use", "zh": "限於…", "word": "restricted"}, "B": {"pos": "v. phr.", "en": "coming or developed from", "zh": "源自……；由……衍生", "word": "derived from"}, "C": {"w": "repressed", "pos": "phr.", "en": "held back or controlled by force", "zh": "受…壓制", "word": "repressed"}, "D": {"w": "recognized", "pos": "phr.", "en": "acknowledged or accepted as important in a place", "zh": "在…受到認可", "word": "recognized"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: not confined to Spain", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The painter&#x27;s techniques were not _______ France, since artists in Brazil and Japan adapted them almost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The painter's techniques were not _______ France, since artists in Brazil and Japan adapted them almost immediately.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這位畫家的技法並不 _______ 法國，因為巴西和日本的藝術家幾乎立刻就加以改造運用。", "opts": {"A": "recognized in", "B": "bounded by", "C": "derived from", "D": "repressed by"}, "optsZh": {"A": "recognized in（在…受到認可）", "B": "bounded by（以…為界、受…限制）", "C": "derived from（源自；衍生自）", "D": "repressed by（受…壓制）"}, "answer": "B", "expl": "Bounded by means confined to.", "explZh": "", "defs": {"A": {"w": "recognized", "pos": "phr.", "en": "acknowledged or accepted as important in a place", "zh": "在…受到認可", "word": "recognized"}, "B": {"w": "bounded", "pos": "phr.", "en": "limited or enclosed by something", "zh": "以…為界；受…限制", "word": "bounded"}, "C": {"pos": "v. phr.", "en": "coming or developed from", "zh": "源自……；由……衍生", "word": "derived from"}, "D": {"w": "repressed", "pos": "phr.", "en": "held back or controlled by force", "zh": "受…壓制", "word": "repressed"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: not confined to Spain", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The debate was not _______ academic circles; it soon shaped newspaper editorials and public meetings.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The debate was not _______ academic circles; it soon shaped newspaper editorials and public meetings.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這場辯論並不 _______ 學術圈；它很快就影響了報紙社論和公開集會。", "opts": {"A": "repressed by", "B": "constrained to", "C": "recognized in", "D": "derived from"}, "optsZh": {"A": "repressed by（受…壓制）", "B": "constrained to（受限於…）", "C": "recognized in（在…受到認可）", "D": "derived from（源自；衍生自）"}, "answer": "B", "expl": "Constrained to means limited to.", "explZh": "", "defs": {"A": {"w": "repressed", "pos": "phr.", "en": "held back or controlled by force", "zh": "受…壓制", "word": "repressed"}, "B": {"w": "constrained", "pos": "phr.", "en": "limited or held within something", "zh": "受限於…", "word": "constrained"}, "C": {"w": "recognized", "pos": "phr.", "en": "acknowledged or accepted as important in a place", "zh": "在…受到認可", "word": "recognized"}, "D": {"pos": "v. phr.", "en": "coming or developed from", "zh": "源自……；由……衍生", "word": "derived from"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: field not impenetrable", "vocab": true, "body": "Although science <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fiction\" target=\"_blank\" rel=\"noopener\" data-w=\"fiction\" data-pos=\"n.\" data-en=\"stories about imaginary people and events\" data-zh=\"小說；虛構作品\">fiction<\/a> was dominated mostly by white male authors when Octavia Butler, a Black woman, began writing, she did not view the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=genre\" target=\"_blank\" rel=\"noopener\" data-w=\"genre\" data-pos=\"n.\" data-en=\"a type or category of art, music, or literature\" data-zh=\"文類；類型\">genre<\/a> as _______: Butler broke into the field with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publication\" target=\"_blank\" rel=\"noopener\" data-w=\"publication\" data-pos=\"n.\" data-en=\"a book, magazine, or article that is printed; the act of publishing\" data-zh=\"出版品；發表\">publication<\/a> of several short stories and her 1976 novel Patternmaster, and she later became the first science fiction writer to win a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prestigious\" target=\"_blank\" rel=\"noopener\" data-w=\"prestigious\" data-pos=\"adj.\" data-en=\"respected and admired as very important or of high quality\" data-zh=\"有名望的；聲望高的\">prestigious<\/a> MacArthur Fellowship.", "bodyPlain": "Although science fiction was dominated mostly by white male authors when Octavia Butler, a Black woman, began writing, she did not view the genre as _______: Butler broke into the field with the publication of several short stories and her 1976 novel Patternmaster, and she later became the
