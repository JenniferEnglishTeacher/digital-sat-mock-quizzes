?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free, in part because,", "B": "free in part because", "C": "free. In part because", "D": "free, in part because:"}, "optsZh": {"A": "free, in part because,（逗號＋in part because＋逗號）", "B": "free in part because（無標點，直接接原因子句）", "C": "free. In part because（句號，以 In part because 另起一句）", "D": "free, in part because:（逗號＋in part because＋冒號）"}, "answer": "C", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Grammar: singular subject shape is unique", "vocab": false, "body": "Researchers studying the “terra-cotta army,” the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of life-size <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=statue\" target=\"_blank\" rel=\"noopener\" data-w=\"statue\" data-pos=\"n.\" data-en=\"a figure of a person or animal made of stone, metal, etc.\" data-zh=\"雕像\">statues<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=warrior\" target=\"_blank\" rel=\"noopener\" data-w=\"warrior\" data-pos=\"n.\" data-en=\"a soldier or fighter, especially in the past\" data-zh=\"戰士；武士\">warriors<\/a> found interred near the tomb of Emperor Qin Shi Huang of China, were shocked to realize that the shape of each statue’s ears, like the shape of each person’s ears, _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unique\" target=\"_blank\" rel=\"noopener\" data-w=\"unique\" data-pos=\"adj.\" data-en=\"being the only one of its kind\" data-zh=\"獨特的\">unique<\/a>.", "bodyPlain": "Researchers studying the “terra-cotta army,” the thousands of life-size statues of warriors found interred near the tomb of Emperor Qin Shi Huang of China, were shocked to realize that the shape of each statue’s ears, like the shape of each person’s ears, _______ unique.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究「兵馬俑」——在中國秦始皇陵墓附近出土的數千尊真人大小戰士雕像——的研究人員震驚地發現，每尊雕像耳朵的形狀，就像每個人耳朵的形狀一樣，_______ 獨一無二的。", "opts": {"A": "are", "B": "is", "C": "were", "D": "have been"}, "optsZh": {"A": "are（複數現在式 be 動詞 → 與倒裝後的單數主詞 Josephine St. Pierre Ruffin 不一致：錯誤）", "B": "is（單數現在式被動語態，與 Today 相符：正確）", "C": "were（複數 be 動詞 → 與倒裝後的單數主詞不一致：錯誤）", "D": "have been（複數現在完成式 → 與倒裝後的單數主詞不一致：錯誤）"}, "answer": "B", "expl": "The subject is the singular 'shape' (not 'ears'), and the sentence describes a general fact, so 'is' is correct.", "explZh": "主詞是單數的 shape（不是 ears），而且描述的是普遍事實，所以用 is。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Grammar: singular subject shape is unique", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "published", "B": "having published", "C": "publishing", "D": "to publish"}, "optsZh": {"A": "published（簡單過去式：主要動詞，正確）", "B": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "C": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）", "D": "to publish（不定詞 → 句子缺少主要動詞，錯誤）"}, "answer": "A", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Grammar: singular subject shape is unique", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device--", "B": "device", "C": "device,", "D": "device:"}, "optsZh": {"A": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "B": "device（裝置；設備）", "C": "device,（逗號 → 不當隔開主詞與動詞，錯誤）", "D": "device:（冒號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "B", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Grammar: singular subject shape is unique", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "this", "B": "that", "C": "it", "D": "them"}, "optsZh": {"A": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "C": "it（它；單數代名詞）", "D": "them（他們；複數受格）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Grammar: singular subject shape is unique", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family,", "B": "family, and", "C": "family", "D": "family and"}, "optsZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family, and（逗號＋and）", "C": "family（無標點）", "D": "family and（無標點＋and）"}, "answer": "C", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Grammar: singular subject shape is unique", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free in part because", "B": "free. In part because", "C": "free, in part because:", "D": "free, in part because,"}, "optsZh": {"A": "free in part because（無標點，直接接原因子句）", "B": "free. In part because（句號，以 In part because 另起一句）", "C": "free, in part because:（逗號＋in part because＋冒號）", "D": "free, in part because,（逗號＋in part because＋逗號）"}, "answer": "B", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transition: meanwhile contrasting storylines", "vocab": false, "body": "Chimamanda Ngozi Adichie’s 2013 novel Americanah chronicles the divergent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experiences<\/a> of Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to attend a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prestigious\" target=\"_blank\" rel=\"noopener\" data-w=\"prestigious\" data-pos=\"adj.\" data-en=\"respected and admired as very important or of high quality\" data-zh=\"有名望的；聲望高的\">prestigious<\/a> university. ______ Obinze travels to London, hoping to start a career there. However, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=frustrated\" target=\"_blank\" rel=\"noopener\" data-w=\"frustrated\" data-pos=\"adj.\" data-en=\"annoyed because you cannot change or achieve something\" data-zh=\"沮喪的；受挫的\">frustrated<\/a> with the lack of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opportunity\" target=\"_blank\" rel=\"noopener\" data-w=\"opportunity\" data-pos=\"n.\" data-en=\"a chance to do something\" data-zh=\"機會\">opportunities<\/a>, he soon returns to Nigeria.", "bodyPlain": "Chimamanda Ngozi Adichie’s 2013 novel Americanah chronicles the divergent experiences of Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to attend a prestigious university. ______ Obinze travels to London, hoping to start a career there. However, frustrated with the lack of opportunities, he soon returns to Nigeria.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "Chimamanda Ngozi Adichie 2013 年的小說《Americanah》（美國佬）記述了一對年輕奈及利亞情侶 Ifemelu 和 Obinze 高中畢業後截然不同的經歷。Ifemelu 搬到美國就讀一所著名大學。______ Obinze 前往倫敦，希望在那裡展開事業。然而，由於對缺乏機會感到沮喪，他很快就回到了奈及利亞。", "opts": {"A": "Meanwhile,", "B": "Nevertheless,", "C": "Secondly,", "D": "In fact,"}, "optsZh": {"A": "Meanwhile,（同時、與此同時：表同時發生）", "B": "Nevertheless,（然而、儘管如此：表讓步轉折）", "C": "Secondly,（其次）", "D": "In fact,（事實上；表強調或補充更強的說法）"}, "answer": "A", "expl": "Ifemelu goes to the US while, at the same time, Obinze travels to London; 'Meanwhile' links the simultaneous storylines.", "explZh": "Ifemelu 前往美國，而同一時間 Obinze 前往倫敦；Meanwhile（同時）連接兩條同時發展的故事線。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transition: meanwhile contrasting storylines", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Aisha began graduate school in Toronto. _______ her brother remained in Lagos to start a small design firm.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Aisha began graduate school in Toronto. _______ her brother remained in Lagos to start a small design firm.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。Aisha 在多倫多開始讀研究所。_______ 她的哥哥留在拉哥斯（Lagos）創辦一間小型設計公司。", "opts": {"A": "Nevertheless,", "B": "In fact,", "C": "Secondly,", "D": "Meanwhile,"}, "optsZh": {"A": "Nevertheless,（然而、儘管如此：表讓步轉折）", "B": "In fact,（事實上；表強調或補充更強的說法）", "C": "Secondly,（其次）", "D": "Meanwhile,（同時、與此同時：表同時發生）"}, "answer": "D", "expl": "Meanwhile marks simultaneous contrasting action.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transition: meanwhile contrasting storylines", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=committee\" target=\"_blank\" rel=\"noopener\" data-w=\"committee\" data-pos=\"n.\" data-en=\"a group of people chosen to make decisions about something\" data-zh=\"委員會\">committee<\/a> reviewed the proposal in public. _______ a smaller group met privately to examine the budget.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The committee reviewed the proposal in public. _______ a smaller group met privately to examine the budget.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。委員會公開審查了這項提案。_______ 一個較小的小組私下開會審查預算。", "opts": {"A": "meanwhile,", "B": "Nevertheless,", "C": "Secondly,", "D": "In fact,"}, "optsZh": {"A": "meanwhile,（與此同時）", "B": "Nevertheless,（然而、儘管如此：表讓步轉折）", "C": "Secondly,（其次）", "D": "In fact,（事實上；表強調或補充更強的說法）"}, "answer": "A", "expl": "Meanwhile signals another simultaneous event.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transition: meanwhile contrasting storylines", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The novel follows one character as she studies abroad. _______ her childhood friend tries to build a career at home.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The novel follows one character as she studies abroad. _______ her childhood friend tries to build a career at home.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這部小說描寫一個角色出國留學的經歷。_______ 她的兒時好友則試著在家鄉發展事業。", "opts": {"A": "In fact,", "B": "Secondly,", "C": "Meanwhile,", "D": "Nevertheless,"}, "optsZh": {"A": "In fact,（事實上；表強調或補充更強的說法）", "B": "Secondly,（其次）", "C": "Meanwhile,（同時、與此同時：表同時發生）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "C", "expl": "Meanwhile introduces a parallel storyline.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transition: meanwhile contrasting storylines", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The eastern team collected soil samples. _______ the western team interviewed farmers about irrigation practices.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The eastern team collected soil samples. _______ the western team interviewed farmers about irrigation practices.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。東區小組採集土壤樣本。_______ 西區小組訪問農民有關灌溉方式的問題。", "opts": {"A": "In fact,", "B": "Meanwhile,", "C": "Secondly,", "D": "Nevertheless,"}, "optsZh": {"A": "In fact,（事實上；表強調或補充更強的說法）", "B": "Meanwhile,（同時、與此同時：表同時發生）", "C": "Secondly,（其次）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "B", "expl": "Meanwhile shows simultaneous activity.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transition: meanwhile contrasting storylines", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The orchestra rehearsed on the main stage. _______ technicians adjusted the lighting from the control booth.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The orchestra rehearsed on the main stage. _______ technicians adjusted the lighting from the control booth.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。管弦樂團在主舞台上排練。_______ 技術人員在控制室裡調整燈光。", "opts": {"A": "Nevertheless,", "B": "Secondly,", "C": "Meanwhile,", "D": "In fact,"}, "optsZh": {"A": "Nevertheless,（然而、儘管如此：表讓步轉折）", "B": "Secondly,（其次）", "C": "Meanwhile,（同時、與此同時：表同時發生）", "D": "In fact,（事實上；表強調或補充更強的說法）"}, "answer": "C", "expl": "Meanwhile indicates at the same time.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transition: additionally adds second concern", "vocab": false, "body": "Some members of the US Supreme Court have resisted calls to televise the court’s oral arguments, concerned that the participants would be tempted to perform for the cameras (and thus lower the quality of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discourse\" target=\"_blank\" rel=\"noopener\" data-w=\"discourse\" data-pos=\"n.\" data-en=\"serious discussion or debate\" data-zh=\"論述；討論\">discourse<\/a>). _______ the justices worry that most viewers would not even watch the full <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberation\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberation\" data-pos=\"n.\" data-en=\"careful discussion before a decision\" data-zh=\"審議；仔細討論\">deliberations<\/a>, only short clips that could be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=misinterpret\" target=\"_blank\" rel=\"noopener\" data-w=\"misinterpret\" data-pos=\"v.\" data-en=\"to understand something wrongly\" data-zh=\"誤解；曲解\">misinterpreted<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mischaracterize\" target=\"_blank\" rel=\"noopener\" data-w=\"mischaracterize\" data-pos=\"v.\" data-en=\"to describe something in a false or misleading way\" data-zh=\"錯誤描述；曲解\">mischaracterized<\/a>.", "bodyPlain": "Some members of the US Supreme Court have resisted calls to televise the court’s oral arguments, concerned that the participants would be tempted to perform for the cameras (and thus lower the quality of the discourse). _______ the justices worry that most viewers would not even watch the full deliberations, only short clips that could be misinterpreted and mischaracterized.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "美國最高法院的一些大法官拒絕了轉播法院言詞辯論的呼籲，擔心參與者會忍不住對著鏡頭表演（進而降低論辯的品質）。_______ 大法官們擔心大多數觀眾甚至不會看完整的審議過程，只會看到可能被誤解和曲解的短片段。", "opts": {"A": "However,", "B": "Additionally,", "C": "In comparison,", "D": "For example,"}, "optsZh": {"A": "However,（然而：表轉折）", "B": "Additionally,（此外：表補充）", "C": "In comparison,（相較之下：表比較）", "D": "For example,（例如：表舉例）"}, "answer": "B", "expl": "The second sentence adds another concern of the justices, so 'Additionally' fits.", "explZh": "第二句補充大法官的另一個顧慮，因此用 Additionally（此外）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transition: additionally adds second concern", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The proposal may encourage speakers to perform for cameras. _______ short clips could distort the meaning of longer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberation\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberation\" data-pos=\"n.\" data-en=\"careful discussion before a decision\" data-zh=\"審議；仔細討論\">deliberations<\/a>.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The proposal may encourage speakers to perform for cameras. _______ short clips could distort the meaning of longer deliberations.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這項提案可能會促使發言者對著鏡頭表演。_______ 短片段可能會扭曲較長審議內容的意義。", "opts": {"A": "For example,", "B": "In comparison,", "C": "Additionally,", "D": "However,"}, "optsZh": {"A": "For example,（例如：表舉例）", "B": "In comparison,（相較之下：表比較）", "C": "Additionally,（此外：表補充）", "D": "However,（然而：表轉折）"}, "answer": "C", "expl": "Additionally adds another concern.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transition: additionally adds second concern", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The new highway could disturb <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=wetland\" target=\"_blank\" rel=\"noopener\" data-w=\"wetland\" data-pos=\"n.\" data-en=\"land that is often covered with water, such as a marsh\" data-zh=\"濕地\">wetlands<\/a>. _______ it may increase traffic in nearby residential streets.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The new highway could disturb wetlands. _______ it may increase traffic in nearby residential streets.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。新的高速公路可能會干擾濕地。_______ 它可能會增加附近住宅區街道的交通量。", "opts": {"A": "However,", "B": "In comparison,", "C": "For example,", "D": "additionally,"}, "optsZh": {"A": "However,（然而：表轉折）", "B": "In comparison,（相較之下：表比較）", "C": "For example,（例如：表舉例）", "D": "additionally,（此外：表補充另一個理由，正確）"}, "answer": "D", "expl": "Additionally adds a second issue.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transition: additionally adds second concern", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The policy would be expensive to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=administer\" target=\"_blank\" rel=\"noopener\" data-w=\"administer\" data-pos=\"v.\" data-en=\"to manage or provide something officially\" data-zh=\"管理；執行；提供\">administer<\/a>. _______ it could create confusion for small businesses.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The policy would be expensive to administer. _______ it could create confusion for small businesses.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這項政策的執行成本會很高。_______ 它可能會讓小型企業感到困惑。", "opts": {"A": "In comparison,", "B": "Additionally,", "C": "However,", "D": "For example,"}, "optsZh": {"A": "In comparison,（相較之下：表比較）", "B": "Additionally,（此外：表補充）", "C": "However,（然而：表轉折）", "D": "For example,（例如：表舉例）"}, "answer": "B", "expl": "Additionally adds another point.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transition: additionally adds second concern", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The device is difficult to repair. _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=replacement\" target=\"_blank\" rel=\"noopener\" data-w=\"replacement\" data-pos=\"n.\" data-en=\"a thing that takes the place of another\" data-zh=\"替代品\">replacement<\/a> parts are available from only one supplier.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The device is difficult to repair. _______ replacement parts are available from only one supplier.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這個裝置很難修理。_______ 替換零件只有一家供應商提供。", "opts": {"A": "Additionally,", "B": "For example,", "C": "In comparison,", "D": "However,"}, "optsZh": {"A": "Additionally,（此外：表補充）", "B": "For example,（例如：表舉例）", "C": "In comparison,（相較之下：表比較）", "D": "However,（然而：表轉折）"}, "answer": "A", "expl": "Additionally adds information.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transition: additionally adds second concern", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The archive lacks climate control. _______ many of its oldest documents have not yet been digitized.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archive lacks climate control. _______ many of its oldest documents have not yet been digitized.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這座檔案館缺乏溫濕度控制。_______ 它許多最古老的文件還沒有數位化。", "opts": {"A": "Additionally,", "B": "However,", "C": "In comparison,", "D": "For example,"}, "optsZh": {"A": "Additionally,（此外：表補充）", "B": "However,（然而：表轉折）", "C": "In comparison,（相較之下：表比較）", "D": "For example,（例如：表舉例）"}, "answer": "A", "expl": "Additionally adds a further concern.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transition: thus states implication", "vocab": false, "body": "The more diverse and wide ranging an animal’s behaviors, the larger and more energy demanding the animal’s brain tends to be. ______ from an evolutionary <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspective<\/a>, animals that perform only basic actions should allocate fewer resources to growing and maintaining brain tissue. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> subtypes of ants within colonies provide an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opportunity\" target=\"_blank\" rel=\"noopener\" data-w=\"opportunity\" data-pos=\"n.\" data-en=\"a chance to do something\" data-zh=\"機會\">opportunity<\/a> to explore this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a>.", "bodyPlain": "The more diverse and wide ranging an animal’s behaviors, the larger and more energy demanding the animal’s brain tends to be. ______ from an evolutionary perspective, animals that perform only basic actions should allocate fewer resources to growing and maintaining brain tissue. The specialized subtypes of ants within colonies provide an opportunity to explore this hypothesis.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "動物的行為越多樣、範圍越廣，牠的大腦往往就越大、越耗能。______ 從演化的角度來看，只執行基本動作的動物應該分配較少的資源來生長和維持腦組織。蟻群中特化的螞蟻亞型提供了一個探究這項假說的機會。", "opts": {"A": "Subsequently,", "B": "Besides,", "C": "Nevertheless,", "D": "Thus,"}, "optsZh": {"A": "Subsequently,（隨後：表時間先後）", "B": "Besides,（此外、況且：表補充）", "C": "Nevertheless,（然而、儘管如此：表讓步轉折）", "D": "Thus,（因此：表結果或推論）"}, "answer": "D", "expl": "The second sentence draws a logical conclusion from the first (simpler behavior → smaller brain investment), so 'Thus' fits.", "explZh": "第二句是由第一句推出的結論（行為簡單 → 投入大腦的資源較少），因此用 Thus（因此）。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transition: thus states implication", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Specialist ants perform narrower sets of tasks than generalist workers. _______ they may require less neural tissue to support their behavior.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Specialist ants perform narrower sets of tasks than generalist workers. _______ they may require less neural tissue to support their behavior.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。專職螞蟻執行的任務範圍比通才工蟻窄。_______ 牠們可能需要較少的神經組織來支持其行為。", "opts": {"A": "Besides,", "B": "Thus,", "C": "Subsequently,", "D": "Nevertheless,"}, "optsZh": {"A": "Besides,（此外、況且：表補充）", "B": "Thus,（因此：表結果或推論）", "C": "Subsequently,（隨後：表時間先後）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "B", "expl": "Thus introduces a logical conclusion.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transition: thus states implication", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The animal&#x27;s diet requires only simple foraging movements. _______ its brain may be smaller than that of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> with more varied behaviors.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The animal's diet requires only simple foraging movements. _______ its brain may be smaller than that of a species with more varied behaviors.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這種動物的飲食只需要簡單的覓食動作。_______ 牠的大腦可能比行為更多樣的物種小。", "opts": {"A": "Subsequently,", "B": "Nevertheless,", "C": "Besides,", "D": "thus,"}, "optsZh": {"A": "Subsequently,（隨後：表時間先後）", "B": "Nevertheless,（然而、儘管如此：表讓步轉折）", "C": "Besides,（此外、況且：表補充）", "D": "thus,（因此：表由前述推出的結論，正確）"}, "answer": "D", "expl": "Thus states the implication.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transition: thus states implication", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The larvae remain fixed in one place after hatching. _______ they have little need for sensory systems used in navigation.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The larvae remain fixed in one place after hatching. _______ they have little need for sensory systems used in navigation.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這些幼蟲孵化後會固定在同一個地方。_______ 牠們幾乎不需要用於導航的感覺系統。", "opts": {"A": "Subsequently,", "B": "Besides,", "C": "Thus,", "D": "Nevertheless,"}, "optsZh": {"A": "Subsequently,（隨後：表時間先後）", "B": "Besides,（此外、況且：表補充）", "C": "Thus,（因此：表結果或推論）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "C", "expl": "Thus signals result.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transition: thus states implication", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The tool is used for a single repetitive task. _______ its design can be simpler than that of a multipurpose <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrument<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The tool is used for a single repetitive task. _______ its design can be simpler than that of a multipurpose instrument.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這個工具只用於單一的重複性工作。_______ 它的設計可以比多功能器具更簡單。", "opts": {"A": "Nevertheless,", "B": "Thus,", "C": "Subsequently,", "D": "Besides,"}, "optsZh": {"A": "Nevertheless,（然而、儘管如此：表讓步轉折）", "B": "Thus,（因此：表結果或推論）", "C": "Subsequently,（隨後：表時間先後）", "D": "Besides,（此外、況且：表補充）"}, "answer": "B", "expl": "Thus marks conclusion.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transition: thus states implication", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accidental\" target=\"_blank\" rel=\"noopener\" data-w=\"accidental\" data-pos=\"adj.\" data-en=\"happening by chance, not on purpose\" data-zh=\"意外的；偶然的\">accidental<\/a>. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The organism relies on chemical cues rather than complex vision. _______ it may devote fewer resources to visual processing.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The organism relies on chemical cues rather than complex vision. _______ it may devote fewer resources to visual processing.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這種生物依賴化學訊號而非複雜的視覺。_______ 牠可能投入較少的資源在視覺處理上。", "opts": {"A": "Thus,", "B": "Nevertheless,", "C": "Besides,", "D": "Subsequently,"}, "optsZh": {"A": "Thus,（因此：表結果或推論）", "B": "Nevertheless,（然而、儘管如此：表讓步轉折）", "C": "Besides,（此外、況且：表補充）", "D": "Subsequently,（隨後：表時間先後）"}, "answer": "A", "expl": "Thus introduces inference.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transition: by contrast reaction ceases", "vocab": false, "body": "A firefly uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> muscles to draw oxygen into its lower abdomen through narrow tubes, triggering a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> reaction whereby the oxygen combines with chemicals in the firefly’s abdomen to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a glow. _______ when the firefly stops drawing in oxygen, the reaction—and the glow—cease.", "bodyPlain": "A firefly uses specialized muscles to draw oxygen into its lower abdomen through narrow tubes, triggering a chemical reaction whereby the oxygen combines with chemicals in the firefly’s abdomen to produce a glow. _______ when the firefly stops drawing in oxygen, the reaction—and the glow—cease.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "螢火蟲利用特化的肌肉，透過細窄的管道把氧氣吸入下腹部，引發一種化學反應，讓氧氣與螢火蟲腹部的化學物質結合而產生光。_______ 當螢火蟲停止吸入氧氣時，這個反應——以及光——就會停止。", "opts": {"A": "For instance,", "B": "By contrast,", "C": "Specifically,", "D": "In conclusion,"}, "optsZh": {"A": "For instance,（例如：表舉例）", "B": "By contrast,（相對地：表對比）", "C": "Specifically,（具體來說：表進一步說明細節）", "D": "In conclusion,（總之：表總結 → 錯誤）"}, "answer": "B", "expl": "The first sentence describes what happens when oxygen is drawn in; the second describes the opposite situation, when it stops, so 'By contrast' fits.", "explZh": "第一句描述吸入氧氣時的情況，第二句描述相反情況（停止吸入時），因此用 By contrast（相較之下）。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transition: by contrast reaction ceases", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The reaction begins when oxygen enters the chamber. _______ when oxygen is withdrawn, the reaction stops almost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The reaction begins when oxygen enters the chamber. _______ when oxygen is withdrawn, the reaction stops almost immediately.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。當氧氣進入反應室時，反應就會開始。_______ 當氧氣被抽離時，反應幾乎立刻停止。", "opts": {"A": "By contrast,", "B": "In conclusion,", "C": "Specifically,", "D": "For instance,"}, "optsZh": {"A": "By contrast,（相對地：表對比）", "B": "In conclusion,（總之：表總結 → 錯誤）", "C": "Specifically,（具體來說：表進一步說明細節）", "D": "For instance,（例如：表舉例）"}, "answer": "A", "expl": "By contrast marks the opposite condition.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transition: by contrast reaction ceases", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The fabric expands when exposed to moisture. _______ it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contract\" target=\"_blank\" rel=\"noopener\" data-w=\"contract\" data-pos=\"n.\" data-en=\"a formal agreement between people, often legal\" data-zh=\"契約；合約\">contracts<\/a> as the fibers dry.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The fabric expands when exposed to moisture. _______ it contracts as the fibers dry.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這種布料接觸水氣時會膨脹。_______ 纖維變乾時它就會收縮。", "opts": {"A": "Specifically,", "B": "by contrast,", "C": "For instance,", "D": "In conclusion,"}, "optsZh": {"A": "Specifically,（具體來說：表進一步說明細節）", "B": "by contrast,（相較之下：表對比，正確）", "C": "For instance,（例如：表舉例）", "D": "In conclusion,（總之：表總結 → 錯誤）"}, "answer": "B", "expl": "By contrast introduces the opposite.", "explZh": ""}, {"id": "3
