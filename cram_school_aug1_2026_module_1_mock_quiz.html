<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cram School Digital SAT Mock Test (Aug 1, 2026) - Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>

  <header>
    <h1>Cram School Digital SAT Mock Test (Aug 1, 2026) - Module 1</h1>

  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: choose a word/phrase meaning \"influenced by\" for an artist's creative process.", "vocab": true, "body": "Whether Carmen Lomas Garza is creating small <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">paintings<\/a> and illustrations or large public artworks—such as Baile, a copper cutout of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> Mexican dance in the San Francisco International Airport—she is ______ direct <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a>, drawing from memories of her childhood in Texas or details of her current <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surroundings\" target=\"_blank\" rel=\"noopener\" data-w=\"surroundings\" data-pos=\"n.\" data-en=\"the place and conditions around a person\" data-zh=\"周遭環境\">surroundings<\/a> in California.", "bodyPlain": "Whether Carmen Lomas Garza is creating small paintings and illustrations or large public artworks—such as Baile, a copper cutout of a traditional Mexican dance in the San Francisco International Airport—she is ______ direct experience, drawing from memories of her childhood in Texas or details of her current surroundings in California.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "無論 Carmen Lomas Garza 是在創作小型畫作與插畫，還是大型公共藝術作品——例如舊金山國際機場中以傳統墨西哥舞蹈為題的銅製剪影作品《Baile》——她都 ______ 直接的親身經驗，取材自她在德州的童年回憶，或她目前在加州周遭環境的細節。", "opts": {"A": "complimented by", "B": "uncertain about", "C": "unbothered by", "D": "inspired by"}, "optsZh": {"A": "受到……稱讚", "B": "對……不確定的", "C": "不為……所困擾的", "D": "受到……啟發"}, "answer": "D", "expl": "She draws from memories of her childhood and details of her surroundings, so her art is 'inspired by' direct experience.", "explZh": "她取材於童年回憶與周遭環境的細節，因此她的作品是「受直接經驗啟發（inspired by）」。", "defs": {"A": {"pos": "phr.", "en": "praised by someone or something", "zh": "受到……稱讚", "word": "complimented by"}, "B": {"pos": "phr.", "en": "not sure about", "zh": "對……不確定的", "word": "uncertain about"}, "C": {"pos": "phr.", "en": "not worried or annoyed by", "zh": "不為……所困擾的", "word": "unbothered by"}, "D": {"pos": "phr.", "en": "given ideas or a feeling to create something by", "zh": "受到……啟發", "word": "inspired by"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: choose a word/phrase meaning \"influenced by\" for an artist's creative process.", "vocab": true, "body": "Whether chef Amara Osei is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developing<\/a> a five-course tasting menu or a single street-food dish, she is ______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=seasonal\" target=\"_blank\" rel=\"noopener\" data-w=\"seasonal\" data-pos=\"adj.\" data-en=\"happening only at certain times of year\" data-zh=\"季節性的\">seasonal<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> of her grandmother&#x27;s garden, adapting recipes to reflect whatever vegetables and herbs are ready to harvest that week.", "bodyPlain": "Whether chef Amara Osei is developing a five-course tasting menu or a single street-food dish, she is ______ the seasonal produce of her grandmother's garden, adapting recipes to reflect whatever vegetables and herbs are ready to harvest that week.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "無論主廚 Amara Osei 是在設計五道菜的品嚐套餐，還是單一道街頭小吃，她都 ______ 祖母菜園裡的當季農產，調整食譜以反映當週可以採收的蔬菜和香草。", "opts": {"A": "skeptical of", "B": "indifferent to", "C": "guided by", "D": "unaffected by"}, "optsZh": {"A": "對……抱持懷疑", "B": "對……漠不關心的", "C": "受到……引導", "D": "不受……影響的"}, "answer": "C", "expl": "Adapting recipes to reflect the garden's produce shows the chef is influenced by it.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "doubting that something is true or good", "zh": "對……抱持懷疑", "word": "skeptical of"}, "B": {"pos": "phr.", "en": "not interested in or caring about", "zh": "對……漠不關心的", "word": "indifferent to"}, "C": {"pos": "phr.", "en": "directed or influenced by", "zh": "受到……引導", "word": "guided by"}, "D": {"pos": "phr.", "en": "not changed or influenced by", "zh": "不受……影響的", "word": "unaffected by"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: choose a word/phrase meaning \"influenced by\" for an artist's creative process.", "vocab": true, "body": "Whether composing a symphony for a full <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orchestra\" target=\"_blank\" rel=\"noopener\" data-w=\"orchestra\" data-pos=\"n.\" data-en=\"a large group of musicians who play different instruments together\" data-zh=\"管弦樂團\">orchestra<\/a> or a simple lullaby for solo piano, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=composer\" target=\"_blank\" rel=\"noopener\" data-w=\"composer\" data-pos=\"n.\" data-en=\"a person who writes music\" data-zh=\"作曲家\">composer<\/a> Henrik Larsen is ______ the folk melodies he heard sung in his grandparents&#x27; village, often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=weaving\" target=\"_blank\" rel=\"noopener\" data-w=\"weaving\" data-pos=\"n.\" data-en=\"the craft of making cloth by crossing threads\" data-zh=\"編織\">weaving<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragments<\/a> of those tunes into his own original themes.", "bodyPlain": "Whether composing a symphony for a full orchestra or a simple lullaby for solo piano, composer Henrik Larsen is ______ the folk melodies he heard sung in his grandparents' village, often weaving fragments of those tunes into his own original themes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "無論是為整個管弦樂團創作交響曲，還是為鋼琴獨奏寫一首簡單的搖籃曲，作曲家 Henrik Larsen 都 ______ 他在祖父母村莊聽過的民謠旋律，常把這些曲調的片段融入自己的原創主題中。", "opts": {"A": "dismissive of", "B": "shaped by", "C": "suspicious of", "D": "detached from"}, "optsZh": {"A": "對……不屑一顧的", "B": "受到……塑造", "C": "對……起疑", "D": "與……脫離的；超然於……的"}, "answer": "B", "expl": "Weaving fragments of the folk tunes into his themes shows the composer is influenced by them.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "showing that you think something is not important", "zh": "對……不屑一顧的", "word": "dismissive of"}, "B": {"pos": "phr.", "en": "influenced and formed by", "zh": "受到……塑造", "word": "shaped by"}, "C": {"pos": "phr.", "en": "not trusting someone or something", "zh": "對……起疑", "word": "suspicious of"}, "D": {"pos": "phr.", "en": "not connected to or emotionally involved with", "zh": "與……分離的；超然於……的", "word": "detached from"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: choose a word/phrase meaning \"influenced by\" for an artist's creative process.", "vocab": true, "body": "Whether <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=designing\" target=\"_blank\" rel=\"noopener\">designing<\/a> a modest footbridge or a sprawling museum complex, architect Teodora Voss is ______ the eroded <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=canyon\" target=\"_blank\" rel=\"noopener\" data-w=\"canyon\" data-pos=\"n.\" data-en=\"a deep valley with very steep sides\" data-zh=\"峽谷\">canyon<\/a> walls near her hometown, repeatedly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=echo\" target=\"_blank\" rel=\"noopener\" data-w=\"echo\" data-pos=\"v.\" data-en=\"to repeat or be similar to something earlier\" data-zh=\"呼應；重複\">echoing<\/a> their layered, sweeping curves in the buildings&#x27; facades.", "bodyPlain": "Whether designing a modest footbridge or a sprawling museum complex, architect Teodora Voss is ______ the eroded canyon walls near her hometown, repeatedly echoing their layered, sweeping curves in the buildings' facades.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "無論是設計一座樸素的人行橋，還是龐大的博物館建築群，建築師 Teodora Voss 都 ______ 她家鄉附近被侵蝕的峽谷岩壁，一再在建築外牆上呼應岩壁那層層疊疊、優美延展的曲線。", "opts": {"A": "inspired by", "B": "unconvinced by", "C": "irritated by", "D": "neutral toward"}, "optsZh": {"A": "受到……啟發", "B": "不被……說服的", "C": "被……激怒", "D": "對……保持中立"}, "answer": "A", "expl": "Repeatedly echoing the canyon's curves in her designs shows the architect draws inspiration from them.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "given ideas or a feeling to create something by", "zh": "受到……啟發", "word": "inspired by"}, "B": {"pos": "phr.", "en": "not believing something is true", "zh": "不被……說服的", "word": "unconvinced by"}, "C": {"pos": "phr.", "en": "annoyed by", "zh": "被……激怒的", "word": "irritated by"}, "D": {"pos": "phr.", "en": "not supporting either side; having no strong feeling about", "zh": "對……保持中立", "word": "neutral toward"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: choose a word/phrase meaning \"influenced by\" for an artist's creative process.", "vocab": true, "body": "Whether <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=corresponding\" target=\"_blank\" rel=\"noopener\">corresponding<\/a> with strangers or close friends, poet Miriam Okafor is ______ the handwritten letters her mother saved from decades of family correspondence, often borrowing a phrase or an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">image<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=directly\" target=\"_blank\" rel=\"noopener\" data-w=\"directly\" data-pos=\"adv.\" data-en=\"without anything or anyone in between\" data-zh=\"直接地\">directly<\/a> from their fading pages.", "bodyPlain": "Whether corresponding with strangers or close friends, poet Miriam Okafor is ______ the handwritten letters her mother saved from decades of family correspondence, often borrowing a phrase or an image directly from their fading pages.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "無論是寫信給陌生人還是好友，詩人 Miriam Okafor 都 ______ 母親保存了數十年的手寫家書，常直接從那些褪色的信紙上借用某個詞句或意象。", "opts": {"A": "drawn from", "B": "baffled by", "C": "opposed to", "D": "careless with"}, "optsZh": {"A": "取材於……的", "B": "對……感到困惑", "C": "反對……的", "D": "對……粗心大意"}, "answer": "A", "expl": "Borrowing phrases and images from the letters shows the poet's work is drawn from them.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "taken or obtained from a source", "zh": "取材於……；來自……", "word": "drawn from"}, "B": {"pos": "phr.", "en": "completely confused by something", "zh": "對……感到困惑", "word": "baffled by"}, "C": {"pos": "phr.", "en": "disagreeing with something", "zh": "反對……的", "word": "opposed to"}, "D": {"pos": "phr.", "en": "not giving enough attention or care to something", "zh": "對……粗心大意", "word": "careless with"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: choose a word/phrase meaning \"influenced by\" for an artist's creative process.", "vocab": true, "body": "Whether <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=shooting\" target=\"_blank\" rel=\"noopener\">shooting<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=low-budget\" target=\"_blank\" rel=\"noopener\">low-budget<\/a> short or a big-studio <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=feature\" target=\"_blank\" rel=\"noopener\" data-w=\"feature\" data-pos=\"v.\" data-en=\"to include something as an important part\" data-zh=\"以…為特色；包含\">feature<\/a>, filmmaker Diego Reyes is ______ the recurring dream he had as a child of a house whose rooms rearranged themselves overnight, a dream he has now reimagined in nearly every film he has made.", "bodyPlain": "Whether shooting a low-budget short or a big-studio feature, filmmaker Diego Reyes is ______ the recurring dream he had as a child of a house whose rooms rearranged themselves overnight, a dream he has now reimagined in nearly every film he has made.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "無論是拍攝低成本短片還是大片廠劇情片，電影導演 Diego Reyes 都 ______ 他童年時反覆做的一個夢：一棟房間會在夜裡自行重新排列的房子，這個夢幾乎被他重新詮釋在他拍過的每部電影中。", "opts": {"A": "unmoved by", "B": "rooted in", "C": "puzzled by", "D": "resistant to"}, "optsZh": {"A": "不為……所動的", "B": "根植於……", "C": "對……感到困惑", "D": "抗拒……的"}, "answer": "B", "expl": "Reimagining the childhood dream in nearly every film shows his work is rooted in that memory.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "not emotionally affected by", "zh": "不為……所動的", "word": "unmoved by"}, "B": {"pos": "phr.", "en": "coming from or based on", "zh": "根植於……", "word": "rooted in"}, "C": {"pos": "phr.", "en": "confused by", "zh": "對……感到困惑", "word": "puzzled by"}, "D": {"pos": "phr.", "en": "not accepting or not affected by", "zh": "抗拒……的；不受……影響的", "word": "resistant to"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: choose a word meaning \"uniform\" that is contradicted by a list of diverse examples.", "vocab": true, "body": "Disproving the common misconception of Native art as ______, the painters whose work appears in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> at the National Museum of the American Indian employ a range of styles. There are artists working in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> arts of their specific tribal communities, artists working in European <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=modernist\" target=\"_blank\" rel=\"noopener\" data-w=\"modernist\" data-pos=\"adj.\" data-en=\"relating to modern art styles that broke with tradition\" data-zh=\"現代主義的\">modernist<\/a> or American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=abstract\" target=\"_blank\" rel=\"noopener\" data-w=\"abstract\" data-pos=\"adj.\" data-en=\"existing as an idea rather than a physical thing; (art) not showing real objects\" data-zh=\"抽象的\">abstract<\/a> expressionist art traditions, and artists blending various traditions into something wholly new.", "bodyPlain": "Disproving the common misconception of Native art as ______, the painters whose work appears in the collection at the National Museum of the American Indian employ a range of styles. There are artists working in the traditional arts of their specific tribal communities, artists working in European modernist or American abstract expressionist art traditions, and artists blending various traditions into something wholly new.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這些作品收藏於美國印第安人國家博物館的畫家運用多種風格，推翻了一般人認為原住民藝術是 ______ 的常見誤解。有些藝術家從事所屬部落社群的傳統藝術，有些藝術家投入歐洲現代主義或美國抽象表現主義的藝術傳統，也有藝術家把各種傳統融合成全新的作品。", "opts": {"A": "uncontroversial", "B": "individualistic", "C": "theoretical", "D": "homogeneous"}, "optsZh": {"A": "沒有爭議的", "B": "個人主義的；獨特的", "C": "理論上的", "D": "同質的；單一的"}, "answer": "D", "expl": "The painters 'employ a range of styles,' which disproves the idea that Native art is all the same, or 'homogeneous.'", "explZh": "這些畫家「運用多種風格」，推翻了原住民藝術都一樣的誤解，因此選「homogeneous」（同質的、單一的）。", "defs": {"A": {"pos": "adj.", "en": "not causing disagreement", "zh": "沒有爭議的", "word": "uncontroversial"}, "B": {"pos": "adj.", "en": "independent and different from others", "zh": "個人主義的；與眾不同的", "word": "individualistic"}, "C": {"pos": "adj.", "en": "based on ideas rather than practice", "zh": "理論上的", "word": "theoretical"}, "D": {"pos": "adj.", "en": "all of the same kind; not varied", "zh": "同質的；單一的", "word": "homogeneous"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: choose a word meaning \"uniform\" that is contradicted by a list of diverse examples.", "vocab": true, "body": "Disproving the common misconception of a country&#x27;s regional cuisine as ______, the dishes served across its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=province\" target=\"_blank\" rel=\"noopener\" data-w=\"province\" data-pos=\"n.\" data-en=\"a large region of a country or empire with its own government\" data-zh=\"省；行省\">provinces<\/a> reveal sharp differences in spice, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a>, and staple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingredient\" target=\"_blank\" rel=\"noopener\" data-w=\"ingredient\" data-pos=\"n.\" data-en=\"one of the foods used to make a dish\" data-zh=\"成分；原料\">ingredient<\/a>. Coastal towns favor light broths and raw seafood, mountain villages rely on slow-braised meats and preserved vegetables, and the capital blends both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> with imported spices from centuries of trade.", "bodyPlain": "Disproving the common misconception of a country's regional cuisine as ______, the dishes served across its provinces reveal sharp differences in spice, technique, and staple ingredient. Coastal towns favor light broths and raw seafood, mountain villages rely on slow-braised meats and preserved vegetables, and the capital blends both traditions with imported spices from centuries of trade.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "該國各省供應的菜餚在香料、烹調技巧與主食食材上呈現明顯差異，推翻了一般人認為其地方料理是 ______ 的常見誤解。沿海城鎮偏好清淡湯品與生海鮮，山區村落以慢燉肉類與醃漬蔬菜為主，而首都則結合這兩種傳統，加上數百年貿易帶來的進口香料。", "opts": {"A": "homogeneous", "B": "seasonal", "C": "affordable", "D": "forgotten"}, "optsZh": {"A": "同質的；單一的", "B": "季節性的", "C": "負擔得起的", "D": "被遺忘的"}, "answer": "A", "expl": "The listed regional differences disprove the idea that the cuisine is uniform.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "all of the same kind; not varied", "zh": "同質的；單一的", "word": "homogeneous"}, "B": {"pos": "adj.", "en": "happening only at certain times of year", "zh": "季節性的", "word": "seasonal"}, "C": {"pos": "adj.", "en": "cheap enough for people to buy", "zh": "負擔得起的；價格合理的", "word": "affordable"}, "D": {"pos": "adj.", "en": "no longer remembered", "zh": "被遺忘的", "word": "forgotten"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: choose a word meaning \"uniform\" that is contradicted by a list of diverse examples.", "vocab": true, "body": "Disproving the common misconception of protest music as ______, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> point to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> that range from quiet acoustic ballads to full <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orchestral\" target=\"_blank\" rel=\"noopener\" data-w=\"orchestral\" data-pos=\"adj.\" data-en=\"written for or played by an orchestra\" data-zh=\"管弦樂的\">orchestral<\/a> arrangements to sparse electronic tracks, each shaped by the political moment and available <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> of its decade.", "bodyPlain": "Disproving the common misconception of protest music as ______, historians point to recordings that range from quiet acoustic ballads to full orchestral arrangements to sparse electronic tracks, each shaped by the political moment and available technology of its decade.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "歷史學家指出，抗議音樂的錄音從安靜的木吉他民謠到完整的管弦樂編曲，再到簡約的電子音軌都有，各自受到所處年代的政治情勢與可用技術影響，推翻了一般人認為抗議音樂是 ______ 的常見誤解。", "opts": {"A": "uniform", "B": "obscure", "C": "temporary", "D": "unpopular"}, "optsZh": {"A": "一致的；統一的", "B": "隱藏；使模糊", "C": "暫時的", "D": "不受歡迎的"}, "answer": "A", "expl": "The range of musical styles disproves the idea that protest music is all alike.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "the same in all parts; not varying", "zh": "一致的；統一的", "word": "uniform"}, "B": {"pos": "v.", "en": "to hide or make difficult to see or understand", "zh": "遮蔽；使模糊", "word": "obscure"}, "C": {"pos": "adj.", "en": "lasting for a short time only", "zh": "暫時的", "word": "temporary"}, "D": {"pos": "adj.", "en": "not liked by many people", "zh": "不受歡迎的", "word": "unpopular"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: choose a word meaning \"uniform\" that is contradicted by a list of diverse examples.", "vocab": true, "body": "Disproving the common misconception of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>&#x27; nesting habits as ______, field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologists<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=document\" target=\"_blank\" rel=\"noopener\" data-w=\"document\" data-pos=\"v.\" data-en=\"to record something in writing or pictures\" data-zh=\"記錄\">documented<\/a> colonies that build <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elevated\" target=\"_blank\" rel=\"noopener\" data-w=\"elevated\" data-pos=\"adj.\" data-en=\"raised above the ground or above the normal level\" data-zh=\"高架的；升高的\">elevated<\/a> stick platforms, others that burrow into riverbanks, and still others that simply scrape a shallow depression in open sand.", "bodyPlain": "Disproving the common misconception of the species' nesting habits as ______, field biologists have documented colonies that build elevated stick platforms, others that burrow into riverbanks, and still others that simply scrape a shallow depression in open sand.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "野外生物學家記錄到有些族群會築起高架的樹枝平台，有些會在河岸挖洞，還有些只在空曠沙地上刮出淺坑，推翻了一般人認為這個物種的築巢習性是 ______ 的常見誤解。", "opts": {"A": "invariable", "B": "seasonal", "C": "instinctive", "D": "inefficient"}, "optsZh": {"A": "不變的", "B": "季節性的", "C": "出於本能的", "D": "沒有效率的"}, "answer": "A", "expl": "The variety of nesting strategies disproves the idea that the habit never varies.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "never changing", "zh": "不變的", "word": "invariable"}, "B": {"pos": "adj.", "en": "happening only at certain times of year", "zh": "季節性的", "word": "seasonal"}, "C": {"pos": "adj.", "en": "done naturally, without thinking", "zh": "出於本能的", "word": "instinctive"}, "D": {"pos": "adj.", "en": "wasting time, energy, or money", "zh": "沒有效率的", "word": "inefficient"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: choose a word meaning \"uniform\" that is contradicted by a list of diverse examples.", "vocab": true, "body": "Disproving the common misconception of the early labor movement as ______, archival <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=record\" target=\"_blank\" rel=\"noopener\" data-w=\"record\" data-pos=\"v.\" data-en=\"to write down or store information\" data-zh=\"記錄\">records<\/a> reveal factions that pursued shop-floor bargaining, others that lobbied for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> legislation, and still others that organized <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=separate\" target=\"_blank\" rel=\"noopener\" data-w=\"separate\" data-pos=\"v.\" data-en=\"to divide or move things apart\" data-zh=\"分開；分離\">separate<\/a> cooperative enterprises.", "bodyPlain": "Disproving the common misconception of the early labor movement as ______, archival records reveal factions that pursued shop-floor bargaining, others that lobbied for national legislation, and still others that organized entirely separate cooperative enterprises.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "檔案紀錄顯示，有的派系追求在工廠現場談判，有的遊說推動全國立法，還有的另外組織完全獨立的合作企業，推翻了一般人認為早期勞工運動是 ______ 的常見誤解。", "opts": {"A": "monolithic", "B": "illegal", "C": "short-lived", "D": "secretive"}, "optsZh": {"A": "單一龐大的；鐵板一塊的", "B": "違法的", "C": "短暫的", "D": "隱密的；守密的"}, "answer": "A", "expl": "The described factions disprove the idea that the movement acted as a single, undivided bloc.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "large, uniform, and unchanging", "zh": "單一龐大的；鐵板一塊的", "word": "monolithic"}, "B": {"pos": "adj.", "en": "not allowed by law", "zh": "違法的", "word": "illegal"}, "C": {"pos": "adj.", "en": "lasting only a short time", "zh": "短暫的", "word": "short-lived"}, "D": {"pos": "adj.", "en": "tending to hide things from others", "zh": "隱密的；守密的", "word": "secretive"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: choose a word meaning \"uniform\" that is contradicted by a list of diverse examples.", "vocab": true, "body": "Disproving the common misconception of coral reef fish communities as ______, marine surveys have found some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reef\" target=\"_blank\" rel=\"noopener\" data-w=\"reef\" data-pos=\"n.\" data-en=\"a line of rock or coral near the surface of the sea\" data-zh=\"礁；珊瑚礁\">reefs<\/a> dominated by a handful of generalist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> while neighboring reefs, only a few kilometers away, support dozens of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> species found nowhere else.", "bodyPlain": "Disproving the common misconception of coral reef fish communities as ______, marine surveys have found some reefs dominated by a handful of generalist species while neighboring reefs, only a few kilometers away, support dozens of specialized species found nowhere else.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "海洋調查發現，有些珊瑚礁以少數適應力廣的物種為主，而僅幾公里外的鄰近珊瑚礁卻孕育了數十種別處找不到的特化物種，推翻了一般人認為珊瑚礁魚類群落是 ______ 的常見誤解。", "opts": {"A": "identical", "B": "fragile", "C": "declining", "D": "unstudied"}, "optsZh": {"A": "完全相同的", "B": "脆弱的", "C": "下降的；衰退的", "D": "未被研究的"}, "answer": "A", "expl": "The contrast between neighboring reefs disproves the idea that such communities are all the same.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "exactly the same", "zh": "完全相同的", "word": "identical"}, "B": {"pos": "adj.", "en": "easily broken or damaged", "zh": "脆弱的；易碎的", "word": "fragile"}, "C": {"pos": "adj.", "en": "becoming smaller or weaker", "zh": "下降的；衰退的", "word": "declining"}, "D": {"pos": "adj.", "en": "not yet examined or researched", "zh": "未被研究的", "word": "unstudied"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: choose a noun describing the magnitude/extent of a difference.", "vocab": true, "body": "Recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> of the mass of the boson (a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=subatomic\" target=\"_blank\" rel=\"noopener\" data-w=\"subatomic\" data-pos=\"adj.\" data-en=\"smaller than an atom\" data-zh=\"次原子的\">subatomic<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=particle\" target=\"_blank\" rel=\"noopener\" data-w=\"particle\" data-pos=\"n.\" data-en=\"an extremely small piece of matter\" data-zh=\"粒子；微粒\">particle<\/a>) were notable not only for the mere fact that the particle&#x27;s mass differed from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expectation\" target=\"_blank\" rel=\"noopener\" data-w=\"expectation\" data-pos=\"n.\" data-en=\"a belief that something will happen\" data-zh=\"預期；期望\">expectations<\/a> but for the ______ of that difference. The measured mass of the boson was seven standard deviations higher than predicted by the standard model of particle physics.", "bodyPlain": "Recent measurements of the mass of the boson (a subatomic particle) were notable not only for the mere fact that the particle's mass differed from expectations but for the ______ of that difference. The measured mass of the boson was seven standard deviations higher than predicted by the standard model of particle physics.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "近期對玻色子（一種次原子粒子）質量的測量之所以引人注目，不只是因為該粒子的質量與預期不同，更因為這個差異的 ______。測得的玻色子質量比粒子物理標準模型的預測值高出七個標準差。", "opts": {"A": "cause", "B": "existence", "C": "implication", "D": "scale"}, "optsZh": {"A": "原因", "B": "存在", "C": "含意；影響", "D": "規模；程度"}, "answer": "D", "expl": "The next sentence stresses how big the difference was (seven standard deviations), so the text is about the 'scale' of the difference.", "explZh": "下一句強調差異有多大（高出七個標準差），所以重點是差異的「規模、程度（scale）」。", "defs": {"A": {"pos": "n.", "en": "the reason why something happens", "zh": "原因；起因", "word": "cause"}, "B": {"pos": "n.", "en": "the fact of being real or present", "zh": "存在", "word": "existence"}, "C": {"pos": "n.", "en": "a possible effect or result of something", "zh": "含意；可能的影響", "word": "implication"}, "D": {"pos": "n.", "en": "the size or level of something", "zh": "規模；程度", "word": "scale"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: choose a noun describing the magnitude/extent of a difference.", "vocab": true, "body": "Recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=average\" target=\"_blank\" rel=\"noopener\" data-w=\"average\" data-pos=\"adj./n.\" data-en=\"the usual or typical amount; the result of adding numbers and dividing\" data-zh=\"平均的；平均數\">average<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> of the lake bed were notable not only for the fact that the reading differed from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expectation\" target=\"_blank\" rel=\"noopener\" data-w=\"expectation\" data-pos=\"n.\" data-en=\"a belief that something will happen\" data-zh=\"預期；期望\">expectations<\/a> but for the ______ of that difference: the measured temperature was nearly nine degrees higher than models based on decades of prior data had predicted.", "bodyPlain": "Recent measurements of the average temperature of the lake bed were notable not only for the fact that the reading differed from expectations but for the ______ of that difference: the measured temperature was nearly nine degrees higher than models based on decades of prior data had predicted.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "近期對湖床平均溫度的測量之所以引人注目，不只是因為讀數與預期不同，更因為這個差異的 ______：測得的溫度比根據數十年資料建立的模型預測值高了將近九度。", "opts": {"A": "cause", "B": "duration", "C": "magnitude", "D": "purpose"}, "optsZh": {"A": "原因", "B": "持續時間", "C": "規模；大小", "D": "目的"}, "answer": "C", "expl": "The nine-degree figure points to a word describing how large the difference was.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the reason why something happens", "zh": "原因；起因", "word": "cause"}, "B": {"pos": "n.", "en": "the length of time something lasts", "zh": "持續時間", "word": "duration"}, "C": {"pos": "n.", "en": "great size or importance", "zh": "規模；重要性", "word": "magnitude"}, "D": {"pos": "n.", "en": "the reason something is done or made", "zh": "目的", "word": "purpose"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: choose a noun describing the magnitude/extent of a difference.", "vocab": true, "body": "Astronomers who <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tracked\" target=\"_blank\" rel=\"noopener\">tracked<\/a> the star&#x27;s sudden <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=brightening\" target=\"_blank\" rel=\"noopener\">brightening<\/a> were struck not merely by the change itself but by the ______ of that change: within six hours, the star&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=luminosity\" target=\"_blank\" rel=\"noopener\">luminosity<\/a> had increased by a factor of nearly two hundred.", "bodyPlain": "Astronomers who tracked the star's sudden brightening were struck not merely by the change itself but by the ______ of that change: within six hours, the star's luminosity had increased by a factor of nearly two hundred.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "追蹤這顆恆星突然變亮的天文學家，感到震驚的不只是變化本身，更是這個變化的 ______：在六小時內，這顆恆星的亮度增加了將近兩百倍。", "opts": {"A": "origin", "B": "extent", "C": "intention", "D": "history"}, "optsZh": {"A": "起源", "B": "範圍；程度", "C": "意圖", "D": "歷史"}, "answer": "B", "expl": "The two-hundred-fold increase points to a word describing how great the change was.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the beginning or source of something", "zh": "起源", "word": "origin"}, "B": {"pos": "n.", "en": "how large, important, or serious something is", "zh": "範圍；程度", "word": "extent"}, "C": {"pos": "n.", "en": "something you plan to do", "zh": "意圖；打算", "word": "intention"}, "D": {"pos": "n.", "en": "the past events connected with something", "zh": "歷史；來歷", "word": "history"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: choose a noun describing the magnitude/extent of a difference.", "vocab": true, "body": "Economists reviewing the new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=employment\" target=\"_blank\" rel=\"noopener\" data-w=\"employment\" data-pos=\"n.\" data-en=\"work for which people are paid; the state of having a job\" data-zh=\"就業；雇用\">employment<\/a> survey were surprised less by the direction of the shift than by the ______ of it: the number of workers who changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industry\" target=\"_blank\" rel=\"noopener\" data-w=\"industry\" data-pos=\"n.\" data-en=\"the businesses that make a particular product\" data-zh=\"產業；工業\">industries<\/a> within a single year was nearly triple the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=average\" target=\"_blank\" rel=\"noopener\" data-w=\"average\" data-pos=\"adj./n.\" data-en=\"the usual or typical amount; the result of adding numbers and dividing\" data-zh=\"平均的；平均數\">average<\/a>.", "bodyPlain": "Economists reviewing the new employment survey were surprised less by the direction of the shift than by the ______ of it: the number of workers who changed industries within a single year was nearly triple the historical average.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "檢視新就業調查的經濟學家，對變化方向的驚訝，遠不如對變化 ______ 的驚訝：一年內轉換產業的勞工人數幾乎是歷史平均的三倍。", "opts": {"A": "scope", "B": "motive", "C": "legality", "D": "novelty"}, "optsZh": {"A": "範圍", "B": "動機", "C": "合法性", "D": "新奇"}, "answer": "A", "expl": "The tripled figure points to a word describing how broad the shift was.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the range of things something deals with", "zh": "範圍", "word": "scope"}, "B": {"pos": "n.", "en": "a reason for doing something", "zh": "動機", "word": "motive"}, "C": {"pos": "n.", "en": "the state of being allowed by law", "zh": "合法性", "word": "legality"}, "D": {"pos": "n.", "en": "the quality of being new and unusual", "zh": "新奇；新穎", "word": "novelty"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: choose a noun describing the magnitude/extent of a difference.", "vocab": true, "body": "Glaciologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=monitor\" target=\"_blank\" rel=\"noopener\" data-w=\"monitor\" data-pos=\"v.\" data-en=\"to watch and check something over time\" data-zh=\"監測\">monitoring<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=retreat\" target=\"_blank\" rel=\"noopener\">retreat<\/a> of the ice sheet were concerned not simply that it was retreating but by the ______ of the retreat: satellite <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> showed the glacier&#x27;s edge had moved back nearly a kilometer in a single decade.", "bodyPlain": "Glaciologists monitoring the retreat of the ice sheet were concerned not simply that it was retreating but by the ______ of the retreat: satellite images showed the glacier's edge had moved back nearly a kilometer in a single decade.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "監測冰層退縮的冰川學家擔心的不只是它正在退縮，更是退縮的 ______：衛星影像顯示，冰川邊緣在短短十年內後退了將近一公里。", "opts": {"A": "cause", "B": "location", "C": "scale", "D": "reversibility"}, "optsZh": {"A": "原因", "B": "位置", "C": "規模；程度", "D": "可逆性"}, "answer": "C", "expl": "The one-kilometer figure points to a word describing how large the retreat was.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the reason why something happens", "zh": "原因；起因", "word": "cause"}, "B": {"pos": "n.", "en": "a place or position", "zh": "位置；地點", "word": "location"}, "C": {"pos": "n.", "en": "the size or level of something", "zh": "規模；程度", "word": "scale"}, "D": {"pos": "n.", "en": "the ability to be changed back", "zh": "可逆性", "word": "reversibility"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: choose a noun describing the magnitude/extent of a difference.", "vocab": true, "body": "Analysts <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reviewing\" target=\"_blank\" rel=\"noopener\">reviewing<\/a> the firm&#x27;s quarterly report were less concerned with the fact of a loss than with the ______ of that loss: <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revenue\" target=\"_blank\" rel=\"noopener\" data-w=\"revenue\" data-pos=\"n.\" data-en=\"income, especially of a business\" data-zh=\"收入；營收\">revenue<\/a> had fallen by more than sixty <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\" data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a> compared with the same quarter the previous year.", "bodyPlain": "Analysts reviewing the firm's quarterly report were less concerned with the fact of a loss than with the ______ of that loss: revenue had fallen by more than sixty percent compared with the same quarter the previous year.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "檢視公司季報的分析師，比起虧損這件事本身，更擔心虧損的 ______：營收與去年同季相比下滑超過百分之六十。", "opts": {"A": "timing", "B": "degree", "C": "secrecy", "D": "origin"}, "optsZh": {"A": "時機；時間安排", "B": "程度", "C": "保密", "D": "起源"}, "answer": "B", "expl": "The sixty-percent figure points to a word describing how severe the loss was.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the choice of when something happens", "zh": "時機", "word": "timing"}, "B": {"pos": "n.", "en": "the amount or level of something", "zh": "程度", "word": "degree"}, "C": {"pos": "n.", "en": "the act of keeping things secret", "zh": "保密", "word": "secrecy"}, "D": {"pos": "n.", "en": "the beginning or source of something", "zh": "起源", "word": "origin"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: choose a verb meaning to reduce/shorten a range, distance, or capacity.", "vocab": true, "body": "Birds sing to communicate over <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=potentially\" target=\"_blank\" rel=\"noopener\" data-w=\"potentially\" data-pos=\"adv.\" data-en=\"possibly, in the future\" data-zh=\"可能地；潛在地\">potentially<\/a> great distances. For this reason, many researchers believe that birds in densely <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetated\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetated\" data-pos=\"adj.\" data-en=\"covered with plants\" data-zh=\"長滿植物的\">vegetated<\/a> habitats generally sing at lower frequencies than birds living in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=comparatively\" target=\"_blank\" rel=\"noopener\" data-w=\"comparatively\" data-pos=\"adv.\" data-en=\"when compared with something else\" data-zh=\"相對地；比較而言\">comparatively<\/a> sparse habitats, since dense <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a> tends to ______ the distance that high-frequency sounds can travel.", "bodyPlain": "Birds sing to communicate over potentially great distances. For this reason, many researchers believe that birds in densely vegetated habitats generally sing at lower frequencies than birds living in comparatively sparse habitats, since dense vegetation tends to ______ the distance that high-frequency sounds can travel.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "鳥類鳴唱是為了在可能很遠的距離間溝通。因此，許多研究人員認為，生活在植被濃密棲地的鳥類，通常比生活在植被相對稀疏棲地的鳥類以較低的頻率鳴唱，因為濃密的植被往往會 ______ 高頻聲音能傳播的距離。", "opts": {"A": "exceed", "B": "diminish", "C": "encompass", "D": "conceal"}, "optsZh": {"A": "超過", "B": "減少；削弱", "C": "包含；涵蓋", "D": "隱藏；遮掩"}, "answer": "B", "expl": "Birds in dense habitats sing at low frequencies because vegetation reduces how far high-frequency sounds travel; 'diminish' means reduce.", "explZh": "濃密植被會減少高頻聲音傳播的距離，所以鳥類改用低頻；「diminish」意為減少。", "defs": {"A": {"pos": "v.", "en": "to be more than a certain amount", "zh": "超過", "word": "exceed"}, "B": {"pos": "v.", "en": "to become or make smaller or less", "zh": "減少；削弱", "word": "diminish"}, "C": {"pos": "v.", "en": "to include or surround", "zh": "包含；涵蓋", "word": "encompass"}, "D": {"pos": "v.", "en": "to hide something", "zh": "隱藏；遮掩", "word": "conceal"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: choose a verb meaning to reduce/shorten a range, distance, or capacity.", "vocab": true, "body": "Ships <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=navigating\" target=\"_blank\" rel=\"noopener\">navigating<\/a> the strait rely on radar because heavy fog tends to ______ the distance at which lookouts can spot approaching <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vessel\" target=\"_blank\" rel=\"noopener\" data-w=\"vessel\" data-pos=\"n.\" data-en=\"a container such as a pot or bowl\" data-zh=\"器皿；容器\">vessels<\/a>, sometimes reducing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visibility\" target=\"_blank\" rel=\"noopener\" data-w=\"visibility\" data-pos=\"n.\" data-en=\"the degree to which something can be seen or noticed\" data-zh=\"能見度；曝光度\">visibility<\/a> to less than one hundred meters.", "bodyPlain": "Ships navigating the strait rely on radar because heavy fog tends to ______ the distance at which lookouts can spot approaching vessels, sometimes reducing visibility to less than one hundred meters.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "通過海峽的船隻依賴雷達，因為濃霧往往會 ______ 瞭望員能看見來船的距離，有時能見度甚至不到一百公尺。", "opts": {"A": "extend", "B": "shorten", "C": "measure", "D": "predict"}, "optsZh": {"A": "延長；延伸", "B": "縮短", "C": "測量", "D": "預測"}, "answer": "B", "expl": "Reducing visibility to under one hundred meters shows the fog shortens the sighting distance.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make longer or larger", "zh": "延長；延伸", "word": "extend"}, "B": {"pos": "v.", "en": "to make shorter", "zh": "縮短", "word": "shorten"}, "C": {"pos": "v.", "en": "to find the size or amount of something", "zh": "測量", "word": "measure"}, "D": {"pos": "v.", "en": "to say what will happen in the future", "zh": "預測", "word": "predict"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: choose a verb meaning to reduce/shorten a range, distance, or capacity.", "vocab": true, "body": "Engineers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=designing\" target=\"_blank\" rel=\"noopener\">designing<\/a> the new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=headphones\" target=\"_blank\" rel=\"noopener\">headphones<\/a> found that soft foam <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=padding\" target=\"_blank\" rel=\"noopener\">padding<\/a> tends to ______ the range of low-frequency sounds that reach the wearer&#x27;s ear, blocking most engine noise while leaving voices audible.", "bodyPlain": "Engineers designing the new headphones found that soft foam padding tends to ______ the range of low-frequency sounds that reach the wearer's ear, blocking most engine noise while leaving voices audible.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "設計新款耳機的工程師發現，柔軟的泡棉襯墊往往會 ______ 傳到配戴者耳朵的低頻聲音範圍，擋住大部分引擎噪音，同時仍能聽見人聲。", "opts": {"A": "restrict", "B": "amplify", "C": "record", "D": "clarify"}, "optsZh": {"A": "限制", "B": "放大；增強", "C": "紀錄；記錄", "D": "釐清；澄清"}, "answer": "A", "expl": "Blocking most engine noise while letting voices through shows the padding narrows the range of sound reaching the ear.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to keep within limits", "zh": "限制", "word": "restrict"}, "B": {"pos": "v.", "en": "to make something louder, stronger, or bigger", "zh": "放大；增強", "word": "amplify"}, "C": {"pos": "v.", "en": "to write down or store information", "zh": "記錄", "word": "record"}, "D": {"pos": "v.", "en": "to make something easier to understand", "zh": "釐清；澄清", "word": "clarify"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: choose a verb meaning to reduce/shorten a range, distance, or capacity.", "vocab": true, "body": "Botanists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=studying\" target=\"_blank\" rel=\"noopener\">studying<\/a> the shrub found that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=shallow\" target=\"_blank\" rel=\"noopener\">shallow<\/a>, rocky soil tends to ______ how far its roots can spread, forcing the plant to rely on a dense network of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> roots rather than a single deep taproot.", "bodyPlain": "Botanists studying the shrub found that shallow, rocky soil tends to ______ how far its roots can spread, forcing the plant to rely on a dense network of surface roots rather than a single deep taproot.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "研究這種灌木的植物學家發現，淺薄多石的土壤往往會 ______ 它的根能延伸的距離，迫使這種植物依賴密集的淺層根系，而非一條深入地下的主根。", "opts": {"A": "broaden", "B": "limit", "C": "fertilize", "D": "disguise"}, "optsZh": {"A": "擴大；拓寬", "B": "限制", "C": "施肥", "D": "偽裝；掩飾"}, "answer": "B", "expl": "Forcing reliance on shallow surface roots shows the soil restricts how far the roots can spread.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make wider or include more", "zh": "擴大；拓寬", "word": "broaden"}, "B": {"pos": "v.", "en": "to keep within a certain amount", "zh": "限制", "word": "limit"}, "C": {"pos": "v.", "en": "to add substances to soil to help plants grow", "zh": "施肥", "word": "fertilize"}, "D": {"pos": "v.", "en": "to change the look of something so it is not recognized", "zh": "偽裝；掩飾", "word": "disguise"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: choose a verb meaning to reduce/shorten a range, distance, or capacity.", "vocab": true, "body": "Submarine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=communication\" target=\"_blank\" rel=\"noopener\">communication<\/a> is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=difficult\" target=\"_blank\" rel=\"noopener\">difficult<\/a> because seawater tends to ______ the range over which low-frequency radio signals can travel, forcing crews to rely on extremely long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=antenna\" target=\"_blank\" rel=\"noopener\" data-w=\"antenna\" data-pos=\"n.\" data-en=\"a rod that sends or receives signals\" data-zh=\"天線\">antennas<\/a> or sound-based systems instead.", "bodyPlain": "Submarine communication is difficult because seawater tends to ______ the range over which low-frequency radio signals can travel, forcing crews to rely on extremely long antennas or sound-based systems instead.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "潛艇通訊之所以困難，是因為海水往往會 ______ 低頻無線電訊號能傳播的範圍，迫使船員改用超長天線或以聲音為基礎的系統。", "opts": {"A": "curtail", "B": "chart", "C": "energize", "D": "duplicate"}, "optsZh": {"A": "縮減；限制", "B": "繪製圖表；規劃", "C": "使充滿活力", "D": "複製；重複"}, "answer": "A", "expl": "Forcing reliance on alternative systems shows seawater cuts down the range of the radio signals.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to reduce or limit something", "zh": "縮減；限制", "word": "curtail"}, "B": {"pos": "v.", "en": "to make a map or plan of something; to record its progress", "zh": "繪製圖表；規劃", "word": "chart"}, "C": {"pos": "v.", "en": "to give energy or enthusiasm to", "zh": "使充滿活力", "word": "energize"}, "D": {"pos": "v.", "en": "to make an exact copy of", "zh": "複製；重複", "word": "duplicate"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: choose a verb meaning to reduce/shorten a range, distance, or capacity.", "vocab": true, "body": "Ornithologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tracking\" target=\"_blank\" rel=\"noopener\">tracking<\/a> the songbirds found that a lack of stopover <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=wetland\" target=\"_blank\" rel=\"noopener\" data-w=\"wetland\" data-pos=\"n.\" data-en=\"land that is often covered with water, such as a marsh\" data-zh=\"濕地\">wetlands<\/a> tends to ______ how far the birds can migrate in a single season, sometimes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strand\" target=\"_blank\" rel=\"noopener\" data-w=\"strand\" data-pos=\"n.\" data-en=\"a single thin thread or piece\" data-zh=\"（一）股；縷\">stranding<\/a> exhausted flocks well short of their usual breeding grounds.", "bodyPlain": "Ornithologists tracking the songbirds found that a lack of stopover wetlands tends to ______ how far the birds can migrate in a single season, sometimes stranding exhausted flocks well short of their usual breeding grounds.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "追蹤鳴禽的鳥類學家發現，缺乏可停歇的濕地往往會 ______ 這些鳥在一季內能遷徙的距離，有時使精疲力竭的鳥群困在離平常繁殖地還很遠的地方。", "opts": {"A": "diminish", "B": "publicize", "C": "calculate", "D": "reward"}, "optsZh": {"A": "減少；削弱", "B": "宣傳；公開", "C": "計算", "D": "獎勵"}, "answer": "A", "expl": "Stranding flocks short of their usual grounds shows the lack of wetlands reduces how far they can migrate.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to become or make smaller or less", "zh": "減少；削弱", "word": "diminish"}, "B": {"pos": "v.", "en": "to make something widely known", "zh": "宣傳；公開", "word": "publicize"}, "C": {"pos": "v.", "en": "to find an amount using numbers", "zh": "計算", "word": "calculate"}, "D": {"pos": "v.", "en": "to give something for good work or behavior", "zh": "獎勵", "word": "reward"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Central Ideas and Details: identify the main purpose of a narrative passage that portrays a character's determination.", "vocab": false, "body": "The following text is from Betty Smith&#x27;s 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visits<\/a> the library often.<br><br>Francie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=alphabetical\" target=\"_blank\" rel=\"noopener\" data-w=\"alphabetical\" data-pos=\"adj.\" data-en=\"arranged in the order of the letters of the alphabet\" data-zh=\"按字母順序的\">alphabetical<\/a> order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B&#x27;s. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=architecture\" target=\"_blank\" rel=\"noopener\" data-w=\"architecture\" data-pos=\"n.\" data-en=\"the design of buildings\" data-zh=\"建築\">architecture<\/a>. For her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=enthusiasm\" target=\"_blank\" rel=\"noopener\" data-w=\"enthusiasm\" data-pos=\"n.\" data-en=\"a strong feeling of excitement and interest\" data-zh=\"熱情；熱忱\">enthusiasm<\/a>, she had to admit that some of the B&#x27;s had been hard going. But Francie was a reader.", "bodyPlain": "The following text is from Betty Smith's 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, visits the library often.\n\nFrancie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in alphabetical order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B's. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine architecture. For her enthusiasm, she had to admit that some of the B's had been hard going. But Francie was a reader.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自 Betty Smith 1943 年的小說《布魯克林有棵樹》。Francie 是個小女孩，她經常去圖書館。\nFrancie 以為全世界的書都在那間圖書館裡，而她計畫要讀完全世界的書。她每天讀一本書，依照字母順序，連枯燥的書也不跳過。她記得第一位作者是 Abbott。她已經一天讀一本書讀了很久，但仍然還在 B 開頭的書。她已經讀過關於蜜蜂與水牛、百慕達度假和拜占庭建築的書。儘管她充滿熱情，她也不得不承認，有些 B 開頭的書讀起來很吃力。但 Francie 是個愛讀書的人。", "opts": {"A": "To illustrate Francie's enjoyment of an unusual topic", "B": "To explain why Francie prefers reading over other activities", "C": "To portray Francie's determination to meet a goal", "D": "To describe a book that Francie greatly admires"}, "optsZh": {"A": "說明 Francie 對一個不尋常主題的喜愛", "B": "解釋 Francie 為何喜歡閱讀勝過其他活動", "C": "描寫 Francie 達成目標的決心", "D": "描述一本 Francie 非常欣賞的書"}, "answer": "C", "expl": "Francie reads a book a day in alphabetical order, even the dry ones, so the text portrays her determination to meet a goal.", "explZh": "Francie 每天依字母順序讀一本書，連枯燥的書也不跳過，表現出她達成目標的決心。"}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Central Ideas and Details: identify the main purpose of a narrative passage that portrays a character's determination.", "vocab": false, "body": "The following text is from a short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>. Every summer, Malik decided he would learn to identify every bird that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visited<\/a> his grandmother&#x27;s yard, working <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> from a battered field guide missing its back cover. He started with the sparrows because they were the plainest and, he reasoned, the easiest to get out of the way. By July he had moved on to warblers, squinting through binoculars at flickers of yellow in the highest branches, filling a notebook with crossed-out guesses. Some mornings the birds refused to show themselves at all, and Malik simply sat on the porch steps and waited, sure that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> was the last skill the guide couldn&#x27;t teach him.", "bodyPlain": "The following text is from a short story. Every summer, Malik decided he would learn to identify every bird that visited his grandmother's yard, working entirely from a battered field guide missing its back cover. He started with the sparrows because they were the plainest and, he reasoned, the easiest to get out of the way. By July he had moved on to warblers, squinting through binoculars at flickers of yellow in the highest branches, filling a notebook with crossed-out guesses. Some mornings the birds refused to show themselves at all, and Malik simply sat on the porch steps and waited, sure that patience was the last skill the guide couldn't teach him.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自一篇短篇小說。每年夏天，Malik 都決定要學會辨認每一種來到祖母院子的鳥，全靠一本少了封底、破舊不堪的野外圖鑑。他從麻雀開始，因為麻雀最不起眼，他推想也最容易先搞定。到了七月，他已經進展到林鶯，拿著望遠鏡瞇眼看著最高枝頭間閃動的黃色身影，在筆記本上寫滿劃掉的猜測。有些早晨鳥兒根本不肯現身，Malik 就只是坐在門廊台階上等待，深信耐心是這本圖鑑唯一教不了他的最後一項技能。", "opts": {"A": "To illustrate Malik's fondness for an unusual pastime", "B": "To explain why Malik prefers bird-watching to other summer activities", "C": "To portray Malik's persistence in working toward a self-imposed goal", "D": "To describe a field guide that Malik particularly values"}, "optsZh": {"A": "說明 Malik 對一種不尋常消遣的喜好", "B": "解釋 Malik 為何喜歡賞鳥勝過其他夏季活動", "C": "描寫 Malik 為了自己設定的目標而堅持不懈", "D": "描述一本 Malik 特別珍惜的野外圖鑑"}, "answer": "C", "expl": "The passage centers on Malik's steady, patient progress toward a goal he set for himself.", "explZh": ""}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Central Ideas and Details: identify the main purpose of a narrative passage that portrays a character's determination.", "vocab": false, "body": "The following text is from a novel. Rosa had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=promised\" target=\"_blank\" rel=\"noopener\">promised<\/a> herself she would repair every chair in her late uncle&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=workshop\" target=\"_blank\" rel=\"noopener\">workshop<\/a> before selling the building, even the three-legged ones warped beyond any <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=obvious\" target=\"_blank\" rel=\"noopener\" data-w=\"obvious\" data-pos=\"adj.\" data-en=\"easy to see or understand\" data-zh=\"明顯的\">obvious<\/a> use. She learned to steam bend ash by ruining four strips of wood and consulting a library book so old its spine cracked when opened. Neighbors dropped by to ask when the workshop would finally be listed, and Rosa answered vaguely, already sanding down another armrest. By the time she finished the last chair, the for-sale sign had gathered a season&#x27;s worth of dust in the hall closet.", "bodyPlain": "The following text is from a novel. Rosa had promised herself she would repair every chair in her late uncle's workshop before selling the building, even the three-legged ones warped beyond any obvious use. She learned to steam bend ash by ruining four strips of wood and consulting a library book so old its spine cracked when opened. Neighbors dropped by to ask when the workshop would finally be listed, and Rosa answered vaguely, already sanding down another armrest. By the time she finished the last chair, the for-sale sign had gathered a season's worth of dust in the hall closet.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自一部小說。Rosa 曾向自己承諾，在賣掉已故叔叔的工作室之前，要修好裡面的每一張椅子，甚至包括那些彎曲變形、看不出有什麼用處的三腳椅。她毀了四條木料、又翻閱一本舊到一打開書脊就裂開的圖書館藏書，才學會用蒸氣彎曲白蠟木。鄰居們會順道來問工作室什麼時候終於要掛牌出售，Rosa 只是含糊回答，手上已經在打磨另一個扶手。等她修好最後一張椅子時，那塊待售牌子已經在走廊衣櫃裡積了一季的灰塵。", "opts": {"A": "To illustrate Rosa's enjoyment of woodworking as a hobby", "B": "To explain why Rosa decided not to sell her uncle's workshop", "C": "To portray Rosa's determination to complete a task she set for herself", "D": "To describe a piece of furniture that Rosa admired most"}, "optsZh": {"A": "說明 Rosa 把木工當作嗜好的樂趣", "B": "解釋 Rosa 為何決定不賣掉叔叔的工作室", "C": "描寫 Rosa 完成自己設定之任務的決心", "D": "描述一件 Rosa 最欣賞的家具"}, "answer": "C", "expl": "The passage focuses on Rosa's persistence in finishing a self-imposed task despite distractions.", "explZh": ""}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Central Ideas and Details: identify the main purpose of a narrative passage that portrays a character's determination.", "vocab": false, "body": "The following text is from a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=memoir\" target=\"_blank\" rel=\"noopener\" data-w=\"memoir\" data-pos=\"n.\" data-en=\"a written account of one&#x27;s own life and experiences\" data-zh=\"回憶錄\">memoir<\/a>. My father <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=decided\" target=\"_blank\" rel=\"noopener\">decided<\/a>, the winter I turned nine, that our family would learn every constellation visible from the back field before spring. He photocopied star <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chart\" target=\"_blank\" rel=\"noopener\" data-w=\"chart\" data-pos=\"v.\" data-en=\"to make a map or plan of something; to record its progress\" data-zh=\"繪製圖表；規劃\">charts<\/a> at the library and taped them to the refrigerator, and some nights we stood in the cold long after our fingers went numb, arguing about which faint cluster was Cassiopeia and which was simply a smudge on the chart. He never explained why it mattered so much, only that we would finish what he&#x27;d started, chart by chart, until the refrigerator was bare.", "bodyPlain": "The following text is from a memoir. My father decided, the winter I turned nine, that our family would learn every constellation visible from the back field before spring. He photocopied star charts at the library and taped them to the refrigerator, and some nights we stood in the cold long after our fingers went numb, arguing about which faint cluster was Cassiopeia and which was simply a smudge on the chart. He never explained why it mattered so much, only that we would finish what he'd started, chart by chart, until the refrigerator was bare.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自一本回憶錄。在我九歲那年冬天，父親決定我們全家要在春天前學會從後方田野能看到的每一個星座。他在圖書館影印星圖，貼在冰箱上；有些夜晚，我們在寒風中站到手指都凍麻了還不肯回屋，爭論哪一團微弱的星群是仙后座，哪一個只是星圖上的污點。他從未解釋這件事為何如此重要，只說我們會一張一張星圖地完成他開始的事，直到冰箱上什麼都不剩。", "opts": {"A": "To illustrate the father's interest in an unusual subject", "B": "To explain why the father preferred astronomy to other winter activities", "C": "To portray the father's resolve to see a self-set goal through to the end", "D": "To describe a star chart that the father especially admired"}, "optsZh": {"A": "說明父親對一個不尋常主題的興趣", "B": "解釋父親為何喜歡天文學勝過其他冬季活動", "C": "描寫父親堅持完成自己所設目標的決心", "D": "描述一張父親特別欣賞的星圖"}, "answe
