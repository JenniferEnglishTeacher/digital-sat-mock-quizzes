 "Andrade 改造原本為其他工業用途打造的聲學聽音裝置，成功在兩年內將該市的漏水損失減少將近三分之一。", "B": "1930 年代，延攬 Andrade 的市立自來水局試圖減少老舊管線網造成的漏水損失。", "C": "Andrade 是在需要一種漏水偵測方法的時候，被市立自來水局延攬的。", "D": "作為減少漏水工作的一部分，改造了原本為其他工業用途打造的聲學聽音裝置。"}, "answer": "A", "expl": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a person's achievement.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In the 1970s, the National Seed Bank in India sought to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserve<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> rice varieties threatened by modernization.<br>- The seed bank enlisted <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanist\" target=\"_blank\" rel=\"noopener\" data-w=\"botanist\" data-pos=\"n.\" data-en=\"a scientist who studies plants\" data-zh=\"植物學家\">botanist<\/a> Meera Nair to catalog and store <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=endangered\" target=\"_blank\" rel=\"noopener\" data-w=\"endangered\" data-pos=\"adj.\" data-en=\"at risk of disappearing completely\" data-zh=\"瀕臨絕種的\">endangered<\/a> local strains.<br>- She traveled to remote farming villages to collect seed samples directly from farmers.<br>- She succeeded in preserving over two hundred traditional rice varieties that would otherwise have been lost.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the 1970s, the National Seed Bank in India sought to preserve traditional rice varieties threatened by modernization.\n- The seed bank enlisted botanist Meera Nair to catalog and store endangered local strains.\n- She traveled to remote farming villages to collect seed samples directly from farmers.\n- She succeeded in preserving over two hundred traditional rice varieties that would otherwise have been lost.", "stem": "The student wants to emphasize Meera Nair's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Meera Nair 的成就。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 1970 年代，印度國家種子銀行試圖保存受現代化威脅的傳統稻米品種。\n- 該種子銀行延攬植物學家 Meera Nair 編目並儲存瀕危的本土品系。\n- 她前往偏遠的農村，直接向農民收集種子樣本。\n- 她成功保存了兩百多個原本會消失的傳統稻米品種。", "opts": {"A": "By traveling to remote farming villages to collect seed samples directly from farmers, Nair succeeded in preserving over two hundred traditional rice varieties that would otherwise have been lost.", "B": "In the 1970s, the National Seed Bank, which enlisted Nair, sought to preserve traditional rice varieties threatened by modernization.", "C": "Nair was enlisted by the National Seed Bank at a time when traditional rice varieties needed to be preserved.", "D": "As part of efforts to preserve rice varieties, seed samples were collected directly from farmers in remote villages."}, "optsZh": {"A": "Nair 前往偏遠農村直接向農民收集種子樣本，成功保存了兩百多個原本會消失的傳統稻米品種。", "B": "1970 年代，延攬 Nair 的國家種子銀行試圖保存受現代化威脅的傳統稻米品種。", "C": "Nair 是在需要保存傳統稻米品種的時候，被國家種子銀行延攬的。", "D": "作為保存稻米品種工作的一部分，直接向偏遠村落的農民收集種子樣本。"}, "answer": "A", "expl": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies a causal mechanism.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Scientists have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a &quot;freeze-thaw&quot; battery that can retain 92% of its charge after twelve weeks.<br>- The battery <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molten\" target=\"_blank\" rel=\"noopener\" data-w=\"molten\" data-pos=\"adj.\" data-en=\"melted by heat\" data-zh=\"熔化的\">molten<\/a> salt (a type of salt that liquefies when heated and solidifies at room <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a>).<br>- When the salt is in a liquid state, energy flows through the battery.<br>- When the salt is in a solid state, energy stops flowing and is stored in the battery.<br>- The stored (frozen) energy can be used by reheating (thawing) the battery.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"freeze-thaw\" battery that can retain 92% of its charge after twelve weeks.\n- The battery contains molten salt (a type of salt that liquefies when heated and solidifies at room temperature).\n- When the salt is in a liquid state, energy flows through the battery.\n- When the salt is in a solid state, energy stops flowing and is stored in the battery.\n- The stored (frozen) energy can be used by reheating (thawing) the battery.", "stem": "The student wants to specify how the salt enables energy storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想具體說明鹽如何使能量得以儲存。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 科學家開發出一種「凍融」電池，可在十二週後仍保有 92% 的電量。\n- 這種電池含有熔鹽（一種加熱時會液化、在室溫下會凝固的鹽）。\n- 鹽處於液態時，能量會流經電池。\n- 鹽處於固態時，能量會停止流動並儲存在電池中。\n- 儲存的（凍結的）能量可以透過重新加熱（解凍）電池來使用。", "opts": {"A": "Scientists have developed a freeze-thaw battery that contains molten salt, which liquefies when heated and solidifies at room temperature.", "B": "The stored energy in a freeze-thaw battery, which contains molten salt, can be used by reheating the battery.", "C": "When the molten salt in a freeze-thaw battery solidifies at room temperature, energy stops flowing and can be stored in the battery.", "D": "Molten salt allows a freeze-thaw battery to retain 92% of its charge after twelve weeks."}, "optsZh": {"A": "科學家開發出一種含有熔鹽的凍融電池，這種鹽加熱時會液化，在室溫下會凝固。", "B": "含有熔鹽的凍融電池中所儲存的能量，可以透過重新加熱電池來使用。", "C": "凍融電池中的熔鹽在室溫下凝固時，能量會停止流動並能儲存在電池中。", "D": "熔鹽讓凍融電池在十二週後仍保有 92% 的電量。"}, "answer": "C", "expl": "Choice C explains how the salt works: when it solidifies, energy stops flowing and is stored.", "explZh": "C 說明鹽如何運作：鹽凝固時能量停止流動並被儲存，正好說明儲能機制。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies a causal mechanism.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Engineers have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a &quot;thermal latch&quot; window coating that can retain heat for up to eight hours after sunset.<br>- The coating <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> a wax-based compound that melts at moderate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> and solidifies as it cools.<br>- When the wax is in a liquid state, heat passes through the coating.<br>- When the wax is in a solid state, heat transfer slows and warmth is retained near the glass.<br>- The retained heat can be released back into the room once temperatures drop further.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Engineers have developed a \"thermal latch\" window coating that can retain heat for up to eight hours after sunset.\n- The coating contains a wax-based compound that melts at moderate temperatures and solidifies as it cools.\n- When the wax is in a liquid state, heat passes through the coating.\n- When the wax is in a solid state, heat transfer slows and warmth is retained near the glass.\n- The retained heat can be released back into the room once temperatures drop further.", "stem": "The student wants to specify how the wax enables heat retention. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想具體說明蠟如何使熱得以保留。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 工程師開發出一種「熱鎖」窗戶塗層，可在日落後保留熱量長達八小時。\n- 這種塗層含有一種蠟基化合物，在中等溫度時會融化，冷卻時會凝固。\n- 蠟處於液態時，熱會穿過塗層。\n- 蠟處於固態時，熱傳遞會變慢，溫暖會保留在玻璃附近。\n- 當溫度進一步下降時，保留的熱可以釋放回室內。", "opts": {"A": "Engineers have developed a thermal latch coating that contains a wax-based compound, which melts at moderate temperatures and solidifies as it cools.", "B": "The retained heat in a thermal latch coating, which contains a wax-based compound, can be released back into the room once temperatures drop further.", "C": "When the wax-based compound in a thermal latch coating solidifies as it cools, heat transfer slows and warmth is retained near the glass.", "D": "A wax-based compound allows a thermal latch coating to retain heat for up to eight hours after sunset."}, "optsZh": {"A": "工程師開發出一種含有蠟基化合物的熱鎖塗層，這種化合物在中等溫度時會融化，冷卻時會凝固。", "B": "含有蠟基化合物的熱鎖塗層中保留的熱，在溫度進一步下降時可以釋放回室內。", "C": "熱鎖塗層中的蠟基化合物在冷卻凝固時，熱傳遞變慢，溫暖保留在玻璃附近。", "D": "一種蠟基化合物讓熱鎖塗層能在日落後保留熱量長達八小時。"}, "answer": "C", "expl": "Choice C states the specific mechanism—solidifying slows heat transfer—linking cause to effect.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies a causal mechanism.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Scientists have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a &quot;pressure-lock&quot; seal that can hold gas inside a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=container\" target=\"_blank\" rel=\"noopener\" data-w=\"container\" data-pos=\"n.\" data-en=\"an object such as a box or bottle used for holding things\" data-zh=\"容器\">container<\/a> for months without leaking.<br>- The seal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> a gel-based layer that softens under pressure and stiffens once pressure is released.<br>- When the gel is soft, gas <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molecule\" target=\"_blank\" rel=\"noopener\" data-w=\"molecule\" data-pos=\"n.\" data-en=\"the smallest unit of a substance, made of atoms\" data-zh=\"分子\">molecules<\/a> can slowly pass through microscopic gaps.<br>- When the gel stiffens, the gaps close and gas is trapped inside.<br>- The trapped gas can be released later by reapplying pressure to soften the gel again.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"pressure-lock\" seal that can hold gas inside a container for months without leaking.\n- The seal contains a gel-based layer that softens under pressure and stiffens once pressure is released.\n- When the gel is soft, gas molecules can slowly pass through microscopic gaps.\n- When the gel stiffens, the gaps close and gas is trapped inside.\n- The trapped gas can be released later by reapplying pressure to soften the gel again.", "stem": "The student wants to specify how the gel enables gas storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想具體說明凝膠如何使氣體得以儲存。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 科學家開發出一種「壓力鎖」密封，可將氣體保存在容器內數個月而不洩漏。\n- 這種密封含有一層凝膠，受壓時會變軟，壓力解除後會變硬。\n- 凝膠變軟時，氣體分子可以慢慢穿過微小的縫隙。\n- 凝膠變硬時，縫隙會閉合，氣體就被困在裡面。\n- 之後可以透過再次加壓使凝膠變軟，來釋放被困住的氣體。", "opts": {"A": "Scientists have developed a pressure-lock seal that contains a gel-based layer, which softens under pressure and stiffens once pressure is released.", "B": "The trapped gas in a pressure-lock seal, which contains a gel-based layer, can be released later by reapplying pressure.", "C": "When the gel-based layer in a pressure-lock seal stiffens as pressure is released, the microscopic gaps close and gas becomes trapped inside.", "D": "A gel-based layer allows a pressure-lock seal to hold gas inside a container for months without leaking."}, "optsZh": {"A": "科學家開發出一種含有凝膠層的壓力鎖密封，這層凝膠受壓時會變軟，壓力解除後會變硬。", "B": "含有凝膠層的壓力鎖密封中被困住的氣體，之後可以透過再次加壓來釋放。", "C": "壓力鎖密封中的凝膠層在壓力解除而變硬時，微小縫隙會閉合，氣體因此被困在裡面。", "D": "一層凝膠讓壓力鎖密封能將氣體保存在容器內數個月而不洩漏。"}, "answer": "C", "expl": "Choice C states the specific mechanism—stiffening closes the gaps—linking cause to effect.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies a causal mechanism.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Researchers have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a &quot;cold-hold&quot; battery that can retain 85% of its charge after ten weeks.<br>- The battery <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> a wax-like electrolyte that liquefies when warmed and hardens at room <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a>.<br>- When the electrolyte is liquid, ions move freely and the battery can charge or discharge.<br>- When the electrolyte hardens, ion movement stops and the charge is locked in place.<br>- The locked charge can be accessed again by warming the battery.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Researchers have developed a \"cold-hold\" battery that can retain 85% of its charge after ten weeks.\n- The battery contains a wax-like electrolyte that liquefies when warmed and hardens at room temperature.\n- When the electrolyte is liquid, ions move freely and the battery can charge or discharge.\n- When the electrolyte hardens, ion movement stops and the charge is locked in place.\n- The locked charge can be accessed again by warming the battery.", "stem": "The student wants to specify how the electrolyte enables charge storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想具體說明電解質如何使電荷得以儲存。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 研究人員開發出一種「冷存」電池，可在十週後仍保有 85% 的電量。\n- 這種電池含有一種類似蠟的電解質，加溫時會液化，在室溫下會變硬。\n- 電解質為液態時，離子可以自由移動，電池可以充電或放電。\n- 電解質變硬時，離子停止移動，電荷被鎖住。\n- 加溫電池後就能再次取用被鎖住的電荷。", "opts": {"A": "Researchers have developed a cold-hold battery that contains a wax-like electrolyte, which liquefies when warmed and hardens at room temperature.", "B": "The locked charge in a cold-hold battery, which contains a wax-like electrolyte, can be accessed again by warming the battery.", "C": "When the wax-like electrolyte in a cold-hold battery hardens at room temperature, ion movement stops and the charge is locked in place.", "D": "A wax-like electrolyte allows a cold-hold battery to retain 85% of its charge after ten weeks."}, "optsZh": {"A": "研究人員開發出一種含有類似蠟之電解質的冷存電池，這種電解質加溫時會液化，在室溫下會變硬。", "B": "含有類似蠟之電解質的冷存電池中被鎖住的電荷，可以透過加溫電池再次取用。", "C": "冷存電池中類似蠟的電解質在室溫下變硬時，離子停止移動，電荷被鎖住。", "D": "一種類似蠟的電解質讓冷存電池在十週後仍保有 85% 的電量。"}, "answer": "C", "expl": "Choice C states the specific mechanism—hardening stops ion movement—linking cause to effect.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies a causal mechanism.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Engineers have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a &quot;flow-freeze&quot; heat exchanger that can store excess heat for later use.<br>- The exchanger <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> a salt-based fluid that flows freely when hot and crystallizes when cooled.<br>- When the fluid flows, heat moves through the exchanger and is released to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surroundings\" target=\"_blank\" rel=\"noopener\" data-w=\"surroundings\" data-pos=\"n.\" data-en=\"the place and conditions around a person\" data-zh=\"周遭環境\">surroundings<\/a>.<br>- When the fluid crystallizes, heat movement stops and thermal energy is stored within the crystal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>.<br>- The stored energy can be released later by reheating the fluid.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Engineers have developed a \"flow-freeze\" heat exchanger that can store excess heat for later use.\n- The exchanger contains a salt-based fluid that flows freely when hot and crystallizes when cooled.\n- When the fluid flows, heat moves through the exchanger and is released to the surroundings.\n- When the fluid crystallizes, heat movement stops and thermal energy is stored within the crystal structure.\n- The stored energy can be released later by reheating the fluid.", "stem": "The student wants to specify how the fluid enables heat storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想具體說明流體如何使熱得以儲存。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 工程師開發出一種「流凍」熱交換器，可儲存多餘的熱供日後使用。\n- 這種交換器含有一種鹽基流體，高溫時可自由流動，冷卻時會結晶。\n- 流體流動時，熱會穿過交換器並釋放到周遭環境。\n- 流體結晶時，熱的移動停止，熱能被儲存在晶體結構中。\n- 之後可以透過重新加熱流體來釋放儲存的能量。", "opts": {"A": "Engineers have developed a flow-freeze heat exchanger that contains a salt-based fluid, which flows freely when hot and crystallizes when cooled.", "B": "The stored energy in a flow-freeze heat exchanger, which contains a salt-based fluid, can be released later by reheating the fluid.", "C": "When the salt-based fluid in a flow-freeze heat exchanger crystallizes as it cools, heat movement stops and thermal energy is stored within the crystal structure.", "D": "A salt-based fluid allows a flow-freeze heat exchanger to store excess heat for later use."}, "optsZh": {"A": "工程師開發出一種含有鹽基流體的流凍熱交換器，這種流體高溫時可自由流動，冷卻時會結晶。", "B": "含有鹽基流體的流凍熱交換器中儲存的能量，之後可以透過重新加熱流體來釋放。", "C": "流凍熱交換器中的鹽基流體在冷卻結晶時，熱的移動停止，熱能被儲存在晶體結構中。", "D": "一種鹽基流體讓流凍熱交換器能儲存多餘的熱供日後使用。"}, "answer": "C", "expl": "Choice C states the specific mechanism—crystallizing stops heat movement—linking cause to effect.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies a causal mechanism.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Scientists have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a &quot;damp-lock&quot; capacitor that can hold an electrical charge for several days.<br>- The capacitor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> a polymer layer that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=absorb\" target=\"_blank\" rel=\"noopener\" data-w=\"absorb\" data-pos=\"v.\" data-en=\"to take in a substance\" data-zh=\"吸收\">absorbs<\/a> moisture and swells, then dries and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contract\" target=\"_blank\" rel=\"noopener\" data-w=\"contract\" data-pos=\"n.\" data-en=\"a formal agreement between people, often legal\" data-zh=\"契約；合約\">contracts<\/a> over time.<br>- When the polymer is swollen, charge can move freely across the layer.<br>- When the polymer contracts as it dries, charge movement stops and the charge is held in place.<br>- The held charge can be released again once the polymer reabsorbs moisture.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"damp-lock\" capacitor that can hold an electrical charge for several days.\n- The capacitor contains a polymer layer that absorbs moisture and swells, then dries and contracts over time.\n- When the polymer is swollen, charge can move freely across the layer.\n- When the polymer contracts as it dries, charge movement stops and the charge is held in place.\n- The held charge can be released again once the polymer reabsorbs moisture.", "stem": "The student wants to specify how the polymer enables charge storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想具體說明聚合物如何使電荷得以儲存。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 科學家開發出一種「濕鎖」電容器，可保持電荷好幾天。\n- 這種電容器含有一層聚合物，會吸收水分而膨脹，之後隨時間乾燥而收縮。\n- 聚合物膨脹時，電荷可以自由穿過這一層。\n- 聚合物乾燥收縮時，電荷停止移動並被固定住。\n- 聚合物再次吸收水分後，被固定的電荷就能再次釋放。", "opts": {"A": "Scientists have developed a damp-lock capacitor that contains a polymer layer, which absorbs moisture and swells, then dries and contracts over time.", "B": "The held charge in a damp-lock capacitor, which contains a polymer layer, can be released again once the polymer reabsorbs moisture.", "C": "When the polymer layer in a damp-lock capacitor contracts as it dries, charge movement stops and the charge is held in place.", "D": "A polymer layer allows a damp-lock capacitor to hold an electrical charge for several days."}, "optsZh": {"A": "科學家開發出一種含有聚合物層的濕鎖電容器，這層聚合物會吸收水分而膨脹，之後隨時間乾燥而收縮。", "B": "含有聚合物層的濕鎖電容器中被固定的電荷，在聚合物再次吸收水分後就能再次釋放。", "C": "濕鎖電容器中的聚合物層在乾燥收縮時，電荷停止移動並被固定住。", "D": "一層聚合物讓濕鎖電容器能保持電荷好幾天。"}, "answer": "C", "expl": "Choice C states the specific mechanism—contracting stops charge movement—linking cause to effect.", "explZh": ""}];
    const SLUG = 'dsat_tcramm1';
    const SOURCE = 'Cram School Mock Test (Aug 1, 2026), Module 1';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        sessionWrong[q.id] = { picked, ts: Date.now(), count: (sessionWrong[q.id]?.count || 0) + 1 };
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    const sessionWrong = {}; // questions answered wrong since this page was opened (kept even if fixed later)
    function wrongList(scope = 'all') {
      const w = scope === 'session' ? sessionWrong : loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    // list for downloads: the chosen scope; if "this attempt" is empty, offer the saved list instead
    function dlList() {
      let scope = document.getElementById('dlScope').value;
      let list = wrongList(scope);
      if (!list.length && scope === 'session') {
        const all = wrongList('all');
        if (!all.length) { alert('還沒有錯題 No wrong questions yet. 作答後答錯的題目會自動收錄。'); return null; }
        if (!confirm(`本次作答還沒有錯題。要改下載全部錯題本（${all.length} 題）嗎？\nNo wrong answers in this attempt yet. Download all ${all.length} saved wrong questions instead?`)) return null;
        scope = 'all'; list = all;
      }
      if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return null; }
      return { list, scope, tag: scope === 'session' ? 'this_attempt' : 'all_saved', label: scope === 'session' ? '本次作答 This attempt' : '全部錯題本 All saved' };
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag, label } = sel;
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 · ${label} (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${tag}_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag } = sel;
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${tag}_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // Word handout: Part 1 = redo the questions (no answers), Part 2 = answer key with explanations + 中文翻譯
    document.getElementById('btnDlDoc').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag, label } = sel;
      const d = new Date().toISOString().slice(0,10);
      const body = q => String(q.body || '').replace(/<a\b[^>]*>/g, '').replace(/<\/a>/g, '');
      const opts = q => ['A','B','C','D'].map(L => `<p class="opt">${L}) ${esc(q.opts[L] || '')}</p>`).join('');
      const part1 = list.map(({q}, i) => `<div class="q"><p class="qh">${i+1}. ${esc(q.label)}</p>
        <p>${body(q)}</p><p class="stem">${esc(q.stem || '')}</p>${opts(q)}<p class="ans">Answer 作答：______</p></div>`).join('');
      const part2 = list.map(({q, meta}, i) => `<div class="q"><p class="qh">${i+1}. ${esc(q.label)}　Your answer 你的答案：${esc(meta.picked)}　Correct 正確答案：<b>${esc(q.answer)}</b>${meta.count > 1 ? `　(錯 ${meta.count} 次)` : ''}</p><p class="tag">${esc(q.concept)}</p>
        <p class="ex">${esc(q.expl || '')}</p>${q.explZh ? `<p class="ex">解析：${esc(q.explZh)}</p>` : ''}
        <p class="zh">${esc(q.bodyZh || '')}</p><p class="zh">${esc(q.stemZh || '')}</p>
        ${['A','B','C','D'].map(L => `<p class="zh">${L}) ${esc(q.optsZh[L] || '')}</p>`).join('')}</div>`).join('');
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(SOURCE)} 錯題講義</title>
        <style>body{font-family:Calibri,"Microsoft JhengHei",sans-serif;font-size:11pt;line-height:1.4}h1{font-size:16pt;margin:0}h2{font-size:13pt;border-bottom:1px solid #999;margin-top:18pt}
        .q{margin:0 0 12pt}.qh{font-weight:bold;margin:0 0 4pt}.tag{font-weight:normal;color:#555;font-size:9pt}.stem{font-weight:bold}.opt{margin:0 0 0 18pt}.ans{margin-top:4pt;color:#333}
        .ex{margin:2pt 0;color:#14532d}.zh{margin:2pt 0;color:#5b3a8a;font-size:10pt}p{margin:3pt 0}</style></head><body>
        <h1>${esc(SOURCE)} — 錯題講義 Wrong-Question Review</h1><p>${label} · ${list.length} 題 · ${d}　Name 姓名：____________</p>
        <h2>Part 1 重新作答 Try again (no answers)</h2>${part1}
        <br style="page-break-before:always" clear="all"><h2>Part 2 解答與解析 Answer key & explanations</h2>${part2}</body></html>`;
      download(`${SLUG}_wrong_questions_${tag}_${d}.doc`, html, 'application/msword;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
    if (location.hash.startsWith('#item-')) revealItem(location.hash.slice(1));
  </script>
