zed that the fold likely ______\n\nWhich choice most logically completes the text?\n\nA) was once present in many non-primate species but has since disappeared from those lineages.\nB) has been preserved in certain primate species because it benefits eye health.\nC) will emerge in a greater number of primate species because it may serve a necessary function in vision.\nD) produced more effective debris removal in primates in the past than it does currently.", "answer": "B", "explanation": "The correlation with debris removal supports a hypothesis that the fold persists because it benefits eye health."}, {"id": "15.3", "text": "In a 2021 study, biologist Talia Nowak and her team investigated the evolution of the interdigital webbing found in some rodent species, a trait generally thought to have no function outside of aquatic species. Studying 310 rodent species, the team found that the webbing has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the webbing tend to have greater digging efficiency in loose or sandy soil. Therefore, the team hypothesized that the webbing likely ______\n\nWhich choice most logically completes the text?\n\nA) was once present in many non-rodent species but has since disappeared from those lineages.\nB) has been preserved in certain rodent species because it benefits their digging ability.\nC) will emerge in a greater number of rodent species because it may serve a necessary function in swimming.\nD) produced greater digging efficiency in rodents in the past than it does currently.", "answer": "B", "explanation": "The correlation with digging efficiency supports a hypothesis that the webbing persists because it benefits digging."}, {"id": "15.4", "text": "In a 2015 study, biologist Grace Okafor and colleagues investigated the evolution of the vomeronasal organ, a chemosensory structure present in some reptile species but generally thought to have no function outside of a few well-studied groups. Studying 275 reptile species, the team found that the organ has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have more successful detection of nearby predators. Therefore, the team hypothesized that the organ likely ______\n\nWhich choice most logically completes the text?\n\nA) was once present in many non-reptile species but has since disappeared from those lineages.\nB) has been preserved in certain reptile species because it benefits predator detection.\nC) will emerge in a greater number of reptile species because it may serve a necessary function in reproduction.\nD) produced more successful predator detection in reptiles in the past than it does currently.", "answer": "B", "explanation": "The correlation with predator detection supports a hypothesis that the organ persists because it aids survival."}, {"id": "15.5", "text": "In a 2020 study, biologist Marcus Villanueva and his team investigated the evolution of the cecal appendage found in some bird species, a structure generally thought to have no function beyond digestion. Studying 190 bird species, the team found that the appendage has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the appendage tend to have higher concentrations of beneficial gut bacteria within it. Therefore, the team hypothesized that the appendage likely ______\n\nWhich choice most logically completes the text?\n\nA) was once present in many non-bird species but has since disappeared from those lineages.\nB) has been preserved in certain bird species because it benefits their digestive microbiome.\nC) will emerge in a greater number of bird species because it may serve a necessary function in flight.\nD) produced higher concentrations of beneficial gut bacteria in birds in the past than it does currently.", "answer": "B", "explanation": "The correlation with beneficial gut bacteria supports a hypothesis that the appendage persists because it benefits digestion."}]}, {"n": 16, "concept": "Standard English Conventions (Boundaries): recognize that no punctuation is needed between a subject and its verb.", "original": "A harpsichord may look just like a piano, but the difference between the two instruments is easy to hear. When a harpsichord's keys are pressed, the strings inside the ______ are plucked, not struck.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) instrument:\nB) instrument\nC) instrument—\nD) instrument,", "generated": [{"id": "16.1", "text": "A trombone may look similar to a trumpet, but the way sound is produced in the two instruments differs. When a trombone's slide is extended, the column of air inside the ______ is lengthened, not shortened.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) instrument:\nB) instrument\nC) instrument—\nD) instrument,", "answer": "B", "explanation": "No punctuation should separate \"instrument\" from the verb phrase that follows it."}, {"id": "16.2", "text": "A kayak may resemble a canoe at first glance, but the way each is propelled is easy to tell apart. When a kayak's double-bladed paddle is used, the water on both sides of the ______ is pushed, not pulled.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) kayak:\nB) kayak\nC) kayak—\nD) kayak,", "answer": "B", "explanation": "No punctuation should separate \"kayak\" from the verb phrase that follows it."}, {"id": "16.3", "text": "A harp may look similar to a lyre, but the way each produces sound is distinct. When a harp's pedal is pressed, the pitch of the string inside the ______ is raised, not lowered.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) harp:\nB) harp\nC) harp—\nD) harp,", "answer": "B", "explanation": "No punctuation should separate \"harp\" from the verb phrase that follows it."}, {"id": "16.4", "text": "A pump organ may look like a small piano, but the way sound is generated in the two instruments differs. When a pump organ's pedal is pressed, air inside the ______ is forced, not drawn.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) organ:\nB) organ\nC) organ—\nD) organ,", "answer": "B", "explanation": "No punctuation should separate \"organ\" from the verb phrase that follows it."}, {"id": "16.5", "text": "A bagpipe may look nothing like a flute, but the way each produces continuous sound is worth comparing. When a bagpipe's bag is squeezed, air stored inside the ______ is released, not held.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) bagpipe:\nB) bagpipe\nC) bagpipe—\nD) bagpipe,", "answer": "B", "explanation": "No punctuation should separate \"bagpipe\" from the verb phrase that follows it."}]}, {"n": 17, "concept": "Standard English Conventions: subject-verb agreement across an intervening relative clause.", "original": "\"He was just the man for such a place, and it was just the place for such a man.\" This line is from Frederick Douglass's autobiography Narrative of the Life of Frederick Douglass (1845). It's an example of antimetabole, a writing technique that ______ emphasis by repeating a statement in a reversed order.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) create\nB) are creating\nC) have created\nD) creates", "generated": [{"id": "17.1", "text": "This structure is an example of counterpoint, a compositional technique that ______ musical interest by layering two or more independent melodic lines against each other.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) create\nB) are creating\nC) have created\nD) creates", "answer": "D", "explanation": "The singular subject \"technique\" requires the singular verb \"creates.\""}, {"id": "17.2", "text": "This phrase is an example of litotes, a rhetorical device that ______ emphasis by denying the opposite of what is meant.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) achieve\nB) are achieving\nC) have achieved\nD) achieves", "answer": "D", "explanation": "The singular subject \"device\" requires the singular verb \"achieves.\""}, {"id": "17.3", "text": "This maneuver is an example of tacking, a sailing technique that ______ forward progress by angling a boat in a zigzag pattern against the wind.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) allow\nB) are allowing\nC) have allowed\nD) allows", "answer": "D", "explanation": "The singular subject \"technique\" requires the singular verb \"allows.\""}, {"id": "17.4", "text": "This method is an example of crop rotation, a farming practice that ______ soil fertility by alternating which nutrients different plants draw from the ground each season.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) preserve\nB) are preserving\nC) have preserved\nD) preserves", "answer": "D", "explanation": "The singular subject \"practice\" requires the singular verb \"preserves.\""}, {"id": "17.5", "text": "This pattern is an example of chiaroscuro, a painting technique that ______ depth by placing strong contrasts of light and shadow side by side.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) suggest\nB) are suggesting\nC) have suggested\nD) suggests", "answer": "D", "explanation": "The singular subject \"technique\" requires the singular verb \"suggests.\""}]}, {"n": 18, "concept": "Standard English Conventions: render an embedded/indirect question as a declarative statement, not a direct question.", "original": "Technologies such as microphones and inkjet printers are made using piezoelectric materials, which generate an internal electric field when pressure is applied to them. The toxic nature of some of these materials recently led a team from the University of Sheffield to investigate how ______.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) could their use be better regulated?\nB) their use could be better regulated.\nC) their use could be better regulated?\nD) could their use be better regulated.", "generated": [{"id": "18.1", "text": "Concerns about soil erosion on the hillside recently led a team of agronomists to investigate how ______.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) could terraced planting reduce runoff?\nB) terraced planting could reduce runoff.\nC) terraced planting could reduce runoff?\nD) could terraced planting reduce runoff.", "answer": "B", "explanation": "An indirect question after \"investigate how\" takes declarative word order and ends with a period."}, {"id": "18.2", "text": "Reports of declining bee populations recently led a team of ecologists to investigate whether ______.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were pesticide residues affecting hive survival?\nB) pesticide residues were affecting hive survival.\nC) pesticide residues were affecting hive survival?\nD) were pesticide residues affecting hive survival.", "answer": "B", "explanation": "An indirect question after \"investigate whether\" takes declarative word order and ends with a period."}, {"id": "18.3", "text": "Unusual cracking in the bridge's supports recently led a team of engineers to investigate how ______.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) could the load limits be safely adjusted?\nB) the load limits could be safely adjusted.\nC) the load limits could be safely adjusted?\nD) could the load limits be safely adjusted.", "answer": "B", "explanation": "An indirect question after \"investigate how\" takes declarative word order and ends with a period."}, {"id": "18.4", "text": "Rising rates of a rare eye condition recently led a team of ophthalmologists to investigate whether ______.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) was screen time a contributing factor?\nB) screen time was a contributing factor.\nC) screen time was a contributing factor?\nD) was screen time a contributing factor.", "answer": "B", "explanation": "An indirect question after \"investigate whether\" takes declarative word order and ends with a period."}, {"id": "18.5", "text": "Complaints about slow checkout lines recently led a team of store managers to investigate how ______.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) could wait times be shortened?\nB) wait times could be shortened.\nC) wait times could be shortened?\nD) could wait times be shortened.", "answer": "B", "explanation": "An indirect question after \"investigate how\" takes declarative word order and ends with a period."}]}, {"n": 19, "concept": "Standard English Conventions: use the simple present tense to match an ongoing, present-tense description of how a structure works.", "original": "Each night in Girona, Spain, a section of the city's marina is bathed in a soft green glow. The source of the glow is the Arbol de la Sidra, a large sculpture made up of 3,200 recycled glass bottles. A lamp inside the tree-shaped structure ______ the green glass.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) will be illuminating\nB) illuminates\nC) would illuminate\nD) illuminated", "generated": [{"id": "19.1", "text": "Each evening in Lyon, France, a stretch of the city's riverfront glows a soft amber. The source of the glow is La Lanterne, a sculpture made of hundreds of stacked glass panels. A row of LED fixtures inside the panel-covered frame ______ the glass.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) will be lighting\nB) lights\nC) would light\nD) lit", "answer": "B", "explanation": "The surrounding present-tense description calls for the simple present verb \"lights.\""}, {"id": "19.2", "text": "Each morning in a quiet courtyard in Kyoto, a shallow basin fills with a thin sheet of water. The mechanism behind the basin is a bamboo device called a shishi-odoshi. A slow trickle of water from a nearby spring ______ the bamboo tube until it tips and strikes a stone.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) will be filling\nB) fills\nC) would fill\nD) filled", "answer": "B", "explanation": "The surrounding present-tense description calls for the simple present verb \"fills.\""}, {"id": "19.3", "text": "Each night in a small plaza in Valencia, a fountain shifts through shades of blue and violet. The source of the color is a ring of submerged LED panels. A control box hidden beneath the fountain's base ______ the sequence of colors.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) will be adjusting\nB) adjusts\nC) would adjust\nD) adjusted", "answer": "B", "explanation": "The surrounding present-tense description calls for the simple present verb \"adjusts.\""}, {"id": "19.4", "text": "Each afternoon on a hillside outside Florence, a row of mirrors tracks the sun across an olive grove. The system behind the mirrors is a set of solar concentrators. A simple gear mechanism inside each unit's base ______ the angle of the mirror throughout the day.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) will be shifting\nB) shifts\nC) would shift\nD) shifted", "answer": "B", "explanation": "The surrounding present-tense description calls for the simple present verb \"shifts.\""}, {"id": "19.5", "text": "Each night in a garden outside Seoul, a row of paper lanterns glows a warm orange. The source of the light is a small candle sealed inside a wind-resistant frame. A ring of vents built into the lantern's base ______ the flame from gusts of wind.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) will be shielding\nB) shields\nC) would shield\nD) shielded", "answer": "B", "explanation": "The surrounding present-tense description calls for the simple present verb \"shields.\""}]}, {"n": 20, "concept": "Standard English Conventions: pronoun-antecedent agreement (its vs. their) with correct possessive apostrophe placement.", "original": "French philosopher Rene Descartes doubted whether he could prove his own existence. Eventually, he found proof in his famous phrase \"I think, therefore I am.\" The ______ complexity: only those who exist would be able to ponder their existence.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) phrases simplicity masks its\nB) phrases simplicity masks their\nC) phrase's simplicity masks their\nD) phrase's simplicity masks its", "generated": [{"id": "20.1", "text": "French mathematician Henri Poincare once mused that intuition often outruns proof. The remark's brevity masks ______ depth: only those who have wrestled with an unproven conjecture would fully grasp what he meant.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) remarks brevity masks their\nB) remarks brevity masks its\nC) remark's brevity masks their\nD) remark's brevity masks its", "answer": "D", "explanation": "The singular possessive \"remark's\" needs the singular pronoun \"its\" to agree with it."}, {"id": "20.2", "text": "The engineer's motto was that a bridge should disappear into its landscape. The saying's plainness masks ______ ambition: only those who have designed a structure meant to vanish would appreciate the difficulty involved.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) sayings plainness masks their\nB) sayings plainness masks its\nC) saying's plainness masks their\nD) saying's plainness masks its", "answer": "D", "explanation": "The singular possessive \"saying's\" needs the singular pronoun \"its\" to agree with it."}, {"id": "20.3", "text": "The proverb held that a still pond reflects best. The proverb's shortness masks ______ subtlety: only those who have sat by genuinely still water would notice how precisely it describes calm reflection.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) proverbs shortness masks their\nB) proverbs shortness masks its\nC) proverb's shortness masks their\nD) proverb's shortness masks its", "answer": "D", "explanation": "The singular possessive \"proverb's\" needs the singular pronoun \"its\" to agree with it."}, {"id": "20.4", "text": "The theorem states that every bounded sequence contains a convergent subsequence. The statement's compactness masks ______ significance: only those who have tried to prove it from scratch would appreciate how much it actually claims.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) statements compactness masks their\nB) statements compactness masks its\nC) statement's compactness masks their\nD) statement's compactness masks its", "answer": "D", "explanation": "The singular possessive \"statement's\" needs the singular pronoun \"its\" to agree with it."}, {"id": "20.5", "text": "The riddle asked what walks on four legs, then two, then three. The riddle's simplicity masks ______ cleverness: only those who have puzzled over its shifting image of a single life would see how tightly it is constructed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) riddles simplicity masks their\nB) riddles simplicity masks its\nC) riddle's simplicity masks their\nD) riddle's simplicity masks its", "answer": "D", "explanation": "The singular possessive \"riddle's\" needs the singular pronoun \"its\" to agree with it."}]}, {"n": 21, "concept": "Standard English Conventions (Boundaries): no comma is needed before a restrictive appositive that specifies exactly which one.", "original": "Fans of the film Moana (2016) may not know that the deep and humorous voice behind the ______ belongs to comedian, actor, and musician Jemaine Clement. The versatile performer has appeared in everything from television commercials to action movies, but voice acting, specifically, has become a notable part of his career.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) character Tamatoa the crab\nB) character Tamatoa the crab,\nC) character: Tamatoa the crab\nD) character, Tamatoa the crab", "generated": [{"id": "21.1", "text": "Fans of the animated series Wildwood Hollow may not know that the gravelly, world-weary voice behind the ______ belongs to actor and singer Odalys Fenn, who has otherwise built a career almost entirely on romantic comedies.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) character Grumble the badger\nB) character Grumble the badger,\nC) character: Grumble the badger\nD) character, Grumble the badger", "answer": "A", "explanation": "\"Grumble the badger\" restrictively specifies which character, so no punctuation should separate it from \"character.\""}, {"id": "21.2", "text": "Fans of the theme park's nightly parade may not know that the towering, illuminated ______ was designed by sculptor Rafael Quintero, who is better known for small, delicate glasswork than for large public installations.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) mascot Ember the phoenix\nB) mascot Ember the phoenix,\nC) mascot: Ember the phoenix\nD) mascot, Ember the phoenix", "answer": "A", "explanation": "\"Ember the phoenix\" restrictively specifies which mascot, so no punctuation should separate it from \"mascot.\""}, {"id": "21.3", "text": "Listeners of the long-running radio drama may not know that the booming, theatrical voice behind the ______ belongs to veteran broadcaster Delia Okoro, who spent most of her early career narrating nature documentaries.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) villain Count Marrow\nB) villain Count Marrow,\nC) villain: Count Marrow\nD) villain, Count Marrow", "answer": "A", "explanation": "\"Count Marrow\" restrictively specifies which villain, so no punctuation should separate it from \"villain.\""}, {"id": "21.4", "text": "Fans of the puppet show may not know that the squeaky, high-pitched voice behind the ______ belongs to puppeteer Simon Alvarado, who otherwise performs almost exclusively as a stern, low-voiced narrator.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) puppet Wobble the frog\nB) puppet Wobble the frog,\nC) puppet: Wobble the frog\nD) puppet, Wobble the frog", "answer": "A", "explanation": "\"Wobble the frog\" restrictively specifies which puppet, so no punctuation should separate it from \"puppet.\""}, {"id": "21.5", "text": "Fans of the video game series may not know that the calm, precise voice behind the ______ belongs to actor Nia Whitcombe, who has otherwise appeared mainly in fast-talking comic roles.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) navigator unit Compass\nB) navigator unit Compass,\nC) navigator unit: Compass\nD) navigator unit, Compass", "answer": "A", "explanation": "\"Compass\" restrictively specifies which navigator unit, so no punctuation should separate it from \"navigator unit.\""}]}, {"n": 22, "concept": "Transitions: choose the logical connector showing a result.", "original": "Celebrated Tewa potter Maria Martinez (1887-1980) made her signature all-black ceramic vessels using a heating technique called reduction firing. This technique involves smothering the flame surrounding the clay vessel. ______ the vessel takes on a shiny, black hue.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) For example,\nC) Previously,\nD) As a result,", "generated": [{"id": "22.1", "text": "Celebrated ceramicist Renata Blum creates her signature crackled glaze using a technique called thermal shock. This technique involves plunging a still-hot vessel into a cold water bath. ______ the glaze fractures into a fine, uniform network of lines.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) For example,\nC) Previously,\nD) As a result,", "answer": "D", "explanation": "The fracturing of the glaze is the direct result of the thermal shock, calling for \"As a result.\""}, {"id": "22.2", "text": "Master brewer Tobias Lund produces his signature cloudy ale using a process called kraeusening. This process involves adding a small amount of actively fermenting wort to the finished beer. ______ the beer undergoes a brief secondary fermentation that boosts its natural carbonation.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) For example,\nC) Previously,\nD) As a result,", "answer": "D", "explanation": "The secondary fermentation is the direct result of adding the fermenting wort, calling for \"As a result.\""}, {"id": "22.3", "text": "Blacksmith Ingrid Solheim forges her signature mottled blades using a process called pattern welding. This process involves folding and hammering together layers of different steel alloys. ______ the blade's surface reveals a rippling, wood-grain-like pattern once polished and etched.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) For example,\nC) Previously,\nD) As a result,", "answer": "D", "explanation": "The rippling pattern is the direct result of folding the steel layers, calling for \"As a result.\""}, {"id": "22.4", "text": "Papermaker Dae-jung Lim produces his signature translucent sheets using a process called sun-bleaching. This process involves laying wet pulp sheets flat under direct sunlight for several days. ______ the sheets lose their natural yellow tint and take on an even, pale color.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) For example,\nC) Previously,\nD) As a result,", "answer": "D", "explanation": "The loss of yellow tint is the direct result of the sun-bleaching, calling for \"As a result.\""}, {"id": "22.5", "text": "Cheesemaker Paola Rinaldi produces her signature blue-veined wheel using a process called needling. This process involves piercing the aging cheese with thin steel rods to let air reach its interior. ______ mold spores already present in the cheese spread along the punctured channels.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) For example,\nC) Previously,\nD) As a result,", "answer": "D", "explanation": "The spreading of mold spores is the direct result of the needling process, calling for \"As a result.\""}]}, {"n": 23, "concept": "Transitions: choose the logical connector showing similarity between two people's approaches.", "original": "In the early 1970s, Albert Popa took up graffiti art, spraying his work onto what was at the time an unconventional surface: concrete. Albert's son David has chosen an unusual canvas for his new art project, Fractured. In this remarkable work, the artist draws charcoal faces onto fragmented ice floes in Finland, creating the visual effect of a face slowly fracturing.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Indeed,\nC) Second,\nD) Likewise,", "generated": [{"id": "23.1", "text": "In the early 1960s, sculptor Amara Diallo began welding scrap car parts into large outdoor pieces, an unusual choice of material for fine art at the time. Amara's granddaughter Fatou has chosen an equally unconventional medium for her new project, Static. In this striking series, the artist arranges discarded television sets into wall-sized mosaics, creating the visual effect of a single fractured image spread across dozens of screens.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Indeed,\nC) Second,\nD) Likewise,", "answer": "D", "explanation": "Fatou's unconventional-material approach parallels her grandmother's, calling for \"Likewise.\""}, {"id": "23.2", "text": "In the early 1970s, photographer Hugo Meier began developing prints directly onto sheets of scavenged metal, an unusual surface for photography at the time. Hugo's son Tobias has chosen an equally unusual canvas for his new project, Rust Line. In this remarkable series, the artist projects old family photographs onto rusted shipping containers, creating the visual effect of memories bleeding into decay.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Indeed,\nC) Second,\nD) Likewise,", "answer": "D", "explanation": "Tobias's unconventional-surface approach parallels his father's, calling for \"Likewise.\""}, {"id": "23.3", "text": "In the early 1980s, textile artist Beatriz Nunes began weaving discarded fishing nets into large tapestries, an unusual material for textile art at the time. Beatriz's nephew Caio has chosen an equally unusual material for his new project, Tideline. In this remarkable installation, the artist knots together sun-bleached plastic bottle caps collected from local beaches, creating the visual effect of a wave frozen mid-crash.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Indeed,\nC) Second,\nD) Likewise,", "answer": "D", "explanation": "Caio's unconventional-material approach parallels his aunt's, calling for \"Likewise.\""}, {"id": "23.4", "text": "In the early 1990s, printmaker Selim Aksoy began carving his blocks from discarded wooden pallets instead of traditional woodblock panels, an unusual choice at the time. Selim's daughter Elif has chosen an equally unusual material for her new project, Fault Line. In this compelling series, the artist etches her images directly into salvaged roof tiles, creating the visual effect of a landscape cracking open.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Indeed,\nC) Second,\nD) Likewise,", "answer": "D", "explanation": "Elif's unconventional-material approach parallels her father's, calling for \"Likewise.\""}, {"id": "23.5", "text": "In the early 2000s, muralist Chidi Obi began painting directly onto crumbling concrete overpasses, an unusual canvas for public art at the time. Chidi's protege Amara has chosen an equally unusual surface for her new project, Drift. In this striking work, the artist paints portraits onto abandoned shipping pallets left to weather outdoors, creating the visual effect of faces slowly dissolving into the grain of the wood.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Indeed,\nC) Second,\nD) Likewise,", "answer": "D", "explanation": "Amara's unconventional-surface approach parallels her mentor's, calling for \"Likewise.\""}]}, {"n": 24, "concept": "Transitions: choose the logical connector introducing a specific example of a general claim.", "original": "Mary Ellen Pleasant, a successful entrepreneur during the gold rush era, earned the moniker \"Mother of Human Rights in California\" after successfully challenging discrimination in the state. ______ in 1866, she sued a streetcar company for denying her and other Black riders service, a suit she eventually won when the California Supreme Court declared it illegal for carriers to exclude passengers based on race.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Then,\nC) In addition,\nD) Specifically,", "generated": [{"id": "24.1", "text": "Community organizer Beatrice Adeyemi earned the nickname \"the Landlord's Headache\" after successfully challenging unsafe housing conditions in her city. ______ in 1978, she led a rent strike against a property management company that had ignored tenant complaints for years, a campaign she eventually won when the city council passed new inspection requirements for rental units.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Then,\nC) In addition,\nD) Specifically,", "answer": "D", "explanation": "The 1978 rent strike is a specific instance of the general claim about challenging housing conditions, calling for \"Specifically.\""}, {"id": "24.2", "text": "Labor organizer Franco Bellandi earned the moniker \"the Dockworkers' Voice\" after successfully challenging unsafe conditions at the city's ports. ______ in 1954, he organized a walkout over faulty loading equipment that had injured several workers, a campaign he eventually won when the port authority agreed to mandatory equipment inspections.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Then,\nC) In addition,\nD) Specifically,", "answer": "D", "explanation": "The 1954 walkout is a specific instance of the general claim about challenging port conditions, calling for \"Specifically.\""}, {"id": "24.3", "text": "Civil engineer Marisol Vega earned recognition as \"the City's Watchdog\" after successfully challenging a series of unsafe bridge repairs. ______ in 1996, she petitioned against a contractor's use of substandard steel on a downtown overpass, a campaign she eventually won when the state transportation board revoked the contractor's license.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Then,\nC) In addition,\nD) Specifically,", "answer": "D", "explanation": "The 1996 petition is a specific instance of the general claim about challenging unsafe repairs, calling for \"Specifically.\""}, {"id": "24.4", "text": "Environmental lawyer Desmond Okafor earned the title \"the River's Advocate\" after successfully challenging industrial pollution along a major waterway. ______ in 1988, he sued a manufacturing plant for illegally discharging chemical waste into the river, a case he eventually won when a federal court ordered the plant to install new filtration systems.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Then,\nC) In addition,\nD) Specifically,", "answer": "D", "explanation": "The 1988 lawsuit is a specific instance of the general claim about challenging pollution, calling for \"Specifically.\""}, {"id": "24.5", "text": "Nurse and public health advocate Ingrid Kowalski earned the nickname \"the Clinic's Champion\" after successfully challenging a hospital's discriminatory admissions practices. ______ in 1965, she filed a formal complaint over patients being turned away based on their neighborhood of residence, a case she eventually won when the hospital board adopted a new admissions policy.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Then,\nC) In addition,\nD) Specifically,", "answer": "D", "explanation": "The 1965 complaint is a specific instance of the general claim about challenging admissions practices, calling for \"Specifically.\""}]}, {"n": 25, "concept": "Transitions: choose the logical connector introducing an additional, related point.", "original": "The Inca of South America used intricately knotted string devices called quipus to record countable information, like population data and payments. ______ they may have used quipus to record more complex information, like stories and myths, according to researchers.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) In other words,\nC) In addition,\nD) For example,", "generated": [{"id": "25.1", "text": "Andean herders have long used woven belts called chumpis to indicate social status and regional identity through their patterns. ______ some researchers believe the belts' knotted fringes may have once served as a portable counting device for tracking livestock, according to textile historians.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) In other words,\nC) In addition,\nD) For example,", "answer": "C", "explanation": "The counting-device use adds a further, related possible function, calling for \"In addition.\""}, {"id": "25.2", "text": "Medieval European monks used illuminated manuscripts primarily to preserve religious texts for future generations. ______ some scholars believe the elaborate marginal illustrations may have served as memory aids for scribes reciting long passages aloud, according to recent manuscript studies.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) In other words,\nC) In addition,\nD) For example,", "answer": "C", "explanation": "The memory-aid use adds a further, related possible function, calling for \"In addition.\""}, {"id": "25.3", "text": "Polynesian navigators used woven stick charts primarily to represent known ocean swell patterns near their home islands. ______ some researchers believe the charts may have also functioned as teaching tools passed between generations of apprentice navigators, according to maritime historians.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) In other words,\nC) In addition,\nD) For example,", "answer": "C", "explanation": "The teaching-tool use adds a further, related possible function, calling for \"In addition.\""}, {"id": "25.4", "text": "Ancient Mesopotamian scribes used clay tokens primarily to record simple counts of grain and livestock in early accounting systems. ______ some archaeologists believe the tokens may have also been used in early forms of contractual agreement between traders, according to recent excavation reports.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) In other words,\nC) In addition,\nD) For example,", "answer": "C", "explanation": "The contractual use adds a further, related possible function, calling for \"In addition.\""}, {"id": "25.5", "text": "West African griots used call-and-response songs primarily to preserve genealogies and community histories across generations. ______ some ethnomusicologists believe certain song structures may have also encoded practical information, such as planting schedules, according to recent fieldwork.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) In other words,\nC) In addition,\nD) For example,", "answer": "C", "explanation": "The practical-information use adds a further, related possible function, calling for \"In addition.\""}]}, {"n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a person's achievement.", "original": "While researching a topic, a student has taken the following notes:\n- In the 1930s, the Imperial Sugar Cane Institute in India sought to limit the country's dependence on imported sugarcane.\n- The institute enlisted botanist Janaki Ammal to breed a local variety of sugarcane.\n- She crossbred the imported sugarcane species Saccharum officinarum with grasses native to India.\n- She succeeded in creating sugarcane hybrids well suited to India's climate.\n\nThe student wants to emphasize Janaki Ammal's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) By crossbreeding the imported sugarcane species Saccharum officinarum with grasses native to India, Ammal succeeded in creating sugarcane hybrids well suited to India's climate.\nB) In the 1930s, the Imperial Sugar Cane Institute, which enlisted Ammal, sought to limit dependence on imported sugarcane.\nC) Ammal was enlisted by the Imperial Sugar Cane Institute at a time when a local variety of sugarcane needed to be produced.\nD) As part of efforts to breed a local variety of sugarcane, an imported sugarcane species called Saccharum officinarum was crossbred with grasses native to India.", "generated": [{"id": "26.1", "text": "While researching a topic, a student has taken the following notes:\n- In the 1950s, the National Weaving Cooperative in Guatemala sought to reduce reliance on imported synthetic dyes.\n- The cooperative enlisted chemist Elena Rios to develop dyes from local plants.\n- She experimented with cochineal insects and indigo-bearing plants native to the region.\n- She succeeded in creating a stable, colorfast dye palette suited to the cooperative's traditional looms.\n\nThe student wants to emphasize Elena Rios's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) By experimenting with cochineal insects and indigo-bearing plants native to the region, Rios succeeded in creating a stable, colorfast dye palette suited to the cooperative's traditional looms.\nB) In the 1950s, the National Weaving Cooperative, which enlisted Rios, sought to reduce reliance on imported synthetic dyes.\nC) Rios was enlisted by the National Weaving Cooperative at a time when a local dye source was needed.\nD) As part of efforts to develop local dyes, cochineal insects and indigo-bearing plants native to the region were used.", "answer": "A", "explanation": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it."}, {"id": "26.2", "text": "While researching a topic, a student has taken the following notes:\n- In the 1960s, the Regional Beekeepers Association in Slovenia sought to reduce colony losses during harsh winters.\n- The association enlisted entomologist Janez Kovac to breed a hardier bee strain.\n- He crossbred the local Carniolan honeybee with cold-tolerant strains from northern regions.\n- He succeeded in producing a bee strain with significantly improved winter survival rates.\n\nThe student wants to emphasize Janez Kovac's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) By crossbreeding the local Carniolan honeybee with cold-tolerant strains from northern regions, Kovac succeeded in producing a bee strain with significantly improved winter survival rates.\nB) In the 1960s, the Regional Beekeepers Association, which enlisted Kovac, sought to reduce colony losses during harsh winters.\nC) Kovac was enlisted by the Regional Beekeepers Association at a time when a hardier bee strain was needed.\nD) As part of efforts to breed a hardier bee, the local Carniolan honeybee was crossbred with cold-tolerant strains from northern regions.", "answer": "A", "explanation": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it."}, {"id": "26.3", "text": "While researching a topic, a student has taken the following notes:\n- In the 1940s, the Coastal Fisheries Board in Portugal sought to reduce dependence on a single, overfished sardine stock.\n- The board enlisted marine biologist Ines Cardoso to identify sustainable alternative species.\n- She surveyed local waters and identified two underused fish species with stable populations.\n- She succeeded in establishing new fishing guidelines that shifted pressure away from the sardine stock.\n\nThe student wants to emphasize Ines Cardoso's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) By surveying local waters and identifying two underused fish species with stable populations, Cardoso succeeded in establishing new fishing guidelines that shifted pressure away from the sardine stock.\nB) In the 1940s, the Coastal Fisheries Board, which enlisted Cardoso, sought to reduce dependence on a single, overfished sardine stock.\nC) Cardoso was enlisted by the Coastal Fisheries Board at a time when alternative fish species needed to be identified.\nD) As part of efforts to reduce overfishing, two underused fish species with stable populations were identified in local waters.", "answer": "A", "explanation": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it."}, {"id": "26.4", "text": "While researching a topic, a student has taken the following notes:\n- In the 1930s, the Municipal Water Authority in a Brazilian city sought to reduce losses from an aging pipe network.\n- The authority enlisted engineer Paulo Andrade to design a low-cost leak-detection method.\n- He adapted acoustic listening devices originally built for other industrial uses.\n- He succeeded in cutting the city's water losses by nearly a third within two years.\n\nThe student wants to emphasize Paulo Andrade's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) By adapting acoustic listening devices originally built for other industrial uses, Andrade succeeded in cutting the city's water losses by nearly a third within two years.\nB) In the 1930s, the Municipal Water Authority, which enlisted Andrade, sought to reduce losses from an aging pipe network.\nC) Andrade was enlisted by the Municipal Water Authority at a time when a leak-detection method was needed.\nD) As part of efforts to reduce water loss, acoustic listening devices originally built for other industrial uses were adapted.", "answer": "A", "explanation": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it."}, {"id": "26.5", "text": "While researching a topic, a student has taken the following notes:\n- In the 1970s, the National Seed Bank in India sought to preserve traditional rice varieties threatened by modernization.\n- The seed bank enlisted botanist Meera Nair to catalog and store endangered local strains.\n- She traveled to remote farming villages to collect seed samples directly from farmers.\n- She succeeded in preserving over two hundred traditional rice varieties that would otherwise have been lost.\n\nThe student wants to emphasize Meera Nair's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) By traveling to remote farming villages to collect seed samples directly from farmers, Nair succeeded in preserving over two hundred traditional rice varieties that would otherwise have been lost.\nB) In the 1970s, the National Seed Bank, which enlisted Nair, sought to preserve traditional rice varieties threatened by modernization.\nC) Nair was enlisted by the National Seed Bank at a time when traditional rice varieties needed to be preserved.\nD) As part of efforts to preserve rice varieties, seed samples were collected directly from farmers in remote villages.", "answer": "A", "explanation": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it."}]}, {"n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies a causal mechanism.", "original": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"freeze-thaw\" battery that can retain 92% of its charge after twelve weeks.\n- The battery contains molten salt (a type of salt that liquefies when heated and solidifies at room temperature).\n- When the salt is in a liquid state, energy flows through the battery.\n- When the salt is in a solid state, energy stops flowing and is stored in the battery.\n- The stored (frozen) energy can be used by reheating (thawing) the battery.\n\nThe student wants to specify how the salt enables energy storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Scientists have developed a freeze-thaw battery that contains molten salt, which liquefies when heated and solidifies at room temperature.\nB) The stored energy in a freeze-thaw battery, which contains molten salt, can be used by reheating the battery.\nC) When the molten salt in a freeze-thaw battery solidifies at room temperature, energy stops flowing and can be stored in the battery.\nD) Molten salt allows a freeze-thaw battery to retain 92% of its charge after twelve weeks.", "generated": [{"id": "27.1", "text": "While researching a topic, a student has taken the following notes:\n- Engineers have developed a \"thermal latch\" window coating that can retain heat for up to eight hours after sunset.\n- The coating contains a wax-based compound that melts at moderate temperatures and solidifies as it cools.\n- When the wax is in a liquid state, heat passes through the coating.\n- When the wax is in a solid state, heat transfer slows and warmth is retained near the glass.\n- The retained heat can be released back into the room once temperatures drop further.\n\nThe student wants to specify how the wax enables heat retention. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Engineers have developed a thermal latch coating that contains a wax-based compound, which melts at moderate temperatures and solidifies as it cools.\nB) The retained heat in a thermal latch coating, which contains a wax-based compound, can be released back into the room once temperatures drop further.\nC) When the wax-based compound in a thermal latch coating solidifies as it cools, heat transfer slows and warmth is retained near the glass.\nD) A wax-based compound allows a thermal latch coating to retain heat for up to eight hours after sunset.", "answer": "C", "explanation": "Choice C states the specific mechanism—solidifying slows heat transfer—linking cause to effect."}, {"id": "27.2", "text": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"pressure-lock\" seal that can hold gas inside a container for months without leaking.\n- The seal contains a gel-based layer that softens under pressure and stiffens once pressure is released.\n- When the gel is soft, gas molecules can slowly pass through microscopic gaps.\n- When the gel stiffens, the gaps close and gas is trapped inside.\n- The trapped gas can be released later by reapplying pressure to soften the gel again.\n\nThe student wants to specify how the gel enables gas storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Scientists have developed a pressure-lock seal that contains a gel-based layer, which softens under pressure and stiffens once pressure is released.\nB) The trapped gas in a pressure-lock seal, which contains a gel-based layer, can be released later by reapplying pressure.\nC) When the gel-based layer in a pressure-lock seal stiffens as pressure is released, the microscopic gaps close and gas becomes trapped inside.\nD) A gel-based layer allows a pressure-lock seal to hold gas inside a container for months without leaking.", "answer": "C", "explanation": "Choice C states the specific mechanism—stiffening closes the gaps—linking cause to effect."}, {"id": "27.3", "text": "While researching a topic, a student has taken the following notes:\n- Researchers have developed a \"cold-hold\" battery that can retain 85% of its charge after ten weeks.\n- The battery contains a wax-like electrolyte that liquefies when warmed and hardens at room temperature.\n- When the electrolyte is liquid, ions move freely and the battery can charge or discharge.\n- When the electrolyte hardens, ion movement stops and the charge is locked in place.\n- The locked charge can be accessed again by warming the battery.\n\nThe student wants to specify how the electrolyte enables charge storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Researchers have developed a cold-hold battery that contains a wax-like electrolyte, which liquefies when warmed and hardens at room temperature.\nB) The locked charge in a cold-hold battery, which contains a wax-like electrolyte, can be accessed again by warming the battery.\nC) When the wax-like electrolyte in a cold-hold battery hardens at room temperature, ion movement stops and the charge is locked in place.\nD) A wax-like electrolyte allows a cold-hold battery to retain 85% of its charge after ten weeks.", "answer": "C", "explanation": "Choice C states the specific mechanism—hardening stops ion movement—linking cause to effect."}, {"id": "27.4", "text": "While researching a topic, a student has taken the following notes:\n- Engineers have developed a \"flow-freeze\" heat exchanger that can store excess heat for later use.\n- The exchanger contains a salt-based fluid that flows freely when hot and crystallizes when cooled.\n- When the fluid flows, heat moves through the exchanger and is released to the surroundings.\n- When the fluid crystallizes, heat movement stops and thermal energy is stored within the crystal structure.\n- The stored energy can be released later by reheating the fluid.\n\nThe student wants to specify how the fluid enables heat storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Engineers have developed a flow-freeze heat exchanger that contains a salt-based fluid, which flows freely when hot and crystallizes when cooled.\nB) The stored energy in a flow-freeze heat exchanger, which contains a salt-based fluid, can be released later by reheating the fluid.\nC) When the salt-based fluid in a flow-freeze heat exchanger crystallizes as it cools, heat movement stops and thermal energy is stored within the crystal structure.\nD) A salt-based fluid allows a flow-freeze heat exchanger to store excess heat for later use.", "answer": "C", "explanation": "Choice C states the specific mechanism—crystallizing stops heat movement—linking cause to effect."}, {"id": "27.5", "text": "While researching a topic, a student has taken the following notes:\n- Scientists have developed a \"damp-lock\" capacitor that can hold an electrical charge for several days.\n- The capacitor contains a polymer layer that absorbs moisture and swells, then dries and contracts over time.\n- When the polymer is swollen, charge can move freely across the layer.\n- When the polymer contracts as it dries, charge movement stops and the charge is held in place.\n- The held charge can be released again once the polymer reabsorbs moisture.\n\nThe student wants to specify how the polymer enables charge storage. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Scientists have developed a damp-lock capacitor that contains a polymer layer, which absorbs moisture and swells, then dries and contracts over time.\nB) The held charge in a damp-lock capacitor, which contains a polymer layer, can be released again once the polymer reabsorbs moisture.\nC) When the polymer layer in a damp-lock capacitor contracts as it dries, charge movement stops and the charge is held in place.\nD) A polymer layer allows a damp-lock capacitor to hold an electrical charge for several days.", "answer": "C", "explanation": "Choice C states the specific mechanism—contracting stops charge movement—linking cause to effect."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
