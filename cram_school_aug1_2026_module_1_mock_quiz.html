  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: choose a word/phrase meaning \"influenced by\" for an artist's creative process.", "original": "Whether Carmen Lomas Garza is creating small paintings and illustrations or large public artworks—such as Baile, a copper cutout of a traditional Mexican dance in the San Francisco International Airport—she is ______ direct experience, drawing from memories of her childhood in Texas or details of her current surroundings in California.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) complimented by\nB) uncertain about\nC) unbothered by\nD) inspired by", "generated": [{"id": "1.1", "text": "Whether chef Amara Osei is developing a five-course tasting menu or a single street-food dish, she is ______ the seasonal produce of her grandmother's garden, adapting recipes to reflect whatever vegetables and herbs are ready to harvest that week.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) skeptical of\nB) indifferent to\nC) guided by\nD) unaffected by", "answer": "C", "explanation": "Adapting recipes to reflect the garden's produce shows the chef is influenced by it."}, {"id": "1.2", "text": "Whether composing a symphony for a full orchestra or a simple lullaby for solo piano, composer Henrik Larsen is ______ the folk melodies he heard sung in his grandparents' village, often weaving fragments of those tunes into his own original themes.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) dismissive of\nB) shaped by\nC) suspicious of\nD) detached from", "answer": "B", "explanation": "Weaving fragments of the folk tunes into his themes shows the composer is influenced by them."}, {"id": "1.3", "text": "Whether designing a modest footbridge or a sprawling museum complex, architect Teodora Voss is ______ the eroded canyon walls near her hometown, repeatedly echoing their layered, sweeping curves in the buildings' facades.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) inspired by\nB) unconvinced by\nC) irritated by\nD) neutral toward", "answer": "A", "explanation": "Repeatedly echoing the canyon's curves in her designs shows the architect draws inspiration from them."}, {"id": "1.4", "text": "Whether corresponding with strangers or close friends, poet Miriam Okafor is ______ the handwritten letters her mother saved from decades of family correspondence, often borrowing a phrase or an image directly from their fading pages.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) drawn from\nB) baffled by\nC) opposed to\nD) careless with", "answer": "A", "explanation": "Borrowing phrases and images from the letters shows the poet's work is drawn from them."}, {"id": "1.5", "text": "Whether shooting a low-budget short or a big-studio feature, filmmaker Diego Reyes is ______ the recurring dream he had as a child of a house whose rooms rearranged themselves overnight, a dream he has now reimagined in nearly every film he has made.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unmoved by\nB) rooted in\nC) puzzled by\nD) resistant to", "answer": "B", "explanation": "Reimagining the childhood dream in nearly every film shows his work is rooted in that memory."}]}, {"n": 2, "concept": "Words in Context: choose a word meaning \"uniform\" that is contradicted by a list of diverse examples.", "original": "Disproving the common misconception of Native art as ______, the painters whose work appears in the collection at the National Museum of the American Indian employ a range of styles. There are artists working in the traditional arts of their specific tribal communities, artists working in European modernist or American abstract expressionist art traditions, and artists blending various traditions into something wholly new.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) uncontroversial\nB) individualistic\nC) theoretical\nD) homogeneous", "generated": [{"id": "2.1", "text": "Disproving the common misconception of a country's regional cuisine as ______, the dishes served across its provinces reveal sharp differences in spice, technique, and staple ingredient. Coastal towns favor light broths and raw seafood, mountain villages rely on slow-braised meats and preserved vegetables, and the capital blends both traditions with imported spices from centuries of trade.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) homogeneous\nB) seasonal\nC) affordable\nD) forgotten", "answer": "A", "explanation": "The listed regional differences disprove the idea that the cuisine is uniform."}, {"id": "2.2", "text": "Disproving the common misconception of protest music as ______, historians point to recordings that range from quiet acoustic ballads to full orchestral arrangements to sparse electronic tracks, each shaped by the political moment and available technology of its decade.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) uniform\nB) obscure\nC) temporary\nD) unpopular", "answer": "A", "explanation": "The range of musical styles disproves the idea that protest music is all alike."}, {"id": "2.3", "text": "Disproving the common misconception of the species' nesting habits as ______, field biologists have documented colonies that build elevated stick platforms, others that burrow into riverbanks, and still others that simply scrape a shallow depression in open sand.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) invariable\nB) seasonal\nC) instinctive\nD) inefficient", "answer": "A", "explanation": "The variety of nesting strategies disproves the idea that the habit never varies."}, {"id": "2.4", "text": "Disproving the common misconception of the early labor movement as ______, archival records reveal factions that pursued shop-floor bargaining, others that lobbied for national legislation, and still others that organized entirely separate cooperative enterprises.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) monolithic\nB) illegal\nC) short-lived\nD) secretive", "answer": "A", "explanation": "The described factions disprove the idea that the movement acted as a single, undivided bloc."}, {"id": "2.5", "text": "Disproving the common misconception of coral reef fish communities as ______, marine surveys have found some reefs dominated by a handful of generalist species while neighboring reefs, only a few kilometers away, support dozens of specialized species found nowhere else.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) identical\nB) fragile\nC) declining\nD) unstudied", "answer": "A", "explanation": "The contrast between neighboring reefs disproves the idea that such communities are all the same."}]}, {"n": 3, "concept": "Words in Context: choose a noun describing the magnitude/extent of a difference.", "original": "Recent measurements of the mass of the boson (a subatomic particle) were notable not only for the mere fact that the particle's mass differed from expectations but for the ______ of that difference. The measured mass of the boson was seven standard deviations higher than predicted by the standard model of particle physics.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) cause\nB) existence\nC) implication\nD) scale", "generated": [{"id": "3.1", "text": "Recent measurements of the average temperature of the lake bed were notable not only for the fact that the reading differed from expectations but for the ______ of that difference: the measured temperature was nearly nine degrees higher than models based on decades of prior data had predicted.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) cause\nB) duration\nC) magnitude\nD) purpose", "answer": "C", "explanation": "The nine-degree figure points to a word describing how large the difference was."}, {"id": "3.2", "text": "Astronomers who tracked the star's sudden brightening were struck not merely by the change itself but by the ______ of that change: within six hours, the star's luminosity had increased by a factor of nearly two hundred.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) origin\nB) extent\nC) intention\nD) history", "answer": "B", "explanation": "The two-hundred-fold increase points to a word describing how great the change was."}, {"id": "3.3", "text": "Economists reviewing the new employment survey were surprised less by the direction of the shift than by the ______ of it: the number of workers who changed industries within a single year was nearly triple the historical average.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) scope\nB) motive\nC) legality\nD) novelty", "answer": "A", "explanation": "The tripled figure points to a word describing how broad the shift was."}, {"id": "3.4", "text": "Glaciologists monitoring the retreat of the ice sheet were concerned not simply that it was retreating but by the ______ of the retreat: satellite images showed the glacier's edge had moved back nearly a kilometer in a single decade.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) cause\nB) location\nC) scale\nD) reversibility", "answer": "C", "explanation": "The one-kilometer figure points to a word describing how large the retreat was."}, {"id": "3.5", "text": "Analysts reviewing the firm's quarterly report were less concerned with the fact of a loss than with the ______ of that loss: revenue had fallen by more than sixty percent compared with the same quarter the previous year.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) timing\nB) degree\nC) secrecy\nD) origin", "answer": "B", "explanation": "The sixty-percent figure points to a word describing how severe the loss was."}]}, {"n": 4, "concept": "Words in Context: choose a verb meaning to reduce/shorten a range, distance, or capacity.", "original": "Birds sing to communicate over potentially great distances. For this reason, many researchers believe that birds in densely vegetated habitats generally sing at lower frequencies than birds living in comparatively sparse habitats, since dense vegetation tends to ______ the distance that high-frequency sounds can travel.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) exceed\nB) diminish\nC) encompass\nD) conceal", "generated": [{"id": "4.1", "text": "Ships navigating the strait rely on radar because heavy fog tends to ______ the distance at which lookouts can spot approaching vessels, sometimes reducing visibility to less than one hundred meters.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) extend\nB) shorten\nC) measure\nD) predict", "answer": "B", "explanation": "Reducing visibility to under one hundred meters shows the fog shortens the sighting distance."}, {"id": "4.2", "text": "Engineers designing the new headphones found that soft foam padding tends to ______ the range of low-frequency sounds that reach the wearer's ear, blocking most engine noise while leaving voices audible.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) restrict\nB) amplify\nC) record\nD) clarify", "answer": "A", "explanation": "Blocking most engine noise while letting voices through shows the padding narrows the range of sound reaching the ear."}, {"id": "4.3", "text": "Botanists studying the shrub found that shallow, rocky soil tends to ______ how far its roots can spread, forcing the plant to rely on a dense network of surface roots rather than a single deep taproot.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) broaden\nB) limit\nC) fertilize\nD) disguise", "answer": "B", "explanation": "Forcing reliance on shallow surface roots shows the soil restricts how far the roots can spread."}, {"id": "4.4", "text": "Submarine communication is difficult because seawater tends to ______ the range over which low-frequency radio signals can travel, forcing crews to rely on extremely long antennas or sound-based systems instead.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) curtail\nB) chart\nC) energize\nD) duplicate", "answer": "A", "explanation": "Forcing reliance on alternative systems shows seawater cuts down the range of the radio signals."}, {"id": "4.5", "text": "Ornithologists tracking the songbirds found that a lack of stopover wetlands tends to ______ how far the birds can migrate in a single season, sometimes stranding exhausted flocks well short of their usual breeding grounds.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) diminish\nB) publicize\nC) calculate\nD) reward", "answer": "A", "explanation": "Stranding flocks short of their usual grounds shows the lack of wetlands reduces how far they can migrate."}]}, {"n": 5, "concept": "Central Ideas and Details: identify the main purpose of a narrative passage that portrays a character's determination.", "original": "The following text is from Betty Smith's 1943 novel A Tree Grows in Brooklyn. Francie, a young girl, visits the library often.\n\nFrancie thought that all the books in the world were in that library and she had a plan about reading all the books in the world. She was reading a book a day in alphabetical order and not skipping the dry ones. She remembered that the first author had been Abbott. She had been reading a book a day for a long time now and she was still in the B's. Already she had read about bees and buffaloes, Bermuda vacations and Byzantine architecture. For her enthusiasm, she had to admit that some of the B's had been hard going. But Francie was a reader.\n\nWhich choice best states the main purpose of the text?\n\nA) To illustrate Francie's enjoyment of an unusual topic\nB) To explain why Francie prefers reading over other activities\nC) To portray Francie's determination to meet a goal\nD) To describe a book that Francie greatly admires", "generated": [{"id": "5.1", "text": "The following text is from a short story. Every summer, Malik decided he would learn to identify every bird that visited his grandmother's yard, working entirely from a battered field guide missing its back cover. He started with the sparrows because they were the plainest and, he reasoned, the easiest to get out of the way. By July he had moved on to warblers, squinting through binoculars at flickers of yellow in the highest branches, filling a notebook with crossed-out guesses. Some mornings the birds refused to show themselves at all, and Malik simply sat on the porch steps and waited, sure that patience was the last skill the guide couldn't teach him.\n\nWhich choice best states the main purpose of the text?\n\nA) To illustrate Malik's fondness for an unusual pastime\nB) To explain why Malik prefers bird-watching to other summer activities\nC) To portray Malik's persistence in working toward a self-imposed goal\nD) To describe a field guide that Malik particularly values", "answer": "C", "explanation": "The passage centers on Malik's steady, patient progress toward a goal he set for himself."}, {"id": "5.2", "text": "The following text is from a novel. Rosa had promised herself she would repair every chair in her late uncle's workshop before selling the building, even the three-legged ones warped beyond any obvious use. She learned to steam bend ash by ruining four strips of wood and consulting a library book so old its spine cracked when opened. Neighbors dropped by to ask when the workshop would finally be listed, and Rosa answered vaguely, already sanding down another armrest. By the time she finished the last chair, the for-sale sign had gathered a season's worth of dust in the hall closet.\n\nWhich choice best states the main purpose of the text?\n\nA) To illustrate Rosa's enjoyment of woodworking as a hobby\nB) To explain why Rosa decided not to sell her uncle's workshop\nC) To portray Rosa's determination to complete a task she set for herself\nD) To describe a piece of furniture that Rosa admired most", "answer": "C", "explanation": "The passage focuses on Rosa's persistence in finishing a self-imposed task despite distractions."}, {"id": "5.3", "text": "The following text is from a memoir. My father decided, the winter I turned nine, that our family would learn every constellation visible from the back field before spring. He photocopied star charts at the library and taped them to the refrigerator, and some nights we stood in the cold long after our fingers went numb, arguing about which faint cluster was Cassiopeia and which was simply a smudge on the chart. He never explained why it mattered so much, only that we would finish what he'd started, chart by chart, until the refrigerator was bare.\n\nWhich choice best states the main purpose of the text?\n\nA) To illustrate the father's interest in an unusual subject\nB) To explain why the father preferred astronomy to other winter activities\nC) To portray the father's resolve to see a self-set goal through to the end\nD) To describe a star chart that the father especially admired", "answer": "C", "explanation": "The passage emphasizes the father's resolve to finish the project he began, despite the cold and difficulty."}, {"id": "5.4", "text": "The following text is from a short story. Delphine had never run more than a mile before she signed up for the marathon, a decision she made mostly to prove something to herself rather than to anyone watching. She trained before dawn so no one would see her walking half the route, kept a log of every blister and every mile she managed to finish, and refused every excuse her body offered her to quit. On race day, she crossed the line four hours after the winner, smiling as though she had won something no clock could measure.\n\nWhich choice best states the main purpose of the text?\n\nA) To illustrate Delphine's enjoyment of long-distance running\nB) To explain why Delphine chose running over other forms of exercise\nC) To portray Delphine's determination to accomplish a goal she set for herself\nD) To describe a race that Delphine found particularly memorable", "answer": "C", "explanation": "The passage highlights Delphine's persistence in finishing a goal she set despite difficulty."}, {"id": "5.5", "text": "The following text is from a novel. Old Mr. Petrov decided that before he died he would translate his grandfather's diary, page by page, from a dialect that only a handful of people still spoke. He spent his afternoons hunched over a dictionary held together with tape, filling notebook after notebook with tentative English phrases he crossed out and rewrote. His daughter offered to hire a professional translator, but he waved her off each time, insisting that the words meant nothing unless he found them himself.\n\nWhich choice best states the main purpose of the text?\n\nA) To illustrate Mr. Petrov's fondness for an obscure dialect\nB) To explain why Mr. Petrov distrusted professional translators\nC) To portray Mr. Petrov's persistence in completing a task he set for himself\nD) To describe a diary that Mr. Petrov considered his family's most valuable possession", "answer": "C", "explanation": "The passage focuses on Mr. Petrov's insistence on completing the translation himself despite the difficulty."}]}, {"n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion concedes an exception to a broader claim.", "original": "The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and—more affordably—steam baths. While such amenities were available mainly to town dwellers, regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.\n\nWhich choice best describes the function of the underlined portion?\n\nA) It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.\nB) It describes a limitation of earlier historians' studies of medieval European bathing habits.\nC) It concedes that not all people in medieval Europe had access to public bathhouses.\nD) It explains why Janega decided to study the popularity of public bathhouses in medieval Europe.", "generated": [{"id": "6.1", "text": "Nineteenth-century factory workers have traditionally been seen as having no access to printed reading material, but modern research has shown that this is largely an oversimplification. According to historian Owen Bracewell, most industrial towns had at least one subscription library that circulated inexpensive serialized novels among workers. While such libraries were concentrated mainly in larger mill towns, informal book-sharing among coworkers and readings aloud during breaks were common practices throughout the industrial regions.\n\nWhich choice best describes the function of the underlined portion?\n\nA) It asserts that subscription libraries were more common in small towns than in large mill towns.\nB) It describes a limitation of earlier historians' research methods.\nC) It concedes that not all workers had access to subscription libraries.\nD) It explains why Bracewell chose to study industrial-era reading habits.", "answer": "C", "explanation": "The underlined sentence admits libraries were concentrated in larger towns, conceding an exception to the broader claim of access."}, {"id": "6.2", "text": "Rural households in the early twentieth century have traditionally been seen as isolated from national news, but modern research has shown that this view is largely mistaken. According to historian Priya Chandran, most rural counties had at least one shared radio set, often housed in a general store or town hall. While such radios were owned mainly by a handful of wealthier merchants, informal gatherings to listen to broadcasts were common practices throughout rural communities.\n\nWhich choice best describes the function of the underlined portion?\n\nA) It asserts that radio ownership was more common in rural areas than in cities.\nB) It describes a limitation of earlier historians' access to primary sources.\nC) It concedes that radio ownership itself was concentrated among a small group.\nD) It explains why Chandran decided to focus on rural communities.", "answer": "C", "explanation": "The underlined sentence admits ownership was limited to wealthier merchants, conceding an exception to the broader claim."}, {"id": "6.3", "text": "Enslaved artisans in the antebellum South have traditionally been seen as excluded from any formal recognition of their craft, but modern research complicates that picture. According to historian Marcus Dell, several enslaved potters and blacksmiths had their work purchased and displayed at regional fairs under their own names. While such recognition was granted mainly by a small number of sympathetic fair organizers, the sale and use of their crafted goods was common practice throughout the region.\n\nWhich choice best describes the function of the underlined portion?\n\nA) It asserts that fair organizers were generally opposed to recognizing enslaved artisans.\nB) It describes a methodological limitation in Dell's own research.\nC) It concedes that formal recognition came from only a limited group of organizers.\nD) It explains why Dell began investigating regional fairs.", "answer": "C", "explanation": "The underlined sentence admits recognition came from only a few organizers, conceding an exception to the broader claim."}, {"id": "6.4", "text": "Medieval European peasants have traditionally been seen as having no access to spices beyond salt, but modern research complicates that assumption. According to historian Ingrid Solheim, most manor households kept at least a small store of pepper or mustard seed, often purchased at seasonal markets. While such spices were affordable mainly to peasants with a modest surplus income, growing and using local herbs for flavoring was a common practice throughout the peasantry.\n\nWhich choice best describes the function of the underlined portion?\n\nA) It asserts that pepper was cheaper than local herbs during the medieval period.\nB) It describes a gap in the surviving manorial records Solheim consulted.\nC) It concedes that imported spices were out of reach for the poorest peasants.\nD) It explains why Solheim focused her research on manor households.", "answer": "C", "explanation": "The underlined sentence admits imported spices were affordable only to those with surplus income, conceding an exception."}, {"id": "6.5", "text": "Colonial-era sailors have traditionally been seen as entirely illiterate, but modern research has revised that assumption. According to historian Felix Amaro, most merchant ships carried at least one crew member capable of reading navigational charts and basic correspondence. While full literacy was common mainly among officers and a handful of experienced hands, informal instruction in reading simple logbook entries was practiced throughout many crews.\n\nWhich choice best describes the function of the underlined portion?\n\nA) It asserts that officers resisted teaching sailors to read.\nB) It describes a limitation in the surviving ship logs Amaro examined.\nC) It concedes that full literacy was concentrated among a smaller group aboard ship.\nD) It explains why Amaro chose to study merchant ships specifically.", "answer": "C", "explanation": "The underlined sentence admits full literacy was common mainly among officers, conceding an exception to the broader claim."}]}, {"n": 7, "concept": "Central Ideas and Details: identify the main purpose of a passage explaining why something appears effortless.", "original": "When classical pianist Martha Argerich performs, it appears as if the music is coming to her spontaneously. She's highly skilled technically, but because of how freely she plays and her willingness to take risks, she seems relaxed and natural. Her apparent ease, however, is due to a tremendous amount of preparation. Despite Argerich's experience and virtuosity, she never takes for granted that she knows a piece of music. Instead, she approaches the music as if encountering it for the first time and tries to understand it anew.\n\nWhich choice best states the main purpose of the text?\n\nA) To provide details about how Argerich identifies which pieces of music she will perform\nB) To assert that Argerich's performances look effortless because of how she prepares for them\nC) To discuss the kinds of music Argerich feels most comfortable encountering for the first time\nD) To describe the unique way that Argerich approaches music she hasn't performed before", "generated": [{"id": "7.1", "text": "When gymnast Ines Duarte competes, her routines look almost casual, as if the flips and turns cost her no effort at all. She has extraordinary natural flexibility, but her apparent looseness on the beam comes from years of repeating each transition thousands of times until her body no longer has to think about it. Despite her experience, Duarte still rehearses every routine at quarter speed before competitions, treating even familiar sequences as though a single misplaced habit could still creep back in.\n\nWhich choice best states the main purpose of the text?\n\nA) To provide details about how Duarte selects her competition routines\nB) To assert that Duarte's routines look effortless because of how thoroughly she rehearses them\nC) To discuss the kinds of routines Duarte finds most physically demanding\nD) To describe the unique method Duarte uses to warm up before competitions", "answer": "B", "explanation": "The passage explains that Duarte's apparent ease results from repeated, careful rehearsal."}, {"id": "7.2", "text": "When chess grandmaster Yusuf Karimov plays, his moves seem to arrive instantly, as though he simply senses the right square without calculation. He is naturally quick, but his apparent speed is the product of thousands of hours spent memorizing patterns from historical games. Despite decades of experience, Karimov still studies each opponent's past matches beforehand, refusing to assume that instinct alone will carry him through an unfamiliar position.\n\nWhich choice best states the main purpose of the text?\n\nA) To provide details about how Karimov chooses which tournaments to enter\nB) To assert that Karimov's speed at the board results from extensive preparation\nC) To discuss the kinds of chess openings Karimov prefers to study\nD) To describe the unique way Karimov approaches unfamiliar opponents", "answer": "B", "explanation": "The passage explains that Karimov's apparent instant instinct actually results from extensive preparation."}, {"id": "7.3", "text": "When chef Odalys Ferreira plates a dish during a live cooking demonstration, her hands move so smoothly that the entire process seems unplanned. She has a natural feel for flavor, but her calm, unhurried pace on stage comes from rehearsing the same sequence of cuts and plating motions dozens of times beforehand. Even after years of demonstrations, Ferreira still times a full practice run the morning of each show, unwilling to trust that familiarity alone will keep her steady under the lights.\n\nWhich choice best states the main purpose of the text?\n\nA) To provide details about how Ferreira develops new recipes\nB) To assert that Ferreira's stage performances appear smooth because of her extensive rehearsal\nC) To discuss which ingredients Ferreira prefers to use in her demonstrations\nD) To describe the unique plating style Ferreira has developed over her career", "answer": "B", "explanation": "The passage explains that Ferreira's apparent smoothness results from repeated rehearsal, not spontaneity."}, {"id": "7.4", "text": "When violinist Theo Marchetti performs a concerto, his fingers seem to find each note without hesitation, as though the piece has always simply lived in his hands. He has considerable natural talent, but his apparent ease comes from slow, deliberate practice sessions in which he isolates and repeats the most difficult passages far more often than the easy ones. Even with a piece he has performed dozens of times, Marchetti still runs through it at half tempo before a concert, refusing to assume his fingers will remember it on their own.\n\nWhich choice best states the main purpose of the text?\n\nA) To provide details about how Marchetti chooses concertos to perform\nB) To assert that Marchetti's performances appear effortless because of his deliberate practice habits\nC) To discuss the kinds of passages Marchetti finds most enjoyable to play\nD) To describe the unique warm-up ritual Marchetti follows before a concert", "answer": "B", "explanation": "The passage explains that Marchetti's apparent effortlessness is the product of deliberate, repeated practice."}, {"id": "7.5", "text": "When public speaker Naledi Mokoena delivers a keynote, she seems to speak entirely off the cuff, pausing and gesturing as though the words are occurring to her in the moment. She has a naturally warm stage presence, but her apparent spontaneity is the result of rehearsing the same talk dozens of times in front of a mirror until each pause feels natural rather than scripted. Even for talks she has given many times before, Mokoena still rewrites and rehearses her opening lines the night before, unwilling to assume that past success guarantees the same effect again.\n\nWhich choice best states the main purpose of the text?\n\nA) To provide details about how Mokoena decides which topics to speak about\nB) To assert that Mokoena's talks appear spontaneous because of how extensively she rehearses them\nC) To discuss the audiences Mokoena finds most comfortable speaking to\nD) To describe the unique gestures Mokoena uses while on stage", "answer": "B", "explanation": "The passage explains that Mokoena's apparent spontaneity results from extensive rehearsal."}]}, {"n": 8, "concept": "Cross-Text Connections: predict how the author of one text would respond to an underlined claim in another text.", "original": "Text 1: An excavation in Chiquihuite Cave in central Mexico has upended the belief that approximately 13,000 years ago, a group known as the Clovis people were the first human inhabitants of North America. More than 200 crude stone tools were found embedded in a layer of earth that is up to 33,150 years old, revealing that humans occupied the cave thousands of years before the Clovis people reached the continent.\n\nText 2: The objects uncovered in Chiquihuite Cave are intriguing, but it is premature to characterize them as tools. The stone pieces are so roughly shaped that they may have simply fractured from rocks during natural geological activity in the cave. Moreover, their unearthing has thus far not been accompanied by discoveries of other signs of human activity or even traces of human DNA from surfaces.\n\nBased on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?\n\nA) By agreeing that the stone objects are tools, but disputing their proposed age\nB) By questioning whether the stone objects are tools at all, given the lack of other evidence of human presence\nC) By arguing that the Clovis people must have created the stone objects themselves\nD) By suggesting that the cave was never actually occupied by any humans, ancient or otherwise", "generated": [{"id": "8.1", "text": "Text 1: Newly analyzed sediment cores from a lakebed in the Andes suggest that a farming settlement existed in the region at least 2,000 years earlier than previously believed. Researchers found layers of pollen from domesticated crops in sediment dated to that earlier period, indicating that organized agriculture began there far sooner than the standard timeline holds.\n\nText 2: The pollen samples from the Andean lakebed are worth further study, but it is too soon to credit them to deliberate cultivation. The plant species identified also grow wild in the region, and the pollen could have been deposited by wind or animal activity rather than by human planting. No accompanying evidence of tools, irrigation channels, or cleared fields has yet been found at the site.\n\nBased on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?\n\nA) By agreeing that farming began early, but disputing exactly how early\nB) By questioning whether the pollen indicates deliberate farming at all, given the absence of supporting evidence\nC) By arguing that the crops were introduced by a different, unrelated culture\nD) By suggesting that no plants ever grew wild in the region", "answer": "B", "explanation": "Text 2's author doubts the pollen proves farming without further supporting evidence, echoing the reasoning in the original."}, {"id": "8.2", "text": "Text 1: A set of markings on a cave wall in northern Spain has been interpreted by one research team as an early calendar tracking lunar cycles, based on the number and spacing of the marks. If correct, this would push back the earliest known evidence of systematic timekeeping by thousands of years.\n\nText 2: The spacing of the marks on the cave wall is suggestive, but treating them as a calendar goes well beyond what the evidence supports. Similar spacing patterns occur in natural rock fractures found elsewhere in the same cave system, and no other markings at the site show any consistent numerical or seasonal pattern.\n\nBased on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?\n\nA) By agreeing the marks form a calendar, but disputing how far back it dates\nB) By questioning whether the marks are intentional records at all, given similar natural patterns nearby\nC) By arguing that a different, later culture must have made the marks\nD) By suggesting that no cave markings anywhere can ever be reliably dated", "answer": "B", "explanation": "Text 2's author doubts the marks are intentional records, pointing to a natural explanation, echoing the original's reasoning."}, {"id": "8.3", "text": "Text 1: Fragments of woven fabric recovered from a bog in northern Europe have been dated to nearly 9,000 years ago, a finding one research team says proves that organized textile production began far earlier than previously thought.\n\nText 2: The fabric fragments are a remarkable find, but calling them evidence of organized textile production may be premature. The fibers could have been twisted together informally, without the coordinated tools or techniques that organized production implies, and no spindles or looms have been recovered from the site.\n\nBased on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?\n\nA) By agreeing that production was organized, but disputing the proposed date\nB) By questioning whether the fragments reflect organized production at all, given the lack of tool evidence\nC) By arguing that the fabric was brought to the bog from a distant region\nD) By suggesting that fabric cannot survive for thousands of years under any conditions", "answer": "B", "explanation": "Text 2's author doubts the fragments prove organized production without supporting tool evidence, echoing the original's reasoning."}, {"id": "8.4", "text": "Text 1: Scratches found on a set of ancient animal bones in East Africa have been interpreted by one team as evidence of early butchery using stone tools, pushing back the timeline for tool-assisted meat processing.\n\nText 2: The scratches on the bones are intriguing, but attributing them to stone-tool butchery overlooks a simpler explanation. Trampling by other animals across sediment containing small rock fragments can produce very similar marks, and no stone tools have actually been recovered near the bones.\n\nBased on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?\n\nA) By agreeing tools were used, but disputing which species used them\nB) By questioning whether the marks indicate tool use at all, given a plausible natural cause\nC) By arguing that the bones belonged to a scavenging species rather than a hunted one\nD) By suggesting that the bones are too damaged to study further", "answer": "B", "explanation": "Text 2's author offers a natural explanation for the marks and doubts they show tool use, echoing the original's reasoning."}, {"id": "8.5", "text": "Text 1: Charred plant remains found at a rock shelter in Southeast Asia have been dated to a period thousands of years before the region's earliest known hearths, leading one team to argue that controlled fire use began far earlier than believed.\n\nText 2: The charred remains are notable, but linking them to controlled fire use is not yet warranted. Wildfires are common in the region, and the site shows no accompanying evidence of a constructed hearth, ash management, or repeated use of a single fire location.\n\nBased on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?\n\nA) By agreeing fire was controlled, but disputing exactly when it began\nB) By questioning whether the remains reflect controlled fire use at all, given the absence of hearth evidence\nC) By arguing that a different group must have used the rock shelter first\nD) By suggesting that plants cannot be charred by natural wildfires", "answer": "B", "explanation": "Text 2's author points to the absence of hearth evidence and doubts the remains show controlled fire use, echoing the original's reasoning."}]}, {"n": 9, "concept": "Central Ideas and Details: identify the main idea when a theorist argues existing concepts fail to fully capture a phenomenon.", "original": "Many literary theorists distinguish between fabula, a narrative's content, and syuzhet, a narrative's arrangement and presentation of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative—he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by interactions between the artist, the work, and the audience.\n\nWhich choice best states the main idea of the text?\n\nA) Literary theorist Mikhail Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives.\nB) Literary theorist Mikhail Bakhtin claimed that meaning is not inherent in a narrative but is created when an audience encounters a narrative, so that narratives are interpreted differently by different people.\nC) The storytelling methods used in The Godfather Part II may seem unusually complicated, but they can be easily understood when two concepts from literary theory are utilized.\nD) Narratives that are told out of chronological order are more difficult for audiences to understand than are narratives presented chronologically.", "generated": [{"id": "9.1", "text": "Many economists distinguish between supply shocks, sudden disruptions to production, and demand shocks, sudden shifts in what consumers are willing to buy. During the region's recent fuel shortage, the supply shock was the disrupted shipment of oil, and the demand shock was the resulting shift toward alternative energy sources. But economist Renata Kessler maintained that supply and demand shocks are insufficient to completely explain the shortage's effects—she held that standard categorizations of economic disruption discount the subtle way in which public trust in institutions shapes how quickly markets actually recover.\n\nWhich choice best states the main idea of the text?\n\nA) Economist Renata Kessler argued that there are important factors shaping market recovery that are not fully captured by two concepts other economists have used to analyze disruptions.\nB) Economist Renata Kessler claimed that supply shocks and demand shocks are simply two different names for the same underlying economic phenomenon.\nC) The region's fuel shortage was unusually complex, but it can be fully explained using standard supply and demand analysis.\nD) Public trust in institutions matters more to a region's economy than supply and demand shocks do.", "answer": "A", "explanation": "Kessler argues that standard economic categories miss an additional factor (public trust) shaping outcomes, paralleling Bakhtin's argument."}, {"id": "9.2", "text": "Many musicologists distinguish between melody, a piece's sequence of pitches, and harmony, the combination of pitches sounded together. In a given jazz standard, the melody is the tune a listener might hum, and the harmony is the underlying chords supporting it. But musicologist Deshawn Fields maintained that melody and harmony are insufficient to completely describe a performance—he held that standard categorizations of musical structure discount the subtle way in which a performer's timing and phrasing shape a listener's emotional experience.\n\nWhich choice best states the main idea of the text?\n\nA) Musicologist Deshawn Fields argued that there are important aspects of a musical performance that are not fully captured by two concepts other musicologists have used to analyze music.\nB) Musicologist Deshawn Fields claimed that melody and harmony are ultimately the same musical element viewed from two different perspectives.\nC) Jazz standards are unusually difficult to analyze, but melody and harmony are sufficient tools for understanding them.\nD) A performer's timing and phrasing matter more to a jazz standard than its melody and harmony do.", "answer": "A", "explanation": "Fields argues that standard musical categories miss an additional factor (timing and phrasing) shaping listener experience, paralleling Bakhtin's argument."}, {"id": "9.3", "text": "Many linguists distinguish between denotation, a word's literal dictionary meaning, and connotation, the associations a word carries beyond that meaning. In a given poem, the denotation of a word might be its plain definition, and the connotation might be the mood that word evokes. But linguist Anya Petrenko maintained that denotation and connotation are insufficient to completely describe a word's effect in a poem—she held that standard categorizations of meaning discount the subtle way in which a word's placement and rhythm within a line shape how a reader experiences it.\n\nWhich choice best states the main idea of the text?\n\nA) Linguist Anya Petrenko argued that there are important aspects of a word's poetic effect that are not fully captured by two concepts other linguists have used to analyze meaning.\nB) Linguist Anya Petrenko claimed that denotation and connotation are simply two labels for a single, unified concept of meaning.\nC) Poems are unusually difficult texts, but denotation and connotation are sufficient tools for analyzing them.\nD) A word's placement and rhythm within a line matter more than its denotation and connotation do.", "answer": "A", "explanation": "Petrenko argues that standard linguistic categories miss an additional factor (placement and rhythm) shaping a word's effect, paralleling Bakhtin's argument."}, {"id": "9.4", "text": "Many architects distinguish between form, a building's physical shape, and function, the practical purposes the building serves. In a given train station, the form is its arched glass roof, and the function is its role in moving passengers efficiently. But architectural critic Soren Vik maintained that form and function are insufficient to completely describe a building's significance—he held that standard categorizations of design discount the subtle way in which a building's relationship to its surrounding neighborhood shapes how residents come to feel about it.\n\nWhich choice best states the main idea of the text?\n\nA) Architectural critic Soren Vik argued that there are important aspects of a building's significance that are not fully captured by two concepts other critics have used to analyze design.\nB) Architectural critic Soren Vik claimed that form and function are ultimately identical concepts described using different vocabulary.\nC) Train stations are unusually complex buildings, but form and function are sufficient tools for analyzing them.\nD) A building's relationship to its neighborhood matters more than its form and function do.", "answer": "A", "explanation": "Vik argues that standard architectural categories miss an additional factor (neighborhood relationship) shaping a building's significance, paralleling Bakhtin's argument."}, {"id": "9.5", "text": "Many anthropologists distinguish between kinship by blood, ties based on biological descent, and kinship by practice, ties formed through shared daily life and obligation. In a given community, kinship by blood might describe siblings, and kinship by practice might describe long-term neighbors who share caregiving duties. But anthropologist Idris Okonjo maintained that these two categories are insufficient to completely describe how community bonds actually form—he held that standard categorizations of kinship discount the subtle way in which shared hardship over time can create obligations as strong as either category alone.\n\nWhich choice best states the main idea of the text?\n\nA) Anthropologist Idris Okonjo argued that there are important aspects of community bonds that are not fully captured by two concepts other anthropologists have used to analyze kinship.\nB) Anthropologist Idris Okonjo claimed that kinship by blood and kinship by practice describe exactly the same relationships in every community.\nC) Community bonds are unusually difficult to study, but kinship by blood and kinship by practice are sufficient tools for understanding them.\nD) Shared hardship matters more to a community than either kinship by blood or kinship by practice does.", "answer": "A", "explanation": "Okonjo argues that standard kinship categories miss an additional factor (shared hardship) shaping community bonds, paralleling Bakhtin's argument."}]}, {"n": 11, "concept": "Command of Evidence (Quotation): choose the quotation that most effectively illustrates a claim about mixed feelings.", "original": "\"The Yellow Wallpaper\" is an 1892 short story by Charlotte Perkins Gilman. In the story, the narrator expresses mixed feelings about her surroundings.\n\nWhich quotation from \"The Yellow Wallpaper\" most effectively illustrates the claim?\n\nA) \"This wallpaper has a kind of sub-pattern in a different shade, a particularly irritating one, for you can only see it in certain lights, and not clearly then.\"\nB) \"By moonlight—the moon shines in all night when there is a moon—I wouldn't know it was the same paper.\"\nC) \"I'm really getting quite fond of the big room, all but that horrid [wall]paper.\"\nD) \"The color is repellant, almost revolting; a smouldering, unclean yellow, strangely faded by the slow-turning sunlight.\"", "generated": [{"id": "11.1", "text": "A student is writing an essay about a fictional sailor who expresses mixed feelings about the sea in his journal. Which quotation would most effectively illustrate the claim?\n\nA) \"The sea rose again that night, gray and enormous, indifferent to anything as small as a single boat.\"\nB) \"I have come to love this endless water even as it terrifies me, the way one might love a storm from behind a window.\"\nC) \"Salt crusted on every rope and rail, and by morning nothing aboard felt entirely dry.\"\nD) \"The horizon gave no sign of land, only the same flat gray line it had shown for a week.\"", "answer": "B", "explanation": "Only this quotation directly names two contradictory feelings—love and terror—toward the same subject."}, {"id": "11.2", "text": "A student is writing an essay about a fictional retiree who expresses mixed feelings about leaving her career. Which quotation would most effectively illustrate the claim?\n\nA) \"The office had emptied by six most evenings, the hallway lights clicking off in sequence behind her.\"\nB) \"She packed the last box slowly, aware that no one would notice exactly when she finally left.\"\nC) \"I am relieved to be done with it, and yet some mornings I still reach for a badge that isn't there.\"\nD) \"Her successor was younger, competent, already rearranging the furniture by the second week.\"", "answer": "C", "explanation": "Only this quotation directly names two contradictory feelings—relief and longing—toward the same situation."}, {"id": "11.3", "text": "A student is writing an essay about a fictional immigrant who expresses mixed feelings about his new city. Which quotation would most effectively illustrate the claim?\n\nA) \"The subway ran late most nights, and the platform smelled faintly of rain even when it hadn't rained.\"\nB) \"I find this city thrilling and lonely in the same breath, as if both feelings arrived on the same train.\"\nC) \"Streetlights here stayed on until well past sunrise, a detail he noted but did not question.\"\nD) \"His apartment faced an alley, and from its window he could see almost nothing of the skyline.\"", "answer": "B", "explanation": "Only this quotation directly names two contradictory feelings—thrill and loneliness—toward the same subject."}, {"id": "11.4", "text": "A student is writing an essay about a fictional chef who expresses mixed feelings about a family recipe. Which quotation would most effectively illustrate the claim?\n\nA) \"The recipe called for a pinch of saffron, a spice her grandmother had always measured by eye.\"\nB) \"By the time the broth thickened, the kitchen had filled with a smell she hadn't noticed in years.\"\nC) \"I resent how much this dish still controls me, and still I cannot imagine ever cooking anything else.\"\nD) \"The pot was cast iron, heavy enough that she used both hands to lift it from the stove.\"", "answer": "C", "explanation": "Only this quotation directly names two contradictory feelings—resentment and attachment—toward the same recipe."}, {"id": "11.5", "text": "A student is writing an essay about a fictional astronaut who expresses mixed feelings about returning to Earth. Which quotation would most effectively illustrate the claim?\n\nA) \"The capsule shook as it entered the atmosphere, exactly as the simulations had predicted.\"\nB) \"Ground control's voice grew clearer with every passing minute, steady and familiar.\"\nC) \"Recovery ships were already visible from the window, small white shapes against the blue.\"\nD) \"I have never wanted so badly to feel solid ground again, and never dreaded anything so much either.\"", "answer": "D", "explanation": "Only this quotation directly names two contradictory feelings—wanting and dreading—toward the same event."}]}, {"n": 12, "concept": "Command of Evidence (Data/Table): use quantitative data from a table to complete a comparison.", "original": "Land Area Covered by Native Flowering Plants at a Site in Antarctica\nSpecies | Area covered in 2009 (sq. m) | Area covered in 2018 (sq. m) | Percent increase\nDeschampsia antarctica | 1,230 | 1,576 | 28%\nColobanthus quitensis | 6.9 | 10.7 | 55%\n\nThe only flowering plant species native to Antarctica, Colobanthus quitensis and Deschampsia antarctica grow in places where the earth remains free of ice for much of the year. Botanist Nicoletta Cannone wondered how the warming of Antarctica's climate in recent years had affected these species, so she visited a site in Antarctica, first in 2009 and later in 2018, to count the number of plants growing there. Cannone found that the area of land covered by the two species had significantly expanded during the nine-year period. While both species likely benefited from warming temperatures, Colobanthus quitensis ______\n\nWhich choice most effectively uses data from the table to complete the comparison?\n\nA) suppressed the growth of Deschampsia antarctica, which covered a smaller area of land in 2018 than it had in 2009.\nB) saw a greater expansion than Deschampsia antarctica did, increasing the area of land it covered by more than half.\nC) showed a greater increase in the average size of individual plants than Deschampsia antarctica did.\nD) covered land newly freed from ice at a rate 55% faster than that of Deschampsia antarctica.", "generated": [{"id": "12.1", "text": "Urban Tree Canopy Cover at Two City Parks\nPark | Canopy area in 2010 (acres) | Canopy area in 2022 (acres) | Percent increase\nRiverside Park | 40 | 52 | 30%\nHighline Park | 25 | 45 | 80%\n\nCity foresters wanted to know how canopy cover had changed at two parks after a decade of new tree planting. Urban ecologist Dana Whitfield found that canopy area had expanded at both parks between 2010 and 2022. While both parks likely benefited from the planting program, Highline Park ______\n\nWhich choice most effectively uses data from the table to complete the statement?\n\nA) saw a smaller expansion than Riverside Park did, covering less additional area overall.\nB) saw a greater expansion than Riverside Park did, increasing its canopy area by more than half.\nC) showed a greater increase in average tree height than Riverside Park did.\nD) covered new ground at a rate 30% faster than Riverside Park did.", "answer": "B", "explanation": "Highline's 80% increase is both greater than Riverside's 30% and more than half, matching only choice B."}, {"id": "12.2", "text": "Reservoir Water Levels After Restoration Efforts\nReservoir | Volume in 2015 (million gallons) | Volume in 2023 (million gallons) | Percent increase\nCedar Reservoir | 800 | 1,040 | 30%\nPinewood Reservoir | 500 | 900 | 80%\n\nHydrologist Marco Reyes tracked water levels at two reservoirs following new watershed restoration projects. Both reservoirs gained volume between 2015 and 2023. While both sites likely benefited from reduced runoff, Pinewood Reservoir ______\n\nWhich choice most effectively uses data from the table to complete the statement?\n\nA) lost more volume than Cedar Reservoir did over the same period.\nB) gained volume at a slower rate than Cedar Reservoir did.\nC) saw a greater percentage increase than Cedar Reservoir did, growing by more than three-quarters.\nD) showed a greater increase in water clarity than Cedar Reservoir did.", "answer": "C", "explanation": "Pinewood's 80% increase is greater than Cedar's 30% and exceeds three-quarters, matching only choice C."}, {"id": "12.3", "text": "Monarch Butterfly Counts at Two Restored Meadows\nMeadow | Count in 2012 | Count in 2021 | Percent increase\nSunridge Meadow | 150 | 210 | 40%\nBellview Meadow | 90 | 189 | 110%\n\nConservationist Priya Nair compared monarch counts at two meadows after milkweed restoration. Both meadows gained monarchs between 2012 and 2021. While both sites likely benefited from the new plantings, Bellview Meadow ______\n\nWhich choice most effectively uses data from the table to complete the statement?\n\nA) recorded fewer monarchs overall in 2021 than Sunridge Meadow did.\nB) more than doubled its monarch count, a greater percentage increase than Sunridge Meadow's.\nC) attracted a greater variety of pollinator species than Sunridge Meadow did.\nD) restored milkweed at a rate 40% faster than Sunridge Meadow did.", "answer": "B", "explanation": "Bellview's 110% increase means its count more than doubled, exceeding Sunridge's 40% increase, matching only choice B."}, {"id": "12.4", "text": "Annual Solar Output at Two Facilities After Panel Upgrades\nFacility | Output in 2018 (MWh) | Output in 2023 (MWh) | Percent increase\nNorth Facility | 2,000 | 2,600 | 30%\nSouth Facility | 1,200 | 2,160 | 80%\n\nEngineer Tomas Rivera tracked annual solar output at two facilities after both installed upgraded panels. Output increased at both facilities between 2018 and 2023. While both facilities likely benefited from the upgrade, South Facility ______\n\nWhich choice most effectively uses data from the table to complete the statement?\n\nA) produced less total electricity in 2023 than North Facility did.\nB) increased its output by a smaller percentage than North Facility did.\nC) saw a greater percentage increase than North Facility did, growing its output by more than three-quarters.\nD) installed its panel upgrades one year later than North Facility did.", "answer": "C", "explanation": "South's 80% increase is greater than North's 30% and exceeds three-quarters, matching only choice C."}, {"id": "12.5", "text": "Public Library Visitor Counts at Two Branches\nBranch | Visitors in 2016 | Visitors in 2023 | Percent increase\nOak Street Branch | 4,000 | 5,200 | 30%\nRiverside Branch | 2,500 | 4,500 | 80%\n\nLibrarian Helena Cho compared visitor counts at two branches after both renovated their children's sections. Visitor counts rose at both branches between 2016 and 2023. While both branches likely benefited from the renovation, Riverside Branch ______\n\nWhich choice most effectively uses data from the table to complete the statement?\n\nA) had fewer total visitors in 2023 than Oak Street Branch did.\nB) saw a greater percentage increase than Oak Street Branch did, growing its visitor count by more than three-quarters.\nC) renovated its children's section a year earlier than Oak Street Branch did.\nD) showed a greater increase in average visit length than Oak Street Branch did.", "answer": "B", "explanation": "Riverside's 80% increase is greater than Oak Street's 30% and exceeds three-quarters, matching only choice B."}]}, {"n": 13, "concept": "Command of Evidence (Research Finding): identify the finding that would most directly support a proposed indirect causal effect.", "original": "As media consumption has become increasingly multiplatform and socially mediated, active news acquisition has diminished in favor of an attitude known as \"news finds me\" (NFM), in which people passively rely on their social networks and ambient media environments for information about current events. Homero Gil de Zuniga and Trevor Diehl examined data on a representative group of adults in the United States to determine participants' strength of NFM attitude, political knowledge, and political interest. Although no major election took place sufficiently near the study for Gil de Zuniga and Diehl to identify causality between NFM and voting behavior, they did posit that NFM may reduce voting probability through an indirect effect.\n\nWhich finding, if true, would most directly support the idea advanced by Gil de Zuniga and Diehl?\n\nA) NFM attitude tends to increase in strength as major elections approach, and people are significantly more likely to vote in major elections than in minor elections.\nB) NFM attitude has a strong negative effect on political knowledge and interest, and there is known to be a strong positive correlation between political knowledge and interest and the likelihood of voting.\nC) Political interest is known to have a strong positive effect on likelihood of voting but shows only a weak positive effect on political knowledge, and NFM attitude shows little correlation with either political knowledge or political interest.\nD) The likelihood of voting increases as political knowledge increases, and the relationship between NFM attitude and political knowledge tends to strengthen as the size of people's social networks increases.", "generated": [{"id": "13.1", "text": "Researchers Lindiwe Moyo and Aaron Kessler examined data on a group of high school students to determine each student's phone use before bed, sleep duration, and next-day academic performance. Although no controlled sleep-lab experiment took place during the study, Moyo and Kessler posited that heavy pre-bed phone use may reduce academic performance through an indirect effect.\n\nWhich finding, if true, would most directly support the idea advanced by Moyo and Kessler?\n\nA) Academic performance tends to improve as the school year progresses, and phone use tends to decline during exam periods.\nB) Heavy pre-bed phone use has a strong negative effect on sleep duration, and there is a known strong positive correlation between sleep duration and academic performance.\nC) Sleep duration has a strong positive effect on academic performance but shows only a weak relationship with phone use, and phone use shows little correlation with either sleep duration or performance.\nD) Academic performance increases as sleep duration increases, and the relationship between phone use and sleep duration weakens as students grow older.", "answer": "B", "explanation": "Choice B supplies both links of the proposed chain: phone use lowers sleep, and sleep is tied to performance."}, {"id": "13.2", "text": "Researchers examined survey data from a large company to determine each employee's attitude toward the new remote-work policy, job satisfaction, and likelihood of leaving within a year. Although no controlled trial took place during the study period, the researchers posited that positive attitudes toward remote work may reduce turnover through an indirect effect.\n\nWhich finding, if true, would most directly support the idea advanced by the researchers?\n\nA) Turnover tends to decline company-wide during years of strong economic growth, regardless of remote-work attitudes.\nB) Positive attitudes toward remote work have a strong positive effect on job satisfaction, and there is a known strong negative correlation between job satisfaction and turnover.\nC) Job satisfaction has a strong negative effect on turnover but shows only a weak relationship with remote-work attitudes, which show little correlation with either variable.\nD) Turnover decreases as job satisfaction increases, and the relationship between remote-work attitudes and job satisfaction weakens in larger companies.", "answer": "B", "explanation": "Choice B supplies both links of the proposed chain: attitude raises satisfaction, and satisfaction lowers turnover."}, {"id": "13.3", "text": "Researchers examined survey and crime data across several neighborhoods to determine residents' exposure to community gardens, levels of neighborly trust, and local crime rates. Although no controlled experiment took place, the researchers posited that community garden exposure may reduce crime rates through an indirect effect.\n\nWhich finding, if true, would most directly support the idea advanced by the researchers?\n\nA) Crime rates tend to fall citywide during years when city budgets for policing increase, regardless of garden exposure.\nB) Community garden exposure has a strong positive effect on neighborly trust, and there is a known strong negative correlation between neighborly trust and crime rates.\nC) Neighborly trust has a strong negative effect on crime rates but shows only a weak relationship with garden exposure, which shows little correlation with either variable.\nD) Crime rates decrease as neighborly trust increases, and the relationship between garden exposure and neighborly trust weakens in wealthier neighborhoods.", "answer": "B", "explanation": "Choice B supplies both links of the proposed chain: garden exposure raises trust, and trust lowers crime."}, {"id": "13.4", "text": "Researchers examined data on a group of high school students to determine participation in a new mentoring program, self-confidence regarding academic ability, and eventual college enrollment. Although no randomized trial took place, the researchers posited that mentoring program participation may increase college enrollment through an indirect effect.\n\nWhich finding, if true, would most directly support the idea advanced by the researchers?\n\nA) College enrollment tends to rise nationally during years of expanded financial aid, regardless of mentoring participation.\nB) Mentoring program participation has a strong positive effect on self-confidence, and there is a known strong positive correlation between self-confidence and college enrollment.\nC) Self-confidence has a strong positive effect on enrollment but shows only a weak relationship with mentoring participation, which shows little correlation with either variable.\nD) Enrollment increases as self-confidence increases, and the relationship between mentoring participation and self-confidence weakens for older students.", "answer": "B", "explanation": "Choice B supplies both links of the proposed chain: participation raises confidence, and confidence raises enrollment."}, {"id": "13.5", "text": "Researchers examined transportation data across several cities to determine transit frequency, average traffic congestion, and traffic fatality rates. Although no controlled experiment took place, the researchers posited that increased transit frequency may reduce fatality rates through an indirect effect.\n\nWhich finding, if true, would most directly support the idea advanced by the researchers?\n\nA) Fatality rates tend to fall nationally during years of improved vehicle safety technology, regardless of transit frequency.\nB) Increased transit frequency has a strong negative effect on traffic congestion, and there is a known strong positive correlation between congestion and fatality rates.\nC) Congestion has a strong positive effect on fatality rates but shows only a weak relationship with transit frequency, which shows little correlation with either variable.\nD) Fatality rates decrease as congestion decreases, and the relationship between transit frequency and congestion weakens in smaller cities.", "answer": "B", "explanation": "Choice B supplies both links of the proposed chain: frequency lowers congestion, and congestion raises fatalities."}]}, {"n": 14, "concept": "Inferences: draw a logical conclusion about the direction of influence from parallel traits and historical/migration evidence.", "original": "In dialects of English spoken in Scotland, the \"r\" sound is strongly emphasized when it appears at the end of syllables (as in \"car\") or before other consonant sounds (as in \"bird\"). English dialects of the Upland South, a region stretching from Oklahoma to western Virginia, place similar emphasis on \"r\" at the ends of syllables and before other consonant sounds. Historical records show that the Upland South was colonized largely by people whose ancestors came from Scotland. Thus, linguists have concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the English dialects spoken in the Upland South acquired their emphasis on the \"r\" sound from dialects spoken in Scotland.\nB) emphasis on the \"r\" sound will eventually spread from English dialects spoken in the Upland South to dialects spoken elsewhere.\nC) the English dialects spoken in Scotland were influenced by dialects spoken in the Upland South.\nD) people from Scotland abandoned their emphasis on the \"r\" sound after relocating to the Upland South.", "generated": [{"id": "14.1", "text": "In dialects of Portuguese spoken in the Azores, a distinctive fronting of certain vowel sounds occurs before nasal consonants. Portuguese dialects spoken in parts of coastal Brazil show a similar fronting pattern in the same phonetic environment. Historical records show that these Brazilian coastal communities were settled largely by migrants from the Azores in the eighteenth century. Thus, linguists have concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the Brazilian coastal dialects acquired their vowel-fronting pattern from dialects spoken in the Azores.\nB) the vowel-fronting pattern will eventually disappear from dialects spoken in the Azores.\nC) the Azorean dialects were influenced by dialects spoken in coastal Brazil.\nD) migrants from the Azores abandoned their vowel-fronting pattern after settling in Brazil.", "answer": "A", "explanation": "Since the Brazilian region was settled by Azorean migrants, the shared feature most logically traveled from the Azores to Brazil."}, {"id": "14.2", "text": "In regional cooking traditions of coastal Sicily, dishes are commonly finished with a splash of vinegar just before serving. Cooking traditions in parts of Tunisia's northern coast show a similar finishing technique in otherwise unrelated dishes. Historical records show that this region of Tunisia maintained centuries of active trade and settlement exchange with Sicilian merchant communities. Thus, food historians have concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the Tunisian finishing technique was adopted from Sicilian cooking traditions.\nB) the vinegar-finishing technique will eventually disappear from Sicilian cooking.\nC) Sicilian cooking traditions were influenced by Tunisian finishing techniques.\nD) Tunisian cooks abandoned the vinegar-finishing technique after trade with Sicily ended.", "answer": "A", "explanation": "Given the trade and settlement ties from Sicily, the shared technique most logically traveled from Sicily to Tunisia."}, {"id": "14.3", "text": "In textile traditions of highland Peru, weavers commonly use a distinctive double-faced weaving technique to create reversible patterns. Textile traditions in parts of northern Chile show a nearly identical double-faced technique used on similar looms. Historical records show that this region of Chile was settled by communities who migrated from highland Peru several centuries ago. Thus, textile historians have concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the northern Chilean weaving technique was inherited from highland Peruvian traditions.\nB) the double-faced technique will eventually disappear from highland Peru.\nC) highland Peruvian weaving traditions were influenced by northern Chilean techniques.\nD) the Peruvian migrants abandoned the double-faced technique after settling in Chile.", "answer": "A", "explanation": "Since northern Chile was settled by Peruvian migrants, the shared technique most logically traveled from Peru to Chile."}, {"id": "14.4", "text": "In architectural traditions of southern Germany, timber-framed houses commonly feature steeply pitched roofs designed to shed heavy snow. A similar steep-roof style appears in parts of rural Pennsylvania. Historical records show that this region of Pennsylvania was settled largely by German immigrants in the eighteenth century. Thus, architectural historians have concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the Pennsylvania roof style was adopted from southern German building traditions.\nB) the steep-roof style will eventually spread from Pennsylvania back to southern Germany.\nC) southern German building traditions were influenced by rural Pennsylvania architecture.\nD) German immigrants abandoned the steep-roof style after settling in Pennsylvania.", "answer": "A", "explanation": "Since rural Pennsylvania was settled by German immigrants, the shared roof style most logically traveled from Germany to Pennsylvania."}, {"id": "14.5", "text": "In pottery traditions of the Yucatan Peninsula, artisans commonly apply a distinctive red slip before firing. Pottery traditions in parts of northern Belize show a nearly identical red-slip technique. Historical records show that communities in this part of Belize maintained close trade and migration ties with the Yucatan for many centuries. Thus, archaeologists have concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the northern Belizean red-slip technique was acquired from Yucatan pottery traditions.\nB) the red-slip technique will eventually disappear from Yucatan pottery.\nC) Yucatan pottery traditions were influenced by northern Belizean techniques.\nD) Yucatan artisans abandoned the red-slip technique after trade with Belize declined.", "answer": "A", "explanation": "Given the close ties from the Yucatan, the shared pottery technique most logically traveled from the Yucatan to Belize."}]}, {"n": 15, "concept": "Inferences: complete a hypothesis that a persistent biological trait has been preserved because it confers a benefit.", "original": "In 2016, biological anthropologist Heather F. Smith and her team investigated the evolution of the appendix, an intestinal organ that is present in some mammals, including humans, but is generally thought to have no function. Studying 533 mammal species, the team found that the appendix has emerged independently across multiple lineages in separate instances and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have higher concentrations of lymphoid tissue, which supports immune responses, in the cecum, the organ the appendix is attached to. Therefore, the team hypothesized that the appendix likely ______\n\nWhich choice most logically completes the text?\n\nA) was once present in many nonmammal species but has since disappeared from those lineages.\nB) has been preserved in certain mammal species because it benefits their immune systems.\nC) will emerge in a greater number of mammal species because it may serve a necessary function in the immune system.\nD) produced higher concentrations of lymphoid tissue in mammals in the past than it does currently.", "generated": [{"id": "15.1", "text": "In a 2019 study, biologist Rosalind Achebe and her team investigated the evolution of the spleen-adjacent \"accessory lymph node\" structure, an organ present in some fish species but generally thought to have no function. Studying 240 fish species, the team found that the structure has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the structure tend to have higher concentrations of antibody-producing cells within it. Therefore, the team hypothesized that the structure likely ______\n\nWhich choice most logically completes the text?\n\nA) was once present in many non-fish species but has since disappeared from those lineages.\nB) has been preserved in certain fish species because it benefits their immune systems.\nC) will emerge in a greater number of fish species because it may serve a necessary function in digestion.\nD) produced higher concentrations of antibody-producing cells in fish in the past than it does currently.", "answer": "B", "explanation": "The correlation with antibody-producing cells supports a hypothesis that the structure persists because it aids immunity."}, {"id": "15.2", "text": "In a 2017 study, biologist Femi Adeyemi and colleagues investigated the evolution of the plica semilunaris, a small fold of tissue in the corner of the eye present in some primates but generally thought to have no function. Studying 180 primate species, the team found that the fold has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the fold tend to have more effective removal of debris from the eye's surface. Therefore, the team hypothesi
