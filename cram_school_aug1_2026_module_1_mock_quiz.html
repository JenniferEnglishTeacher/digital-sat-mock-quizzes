r": "C", "expl": "The passage emphasizes the father's resolve to finish the project he began, despite the cold and difficulty.", "explZh": ""}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Central Ideas and Details: identify the main purpose of a narrative passage that portrays a character's determination.", "vocab": false, "body": "The following text is from a short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>. Delphine had never run more than a mile before she signed up for the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=marathon\" target=\"_blank\" rel=\"noopener\">marathon<\/a>, a decision she made mostly to prove something to herself rather than to anyone watching. She trained before dawn so no one would see her walking half the route, kept a log of every blister and every mile she managed to finish, and refused every excuse her body offered her to quit. On race day, she crossed the line four hours after the winner, smiling as though she had won something no clock could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measure\" target=\"_blank\" rel=\"noopener\" data-w=\"measure\" data-pos=\"v.\" data-en=\"to find the size or amount of something\" data-zh=\"測量\">measure<\/a>.", "bodyPlain": "The following text is from a short story. Delphine had never run more than a mile before she signed up for the marathon, a decision she made mostly to prove something to herself rather than to anyone watching. She trained before dawn so no one would see her walking half the route, kept a log of every blister and every mile she managed to finish, and refused every excuse her body offered her to quit. On race day, she crossed the line four hours after the winner, smiling as though she had won something no clock could measure.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自一篇短篇小說。Delphine 在報名馬拉松之前從未跑超過一英里，她做這個決定主要是為了向自己證明某件事，而不是做給旁人看。她在黎明前訓練，這樣就沒人會看到她有一半路程是用走的；她記錄每一個水泡和每一英里完成的距離，並拒絕身體給她的每一個放棄的藉口。比賽當天，她在冠軍抵達四小時後才衝過終點線，臉上卻掛著笑容，彷彿贏得了某種時鐘無法衡量的東西。", "opts": {"A": "To illustrate Delphine's enjoyment of long-distance running", "B": "To explain why Delphine chose running over other forms of exercise", "C": "To portray Delphine's determination to accomplish a goal she set for herself", "D": "To describe a race that Delphine found particularly memorable"}, "optsZh": {"A": "說明 Delphine 對長跑的喜愛", "B": "解釋 Delphine 為何選擇跑步而非其他運動", "C": "描寫 Delphine 完成自己所設目標的決心", "D": "描述一場令 Delphine 特別難忘的比賽"}, "answer": "C", "expl": "The passage highlights Delphine's persistence in finishing a goal she set despite difficulty.", "explZh": ""}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Central Ideas and Details: identify the main purpose of a narrative passage that portrays a character's determination.", "vocab": false, "body": "The following text is from a novel. Old Mr. Petrov <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=decided\" target=\"_blank\" rel=\"noopener\">decided<\/a> that before he died he would <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translate\" target=\"_blank\" rel=\"noopener\">translate<\/a> his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grandfather\" target=\"_blank\" rel=\"noopener\">grandfather<\/a>&#x27;s diary, page by page, from a dialect that only a handful of people still spoke. He spent his afternoons hunched over a dictionary held together with tape, filling notebook after notebook with tentative English phrases he crossed out and rewrote. His daughter offered to hire a professional translator, but he waved her off each time, insisting that the words meant nothing unless he found them himself.", "bodyPlain": "The following text is from a novel. Old Mr. Petrov decided that before he died he would translate his grandfather's diary, page by page, from a dialect that only a handful of people still spoke. He spent his afternoons hunched over a dictionary held together with tape, filling notebook after notebook with tentative English phrases he crossed out and rewrote. His daughter offered to hire a professional translator, but he waved her off each time, insisting that the words meant nothing unless he found them himself.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自一部小說。年邁的 Petrov 先生決定，在他過世前要把祖父的日記一頁一頁地翻譯出來，而日記使用的方言如今只剩少數人還會說。他每天下午彎著腰對著一本用膠帶黏住的字典，寫滿一本又一本筆記，裡面全是他劃掉又重寫、不太確定的英文詞句。他的女兒提議請專業譯者，但他每次都揮手拒絕，堅持這些文字除非由他親自找出意義，否則毫無價值。", "opts": {"A": "To illustrate Mr. Petrov's fondness for an obscure dialect", "B": "To explain why Mr. Petrov distrusted professional translators", "C": "To portray Mr. Petrov's persistence in completing a task he set for himself", "D": "To describe a diary that Mr. Petrov considered his family's most valuable possession"}, "optsZh": {"A": "說明 Petrov 先生對一種冷門方言的喜好", "B": "解釋 Petrov 先生為何不信任專業譯者", "C": "描寫 Petrov 先生堅持完成自己設定的任務", "D": "描述一本 Petrov 先生視為家族最珍貴財產的日記"}, "answer": "C", "expl": "The passage focuses on Mr. Petrov's insistence on completing the translation himself despite the difficulty.", "explZh": ""}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion concedes an exception to a broader claim.", "vocab": false, "body": "The people of medieval Europe have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been seen as uninterested in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cleanliness\" target=\"_blank\" rel=\"noopener\" data-w=\"cleanliness\" data-pos=\"n.\" data-en=\"the state or habit of being clean\" data-zh=\"清潔；乾淨\">cleanliness<\/a> and hygiene, but modern research has shown that this is largely a myth. According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and—more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=affordably\" target=\"_blank\" rel=\"noopener\" data-w=\"affordably\" data-pos=\"adv.\" data-en=\"at a price people can pay\" data-zh=\"以負擔得起的價格\">affordably<\/a>—steam baths. <u>While such amenities were available mainly to town dwellers<\/u>, regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.", "bodyPlain": "The people of medieval Europe have traditionally been seen as uninterested in cleanliness and hygiene, but modern research has shown that this is largely a myth. According to historian Eleanor Janega, most medieval towns in Europe had at least one public bathhouse, which often offered both full-immersion baths and—more affordably—steam baths. While such amenities were available mainly to town dwellers, regular bathing in rivers and streams or daily sponge baths at home were common practices throughout medieval Europe.", "stem": "Which choice best describes the function of the underlined portion?", "stemZh": "哪一個選項最能描述畫線部分的功能？", "bodyZh": "中世紀歐洲人傳統上被認為不在乎清潔與衛生，但現代研究顯示這在很大程度上是個迷思。根據歷史學家 Eleanor Janega 的說法，大多數中世紀歐洲城鎮至少有一間公共澡堂，通常同時提供全身浸泡的浴池，以及——較便宜的——蒸氣浴。雖然這類設施主要供城鎮居民使用，但在河流溪水中定期沐浴，或每天在家用海綿擦澡，在整個中世紀歐洲都是常見的做法。", "opts": {"A": "It asserts that in medieval Europe steam baths were more popular in rural areas than in urban ones.", "B": "It describes a limitation of earlier historians' studies of medieval European bathing habits.", "C": "It concedes that not all people in medieval Europe had access to public bathhouses.", "D": "It explains why Janega decided to study the popularity of public bathhouses in medieval Europe."}, "optsZh": {"A": "它斷言在中世紀歐洲，蒸氣浴在鄉村比在城市更受歡迎。", "B": "它描述早期歷史學家研究中世紀歐洲沐浴習慣的局限。", "C": "它讓步承認並非所有中世紀歐洲人都能使用公共澡堂。", "D": "它解釋 Janega 為何決定研究中世紀歐洲公共澡堂的普及程度。"}, "answer": "C", "expl": "The underlined portion admits that bathhouses were mainly for town dwellers, conceding that not everyone had access to them.", "explZh": "畫線部分承認公共澡堂主要供城鎮居民使用，等於讓步說明並非所有人都能使用。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion concedes an exception to a broader claim.", "vocab": false, "body": "Nineteenth-century factory workers have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been seen as having no access to printed reading material, but modern research has shown that this is largely an oversimplification. According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Owen Bracewell, most industrial towns had at least one subscription library that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulated<\/a> inexpensive serialized novels among workers. While such libraries were concentrated mainly in larger mill towns, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inform\" target=\"_blank\" rel=\"noopener\" data-w=\"inform\" data-pos=\"v.\" data-en=\"to influence or shape (an idea or decision); to tell\" data-zh=\"影響；促成；告知\">informal<\/a> book-sharing among coworkers and readings aloud during breaks were common practices throughout the industrial regions.", "bodyPlain": "Nineteenth-century factory workers have traditionally been seen as having no access to printed reading material, but modern research has shown that this is largely an oversimplification. According to historian Owen Bracewell, most industrial towns had at least one subscription library that circulated inexpensive serialized novels among workers. While such libraries were concentrated mainly in larger mill towns, informal book-sharing among coworkers and readings aloud during breaks were common practices throughout the industrial regions.", "stem": "Which choice best describes the function of the underlined portion?", "stemZh": "哪一個選項最能描述畫線部分的功能？", "bodyZh": "十九世紀的工廠工人傳統上被認為無法接觸到印刷讀物，但現代研究顯示這在很大程度上是過度簡化的說法。根據歷史學家 Owen Bracewell 的說法，大多數工業城鎮至少有一間會員制圖書館，在工人之間流通便宜的連載小說。雖然這類圖書館主要集中在較大的紡織城鎮，但同事間非正式的借書，以及休息時間的朗讀，在整個工業地區都是常見的做法。", "opts": {"A": "It asserts that subscription libraries were more common in small towns than in large mill towns.", "B": "It describes a limitation of earlier historians' research methods.", "C": "It concedes that not all workers had access to subscription libraries.", "D": "It explains why Bracewell chose to study industrial-era reading habits."}, "optsZh": {"A": "它斷言會員制圖書館在小鎮比在大型紡織城鎮更常見。", "B": "它描述早期歷史學家研究方法的局限。", "C": "它讓步承認並非所有工人都能使用會員制圖書館。", "D": "它解釋 Bracewell 為何選擇研究工業時代的閱讀習慣。"}, "answer": "C", "expl": "The underlined sentence admits libraries were concentrated in larger towns, conceding an exception to the broader claim of access.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion concedes an exception to a broader claim.", "vocab": false, "body": "Rural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">households<\/a> in the early twentieth century have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been seen as isolated from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> news, but modern research has shown that this view is largely mistaken. According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Priya Chandran, most rural counties had at least one shared radio set, often housed in a general store or town hall. While such radios were owned mainly by a handful of wealthier merchants, informal gatherings to listen to broadcasts were common practices throughout rural communities.", "bodyPlain": "Rural households in the early twentieth century have traditionally been seen as isolated from national news, but modern research has shown that this view is largely mistaken. According to historian Priya Chandran, most rural counties had at least one shared radio set, often housed in a general store or town hall. While such radios were owned mainly by a handful of wealthier merchants, informal gatherings to listen to broadcasts were common practices throughout rural communities.", "stem": "Which choice best describes the function of the underlined portion?", "stemZh": "哪一個選項最能描述畫線部分的功能？", "bodyZh": "二十世紀初的農村家庭傳統上被認為與全國新聞隔絕，但現代研究顯示這種看法在很大程度上是錯的。根據歷史學家 Priya Chandran 的說法，大多數農村郡至少有一台共用的收音機，通常放在雜貨店或鎮公所。雖然這類收音機主要由少數較富裕的商人擁有，但非正式聚會一起收聽廣播在整個農村社區都是常見的做法。", "opts": {"A": "It asserts that radio ownership was more common in rural areas than in cities.", "B": "It describes a limitation of earlier historians' access to primary sources.", "C": "It concedes that radio ownership itself was concentrated among a small group.", "D": "It explains why Chandran decided to focus on rural communities."}, "optsZh": {"A": "它斷言收音機在鄉村比在城市更普遍。", "B": "它描述早期歷史學家取得原始資料的局限。", "C": "它讓步承認收音機的擁有權本身集中在一小群人手中。", "D": "它解釋 Chandran 為何決定專注於農村社區。"}, "answer": "C", "expl": "The underlined sentence admits ownership was limited to wealthier merchants, conceding an exception to the broader claim.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion concedes an exception to a broader claim.", "vocab": false, "body": "Enslaved artisans in the antebellum South have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been seen as excluded from any formal recognition of their craft, but modern research <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicates<\/a> that picture. According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Marcus Dell, several enslaved potters and blacksmiths had their work <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=purchase\" target=\"_blank\" rel=\"noopener\" data-w=\"purchase\" data-pos=\"v.\" data-en=\"to buy something\" data-zh=\"購買\">purchased<\/a> and displayed at regional fairs under their own names. While such recognition was granted mainly by a small number of sympathetic fair organizers, the sale and use of their crafted goods was common practice throughout the region.", "bodyPlain": "Enslaved artisans in the antebellum South have traditionally been seen as excluded from any formal recognition of their craft, but modern research complicates that picture. According to historian Marcus Dell, several enslaved potters and blacksmiths had their work purchased and displayed at regional fairs under their own names. While such recognition was granted mainly by a small number of sympathetic fair organizers, the sale and use of their crafted goods was common practice throughout the region.", "stem": "Which choice best describes the function of the underlined portion?", "stemZh": "哪一個選項最能描述畫線部分的功能？", "bodyZh": "南北戰爭前美國南方被奴役的工匠，傳統上被認為完全得不到對其手藝的正式認可，但現代研究讓這個圖像變得更複雜。根據歷史學家 Marcus Dell 的說法，有幾位被奴役的陶工和鐵匠，其作品曾以他們自己的名字在地區博覽會上被購買並展出。雖然這種認可主要來自少數同情他們的博覽會主辦者，但他們製作的物品在整個地區被買賣與使用是很普遍的。", "opts": {"A": "It asserts that fair organizers were generally opposed to recognizing enslaved artisans.", "B": "It describes a methodological limitation in Dell's own research.", "C": "It concedes that formal recognition came from only a limited group of organizers.", "D": "It explains why Dell began investigating regional fairs."}, "optsZh": {"A": "它斷言博覽會主辦者普遍反對認可被奴役的工匠。", "B": "它描述 Dell 自己研究中的方法局限。", "C": "它讓步承認正式的認可只來自有限的一群主辦者。", "D": "它解釋 Dell 為何開始調查地區博覽會。"}, "answer": "C", "expl": "The underlined sentence admits recognition came from only a few organizers, conceding an exception to the broader claim.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion concedes an exception to a broader claim.", "vocab": false, "body": "Medieval European peasants have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been seen as having no access to spices beyond salt, but modern research <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicates<\/a> that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assumption\" target=\"_blank\" rel=\"noopener\" data-w=\"assumption\" data-pos=\"n.\" data-en=\"something accepted as true without proof\" data-zh=\"假設；假定\">assumption<\/a>. According to historian Ingrid Solheim, most manor households kept at least a small store of pepper or mustard seed, often purchased at seasonal markets. While such spices were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=affordable\" target=\"_blank\" rel=\"noopener\" data-w=\"affordable\" data-pos=\"adj.\" data-en=\"cheap enough for people to buy\" data-zh=\"負擔得起的；價格合理的\">affordable<\/a> mainly to peasants with a modest surplus income, growing and using local herbs for flavoring was a common practice throughout the peasantry.", "bodyPlain": "Medieval European peasants have traditionally been seen as having no access to spices beyond salt, but modern research complicates that assumption. According to historian Ingrid Solheim, most manor households kept at least a small store of pepper or mustard seed, often purchased at seasonal markets. While such spices were affordable mainly to peasants with a modest surplus income, growing and using local herbs for flavoring was a common practice throughout the peasantry.", "stem": "Which choice best describes the function of the underlined portion?", "stemZh": "哪一個選項最能描述畫線部分的功能？", "bodyZh": "中世紀歐洲農民傳統上被認為除了鹽之外無法取得任何香料，但現代研究讓這個假設變得更複雜。根據歷史學家 Ingrid Solheim 的說法，大多數莊園家庭至少會存放少量胡椒或芥末籽，通常是在季節性市集購得的。雖然這類香料主要是有些許額外收入的農民才買得起，但種植並使用當地香草來調味在整個農民階層都是常見的做法。", "opts": {"A": "It asserts that pepper was cheaper than local herbs during the medieval period.", "B": "It describes a gap in the surviving manorial records Solheim consulted.", "C": "It concedes that imported spices were out of reach for the poorest peasants.", "D": "It explains why Solheim focused her research on manor households."}, "optsZh": {"A": "它斷言在中世紀，胡椒比當地香草還便宜。", "B": "它描述 Solheim 所參考的現存莊園紀錄中的缺漏。", "C": "它讓步承認最貧窮的農民買不起進口香料。", "D": "它解釋 Solheim 為何將研究焦點放在莊園家庭。"}, "answer": "C", "expl": "The underlined sentence admits imported spices were affordable only to those with surplus income, conceding an exception.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion concedes an exception to a broader claim.", "vocab": false, "body": "Colonial-era sailors have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been seen as entirely illiterate, but modern research has revised that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assumption\" target=\"_blank\" rel=\"noopener\" data-w=\"assumption\" data-pos=\"n.\" data-en=\"something accepted as true without proof\" data-zh=\"假設；假定\">assumption<\/a>. According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Felix Amaro, most merchant ships carried at least one crew member capable of reading navigational charts and basic correspondence. While full literacy was common mainly among officers and a handful of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experienced<\/a> hands, informal instruction in reading simple logbook entries was practiced throughout many crews.", "bodyPlain": "Colonial-era sailors have traditionally been seen as entirely illiterate, but modern research has revised that assumption. According to historian Felix Amaro, most merchant ships carried at least one crew member capable of reading navigational charts and basic correspondence. While full literacy was common mainly among officers and a handful of experienced hands, informal instruction in reading simple logbook entries was practiced throughout many crews.", "stem": "Which choice best describes the function of the underlined portion?", "stemZh": "哪一個選項最能描述畫線部分的功能？", "bodyZh": "殖民時期的水手傳統上被認為完全不識字，但現代研究修正了這個假設。根據歷史學家 Felix Amaro 的說法，大多數商船上至少有一名船員能夠閱讀航海圖和基本的書信。雖然完全識字的人主要是軍官和少數資深水手，但在許多船隊中，都會非正式地教導船員閱讀簡單的航海日誌條目。", "opts": {"A": "It asserts that officers resisted teaching sailors to read.", "B": "It describes a limitation in the surviving ship logs Amaro examined.", "C": "It concedes that full literacy was concentrated among a smaller group aboard ship.", "D": "It explains why Amaro chose to study merchant ships specifically."}, "optsZh": {"A": "它斷言軍官抗拒教水手識字。", "B": "它描述 Amaro 所檢視的現存航海日誌的局限。", "C": "它讓步承認完全識字的人集中在船上的少數人。", "D": "它解釋 Amaro 為何特別選擇研究商船。"}, "answer": "C", "expl": "The underlined sentence admits full literacy was common mainly among officers, conceding an exception to the broader claim.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Central Ideas and Details: identify the main purpose of a passage explaining why something appears effortless.", "vocab": false, "body": "When classical pianist Martha Argerich performs, it appears as if the music is coming to her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spontaneously\" target=\"_blank\" rel=\"noopener\" data-w=\"spontaneously\" data-pos=\"adv.\" data-en=\"naturally and without planning\" data-zh=\"自然而然地；自發地\">spontaneously<\/a>. She&#x27;s highly skilled technically, but because of how freely she plays and her willingness to take risks, she seems relaxed and natural. Her apparent ease, however, is due to a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tremendous\" target=\"_blank\" rel=\"noopener\" data-w=\"tremendous\" data-pos=\"adj.\" data-en=\"very great in amount or degree\" data-zh=\"極大的；巨大的\">tremendous<\/a> amount of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preparation\" target=\"_blank\" rel=\"noopener\" data-w=\"preparation\" data-pos=\"n.\" data-en=\"the work done to get ready for something\" data-zh=\"準備\">preparation<\/a>. Despite Argerich&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a> and virtuosity, she never takes for granted that she knows a piece of music. Instead, she approaches the music as if encountering it for the first time and tries to understand it anew.", "bodyPlain": "When classical pianist Martha Argerich performs, it appears as if the music is coming to her spontaneously. She's highly skilled technically, but because of how freely she plays and her willingness to take risks, she seems relaxed and natural. Her apparent ease, however, is due to a tremendous amount of preparation. Despite Argerich's experience and virtuosity, she never takes for granted that she knows a piece of music. Instead, she approaches the music as if encountering it for the first time and tries to understand it anew.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "古典鋼琴家 Martha Argerich 演奏時，音樂彷彿是自然而然地來到她身上。她的技巧非常高超，但由於她演奏得十分自由，又願意冒險，所以看起來輕鬆自然。然而，她表面上的從容，其實來自大量的準備。儘管 Argerich 經驗豐富、技藝精湛，她從不理所當然地認為自己已經懂得一首曲子。相反地，她面對音樂時，就像第一次接觸一樣，試著重新理解它。", "opts": {"A": "To provide details about how Argerich identifies which pieces of music she will perform", "B": "To assert that Argerich's performances look effortless because of how she prepares for them", "C": "To discuss the kinds of music Argerich feels most comfortable encountering for the first time", "D": "To describe the unique way that Argerich approaches music she hasn't performed before"}, "optsZh": {"A": "詳細說明 Argerich 如何決定要演奏哪些曲子", "B": "說明 Argerich 的演出之所以看起來毫不費力，是因為她的準備方式", "C": "討論 Argerich 第一次接觸時覺得最自在的音樂類型", "D": "描述 Argerich 面對尚未演奏過的音樂的獨特方式"}, "answer": "B", "expl": "The text says her playing seems relaxed and natural but that this ease 'is due to a tremendous amount of preparation.'", "explZh": "文中指出她的演奏看似輕鬆自然，但這份從容「來自大量的準備」。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Central Ideas and Details: identify the main purpose of a passage explaining why something appears effortless.", "vocab": false, "body": "When gymnast Ines Duarte <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compete\" target=\"_blank\" rel=\"noopener\" data-w=\"compete\" data-pos=\"v.\" data-en=\"to take part in a contest or try to win against others\" data-zh=\"競爭；參賽\">competes<\/a>, her routines look almost casual, as if the flips and turns cost her no effort at all. She has extraordinary natural flexibility, but her apparent looseness on the beam comes from years of repeating each <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transition\" target=\"_blank\" rel=\"noopener\" data-w=\"transition\" data-pos=\"n.\" data-en=\"a change from one state or topic to another\" data-zh=\"轉折；過渡\">transition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of times until her body no longer has to think about it. Despite her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a>, Duarte still rehearses every routine at quarter speed before competitions, treating even familiar sequences as though a single misplaced habit could still creep back in.", "bodyPlain": "When gymnast Ines Duarte competes, her routines look almost casual, as if the flips and turns cost her no effort at all. She has extraordinary natural flexibility, but her apparent looseness on the beam comes from years of repeating each transition thousands of times until her body no longer has to think about it. Despite her experience, Duarte still rehearses every routine at quarter speed before competitions, treating even familiar sequences as though a single misplaced habit could still creep back in.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "體操選手 Ines Duarte 比賽時，她的動作看起來幾乎很隨意，彷彿那些翻轉和旋轉完全不費力。她天生柔軟度極佳，但她在平衡木上看似放鬆的表現，來自多年來把每個銜接動作重複數千次，直到身體不必再思考。儘管經驗豐富，Duarte 在比賽前仍會以四分之一的速度排練每一套動作，即使是熟悉的動作順序也當作可能有某個錯誤習慣會悄悄回來般看待。", "opts": {"A": "To provide details about how Duarte selects her competition routines", "B": "To assert that Duarte's routines look effortless because of how thoroughly she rehearses them", "C": "To discuss the kinds of routines Duarte finds most physically demanding", "D": "To describe the unique method Duarte uses to warm up before competitions"}, "optsZh": {"A": "詳細說明 Duarte 如何挑選比賽動作", "B": "說明 Duarte 的動作之所以看起來毫不費力，是因為她徹底的排練", "C": "討論 Duarte 覺得體力上最吃力的動作類型", "D": "描述 Duarte 賽前熱身的獨特方法"}, "answer": "B", "expl": "The passage explains that Duarte's apparent ease results from repeated, careful rehearsal.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Central Ideas and Details: identify the main purpose of a passage explaining why something appears effortless.", "vocab": false, "body": "When chess grandmaster Yusuf Karimov plays, his moves seem to arrive instantly, as though he simply senses the right square without <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculation\" target=\"_blank\" rel=\"noopener\" data-w=\"calculation\" data-pos=\"n.\" data-en=\"the process of working out an amount using numbers\" data-zh=\"計算\">calculation<\/a>. He is naturally quick, but his apparent speed is the product of thousands of hours spent memorizing patterns from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> games. Despite decades of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a>, Karimov still studies each opponent&#x27;s past matches beforehand, refusing to assume that instinct alone will carry him through an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> position.", "bodyPlain": "When chess grandmaster Yusuf Karimov plays, his moves seem to arrive instantly, as though he simply senses the right square without calculation. He is naturally quick, but his apparent speed is the product of thousands of hours spent memorizing patterns from historical games. Despite decades of experience, Karimov still studies each opponent's past matches beforehand, refusing to assume that instinct alone will carry him through an unfamiliar position.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "西洋棋特級大師 Yusuf Karimov 下棋時，他的棋步似乎瞬間就出現，彷彿他不經計算就能感覺到正確的格子。他天生反應快，但他表面上的速度，是花了數千小時背熟歷史棋局中的棋型所得來的成果。儘管已有數十年經驗，Karimov 賽前仍會研究每位對手過去的比賽，拒絕假設光靠直覺就能應付不熟悉的局面。", "opts": {"A": "To provide details about how Karimov chooses which tournaments to enter", "B": "To assert that Karimov's speed at the board results from extensive preparation", "C": "To discuss the kinds of chess openings Karimov prefers to study", "D": "To describe the unique way Karimov approaches unfamiliar opponents"}, "optsZh": {"A": "詳細說明 Karimov 如何選擇參加哪些錦標賽", "B": "說明 Karimov 下棋的速度來自大量的準備", "C": "討論 Karimov 偏好研究的西洋棋開局類型", "D": "描述 Karimov 面對不熟悉對手的獨特方式"}, "answer": "B", "expl": "The passage explains that Karimov's apparent instant instinct actually results from extensive preparation.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Central Ideas and Details: identify the main purpose of a passage explaining why something appears effortless.", "vocab": false, "body": "When chef Odalys Ferreira plates a dish during a live <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cooking\" target=\"_blank\" rel=\"noopener\">cooking<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=demonstration\" target=\"_blank\" rel=\"noopener\">demonstration<\/a>, her hands move so <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=smoothly\" target=\"_blank\" rel=\"noopener\">smoothly<\/a> that the entire process seems unplanned. She has a natural feel for flavor, but her calm, unhurried pace on stage comes from rehearsing the same sequence of cuts and plating motions dozens of times beforehand. Even after years of demonstrations, Ferreira still times a full practice run the morning of each show, unwilling to trust that familiarity alone will keep her steady under the lights.", "bodyPlain": "When chef Odalys Ferreira plates a dish during a live cooking demonstration, her hands move so smoothly that the entire process seems unplanned. She has a natural feel for flavor, but her calm, unhurried pace on stage comes from rehearsing the same sequence of cuts and plating motions dozens of times beforehand. Even after years of demonstrations, Ferreira still times a full practice run the morning of each show, unwilling to trust that familiarity alone will keep her steady under the lights.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "主廚 Odalys Ferreira 在現場烹飪示範中擺盤時，她的雙手動作流暢，讓整個過程看起來毫無事先安排。她天生對味道很有感覺，但她在台上冷靜、從容的節奏，來自事前把同一套切菜與擺盤動作排練了數十次。即使已有多年示範經驗，Ferreira 仍會在每場表演當天早上計時完整演練一次，不願相信光靠熟悉感就能讓她在聚光燈下保持穩定。", "opts": {"A": "To provide details about how Ferreira develops new recipes", "B": "To assert that Ferreira's stage performances appear smooth because of her extensive rehearsal", "C": "To discuss which ingredients Ferreira prefers to use in her demonstrations", "D": "To describe the unique plating style Ferreira has developed over her career"}, "optsZh": {"A": "詳細說明 Ferreira 如何開發新食譜", "B": "說明 Ferreira 的舞台演出之所以看起來流暢，是因為她大量的排練", "C": "討論 Ferreira 在示範中偏好使用的食材", "D": "描述 Ferreira 在職業生涯中發展出的獨特擺盤風格"}, "answer": "B", "expl": "The passage explains that Ferreira's apparent smoothness results from repeated rehearsal, not spontaneity.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Central Ideas and Details: identify the main purpose of a passage explaining why something appears effortless.", "vocab": false, "body": "When <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=violinist\" target=\"_blank\" rel=\"noopener\">violinist<\/a> Theo Marchetti <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=performs\" target=\"_blank\" rel=\"noopener\">performs<\/a> a concerto, his fingers seem to find each note without hesitation, as though the piece has always simply lived in his hands. He has <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=considerable\" target=\"_blank\" rel=\"noopener\" data-w=\"considerable\" data-pos=\"adj.\" data-en=\"large in amount or importance\" data-zh=\"相當大的；可觀的\">considerable<\/a> natural talent, but his apparent ease comes from slow, deliberate practice sessions in which he isolates and repeats the most difficult passages far more often than the easy ones. Even with a piece he has performed dozens of times, Marchetti still runs through it at half tempo before a concert, refusing to assume his fingers will remember it on their own.", "bodyPlain": "When violinist Theo Marchetti performs a concerto, his fingers seem to find each note without hesitation, as though the piece has always simply lived in his hands. He has considerable natural talent, but his apparent ease comes from slow, deliberate practice sessions in which he isolates and repeats the most difficult passages far more often than the easy ones. Even with a piece he has performed dozens of times, Marchetti still runs through it at half tempo before a concert, refusing to assume his fingers will remember it on their own.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "小提琴家 Theo Marchetti 演奏協奏曲時，他的手指似乎毫不猶豫地找到每個音，彷彿這首曲子一直都存在他的手中。他有相當的天賦，但他表面上的從容，來自緩慢而刻意的練習，他會把最難的段落單獨挑出來，重複練習的次數遠多於簡單的段落。即使是演奏過數十次的曲子，Marchetti 在音樂會前仍會以一半的速度練過一遍，拒絕假設手指會自己記得。", "opts": {"A": "To provide details about how Marchetti chooses concertos to perform", "B": "To assert that Marchetti's performances appear effortless because of his deliberate practice habits", "C": "To discuss the kinds of passages Marchetti finds most enjoyable to play", "D": "To describe the unique warm-up ritual Marchetti follows before a concert"}, "optsZh": {"A": "詳細說明 Marchetti 如何選擇要演奏的協奏曲", "B": "說明 Marchetti 的演出之所以看起來毫不費力，是因為他刻意的練習習慣", "C": "討論 Marchetti 覺得最享受演奏的段落類型", "D": "描述 Marchetti 在音樂會前遵循的獨特熱身儀式"}, "answer": "B", "expl": "The passage explains that Marchetti's apparent effortlessness is the product of deliberate, repeated practice.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Central Ideas and Details: identify the main purpose of a passage explaining why something appears effortless.", "vocab": false, "body": "When public <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=speaker\" target=\"_blank\" rel=\"noopener\" data-w=\"speaker\" data-pos=\"n.\" data-en=\"the voice that talks in a poem; a person who speaks\" data-zh=\"說話者；（詩中的）敘述者\">speaker<\/a> Naledi Mokoena <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliver\" target=\"_blank\" rel=\"noopener\" data-w=\"deliver\" data-pos=\"v.\" data-en=\"to give a speech; to take something to a place\" data-zh=\"發表（演說）；遞送\">delivers<\/a> a keynote, she seems to speak <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> off the cuff, pausing and gesturing as though the words are occurring to her in the moment. She has a naturally warm stage <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=presence\" target=\"_blank\" rel=\"noopener\" data-w=\"presence\" data-pos=\"n.\" data-en=\"the fact of being present or represented\" data-zh=\"存在；出現\">presence<\/a>, but her apparent spontaneity is the result of rehearsing the same talk dozens of times in front of a mirror until each pause feels natural rather than scripted. Even for talks she has given many times before, Mokoena still rewrites and rehearses her opening lines the night before, unwilling to assume that past success guarantees the same effect again.", "bodyPlain": "When public speaker Naledi Mokoena delivers a keynote, she seems to speak entirely off the cuff, pausing and gesturing as though the words are occurring to her in the moment. She has a naturally warm stage presence, but her apparent spontaneity is the result of rehearsing the same talk dozens of times in front of a mirror until each pause feels natural rather than scripted. Even for talks she has given many times before, Mokoena still rewrites and rehearses her opening lines the night before, unwilling to assume that past success guarantees the same effect again.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "演講者 Naledi Mokoena 發表主題演講時，她似乎完全是即興發言，停頓和手勢彷彿是當下才想到這些話。她天生具有溫暖的台風，但她表面上的即興，是對著鏡子把同一場演講排練數十次的結果，直到每個停頓都感覺自然而非照稿演出。即使是講過很多次的演講，Mokoena 仍會在前一晚重寫並排練開場白，不願假設過去的成功就能保證同樣的效果。", "opts": {"A": "To provide details about how Mokoena decides which topics to speak about", "B": "To assert that Mokoena's talks appear spontaneous because of how extensively she rehearses them", "C": "To discuss the audiences Mokoena finds most comfortable speaking to", "D": "To describe the unique gestures Mokoena uses while on stage"}, "optsZh": {"A": "詳細說明 Mokoena 如何決定演講主題", "B": "說明 Mokoena 的演講之所以看起來即興，是因為她大量地排練", "C": "討論 Mokoena 覺得最自在的演講對象", "D": "描述 Mokoena 在台上使用的獨特手勢"}, "answer": "B", "expl": "The passage explains that Mokoena's apparent spontaneity results from extensive rehearsal.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Cross-Text Connections: predict how the author of one text would respond to an underlined claim in another text.", "vocab": false, "body": "Text 1: An excavation in Chiquihuite Cave in central Mexico has upended the belief that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 13,000 years ago, a group known as the Clovis people were the first human inhabitants of North America. More than 200 crude stone tools were found embedded in a layer of earth that is up to 33,150 years old, <u>revealing that humans occupied the cave <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of years before the Clovis people reached the continent<\/u>.<br><br>Text 2: The objects uncovered in Chiquihuite Cave are intriguing, but it is premature to characterize them as tools. The stone pieces are so <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=roughly\" target=\"_blank\" rel=\"noopener\" data-w=\"roughly\" data-pos=\"adv.\" data-en=\"approximately; not exactly\" data-zh=\"大約；粗略地\">roughly<\/a> shaped that they may have simply <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fracture\" target=\"_blank\" rel=\"noopener\" data-w=\"fracture\" data-pos=\"n.\" data-en=\"a crack or break\" data-zh=\"裂縫；斷裂\">fractured<\/a> from rocks during natural geological activity in the cave. Moreover, their unearthing has thus far not been accompanied by discoveries of other signs of human activity or even traces of human DNA from surfaces.", "bodyPlain": "Text 1: An excavation in Chiquihuite Cave in central Mexico has upended the belief that approximately 13,000 years ago, a group known as the Clovis people were the first human inhabitants of North America. More than 200 crude stone tools were found embedded in a layer of earth that is up to 33,150 years old, revealing that humans occupied the cave thousands of years before the Clovis people reached the continent.\n\nText 2: The objects uncovered in Chiquihuite Cave are intriguing, but it is premature to characterize them as tools. The stone pieces are so roughly shaped that they may have simply fractured from rocks during natural geological activity in the cave. Moreover, their unearthing has thus far not been accompanied by discoveries of other signs of human activity or even traces of human DNA from surfaces.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?", "stemZh": "根據這兩篇文章，Text 2 的作者最可能如何回應 Text 1 中畫線的說法？", "bodyZh": "Text 1：在墨西哥中部 Chiquihuite 洞穴的一次挖掘，推翻了一般認為約一萬三千年前，被稱為克洛維斯人的族群是北美洲第一批人類居民的看法。在一層距今最多三萬三千一百五十年的土層中，發現了兩百多件粗糙的石器，顯示人類早在克洛維斯人抵達這塊大陸的數千年前就已住在這個洞穴裡。\nText 2：在 Chiquihuite 洞穴出土的物品很引人好奇，但現在就把它們定性為工具還言之過早。這些石塊形狀非常粗糙，可能只是在洞穴的自然地質活動中從岩石上碎裂下來的。此外，到目前為止，這些物品出土時並未伴隨發現其他人類活動的跡象，甚至連表面上的人類 DNA 痕跡都沒有。", "opts": {"A": "By agreeing that the stone objects are tools, but disputing their proposed age", "B": "By questioning whether the stone objects are tools at all, given the lack of other evidence of human presence", "C": "By arguing that the Clovis people must have created the stone objects themselves", "D": "By suggesting that the cave was never actually occupied by any humans, ancient or otherwise"}, "optsZh": {"A": "同意這些石頭物品是工具，但質疑所提出的年代", "B": "鑑於缺乏其他人類存在的證據，質疑這些石頭物品是否真的是工具", "C": "主張必定是克洛維斯人自己製作了這些石頭物品", "D": "暗示這個洞穴其實從未有任何人類居住過，無論古代或其他時期"}, "answer": "B", "expl": "Text 2 says it is premature to call the stones tools and notes there are no other signs of human activity, so it would question the claim.", "explZh": "Text 2 認為現在稱這些石頭為工具還太早，且沒有其他人類活動的證據，因此會質疑這個說法。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Cross-Text Connections: predict how the author of one text would respond to an underlined claim in another text.", "vocab": false, "body": "Text 1: Newly analyzed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sediment\" target=\"_blank\" rel=\"noopener\" data-w=\"sediment\" data-pos=\"n.\" data-en=\"material that settles at the bottom of a liquid\" data-zh=\"沉積物\">sediment<\/a> cores from a lakebed in the Andes suggest that a farming <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> existed in the region at least 2,000 years earlier than previously believed. Researchers found layers of pollen from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=domesticated\" target=\"_blank\" rel=\"noopener\" data-w=\"domesticated\" data-pos=\"adj.\" data-en=\"(of animals) tamed and kept by humans\" data-zh=\"馴化的；家養的\">domesticated<\/a> crops in sediment dated to that earlier period, indicating that organized agriculture began there far sooner than the standard timeline holds.<br><br>Text 2: The pollen samples from the Andean lakebed are worth further study, but it is too soon to credit them to deliberate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cultivation\" target=\"_blank\" rel=\"noopener\" data-w=\"cultivation\" data-pos=\"n.\" data-en=\"the growing of crops\" data-zh=\"耕種；栽培\">cultivation<\/a>. The plant species identified also grow wild in the region, and the pollen could have been deposited by wind or animal activity rather than by human planting. No accompanying evidence of tools, irrigation channels, or cleared fields has yet been found at the site.", "bodyPlain": "Text 1: Newly analyzed sediment cores from a lakebed in the Andes suggest that a farming settlement existed in the region at least 2,000 years earlier than previously believed. Researchers found layers of pollen from domesticated crops in sediment dated to that earlier period, indicating that organized agriculture began there far sooner than the standard timeline holds.\n\nText 2: The pollen samples from the Andean lakebed are worth further study, but it is too soon to credit them to deliberate cultivation. The plant species identified also grow wild in the region, and the pollen could have been deposited by wind or animal activity rather than by human planting. No accompanying evidence of tools, irrigation channels, or cleared fields has yet been found at the site.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?", "stemZh": "根據這兩篇文章，Text 2 的作者最可能如何回應 Text 1 中畫線的說法？", "bodyZh": "Text 1：從安地斯山脈一處湖床新分析的沉積物岩芯顯示，該地區的農業聚落存在時間至少比先前認為的早兩千年。研究人員在年代屬於那段較早時期的沉積物中，發現了馴化作物的花粉層，顯示當地有組織的農業比標準時間表所認定的早得多。\nText 2：安地斯湖床的花粉樣本值得進一步研究，但現在就把它們歸因於刻意栽培還太早。被鑑定出的植物物種在該地區也有野生的，而這些花粉可能是被風或動物活動帶來的，而不是人類種植的結果。目前在該遺址尚未發現任何工具、灌溉渠道或開墾田地等相關證據。", "opts": {"A": "By agreeing that farming began early, but disputing exactly how early", "B": "By questioning whether the pollen indicates deliberate farming at all, given the absence of supporting evidence", "C": "By arguing that the crops were introduced by a different, unrelated culture", "D": "By suggesting that no plants ever grew wild in the region"}, "optsZh": {"A": "同意農業很早就開始，但質疑究竟有多早", "B": "鑑於缺乏佐證，質疑這些花粉是否真的表示有刻意的農耕", "C": "主張這些作物是由另一個無關的文化引進的", "D": "暗示該地區從未有野生植物生長"}, "answer": "B", "expl": "Text 2's author doubts the pollen proves farming without further supporting evidence, echoing the reasoning in the original.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Cross-Text Connections: predict how the author of one text would respond to an underlined claim in another text.", "vocab": false, "body": "Text 1: A set of markings on a cave wall in northern Spain has been interpreted by one research team as an early calendar tracking lunar cycles, based on the number and spacing of the marks. If correct, this would push back the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=earliest\" target=\"_blank\" rel=\"noopener\" data-w=\"earliest\" data-pos=\"adj.\" data-en=\"happening or existing first, before all others\" data-zh=\"最早的\">earliest<\/a> known <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of systematic timekeeping by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of years.<br><br>Text 2: The spacing of the marks on the cave wall is suggestive, but treating them as a calendar goes well beyond what the evidence supports. Similar spacing patterns occur in natural rock <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fracture\" target=\"_blank\" rel=\"noopener\" data-w=\"fracture\" data-pos=\"n.\" data-en=\"a crack or break\" data-zh=\"裂縫；斷裂\">fractures<\/a> found elsewhere in the same cave system, and no other markings at the site show any consistent numerical or seasonal pattern.", "bodyPlain": "Text 1: A set of markings on a cave wall in northern Spain has been interpreted by one research team as an early calendar tracking lunar cycles, based on the number and spacing of the marks. If correct, this would push back the earliest known evidence of systematic timekeeping by thousands of years.\n\nText 2: The spacing of the marks on the cave wall is suggestive, but treating them as a calendar goes well beyond what the evidence supports. Similar spacing patterns occur in natural rock fractures found elsewhere in the same cave system, and no other markings at the site show any consistent numerical or seasonal pattern.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?", "stemZh": "根據這兩篇文章，Text 2 的作者最可能如何回應 Text 1 中畫線的說法？", "bodyZh": "Text 1：西班牙北部一處洞穴牆上的一組刻痕，被一支研究團隊根據刻痕的數量與間距，詮釋為記錄月亮週期的早期曆法。如果正確，這將使已知最早有系統計時的證據往前推數千年。\nText 2：洞穴牆上刻痕的間距確實引人聯想，但把它們視為曆法，遠遠超出了證據所能支持的範圍。類似的間距模式也出現在同一洞穴系統其他地方的天然岩石裂縫中，而且該遺址的其他刻痕都沒有呈現任何一致的數字或季節模式。", "opts": {"A": "By agreeing the marks form a calendar, but disputing how far back it dates", "B": "By questioning whether the marks are intentional records at all, given similar natural patterns nearby", "C": "By arguing that a different, later culture must have made the marks", "D": "By suggesting that no cave markings anywhere can ever be reliably dated"}, "optsZh": {"A": "同意這些刻痕構成曆法，但質疑它的年代能追溯到多早", "B": "鑑於附近有類似的自然紋路，質疑這些刻痕是否真的是刻意的紀錄", "C": "主張這些刻痕必定是另一個較晚的文化所刻", "D": "暗示任何地方的洞穴刻痕都無法被可靠地定年"}, "answer": "B", "expl": "Text 2's author doubts the marks are intentional records, pointing to a natural explanation, echoing the original's reasoning.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Cross-Text Connections: predict how the author of one text would respond to an underlined claim in another text.", "vocab": false, "body": "Text 1: Fragments of woven fabric recovered from a bog in northern Europe have been dated to nearly 9,000 years ago, a finding one research team says proves that organized textile <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a> began far earlier than previously thought.<br><br>Text 2: The fabric fragments are a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remarkable\" target=\"_blank\" rel=\"noopener\" data-w=\"remarkable\" data-pos=\"adj.\" data-en=\"unusual and worth noticing\" data-zh=\"非凡的；值得注意的\">remarkable<\/a> find, but calling them evidence of organized textile production may be premature. The fibers could have been twisted together informally, without the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coordinate\" target=\"_blank\" rel=\"noopener\" data-w=\"coordinate\" data-pos=\"n.\" data-en=\"one of a set of numbers that gives an exact position\" data-zh=\"座標\">coordinated<\/a> tools or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">techniques<\/a> that organized production implies, and no spindles or looms have been recovered from the site.", "bodyPlain": "Text 1: Fragments of woven fabric recovered from a bog in northern Europe have been dated to nearly 9,000 years ago, a finding one research team says proves that organized textile production began far earlier than previously thought.\n\nText 2: The fabric fragments are a remarkable find, but calling them evidence of organized textile production may be premature. The fibers could have been twisted together informally, without the coordinated tools or techniques that organized production implies, and no spindles or looms have been recovered from the site.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?", "stemZh": "根據這兩篇文章，Text 2 的作者最可能如何回應 Text 1 中畫線的說法？", "bodyZh": "Text 1：從北歐一處沼澤中尋獲的編織布料碎片，被測定為距今將近九千年，一支研究團隊表示這項發現證明有組織的紡織生產遠比先前認為的更早開始。\nText 2：這些布料碎片是很了不起的發現，但稱它們為有組織紡織生產的證據可能言之過早。這些纖維可能只是被隨意地搓在一起，並不需要有組織生產所意味的協調工具或技術，而且該遺址也沒有找到任何紡錘或織布機。", "opts": {"A": "By agreeing that production was organized, but disputing the proposed date", "B": "By questioning whether the fragments reflect organized production at all, given the lack of tool evidence", "C": "By arguing that the fabric was brought to the bog from a distant region", "D": "By suggesting that fabric cannot survive for thousands of years under any conditions"}, "optsZh": {"A": "同意生產是有組織的，但質疑所提出的年代", "B": "鑑於缺乏工具證據，質疑這些碎片是否真的反映有組織的生產", "C": "主張這些布料是從遙遠地區被帶到沼澤的", "D": "暗示布料在任何條件下都無法保存數千年"}, "answer": "B", "expl": "Text 2's author doubts the fragments prove organized production without supporting tool evidence, echoing the original's reasoning.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Cross-Text Connections: predict how the author of one text would respond to an underlined claim in another text.", "vocab": false, "body": "Text 1: Scratches found on a set of ancient animal bones in East Africa have been interpreted by one team as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of early butchery using stone tools, pushing back the timeline for tool-assisted meat processing.<br><br>Text 2: The scratches on the bones are intriguing, but <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributing<\/a> them to stone-tool butchery overlooks a simpler explanation. Trampling by other animals across <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sediment\" target=\"_blank\" rel=\"noopener\" data-w=\"sediment\" data-pos=\"n.\" data-en=\"material that settles at the bottom of a liquid\" data-zh=\"沉積物\">sediment<\/a> containing small rock <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragments<\/a> can produce very similar marks, and no stone tools have actually been recovered near the bones.", "bodyPlain": "Text 1: Scratches found on a set of ancient animal bones in East Africa have been interpreted by one team as evidence of early butchery using stone tools, pushing back the timeline for tool-assisted meat processing.\n\nText 2: The scratches on the bones are intriguing, but attributing them to stone-tool butchery overlooks a simpler explanation. Trampling by other animals across sediment containing small rock fragments can produce very similar marks, and no stone tools have actually been recovered near the bones.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?", "stemZh": "根據這兩篇文章，Text 2 的作者最可能如何回應 Text 1 中畫線的說法？", "bodyZh": "Text 1：在東非一組古代動物骨頭上發現的刮痕，被一支團隊詮釋為使用石器早期屠宰的證據，將以工具輔助處理肉類的時間點往前推。\nText 2：骨頭上的刮痕很引人好奇，但把它們歸因於用石器屠宰，忽略了一個更簡單的解釋。其他動物踩踏含有小碎石的沉積物時，也可能產生非常相似的痕跡，而且骨頭附近實際上並未找到任何石器。", "opts": {"A": "By agreeing tools were used, but disputing which species used them", "B": "By questioning whether the marks indicate tool use at all, given a plausible natural cause", "C": "By arguing that the bones belonged to a scavenging species rather than a hunted one", "D": "By suggesting that the bones are too damaged to study further"}, "optsZh": {"A": "同意有使用工具，但質疑是哪個物種使用的", "B": "鑑於有合理的自然成因，質疑這些痕跡是否真的表示使用了工具", "C": "主張這些骨頭屬於食腐物種，而非被獵捕的物種", "D": "暗示這些骨頭損傷太嚴重，無法進一步研究"}, "answer": "B", "expl": "Text 2's author offers a natural explanation for the marks and doubts they show tool use, echoing the original's reasoning.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Cross-Text Connections: predict how the author of one text would respond to an underlined claim in another text.", "vocab": false, "body": "Text 1: Charred plant remains found at a rock shelter in Southeast Asia have been dated to a period <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of years before the region&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=earliest\" target=\"_blank\" rel=\"noopener\" data-w=\"earliest\" data-pos=\"adj.\" data-en=\"happening or existing first, before all others\" data-zh=\"最早的\">earliest<\/a> known hearths, leading one team to argue that controlled fire use began far earlier than believed.<br><br>Text 2: The charred remains are notable, but linking them to controlled fire use is not yet warranted. Wildfires are common in the region, and the site shows no accompanying <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of a constructed hearth, ash management, or repeated use of a single fire <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=location\" target=\"_blank\" rel=\"noopener\" data-w=\"location\" data-pos=\"n.\" data-en=\"a place or position\" data-zh=\"位置；地點\">location<\/a>.", "bodyPlain": "Text 1: Charred plant remains found at a rock shelter in Southeast Asia have been dated to a period thousands of years before the region's earliest known hearths, leading one team to argue that controlled fire use began far earlier than believed.\n\nText 2: The charred remains are notable, but linking them to controlled fire use is not yet warranted. Wildfires are common in the region, and the site shows no accompanying evidence of a constructed hearth, ash management, or repeated use of a single fire location.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?", "stemZh": "根據這兩篇文章，Text 2 的作者最可能如何回應 Text 1 中畫線的說法？", "bodyZh": "Text 1：在東南亞一處岩蔭遺址發現的燒焦植物殘骸，被測定為比該地區已知最早的火塘早了數千年，使一支團隊主張人類控制用火的時間遠比認為的更早。\nText 2：這些燒焦的殘骸值得注意，但把它們與控制用火連結起來目前還沒有充分理由。該地區野火很常見，而且該遺址沒有伴隨發現人造火塘、灰燼處理，或重複在同一地點生火的證據。", "opts": {"A": "By agreeing fire was controlled, but disputing exactly when it began", "B": "By questioning whether the remains reflect controlled fire use at all, given the absence of hearth evidence", "C": "By arguing that a different group must have used the rock shelter first", "D": "By suggesting that plants cannot be charred by natural wildfires"}, "optsZh": {"A": "同意火是被控制使用的，但質疑它究竟何時開始", "B": "鑑於缺乏火塘證據，質疑這些殘骸是否真的反映控制用火", "C": "主張必定是另一個族群最先使用這處岩蔭", "D": "暗示植物不可能被自然野火燒焦"}, "answer": "B", "expl": "Text 2's author points to the absence of hearth evidence and doubts the remains show controlled fire use, echoing the original's reasoning.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Central Ideas and Details: identify the main idea when a theorist argues existing concepts fail to fully capture a phenomenon.", "vocab": false, "body": "Many literary theorists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between fabula, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrative\" target=\"_blank\" rel=\"noopener\" data-w=\"narrative\" data-pos=\"n.\" data-en=\"a story or account of events\" data-zh=\"敘事；故事\">narrative<\/a>&#x27;s content, and syuzhet, a narrative&#x27;s arrangement and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=presentation\" target=\"_blank\" rel=\"noopener\" data-w=\"presentation\" data-pos=\"n.\" data-en=\"a talk that gives information to an audience\" data-zh=\"報告；簡報\">presentation<\/a> of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative—he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a> between the artist, the work, and the audience.", "bodyPlain": "Many literary theorists distinguish between fabula, a narrative's content, and syuzhet, a narrative's arrangement and presentation of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative—he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by interactions between the artist, the work, and the audience.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "許多文學理論家會區分 fabula（敘事的內容）與 syuzhet（敘事對事件的安排與呈現方式）。在電影《教父第二集》中，fabula 是柯里昂家族的故事，而 syuzhet 則是故事在 1901 年與 1958 年兩條時間線之間交替呈現的方式。但文學理論家 Mikhail Bakhtin 主張，fabula 與 syuzhet 不足以完整描述一個敘事——他認為對藝術現象的系統化分類，忽略了藝術家、作品與觀眾之間的互動創造意義的微妙方式。", "opts": {"A": "Literary theorist Mikhail Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives.", "B": "Literary theorist Mikhail Bakhtin claimed that meaning is not inherent in a narrative but is created when an audience encounters a narrative, so that narratives are interpreted differently by different people.", "C": "The storytelling methods used in The Godfather Part II may seem unusually complicated, but they can be easily understood when two concepts from literary theory are utilized.", "D": "Narratives that are told out of chronological order are more difficult for audiences to understand than are narratives presented chronologically."}, "optsZh": {"A": "文學理論家 Mikhail Bakhtin 主張，敘事有一些重要特質，是其他理論家用來分析敘事的兩個概念無法完全涵蓋的。", "B": "文學理論家 Mikhail Bakhtin 宣稱，意義並非敘事本身固有，而是在觀眾接觸敘事時才產生，所以不同的人會對敘事有不同的詮釋。", "C": "《教父第二集》使用的敘事手法可能看起來異常複雜，但只要運用文學理論中的兩個概念，就能輕鬆理解。", "D": "不依時間順序敘述的故事，比依時間順序呈現的故事更難讓觀眾理解。"}, "answer": "A", "expl": "Bakhtin held that fabula and syuzhet are 'insufficient to completely describe a narrative,' i.e., they miss important characteristics.", "explZh": "Bakhtin 認為 fabula 與 syuzhet「不足以完整描述敘事」，也就是這兩個概念遺漏了敘事的重要特質。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Central Ideas and Details: identify the main idea when a theorist argues existing concepts fail to fully capture a phenomenon.", "vocab": false, "body": "Many economists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between supply shocks, sudden disruptions to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a>, and demand shocks, sudden shifts in what <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumer\" target=\"_blank\" rel=\"noopener\" data-w=\"consumer\" data-pos=\"n.\" data-en=\"a person who buys goods or services\" data-zh=\"消費者\">consumers<\/a> are willing to buy. During the region&#x27;s recent fuel shortage, the supply shock was the disrupted shipment of oil, and the demand shock was the resulting shift toward alternative energy sources. But economist Renata Kessler maintained that supply and demand shocks are insufficient to completely explain the shortage&#x27;s effects—she held that standard categorizations of economic disruption discount the subtle way in which public trust in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutions<\/a> shapes how quickly markets actually recover.", "bodyPlain": "Many economists distinguish between supply shocks, sudden disruptions to production, and demand shocks, sudden shifts in what consumers are willing to buy. During the region's recent fuel shortage, the supply shock was the disrupted shipment of oil, and the demand shock was the resulting shift toward alternative energy sources. But economist Renata Kessler maintained that supply and demand shocks are insufficient to completely explain the shortage's effects—she held that standard categorizations of economic disruption discount the subtle way in which public trust in institutions shapes how quickly markets actually recover.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "許多經濟學家會區分供給衝擊（生產突然中斷）與需求衝擊（消費者購買意願的突然轉變）。在該地區最近的燃料短缺中，供給衝擊是石油運輸中斷，而需求衝擊則是隨之而來轉向替代能源的變化。但經濟學家 Renata Kessler 主張，供給與需求衝擊不足以完整解釋這次短缺的影響——她認為對經濟混亂的標準分類，忽略了大眾對機構的信任如何微妙地影響市場實際復甦的速度。", "opts": {"A": "Economist Renata Kessler argued that there are important factors shaping market recovery that are not fully captured by two concepts other economists have used to analyze disruptions.", "B": "Economist Renata Kessler claimed that supply shocks and demand shocks are simply two different names for the same underlying economic phenomenon.", "C": "The region's fuel shortage was unusually complex, but it can be fully explained using standard supply and demand analysis.", "D": "Public trust in institutions matters more to a region's economy than supply and demand shocks do."}, "optsZh": {"A": "經濟學家 Renata Kessler 主張，有一些影響市場復甦的重要因素，是其他經濟學家用來分析經濟混亂的兩個概念無法完全涵蓋的。", "B": "經濟學家 Renata Kessler 宣稱，供給衝擊與需求衝擊只是同一個經濟現象的兩個不同名稱。", "C": "該地區的燃料短缺異常複雜，但可以用標準的供需分析完全解釋。", "D": "大眾對機構的信任，對一個地區的經濟比供給與需求衝擊更重要。"}, "answer": "A", "expl": "Kessler argues that standard economic categories miss an additional factor (public trust) shaping outcomes, paralleling Bakhtin's argument.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Central Ideas and Details: identify the main idea when a theorist argues existing concepts fail to fully capture a phenomenon.", "vocab": false, "body": "Many musicologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between melody, a piece&#x27;s sequence of pitches, and harmony, the combination of pitches sounded together. In a given jazz standard, the melody is the tune a listener might hum, and the harmony is the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=underlying\" target=\"_blank\" rel=\"noopener\" data-w=\"underlying\" data-pos=\"adj.\" data-en=\"lying beneath; forming the basis of something\" data-zh=\"底下的；根本的\">underlying<\/a> chords supporting it. But musicologist Deshawn Fields maintained that melody and harmony are insufficient to completely describe a performance—he held that standard categorizations of musical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> discount the subtle way in which a performer&#x27;s timing and phrasing shape a listener&#x27;s emotional <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a>.", "bodyPlain": "Many musicologists distinguish between melody, a piece's sequence of pitches, and harmony, the combination of pitches sounded together. In a given jazz standard, the melody is the tune a listener might hum, and the harmony is the underlying chords supporting it. But musicologist Deshawn Fields maintained that melody and harmony are insufficient to completely describe a performance—he held that standard categorizations of musical structure discount the subtle way in which a performer's timing and phrasing shape a listener's emotional experience.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "許多音樂學家會區分旋律（樂曲的音高序列）與和聲（同時發出的多個音高的組合）。在一首爵士標準曲中，旋律是聽眾可能會哼唱的曲調，而和聲則是支撐旋律的底層和弦。但音樂學家 Deshawn Fields 主張，旋律與和聲不足以完整描述一場演出——他認為對音樂結構的標準分類，忽略了演奏者的節奏掌握與分句如何微妙地塑造聽眾的情感體驗。", "opts": {"A": "Musicologist Deshawn Fields argued that there are important aspects of a musical performance that are not fully captured by two concepts other musicologists have used to analyze music.", "B": "Musicologist Deshawn Fields claimed that melody and harmony are ultimately the same musical element viewed from two different perspectives.", "C": "Jazz standards are unusually difficult to analyze, but melody and harmony are sufficient tools for understanding them.", "D": "A performer's timing and phrasing matter more to a jazz standard than its melody and harmony do."}, "optsZh": {"A": "音樂學家 Deshawn Fields 主張，音樂演出有一些重要面向，是其他音樂學家用來分析音樂的兩個概念無法完全涵蓋的。", "B": "音樂學家 Deshawn Fields 宣稱，旋律與和聲最終是從兩個不同角度看待的同一個音樂元素。", "C": "爵士標準曲異常難以分析，但旋律與和聲足以作為理解它們的工具。", "D": "演奏者的節奏與分句對一首爵士標準曲而言，比旋律與和聲更重要。"}, "answer": "A", "expl": "Fields argues that standard musical categories miss an additional factor (timing and phrasing) shaping listener experience, paralleling Bakhtin's argument.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Central Ideas and Details: identify the main idea when a theorist argues existing concepts fail to fully capture a phenomenon.", "vocab": false, "body": "Many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=linguist\" target=\"_blank\" rel=\"noopener\" data-w=\"linguist\" data-pos=\"n.\" data-en=\"a scientist who studies language\" data-zh=\"語言學家\">linguists<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between denotation, a word&#x27;s literal dictionary meaning, and connotation, the associations a word carries beyond that meaning. In a given poem, the denotation of a word might be its plain definition, and the connotation might be the mood that word evokes. But linguist Anya Petrenko maintained that denotation and connotation are insufficient to completely describe a word&#x27;s effect in a poem—she held that standard categorizations of meaning discount the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=subtle\" target=\"_blank\" rel=\"noopener\" data-w=\"subtle\" data-pos=\"adj.\" data-en=\"not obvious; small and hard to notice\" data-zh=\"細微的\">subtle<\/a> way in which a word&#x27;s placement and rhythm within a line shape how a reader <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experiences<\/a> it.", "bodyPlain": "Many linguists distinguish between denotation, a word's literal dictionary meaning, and connotation, the associations a word carries beyond that meaning. In a given poem, the denotation of a word might be its plain definition, and the connotation might be the mood that word evokes. But linguist Anya Petrenko maintained that denotation and connotation are insufficient to completely describe a word's effect in a poem—she held that standard categorizations of meaning discount the subtle way in which a word's placement and rhythm within a line shape how a reader experiences it.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "許多語言學家會區分外延義（字詞字面上的字典意義）與內涵義（字詞在字面意義之外所帶有的聯想）。在一首詩中，某個字的外延義可能是它的普通定義，而內涵義可能是這個字所喚起的情緒。但語言學家 Anya Petrenko 主張，外延義與內涵義不足以完整描述一個字在詩中的效果——她認為對意義的標準分類，忽略了一個字在詩行中的位置與節奏如何微妙地影響讀者的感受。", "opts": {"A": "Linguist Anya Petrenko argued that there are important aspects of a word's poetic effect that are not fully captured by two concepts other linguists have used to analyze meaning.", "B": "Linguist Anya Petrenko claimed that denotation and connotation are simply two labels for a single, unified concept of meaning.", "C": "Poems are unusually difficult texts, but denotation and connotation are sufficient tools for analyzing them.", "D": "A word's placement and rhythm within a line matter more than its denotation and connotation do."}, "optsZh": {"A": "語言學家 Anya Petrenko 主張，一個字的詩意效果有一些重要面向，是其他語言學家用來分析意義的兩個概念無法完全涵蓋的。", "B": "語言學家 Anya Petrenko 宣稱，外延義與內涵義只是同一個統一意義概念的兩個標籤。", "C": "詩是異常困難的文本，但外延義與內涵義足以作為分析它們的工具。", "D": "一個字在詩行中的位置與節奏，比它的外延義與內涵義更重要。"}, "answer": "A", "expl": "Petrenko argues that standard linguistic categories miss an additional factor (placement an
