o 設計的，而他更以小巧精緻的玻璃作品聞名，而非大型公共裝置。", "opts": {"A": "mascot Ember the phoenix", "B": "mascot Ember the phoenix,", "C": "mascot: Ember the phoenix", "D": "mascot, Ember the phoenix"}, "optsZh": {"A": "吉祥物 Ember the phoenix（無標點）", "B": "吉祥物 Ember the phoenix（後加逗號）", "C": "吉祥物：Ember the phoenix（前加冒號）", "D": "吉祥物，Ember the phoenix（前加逗號）"}, "answer": "A", "expl": "\"Ember the phoenix\" restrictively specifies which mascot, so no punctuation should separate it from \"mascot.\"", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English Conventions (Boundaries): no comma is needed before a restrictive appositive that specifies exactly which one.", "vocab": false, "body": "Listeners of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=long-running\" target=\"_blank\" rel=\"noopener\">long-running<\/a> radio drama may not know that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=booming\" target=\"_blank\" rel=\"noopener\">booming<\/a>, theatrical voice behind the ______ belongs to veteran broadcaster Delia Okoro, who spent most of her early <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=career\" target=\"_blank\" rel=\"noopener\" data-w=\"career\" data-pos=\"n.\" data-en=\"the series of jobs a person has in their working life\" data-zh=\"職業生涯\">career<\/a> narrating nature documentaries.", "bodyPlain": "Listeners of the long-running radio drama may not know that the booming, theatrical voice behind the ______ belongs to veteran broadcaster Delia Okoro, who spent most of her early career narrating nature documentaries.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "長壽廣播劇的聽眾可能不知道，______ 背後那宏亮、富戲劇性的聲音，屬於資深廣播人 Delia Okoro，她早期大部分的職業生涯都在為自然紀錄片旁白。", "opts": {"A": "villain Count Marrow", "B": "villain Count Marrow,", "C": "villain: Count Marrow", "D": "villain, Count Marrow"}, "optsZh": {"A": "反派 Count Marrow（無標點）", "B": "反派 Count Marrow（後加逗號）", "C": "反派：Count Marrow（前加冒號）", "D": "反派，Count Marrow（前加逗號）"}, "answer": "A", "expl": "\"Count Marrow\" restrictively specifies which villain, so no punctuation should separate it from \"villain.\"", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English Conventions (Boundaries): no comma is needed before a restrictive appositive that specifies exactly which one.", "vocab": false, "body": "Fans of the puppet show may not know that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=squeaky\" target=\"_blank\" rel=\"noopener\">squeaky<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=high-pitched\" target=\"_blank\" rel=\"noopener\">high-pitched<\/a> voice behind the ______ belongs to puppeteer Simon Alvarado, who otherwise performs almost exclusively as a stern, low-voiced <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a>.", "bodyPlain": "Fans of the puppet show may not know that the squeaky, high-pitched voice behind the ______ belongs to puppeteer Simon Alvarado, who otherwise performs almost exclusively as a stern, low-voiced narrator.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "偶戲的觀眾可能不知道，______ 背後那尖細高亢的聲音，屬於操偶師 Simon Alvarado，而他平常幾乎只演出嚴肅、低沉嗓音的旁白角色。", "opts": {"A": "puppet Wobble the frog", "B": "puppet Wobble the frog,", "C": "puppet: Wobble the frog", "D": "puppet, Wobble the frog"}, "optsZh": {"A": "布偶 Wobble the frog（無標點）", "B": "布偶 Wobble the frog（後加逗號）", "C": "布偶：Wobble the frog（前加冒號）", "D": "布偶，Wobble the frog（前加逗號）"}, "answer": "A", "expl": "\"Wobble the frog\" restrictively specifies which puppet, so no punctuation should separate it from \"puppet.\"", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English Conventions (Boundaries): no comma is needed before a restrictive appositive that specifies exactly which one.", "vocab": false, "body": "Fans of the video game series may not know that the calm, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=precise\" target=\"_blank\" rel=\"noopener\" data-w=\"precise\" data-pos=\"adj.\" data-en=\"exact and accurate\" data-zh=\"精確的\">precise<\/a> voice behind the ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=belongs\" target=\"_blank\" rel=\"noopener\">belongs<\/a> to actor Nia Whitcombe, who has otherwise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appeared\" target=\"_blank\" rel=\"noopener\">appeared<\/a> mainly in fast-talking comic roles.", "bodyPlain": "Fans of the video game series may not know that the calm, precise voice behind the ______ belongs to actor Nia Whitcombe, who has otherwise appeared mainly in fast-talking comic roles.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個電玩系列的玩家可能不知道，______ 背後那冷靜、精準的聲音，屬於演員 Nia Whitcombe，而她平常主要演出說話很快的喜劇角色。", "opts": {"A": "navigator unit Compass", "B": "navigator unit Compass,", "C": "navigator unit: Compass", "D": "navigator unit, Compass"}, "optsZh": {"A": "導航單元 Compass（無標點）", "B": "導航單元 Compass（後加逗號）", "C": "導航單元：Compass（前加冒號）", "D": "導航單元，Compass（前加逗號）"}, "answer": "A", "expl": "\"Compass\" restrictively specifies which navigator unit, so no punctuation should separate it from \"navigator unit.\"", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Transitions: choose the logical connector showing a result.", "vocab": false, "body": "Celebrated Tewa potter Maria Martinez (1887-1980) made her signature all-black <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ceramic\" target=\"_blank\" rel=\"noopener\" data-w=\"ceramic\" data-pos=\"adj.\" data-en=\"made of clay that has been fired\" data-zh=\"陶瓷的\">ceramic<\/a> vessels using a heating <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> called <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduction\" target=\"_blank\" rel=\"noopener\" data-w=\"reduction\" data-pos=\"n.\" data-en=\"the act of making something smaller or less\" data-zh=\"減少\">reduction<\/a> firing. This technique involves <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=smother\" target=\"_blank\" rel=\"noopener\" data-w=\"smother\" data-pos=\"v.\" data-en=\"to put out a fire by covering it\" data-zh=\"悶熄；覆蓋使熄滅\">smothering<\/a> the flame surrounding the clay vessel. ______ the vessel takes on a shiny, black hue.", "bodyPlain": "Celebrated Tewa potter Maria Martinez (1887-1980) made her signature all-black ceramic vessels using a heating technique called reduction firing. This technique involves smothering the flame surrounding the clay vessel. ______ the vessel takes on a shiny, black hue.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "著名的 Tewa 族陶藝家 Maria Martinez（1887–1980）以一種稱為還原燒的加熱技法，製作她招牌的全黑陶器。這種技法需要悶住陶器周圍的火焰。______ 陶器就會呈現出光亮的黑色。", "opts": {"A": "On the contrary,", "B": "For example,", "C": "Previously,", "D": "As a result,"}, "optsZh": {"A": "正好相反，", "B": "例如，", "C": "先前，", "D": "因此，"}, "answer": "D", "expl": "Smothering the flame causes the vessel to turn black, so the second sentence is a result: 'As a result.'", "explZh": "悶住火焰導致陶器變黑，後句是結果，所以用「As a result」。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Transitions: choose the logical connector showing a result.", "vocab": false, "body": "Celebrated ceramicist Renata Blum creates her signature crackled glaze using a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> called thermal shock. This technique involves plunging a still-hot <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vessel\" target=\"_blank\" rel=\"noopener\" data-w=\"vessel\" data-pos=\"n.\" data-en=\"a container such as a pot or bowl\" data-zh=\"器皿；容器\">vessel<\/a> into a cold water bath. ______ the glaze <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fracture\" target=\"_blank\" rel=\"noopener\" data-w=\"fracture\" data-pos=\"n.\" data-en=\"a crack or break\" data-zh=\"裂縫；斷裂\">fractures<\/a> into a fine, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uniform\" target=\"_blank\" rel=\"noopener\" data-w=\"uniform\" data-pos=\"adj.\" data-en=\"the same in all parts; not varying\" data-zh=\"一致的；統一的\">uniform<\/a> network of lines.", "bodyPlain": "Celebrated ceramicist Renata Blum creates her signature crackled glaze using a technique called thermal shock. This technique involves plunging a still-hot vessel into a cold water bath. ______ the glaze fractures into a fine, uniform network of lines.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "著名陶藝家 Renata Blum 以一種稱為熱衝擊的技法，創造她招牌的冰裂釉。這種技法是把仍然很燙的陶器浸入冷水中。______ 釉面會裂成細緻而均勻的紋路網。", "opts": {"A": "On the contrary,", "B": "For example,", "C": "Previously,", "D": "As a result,"}, "optsZh": {"A": "正好相反，", "B": "例如，", "C": "先前，", "D": "因此，"}, "answer": "D", "expl": "The fracturing of the glaze is the direct result of the thermal shock, calling for \"As a result.\"", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Transitions: choose the logical connector showing a result.", "vocab": false, "body": "Master brewer Tobias Lund <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=signature\" target=\"_blank\" rel=\"noopener\">signature<\/a> cloudy ale using a process called kraeusening. This process involves adding a small amount of actively fermenting wort to the finished beer. ______ the beer undergoes a brief <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secondary\" target=\"_blank\" rel=\"noopener\" data-w=\"secondary\" data-pos=\"adj.\" data-en=\"less important than something else\" data-zh=\"次要的\">secondary<\/a> fermentation that boosts its natural carbonation.", "bodyPlain": "Master brewer Tobias Lund produces his signature cloudy ale using a process called kraeusening. This process involves adding a small amount of actively fermenting wort to the finished beer. ______ the beer undergoes a brief secondary fermentation that boosts its natural carbonation.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "釀酒大師 Tobias Lund 以一種稱為 kraeusening 的製程，釀造他招牌的混濁艾爾啤酒。這個製程是在完成的啤酒中加入少量正在發酵的麥汁。______ 啤酒會經過短暫的二次發酵，增加其天然氣泡。", "opts": {"A": "On the contrary,", "B": "For example,", "C": "Previously,", "D": "As a result,"}, "optsZh": {"A": "正好相反，", "B": "例如，", "C": "先前，", "D": "因此，"}, "answer": "D", "expl": "The secondary fermentation is the direct result of adding the fermenting wort, calling for \"As a result.\"", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Transitions: choose the logical connector showing a result.", "vocab": false, "body": "Blacksmith Ingrid Solheim <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=forge\" target=\"_blank\" rel=\"noopener\" data-w=\"forge\" data-pos=\"n.\" data-en=\"a place or furnace where metal is heated and shaped\" data-zh=\"鍛造爐；熔爐\">forges<\/a> her signature mottled blades using a process called pattern welding. This process involves folding and hammering together layers of different steel <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=alloy\" target=\"_blank\" rel=\"noopener\" data-w=\"alloy\" data-pos=\"n.\" data-en=\"a metal made by mixing two or more metals\" data-zh=\"合金\">alloys<\/a>. ______ the blade&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveals<\/a> a rippling, wood-grain-like pattern once polished and etched.", "bodyPlain": "Blacksmith Ingrid Solheim forges her signature mottled blades using a process called pattern welding. This process involves folding and hammering together layers of different steel alloys. ______ the blade's surface reveals a rippling, wood-grain-like pattern once polished and etched.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "鐵匠 Ingrid Solheim 以一種稱為圖案焊接的製程，鍛造她招牌的斑駁刀刃。這個製程是把不同鋼合金的層層折疊、捶打在一起。______ 刀刃表面在拋光與蝕刻後，會呈現波紋狀、類似木紋的圖案。", "opts": {"A": "On the contrary,", "B": "For example,", "C": "Previously,", "D": "As a result,"}, "optsZh": {"A": "正好相反，", "B": "例如，", "C": "先前，", "D": "因此，"}, "answer": "D", "expl": "The rippling pattern is the direct result of folding the steel layers, calling for \"As a result.\"", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Transitions: choose the logical connector showing a result.", "vocab": false, "body": "Papermaker Dae-jung Lim <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=signature\" target=\"_blank\" rel=\"noopener\">signature<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translucent\" target=\"_blank\" rel=\"noopener\" data-w=\"translucent\" data-pos=\"adj.\" data-en=\"allowing some light to pass through but not clear enough to see through\" data-zh=\"半透明的\">translucent<\/a> sheets using a process called sun-bleaching. This process involves laying wet pulp sheets flat under direct sunlight for several days. ______ the sheets lose their natural yellow tint and take on an even, pale color.", "bodyPlain": "Papermaker Dae-jung Lim produces his signature translucent sheets using a process called sun-bleaching. This process involves laying wet pulp sheets flat under direct sunlight for several days. ______ the sheets lose their natural yellow tint and take on an even, pale color.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "造紙師 Dae-jung Lim 以一種稱為日曬漂白的製程，製作他招牌的半透明紙張。這個製程是把濕紙漿片平放在陽光直射下好幾天。______ 紙張會褪去天然的黃色，呈現均勻淡雅的顏色。", "opts": {"A": "On the contrary,", "B": "For example,", "C": "Previously,", "D": "As a result,"}, "optsZh": {"A": "正好相反，", "B": "例如，", "C": "先前，", "D": "因此，"}, "answer": "D", "expl": "The loss of yellow tint is the direct result of the sun-bleaching, calling for \"As a result.\"", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Transitions: choose the logical connector showing a result.", "vocab": false, "body": "Cheesemaker Paola Rinaldi <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=signature\" target=\"_blank\" rel=\"noopener\">signature<\/a> blue-veined wheel using a process called needling. This process involves piercing the aging cheese with thin steel rods to let air reach its interior. ______ mold <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spore\" target=\"_blank\" rel=\"noopener\" data-w=\"spore\" data-pos=\"n.\" data-en=\"a tiny cell produced by fungi and some plants that can grow into a new organism\" data-zh=\"孢子\">spores<\/a> already present in the cheese spread along the punctured channels.", "bodyPlain": "Cheesemaker Paola Rinaldi produces her signature blue-veined wheel using a process called needling. This process involves piercing the aging cheese with thin steel rods to let air reach its interior. ______ mold spores already present in the cheese spread along the punctured channels.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "乳酪師 Paola Rinaldi 以一種稱為穿刺的製程，製作她招牌的藍紋乳酪。這個製程是用細鋼棒刺穿熟成中的乳酪，讓空氣進入內部。______ 乳酪中原本就有的黴菌孢子會沿著被刺穿的通道擴散。", "opts": {"A": "On the contrary,", "B": "For example,", "C": "Previously,", "D": "As a result,"}, "optsZh": {"A": "正好相反，", "B": "例如，", "C": "先前，", "D": "因此，"}, "answer": "D", "expl": "The spreading of mold spores is the direct result of the needling process, calling for \"As a result.\"", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Transitions: choose the logical connector showing similarity between two people's approaches.", "vocab": false, "body": "In the early 1970s, Albert Popa took up graffiti art, spraying his work onto what was at the time an unconventional <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a>: concrete. Albert&#x27;s son David has chosen an unusual canvas for his new art project, Fractured. In this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remarkable\" target=\"_blank\" rel=\"noopener\" data-w=\"remarkable\" data-pos=\"adj.\" data-en=\"unusual and worth noticing\" data-zh=\"非凡的；值得注意的\">remarkable<\/a> work, the artist draws charcoal faces onto <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragmented<\/a> ice floes in Finland, creating the visual effect of a face slowly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fracture\" target=\"_blank\" rel=\"noopener\" data-w=\"fracture\" data-pos=\"n.\" data-en=\"a crack or break\" data-zh=\"裂縫；斷裂\">fracturing<\/a>.", "bodyPlain": "In the early 1970s, Albert Popa took up graffiti art, spraying his work onto what was at the time an unconventional surface: concrete. Albert's son David has chosen an unusual canvas for his new art project, Fractured. In this remarkable work, the artist draws charcoal faces onto fragmented ice floes in Finland, creating the visual effect of a face slowly fracturing.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "1970 年代初，Albert Popa 開始創作塗鴉藝術，把作品噴在當時非傳統的表面上：混凝土。Albert 的兒子 David 為他的新藝術計畫《Fractured》選擇了一種不尋常的畫布。在這件傑出的作品中，藝術家在芬蘭碎裂的浮冰上用炭筆畫出人臉，創造出臉孔慢慢碎裂的視覺效果。", "opts": {"A": "However,", "B": "Indeed,", "C": "Second,", "D": "Likewise,"}, "optsZh": {"A": "然而，", "B": "確實，", "C": "第二，", "D": "同樣地，"}, "answer": "D", "expl": "Like his father, who used an unconventional surface, David also uses an unusual canvas, so 'Likewise' shows similarity.", "explZh": "父親使用非傳統的創作表面，兒子 David 也選擇不尋常的畫布，兩者相似，用「Likewise」。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Transitions: choose the logical connector showing similarity between two people's approaches.", "vocab": false, "body": "In the early 1960s, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculptor\" target=\"_blank\" rel=\"noopener\" data-w=\"sculptor\" data-pos=\"n.\" data-en=\"an artist who makes sculptures\" data-zh=\"雕塑家\">sculptor<\/a> Amara Diallo began welding scrap car parts into large outdoor pieces, an unusual choice of material for fine art at the time. Amara&#x27;s granddaughter Fatou has chosen an equally unconventional <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=medium\" target=\"_blank\" rel=\"noopener\" data-w=\"medium\" data-pos=\"n.\" data-en=\"a material or method used to create art\" data-zh=\"媒材；媒介\">medium<\/a> for her new project, Static. In this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=striking\" target=\"_blank\" rel=\"noopener\" data-w=\"striking\" data-pos=\"adj.\" data-en=\"very noticeable or impressive\" data-zh=\"引人注目的；醒目的\">striking<\/a> series, the artist arranges discarded television sets into wall-sized mosaics, creating the visual effect of a single <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fracture\" target=\"_blank\" rel=\"noopener\" data-w=\"fracture\" data-pos=\"n.\" data-en=\"a crack or break\" data-zh=\"裂縫；斷裂\">fractured<\/a> image spread across dozens of screens.", "bodyPlain": "In the early 1960s, sculptor Amara Diallo began welding scrap car parts into large outdoor pieces, an unusual choice of material for fine art at the time. Amara's granddaughter Fatou has chosen an equally unconventional medium for her new project, Static. In this striking series, the artist arranges discarded television sets into wall-sized mosaics, creating the visual effect of a single fractured image spread across dozens of screens.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "1960 年代初，雕塑家 Amara Diallo 開始把廢棄汽車零件焊接成大型戶外作品，這在當時是很不尋常的藝術材料。Amara 的孫女 Fatou 為她的新計畫《Static》選擇了同樣非傳統的媒材。在這個引人注目的系列中，藝術家把丟棄的電視機排成牆面大小的馬賽克，創造出一個破碎影像分散在數十個螢幕上的視覺效果。", "opts": {"A": "However,", "B": "Indeed,", "C": "Second,", "D": "Likewise,"}, "optsZh": {"A": "然而，", "B": "確實，", "C": "第二，", "D": "同樣地，"}, "answer": "D", "expl": "Fatou's unconventional-material approach parallels her grandmother's, calling for \"Likewise.\"", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Transitions: choose the logical connector showing similarity between two people's approaches.", "vocab": false, "body": "In the early 1970s, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographer<\/a> Hugo Meier began developing prints <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=directly\" target=\"_blank\" rel=\"noopener\" data-w=\"directly\" data-pos=\"adv.\" data-en=\"without anything or anyone in between\" data-zh=\"直接地\">directly<\/a> onto sheets of scavenged metal, an unusual surface for photography at the time. Hugo&#x27;s son Tobias has chosen an equally unusual canvas for his new project, Rust Line. In this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remarkable\" target=\"_blank\" rel=\"noopener\" data-w=\"remarkable\" data-pos=\"adj.\" data-en=\"unusual and worth noticing\" data-zh=\"非凡的；值得注意的\">remarkable<\/a> series, the artist projects old family photographs onto rusted shipping <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=container\" target=\"_blank\" rel=\"noopener\" data-w=\"container\" data-pos=\"n.\" data-en=\"an object such as a box or bottle used for holding things\" data-zh=\"容器\">containers<\/a>, creating the visual effect of memories bleeding into decay.", "bodyPlain": "In the early 1970s, photographer Hugo Meier began developing prints directly onto sheets of scavenged metal, an unusual surface for photography at the time. Hugo's son Tobias has chosen an equally unusual canvas for his new project, Rust Line. In this remarkable series, the artist projects old family photographs onto rusted shipping containers, creating the visual effect of memories bleeding into decay.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "1970 年代初，攝影師 Hugo Meier 開始把照片直接沖印在撿來的金屬片上，這在當時是很不尋常的攝影表面。Hugo 的兒子 Tobias 為他的新計畫《Rust Line》選擇了同樣不尋常的畫布。在這個傑出的系列中，藝術家把老舊的家庭照片投影在生鏽的貨櫃上，創造出回憶逐漸滲入腐朽的視覺效果。", "opts": {"A": "However,", "B": "Indeed,", "C": "Second,", "D": "Likewise,"}, "optsZh": {"A": "然而，", "B": "確實，", "C": "第二，", "D": "同樣地，"}, "answer": "D", "expl": "Tobias's unconventional-surface approach parallels his father's, calling for \"Likewise.\"", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Transitions: choose the logical connector showing similarity between two people's approaches.", "vocab": false, "body": "In the early 1980s, textile artist Beatriz Nunes began <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=weaving\" target=\"_blank\" rel=\"noopener\" data-w=\"weaving\" data-pos=\"n.\" data-en=\"the craft of making cloth by crossing threads\" data-zh=\"編織\">weaving<\/a> discarded fishing nets into large tapestries, an unusual material for textile art at the time. Beatriz&#x27;s nephew Caio has chosen an equally unusual material for his new project, Tideline. In this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remarkable\" target=\"_blank\" rel=\"noopener\" data-w=\"remarkable\" data-pos=\"adj.\" data-en=\"unusual and worth noticing\" data-zh=\"非凡的；值得注意的\">remarkable<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a>, the artist knots together sun-bleached plastic bottle caps collected from local beaches, creating the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visual\" target=\"_blank\" rel=\"noopener\" data-w=\"visual\" data-pos=\"n.\" data-en=\"an image or picture used to show or explain something\" data-zh=\"視覺效果；影像\">visual<\/a> effect of a wave frozen mid-crash.", "bodyPlain": "In the early 1980s, textile artist Beatriz Nunes began weaving discarded fishing nets into large tapestries, an unusual material for textile art at the time. Beatriz's nephew Caio has chosen an equally unusual material for his new project, Tideline. In this remarkable installation, the artist knots together sun-bleached plastic bottle caps collected from local beaches, creating the visual effect of a wave frozen mid-crash.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "1980 年代初，纖維藝術家 Beatriz Nunes 開始把廢棄漁網編織成大型掛毯，這在當時是很不尋常的纖維藝術材料。Beatriz 的姪子 Caio 為他的新計畫《Tideline》選擇了同樣不尋常的材料。在這件傑出的裝置作品中，藝術家把從當地海灘收集來、被陽光曬白的塑膠瓶蓋綁在一起，創造出浪花在拍岸瞬間凝結的視覺效果。", "opts": {"A": "However,", "B": "Indeed,", "C": "Second,", "D": "Likewise,"}, "optsZh": {"A": "然而，", "B": "確實，", "C": "第二，", "D": "同樣地，"}, "answer": "D", "expl": "Caio's unconventional-material approach parallels his aunt's, calling for \"Likewise.\"", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Transitions: choose the logical connector showing similarity between two people's approaches.", "vocab": false, "body": "In the early 1990s, printmaker Selim Aksoy began carving his blocks from discarded wooden pallets instead of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> woodblock panels, an unusual choice at the time. Selim&#x27;s daughter Elif has chosen an equally unusual material for her new project, Fault Line. In this compelling series, the artist etches her images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=directly\" target=\"_blank\" rel=\"noopener\" data-w=\"directly\" data-pos=\"adv.\" data-en=\"without anything or anyone in between\" data-zh=\"直接地\">directly<\/a> into salvaged roof tiles, creating the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visual\" target=\"_blank\" rel=\"noopener\" data-w=\"visual\" data-pos=\"n.\" data-en=\"an image or picture used to show or explain something\" data-zh=\"視覺效果；影像\">visual<\/a> effect of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscape<\/a> cracking open.", "bodyPlain": "In the early 1990s, printmaker Selim Aksoy began carving his blocks from discarded wooden pallets instead of traditional woodblock panels, an unusual choice at the time. Selim's daughter Elif has chosen an equally unusual material for her new project, Fault Line. In this compelling series, the artist etches her images directly into salvaged roof tiles, creating the visual effect of a landscape cracking open.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "1990 年代初，版畫家 Selim Aksoy 開始用廢棄木棧板雕刻版塊，而不用傳統木刻板，這在當時是很不尋常的選擇。Selim 的女兒 Elif 為她的新計畫《Fault Line》選擇了同樣不尋常的材料。在這個引人入勝的系列中，藝術家把圖像直接刻在回收的屋瓦上，創造出大地裂開的視覺效果。", "opts": {"A": "However,", "B": "Indeed,", "C": "Second,", "D": "Likewise,"}, "optsZh": {"A": "然而，", "B": "確實，", "C": "第二，", "D": "同樣地，"}, "answer": "D", "expl": "Elif's unconventional-material approach parallels her father's, calling for \"Likewise.\"", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Transitions: choose the logical connector showing similarity between two people's approaches.", "vocab": false, "body": "In the early 2000s, muralist Chidi Obi began <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">painting<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=directly\" target=\"_blank\" rel=\"noopener\" data-w=\"directly\" data-pos=\"adv.\" data-en=\"without anything or anyone in between\" data-zh=\"直接地\">directly<\/a> onto crumbling concrete overpasses, an unusual canvas for public art at the time. Chidi&#x27;s protege Amara has chosen an equally unusual surface for her new project, Drift. In this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=striking\" target=\"_blank\" rel=\"noopener\" data-w=\"striking\" data-pos=\"adj.\" data-en=\"very noticeable or impressive\" data-zh=\"引人注目的；醒目的\">striking<\/a> work, the artist paints <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portrait\" target=\"_blank\" rel=\"noopener\" data-w=\"portrait\" data-pos=\"n.\" data-en=\"a painting, drawing, or photograph of a person\" data-zh=\"肖像；畫像\">portraits<\/a> onto abandoned shipping pallets left to weather outdoors, creating the visual effect of faces slowly dissolving into the grain of the wood.", "bodyPlain": "In the early 2000s, muralist Chidi Obi began painting directly onto crumbling concrete overpasses, an unusual canvas for public art at the time. Chidi's protege Amara has chosen an equally unusual surface for her new project, Drift. In this striking work, the artist paints portraits onto abandoned shipping pallets left to weather outdoors, creating the visual effect of faces slowly dissolving into the grain of the wood.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "2000 年代初，壁畫家 Chidi Obi 開始直接在崩壞的混凝土高架橋上作畫，這在當時是很不尋常的公共藝術畫布。Chidi 的門生 Amara 為她的新計畫《Drift》選擇了同樣不尋常的表面。在這件引人注目的作品中，藝術家把人像畫在被棄置戶外任其風化的貨運棧板上，創造出臉孔慢慢融入木紋的視覺效果。", "opts": {"A": "However,", "B": "Indeed,", "C": "Second,", "D": "Likewise,"}, "optsZh": {"A": "然而，", "B": "確實，", "C": "第二，", "D": "同樣地，"}, "answer": "D", "expl": "Amara's unconventional-surface approach parallels her mentor's, calling for \"Likewise.\"", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Transitions: choose the logical connector introducing a specific example of a general claim.", "vocab": false, "body": "Mary Ellen Pleasant, a successful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entrepreneur\" target=\"_blank\" rel=\"noopener\" data-w=\"entrepreneur\" data-pos=\"n.\" data-en=\"a person who starts a business\" data-zh=\"企業家；創業者\">entrepreneur<\/a> during the gold rush era, earned the moniker &quot;Mother of Human Rights in California&quot; after successfully challenging discrimination in the state. ______ in 1866, she sued a streetcar <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a> for denying her and other Black riders service, a suit she eventually won when the California Supreme Court declared it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illegal\" target=\"_blank\" rel=\"noopener\" data-w=\"illegal\" data-pos=\"adj.\" data-en=\"not allowed by law\" data-zh=\"違法的\">illegal<\/a> for carriers to exclude <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=passenger\" target=\"_blank\" rel=\"noopener\" data-w=\"passenger\" data-pos=\"n.\" data-en=\"a person traveling in a vehicle, ship, or plane who is not driving it\" data-zh=\"乘客\">passengers<\/a> based on race.", "bodyPlain": "Mary Ellen Pleasant, a successful entrepreneur during the gold rush era, earned the moniker \"Mother of Human Rights in California\" after successfully challenging discrimination in the state. ______ in 1866, she sued a streetcar company for denying her and other Black riders service, a suit she eventually won when the California Supreme Court declared it illegal for carriers to exclude passengers based on race.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "Mary Ellen Pleasant 是淘金熱時期一位成功的企業家，她在成功挑戰該州的歧視後，贏得了「加州人權之母」的稱號。______ 1866 年，她控告一家街車公司拒絕載送她和其他黑人乘客，並在加州最高法院宣布運輸業者依種族拒載乘客屬違法後，最終贏得這場訴訟。", "opts": {"A": "For this reason,", "B": "Then,", "C": "In addition,", "D": "Specifically,"}, "optsZh": {"A": "因為這個原因，", "B": "接著，", "C": "此外，", "D": "具體來說，"}, "answer": "D", "expl": "The lawsuit in 1866 is a specific instance of her challenging discrimination, so 'Specifically' fits.", "explZh": "1866 年的訴訟是她挑戰歧視的具體例子，因此用「Specifically」。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Transitions: choose the logical connector introducing a specific example of a general claim.", "vocab": false, "body": "Community organizer Beatrice Adeyemi earned the nickname &quot;the Landlord&#x27;s Headache&quot; after successfully challenging unsafe <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=housing\" target=\"_blank\" rel=\"noopener\" data-w=\"housing\" data-pos=\"n.\" data-en=\"houses and apartments for people to live in\" data-zh=\"住宅；房屋\">housing<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> in her city. ______ in 1978, she led a rent strike against a property management company that had ignored tenant complaints for years, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaign<\/a> she eventually won when the city council passed new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspection\" target=\"_blank\" rel=\"noopener\" data-w=\"inspection\" data-pos=\"n.\" data-en=\"a careful look at something\" data-zh=\"檢查；細看\">inspection<\/a> requirements for rental units.", "bodyPlain": "Community organizer Beatrice Adeyemi earned the nickname \"the Landlord's Headache\" after successfully challenging unsafe housing conditions in her city. ______ in 1978, she led a rent strike against a property management company that had ignored tenant complaints for years, a campaign she eventually won when the city council passed new inspection requirements for rental units.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "社區組織者 Beatrice Adeyemi 在成功挑戰她所在城市的危險住宅條件後，得到了「房東的頭痛人物」的綽號。______ 1978 年，她帶領租戶對一家多年來無視房客投訴的物業管理公司發起拒繳房租行動，並在市議會通過出租房屋新檢查規定後，最終贏得這場抗爭。", "opts": {"A": "For this reason,", "B": "Then,", "C": "In addition,", "D": "Specifically,"}, "optsZh": {"A": "因為這個原因，", "B": "接著，", "C": "此外，", "D": "具體來說，"}, "answer": "D", "expl": "The 1978 rent strike is a specific instance of the general claim about challenging housing conditions, calling for \"Specifically.\"", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Transitions: choose the logical connector introducing a specific example of a general claim.", "vocab": false, "body": "Labor organizer Franco Bellandi earned the moniker &quot;the Dockworkers&#x27; Voice&quot; after successfully challenging unsafe <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> at the city&#x27;s ports. ______ in 1954, he organized a walkout over faulty loading equipment that had injured several workers, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaign<\/a> he eventually won when the port <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> agreed to mandatory equipment <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspection\" target=\"_blank\" rel=\"noopener\" data-w=\"inspection\" data-pos=\"n.\" data-en=\"a careful look at something\" data-zh=\"檢查；細看\">inspections<\/a>.", "bodyPlain": "Labor organizer Franco Bellandi earned the moniker \"the Dockworkers' Voice\" after successfully challenging unsafe conditions at the city's ports. ______ in 1954, he organized a walkout over faulty loading equipment that had injured several workers, a campaign he eventually won when the port authority agreed to mandatory equipment inspections.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "勞工組織者 Franco Bellandi 在成功挑戰該市港口的危險工作條件後，贏得了「碼頭工人之聲」的稱號。______ 1954 年，他因有缺陷、已造成數名工人受傷的裝卸設備而組織罷工，並在港務局同意強制檢查設備後，最終贏得這場抗爭。", "opts": {"A": "For this reason,", "B": "Then,", "C": "In addition,", "D": "Specifically,"}, "optsZh": {"A": "因為這個原因，", "B": "接著，", "C": "此外，", "D": "具體來說，"}, "answer": "D", "expl": "The 1954 walkout is a specific instance of the general claim about challenging port conditions, calling for \"Specifically.\"", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Transitions: choose the logical connector introducing a specific example of a general claim.", "vocab": false, "body": "Civil <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=engineer\" target=\"_blank\" rel=\"noopener\">engineer<\/a> Marisol Vega earned recognition as &quot;the City&#x27;s Watchdog&quot; after successfully challenging a series of unsafe bridge repairs. ______ in 1996, she petitioned against a contractor&#x27;s use of substandard steel on a downtown overpass, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaign<\/a> she eventually won when the state <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a> board revoked the contractor&#x27;s license.", "bodyPlain": "Civil engineer Marisol Vega earned recognition as \"the City's Watchdog\" after successfully challenging a series of unsafe bridge repairs. ______ in 1996, she petitioned against a contractor's use of substandard steel on a downtown overpass, a campaign she eventually won when the state transportation board revoked the contractor's license.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "土木工程師 Marisol Vega 在成功挑戰一連串不安全的橋梁修繕後，被稱為「城市的看門狗」。______ 1996 年，她連署反對一家承包商在市中心高架橋上使用不合格鋼材，並在州交通委員會吊銷該承包商執照後，最終贏得這場抗爭。", "opts": {"A": "For this reason,", "B": "Then,", "C": "In addition,", "D": "Specifically,"}, "optsZh": {"A": "因為這個原因，", "B": "接著，", "C": "此外，", "D": "具體來說，"}, "answer": "D", "expl": "The 1996 petition is a specific instance of the general claim about challenging unsafe repairs, calling for \"Specifically.\"", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Transitions: choose the logical connector introducing a specific example of a general claim.", "vocab": false, "body": "Environmental lawyer Desmond Okafor earned the title &quot;the River&#x27;s Advocate&quot; after successfully challenging industrial pollution along a major waterway. ______ in 1988, he sued a manufacturing plant for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illegal\" target=\"_blank\" rel=\"noopener\" data-w=\"illegal\" data-pos=\"adj.\" data-en=\"not allowed by law\" data-zh=\"違法的\">illegally<\/a> discharging <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> waste into the river, a case he eventually won when a federal court ordered the plant to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=install\" target=\"_blank\" rel=\"noopener\" data-w=\"install\" data-pos=\"v.\" data-en=\"to put equipment in place so it can be used\" data-zh=\"安裝\">install<\/a> new filtration systems.", "bodyPlain": "Environmental lawyer Desmond Okafor earned the title \"the River's Advocate\" after successfully challenging industrial pollution along a major waterway. ______ in 1988, he sued a manufacturing plant for illegally discharging chemical waste into the river, a case he eventually won when a federal court ordered the plant to install new filtration systems.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "環境律師 Desmond Okafor 在成功挑戰一條主要河道沿岸的工業污染後，獲得了「河川守護者」的稱號。______ 1988 年，他控告一家製造工廠非法將化學廢料排入河中，並在聯邦法院下令該廠安裝新的過濾系統後，最終贏得這場官司。", "opts": {"A": "For this reason,", "B": "Then,", "C": "In addition,", "D": "Specifically,"}, "optsZh": {"A": "因為這個原因，", "B": "接著，", "C": "此外，", "D": "具體來說，"}, "answer": "D", "expl": "The 1988 lawsuit is a specific instance of the general claim about challenging pollution, calling for \"Specifically.\"", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Transitions: choose the logical connector introducing a specific example of a general claim.", "vocab": false, "body": "Nurse and public health <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocate<\/a> Ingrid Kowalski earned the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nickname\" target=\"_blank\" rel=\"noopener\">nickname<\/a> &quot;the Clinic&#x27;s Champion&quot; after successfully challenging a hospital&#x27;s discriminatory admissions practices. ______ in 1965, she filed a formal complaint over patients being turned away based on their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> of residence, a case she eventually won when the hospital board adopted a new admissions policy.", "bodyPlain": "Nurse and public health advocate Ingrid Kowalski earned the nickname \"the Clinic's Champion\" after successfully challenging a hospital's discriminatory admissions practices. ______ in 1965, she filed a formal complaint over patients being turned away based on their neighborhood of residence, a case she eventually won when the hospital board adopted a new admissions policy.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "護理師兼公共衛生倡議者 Ingrid Kowalski 在成功挑戰一家醫院的歧視性入院做法後，得到了「診所的捍衛者」的綽號。______ 1965 年，她就病患因居住社區而被拒收一事提出正式申訴，並在醫院董事會採行新的入院政策後，最終贏得這起案件。", "opts": {"A": "For this reason,", "B": "Then,", "C": "In addition,", "D": "Specifically,"}, "optsZh": {"A": "因為這個原因，", "B": "接著，", "C": "此外，", "D": "具體來說，"}, "answer": "D", "expl": "The 1965 complaint is a specific instance of the general claim about challenging admissions practices, calling for \"Specifically.\"", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Transitions: choose the logical connector introducing an additional, related point.", "vocab": false, "body": "The Inca of South America used <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricately\" target=\"_blank\" rel=\"noopener\" data-w=\"intricately\" data-pos=\"adv.\" data-en=\"in a very detailed and complicated way\" data-zh=\"錯綜複雜地；精細地\">intricately<\/a> knotted string <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=device\" target=\"_blank\" rel=\"noopener\" data-w=\"device\" data-pos=\"n.\" data-en=\"a tool or object made for a particular purpose\" data-zh=\"裝置；器具\">devices<\/a> called quipus to record <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=countable\" target=\"_blank\" rel=\"noopener\" data-w=\"countable\" data-pos=\"adj.\" data-en=\"able to be counted\" data-zh=\"可計數的\">countable<\/a> information, like <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> data and payments. ______ they may have used quipus to record more complex information, like stories and myths, according to researchers.", "bodyPlain": "The Inca of South America used intricately knotted string devices called quipus to record countable information, like population data and payments. ______ they may have used quipus to record more complex information, like stories and myths, according to researchers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "南美洲的印加人使用一種稱為奇普（quipu）的精細打結繩子裝置，來記錄可計數的資訊，例如人口資料和付款。______ 研究人員表示，他們可能也用奇普來記錄更複雜的資訊，例如故事和神話。", "opts": {"A": "As a result,", "B": "In other words,", "C": "In addition,", "D": "For example,"}, "optsZh": {"A": "因此，", "B": "換句話說，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "Recording stories is a further use of quipus beyond counting data, so 'In addition' adds information.", "explZh": "記錄故事是奇普除了記錄數據之外的另一種用途，用「In addition」補充資訊。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Transitions: choose the logical connector introducing an additional, related point.", "vocab": false, "body": "Andean herders have long used woven belts called chumpis to indicate social status and regional identity through their patterns. ______ some researchers believe the belts&#x27; knotted fringes may have once served as a portable counting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=device\" target=\"_blank\" rel=\"noopener\" data-w=\"device\" data-pos=\"n.\" data-en=\"a tool or object made for a particular purpose\" data-zh=\"裝置；器具\">device<\/a> for tracking <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=livestock\" target=\"_blank\" rel=\"noopener\" data-w=\"livestock\" data-pos=\"n.\" data-en=\"farm animals such as cows and sheep\" data-zh=\"家畜；牲畜\">livestock<\/a>, according to textile <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a>.", "bodyPlain": "Andean herders have long used woven belts called chumpis to indicate social status and regional identity through their patterns. ______ some researchers believe the belts' knotted fringes may have once served as a portable counting device for tracking livestock, according to textile historians.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "安地斯山區的牧民長期使用一種稱為 chumpi 的編織腰帶，以其圖案來表示社會地位與地區身分。______ 紡織史學家表示，一些研究人員認為，這些腰帶打結的流蘇過去可能曾作為追蹤牲畜數量的隨身計數工具。", "opts": {"A": "As a result,", "B": "In other words,", "C": "In addition,", "D": "For example,"}, "optsZh": {"A": "因此，", "B": "換句話說，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "The counting-device use adds a further, related possible function, calling for \"In addition.\"", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Transitions: choose the logical connector introducing an additional, related point.", "vocab": false, "body": "Medieval European monks used illuminated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> primarily to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserve<\/a> religious texts for future <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generation\" target=\"_blank\" rel=\"noopener\" data-w=\"generation\" data-pos=\"n.\" data-en=\"the production of something, such as electricity\" data-zh=\"產生；發電\">generations<\/a>. ______ some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> believe the elaborate marginal illustrations may have served as memory aids for scribes reciting long passages aloud, according to recent manuscript studies.", "bodyPlain": "Medieval European monks used illuminated manuscripts primarily to preserve religious texts for future generations. ______ some scholars believe the elaborate marginal illustrations may have served as memory aids for scribes reciting long passages aloud, according to recent manuscript studies.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "中世紀歐洲的修士使用彩飾手抄本，主要是為了替後代保存宗教文本。______ 根據近期的手抄本研究，一些學者認為那些精緻的頁邊插圖，可能曾作為抄寫員大聲背誦長段落時的記憶輔助。", "opts": {"A": "As a result,", "B": "In other words,", "C": "In addition,", "D": "For example,"}, "optsZh": {"A": "因此，", "B": "換句話說，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "The memory-aid use adds a further, related possible function, calling for \"In addition.\"", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Transitions: choose the logical connector introducing an additional, related point.", "vocab": false, "body": "Polynesian navigators used woven stick charts primarily to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=represent\" target=\"_blank\" rel=\"noopener\" data-w=\"represent\" data-pos=\"v.\" data-en=\"to show or stand for something\" data-zh=\"代表；呈現\">represent<\/a> known ocean swell patterns near their home islands. ______ some researchers believe the charts may have also <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=function\" target=\"_blank\" rel=\"noopener\" data-w=\"function\" data-pos=\"n.\" data-en=\"the purpose or role of something\" data-zh=\"功能；作用\">functioned<\/a> as teaching tools passed between <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generation\" target=\"_blank\" rel=\"noopener\" data-w=\"generation\" data-pos=\"n.\" data-en=\"the production of something, such as electricity\" data-zh=\"產生；發電\">generations<\/a> of apprentice navigators, according to maritime <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a>.", "bodyPlain": "Polynesian navigators used woven stick charts primarily to represent known ocean swell patterns near their home islands. ______ some researchers believe the charts may have also functioned as teaching tools passed between generations of apprentice navigators, according to maritime historians.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "玻里尼西亞的航海家使用編織的枝條海圖，主要是為了呈現家鄉島嶼附近已知的海浪湧動模式。______ 海事史學家表示，一些研究人員認為這些海圖也可能是在一代代學徒航海家之間傳承的教學工具。", "opts": {"A": "As a result,", "B": "In other words,", "C": "In addition,", "D": "For example,"}, "optsZh": {"A": "因此，", "B": "換句話說，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "The teaching-tool use adds a further, related possible function, calling for \"In addition.\"", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Transitions: choose the logical connector introducing an additional, related point.", "vocab": false, "body": "Ancient Mesopotamian scribes used clay tokens primarily to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=record\" target=\"_blank\" rel=\"noopener\" data-w=\"record\" data-pos=\"v.\" data-en=\"to write down or store information\" data-zh=\"記錄\">record<\/a> simple counts of grain and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=livestock\" target=\"_blank\" rel=\"noopener\" data-w=\"livestock\" data-pos=\"n.\" data-en=\"farm animals such as cows and sheep\" data-zh=\"家畜；牲畜\">livestock<\/a> in early accounting systems. ______ some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> believe the tokens may have also been used in early forms of contractual agreement between <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trader\" target=\"_blank\" rel=\"noopener\" data-w=\"trader\" data-pos=\"n.\" data-en=\"a person who buys and sells goods\" data-zh=\"商人；貿易商\">traders<\/a>, according to recent excavation reports.", "bodyPlain": "Ancient Mesopotamian scribes used clay tokens primarily to record simple counts of grain and livestock in early accounting systems. ______ some archaeologists believe the tokens may have also been used in early forms of contractual agreement between traders, according to recent excavation reports.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "古美索不達米亞的書記官使用黏土代幣，主要是在早期會計系統中記錄穀物與牲畜的簡單數量。______ 根據近期的發掘報告，一些考古學家認為這些代幣也可能用於商人之間早期形式的契約協議。", "opts": {"A": "As a result,", "B": "In other words,", "C": "In addition,", "D": "For example,"}, "optsZh": {"A": "因此，", "B": "換句話說，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "The contractual use adds a further, related possible function, calling for \"In addition.\"", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Transitions: choose the logical connector introducing an additional, related point.", "vocab": false, "body": "West African griots used call-and-response songs primarily to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserve<\/a> genealogies and community <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=history\" target=\"_blank\" rel=\"noopener\" data-w=\"history\" data-pos=\"n.\" data-en=\"the past events connected with something\" data-zh=\"歷史；來歷\">histories<\/a> across <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generation\" target=\"_blank\" rel=\"noopener\" data-w=\"generation\" data-pos=\"n.\" data-en=\"the production of something, such as electricity\" data-zh=\"產生；發電\">generations<\/a>. ______ some ethnomusicologists believe certain song <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a> may have also encoded practical information, such as planting schedules, according to recent fieldwork.", "bodyPlain": "West African griots used call-and-response songs primarily to preserve genealogies and community histories across generations. ______ some ethnomusicologists believe certain song structures may have also encoded practical information, such as planting schedules, according to recent fieldwork.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "西非的說唱藝人（griot）使用一唱一和的歌曲，主要是為了跨世代保存家族譜系與社群歷史。______ 根據近期的田野調查，一些民族音樂學家認為某些歌曲結構可能也編入了實用資訊，例如播種時程。", "opts": {"A": "As a result,", "B": "In other words,", "C": "In addition,", "D": "For example,"}, "optsZh": {"A": "因此，", "B": "換句話說，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "The practical-information use adds a further, related possible function, calling for \"In addition.\"", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a person's achievement.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In the 1930s, the Imperial Sugar Cane Institute in India sought to limit the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">country<\/a>&#x27;s dependence on imported sugarcane.<br>- The institute enlisted <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanist\" target=\"_blank\" rel=\"noopener\" data-w=\"botanist\" data-pos=\"n.\" data-en=\"a scientist who studies plants\" data-zh=\"植物學家\">botanist<\/a> Janaki Ammal to breed a local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=variety\" target=\"_blank\" rel=\"noopener\" data-w=\"variety\" data-pos=\"n.\" data-en=\"a type of plant within a species\" data-zh=\"品種；種類\">variety<\/a> of sugarcane.<br>- She crossbred the imported sugarcane <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> Saccharum officinarum with grasses native to India.<br>- She succeeded in creating sugarcane hybrids well suited to India&#x27;s climate.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the 1930s, the Imperial Sugar Cane Institute in India sought to limit the country's dependence on imported sugarcane.\n- The institute enlisted botanist Janaki Ammal to breed a local variety of sugarcane.\n- She crossbred the imported sugarcane species Saccharum officinarum with grasses native to India.\n- She succeeded in creating sugarcane hybrids well suited to India's climate.", "stem": "The student wants to emphasize Janaki Ammal's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Janaki Ammal 的成就。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 1930 年代，印度帝國甘蔗研究所試圖減少該國對進口甘蔗的依賴。\n- 該研究所延攬植物學家 Janaki Ammal 培育本土甘蔗品種。\n- 她將進口甘蔗品種 Saccharum officinarum 與印度原生的禾草雜交。\n- 她成功培育出適合印度氣候的甘蔗雜交種。", "opts": {"A": "By crossbreeding the imported sugarcane species Saccharum officinarum with grasses native to India, Ammal succeeded in creating sugarcane hybrids well suited to India's climate.", "B": "In the 1930s, the Imperial Sugar Cane Institute, which enlisted Ammal, sought to limit dependence on imported sugarcane.", "C": "Ammal was enlisted by the Imperial Sugar Cane Institute at a time when a local variety of sugarcane needed to be produced.", "D": "As part of efforts to breed a local variety of sugarcane, an imported sugarcane species called Saccharum officinarum was crossbred with grasses native to India."}, "optsZh": {"A": "Ammal 將進口甘蔗品種 Saccharum officinarum 與印度原生禾草雜交，成功培育出適合印度氣候的甘蔗雜交種。", "B": "1930 年代，延攬 Ammal 的印度帝國甘蔗研究所試圖減少對進口甘蔗的依賴。", "C": "Ammal 是在需要培育本土甘蔗品種的時候，被印度帝國甘蔗研究所延攬的。", "D": "作為培育本土甘蔗品種工作的一部分，一種名為 Saccharum officinarum 的進口甘蔗品種與印度原生禾草進行了雜交。"}, "answer": "A", "expl": "Choice A states what Ammal did and that she succeeded in creating sugarcane suited to India, emphasizing her achievement.", "explZh": "A 說明 Ammal 的作法並指出她成功培育出適合印度氣候的甘蔗，最能強調她的成就。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a person's achievement.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In the 1950s, the National Weaving Cooperative in Guatemala sought to reduce reliance on imported <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthetic\" target=\"_blank\" rel=\"noopener\" data-w=\"synthetic\" data-pos=\"adj.\" data-en=\"made artificially, not natural\" data-zh=\"合成的；人造的\">synthetic<\/a> dyes.<br>- The cooperative enlisted chemist Elena Rios to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">develop<\/a> dyes from local plants.<br>- She <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experimented<\/a> with cochineal insects and indigo-bearing plants native to the region.<br>- She succeeded in creating a stable, colorfast dye palette suited to the cooperative&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> looms.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the 1950s, the National Weaving Cooperative in Guatemala sought to reduce reliance on imported synthetic dyes.\n- The cooperative enlisted chemist Elena Rios to develop dyes from local plants.\n- She experimented with cochineal insects and indigo-bearing plants native to the region.\n- She succeeded in creating a stable, colorfast dye palette suited to the cooperative's traditional looms.", "stem": "The student wants to emphasize Elena Rios's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Elena Rios 的成就。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 1950 年代，瓜地馬拉國家紡織合作社試圖減少對進口合成染料的依賴。\n- 該合作社延攬化學家 Elena Rios 用當地植物開發染料。\n- 她用當地原生的胭脂蟲和含靛藍的植物進行實驗。\n- 她成功開發出一套適合合作社傳統織布機、穩定且不易褪色的染料色系。", "opts": {"A": "By experimenting with cochineal insects and indigo-bearing plants native to the region, Rios succeeded in creating a stable, colorfast dye palette suited to the cooperative's traditional looms.", "B": "In the 1950s, the National Weaving Cooperative, which enlisted Rios, sought to reduce reliance on imported synthetic dyes.", "C": "Rios was enlisted by the National Weaving Cooperative at a time when a local dye source was needed.", "D": "As part of efforts to develop local dyes, cochineal insects and indigo-bearing plants native to the region were used."}, "optsZh": {"A": "Rios 用當地原生的胭脂蟲與含靛藍植物進行實驗，成功開發出一套適合合作社傳統織布機、穩定且不易褪色的染料色系。", "B": "1950 年代，延攬 Rios 的國家紡織合作社試圖減少對進口合成染料的依賴。", "C": "Rios 是在需要本土染料來源的時候，被國家紡織合作社延攬的。", "D": "作為開發本土染料計畫的一部分，使用了當地原生的胭脂蟲與含靛藍的植物。"}, "answer": "A", "expl": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a person's achievement.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- In the 1960s, the Regional Beekeepers Association in Slovenia sought to reduce colony losses during harsh winters.<br>- The association enlisted entomologist Janez Kovac to breed a hardier bee <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strain\" target=\"_blank\" rel=\"noopener\" data-w=\"strain\" data-pos=\"n.\" data-en=\"force that stretches or pressures a material\" data-zh=\"應變；拉力\">strain<\/a>.<br>- He crossbred the local Carniolan honeybee with cold-tolerant strains from northern regions.<br>- He succeeded in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">producing<\/a> a bee strain with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a> improved winter survival rates.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the 1960s, the Regional Beekeepers Association in Slovenia sought to reduce colony losses during harsh winters.\n- The association enlisted entomologist Janez Kovac to breed a hardier bee strain.\n- He crossbred the local Carniolan honeybee with cold-tolerant strains from northern regions.\n- He succeeded in producing a bee strain with significantly improved winter survival rates.", "stem": "The student wants to emphasize Janez Kovac's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Janez Kovac 的成就。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 1960 年代，斯洛維尼亞地區養蜂協會試圖減少嚴冬期間的蜂群損失。\n- 該協會延攬昆蟲學家 Janez Kovac 培育更耐寒的蜜蜂品系。\n- 他將當地的卡尼鄂拉蜂與來自北方地區的耐寒品系雜交。\n- 他成功培育出冬季存活率大幅提高的蜜蜂品系。", "opts": {"A": "By crossbreeding the local Carniolan honeybee with cold-tolerant strains from northern regions, Kovac succeeded in producing a bee strain with significantly improved winter survival rates.", "B": "In the 1960s, the Regional Beekeepers Association, which enlisted Kovac, sought to reduce colony losses during harsh winters.", "C": "Kovac was enlisted by the Regional Beekeepers Association at a time when a hardier bee strain was needed.", "D": "As part of efforts to breed a hardier bee, the local Carniolan honeybee was crossbred with cold-tolerant strains from northern regions."}, "optsZh": {"A": "Kovac 將當地的卡尼鄂拉蜂與來自北方地區的耐寒品系雜交，成功培育出冬季存活率大幅提高的蜜蜂品系。", "B": "1960 年代，延攬 Kovac 的地區養蜂協會試圖減少嚴冬期間的蜂群損失。", "C": "Kovac 是在需要更耐寒蜜蜂品系的時候，被地區養蜂協會延攬的。", "D": "作為培育更耐寒蜜蜂工作的一部分，當地的卡尼鄂拉蜂與來自北方地區的耐寒品系進行了雜交。"}, "answer": "A", "expl": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a person's achievement.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In the 1940s, the Coastal Fisheries Board in Portugal sought to reduce dependence on a single, overfished sardine stock.<br>- The board enlisted marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Ines Cardoso to identify sustainable alternative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>.<br>- She surveyed local waters and identified two underused fish species with stable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a>.<br>- She succeeded in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establish\" target=\"_blank\" rel=\"noopener\" data-w=\"establish\" data-pos=\"v.\" data-en=\"to create or set up something\" data-zh=\"建立\">establishing<\/a> new fishing guidelines that shifted pressure away from the sardine stock.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the 1940s, the Coastal Fisheries Board in Portugal sought to reduce dependence on a single, overfished sardine stock.\n- The board enlisted marine biologist Ines Cardoso to identify sustainable alternative species.\n- She surveyed local waters and identified two underused fish species with stable populations.\n- She succeeded in establishing new fishing guidelines that shifted pressure away from the sardine stock.", "stem": "The student wants to emphasize Ines Cardoso's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Ines Cardoso 的成就。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 1940 年代，葡萄牙沿海漁業委員會試圖減少對單一、已被過度捕撈的沙丁魚魚群的依賴。\n- 該委員會延攬海洋生物學家 Ines Cardoso 找出可永續利用的替代物種。\n- 她調查當地海域，找出兩種族群穩定但較少被利用的魚種。\n- 她成功制定新的捕撈準則，將壓力從沙丁魚魚群上轉移開來。", "opts": {"A": "By surveying local waters and identifying two underused fish species with stable populations, Cardoso succeeded in establishing new fishing guidelines that shifted pressure away from the sardine stock.", "B": "In the 1940s, the Coastal Fisheries Board, which enlisted Cardoso, sought to reduce dependence on a single, overfished sardine stock.", "C": "Cardoso was enlisted by the Coastal Fisheries Board at a time when alternative fish species needed to be identified.", "D": "As part of efforts to reduce overfishing, two underused fish species with stable populations were identified in local waters."}, "optsZh": {"A": "Cardoso 調查當地海域並找出兩種族群穩定但較少被利用的魚種，成功制定了將壓力從沙丁魚魚群轉移開來的新捕撈準則。", "B": "1940 年代，延攬 Cardoso 的沿海漁業委員會試圖減少對單一、已被過度捕撈的沙丁魚魚群的依賴。", "C": "Cardoso 是在需要找出替代魚種的時候，被沿海漁業委員會延攬的。", "D": "作為減少過度捕撈工作的一部分，在當地海域找出了兩種族群穩定但較少被利用的魚種。"}, "answer": "A", "expl": "Choice A leads with the achievement itself as the main clause, matching the goal of emphasizing it.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a person's achievement.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In the 1930s, the Municipal Water <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">Authority<\/a> in a Brazilian city sought to reduce losses from an aging pipe network.<br>- The authority enlisted engineer Paulo Andrade to design a low-cost leak-detection method.<br>- He <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> acoustic listening <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=device\" target=\"_blank\" rel=\"noopener\" data-w=\"device\" data-pos=\"n.\" data-en=\"a tool or object made for a particular purpose\" data-zh=\"裝置；器具\">devices<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=origin\" target=\"_blank\" rel=\"noopener\" data-w=\"origin\" data-pos=\"n.\" data-en=\"the beginning or source of something\" data-zh=\"起源\">originally<\/a> built for other industrial uses.<br>- He succeeded in cutting the city&#x27;s water losses by nearly a third within two years.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the 1930s, the Municipal Water Authority in a Brazilian city sought to reduce losses from an aging pipe network.\n- The authority enlisted engineer Paulo Andrade to design a low-cost leak-detection method.\n- He adapted acoustic listening devices originally built for other industrial uses.\n- He succeeded in cutting the city's water losses by nearly a third within two years.", "stem": "The student wants to emphasize Paulo Andrade's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 Paulo Andrade 的成就。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 1930 年代，巴西某城市的市立自來水局試圖減少老舊管線網造成的漏水損失。\n- 該局延攬工程師 Paulo Andrade 設計一種低成本的漏水偵測方法。\n- 他改造了原本為其他工業用途打造的聲學聽音裝置。\n- 他成功在兩年內將該市的漏水損失減少將近三分之一。", "opts": {"A": "By adapting acoustic listening devices originally built for other industrial uses, Andrade succeeded in cutting the city's water losses by nearly a third within two years.", "B": "In the 1930s, the Municipal Water Authority, which enlisted Andrade, sought to reduce losses from an aging pipe network.", "C": "Andrade was enlisted by the Municipal Water Authority at a time when a leak-detection method was needed.", "D": "As part of efforts to reduce water loss, acoustic listening devices originally built for other industrial uses were adapted."}, "optsZh": {"A":
