d rhythm) shaping a word's effect, paralleling Bakhtin's argument.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Central Ideas and Details: identify the main idea when a theorist argues existing concepts fail to fully capture a phenomenon.", "vocab": false, "body": "Many architects <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between form, a building&#x27;s physical shape, and function, the practical purposes the building serves. In a given train station, the form is its arched glass roof, and the function is its role in moving passengers efficiently. But architectural critic Soren Vik maintained that form and function are insufficient to completely describe a building&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a>—he held that standard categorizations of design discount the subtle way in which a building&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> to its surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> shapes how residents come to feel about it.", "bodyPlain": "Many architects distinguish between form, a building's physical shape, and function, the practical purposes the building serves. In a given train station, the form is its arched glass roof, and the function is its role in moving passengers efficiently. But architectural critic Soren Vik maintained that form and function are insufficient to completely describe a building's significance—he held that standard categorizations of design discount the subtle way in which a building's relationship to its surrounding neighborhood shapes how residents come to feel about it.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "許多建築師會區分形式（建築的實體形狀）與功能（建築所提供的實際用途）。在一座火車站中，形式是它的拱形玻璃屋頂，而功能是它有效率地運送旅客的角色。但建築評論家 Soren Vik 主張，形式與功能不足以完整描述一棟建築的意義——他認為對設計的標準分類，忽略了建築與周遭社區的關係如何微妙地影響居民對它的感受。", "opts": {"A": "Architectural critic Soren Vik argued that there are important aspects of a building's significance that are not fully captured by two concepts other critics have used to analyze design.", "B": "Architectural critic Soren Vik claimed that form and function are ultimately identical concepts described using different vocabulary.", "C": "Train stations are unusually complex buildings, but form and function are sufficient tools for analyzing them.", "D": "A building's relationship to its neighborhood matters more than its form and function do."}, "optsZh": {"A": "建築評論家 Soren Vik 主張，建築的意義有一些重要面向，是其他評論家用來分析設計的兩個概念無法完全涵蓋的。", "B": "建築評論家 Soren Vik 宣稱，形式與功能最終是同一個概念，只是用不同的詞彙描述。", "C": "火車站是異常複雜的建築，但形式與功能足以作為分析它們的工具。", "D": "建築與社區的關係比它的形式與功能更重要。"}, "answer": "A", "expl": "Vik argues that standard architectural categories miss an additional factor (neighborhood relationship) shaping a building's significance, paralleling Bakhtin's argument.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Central Ideas and Details: identify the main idea when a theorist argues existing concepts fail to fully capture a phenomenon.", "vocab": false, "body": "Many anthropologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between kinship by blood, ties based on biological descent, and kinship by practice, ties formed through shared daily life and obligation. In a given community, kinship by blood might describe siblings, and kinship by practice might describe long-term neighbors who share caregiving duties. But anthropologist Idris Okonjo maintained that these two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=category\" target=\"_blank\" rel=\"noopener\" data-w=\"category\" data-pos=\"n.\" data-en=\"a group of things that share similar qualities\" data-zh=\"類別；範疇\">categories<\/a> are insufficient to completely describe how community <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bond\" target=\"_blank\" rel=\"noopener\" data-w=\"bond\" data-pos=\"n.\" data-en=\"a force that holds atoms together in a molecule or solid\" data-zh=\"化學鍵；鍵結\">bonds<\/a> actually form—he held that standard categorizations of kinship discount the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=subtle\" target=\"_blank\" rel=\"noopener\" data-w=\"subtle\" data-pos=\"adj.\" data-en=\"not obvious; small and hard to notice\" data-zh=\"細微的\">subtle<\/a> way in which shared hardship over time can create obligations as strong as either category alone.", "bodyPlain": "Many anthropologists distinguish between kinship by blood, ties based on biological descent, and kinship by practice, ties formed through shared daily life and obligation. In a given community, kinship by blood might describe siblings, and kinship by practice might describe long-term neighbors who share caregiving duties. But anthropologist Idris Okonjo maintained that these two categories are insufficient to completely describe how community bonds actually form—he held that standard categorizations of kinship discount the subtle way in which shared hardship over time can create obligations as strong as either category alone.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "許多人類學家會區分血緣親屬（基於生物血統的關係）與實踐親屬（透過共同日常生活與責任所形成的關係）。在一個社區中，血緣親屬可能指兄弟姊妹，而實踐親屬可能指共同分擔照顧責任的長期鄰居。但人類學家 Idris Okonjo 主張，這兩個類別不足以完整描述社群連結實際上如何形成——他認為對親屬關係的標準分類，忽略了長期共同經歷困苦如何微妙地創造出與任一類別同樣強烈的義務。", "opts": {"A": "Anthropologist Idris Okonjo argued that there are important aspects of community bonds that are not fully captured by two concepts other anthropologists have used to analyze kinship.", "B": "Anthropologist Idris Okonjo claimed that kinship by blood and kinship by practice describe exactly the same relationships in every community.", "C": "Community bonds are unusually difficult to study, but kinship by blood and kinship by practice are sufficient tools for understanding them.", "D": "Shared hardship matters more to a community than either kinship by blood or kinship by practice does."}, "optsZh": {"A": "人類學家 Idris Okonjo 主張，社群連結有一些重要面向，是其他人類學家用來分析親屬關係的兩個概念無法完全涵蓋的。", "B": "人類學家 Idris Okonjo 宣稱，血緣親屬與實踐親屬在每個社群中描述的都是完全相同的關係。", "C": "社群連結異常難以研究，但血緣親屬與實踐親屬足以作為理解它們的工具。", "D": "共同經歷的困苦對一個社群而言，比血緣親屬或實踐親屬都更重要。"}, "answer": "A", "expl": "Okonjo argues that standard kinship categories miss an additional factor (shared hardship) shaping community bonds, paralleling Bakhtin's argument.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Command of Evidence (Quotation): choose the quotation that most effectively illustrates a claim about mixed feelings.", "vocab": false, "body": "&quot;The Yellow Wallpaper&quot; is an 1892 short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> by Charlotte Perkins Gilman. In the story, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=express\" target=\"_blank\" rel=\"noopener\" data-w=\"express\" data-pos=\"v.\" data-en=\"to show a feeling or opinion in words or actions\" data-zh=\"表達\">expresses<\/a> mixed feelings about her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surroundings\" target=\"_blank\" rel=\"noopener\" data-w=\"surroundings\" data-pos=\"n.\" data-en=\"the place and conditions around a person\" data-zh=\"周遭環境\">surroundings<\/a>.", "bodyPlain": "\"The Yellow Wallpaper\" is an 1892 short story by Charlotte Perkins Gilman. In the story, the narrator expresses mixed feelings about her surroundings.", "stem": "Which quotation from \"The Yellow Wallpaper\" most effectively illustrates the claim?", "stemZh": "《黃色壁紙》中的哪一句引文最能有效說明這個主張？", "bodyZh": "《黃色壁紙》是 Charlotte Perkins Gilman 於 1892 年發表的短篇小說。在故事中，敘述者對周遭環境表達了矛盾的感受。", "opts": {"A": "\"This wallpaper has a kind of sub-pattern in a different shade, a particularly irritating one, for you can only see it in certain lights, and not clearly then.\"", "B": "\"By moonlight—the moon shines in all night when there is a moon—I wouldn't know it was the same paper.\"", "C": "\"I'm really getting quite fond of the big room, all but that horrid [wall]paper.\"", "D": "\"The color is repellant, almost revolting; a smouldering, unclean yellow, strangely faded by the slow-turning sunlight.\""}, "optsZh": {"A": "「這張壁紙有一種顏色不同的底紋，特別令人煩躁，因為只有在某些光線下才看得到，而且即使那時也看不清楚。」", "B": "「在月光下——有月亮的夜晚，月光會整夜照進來——我根本認不出那是同一張壁紙。」", "C": "「我真的越來越喜歡這個大房間了，除了那可怕的壁紙之外。」", "D": "「那顏色令人反感，幾乎令人作嘔；一種悶燒般、髒污的黃色，被緩緩移轉的陽光奇怪地曬褪了色。」"}, "answer": "C", "expl": "'Quite fond of the big room' is positive and 'all but that horrid paper' is negative, showing mixed feelings.", "explZh": "「很喜歡這個大房間」是正面感受，「除了那可怕的壁紙」是負面感受，正好呈現矛盾的心情。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Command of Evidence (Quotation): choose the quotation that most effectively illustrates a claim about mixed feelings.", "vocab": false, "body": "", "bodyPlain": "", "stem": "A student is writing an essay about a fictional sailor who expresses mixed feelings about the sea in his journal. Which quotation would most effectively illustrate the claim?", "stemZh": "一名學生正在寫一篇關於一位虛構水手的文章，他在日記中對大海表達矛盾的情感。哪一句引文最能有效說明這個主張？", "bodyZh": "", "opts": {"A": "\"The sea rose again that night, gray and enormous, indifferent to anything as small as a single boat.\"", "B": "\"I have come to love this endless water even as it terrifies me, the way one might love a storm from behind a window.\"", "C": "\"Salt crusted on every rope and rail, and by morning nothing aboard felt entirely dry.\"", "D": "\"The horizon gave no sign of land, only the same flat gray line it had shown for a week.\""}, "optsZh": {"A": "「那天晚上海浪再度翻湧，灰暗而巨大，對一艘小船這麼渺小的東西毫不在意。」", "B": "「我開始愛上這片無邊的海水，即使它讓我害怕，就像人可能隔著窗戶欣賞一場暴風雨。」", "C": "「每條繩索和欄杆上都結著鹽巴，到了早上，船上沒有一樣東西是完全乾的。」", "D": "「地平線上沒有任何陸地的跡象，只有同一條平坦的灰線，一整週都是如此。」"}, "answer": "B", "expl": "Only this quotation directly names two contradictory feelings—love and terror—toward the same subject.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Command of Evidence (Quotation): choose the quotation that most effectively illustrates a claim about mixed feelings.", "vocab": false, "body": "", "bodyPlain": "", "stem": "A student is writing an essay about a fictional retiree who expresses mixed feelings about leaving her career. Which quotation would most effectively illustrate the claim?", "stemZh": "一名學生正在寫一篇關於一位虛構退休人士的文章，她對離開職涯懷有矛盾的情感。哪一句引文最能有效說明這個主張？", "bodyZh": "", "opts": {"A": "\"The office had emptied by six most evenings, the hallway lights clicking off in sequence behind her.\"", "B": "\"She packed the last box slowly, aware that no one would notice exactly when she finally left.\"", "C": "\"I am relieved to be done with it, and yet some mornings I still reach for a badge that isn't there.\"", "D": "\"Her successor was younger, competent, already rearranging the furniture by the second week.\""}, "optsZh": {"A": "「大多數晚上六點辦公室就空了，走廊的燈在她身後一盞接一盞地熄滅。」", "B": "「她慢慢打包最後一個箱子，知道不會有人注意到她究竟何時離開。」", "C": "「我很慶幸終於結束了，但有些早晨我還是會伸手去拿一張已經不存在的識別證。」", "D": "「她的繼任者比較年輕、能幹，第二週就已經在重新擺放家具了。」"}, "answer": "C", "expl": "Only this quotation directly names two contradictory feelings—relief and longing—toward the same situation.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Command of Evidence (Quotation): choose the quotation that most effectively illustrates a claim about mixed feelings.", "vocab": false, "body": "", "bodyPlain": "", "stem": "A student is writing an essay about a fictional immigrant who expresses mixed feelings about his new city. Which quotation would most effectively illustrate the claim?", "stemZh": "一名學生正在寫一篇關於一位虛構移民的文章，他對新的城市懷有矛盾的情感。哪一句引文最能有效說明這個主張？", "bodyZh": "", "opts": {"A": "\"The subway ran late most nights, and the platform smelled faintly of rain even when it hadn't rained.\"", "B": "\"I find this city thrilling and lonely in the same breath, as if both feelings arrived on the same train.\"", "C": "\"Streetlights here stayed on until well past sunrise, a detail he noted but did not question.\"", "D": "\"His apartment faced an alley, and from its window he could see almost nothing of the skyline.\""}, "optsZh": {"A": "「大多數夜晚地鐵都會延誤，即使沒下雨，月台也隱約有雨水的氣味。」", "B": "「我覺得這座城市既刺激又寂寞，彷彿兩種感覺搭同一班火車抵達。」", "C": "「這裡的路燈直到日出後很久才熄滅，他注意到這個細節，但沒有多問。」", "D": "「他的公寓面對一條小巷，從窗戶幾乎看不到城市的天際線。」"}, "answer": "B", "expl": "Only this quotation directly names two contradictory feelings—thrill and loneliness—toward the same subject.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Command of Evidence (Quotation): choose the quotation that most effectively illustrates a claim about mixed feelings.", "vocab": false, "body": "", "bodyPlain": "", "stem": "A student is writing an essay about a fictional chef who expresses mixed feelings about a family recipe. Which quotation would most effectively illustrate the claim?", "stemZh": "一名學生正在寫一篇關於一位虛構主廚的文章，她對一道家傳食譜懷有矛盾的情感。哪一句引文最能有效說明這個主張？", "bodyZh": "", "opts": {"A": "\"The recipe called for a pinch of saffron, a spice her grandmother had always measured by eye.\"", "B": "\"By the time the broth thickened, the kitchen had filled with a smell she hadn't noticed in years.\"", "C": "\"I resent how much this dish still controls me, and still I cannot imagine ever cooking anything else.\"", "D": "\"The pot was cast iron, heavy enough that she used both hands to lift it from the stove.\""}, "optsZh": {"A": "「食譜要求放一小撮番紅花，這是她祖母一向用目測的香料。」", "B": "「等到湯汁變稠時，廚房裡已瀰漫著一股她多年沒注意到的味道。」", "C": "「我憎恨這道菜至今仍如此支配我，但我仍無法想像自己做任何其他菜。」", "D": "「那口鍋是鑄鐵的，重到她得用雙手才能從爐子上提起來。」"}, "answer": "C", "expl": "Only this quotation directly names two contradictory feelings—resentment and attachment—toward the same recipe.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Command of Evidence (Quotation): choose the quotation that most effectively illustrates a claim about mixed feelings.", "vocab": false, "body": "", "bodyPlain": "", "stem": "A student is writing an essay about a fictional astronaut who expresses mixed feelings about returning to Earth. Which quotation would most effectively illustrate the claim?", "stemZh": "一名學生正在寫一篇關於一位虛構太空人的文章，他對返回地球懷有矛盾的情感。哪一句引文最能有效說明這個主張？", "bodyZh": "", "opts": {"A": "\"The capsule shook as it entered the atmosphere, exactly as the simulations had predicted.\"", "B": "\"Ground control's voice grew clearer with every passing minute, steady and familiar.\"", "C": "\"Recovery ships were already visible from the window, small white shapes against the blue.\"", "D": "\"I have never wanted so badly to feel solid ground again, and never dreaded anything so much either.\""}, "optsZh": {"A": "「太空艙進入大氣層時劇烈震動，正如模擬所預測的。」", "B": "「地面控制中心的聲音每過一分鐘就更清晰一些，穩定而熟悉。」", "C": "「從窗戶已經可以看見回收船，在藍色背景中是一個個白色小點。」", "D": "「我從未如此渴望再次踩在堅實的地面上，也從未如此害怕任何事。」"}, "answer": "D", "expl": "Only this quotation directly names two contradictory feelings—wanting and dreading—toward the same event.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence (Data/Table): use quantitative data from a table to complete a comparison.", "vocab": false, "body": "Land Area Covered by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=native\" target=\"_blank\" rel=\"noopener\" data-w=\"native\" data-pos=\"adj.\" data-en=\"originally from a particular place\" data-zh=\"本土的；原生的\">Native<\/a> Flowering Plants at a Site in Antarctica<br><a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">Species<\/a> | Area covered in 2009 (sq. m) | Area covered in 2018 (sq. m) | Percent increase<br>Deschampsia antarctica | 1,230 | 1,576 | 28%<br>Colobanthus quitensis | 6.9 | 10.7 | 55%<br><br>The only flowering plant species native to Antarctica, Colobanthus quitensis and Deschampsia antarctica grow in places where the earth remains free of ice for much of the year. Botanist Nicoletta Cannone wondered how the warming of Antarctica&#x27;s climate in recent years had affected these species, so she visited a site in Antarctica, first in 2009 and later in 2018, to count the number of plants growing there. Cannone found that the area of land covered by the two species had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a> expanded during the nine-year period. While both species likely benefited from warming <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>, Colobanthus quitensis ______", "bodyPlain": "Land Area Covered by Native Flowering Plants at a Site in Antarctica\nSpecies | Area covered in 2009 (sq. m) | Area covered in 2018 (sq. m) | Percent increase\nDeschampsia antarctica | 1,230 | 1,576 | 28%\nColobanthus quitensis | 6.9 | 10.7 | 55%\n\nThe only flowering plant species native to Antarctica, Colobanthus quitensis and Deschampsia antarctica grow in places where the earth remains free of ice for much of the year. Botanist Nicoletta Cannone wondered how the warming of Antarctica's climate in recent years had affected these species, so she visited a site in Antarctica, first in 2009 and later in 2018, to count the number of plants growing there. Cannone found that the area of land covered by the two species had significantly expanded during the nine-year period. While both species likely benefited from warming temperatures, Colobanthus quitensis ______", "stem": "Which choice most effectively uses data from the table to complete the comparison?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成比較？", "bodyZh": "南極洲某處由原生開花植物覆蓋的土地面積\n物種 | 2009 年覆蓋面積（平方公尺）| 2018 年覆蓋面積（平方公尺）| 增加百分比\n南極髮草（Deschampsia antarctica）| 1,230 | 1,576 | 28%\n南極漆姑草（Colobanthus quitensis）| 6.9 | 10.7 | 55%\nColobanthus quitensis 與 Deschampsia antarctica 是南極洲僅有的原生開花植物，生長在一年中大部分時間地面不結冰的地方。植物學家 Nicoletta Cannone 想知道近年南極氣候暖化如何影響這些物種，因此她先在 2009 年、後在 2018 年造訪南極洲某處，計算當地生長的植物數量。Cannone 發現，在這九年期間，這兩個物種覆蓋的土地面積都大幅擴張。雖然兩個物種可能都受惠於氣溫上升，但 Colobanthus quitensis ______", "opts": {"A": "suppressed the growth of Deschampsia antarctica, which covered a smaller area of land in 2018 than it had in 2009.", "B": "saw a greater expansion than Deschampsia antarctica did, increasing the area of land it covered by more than half.", "C": "showed a greater increase in the average size of individual plants than Deschampsia antarctica did.", "D": "covered land newly freed from ice at a rate 55% faster than that of Deschampsia antarctica."}, "optsZh": {"A": "抑制了 Deschampsia antarctica 的生長，使其 2018 年覆蓋的土地面積小於 2009 年。", "B": "擴張幅度比 Deschampsia antarctica 更大，覆蓋的土地面積增加了一半以上。", "C": "單株植物平均大小的增加幅度比 Deschampsia antarctica 大。", "D": "覆蓋新近融冰土地的速度比 Deschampsia antarctica 快 55%。"}, "answer": "B", "expl": "The table shows Colobanthus quitensis increased 55%, more than half, while Deschampsia antarctica increased only 28%.", "explZh": "表格顯示 Colobanthus quitensis 增加 55%（超過一半），而 Deschampsia antarctica 只增加 28%。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence (Data/Table): use quantitative data from a table to complete a comparison.", "vocab": false, "body": "Urban Tree Canopy Cover at Two City Parks<br>Park | Canopy area in 2010 (acres) | Canopy area in 2022 (acres) | Percent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=increase\" target=\"_blank\" rel=\"noopener\">increase<\/a><br>Riverside Park | 40 | 52 | 30%<br>Highline Park | 25 | 45 | 80%<br><br>City foresters wanted to know how canopy cover had changed at two parks after a decade of new tree planting. Urban <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ecologist\" target=\"_blank\" rel=\"noopener\" data-w=\"ecologist\" data-pos=\"n.\" data-en=\"a scientist who studies the relationship between living things and their environment\" data-zh=\"生態學家\">ecologist<\/a> Dana Whitfield found that canopy area had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expand\" target=\"_blank\" rel=\"noopener\" data-w=\"expand\" data-pos=\"v.\" data-en=\"to become or make larger\" data-zh=\"擴展\">expanded<\/a> at both parks between 2010 and 2022. While both parks likely benefited from the planting program, Highline Park ______", "bodyPlain": "Urban Tree Canopy Cover at Two City Parks\nPark | Canopy area in 2010 (acres) | Canopy area in 2022 (acres) | Percent increase\nRiverside Park | 40 | 52 | 30%\nHighline Park | 25 | 45 | 80%\n\nCity foresters wanted to know how canopy cover had changed at two parks after a decade of new tree planting. Urban ecologist Dana Whitfield found that canopy area had expanded at both parks between 2010 and 2022. While both parks likely benefited from the planting program, Highline Park ______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "兩座城市公園的都市樹冠覆蓋面積\n公園 | 2010 年樹冠面積（英畝）| 2022 年樹冠面積（英畝）| 增加百分比\nRiverside 公園 | 40 | 52 | 30%\nHighline 公園 | 25 | 45 | 80%\n城市林務人員想了解，經過十年新植樹後，兩座公園的樹冠覆蓋面積有何變化。都市生態學家 Dana Whitfield 發現，2010 至 2022 年間兩座公園的樹冠面積都擴大了。雖然兩座公園可能都受惠於植樹計畫，但 Highline 公園 ______", "opts": {"A": "saw a smaller expansion than Riverside Park did, covering less additional area overall.", "B": "saw a greater expansion than Riverside Park did, increasing its canopy area by more than half.", "C": "showed a greater increase in average tree height than Riverside Park did.", "D": "covered new ground at a rate 30% faster than Riverside Park did."}, "optsZh": {"A": "擴張幅度比 Riverside 公園小，增加的總面積較少。", "B": "擴張幅度比 Riverside 公園更大，樹冠面積增加了一半以上。", "C": "平均樹高的增加幅度比 Riverside 公園大。", "D": "覆蓋新地面的速度比 Riverside 公園快 30%。"}, "answer": "B", "expl": "Highline's 80% increase is both greater than Riverside's 30% and more than half, matching only choice B.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Command of Evidence (Data/Table): use quantitative data from a table to complete a comparison.", "vocab": false, "body": "Reservoir Water Levels After Restoration Efforts<br>Reservoir | <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volume\" target=\"_blank\" rel=\"noopener\" data-w=\"volume\" data-pos=\"n.\" data-en=\"how loud a sound is; also an amount of space or a book in a series\" data-zh=\"音量；容量；（書的）冊\">Volume<\/a> in 2015 (<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=million\" target=\"_blank\" rel=\"noopener\">million<\/a> gallons) | Volume in 2023 (million gallons) | Percent increase<br>Cedar Reservoir | 800 | 1,040 | 30%<br>Pinewood Reservoir | 500 | 900 | 80%<br><br>Hydrologist Marco Reyes tracked water levels at two reservoirs following new watershed restoration projects. Both reservoirs gained volume between 2015 and 2023. While both sites likely benefited from reduced <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=runoff\" target=\"_blank\" rel=\"noopener\" data-w=\"runoff\" data-pos=\"n.\" data-en=\"rainwater that flows over the ground into streams or drains\" data-zh=\"逕流\">runoff<\/a>, Pinewood Reservoir ______", "bodyPlain": "Reservoir Water Levels After Restoration Efforts\nReservoir | Volume in 2015 (million gallons) | Volume in 2023 (million gallons) | Percent increase\nCedar Reservoir | 800 | 1,040 | 30%\nPinewood Reservoir | 500 | 900 | 80%\n\nHydrologist Marco Reyes tracked water levels at two reservoirs following new watershed restoration projects. Both reservoirs gained volume between 2015 and 2023. While both sites likely benefited from reduced runoff, Pinewood Reservoir ______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "復育工作後的水庫水位\n水庫 | 2015 年蓄水量（百萬加侖）| 2023 年蓄水量（百萬加侖）| 增加百分比\nCedar 水庫 | 800 | 1,040 | 30%\nPinewood 水庫 | 500 | 900 | 80%\n水文學家 Marco Reyes 在新的集水區復育計畫實施後，追蹤兩座水庫的水位。2015 至 2023 年間，兩座水庫的蓄水量都增加了。雖然兩處可能都受惠於逕流減少，但 Pinewood 水庫 ______", "opts": {"A": "lost more volume than Cedar Reservoir did over the same period.", "B": "gained volume at a slower rate than Cedar Reservoir did.", "C": "saw a greater percentage increase than Cedar Reservoir did, growing by more than three-quarters.", "D": "showed a greater increase in water clarity than Cedar Reservoir did."}, "optsZh": {"A": "同一期間流失的水量比 Cedar 水庫多。", "B": "蓄水量增加的速度比 Cedar 水庫慢。", "C": "增加的百分比比 Cedar 水庫更大，成長超過四分之三。", "D": "水質清澈度的改善幅度比 Cedar 水庫大。"}, "answer": "C", "expl": "Pinewood's 80% increase is greater than Cedar's 30% and exceeds three-quarters, matching only choice C.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Command of Evidence (Data/Table): use quantitative data from a table to complete a comparison.", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=monarch\" target=\"_blank\" rel=\"noopener\" data-w=\"monarch\" data-pos=\"n.\" data-en=\"a king or queen\" data-zh=\"君主\">Monarch<\/a> Butterfly Counts at Two Restored Meadows<br>Meadow | Count in 2012 | Count in 2021 | Percent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=increase\" target=\"_blank\" rel=\"noopener\">increase<\/a><br>Sunridge Meadow | 150 | 210 | 40%<br>Bellview Meadow | 90 | 189 | 110%<br><br>Conservationist Priya Nair <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compared\" target=\"_blank\" rel=\"noopener\">compared<\/a> monarch counts at two meadows after milkweed restoration. Both meadows gained monarchs between 2012 and 2021. While both sites likely benefited from the new plantings, Bellview Meadow ______", "bodyPlain": "Monarch Butterfly Counts at Two Restored Meadows\nMeadow | Count in 2012 | Count in 2021 | Percent increase\nSunridge Meadow | 150 | 210 | 40%\nBellview Meadow | 90 | 189 | 110%\n\nConservationist Priya Nair compared monarch counts at two meadows after milkweed restoration. Both meadows gained monarchs between 2012 and 2021. While both sites likely benefited from the new plantings, Bellview Meadow ______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "兩處復育草地的帝王斑蝶數量\n草地 | 2012 年數量 | 2021 年數量 | 增加百分比\nSunridge 草地 | 150 | 210 | 40%\nBellview 草地 | 90 | 189 | 110%\n保育人士 Priya Nair 在復育乳草後，比較兩處草地的帝王斑蝶數量。2012 至 2021 年間，兩處草地的帝王斑蝶都增加了。雖然兩處可能都受惠於新種植的植物，但 Bellview 草地 ______", "opts": {"A": "recorded fewer monarchs overall in 2021 than Sunridge Meadow did.", "B": "more than doubled its monarch count, a greater percentage increase than Sunridge Meadow's.", "C": "attracted a greater variety of pollinator species than Sunridge Meadow did.", "D": "restored milkweed at a rate 40% faster than Sunridge Meadow did."}, "optsZh": {"A": "2021 年記錄到的帝王斑蝶總數比 Sunridge 草地少。", "B": "帝王斑蝶數量增加一倍以上，增加百分比高於 Sunridge 草地。", "C": "吸引的授粉昆蟲種類比 Sunridge 草地更多。", "D": "復育乳草的速度比 Sunridge 草地快 40%。"}, "answer": "B", "expl": "Bellview's 110% increase means its count more than doubled, exceeding Sunridge's 40% increase, matching only choice B.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Command of Evidence (Data/Table): use quantitative data from a table to complete a comparison.", "vocab": false, "body": "Annual <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=solar\" target=\"_blank\" rel=\"noopener\" data-w=\"solar\" data-pos=\"adj.\" data-en=\"relating to the Sun\" data-zh=\"太陽的\">Solar<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=output\" target=\"_blank\" rel=\"noopener\" data-w=\"output\" data-pos=\"n.\" data-en=\"the amount of something produced\" data-zh=\"產出；產量\">Output<\/a> at Two Facilities After Panel Upgrades<br>Facility | Output in 2018 (MWh) | Output in 2023 (MWh) | Percent increase<br>North Facility | 2,000 | 2,600 | 30%<br>South Facility | 1,200 | 2,160 | 80%<br><br>Engineer Tomas Rivera tracked annual solar output at two facilities after both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=install\" target=\"_blank\" rel=\"noopener\" data-w=\"install\" data-pos=\"v.\" data-en=\"to put equipment in place so it can be used\" data-zh=\"安裝\">installed<\/a> upgraded panels. Output increased at both facilities between 2018 and 2023. While both facilities likely benefited from the upgrade, South Facility ______", "bodyPlain": "Annual Solar Output at Two Facilities After Panel Upgrades\nFacility | Output in 2018 (MWh) | Output in 2023 (MWh) | Percent increase\nNorth Facility | 2,000 | 2,600 | 30%\nSouth Facility | 1,200 | 2,160 | 80%\n\nEngineer Tomas Rivera tracked annual solar output at two facilities after both installed upgraded panels. Output increased at both facilities between 2018 and 2023. While both facilities likely benefited from the upgrade, South Facility ______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "兩座設施更換太陽能板後的年發電量\n設施 | 2018 年發電量（百萬瓦時）| 2023 年發電量（百萬瓦時）| 增加百分比\n北區設施 | 2,000 | 2,600 | 30%\n南區設施 | 1,200 | 2,160 | 80%\n工程師 Tomas Rivera 在兩座設施都安裝升級版太陽能板後，追蹤它們的年發電量。2018 至 2023 年間，兩座設施的發電量都增加了。雖然兩座設施可能都受惠於升級，但南區設施 ______", "opts": {"A": "produced less total electricity in 2023 than North Facility did.", "B": "increased its output by a smaller percentage than North Facility did.", "C": "saw a greater percentage increase than North Facility did, growing its output by more than three-quarters.", "D": "installed its panel upgrades one year later than North Facility did."}, "optsZh": {"A": "2023 年的總發電量比北區設施少。", "B": "發電量增加的百分比比北區設施小。", "C": "增加的百分比比北區設施更大，發電量成長超過四分之三。", "D": "比北區設施晚一年安裝太陽能板升級。"}, "answer": "C", "expl": "South's 80% increase is greater than North's 30% and exceeds three-quarters, matching only choice C.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Command of Evidence (Data/Table): use quantitative data from a table to complete a comparison.", "vocab": false, "body": "Public Library <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visitor\" target=\"_blank\" rel=\"noopener\">Visitor<\/a> Counts at Two Branches<br>Branch | Visitors in 2016 | Visitors in 2023 | Percent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=increase\" target=\"_blank\" rel=\"noopener\">increase<\/a><br>Oak Street Branch | 4,000 | 5,200 | 30%<br>Riverside Branch | 2,500 | 4,500 | 80%<br><br>Librarian Helena Cho <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compared\" target=\"_blank\" rel=\"noopener\">compared<\/a> visitor counts at two branches after both renovated their children&#x27;s sections. Visitor counts rose at both branches between 2016 and 2023. While both branches likely benefited from the renovation, Riverside Branch ______", "bodyPlain": "Public Library Visitor Counts at Two Branches\nBranch | Visitors in 2016 | Visitors in 2023 | Percent increase\nOak Street Branch | 4,000 | 5,200 | 30%\nRiverside Branch | 2,500 | 4,500 | 80%\n\nLibrarian Helena Cho compared visitor counts at two branches after both renovated their children's sections. Visitor counts rose at both branches between 2016 and 2023. While both branches likely benefited from the renovation, Riverside Branch ______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格中的數據來完成敘述？", "bodyZh": "兩間公共圖書館分館的訪客人數\n分館 | 2016 年訪客數 | 2023 年訪客數 | 增加百分比\nOak Street 分館 | 4,000 | 5,200 | 30%\nRiverside 分館 | 2,500 | 4,500 | 80%\n圖書館員 Helena Cho 在兩間分館都翻修兒童區後，比較兩館的訪客人數。2016 至 2023 年間，兩間分館的訪客人數都上升了。雖然兩間分館可能都受惠於翻修，但 Riverside 分館 ______", "opts": {"A": "had fewer total visitors in 2023 than Oak Street Branch did.", "B": "saw a greater percentage increase than Oak Street Branch did, growing its visitor count by more than three-quarters.", "C": "renovated its children's section a year earlier than Oak Street Branch did.", "D": "showed a greater increase in average visit length than Oak Street Branch did."}, "optsZh": {"A": "2023 年的訪客總數比 Oak Street 分館少。", "B": "增加的百分比比 Oak Street 分館更大，訪客人數成長超過四分之三。", "C": "比 Oak Street 分館早一年翻修兒童區。", "D": "平均造訪時間的增加幅度比 Oak Street 分館大。"}, "answer": "B", "expl": "Riverside's 80% increase is greater than Oak Street's 30% and exceeds three-quarters, matching only choice B.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Command of Evidence (Research Finding): identify the finding that would most directly support a proposed indirect causal effect.", "vocab": false, "body": "As media <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumption\" target=\"_blank\" rel=\"noopener\" data-w=\"consumption\" data-pos=\"n.\" data-en=\"the amount of something that is used\" data-zh=\"使用量；消耗\">consumption<\/a> has become increasingly multiplatform and socially mediated, active news acquisition has diminished in favor of an attitude known as &quot;news finds me&quot; (NFM), in which people passively rely on their social networks and ambient media <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a> for information about current events. Homero Gil de Zuniga and Trevor Diehl examined data on a representative group of adults in the United States to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> participants&#x27; strength of NFM attitude, political knowledge, and political interest. Although no major election took place sufficiently near the study for Gil de Zuniga and Diehl to identify causality between NFM and voting behavior, they did posit that NFM may reduce voting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=probability\" target=\"_blank\" rel=\"noopener\" data-w=\"probability\" data-pos=\"n.\" data-en=\"how likely it is that something will happen\" data-zh=\"機率；可能性\">probability<\/a> through an indirect effect.", "bodyPlain": "As media consumption has become increasingly multiplatform and socially mediated, active news acquisition has diminished in favor of an attitude known as \"news finds me\" (NFM), in which people passively rely on their social networks and ambient media environments for information about current events. Homero Gil de Zuniga and Trevor Diehl examined data on a representative group of adults in the United States to determine participants' strength of NFM attitude, political knowledge, and political interest. Although no major election took place sufficiently near the study for Gil de Zuniga and Diehl to identify causality between NFM and voting behavior, they did posit that NFM may reduce voting probability through an indirect effect.", "stem": "Which finding, if true, would most directly support the idea advanced by Gil de Zuniga and Diehl?", "stemZh": "下列哪一項發現若為真，最能直接支持 Gil de Zuniga 與 Diehl 提出的觀點？", "bodyZh": "隨著媒體消費日益跨平台、並透過社群媒介進行，主動獲取新聞的行為已經減少，取而代之的是一種稱為「新聞會找上我」（NFM）的態度：人們被動地依賴社群網絡與周遭媒體環境來獲得時事資訊。Homero Gil de Zuniga 與 Trevor Diehl 分析一群具代表性的美國成年人資料，以判定受試者 NFM 態度的強度、政治知識與政治興趣。雖然研究期間附近沒有舉行重大選舉，使 Gil de Zuniga 與 Diehl 無法確認 NFM 與投票行為之間的因果關係，但他們確實推論 NFM 可能透過間接效應降低投票的可能性。", "opts": {"A": "NFM attitude tends to increase in strength as major elections approach, and people are significantly more likely to vote in major elections than in minor elections.", "B": "NFM attitude has a strong negative effect on political knowledge and interest, and there is known to be a strong positive correlation between political knowledge and interest and the likelihood of voting.", "C": "Political interest is known to have a strong positive effect on likelihood of voting but shows only a weak positive effect on political knowledge, and NFM attitude shows little correlation with either political knowledge or political interest.", "D": "The likelihood of voting increases as political knowledge increases, and the relationship between NFM attitude and political knowledge tends to strengthen as the size of people's social networks increases."}, "optsZh": {"A": "NFM 態度往往在重大選舉接近時增強，而人們在重大選舉中投票的可能性明顯高於小型選舉。", "B": "NFM 態度對政治知識與興趣有強烈的負面影響，而已知政治知識與興趣和投票可能性之間有強烈的正相關。", "C": "已知政治興趣對投票可能性有強烈的正面影響，但對政治知識只有微弱的正面影響，而 NFM 態度與政治知識或政治興趣都幾乎沒有相關。", "D": "投票的可能性隨政治知識增加而提高，而 NFM 態度與政治知識之間的關係往往隨著人們社群網絡規模擴大而增強。"}, "answer": "B", "expl": "If NFM lowers political knowledge and interest, and those raise voting, then NFM reduces voting indirectly, which is exactly the idea.", "explZh": "若 NFM 降低政治知識與興趣，而這兩者又會提高投票率，那麼 NFM 便間接降低投票，正符合研究者的推論。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Command of Evidence (Research Finding): identify the finding that would most directly support a proposed indirect causal effect.", "vocab": false, "body": "Researchers Lindiwe Moyo and Aaron Kessler examined data on a group of high school students to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> each student&#x27;s phone use before bed, sleep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=duration\" target=\"_blank\" rel=\"noopener\" data-w=\"duration\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"持續時間\">duration<\/a>, and next-day academic performance. Although no controlled sleep-lab <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> took place during the study, Moyo and Kessler posited that heavy pre-bed phone use may reduce academic performance through an indirect effect.", "bodyPlain": "Researchers Lindiwe Moyo and Aaron Kessler examined data on a group of high school students to determine each student's phone use before bed, sleep duration, and next-day academic performance. Although no controlled sleep-lab experiment took place during the study, Moyo and Kessler posited that heavy pre-bed phone use may reduce academic performance through an indirect effect.", "stem": "Which finding, if true, would most directly support the idea advanced by Moyo and Kessler?", "stemZh": "下列哪一項發現若為真，最能直接支持 Moyo 與 Kessler 提出的觀點？", "bodyZh": "研究人員 Lindiwe Moyo 與 Aaron Kessler 分析一群高中生的資料，以判定每位學生睡前使用手機的情況、睡眠時間，以及隔天的學業表現。雖然研究期間並未進行受控的睡眠實驗室實驗，但 Moyo 與 Kessler 推論，睡前大量使用手機可能透過間接效應降低學業表現。", "opts": {"A": "Academic performance tends to improve as the school year progresses, and phone use tends to decline during exam periods.", "B": "Heavy pre-bed phone use has a strong negative effect on sleep duration, and there is a known strong positive correlation between sleep duration and academic performance.", "C": "Sleep duration has a strong positive effect on academic performance but shows only a weak relationship with phone use, and phone use shows little correlation with either sleep duration or performance.", "D": "Academic performance increases as sleep duration increases, and the relationship between phone use and sleep duration weakens as students grow older."}, "optsZh": {"A": "學業表現往往隨著學年進行而進步，而手機使用往往在考試期間減少。", "B": "睡前大量使用手機對睡眠時間有強烈的負面影響，而已知睡眠時間與學業表現之間有強烈的正相關。", "C": "睡眠時間對學業表現有強烈的正面影響，但與手機使用的關係很弱，而手機使用與睡眠時間或學業表現都幾乎沒有相關。", "D": "學業表現隨睡眠時間增加而提高，而手機使用與睡眠時間的關係隨學生年齡增長而減弱。"}, "answer": "B", "expl": "Choice B supplies both links of the proposed chain: phone use lowers sleep, and sleep is tied to performance.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Command of Evidence (Research Finding): identify the finding that would most directly support a proposed indirect causal effect.", "vocab": false, "body": "Researchers examined survey data from a large <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> each employee&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attitude\" target=\"_blank\" rel=\"noopener\" data-w=\"attitude\" data-pos=\"n.\" data-en=\"a way of thinking or feeling about something\" data-zh=\"態度\">attitude<\/a> toward the new remote-work policy, job satisfaction, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=likelihood\" target=\"_blank\" rel=\"noopener\" data-w=\"likelihood\" data-pos=\"n.\" data-en=\"the chance that something will happen\" data-zh=\"可能性\">likelihood<\/a> of leaving within a year. Although no controlled trial took place during the study period, the researchers posited that positive attitudes toward remote work may reduce turnover through an indirect effect.", "bodyPlain": "Researchers examined survey data from a large company to determine each employee's attitude toward the new remote-work policy, job satisfaction, and likelihood of leaving within a year. Although no controlled trial took place during the study period, the researchers posited that positive attitudes toward remote work may reduce turnover through an indirect effect.", "stem": "Which finding, if true, would most directly support the idea advanced by the researchers?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員提出的觀點？", "bodyZh": "研究人員分析一家大公司的調查資料，以判定每位員工對新遠距工作政策的態度、工作滿意度，以及一年內離職的可能性。雖然研究期間並未進行對照試驗，但研究人員推論，對遠距工作的正面態度可能透過間接效應降低離職率。", "opts": {"A": "Turnover tends to decline company-wide during years of strong economic growth, regardless of remote-work attitudes.", "B": "Positive attitudes toward remote work have a strong positive effect on job satisfaction, and there is a known strong negative correlation between job satisfaction and turnover.", "C": "Job satisfaction has a strong negative effect on turnover but shows only a weak relationship with remote-work attitudes, which show little correlation with either variable.", "D": "Turnover decreases as job satisfaction increases, and the relationship between remote-work attitudes and job satisfaction weakens in larger companies."}, "optsZh": {"A": "在經濟強勁成長的年份，全公司的離職率往往會下降，與對遠距工作的態度無關。", "B": "對遠距工作的正面態度對工作滿意度有強烈的正面影響，而已知工作滿意度與離職率之間有強烈的負相關。", "C": "工作滿意度對離職率有強烈的負面影響，但與對遠距工作的態度關係很弱，而這種態度與這兩個變數都幾乎沒有相關。", "D": "離職率隨工作滿意度提高而下降，而對遠距工作的態度與工作滿意度之間的關係在較大的公司會減弱。"}, "answer": "B", "expl": "Choice B supplies both links of the proposed chain: attitude raises satisfaction, and satisfaction lowers turnover.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Command of Evidence (Research Finding): identify the finding that would most directly support a proposed indirect causal effect.", "vocab": false, "body": "Researchers examined survey and crime data across several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=residents\" target=\"_blank\" rel=\"noopener\" data-w=\"residents\" data-pos=\"n.\" data-en=\"people who live in a particular place\" data-zh=\"居民\">residents<\/a>&#x27; exposure to community gardens, levels of neighborly trust, and local crime rates. Although no controlled <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> took place, the researchers posited that community garden exposure may reduce crime rates through an indirect effect.", "bodyPlain": "Researchers examined survey and crime data across several neighborhoods to determine residents' exposure to community gardens, levels of neighborly trust, and local crime rates. Although no controlled experiment took place, the researchers posited that community garden exposure may reduce crime rates through an indirect effect.", "stem": "Which finding, if true, would most directly support the idea advanced by the researchers?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員提出的觀點？", "bodyZh": "研究人員分析多個社區的調查與犯罪資料，以判定居民接觸社區花園的程度、鄰里信任程度，以及當地犯罪率。雖然並未進行對照實驗，但研究人員推論，接觸社區花園可能透過間接效應降低犯罪率。", "opts": {"A": "Crime rates tend to fall citywide during years when city budgets for policing increase, regardless of garden exposure.", "B": "Community garden exposure has a strong positive effect on neighborly trust, and there is a known strong negative correlation between neighborly trust and crime rates.", "C": "Neighborly trust has a strong negative effect on crime rates but shows only a weak relationship with garden exposure, which shows little correlation with either variable.", "D": "Crime rates decrease as neighborly trust increases, and the relationship between garden exposure and neighborly trust weakens in wealthier neighborhoods."}, "optsZh": {"A": "在城市警政預算增加的年份，全市犯罪率往往會下降，與接觸社區花園與否無關。", "B": "接觸社區花園對鄰里信任有強烈的正面影響，而已知鄰里信任與犯罪率之間有強烈的負相關。", "C": "鄰里信任對犯罪率有強烈的負面影響，但與接觸花園的關係很弱，而接觸花園與這兩個變數都幾乎沒有相關。", "D": "犯罪率隨鄰里信任增加而下降，而接觸花園與鄰里信任之間的關係在較富裕的社區中會減弱。"}, "answer": "B", "expl": "Choice B supplies both links of the proposed chain: garden exposure raises trust, and trust lowers crime.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Command of Evidence (Research Finding): identify the finding that would most directly support a proposed indirect causal effect.", "vocab": false, "body": "Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=examined\" target=\"_blank\" rel=\"noopener\">examined<\/a> data on a group of high school students to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=participation\" target=\"_blank\" rel=\"noopener\" data-w=\"participation\" data-pos=\"n.\" data-en=\"the act of taking part in something\" data-zh=\"參與\">participation<\/a> in a new mentoring program, self-confidence regarding academic ability, and eventual college enrollment. Although no randomized trial took place, the researchers posited that mentoring program participation may increase college enrollment through an indirect effect.", "bodyPlain": "Researchers examined data on a group of high school students to determine participation in a new mentoring program, self-confidence regarding academic ability, and eventual college enrollment. Although no randomized trial took place, the researchers posited that mentoring program participation may increase college enrollment through an indirect effect.", "stem": "Which finding, if true, would most directly support the idea advanced by the researchers?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員提出的觀點？", "bodyZh": "研究人員分析一群高中生的資料，以判定他們是否參加新的輔導計畫、對自己學業能力的自信，以及最終是否進入大學就讀。雖然並未進行隨機試驗，但研究人員推論，參加輔導計畫可能透過間接效應提高大學入學率。", "opts": {"A": "College enrollment tends to rise nationally during years of expanded financial aid, regardless of mentoring participation.", "B": "Mentoring program participation has a strong positive effect on self-confidence, and there is a known strong positive correlation between self-confidence and college enrollment.", "C": "Self-confidence has a strong positive effect on enrollment but shows only a weak relationship with mentoring participation, which shows little correlation with either variable.", "D": "Enrollment increases as self-confidence increases, and the relationship between mentoring participation and self-confidence weakens for older students."}, "optsZh": {"A": "在財務補助擴大的年份，全國大學入學率往往會上升，與是否參加輔導計畫無關。", "B": "參加輔導計畫對自信有強烈的正面影響，而已知自信與大學入學率之間有強烈的正相關。", "C": "自信對入學率有強烈的正面影響，但與參加輔導計畫的關係很弱，而參加輔導計畫與這兩個變數都幾乎沒有相關。", "D": "入學率隨自信增加而提高，而參加輔導計畫與自信之間的關係對年紀較大的學生會減弱。"}, "answer": "B", "expl": "Choice B supplies both links of the proposed chain: participation raises confidence, and confidence raises enrollment.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Command of Evidence (Research Finding): identify the finding that would most directly support a proposed indirect causal effect.", "vocab": false, "body": "Researchers examined <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a> data across several cities to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> transit frequency, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=average\" target=\"_blank\" rel=\"noopener\" data-w=\"average\" data-pos=\"adj./n.\" data-en=\"the usual or typical amount; the result of adding numbers and dividing\" data-zh=\"平均的；平均數\">average<\/a> traffic congestion, and traffic fatality rates. Although no controlled <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> took place, the researchers posited that increased transit frequency may reduce fatality rates through an indirect effect.", "bodyPlain": "Researchers examined transportation data across several cities to determine transit frequency, average traffic congestion, and traffic fatality rates. Although no controlled experiment took place, the researchers posited that increased transit frequency may reduce fatality rates through an indirect effect.", "stem": "Which finding, if true, would most directly support the idea advanced by the researchers?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員提出的觀點？", "bodyZh": "研究人員分析多個城市的交通資料，以判定大眾運輸班次頻率、平均交通壅塞程度與交通死亡率。雖然並未進行對照實驗，但研究人員推論，增加大眾運輸班次可能透過間接效應降低死亡率。", "opts": {"A": "Fatality rates tend to fall nationally during years of improved vehicle safety technology, regardless of transit frequency.", "B": "Increased transit frequency has a strong negative effect on traffic congestion, and there is a known strong positive correlation between congestion and fatality rates.", "C": "Congestion has a strong positive effect on fatality rates but shows only a weak relationship with transit frequency, which shows little correlation with either variable.", "D": "Fatality rates decrease as congestion decreases, and the relationship between transit frequency and congestion weakens in smaller cities."}, "optsZh": {"A": "在車輛安全技術改善的年份，全國死亡率往往會下降，與大眾運輸班次無關。", "B": "增加大眾運輸班次對交通壅塞有強烈的負面影響，而已知壅塞與死亡率之間有強烈的正相關。", "C": "交通壅塞對死亡率有強烈的正面影響，但與大眾運輸班次的關係很弱，而大眾運輸班次與這兩個變數都幾乎沒有相關。", "D": "死亡率隨交通壅塞減少而下降，而大眾運輸班次與壅塞之間的關係在較小的城市會減弱。"}, "answer": "B", "expl": "Choice B supplies both links of the proposed chain: frequency lowers congestion, and congestion raises fatalities.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Inferences: draw a logical conclusion about the direction of influence from parallel traits and historical/migration evidence.", "vocab": false, "body": "In dialects of English spoken in Scotland, the &quot;r&quot; sound is strongly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasized<\/a> when it appears at the end of syllables (as in &quot;car&quot;) or before other consonant sounds (as in &quot;bird&quot;). English dialects of the Upland South, a region stretching from Oklahoma to western Virginia, place similar <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasis\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasis\" data-pos=\"n.\" data-en=\"special importance or attention given to something\" data-zh=\"強調；重點\">emphasis<\/a> on &quot;r&quot; at the ends of syllables and before other consonant sounds. Historical records show that the Upland South was colonized largely by people whose ancestors came from Scotland. Thus, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=linguist\" target=\"_blank\" rel=\"noopener\" data-w=\"linguist\" data-pos=\"n.\" data-en=\"a scientist who studies language\" data-zh=\"語言學家\">linguists<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that ______", "bodyPlain": "In dialects of English spoken in Scotland, the \"r\" sound is strongly emphasized when it appears at the end of syllables (as in \"car\") or before other consonant sounds (as in \"bird\"). English dialects of the Upland South, a region stretching from Oklahoma to western Virginia, place similar emphasis on \"r\" at the ends of syllables and before other consonant sounds. Historical records show that the Upland South was colonized largely by people whose ancestors came from Scotland. Thus, linguists have concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在蘇格蘭的英語方言中，「r」音出現在音節結尾（如「car」）或其他子音之前（如「bird」）時，會被強烈強調。Upland South（從奧克拉荷馬州延伸到維吉尼亞州西部的地區）的英語方言，也同樣強調位於音節結尾與其他子音之前的「r」。歷史紀錄顯示，Upland South 主要由祖先來自蘇格蘭的人所開拓。因此，語言學家得出結論：______", "opts": {"A": "the English dialects spoken in the Upland South acquired their emphasis on the \"r\" sound from dialects spoken in Scotland.", "B": "emphasis on the \"r\" sound will eventually spread from English dialects spoken in the Upland South to dialects spoken elsewhere.", "C": "the English dialects spoken in Scotland were influenced by dialects spoken in the Upland South.", "D": "people from Scotland abandoned their emphasis on the \"r\" sound after relocating to the Upland South."}, "optsZh": {"A": "Upland South 的英語方言是從蘇格蘭方言中習得對「r」音的強調。", "B": "對「r」音的強調終將從 Upland South 的英語方言傳播到其他地方的方言。", "C": "蘇格蘭的英語方言受到 Upland South 方言的影響。", "D": "來自蘇格蘭的人在遷居 Upland South 後，放棄了對「r」音的強調。"}, "answer": "A", "expl": "The Upland South was settled largely by people of Scottish descent, so its dialects likely got the strong 'r' from Scottish dialects.", "explZh": "Upland South 主要由蘇格蘭後裔移民開拓，因此當地方言的「r」音很可能來自蘇格蘭方言。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Inferences: draw a logical conclusion about the direction of influence from parallel traits and historical/migration evidence.", "vocab": false, "body": "In dialects of Portuguese spoken in the Azores, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinctive\" target=\"_blank\" rel=\"noopener\" data-w=\"distinctive\" data-pos=\"adj.\" data-en=\"easy to recognize because it is different\" data-zh=\"獨特的；有特色的\">distinctive<\/a> fronting of certain vowel sounds occurs before nasal consonants. Portuguese dialects spoken in parts of coastal Brazil show a similar fronting pattern in the same phonetic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>. Historical records show that these Brazilian coastal communities were settled largely by migrants from the Azores in the eighteenth century. Thus, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=linguist\" target=\"_blank\" rel=\"noopener\" data-w=\"linguist\" data-pos=\"n.\" data-en=\"a scientist who studies language\" data-zh=\"語言學家\">linguists<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that ______", "bodyPlain": "In dialects of Portuguese spoken in the Azores, a distinctive fronting of certain vowel sounds occurs before nasal consonants. Portuguese dialects spoken in parts of coastal Brazil show a similar fronting pattern in the same phonetic environment. Historical records show that these Brazilian coastal communities were settled largely by migrants from the Azores in the eighteenth century. Thus, linguists have concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在亞速群島的葡萄牙語方言中，某些母音在鼻音子音之前會出現獨特的前移現象。巴西部分沿海地區的葡萄牙語方言，在相同的語音環境中也呈現類似的前移模式。歷史紀錄顯示，這些巴西沿海社區在十八世紀主要由來自亞速群島的移民定居。因此，語言學家得出結論：______", "opts": {"A": "the Brazilian coastal dialects acquired their vowel-fronting pattern from dialects spoken in the Azores.", "B": "the vowel-fronting pattern will eventually disappear from dialects spoken in the Azores.", "C": "the Azorean dialects were influenced by dialects spoken in coastal Brazil.", "D": "migrants from the Azores abandoned their vowel-fronting pattern after settling in Brazil."}, "optsZh": {"A": "巴西沿海方言的母音前移模式是從亞速群島的方言習得的。", "B": "母音前移模式終將從亞速群島的方言中消失。", "C": "亞速群島的方言受到巴西沿海方言的影響。", "D": "亞速群島移民在定居巴西後，放棄了他們的母音前移模式。"}, "answer": "A", "expl": "Since the Brazilian region was settled by Azorean migrants, the shared feature most logically traveled from the Azores to Brazil.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Inferences: draw a logical conclusion about the direction of influence from parallel traits and historical/migration evidence.", "vocab": false, "body": "In regional cooking <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> of coastal Sicily, dishes are commonly finished with a splash of vinegar just before serving. Cooking traditions in parts of Tunisia&#x27;s northern coast show a similar finishing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> in otherwise unrelated dishes. Historical records show that this region of Tunisia maintained centuries of active trade and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> exchange with Sicilian merchant communities. Thus, food <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> have concluded that ______", "bodyPlain": "In regional cooking traditions of coastal Sicily, dishes are commonly finished with a splash of vinegar just before serving. Cooking traditions in parts of Tunisia's northern coast show a similar finishing technique in otherwise unrelated dishes. Historical records show that this region of Tunisia maintained centuries of active trade and settlement exchange with Sicilian merchant communities. Thus, food historians have concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在西西里島沿海的地方烹飪傳統中，菜餚通常會在上桌前淋上少許醋作為收尾。突尼西亞北部沿海部分地區的烹飪傳統，在其他方面毫不相關的菜餚中，也呈現類似的收尾技巧。歷史紀錄顯示，突尼西亞這個地區與西西里商人社群維持了數百年活躍的貿易與移居往來。因此，飲食史學家得出結論：______", "opts": {"A": "the Tunisian finishing technique was adopted from Sicilian cooking traditions.", "B": "the vinegar-finishing technique will eventually disappear from Sicilian cooking.", "C": "Sicilian cooking traditions were influenced by Tunisian finishing techniques.", "D": "Tunisian cooks abandoned the vinegar-finishing technique after trade with Sicily ended."}, "optsZh": {"A": "突尼西亞的收尾技巧是從西西里烹飪傳統沿用而來的。", "B": "淋醋收尾的技巧終將從西西里烹飪中消失。", "C": "西西里的烹飪傳統受到突尼西亞收尾技巧的影響。", "D": "與西西里的貿易結束後，突尼西亞廚師就放棄了淋醋收尾的技巧。"}, "answer": "A", "expl": "Given the trade and settlement ties from Sicily, the shared technique most logically traveled from Sicily to Tunisia.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Inferences: draw a logical conclusion about the direction of influence from parallel traits and historical/migration evidence.", "vocab": false, "body": "In textile <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> of highland Peru, weavers commonly use a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinctive\" target=\"_blank\" rel=\"noopener\" data-w=\"distinctive\" data-pos=\"adj.\" data-en=\"easy to recognize because it is different\" data-zh=\"獨特的；有特色的\">distinctive<\/a> double-faced weaving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> to create reversible patterns. Textile traditions in parts of northern Chile show a nearly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=identical\" target=\"_blank\" rel=\"noopener\" data-w=\"identical\" data-pos=\"adj.\" data-en=\"exactly the same\" data-zh=\"完全相同的\">identical<\/a> double-faced technique used on similar looms. Historical records show that this region of Chile was settled by communities who migrated from highland Peru several centuries ago. Thus, textile historians have concluded that ______", "bodyPlain": "In textile traditions of highland Peru, weavers commonly use a distinctive double-faced weaving technique to create reversible patterns. Textile traditions in parts of northern Chile show a nearly identical double-faced technique used on similar looms. Historical records show that this region of Chile was settled by communities who migrated from highland Peru several centuries ago. Thus, textile historians have concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在秘魯高地的紡織傳統中，織工常用一種獨特的雙面織法來織出可正反兩用的圖案。智利北部部分地區的紡織傳統，也在類似的織布機上使用幾乎相同的雙面織法。歷史紀錄顯示，智利這個地區是由數百年前從秘魯高地遷徙而來的社群定居的。因此，紡織史學家得出結論：______", "opts": {"A": "the northern Chilean weaving technique was inherited from highland Peruvian traditions.", "B": "the double-faced technique will eventually disappear from highland Peru.", "C": "highland Peruvian weaving traditions were influenced by northern Chilean techniques.", "D": "the Peruvian migrants abandoned the double-faced technique after settling in Chile."}, "optsZh": {"A": "智利北部的編織技法是從秘魯高地的傳統繼承而來的。", "B": "雙面織法終將從秘魯高地消失。", "C": "秘魯高地的編織傳統受到智利北部技法的影響。", "D": "秘魯移民在定居智利後放棄了雙面織法。"}, "answer": "A", "expl": "Since northern Chile was settled by Peruvian migrants, the shared technique most logically traveled from Peru to Chile.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Inferences: draw a logical conclusion about the direction of influence from parallel traits and historical/migration evidence.", "vocab": false, "body": "In architectural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> of southern Germany, timber-framed houses commonly feature steeply pitched roofs designed to shed heavy snow. A similar steep-roof style appears in parts of rural Pennsylvania. Historical records show that this region of Pennsylvania was settled largely by German <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immigrant\" target=\"_blank\" rel=\"noopener\" data-w=\"immigrant\" data-pos=\"n.\" data-en=\"a person who comes to live in a new country\" data-zh=\"移民\">immigrants<\/a> in the eighteenth century. Thus, architectural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that ______", "bodyPlain": "In architectural traditions of southern Germany, timber-framed houses commonly feature steeply pitched roofs designed to shed heavy snow. A similar steep-roof style appears in parts of rural Pennsylvania. Historical records show that this region of Pennsylvania was settled largely by German immigrants in the eighteenth century. Thus, architectural historians have concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在德國南部的建築傳統中，木構架房屋通常有陡峭的斜屋頂，用來讓厚重的積雪滑落。類似的陡屋頂風格也出現在賓州部分鄉村地區。歷史紀錄顯示，賓州這個地區在十八世紀主要由德國移民定居。因此，建築史學家得出結論：______", "opts": {"A": "the Pennsylvania roof style was adopted from southern German building traditions.", "B": "the steep-roof style will eventually spread from Pennsylvania back to southern Germany.", "C": "southern German building traditions were influenced by rural Pennsylvania architecture.", "D": "German immigrants abandoned the steep-roof style after settling in Pennsylvania."}, "optsZh": {"A": "賓州的屋頂風格是從德國南部建築傳統沿用而來的。", "B": "陡屋頂風格終將從賓州傳回德國南部。", "C": "德國南部的建築傳統受到賓州鄉村建築的影響。", "D": "德國移民在定居賓州後放棄了陡屋頂風格。"}, "answer": "A", "expl": "Since rural Pennsylvania was settled by German immigrants, the shared roof style most logically traveled from Germany to Pennsylvania.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Inferences: draw a logical conclusion about the direction of influence from parallel traits and historical/migration evidence.", "vocab": false, "body": "In pottery <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> of the Yucatan Peninsula, artisans commonly apply a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinctive\" target=\"_blank\" rel=\"noopener\" data-w=\"distinctive\" data-pos=\"adj.\" data-en=\"easy to recognize because it is different\" data-zh=\"獨特的；有特色的\">distinctive<\/a> red slip before firing. Pottery traditions in parts of northern Belize show a nearly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=identical\" target=\"_blank\" rel=\"noopener\" data-w=\"identical\" data-pos=\"adj.\" data-en=\"exactly the same\" data-zh=\"完全相同的\">identical<\/a> red-slip technique. Historical records show that communities in this part of Belize maintained close trade and migration ties with the Yucatan for many centuries. Thus, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> have concluded that ______", "bodyPlain": "In pottery traditions of the Yucatan Peninsula, artisans commonly apply a distinctive red slip before firing. Pottery traditions in parts of northern Belize show a nearly identical red-slip technique. Historical records show that communities in this part of Belize maintained close trade and migration ties with the Yucatan for many centuries. Thus, archaeologists have concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在猶加敦半島的製陶傳統中，工匠通常會在燒製前塗上一層獨特的紅色泥釉。貝里斯北部部分地區的製陶傳統，也呈現幾乎相同的紅泥釉技法。歷史紀錄顯示，貝里斯這個地區的社群與猶加敦維持了好幾世紀密切的貿易與遷徙關係。因此，考古學家得出結論：______", "opts": {"A": "the northern Belizean red-slip technique was acquired from Yucatan pottery traditions.", "B": "the red-slip technique will eventually disappear from Yucatan pottery.", "C": "Yucatan pottery traditions were influenced by northern Belizean techniques.", "D": "Yucatan artisans abandoned the red-slip technique after trade with Belize declined."}, "optsZh": {"A": "貝里斯北部的紅泥釉技法是從猶加敦製陶傳統習得的。", "B": "紅泥釉技法終將從猶加敦陶藝中消失。", "C": "猶加敦的製陶傳統受到貝里斯北部技法的影響。", "D": "與貝里斯的貿易衰退後，猶加敦工匠就放棄了紅泥釉技法。"}, "answer": "A", "expl": "Given the close ties from the Yucatan, the shared pottery technique most logically traveled from the Yucatan to Belize.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Inferences: complete a hypothesis that a persistent biological trait has been preserved because it confers a benefit.", "vocab": false, "body": "In 2016, biological anthropologist Heather F. Smith and her team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the evolution of the appendix, an intestinal organ that is present in some mammals, including humans, but is generally thought to have no function. Studying 533 mammal species, the team found that the appendix has emerged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> across multiple lineages in separate instances and, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a>, hasn&#x27;t disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have higher concentrations of lymphoid tissue, which supports immune responses, in the cecum, the organ the appendix is attached to. Therefore, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that the appendix likely ______", "bodyPlain": "In 2016, biological anthropologist Heather F. Smith and her team investigated the evolution of the appendix, an intestinal organ that is present in some mammals, including humans, but is generally thought to have no function. Studying 533 mammal species, the team found that the appendix has emerged independently across multiple lineages in separate instances and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have higher concentrations of lymphoid tissue, which supports immune responses, in the cecum, the organ the appendix is attached to. Therefore, the team hypothesized that the appendix likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "2016 年，生物人類學家 Heather F.Smith 與她的團隊研究了闌尾的演化。闌尾是一種腸道器官，存在於包括人類在內的部分哺乳動物體內，但一般認為它沒有功能。團隊研究了 533 種哺乳動物，發現闌尾在多個演化支系中分別獨立出現，而且重要的是，在特定支系中出現後就沒有消失。此外，團隊確認，擁有這個器官的物種，其盲腸（闌尾所連接的器官）中往往含有較高濃度、能支援免疫反應的淋巴組織。因此，團隊提出假設：闌尾很可能 ______", "opts": {"A": "was once present in many nonmammal species but has since disappeared from those lineages.", "B": "has been preserved in certain mammal species because it benefits their immune systems.", "C": "will emerge in a greater number of mammal species because it may serve a necessary function in the immune system.", "D": "produced higher concentrations of lymphoid tissue in mammals in the past than it does currently."}, "optsZh": {"A": "曾經存在於許多非哺乳類物種中，但後來已從那些支系中消失。", "B": "因有益於其免疫系統，而在某些哺乳類中被保留下來。", "C": "因可能在免疫系統中具有必要功能，將出現在更多哺乳類物種中。", "D": "過去在哺乳類身上產生的淋巴組織濃度比現在更高。"}, "answer": "B", "expl": "The appendix keeps appearing, never disappears, and is linked to more immune tissue, suggesting it is kept because it helps immunity.", "explZh": "闌尾多次獨立出現且未消失，又與較多免疫組織相關，顯示它因有益免疫系統而被保留。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Inferences: complete a hypothesis that a persistent biological trait has been preserved because it confers a benefit.", "vocab": false, "body": "In a 2019 study, biologist Rosalind Achebe and her team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the evolution of the spleen-adjacent &quot;accessory lymph node&quot; structure, an organ present in some fish species but generally thought to have no function. Studying 240 fish species, the team found that the structure has emerged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> across multiple lineages and, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a>, hasn&#x27;t disappeared after emerging in specific lineages. Moreover, the team determined that species with the structure tend to have higher concentrations of antibody-producing cells within it. Therefore, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that the structure likely ______", "bodyPlain": "In a 2019 study, biologist Rosalind Achebe and her tea
