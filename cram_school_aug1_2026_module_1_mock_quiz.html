m investigated the evolution of the spleen-adjacent \"accessory lymph node\" structure, an organ present in some fish species but generally thought to have no function. Studying 240 fish species, the team found that the structure has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the structure tend to have higher concentrations of antibody-producing cells within it. Therefore, the team hypothesized that the structure likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2019 年的一項研究中，生物學家 Rosalind Achebe 與她的團隊研究了脾臟旁「副淋巴結」構造的演化，這是存在於部分魚類體內、但一般認為沒有功能的器官。團隊研究了 240 種魚類，發現這個構造在多個支系中獨立出現，而且重要的是，在特定支系中出現後就沒有消失。此外，團隊確認，擁有這個構造的物種，其構造內往往含有較高濃度的抗體生成細胞。因此，團隊提出假設：這個構造很可能 ______", "opts": {"A": "was once present in many non-fish species but has since disappeared from those lineages.", "B": "has been preserved in certain fish species because it benefits their immune systems.", "C": "will emerge in a greater number of fish species because it may serve a necessary function in digestion.", "D": "produced higher concentrations of antibody-producing cells in fish in the past than it does currently."}, "optsZh": {"A": "曾經存在於許多非魚類物種中，但後來已從那些支系中消失。", "B": "因有益於其免疫系統，而在某些魚類中被保留下來。", "C": "因可能在消化上具有必要功能，將出現在更多魚類物種中。", "D": "過去在魚類身上產生的抗體生成細胞濃度比現在更高。"}, "answer": "B", "expl": "The correlation with antibody-producing cells supports a hypothesis that the structure persists because it aids immunity.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Inferences: complete a hypothesis that a persistent biological trait has been preserved because it confers a benefit.", "vocab": false, "body": "In a 2017 study, biologist Femi Adeyemi and colleagues <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the evolution of the plica semilunaris, a small fold of tissue in the corner of the eye present in some primates but generally thought to have no function. Studying 180 primate species, the team found that the fold has emerged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> across multiple lineages and, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a>, hasn&#x27;t disappeared after emerging in specific lineages. Moreover, the team determined that species with the fold tend to have more effective removal of debris from the eye&#x27;s surface. Therefore, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that the fold likely ______", "bodyPlain": "In a 2017 study, biologist Femi Adeyemi and colleagues investigated the evolution of the plica semilunaris, a small fold of tissue in the corner of the eye present in some primates but generally thought to have no function. Studying 180 primate species, the team found that the fold has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the fold tend to have more effective removal of debris from the eye's surface. Therefore, the team hypothesized that the fold likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2017 年的一項研究中，生物學家 Femi Adeyemi 與同事研究了半月皺襞的演化，這是部分靈長類眼角的一小片組織皺褶，一般認為沒有功能。團隊研究了 180 種靈長類，發現這個皺襞在多個支系中獨立出現，而且重要的是，在特定支系中出現後就沒有消失。此外，團隊確認，擁有這個皺襞的物種，往往能更有效地清除眼球表面的異物。因此，團隊提出假設：這個皺襞很可能 ______", "opts": {"A": "was once present in many non-primate species but has since disappeared from those lineages.", "B": "has been preserved in certain primate species because it benefits eye health.", "C": "will emerge in a greater number of primate species because it may serve a necessary function in vision.", "D": "produced more effective debris removal in primates in the past than it does currently."}, "optsZh": {"A": "曾經存在於許多非靈長類物種中，但後來已從那些支系中消失。", "B": "因有益於眼睛健康，而在某些靈長類中被保留下來。", "C": "因可能在視覺上具有必要功能，將出現在更多靈長類物種中。", "D": "過去在靈長類身上產生的異物清除效果比現在更好。"}, "answer": "B", "expl": "The correlation with debris removal supports a hypothesis that the fold persists because it benefits eye health.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Inferences: complete a hypothesis that a persistent biological trait has been preserved because it confers a benefit.", "vocab": false, "body": "In a 2021 study, biologist Talia Nowak and her team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the evolution of the interdigital webbing found in some rodent species, a trait generally thought to have no function outside of aquatic species. Studying 310 rodent species, the team found that the webbing has emerged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> across multiple lineages and, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a>, hasn&#x27;t disappeared after emerging in specific lineages. Moreover, the team determined that species with the webbing tend to have greater digging efficiency in loose or sandy soil. Therefore, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that the webbing likely ______", "bodyPlain": "In a 2021 study, biologist Talia Nowak and her team investigated the evolution of the interdigital webbing found in some rodent species, a trait generally thought to have no function outside of aquatic species. Studying 310 rodent species, the team found that the webbing has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the webbing tend to have greater digging efficiency in loose or sandy soil. Therefore, the team hypothesized that the webbing likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2021 年的一項研究中，生物學家 Talia Nowak 與她的團隊研究了部分囓齒動物趾間蹼的演化，一般認為這種特徵在水生物種以外沒有功能。團隊研究了 310 種囓齒動物，發現趾間蹼在多個支系中獨立出現，而且重要的是，在特定支系中出現後就沒有消失。此外，團隊確認，有趾間蹼的物種在鬆軟或沙質土壤中挖掘的效率往往較高。因此，團隊提出假設：趾間蹼很可能 ______", "opts": {"A": "was once present in many non-rodent species but has since disappeared from those lineages.", "B": "has been preserved in certain rodent species because it benefits their digging ability.", "C": "will emerge in a greater number of rodent species because it may serve a necessary function in swimming.", "D": "produced greater digging efficiency in rodents in the past than it does currently."}, "optsZh": {"A": "曾經存在於許多非囓齒類物種中，但後來已從那些支系中消失。", "B": "因有益於挖掘能力，而在某些囓齒類中被保留下來。", "C": "因可能在游泳上具有必要功能，將出現在更多囓齒類物種中。", "D": "過去在囓齒類身上產生的挖掘效率比現在更高。"}, "answer": "B", "expl": "The correlation with digging efficiency supports a hypothesis that the webbing persists because it benefits digging.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Inferences: complete a hypothesis that a persistent biological trait has been preserved because it confers a benefit.", "vocab": false, "body": "In a 2015 study, biologist Grace Okafor and colleagues <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the evolution of the vomeronasal organ, a chemosensory structure present in some reptile species but generally thought to have no function outside of a few well-studied groups. Studying 275 reptile species, the team found that the organ has emerged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> across multiple lineages and, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a>, hasn&#x27;t disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have more successful detection of nearby predators. Therefore, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that the organ likely ______", "bodyPlain": "In a 2015 study, biologist Grace Okafor and colleagues investigated the evolution of the vomeronasal organ, a chemosensory structure present in some reptile species but generally thought to have no function outside of a few well-studied groups. Studying 275 reptile species, the team found that the organ has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the organ tend to have more successful detection of nearby predators. Therefore, the team hypothesized that the organ likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2015 年的一項研究中，生物學家 Grace Okafor 與同事研究了犁鼻器的演化，這是部分爬蟲類體內的化學感覺構造，一般認為除了少數研究透徹的類群外沒有功能。團隊研究了 275 種爬蟲類，發現這個器官在多個支系中獨立出現，而且重要的是，在特定支系中出現後就沒有消失。此外，團隊確認，擁有這個器官的物種往往更能成功察覺附近的掠食者。因此，團隊提出假設：這個器官很可能 ______", "opts": {"A": "was once present in many non-reptile species but has since disappeared from those lineages.", "B": "has been preserved in certain reptile species because it benefits predator detection.", "C": "will emerge in a greater number of reptile species because it may serve a necessary function in reproduction.", "D": "produced more successful predator detection in reptiles in the past than it does currently."}, "optsZh": {"A": "曾經存在於許多非爬蟲類物種中，但後來已從那些支系中消失。", "B": "因有益於察覺掠食者，而在某些爬蟲類中被保留下來。", "C": "因可能在繁殖上具有必要功能，將出現在更多爬蟲類物種中。", "D": "過去在爬蟲類身上產生的掠食者偵測成功率比現在更高。"}, "answer": "B", "expl": "The correlation with predator detection supports a hypothesis that the organ persists because it aids survival.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Inferences: complete a hypothesis that a persistent biological trait has been preserved because it confers a benefit.", "vocab": false, "body": "In a 2020 study, biologist Marcus Villanueva and his team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the evolution of the cecal appendage found in some bird species, a structure generally thought to have no function beyond digestion. Studying 190 bird species, the team found that the appendage has emerged <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> across multiple lineages and, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a>, hasn&#x27;t disappeared after emerging in specific lineages. Moreover, the team determined that species with the appendage tend to have higher concentrations of beneficial gut bacteria within it. Therefore, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that the appendage likely ______", "bodyPlain": "In a 2020 study, biologist Marcus Villanueva and his team investigated the evolution of the cecal appendage found in some bird species, a structure generally thought to have no function beyond digestion. Studying 190 bird species, the team found that the appendage has emerged independently across multiple lineages and, significantly, hasn't disappeared after emerging in specific lineages. Moreover, the team determined that species with the appendage tend to have higher concentrations of beneficial gut bacteria within it. Therefore, the team hypothesized that the appendage likely ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2020 年的一項研究中，生物學家 Marcus Villanueva 與他的團隊研究了部分鳥類盲腸附屬構造的演化，一般認為這個構造除了消化之外沒有其他功能。團隊研究了 190 種鳥類，發現這個附屬構造在多個支系中獨立出現，而且重要的是，在特定支系中出現後就沒有消失。此外，團隊確認，擁有這個附屬構造的物種，其構造內往往含有較高濃度的有益腸道細菌。因此，團隊提出假設：這個附屬構造很可能 ______", "opts": {"A": "was once present in many non-bird species but has since disappeared from those lineages.", "B": "has been preserved in certain bird species because it benefits their digestive microbiome.", "C": "will emerge in a greater number of bird species because it may serve a necessary function in flight.", "D": "produced higher concentrations of beneficial gut bacteria in birds in the past than it does currently."}, "optsZh": {"A": "曾經存在於許多非鳥類物種中，但後來已從那些支系中消失。", "B": "因有益於其腸道微生物群，而在某些鳥類中被保留下來。", "C": "因可能在飛行上具有必要功能，將出現在更多鳥類物種中。", "D": "過去在鳥類身上產生的有益腸道細菌濃度比現在更高。"}, "answer": "B", "expl": "The correlation with beneficial gut bacteria supports a hypothesis that the appendage persists because it benefits digestion.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Standard English Conventions (Boundaries): recognize that no punctuation is needed between a subject and its verb.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=harpsichord\" target=\"_blank\" rel=\"noopener\" data-w=\"harpsichord\" data-pos=\"n.\" data-en=\"a keyboard instrument, like an early piano, whose strings are plucked\" data-zh=\"大鍵琴\">harpsichord<\/a> may look just like a piano, but the difference between the two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> is easy to hear. When a harpsichord&#x27;s keys are pressed, the strings inside the ______ are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pluck\" target=\"_blank\" rel=\"noopener\" data-w=\"pluck\" data-pos=\"v.\" data-en=\"to pull a string with your fingers or a small tool\" data-zh=\"撥（弦）\">plucked<\/a>, not struck.", "bodyPlain": "A harpsichord may look just like a piano, but the difference between the two instruments is easy to hear. When a harpsichord's keys are pressed, the strings inside the ______ are plucked, not struck.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "大鍵琴看起來可能跟鋼琴一模一樣，但兩種樂器的差別很容易聽出來。按下大鍵琴的琴鍵時，______ 裡面的琴弦是被撥動的，而不是被敲擊的。", "opts": {"A": "instrument:", "B": "instrument", "C": "instrument—", "D": "instrument,"}, "optsZh": {"A": "樂器（加冒號）", "B": "樂器（無標點）", "C": "樂器（加破折號）", "D": "樂器（加逗號）"}, "answer": "B", "expl": "'The strings inside the instrument' is the subject and 'are plucked' is its verb; no punctuation should separate them.", "explZh": "「the strings inside the instrument」是主詞，「are plucked」是動詞，主詞與動詞之間不加標點。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Standard English Conventions (Boundaries): recognize that no punctuation is needed between a subject and its verb.", "vocab": false, "body": "A trombone may look similar to a trumpet, but the way sound is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produced<\/a> in the two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=differ\" target=\"_blank\" rel=\"noopener\" data-w=\"differ\" data-pos=\"v.\" data-en=\"to be not the same as something else\" data-zh=\"不同；相異\">differs<\/a>. When a trombone&#x27;s slide is extended, the column of air inside the ______ is lengthened, not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=shorten\" target=\"_blank\" rel=\"noopener\" data-w=\"shorten\" data-pos=\"v.\" data-en=\"to make shorter\" data-zh=\"縮短\">shortened<\/a>.", "bodyPlain": "A trombone may look similar to a trumpet, but the way sound is produced in the two instruments differs. When a trombone's slide is extended, the column of air inside the ______ is lengthened, not shortened.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "長號看起來可能跟小號相似，但兩種樂器發聲的方式不同。長號的滑管拉長時，______ 裡面的空氣柱會變長，而不是變短。", "opts": {"A": "instrument:", "B": "instrument", "C": "instrument—", "D": "instrument,"}, "optsZh": {"A": "樂器（加冒號）", "B": "樂器（無標點）", "C": "樂器（加破折號）", "D": "樂器（加逗號）"}, "answer": "B", "expl": "No punctuation should separate \"instrument\" from the verb phrase that follows it.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Standard English Conventions (Boundaries): recognize that no punctuation is needed between a subject and its verb.", "vocab": false, "body": "A kayak may <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resemble\" target=\"_blank\" rel=\"noopener\" data-w=\"resemble\" data-pos=\"v.\" data-en=\"to look like or be similar to\" data-zh=\"相似；像\">resemble<\/a> a canoe at first glance, but the way each is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=propelled\" target=\"_blank\" rel=\"noopener\">propelled<\/a> is easy to tell apart. When a kayak&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=double-bladed\" target=\"_blank\" rel=\"noopener\">double-bladed<\/a> paddle is used, the water on both sides of the ______ is pushed, not pulled.", "bodyPlain": "A kayak may resemble a canoe at first glance, but the way each is propelled is easy to tell apart. When a kayak's double-bladed paddle is used, the water on both sides of the ______ is pushed, not pulled.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "乍看之下，獨木舟（kayak）可能很像加拿大式獨木舟（canoe），但兩者推進的方式很容易分辨。使用 kayak 的雙葉槳時，______ 兩側的水是被推動的，而不是被拉動的。", "opts": {"A": "kayak:", "B": "kayak", "C": "kayak—", "D": "kayak,"}, "optsZh": {"A": "獨木舟（加冒號）", "B": "獨木舟（無標點）", "C": "獨木舟（加破折號）", "D": "獨木舟（加逗號）"}, "answer": "B", "expl": "No punctuation should separate \"kayak\" from the verb phrase that follows it.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Standard English Conventions (Boundaries): recognize that no punctuation is needed between a subject and its verb.", "vocab": false, "body": "A harp may look <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=similar\" target=\"_blank\" rel=\"noopener\">similar<\/a> to a lyre, but the way each <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> sound is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinct\" target=\"_blank\" rel=\"noopener\" data-w=\"distinct\" data-pos=\"adj.\" data-en=\"clearly different or separate\" data-zh=\"不同的；明顯的\">distinct<\/a>. When a harp&#x27;s pedal is pressed, the pitch of the string inside the ______ is raised, not lowered.", "bodyPlain": "A harp may look similar to a lyre, but the way each produces sound is distinct. When a harp's pedal is pressed, the pitch of the string inside the ______ is raised, not lowered.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "豎琴看起來可能和里拉琴相似，但兩者發聲的方式截然不同。踩下豎琴的踏板時，______ 裡面琴弦的音高會升高，而不是降低。", "opts": {"A": "harp:", "B": "harp", "C": "harp—", "D": "harp,"}, "optsZh": {"A": "豎琴（加冒號）", "B": "豎琴（無標點）", "C": "豎琴（加破折號）", "D": "豎琴（加逗號）"}, "answer": "B", "expl": "No punctuation should separate \"harp\" from the verb phrase that follows it.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Standard English Conventions (Boundaries): recognize that no punctuation is needed between a subject and its verb.", "vocab": false, "body": "A pump organ may look like a small piano, but the way sound is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generate\" target=\"_blank\" rel=\"noopener\" data-w=\"generate\" data-pos=\"v.\" data-en=\"to produce\" data-zh=\"產生\">generated<\/a> in the two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=differ\" target=\"_blank\" rel=\"noopener\" data-w=\"differ\" data-pos=\"v.\" data-en=\"to be not the same as something else\" data-zh=\"不同；相異\">differs<\/a>. When a pump organ&#x27;s pedal is pressed, air inside the ______ is forced, not drawn.", "bodyPlain": "A pump organ may look like a small piano, but the way sound is generated in the two instruments differs. When a pump organ's pedal is pressed, air inside the ______ is forced, not drawn.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "簧風琴看起來可能像一台小鋼琴，但兩種樂器產生聲音的方式不同。踩下簧風琴的踏板時，______ 內的空氣是被推送出去的，而不是被吸進來的。", "opts": {"A": "organ:", "B": "organ", "C": "organ—", "D": "organ,"}, "optsZh": {"A": "風琴（加冒號）", "B": "風琴（無標點）", "C": "風琴（加破折號）", "D": "風琴（加逗號）"}, "answer": "B", "expl": "No punctuation should separate \"organ\" from the verb phrase that follows it.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Standard English Conventions (Boundaries): recognize that no punctuation is needed between a subject and its verb.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bagpipe\" target=\"_blank\" rel=\"noopener\">bagpipe<\/a> may look nothing like a flute, but the way each <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continuous\" target=\"_blank\" rel=\"noopener\">continuous<\/a> sound is worth comparing. When a bagpipe&#x27;s bag is squeezed, air stored inside the ______ is released, not held.", "bodyPlain": "A bagpipe may look nothing like a flute, but the way each produces continuous sound is worth comparing. When a bagpipe's bag is squeezed, air stored inside the ______ is released, not held.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "風笛看起來可能完全不像長笛，但兩者產生連續聲音的方式值得比較。擠壓風笛的氣袋時，儲存在 ______ 內的空氣會被釋放，而不是被留住。", "opts": {"A": "bagpipe:", "B": "bagpipe", "C": "bagpipe—", "D": "bagpipe,"}, "optsZh": {"A": "風笛（加冒號）", "B": "風笛（無標點）", "C": "風笛（加破折號）", "D": "風笛（加逗號）"}, "answer": "B", "expl": "No punctuation should separate \"bagpipe\" from the verb phrase that follows it.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Standard English Conventions: subject-verb agreement across an intervening relative clause.", "vocab": false, "body": "&quot;He was just the man for such a place, and it was just the place for such a man.&quot; This line is from Frederick Douglass&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=autobiography\" target=\"_blank\" rel=\"noopener\" data-w=\"autobiography\" data-pos=\"n.\" data-en=\"a book about a person&#x27;s life written by that person\" data-zh=\"自傳\">autobiography<\/a> Narrative of the Life of Frederick Douglass (1845). It&#x27;s an example of antimetabole, a writing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> that ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasis\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasis\" data-pos=\"n.\" data-en=\"special importance or attention given to something\" data-zh=\"強調；重點\">emphasis<\/a> by repeating a statement in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reverse\" target=\"_blank\" rel=\"noopener\" data-w=\"reverse\" data-pos=\"v.\" data-en=\"to change something to its opposite order or direction\" data-zh=\"顛倒；反轉\">reversed<\/a> order.", "bodyPlain": "\"He was just the man for such a place, and it was just the place for such a man.\" This line is from Frederick Douglass's autobiography Narrative of the Life of Frederick Douglass (1845). It's an example of antimetabole, a writing technique that ______ emphasis by repeating a statement in a reversed order.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "「他正是適合這種地方的人，而這裡也正是適合這種人的地方。」這句話出自 Frederick Douglass 的自傳《Frederick Douglass 的人生自述》（1845）。這是交錯配列法（antimetabole）的例子，這種寫作技巧藉由以相反順序重複一句話來 ______ 強調效果。", "opts": {"A": "create", "B": "are creating", "C": "have created", "D": "creates"}, "optsZh": {"A": "創造（原形）", "B": "正在創造（現在進行式，複數）", "C": "已經創造（現在完成式，複數）", "D": "創造（第三人稱單數）"}, "answer": "D", "expl": "The subject of the relative clause is 'technique' (singular), and the text uses present tense, so 'creates' is correct.", "explZh": "關係子句的主詞是單數的「technique」，且全文為現在式，所以用「creates」。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Standard English Conventions: subject-verb agreement across an intervening relative clause.", "vocab": false, "body": "This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> is an example of counterpoint, a compositional <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> that ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=musical\" target=\"_blank\" rel=\"noopener\" data-w=\"musical\" data-pos=\"n.\" data-en=\"a play or film in which singing and dancing tell the story\" data-zh=\"音樂劇\">musical<\/a> interest by layering two or more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> melodic lines against each other.", "bodyPlain": "This structure is an example of counterpoint, a compositional technique that ______ musical interest by layering two or more independent melodic lines against each other.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這種結構是對位法的例子，這種作曲技巧藉由讓兩條以上獨立旋律線彼此交疊來 ______ 音樂的趣味。", "opts": {"A": "create", "B": "are creating", "C": "have created", "D": "creates"}, "optsZh": {"A": "創造（原形）", "B": "正在創造（現在進行式，複數）", "C": "已經創造（現在完成式，複數）", "D": "創造（第三人稱單數）"}, "answer": "D", "expl": "The singular subject \"technique\" requires the singular verb \"creates.\"", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Standard English Conventions: subject-verb agreement across an intervening relative clause.", "vocab": false, "body": "This phrase is an example of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=litotes\" target=\"_blank\" rel=\"noopener\">litotes<\/a>, a rhetorical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=device\" target=\"_blank\" rel=\"noopener\" data-w=\"device\" data-pos=\"n.\" data-en=\"a tool or object made for a particular purpose\" data-zh=\"裝置；器具\">device<\/a> that ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasis\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasis\" data-pos=\"n.\" data-en=\"special importance or attention given to something\" data-zh=\"強調；重點\">emphasis<\/a> by denying the opposite of what is meant.", "bodyPlain": "This phrase is an example of litotes, a rhetorical device that ______ emphasis by denying the opposite of what is meant.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個片語是曲言法（litotes）的例子，這種修辭手法藉由否定所要表達意思的反面來 ______ 強調效果。", "opts": {"A": "achieve", "B": "are achieving", "C": "have achieved", "D": "achieves"}, "optsZh": {"A": "達成（原形）", "B": "正在達成（現在進行式，複數）", "C": "已經達成（現在完成式，複數）", "D": "達成（第三人稱單數）"}, "answer": "D", "expl": "The singular subject \"device\" requires the singular verb \"achieves.\"", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Standard English Conventions: subject-verb agreement across an intervening relative clause.", "vocab": false, "body": "This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=maneuver\" target=\"_blank\" rel=\"noopener\">maneuver<\/a> is an example of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tacking\" target=\"_blank\" rel=\"noopener\">tacking<\/a>, a sailing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> that ______ forward progress by angling a boat in a zigzag pattern against the wind.", "bodyPlain": "This maneuver is an example of tacking, a sailing technique that ______ forward progress by angling a boat in a zigzag pattern against the wind.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個操作是搶風航行的例子，這種航海技巧藉由讓船以之字形角度逆風行進來 ______ 前進的進度。", "opts": {"A": "allow", "B": "are allowing", "C": "have allowed", "D": "allows"}, "optsZh": {"A": "使能夠（原形）", "B": "正在使能夠（現在進行式，複數）", "C": "已經使能夠（現在完成式，複數）", "D": "使能夠（第三人稱單數）"}, "answer": "D", "expl": "The singular subject \"technique\" requires the singular verb \"allows.\"", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Standard English Conventions: subject-verb agreement across an intervening relative clause.", "vocab": false, "body": "This method is an example of crop <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rotation\" target=\"_blank\" rel=\"noopener\">rotation<\/a>, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=farming\" target=\"_blank\" rel=\"noopener\">farming<\/a> practice that ______ soil fertility by alternating which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nutrient\" target=\"_blank\" rel=\"noopener\" data-w=\"nutrient\" data-pos=\"n.\" data-en=\"a substance that living things need to grow\" data-zh=\"養分\">nutrients<\/a> different plants draw from the ground each season.", "bodyPlain": "This method is an example of crop rotation, a farming practice that ______ soil fertility by alternating which nutrients different plants draw from the ground each season.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個方法是輪作的例子，這種農耕做法藉由每季輪替不同植物從土壤中吸收的養分來 ______ 土壤肥力。", "opts": {"A": "preserve", "B": "are preserving", "C": "have preserved", "D": "preserves"}, "optsZh": {"A": "保存（原形）", "B": "正在保存（現在進行式，複數）", "C": "已經保存（現在完成式，複數）", "D": "保存（第三人稱單數）"}, "answer": "D", "expl": "The singular subject \"practice\" requires the singular verb \"preserves.\"", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Standard English Conventions: subject-verb agreement across an intervening relative clause.", "vocab": false, "body": "This pattern is an example of chiaroscuro, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">painting<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> that ______ depth by placing strong <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contrast\" target=\"_blank\" rel=\"noopener\" data-w=\"contrast\" data-pos=\"v.\" data-en=\"to compare in order to show differences\" data-zh=\"對比；對照\">contrasts<\/a> of light and shadow side by side.", "bodyPlain": "This pattern is an example of chiaroscuro, a painting technique that ______ depth by placing strong contrasts of light and shadow side by side.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這種模式是明暗對照法的例子，這種繪畫技巧藉由將強烈的光影對比並列來 ______ 深度感。", "opts": {"A": "suggest", "B": "are suggesting", "C": "have suggested", "D": "suggests"}, "optsZh": {"A": "暗示（原形）", "B": "正在暗示（現在進行式，複數）", "C": "已經暗示（現在完成式，複數）", "D": "暗示（第三人稱單數）"}, "answer": "D", "expl": "The singular subject \"technique\" requires the singular verb \"suggests.\"", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Standard English Conventions: render an embedded/indirect question as a declarative statement, not a direct question.", "vocab": false, "body": "Technologies such as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=microphones\" target=\"_blank\" rel=\"noopener\">microphones<\/a> and inkjet printers are made using piezoelectric materials, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generate\" target=\"_blank\" rel=\"noopener\" data-w=\"generate\" data-pos=\"v.\" data-en=\"to produce\" data-zh=\"產生\">generate<\/a> an internal electric field when pressure is applied to them. The toxic nature of some of these materials recently led a team from the University of Sheffield to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> how ______.", "bodyPlain": "Technologies such as microphones and inkjet printers are made using piezoelectric materials, which generate an internal electric field when pressure is applied to them. The toxic nature of some of these materials recently led a team from the University of Sheffield to investigate how ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "麥克風和噴墨印表機等科技產品是用壓電材料製成的，這種材料在受到壓力時會產生內部電場。其中某些材料具有毒性，最近促使謝菲爾德大學的一支團隊研究 ______。", "opts": {"A": "could their use be better regulated?", "B": "their use could be better regulated.", "C": "their use could be better regulated?", "D": "could their use be better regulated."}, "optsZh": {"A": "它們的使用能否被更好地規範？（倒裝語序＋問號）", "B": "它們的使用可以如何被更好地規範。（直述語序＋句號）", "C": "它們的使用可以如何被更好地規範？（直述語序＋問號）", "D": "它們的使用能否被更好地規範。（倒裝語序＋句號）"}, "answer": "B", "expl": "An indirect (embedded) question uses statement word order and ends with a period: 'how their use could be better regulated.'", "explZh": "間接問句要用直述句語序，並以句號結尾：「how their use could be better regulated.」"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Standard English Conventions: render an embedded/indirect question as a declarative statement, not a direct question.", "vocab": false, "body": "Concerns about soil <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=erosion\" target=\"_blank\" rel=\"noopener\" data-w=\"erosion\" data-pos=\"n.\" data-en=\"the gradual wearing away of rock or soil\" data-zh=\"侵蝕\">erosion<\/a> on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hillside\" target=\"_blank\" rel=\"noopener\">hillside<\/a> recently led a team of agronomists to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> how ______.", "bodyPlain": "Concerns about soil erosion on the hillside recently led a team of agronomists to investigate how ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "對山坡土壤侵蝕的擔憂，最近促使一支農學家團隊研究 ______。", "opts": {"A": "could terraced planting reduce runoff?", "B": "terraced planting could reduce runoff.", "C": "terraced planting could reduce runoff?", "D": "could terraced planting reduce runoff."}, "optsZh": {"A": "梯田種植能否減少逕流？（倒裝語序＋問號）", "B": "梯田種植能如何減少逕流。（直述語序＋句號）", "C": "梯田種植能如何減少逕流？（直述語序＋問號）", "D": "梯田種植能否減少逕流。（倒裝語序＋句號）"}, "answer": "B", "expl": "An indirect question after \"investigate how\" takes declarative word order and ends with a period.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Standard English Conventions: render an embedded/indirect question as a declarative statement, not a direct question.", "vocab": false, "body": "Reports of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=declining\" target=\"_blank\" rel=\"noopener\" data-w=\"declining\" data-pos=\"adj.\" data-en=\"becoming smaller or weaker\" data-zh=\"下降的；衰退的\">declining<\/a> bee <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> recently led a team of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ecologist\" target=\"_blank\" rel=\"noopener\" data-w=\"ecologist\" data-pos=\"n.\" data-en=\"a scientist who studies the relationship between living things and their environment\" data-zh=\"生態學家\">ecologists<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> whether ______.", "bodyPlain": "Reports of declining bee populations recently led a team of ecologists to investigate whether ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "蜜蜂數量下降的報告，最近促使一支生態學家團隊研究 ______。", "opts": {"A": "were pesticide residues affecting hive survival?", "B": "pesticide residues were affecting hive survival.", "C": "pesticide residues were affecting hive survival?", "D": "were pesticide residues affecting hive survival."}, "optsZh": {"A": "農藥殘留是否影響蜂巢存活？（倒裝語序＋問號）", "B": "農藥殘留如何影響蜂巢存活。（直述語序＋句號）", "C": "農藥殘留如何影響蜂巢存活？（直述語序＋問號）", "D": "農藥殘留是否影響蜂巢存活。（倒裝語序＋句號）"}, "answer": "B", "expl": "An indirect question after \"investigate whether\" takes declarative word order and ends with a period.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Standard English Conventions: render an embedded/indirect question as a declarative statement, not a direct question.", "vocab": false, "body": "Unusual <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cracking\" target=\"_blank\" rel=\"noopener\">cracking<\/a> in the bridge&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=supports\" target=\"_blank\" rel=\"noopener\">supports<\/a> recently led a team of engineers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> how ______.", "bodyPlain": "Unusual cracking in the bridge's supports recently led a team of engineers to investigate how ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "橋梁支柱出現不尋常的裂縫，最近促使一支工程師團隊研究 ______。", "opts": {"A": "could the load limits be safely adjusted?", "B": "the load limits could be safely adjusted.", "C": "the load limits could be safely adjusted?", "D": "could the load limits be safely adjusted."}, "optsZh": {"A": "載重限制能否安全地調整？（倒裝語序＋問號）", "B": "載重限制可以如何安全地調整。（直述語序＋句號）", "C": "載重限制可以如何安全地調整？（直述語序＋問號）", "D": "載重限制能否安全地調整。（倒裝語序＋句號）"}, "answer": "B", "expl": "An indirect question after \"investigate how\" takes declarative word order and ends with a period.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Standard English Conventions: render an embedded/indirect question as a declarative statement, not a direct question.", "vocab": false, "body": "Rising rates of a rare eye <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">condition<\/a> recently led a team of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ophthalmologists\" target=\"_blank\" rel=\"noopener\">ophthalmologists<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> whether ______.", "bodyPlain": "Rising rates of a rare eye condition recently led a team of ophthalmologists to investigate whether ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一種罕見眼疾的發生率上升，最近促使一支眼科醫師團隊研究 ______。", "opts": {"A": "was screen time a contributing factor?", "B": "screen time was a contributing factor.", "C": "screen time was a contributing factor?", "D": "was screen time a contributing factor."}, "optsZh": {"A": "螢幕使用時間是否為促成因素？（倒裝語序＋問號）", "B": "螢幕使用時間是否為促成因素。（直述語序＋句號）", "C": "螢幕使用時間是否為促成因素？（直述語序＋問號）", "D": "螢幕使用時間是否為促成因素。（倒裝語序＋句號）"}, "answer": "B", "expl": "An indirect question after \"investigate whether\" takes declarative word order and ends with a period.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Standard English Conventions: render an embedded/indirect question as a declarative statement, not a direct question.", "vocab": false, "body": "Complaints about slow <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=checkout\" target=\"_blank\" rel=\"noopener\">checkout<\/a> lines recently led a team of store <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manager\" target=\"_blank\" rel=\"noopener\" data-w=\"manager\" data-pos=\"n.\" data-en=\"a person who controls a business or team\" data-zh=\"經理；管理者\">managers<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> how ______.", "bodyPlain": "Complaints about slow checkout lines recently led a team of store managers to investigate how ______.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "對結帳隊伍緩慢的抱怨，最近促使一群商店經理研究 ______。", "opts": {"A": "could wait times be shortened?", "B": "wait times could be shortened.", "C": "wait times could be shortened?", "D": "could wait times be shortened."}, "optsZh": {"A": "等待時間能否縮短？（倒裝語序＋問號）", "B": "等待時間可以如何縮短。（直述語序＋句號）", "C": "等待時間可以如何縮短？（直述語序＋問號）", "D": "等待時間能否縮短。（倒裝語序＋句號）"}, "answer": "B", "expl": "An indirect question after \"investigate how\" takes declarative word order and ends with a period.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English Conventions: use the simple present tense to match an ongoing, present-tense description of how a structure works.", "vocab": false, "body": "Each night in Girona, Spain, a section of the city&#x27;s marina is bathed in a soft green glow. The source of the glow is the Arbol de la Sidra, a large <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculpture<\/a> made up of 3,200 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recycled\" target=\"_blank\" rel=\"noopener\" data-w=\"recycled\" data-pos=\"adj.\" data-en=\"made from used materials that have been processed again\" data-zh=\"回收再利用的\">recycled<\/a> glass bottles. A lamp inside the tree-shaped <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> ______ the green glass.", "bodyPlain": "Each night in Girona, Spain, a section of the city's marina is bathed in a soft green glow. The source of the glow is the Arbol de la Sidra, a large sculpture made up of 3,200 recycled glass bottles. A lamp inside the tree-shaped structure ______ the green glass.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "每天晚上，在西班牙赫羅納，城市碼頭的一部分會籠罩在柔和的綠色光芒中。光芒來自 Arbol de la Sidra，一座由 3,200 個回收玻璃瓶組成的大型雕塑。這座樹形結構內部的一盞燈 ______ 綠色玻璃。", "opts": {"A": "will be illuminating", "B": "illuminates", "C": "would illuminate", "D": "illuminated"}, "optsZh": {"A": "將會正在照亮（未來進行式）", "B": "照亮（第三人稱單數）", "C": "會照亮（would＋原形）", "D": "照亮了（過去式）"}, "answer": "B", "expl": "The passage describes what happens each night in the present tense, so the simple present 'illuminates' fits.", "explZh": "文章用現在式描述每晚的情況，所以用簡單現在式「illuminates」。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English Conventions: use the simple present tense to match an ongoing, present-tense description of how a structure works.", "vocab": false, "body": "Each <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evening\" target=\"_blank\" rel=\"noopener\">evening<\/a> in Lyon, France, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stretch\" target=\"_blank\" rel=\"noopener\">stretch<\/a> of the city&#x27;s riverfront glows a soft amber. The source of the glow is La Lanterne, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculpture<\/a> made of hundreds of stacked glass panels. A row of LED fixtures inside the panel-covered frame ______ the glass.", "bodyPlain": "Each evening in Lyon, France, a stretch of the city's riverfront glows a soft amber. The source of the glow is La Lanterne, a sculpture made of hundreds of stacked glass panels. A row of LED fixtures inside the panel-covered frame ______ the glass.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "每天傍晚，在法國里昂，城市的一段河岸會發出柔和的琥珀色光芒。光芒來自 La Lanterne，一座由數百片堆疊玻璃板構成的雕塑。覆滿玻璃板的框架內有一排 LED 燈具 ______ 這些玻璃。", "opts": {"A": "will be lighting", "B": "lights", "C": "would light", "D": "lit"}, "optsZh": {"A": "將會正在點亮（未來進行式）", "B": "點亮（第三人稱單數）", "C": "會點亮（would＋原形）", "D": "點亮了（過去式）"}, "answer": "B", "expl": "The surrounding present-tense description calls for the simple present verb \"lights.\"", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English Conventions: use the simple present tense to match an ongoing, present-tense description of how a structure works.", "vocab": false, "body": "Each morning in a quiet courtyard in Kyoto, a shallow basin fills with a thin sheet of water. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mechanism\" target=\"_blank\" rel=\"noopener\" data-w=\"mechanism\" data-pos=\"n.\" data-en=\"a set of moving parts in a machine that perform a function\" data-zh=\"機械裝置；機制\">mechanism<\/a> behind the basin is a bamboo <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=device\" target=\"_blank\" rel=\"noopener\" data-w=\"device\" data-pos=\"n.\" data-en=\"a tool or object made for a particular purpose\" data-zh=\"裝置；器具\">device<\/a> called a shishi-odoshi. A slow <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trickle\" target=\"_blank\" rel=\"noopener\" data-w=\"trickle\" data-pos=\"v.\" data-en=\"to flow slowly in a thin stream\" data-zh=\"滴流；細流\">trickle<\/a> of water from a nearby spring ______ the bamboo tube until it tips and strikes a stone.", "bodyPlain": "Each morning in a quiet courtyard in Kyoto, a shallow basin fills with a thin sheet of water. The mechanism behind the basin is a bamboo device called a shishi-odoshi. A slow trickle of water from a nearby spring ______ the bamboo tube until it tips and strikes a stone.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "每天早上，在京都一處安靜的庭院裡，一個淺水盆會蓄滿薄薄一層水。水盆背後的裝置是一種叫做「鹿威」的竹製機關。附近泉水緩緩流下的細流 ______ 竹筒，直到竹筒傾倒並敲擊石頭。", "opts": {"A": "will be filling", "B": "fills", "C": "would fill", "D": "filled"}, "optsZh": {"A": "將會正在填滿（未來進行式）", "B": "填滿（第三人稱單數）", "C": "會填滿（would＋原形）", "D": "填滿了（過去式）"}, "answer": "B", "expl": "The surrounding present-tense description calls for the simple present verb \"fills.\"", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English Conventions: use the simple present tense to match an ongoing, present-tense description of how a structure works.", "vocab": false, "body": "Each night in a small plaza in Valencia, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fountain\" target=\"_blank\" rel=\"noopener\">fountain<\/a> shifts through shades of blue and violet. The source of the color is a ring of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=submerged\" target=\"_blank\" rel=\"noopener\">submerged<\/a> LED panels. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=control\" target=\"_blank\" rel=\"noopener\">control<\/a> box hidden beneath the fountain&#x27;s base ______ the sequence of colors.", "bodyPlain": "Each night in a small plaza in Valencia, a fountain shifts through shades of blue and violet. The source of the color is a ring of submerged LED panels. A control box hidden beneath the fountain's base ______ the sequence of colors.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "每天晚上，在瓦倫西亞一處小廣場，一座噴泉會在藍色與紫色之間變換色調。顏色來自一圈沉在水中的 LED 燈板。藏在噴泉底座下方的控制箱 ______ 顏色變化的順序。", "opts": {"A": "will be adjusting", "B": "adjusts", "C": "would adjust", "D": "adjusted"}, "optsZh": {"A": "將會正在調整（未來進行式）", "B": "調整（第三人稱單數）", "C": "會調整（would＋原形）", "D": "調整了（過去式）"}, "answer": "B", "expl": "The surrounding present-tense description calls for the simple present verb \"adjusts.\"", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English Conventions: use the simple present tense to match an ongoing, present-tense description of how a structure works.", "vocab": false, "body": "Each <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=afternoon\" target=\"_blank\" rel=\"noopener\">afternoon<\/a> on a hillside outside Florence, a row of mirrors tracks the sun across an olive grove. The system behind the mirrors is a set of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=solar\" target=\"_blank\" rel=\"noopener\" data-w=\"solar\" data-pos=\"adj.\" data-en=\"relating to the Sun\" data-zh=\"太陽的\">solar<\/a> concentrators. A simple gear <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mechanism\" target=\"_blank\" rel=\"noopener\" data-w=\"mechanism\" data-pos=\"n.\" data-en=\"a set of moving parts in a machine that perform a function\" data-zh=\"機械裝置；機制\">mechanism<\/a> inside each unit&#x27;s base ______ the angle of the mirror throughout the day.", "bodyPlain": "Each afternoon on a hillside outside Florence, a row of mirrors tracks the sun across an olive grove. The system behind the mirrors is a set of solar concentrators. A simple gear mechanism inside each unit's base ______ the angle of the mirror throughout the day.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "每天下午，在佛羅倫斯郊外的山坡上，一排鏡子會隨著太陽移動，追蹤越過橄欖園的陽光。鏡子背後的系統是一組太陽能聚光器。每個裝置底座內的簡單齒輪機構，會在一天之中 ______ 鏡子的角度。", "opts": {"A": "will be shifting", "B": "shifts", "C": "would shift", "D": "shifted"}, "optsZh": {"A": "將會正在改變（未來進行式）", "B": "改變（第三人稱單數）", "C": "會改變（would＋原形）", "D": "改變了（過去式）"}, "answer": "B", "expl": "The surrounding present-tense description calls for the simple present verb \"shifts.\"", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English Conventions: use the simple present tense to match an ongoing, present-tense description of how a structure works.", "vocab": false, "body": "Each night in a garden <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=outside\" target=\"_blank\" rel=\"noopener\">outside<\/a> Seoul, a row of paper <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=lanterns\" target=\"_blank\" rel=\"noopener\">lanterns<\/a> glows a warm orange. The source of the light is a small candle sealed inside a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=wind-resistant\" target=\"_blank\" rel=\"noopener\">wind-resistant<\/a> frame. A ring of vents built into the lantern&#x27;s base ______ the flame from gusts of wind.", "bodyPlain": "Each night in a garden outside Seoul, a row of paper lanterns glows a warm orange. The source of the light is a small candle sealed inside a wind-resistant frame. A ring of vents built into the lantern's base ______ the flame from gusts of wind.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "每天晚上，在首爾郊外的一座花園裡，一排紙燈籠發出溫暖的橘色光芒。光源是封在防風框架內的一小根蠟燭。燈籠底座內建的一圈通風孔 ______ 火焰免受強風吹襲。", "opts": {"A": "will be shielding", "B": "shields", "C": "would shield", "D": "shielded"}, "optsZh": {"A": "將會正在保護（未來進行式）", "B": "保護（第三人稱單數）", "C": "會保護（would＋原形）", "D": "保護了（過去式）"}, "answer": "B", "expl": "The surrounding present-tense description calls for the simple present verb \"shields.\"", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English Conventions: pronoun-antecedent agreement (its vs. their) with correct possessive apostrophe placement.", "vocab": false, "body": "French <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=philosopher\" target=\"_blank\" rel=\"noopener\" data-w=\"philosopher\" data-pos=\"n.\" data-en=\"a person who studies ideas about knowledge, truth, and life\" data-zh=\"哲學家\">philosopher<\/a> Rene Descartes doubted whether he could prove his own <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=existence\" target=\"_blank\" rel=\"noopener\" data-w=\"existence\" data-pos=\"n.\" data-en=\"the fact of being real or present\" data-zh=\"存在\">existence<\/a>. Eventually, he found proof in his famous phrase &quot;I think, therefore I am.&quot; The ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complexity\" target=\"_blank\" rel=\"noopener\" data-w=\"complexity\" data-pos=\"n.\" data-en=\"the state of having many connected parts; being complicated\" data-zh=\"複雜性\">complexity<\/a>: only those who exist would be able to ponder their existence.", "bodyPlain": "French philosopher Rene Descartes doubted whether he could prove his own existence. Eventually, he found proof in his famous phrase \"I think, therefore I am.\" The ______ complexity: only those who exist would be able to ponder their existence.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "法國哲學家 René Descartes 曾懷疑自己是否能證明自身的存在。最後，他在著名的「我思故我在」這句話中找到了證明。______ 複雜性：只有存在的人才能思考自己的存在。", "opts": {"A": "phrases simplicity masks its", "B": "phrases simplicity masks their", "C": "phrase's simplicity masks their", "D": "phrase's simplicity masks its"}, "optsZh": {"A": "片語（複數、無所有格）簡單掩蓋了它的", "B": "片語（複數、無所有格）簡單掩蓋了它們的", "C": "這個片語（單數所有格）的簡單掩蓋了它們的（複數）", "D": "這個片語（單數所有格）的簡單掩蓋了它的（單數）"}, "answer": "D", "expl": "One phrase owns the simplicity, so use singular possessive 'phrase's'; the complexity is the phrase's too, so use singular 'its.'", "explZh": "單一個片語擁有「簡單」，用單數所有格「phrase's」；複雜性也屬於這個片語，用單數代名詞「its」。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English Conventions: pronoun-antecedent agreement (its vs. their) with correct possessive apostrophe placement.", "vocab": false, "body": "French <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematician\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematician\" data-pos=\"n.\" data-en=\"an expert in mathematics\" data-zh=\"數學家\">mathematician<\/a> Henri Poincare once mused that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intuition\" target=\"_blank\" rel=\"noopener\">intuition<\/a> often outruns proof. The remark&#x27;s brevity masks ______ depth: only those who have wrestled with an unproven <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conjecture\" target=\"_blank\" rel=\"noopener\" data-w=\"conjecture\" data-pos=\"n.\" data-en=\"a guess or opinion based on incomplete information\" data-zh=\"推測\">conjecture<\/a> would fully grasp what he meant.", "bodyPlain": "French mathematician Henri Poincare once mused that intuition often outruns proof. The remark's brevity masks ______ depth: only those who have wrestled with an unproven conjecture would fully grasp what he meant.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "法國數學家 Henri Poincaré 曾沉思道，直覺往往跑得比證明快。這句話的簡短掩蓋了 ______ 深度：只有曾經苦思過某個未獲證明之猜想的人，才能完全理解他的意思。", "opts": {"A": "remarks brevity masks their", "B": "remarks brevity masks its", "C": "remark's brevity masks their", "D": "remark's brevity masks its"}, "optsZh": {"A": "話語（複數、無所有格）簡短掩蓋了它們的", "B": "話語（複數、無所有格）簡短掩蓋了它的", "C": "這句話（單數所有格）的簡短掩蓋了它們的（複數）", "D": "這句話（單數所有格）的簡短掩蓋了它的（單數）"}, "answer": "D", "expl": "The singular possessive \"remark's\" needs the singular pronoun \"its\" to agree with it.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English Conventions: pronoun-antecedent agreement (its vs. their) with correct possessive apostrophe placement.", "vocab": false, "body": "The engineer&#x27;s motto was that a bridge should disappear into its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscape<\/a>. The saying&#x27;s plainness masks ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ambition\" target=\"_blank\" rel=\"noopener\" data-w=\"ambition\" data-pos=\"n.\" data-en=\"a strong desire to achieve something\" data-zh=\"抱負；雄心\">ambition<\/a>: only those who have designed a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> meant to vanish would appreciate the difficulty involved.", "bodyPlain": "The engineer's motto was that a bridge should disappear into its landscape. The saying's plainness masks ______ ambition: only those who have designed a structure meant to vanish would appreciate the difficulty involved.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這位工程師的座右銘是：橋梁應該融入它所在的地景中，彷彿消失不見。這句話的樸實掩蓋了 ______ 抱負：只有設計過一座要讓它「消失」的結構的人，才能體會其中的難度。", "opts": {"A": "sayings plainness masks their", "B": "sayings plainness masks its", "C": "saying's plainness masks their", "D": "saying's plainness masks its"}, "optsZh": {"A": "話語（複數、無所有格）樸實掩蓋了它們的", "B": "話語（複數、無所有格）樸實掩蓋了它的", "C": "這句話（單數所有格）的樸實掩蓋了它們的（複數）", "D": "這句話（單數所有格）的樸實掩蓋了它的（單數）"}, "answer": "D", "expl": "The singular possessive \"saying's\" needs the singular pronoun \"its\" to agree with it.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English Conventions: pronoun-antecedent agreement (its vs. their) with correct possessive apostrophe placement.", "vocab": false, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proverb\" target=\"_blank\" rel=\"noopener\">proverb<\/a> held that a still pond <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reflects\" target=\"_blank\" rel=\"noopener\">reflects<\/a> best. The proverb&#x27;s shortness masks ______ subtlety: only those who have sat by genuinely still water would notice how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=precise\" target=\"_blank\" rel=\"noopener\" data-w=\"precise\" data-pos=\"adj.\" data-en=\"exact and accurate\" data-zh=\"精確的\">precisely<\/a> it describes calm reflection.", "bodyPlain": "The proverb held that a still pond reflects best. The proverb's shortness masks ______ subtlety: only those who have sat by genuinely still water would notice how precisely it describes calm reflection.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這句諺語說，靜止的池塘最能映照倒影。這句諺語的簡短掩蓋了 ______ 微妙之處：只有真正坐在靜水旁的人，才會注意到它多麼精準地描述了平靜的倒影。", "opts": {"A": "proverbs shortness masks their", "B": "proverbs shortness masks its", "C": "proverb's shortness masks their", "D": "proverb's shortness masks its"}, "optsZh": {"A": "諺語（複數、無所有格）簡短掩蓋了它們的", "B": "諺語（複數、無所有格）簡短掩蓋了它的", "C": "這句諺語（單數所有格）的簡短掩蓋了它們的（複數）", "D": "這句諺語（單數所有格）的簡短掩蓋了它的（單數）"}, "answer": "D", "expl": "The singular possessive \"proverb's\" needs the singular pronoun \"its\" to agree with it.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English Conventions: pronoun-antecedent agreement (its vs. their) with correct possessive apostrophe placement.", "vocab": false, "body": "The theorem states that every bounded sequence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> a convergent subsequence. The statement&#x27;s compactness masks ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a>: only those who have tried to prove it from scratch would appreciate how much it actually <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a>.", "bodyPlain": "The theorem states that every bounded sequence contains a convergent subsequence. The statement's compactness masks ______ significance: only those who have tried to prove it from scratch would appreciate how much it actually claims.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個定理指出，每一個有界數列都含有一個收斂的子數列。這個敘述的簡潔掩蓋了 ______ 重要性：只有試過從頭證明它的人，才能體會它實際上主張了多少。", "opts": {"A": "statements compactness masks their", "B": "statements compactness masks its", "C": "statement's compactness masks their", "D": "statement's compactness masks its"}, "optsZh": {"A": "敘述（複數、無所有格）簡潔掩蓋了它們的", "B": "敘述（複數、無所有格）簡潔掩蓋了它的", "C": "這個敘述（單數所有格）的簡潔掩蓋了它們的（複數）", "D": "這個敘述（單數所有格）的簡潔掩蓋了它的（單數）"}, "answer": "D", "expl": "The singular possessive \"statement's\" needs the singular pronoun \"its\" to agree with it.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English Conventions: pronoun-antecedent agreement (its vs. their) with correct possessive apostrophe placement.", "vocab": false, "body": "The riddle asked what walks on four legs, then two, then three. The riddle&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=simplicity\" target=\"_blank\" rel=\"noopener\">simplicity<\/a> masks ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cleverness\" target=\"_blank\" rel=\"noopener\">cleverness<\/a>: only those who have puzzled over its shifting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">image<\/a> of a single life would see how tightly it is constructed.", "bodyPlain": "The riddle asked what walks on four legs, then two, then three. The riddle's simplicity masks ______ cleverness: only those who have puzzled over its shifting image of a single life would see how tightly it is constructed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個謎語問：什麼東西先用四條腿走路，然後用兩條，最後用三條？這個謎語的簡單掩蓋了 ______ 巧妙：只有苦思過它以變化的形象描繪一生的人，才會看出它的結構多麼緊密。", "opts": {"A": "riddles simplicity masks their", "B": "riddles simplicity masks its", "C": "riddle's simplicity masks their", "D": "riddle's simplicity masks its"}, "optsZh": {"A": "謎語（複數、無所有格）簡單掩蓋了它們的", "B": "謎語（複數、無所有格）簡單掩蓋了它的", "C": "這個謎語（單數所有格）的簡單掩蓋了它們的（複數）", "D": "這個謎語（單數所有格）的簡單掩蓋了它的（單數）"}, "answer": "D", "expl": "The singular possessive \"riddle's\" needs the singular pronoun \"its\" to agree with it.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English Conventions (Boundaries): no comma is needed before a restrictive appositive that specifies exactly which one.", "vocab": false, "body": "Fans of the film Moana (2016) may not know that the deep and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=humorous\" target=\"_blank\" rel=\"noopener\" data-w=\"humorous\" data-pos=\"adj.\" data-en=\"funny and amusing\" data-zh=\"幽默的\">humorous<\/a> voice behind the ______ belongs to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=comedian\" target=\"_blank\" rel=\"noopener\" data-w=\"comedian\" data-pos=\"n.\" data-en=\"a performer whose job is to make people laugh\" data-zh=\"喜劇演員\">comedian<\/a>, actor, and musician Jemaine Clement. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=versatile\" target=\"_blank\" rel=\"noopener\" data-w=\"versatile\" data-pos=\"adj.\" data-en=\"able to be used in many different ways\" data-zh=\"多用途的；多才多藝的\">versatile<\/a> performer has appeared in everything from television <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercials<\/a> to action movies, but voice acting, specifically, has become a notable part of his career.", "bodyPlain": "Fans of the film Moana (2016) may not know that the deep and humorous voice behind the ______ belongs to comedian, actor, and musician Jemaine Clement. The versatile performer has appeared in everything from television commercials to action movies, but voice acting, specifically, has become a notable part of his career.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "電影《海洋奇緣》（2016）的影迷可能不知道，______ 背後那低沉又幽默的聲音，屬於喜劇演員、演員兼音樂家 Jemaine Clement。這位多才多藝的表演者從電視廣告到動作片都曾參與演出，但特別是配音工作，已成為他演藝生涯中的重要部分。", "opts": {"A": "character Tamatoa the crab", "B": "character Tamatoa the crab,", "C": "character: Tamatoa the crab", "D": "character, Tamatoa the crab"}, "optsZh": {"A": "角色 Tamatoa the crab（無標點）", "B": "角色 Tamatoa the crab（後加逗號）", "C": "角色：Tamatoa the crab（前加冒號）", "D": "角色，Tamatoa the crab（前加逗號）"}, "answer": "A", "expl": "'Tamatoa the crab' identifies which character, so it is essential and takes no comma; the whole phrase 'the voice behind the character Tamatoa the crab' is the subject, so no punctuation goes before the verb 'belongs.'", "explZh": "「Tamatoa the crab」是限定性同位語，指明是哪個角色，不可用逗號隔開，且主詞與動詞「belongs」之間也不加標點。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English Conventions (Boundaries): no comma is needed before a restrictive appositive that specifies exactly which one.", "vocab": false, "body": "Fans of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=animated\" target=\"_blank\" rel=\"noopener\">animated<\/a> series Wildwood Hollow may not know that the gravelly, world-weary voice behind the ______ belongs to actor and singer Odalys Fenn, who has otherwise built a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=career\" target=\"_blank\" rel=\"noopener\" data-w=\"career\" data-pos=\"n.\" data-en=\"the series of jobs a person has in their working life\" data-zh=\"職業生涯\">career<\/a> almost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> on romantic comedies.", "bodyPlain": "Fans of the animated series Wildwood Hollow may not know that the gravelly, world-weary voice behind the ______ belongs to actor and singer Odalys Fenn, who has otherwise built a career almost entirely on romantic comedies.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "動畫影集《Wildwood Hollow》的觀眾可能不知道，______ 背後那沙啞、飽經世故的聲音，屬於演員兼歌手 Odalys Fenn，而她其他的演藝生涯幾乎都建立在浪漫喜劇上。", "opts": {"A": "character Grumble the badger", "B": "character Grumble the badger,", "C": "character: Grumble the badger", "D": "character, Grumble the badger"}, "optsZh": {"A": "角色 Grumble the badger（無標點）", "B": "角色 Grumble the badger（後加逗號）", "C": "角色：Grumble the badger（前加冒號）", "D": "角色，Grumble the badger（前加逗號）"}, "answer": "A", "expl": "\"Grumble the badger\" restrictively specifies which character, so no punctuation should separate it from \"character.\"", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English Conventions (Boundaries): no comma is needed before a restrictive appositive that specifies exactly which one.", "vocab": false, "body": "Fans of the theme park&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nightly\" target=\"_blank\" rel=\"noopener\">nightly<\/a> parade may not know that the towering, illuminated ______ was designed by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculptor\" target=\"_blank\" rel=\"noopener\" data-w=\"sculptor\" data-pos=\"n.\" data-en=\"an artist who makes sculptures\" data-zh=\"雕塑家\">sculptor<\/a> Rafael Quintero, who is better known for small, delicate glasswork than for large public <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a>.", "bodyPlain": "Fans of the theme park's nightly parade may not know that the towering, illuminated ______ was designed by sculptor Rafael Quintero, who is better known for small, delicate glasswork than for large public installations.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "主題樂園夜間遊行的粉絲可能不知道，那高聳發亮的 ______ 是由雕塑家 Rafael Quinter
