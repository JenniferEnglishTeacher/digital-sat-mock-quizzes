" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> claim about the inception of tectonic movement must rest on empirical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> from the geological record. Researcher Wriju Chowdhury and his team analyzed the geochemistry of zircon crystals to gain insight into the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> composition of the magma from which the crystals formed and, based on the data, compellingly argue that plate tectonics may have been occurring as early as 4.2 billion years ago.", "bodyPlain": "Text 1\nLittle is known about how plate tectonics—wherein slabs of Earth’s crust move over, under, away from, and against one another—began. Some researchers contend that tectonic movements began around 3 billion years ago, often noting that computer models of Earth’s mantle temperature at the time indicate that the mantle would have been sufficiently molten to enable the plates to move.\n\nText 2\nUltimately, any plausible claim about the inception of tectonic movement must rest on empirical evidence from the geological record. Researcher Wriju Chowdhury and his team analyzed the geochemistry of zircon crystals to gain insight into the chemical composition of the magma from which the crystals formed and, based on the data, compellingly argue that plate tectonics may have been occurring as early as 4.2 billion years ago.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to what “some researchers contend” as described in Text 1?", "stemZh": "根據這兩篇文本，Text 2 的作者最可能如何回應 Text 1 所描述的「部分研究人員所主張」的觀點？", "bodyZh": "文本 1\n關於板塊構造運動（即地殼板塊彼此在上方、下方滑動、相互遠離及相互推擠的現象）是如何開始的，目前所知甚少。一些研究人員主張，板塊運動大約始於 30 億年前，他們經常指出，當時地球地函溫度的電腦模型顯示，地函應已足夠熔融，使板塊得以移動。\n文本 2\n歸根究柢，任何關於板塊運動起源的合理主張，都必須以來自地質紀錄的實證證據為基礎。研究人員 Wriju Chowdhury 和他的團隊分析了鋯石晶體的地球化學性質，以深入了解形成這些晶體的岩漿化學組成，並根據這些數據，令人信服地主張板塊構造運動可能早在 42 億年前就已經發生。", "opts": {"A": "By suggesting that the temperature of Earth’s mantle 3 billion years ago was likely insufficient to allow for the level of tectonic movement predicted by computer models", "B": "By distinguishing between computer models of Earth’s mantle temperature that reliably predict the onset of plate tectonics and those that do not", "C": "By indicating that computer models of Earth’s mantle temperature are still being improved such that new models tend to be much more reliable than their predecessors", "D": "By asserting that a more definitive form of evidence than the computer models suggests a different timeline for the onset of plate tectonics on Earth"}, "optsZh": {"A": "藉由暗示 30 億年前地球地函的溫度可能不足以產生電腦模型所預測的構造運動程度", "B": "藉由區分能可靠預測板塊構造起始時間與無法可靠預測的地函溫度電腦模型", "C": "藉由指出地函溫度的電腦模型仍在改進中，因此新模型往往比舊模型可靠得多", "D": "藉由主張一種比電腦模型更具決定性的證據，指出地球板塊構造運動的起始時間線應有所不同"}, "answer": "D", "expl": "Text 2 insists claims must rest on empirical geological evidence and cites zircon data pointing to 4.2 billion years ago — a more definitive kind of evidence than computer models, suggesting a different timeline.", "explZh": "文本 2 主張結論必須建立在地質紀錄的實證上，並引用鋯石資料指出板塊運動可能始於 42 億年前——這是比電腦模型更可靠的證據，也指向不同的時間線。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Paired Text: empirical evidence revises model-based timeline", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於將他視為務實的政策制定者。哪一段引文最能說明這項主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人在上任的第一個月簽署了數項法令。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Paired Text: empirical evidence revises model-based timeline", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The southern region was included in the survey.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "有些農民種植蔬菜，而另一些則種植穀物。", "B": "南部地區有被納入調查。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Paired Text: empirical evidence revises model-based timeline", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。天文學家主張，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這項主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "The method used to study stars requires a telescope.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "有一顆岩質行星擁有稀薄的大氣層。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Paired Text: empirical evidence revises model-based timeline", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流而發展出來的，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "The tradition is studied by scholars in several countries.", "C": "Many performers learned songs from relatives.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "有數個國家的學者研究這項傳統。", "C": "許多表演者是向親戚學習歌曲的。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Paired Text: empirical evidence revises model-based timeline", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫、條件相當的城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "Both towns had some volunteers.", "C": "The program took place in a community.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "兩個城鎮都有一些志工。", "C": "這個計畫在一個社區中進行。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Reading Detail: bark structure aids latex collection", "vocab": false, "body": "Hevea brasiliensis, a tree in the Amazon rainforest, is the world’s main source of natural rubber. The tree <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> a milky <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=substance\" target=\"_blank\" rel=\"noopener\" data-w=\"substance\" data-pos=\"n.\" data-en=\"a particular kind of material\" data-zh=\"物質\">substance<\/a> called latex that is used to make rubber. The bark of Hevea brasiliensis is helpful for the process of making rubber because it has a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unique\" target=\"_blank\" rel=\"noopener\" data-w=\"unique\" data-pos=\"adj.\" data-en=\"being the only one of its kind\" data-zh=\"獨特的\">unique<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> that makes it easy to collect latex. A network of tubes in the tree’s inner bark helps the latex to flow out easily when people make small cuts into the bark.", "bodyPlain": "Hevea brasiliensis, a tree in the Amazon rainforest, is the world’s main source of natural rubber. The tree produces a milky substance called latex that is used to make rubber. The bark of Hevea brasiliensis is helpful for the process of making rubber because it has a unique structure that makes it easy to collect latex. A network of tubes in the tree’s inner bark helps the latex to flow out easily when people make small cuts into the bark.", "stem": "What feature of Hevea brasiliensis does the text say is helpful for the process of making rubber?", "stemZh": "根據文本，Hevea brasiliensis 的哪項特徵有助於橡膠的製造過程？", "bodyZh": "Hevea brasiliensis（巴西橡膠樹）是亞馬遜雨林中的一種樹木，也是全世界天然橡膠的主要來源。這種樹會產生一種稱為乳膠的乳白色物質，用來製造橡膠。Hevea brasiliensis 的樹皮有助於橡膠的製作過程，因為它具有獨特的結構，使乳膠容易收集。當人們在樹皮上割出小切口時，樹木內層樹皮中的管道網絡能讓乳膠輕易流出。", "opts": {"A": "Its latex produces rubber of an especially high quality.", "B": "Its bark has a unique structure that makes it easy to collect latex.", "C": "It is able to grow in a wide variety of climates around the world.", "D": "It is one of only two trees in the Amazon that produce latex."}, "optsZh": {"A": "它的乳膠能製造出品質特別高的橡膠。", "B": "它的樹皮具有獨特結構，使乳膠容易採集。", "C": "它能在世界各地多種不同氣候中生長。", "D": "它是亞馬遜地區僅有的兩種能產生乳膠的樹木之一。"}, "answer": "B", "expl": "The text states directly that the bark 'has a unique structure that makes it easy to collect latex.'", "explZh": "文中直接指出樹皮「具有獨特的結構，使乳膠容易採集」。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Reading Detail: bark structure aids latex collection", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。在一段短篇小說節錄中，一位年長的音樂家在敞開的窗邊等待，一位較年輕的親戚則從花園帶著花回來。敘述停留在傍晚的光線、已布置好的房間，以及那些顯示一位期待已久的訪客即將到來的細微跡象上。", "opts": {"A": "To explain why music has lost its importance", "B": "To portray a setting and mood as characters prepare for an arrival", "C": "To argue that the characters should leave the house", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "解釋為什麼音樂已失去其重要性", "B": "在角色們為某人的到來做準備時，描繪場景與氣氛", "C": "主張角色們應該離開這棟房子", "D": "概述兩位親戚之間的衝突"}, "answer": "B", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Reading Detail: bark structure aids latex collection", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一首詩描寫一位說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並非敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入一種不確定卻充滿希望的處境。", "opts": {"A": "To list the technical features of a harbor", "B": "To criticize sailors for taking unnecessary risks", "C": "To compare several forms of transportation", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "列出一座港口的技術特點", "B": "批評水手們冒不必要的風險", "C": "比較幾種交通方式", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Reading Detail: bark structure aids latex collection", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一段小說節錄描寫了節慶大餐前擁擠的廚房。敘述者注意到擦亮的碗、精心排列的椅子，以及每當屋外傳來腳步聲時家人們便停下動作的樣子——他們正在等待一位多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To depict preparations that reveal anticipation within a family", "C": "To describe a completed celebration from beginning to end", "D": "To contrast rural and urban customs"}, "optsZh": {"A": "解釋為什麼這家人不喜歡訪客", "B": "描繪顯露出一家人期待之情的準備工作", "C": "從頭到尾描述一場已經結束的慶祝活動", "D": "對比鄉村與都市的風俗"}, "answer": "B", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Reading Detail: bark structure aids latex collection", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段回憶錄文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字尚未呈現課程本身；相反地，它突顯的是課程開始前那些安靜的例行儀式。", "opts": {"A": "To describe the moments before a significant daily activity begins", "B": "To evaluate the quality of a school's curriculum", "C": "To recount a student's entire academic career", "D": "To argue that early classes should be canceled"}, "optsZh": {"A": "描述一項重要的日常活動開始前的時刻", "B": "評估一所學校課程的品質", "C": "敘述一名學生完整的求學經歷", "D": "主張應取消早上的課"}, "answer": "A", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Reading Detail: bark structure aids latex collection", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一段文學文字呈現了雨後的花園：濕潤的小徑、明亮的葉子，以及一張擺在樹下的長椅。一個角色手拿一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To reveal the full contents of a letter", "C": "To establish a reflective mood before a character acts", "D": "To compare two different seasons"}, "optsZh": {"A": "提供照顧花園的指示", "B": "揭露一封信的完整內容", "C": "在角色採取行動之前營造一種沉思的氛圍", "D": "比較兩個不同的季節"}, "answer": "C", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Main Idea: nature-based conservation can help", "vocab": false, "body": "Conservationists worldwide are working to protect ecosystems from habitat <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=destruction\" target=\"_blank\" rel=\"noopener\" data-w=\"destruction\" data-pos=\"n.\" data-en=\"the act of destroying something\" data-zh=\"毀滅；破壞\">destruction<\/a> and biodiversity loss, and in many cases, initiatives that rely on natural features or processes can help address such challenges. In response to a rapidly dwindling <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> of blueback salmon, the Quinault Indian Nation (a tribe in Washington State) partnered with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organization\" target=\"_blank\" rel=\"noopener\" data-w=\"organization\" data-pos=\"n.\" data-en=\"a group of people working together for a shared purpose\" data-zh=\"組織；機構\">organization<\/a> Wild Salmon Center to restore naturally occurring logjams in the Quinault River. The logjams create shady pools where the blueback salmon can rest and spawn, thus promoting blueback population recovery.", "bodyPlain": "Conservationists worldwide are working to protect ecosystems from habitat destruction and biodiversity loss, and in many cases, initiatives that rely on natural features or processes can help address such challenges. In response to a rapidly dwindling population of blueback salmon, the Quinault Indian Nation (a tribe in Washington State) partnered with the conservation organization Wild Salmon Center to restore naturally occurring logjams in the Quinault River. The logjams create shady pools where the blueback salmon can rest and spawn, thus promoting blueback population recovery.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "世界各地的保育人士正努力保護生態系統免於棲地破壞與生物多樣性喪失，而在許多情況下，仰賴自然特徵或自然過程的計畫有助於應對這些挑戰。為了因應藍背鮭（blueback salmon）數量迅速減少的問題，Quinault Indian Nation（位於華盛頓州的一個部落）與保育組織 Wild Salmon Center 合作，恢復 Quinault River 中自然形成的漂流木堆。這些漂流木堆形成有遮蔭的水潭，讓藍背鮭可以在此休息與產卵，從而促進藍背鮭族群的恢復。", "opts": {"A": "A partnership between the Quinault Indian Nation and Wild Salmon Center shows the importance of collaborative approaches to preserving biodiversity.", "B": "Nature-based approaches can be effective ways to achieve conservation goals.", "C": "As indicated by a recent project, logjams help the blueback salmon thrive and reproduce.", "D": "Scientists now realize that nature-based conservation methods offer better long-term solutions to environmental issues than methods that are not nature-based do."}, "optsZh": {"A": "Quinault 印第安民族與 Wild Salmon Center 之間的合作，顯示了以協作方式保護生物多樣性的重要性。", "B": "以自然為本的方法可以是達成保育目標的有效途徑。", "C": "如一項近期計畫所顯示，原木堆積（logjams）有助於藍背鮭茁壯成長並繁殖。", "D": "科學家如今了解到，以自然為本的保育方法比非以自然為本的方法，能為環境問題提供更好的長期解決之道。"}, "answer": "B", "expl": "The text's main claim is that initiatives relying on natural features can help conservation; the logjam project is just an example.", "explZh": "本文主旨是：運用自然特徵或過程的做法能幫助保育；漂流木堆計畫只是例子。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Main Idea: nature-based conservation can help", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。在一段短篇小說節錄中，一位年長的音樂家在敞開的窗邊等待，一位較年輕的親戚則從花園帶著花回來。敘述停留在傍晚的光線、已布置好的房間，以及那些顯示一位期待已久的訪客即將到來的細微跡象上。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To explain why music has lost its importance", "C": "To summarize a conflict between two relatives", "D": "To argue that the characters should leave the house"}, "optsZh": {"A": "在角色們為某人的到來做準備時，描繪場景與氣氛", "B": "解釋為什麼音樂已失去其重要性", "C": "概述兩位親戚之間的衝突", "D": "主張角色們應該離開這棟房子"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Main Idea: nature-based conservation can help", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一首詩描寫一位說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並非敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入一種不確定卻充滿希望的處境。", "opts": {"A": "To criticize sailors for taking unnecessary risks", "B": "To list the technical features of a harbor", "C": "To compare several forms of transportation", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "批評水手們冒不必要的風險", "B": "列出一座港口的技術特點", "C": "比較幾種交通方式", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Main Idea: nature-based conservation can help", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一段小說節錄描寫了節慶大餐前擁擠的廚房。敘述者注意到擦亮的碗、精心排列的椅子，以及每當屋外傳來腳步聲時家人們便停下動作的樣子——他們正在等待一位多年未曾來訪的客人。", "opts": {"A": "To describe a completed celebration from beginning to end", "B": "To contrast rural and urban customs", "C": "To depict preparations that reveal anticipation within a family", "D": "To explain why the family dislikes visitors"}, "optsZh": {"A": "從頭到尾描述一場已經結束的慶祝活動", "B": "對比鄉村與都市的風俗", "C": "描繪顯露出一家人期待之情的準備工作", "D": "解釋為什麼這家人不喜歡訪客"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Main Idea: nature-based conservation can help", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段回憶錄文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字尚未呈現課程本身；相反地，它突顯的是課程開始前那些安靜的例行儀式。", "opts": {"A": "To evaluate the quality of a school's curriculum", "B": "To describe the moments before a significant daily activity begins", "C": "To argue that early classes should be canceled", "D": "To recount a student's entire academic career"}, "optsZh": {"A": "評估一所學校課程的品質", "B": "描述一項重要的日常活動開始前的時刻", "C": "主張應取消早上的課", "D": "敘述一名學生完整的求學經歷"}, "answer": "B", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Main Idea: nature-based conservation can help", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一段文學文字呈現了雨後的花園：濕潤的小徑、明亮的葉子，以及一張擺在樹下的長椅。一個角色手拿一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To establish a reflective mood before a character acts", "C": "To compare two different seasons", "D": "To reveal the full contents of a letter"}, "optsZh": {"A": "提供照顧花園的指示", "B": "在角色採取行動之前營造一種沉思的氛圍", "C": "比較兩個不同的季節", "D": "揭露一封信的完整內容"}, "answer": "B", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Quantitative Evidence: highest shaded-shelter percentage", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percentage\" target=\"_blank\" rel=\"noopener\" data-w=\"percentage\" data-pos=\"n.\" data-en=\"an amount expressed as a part of 100\" data-zh=\"百分比\">Percentage<\/a> of Bus Stops with Shaded Shelter by Area’s Highest Average Summer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">Surface<\/a> Temperature (table): 90.2°F – 15%; 97.7°F – 22%; 102.7°F – 24%; 111.2°F – 28%; 125.6°F – 29%.<br><br>A student is researching a bus system in a large county where surface <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> vary by area and are hot in the summer. The student <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that all areas of the county should have more bus stops with shaded shelter, noting that the highest percentage of bus stops with shaded shelter for any area is only _______", "bodyPlain": "Percentage of Bus Stops with Shaded Shelter by Area’s Highest Average Summer Surface Temperature (table): 90.2°F – 15%; 97.7°F – 22%; 102.7°F – 24%; 111.2°F – 28%; 125.6°F – 29%.\n\nA student is researching a bus system in a large county where surface temperatures vary by area and are hot in the summer. The student claims that all areas of the county should have more bus stops with shaded shelter, noting that the highest percentage of bus stops with shaded shelter for any area is only _______", "stem": "Which choice most effectively uses data from the table to complete the student’s claim?", "stemZh": "哪個選項最有效地運用表格中的資料來完成這位學生的主張？", "bodyZh": "依地區夏季地表最高平均溫度分列之設有遮蔭候車亭的公車站百分比（表格）：華氏 90.2 度－15%；華氏 97.7 度－22%；華氏 102.7 度－24%；華氏 111.2 度－28%；華氏 125.6 度－29%。\n一名學生正在研究某個大型郡的公車系統，該郡各地區的地表溫度不一，且夏季炎熱。這名學生主張該郡所有地區都應設置更多有遮蔭候車亭的公車站，並指出任何地區設有遮蔭候車亭的公車站比例最高也只有 _______", "opts": {"A": "50%.", "B": "15%.", "C": "90%.", "D": "29%."}, "optsZh": {"A": "50%。", "B": "15%。", "C": "90%。", "D": "29%。"}, "answer": "D", "expl": "The highest percentage of bus stops with shaded shelter for any area in the table is 29%.", "explZh": "表格中任何地區有遮蔭候車亭的公車站最高比例是 29%。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Quantitative Evidence: highest shaded-shelter percentage", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調她的情感是真誠的，但在需要判斷時，她能夠克制自己的情緒。", "opts": {"A": "She is admired mainly for her wealth.", "B": "She shows unusual maturity and self-command.", "C": "She lacks affection for her family.", "D": "She refuses to give advice to others."}, "optsZh": {"A": "她主要因財富而受人景仰。", "B": "她展現出不尋常的成熟與自制。", "C": "她對家人缺乏感情。", "D": "她拒絕給別人建議。"}, "answer": "B", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Quantitative Evidence: highest shaded-shelter percentage", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強勢。", "opts": {"A": "The grandmother's influence is quiet but substantial.", "B": "The grandmother avoids family matters entirely.", "C": "The narrator thinks patience is useless.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "祖母的影響力低調卻深遠。", "B": "祖母完全避開家務事。", "C": "敘事者認為耐心毫無用處。", "D": "家人忽視祖母的意見。"}, "answer": "A", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Quantitative Evidence: highest shaded-shelter percentage", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一則故事描寫一位職員，他會注意到別人已經核可過的帳簿中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存下去。", "opts": {"A": "The clerk intentionally creates errors.", "B": "The coworkers are more accurate than the clerk.", "C": "The business fails because of excessive caution.", "D": "The clerk's carefulness is valuable despite being inconvenient."}, "optsZh": {"A": "這位職員故意製造錯誤。", "B": "同事們比這位職員更精確。", "C": "這家公司因過度謹慎而失敗。", "D": "這位職員的細心雖然造成不便，卻很有價值。"}, "answer": "D", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Quantitative Evidence: highest shaded-shelter percentage", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段文字指出，一位村落領袖在做決定之前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨懟。", "opts": {"A": "The leader makes decisions without hearing others.", "B": "The leader dislikes public meetings.", "C": "The leader values inclusive deliberation.", "D": "The leader is unable to reach conclusions."}, "optsZh": {"A": "這位領導人不聽取他人意見就做決定。", "B": "這位領導人不喜歡公開會議。", "C": "這位領導人重視兼容並蓄的審議。", "D": "這位領導人無法做出結論。"}, "answer": "C", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Quantitative Evidence: highest shaded-shelter percentage", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。在一段節錄中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在初期討論中鼓勵大家大膽推測，但在每一項測量都經過核對之前，她絕不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She publishes claims before testing them.", "C": "She combines intellectual openness with rigorous standards.", "D": "She avoids working with students."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她在驗證主張之前就將其發表。", "C": "她兼具開放的求知態度與嚴格的標準。", "D": "她避免與學生共事。"}, "answer": "C", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Quantitative Evidence: Bahrain total area", "vocab": false, "body": "Total Areas and 2022 Populations of the Smallest Arabian Peninsula <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">Countries<\/a> (table): Kuwait – 6,880 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=square\" target=\"_blank\" rel=\"noopener\" data-w=\"square\" data-pos=\"adj.\" data-en=\"used before units to measure area, e.g. square mile\" data-zh=\"平方的\">square<\/a> miles, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> 4,268,873; Bahrain – 304 square miles, population 1,472,233; Qatar – 4,471 square miles, population 2,695,122.<br><br>In terms of area and population, the three smallest Arabian Peninsula countries are Bahrain, Qatar, and Kuwait.", "bodyPlain": "Total Areas and 2022 Populations of the Smallest Arabian Peninsula Countries (table): Kuwait – 6,880 square miles, population 4,268,873; Bahrain – 304 square miles, population 1,472,233; Qatar – 4,471 square miles, population 2,695,122.\n\nIn terms of area and population, the three smallest Arabian Peninsula countries are Bahrain, Qatar, and Kuwait.", "stem": "According to the table, what is the total area of Bahrain?", "stemZh": "根據表格，巴林的總面積是多少？", "bodyZh": "阿拉伯半島最小國家的總面積與 2022 年人口（表格）：科威特－6,880 平方英里，人口 4,268,873；巴林－304 平方英里，人口 1,472,233；卡達－4,471 平方英里，人口 2,695,122。\n就面積與人口而言，阿拉伯半島最小的三個國家是巴林、卡達與科威特。", "opts": {"A": "4,268,873 square miles", "B": "4,471 square miles", "C": "304 square miles", "D": "6,880 square miles"}, "optsZh": {"A": "4,268,873 平方英里", "B": "4,471 平方英里", "C": "304 平方英里", "D": "6,880 平方英里"}, "answer": "C", "expl": "The table lists Bahrain's total area as 304 square miles (1,472,233 is its population).", "explZh": "表格顯示巴林的總面積為 304 平方英里（1,472,233 是人口）。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Quantitative Evidence: Bahrain total area", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things
