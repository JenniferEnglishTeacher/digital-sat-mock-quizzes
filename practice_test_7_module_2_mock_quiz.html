mpares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The founders wanted the workshop to serve students who could not attend weekday classes. _______ they scheduled sessions on weekends and offered recordings afterward.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The founders wanted the workshop to serve students who could not attend weekday classes. _______ they scheduled sessions on weekends and offered recordings afterward.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。創辦人希望這個工作坊能服務無法參加平日課程的學生。_______ 他們將課程安排在週末，並在課後提供錄影。", "opts": {"A": "In other words,", "B": "In summary,", "C": "To that end,", "D": "For example,"}, "optsZh": {"A": "In other words,（換句話說；表重述）", "B": "In summary,（總而言之：表總結 → 後句是為達目標採取的行動，錯誤）", "C": "To that end,（為此：引出為達成前述目標而採取的行動，正確）", "D": "For example,（例如：表舉例）"}, "answer": "C", "expl": "To that end introduces an action taken to achieve a goal.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transition: to that end introduces action serving goal", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> hoped to make the archive usable for non-specialists. _______ she added plain-language summaries to each catalog entry.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The researcher hoped to make the archive usable for non-specialists. _______ she added plain-language summaries to each catalog entry.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這位研究人員希望讓這個檔案庫也能為非專業人士所用。_______ 她在每一筆目錄條目中加入了淺白易懂的摘要。", "opts": {"A": "To that end,", "B": "In summary,", "C": "Alternatively,", "D": "For example,"}, "optsZh": {"A": "To that end,（為此：引出為達成前述目標而採取的行動，正確）", "B": "In summary,（總而言之：表總結 → 後句是為達目標採取的行動，錯誤）", "C": "Alternatively,（或者：表另一種選擇）", "D": "For example,（例如：表舉例）"}, "answer": "A", "expl": "To that end links goal and action.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transition: to that end introduces action serving goal", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The director wanted the festival to include more local artists. _______ she reserved half the performance slots for groups based in the city.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The director wanted the festival to include more local artists. _______ she reserved half the performance slots for groups based in the city.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這位總監希望藝術節能納入更多在地藝術家。_______ 她將一半的演出時段保留給以本市為據點的團體。", "opts": {"A": "To that end,", "B": "Nevertheless,", "C": "In other words,", "D": "For example,"}, "optsZh": {"A": "To that end,（為此：引出為達成前述目標而採取的行動，正確）", "B": "Nevertheless,（然而、儘管如此：表讓步轉折）", "C": "In other words,（換句話說；表重述）", "D": "For example,（例如：表舉例）"}, "answer": "A", "expl": "To that end introduces the means.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transition: to that end introduces action serving goal", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The engineers aimed to reduce water loss in the system. _______ they replaced cracked pipes before installing new meters.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The engineers aimed to reduce water loss in the system. _______ they replaced cracked pipes before installing new meters.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。工程師的目標是減少系統中的漏水。_______ 他們在安裝新水錶之前，先更換了破裂的水管。", "opts": {"A": "For example,", "B": "To that end,", "C": "In summary,", "D": "Alternatively,"}, "optsZh": {"A": "For example,（例如：表舉例）", "B": "To that end,（為此：引出為達成前述目標而採取的行動，正確）", "C": "In summary,（總而言之：表總結 → 後句是為達目標採取的行動，錯誤）", "D": "Alternatively,（或者：表另一種選擇）"}, "answer": "B", "expl": "To that end shows purpose.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transition: to that end introduces action serving goal", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The teachers wanted students to practice revision rather than submit a single draft. _______ they built peer feedback days into the schedule.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The teachers wanted students to practice revision rather than submit a single draft. _______ they built peer feedback days into the schedule.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。老師們希望學生練習修改文章，而不是只交一次草稿。_______ 他們在課程安排中加入了同儕回饋日。", "opts": {"A": "In summary,", "B": "In other words,", "C": "For example,", "D": "To that end,"}, "optsZh": {"A": "In summary,（總而言之：表總結 → 後句是為達目標採取的行動，錯誤）", "B": "In other words,（換句話說；表重述）", "C": "For example,（例如：表舉例）", "D": "To that end,（為此：引出為達成前述目標而採取的行動，正確）"}, "answer": "D", "expl": "To that end introduces the planned action.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Transition: more often contrasts modern route purpose", "vocab": false, "body": "Mountain climbing routes that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporate<\/a> metal rungs and cables are known as via ferratas, from the Italian phrase for “iron path.” As climbing these routes has shifted from a mode of travel to a sporting activity, modern via ferratas are rarely designed to simply reach a summit. _______ new routes favor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recreation\" target=\"_blank\" rel=\"noopener\" data-w=\"recreation\" data-pos=\"n.\" data-en=\"activities done for enjoyment when not working\" data-zh=\"休閒；娛樂\">recreation<\/a> over <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=utility\" target=\"_blank\" rel=\"noopener\" data-w=\"utility\" data-pos=\"n.\" data-en=\"the quality of being useful; practical usefulness\" data-zh=\"實用性；效用\">utility<\/a>, aiming to provide a challenging climb or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=showcase\" target=\"_blank\" rel=\"noopener\" data-w=\"showcase\" data-pos=\"v.\" data-en=\"to show something in a way that draws attention to its good qualities\" data-zh=\"展示；突顯\">showcase<\/a> dramatic scenery.", "bodyPlain": "Mountain climbing routes that incorporate metal rungs and cables are known as via ferratas, from the Italian phrase for “iron path.” As climbing these routes has shifted from a mode of travel to a sporting activity, modern via ferratas are rarely designed to simply reach a summit. _______ new routes favor recreation over utility, aiming to provide a challenging climb or showcase dramatic scenery.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "結合金屬踏階與鋼索的登山路線稱為 via ferrata（鐵索攀登路線），名稱源自義大利文中意為「鐵之路」的詞語。隨著攀登這類路線從一種交通方式轉變為一種運動，現代的鐵索攀登路線很少只是為了抵達山頂而設計。_______ 新路線重視休閒娛樂勝過實用性，目的在於提供具挑戰性的攀登體驗或展現壯觀的景色。", "opts": {"A": "Additionally,", "B": "On the other hand,", "C": "More often,", "D": "Nonetheless,"}, "optsZh": {"A": "Additionally,（此外：表補充）", "B": "On the other hand,（另一方面：表對比 → 後句是延續說明而非對比，錯誤）", "C": "More often,（更常見的是：表示現今的主要傾向，正確）", "D": "Nonetheless,（儘管如此：表讓步轉折 → 前後並非讓步關係，錯誤）"}, "answer": "C", "expl": "Modern via ferratas are rarely designed just to reach a summit; 'more often,' they favor recreation — the transition introduces the more common case.", "explZh": "現代鐵索攀岩路線很少只為登頂而設計；「更常見的是」以休閒為主——此轉折詞引出較常見的情況。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Transition: more often contrasts modern route purpose", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Early mountain paths were built mainly to move goods between villages. Modern routes, _______ are designed to attract hikers who want dramatic views.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Early mountain paths were built mainly to move goods between villages. Modern routes, _______ are designed to attract hikers who want dramatic views.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。早期的山徑主要是為了在村莊之間運送貨物而修建的。現代的路線，_______ 則是為了吸引想欣賞壯麗景色的健行者而設計。", "opts": {"A": "On the other hand,", "B": "Nonetheless,", "C": "More often,", "D": "Additionally,"}, "optsZh": {"A": "On the other hand,（另一方面：表對比 → 後句是延續說明而非對比，錯誤）", "B": "Nonetheless,（儘管如此：表讓步轉折 → 前後並非讓步關係，錯誤）", "C": "More often,（更常見的是：表示現今的主要傾向，正確）", "D": "Additionally,（此外：表補充）"}, "answer": "C", "expl": "More often describes the typical modern pattern.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Transition: more often contrasts modern route purpose", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Older museum labels usually listed only an object&#x27;s title and date. Today, labels _______ explain how the object was made and why it mattered to its community.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Older museum labels usually listed only an object's title and date. Today, labels _______ explain how the object was made and why it mattered to its community.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。過去的博物館標籤通常只列出展品的名稱與年代。如今，標籤 _______ 會說明展品是如何製作的，以及它為何對其所屬的社群具有重要意義。", "opts": {"A": "additionally,", "B": "more often,", "C": "nonetheless,", "D": "on the other hand,"}, "optsZh": {"A": "additionally,（此外：表補充 → 不合邏輯，錯誤）", "B": "more often,（更常見的是：表示現今的主要傾向，正確）", "C": "nonetheless,（儘管如此：表讓步轉折 → 不合邏輯，錯誤）", "D": "on the other hand,（另一方面：表對比）"}, "answer": "B", "expl": "More often shows what is now typical.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Transition: more often contrasts modern route purpose", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Traditional campus libraries were organized around quiet book storage. New library buildings, _______ include studios, cafes, and collaborative workrooms.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Traditional campus libraries were organized around quiet book storage. New library buildings, _______ include studios, cafes, and collaborative workrooms.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。傳統的校園圖書館是以安靜的藏書空間為核心來規劃的。新的圖書館建築，_______ 則設有工作室、咖啡館與協作工作室。", "opts": {"A": "additionally,", "B": "nonetheless,", "C": "more often,", "D": "on the other hand,"}, "optsZh": {"A": "additionally,（此外：表補充 → 不合邏輯，錯誤）", "B": "nonetheless,（儘管如此：表讓步轉折 → 不合邏輯，錯誤）", "C": "more often,（更常見的是：表示現今的主要傾向，正確）", "D": "on the other hand,（另一方面：表對比）"}, "answer": "C", "expl": "More often marks the modern tendency.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Transition: more often contrasts modern route purpose", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Historic waterfronts were commonly built for shipping and storage. Redeveloped waterfronts, _______ prioritize parks, restaurants, and public access.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Historic waterfronts were commonly built for shipping and storage. Redeveloped waterfronts, _______ prioritize parks, restaurants, and public access.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。歷史悠久的濱水區通常是為了航運與倉儲而興建的。重新開發的濱水區，_______ 則以公園、餐廳與公共通行為優先。", "opts": {"A": "nonetheless,", "B": "additionally,", "C": "on the other hand,", "D": "more often,"}, "optsZh": {"A": "nonetheless,（儘管如此：表讓步轉折 → 不合邏輯，錯誤）", "B": "additionally,（此外：表補充 → 不合邏輯，錯誤）", "C": "on the other hand,（另一方面：表對比）", "D": "more often,（更常見的是：表示現今的主要傾向，正確）"}, "answer": "D", "expl": "More often indicates the usual current purpose.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Transition: more often contrasts modern route purpose", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Early documentary films often used a single narrator. Contemporary documentaries, _______ combine interviews, archival footage, and on-screen text.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Early documentary films often used a single narrator. Contemporary documentaries, _______ combine interviews, archival footage, and on-screen text.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。早期的紀錄片經常只使用單一旁白。當代紀錄片，_______ 則結合了訪談、檔案影片與螢幕文字。", "opts": {"A": "more often,", "B": "nonetheless,", "C": "on the other hand,", "D": "additionally,"}, "optsZh": {"A": "more often,（更常見的是：表示現今的主要傾向，正確）", "B": "nonetheless,（儘管如此：表讓步轉折 → 不合邏輯，錯誤）", "C": "on the other hand,（另一方面：表對比）", "D": "additionally,（此外：表補充 → 不合邏輯，錯誤）"}, "answer": "A", "expl": "More often contrasts modern practice.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: title of award-winning novel", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Samuel Delany is a US writer known for his science <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fiction\" target=\"_blank\" rel=\"noopener\" data-w=\"fiction\" data-pos=\"n.\" data-en=\"stories about imaginary people and events\" data-zh=\"小說；虛構作品\">fiction<\/a>.<br>- Delany’s science fiction novel Babel-17 was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publish\" target=\"_blank\" rel=\"noopener\" data-w=\"publish\" data-pos=\"v.\" data-en=\"to prepare and print a book, article, etc. for the public\" data-zh=\"出版；發表\">published<\/a> in 1966.<br>- The novel won a Nebula Award in 1967.<br>- The Nebula Awards are given each year to the best works of science fiction published in the US.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Samuel Delany is a US writer known for his science fiction.\n- Delany’s science fiction novel Babel-17 was published in 1966.\n- The novel won a Nebula Award in 1967.\n- The Nebula Awards are given each year to the best works of science fiction published in the US.", "stem": "The student wants to indicate the title of a novel that won a Nebula Award. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要指出一部獲得星雲獎的小說的書名。哪個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- Samuel Delany 是一位以科幻作品聞名的美國作家。\n- Delany 的科幻小說《Babel-17》於 1966 年出版。\n- 這部小說於 1967 年獲得 Nebula Award（星雲獎）。\n- Nebula Awards（星雲獎）每年頒發給在美國出版的最佳科幻作品。", "opts": {"A": "Babel-17, by Samuel Delany, won a Nebula Award in 1967.", "B": "Samuel Delany published a science fiction novel in 1966.", "C": "Samuel Delany is an award-winning US writer known for his science fiction.", "D": "One of Samuel Delany’s novels was among the best works of science fiction published in the US."}, "optsZh": {"A": "Samuel Delany 的《Babel-17》於 1967 年獲得星雲獎（Nebula Award）。", "B": "Samuel Delany 於 1966 年出版了一部科幻小說。", "C": "Samuel Delany 是一位以科幻作品聞名、屢獲獎項的美國作家。", "D": "Samuel Delany 的一部小說名列美國出版的最佳科幻作品之一。"}, "answer": "A", "expl": "Only choice A names the novel, Babel-17, and states that it won a Nebula Award.", "explZh": "只有選項 A 說出小說名稱 Babel-17 並指出它獲得星雲獎。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: title of award-winning novel", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Mori also collected Moss B from River Nami.", "B": "Fern A and Moss B were collected in different years.", "C": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "D": "Aya Mori collected hundreds of plant samples."}, "optsZh": {"A": "Mori 也在 River Nami 採集了 Moss B。", "B": "Fern A 和 Moss B 是在不同年份採集的。", "C": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "D": "Aya Mori 採集了數百件植物樣本。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: title of award-winning novel", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cerro Azul sample.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：地質學家 Luis Ortega 採集了許多礦物標本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的標本。", "opts": {"A": "Ortega collected many mineral samples.", "B": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.", "C": "Cerro Azul and Valle Seco are different sites.", "D": "Quartz was collected from Valle Seco."}, "optsZh": {"A": "Ortega 採集了許多礦物樣本。", "B": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。", "C": "Cerro Azul 和 Valle Seco 是不同的地點。", "D": "石英是在 Valle Seco 採集的。"}, "answer": "B", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: title of award-winning novel", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "B": "Both samples were collected in 1980.", "C": "Lee cataloged more than one algae species.", "D": "Fucus alba was collected from Stone Harbor."}, "optsZh": {"A": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。", "B": "兩份樣本都是在 1980 年採集的。", "C": "Lee 編目記錄了不只一種藻類。", "D": "Fucus alba 是在 Stone Harbor 採集的。"}, "answer": "A", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: title of award-winning novel", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "Species M came from Lake Plain.", "B": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "C": "Singh collected beetles in multiple locations.", "D": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975."}, "optsZh": {"A": "Species M 來自 Lake Plain。", "B": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "C": "Singh 在多個地點採集了甲蟲。", "D": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。"}, "answer": "D", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: title of award-winning novel", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Ramos collected Fern Y the following year.", "B": "Ramos collected approximately 700 specimens.", "C": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "D": "Cloud Peak and Green Valley were both collection sites."}, "optsZh": {"A": "Ramos 在隔年採集了 Fern Y。", "B": "Ramos 採集了大約 700 件標本。", "C": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "D": "Cloud Peak 和 Green Valley 都是採集地點。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: year a painting was completed", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Chiura Obata was a Japanese American artist who lived in California.<br>- Yosemite Falls is a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=notable\" target=\"_blank\" rel=\"noopener\" data-w=\"notable\" data-pos=\"adj.\" data-en=\"important or interesting enough to deserve attention\" data-zh=\"著名的；值得注意的\">notable<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">painting<\/a> by Obata.<br>- It uses a Japanese method of black ink painting called sumi-e.<br>- This painting was completed in 1930.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Chiura Obata was a Japanese American artist who lived in California.\n- Yosemite Falls is a notable painting by Obata.\n- It uses a Japanese method of black ink painting called sumi-e.\n- This painting was completed in 1930.", "stem": "The student wants to indicate the year Yosemite Falls was completed. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要指出《Yosemite Falls》完成的年份。哪個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- Chiura Obata 是一位居住在加州的日裔美國藝術家。\n- 〈Yosemite Falls〉是 Obata 的一幅知名畫作。\n- 這幅畫採用一種稱為 sumi-e（墨繪）的日本水墨畫技法。\n- 這幅畫完成於 1930 年。", "opts": {"A": "While living in California, Obata created black ink paintings.", "B": "Obata, a Japanese American artist, created a notable painting.", "C": "Yosemite Falls was completed in 1930.", "D": "Obata used a Japanese painting method called sumi-e."}, "optsZh": {"A": "Obata 住在加州期間創作了水墨畫。", "B": "日裔美籍藝術家 Obata 創作了一幅知名畫作。", "C": "《Yosemite Falls》完成於 1930 年。", "D": "Obata 使用一種名為「墨繪」（sumi-e）的日本繪畫技法。"}, "answer": "C", "expl": "Choice C directly states the year the painting Yosemite Falls was completed: 1930.", "explZh": "選項 C 直接說出畫作 Yosemite Falls 完成的年份：1930 年。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: year a painting was completed", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：某個檔案室依風險為文件分級；公開後可能造成輕微傷害的文件列為「限閱」（Restricted）；公開後可能造成重大傷害的文件列為「封存」（Sealed）；例行的預算草案可能造成輕微但非重大的傷害；目標是為這些草案分級。", "opts": {"A": "Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.", "B": "Budget drafts are one kind of government document.", "C": "The records office classifies documents by release risk.", "D": "Sealed documents could cause major harm if released."}, "optsZh": {"A": "由於例行預算草案外洩可能造成輕微但不嚴重的損害，因此被歸類為「限制級」（Restricted）。", "B": "預算草案是政府文件的一種。", "C": "檔案室依公開風險為文件分類。", "D": "「密封級」文件一旦公開可能造成重大損害。"}, "answer": "A", "expl": "The answer applies the classification rule.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: year a painting was completed", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classify<\/a> diluted cleaner.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：某間實驗室依危險程度標示材料；可能刺激皮膚的材料標示為「小心」（Caution）；可能造成嚴重傷害的材料標示為「危險」（Danger）；稀釋過的清潔劑可能刺激皮膚，但不會造成嚴重傷害；目標是為稀釋清潔劑分類。", "opts": {"A": "The lab uses hazard categories for materials.", "B": "Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution.", "C": "Danger materials can cause severe injury.", "D": "Diluted cleaner is handled in a lab."}, "optsZh": {"A": "該實驗室對材料採用危險等級分類。", "B": "由於稀釋過的清潔劑可能刺激皮膚但不會造成嚴重傷害，因此被標示為「注意級」（Caution）。", "C": "「危險級」材料可能造成嚴重傷害。", "D": "稀釋過的清潔劑在實驗室中處理。"}, "answer": "B", "expl": "The answer uses the correct category.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: year a painting was completed", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A library classifies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：某間圖書館依脆弱程度為手稿分級；需要小心處理的物品列為「監控」（Monitored）；讀者不可接觸的物品列為「限閱」（Restricted）；大多數十九世紀的小冊子需要小心處理，但仍可由讀者翻閱；目標是為這些小冊子分級。", "opts": {"A": "The library classifies manuscripts by fragility.", "B": "Restricted manuscripts cannot be handled by readers.", "C": "Nineteenth-century pamphlets are historical documents.", "D": "Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers."}, "optsZh": {"A": "該圖書館依脆弱程度為手稿分類。", "B": "「限制級」手稿讀者不得接觸。", "C": "十九世紀的小冊子屬於歷史文件。", "D": "大多數十九世紀的小冊子被歸類為「監管」級，因為它們需要小心處理，但讀者仍可接觸使用。"}, "answer": "D", "expl": "The answer applies the definitions.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: year a painting was completed", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=widespread\" target=\"_blank\" rel=\"noopener\" data-w=\"widespread\" data-pos=\"adj.\" data-en=\"existing or happening in many places or among many people\" data-zh=\"普遍的；廣泛的\">widespread<\/a> damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：某個機構依預期影響為暴風雨分級；預期造成局部干擾的暴風雨列為「注意報」（Advisory）；預期造成大範圍損害的暴風雨列為「緊急」（Emergency）；某場沿海暴風雨預期會造成局部干擾，但不會造成大範圍損害；目標是為這場暴風雨分級。", "opts": {"A": "Emergency storms cause widespread damage.", "B": "The agency classifies storms by expected impact.", "C": "Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.", "D": "Coastal storms can affect travel."}, "optsZh": {"A": "「緊急級」風暴會造成大範圍損害。", "B": "該機構依預期衝擊程度為風暴分類。", "C": "由於預計會造成局部干擾但不會造成大範圍損害，這場沿海風暴被歸類為「警示級」（Advisory）。", "D": "沿海風暴可能影響交通。"}, "answer": "C", "expl": "The answer identifies the category.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: year a painting was completed", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: A museum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：某間博物館依安全風險為借展品分級；可能因一般搬運而受損的物件列為「監督」（Supervised）；可能因短暫暴露而嚴重受損的物件列為「限制」（Restricted）；大多數陶瓷複製品可能因一般搬運而受損，但不會因短暫暴露而嚴重受損；目標是為這些複製品分級。", "opts": {"A": "Restricted objects could be seriously damaged by brief exposure.", "B": "Ceramic replicas may be used in educational displays.", "C": "Most ceramic replicas are classified as Supervised because ordinary handling could damage them.", "D": "Museum loans are classified by security risk."}, "optsZh": {"A": "「限制級」物件短暫曝露就可能嚴重受損。", "B": "陶瓷複製品可用於教育展示。", "C": "大多數陶瓷複製品被歸類為「監督級」（Supervised），因為一般的搬動就可能損壞它們。", "D": "博物館借展品依安全風險分類。"}, "answer": "C", "expl": "The answer applies the classification.", "explZh": ""}];
    const SLUG = 'dsat_t7m2';
    const SOURCE = 'Digital SAT Practice Test 7, Module 2';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        sessionWrong[q.id] = { picked, ts: Date.now(), count: (sessionWrong[q.id]?.count || 0) + 1 };
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    const sessionWrong = {}; // questions answered wrong since this page was opened (kept even if fixed later)
    function wrongList(scope = 'all') {
      const w = scope === 'session' ? sessionWrong : loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    // list for downloads: the chosen scope; if "this attempt" is empty, offer the saved list instead
    function dlList() {
      let scope = document.getElementById('dlScope').value;
      let list = wrongList(scope);
      if (!list.length && scope === 'session') {
        const all = wrongList('all');
        if (!all.length) { alert('還沒有錯題 No wrong questions yet. 作答後答錯的題目會自動收錄。'); return null; }
        if (!confirm(`本次作答還沒有錯題。要改下載全部錯題本（${all.length} 題）嗎？\nNo wrong answers in this attempt yet. Download all ${all.length} saved wrong questions instead?`)) return null;
        scope = 'all'; list = all;
      }
      if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return null; }
      return { list, scope, tag: scope === 'session' ? 'this_attempt' : 'all_saved', label: scope === 'session' ? '本次作答 This attempt' : '全部錯題本 All saved' };
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
