tions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常帶領讀者認識拉丁美洲文學中的魔幻寫實。", "opts": {"A": "family", "B": "family,", "C": "family, and", "D": "family and"}, "optsZh": {"A": "family（無標點）", "B": "family,（逗號，結束以 a family saga 開頭的同位語）", "C": "family, and（逗號＋and）", "D": "family and（無標點＋and）"}, "answer": "A", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Grammar: comma before though clause", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free, in part because:", "B": "free, in part because,", "C": "free. In part because", "D": "free in part because"}, "optsZh": {"A": "free, in part because:（逗號＋in part because＋冒號）", "B": "free, in part because,（逗號＋in part because＋逗號）", "C": "free. In part because（句號，以 In part because 另起一句）", "D": "free in part because（無標點，直接接原因子句）"}, "answer": "C", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Grammar: semicolon between independent clauses", "vocab": false, "body": "That the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geographic\" target=\"_blank\" rel=\"noopener\" data-w=\"geographic\" data-pos=\"adj.\" data-en=\"relating to the physical features or location of places\" data-zh=\"地理的\">geographic<\/a> center of North America lay in the state of North Dakota was conceded by all _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establish\" target=\"_blank\" rel=\"noopener\" data-w=\"establish\" data-pos=\"v.\" data-en=\"to create or set up something\" data-zh=\"建立\">establishing<\/a> its precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coordinate\" target=\"_blank\" rel=\"noopener\" data-w=\"coordinate\" data-pos=\"n.\" data-en=\"one of a set of numbers that gives an exact position\" data-zh=\"座標\">coordinates<\/a> proved more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=divisive\" target=\"_blank\" rel=\"noopener\" data-w=\"divisive\" data-pos=\"adj.\" data-en=\"causing disagreement between people\" data-zh=\"引起分歧的\">divisive<\/a>.", "bodyPlain": "That the geographic center of North America lay in the state of North Dakota was conceded by all _______ establishing its precise coordinates proved more divisive.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "北美洲的地理中心位於北達科他州，這一點獲得所有人 _______ 確定其精確座標卻引發了更多分歧。", "opts": {"A": "involved:", "B": "involved,", "C": "involved", "D": "involved;"}, "optsZh": {"A": "involved:（冒號 → 後句並非對前句的解釋或說明，錯誤）", "B": "involved,（逗號 → 造成逗號連接錯誤，錯誤）", "C": "involved（無標點 → 兩個獨立子句直接相連，形成連寫句，錯誤）", "D": "involved;（分號：連接兩個獨立子句，正確）"}, "answer": "D", "expl": "Two independent clauses ('That … was conceded by all involved' / 'establishing its precise coordinates proved more divisive') must be joined by a semicolon.", "explZh": "兩個獨立子句（That… was conceded by all involved／establishing its precise coordinates proved more divisive）需以分號連接。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Grammar: semicolon between independent clauses", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。2022 年，該研究團隊 ______ 一篇論文，描述一種新發現的酶，能幫助某些細菌在高度酸性的水中存活。", "opts": {"A": "to publish", "B": "having published", "C": "published", "D": "publishing"}, "optsZh": {"A": "to publish（不定詞 → 句子缺少主要動詞，錯誤）", "B": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "C": "published（簡單過去式：主要動詞，正確）", "D": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）"}, "answer": "C", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Grammar: semicolon between independent clauses", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=decorative\" target=\"_blank\" rel=\"noopener\" data-w=\"decorative\" data-pos=\"adj.\" data-en=\"meant to look attractive rather than to be useful\" data-zh=\"裝飾性的\">decorative<\/a>, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這個古董音樂盒看起來是裝飾品，但轉動把手時，______ 內部的針會撞擊細小的金屬齒片，奏出旋律。", "opts": {"A": "device", "B": "device,", "C": "device--", "D": "device:"}, "optsZh": {"A": "device（裝置；設備）", "B": "device,（逗號 → 不當隔開主詞與動詞，錯誤）", "C": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "D": "device:（冒號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "A", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Grammar: semicolon between independent clauses", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distraction\" target=\"_blank\" rel=\"noopener\" data-w=\"distraction\" data-pos=\"n.\" data-en=\"something that takes attention away from what you should focus on\" data-zh=\"使人分心的事物\">distractions<\/a> from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。當口袋型計算機首次出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會干擾算術學習。", "opts": {"A": "this", "B": "them", "C": "that", "D": "it"}, "optsZh": {"A": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "them（他們；複數受格）", "C": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "D": "it（它；單數代名詞）"}, "answer": "B", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Grammar: semicolon between independent clauses", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常帶領讀者認識拉丁美洲文學中的魔幻寫實。", "opts": {"A": "family,", "B": "family, and", "C": "family", "D": "family and"}, "optsZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family, and（逗號＋and）", "C": "family（無標點）", "D": "family and（無標點＋and）"}, "answer": "C", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Grammar: semicolon between independent clauses", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free in part because", "B": "free, in part because,", "C": "free, in part because:", "D": "free. In part because"}, "optsZh": {"A": "free in part because（無標點，直接接原因子句）", "B": "free, in part because,（逗號＋in part because＋逗號）", "C": "free, in part because:（逗號＋in part because＋冒號）", "D": "free. In part because（句號，以 In part because 另起一句）"}, "answer": "D", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transition: result of concerning measurements", "vocab": false, "body": "Famous for its four-degree tilt, the leaning Garisenda Tower is a popular attraction in Bologna’s city center. However, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> taken in 2023 showed that the tower was rotating in a concerning way. _______ city <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=official\" target=\"_blank\" rel=\"noopener\" data-w=\"official\" data-pos=\"adj.\" data-en=\"approved by or coming from people in authority\" data-zh=\"正式的；官方的\">officials<\/a> closed the area around the tower so experts could explore solutions to stabilize the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> twelfth-century <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>.", "bodyPlain": "Famous for its four-degree tilt, the leaning Garisenda Tower is a popular attraction in Bologna’s city center. However, measurements taken in 2023 showed that the tower was rotating in a concerning way. _______ city officials closed the area around the tower so experts could explore solutions to stabilize the historical twelfth-century structure.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "以傾斜四度聞名的 Garisenda Tower（加里森達塔）是 Bologna（波隆那）市中心的熱門景點。然而，2023 年的測量顯示，這座塔正以令人擔憂的方式旋轉。_______ 市府官員封鎖了塔周邊區域，好讓專家研究如何穩固這座建於十二世紀的歷史建築。", "opts": {"A": "Similarly,", "B": "As a result,", "C": "For example,", "D": "In comparison,"}, "optsZh": {"A": "Similarly,（同樣地：表相似）", "B": "As a result,（因此：表結果，正確）", "C": "For example,（例如：表舉例）", "D": "In comparison,（相較之下：表比較）"}, "answer": "B", "expl": "Officials closed the area because of the concerning measurements, so the action is a result: 'As a result.'", "explZh": "官員因為令人擔憂的測量結果而封鎖該區，屬於因果關係，所以用 As a result。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transition: result of concerning measurements", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Sensors detected unusual movement in the bridge supports. _______ engineers closed the pedestrian path until inspectors could determine whether repairs were needed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Sensors detected unusual movement in the bridge supports. _______ engineers closed the pedestrian path until inspectors could determine whether repairs were needed.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。感測器偵測到橋梁支柱出現異常移動。_______ 工程師封閉了人行步道，直到檢查人員確定是否需要維修。", "opts": {"A": "As a result,", "B": "In comparison,", "C": "For example,", "D": "Similarly,"}, "optsZh": {"A": "As a result,（因此：表結果，正確）", "B": "In comparison,（相較之下：表比較）", "C": "For example,（例如：表舉例）", "D": "Similarly,（同樣地：表相似）"}, "answer": "A", "expl": "As a result introduces the consequence.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transition: result of concerning measurements", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The archive&#x27;s roof began leaking during heavy rain. _______ staff moved rare <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=document\" target=\"_blank\" rel=\"noopener\" data-w=\"document\" data-pos=\"v.\" data-en=\"to record something in writing or pictures\" data-zh=\"記錄\">documents<\/a> to a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temporary\" target=\"_blank\" rel=\"noopener\" data-w=\"temporary\" data-pos=\"adj.\" data-en=\"lasting for only a limited time\" data-zh=\"暫時的；臨時的\">temporary<\/a> climate-controlled room.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The archive's roof began leaking during heavy rain. _______ staff moved rare documents to a temporary climate-controlled room.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。檔案館的屋頂在大雨中開始漏水。_______ 工作人員將珍貴文件移到一間臨時的恆溫恆濕室。", "opts": {"A": "Similarly,", "B": "For instance,", "C": "As a result,", "D": "Nevertheless,"}, "optsZh": {"A": "Similarly,（同樣地：表相似）", "B": "For instance,（例如：表舉例）", "C": "As a result,（因此：表結果，正確）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "C", "expl": "As a result shows the action caused by the problem.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transition: result of concerning measurements", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Researchers found that the old dam was weakening faster than expected. _______ officials lowered the reservoir level while a repair plan was prepared.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Researchers found that the old dam was weakening faster than expected. _______ officials lowered the reservoir level while a repair plan was prepared.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。研究人員發現舊水壩劣化的速度比預期更快。_______ 官員在擬定修復計畫期間降低了水庫水位。", "opts": {"A": "For example,", "B": "Likewise,", "C": "In comparison,", "D": "As a result,"}, "optsZh": {"A": "For example,（例如：表舉例）", "B": "Likewise,（同樣地：表相似）", "C": "In comparison,（相較之下：表比較）", "D": "As a result,（因此：表結果，正確）"}, "answer": "D", "expl": "As a result marks a consequence.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transition: result of concerning measurements", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The tower&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foundation\" target=\"_blank\" rel=\"noopener\" data-w=\"foundation\" data-pos=\"n.\" data-en=\"the basis or starting point on which something is built\" data-zh=\"基礎\">foundation<\/a> shifted several centimeters in one year. _______ the city blocked nearby traffic and hired structural engineers.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The tower's foundation shifted several centimeters in one year. _______ the city blocked nearby traffic and hired structural engineers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這座塔的地基在一年內移動了好幾公分。_______ 市政府封鎖了附近的交通，並聘請了結構工程師。", "opts": {"A": "Similarly,", "B": "As a result,", "C": "For example,", "D": "In comparison,"}, "optsZh": {"A": "Similarly,（同樣地：表相似）", "B": "As a result,（因此：表結果，正確）", "C": "For example,（例如：表舉例）", "D": "In comparison,（相較之下：表比較）"}, "answer": "B", "expl": "As a result signals the response.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transition: result of concerning measurements", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The theater&#x27;s wiring failed a safety <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspection\" target=\"_blank\" rel=\"noopener\" data-w=\"inspection\" data-pos=\"n.\" data-en=\"a careful look at something\" data-zh=\"檢查；細看\">inspection<\/a>. _______ performances were moved to a neighboring venue until repairs could be completed.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The theater's wiring failed a safety inspection. _______ performances were moved to a neighboring venue until repairs could be completed.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這間劇院的電線未通過安全檢查。_______ 演出被移到鄰近的場地，直到維修完成為止。", "opts": {"A": "As a result,", "B": "For example,", "C": "In comparison,", "D": "Similarly,"}, "optsZh": {"A": "As a result,（因此：表結果，正確）", "B": "For example,（例如：表舉例）", "C": "In comparison,（相較之下：表比較）", "D": "Similarly,（同樣地：表相似）"}, "answer": "A", "expl": "As a result links cause and effect.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transition: specific explanation of model", "vocab": false, "body": "In 2021, a model <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> by astrophysicist Catherine Zucker and her research team revealed that the same supernovas responsible for the creation and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ongoing\" target=\"_blank\" rel=\"noopener\" data-w=\"ongoing\" data-pos=\"adj.\" data-en=\"continuing to happen\" data-zh=\"持續進行的\">ongoing<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expansion\" target=\"_blank\" rel=\"noopener\" data-w=\"expansion\" data-pos=\"n.\" data-en=\"an increase in size or area\" data-zh=\"擴張；擴展\">expansion<\/a> of the Local Bubble—a 14-million-year-old cavity in the Milky Way—are likely responsible for the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=formation\" target=\"_blank\" rel=\"noopener\" data-w=\"formation\" data-pos=\"n.\" data-en=\"the process by which something is formed\" data-zh=\"形成\">formation<\/a> of new stars. _______ this model detailed how the bubble’s expansion trapped interstellar clouds of gas and dust that became stars upon their eventual collapse.", "bodyPlain": "In 2021, a model developed by astrophysicist Catherine Zucker and her research team revealed that the same supernovas responsible for the creation and ongoing expansion of the Local Bubble—a 14-million-year-old cavity in the Milky Way—are likely responsible for the formation of new stars. _______ this model detailed how the bubble’s expansion trapped interstellar clouds of gas and dust that became stars upon their eventual collapse.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "2021 年，天文物理學家 Catherine Zucker 與其研究團隊所建立的模型顯示，造成本地泡（Local Bubble，銀河系中一個已有 1,400 萬年歷史的空腔）形成並持續擴張的那些超新星，很可能也促成了新恆星的形成。_______ 這個模型詳細說明了泡的擴張如何捕獲星際氣體與塵埃雲，而這些雲最終塌縮後便形成恆星。", "opts": {"A": "Hence,", "B": "However,", "C": "Admittedly,", "D": "Specifically,"}, "optsZh": {"A": "Hence,（因此：表結果 → 後句是具體說明而非結果，錯誤）", "B": "However,（然而：表轉折）", "C": "Admittedly,（誠然、不可否認：表讓步 → 前後並非讓步關係，錯誤）", "D": "Specifically,（具體來說：表進一步說明細節）"}, "answer": "D", "expl": "The second sentence gives a more detailed account of how the supernovas led to star formation, so 'Specifically' fits.", "explZh": "第二句更詳細地說明超新星如何導致恆星形成，所以用 Specifically（具體來說）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transition: specific explanation of model", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The model did more than identify the ancient river&#x27;s location. _______ it showed how seasonal floods deposited the layers of silt found across the valley.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The model did more than identify the ancient river's location. _______ it showed how seasonal floods deposited the layers of silt found across the valley.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這個模型不只確認了那條古老河流的位置。_______ 它還顯示了季節性洪水如何沉積出遍布整個河谷的淤泥層。", "opts": {"A": "Hence,", "B": "Specifically,", "C": "Admittedly,", "D": "However,"}, "optsZh": {"A": "Hence,（因此：表結果 → 後句是具體說明而非結果，錯誤）", "B": "Specifically,（具體來說：表進一步說明細節）", "C": "Admittedly,（誠然、不可否認：表讓步 → 前後並非讓步關係，錯誤）", "D": "However,（然而：表轉折）"}, "answer": "B", "expl": "Specifically introduces the precise mechanism.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transition: specific explanation of model", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The experiment revealed that the coating reduced heat loss. _______ it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=demonstrate\" target=\"_blank\" rel=\"noopener\" data-w=\"demonstrate\" data-pos=\"v.\" data-en=\"to show clearly by giving proof or examples\" data-zh=\"證明；展現\">demonstrated<\/a> that microscopic air pockets slowed the transfer of energy.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The experiment revealed that the coating reduced heat loss. _______ it demonstrated that microscopic air pockets slowed the transfer of energy.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。實驗顯示這種塗層能減少熱量散失。_______ 它證明了微小的氣孔減緩了能量的傳遞。", "opts": {"A": "Specifically,", "B": "In contrast,", "C": "Hence,", "D": "Nevertheless,"}, "optsZh": {"A": "Specifically,（具體來說：表進一步說明細節）", "B": "In contrast,（相對地：表對比）", "C": "Hence,（因此：表結果 → 後句是具體說明而非結果，錯誤）", "D": "Nevertheless,（然而、儘管如此：表讓步轉折）"}, "answer": "A", "expl": "Specifically gives the detailed explanation.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transition: specific explanation of model", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The survey showed that the garden attracted more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pollinator\" target=\"_blank\" rel=\"noopener\" data-w=\"pollinator\" data-pos=\"n.\" data-en=\"an animal, such as a bee, that carries pollen between plants\" data-zh=\"傳粉者\">pollinators<\/a>. _______ it recorded large increases in native bees during spring and early summer.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The survey showed that the garden attracted more pollinators. _______ it recorded large increases in native bees during spring and early summer.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。調查顯示這座花園吸引了更多授粉者。_______ 它記錄到原生蜜蜂在春季與初夏大幅增加。", "opts": {"A": "Hence,", "B": "Admittedly,", "C": "However,", "D": "Specifically,"}, "optsZh": {"A": "Hence,（因此：表結果 → 後句是具體說明而非結果，錯誤）", "B": "Admittedly,（誠然、不可否認：表讓步 → 前後並非讓步關係，錯誤）", "C": "However,（然而：表轉折）", "D": "Specifically,（具體來說：表進一步說明細節）"}, "answer": "D", "expl": "Specifically narrows to an exact finding.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transition: specific explanation of model", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The simulation explained why the coastline eroded so quickly. _______ it traced how waves redirected sand away from the beach after the pier was built.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The simulation explained why the coastline eroded so quickly. _______ it traced how waves redirected sand away from the beach after the pier was built.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這項模擬解釋了海岸線為何侵蝕得如此快速。_______ 它追蹤了在碼頭興建後，海浪如何將沙子帶離海灘。", "opts": {"A": "Hence,", "B": "However,", "C": "Specifically,", "D": "Admittedly,"}, "optsZh": {"A": "Hence,（因此：表結果 → 後句是具體說明而非結果，錯誤）", "B": "However,（然而：表轉折）", "C": "Specifically,（具體來說：表進一步說明細節）", "D": "Admittedly,（誠然、不可否認：表讓步 → 前後並非讓步關係，錯誤）"}, "answer": "C", "expl": "Specifically adds the mechanism.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transition: specific explanation of model", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The analysis clarified how the mural was restored. _______ it identified the pigments that conservators matched when replacing damaged sections.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The analysis clarified how the mural was restored. _______ it identified the pigments that conservators matched when replacing damaged sections.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這項分析釐清了這幅壁畫是如何修復的。_______ 它辨識出修復人員在替換受損部分時所比對的顏料。", "opts": {"A": "Hence,", "B": "Admittedly,", "C": "Nevertheless,", "D": "Specifically,"}, "optsZh": {"A": "Hence,（因此：表結果 → 後句是具體說明而非結果，錯誤）", "B": "Admittedly,（誠然、不可否認：表讓步 → 前後並非讓步關係，錯誤）", "C": "Nevertheless,（然而、儘管如此：表讓步轉折）", "D": "Specifically,（具體來說：表進一步說明細節）"}, "answer": "D", "expl": "Specifically introduces detail.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transition: in particular narrows grains", "vocab": false, "body": "Following the American Revolutionary War, North American foodways underwent a radical transformation, fueled in large part by spiking <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumer\" target=\"_blank\" rel=\"noopener\" data-w=\"consumer\" data-pos=\"n.\" data-en=\"a person who buys goods or services\" data-zh=\"消費者\">consumer<\/a> demand for certain grains. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cultivation\" target=\"_blank\" rel=\"noopener\" data-w=\"cultivation\" data-pos=\"n.\" data-en=\"the growing of crops\" data-zh=\"耕種；栽培\">cultivation<\/a>, trade, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a> of maize and wheat, _______ reconfigured the continent’s existing regional foodways into a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=global\" target=\"_blank\" rel=\"noopener\" data-w=\"global\" data-pos=\"adj.\" data-en=\"relating to the whole world\" data-zh=\"全球的；世界的\">globally<\/a> oriented food system.", "bodyPlain": "Following the American Revolutionary War, North American foodways underwent a radical transformation, fueled in large part by spiking consumer demand for certain grains. The cultivation, trade, and transportation of maize and wheat, _______ reconfigured the continent’s existing regional foodways into a globally oriented food system.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "美國獨立戰爭之後，北美的飲食方式經歷了劇烈的轉變，而這在很大程度上是由消費者對某些穀物急遽增加的需求所推動。玉米與小麥的種植、貿易與運輸，_______ 將北美大陸既有的區域飲食方式重新塑造成以全球為導向的糧食體系。", "opts": {"A": "in particular,", "B": "alternatively,", "C": "by comparison,", "D": "second of all,"}, "optsZh": {"A": "in particular,（尤其是、特別是：從整體縮小到具體例子，正確）", "B": "alternatively,（或者、另一種選擇：表替代 → 不合邏輯，錯誤）", "C": "by comparison,（相較之下：表比較對照 → 不合邏輯，錯誤）", "D": "second of all,（第二：表列舉順序 → 不合邏輯，錯誤）"}, "answer": "A", "expl": "Maize and wheat are the particular grains among the 'certain grains' mentioned, so 'in particular' fits.", "explZh": "maize 和 wheat 正是前文所說「某些穀物」中的具體例子，所以用 in particular（特別是）。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transition: in particular narrows grains", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Postwar diets changed because several crops became easier to transport. Wheat and rice, _______ became central to newly expanded regional markets.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Postwar diets changed because several crops became easier to transport. Wheat and rice, _______ became central to newly expanded regional markets.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。戰後的飲食改變，是因為有幾種作物變得更容易運輸。小麥與稻米，_______ 成為新擴大的區域市場的核心。", "opts": {"A": "by comparison,", "B": "second of all,", "C": "in particular,", "D": "alternatively,"}, "optsZh": {"A": "by comparison,（相較之下：表比較對照 → 不合邏輯，錯誤）", "B": "second of all,（第二：表列舉順序 → 不合邏輯，錯誤）", "C": "in particular,（尤其是、特別是：從整體縮小到具體例子，正確）", "D": "alternatively,（或者、另一種選擇：表替代 → 不合邏輯，錯誤）"}, "answer": "C", "expl": "In particular singles out examples.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transition: in particular narrows grains", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> focuses on materials that transformed urban design. Steel and glass, _______ allowed architects to build taller and brighter <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition focuses on materials that transformed urban design. Steel and glass, _______ allowed architects to build taller and brighter structures.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這場展覽聚焦於改變城市設計的材料。鋼鐵與玻璃，_______ 讓建築師能夠建造更高、更明亮的建築。", "opts": {"A": "alternatively,", "B": "in particular,", "C": "by comparison,", "D": "nevertheless,"}, "optsZh": {"A": "alternatively,（或者、另一種選擇：表替代 → 不合邏輯，錯誤）", "B": "in particular,（尤其是、特別是：從整體縮小到具體例子，正確）", "C": "by comparison,（相較之下：表比較對照 → 不合邏輯，錯誤）", "D": "nevertheless,（儘管如此）"}, "answer": "B", "expl": "In particular narrows the category.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transition: in particular narrows grains", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The program improved access to several public services. Health clinics and libraries, _______ began reaching <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> that had previously been underserved.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The program improved access to several public services. Health clinics and libraries, _______ began reaching neighborhoods that had previously been underserved.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這項計畫改善了民眾取得多項公共服務的管道。醫療診所與圖書館，_______ 開始服務那些過去資源不足的社區。", "opts": {"A": "in particular,", "B": "alternatively,", "C": "by comparison,", "D": "second of all,"}, "optsZh": {"A": "in particular,（尤其是、特別是：從整體縮小到具體例子，正確）", "B": "alternatively,（或者、另一種選擇：表替代 → 不合邏輯，錯誤）", "C": "by comparison,（相較之下：表比較對照 → 不合邏輯，錯誤）", "D": "second of all,（第二：表列舉順序 → 不合邏輯，錯誤）"}, "answer": "A", "expl": "In particular highlights specific examples.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transition: in particular narrows grains", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The treaty affected multiple industries. Shipping and insurance, _______ had to adapt quickly to the new regulations.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The treaty affected multiple industries. Shipping and insurance, _______ had to adapt quickly to the new regulations.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這項條約影響了多個產業。航運業與保險業，_______ 必須迅速適應新的法規。", "opts": {"A": "alternatively,", "B": "by comparison,", "C": "second of all,", "D": "in particular,"}, "optsZh": {"A": "alternatively,（或者、另一種選擇：表替代 → 不合邏輯，錯誤）", "B": "by comparison,（相較之下：表比較對照 → 不合邏輯，錯誤）", "C": "second of all,（第二：表列舉順序 → 不合邏輯，錯誤）", "D": "in particular,（尤其是、特別是：從整體縮小到具體例子，正確）"}, "answer": "D", "expl": "In particular specifies the industries.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transition: in particular narrows grains", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> changed the sound of the ensemble. The clarinet and bassoon, _______ gave composers new ways to create contrast.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Several instruments changed the sound of the ensemble. The clarinet and bassoon, _______ gave composers new ways to create contrast.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。有幾種樂器改變了這個樂團的聲音。單簧管與低音管，_______ 為作曲家提供了創造對比的新方式。", "opts": {"A": "alternatively,", "B": "in particular,", "C": "nevertheless,", "D": "by comparison,"}, "optsZh": {"A": "alternatively,（或者、另一種選擇：表替代 → 不合邏輯，錯誤）", "B": "in particular,（尤其是、特別是：從整體縮小到具體例子，正確）", "C": "nevertheless,（儘管如此）", "D": "by comparison,（相較之下：表比較對照 → 不合邏輯，錯誤）"}, "answer": "B", "expl": "In particular identifies examples.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transition: to that end introduces action serving goal", "vocab": false, "body": "When, in 2017, Cambridge University students Lucy Moss and Toby Marlow decided they wanted to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">develop<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=musical\" target=\"_blank\" rel=\"noopener\" data-w=\"musical\" data-pos=\"n.\" data-en=\"a play or film in which singing and dancing tell the story\" data-zh=\"音樂劇\">musical<\/a> together, one of their goals was for their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> actor friends to have good parts to play. _______ they created the show Six, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=retelling\" target=\"_blank\" rel=\"noopener\" data-w=\"retelling\" data-pos=\"n.\" data-en=\"a new version of a story told before\" data-zh=\"重述；改寫\">retelling<\/a> of the history of King Henry VIII’s wives in which each of the six queens has a starring role.", "bodyPlain": "When, in 2017, Cambridge University students Lucy Moss and Toby Marlow decided they wanted to develop a musical together, one of their goals was for their female actor friends to have good parts to play. _______ they created the show Six, a retelling of the history of King Henry VIII’s wives in which each of the six queens has a starring role.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "2017 年，劍橋大學學生 Lucy Moss 與 Toby Marlow 決定合作創作一齣音樂劇時，他們的目標之一是讓身為女演員的朋友們有好角色可以演。_______ 他們創作了《Six》，這齣劇重新詮釋英王亨利八世諸位妻子的歷史，六位王后每一位都擔綱主角。", "opts": {"A": "In other words,", "B": "In summary,", "C": "For example,", "D": "To that end,"}, "optsZh": {"A": "In other words,（換句話說；表重述）", "B": "In summary,（總而言之：表總結 → 後句是為達目標採取的行動，錯誤）", "C": "For example,（例如：表舉例）", "D": "To that end,（為此：引出為達成前述目標而採取的行動，正確）"}, "answer": "D", "expl": "Creating Six, in which every queen has a starring role, was an action taken to achieve their goal of good parts for female friends: 'To that end.'", "explZh": "創作每位王后都有主角戲份的 Six，正是為了實現讓女演員朋友有好角色的目標，所以用 To that end（為此）。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transition: to that end introduces action serving goal", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, co
