<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 7, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 7, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>

  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>

      <button type="button" id="resetQuiz">Reset answers</button>

    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: popularize an accessible medium", "vocab": true, "body": "Taking <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> in the mid-1800s was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expensive\" target=\"_blank\" rel=\"noopener\" data-w=\"expensive\" data-pos=\"adj.\" data-en=\"costing a lot of money\" data-zh=\"昂貴的\">expensive<\/a>, but this changed with the 1854 invention of the carte de visite, a small photo that cost little to make. Carte de visite photos helped to _______ photography: they made it easy and enjoyable for everyday people to have their pictures taken, and people at the time loved exchanging these small photos with friends and family.", "bodyPlain": "Taking photographs in the mid-1800s was complicated and expensive, but this changed with the 1854 invention of the carte de visite, a small photo that cost little to make. Carte de visite photos helped to _______ photography: they made it easy and enjoyable for everyday people to have their pictures taken, and people at the time loved exchanging these small photos with friends and family.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在 1800 年代中期，拍照既複雜又昂貴，但隨著 1854 年名片照（carte de visite）的發明，情況有了改變；名片照是一種製作成本低廉的小型照片。名片照幫助 _______ 攝影：它們讓一般民眾能輕鬆愉快地拍照，而當時的人們也非常喜歡與親友交換這些小照片。", "opts": {"A": "weaken", "B": "praise", "C": "popularize", "D": "isolate"}, "optsZh": {"A": "weaken（減弱）", "B": "praise（讚揚）", "C": "popularize（使普及、推廣）", "D": "isolate（孤立、隔離）"}, "answer": "C", "expl": "Carte de visite photos made it easy and enjoyable for everyday people to have their pictures taken, so they helped 'popularize' (make widely used and liked) photography.", "explZh": "名片照讓一般人能輕鬆愉快地拍照，因此它們幫助「popularize」（普及）了攝影。", "defs": {"A": {"pos": "v.", "en": "to make or become less strong", "zh": "削弱；減弱", "word": "weaken"}, "B": {"pos": "v.", "en": "to express approval or admiration of", "zh": "讚美；稱讚", "word": "praise"}, "C": {"pos": "v.", "en": "to make something liked or used by many ordinary people", "zh": "使普及；推廣", "word": "popularize"}, "D": {"pos": "v.", "en": "to separate something from others", "zh": "孤立；隔離", "word": "isolate"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: popularize an accessible medium", "vocab": true, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The inexpensive pamphlet did not merely report the reformer&#x27;s ideas; by circulating them in markets and schools, it helped _______ the movement among readers who had never attended a political meeting.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The inexpensive pamphlet did not merely report the reformer's ideas; by circulating them in markets and schools, it helped _______ the movement among readers who had never attended a political meeting.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這本價格低廉的小冊子不只是報導這位改革者的理念；它透過在市場與學校中流通這些理念，幫助 _______ 這場運動於那些從未參加過政治集會的讀者之中。", "opts": {"A": "popularize", "B": "weaken", "C": "isolate", "D": "misquote"}, "optsZh": {"A": "popularize（使普及、推廣）", "B": "weaken（減弱）", "C": "isolate（孤立、隔離）", "D": "misquote（錯誤引用、誤引）"}, "answer": "A", "expl": "Popularize means make widely known or liked.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something liked or used by many ordinary people", "zh": "使普及；推廣", "word": "popularize"}, "B": {"pos": "v.", "en": "to make or become less strong", "zh": "削弱；減弱", "word": "weaken"}, "C": {"pos": "v.", "en": "to separate something from others", "zh": "孤立；隔離", "word": "isolate"}, "D": {"pos": "v.", "en": "to repeat someone's words incorrectly", "zh": "錯誤引用", "word": "misquote"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: popularize an accessible medium", "vocab": true, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Because the portable camera was affordable and easy to use, it helped _______ amateur photography, turning what had been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> craft into a common family pastime.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Because the portable camera was affordable and easy to use, it helped _______ amateur photography, turning what had been a specialized craft into a common family pastime.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。由於這款攜帶型相機價格實惠又容易使用，它幫助 _______ 業餘攝影，使原本屬於專門技藝的活動成為普遍的家庭休閒。", "opts": {"A": "criticize", "B": "spread", "C": "restrict", "D": "replace"}, "optsZh": {"A": "criticize（批評）", "B": "spread（散布；傳播）", "C": "restrict（限制）", "D": "replace（取代）"}, "answer": "B", "expl": "Spread means make more widely adopted.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to say what is bad or wrong about someone or something", "zh": "批評", "word": "criticize"}, "B": {"pos": "v.", "en": "to cause to reach a wider area or more people", "zh": "散布；傳播", "word": "spread"}, "C": {"pos": "v.", "en": "to limit or control something", "zh": "限制", "word": "restrict"}, "D": {"pos": "v.", "en": "to put something new in place of something else", "zh": "取代；替換", "word": "replace"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: popularize an accessible medium", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The radio program&#x27;s lively interviews helped _______ jazz history for younger listeners who had assumed the genre belonged only in textbooks and archives.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The radio program's lively interviews helped _______ jazz history for younger listeners who had assumed the genre belonged only in textbooks and archives.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這個廣播節目生動的訪談幫助 _______ 爵士樂史給年輕聽眾，他們原本以為這種音樂類型只屬於教科書與檔案庫。", "opts": {"A": "complicate", "B": "conceal", "C": "popularize", "D": "diminish"}, "optsZh": {"A": "complicate（使複雜化）", "B": "conceal（隱藏；隱瞞）", "C": "popularize（使普及、推廣）", "D": "diminish（減少、減弱）"}, "answer": "C", "expl": "Popularize fits the idea of making a subject broadly appealing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something more difficult to understand or deal with", "zh": "使複雜化", "word": "complicate"}, "B": {"pos": "v.", "en": "to hide something or keep it secret", "zh": "隱藏；隱瞞", "word": "conceal"}, "C": {"pos": "v.", "en": "to make something liked or used by many ordinary people", "zh": "使普及；推廣", "word": "popularize"}, "D": {"pos": "v.", "en": "to make or become smaller or less important", "zh": "減少；減弱；降低", "word": "diminish"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: popularize an accessible medium", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Cheap serialized editions helped _______ the novel, allowing factory workers and shop clerks to buy installments that had once been too expensive in book form.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Cheap serialized editions helped _______ the novel, allowing factory workers and shop clerks to buy installments that had once been too expensive in book form.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。廉價的連載版本幫助 _______ 小說，讓工廠工人與店員能夠購買分期出版的章節，而這些內容過去以書籍形式出版時價格過於昂貴。", "opts": {"A": "obscure", "B": "formalize", "C": "weaken", "D": "democratize"}, "optsZh": {"A": "obscure（模糊的；鮮為人知的；使隱晦）", "B": "formalize（使正式化、使規範化）", "C": "weaken（減弱）", "D": "democratize（使大眾化、使普及於大眾）"}, "answer": "D", "expl": "Democratize means make accessible to many people.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "B": {"pos": "v.", "en": "to make something official or give it a fixed structure", "zh": "使正式化", "word": "formalize"}, "C": {"pos": "v.", "en": "to make or become less strong", "zh": "削弱；減弱", "word": "weaken"}, "D": {"pos": "v.", "en": "to make something available to all people", "zh": "使大眾化；使民主化", "word": "democratize"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: popularize an accessible medium", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The museum&#x27;s free digital tours helped _______ its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a>, drawing attention from students far beyond the city where the archive is housed.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The museum's free digital tours helped _______ its manuscript collection, drawing attention from students far beyond the city where the archive is housed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這間博物館免費的線上導覽幫助 _______ 其手稿館藏，吸引了遠在檔案館所在城市以外的學生的關注。", "opts": {"A": "standardize", "B": "damage", "C": "publicize", "D": "isolate"}, "optsZh": {"A": "standardize（使標準化）", "B": "damage（損害）", "C": "publicize（宣傳、使廣為人知）", "D": "isolate（孤立、隔離）"}, "answer": "C", "expl": "Publicize means bring to public attention.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make things the same according to a fixed standard", "zh": "使標準化", "word": "standardize"}, "B": {"pos": "v.", "en": "to harm or break something", "zh": "損害；破壞", "word": "damage"}, "C": {"pos": "v.", "en": "to make something widely known to the public", "zh": "宣傳；公開", "word": "publicize"}, "D": {"pos": "v.", "en": "to separate something from others", "zh": "孤立；隔離", "word": "isolate"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: influenced by natural forms", "vocab": true, "body": "Painter Alma W. Thomas was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fascinate\" target=\"_blank\" rel=\"noopener\" data-w=\"fascinate\" data-pos=\"v.\" data-en=\"to attract and hold someone&#x27;s strong interest\" data-zh=\"使著迷\">fascinated<\/a> by the colors and shapes found in nature. The flowers and trees in the garden at her home in Washington, DC, _______ her work. For example, Thomas&#x27;s use of broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=brushstroke\" target=\"_blank\" rel=\"noopener\" data-w=\"brushstroke\" data-pos=\"n.\" data-en=\"a mark made by a paintbrush on a surface\" data-zh=\"筆觸\">brushstrokes<\/a> was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspired\" target=\"_blank\" rel=\"noopener\" data-w=\"inspired\" data-pos=\"v.\" data-en=\"gave someone the idea or the desire to create something\" data-zh=\"啟發；激發\">inspired<\/a> by the way that light would shine through the leaves of a tree in front of her house.", "bodyPlain": "Painter Alma W. Thomas was fascinated by the colors and shapes found in nature. The flowers and trees in the garden at her home in Washington, DC, _______ her work. For example, Thomas's use of broken brushstrokes was inspired by the way that light would shine through the leaves of a tree in front of her house.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "畫家 Alma W.Thomas 對大自然中的色彩與形狀深深著迷。她位於華盛頓特區住家花園中的花朵與樹木 _______ 她的作品。舉例來說，Thomas 運用斷續筆觸的手法，靈感來自陽光穿過她家門前一棵樹的枝葉灑落的樣子。", "opts": {"A": "restricted", "B": "announced", "C": "distracted", "D": "influenced"}, "optsZh": {"A": "restricted（限制）", "B": "announced（宣布）", "C": "distracted（使分心、干擾）", "D": "influenced（影響）"}, "answer": "D", "expl": "The example shows Thomas's brushstrokes were inspired by light through leaves, so the garden 'influenced' her work.", "explZh": "例子說明 Thomas 的筆觸靈感來自穿過樹葉的光線，所以花園「influenced」（影響了）她的作品。", "defs": {"A": {"pos": "v.", "en": "limited; kept within certain bounds", "zh": "限制；約束", "word": "restricted"}, "B": {"pos": "v.", "en": "told people something officially", "zh": "宣布", "word": "announced"}, "C": {"pos": "v.", "en": "took someone's attention away from what they were doing", "zh": "使分心", "word": "distracted"}, "D": {"pos": "v.", "en": "had an effect on how someone or something developed", "zh": "影響", "word": "influenced"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: influenced by natural forms", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The composer said the coastal landscape did not merely appear in her titles; the rhythm of waves and foghorns _______ the structure of several movements.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The composer said the coastal landscape did not merely appear in her titles; the rhythm of waves and foghorns _______ the structure of several movements.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這位作曲家表示，海岸景觀不只出現在她的作品標題中；海浪與霧笛的節奏也 _______ 了好幾個樂章的結構。", "opts": {"A": "shaped", "B": "ignored", "C": "restricted", "D": "interrupted"}, "optsZh": {"A": "shaped（塑造、形塑）", "B": "ignored（被忽視的）", "C": "restricted（限制）", "D": "interrupted（打斷、中斷）"}, "answer": "A", "expl": "Shaped means influenced the development of something.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "influenced the form or development of something", "zh": "塑造；影響", "word": "shaped"}, "B": {"pos": "v.", "en": "paid no attention to something", "zh": "忽視", "word": "ignored"}, "C": {"pos": "v.", "en": "limited; kept within certain bounds", "zh": "限制；約束", "word": "restricted"}, "D": {"pos": "v.", "en": "stopped something for a short time; broke in", "zh": "打斷；中斷", "word": "interrupted"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: influenced by natural forms", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The architect&#x27;s childhood in a crowded apartment building clearly _______ her later designs, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> shared courtyards and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flexible\" target=\"_blank\" rel=\"noopener\" data-w=\"flexible\" data-pos=\"adj.\" data-en=\"able to bend easily\" data-zh=\"可彎曲的；有彈性的\">flexible<\/a> communal rooms.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The architect's childhood in a crowded apartment building clearly _______ her later designs, which emphasize shared courtyards and flexible communal rooms.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這位建築師在擁擠公寓大樓中度過的童年，顯然 _______ 了她日後的設計，這些設計強調共享中庭與彈性的公共空間。", "opts": {"A": "delayed", "B": "contradicted", "C": "obscured", "D": "influenced"}, "optsZh": {"A": "delayed（延誤、推遲）", "B": "contradicted（與……矛盾、反駁）", "C": "obscured（遮蔽、使模糊）", "D": "influenced（影響）"}, "answer": "D", "expl": "Influenced means affected or guided.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "made something happen later than planned", "zh": "延遲；推遲", "word": "delayed"}, "B": {"pos": "v.", "en": "said or showed that something is not true", "zh": "反駁；與……矛盾", "word": "contradicted"}, "C": {"pos": "v.", "en": "made something hard to see or understand", "zh": "遮蔽；使模糊", "word": "obscured"}, "D": {"pos": "v.", "en": "had an effect on how someone or something developed", "zh": "影響", "word": "influenced"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: influenced by natural forms", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The painter&#x27;s desert palette was _______ by the mineral colors she observed while hiking through dry canyons at sunset.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The painter's desert palette was _______ by the mineral colors she observed while hiking through dry canyons at sunset.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這位畫家的沙漠色調是 _______ 自她在日落時分健行穿越乾燥峽谷時所觀察到的礦物色彩。", "opts": {"A": "classified", "B": "restricted", "C": "inspired", "D": "distracted"}, "optsZh": {"A": "classified（分類）", "B": "restricted（限制）", "C": "inspired（啟發、激發）", "D": "distracted（使分心、干擾）"}, "answer": "C", "expl": "Inspired means creatively influenced.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "arranged things into groups (past tense of classify)", "zh": "分類（classify 的過去式／過去分詞）", "word": "classified"}, "B": {"pos": "v.", "en": "limited; kept within certain bounds", "zh": "限制；約束", "word": "restricted"}, "C": {"pos": "v.", "en": "gave someone the idea or the desire to create something", "zh": "啟發；激發", "word": "inspired"}, "D": {"pos": "v.", "en": "took someone's attention away from what they were doing", "zh": "使分心", "word": "distracted"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: influenced by natural forms", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The poet&#x27;s syntax was _______ by oral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=storytelling\" target=\"_blank\" rel=\"noopener\" data-w=\"storytelling\" data-pos=\"n.\" data-en=\"the activity of telling stories\" data-zh=\"說故事\">storytelling<\/a> traditions, especially the repeated phrases used to guide listeners through long narratives.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The poet's syntax was _______ by oral storytelling traditions, especially the repeated phrases used to guide listeners through long narratives.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這位詩人的句法是 _______ 自口述故事傳統，尤其是那些用來引導聽眾聽完長篇敘事的重複詞句。", "opts": {"A": "rejected", "B": "informed", "C": "repaired", "D": "announced"}, "optsZh": {"A": "rejected（拒絕；否決）", "B": "informed（形塑、影響；告知）", "C": "repaired（修理）", "D": "announced（宣布）"}, "answer": "B", "expl": "Informed means shaped or influenced.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "refused to accept or believe something", "zh": "拒絕；駁回", "word": "rejected"}, "B": {"pos": "v.", "en": "gave information to; shaped or guided (work or ideas)", "zh": "告知；為……提供依據、影響", "word": "informed"}, "C": {"pos": "v.", "en": "fixed something that was broken", "zh": "修理；修復", "word": "repaired"}, "D": {"pos": "v.", "en": "told people something officially", "zh": "宣布", "word": "announced"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: influenced by natural forms", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=choreographer\" target=\"_blank\" rel=\"noopener\" data-w=\"choreographer\" data-pos=\"n.\" data-en=\"a person who designs dance movements\" data-zh=\"編舞家\">choreographer<\/a>&#x27;s movements were _______ by the angular shadows cast by bridges over the river near her studio.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The choreographer's movements were _______ by the angular shadows cast by bridges over the river near her studio.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這位編舞家的動作是 _______ 自她工作室附近河上橋梁投下的稜角分明的陰影。", "opts": {"A": "limited", "B": "misread", "C": "erased", "D": "guided"}, "optsZh": {"A": "limited（限制）", "B": "misread（誤讀；誤解）", "C": "erased（抹除、消除）", "D": "guided（引導、指引）"}, "answer": "D", "expl": "Guided means influenced in direction or form.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "kept something within a certain size or range", "zh": "限制", "word": "limited"}, "B": {"pos": "v.", "en": "read or interpreted something incorrectly", "zh": "誤讀；誤解", "word": "misread"}, "C": {"pos": "v.", "en": "removed completely", "zh": "抹去；消除", "word": "erased"}, "D": {"pos": "v.", "en": "directed or influenced the way something developed", "zh": "引導；指引", "word": "guided"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: conservation approach was successful", "vocab": true, "body": "In the 1990s, conservationists began planting more than 500,000 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=native\" target=\"_blank\" rel=\"noopener\" data-w=\"native\" data-pos=\"adj.\" data-en=\"originally from a particular place\" data-zh=\"本土的；原生的\">native<\/a> trees in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=habitat\" target=\"_blank\" rel=\"noopener\" data-w=\"habitat\" data-pos=\"n.\" data-en=\"the natural home of an animal or plant\" data-zh=\"棲息地\">habitat<\/a> of the Azores bullfinch to boost the bird’s numbers. This approach was apparently _______: the Azores bullfinch’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> size increased from as few as 100 birds at the end of the 1980s to around 1,300 in 2023.", "bodyPlain": "In the 1990s, conservationists began planting more than 500,000 native trees in the habitat of the Azores bullfinch to boost the bird’s numbers. This approach was apparently _______: the Azores bullfinch’s population size increased from as few as 100 birds at the end of the 1980s to around 1,300 in 2023.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "1990 年代，保育人士開始在 Azores bullfinch（亞速爾紅腹灰雀）的棲地種植超過 50 萬棵原生樹木，以增加這種鳥的數量。這個做法顯然 _______：Azores bullfinch 的族群數量從 1980 年代末期的僅約 100 隻，增加到 2023 年的約 1,300 隻。", "opts": {"A": "amusing", "B": "costly", "C": "successful", "D": "disastrous"}, "optsZh": {"A": "amusing（有趣的、好笑的）", "B": "costly（代價高昂的、昂貴的）", "C": "successful（成功的）", "D": "disastrous（災難性的、慘敗的）"}, "answer": "C", "expl": "The bullfinch population grew from about 100 to about 1,300 birds, so the tree-planting approach was 'successful.'", "explZh": "紅腹灰雀的數量從約 100 隻增加到約 1,300 隻，所以這種種樹方法是「successful」（成功的）。", "defs": {"A": {"pos": "adj.", "en": "funny or entertaining", "zh": "有趣的；好笑的", "word": "amusing"}, "B": {"pos": "adj.", "en": "costing a lot of money or causing loss", "zh": "昂貴的；代價高的", "word": "costly"}, "C": {"pos": "adj.", "en": "achieving the desired result", "zh": "成功的", "word": "successful"}, "D": {"pos": "adj.", "en": "very bad; causing great harm or failure", "zh": "災難性的；極糟的", "word": "disastrous"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: conservation approach was successful", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The wetland restoration was clearly _______: after native reeds were replanted, the number of nesting herons in the area doubled within five years.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The wetland restoration was clearly _______: after native reeds were replanted, the number of nesting herons in the area doubled within five years.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這項濕地復育工作顯然 _______：在重新種植原生蘆葦之後，該地區築巢的蒼鷺數量在五年內增加了一倍。", "opts": {"A": "amusing", "B": "effective", "C": "improbable", "D": "costly"}, "optsZh": {"A": "amusing（有趣的、好笑的）", "B": "effective（有效的）", "C": "improbable（不太可能的）", "D": "costly（代價高昂的、昂貴的）"}, "answer": "B", "expl": "Effective means successful in producing the intended result.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "funny or entertaining", "zh": "有趣的；好笑的", "word": "amusing"}, "B": {"pos": "adj.", "en": "producing the result that is wanted", "zh": "有效的", "word": "effective"}, "C": {"pos": "adj.", "en": "not likely to happen or be true", "zh": "不太可能的", "word": "improbable"}, "D": {"pos": "adj.", "en": "costing a lot of money or causing loss", "zh": "昂貴的；代價高的", "word": "costly"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: conservation approach was successful", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The literacy program appears to have been _______; participating schools reported higher reading persistence and fewer missed assignments the following year.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The literacy program appears to have been _______; participating schools reported higher reading persistence and fewer missed assignments the following year.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這項讀寫能力計畫似乎 _______；參與的學校在隔年回報學生的閱讀持續度提高，缺交作業也減少了。", "opts": {"A": "temporary", "B": "controversial", "C": "successful", "D": "irrelevant"}, "optsZh": {"A": "temporary（暫時的）", "B": "controversial（有爭議的）", "C": "successful（成功的）", "D": "irrelevant（無關的）"}, "answer": "C", "expl": "Successful means achieving the intended aim.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}, "B": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}, "C": {"pos": "adj.", "en": "achieving the desired result", "zh": "成功的", "word": "successful"}, "D": {"pos": "adj.", "en": "not related to the matter being discussed", "zh": "無關的", "word": "irrelevant"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: conservation approach was successful", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The vaccination campaign was _______: infection rates fell sharply in the districts where mobile clinics reached the most residents.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The vaccination campaign was _______: infection rates fell sharply in the districts where mobile clinics reached the most residents.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這項疫苗接種運動 _______：在行動診所接觸到最多居民的地區，感染率大幅下降。", "opts": {"A": "productive", "B": "decorative", "C": "symbolic", "D": "expensive"}, "optsZh": {"A": "productive（有成效的、多產的）", "B": "decorative（裝飾性的）", "C": "symbolic（象徵性的）", "D": "expensive（昂貴的）"}, "answer": "A", "expl": "Productive means yielding useful results.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "producing a lot or achieving good results", "zh": "有成效的；多產的", "word": "productive"}, "B": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的", "word": "decorative"}, "C": {"pos": "adj.", "en": "serving as a symbol; representing something else", "zh": "象徵性的；象徵的", "word": "symbolic"}, "D": {"pos": "adj.", "en": "costing a lot of money", "zh": "昂貴的", "word": "expensive"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: conservation approach was successful", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The new irrigation schedule proved _______; crop losses declined even though the region received less rain than usual.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The new irrigation schedule proved _______; crop losses declined even though the region received less rain than usual.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。新的灌溉時程證明 _______；即使該地區的降雨量比平常少，作物損失仍然下降了。", "opts": {"A": "beneficial", "B": "amusing", "C": "ordinary", "D": "disastrous"}, "optsZh": {"A": "beneficial（有益的）", "B": "amusing（有趣的、好笑的）", "C": "ordinary（普通的；平凡的）", "D": "disastrous（災難性的、慘敗的）"}, "answer": "A", "expl": "Beneficial means producing a good result.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having a good or helpful effect", "zh": "有益的；有利的", "word": "beneficial"}, "B": {"pos": "adj.", "en": "funny or entertaining", "zh": "有趣的；好笑的", "word": "amusing"}, "C": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "D": {"pos": "adj.", "en": "very bad; causing great harm or failure", "zh": "災難性的；極糟的", "word": "disastrous"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: conservation approach was successful", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The tutoring initiative was _______: students who attended regularly made larger gains than comparable students who did not participate.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The tutoring initiative was _______: students who attended regularly made larger gains than comparable students who did not participate.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這項課輔計畫 _______：定期參加的學生，進步幅度比未參加的同類學生更大。", "opts": {"A": "incidental", "B": "ambiguous", "C": "costly", "D": "fruitful"}, "optsZh": {"A": "incidental（附帶的、偶然的）", "B": "ambiguous（模糊的、含糊不清的）", "C": "costly（代價高昂的、昂貴的）", "D": "fruitful（富有成效的、碩果累累的）"}, "answer": "D", "expl": "Fruitful means successful or productive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening by chance as a minor side effect, not by design", "zh": "偶然的；附帶的", "word": "incidental"}, "B": {"pos": "adj.", "en": "having more than one possible meaning; unclear", "zh": "模糊的；含糊不清的", "word": "ambiguous"}, "C": {"pos": "adj.", "en": "costing a lot of money or causing loss", "zh": "昂貴的；代價高的", "word": "costly"}, "D": {"pos": "adj.", "en": "producing good or useful results", "zh": "富有成果的", "word": "fruitful"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: unusually long gamma-ray burst", "vocab": true, "body": "The recently observed gamma ray burst GRB 230307A lasted for 200 seconds, _______ for a burst <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generate\" target=\"_blank\" rel=\"noopener\" data-w=\"generate\" data-pos=\"v.\" data-en=\"to produce\" data-zh=\"產生\">generated<\/a> by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=merger\" target=\"_blank\" rel=\"noopener\" data-w=\"merger\" data-pos=\"n.\" data-en=\"the joining of two things into one\" data-zh=\"合併\">merger<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neutron\" target=\"_blank\" rel=\"noopener\" data-w=\"neutron\" data-pos=\"n.\" data-en=\"a particle with no electric charge found in the nucleus of an atom\" data-zh=\"中子\">neutron<\/a> stars. Bursts caused by neutron mergers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=typically\" target=\"_blank\" rel=\"noopener\" data-w=\"typically\" data-pos=\"adv.\" data-en=\"usually; in most cases\" data-zh=\"通常；一般而言\">typically<\/a> last fewer than 2 seconds.", "bodyPlain": "The recently observed gamma ray burst GRB 230307A lasted for 200 seconds, _______ for a burst generated by the merger of neutron stars. Bursts caused by neutron mergers typically last fewer than 2 seconds.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "最近觀測到的伽瑪射線暴 GRB 230307A 持續了 200 秒，對於由中子星合併所產生的爆發而言，_______。由中子星合併所引起的爆發，通常持續不到 2 秒。", "opts": {"A": "a coincidence", "B": "a reprieve", "C": "an incident", "D": "an oddity"}, "optsZh": {"A": "a coincidence（巧合）", "B": "a reprieve（暫緩、喘息的機會）", "C": "an incident（事件、事故）", "D": "an oddity（一件怪事、反常現象）"}, "answer": "D", "expl": "Neutron-merger bursts usually last under 2 seconds, so a 200-second burst is 'an oddity' — something unusual.", "explZh": "中子星合併產生的爆發通常不到 2 秒，所以持續 200 秒的爆發是「an oddity」（反常的怪事）。", "defs": {"A": {"w": "coincidence", "pos": "n.", "en": "a surprising situation in which two things happen together by chance", "zh": "巧合", "word": "coincidence"}, "B": {"w": "reprieve", "pos": "n.", "en": "a temporary relief or delay from something unpleasant", "zh": "暫時緩解；緩刑", "word": "reprieve"}, "C": {"w": "incident", "pos": "n.", "en": "an event, especially an unusual or unpleasant one", "zh": "事件；事故", "word": "incident"}, "D": {"w": "oddity", "pos": "n.", "en": "something strange or unusual", "zh": "怪事；反常的事物", "word": "oddity"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: unusually long gamma-ray burst", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult to understand or deal with\" data-zh=\"使複雜化\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The comet&#x27;s tail remained visible for nearly six months, _______ for an object of its size, since most comparable comets fade within a few weeks.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The comet's tail remained visible for nearly six months, _______ for an object of its size, since most comparable comets fade within a few weeks.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這顆彗星的彗尾持續可見將近六個月，對於這種大小的天體而言 _______，因為大多數同類彗星會在幾週內便逐漸消失。", "opts": {"A": "a method", "B": "a reprieve", "C": "an anomaly", "D": "a routine"}, "optsZh": {"A": "a method（方法）", "B": "a reprieve（暫緩、喘息的機會）", "C": "an anomaly（異常、反常現象）", "D": "a routine（例行公事、常規）"}, "answer": "C", "expl": "An anomaly is something unusual or unexpected.", "explZh": "", "defs": {"A": {"w": "method", "pos": "n.", "en": "a particular way of doing something", "zh": "方法", "word": "method"}, "B": {"w": "reprieve", "pos": "n.", "en": "a temporary relief or delay from something unpleasant", "zh": "暫時緩解；緩刑", "word": "reprieve"}, "C": {"w": "anomaly", "pos": "n.", "en": "something unusual that does not fit the normal pattern", "zh": "異常；反常現象", "word": "anomaly"}, "D": {"w": "routine", "pos": "n.", "en": "a usual, regular way of doing things", "zh": "例行公事；慣常程序", "word": "routine"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: unusually long gamma-ray burst", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The whale&#x27;s song lasted almost twice as long as any previously recorded call from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>, making the episode _______ rather than a typical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The whale's song lasted almost twice as long as any previously recorded call from the species, making the episode _______ rather than a typical observation.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這頭鯨魚的歌聲持續時間幾乎是該物種過去任何紀錄中叫聲的兩倍，使這次事件成為 _______，而非一次典型的觀察。", "opts": {"A": "a benefit", "B": "an oddity", "C": "a remedy", "D": "a habit"}, "optsZh": {"A": "a benefit（益處、好處）", "B": "an oddity（一件怪事、反常現象）", "C": "a remedy（補救辦法、療法）", "D": "a habit（習慣）"}, "answer": "B", "expl": "An oddity is an unusual thing.", "explZh": "", "defs": {"A": {"w": "benefit", "pos": "n.", "en": "something helpful or good that you get from something", "zh": "好處；益處", "word": "benefit"}, "B": {"w": "oddity", "pos": "n.", "en": "something strange or unusual", "zh": "怪事；反常的事物", "word": "oddity"}, "C": {"w": "remedy", "pos": "n.", "en": "something that cures a problem or illness", "zh": "補救方法；療法", "word": "remedy"}, "D": {"w": "habit", "pos": "n.", "en": "something a person does regularly, often without thinking", "zh": "習慣", "word": "habit"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: unusually long gamma-ray burst", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> contains a page written in a dialect not used elsewhere in the region, a feature scholars regard as _______ in an otherwise con
