<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 2, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 2, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: choose an adjective meaning historically significant.", "vocab": true, "body": "As Mexico&#x27;s first president from an Indigenous community, Benito Juarez became one of the most ______ figures in his country&#x27;s history: among the many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> accomplishments of his long tenure in office (1858-1872), Juarez <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consolidate\" target=\"_blank\" rel=\"noopener\" data-w=\"consolidate\" data-pos=\"v.\" data-en=\"to make stronger or more secure; to combine\" data-zh=\"鞏固；統一\">consolidated<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> of the national government and advanced the rights of Indigenous peoples.", "bodyPlain": "As Mexico's first president from an Indigenous community, Benito Juarez became one of the most ______ figures in his country's history: among the many significant accomplishments of his long tenure in office (1858-1872), Juarez consolidated the authority of the national government and advanced the rights of Indigenous peoples.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "身為墨西哥第一位出身原住民社群的總統，Benito Juarez 成為該國歷史上最 ______ 的人物之一：在他漫長任期（1858–1872）的眾多重大成就中，Juarez 鞏固了中央政府的權威，並推進了原住民族的權利。", "opts": {"A": "unpredictable", "B": "important", "C": "secretive", "D": "ordinary"}, "optsZh": {"A": "unpredictable（無法預測的）", "B": "important（重要的）", "C": "secretive（隱密的、守口如瓶的）", "D": "ordinary（普通的）"}, "answer": "B", "expl": "The colon introduces his 'many significant accomplishments,' so Juárez was one of the most 'important' figures.", "explZh": "冒號後列出他「許多重大成就」，因此 Juárez 是國家歷史上最「important」（重要的）人物之一。", "defs": {"A": {"pos": "adj.", "en": "not able to be known or expected in advance", "zh": "無法預測的；難以預料的", "word": "unpredictable"}, "B": {"pos": "adj.", "en": "having great value, meaning, or effect", "zh": "重要的；重大的", "word": "important"}, "C": {"pos": "adj.", "en": "tending to hide feelings, plans, or information", "zh": "隱密的；守口如瓶的", "word": "secretive"}, "D": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: choose an adjective meaning historically significant.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. As the first woman to lead the national observatory, astronomer Vera Rubin became a ______ figure in modern astronomy; her work helped reshape discussions of dark matter.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. As the first woman to lead the national observatory, astronomer Vera Rubin became a ______ figure in modern astronomy; her work helped reshape discussions of dark matter.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n身為第一位領導國家天文臺的女性，天文學家 Vera Rubin 成為現代天文學中一位 ______ 的人物；她的研究協助重塑了關於暗物質的討論。", "opts": {"A": "erratic", "B": "pivotal", "C": "ordinary", "D": "obscure"}, "optsZh": {"A": "erratic（不穩定的、反覆無常的）", "B": "pivotal（關鍵的）", "C": "ordinary（普通的）", "D": "obscure（模糊的；鮮為人知的；使隱晦）"}, "answer": "B", "expl": "Pivotal means crucially important.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not regular or predictable; changing often", "zh": "不規則的；反覆無常的", "word": "erratic"}, "B": {"pos": "adj.", "en": "of central importance, especially in causing change", "zh": "關鍵的；舉足輕重的", "word": "pivotal"}, "C": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "D": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: choose an adjective meaning historically significant.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The court&#x27;s decision was ______ because it changed how later judges interpreted privacy rights.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The court's decision was ______ because it changed how later judges interpreted privacy rights.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n法院的這項判決是 ______ 的，因為它改變了後來的法官詮釋隱私權的方式。", "opts": {"A": "secretive", "B": "momentous", "C": "inconsequential", "D": "unpredictable"}, "optsZh": {"A": "secretive（隱密的、守口如瓶的）", "B": "momentous（極其重要的、重大的）", "C": "inconsequential（無關緊要的）", "D": "unpredictable（無法預測的）"}, "answer": "B", "expl": "Momentous means highly significant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "tending to hide feelings, plans, or information", "zh": "隱密的；守口如瓶的", "word": "secretive"}, "B": {"pos": "adj.", "en": "very important because of its effect on the future", "zh": "重大的；極其重要的", "word": "momentous"}, "C": {"pos": "adj.", "en": "not important or significant", "zh": "無關緊要的；不重要的", "word": "inconsequential"}, "D": {"pos": "adj.", "en": "not able to be known or expected in advance", "zh": "無法預測的；難以預料的", "word": "unpredictable"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: choose an adjective meaning historically significant.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The treaty became a ______ event in regional politics, ending decades of border conflict.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The treaty became a ______ event in regional politics, ending decades of border conflict.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項條約成為地區政治中一個 ______ 的事件，結束了數十年的邊界衝突。", "opts": {"A": "formative", "B": "concealed", "C": "minor", "D": "routine"}, "optsZh": {"A": "formative（形成期的、有深遠影響的）", "B": "concealed（隱藏的）", "C": "minor（次要的、不重要的）", "D": "routine（例行的、平常的）"}, "answer": "A", "expl": "Formative means powerfully shaping later developments.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having an important influence on the development of something", "zh": "形成期的；有重大影響的", "word": "formative"}, "B": {"pos": "adj.", "en": "hidden from view or kept secret", "zh": "隱藏的；隱蔽的", "word": "concealed"}, "C": {"pos": "adj.", "en": "small or not very important", "zh": "次要的；較小的；不重要的", "word": "minor"}, "D": {"pos": "adj.", "en": "ordinary and done regularly; not special", "zh": "例行的；平常的", "word": "routine"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: choose an adjective meaning historically significant.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The chemist&#x27;s discovery proved ______, eventually enabling several new medical treatments.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The chemist's discovery proved ______, eventually enabling several new medical treatments.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位化學家的發現證明是 ______ 的，最終促成了數種新的醫療方法。", "opts": {"A": "ambiguous", "B": "ordinary", "C": "private", "D": "consequential"}, "optsZh": {"A": "ambiguous（模糊的、含糊不清的）", "B": "ordinary（普通的）", "C": "private（私人的）", "D": "consequential（重大的、影響深遠的）"}, "answer": "D", "expl": "Consequential means having important effects.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having more than one possible meaning; unclear", "zh": "模糊的；含糊不清的", "word": "ambiguous"}, "B": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "C": {"pos": "adj.", "en": "belonging to or meant for one person or group; not public", "zh": "私人的；私下的", "word": "private"}, "D": {"pos": "adj.", "en": "important and having significant results", "zh": "重大的；影響深遠的", "word": "consequential"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: choose an adjective meaning historically significant.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The writer&#x27;s first novel remains ______ in Caribbean literature because it influenced generations of later authors.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The writer's first novel remains ______ in Caribbean literature because it influenced generations of later authors.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這位作家的第一部小說在加勒比海文學中依然 ______，因為它影響了好幾代後來的作家。", "opts": {"A": "anonymous", "B": "erratic", "C": "landmark", "D": "peripheral"}, "optsZh": {"A": "anonymous（匿名的）", "B": "erratic（不穩定的、反覆無常的）", "C": "landmark（具里程碑意義的）", "D": "peripheral（周邊的、次要的）"}, "answer": "C", "expl": "Landmark means historically important.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "made or done by someone whose name is not known", "zh": "匿名的；不具名的", "word": "anonymous"}, "B": {"pos": "adj.", "en": "not regular or predictable; changing often", "zh": "不規則的；反覆無常的", "word": "erratic"}, "C": {"pos": "adj.", "en": "marking an important stage or turning point", "zh": "里程碑式的；劃時代的", "word": "landmark"}, "D": {"pos": "adj.", "en": "not central or most important; on the edge", "zh": "次要的；周邊的", "word": "peripheral"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: choose a verb meaning understand or explain meaning.", "vocab": true, "body": "Due to their often strange images, highly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=syntax\" target=\"_blank\" rel=\"noopener\" data-w=\"syntax\" data-pos=\"n.\" data-en=\"the way words are arranged to form sentences\" data-zh=\"句法；語法結構\">syntax<\/a>, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opaque\" target=\"_blank\" rel=\"noopener\" data-w=\"opaque\" data-pos=\"adj.\" data-en=\"hard to understand; not clear\" data-zh=\"晦澀的；難懂的\">opaque<\/a> subject matter, many of John Ashbery&#x27;s poems can be quite difficult to ______ and thus are the object of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=heated\" target=\"_blank\" rel=\"noopener\" data-w=\"heated\" data-pos=\"adj.\" data-en=\"(of a discussion) full of strong feeling or anger\" data-zh=\"激烈的\">heated<\/a> debate among scholars.", "bodyPlain": "Due to their often strange images, highly experimental syntax, and opaque subject matter, many of John Ashbery's poems can be quite difficult to ______ and thus are the object of heated debate among scholars.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "由於意象往往奇特、句法高度實驗性且主題晦澀難懂，John Ashbery 的許多詩作可能相當難以 ______，因此成為學者之間激烈爭論的對象。", "opts": {"A": "delegate", "B": "compose", "C": "interpret", "D": "renounce"}, "optsZh": {"A": "delegate（委派、授權）", "B": "compose（創作；組成）", "C": "interpret（詮釋；理解）", "D": "renounce（放棄、宣布放棄）"}, "answer": "C", "expl": "Strange images and opaque subject matter make the poems hard to 'interpret' (understand and explain), which leads to scholarly debate.", "explZh": "奇特的意象與晦澀的主題使詩作難以「interpret」（詮釋），因此引發學者激烈爭論。", "defs": {"A": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}, "B": {"pos": "v.", "en": "to write or create something such as music or a poem; to make up", "zh": "創作；組成；構成", "word": "compose"}, "C": {"pos": "v.", "en": "to explain or understand the meaning of something", "zh": "詮釋；解讀；理解", "word": "interpret"}, "D": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: choose a verb meaning understand or explain meaning.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Because the inscription is damaged and uses several rare symbols, scholars still struggle to ______ its exact meaning.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Because the inscription is damaged and uses several rare symbols, scholars still struggle to ______ its exact meaning.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n由於這段銘文受損，且使用了幾個罕見的符號，學者們仍難以 ______ 它的確切意義。", "opts": {"A": "renounce", "B": "delegate", "C": "decipher", "D": "compose"}, "optsZh": {"A": "renounce（放棄、宣布放棄）", "B": "delegate（委派、授權）", "C": "decipher（解讀、破解）", "D": "compose（創作；組成）"}, "answer": "C", "expl": "Decipher means interpret something difficult to understand.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}, "B": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}, "C": {"pos": "v.", "en": "to figure out the meaning of something difficult to read or understand", "zh": "解讀；破譯；辨認", "word": "decipher"}, "D": {"pos": "v.", "en": "to write or create something such as music or a poem; to make up", "zh": "創作；組成；構成", "word": "compose"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: choose a verb meaning understand or explain meaning.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The critic argues that the film&#x27;s nonlinear structure makes it difficult to ______ without close attention to repeated visual motifs.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The critic argues that the film's nonlinear structure makes it difficult to ______ without close attention to repeated visual motifs.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位評論家認為，這部電影的非線性結構使它很難 ______，除非仔細留意反覆出現的視覺母題。", "opts": {"A": "parse", "B": "dismiss", "C": "translate", "D": "replicate"}, "optsZh": {"A": "parse（剖析、解析）", "B": "dismiss（不予理會、駁回）", "C": "translate（翻譯）", "D": "replicate（複製、重複）"}, "answer": "A", "expl": "Parse means analyze or interpret carefully.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to analyze something carefully to understand its parts and meaning", "zh": "剖析；分析；解析", "word": "parse"}, "B": {"pos": "v.", "en": "to decide that something is not worth considering", "zh": "不予理會；否定；駁回", "word": "dismiss"}, "C": {"pos": "v.", "en": "to change words into another language; to interpret", "zh": "翻譯；轉化；解讀", "word": "translate"}, "D": {"pos": "v.", "en": "to repeat or copy something exactly, such as an experiment", "zh": "複製；重複（實驗）", "word": "replicate"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: choose a verb meaning understand or explain meaning.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The poem&#x27;s syntax is intentionally fragmented, so readers must ______ connections among images that are never explained directly.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The poem's syntax is intentionally fragmented, so readers must ______ connections among images that are never explained directly.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這首詩的句法刻意支離破碎，因此讀者必須 ______ 那些從未被直接解釋的意象之間的關聯。", "opts": {"A": "delegate", "B": "postpone", "C": "erase", "D": "infer"}, "optsZh": {"A": "delegate（委派、授權）", "B": "postpone（延後）", "C": "erase（抹除）", "D": "infer（推斷）"}, "answer": "D", "expl": "Infer means understand indirectly from evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}, "B": {"pos": "v.", "en": "to delay something until a later time", "zh": "延後；延期", "word": "postpone"}, "C": {"pos": "v.", "en": "to remove completely so no trace is left", "zh": "抹去；消除", "word": "erase"}, "D": {"pos": "v.", "en": "to reach a conclusion based on evidence and reasoning", "zh": "推論；推斷", "word": "infer"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: choose a verb meaning understand or explain meaning.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Because the ritual is described only in scattered accounts, anthropologists disagree about how to ______ its social purpose.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Because the ritual is described only in scattered accounts, anthropologists disagree about how to ______ its social purpose.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n由於這項儀式只見於零散的記述中，人類學家對於如何 ______ 它的社會功能意見分歧。", "opts": {"A": "renounce", "B": "interpret", "C": "manufacture", "D": "conceal"}, "optsZh": {"A": "renounce（放棄、宣布放棄）", "B": "interpret（詮釋；理解）", "C": "manufacture（製造）", "D": "conceal（隱藏）"}, "answer": "B", "expl": "Interpret fits debate about meaning.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}, "B": {"pos": "v.", "en": "to explain or understand the meaning of something", "zh": "詮釋；解讀；理解", "word": "interpret"}, "C": {"pos": "v.", "en": "to make goods in large quantities, often with machines", "zh": "製造；生產", "word": "manufacture"}, "D": {"pos": "v.", "en": "to hide something or keep it secret", "zh": "隱藏；隱瞞", "word": "conceal"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: choose a verb meaning understand or explain meaning.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The ancient map includes symbols whose meanings are uncertain, making it challenging for historians to ______ the route it depicts.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The ancient map includes symbols whose meanings are uncertain, making it challenging for historians to ______ the route it depicts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這張古地圖包含意義不明的符號，使歷史學家難以 ______ 它所描繪的路線。", "opts": {"A": "appoint", "B": "diminish", "C": "decode", "D": "compose"}, "optsZh": {"A": "appoint（任命、指派）", "B": "diminish（減少、削弱）", "C": "decode（解碼、解讀）", "D": "compose（創作；組成）"}, "answer": "C", "expl": "Decode means work out hidden or difficult meaning.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to officially choose someone for a job or position", "zh": "任命；指派", "word": "appoint"}, "B": {"pos": "v.", "en": "to make or become smaller or less important", "zh": "減少；減弱；降低", "word": "diminish"}, "C": {"pos": "v.", "en": "to change a coded message into ordinary language; to interpret", "zh": "解碼；破譯；解讀", "word": "decode"}, "D": {"pos": "v.", "en": "to write or create something such as music or a poem; to make up", "zh": "創作；組成；構成", "word": "compose"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: choose an adjective meaning sudden.", "vocab": true, "body": "The Cambrian explosion gets its name from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sudden\" target=\"_blank\" rel=\"noopener\" data-w=\"sudden\" data-pos=\"adj.\" data-en=\"happening quickly and unexpectedly\" data-zh=\"突然的；驟然的\">sudden<\/a> appearance and rapid diversification of animal remains in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fossil\" target=\"_blank\" rel=\"noopener\" data-w=\"fossil\" data-pos=\"n.\" data-en=\"the remains of a prehistoric plant or animal preserved in rock\" data-zh=\"化石\">fossil<\/a> record about 541 million years ago, during the Cambrian period. Some scientists argue that this ______ change in the fossil record might be because of a shift in many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organism\" target=\"_blank\" rel=\"noopener\" data-w=\"organism\" data-pos=\"n.\" data-en=\"a living thing\" data-zh=\"生物\">organisms<\/a> to body types that were more likely to be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserved<\/a>.", "bodyPlain": "The Cambrian explosion gets its name from the sudden appearance and rapid diversification of animal remains in the fossil record about 541 million years ago, during the Cambrian period. Some scientists argue that this ______ change in the fossil record might be because of a shift in many organisms to body types that were more likely to be preserved.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "寒武紀大爆發（Cambrian explosion）之名，源自約 5.41 億年前的寒武紀期間，動物遺骸在化石紀錄中突然出現並迅速多樣化。有些科學家認為，化石紀錄中這種 ______ 的變化，可能是因為許多生物轉變為較容易被保存下來的身體構造。", "opts": {"A": "catastrophic", "B": "elusive", "C": "abrupt", "D": "imminent"}, "optsZh": {"A": "catastrophic（災難性的）", "B": "elusive（難以捉摸的）", "C": "abrupt（突然的、唐突的）", "D": "imminent（即將發生的）"}, "answer": "C", "expl": "The text says the appearance was 'sudden,' so the change was 'abrupt.'", "explZh": "文中說這是「突然的」出現，因此這個變化是「abrupt」（突然的）。", "defs": {"A": {"pos": "adj.", "en": "causing great damage or suffering", "zh": "災難性的；毀滅性的", "word": "catastrophic"}, "B": {"pos": "adj.", "en": "difficult to find, catch, or understand", "zh": "難以捉摸的；難以理解的", "word": "elusive"}, "C": {"pos": "adj.", "en": "sudden and unexpected", "zh": "突然的；意外的；唐突的", "word": "abrupt"}, "D": {"pos": "adj.", "en": "about to happen very soon", "zh": "即將發生的；迫在眉睫的", "word": "imminent"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: choose an adjective meaning sudden.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Tree-ring evidence suggests that the settlement underwent an ______ decline after several decades of stable growth.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Tree-ring evidence suggests that the settlement underwent an ______ decline after several decades of stable growth.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n樹輪證據顯示，這個聚落在經歷數十年的穩定成長後，出現了 ______ 的衰退。", "opts": {"A": "elusive", "B": "abrupt", "C": "imminent", "D": "gradual"}, "optsZh": {"A": "elusive（難以捉摸的）", "B": "abrupt（突然的、唐突的）", "C": "imminent（即將發生的）", "D": "gradual（逐漸的）"}, "answer": "B", "expl": "Abrupt means sudden.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "difficult to find, catch, or understand", "zh": "難以捉摸的；難以理解的", "word": "elusive"}, "B": {"pos": "adj.", "en": "sudden and unexpected", "zh": "突然的；意外的；唐突的", "word": "abrupt"}, "C": {"pos": "adj.", "en": "about to happen very soon", "zh": "即將發生的；迫在眉睫的", "word": "imminent"}, "D": {"pos": "adj.", "en": "happening slowly over a long period", "zh": "逐漸的；漸進的", "word": "gradual"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: choose an adjective meaning sudden.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The archive shows a ______ increase in pamphlet production <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a> after the new press was installed.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The archive shows a ______ increase in pamphlet production immediately after the new press was installed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n檔案顯示，新的印刷機一安裝好，小冊子的產量就出現了 ______ 的增加。", "opts": {"A": "distant", "B": "concealed", "C": "sudden", "D": "ordinary"}, "optsZh": {"A": "distant（遙遠的）", "B": "concealed（隱藏的）", "C": "sudden（突然的）", "D": "ordinary（普通的）"}, "answer": "C", "expl": "Sudden matches an immediate increase.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "far away in space or time", "zh": "遙遠的；久遠的", "word": "distant"}, "B": {"pos": "adj.", "en": "hidden from view or kept secret", "zh": "隱藏的；隱蔽的", "word": "concealed"}, "C": {"pos": "adj.", "en": "happening quickly and unexpectedly", "zh": "突然的；驟然的", "word": "sudden"}, "D": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: choose an adjective meaning sudden.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The team&#x27;s measurements revealed a ______ shift in ocean temperature over a single month.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The team's measurements revealed a ______ shift in ocean temperature over a single month.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n研究團隊的測量顯示，海水溫度在短短一個月內出現了 ______ 的變化。", "opts": {"A": "decorative", "B": "durable", "C": "ambiguous", "D": "precipitous"}, "optsZh": {"A": "decorative（裝飾性的）", "B": "durable（耐用的、持久的）", "C": "ambiguous（模糊的、含糊不清的）", "D": "precipitous（急遽的、陡峭的）"}, "answer": "D", "expl": "Precipitous can mean very steep or sudden.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的；裝飾用的", "word": "decorative"}, "B": {"pos": "adj.", "en": "able to last a long time without breaking or wearing out", "zh": "耐用的；持久的", "word": "durable"}, "C": {"pos": "adj.", "en": "having more than one possible meaning; unclear", "zh": "模糊的；含糊不清的", "word": "ambiguous"}, "D": {"pos": "adj.", "en": "very sudden and steep, especially a drop or decline", "zh": "急遽的；陡峭的", "word": "precipitous"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: choose an adjective meaning sudden.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The composer was known for ______ changes in tempo that surprised even experienced performers.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The composer was known for ______ changes in tempo that surprised even experienced performers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位作曲家以 ______ 的速度變化聞名，連經驗豐富的演奏者都感到驚訝。", "opts": {"A": "instantaneous", "B": "peripheral", "C": "subtle", "D": "predictable"}, "optsZh": {"A": "instantaneous（瞬間的、即時的）", "B": "peripheral（周邊的、次要的）", "C": "subtle（細微的、不易察覺的）", "D": "predictable（可預測的）"}, "answer": "A", "expl": "Instantaneous signals happening at once.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening immediately, without any delay", "zh": "瞬間的；即刻的", "word": "instantaneous"}, "B": {"pos": "adj.", "en": "not central or most important; on the edge", "zh": "次要的；周邊的", "word": "peripheral"}, "C": {"pos": "adj.", "en": "not obvious; small and hard to notice", "zh": "細微的；微妙的", "word": "subtle"}, "D": {"pos": "adj.", "en": "happening in a way that can be expected", "zh": "可預測的；意料之中的", "word": "predictable"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: choose an adjective meaning sudden.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The species&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disappearance\" target=\"_blank\" rel=\"noopener\" data-w=\"disappearance\" data-pos=\"n.\" data-en=\"the fact of no longer existing or being seen\" data-zh=\"消失\">disappearance<\/a> from the fossil layer appears ______ rather than slow, suggesting a rapid environmental disruption.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The species' disappearance from the fossil layer appears ______ rather than slow, suggesting a rapid environmental disruption.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這個物種在化石層中的消失似乎是 ______ 的，而非緩慢的，這顯示當時發生了快速的環境劇變。", "opts": {"A": "impartial", "B": "commonplace", "C": "elusive", "D": "swift"}, "optsZh": {"A": "impartial（公正的、不偏袒的）", "B": "commonplace（平凡的、司空見慣的）", "C": "elusive（難以捉摸的）", "D": "swift（迅速的）"}, "answer": "D", "expl": "Swift means rapid.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏不倚的", "word": "impartial"}, "B": {"pos": "adj.", "en": "ordinary and not unusual or interesting", "zh": "平凡的；司空見慣的", "word": "commonplace"}, "C": {"pos": "adj.", "en": "difficult to find, catch, or understand", "zh": "難以捉摸的；難以理解的", "word": "elusive"}, "D": {"pos": "adj.", "en": "happening quickly or promptly", "zh": "迅速的；快速的", "word": "swift"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: choose a verb meaning admit after evidence.", "vocab": true, "body": "During a 2014 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeological\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeological\" data-pos=\"adj.\" data-en=\"relating to the study of ancient remains\" data-zh=\"考古的\">archaeological<\/a> dig in Spain, Vicente Lull and his team uncovered the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=skeleton\" target=\"_blank\" rel=\"noopener\" data-w=\"skeleton\" data-pos=\"n.\" data-en=\"the frame of bones in a body\" data-zh=\"骨骼\">skeleton<\/a> of a woman from El Algar, an Early Bronze Age society, buried with valuable objects signaling a high position of power. This finding may <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=persuade\" target=\"_blank\" rel=\"noopener\" data-w=\"persuade\" data-pos=\"v.\" data-en=\"to make someone agree or believe by giving reasons\" data-zh=\"說服\">persuade<\/a> researchers who have argued that Bronze Age societies were ruled by men to ______ that women may have also held leadership roles.", "bodyPlain": "During a 2014 archaeological dig in Spain, Vicente Lull and his team uncovered the skeleton of a woman from El Algar, an Early Bronze Age society, buried with valuable objects signaling a high position of power. This finding may persuade researchers who have argued that Bronze Age societies were ruled by men to ______ that women may have also held leadership roles.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "2014 年在西班牙的一次考古挖掘中，Vicente Lull 和他的團隊發掘出一具來自早期青銅時代社會 El Algar 的女性骨骸，她與象徵崇高權力地位的貴重物品一同下葬。這項發現可能會說服那些一直主張青銅時代社會由男性統治的研究人員 ______ 女性可能也曾擔任領導角色。", "opts": {"A": "waive", "B": "concede", "C": "refute", "D": "require"}, "optsZh": {"A": "waive（放棄（權利）、免除）", "B": "concede（承認、讓步）", "C": "refute（駁斥、反駁）", "D": "require（要求、需要）"}, "answer": "B", "expl": "The finding challenges the researchers' view, so it may persuade them to 'concede' (admit) that women also held power.", "explZh": "此發現挑戰研究者原本的看法，可能使他們「concede」（承認）女性也曾掌權。", "defs": {"A": {"pos": "v.", "en": "to choose not to require or enforce a rule or right", "zh": "放棄（權利）；免除", "word": "waive"}, "B": {"pos": "v.", "en": "to admit, often reluctantly, that something is true", "zh": "（勉強）承認；讓步", "word": "concede"}, "C": {"pos": "v.", "en": "to prove that a statement or idea is wrong", "zh": "駁斥；反駁", "word": "refute"}, "D": {"pos": "v.", "en": "to need something or make it necessary", "zh": "需要；要求", "word": "require"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: choose a verb meaning admit after evidence.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. After new satellite images revealed an older river channel, geologists who had favored a different explanation had to ______ that water once flowed through the valley.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. After new satellite images revealed an older river channel, geologists who had favored a different explanation had to ______ that water once flowed through the valley.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n新的衛星影像揭露了一條較古老的河道後，原本支持另一種解釋的地質學家不得不 ______ 這座山谷過去曾有水流經過。", "opts": {"A": "concede", "B": "obscure", "C": "waive", "D": "require"}, "optsZh": {"A": "concede（承認、讓步）", "B": "obscure（模糊的；鮮為人知的；使隱晦）", "C": "waive（放棄（權利）、免除）", "D": "require（要求、需要）"}, "answer": "A", "expl": "Concede means admit after evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to admit, often reluctantly, that something is true", "zh": "（勉強）承認；讓步", "word": "concede"}, "B": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "C": {"pos": "v.", "en": "to choose not to require or enforce a rule or right", "zh": "放棄（權利）；免除", "word": "waive"}, "D": {"pos": "v.", "en": "to need something or make it necessary", "zh": "需要；要求", "word": "require"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: choose a verb meaning admit after evidence.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The historian initially rejected the revised date, but the newly found diary led her to ______ that the event occurred earlier.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The historian initially rejected the revised date, but the newly found diary led her to ______ that the event occurred earlier.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位歷史學家起初否定了修訂後的日期，但新發現的日記使她 ______ 這個事件發生的時間更早。", "opts": {"A": "refute", "B": "delegate", "C": "mandate", "D": "acknowledge"}, "optsZh": {"A": "refute（駁斥、反駁）", "B": "delegate（委派、授權）", "C": "mandate（強制規定）", "D": "acknowledge（承認）"}, "answer": "D", "expl": "Acknowledge means accept as true.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to prove that a statement or idea is wrong", "zh": "駁斥；反駁", "word": "refute"}, "B": {"pos": "v.", "en": "to give part of your work or authority to someone else", "zh": "委派；授權", "word": "delegate"}, "C": {"pos": "v.", "en": "to officially require something", "zh": "強制規定；授權", "word": "mandate"}, "D": {"pos": "v.", "en": "to admit or accept that something is true or exists", "zh": "承認；認可；確認", "word": "acknowledge"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: choose a verb meaning admit after evidence.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. When the second experiment produced the same result, skeptics began to ______ that the original finding was reliable.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When the second experiment produced the same result, skeptics began to ______ that the original finding was reliable.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n當第二次實驗得出相同的結果時，懷疑者開始 ______ 最初的發現是可靠的。", "opts": {"A": "predict", "B": "conceal", "C": "deny", "D": "grant"}, "optsZh": {"A": "predict（預測）", "B": "conceal（隱藏）", "C": "deny（否認）", "D": "grant（承認；授予）"}, "answer": "D", "expl": "Grant can mean concede a point.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to say what will happen in the future", "zh": "預測；預言", "word": "predict"}, "B": {"pos": "v.", "en": "to hide something or keep it secret", "zh": "隱藏；隱瞞", "word": "conceal"}, "C": {"pos": "v.", "en": "to say that something is not true", "zh": "否認；否定", "word": "deny"}, "D": {"pos": "v.", "en": "to admit that something is true; to give or allow", "zh": "承認；同意；授予", "word": "grant"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: choose a verb meaning admit after evidence.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The critic remained cautious but was forced to ______ that the anonymous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> was probably genuine.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The critic remained cautious but was forced to ______ that the anonymous manuscript was probably genuine.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位評論家仍保持謹慎，但不得不 ______ 這份匿名手稿很可能是真的。", "opts": {"A": "renounce", "B": "postpone", "C": "admit", "D": "r
