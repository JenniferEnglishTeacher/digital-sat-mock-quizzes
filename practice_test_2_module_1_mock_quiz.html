"蛋白質\">proteins<\/a> in fish&#x27;s cells, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distort\" target=\"_blank\" rel=\"noopener\" data-w=\"distort\" data-pos=\"v.\" data-en=\"to change the shape or meaning of something so it is no longer accurate\" data-zh=\"扭曲\">distorting<\/a> the proteins&#x27; shape. The chemical trimethylamine N-oxide (TMAO) counters this effect, ensuring that proteins retain their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=original\" target=\"_blank\" rel=\"noopener\" data-w=\"original\" data-pos=\"adj.\" data-en=\"new and different; not copied\" data-zh=\"原創的；新穎的；原本的\">original<\/a> ______ is found in high concentrations in the cells of the deepest-dwelling fish.", "bodyPlain": "The intense pressure found in the deep ocean can affect the structure of proteins in fish's cells, distorting the proteins' shape. The chemical trimethylamine N-oxide (TMAO) counters this effect, ensuring that proteins retain their original ______ is found in high concentrations in the cells of the deepest-dwelling fish.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "深海中的強大壓力會影響魚類細胞中蛋白質的結構，使蛋白質的形狀扭曲。化學物質氧化三甲胺（TMAO）能抵消這種效應，確保蛋白質維持原本的 ______ 在最深海棲息的魚類細胞中濃度很高。", "opts": {"A": "configurations. TMAO", "B": "configurations TMAO", "C": "configurations, TMAO", "D": "configurations and TMAO"}, "optsZh": {"A": "configurations. TMAO（句號，分隔兩個獨立子句：正確）", "B": "configurations TMAO（無標點 → 形成連寫句）", "C": "configurations, TMAO（逗號 → 造成逗號連接錯誤）", "D": "configurations and TMAO（只用 and 無逗號 → 連接錯誤）"}, "answer": "A", "expl": "'Ensuring ... configurations' ends one complete sentence and 'TMAO is found...' begins another, so a period is required.", "explZh": "「...configurations」處句子已完整，「TMAO is found...」是另一個獨立子句，因此需用句號。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "entering", "B": "enter", "C": "having entered", "D": "to enter"}, "optsZh": {"A": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）", "B": "enter（複數現在式，限定動詞：正確）", "C": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "D": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "B", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "will digitize", "B": "digitizes", "C": "has digitized", "D": "had digitized"}, "optsZh": {"A": "will digitize（未來式 → 與過去時間點不符）", "B": "digitizes（現在式 → 與過去時間點不符）", "C": "has digitized（現在完成式 → 與過去時間點不符）", "D": "had digitized（過去完成式：正確）"}, "answer": "D", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "to form", "B": "forming", "C": "forms", "D": "having formed"}, "optsZh": {"A": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）", "C": "forms（第三人稱單數現在式：正確）", "D": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "C", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "had described", "B": "described", "C": "describes", "D": "will describe"}, "optsZh": {"A": "had described（過去完成式 → 與現在式敘述不符）", "B": "described（過去式 → 與現在式敘述不符）", "C": "describes（第三人稱單數現在式：正確）", "D": "will describe（未來式 → 與現在式敘述不符）"}, "answer": "C", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebed's", "B": "lakebeds'", "C": "lakebeds", "D": "lakebed"}, "optsZh": {"A": "lakebed's（單數所有格：正確）", "B": "lakebeds'（複數所有格 → 數不一致）", "C": "lakebeds（複數名詞，非所有格）", "D": "lakebed（單數名詞，缺少所有格）"}, "answer": "A", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English: verb tense in literary present.", "vocab": false, "body": "Food and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sensation\" target=\"_blank\" rel=\"noopener\" data-w=\"sensation\" data-pos=\"n.\" data-en=\"a physical feeling; a strong feeling\" data-zh=\"感覺；知覺\">sensation<\/a> of taste are central to Monique Truong&#x27;s novels. In The Book of Salt, for example, the exiled character of Binh connects to his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=native\" target=\"_blank\" rel=\"noopener\" data-w=\"native\" data-pos=\"adj.\" data-en=\"originally from a particular place\" data-zh=\"本土的；原生的\">native<\/a> Saigon through the food he prepares, while in Bitter in the Mouth, the character of Linda ______ a form of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synesthesia\" target=\"_blank\" rel=\"noopener\" data-w=\"synesthesia\" data-pos=\"n.\" data-en=\"a condition in which one sense triggers another, e.g. hearing colors\" data-zh=\"聯覺\">synesthesia<\/a> whereby the words she hears evoke tastes.", "bodyPlain": "Food and the sensation of taste are central to Monique Truong's novels. In The Book of Salt, for example, the exiled character of Binh connects to his native Saigon through the food he prepares, while in Bitter in the Mouth, the character of Linda ______ a form of synesthesia whereby the words she hears evoke tastes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "食物與味覺是 Monique Truong 小說的核心。例如，在《The Book of Salt》中，流亡的角色 Binh 透過他烹調的食物與故鄉西貢產生連結；而在《Bitter in the Mouth》中，角色 Linda ______ 一種聯覺，她聽到的字詞會引發味覺。", "opts": {"A": "experienced", "B": "had experienced", "C": "experiences", "D": "will be experiencing"}, "optsZh": {"A": "experienced（過去式 → 與文學現在式不符）", "B": "had experienced（過去完成式 → 與文學現在式不符）", "C": "experiences（第三人稱單數現在式，文學現在式：正確）", "D": "will be experiencing（未來進行式 → 與文學現在式不符）"}, "answer": "C", "expl": "Literary works are discussed in the present tense, matching 'connects' earlier in the sentence, so 'experiences' is correct.", "explZh": "談論文學作品用現在式，並與前面的「connects」一致，所以用「experiences」。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English: verb tense in literary present.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "to enter", "B": "enter", "C": "having entered", "D": "entering"}, "optsZh": {"A": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "enter（複數現在式，限定動詞：正確）", "C": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "D": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "B", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English: verb tense in literary present.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "digitizes", "B": "has digitized", "C": "will digitize", "D": "had digitized"}, "optsZh": {"A": "digitizes（現在式 → 與過去時間點不符）", "B": "has digitized（現在完成式 → 與過去時間點不符）", "C": "will digitize（未來式 → 與過去時間點不符）", "D": "had digitized（過去完成式：正確）"}, "answer": "D", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English: verb tense in literary present.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "forms", "B": "to form", "C": "having formed", "D": "forming"}, "optsZh": {"A": "forms（第三人稱單數現在式：正確）", "B": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）", "C": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）", "D": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "A", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English: verb tense in literary present.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "describes", "B": "had described", "C": "described", "D": "will describe"}, "optsZh": {"A": "describes（第三人稱單數現在式：正確）", "B": "had described（過去完成式 → 與現在式敘述不符）", "C": "described（過去式 → 與現在式敘述不符）", "D": "will describe（未來式 → 與現在式敘述不符）"}, "answer": "A", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English: verb tense in literary present.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebeds'", "B": "lakebeds", "C": "lakebed's", "D": "lakebed"}, "optsZh": {"A": "lakebeds'（複數所有格 → 數不一致）", "B": "lakebeds（複數名詞，非所有格）", "C": "lakebed's（單數所有格：正確）", "D": "lakebed（單數名詞，缺少所有格）"}, "answer": "C", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Standard English: singular possessive and plural noun.", "vocab": false, "body": "Inventor John Friedman created a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prototype\" target=\"_blank\" rel=\"noopener\" data-w=\"prototype\" data-pos=\"n.\" data-en=\"a first model of something, used for testing\" data-zh=\"原型；樣品\">prototype<\/a> of the first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flexible\" target=\"_blank\" rel=\"noopener\" data-w=\"flexible\" data-pos=\"adj.\" data-en=\"able to bend easily\" data-zh=\"可彎曲的；有彈性的\">flexible<\/a> straw by inserting a screw into a paper straw and, using dental floss, binding the straw tightly around the ______ When the floss and screw were removed, the resulting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=corrugation\" target=\"_blank\" rel=\"noopener\" data-w=\"corrugation\" data-pos=\"n.\" data-en=\"a series of parallel ridges and grooves\" data-zh=\"波紋；褶皺\">corrugations<\/a> in the paper allowed the straw to bend easily over the edge of a glass.", "bodyPlain": "Inventor John Friedman created a prototype of the first flexible straw by inserting a screw into a paper straw and, using dental floss, binding the straw tightly around the ______ When the floss and screw were removed, the resulting corrugations in the paper allowed the straw to bend easily over the edge of a glass.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "發明家 John Friedman 將一根螺絲插入紙吸管，並用牙線將吸管緊緊纏繞在 ______ 當牙線與螺絲被取出後，紙上形成的波紋使吸管能輕易地在杯緣彎折，第一根可彎吸管的原型就此誕生。", "opts": {"A": "screw's thread's.", "B": "screws' threads.", "C": "screw's threads.", "D": "screws threads'."}, "optsZh": {"A": "screw's thread's.（thread's 誤用所有格 → 錯誤）", "B": "screws' threads.（複數所有格 → 與單數 screw 不符：錯誤）", "C": "screw's threads.（單數所有格＋複數名詞：正確）", "D": "screws threads'.（screws 缺少所有格，threads' 誤用所有格 → 錯誤）"}, "answer": "C", "expl": "The straw was wrapped around one screw's threads (plural), so the singular possessive 'screw's' plus plural noun 'threads' is correct.", "explZh": "吸管纏繞的是一根螺絲的螺紋（複數），所以用單數所有格 screw's 加複數名詞 threads。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Standard English: singular possessive and plural noun.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "entering", "B": "enter", "C": "having entered", "D": "to enter"}, "optsZh": {"A": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）", "B": "enter（複數現在式，限定動詞：正確）", "C": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "D": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "B", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Standard English: singular possessive and plural noun.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "has digitized", "B": "digitizes", "C": "will digitize", "D": "had digitized"}, "optsZh": {"A": "has digitized（現在完成式 → 與過去時間點不符）", "B": "digitizes（現在式 → 與過去時間點不符）", "C": "will digitize（未來式 → 與過去時間點不符）", "D": "had digitized（過去完成式：正確）"}, "answer": "D", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Standard English: singular possessive and plural noun.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "forming", "B": "to form", "C": "forms", "D": "having formed"}, "optsZh": {"A": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）", "B": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）", "C": "forms（第三人稱單數現在式：正確）", "D": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "C", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Standard English: singular possessive and plural noun.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "describes", "B": "will describe", "C": "had described", "D": "described"}, "optsZh": {"A": "describes（第三人稱單數現在式：正確）", "B": "will describe（未來式 → 與現在式敘述不符）", "C": "had described（過去完成式 → 與現在式敘述不符）", "D": "described（過去式 → 與現在式敘述不符）"}, "answer": "A", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: singular possessive and plural noun.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebeds", "B": "lakebed's", "C": "lakebeds'", "D": "lakebed"}, "optsZh": {"A": "lakebeds（複數名詞，非所有格）", "B": "lakebed's（單數所有格：正確）", "C": "lakebeds'（複數所有格 → 數不一致）", "D": "lakebed（單數名詞，缺少所有格）"}, "answer": "B", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: punctuation after an integrated quotation.", "vocab": false, "body": "In her analysis of Edith Wharton&#x27;s The House of Mirth (1905), scholar Candace Waid observes that the novel depicts the upper classes of New York society as &quot;consumed by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appetite\" target=\"_blank\" rel=\"noopener\" data-w=\"appetite\" data-pos=\"n.\" data-en=\"a strong desire for something\" data-zh=\"慾望；胃口\">appetite<\/a> of a soulless ______ an apt assessment given that The House of Mirth is set during the Gilded Age, a period marked by rapid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industrialization\" target=\"_blank\" rel=\"noopener\" data-w=\"industrialization\" data-pos=\"n.\" data-en=\"the development of industries in a country\" data-zh=\"工業化\">industrialization<\/a>, economic greed, and widening wealth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disparity\" target=\"_blank\" rel=\"noopener\" data-w=\"disparity\" data-pos=\"n.\" data-en=\"a large difference between things\" data-zh=\"差距；不平等\">disparities<\/a>.", "bodyPlain": "In her analysis of Edith Wharton's The House of Mirth (1905), scholar Candace Waid observes that the novel depicts the upper classes of New York society as \"consumed by the appetite of a soulless ______ an apt assessment given that The House of Mirth is set during the Gilded Age, a period marked by rapid industrialization, economic greed, and widening wealth disparities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學者 Candace Waid 在分析 Edith Wharton 的《The House of Mirth》（1905）時指出，這部小說將紐約上流社會描繪成「被貪欲吞噬的、毫無靈魂的 ______ 這是一個恰當的評價，因為《The House of Mirth》的背景設定在鍍金時代，那是一個以快速工業化、經濟上的貪婪以及貧富差距日益擴大為特徵的時期。", "opts": {"A": "materialism\"; and", "B": "materialism\" and", "C": "materialism,\"", "D": "materialism\""}, "optsZh": {"A": "materialism\"; and（分號 → 後面不是獨立子句：錯誤）", "B": "materialism\" and（以 and 連接 → 結構錯誤）", "C": "materialism,\"（逗號，引出補充說明的同位語：正確）", "D": "materialism\"（無標點 → 引文後缺少逗號）"}, "answer": "C", "expl": "The phrase 'an apt assessment...' is a supplementary noun phrase that must be set off by a comma, placed inside the closing quotation mark.", "explZh": "「an apt assessment...」是補充說明的名詞片語，必須用逗號隔開，逗號放在引號內。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: punctuation after an integrated quotation.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "to enter", "B": "enter", "C": "having entered", "D": "entering"}, "optsZh": {"A": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "enter（複數現在式，限定動詞：正確）", "C": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "D": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "B", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: punctuation after an integrated quotation.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "will digitize", "B": "digitizes", "C": "has digitized", "D": "had digitized"}, "optsZh": {"A": "will digitize（未來式 → 與過去時間點不符）", "B": "digitizes（現在式 → 與過去時間點不符）", "C": "has digitized（現在完成式 → 與過去時間點不符）", "D": "had digitized（過去完成式：正確）"}, "answer": "D", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: punctuation after an integrated quotation.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "having formed", "B": "forming", "C": "forms", "D": "to form"}, "optsZh": {"A": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）", "B": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）", "C": "forms（第三人稱單數現在式：正確）", "D": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "C", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: punctuation after an integrated quotation.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "had described", "B": "will describe", "C": "described", "D": "describes"}, "optsZh": {"A": "had described（過去完成式 → 與現在式敘述不符）", "B": "will describe（未來式 → 與現在式敘述不符）", "C": "described（過去式 → 與現在式敘述不符）", "D": "describes（第三人稱單數現在式：正確）"}, "answer": "D", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: punctuation after an integrated quotation.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebed's", "B": "lakebeds'", "C": "lakebed", "D": "lakebeds"}, "optsZh": {"A": "lakebed's（單數所有格：正確）", "B": "lakebeds'（複數所有格 → 數不一致）", "C": "lakebed（單數名詞，缺少所有格）", "D": "lakebeds（複數名詞，非所有格）"}, "answer": "A", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: semicolon and transition punctuation.", "vocab": false, "body": "To humans, it does not appear that the golden orb-weaver spider uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=camouflage\" target=\"_blank\" rel=\"noopener\" data-w=\"camouflage\" data-pos=\"n.\" data-en=\"colors or patterns that help something hide\" data-zh=\"偽裝；保護色\">camouflage<\/a> to capture its ______ the brightly colored arachnid seems to wait <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conspicuously\" target=\"_blank\" rel=\"noopener\" data-w=\"conspicuously\" data-pos=\"adv.\" data-en=\"in a way that is very easy to see\" data-zh=\"顯眼地；引人注目地\">conspicuously<\/a> in the center of its large circular web for insects to approach. Researcher Po Peng of the University of Melbourne has explained that the spider&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinctive\" target=\"_blank\" rel=\"noopener\" data-w=\"distinctive\" data-pos=\"adj.\" data-en=\"easy to recognize because it is different\" data-zh=\"獨特的；有特色的\">distinctive<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coloration\" target=\"_blank\" rel=\"noopener\" data-w=\"coloration\" data-pos=\"n.\" data-en=\"the color pattern of an animal or plant\" data-zh=\"顏色；色彩圖案\">coloration<\/a> may in fact be part of its appeal.", "bodyPlain": "To humans, it does not appear that the golden orb-weaver spider uses camouflage to capture its ______ the brightly colored arachnid seems to wait conspicuously in the center of its large circular web for insects to approach. Researcher Po Peng of the University of Melbourne has explained that the spider's distinctive coloration may in fact be part of its appeal.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在人類看來，金色圓網蛛似乎並未利用偽裝來捕捉牠的 ______ 這種色彩鮮豔的蛛形綱動物似乎醒目地待在大型圓網的中央，等待昆蟲靠近。墨爾本大學的研究人員 Po Peng 解釋，這種蜘蛛獨特的體色事實上可能正是牠吸引獵物的一部分。", "opts": {"A": "prey, rather,", "B": "prey rather,", "C": "prey, rather;", "D": "prey; rather,"}, "optsZh": {"A": "prey, rather,（逗號 → 造成逗號連接錯誤）", "B": "prey rather,（無標點分隔子句 → 形成連寫句）", "C": "prey, rather;（分號位置錯誤）", "D": "prey; rather,（分號＋轉折詞＋逗號：正確）"}, "answer": "D", "expl": "Two independent clauses: a semicolon separates them, and 'rather' as a transition at the start of the second clause takes a comma.", "explZh": "兩個獨立子句以分號分隔，第二個子句開頭的轉折詞 rather 後加逗號。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: semicolon and transition punctuation.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "to enter", "B": "having entered", "C": "enter", "D": "entering"}, "optsZh": {"A": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "C": "enter（複數現在式，限定動詞：正確）", "D": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "C", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: semicolon and transition punctuation.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "had digitized", "B": "will digitize", "C": "digitizes", "D": "has digitized"}, "optsZh": {"A": "had digitized（過去完成式：正確）", "B": "will digitize（未來式 → 與過去時間點不符）", "C": "digitizes（現在式 → 與過去時間點不符）", "D": "has digitized（現在完成式 → 與過去時間點不符）"}, "answer": "A", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: semicolon and transition punctuation.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "to form", "B": "forms", "C": "having formed", "D": "forming"}, "optsZh": {"A": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "forms（第三人稱單數現在式：正確）", "C": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）", "D": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "B", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: semicolon and transition punctuation.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "describes", "B": "will describe", "C": "described", "D": "had described"}, "optsZh": {"A": "describes（第三人稱單數現在式：正確）", "B": "will describe（未來式 → 與現在式敘述不符）", "C": "described（過去式 → 與現在式敘述不符）", "D": "had described（過去完成式 → 與現在式敘述不符）"}, "answer": "A", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: semicolon and transition punctuation.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a labor
