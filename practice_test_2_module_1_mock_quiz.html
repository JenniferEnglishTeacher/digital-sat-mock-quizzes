equire"}, "optsZh": {"A": "renounce（放棄、宣布放棄）", "B": "postpone（延後）", "C": "admit（承認）", "D": "require（要求、需要）"}, "answer": "C", "expl": "Admit fits acceptance after evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to formally give up a belief, claim, or right", "zh": "放棄；聲明斷絕", "word": "renounce"}, "B": {"pos": "v.", "en": "to delay something until a later time", "zh": "延後；延期", "word": "postpone"}, "C": {"pos": "v.", "en": "to agree, often unwillingly, that something is true", "zh": "承認；坦承", "word": "admit"}, "D": {"pos": "v.", "en": "to need something or make it necessary", "zh": "需要；要求", "word": "require"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: choose a verb meaning admit after evidence.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The discovery of matching tool marks persuaded researchers to ______ that the two artifacts came from the same workshop.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The discovery of matching tool marks persuaded researchers to ______ that the two artifacts came from the same workshop.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n相符工具痕跡的發現，說服研究人員 ______ 這兩件文物出自同一間工坊。", "opts": {"A": "forecast", "B": "accept", "C": "reject", "D": "counter"}, "optsZh": {"A": "forecast（預測）", "B": "accept（接受、承認）", "C": "reject（拒絕）", "D": "counter（反駁、對抗）"}, "answer": "B", "expl": "Accept means agree that evidence supports the claim.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to say what is likely to happen in the future", "zh": "預測；預報", "word": "forecast"}, "B": {"pos": "v.", "en": "to agree that something is true or correct", "zh": "接受；承認；認可", "word": "accept"}, "C": {"pos": "v.", "en": "to refuse to accept or believe something", "zh": "拒絕；否決；排斥", "word": "reject"}, "D": {"pos": "v.", "en": "to act against something or reduce its effect", "zh": "抵消；對抗；反制", "word": "counter"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: choose an adjective meaning inactive or not apparent.", "vocab": true, "body": "Within baleen whale species, some individuals develop an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accessory\" target=\"_blank\" rel=\"noopener\" data-w=\"accessory\" data-pos=\"adj.\" data-en=\"extra; added to the main thing\" data-zh=\"附屬的；輔助的\">accessory<\/a> spleen - a seemingly functionless <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=formation\" target=\"_blank\" rel=\"noopener\" data-w=\"formation\" data-pos=\"n.\" data-en=\"the process by which something is formed\" data-zh=\"形成\">formation<\/a> of splenetic tissue outside the normal spleen. Given the formation&#x27;s greater <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prevalence\" target=\"_blank\" rel=\"noopener\" data-w=\"prevalence\" data-pos=\"n.\" data-en=\"how common something is\" data-zh=\"普遍程度；盛行率\">prevalence<\/a> among whales known to make deeper dives, some researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that its role isn&#x27;t ______; rather, the accessory spleen may actively support diving mechanisms.", "bodyPlain": "Within baleen whale species, some individuals develop an accessory spleen - a seemingly functionless formation of splenetic tissue outside the normal spleen. Given the formation's greater prevalence among whales known to make deeper dives, some researchers hypothesize that its role isn't ______; rather, the accessory spleen may actively support diving mechanisms.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在鬚鯨物種中，有些個體會長出副脾——一種位於正常脾臟之外、看似沒有功能的脾臟組織構造。由於這種構造在已知會進行較深潛水的鯨魚中更為普遍，有些研究人員推測它的作用並非 ______；相反地，副脾可能會主動支援潛水機制。", "opts": {"A": "replicable", "B": "predetermined", "C": "operative", "D": "latent"}, "optsZh": {"A": "replicable（可重複驗證的）", "B": "predetermined（預先決定的）", "C": "operative（運作中的、有效的）", "D": "latent（潛在的、潛伏的）"}, "answer": "D", "expl": "'Rather, it may actively support diving' contrasts with an inactive role, so its role isn't 'latent' (present but inactive).", "explZh": "「rather，它可能主動支援潛水」與不活躍的角色形成對比，所以其作用並非「latent」（潛伏的、未顯現的）。", "defs": {"A": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}, "B": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}, "C": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}, "D": {"pos": "adj.", "en": "present but not yet visible, active, or developed", "zh": "潛在的；潛伏的", "word": "latent"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: choose an adjective meaning inactive or not apparent.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The enzyme was once thought to be ______ in cold conditions, but new evidence shows that it continues to catalyze reactions at low temperatures.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The enzyme was once thought to be ______ in cold conditions, but new evidence shows that it continues to catalyze reactions at low temperatures.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這種酵素過去被認為在低溫環境下是 ______ 的，但新證據顯示，它在低溫下仍能持續催化反應。", "opts": {"A": "predetermined", "B": "inactive", "C": "visible", "D": "replicable"}, "optsZh": {"A": "predetermined（預先決定的）", "B": "inactive（不活躍的、靜止的）", "C": "visible（可見的）", "D": "replicable（可重複驗證的）"}, "answer": "B", "expl": "Inactive contrasts with actively catalyzing reactions.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}, "B": {"pos": "adj.", "en": "not doing anything; not working or functioning", "zh": "不活躍的；無作用的；靜止的", "word": "inactive"}, "C": {"pos": "adj.", "en": "able to be seen or noticed", "zh": "看得見的；明顯的", "word": "visible"}, "D": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: choose an adjective meaning inactive or not apparent.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The secondary chamber looked ______ until researchers found that it helps regulate pressure during deep dives.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The secondary chamber looked ______ until researchers found that it helps regulate pressure during deep dives.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這個次級腔室原本看起來是 ______ 的，直到研究人員發現它能在深潛時協助調節壓力。", "opts": {"A": "essential", "B": "functional", "C": "operative", "D": "dormant"}, "optsZh": {"A": "essential（必要的、本質的）", "B": "functional（功能正常的、實用的）", "C": "operative（運作中的、有效的）", "D": "dormant（休眠的、蟄伏的）"}, "answer": "D", "expl": "Dormant means inactive or not visibly functioning.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "extremely important and necessary", "zh": "必要的；不可或缺的；本質的", "word": "essential"}, "B": {"pos": "adj.", "en": "having a practical use; working as intended", "zh": "有功能的；實用的；能運作的", "word": "functional"}, "C": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}, "D": {"pos": "adj.", "en": "not active or growing now but able to become active later", "zh": "休眠的；蟄伏的；潛伏的", "word": "dormant"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: choose an adjective meaning inactive or not apparent.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Although the structure had been dismissed as ______, later tests showed that it plays a role in immune response.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the structure had been dismissed as ______, later tests showed that it plays a role in immune response.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n雖然這個構造曾被認為是 ______ 而遭到忽視，但後來的檢驗顯示它在免疫反應中扮演了某種角色。", "opts": {"A": "vestigial", "B": "replicable", "C": "coordinated", "D": "measurable"}, "optsZh": {"A": "vestigial（殘存的、退化的）", "B": "replicable（可重複驗證的）", "C": "coordinated（協調的）", "D": "measurable（可測量的）"}, "answer": "A", "expl": "Vestigial can mean a remnant with little apparent function.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "remaining from an earlier stage but no longer having a useful function", "zh": "退化的；殘留的；無功能的", "word": "vestigial"}, "B": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}, "C": {"pos": "adj.", "en": "organized so that different parts work well together", "zh": "協調的；配合良好的", "word": "coordinated"}, "D": {"pos": "adj.", "en": "large enough to be noticed or measured", "zh": "可測量的；顯著的", "word": "measurable"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: choose an adjective meaning inactive or not apparent.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The protein&#x27;s role was not ______ after all; under stress, it activated several repair mechanisms.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The protein's role was not ______ after all; under stress, it activated several repair mechanisms.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這種蛋白質的作用終究並非 ______；在壓力下，它啟動了數種修復機制。", "opts": {"A": "visible", "B": "quiescent", "C": "complex", "D": "replicated"}, "optsZh": {"A": "visible（可見的）", "B": "quiescent（靜止的、沉寂的）", "C": "complex（複雜的）", "D": "replicated（已被重複驗證的）"}, "answer": "B", "expl": "Quiescent means inactive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to be seen or noticed", "zh": "看得見的；明顯的", "word": "visible"}, "B": {"pos": "adj.", "en": "quiet and inactive, often for a time", "zh": "靜止的；休眠的；沉寂的", "word": "quiescent"}, "C": {"pos": "adj.", "en": "made of many connected parts; difficult to understand", "zh": "複雜的；錯綜的", "word": "complex"}, "D": {"pos": "adj.", "en": "repeated or copied exactly, often to check results", "zh": "經重複驗證的；複製的", "word": "replicated"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: choose an adjective meaning inactive or not apparent.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The organ seemed ______, but scans revealed that it expands during prolonged dives.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The organ seemed ______, but scans revealed that it expands during prolonged dives.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這個器官看似 ______，但掃描結果顯示它會在長時間潛水時擴張。", "opts": {"A": "predictable", "B": "necessary", "C": "inert", "D": "operative"}, "optsZh": {"A": "predictable（可預測的）", "B": "necessary（必要的）", "C": "inert（惰性的、不活動的）", "D": "operative（運作中的、有效的）"}, "answer": "C", "expl": "Inert means inactive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening in a way that can be expected", "zh": "可預測的；意料之中的", "word": "predictable"}, "B": {"pos": "adj.", "en": "needed in order to achieve something", "zh": "必要的；必需的", "word": "necessary"}, "C": {"pos": "adj.", "en": "not moving or active; having no chemical or biological effect", "zh": "無活性的；惰性的；不動的", "word": "inert"}, "D": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Words in Context: choose a phrase meaning made less important than other factors.", "vocab": true, "body": "According to a US tax policy expert, state taxes are ______ other factors when considering an interstate move. Even <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> differences in state taxation have almost no effect on most people&#x27;s decisions, while differences in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=employment\" target=\"_blank\" rel=\"noopener\" data-w=\"employment\" data-pos=\"n.\" data-en=\"work for which people are paid; the state of having a job\" data-zh=\"就業；雇用\">employment<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opportunity\" target=\"_blank\" rel=\"noopener\" data-w=\"opportunity\" data-pos=\"n.\" data-en=\"a chance to do something\" data-zh=\"機會\">opportunities<\/a>, housing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=availability\" target=\"_blank\" rel=\"noopener\" data-w=\"availability\" data-pos=\"n.\" data-en=\"the state of being able to be obtained or used\" data-zh=\"可取得性；供應情況\">availability<\/a>, and climate are strong influences.", "bodyPlain": "According to a US tax policy expert, state taxes are ______ other factors when considering an interstate move. Even significant differences in state taxation have almost no effect on most people's decisions, while differences in employment opportunities, housing availability, and climate are strong influences.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "根據一位美國稅務政策專家的說法，在考慮跨州搬遷時，州稅 ______ 其他因素。即使各州稅制存在顯著差異，對大多數人的決定也幾乎沒有影響；相較之下，就業機會、住房供應與氣候方面的差異則有強大的影響力。", "opts": {"A": "consistent with", "B": "representative of", "C": "overshadowed by", "D": "irrelevant to"}, "optsZh": {"A": "consistent with（與…一致）", "B": "representative of（代表…的）", "C": "overshadowed by（被…掩蓋）", "D": "irrelevant to（與…無關）"}, "answer": "C", "expl": "Taxes have almost no effect while other factors are strong influences, so taxes are 'overshadowed by' other factors.", "explZh": "稅負幾乎沒有影響，而其他因素影響很大，所以稅負被其他因素「overshadowed by」（掩蓋）。", "defs": {"A": {"pos": "phr.", "en": "in agreement with or matching something", "zh": "與……一致；符合", "word": "consistent with"}, "B": {"pos": "phr.", "en": "typical of or serving as an example of a group", "zh": "代表……；典型的", "word": "representative of"}, "C": {"pos": "phr.", "en": "made to seem less important by something else", "zh": "被……掩蓋；相形見絀於", "word": "overshadowed by"}, "D": {"pos": "phr.", "en": "not connected with or important to something", "zh": "與……無關", "word": "irrelevant to"}}}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Words in Context: choose a phrase meaning made less important than other factors.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The survey suggests that school quality is ______ housing cost when families choose a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a>; parents mention academic programs far more often than prices.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The survey suggests that school quality is ______ housing cost when families choose a neighborhood; parents mention academic programs far more often than prices.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這項調查顯示，家庭在選擇居住社區時，學校品質 ______ 住房成本；家長提到學業課程的次數遠多於價格。", "opts": {"A": "irrelevant to", "B": "consistent with", "C": "representative of", "D": "eclipsed by"}, "optsZh": {"A": "irrelevant to（與…無關）", "B": "consistent with（與…一致）", "C": "representative of（代表…的）", "D": "eclipsed by（被…蓋過、相形失色）"}, "answer": "D", "expl": "Eclipsed by means made less important by another factor.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "not connected with or important to something", "zh": "與……無關", "word": "irrelevant to"}, "B": {"pos": "phr.", "en": "in agreement with or matching something", "zh": "與……一致；符合", "word": "consistent with"}, "C": {"pos": "phr.", "en": "typical of or serving as an example of a group", "zh": "代表……；典型的", "word": "representative of"}, "D": {"pos": "phr.", "en": "made to seem less important by something greater", "zh": "被……蓋過；相形失色於", "word": "eclipsed by"}}}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Words in Context: choose a phrase meaning made less important than other factors.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. For many commuters, small differences in bus fare are ______ travel time and reliability.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. For many commuters, small differences in bus fare are ______ travel time and reliability.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n對許多通勤者而言，公車票價的些微差異 ______ 交通時間與可靠性。", "opts": {"A": "subordinate to", "B": "symbolic of", "C": "identical to", "D": "predictive of"}, "optsZh": {"A": "subordinate to（從屬於…、次於…）", "B": "symbolic of（象徵…的）", "C": "identical to（與…完全相同）", "D": "predictive of（可預測…的）"}, "answer": "A", "expl": "Subordinate to means less important than.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "lower in rank or importance than something else", "zh": "從屬於；次於", "word": "subordinate to"}, "B": {"pos": "phr.", "en": "representing or standing for something", "zh": "象徵……；代表", "word": "symbolic of"}, "C": {"pos": "phr.", "en": "exactly the same as", "zh": "與……完全相同", "word": "identical to"}, "D": {"pos": "phr.", "en": "indicating what is likely to happen", "zh": "可預示……；能預測……", "word": "predictive of"}}}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Words in Context: choose a phrase meaning made less important than other factors.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The curator argues that the painting&#x27;s market value is ______ its cultural importance in deciding whether to exhibit it.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The curator argues that the painting's market value is ______ its cultural importance in deciding whether to exhibit it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這位策展人認為，在決定是否展出這幅畫時，它的市場價值 ______ 它的文化重要性。", "opts": {"A": "independent of", "B": "representative of", "C": "secondary to", "D": "equivalent to"}, "optsZh": {"A": "independent of（不受…影響、獨立於…）", "B": "representative of（代表…的）", "C": "secondary to（次於…）", "D": "equivalent to（等同於…）"}, "answer": "C", "expl": "Secondary to means less important than.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "not influenced by or relying on something", "zh": "不受……影響；獨立於", "word": "independent of"}, "B": {"pos": "phr.", "en": "typical of or serving as an example of a group", "zh": "代表……；典型的", "word": "representative of"}, "C": {"pos": "phr.", "en": "less important than something else", "zh": "次於；不如……重要", "word": "secondary to"}, "D": {"pos": "phr.", "en": "equal in value, amount, meaning, or importance to", "zh": "等同於；相當於", "word": "equivalent to"}}}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Words in Context: choose a phrase meaning made less important than other factors.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. In patients&#x27; choice of clinic, parking convenience is often ______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=availability\" target=\"_blank\" rel=\"noopener\" data-w=\"availability\" data-pos=\"n.\" data-en=\"the state of being able to be obtained or used\" data-zh=\"可取得性；供應情況\">availability<\/a> of specialists.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. In patients' choice of clinic, parking convenience is often ______ the availability of specialists.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n在病患選擇診所時，停車便利性往往 ______ 專科醫師的有無。", "opts": {"A": "indicative of", "B": "irrelevant to", "C": "consistent with", "D": "overshadowed by"}, "optsZh": {"A": "indicative of（顯示…、表明…）", "B": "irrelevant to（與…無關）", "C": "consistent with（與…一致）", "D": "overshadowed by（被…掩蓋）"}, "answer": "D", "expl": "Overshadowed by means outweighed by a stronger factor.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "serving as a sign or evidence of something", "zh": "顯示出；表明；象徵", "word": "indicative of"}, "B": {"pos": "phr.", "en": "not connected with or important to something", "zh": "與……無關", "word": "irrelevant to"}, "C": {"pos": "phr.", "en": "in agreement with or matching something", "zh": "與……一致；符合", "word": "consistent with"}, "D": {"pos": "phr.", "en": "made to seem less important by something else", "zh": "被……掩蓋；相形見絀於", "word": "overshadowed by"}}}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Words in Context: choose a phrase meaning made less important than other factors.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The committee found that minor design preferences were ______ safety requirements during the bridge review.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The committee found that minor design preferences were ______ safety requirements during the bridge review.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n委員會發現，在橋梁審查過程中，次要的設計偏好 ______ 安全要求。", "opts": {"A": "derived from", "B": "outweighed by", "C": "modeled on", "D": "synchronized with"}, "optsZh": {"A": "derived from（源自…）", "B": "outweighed by（被…所壓過、比不上…）", "C": "modeled on（以…為模型）", "D": "synchronized with（與…同步）"}, "answer": "B", "expl": "Outweighed by means less important than.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "coming from or developed out of something", "zh": "源自；衍生自", "word": "derived from"}, "B": {"pos": "phr.", "en": "less important or influential than something else", "zh": "不如……重要；被……壓過", "word": "outweighed by"}, "C": {"pos": "phr.", "en": "designed or made to copy or follow something", "zh": "以……為範本；仿照", "word": "modeled on"}, "D": {"pos": "phr.", "en": "happening at the same time or rate as something", "zh": "與……同步", "word": "synchronized with"}}}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Words in Context: choose an adjective meaning weak or poorly supported.", "vocab": true, "body": "The author&#x27;s claim about the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between Neanderthals and Homo sapiens is ______, as it fails to account for several recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeological\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeological\" data-pos=\"adj.\" data-en=\"relating to the study of ancient remains\" data-zh=\"考古的\">archaeological<\/a> discoveries. To be convincing, his argument would need to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=address\" target=\"_blank\" rel=\"noopener\" data-w=\"address\" data-pos=\"v./n.\" data-en=\"to deal with a problem; a formal speech\" data-zh=\"處理；演說\">address<\/a> recent finds of additional hominid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fossil\" target=\"_blank\" rel=\"noopener\" data-w=\"fossil\" data-pos=\"n.\" data-en=\"the remains of a prehistoric plant or animal preserved in rock\" data-zh=\"化石\">fossils<\/a>, such as the latest Denisovan specimens and Homo longi.", "bodyPlain": "The author's claim about the relationship between Neanderthals and Homo sapiens is ______, as it fails to account for several recent archaeological discoveries. To be convincing, his argument would need to address recent finds of additional hominid fossils, such as the latest Denisovan specimens and Homo longi.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "作者關於尼安德塔人與智人之間關係的主張是 ______ 的，因為它未能說明近來的幾項考古發現。若要令人信服，他的論點必須處理近期發現的其他人科化石，例如最新的丹尼索瓦人標本和 Homo longi。", "opts": {"A": "disorienting", "B": "tenuous", "C": "nuanced", "D": "unoriginal"}, "optsZh": {"A": "disorienting（令人迷惘的）", "B": "tenuous（薄弱的、站不住腳的）", "C": "nuanced（細膩的、有細微差別的）", "D": "unoriginal（缺乏原創性的）"}, "answer": "B", "expl": "The claim 'fails to account for' recent discoveries and is not convincing, so it is 'tenuous' (weak).", "explZh": "這個主張未能解釋近期發現、缺乏說服力，所以是「tenuous」（薄弱的）。", "defs": {"A": {"pos": "adj.", "en": "making someone confused about where they are or what is happening", "zh": "使人迷惘的；令人困惑的", "word": "disorienting"}, "B": {"pos": "adj.", "en": "very weak or poorly supported", "zh": "薄弱的；站不住腳的", "word": "tenuous"}, "C": {"pos": "adj.", "en": "showing subtle differences or shades of meaning", "zh": "細膩的；有細微差別的", "word": "nuanced"}, "D": {"pos": "adj.", "en": "not new or creative; copied from others", "zh": "缺乏原創性的；平庸的", "word": "unoriginal"}}}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Words in Context: choose an adjective meaning weak or poorly supported.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The proposal is ______ because it relies on a single survey with a small, unrepresentative sample.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The proposal is ______ because it relies on a single survey with a small, unrepresentative sample.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這項提案是 ______ 的，因為它只依據一份樣本量小且不具代表性的調查。", "opts": {"A": "nuanced", "B": "original", "C": "robust", "D": "tenuous"}, "optsZh": {"A": "nuanced（細膩的、有細微差別的）", "B": "original（原創的；原本的）", "C": "robust（穩健的、有力的）", "D": "tenuous（薄弱的、站不住腳的）"}, "answer": "D", "expl": "Tenuous means weakly supported.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "showing subtle differences or shades of meaning", "zh": "細膩的；有細微差別的", "word": "nuanced"}, "B": {"pos": "adj.", "en": "new and different; not copied", "zh": "原創的；新穎的；原本的", "word": "original"}, "C": {"pos": "adj.", "en": "strong and well supported; not easily weakened", "zh": "穩健的；強而有力的", "word": "robust"}, "D": {"pos": "adj.", "en": "very weak or poorly supported", "zh": "薄弱的；站不住腳的", "word": "tenuous"}}}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Words in Context: choose an adjective meaning weak or poorly supported.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a>&#x27;s conclusion remains ______ until the team can date the artifacts more precisely.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The archaeologist's conclusion remains ______ until the team can date the artifacts more precisely.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n在研究團隊能更精確地判定這些文物的年代之前，這位考古學家的結論仍是 ______ 的。", "opts": {"A": "provisional", "B": "compelling", "C": "ordinary", "D": "irrelevant"}, "optsZh": {"A": "provisional（暫時的、尚待確認的）", "B": "compelling（有說服力的）", "C": "ordinary（普通的）", "D": "irrelevant（無關的）"}, "answer": "A", "expl": "Provisional means tentative, not fully established.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "temporary and likely to be changed later", "zh": "暫時的；臨時的；有待確認的", "word": "provisional"}, "B": {"pos": "adj.", "en": "very convincing or holding your attention strongly", "zh": "令人信服的；引人入勝的", "word": "compelling"}, "C": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "D": {"pos": "adj.", "en": "not connected with or important to the matter at hand", "zh": "無關的；不相干的", "word": "irrelevant"}}}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Words in Context: choose an adjective meaning weak or poorly supported.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Because the study omits several major variables, its central claim is ______.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Because the study omits several major variables, its central claim is ______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n由於這項研究遺漏了幾個主要變數，它的核心主張是 ______ 的。", "opts": {"A": "meticulous", "B": "precarious", "C": "indisputable", "D": "conventional"}, "optsZh": {"A": "meticulous（一絲不苟的、極為仔細的）", "B": "precarious（不穩固的、岌岌可危的）", "C": "indisputable（無可爭辯的）", "D": "conventional（傳統的、慣常的）"}, "answer": "B", "expl": "Precarious means uncertain or insecure.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "very careful and paying close attention to every detail", "zh": "一絲不苟的；極為仔細的", "word": "meticulous"}, "B": {"pos": "adj.", "en": "not secure or stable; likely to fall or fail", "zh": "不穩定的；岌岌可危的", "word": "precarious"}, "C": {"pos": "adj.", "en": "so clearly true that it cannot be questioned", "zh": "無可爭辯的；無庸置疑的", "word": "indisputable"}, "D": {"pos": "adj.", "en": "following accepted customs or usual ways", "zh": "傳統的；慣例的；常規的", "word": "conventional"}}}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Words in Context: choose an adjective meaning weak or poorly supported.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The critic&#x27;s argument is ______: it depends on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ambiguous\" target=\"_blank\" rel=\"noopener\" data-w=\"ambiguous\" data-pos=\"adj.\" data-en=\"having more than one possible meaning; unclear\" data-zh=\"模糊的；含糊不清的\">ambiguous<\/a> line while ignoring several contradictory passages.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The critic's argument is ______: it depends on one ambiguous line while ignoring several contradictory passages.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位評論家的論點是 ______ 的：它仰賴一行意義模糊的詩句，卻忽略了好幾段相互矛盾的段落。", "opts": {"A": "fragile", "B": "comprehensive", "C": "decorative", "D": "balanced"}, "optsZh": {"A": "fragile（脆弱的）", "B": "comprehensive（全面的、詳盡的）", "C": "decorative（裝飾性的）", "D": "balanced（平衡的）"}, "answer": "A", "expl": "Fragile means easily weakened.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "easily broken or damaged", "zh": "脆弱的；易碎的", "word": "fragile"}, "B": {"pos": "adj.", "en": "including all or nearly all parts or details", "zh": "全面的；廣泛的；綜合的", "word": "comprehensive"}, "C": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的；裝飾用的", "word": "decorative"}, "D": {"pos": "adj.", "en": "giving fair and equal attention to different sides or parts", "zh": "均衡的；平衡的；公允的", "word": "balanced"}}}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Words in Context: choose an adjective meaning weak or poorly supported.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Without evidence from the later manuscripts, the theory remains ______.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Without evidence from the later manuscripts, the theory remains ______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n若沒有來自較晚期手稿的證據，這個理論仍是 ______ 的。", "opts": {"A": "definitive", "B": "well-founded", "C": "speculative", "D": "redundant"}, "optsZh": {"A": "definitive（確定的、權威的）", "B": "well-founded（有根據的）", "C": "speculative（推測性的）", "D": "redundant（多餘的、冗贅的）"}, "answer": "C", "expl": "Speculative means based on conjecture rather than firm evidence.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "final, complete, and not able to be questioned", "zh": "決定性的；權威的；最終的", "word": "definitive"}, "B": {"pos": "adj.", "en": "based on good evidence or reasoning", "zh": "有根據的；理由充分的", "word": "well-founded"}, "C": {"pos": "adj.", "en": "based on guesses rather than firm evidence", "zh": "推測性的；臆測的", "word": "speculative"}, "D": {"pos": "adj.", "en": "not needed because something else already does the job", "zh": "多餘的；冗贅的", "word": "redundant"}}}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Poetry: identify the main purpose of an excerpt.", "vocab": false, "body": "The following text is from Georgia Douglas Johnson&#x27;s 1922 poem &quot;Benediction.&quot;<br><br>Go forth, my son,<br>Winged by my heart&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=desire\" target=\"_blank\" rel=\"noopener\" data-w=\"desire\" data-pos=\"n.\" data-en=\"a strong wish or want\" data-zh=\"渴望；願望\">desire<\/a>!<br>Great reaches, yet unknown,<br>Await<br>For your <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=possession\" target=\"_blank\" rel=\"noopener\" data-w=\"possession\" data-pos=\"n.\" data-en=\"the state of owning or having something\" data-zh=\"擁有；所有物\">possession<\/a>.<br>I may not, if I would,<br>Retrace the way with you,<br>My <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pilgrimage\" target=\"_blank\" rel=\"noopener\" data-w=\"pilgrimage\" data-pos=\"n.\" data-en=\"a long journey to a special or holy place\" data-zh=\"朝聖之旅\">pilgrimage<\/a> is through,<br>But life is calling you!", "bodyPlain": "The following text is from Georgia Douglas Johnson's 1922 poem \"Benediction.\"\n\nGo forth, my son,\nWinged by my heart's desire!\nGreat reaches, yet unknown,\nAwait\nFor your possession.\nI may not, if I would,\nRetrace the way with you,\nMy pilgrimage is through,\nBut life is calling you!", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自 Georgia Douglas Johnson 1922 年的詩〈Benediction〉。\n去吧，我的兒子，\n乘著我心中的渴望展翅高飛！\n遼闊的疆域，尚未為人所知，\n正等待著\n由你去擁有。\n即使我願意，我也不能\n與你一同重走這條路，\n我的朝聖之旅已經結束，\n但生命正在呼喚你！", "opts": {"A": "To express hope that a child will have the same accomplishments as his parent did", "B": "To suggest that raising a child involves many struggles", "C": "To warn a child that he will face many challenges throughout his life", "D": "To encourage a child to embrace the experiences life will offer"}, "optsZh": {"A": "表達希望孩子能擁有與其父母相同的成就", "B": "暗示養育孩子涉及許多艱辛", "C": "警告孩子他一生中將面臨許多挑戰", "D": "鼓勵一個孩子擁抱人生將帶給他的種種經歷"}, "answer": "D", "expl": "The speaker urges her son to 'go forth' because 'life is calling you,' encouraging him to embrace what life offers.", "explZh": "說話者鼓勵兒子「勇往直前」，因為「生命在召喚你」，意在鼓勵他擁抱人生的種種經歷。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Poetry: identify the main purpose of an excerpt.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一段文字描述一位詩人如何對一位即將離家的年輕親人說話。說話者表示，前方的道路無法由任何其他人代為行走，而面對未知的世界應該要有勇氣，而非恐懼。", "opts": {"A": "To argue that travel is always dangerous", "B": "To describe the speaker's own childhood in detail", "C": "To criticize a relative for leaving home", "D": "To encourage someone to face future experiences independently"}, "optsZh": {"A": "主張旅行總是危險的", "B": "詳細描述說話者自己的童年", "C": "批評一位親人離開家鄉", "D": "鼓勵某人獨立面對未來的經歷"}, "answer": "D", "expl": "The passage encourages the younger person to embrace future experience.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Poetry: identify the main purpose of an excerpt.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一篇簡短的說明文指出，社區歷史學家過去以口述方式保存家族紀錄，如今也使用數位檔案，但他們的核心任務仍是保護集體記憶。", "opts": {"A": "Digital archives have made oral history unnecessary.", "B": "The role of community historians has changed in tools but not in its core purpose.", "C": "Community historians mainly work as entertainers.", "D": "Family records are less valuable than public records."}, "optsZh": {"A": "數位檔案已使口述歷史變得不再必要。", "B": "社區歷史學家的角色在工具上有所改變，但其核心目的並未改變。", "C": "社區歷史學家主要以娛樂表演者的身分工作。", "D": "家族紀錄的價值低於公共紀錄。"}, "answer": "B", "expl": "The main idea combines change with continuity.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Poetry: identify the main purpose of an excerpt.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇科學文章說明，一種在數十年前就被預測存在的結構，在研究人員將粒子冷卻成有序排列並使用新的成像方法後，終於被觀察到。", "opts": {"A": "The imaging method is unrelated to the discovery.", "B": "Cooling particles prevents ordered structures from forming.", "C": "Researchers obtained direct evidence for a long-theorized structure.", "D": "The prediction was disproved by later experiments."}, "optsZh": {"A": "這種成像方法與這項發現無關。", "B": "冷卻粒子會阻止有序結構的形成。", "C": "研究人員取得了一種長久以來僅存在於理論中的結構的直接證據。", "D": "這項預測已被後來的實驗推翻。"}, "answer": "C", "expl": "The central point is confirmation of a predicted structure.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Poetry: identify the main purpose of an excerpt.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文章指出，一架為地球設計的飛行器在模擬的稀薄大氣中無法飛行，因此工程師加長了它的旋翼並提高其轉速。", "opts": {"A": "Longer blades make aircraft unable to fly on Earth.", "B": "Earth-designed aircraft may fail in thinner atmospheres because their blades do not generate enough lift.", "C": "Spacecraft designed for Earth are too heavy to test in laboratories.", "D": "Engineers avoid changing aircraft designs for other planets."}, "optsZh": {"A": "較長的旋翼使飛行器無法在地球上飛行。", "B": "為地球設計的飛行器在較稀薄的大氣中可能會失敗，因為它們的旋翼無法產生足夠的升力。", "C": "為地球設計的太空船太重，無法在實驗室中測試。", "D": "工程師們避免為其他行星修改飛行器設計。"}, "answer": "B", "expl": "The details explain why the Earth design would not work.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Poetry: identify the main purpose of an excerpt.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> journey, saying that new regions wait to be claimed.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an independent journey, saying that new regions wait to be claimed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在一段文學節錄中，說話者在孩子展開獨立旅程之前為他祝福，說新的疆域正等待著被擁有。", "opts": {"A": "To express hopeful encouragement as a younger person begins a new life stage", "B": "To explain how the speaker became famous", "C": "To complain that the speaker was abandoned", "D": "To warn that the child should avoid unfamiliar places"}, "optsZh": {"A": "在一位年輕人展開人生新階段時，表達充滿希望的鼓勵", "B": "說明說話者如何成名", "C": "抱怨說話者遭到拋棄", "D": "警告孩子應避開不熟悉的地方"}, "answer": "A", "expl": "The speaker's tone is hopeful and encouraging.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "
