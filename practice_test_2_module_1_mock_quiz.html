Text Structure: describe the function of a sentence in a literary memoir excerpt.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Indian Boyhood, a 1902 memoir by Ohiyesa (Charles A. Eastman), a Santee Dakota writer. In the text, Ohiyesa recalls how the women in his tribe harvested maple syrup during his childhood.<br><br>Now the women began to test the trees - moving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=leisurely\" target=\"_blank\" rel=\"noopener\" data-w=\"leisurely\" data-pos=\"adv./adj.\" data-en=\"in a relaxed way, without hurry\" data-zh=\"從容地；悠閒的\">leisurely<\/a> among them, axe in hand, and striking a single quick blow, to see if the sap would appear. <u>The trees, like people, have their individual characters; some were ready to yield up their life-blood, while others were more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reluctant\" target=\"_blank\" rel=\"noopener\" data-w=\"reluctant\" data-pos=\"adj.\" data-en=\"unwilling and hesitant to do something\" data-zh=\"不情願的\">reluctant<\/a>.<\/u> Now one of the birchen basins was set under each tree, and a hardwood chip driven deep into the cut which the axe had made. From the corners of this chip - at first drop by drop, then more freely - the sap <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trickle\" target=\"_blank\" rel=\"noopener\" data-w=\"trickle\" data-pos=\"v.\" data-en=\"to flow slowly in a thin stream\" data-zh=\"滴流；細流\">trickled<\/a> into the little dishes.", "bodyPlain": "The following text is adapted from Indian Boyhood, a 1902 memoir by Ohiyesa (Charles A. Eastman), a Santee Dakota writer. In the text, Ohiyesa recalls how the women in his tribe harvested maple syrup during his childhood.\n\nNow the women began to test the trees - moving leisurely among them, axe in hand, and striking a single quick blow, to see if the sap would appear. The trees, like people, have their individual characters; some were ready to yield up their life-blood, while others were more reluctant. Now one of the birchen basins was set under each tree, and a hardwood chip driven deep into the cut which the axe had made. From the corners of this chip - at first drop by drop, then more freely - the sap trickled into the little dishes.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "以下文字改編自 Ohiyesa（Charles A.Eastman）1902 年的回憶錄《Indian Boyhood》；Ohiyesa 是一位桑提達科他族（Santee Dakota）作家。在這段文字中，Ohiyesa 回憶童年時期族中婦女如何採收楓糖漿。\n這時婦女們開始測試這些樹——她們手持斧頭，悠閒地在樹間走動，迅速地砍下一斧，看看樹液是否會流出。樹木和人一樣，各有各的性格；有些樹很樂意獻出它們的生命之血，有些則較不情願。接著，每棵樹下都放了一個樺樹皮做的盆子，並將一片硬木木片深深地打進斧頭砍出的切口中。樹液從這片木片的邊角——起初一滴一滴，接著越來越順暢——流進小盆子裡。", "opts": {"A": "It portrays the range of personality traits displayed by the women as they work.", "B": "It foregrounds the beneficial relationship between humans and maple trees.", "C": "It demonstrates how human behavior can be influenced by the natural environment.", "D": "It elaborates on an aspect of the maple trees that the women evaluate."}, "optsZh": {"A": "它描繪了這些女性在工作時所展現的各種性格特質。", "B": "它凸顯了人類與楓樹之間互惠的關係。", "C": "它展現了人類行為如何受到自然環境的影響。", "D": "它詳細說明了這些女性所評估的楓樹的某個面向。"}, "answer": "D", "expl": "The underlined sentence explains that some trees yield sap readily and others don't—the quality the women are testing for.", "explZh": "畫線句說明有些樹容易流出樹液、有些則不然，這正是婦女們在測試評估的樹木特性。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Text Structure: describe the function of a sentence in a literary memoir excerpt.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A memoir passage says workers test several trees before tapping them. The next sentence explains that some trees yield sap readily while others resist, comparing them to people with different characters.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A memoir passage says workers test several trees before tapping them. The next sentence explains that some trees yield sap readily while others resist, comparing them to people with different characters.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一段回憶錄文字提到，工作者在採集樹液前會先測試好幾棵樹。下一句說明有些樹很容易流出樹液，有些則不然，並將它們比作性格各異的人。", "opts": {"A": "It argues that trees are superior to humans.", "B": "It elaborates on what the workers discover when evaluating the trees.", "C": "It shifts the focus from trees to weather patterns.", "D": "It describes the workers' disagreements with one another."}, "optsZh": {"A": "它主張樹木優於人類。", "B": "它詳細說明工人們在評估樹木時所發現的事物。", "C": "它把焦點從樹木轉移到天氣型態。", "D": "它描述工人們彼此之間的意見分歧。"}, "answer": "B", "expl": "The sentence develops the specific quality being evaluated.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Text Structure: describe the function of a sentence in a literary memoir excerpt.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A novel first states that the room revealed its owner&#x27;s habits. The next sentence lists the ink-stained desk, stacked letters, and half-open maps.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A novel first states that the room revealed its owner's habits. The next sentence lists the ink-stained desk, stacked letters, and half-open maps.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一部小說首先陳述，這個房間透露了主人的習慣。下一句列出了沾滿墨漬的書桌、堆疊的信件，以及半攤開的地圖。", "opts": {"A": "It introduces an unrelated setting.", "B": "It summarizes the entire plot.", "C": "It contradicts the previous sentence.", "D": "It supplies details that support the previous claim."}, "optsZh": {"A": "它引入一個不相關的場景。", "B": "它概述了整個情節。", "C": "它與前一句相矛盾。", "D": "它提供支持前一個主張的細節。"}, "answer": "D", "expl": "The listed objects illustrate the claim.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Text Structure: describe the function of a sentence in a literary memoir excerpt.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A science passage says a fossil site contains mixed evidence. The next sentence notes that marine shells appear beside plant remains from dry land.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A science passage says a fossil site contains mixed evidence. The next sentence notes that marine shells appear beside plant remains from dry land.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇科學文章指出，某個化石遺址含有混雜的證據。下一句提到，海洋貝殼與來自乾燥陸地的植物遺骸並排出現。", "opts": {"A": "It explains how fossils are collected.", "B": "It describes the researchers' equipment.", "C": "It gives an example of the mixed evidence just mentioned.", "D": "It rejects the idea that the site is important."}, "optsZh": {"A": "它說明化石是如何被採集的。", "B": "它描述研究人員的設備。", "C": "它舉例說明剛才提到的正反不一的證據。", "D": "它否定了該遺址很重要的看法。"}, "answer": "C", "expl": "The sentence illustrates mixed evidence.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Text Structure: describe the function of a sentence in a literary memoir excerpt.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A poem first describes the city as restless. The next line presents bells, wheels, and voices overlapping before dawn.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A poem first describes the city as restless. The next line presents bells, wheels, and voices overlapping before dawn.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一首詩首先將這座城市描述為躁動不安的。下一行呈現了黎明前鐘聲、車輪聲與人聲交疊的景象。", "opts": {"A": "It develops the earlier description through sound imagery.", "B": "It defines a technical term.", "C": "It changes the setting to the countryside.", "D": "It introduces the speaker's family history."}, "optsZh": {"A": "它透過聲音意象來發展先前的描寫。", "B": "它為一個專業術語下定義。", "C": "它把場景轉換到鄉間。", "D": "它介紹說話者的家族歷史。"}, "answer": "A", "expl": "The sounds develop restlessness.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Text Structure: describe the function of a sentence in a literary memoir excerpt.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A paragraph claims that the sculpture changes as viewers move around it. The next sentence says that an opening visible from one angle disappears from another.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A paragraph claims that the sculpture changes as viewers move around it. The next sentence says that an opening visible from one angle disappears from another.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一段文字主張，這座雕塑會隨著觀者繞行而產生變化。下一句說，從某個角度看得到的開口，換個角度就消失了。", "opts": {"A": "It describes the museum's opening hours.", "B": "It criticizes viewers for moving too quickly.", "C": "It provides a concrete example of the sculpture's shifting appearance.", "D": "It explains the sculpture's price."}, "optsZh": {"A": "它描述博物館的開放時間。", "B": "它批評觀者移動得太快。", "C": "它提供了一個具體的例子，說明這件雕塑不斷變化的外觀。", "D": "它說明這件雕塑的價格。"}, "answer": "C", "expl": "The sentence exemplifies the claim.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Cross-Text Connections: infer how Text 2 would respond to Text 1.", "vocab": false, "body": "Text 1<br>Ecologists have long wondered how thousands of microscopic phytoplankton species can live together near ocean surfaces competing for the same resources. According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following accepted customs or usual ways\" data-zh=\"傳統的；慣例的；常規的\">conventional<\/a> wisdom, one species should emerge after outcompeting the rest. So why do so many species remain? Ecologists&#x27; many efforts to explain this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=phenomenon\" target=\"_blank\" rel=\"noopener\" data-w=\"phenomenon\" data-pos=\"n.\" data-en=\"a fact or event that is observed to happen\" data-zh=\"現象\">phenomenon<\/a> still haven&#x27;t uncovered a satisfactory explanation.<br><br>Text 2<br>Ecologist Michael Behrenfeld and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> have connected phytoplankton&#x27;s diversity to their microscopic size. Because these <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organism\" target=\"_blank\" rel=\"noopener\" data-w=\"organism\" data-pos=\"n.\" data-en=\"a living thing\" data-zh=\"生物\">organisms<\/a> are so tiny, they are spaced relatively far apart from each other in ocean water and, moreover, experience that water as a relatively dense substance. This in turn makes it hard for them to move around and interact with one another. Therefore, says Behrenfeld&#x27;s team, direct competition among phytoplankton probably happens much less than previously thought.<br><br>Based on the texts, how would Behrenfeld and colleagues (Text 2) most likely respond to the &quot;conventional wisdom&quot; discussed in Text 1?", "bodyPlain": "Text 1\nEcologists have long wondered how thousands of microscopic phytoplankton species can live together near ocean surfaces competing for the same resources. According to conventional wisdom, one species should emerge after outcompeting the rest. So why do so many species remain? Ecologists' many efforts to explain this phenomenon still haven't uncovered a satisfactory explanation.\n\nText 2\nEcologist Michael Behrenfeld and colleagues have connected phytoplankton's diversity to their microscopic size. Because these organisms are so tiny, they are spaced relatively far apart from each other in ocean water and, moreover, experience that water as a relatively dense substance. This in turn makes it hard for them to move around and interact with one another. Therefore, says Behrenfeld's team, direct competition among phytoplankton probably happens much less than previously thought.\n\nBased on the texts, how would Behrenfeld and colleagues (Text 2) most likely respond to the \"conventional wisdom\" discussed in Text 1?", "stem": "", "stemZh": "", "bodyZh": "文本 1\n生態學家長久以來一直好奇，數以千計的微小浮游植物物種如何能在海洋表層共存，並競爭相同的資源。根據傳統看法，應該會有一個物種在勝過其他物種之後脫穎而出。那麼，為什麼仍有這麼多物種存在呢？生態學家為解釋這個現象做了許多努力，卻仍未找到令人滿意的解釋。\n文本 2\n生態學家 Michael Behrenfeld 與同事將浮游植物的多樣性與其微小的體型連結起來。由於這些生物極為微小，它們在海水中彼此之間的距離相對較遠，而且，它們感受到的海水是一種相對濃稠的物質。這進而使它們難以四處移動並彼此互動。因此，Behrenfeld 的團隊表示，浮游植物之間的直接競爭發生的頻率，可能遠低於先前所認為的。\n根據這兩篇文本，Behrenfeld 與同事（文本 2）最可能如何回應文本 1 所討論的「傳統看法」？", "opts": {"A": "By arguing that it is based on a misconception about phytoplankton species competing with one another", "B": "By asserting that it fails to recognize that routine replenishment of ocean nutrients prevents competition between phytoplankton species", "C": "By suggesting that their own findings help clarify how phytoplankton species are able to compete with larger organisms", "D": "By recommending that more ecologists focus their research on how competition among phytoplankton species is increased with water density"}, "optsZh": {"A": "藉由主張其建立在對浮游植物物種彼此競爭的誤解之上", "B": "藉由斷言其未能認識到海洋養分的定期補充能防止浮游植物物種之間的競爭", "C": "藉由暗示他們自己的研究發現有助於釐清浮游植物物種如何能與較大型的生物競爭", "D": "藉由建議更多生態學家將研究重點放在浮游植物物種間的競爭如何隨海水密度增加"}, "answer": "A", "expl": "Text 2 says direct competition happens much less than thought, so the conventional wisdom rests on a misconception about competition.", "explZh": "Text 2 認為直接競爭比過去想像的少得多，因此傳統觀點建立在對競爭的誤解上。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Cross-Text Connections: infer how Text 2 would respond to Text 1.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Text 1 argues that two bird species must be competing because they eat the same seeds. Text 2 reports that one species feeds at night and the other during the day, so direct competition is rare.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Text 1 argues that two bird species must be competing because they eat the same seeds. Text 2 reports that one species feeds at night and the other during the day, so direct competition is rare.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n文本 1 主張兩種鳥類一定在相互競爭，因為牠們吃相同的種子。文本 2 指出，其中一種在夜間覓食，另一種在白天覓食，因此直接競爭很少見。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "By claiming that seed availability is irrelevant", "B": "By recommending that both species change diets", "C": "By agreeing that one species must disappear", "D": "By arguing that Text 1 overestimates competition between the species"}, "optsZh": {"A": "藉由宣稱種子的可得性無關緊要", "B": "藉由建議兩個物種都改變飲食", "C": "藉由同意其中一個物種必定會消失", "D": "藉由主張 Text 1 高估了物種之間的競爭"}, "answer": "D", "expl": "Text 2 challenges the competition assumption.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Cross-Text Connections: infer how Text 2 would respond to Text 1.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Text 1 says a city&#x27;s murals show a single political message. Text 2 notes that the murals were painted by different groups with conflicting goals.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Text 1 says a city's murals show a single political message. Text 2 notes that the murals were painted by different groups with conflicting goals.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n文本 1 說某座城市的壁畫呈現單一的政治訊息。文本 2 指出，這些壁畫是由目標相互衝突的不同團體所繪製的。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "By focusing only on painting materials", "B": "By arguing that all murals share one author", "C": "By suggesting that Text 1 simplifies the murals' meanings", "D": "By proving that the murals were not political"}, "optsZh": {"A": "藉由只聚焦於繪畫材料", "B": "藉由主張所有壁畫都出自同一位作者", "C": "藉由暗示 Text 1 過度簡化了壁畫的意義", "D": "藉由證明這些壁畫不具政治性"}, "answer": "C", "expl": "Text 2 complicates Text 1's claim.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Cross-Text Connections: infer how Text 2 would respond to Text 1.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Text 1 claims that ancient trade declined because a road closed. Text 2 presents shipwreck evidence showing that sea trade expanded at the same time.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Text 1 claims that ancient trade declined because a road closed. Text 2 presents shipwreck evidence showing that sea trade expanded at the same time.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n文本 1 主張古代貿易之所以衰退，是因為一條道路被封閉。文本 2 提出沉船證據，顯示海上貿易在同一時期反而擴張了。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "By focusing on modern shipping", "B": "By arguing that the evidence points to a shift in trade routes rather than an overall decline", "C": "By denying that trade existed", "D": "By claiming that roads were never used"}, "optsZh": {"A": "藉由聚焦於現代航運", "B": "藉由主張證據顯示的是貿易路線的轉移，而非整體的衰退", "C": "藉由否認貿易曾經存在", "D": "藉由宣稱道路從未被使用過"}, "answer": "B", "expl": "Text 2 reframes the interpretation.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Cross-Text Connections: infer how Text 2 would respond to Text 1.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Text 1 proposes that a species vanished because of climate. Text 2 shows that the species survived in several cooler regions but disappeared where a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predator<\/a> arrived.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Text 1 proposes that a species vanished because of climate. Text 2 shows that the species survived in several cooler regions but disappeared where a predator arrived.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n文本 1 提出某個物種是因氣候因素而消失的。文本 2 顯示，這個物種在數個較涼爽的地區存活下來，卻在掠食者出現的地方消失了。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "By suggesting that climate alone may not explain the disappearance", "B": "By rejecting fossil evidence altogether", "C": "By arguing that predators were harmless", "D": "By confirming that temperature was the only factor"}, "optsZh": {"A": "藉由暗示單憑氣候可能無法解釋其消失", "B": "藉由完全否定化石證據", "C": "藉由主張掠食者是無害的", "D": "藉由證實溫度是唯一的因素"}, "answer": "A", "expl": "Text 2 weakens a single-cause explanation.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Cross-Text Connections: infer how Text 2 would respond to Text 1.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Text 1 says students avoid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a> because group work lowers performance. Text 2 reports that collaboration improves results when tasks are complex and roles are clear.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Text 1 says students avoid collaboration because group work lowers performance. Text 2 reports that collaboration improves results when tasks are complex and roles are clear.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n文本 1 說學生之所以避免合作，是因為小組作業會降低表現。文本 2 指出，當任務複雜且角色分工明確時，合作能提升成果。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "By stating that individual work is always best", "B": "By qualifying Text 1's claim about collaboration", "C": "By arguing that roles make no difference", "D": "By claiming that grades cannot be measured"}, "optsZh": {"A": "藉由聲稱個人工作永遠是最好的", "B": "藉由修正並限定 Text 1 關於合作的主張", "C": "藉由主張角色並沒有任何差別", "D": "藉由宣稱成績無法被衡量"}, "answer": "B", "expl": "Text 2 gives conditions under which the claim changes.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Information and Ideas: identify a directly stated cause.", "vocab": false, "body": "In 2014, Amelia Quon and her team at NASA set out to build a helicopter capable of flying on Mars. Because Mars&#x27;s atmosphere is only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\" data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a> as dense as Earth&#x27;s, the air of Mars would not provide enough <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resistance\" target=\"_blank\" rel=\"noopener\" data-w=\"resistance\" data-pos=\"n.\" data-en=\"a force that slows or opposes movement\" data-zh=\"阻力；抵抗\">resistance<\/a> to the rotating blades of a standard helicopter for the aircraft to stay aloft. For five years, Quon&#x27;s team tested designs in a lab that mimicked Mars&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. The craft the team ultimately designed can fly on Mars because its blades are longer and rotate faster than those of a helicopter of the same size built for Earth.<br><br>According to the text, why would a helicopter built for Earth be unable to fly on Mars?", "bodyPlain": "In 2014, Amelia Quon and her team at NASA set out to build a helicopter capable of flying on Mars. Because Mars's atmosphere is only one percent as dense as Earth's, the air of Mars would not provide enough resistance to the rotating blades of a standard helicopter for the aircraft to stay aloft. For five years, Quon's team tested designs in a lab that mimicked Mars's atmospheric conditions. The craft the team ultimately designed can fly on Mars because its blades are longer and rotate faster than those of a helicopter of the same size built for Earth.\n\nAccording to the text, why would a helicopter built for Earth be unable to fly on Mars?", "stem": "", "stemZh": "", "bodyZh": "2014 年，Amelia Quon 與她在 NASA 的團隊著手打造一架能在火星上飛行的直升機。由於火星大氣的密度只有地球的百分之一，火星的空氣無法對標準直升機旋轉的旋翼提供足夠的阻力，讓飛行器維持在空中。五年來，Quon 的團隊在一間模擬火星大氣條件的實驗室中測試各種設計。團隊最終設計出的飛行器能在火星上飛行，因為它的旋翼比同尺寸、為地球打造的直升機更長，轉速也更快。\n根據這段文字，為什麼為地球打造的直升機無法在火星上飛行？", "opts": {"A": "Because Mars and Earth have different atmospheric conditions", "B": "Because the blades of helicopters built for Earth are too large to work on Mars", "C": "Because the gravity of Mars is much weaker than the gravity of Earth", "D": "Because helicopters built for Earth are too small to handle the conditions on Mars"}, "optsZh": {"A": "因為火星與地球的大氣條件不同", "B": "因為為地球打造的直升機旋翼太大，無法在火星上運作", "C": "因為火星的重力比地球的重力弱得多", "D": "因為為地球打造的直升機太小，無法應付火星上的條件"}, "answer": "A", "expl": "Mars's atmosphere is only 1% as dense as Earth's, so the air wouldn't give standard blades enough resistance—different atmospheric conditions.", "explZh": "火星大氣密度只有地球的 1%，無法提供一般旋翼足夠阻力，原因是兩者大氣條件不同。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Information and Ideas: identify a directly stated cause.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一段文字描述一位詩人如何對一位即將離家的年輕親人說話。說話者表示，前方的道路無法由任何其他人代為行走，而面對未知的世界應該要有勇氣，而非恐懼。", "opts": {"A": "To criticize a relative for leaving home", "B": "To describe the speaker's own childhood in detail", "C": "To argue that travel is always dangerous", "D": "To encourage someone to face future experiences independently"}, "optsZh": {"A": "批評一位親人離開家鄉", "B": "詳細描述說話者自己的童年", "C": "主張旅行總是危險的", "D": "鼓勵某人獨立面對未來的經歷"}, "answer": "D", "expl": "The passage encourages the younger person to embrace future experience.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Information and Ideas: identify a directly stated cause.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一篇簡短的說明文指出，社區歷史學家過去以口述方式保存家族紀錄，如今也使用數位檔案，但他們的核心任務仍是保護集體記憶。", "opts": {"A": "The role of community historians has changed in tools but not in its core purpose.", "B": "Digital archives have made oral history unnecessary.", "C": "Community historians mainly work as entertainers.", "D": "Family records are less valuable than public records."}, "optsZh": {"A": "社區歷史學家的角色在工具上有所改變，但其核心目的並未改變。", "B": "數位檔案已使口述歷史變得不再必要。", "C": "社區歷史學家主要以娛樂表演者的身分工作。", "D": "家族紀錄的價值低於公共紀錄。"}, "answer": "A", "expl": "The main idea combines change with continuity.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Information and Ideas: identify a directly stated cause.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇科學文章說明，一種在數十年前就被預測存在的結構，在研究人員將粒子冷卻成有序排列並使用新的成像方法後，終於被觀察到。", "opts": {"A": "Cooling particles prevents ordered structures from forming.", "B": "Researchers obtained direct evidence for a long-theorized structure.", "C": "The prediction was disproved by later experiments.", "D": "The imaging method is unrelated to the discovery."}, "optsZh": {"A": "冷卻粒子會阻止有序結構的形成。", "B": "研究人員取得了一種長久以來僅存在於理論中的結構的直接證據。", "C": "這項預測已被後來的實驗推翻。", "D": "這種成像方法與這項發現無關。"}, "answer": "B", "expl": "The central point is confirmation of a predicted structure.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Information and Ideas: identify a directly stated cause.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文章指出，一架為地球設計的飛行器在模擬的稀薄大氣中無法飛行，因此工程師加長了它的旋翼並提高其轉速。", "opts": {"A": "Engineers avoid changing aircraft designs for other planets.", "B": "Spacecraft designed for Earth are too heavy to test in laboratories.", "C": "Earth-designed aircraft may fail in thinner atmospheres because their blades do not generate enough lift.", "D": "Longer blades make aircraft unable to fly on Earth."}, "optsZh": {"A": "工程師們避免為其他行星修改飛行器設計。", "B": "為地球設計的太空船太重，無法在實驗室中測試。", "C": "為地球設計的飛行器在較稀薄的大氣中可能會失敗，因為它們的旋翼無法產生足夠的升力。", "D": "較長的旋翼使飛行器無法在地球上飛行。"}, "answer": "C", "expl": "The details explain why the Earth design would not work.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Information and Ideas: identify a directly stated cause.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> journey, saying that new regions wait to be claimed.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an independent journey, saying that new regions wait to be claimed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在一段文學節錄中，說話者在孩子展開獨立旅程之前為他祝福，說新的疆域正等待著被擁有。", "opts": {"A": "To express hopeful encouragement as a younger person begins a new life stage", "B": "To warn that the child should avoid unfamiliar places", "C": "To complain that the speaker was abandoned", "D": "To explain how the speaker became famous"}, "optsZh": {"A": "在一位年輕人展開人生新階段時，表達充滿希望的鼓勵", "B": "警告孩子應避開不熟悉的地方", "C": "抱怨說話者遭到拋棄", "D": "說明說話者如何成名"}, "answer": "A", "expl": "The speaker's tone is hopeful and encouraging.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "In West Africa, jalis have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> been keepers of information about family histories and records of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=important\" target=\"_blank\" rel=\"noopener\" data-w=\"important\" data-pos=\"adj.\" data-en=\"having great value, meaning, or effect\" data-zh=\"重要的；重大的\">important<\/a> events. They have often served as teachers and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adviser\" target=\"_blank\" rel=\"noopener\" data-w=\"adviser\" data-pos=\"n.\" data-en=\"a person who gives advice\" data-zh=\"顧問\">advisers<\/a>, too. New <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technologies<\/a> may have changed some aspects of the role today, but jalis continue to be valued for knowing and protecting their peoples&#x27; stories.", "bodyPlain": "In West Africa, jalis have traditionally been keepers of information about family histories and records of important events. They have often served as teachers and advisers, too. New technologies may have changed some aspects of the role today, but jalis continue to be valued for knowing and protecting their peoples' stories.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "在西非，傳統上 jali（說唱詩人）一直是家族歷史與重大事件紀錄的守護者。他們也常擔任教師與顧問。新科技或許改變了這個角色在今日的某些面向，但 jali 仍因熟知並守護其族人的故事而受到重視。", "opts": {"A": "Even though there have been some changes in their role, jalis continue to preserve their communities' histories.", "B": "Although jalis have many roles, many of them like teaching best.", "C": "Jalis have been entertaining the people within their communities for centuries.", "D": "Technology can now do some of the things jalis used to be responsible for."}, "optsZh": {"A": "儘管 jali 的角色已有一些改變，他們仍持續保存其社群的歷史。", "B": "雖然 jali 有許多角色，但他們之中許多人最喜歡教學。", "C": "數百年來，jali 一直在為其社群中的人們提供娛樂。", "D": "科技現在能做到一些過去由 jali 負責的事情。"}, "answer": "A", "expl": "Despite technology changing some aspects of the role, jalis are still valued for preserving their peoples' stories.", "explZh": "儘管科技改變了部分角色，jalis 仍因保存族人的歷史故事而受重視。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一段文字描述一位詩人如何對一位即將離家的年輕親人說話。說話者表示，前方的道路無法由任何其他人代為行走，而面對未知的世界應該要有勇氣，而非恐懼。", "opts": {"A": "To criticize a relative for leaving home", "B": "To describe the speaker's own childhood in detail", "C": "To encourage someone to face future experiences independently", "D": "To argue that travel is always dangerous"}, "optsZh": {"A": "批評一位親人離開家鄉", "B": "詳細描述說話者自己的童年", "C": "鼓勵某人獨立面對未來的經歷", "D": "主張旅行總是危險的"}, "answer": "C", "expl": "The passage encourages the younger person to embrace future experience.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一篇簡短的說明文指出，社區歷史學家過去以口述方式保存家族紀錄，如今也使用數位檔案，但他們的核心任務仍是保護集體記憶。", "opts": {"A": "The role of community historians has changed in tools but not in its core purpose.", "B": "Community historians mainly work as entertainers.", "C": "Family records are less valuable than public records.", "D": "Digital archives have made oral history unnecessary."}, "optsZh": {"A": "社區歷史學家的角色在工具上有所改變，但其核心目的並未改變。", "B": "社區歷史學家主要以娛樂表演者的身分工作。", "C": "家族紀錄的價值低於公共紀錄。", "D": "數位檔案已使口述歷史變得不再必要。"}, "answer": "A", "expl": "The main idea combines change with continuity.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇科學文章說明，一種在數十年前就被預測存在的結構，在研究人員將粒子冷卻成有序排列並使用新的成像方法後，終於被觀察到。", "opts": {"A": "Cooling particles prevents ordered structures from forming.", "B": "The imaging method is unrelated to the discovery.", "C": "The prediction was disproved by later experiments.", "D": "Researchers obtained direct evidence for a long-theorized structure."}, "optsZh": {"A": "冷卻粒子會阻止有序結構的形成。", "B": "這種成像方法與這項發現無關。", "C": "這項預測已被後來的實驗推翻。", "D": "研究人員取得了一種長久以來僅存在於理論中的結構的直接證據。"}, "answer": "D", "expl": "The central point is confirmation of a predicted structure.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文章指出，一架為地球設計的飛行器在模擬的稀薄大氣中無法飛行，因此工程師加長了它的旋翼並提高其轉速。", "opts": {"A": "Spacecraft designed for Earth are too heavy to test in laboratories.", "B": "Earth-designed aircraft may fail in thinner atmospheres because their blades do not generate enough lift.", "C": "Longer blades make aircraft unable to fly on Earth.", "D": "Engineers avoid changing aircraft designs for other planets."}, "optsZh": {"A": "為地球設計的太空船太重，無法在實驗室中測試。", "B": "為地球設計的飛行器在較稀薄的大氣中可能會失敗，因為它們的旋翼無法產生足夠的升力。", "C": "較長的旋翼使飛行器無法在地球上飛行。", "D": "工程師們避免為其他行星修改飛行器設計。"}, "answer": "B", "expl": "The details explain why the Earth design would not work.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Central Ideas: identify the main idea of an informational passage.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> journey, saying that new regions wait to be claimed.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an independent journey, saying that new regions wait to be claimed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在一段文學節錄中，說話者在孩子展開獨立旅程之前為他祝福，說新的疆域正等待著被擁有。", "opts": {"A": "To complain that the speaker was abandoned", "B": "To warn that the child should avoid unfamiliar places", "C": "To express hopeful encouragement as a younger person begins a new life stage", "D": "To explain how the speaker became famous"}, "optsZh": {"A": "抱怨說話者遭到拋棄", "B": "警告孩子應避開不熟悉的地方", "C": "在一位年輕人展開人生新階段時，表達充滿希望的鼓勵", "D": "說明說話者如何成名"}, "answer": "C", "expl": "The speaker's tone is hopeful and encouraging.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Central Ideas: summarize the main idea of a scientific discovery passage.", "vocab": false, "body": "In 1934 physicist Eugene Wigner posited the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=existence\" target=\"_blank\" rel=\"noopener\" data-w=\"existence\" data-pos=\"n.\" data-en=\"the state of being real or present\" data-zh=\"存在\">existence<\/a> of a crystal consisting entirely of electrons in a honeycomb-like <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The so-called Wigner crystal remained largely <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conjecture\" target=\"_blank\" rel=\"noopener\" data-w=\"conjecture\" data-pos=\"n.\" data-en=\"a guess or opinion based on incomplete information\" data-zh=\"推測\">conjecture<\/a>, however, until Feng Wang and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> announced in 2021 that they had captured an image of one. The researchers trapped electrons between two semiconductors and then cooled the apparatus, causing the electrons to settle into a crystalline structure. By inserting an ultrathin sheet of graphene above the crystal, the researchers obtained an impression - the first visual confirmation of the Wigner crystal.", "bodyPlain": "In 1934 physicist Eugene Wigner posited the existence of a crystal consisting entirely of electrons in a honeycomb-like structure. The so-called Wigner crystal remained largely conjecture, however, until Feng Wang and colleagues announced in 2021 that they had captured an image of one. The researchers trapped electrons between two semiconductors and then cooled the apparatus, causing the electrons to settle into a crystalline structure. By inserting an ultrathin sheet of graphene above the crystal, the researchers obtained an impression - the first visual confirmation of the Wigner crystal.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "1934 年，物理學家 Eugene Wigner 假設存在一種完全由電子以蜂巢狀結構組成的晶體。然而，這種所謂的維格納晶體（Wigner crystal）在很大程度上一直停留在推測階段，直到 Feng Wang 與同事在 2021 年宣布他們已拍攝到一個這種晶體的影像。研究人員將電子困在兩片半導體之間，接著冷卻整個裝置，使電子沉降成晶體結構。研究人員在晶體上方插入一片極薄的石墨烯，藉此取得了一個印記——這是維格納晶體首次獲得的視覺證實。", "opts": {"A": "Researchers have obtained the most definitive evidence to date of the existence of the Wigner crystal.", "B": "Researchers have identified an innovative new method for working with unusual crystalline structures.", "C": "Graphene is the most important of the components required to capture an image of a Wigner crystal.", "D":
