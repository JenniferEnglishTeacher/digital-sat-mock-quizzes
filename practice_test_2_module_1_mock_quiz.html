atory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebeds'", "B": "lakebed", "C": "lakebeds", "D": "lakebed's"}, "optsZh": {"A": "lakebeds'（複數所有格 → 數不一致）", "B": "lakebed（單數名詞，缺少所有格）", "C": "lakebeds（複數名詞，非所有格）", "D": "lakebed's（單數所有格：正確）"}, "answer": "D", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Standard English: possessives with singular and plural nouns.", "vocab": false, "body": "In Death Valley National Park&#x27;s Racetrack Playa, a flat, dry lakebed, are 162 rocks - some weighing less than a pound but others almost 700 pounds - that move <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=periodically\" target=\"_blank\" rel=\"noopener\" data-w=\"periodically\" data-pos=\"adv.\" data-en=\"happening again and again at regular times\" data-zh=\"定期地；週期性地\">periodically<\/a> from place to place, seemingly of their own <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volition\" target=\"_blank\" rel=\"noopener\" data-w=\"volition\" data-pos=\"n.\" data-en=\"the act of choosing or deciding by yourself\" data-zh=\"意志；自主意願\">volition<\/a>. Racetrack-like trails in the ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mysterious\" target=\"_blank\" rel=\"noopener\" data-w=\"mysterious\" data-pos=\"adj.\" data-en=\"hard to understand or explain\" data-zh=\"神秘的；難以解釋的\">mysterious<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>.", "bodyPlain": "In Death Valley National Park's Racetrack Playa, a flat, dry lakebed, are 162 rocks - some weighing less than a pound but others almost 700 pounds - that move periodically from place to place, seemingly of their own volition. Racetrack-like trails in the ______ mysterious migration.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在死亡谷國家公園的 Racetrack Playa（一片平坦乾涸的湖床）上，有 162 塊岩石——有些重量不到一磅，有些則將近 700 磅——會不時地從一處移動到另一處，彷彿是自己移動的。類似賽道的痕跡在 ______ 神祕的遷移。", "opts": {"A": "playas sediment mark the rock's", "B": "playa's sediment mark the rocks", "C": "playa's sediment mark the rocks'", "D": "playas' sediment mark the rocks'"}, "optsZh": {"A": "playas sediment mark the rock's（playas 缺少所有格，rock's 數不符 → 錯誤）", "B": "playa's sediment mark the rocks（rocks 缺少所有格 → 錯誤）", "C": "playa's sediment mark the rocks'（單數所有格＋複數所有格：正確）", "D": "playas' sediment mark the rocks'（playas' 為複數所有格 → 數不符：錯誤）"}, "answer": "C", "expl": "The sediment belongs to one playa (playa's), and the migration belongs to the 162 rocks (plural possessive rocks').", "explZh": "沉積物屬於單一乾湖（playa's），遷移屬於 162 顆石頭（複數所有格 rocks'）。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Standard English: possessives with singular and plural nouns.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "to enter", "B": "having entered", "C": "entering", "D": "enter"}, "optsZh": {"A": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "C": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）", "D": "enter（複數現在式，限定動詞：正確）"}, "answer": "D", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Standard English: possessives with singular and plural nouns.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "has digitized", "B": "had digitized", "C": "digitizes", "D": "will digitize"}, "optsZh": {"A": "has digitized（現在完成式 → 與過去時間點不符）", "B": "had digitized（過去完成式：正確）", "C": "digitizes（現在式 → 與過去時間點不符）", "D": "will digitize（未來式 → 與過去時間點不符）"}, "answer": "B", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Standard English: possessives with singular and plural nouns.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "to form", "B": "having formed", "C": "forms", "D": "forming"}, "optsZh": {"A": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）", "C": "forms（第三人稱單數現在式：正確）", "D": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "C", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Standard English: possessives with singular and plural nouns.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "describes", "B": "described", "C": "had described", "D": "will describe"}, "optsZh": {"A": "describes（第三人稱單數現在式：正確）", "B": "described（過去式 → 與現在式敘述不符）", "C": "had described（過去完成式 → 與現在式敘述不符）", "D": "will describe（未來式 → 與現在式敘述不符）"}, "answer": "A", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Standard English: possessives with singular and plural nouns.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebed", "B": "lakebed's", "C": "lakebeds'", "D": "lakebeds"}, "optsZh": {"A": "lakebed（單數名詞，缺少所有格）", "B": "lakebed's（單數所有格：正確）", "C": "lakebeds'（複數所有格 → 數不一致）", "D": "lakebeds（複數名詞，非所有格）"}, "answer": "B", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Standard English: no punctuation between subject and verb.", "vocab": false, "body": "In crafting her fantasy fiction, Nigerian-born British author Helen Oyeyemi has drawn <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspiration\" target=\"_blank\" rel=\"noopener\" data-w=\"inspiration\" data-pos=\"n.\" data-en=\"something that gives you ideas or makes you want to create\" data-zh=\"靈感\">inspiration<\/a> from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classic\" target=\"_blank\" rel=\"noopener\" data-w=\"classic\" data-pos=\"adj.\" data-en=\"well known and of lasting quality\" data-zh=\"經典的\">classic<\/a> nineteenth-century fairy tales of the Brothers Grimm. Her 2014 novel Boy, Snow, Bird, for instance, is a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complex\" target=\"_blank\" rel=\"noopener\" data-w=\"complex\" data-pos=\"adj.\" data-en=\"made of many connected parts; difficult to understand\" data-zh=\"複雜的；錯綜的\">complex<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=retelling\" target=\"_blank\" rel=\"noopener\" data-w=\"retelling\" data-pos=\"n.\" data-en=\"a new version of a story told before\" data-zh=\"重述；改寫\">retelling<\/a> of the story of Snow White, while her 2019 novel ______ offers a delicious twist on the classic tale of Hansel and Gretel.", "bodyPlain": "In crafting her fantasy fiction, Nigerian-born British author Helen Oyeyemi has drawn inspiration from the classic nineteenth-century fairy tales of the Brothers Grimm. Her 2014 novel Boy, Snow, Bird, for instance, is a complex retelling of the story of Snow White, while her 2019 novel ______ offers a delicious twist on the classic tale of Hansel and Gretel.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在創作奇幻小說時，生於奈及利亞的英國作家 Helen Oyeyemi 從格林兄弟十九世紀的經典童話中汲取靈感。例如，她 2014 年的小說《Boy, Snow, Bird》是對白雪公主故事的複雜改寫，而她 2019 年的小說 ______ 則為漢賽爾與葛麗特的經典故事增添了絕妙的轉折。", "opts": {"A": "Gingerbread -", "B": "Gingerbread,", "C": "Gingerbread", "D": "Gingerbread:"}, "optsZh": {"A": "Gingerbread -（破折號 → 不當分隔主詞與動詞）", "B": "Gingerbread,（逗號 → 不當分隔主詞與動詞）", "C": "Gingerbread（無標點：正確，主詞與動詞之間不加標點）", "D": "Gingerbread:（冒號 → 不當分隔主詞與動詞）"}, "answer": "C", "expl": "'Gingerbread' is the essential title of the subject 'her 2019 novel'; no punctuation should separate the subject from its verb 'offers.'", "explZh": "《Gingerbread》是主詞「her 2019 novel」必要的書名，主詞與動詞 offers 之間不可加標點。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Standard English: no punctuation between subject and verb.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "to enter", "B": "having entered", "C": "enter", "D": "entering"}, "optsZh": {"A": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）", "B": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "C": "enter（複數現在式，限定動詞：正確）", "D": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "C", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Standard English: no punctuation between subject and verb.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "digitizes", "B": "will digitize", "C": "has digitized", "D": "had digitized"}, "optsZh": {"A": "digitizes（現在式 → 與過去時間點不符）", "B": "will digitize（未來式 → 與過去時間點不符）", "C": "has digitized（現在完成式 → 與過去時間點不符）", "D": "had digitized（過去完成式：正確）"}, "answer": "D", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Standard English: no punctuation between subject and verb.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "forms", "B": "having formed", "C": "to form", "D": "forming"}, "optsZh": {"A": "forms（第三人稱單數現在式：正確）", "B": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）", "C": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）", "D": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "A", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Standard English: no punctuation between subject and verb.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "describes", "B": "will describe", "C": "had described", "D": "described"}, "optsZh": {"A": "describes（第三人稱單數現在式：正確）", "B": "will describe（未來式 → 與現在式敘述不符）", "C": "had described（過去完成式 → 與現在式敘述不符）", "D": "described（過去式 → 與現在式敘述不符）"}, "answer": "A", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Standard English: no punctuation between subject and verb.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebeds", "B": "lakebed's", "C": "lakebeds'", "D": "lakebed"}, "optsZh": {"A": "lakebeds（複數名詞，非所有格）", "B": "lakebed's（單數所有格：正確）", "C": "lakebeds'（複數所有格 → 數不一致）", "D": "lakebed（單數名詞，缺少所有格）"}, "answer": "B", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Student Notes: explain an advantage using relevant notes.", "vocab": false, "body": "While researching a topic, a student has taken notes about NASA rovers and microprobes. The notes say that NASA uses wheeled rovers to explore Mars, but rovers cannot explore regions inaccessible to wheeled vehicles and are heavy, making them difficult to land. Microprobes, robotic probes weighing as little as 50 milligrams, could be deployed virtually anywhere on Mars and have been proposed as an alternative to rovers.<br><br>The student wants to explain an advantage of microprobes. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken notes about NASA rovers and microprobes. The notes say that NASA uses wheeled rovers to explore Mars, but rovers cannot explore regions inaccessible to wheeled vehicles and are heavy, making them difficult to land. Microprobes, robotic probes weighing as little as 50 milligrams, could be deployed virtually anywhere on Mars and have been proposed as an alternative to rovers.\n\nThe student wants to explain an advantage of microprobes. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "在研究某個主題時，一位學生做了關於 NASA 探測車與微型探測器的筆記。筆記中提到，NASA 使用輪式探測車探索火星，但探測車無法探索輪式載具到不了的區域，而且重量很重，難以著陸。微型探測器是重量可輕至 50 毫克的機器人探測器，幾乎可以部署在火星上的任何地方，已被提議作為探測車的替代方案。\n這位學生想要說明微型探測器的一項優點。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "Despite being heavy, NASA's rovers can land successfully on the surface of Mars.", "B": "Microprobes, which weigh as little as 50 milligrams, could explore areas of Mars that are inaccessible to NASA's heavy, wheeled rovers.", "C": "NASA currently uses its rovers on Mars, but microprobes have been proposed as an alternative.", "D": "Though they are different sizes, both microprobes and rovers can be used to explore the surface of Mars."}, "optsZh": {"A": "儘管 NASA 的探測車很重，它們仍能成功降落在火星表面。", "B": "微型探測器重量可低至 50 毫克，能探索 NASA 笨重的輪式探測車無法抵達的火星區域。", "C": "NASA 目前在火星上使用探測車，但已有人提議以微型探測器作為替代方案。", "D": "雖然微型探測器與探測車的大小不同，兩者都可用來探索火星表面。"}, "answer": "B", "expl": "Choice B states the advantage: light microprobes could explore areas that heavy, wheeled rovers can't reach.", "explZh": "B 選項指出優勢：輕巧的微型探測器能探索笨重輪式探測車無法到達的區域。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Student Notes: explain an advantage using relevant notes.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A lightweight aerial drone can cross ravines; wheeled survey robots cannot cross ravines; the drone weighs less than 100 grams; engineers propose drones for terrain that blocks wheels.<br><br>Goal: explain an advantage of drones.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A lightweight aerial drone can cross ravines; wheeled survey robots cannot cross ravines; the drone weighs less than 100 grams; engineers propose drones for terrain that blocks wheels.\n\nGoal: explain an advantage of drones.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：一架輕型空拍無人機能越過峽谷；輪式勘測機器人無法越過峽谷；這架無人機重量不到 100 公克；工程師提議將無人機用於會阻擋輪子的地形。\n目標：說明無人機的一項優點。", "opts": {"A": "Engineers use several kinds of robots.", "B": "Lightweight drones could survey terrain inaccessible to heavier wheeled robots.", "C": "Drones and robots can both collect data.", "D": "Some robots have wheels."}, "optsZh": {"A": "工程師們使用好幾種機器人。", "B": "輕量的無人機可以勘測較重的輪式機器人無法抵達的地形。", "C": "無人機與機器人都能蒐集資料。", "D": "有些機器人有輪子。"}, "answer": "B", "expl": "It states the advantage directly.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Student Notes: explain an advantage using relevant notes.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A novel was written by a Nobel Prize winner; it is set during colonial rule; critics praise its historical scope; the audience does not know the book.<br><br>Goal: introduce the novel and author.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A novel was written by a Nobel Prize winner; it is set during colonial rule; critics praise its historical scope; the audience does not know the book.\n\nGoal: introduce the novel and author.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：一部小說由一位諾貝爾獎得主所著；故事背景設定在殖民統治時期；評論家讚揚它的歷史視野；讀者並不認識這本書。\n目標：介紹這部小說及其作者。", "opts": {"A": "The novel has a historical setting.", "B": "The author won a Nobel Prize.", "C": "Critics have discussed the book.", "D": "The praised historical novel was written by a Nobel Prize-winning author and explores life under colonial rule."}, "optsZh": {"A": "這部小說有歷史背景。", "B": "這位作者獲得了諾貝爾獎。", "C": "評論家們曾討論過這本書。", "D": "這部備受讚譽的歷史小說出自一位諾貝爾獎得主之手，探討殖民統治下的生活。"}, "answer": "D", "expl": "It introduces both work and author.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Student Notes: explain an advantage using relevant notes.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: City A has fewer residents than City B but contains a larger share of its country&#x27;s population. Goal: emphasize relative population size.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: City A has fewer residents than City B but contains a larger share of its country's population. Goal: emphasize relative population size.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：A 城的居民比 B 城少，但占其國家人口的比例較大。目標：強調相對的人口規模。", "opts": {"A": "The countries have different populations.", "B": "City B has many residents.", "C": "Although City B has more residents, City A represents a larger share of its national population.", "D": "City A and City B are capitals."}, "optsZh": {"A": "這兩個國家的人口不同。", "B": "B 市有很多居民。", "C": "雖然 B 市的居民較多，但 A 市占其全國人口的比例較高。", "D": "A 市與 B 市都是首都。"}, "answer": "C", "expl": "It compares both absolute and relative size.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Student Notes: explain an advantage using relevant notes.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Scholars collected texts from several regions; they <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translate\" target=\"_blank\" rel=\"noopener\" data-w=\"translate\" data-pos=\"v.\" data-en=\"to change words into another language; to interpret\" data-zh=\"翻譯；轉化；解讀\">translated<\/a> them; they copied them onto durable paper; the goal was preservation.<br><br>Goal: explain how knowledge was preserved.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Scholars collected texts from several regions; they translated them; they copied them onto durable paper; the goal was preservation.\n\nGoal: explain how knowledge was preserved.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：學者從多個地區蒐集文本；他們翻譯這些文本；他們將文本抄寫在耐久的紙張上；目的是保存知識。\n目標：說明知識是如何被保存的。", "opts": {"A": "Scholars preserved knowledge by collecting texts, translating them, and copying them onto paper for study and sharing.", "B": "The library was founded long ago.", "C": "Paper technology was important.", "D": "Some texts came from famous writers."}, "optsZh": {"A": "學者們透過蒐集文獻、翻譯文獻，並將其抄寫到紙上以供研究與分享，來保存知識。", "B": "這座圖書館很久以前就創立了。", "C": "造紙技術很重要。", "D": "有些文獻出自知名作家之手。"}, "answer": "A", "expl": "It explains the method.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Student Notes: explain an advantage using relevant notes.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Researchers used statistical patterns to investigate who wrote disputed song passages.<br><br>Goal: generalize about the kind of study.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Researchers used statistical patterns to investigate who wrote disputed song passages.\n\nGoal: generalize about the kind of study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：研究人員運用統計模式來調查有爭議的歌曲段落是由誰所寫。\n目標：對這類研究做出概括性的陳述。", "opts": {"A": "Several songs have shared credit.", "B": "The researchers studied a famous band.", "C": "One songwriter probably wrote one verse.", "D": "Statistical methods can be used to investigate disputed authorship in music."}, "optsZh": {"A": "有好幾首歌是共同掛名的。", "B": "研究人員研究了一個知名樂團。", "C": "一位詞曲作者可能寫了一段主歌。", "D": "統計方法可用來研究音樂中有爭議的作者歸屬問題。"}, "answer": "D", "expl": "It generalizes beyond one example.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Student Notes: introduce a work and its author to an unfamiliar audience.", "vocab": false, "body": "While researching a topic, a student has taken notes about Abdulrazak Gurnah and Paradise. The notes say that Gurnah was awarded the 2021 Nobel Prize in Literature, was born in Zanzibar in East Africa, and currently lives in the United Kingdom. Many readers have singled out Gurnah&#x27;s 1994 book Paradise for praise. Paradise is a historical novel about events that occurred in colonial East Africa.<br><br>The student wants to introduce Paradise to an audience unfamiliar with the novel and its author. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken notes about Abdulrazak Gurnah and Paradise. The notes say that Gurnah was awarded the 2021 Nobel Prize in Literature, was born in Zanzibar in East Africa, and currently lives in the United Kingdom. Many readers have singled out Gurnah's 1994 book Paradise for praise. Paradise is a historical novel about events that occurred in colonial East Africa.\n\nThe student wants to introduce Paradise to an audience unfamiliar with the novel and its author. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "在研究某個主題時，一位學生做了關於 Abdulrazak Gurnah 與《Paradise》的筆記。筆記中提到，Gurnah 獲頒 2021 年諾貝爾文學獎，出生於東非的桑吉巴，目前住在英國。許多讀者特別讚揚 Gurnah 1994 年的作品《Paradise》。《Paradise》是一部關於殖民時期東非所發生事件的歷史小說。\n這位學生想要向不熟悉這部小說及其作者的讀者介紹《Paradise》。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "Abdulrazak Gurnah, who wrote Paradise and later was awarded the Nobel Prize in Literature, was born in Zanzibar in East Africa and currently lives in the United Kingdom.", "B": "Many readers have singled out Abdulrazak Gurnah's 1994 book Paradise, a historical novel about colonial East Africa, for praise.", "C": "A much-praised historical novel about colonial East Africa, Paradise (1994) was written by Abdulrazak Gurnah, winner of the 2021 Nobel Prize in Literature.", "D": "Paradise is a historical novel about events that occurred in colonial East Africa, Abdulrazak Gurnah's homeland."}, "optsZh": {"A": "Abdulrazak Gurnah 是《Paradise》的作者，後來獲頒諾貝爾文學獎；他出生於東非的桑吉巴（Zanzibar），目前居住在英國。", "B": "許多讀者特別讚揚 Abdulrazak Gurnah 於 1994 年出版的《Paradise》，這是一部以殖民時期東非為背景的歷史小說。", "C": "《Paradise》（1994）是一部備受讚譽、以殖民時期東非為背景的歷史小說，作者是 2021 年諾貝爾文學獎得主 Abdulrazak Gurnah。", "D": "《Paradise》是一部歷史小說，講述發生在殖民時期東非——Abdulrazak Gurnah 的故鄉——的事件。"}, "answer": "C", "expl": "Choice C introduces the novel (what it is, when published) and identifies its author's notable credential for an unfamiliar audience.", "explZh": "C 選項向不熟悉的讀者介紹這本小說（類型、出版年份）並點出作者的重要身分（諾貝爾獎得主）。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Student Notes: introduce a work and its author to an unfamiliar audience.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A lightweight aerial drone can cross ravines; wheeled survey robots cannot cross ravines; the drone weighs less than 100 grams; engineers propose drones for terrain that blocks wheels.<br><br>Goal: explain an advantage of drones.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A lightweight aerial drone can cross ravines; wheeled survey robots cannot cross ravines; the drone weighs less than 100 grams; engineers propose drones for terrain that blocks wheels.\n\nGoal: explain an advantage of drones.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：一架輕型空拍無人機能越過峽谷；輪式勘測機器人無法越過峽谷；這架無人機重量不到 100 公克；工程師提議將無人機用於會阻擋輪子的地形。\n目標：說明無人機的一項優點。", "opts": {"A": "Drones and robots can both collect data.", "B": "Lightweight drones could survey terrain inaccessible to heavier wheeled robots.", "C": "Engineers use several kinds of robots.", "D": "Some robots have wheels."}, "optsZh": {"A": "無人機與機器人都能蒐集資料。", "B": "輕量的無人機可以勘測較重的輪式機器人無法抵達的地形。", "C": "工程師們使用好幾種機器人。", "D": "有些機器人有輪子。"}, "answer": "B", "expl": "It states the advantage directly.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Student Notes: introduce a work and its author to an unfamiliar audience.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A novel was written by a Nobel Prize winner; it is set during colonial rule; critics praise its historical scope; the audience does not know the book.<br><br>Goal: introduce the novel and author.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A novel was written by a Nobel Prize winner; it is set during colonial rule; critics praise its historical scope; the audience does not know the book.\n\nGoal: introduce the novel and author.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：一部小說由一位諾貝爾獎得主所著；故事背景設定在殖民統治時期；評論家讚揚它的歷史視野；讀者並不認識這本書。\n目標：介紹這部小說及其作者。", "opts": {"A": "Critics have discussed the book.", "B": "The novel has a historical setting.", "C": "The author won a Nobel Prize.", "D": "The praised historical novel was written by a Nobel Prize-winning author and explores life under colonial rule."}, "optsZh": {"A": "評論家們曾討論過這本書。", "B": "這部小說有歷史背景。", "C": "這位作者獲得了諾貝爾獎。", "D": "這部備受讚譽的歷史小說出自一位諾貝爾獎得主之手，探討殖民統治下的生活。"}, "answer": "D", "expl": "It introduces both work and author.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Student Notes: introduce a work and its author to an unfamiliar audience.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: City A has fewer residents than City B but contains a larger share of its country&#x27;s population. Goal: emphasize relative population size.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: City A has fewer residents than City B but contains a larger share of its country's population. Goal: emphasize relative population size.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：A 城的居民比 B 城少，但占其國家人口的比例較大。目標：強調相對的人口規模。", "opts": {"A": "Although City B has more residents, City A represents a larger share of its national population.", "B": "The countries have different populations.", "C": "City A and City B are capitals.", "D": "City B has many residents."}, "optsZh": {"A": "雖然 B 市的居民較多，但 A 市占其全國人口的比例較高。", "B": "這兩個國家的人口不同。", "C": "A 市與 B 市都是首都。", "D": "B 市有很多居民。"}, "answer": "A", "expl": "It compares both absolute and relative size.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Student Notes: introduce a work and its author to an unfamiliar audience.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Scholars collected texts from several regions; they <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translate\" target=\"_blank\" rel=\"noopener\" data-w=\"translate\" data-pos=\"v.\" data-en=\"to change words into another language; to interpret\" data-zh=\"翻譯；轉化；解讀\">translated<\/a> them; they copied them onto durable paper; the goal was preservation.<br><br>Goal: explain how knowledge was preserved.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Scholars collected texts from several regions; they translated them; they copied them onto durable paper; the goal was preservation.\n\nGoal: explain how knowledge was preserved.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：學者從多個地區蒐集文本；他們翻譯這些文本；他們將文本抄寫在耐久的紙張上；目的是保存知識。\n目標：說明知識是如何被保存的。", "opts": {"A": "Scholars preserved knowledge by collecting texts, translating them, and copying them onto paper for study and sharing.", "B": "Some texts came from famous writers.", "C": "The library was founded long ago.", "D": "Paper technology was important."}, "optsZh": {"A": "學者們透過蒐集文獻、翻譯文獻，並將其抄寫到紙上以供研究與分享，來保存知識。", "B": "有些文獻出自知名作家之手。", "C": "這座圖書館很久以前就創立了。", "D": "造紙技術很重要。"}, "answer": "A", "expl": "It explains the method.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Student Notes: introduce a work and its author to an unfamiliar audience.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Researchers used statistical patterns to investigate who wrote disputed song passages.<br><br>Goal: generalize about the kind of study.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Researchers used statistical patterns to investigate who wrote disputed song passages.\n\nGoal: generalize about the kind of study.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：研究人員運用統計模式來調查有爭議的歌曲段落是由誰所寫。\n目標：對這類研究做出概括性的陳述。", "opts": {"A": "The researchers studied a famous band.", "B": "One songwriter probably wrote one verse.", "C": "Statistical methods can be used to investigate disputed authorship in music.", "D": "Several songs have shared credit."}, "optsZh": {"A": "研究人員研究了一個知名樂團。", "B": "一位詞曲作者可能寫了一段主歌。", "C": "統計方法可用來研究音樂中有爭議的作者歸屬問題。", "D": "有好幾首歌是共同掛名的。"}, "answer": "C", "expl": "It generalizes beyond one example.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: emphasize relative sizes using numerical data.", "vocab": false, "body": "While researching a topic, a student has taken notes about Ulaanbaatar and Hanoi. Ulaanbaatar is the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=capital\" target=\"_blank\" rel=\"noopener\" data-w=\"capital\" data-pos=\"n.\" data-en=\"the city where a country&#x27;s government is\" data-zh=\"首都\">capital<\/a> of Mongolia, has a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> of 907,802, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> 31.98 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\" data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a> of Mongolia&#x27;s population. Hanoi is the capital of Vietnam, has a population of 7,781,631, and contains 8.14 percent of Vietnam&#x27;s population.", "bodyPlain": "While researching a topic, a student has taken notes about Ulaanbaatar and Hanoi. Ulaanbaatar is the capital of Mongolia, has a population of 907,802, and contains 31.98 percent of Mongolia's population. Hanoi is the capital of Vietnam, has a population of 7,781,631, and contains 8.14 percent of Vietnam's population.", "stem": "Which choice most effectively uses information from the given sentences to emphasize the relative sizes of the two capitals' populations?", "stemZh": "哪個選項最能有效運用所給句子中的資訊，來強調這兩個首都人口的相對規模？", "bodyZh": "在研究某個主題時，一位學生做了關於烏蘭巴托與河內的筆記。烏蘭巴托是蒙古的首都，人口為 907,802 人，占蒙古人口的 31.98%。河內是越南的首都，人口為 7,781,631 人，占越南人口的 8.14%。", "opts": {"A": "Mongolia's capital is Ulaanbaatar, which has 907,802 people, and Vietnam's capital is Hanoi, which has 7,781,631 people.", "B": "The populations of the capitals of Mongolia and Vietnam are 907,802 (Ulaanbaatar) and 7,781,631 (Hanoi), respectively.", "C": "Even though Hanoi (population 7,781,631) is larger than Ulaanbaatar (population 907,802), Ulaanbaatar accounts for more of its country's population.", "D": "Comparing Vietnam and Mongolia, 7,781,631 is 8.14 percent of Vietnam's population, and 907,802 is 31.98 percent of Mongolia's."}, "optsZh": {"A": "蒙古的首都是烏蘭巴托（Ulaanbaatar），人口 907,802 人；越南的首都是河內（Hanoi），人口 7,781,631 人。", "B": "蒙古與越南首都的人口分別為 907,802（烏蘭巴托 Ulaanbaatar）與 7,781,631（河內 Hanoi）。", "C": "儘管河內（Hanoi，人口 7,781,631）比烏蘭巴托（Ulaanbaatar，人口 907,802）大，但烏蘭巴托占其國家人口的比例更高。", "D": "比較越南與蒙古，7,781,631 占越南人口的 8.14%，而 907,802 占蒙古人口的 31.98%。"}, "answer": "C", "expl": "Choice C contrasts Hanoi's larger population with Ulaanbaatar's larger share of its country, emphasizing relative size.", "explZh": "C 選項對比河內人口較多、而烏蘭巴托占其國家人口比例較高，強調兩者的相對規模。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: emphasize relative sizes using numerical data.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A lightweight aerial drone can cross ravines; wheeled survey robots cannot cross ravines; the drone weighs less than 100 grams; engineers propose drones for terrain that blocks wheels.<br><br>Goal: explain an advantage of drones.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A lightweight aerial drone can cross ravines; wheeled survey robots cannot cross ravines; the drone weighs less than 100 grams; engineers propose drones for terrain that blocks wheels.\n\nGoal: explain an advantage of drones.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：一架輕型空拍無人機能越過峽谷；輪式勘測機器人無法越過峽谷；這架無人機重量不到 100 公克；工程師提議將無人機用於會阻擋輪子的地形。\n目標：說明無人機的一項優點。", "opts": {"A": "Engineers use several kinds of robots.", "B": "Some robots have wheels.", "C": "Lightweight drones could survey terrain inaccessible to heavier wheeled robots.", "D": "Drones and robots can both collect data."}, "optsZh": {"A": "工程師們使用好幾種機器人。", "B": "有些機器人有輪子。", "C": "輕量的無人機可以勘測較重的輪式機器人無法抵達的地形。", "D": "無人機與機器人都能蒐集資料。"}, "answer": "C", "expl": "It states the advantage directly.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: emphasize relative sizes using numerical data.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance
