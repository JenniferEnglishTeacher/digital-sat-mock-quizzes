 "It's difficult to acquire an image of a Wigner crystal because of the crystal's honeycomb structure."}, "optsZh": {"A": "研究人員取得了迄今為止證明 Wigner 晶體存在最確切的證據。", "B": "研究人員發現了一種處理特殊晶體結構的創新方法。", "C": "石墨烯是拍攝 Wigner 晶體影像所需的各種元件中最重要的一項。", "D": "由於 Wigner 晶體的蜂巢狀結構，要取得其影像十分困難。"}, "answer": "A", "expl": "The text describes how researchers captured the first visual confirmation of the long-hypothesized Wigner crystal.", "explZh": "本文描述研究人員首次取得長期以來只是推測的 Wigner 晶體的影像證據。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Central Ideas: summarize the main idea of a scientific discovery passage.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A passage describes how a poet addresses a younger relative who is about to leave home. The speaker says that the road ahead cannot be walked by anyone else and that the unknown world should be met with courage, not fear.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一段文字描述一位詩人如何對一位即將離家的年輕親人說話。說話者表示，前方的道路無法由任何其他人代為行走，而面對未知的世界應該要有勇氣，而非恐懼。", "opts": {"A": "To encourage someone to face future experiences independently", "B": "To argue that travel is always dangerous", "C": "To describe the speaker's own childhood in detail", "D": "To criticize a relative for leaving home"}, "optsZh": {"A": "鼓勵某人獨立面對未來的經歷", "B": "主張旅行總是危險的", "C": "詳細描述說話者自己的童年", "D": "批評一位親人離開家鄉"}, "answer": "A", "expl": "The passage encourages the younger person to embrace future experience.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Central Ideas: summarize the main idea of a scientific discovery passage.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A short informational text explains that community historians once preserved family records orally and now also use digital archives, but their central task remains protecting collective memory.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一篇簡短的說明文指出，社區歷史學家過去以口述方式保存家族紀錄，如今也使用數位檔案，但他們的核心任務仍是保護集體記憶。", "opts": {"A": "Community historians mainly work as entertainers.", "B": "Family records are less valuable than public records.", "C": "Digital archives have made oral history unnecessary.", "D": "The role of community historians has changed in tools but not in its core purpose."}, "optsZh": {"A": "社區歷史學家主要以娛樂表演者的身分工作。", "B": "家族紀錄的價值低於公共紀錄。", "C": "數位檔案已使口述歷史變得不再必要。", "D": "社區歷史學家的角色在工具上有所改變，但其核心目的並未改變。"}, "answer": "D", "expl": "The main idea combines change with continuity.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Central Ideas: summarize the main idea of a scientific discovery passage.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A science passage explains that a structure predicted decades earlier was finally observed after researchers cooled particles into an ordered arrangement and used a new imaging method.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇科學文章說明，一種在數十年前就被預測存在的結構，在研究人員將粒子冷卻成有序排列並使用新的成像方法後，終於被觀察到。", "opts": {"A": "The prediction was disproved by later experiments.", "B": "Researchers obtained direct evidence for a long-theorized structure.", "C": "Cooling particles prevents ordered structures from forming.", "D": "The imaging method is unrelated to the discovery."}, "optsZh": {"A": "這項預測已被後來的實驗推翻。", "B": "研究人員取得了一種長久以來僅存在於理論中的結構的直接證據。", "C": "冷卻粒子會阻止有序結構的形成。", "D": "這種成像方法與這項發現無關。"}, "answer": "B", "expl": "The central point is confirmation of a predicted structure.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Central Ideas: summarize the main idea of a scientific discovery passage.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a spacecraft designed for Earth failed in a simulated thin atmosphere, so engineers lengthened its blades and increased their rotation speed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文章指出，一架為地球設計的飛行器在模擬的稀薄大氣中無法飛行，因此工程師加長了它的旋翼並提高其轉速。", "opts": {"A": "Longer blades make aircraft unable to fly on Earth.", "B": "Spacecraft designed for Earth are too heavy to test in laboratories.", "C": "Engineers avoid changing aircraft designs for other planets.", "D": "Earth-designed aircraft may fail in thinner atmospheres because their blades do not generate enough lift."}, "optsZh": {"A": "較長的旋翼使飛行器無法在地球上飛行。", "B": "為地球設計的太空船太重，無法在實驗室中測試。", "C": "工程師們避免為其他行星修改飛行器設計。", "D": "為地球設計的飛行器在較稀薄的大氣中可能會失敗，因為它們的旋翼無法產生足夠的升力。"}, "answer": "D", "expl": "The details explain why the Earth design would not work.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Central Ideas: summarize the main idea of a scientific discovery passage.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> journey, saying that new regions wait to be claimed.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In a literary excerpt, a speaker blesses a child before the child begins an independent journey, saying that new regions wait to be claimed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明本文的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在一段文學節錄中，說話者在孩子展開獨立旅程之前為他祝福，說新的疆域正等待著被擁有。", "opts": {"A": "To explain how the speaker became famous", "B": "To warn that the child should avoid unfamiliar places", "C": "To express hopeful encouragement as a younger person begins a new life stage", "D": "To complain that the speaker was abandoned"}, "optsZh": {"A": "說明說話者如何成名", "B": "警告孩子應避開不熟悉的地方", "C": "在一位年輕人展開人生新階段時，表達充滿希望的鼓勵", "D": "抱怨說話者遭到拋棄"}, "answer": "C", "expl": "The speaker's tone is hopeful and encouraging.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Quantitative Evidence: use graph data to support a conclusion.", "vocab": false, "body": "A graph titled &quot;<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=average\" target=\"_blank\" rel=\"noopener\" data-w=\"average\" data-pos=\"adj./n.\" data-en=\"the usual or typical amount; the result of adding numbers and dividing\" data-zh=\"平均的；平均數\">Average<\/a> Number of Individuals Reporting Directly to CEOs&quot; shows <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manager\" target=\"_blank\" rel=\"noopener\" data-w=\"manager\" data-pos=\"n.\" data-en=\"a person who controls a business or team\" data-zh=\"經理；管理者\">managers<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=department\" target=\"_blank\" rel=\"noopener\" data-w=\"department\" data-pos=\"n.\" data-en=\"a section of a large organization\" data-zh=\"部門\">department<\/a> leaders over three periods. The average number of department leaders reporting directly to CEOs rises from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=slightly\" target=\"_blank\" rel=\"noopener\" data-w=\"slightly\" data-pos=\"adv.\" data-en=\"a little\" data-zh=\"稍微；略微\">slightly<\/a> more than 3 in 1991-1995 to 4 in 1996-2001 and to almost 7 in 2001-2008. Considering a large sample of companies, economics experts Maria Guadalupe, Julie Wulf, and Raghuram Rajan assessed the number of managers and leaders from different departments who reported directly to a CEO. According to the researchers, the findings suggest that across the years analyzed, there was a growing interest among CEOs in connecting with more departments in their companies.", "bodyPlain": "A graph titled \"Average Number of Individuals Reporting Directly to CEOs\" shows managers and department leaders over three periods. The average number of department leaders reporting directly to CEOs rises from slightly more than 3 in 1991-1995 to 4 in 1996-2001 and to almost 7 in 2001-2008. Considering a large sample of companies, economics experts Maria Guadalupe, Julie Wulf, and Raghuram Rajan assessed the number of managers and leaders from different departments who reported directly to a CEO. According to the researchers, the findings suggest that across the years analyzed, there was a growing interest among CEOs in connecting with more departments in their companies.", "stem": "Which choice best describes data from the graph that support the researchers' conclusion?", "stemZh": "哪個選項最能描述圖表中支持研究人員結論的資料？", "bodyZh": "一張標題為「直接向執行長報告的平均人數」的圖表，呈現了三個時期中的經理人與部門主管人數。直接向執行長報告的部門主管平均人數，從 1991–1995 年的略多於 3 人，增加到 1996–2001 年的 4 人，再增加到 2001–2008 年的將近 7 人。經濟學專家 Maria Guadalupe、Julie Wulf 與 Raghuram Rajan 考察了大量公司樣本，評估了直接向執行長報告的各部門經理人與主管人數。根據研究人員的說法，研究結果顯示，在所分析的這些年間，執行長們對於與公司內更多部門建立聯繫的興趣日益增加。", "opts": {"A": "The average numbers of managers and department leaders reporting directly to their CEO didn't fluctuate from the 1991-1995 period to the 2001-2008 period.", "B": "The average number of managers reporting directly to their CEO was highest in the 1996-2001 period.", "C": "The average number of department leaders reporting directly to their CEO was greater than the average number of managers reporting directly to their CEO in each of the three periods studied.", "D": "The average number of department leaders reporting directly to their CEO rose over the three periods studied."}, "optsZh": {"A": "從 1991-1995 期間到 2001-2008 期間，直接向執行長回報的經理與部門主管平均人數並沒有波動。", "B": "直接向執行長回報的經理平均人數在 1996-2001 期間最高。", "C": "在研究的三個期間中，每一期直接向執行長回報的部門主管平均人數都多於直接向執行長回報的經理平均人數。", "D": "在研究的三個期間中，直接向執行長回報的部門主管平均人數逐期上升。"}, "answer": "D", "expl": "A growing interest in connecting with more departments is shown by the number of department leaders reporting to CEOs rising across the periods.", "explZh": "直接向執行長報告的部門主管人數在三個時期持續增加，顯示執行長越來越想與更多部門聯繫。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Quantitative Evidence: use graph data to support a conclusion.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A graph shows that the share of households using solar panels rose from 8% to 27% over three survey periods. Researchers claim public interest increased.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A graph shows that the share of households using solar panels rose from 8% to 27% over three survey periods. Researchers claim public interest increased.", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一張圖表顯示，在三次調查期間，使用太陽能板的家戶比例從 8% 上升到 27%。研究人員主張大眾的興趣增加了。", "opts": {"A": "The first period had the fewest households in the survey.", "B": "Some households did not use solar panels.", "C": "The share of households using solar panels rose across the periods studied.", "D": "The graph includes three survey periods."}, "optsZh": {"A": "第一個期間接受調查的家庭數最少。", "B": "有些家庭沒有使用太陽能板。", "C": "在研究的各個期間中，使用太陽能板的家庭比例持續上升。", "D": "這張圖表包含三個調查期間。"}, "answer": "C", "expl": "The rising values support the claim.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Quantitative Evidence: use graph data to support a conclusion.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A table shows that restored wetlands had 42, 55, and 63 nesting pairs over three years, while unrestored wetlands stayed near 20. Which finding best supports the restoration claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A table shows that restored wetlands had 42, 55, and 63 nesting pairs over three years, while unrestored wetlands stayed near 20. Which finding best supports the restoration claim?", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張表格顯示，復育後的濕地在三年間分別有 42、55 與 63 對築巢鳥，而未經復育的濕地則維持在 20 對左右。哪一項發現最能支持關於復育的主張？", "opts": {"A": "Nesting pairs increased in restored wetlands and remained lower in unrestored wetlands.", "B": "Both sites contained water.", "C": "Researchers counted birds once a year.", "D": "The first year had fewer nests than the third."}, "optsZh": {"A": "築巢配對數在已復育的濕地中增加，而在未復育的濕地中則維持較低。", "B": "兩個地點都有水。", "C": "研究人員每年計數鳥類一次。", "D": "第一年的巢數比第三年少。"}, "answer": "A", "expl": "The comparison supports the claim.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Quantitative Evidence: use graph data to support a conclusion.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A study claims that a drug improves memory, but a new finding shows that participants who received the drug also had twice as much sleep as the control group.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A study claims that a drug improves memory, but a new finding shows that participants who received the drug also had twice as much sleep as the control group.", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一項研究主張某種藥物能改善記憶，但一項新發現顯示，服用該藥物的受試者睡眠時間也是對照組的兩倍。", "opts": {"A": "The new finding is unrelated to memory.", "B": "The new finding proves the drug had no effect on anyone.", "C": "The new finding supports the drug claim directly.", "D": "The new finding weakens the claim because sleep could explain the memory difference."}, "optsZh": {"A": "這項新發現與記憶無關。", "B": "這項新發現證明該藥物對任何人都沒有效果。", "C": "這項新發現直接支持了關於該藥物的主張。", "D": "這項新發現削弱了該主張，因為睡眠可能可以解釋記憶上的差異。"}, "answer": "D", "expl": "An uncontrolled variable undermines the hypothesis.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Quantitative Evidence: use graph data to support a conclusion.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A graph shows <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=department\" target=\"_blank\" rel=\"noopener\" data-w=\"department\" data-pos=\"n.\" data-en=\"a section of a large organization\" data-zh=\"部門\">department<\/a> leaders reporting to CEOs increasing from 2 to 6 while unrelated consultant meetings stay flat. Which data best support the conclusion?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A graph shows department leaders reporting to CEOs increasing from 2 to 6 while unrelated consultant meetings stay flat. Which data best support the conclusion?", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一張圖表顯示，向執行長報告的部門主管從 2 人增加到 6 人，而無關的顧問會議次數則持平。哪一項資料最能支持這個結論？", "opts": {"A": "Consultant meetings were measured separately.", "B": "Department-leader reports rose steadily across the period.", "C": "The graph contains more than one category.", "D": "The earliest period had the lowest total."}, "optsZh": {"A": "顧問會議是分開計算的。", "B": "部門主管的直屬回報人數在整個期間持續上升。", "C": "這張圖表包含不只一個類別。", "D": "最早的期間總數最低。"}, "answer": "B", "expl": "The rising department-leader count supports the conclusion.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Quantitative Evidence: use graph data to support a conclusion.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that soil disturbance benefits a plant by increasing genetic diversity. Which finding would undermine the hypothesis?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers hypothesize that soil disturbance benefits a plant by increasing genetic diversity. Which finding would undermine the hypothesis?", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n研究人員假設，土壤擾動會藉由增加遺傳多樣性而對某種植物有益。哪一項發現會削弱這個假設？", "opts": {"A": "More disturbed sites have lower genetic diversity and poorer plant health.", "B": "Soil disturbance is easy to measure.", "C": "Some disturbed sites contain the plant.", "D": "The plant reproduces in more than one way."}, "optsZh": {"A": "受干擾程度越高的地點，遺傳多樣性越低，植物健康狀況也越差。", "B": "土壤干擾很容易測量。", "C": "有些受干擾的地點有這種植物。", "D": "這種植物以不只一種方式繁殖。"}, "answer": "A", "expl": "The opposite pattern weakens the hypothesis.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Command of Evidence: identify a finding that undermines a hypothesis.", "vocab": false, "body": "When digging for clams, their primary food, sea otters damage the roots of eelgrass plants growing on the seafloor. Near Vancouver Island in Canada, the otter <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> is large and well established, yet the eelgrass meadows are healthier than those found elsewhere off Canada&#x27;s coast. To explain this, conservation scientist Erin Foster and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> compared the Vancouver Island meadows to meadows where otters are absent or were reintroduced only recently. Finding that the Vancouver Island meadows have a more diverse gene pool than the others do, Foster <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that damage to eelgrass roots increases the plant&#x27;s rate of sexual reproduction; this, in turn, boosts genetic diversity, which benefits the meadow&#x27;s health overall.<br><br>Which finding, if true, would most directly undermine Foster&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a>?", "bodyPlain": "When digging for clams, their primary food, sea otters damage the roots of eelgrass plants growing on the seafloor. Near Vancouver Island in Canada, the otter population is large and well established, yet the eelgrass meadows are healthier than those found elsewhere off Canada's coast. To explain this, conservation scientist Erin Foster and colleagues compared the Vancouver Island meadows to meadows where otters are absent or were reintroduced only recently. Finding that the Vancouver Island meadows have a more diverse gene pool than the others do, Foster hypothesized that damage to eelgrass roots increases the plant's rate of sexual reproduction; this, in turn, boosts genetic diversity, which benefits the meadow's health overall.\n\nWhich finding, if true, would most directly undermine Foster's hypothesis?", "stem": "", "stemZh": "", "bodyZh": "海獺在挖掘牠們的主要食物蛤蜊時，會損傷生長在海床上的鰻草根部。在加拿大溫哥華島附近，海獺族群數量龐大且早已穩定建立，然而當地的鰻草草場卻比加拿大沿岸其他地方的草場更健康。為了解釋這個現象，保育科學家 Erin Foster 與同事將溫哥華島的草場，與沒有海獺或海獺最近才被重新引入的草場進行比較。Foster 發現溫哥華島草場的基因庫比其他草場更多樣，因此她假設，鰻草根部受損會提高這種植物的有性生殖率；這進而提升遺傳多樣性，對草場的整體健康有益。\n下列哪一項發現若屬實，最能直接削弱 Foster 的假設？", "opts": {"A": "At some sites in the study, eelgrass meadows are found near otter populations that are small and have only recently been reintroduced.", "B": "At several sites not included in the study, there are large, well-established sea otter populations but no eelgrass meadows.", "C": "At several sites not included in the study, eelgrass meadows' health correlates negatively with the length of residence and size of otter populations.", "D": "At some sites in the study, the health of plants unrelated to eelgrass correlates negatively with the length of residence and size of otter populations."}, "optsZh": {"A": "在研究中的某些地點，大葉藻草場位於規模小且最近才被重新引入的海獺族群附近。", "B": "在幾個未納入研究的地點，有大型且穩定的海獺族群，卻沒有大葉藻草場。", "C": "在幾個未納入研究的地點，大葉藻草場的健康狀況與海獺族群棲居的時間長短及族群規模呈負相關。", "D": "在研究中的某些地點，與大葉藻無關的植物的健康狀況與海獺族群棲居的時間長短及族群規模呈負相關。"}, "answer": "C", "expl": "Foster says otter damage improves meadow health; if meadow health declines as otter populations grow larger and longer-established, that undermines her hypothesis.", "explZh": "Foster 認為水獺造成的損害有益草床健康；若草床健康隨水獺族群越大、存在越久而變差，就削弱了她的假說。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Command of Evidence: identify a finding that undermines a hypothesis.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A graph shows that the share of households using solar panels rose from 8% to 27% over three survey periods. Researchers claim public interest increased.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A graph shows that the share of households using solar panels rose from 8% to 27% over three survey periods. Researchers claim public interest increased.", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一張圖表顯示，在三次調查期間，使用太陽能板的家戶比例從 8% 上升到 27%。研究人員主張大眾的興趣增加了。", "opts": {"A": "Some households did not use solar panels.", "B": "The first period had the fewest households in the survey.", "C": "The graph includes three survey periods.", "D": "The share of households using solar panels rose across the periods studied."}, "optsZh": {"A": "有些家庭沒有使用太陽能板。", "B": "第一個期間接受調查的家庭數最少。", "C": "這張圖表包含三個調查期間。", "D": "在研究的各個期間中，使用太陽能板的家庭比例持續上升。"}, "answer": "D", "expl": "The rising values support the claim.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Command of Evidence: identify a finding that undermines a hypothesis.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A table shows that restored wetlands had 42, 55, and 63 nesting pairs over three years, while unrestored wetlands stayed near 20. Which finding best supports the restoration claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A table shows that restored wetlands had 42, 55, and 63 nesting pairs over three years, while unrestored wetlands stayed near 20. Which finding best supports the restoration claim?", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張表格顯示，復育後的濕地在三年間分別有 42、55 與 63 對築巢鳥，而未經復育的濕地則維持在 20 對左右。哪一項發現最能支持關於復育的主張？", "opts": {"A": "Nesting pairs increased in restored wetlands and remained lower in unrestored wetlands.", "B": "Both sites contained water.", "C": "The first year had fewer nests than the third.", "D": "Researchers counted birds once a year."}, "optsZh": {"A": "築巢配對數在已復育的濕地中增加，而在未復育的濕地中則維持較低。", "B": "兩個地點都有水。", "C": "第一年的巢數比第三年少。", "D": "研究人員每年計數鳥類一次。"}, "answer": "A", "expl": "The comparison supports the claim.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Command of Evidence: identify a finding that undermines a hypothesis.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A study claims that a drug improves memory, but a new finding shows that participants who received the drug also had twice as much sleep as the control group.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A study claims that a drug improves memory, but a new finding shows that participants who received the drug also had twice as much sleep as the control group.", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一項研究主張某種藥物能改善記憶，但一項新發現顯示，服用該藥物的受試者睡眠時間也是對照組的兩倍。", "opts": {"A": "The new finding is unrelated to memory.", "B": "The new finding weakens the claim because sleep could explain the memory difference.", "C": "The new finding supports the drug claim directly.", "D": "The new finding proves the drug had no effect on anyone."}, "optsZh": {"A": "這項新發現與記憶無關。", "B": "這項新發現削弱了該主張，因為睡眠可能可以解釋記憶上的差異。", "C": "這項新發現直接支持了關於該藥物的主張。", "D": "這項新發現證明該藥物對任何人都沒有效果。"}, "answer": "B", "expl": "An uncontrolled variable undermines the hypothesis.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Command of Evidence: identify a finding that undermines a hypothesis.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A graph shows <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=department\" target=\"_blank\" rel=\"noopener\" data-w=\"department\" data-pos=\"n.\" data-en=\"a section of a large organization\" data-zh=\"部門\">department<\/a> leaders reporting to CEOs increasing from 2 to 6 while unrelated consultant meetings stay flat. Which data best support the conclusion?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A graph shows department leaders reporting to CEOs increasing from 2 to 6 while unrelated consultant meetings stay flat. Which data best support the conclusion?", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一張圖表顯示，向執行長報告的部門主管從 2 人增加到 6 人，而無關的顧問會議次數則持平。哪一項資料最能支持這個結論？", "opts": {"A": "The graph contains more than one category.", "B": "Consultant meetings were measured separately.", "C": "Department-leader reports rose steadily across the period.", "D": "The earliest period had the lowest total."}, "optsZh": {"A": "這張圖表包含不只一個類別。", "B": "顧問會議是分開計算的。", "C": "部門主管的直屬回報人數在整個期間持續上升。", "D": "最早的期間總數最低。"}, "answer": "C", "expl": "The rising department-leader count supports the conclusion.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Command of Evidence: identify a finding that undermines a hypothesis.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that soil disturbance benefits a plant by increasing genetic diversity. Which finding would undermine the hypothesis?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers hypothesize that soil disturbance benefits a plant by increasing genetic diversity. Which finding would undermine the hypothesis?", "stem": "Which choice most effectively uses evidence to support or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持或削弱該主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n研究人員假設，土壤擾動會藉由增加遺傳多樣性而對某種植物有益。哪一項發現會削弱這個假設？", "opts": {"A": "Some disturbed sites contain the plant.", "B": "Soil disturbance is easy to measure.", "C": "More disturbed sites have lower genetic diversity and poorer plant health.", "D": "The plant reproduces in more than one way."}, "optsZh": {"A": "有些受干擾的地點有這種植物。", "B": "土壤干擾很容易測量。", "C": "受干擾程度越高的地點，遺傳多樣性越低，植物健康狀況也越差。", "D": "這種植物以不只一種方式繁殖。"}, "answer": "C", "expl": "The opposite pattern weakens the hypothesis.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Inferences: complete a text with a supported conclusion.", "vocab": false, "body": "Scholars have noted that F. Scott Fitzgerald&#x27;s writings were likely influenced in part by his marriage to Zelda Fitzgerald, but many don&#x27;t <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognize<\/a> Zelda as a writer in her own right. Indeed, Zelda authored several works herself, such as the novel Save Me the Waltz and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=numerous\" target=\"_blank\" rel=\"noopener\" data-w=\"numerous\" data-pos=\"adj.\" data-en=\"many\" data-zh=\"眾多的\">numerous<\/a> short stories. Thus, those who primarily view Zelda as an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspiration\" target=\"_blank\" rel=\"noopener\" data-w=\"inspiration\" data-pos=\"n.\" data-en=\"something that gives you ideas or makes you want to create\" data-zh=\"靈感\">inspiration<\/a> for F. Scott&#x27;s writings ______", "bodyPlain": "Scholars have noted that F. Scott Fitzgerald's writings were likely influenced in part by his marriage to Zelda Fitzgerald, but many don't recognize Zelda as a writer in her own right. Indeed, Zelda authored several works herself, such as the novel Save Me the Waltz and numerous short stories. Thus, those who primarily view Zelda as an inspiration for F. Scott's writings ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "學者們已指出，F.Scott Fitzgerald 的作品可能在某種程度上受到他與 Zelda Fitzgerald 婚姻的影響，但許多人並不承認 Zelda 本身也是一位作家。事實上，Zelda 自己也創作了好幾部作品，例如小說《Save Me the Waltz》以及許多短篇小說。因此，那些主要將 Zelda 視為 F.Scott 寫作靈感來源的人 ______", "opts": {"A": "overlook the many other factors that motivated F. Scott to write.", "B": "risk misrepresenting the full range of Zelda's contributions to literature.", "C": "may draw inaccurate conclusions about how F. Scott and Zelda viewed each other's works.", "D": "tend to read the works of F. Scott and Zelda in an overly autobiographical light."}, "optsZh": {"A": "忽略了促使 F. Scott 寫作的許多其他因素。", "B": "可能有錯誤呈現 Zelda 對文學貢獻全貌的風險。", "C": "可能會對 F. Scott 與 Zelda 如何看待彼此的作品得出不準確的結論。", "D": "往往以過度自傳式的角度來解讀 F. Scott 與 Zelda 的作品。"}, "answer": "B", "expl": "The text stresses that Zelda was a writer in her own right, so seeing her only as F. Scott's inspiration misrepresents her contributions.", "explZh": "本文強調 Zelda 本身就是作家，只把她視為 F. Scott 的靈感來源會誤解她對文學的貢獻。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Inferences: complete a text with a supported conclusion.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students&#x27; reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students' reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一項研究以謎題來衡量學生的推理能力，但這些謎題所需要的手眼協調程度也差異極大。因此，研究結果 ______", "opts": {"A": "show that coordination is unrelated to test design.", "B": "prove that all students reason equally well.", "C": "could mistake differences in motor skill for differences in reasoning.", "D": "should be applied to every academic subject."}, "optsZh": {"A": "顯示協調能力與測驗設計無關。", "B": "證明所有學生的推理能力都一樣好。", "C": "可能會把動作技能上的差異誤認為推理能力上的差異。", "D": "應該被應用到每一個學科。"}, "answer": "C", "expl": "The uncontrolled physical demand limits the conclusion.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Inferences: complete a text with a supported conclusion.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n研究人員在一種獨居物種身上發現了對類似臉孔圖案的偏好。這顯示 ______", "opts": {"A": "only social species can recognize patterns.", "B": "the solitary species learned the preference from parents.", "C": "adult animals always prefer faces more than young animals.", "D": "the preference may not depend only on social bonding or parental care."}, "optsZh": {"A": "只有群居物種能辨識圖案。", "B": "獨居物種是從父母那裡學到這種偏好的。", "C": "成年動物總是比幼年動物更偏好臉孔。", "D": "這種偏好可能不僅僅取決於社會連結或親代照顧。"}, "answer": "D", "expl": "The finding broadens the possible explanation.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Inferences: complete a text with a supported conclusion.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一部詩集主要保存了入侵之前的詩作，但有些詩提到了入侵之後才引進的習俗。因此，學者推論 ______", "opts": {"A": "the scribes knew nothing about the later culture.", "B": "the collection likely includes both earlier material and later additions.", "C": "the references must be coincidental.", "D": "the collection could not contain any earlier material."}, "optsZh": {"A": "抄寫員對後來的文化一無所知。", "B": "這部文集很可能同時包含較早的材料與後來增補的內容。", "C": "這些提及之處必定是巧合。", "D": "這部文集不可能包含任何較早的材料。"}, "answer": "B", "expl": "The evidence points to mixed origins.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Inferences: complete a text with a supported conclusion.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A writer is remembered only as another author&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspiration\" target=\"_blank\" rel=\"noopener\" data-w=\"inspiration\" data-pos=\"n.\" data-en=\"something that gives you ideas or makes you want to create\" data-zh=\"靈感\">inspiration<\/a>, even though she published several works herself. That view ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A writer is remembered only as another author's inspiration, even though she published several works herself. That view ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位作家只被記得是另一位作家的靈感來源，儘管她自己也出版了好幾部作品。這種看法 ______", "opts": {"A": "risks understating her own literary contributions.", "B": "shows that biography is never useful.", "C": "proves the other author wrote less than scholars think.", "D": "means the two authors disliked each other."}, "optsZh": {"A": "可能有低估她本身文學貢獻的風險。", "B": "顯示傳記永遠沒有用處。", "C": "證明另一位作者寫的比學者所認為的少。", "D": "意味著這兩位作者彼此不喜歡。"}, "answer": "A", "expl": "Ignoring her works misrepresents her role.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Inferences: complete a text with a supported conclusion.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一個理論忽略了與其核心主張直接相關的新發現證據。因此，這個理論 ______", "opts": {"A": "is unrelated to future discoveries.", "B": "remains insufficiently supported until it addresses that evidence.", "C": "can be accepted without revision.", "D": "becomes stronger because it is simpler."}, "optsZh": {"A": "與未來的發現無關。", "B": "在處理該證據之前，仍缺乏充分的支持。", "C": "可以不經修正就被接受。", "D": "會因為較簡單而變得更有說服力。"}, "answer": "B", "expl": "Ignoring relevant evidence weakens support.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "Among social animals that care for their young, such as chickens, macaque monkeys, and humans, newborns appear to show an innate attraction to faces and face-like <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stimuli\" target=\"_blank\" rel=\"noopener\" data-w=\"stimuli\" data-pos=\"n.\" data-en=\"plural of stimulus; things that cause reactions\" data-zh=\"刺激物（複數）\">stimuli<\/a>. Elisabetta Versace and her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> used an image of three black dots arranged in the shape of eyes and a nose or mouth to test whether this trait also occurs in Testudo tortoises, which live alone and do not engage in parental care. They found that tortoise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hatchling\" target=\"_blank\" rel=\"noopener\" data-w=\"hatchling\" data-pos=\"n.\" data-en=\"a young animal that has just come out of its egg\" data-zh=\"剛孵化的幼體\">hatchlings<\/a> showed a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> preference for the image, suggesting that ______", "bodyPlain": "Among social animals that care for their young, such as chickens, macaque monkeys, and humans, newborns appear to show an innate attraction to faces and face-like stimuli. Elisabetta Versace and her colleagues used an image of three black dots arranged in the shape of eyes and a nose or mouth to test whether this trait also occurs in Testudo tortoises, which live alone and do not engage in parental care. They found that tortoise hatchlings showed a significant preference for the image, suggesting that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在會照顧幼崽的群居動物中，例如雞、獼猴和人類，新生兒似乎對臉孔與類似臉孔的刺激表現出與生俱來的吸引力。Elisabetta Versace 與同事使用一張由三個黑點排列成眼睛與鼻子或嘴巴形狀的圖像，來測試這種特徵是否也出現在 Testudo 屬陸龜身上；這種陸龜獨居生活，且不會照顧後代。他們發現剛孵化的陸龜對這張圖像表現出顯著的偏好，這顯示 ______", "opts": {"A": "face-like stimuli are likely perceived as harmless by newborns of social species that practice parental care but as threatening by newborns of solitary species without parental care.", "B": "researchers should not assume that an innate attraction to face-like stimuli is necessarily an adaptation related to social interaction or parental care.", "C": "researchers can assume that the attraction to face-like stimuli that is seen in social species that practice parental care is learned rather than innate.", "D": "newly hatched Testudo tortoises show a stronger preference for face-like stimuli than adult Testudo tortoises do."}, "optsZh": {"A": "類似臉孔的刺激很可能被有親代照顧的群居物種新生兒視為無害，卻被沒有親代照顧的獨居物種新生兒視為威脅。", "B": "研究人員不應假定，對類似臉孔刺激的先天吸引必然是一種與社會互動或親代照顧相關的適應。", "C": "研究人員可以假定，在有親代照顧的群居物種身上所見到對類似臉孔刺激的吸引，是後天習得而非與生俱來的。", "D": "剛孵化的 Testudo 陸龜比成年的 Testudo 陸龜更強烈地偏好類似臉孔的刺激。"}, "answer": "B", "expl": "Solitary tortoises without parental care also prefer faces, so the attraction isn't necessarily an adaptation for social life or parenting.", "explZh": "獨居且不育幼的陸龜也偏好臉孔圖像，因此這種天生吸引力未必是為社交或育幼而產生的適應。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students&#x27; reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students' reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一項研究以謎題來衡量學生的推理能力，但這些謎題所需要的手眼協調程度也差異極大。因此，研究結果 ______", "opts": {"A": "show that coordination is unrelated to test design.", "B": "prove that all students reason equally well.", "C": "should be applied to every academic subject.", "D": "could mistake differences in motor skill for differences in reasoning."}, "optsZh": {"A": "顯示協調能力與測驗設計無關。", "B": "證明所有學生的推理能力都一樣好。", "C": "應該被應用到每一個學科。", "D": "可能會把動作技能上的差異誤認為推理能力上的差異。"}, "answer": "D", "expl": "The uncontrolled physical demand limits the conclusion.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragm
