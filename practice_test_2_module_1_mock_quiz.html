entary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n研究人員在一種獨居物種身上發現了對類似臉孔圖案的偏好。這顯示 ______", "opts": {"A": "the preference may not depend only on social bonding or parental care.", "B": "adult animals always prefer faces more than young animals.", "C": "the solitary species learned the preference from parents.", "D": "only social species can recognize patterns."}, "optsZh": {"A": "這種偏好可能不僅僅取決於社會連結或親代照顧。", "B": "成年動物總是比幼年動物更偏好臉孔。", "C": "獨居物種是從父母那裡學到這種偏好的。", "D": "只有群居物種能辨識圖案。"}, "answer": "A", "expl": "The finding broadens the possible explanation.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一部詩集主要保存了入侵之前的詩作，但有些詩提到了入侵之後才引進的習俗。因此，學者推論 ______", "opts": {"A": "the scribes knew nothing about the later culture.", "B": "the collection likely includes both earlier material and later additions.", "C": "the collection could not contain any earlier material.", "D": "the references must be coincidental."}, "optsZh": {"A": "抄寫員對後來的文化一無所知。", "B": "這部文集很可能同時包含較早的材料與後來增補的內容。", "C": "這部文集不可能包含任何較早的材料。", "D": "這些提及之處必定是巧合。"}, "answer": "B", "expl": "The evidence points to mixed origins.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A writer is remembered only as another author&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspiration\" target=\"_blank\" rel=\"noopener\" data-w=\"inspiration\" data-pos=\"n.\" data-en=\"something that gives you ideas or makes you want to create\" data-zh=\"靈感\">inspiration<\/a>, even though she published several works herself. That view ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A writer is remembered only as another author's inspiration, even though she published several works herself. That view ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位作家只被記得是另一位作家的靈感來源，儘管她自己也出版了好幾部作品。這種看法 ______", "opts": {"A": "proves the other author wrote less than scholars think.", "B": "shows that biography is never useful.", "C": "risks understating her own literary contributions.", "D": "means the two authors disliked each other."}, "optsZh": {"A": "證明另一位作者寫的比學者所認為的少。", "B": "顯示傳記永遠沒有用處。", "C": "可能有低估她本身文學貢獻的風險。", "D": "意味著這兩位作者彼此不喜歡。"}, "answer": "C", "expl": "Ignoring her works misrepresents her role.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Inferences: draw a conclusion from experimental evidence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一個理論忽略了與其核心主張直接相關的新發現證據。因此，這個理論 ______", "opts": {"A": "can be accepted without revision.", "B": "is unrelated to future discoveries.", "C": "becomes stronger because it is simpler.", "D": "remains insufficiently supported until it addresses that evidence."}, "optsZh": {"A": "可以不經修正就被接受。", "B": "與未來的發現無關。", "C": "會因為較簡單而變得更有說服力。", "D": "在處理該證據之前，仍缺乏充分的支持。"}, "answer": "D", "expl": "Ignoring relevant evidence weakens support.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Inferences: reconcile apparently conflicting evidence.", "vocab": false, "body": "Compiled in the late 1500s largely through the efforts of Indigenous scribes, Cantares Mexicanos is the most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=important\" target=\"_blank\" rel=\"noopener\" data-w=\"important\" data-pos=\"adj.\" data-en=\"having great value, meaning, or effect\" data-zh=\"重要的；重大的\">important<\/a> collection of poetry in Classical Nahuatl, the principal language of the Aztec Empire. The poems <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portray\" target=\"_blank\" rel=\"noopener\" data-w=\"portray\" data-pos=\"v.\" data-en=\"to represent or describe someone or something in a particular way\" data-zh=\"描繪；呈現\">portray<\/a> Aztec society before the occupation of the empire by the army of Spain, and marginal notes in Cantares Mexicanos indicate that much of the collection&#x27;s content predates the initial invasion. Nonetheless, some of the poems <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contain<\/a> inarguable references to beliefs and customs common in Spain during this era. Thus, some scholars have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that ______", "bodyPlain": "Compiled in the late 1500s largely through the efforts of Indigenous scribes, Cantares Mexicanos is the most important collection of poetry in Classical Nahuatl, the principal language of the Aztec Empire. The poems portray Aztec society before the occupation of the empire by the army of Spain, and marginal notes in Cantares Mexicanos indicate that much of the collection's content predates the initial invasion. Nonetheless, some of the poems contain inarguable references to beliefs and customs common in Spain during this era. Thus, some scholars have concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "《Cantares Mexicanos》編纂於 1500 年代晚期，主要仰賴原住民抄寫員的努力，是古典納瓦特爾語（阿茲特克帝國的主要語言）最重要的詩歌集。這些詩描繪了西班牙軍隊占領帝國之前的阿茲特克社會，而《Cantares Mexicanos》中的旁註顯示，這部詩集的大部分內容早於最初的入侵。儘管如此，有些詩作中確實無可否認地提到了當時西班牙常見的信仰與習俗。因此，有些學者得出結論：______", "opts": {"A": "while its content largely predates the invasion, Cantares Mexicanos also contains additions made after the invasion.", "B": "although those who compiled Cantares Mexicanos were fluent in Nahuatl, they had limited knowledge of the Spanish language.", "C": "before the invasion by Spain, the poets of the Aztec Empire borrowed from the literary traditions of other societies.", "D": "the references to beliefs and customs in Spain should be attributed to a coincidental resemblance between the societies of Spain and the Aztec Empire."}, "optsZh": {"A": "雖然《Cantares Mexicanos》的內容大多早於西班牙入侵，但其中也包含入侵之後增補的內容。", "B": "雖然編纂《Cantares Mexicanos》的人精通納瓦特爾語（Nahuatl），但他們對西班牙語的了解有限。", "C": "在西班牙入侵之前，阿茲特克帝國的詩人就借用了其他社會的文學傳統。", "D": "書中提及西班牙信仰與習俗之處，應歸因於西班牙與阿茲特克帝國社會之間的巧合相似。"}, "answer": "A", "expl": "Most content predates the invasion, yet some poems reference Spanish customs, so some material was added after the invasion.", "explZh": "大部分內容早於入侵，但部分詩作提到西班牙習俗，可見有些內容是入侵後才加入的。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Inferences: reconcile apparently conflicting evidence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students&#x27; reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students' reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一項研究以謎題來衡量學生的推理能力，但這些謎題所需要的手眼協調程度也差異極大。因此，研究結果 ______", "opts": {"A": "show that coordination is unrelated to test design.", "B": "should be applied to every academic subject.", "C": "could mistake differences in motor skill for differences in reasoning.", "D": "prove that all students reason equally well."}, "optsZh": {"A": "顯示協調能力與測驗設計無關。", "B": "應該被應用到每一個學科。", "C": "可能會把動作技能上的差異誤認為推理能力上的差異。", "D": "證明所有學生的推理能力都一樣好。"}, "answer": "C", "expl": "The uncontrolled physical demand limits the conclusion.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Inferences: reconcile apparently conflicting evidence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n研究人員在一種獨居物種身上發現了對類似臉孔圖案的偏好。這顯示 ______", "opts": {"A": "the preference may not depend only on social bonding or parental care.", "B": "adult animals always prefer faces more than young animals.", "C": "the solitary species learned the preference from parents.", "D": "only social species can recognize patterns."}, "optsZh": {"A": "這種偏好可能不僅僅取決於社會連結或親代照顧。", "B": "成年動物總是比幼年動物更偏好臉孔。", "C": "獨居物種是從父母那裡學到這種偏好的。", "D": "只有群居物種能辨識圖案。"}, "answer": "A", "expl": "The finding broadens the possible explanation.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Inferences: reconcile apparently conflicting evidence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一部詩集主要保存了入侵之前的詩作，但有些詩提到了入侵之後才引進的習俗。因此，學者推論 ______", "opts": {"A": "the scribes knew nothing about the later culture.", "B": "the collection could not contain any earlier material.", "C": "the references must be coincidental.", "D": "the collection likely includes both earlier material and later additions."}, "optsZh": {"A": "抄寫員對後來的文化一無所知。", "B": "這部文集不可能包含任何較早的材料。", "C": "這些提及之處必定是巧合。", "D": "這部文集很可能同時包含較早的材料與後來增補的內容。"}, "answer": "D", "expl": "The evidence points to mixed origins.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Inferences: reconcile apparently conflicting evidence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A writer is remembered only as another author&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspiration\" target=\"_blank\" rel=\"noopener\" data-w=\"inspiration\" data-pos=\"n.\" data-en=\"something that gives you ideas or makes you want to create\" data-zh=\"靈感\">inspiration<\/a>, even though she published several works herself. That view ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A writer is remembered only as another author's inspiration, even though she published several works herself. That view ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位作家只被記得是另一位作家的靈感來源，儘管她自己也出版了好幾部作品。這種看法 ______", "opts": {"A": "proves the other author wrote less than scholars think.", "B": "shows that biography is never useful.", "C": "risks understating her own literary contributions.", "D": "means the two authors disliked each other."}, "optsZh": {"A": "證明另一位作者寫的比學者所認為的少。", "B": "顯示傳記永遠沒有用處。", "C": "可能有低估她本身文學貢獻的風險。", "D": "意味著這兩位作者彼此不喜歡。"}, "answer": "C", "expl": "Ignoring her works misrepresents her role.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Inferences: reconcile apparently conflicting evidence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一個理論忽略了與其核心主張直接相關的新發現證據。因此，這個理論 ______", "opts": {"A": "becomes stronger because it is simpler.", "B": "remains insufficiently supported until it addresses that evidence.", "C": "can be accepted without revision.", "D": "is unrelated to future discoveries."}, "optsZh": {"A": "會因為較簡單而變得更有說服力。", "B": "在處理該證據之前，仍缺乏充分的支持。", "C": "可以不經修正就被接受。", "D": "與未來的發現無關。"}, "answer": "B", "expl": "Ignoring relevant evidence weakens support.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Inferences: identify a limitation caused by flawed methodology.", "vocab": false, "body": "In a study of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cognitive\" target=\"_blank\" rel=\"noopener\" data-w=\"cognitive\" data-pos=\"adj.\" data-en=\"related to thinking, learning, and understanding\" data-zh=\"認知的\">cognitive<\/a> abilities of white-faced capuchin monkeys (Cebus imitator), researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neglect\" target=\"_blank\" rel=\"noopener\" data-w=\"neglect\" data-pos=\"v.\" data-en=\"to fail to do or pay attention to something\" data-zh=\"忽略；疏忽\">neglected<\/a> to control for the physical difficulty of the tasks they used to evaluate the monkeys. The cognitive abilities of monkeys given problems <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=require\" target=\"_blank\" rel=\"noopener\" data-w=\"require\" data-pos=\"v.\" data-en=\"to need something or make it necessary\" data-zh=\"需要；要求\">requiring<\/a> little <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dexterity\" target=\"_blank\" rel=\"noopener\" data-w=\"dexterity\" data-pos=\"n.\" data-en=\"skill in using the hands\" data-zh=\"靈巧；手巧\">dexterity<\/a>, such as sliding a panel to retrieve food, were judged by the same criteria as were those of monkeys given physically demanding problems, such as unscrewing a bottle and inserting a straw. The results of the study, therefore, ______", "bodyPlain": "In a study of the cognitive abilities of white-faced capuchin monkeys (Cebus imitator), researchers neglected to control for the physical difficulty of the tasks they used to evaluate the monkeys. The cognitive abilities of monkeys given problems requiring little dexterity, such as sliding a panel to retrieve food, were judged by the same criteria as were those of monkeys given physically demanding problems, such as unscrewing a bottle and inserting a straw. The results of the study, therefore, ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項關於白臉卷尾猴（Cebus imitator）認知能力的研究中，研究人員忽略了控制他們用來評估猴子的任務在身體操作上的難度。被給予幾乎不需要靈巧度之問題（例如滑動面板以取得食物）的猴子，其認知能力與被給予需要大量體力操作之問題（例如轉開瓶蓋並插入吸管）的猴子，是以相同的標準來評判的。因此，這項研究的結果 ______", "opts": {"A": "could suggest that there are differences in cognitive ability among the monkeys even though such differences may not actually exist.", "B": "are useful for identifying tasks that the monkeys lack the cognitive capacity to perform but not for identifying tasks that the monkeys can perform.", "C": "should not be taken as indicative of the cognitive abilities of any monkey species other than C. imitator.", "D": "reveal more about the monkeys' cognitive abilities when solving artificial problems than when solving problems encountered in the wild."}, "optsZh": {"A": "可能會顯示猴子之間存在認知能力上的差異，即使這種差異實際上可能並不存在。", "B": "有助於找出猴子缺乏認知能力去完成的任務，卻無助於找出猴子能夠完成的任務。", "C": "不應被視為能代表 C. imitator 以外任何猴類物種的認知能力。", "D": "較能揭示猴子解決人為設計問題時的認知能力，而較難揭示牠們解決野外所遇問題時的認知能力。"}, "answer": "A", "expl": "Judging easy and physically hard tasks by the same criteria could make some monkeys look less capable when they only faced harder physical tasks.", "explZh": "以相同標準評估簡單與高難度的任務，可能讓某些猴子看起來認知能力較差，但其實只是任務較困難。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Inferences: identify a limitation caused by flawed methodology.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students&#x27; reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A study measured students' reasoning with puzzles that also required very different levels of hand-eye coordination. Therefore, the results ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一項研究以謎題來衡量學生的推理能力，但這些謎題所需要的手眼協調程度也差異極大。因此，研究結果 ______", "opts": {"A": "show that coordination is unrelated to test design.", "B": "prove that all students reason equally well.", "C": "should be applied to every academic subject.", "D": "could mistake differences in motor skill for differences in reasoning."}, "optsZh": {"A": "顯示協調能力與測驗設計無關。", "B": "證明所有學生的推理能力都一樣好。", "C": "應該被應用到每一個學科。", "D": "可能會把動作技能上的差異誤認為推理能力上的差異。"}, "answer": "D", "expl": "The uncontrolled physical demand limits the conclusion.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Inferences: identify a limitation caused by flawed methodology.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Researchers found face-like pattern preference in a solitary species. This suggests that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n研究人員在一種獨居物種身上發現了對類似臉孔圖案的偏好。這顯示 ______", "opts": {"A": "adult animals always prefer faces more than young animals.", "B": "only social species can recognize patterns.", "C": "the preference may not depend only on social bonding or parental care.", "D": "the solitary species learned the preference from parents."}, "optsZh": {"A": "成年動物總是比幼年動物更偏好臉孔。", "B": "只有群居物種能辨識圖案。", "C": "這種偏好可能不僅僅取決於社會連結或親代照顧。", "D": "獨居物種是從父母那裡學到這種偏好的。"}, "answer": "C", "expl": "The finding broadens the possible explanation.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Inferences: identify a limitation caused by flawed methodology.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A collection mostly preserves poems from before an invasion, but some poems mention practices introduced afterward. Therefore, scholars infer that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一部詩集主要保存了入侵之前的詩作，但有些詩提到了入侵之後才引進的習俗。因此，學者推論 ______", "opts": {"A": "the collection could not contain any earlier material.", "B": "the collection likely includes both earlier material and later additions.", "C": "the scribes knew nothing about the later culture.", "D": "the references must be coincidental."}, "optsZh": {"A": "這部文集不可能包含任何較早的材料。", "B": "這部文集很可能同時包含較早的材料與後來增補的內容。", "C": "抄寫員對後來的文化一無所知。", "D": "這些提及之處必定是巧合。"}, "answer": "B", "expl": "The evidence points to mixed origins.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Inferences: identify a limitation caused by flawed methodology.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A writer is remembered only as another author&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspiration\" target=\"_blank\" rel=\"noopener\" data-w=\"inspiration\" data-pos=\"n.\" data-en=\"something that gives you ideas or makes you want to create\" data-zh=\"靈感\">inspiration<\/a>, even though she published several works herself. That view ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A writer is remembered only as another author's inspiration, even though she published several works herself. That view ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位作家只被記得是另一位作家的靈感來源，儘管她自己也出版了好幾部作品。這種看法 ______", "opts": {"A": "means the two authors disliked each other.", "B": "proves the other author wrote less than scholars think.", "C": "risks understating her own literary contributions.", "D": "shows that biography is never useful."}, "optsZh": {"A": "意味著這兩位作者彼此不喜歡。", "B": "證明另一位作者寫的比學者所認為的少。", "C": "可能有低估她本身文學貢獻的風險。", "D": "顯示傳記永遠沒有用處。"}, "answer": "C", "expl": "Ignoring her works misrepresents her role.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Inferences: identify a limitation caused by flawed methodology.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A theory ignores newly discovered evidence that directly bears on its central claim. As a result, the theory ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一個理論忽略了與其核心主張直接相關的新發現證據。因此，這個理論 ______", "opts": {"A": "remains insufficiently supported until it addresses that evidence.", "B": "becomes stronger because it is simpler.", "C": "is unrelated to future discoveries.", "D": "can be accepted without revision."}, "optsZh": {"A": "在處理該證據之前，仍缺乏充分的支持。", "B": "會因為較簡單而變得更有說服力。", "C": "與未來的發現無關。", "D": "可以不經修正就被接受。"}, "answer": "A", "expl": "Ignoring relevant evidence weakens support.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: finite verb form.", "vocab": false, "body": "To <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survive<\/a> when water is scarce, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=embryo\" target=\"_blank\" rel=\"noopener\" data-w=\"embryo\" data-pos=\"n.\" data-en=\"an animal or plant in the earliest stage of development\" data-zh=\"胚胎\">embryos<\/a> inside African turquoise killifish eggs ______ a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dormant\" target=\"_blank\" rel=\"noopener\" data-w=\"dormant\" data-pos=\"adj.\" data-en=\"not active or growing now but able to become active later\" data-zh=\"休眠的；蟄伏的；潛伏的\">dormant<\/a> state known as diapause. In this state, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=embryonic\" target=\"_blank\" rel=\"noopener\" data-w=\"embryonic\" data-pos=\"adj.\" data-en=\"relating to an embryo; at a very early stage\" data-zh=\"胚胎的；初期的\">embryonic<\/a> development is paused for as long as two years - longer than the life span of an adult killifish.", "bodyPlain": "To survive when water is scarce, embryos inside African turquoise killifish eggs ______ a dormant state known as diapause. In this state, embryonic development is paused for as long as two years - longer than the life span of an adult killifish.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "為了在缺水時存活，非洲青鱂（turquoise killifish）卵中的胚胎會 ______ 一種稱為滯育的休眠狀態。在這種狀態下，胚胎發育可暫停長達兩年——比成年青鱂的壽命還長。", "opts": {"A": "enter", "B": "to enter", "C": "having entered", "D": "entering"}, "optsZh": {"A": "enter（複數現在式，限定動詞：正確）", "B": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）", "C": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "D": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "A", "expl": "The sentence needs a main verb for the subject 'embryos'; 'enter' is the only finite verb.", "explZh": "主詞「embryos」需要主要動詞，只有「enter」是限定動詞。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: finite verb form.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "having entered", "B": "to enter", "C": "entering", "D": "enter"}, "optsZh": {"A": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "B": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）", "C": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）", "D": "enter（複數現在式，限定動詞：正確）"}, "answer": "D", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: finite verb form.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "will digitize", "B": "has digitized", "C": "had digitized", "D": "digitizes"}, "optsZh": {"A": "will digitize（未來式 → 與過去時間點不符）", "B": "has digitized（現在完成式 → 與過去時間點不符）", "C": "had digitized（過去完成式：正確）", "D": "digitizes（現在式 → 與過去時間點不符）"}, "answer": "C", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: finite verb form.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "forms", "B": "forming", "C": "to form", "D": "having formed"}, "optsZh": {"A": "forms（第三人稱單數現在式：正確）", "B": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）", "C": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）", "D": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "A", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: finite verb form.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "had described", "B": "describes", "C": "described", "D": "will describe"}, "optsZh": {"A": "had described（過去完成式 → 與現在式敘述不符）", "B": "describes（第三人稱單數現在式：正確）", "C": "described（過去式 → 與現在式敘述不符）", "D": "will describe（未來式 → 與現在式敘述不符）"}, "answer": "B", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: finite verb form.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebed", "B": "lakebed's", "C": "lakebeds'", "D": "lakebeds"}, "optsZh": {"A": "lakebed（單數名詞，缺少所有格）", "B": "lakebed's（單數所有格：正確）", "C": "lakebeds'（複數所有格 → 數不一致）", "D": "lakebeds（複數名詞，非所有格）"}, "answer": "B", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: past perfect tense.", "vocab": false, "body": "Formed in 1967 to foster political and economic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stability\" target=\"_blank\" rel=\"noopener\" data-w=\"stability\" data-pos=\"n.\" data-en=\"the state of being steady and not changing suddenly\" data-zh=\"穩定\">stability<\/a> within the Asia-Pacific region, the Association of Southeast Asian Nations was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=original\" target=\"_blank\" rel=\"noopener\" data-w=\"original\" data-pos=\"adj.\" data-en=\"new and different; not copied\" data-zh=\"原創的；新穎的；原本的\">originally<\/a> made up of five members: Thailand, the Philippines, Singapore, Malaysia, and Indonesia. By the end of the 1990s, the organization ______ its initial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=membership\" target=\"_blank\" rel=\"noopener\" data-w=\"membership\" data-pos=\"n.\" data-en=\"the members of a group; being a member\" data-zh=\"成員；會員資格\">membership<\/a>.", "bodyPlain": "Formed in 1967 to foster political and economic stability within the Asia-Pacific region, the Association of Southeast Asian Nations was originally made up of five members: Thailand, the Philippines, Singapore, Malaysia, and Indonesia. By the end of the 1990s, the organization ______ its initial membership.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "東南亞國家協會（Association of Southeast Asian Nations）成立於 1967 年，旨在促進亞太地區的政治與經濟穩定，最初由五個會員國組成：泰國、菲律賓、新加坡、馬來西亞與印尼。到了 1990 年代末，該組織 ______ 其最初的會員數。", "opts": {"A": "has doubled", "B": "had doubled", "C": "doubles", "D": "will double"}, "optsZh": {"A": "has doubled（現在完成式 → 與過去時間點不符）", "B": "had doubled（過去完成式：正確）", "C": "doubles（現在式 → 與過去時間點不符）", "D": "will double（未來式 → 與過去時間點不符）"}, "answer": "B", "expl": "'By the end of the 1990s' marks a past point before which the action was completed, so past perfect 'had doubled' is needed.", "explZh": "「By the end of the 1990s」表示過去某時間點之前已完成，所以用過去完成式「had doubled」。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: past perfect tense.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The larvae of several desert insects ______ a dormant state when rainfall is delayed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n當降雨延遲時，幾種沙漠昆蟲的幼蟲會 ______ 一種休眠狀態。", "opts": {"A": "enter", "B": "having entered", "C": "entering", "D": "to enter"}, "optsZh": {"A": "enter（複數現在式，限定動詞：正確）", "B": "having entered（完成分詞，非限定動詞 → 句子缺少主要動詞）", "C": "entering（現在分詞，非限定動詞 → 句子缺少主要動詞）", "D": "to enter（不定詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "A", "expl": "The sentence needs a finite verb.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English: past perfect tense.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By the time the archive reopened in 2010, the staff ______ more than two million documents.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n到了檔案館在 2010 年重新開放時，工作人員 ______ 超過兩百萬份文件。", "opts": {"A": "had digitized", "B": "digitizes", "C": "will digitize", "D": "has digitized"}, "optsZh": {"A": "had digitized（過去完成式：正確）", "B": "digitizes（現在式 → 與過去時間點不符）", "C": "will digitize（未來式 → 與過去時間點不符）", "D": "has digitized（現在完成式 → 與過去時間點不符）"}, "answer": "A", "expl": "Past perfect fits an action completed before a past time.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English: past perfect tense.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The mineral stabilizes the alloy&#x27;s structure. It ______ in small amounts during cooling.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The mineral stabilizes the alloy's structure. It ______ in small amounts during cooling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這種礦物能穩定合金的結構。它在冷卻過程中少量 ______。", "opts": {"A": "forming", "B": "having formed", "C": "forms", "D": "to form"}, "optsZh": {"A": "forming（現在分詞，非限定動詞 → 句子缺少主要動詞）", "B": "having formed（完成分詞，非限定動詞 → 句子缺少主要動詞）", "C": "forms（第三人稱單數現在式：正確）", "D": "to form（不定詞，非限定動詞 → 句子缺少主要動詞）"}, "answer": "C", "expl": "A complete sentence requires the finite verb 'forms'.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English: past perfect tense.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gradual\" target=\"_blank\" rel=\"noopener\" data-w=\"gradual\" data-pos=\"adj.\" data-en=\"happening slowly over a long period\" data-zh=\"逐漸的；漸進的\">gradual<\/a>, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s narrator ______ the events in present tense, a choice that gives the story immediacy.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's narrator ______ the events in present tense, a choice that gives the story immediacy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的敘述者以現在式 ______ 事件，這個選擇讓故事更具臨場感。", "opts": {"A": "had described", "B": "describes", "C": "will describe", "D": "described"}, "optsZh": {"A": "had described（過去完成式 → 與現在式敘述不符）", "B": "describes（第三人稱單數現在式：正確）", "C": "will describe（未來式 → 與現在式敘述不符）", "D": "described（過去式 → 與現在式敘述不符）"}, "answer": "B", "expl": "Literary analysis conventionally uses present tense.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English: past perfect tense.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The trail across the ______ surface records the boulders&#x27; movement.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The trail across the ______ surface records the boulders' movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n橫越 ______ 表面的軌跡記錄了巨石的移動。", "opts": {"A": "lakebed", "B": "lakebeds", "C": "lakebeds'", "D": "lakebed's"}, "optsZh": {"A": "lakebed（單數名詞，缺少所有格）", "B": "lakebeds（複數名詞，非所有格）", "C": "lakebeds'（複數所有格 → 數不一致）", "D": "lakebed's（單數所有格：正確）"}, "answer": "D", "expl": "The singular possessive modifies surface.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "The intense pressure found in the deep ocean can affect the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protein\" target=\"_blank\" rel=\"noopener\" data-w=\"protein\" data-pos=\"n.\" data-en=\"a substance in living things that is needed for growth\" data-zh=\
