href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一篇文學分析一開始指出，某部小說的結局常被形容為樂觀的。第二句指出，這種詮釋難以成立，因為最後一章包含了好幾個象徵禁錮的意象。這段文字其餘部分解釋這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It summarizes the novel's publication history.", "B": "It raises a difficulty with a common interpretation.", "C": "It introduces an unrelated theme.", "D": "It provides biographical information about the novelist."}, "optsZh": {"A": "它概述這部小說的出版歷史。", "B": "它指出一種常見詮釋的問題。", "C": "它引入一個不相關的主題。", "D": "它提供這位小說家的生平資料。"}, "answer": "B", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Text Structure: letter delivery then joy", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unpredictable\" target=\"_blank\" rel=\"noopener\" data-w=\"unpredictable\" data-pos=\"adj.\" data-en=\"not able to be known or expected in advance\" data-zh=\"無法預測的；難以預料的\">unpredictable<\/a>. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一篇科技文章首先說，自主水下載具能夠繪製海底地圖。下一句解釋，它們在狹窄的洞穴中常常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師們針對這些情況測試一套新的導航系統。", "opts": {"A": "It explains the limitation that the new system is meant to address.", "B": "It compares underwater vehicles with aircraft.", "C": "It gives a personal anecdote about engineers.", "D": "It announces that the technology is already flawless."}, "optsZh": {"A": "它說明新系統要解決的限制。", "B": "它比較水下載具與飛機。", "C": "它講述一則關於工程師的個人軼事。", "D": "它宣稱這項技術已經完美無缺。"}, "answer": "A", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Text Function: production quotas increased bargaining power", "vocab": false, "body": "According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Vicki L. Ruiz, Mexican American women made crucial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contribution\" target=\"_blank\" rel=\"noopener\" data-w=\"contribution\" data-pos=\"n.\" data-en=\"something you give or do to help achieve something\" data-zh=\"貢獻\">contributions<\/a> to the labor movement during World War II. At the time, food processing companies entered into <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contract\" target=\"_blank\" rel=\"noopener\" data-w=\"contract\" data-pos=\"n.\" data-en=\"a formal agreement between people, often legal\" data-zh=\"契約；合約\">contracts<\/a> to supply United States armed forces with canned goods. Increased <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a> quotas conferred greater bargaining power on the companies’ employees, many of whom were Mexican American women: <u>employees insisted on more favorable benefits, and employers, who were anxious to fulfill the contracts, complied<\/u>. Thus, labor activism became a platform for Mexican American women to assert their agency.", "bodyPlain": "According to historian Vicki L. Ruiz, Mexican American women made crucial contributions to the labor movement during World War II. At the time, food processing companies entered into contracts to supply United States armed forces with canned goods. Increased production quotas conferred greater bargaining power on the companies’ employees, many of whom were Mexican American women: employees insisted on more favorable benefits, and employers, who were anxious to fulfill the contracts, complied. Thus, labor activism became a platform for Mexican American women to assert their agency.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "根據歷史學家 Vicki L. Ruiz 的說法，墨西哥裔美國女性在第二次世界大戰期間對勞工運動做出了關鍵貢獻。當時，食品加工公司簽訂合約，為美國軍隊供應罐頭食品。提高的生產配額賦予了這些公司的員工更大的議價能力，其中許多員工是墨西哥裔美國女性：員工堅持要求更優厚的福利，而急於履行合約的雇主也就順從了。因此，勞工運動成為墨西哥裔美國女性展現自身能動性的平台。", "opts": {"A": "It elaborates on a claim about labor relations in a particular industry made earlier in the text.", "B": "It offers an example of a trend in the World War II–era economy discussed earlier in the text.", "C": "It notes a possible exception to the historical narrative of labor activism sketched earlier in the text.", "D": "It provides further details about the identities of the workers discussed earlier in the text."}, "optsZh": {"A": "它詳細說明前文提出的、關於某個特定產業勞資關係的主張。", "B": "它舉出一個例子，說明文中先前討論的二戰時期經濟趨勢。", "C": "它指出前文所描述的勞工運動歷史敘事中一個可能的例外。", "D": "它提供關於前文所討論之工人身分的進一步細節。"}, "answer": "A", "expl": "The underlined portion explains how the workers' increased bargaining power played out — employees demanded benefits and employers complied — elaborating on the earlier claim.", "explZh": "畫線部分說明員工增加的談判籌碼如何發揮作用——員工要求更好的福利，雇主也讓步——是對前面主張的進一步闡述。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Text Function: production quotas increased bargaining power", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號穿透得不夠深。", "opts": {"A": "It offers evidence that radar is always reliable.", "B": "It identifies the uncertainty that motivated the study.", "C": "It describes how other researchers criticized the work.", "D": "It states the study's final conclusion."}, "optsZh": {"A": "它提供證據證明雷達永遠可靠。", "B": "它指出促成這項研究的不確定之處。", "C": "它描述其他研究者如何批評這項研究。", "D": "它陳述這項研究的最終結論。"}, "answer": "B", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Text Function: production quotas increased bargaining power", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一篇考古學文章一開頭就說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，用於這種交流的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。這篇文章接著討論一個團隊，他們在陶器中尋找化學特徵，卻只得到初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It contradicts the claim made in the first sentence.", "C": "It summarizes the team's strongest result.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它界定了後續研究試圖解決的問題。", "B": "它反駁了第一句提出的主張。", "C": "它概述該團隊最有力的研究結果。", "D": "它把討論從考古學轉移開來。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Text Function: production quotas increased bargaining power", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mechanism\" target=\"_blank\" rel=\"noopener\" data-w=\"mechanism\" data-pos=\"n.\" data-en=\"a set of moving parts in a machine that perform a function\" data-zh=\"機械裝置；機制\">mechanism<\/a> allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一篇生物學文章指出，某種植物能在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述一項排除了其中一種可能機制的實驗。", "opts": {"A": "It proves that drought has no effect on plants.", "B": "It gives a historical overview of plant classification.", "C": "It lists the materials used in the experiment.", "D": "It introduces a gap in knowledge that the experiment examines."}, "optsZh": {"A": "它證明乾旱對植物沒有任何影響。", "B": "它概述植物分類的歷史。", "C": "它列出實驗中使用的材料。", "D": "它引出實驗所要探究的知識空白。"}, "answer": "D", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Text Function: production quotas increased bargaining power", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一篇文學分析一開始指出，某部小說的結局常被形容為樂觀的。第二句指出，這種詮釋難以成立，因為最後一章包含了好幾個象徵禁錮的意象。這段文字其餘部分解釋這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It introduces an unrelated theme.", "B": "It summarizes the novel's publication history.", "C": "It raises a difficulty with a common interpretation.", "D": "It provides biographical information about the novelist."}, "optsZh": {"A": "它引入一個不相關的主題。", "B": "它概述這部小說的出版歷史。", "C": "它指出一種常見詮釋的問題。", "D": "它提供這位小說家的生平資料。"}, "answer": "C", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Text Function: production quotas increased bargaining power", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unpredictable\" target=\"_blank\" rel=\"noopener\" data-w=\"unpredictable\" data-pos=\"adj.\" data-en=\"not able to be known or expected in advance\" data-zh=\"無法預測的；難以預料的\">unpredictable<\/a>. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一篇科技文章首先說，自主水下載具能夠繪製海底地圖。下一句解釋，它們在狹窄的洞穴中常常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師們針對這些情況測試一套新的導航系統。", "opts": {"A": "It gives a personal anecdote about engineers.", "B": "It explains the limitation that the new system is meant to address.", "C": "It compares underwater vehicles with aircraft.", "D": "It announces that the technology is already flawless."}, "optsZh": {"A": "它講述一則關於工程師的個人軼事。", "B": "它說明新系統要解決的限制。", "C": "它比較水下載具與飛機。", "D": "它宣稱這項技術已經完美無缺。"}, "answer": "B", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Reading Detail: fossil outside Laurussia", "vocab": false, "body": "For many years, the only existing fossil <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of mixopterid eurypterids—an extinct family of large aquatic arthropods known as sea scorpions and related to modern arachnids and horseshoe crabs—came from four species living on the paleocontinent of Laurussia. In a discovery that expands our understanding of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geographic\" target=\"_blank\" rel=\"noopener\" data-w=\"geographic\" data-pos=\"adj.\" data-en=\"relating to the physical features or location of places\" data-zh=\"地理的\">geographical<\/a> distribution of mixopterids, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=paleontologist\" target=\"_blank\" rel=\"noopener\" data-w=\"paleontologist\" data-pos=\"n.\" data-en=\"a scientist who studies fossils and ancient life\" data-zh=\"古生物學家\">paleontologist<\/a> Bo Wang and others have identified <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fossilized\" target=\"_blank\" rel=\"noopener\" data-w=\"fossilized\" data-pos=\"adj.\" data-en=\"preserved as a fossil in rock\" data-zh=\"化石化的\">fossilized<\/a> remains of a new mixopterid species, Terropterus xiushanensis, that lived over 400 million years ago on the paleocontinent of Gondwana.", "bodyPlain": "For many years, the only existing fossil evidence of mixopterid eurypterids—an extinct family of large aquatic arthropods known as sea scorpions and related to modern arachnids and horseshoe crabs—came from four species living on the paleocontinent of Laurussia. In a discovery that expands our understanding of the geographical distribution of mixopterids, paleontologist Bo Wang and others have identified fossilized remains of a new mixopterid species, Terropterus xiushanensis, that lived over 400 million years ago on the paleocontinent of Gondwana.", "stem": "According to the text, why was Wang and his team’s discovery of the Terropterus xiushanensis fossil significant?", "stemZh": "根據文本，為什麼 Wang 和他的團隊發現 Terropterus xiushanensis 化石具有重要意義？", "bodyZh": "多年來，mixopterid eurypterids（一個已滅絕的大型水生節肢動物科，俗稱海蠍，與現代的蛛形綱動物和鱟有親緣關係）唯一現存的化石證據，來自生活在古大陸 Laurussia 上的四個物種。在一項擴展了我們對 mixopterid 地理分布認識的發現中，古生物學家 Bo Wang 等人辨識出一種新的 mixopterid 物種 Terropterus xiushanensis 的化石遺骸，這個物種在四億多年前生活於岡瓦納古大陸（Gondwana）上。", "opts": {"A": "The fossil constitutes the first evidence found by scientists that mixopterids lived more than 400 million years ago.", "B": "The fossil helps establish that mixopterids are more closely related to modern arachnids and horseshoe crabs than previously thought.", "C": "The fossil helps establish a more accurate timeline of the evolution of mixopterids on the paleocontinents of Laurussia and Gondwana.", "D": "The fossil constitutes the first evidence found by scientists that mixopterids existed outside the paleocontinent of Laurussia."}, "optsZh": {"A": "這塊化石是科學家首次發現的證據，證明 mixopterid（混翅鱟類）在四億多年前就已存在。", "B": "這塊化石有助於證實 mixopterid（混翅鱟類）與現代蛛形綱動物及鱟的親緣關係比先前認為的更接近。", "C": "這塊化石有助於為 mixopterid（混翅鱟類）在勞亞大陸與岡瓦納大陸上的演化建立更精確的時間線。", "D": "這塊化石是科學家首次發現的證據，證明 mixopterid（混翅鱟類）曾存在於勞亞大陸（Laurussia）之外。"}, "answer": "D", "expl": "Before Wang's find, all mixopterid fossils came from Laurussia; this new species lived on Gondwana, the first evidence of mixopterids outside Laurussia.", "explZh": "在 Wang 的發現之前，所有 mixopterid 化石都來自勞亞大陸；這個新物種生活在岡瓦納大陸，是首個顯示其分布於勞亞大陸以外的證據。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Reading Detail: fossil outside Laurussia", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice is best supported by the text?", "stemZh": "哪個選項最能得到文本的支持？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調她的情感是真誠的，但在需要判斷時，她能夠克制自己的情緒。", "opts": {"A": "She is admired mainly for her wealth.", "B": "She shows unusual maturity and self-command.", "C": "She lacks affection for her family.", "D": "She refuses to give advice to others."}, "optsZh": {"A": "她主要因財富而受人景仰。", "B": "她展現出不尋常的成熟與自制。", "C": "她對家人缺乏感情。", "D": "她拒絕給別人建議。"}, "answer": "B", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Reading Detail: fossil outside Laurussia", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice is best supported by the text?", "stemZh": "哪個選項最能得到文本的支持？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強勢。", "opts": {"A": "The grandmother avoids family matters entirely.", "B": "The narrator thinks patience is useless.", "C": "The grandmother's influence is quiet but substantial.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "祖母完全避開家務事。", "B": "敘事者認為耐心毫無用處。", "C": "祖母的影響力低調卻深遠。", "D": "家人忽視祖母的意見。"}, "answer": "C", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Reading Detail: fossil outside Laurussia", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice is best supported by the text?", "stemZh": "哪個選項最能得到文本的支持？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一則故事描寫一位職員，他會注意到別人已經核可過的帳簿中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存下去。", "opts": {"A": "The clerk's carefulness is valuable despite being inconvenient.", "B": "The clerk intentionally creates errors.", "C": "The coworkers are more accurate than the clerk.", "D": "The business fails because of excessive caution."}, "optsZh": {"A": "這位職員的細心雖然造成不便，卻很有價值。", "B": "這位職員故意製造錯誤。", "C": "同事們比這位職員更精確。", "D": "這家公司因過度謹慎而失敗。"}, "answer": "A", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Reading Detail: fossil outside Laurussia", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice is best supported by the text?", "stemZh": "哪個選項最能得到文本的支持？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段文字指出，一位村落領袖在做決定之前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨懟。", "opts": {"A": "The leader dislikes public meetings.", "B": "The leader values inclusive deliberation.", "C": "The leader makes decisions without hearing others.", "D": "The leader is unable to reach conclusions."}, "optsZh": {"A": "這位領導人不喜歡公開會議。", "B": "這位領導人重視兼容並蓄的審議。", "C": "這位領導人不聽取他人意見就做決定。", "D": "這位領導人無法做出結論。"}, "answer": "B", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Reading Detail: fossil outside Laurussia", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice is best supported by the text?", "stemZh": "哪個選項最能得到文本的支持？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。在一段節錄中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在初期討論中鼓勵大家大膽推測，但在每一項測量都經過核對之前，她絕不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She publishes claims before testing them.", "C": "She avoids working with students.", "D": "She combines intellectual openness with rigorous standards."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她在驗證主張之前就將其發表。", "C": "她避免與學生共事。", "D": "她兼具開放的求知態度與嚴格的標準。"}, "answer": "D", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Quantitative Evidence: games from 1995-1999", "vocab": false, "body": "Video Game Availability by Initial Release Years (table) — <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percentage\" target=\"_blank\" rel=\"noopener\" data-w=\"percentage\" data-pos=\"n.\" data-en=\"an amount expressed as a part of 100\" data-zh=\"百分比\">percentage<\/a> of games still available: 1975–1979: 0.89; 1980–1984: 3.65; 1985–1989: 15.38; 1990–1994: 19.33; 1995–1999: 14.22.<br><br>In a recent study, researchers found that relatively few video games released over the decades remain available today. For example, only 14.22 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\" data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a> of games are still available that were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=initially\" target=\"_blank\" rel=\"noopener\" data-w=\"initially\" data-pos=\"adv.\" data-en=\"at the beginning\" data-zh=\"起初\">initially<\/a> released in _______", "bodyPlain": "Video Game Availability by Initial Release Years (table) — percentage of games still available: 1975–1979: 0.89; 1980–1984: 3.65; 1985–1989: 15.38; 1990–1994: 19.33; 1995–1999: 14.22.\n\nIn a recent study, researchers found that relatively few video games released over the decades remain available today. For example, only 14.22 percent of games are still available that were initially released in _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪個選項最能有效運用表格中的資料來完成這個敘述？", "bodyZh": "依初次發行年份統計的電子遊戲可取得率（表格）——目前仍可取得的遊戲百分比：1975–1979 年：0.89；1980–1984 年：3.65；1985–1989 年：15.38；1990–1994 年：19.33；1995–1999 年：14.22。\n在最近的一項研究中，研究人員發現，數十年來發行的電子遊戲中，如今仍可取得的相對很少。例如，在 _______ 初次發行的遊戲中，只有 14.22% 至今仍可取得", "opts": {"A": "2000–2004.", "B": "1995–1999.", "C": "1970–1974.", "D": "1985–1989."}, "optsZh": {"A": "2000–2004 年。", "B": "1995–1999 年。", "C": "1970–1974 年。", "D": "1985–1989 年。"}, "answer": "B", "expl": "The table shows 14.22 percent of games from 1995–1999 are still available.", "explZh": "表格顯示 1995–1999 年發行的遊戲中有 14.22% 仍可取得。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Quantitative Evidence: games from 1995-1999", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於將他視為務實的政策制定者。哪一段引文最能說明這項主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "C": "「這個政府從一開始就面臨經濟上的挑戰。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Quantitative Evidence: games from 1995-1999", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. A graph shows that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The southern region was included in the survey.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "有些農民種植蔬菜，而另一些則種植穀物。", "C": "南部地區有被納入調查。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Quantitative Evidence: games from 1995-1999", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。天文學家主張，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這項主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "The method used to study stars requires a telescope.", "C": "Some stars contain hydrogen and helium.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "有一顆岩質行星擁有稀薄的大氣層。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有些恆星含有氫和氦。", "D": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Quantitative Evidence: games from 1995-1999", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流而發展出來的，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Some songs use a meter also found in older European poetry.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "C": "有數個國家的學者研究這項傳統。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Quantitative Evidence: games from 1995-1999", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫、條件相當的城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The table includes more than one year.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "The program took place in a community."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這張表格包含不只一個年份。", "C": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。", "D": "這個計畫在一個社區中進行。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Quantitative Evidence: fish depth range", "vocab": false, "body": "Depths at Which Four Deep-Sea Fish <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">Species<\/a> Live (table) — depth below the ocean <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a>: Footballfish: 200–1,000 meters; Southern stoplight loosejaw: 500–2,000 meters; Black seadevil: 250–2,000 meters; Bollons’ rattail: 300–800 meters.<br><br>Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=oceanic\" target=\"_blank\" rel=\"noopener\" data-w=\"oceanic\" data-pos=\"adj.\" data-en=\"relating to the ocean\" data-zh=\"海洋的\">oceanic<\/a> fish species live very deep underwater. Researchers collected data about the depths at which various species live.", "bodyPlain": "Depths at Which Four Deep-Sea Fish Species Live (table) — depth below the ocean surface: Footballfish: 200–1,000 meters; Southern stoplight loosejaw: 500–2,000 meters; Black seadevil: 250–2,000 meters; Bollons’ rattail: 300–800 meters.\n\nSome oceanic fish species live very deep underwater. Researchers collected data about the depths at which various species live.", "stem": "Based on the information in the table, at what depth does the southern stoplight loosejaw live?", "stemZh": "根據表格中的資訊，southern stoplight loosejaw 生活在什麼深度？", "bodyZh": "四種深海魚類的棲息深度（表格）——海面以下深度：Footballfish：200–1,000 公尺；Southern stoplight loosejaw：500–2,000 公尺；Black seadevil：250–2,000 公尺；Bollons’ rattail：300–800 公尺。\n有些海洋魚類生活在非常深的水下。研究人員蒐集了各種魚類棲息深度的資料。", "opts": {"A": "More than 2,000 meters below the surface", "B": "150 to 400 meters below the surface", "C": "500 to 2,000 meters below the surface", "D": "250 to 500 meters below the surface"}, "optsZh": {"A": "海面下超過 2,000 公尺", "B": "海面下 150 至 400 公尺", "C": "海面下 500 至 2,000 公尺", "D": "海面下 250 至 500 公尺"}, "answer": "C", "expl": "The table lists the southern stoplight loosejaw at 500–2,000 meters below the surface.", "explZh": "表格顯示 southern stoplight loosejaw 生活在海面下 500 至 2,000 公尺。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Quantitative Evidence: fish depth range", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於將他視為務實的政策制定者。哪一段引文最能說明這項主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Quantitative Evidence: fish depth range", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. A graph shows that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The southern region was included in the survey.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "有些農民種植蔬菜，而另一些則種植穀物。", "C": "南部地區有被納入調查。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Quantitative Evidence: fish depth range", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。天文學家主張，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這項主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "The method used to study stars requires a telescope.", "C": "Some stars contain hydrogen and helium.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "有一顆岩質行星擁有稀薄的大氣層。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有些恆星含有氫和氦。", "D": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Quantitative Evidence: fish depth range", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流而發展出來的，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "Many performers learned songs from relatives.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "有數個國家的學者研究這項傳統。", "B": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "C": "許多表演者是向親戚學習歌曲的。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Quantitative Evidence: fish depth range", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of th
