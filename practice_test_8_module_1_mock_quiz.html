\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The performance is both comic and unnerving. _______ audiences often laugh at the opening scene and then fall silent as the same joke darkens.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The performance is both comic and unnerving. _______ audiences often laugh at the opening scene and then fall silent as the same joke darkens.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這場演出既滑稽又令人不安。_______ 觀眾常常在開場時哈哈大笑，接著隨著同一個笑話變得陰暗而陷入沉默。", "opts": {"A": "Instead,", "B": "Second,", "C": "Nevertheless,", "D": "Indeed,"}, "optsZh": {"A": "Instead,（反而、取而代之：表替代）", "B": "Second,（第二：表列舉下一點 → 前後是強化說明關係，錯誤）", "C": "Nevertheless,（然而、儘管如此：表讓步轉折）", "D": "Indeed,（的確、事實上；表強調）"}, "answer": "D", "expl": "Indeed supports the claim.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Student Notes: emphasize distance covered", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Philadelphia and Lancaster <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=turnpike\" target=\"_blank\" rel=\"noopener\" data-w=\"turnpike\" data-pos=\"n.\" data-en=\"a road that people pay a toll to use\" data-zh=\"收費公路\">Turnpike<\/a> was a road built between 1792 and 1794.<br>- It was the first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=private\" target=\"_blank\" rel=\"noopener\" data-w=\"private\" data-pos=\"adj.\" data-en=\"belonging to or meant for one person or group; not public\" data-zh=\"私人的；私下的\">private<\/a> turnpike in the United States.<br>- It <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=connect\" target=\"_blank\" rel=\"noopener\" data-w=\"connect\" data-pos=\"v.\" data-en=\"to join or link two things together\" data-zh=\"連接\">connected<\/a> the cities of Philadelphia and Lancaster in the state of Pennsylvania.<br>- It was sixty-two miles long.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Philadelphia and Lancaster Turnpike was a road built between 1792 and 1794.\n- It was the first private turnpike in the United States.\n- It connected the cities of Philadelphia and Lancaster in the state of Pennsylvania.\n- It was sixty-two miles long.", "stem": "The student wants to emphasize the distance covered by the Philadelphia and Lancaster Turnpike. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想強調費城與蘭卡斯特收費公路所涵蓋的距離。哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- Philadelphia and Lancaster Turnpike 是一條於 1792 年至 1794 年間修建的道路。\n- 它是美國第一條私營收費公路。\n- 它連接了賓夕法尼亞州的費城和蘭開斯特兩座城市。\n- 它全長六十二英里。", "opts": {"A": "The sixty-two-mile-long Philadelphia and Lancaster Turnpike connected the Pennsylvania cities of Philadelphia and Lancaster.", "B": "The Philadelphia and Lancaster Turnpike was the first private turnpike in the United States.", "C": "The Philadelphia and Lancaster Turnpike, which connected two Pennsylvania cities, was built between 1792 and 1794.", "D": "A historic Pennsylvania road, the Philadelphia and Lancaster Turnpike was completed in 1794."}, "optsZh": {"A": "全長六十二英里的 Philadelphia and Lancaster Turnpike 連接賓州的費城與蘭開斯特兩座城市。", "B": "Philadelphia and Lancaster Turnpike 是美國第一條私營收費公路。", "C": "連接賓州兩座城市的 Philadelphia and Lancaster Turnpike 建於 1792 年至 1794 年之間。", "D": "Philadelphia and Lancaster Turnpike 是賓州一條歷史悠久的道路，於 1794 年完工。"}, "answer": "A", "expl": "Choice A includes the turnpike's length, sixty-two miles, and the cities it connected, emphasizing the distance covered.", "explZh": "選項 A 提到收費公路長 62 英里及其連接的兩座城市，強調了所涵蓋的距離。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Student Notes: emphasize distance covered", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Aya Mori collected hundreds of plant samples.", "B": "Fern A and Moss B were collected in different years.", "C": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "D": "Mori also collected Moss B from River Nami."}, "optsZh": {"A": "Aya Mori 採集了數百件植物樣本。", "B": "Fern A 和 Moss B 是在不同年份採集的。", "C": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "D": "Mori 也在 River Nami 採集了 Moss B。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Student Notes: emphasize distance covered", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cerro Azul sample.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：地質學家 Luis Ortega 採集了許多礦物標本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的標本。", "opts": {"A": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.", "B": "Ortega collected many mineral samples.", "C": "Cerro Azul and Valle Seco are different sites.", "D": "Quartz was collected from Valle Seco."}, "optsZh": {"A": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。", "B": "Ortega 採集了許多礦物樣本。", "C": "Cerro Azul 和 Valle Seco 是不同的地點。", "D": "石英是在 Valle Seco 採集的。"}, "answer": "A", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Student Notes: emphasize distance covered", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Fucus alba was collected from Stone Harbor.", "B": "Both samples were collected in 1980.", "C": "Lee cataloged more than one algae species.", "D": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980."}, "optsZh": {"A": "Fucus alba 是在 Stone Harbor 採集的。", "B": "兩份樣本都是在 1980 年採集的。", "C": "Lee 編目記錄了不只一種藻類。", "D": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。"}, "answer": "D", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Student Notes: emphasize distance covered", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "Species M came from Lake Plain.", "B": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "C": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "D": "Singh collected beetles in multiple locations."}, "optsZh": {"A": "Species M 來自 Lake Plain。", "B": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。", "C": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "D": "Singh 在多個地點採集了甲蟲。"}, "answer": "B", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Student Notes: emphasize distance covered", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Ramos collected Fern Y the following year.", "B": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "C": "Cloud Peak and Green Valley were both collection sites.", "D": "Ramos collected approximately 700 specimens."}, "optsZh": {"A": "Ramos 在隔年採集了 Fern Y。", "B": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "C": "Cloud Peak 和 Green Valley 都是採集地點。", "D": "Ramos 採集了大約 700 件標本。"}, "answer": "B", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Most, but not all, of the Moon’s oxygen comes from the Sun, via solar wind.<br>- Cosmochemist Kentaro Terada from Osaka University wondered if some of the unaccounted-for oxygen could be coming from Earth.<br>- In 2008, he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=analyze\" target=\"_blank\" rel=\"noopener\" data-w=\"analyze\" data-pos=\"v.\" data-en=\"to examine something carefully in order to understand it\" data-zh=\"分析\">analyzed<\/a> data from the Japanese satellite Kaguya.<br>- Kaguya gathered data about gases and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=particle\" target=\"_blank\" rel=\"noopener\" data-w=\"particle\" data-pos=\"n.\" data-en=\"an extremely small piece of matter\" data-zh=\"粒子；微粒\">particles<\/a> it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> while orbiting the Moon.<br>- Based on the Kaguya data, Terada confirmed his suspicion that Earth is sending oxygen to the Moon.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Most, but not all, of the Moon’s oxygen comes from the Sun, via solar wind.\n- Cosmochemist Kentaro Terada from Osaka University wondered if some of the unaccounted-for oxygen could be coming from Earth.\n- In 2008, he analyzed data from the Japanese satellite Kaguya.\n- Kaguya gathered data about gases and particles it encountered while orbiting the Moon.\n- Based on the Kaguya data, Terada confirmed his suspicion that Earth is sending oxygen to the Moon.", "stem": "The student wants to emphasize the aim of the research study. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調這項研究的目的。哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- 月球上大部分（但並非全部）的氧氣來自太陽，經由太陽風而來。\n- 大阪大學的宇宙化學家 Kentaro Terada 好奇，那些來源不明的氧氣是否有一部分可能來自地球。\n- 2008 年，他分析了日本人造衛星 Kaguya 的資料。\n- Kaguya 蒐集了它在繞月運行時所遇到的氣體和粒子的資料。\n- 根據 Kaguya 的資料，Terada 證實了他的猜測：地球正在向月球輸送氧氣。", "opts": {"A": "As it orbited the Moon, the Kaguya satellite collected data that was later analyzed by cosmochemist Kentaro Terada.", "B": "Before 2008, Kentaro Terada wondered if the Moon was receiving some of its oxygen from Earth.", "C": "Cosmochemist Kentaro Terada set out to determine whether some of the Moon’s oxygen was coming from Earth.", "D": "Kentaro Terada’s study determined that Earth is sending a small amount of oxygen to the Moon."}, "optsZh": {"A": "輝夜號（Kaguya）衛星在環繞月球時蒐集了數據，這些數據後來由宇宙化學家 Kentaro Terada 加以分析。", "B": "2008 年以前，Kentaro Terada 想知道月球是否從地球獲得部分的氧。", "C": "宇宙化學家 Kentaro Terada 著手確認月球上的部分氧氣是否來自地球。", "D": "Kentaro Terada 的研究確認地球正在將少量氧氣送往月球。"}, "answer": "C", "expl": "Choice C states what Terada 'set out to determine,' which is the aim of the study.", "explZh": "選項 C 說明 Terada「著手要確定」的事情，也就是研究的目的。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "B": "Aya Mori collected hundreds of plant samples.", "C": "Mori also collected Moss B from River Nami.", "D": "Fern A and Moss B were collected in different years."}, "optsZh": {"A": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "B": "Aya Mori 採集了數百件植物樣本。", "C": "Mori 也在 River Nami 採集了 Moss B。", "D": "Fern A 和 Moss B 是在不同年份採集的。"}, "answer": "A", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cerro Azul sample.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：地質學家 Luis Ortega 採集了許多礦物標本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的標本。", "opts": {"A": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.", "B": "Cerro Azul and Valle Seco are different sites.", "C": "Ortega collected many mineral samples.", "D": "Quartz was collected from Valle Seco."}, "optsZh": {"A": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。", "B": "Cerro Azul 和 Valle Seco 是不同的地點。", "C": "Ortega 採集了許多礦物樣本。", "D": "石英是在 Valle Seco 採集的。"}, "answer": "A", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Lee cataloged more than one algae species.", "B": "Both samples were collected in 1980.", "C": "Fucus alba was collected from Stone Harbor.", "D": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980."}, "optsZh": {"A": "Lee 編目記錄了不只一種藻類。", "B": "兩份樣本都是在 1980 年採集的。", "C": "Fucus alba 是在 Stone Harbor 採集的。", "D": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。"}, "answer": "D", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "B": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "C": "Singh collected beetles in multiple locations.", "D": "Species M came from Lake Plain."}, "optsZh": {"A": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "B": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。", "C": "Singh 在多個地點採集了甲蟲。", "D": "Species M 來自 Lake Plain。"}, "answer": "B", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Ramos collected approximately 700 specimens.", "B": "Cloud Peak and Green Valley were both collection sites.", "C": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "D": "Ramos collected Fern Y the following year."}, "optsZh": {"A": "Ramos 採集了大約 700 件標本。", "B": "Cloud Peak 和 Green Valley 都是採集地點。", "C": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "D": "Ramos 在隔年採集了 Fern Y。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The factors that affect clutch size (the number of eggs laid at one time) have been well studied in birds but not in lizards.<br>- A team led by Shai Meiri of Tel Aviv University <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> which factors influence lizard clutch size.<br>- Meiri’s team obtained clutch-size and habitat data for over 3,900 lizard species and analyzed the data with statistical models.<br>- Larger clutch size was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a> in higher latitudes that have more seasonal change.<br>- Lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The factors that affect clutch size (the number of eggs laid at one time) have been well studied in birds but not in lizards.\n- A team led by Shai Meiri of Tel Aviv University investigated which factors influence lizard clutch size.\n- Meiri’s team obtained clutch-size and habitat data for over 3,900 lizard species and analyzed the data with statistical models.\n- Larger clutch size was associated with environments in higher latitudes that have more seasonal change.\n- Lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable conditions.", "stem": "The student wants to emphasize the aim of the research study. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調這項研究的目的。哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- 影響窩卵數（一次產下的蛋數）的因素在鳥類身上已有充分研究，但在蜥蜴身上則不然。\n- 由特拉維夫大學 Shai Meiri 帶領的團隊，研究了哪些因素會影響蜥蜴的窩卵數。\n- Meiri 的團隊取得了超過 3,900 種蜥蜴的每窩產卵數與棲地資料，並以統計模型分析這些資料。\n- 較大的窩卵數與季節變化較明顯的高緯度環境有關。\n- 高緯度環境中的蜥蜴可能會產下較多的蛋，以利用較短暫的有利條件時段。", "opts": {"A": "Researchers wanted to know which factors influence lizard egg clutch size because such factors have been well studied in birds but not in lizards.", "B": "After they obtained data for over 3,900 lizard species, researchers determined that larger clutch size was associated with environments in higher latitudes that have more seasonal change.", "C": "We now know that lizards in higher-latitude environments may lay larger clutches to take advantage of shorter windows of favorable conditions.", "D": "Researchers obtained clutch-size and habitat data for over 3,900 lizard species and analyzed the data with statistical models."}, "optsZh": {"A": "研究人員想知道哪些因素會影響蜥蜴的產卵數，因為這些因素在鳥類中已有充分研究，在蜥蜴中卻沒有。", "B": "在取得超過 3,900 種蜥蜴的資料後，研究人員確定較大的產卵數與季節變化較大的高緯度環境有關。", "C": "我們現在知道，生活在高緯度環境的蜥蜴可能會產下較多的卵，以利用較短暫的有利條件期。", "D": "研究人員取得了超過 3,900 種蜥蜴的產卵數與棲地資料，並以統計模型分析這些資料。"}, "answer": "A", "expl": "Choice A states what the researchers 'wanted to know' (which factors influence lizard clutch size) — the study's aim.", "explZh": "選項 A 說明研究者「想知道」的事（哪些因素影響蜥蜴的窩卵數），也就是研究目的。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "B": "Mori also collected Moss B from River Nami.", "C": "Aya Mori collected hundreds of plant samples.", "D": "Fern A and Moss B were collected in different years."}, "optsZh": {"A": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "B": "Mori 也在 River Nami 採集了 Moss B。", "C": "Aya Mori 採集了數百件植物樣本。", "D": "Fern A 和 Moss B 是在不同年份採集的。"}, "answer": "A", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cerro Azul sample.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：地質學家 Luis Ortega 採集了許多礦物標本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的標本。", "opts": {"A": "Ortega collected many mineral samples.", "B": "Quartz was collected from Valle Seco.", "C": "Cerro Azul and Valle Seco are different sites.", "D": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work."}, "optsZh": {"A": "Ortega 採集了許多礦物樣本。", "B": "石英是在 Valle Seco 採集的。", "C": "Cerro Azul 和 Valle Seco 是不同的地點。", "D": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。"}, "answer": "D", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Both samples were collected in 1980.", "B": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "C": "Fucus alba was collected from Stone Harbor.", "D": "Lee cataloged more than one algae species."}, "optsZh": {"A": "兩份樣本都是在 1980 年採集的。", "B": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。", "C": "Fucus alba 是在 Stone Harbor 採集的。", "D": "Lee 編目記錄了不只一種藻類。"}, "answer": "B", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "B": "Singh collected beetles in multiple locations.", "C": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "D": "Species M came from Lake Plain."}, "optsZh": {"A": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "B": "Singh 在多個地點採集了甲蟲。", "C": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。", "D": "Species M 來自 Lake Plain。"}, "answer": "C", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: emphasize research aim", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Cloud Peak and Green Valley were both collection sites.", "B": "Ramos collected approximately 700 specimens.", "C": "Ramos collected Fern Y the following year.", "D": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948."}, "optsZh": {"A": "Cloud Peak 和 Green Valley 都是採集地點。", "B": "Ramos 採集了大約 700 件標本。", "C": "Ramos 在隔年採集了 Fern Y。", "D": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。"}, "answer": "D", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: generalize study type", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- British musicians John Lennon and Paul McCartney shared writing credit for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=numerous\" target=\"_blank\" rel=\"noopener\" data-w=\"numerous\" data-pos=\"adj.\" data-en=\"many\" data-zh=\"眾多的\">numerous<\/a> Beatles songs.<br>- Many Lennon-McCartney songs were actually written by either Lennon or McCartney, not by both.<br>- The exact authorship of specific parts of many Beatles songs, such as the verse for “In My Life,” is disputed.<br>- Mark Glickman, Jason Brown, and Ryan Song used statistical methods to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=analyze\" target=\"_blank\" rel=\"noopener\" data-w=\"analyze\" data-pos=\"v.\" data-en=\"to examine something carefully in order to understand it\" data-zh=\"分析\">analyze<\/a> the musical content of Beatles songs.<br>- They <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that there is 18.9% <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=probability\" target=\"_blank\" rel=\"noopener\" data-w=\"probability\" data-pos=\"n.\" data-en=\"how likely it is that something will happen\" data-zh=\"機率；可能性\">probability<\/a> that McCartney wrote the verse for “In My Life,” stating that the verse is “consistent with Lennon’s songwriting style.”", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- British musicians John Lennon and Paul McCartney shared writing credit for numerous Beatles songs.\n- Many Lennon-McCartney songs were actually written by either Lennon or McCartney, not by both.\n- The exact authorship of specific parts of many Beatles songs, such as the verse for “In My Life,” is disputed.\n- Mark Glickman, Jason Brown, and Ryan Song used statistical methods to analyze the musical content of Beatles songs.\n- They concluded that there is 18.9% probability that McCartney wrote the verse for “In My Life,” stating that the verse is “consistent with Lennon’s songwriting style.”", "stem": "The student wants to make a generalization about the kind of study conducted by Glickman, Brown, and Song. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想對 Glickman、Brown 和 Song 所進行的研究類型做出概括性陳述。哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究一個主題時，一位學生做了以下筆記：\n- 英國音樂家 John Lennon 和 Paul McCartney 共同掛名創作了許多披頭四的歌曲。\n- 許多 Lennon-McCartney 名下的歌曲，實際上是由 Lennon 或 McCartney 其中一人所寫，而非兩人合寫。\n- 許多披頭四歌曲中特定段落的確切作者身分仍有爭議，例如〈In My Life〉的主歌部分。\n- Mark Glickman、Jason Brown 和 Ryan Song 運用統計方法分析披頭四歌曲的音樂內容。\n- 他們的結論是，〈In My Life〉的主歌由 McCartney 所寫的機率為 18.9%，並指出這段主歌「與 Lennon 的創作風格一致」。", "opts": {"A": "Based on statistical analysis, Glickman, Brown, and Song claim that John Lennon wrote the verse of “In My Life.”", "B": "There is only an 18.9% probability that Paul McCartney wrote the verse for “In My Life”; John Lennon is the more likely author.", "C": "It is likely that John Lennon, not Paul McCartney, wrote the verse for “In My Life.”", "D": "Researchers have used statistical methods to address questions of authorship within the field of music."}, "optsZh": {"A": "根據統計分析，Glickman、Brown 和 Song 主張〈In My Life〉的主歌是 John Lennon 寫的。", "B": "〈In My Life〉的主歌由 Paul McCartney 寫的機率只有 18.9%；John Lennon 才是較可能的作者。", "C": "〈In My Life〉的主歌很可能是 John Lennon 而非 Paul McCartney 寫的。", "D": "研究人員已運用統計方法來處理音樂領域中的作者歸屬問題。"}, "answer": "D", "expl": "Choice D generalizes the kind of study: using statistical methods to address authorship questions in music.", "explZh": "選項 D 概括了這類研究：運用統計方法處理音樂作品的作者歸屬問題。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: generalize study type", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。筆記：某個檔案室依風險為文件分級；公開後可能造成輕微傷害的文件列為「限閱」（Restricted）；公開後可能造成重大傷害的文件列為「封存」（Sealed）；例行的預算草案可能造成輕微但非重大的傷害；目標是為這些草案分級。", "opts": {"A": "Sealed documents could cause major harm if released.", "B": "Budget drafts are one kind of government document.", "C": "Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.", "D": "The records office classifies documents by release risk."}, "optsZh": {"A": "「密封級」文件一旦公開可能造成重大損害。", "B": "預算草案是政府文件的一種。", "C": "由於例行預算草案外洩可能造成輕微但不嚴重的損害，因此被歸類為「限制級」（Restricted）。", "D": "檔案室依公開風險為文件分類。"}, "answer": "C", "expl": "The answer applies the classification rule.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: generalize study type", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classify<\/a> diluted cleaner.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。筆記：某間實驗室依危險程度標示材料；可能刺激皮膚的材料標示為「小心」（Caution）；可能造成嚴重傷害的材料標示為「危險」（Danger）；稀釋過的清潔劑可能刺激皮膚，但不會造成嚴重傷害；目標是為稀釋清潔劑分類。", "opts": {"A": "Diluted cleaner is handled in a lab.", "B": "The lab uses hazard categories for materials.", "C": "Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution.", "D": "Danger materials can cause severe injury."}, "optsZh": {"A": "稀釋過的清潔劑在實驗室中處理。", "B": "該實驗室對材料採用危險等級分類。", "C": "由於稀釋過的清潔劑可能刺激皮膚但不會造成嚴重傷害，因此被標示為「注意級」（Caution）。", "D": "「危險級」材料可能造成嚴重傷害。"}, "answer": "C", "expl": "The answer uses the correct category.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: generalize study type", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A library classifies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。筆記：某間圖書館依脆弱程度為手稿分級；需要小心處理的物品列為「監控」（Monitored）；讀者不可接觸的物品列為「限閱」（Restricted）；大多數十九世紀的小冊子需要小心處理，但仍可由讀者翻閱；目標是為這些小冊子分級。", "opts": {"A": "Nineteenth-century pamphlets are historical documents.", "B": "Restricted manuscripts cannot be handled by readers.", "C": "The library classifies manuscripts by fragility.", "D": "Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers."}, "optsZh": {"A": "十九世紀的小冊子屬於歷史文件。", "B": "「限制級」手稿讀者不得接觸。", "C": "該圖書館依脆弱程度為手稿分類。", "D": "大多數十九世紀的小冊子被歸類為「監管」級，因為它們需要小心處理，但讀者仍可接觸使用。"}, "answer": "D", "expl": "The answer applies the definitions.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: generalize study type", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=widespread\" target=\"_blank\" rel=\"noopener\" data-w=\"widespread\" data-pos=\"adj.\" data-en=\"existing or happening in many places or among many people\" data-zh=\"普遍的；廣泛的\">widespread<\/a> damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。筆記：某個機構依預期影響為暴風雨分級；預期造成局部干擾的暴風雨列為「注意報」（Advisory）；預期造成大範圍損害的暴風雨列為「緊急」（Emergency）；某場沿海暴風雨預期會造成局部干擾，但不會造成大範圍損害；目標是為這場暴風雨分級。", "opts": {"A": "Coastal storms can affect travel.", "B": "Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.", "C": "The agency classifies storms by expected impact.", "D": "Emergency storms cause widespread damage."}, "optsZh": {"A": "沿海風暴可能影響交通。", "B": "由於預計會造成局部干擾但不會造成大範圍損害，這場沿海風暴被歸類為「警示級」（Advisory）。", "C": "該機構依預期衝擊程度為風暴分類。", "D": "「緊急級」風暴會造成大範圍損害。"}, "answer": "B", "expl": "The answer identifies the category.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: generalize study type", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。筆記：某間博物館依安全風險為借展品分級；可能因一般搬運而受損的物件列為「監督」（Supervised）；可能因短暫暴露而嚴重受損的物件列為「限制」（Restricted）；大多數陶瓷複製品可能因一般搬運而受損，但不會因短暫暴露而嚴重受損；目標是為這些複製品分級。", "opts": {"A": "Most ceramic replicas are classified as Supervised because ordinary handling could damage them.", "B": "Restricted objects could be seriously damaged by brief exposure.", "C": "Museum loans are classified by security risk.", "D": "Ceramic replicas may be used in educational displays."}, "optsZh": {"A": "大多數陶瓷複製品被歸類為「監督級」（Supervised），因為一般的搬動就可能損壞它們。", "B": "「限制級」物件短暫曝露就可能嚴重受損。", "C": "博物館借展品依安全風險分類。", "D": "陶瓷複製品可用於教育展示。"}, "answer": "A", "expl": "The answer applies the classification.", "explZh": ""}];
    const SLUG = 'dsat_t8m1';
    const SOURCE = 'Digital SAT Practice Test 8, Module 1';
