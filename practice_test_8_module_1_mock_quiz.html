y show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family,\nC) family, and\nD) family", "answer": "D", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "23.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free in part because\nB) free, in part because:\nC) free. In part because\nD) free, in part because,", "answer": "C", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 24, "concept": "Grammar: however as interrupter", "original": "During the English neoclassical period (1660–1789),\nmany writers imitated the epic poetry and satires of\nancient Greece and Rome. They were not the first in\nEngland to adopt the literary modes of classical\n_______ some of the most prominent figures of the\nearlier Renaissance period were also influenced by\nancient Greek and Roman literature.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) antiquity, however\nB) antiquity, however,\nC) antiquity, however;\nD) antiquity; however,", "generated": [{"id": "24.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) publishing\nB) to publish\nC) published\nD) having published", "answer": "C", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "24.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device,\nB) device--\nC) device:\nD) device", "answer": "D", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "24.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) it\nC) that\nD) this", "answer": "A", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "24.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family,\nB) family\nC) family and\nD) family, and", "answer": "B", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "24.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free in part because\nB) free. In part because\nC) free, in part because:\nD) free, in part because,", "answer": "B", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 25, "concept": "Grammar: subject works were", "original": "English poet and Shakespeare contemporary\nJohn Donne’s _______ much admired during his\nlifetime (1572–1631) and in the decades that\nfollowed, had, at the time of their enthusiastic\nrediscovery by the early twentieth-century\nmodernists, been essentially gathering dust for the\nintervening 250 years.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) works were\nB) works, were\nC) works,\nD) works had been", "generated": [{"id": "25.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) having published\nB) publishing\nC) published\nD) to publish", "answer": "C", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "25.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device,\nB) device\nC) device--\nD) device:", "answer": "B", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "25.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) this\nC) that\nD) it", "answer": "A", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "25.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family,\nB) family and\nC) family, and\nD) family", "answer": "D", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "25.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free in part because\nB) free, in part because,\nC) free, in part because:\nD) free. In part because", "answer": "D", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 26, "concept": "Grammar: comparison to atomic arrangement", "original": "Compared to that of alumina glass, _______ silica\nglass atoms are so far apart that they are unable to\nre-form bonds after being separated.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) silica glass is at a significant disadvantage due to\nits more dispersed atomic arrangement:\nB) silica glass has a more dispersed atomic\narrangement, resulting in a significant\ndisadvantage:\nC) a significant disadvantage of silica glass is that its\natomic arrangement is more dispersed:\nD) silica glass’s atomic arrangement is more\ndispersed, resulting in a significant disadvantage:", "generated": [{"id": "26.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) published\nC) publishing\nD) having published", "answer": "B", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "26.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device,\nB) device--\nC) device\nD) device:", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "26.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) this\nB) it\nC) them\nD) that", "answer": "C", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "26.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family\nB) family,\nC) family and\nD) family, and", "answer": "A", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "26.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free in part because\nB) free, in part because:\nC) free, in part because,\nD) free. In part because", "answer": "D", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 27, "concept": "Transition: contrast with ideal Paris", "original": "In November 1934, Amrita Sher-Gil was living in\nwhat must have seemed like the ideal city for a\nyoung artist: Paris. She was studying firsthand the\ncolor-saturated style of France’s modernist masters\nand beginning to make a name for herself as a\npainter. _______ Sher-Gil longed to return to her\nchildhood home of India; only there, she believed,\ncould her art truly flourish.\nWhich choice completes the text with the most\nlogical transition?\nA) Still,\nB) Therefore,\nC) Indeed,\nD) Furthermore,", "generated": [{"id": "27.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The city offered abundant commissions and access to famous teachers. _______ the young painter felt that her artistic development required a return to the landscape of her childhood.\n\nWhich choice completes the text with the most logical transition?\n\nA) Indeed,\nB) Still,\nC) Therefore,\nD) Furthermore,", "answer": "B", "explanation": "Still introduces a contrast."}, {"id": "27.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The archive was modern, well funded, and easy to use. _______ the historian preferred the smaller provincial library, whose uncataloged letters were essential to her project.\n\nWhich choice completes the text with the most logical transition?\n\nA) Still,\nB) Therefore,\nC) Indeed,\nD) Furthermore,", "answer": "A", "explanation": "Still marks contrast with expectation."}, {"id": "27.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The internship promised excellent training and professional contacts. _______ the student declined it because the work did not match her research goals.\n\nWhich choice completes the text with the most logical transition?\n\nA) Furthermore,\nB) Therefore,\nC) Still,\nD) Indeed,", "answer": "C", "explanation": "Still introduces an unexpected contrast."}, {"id": "27.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The festival was prestigious and attracted large audiences. _______ the composer chose a modest community venue for the premiere.\n\nWhich choice completes the text with the most logical transition?\n\nA) Furthermore,\nB) Still,\nC) Therefore,\nD) Indeed,", "answer": "B", "explanation": "Still signals contrast."}, {"id": "27.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The mountain town had few galleries or critics. _______ the artist believed it offered the solitude she needed.\n\nWhich choice completes the text with the most logical transition?\n\nA) Furthermore,\nB) Indeed,\nC) Therefore,\nD) Still,", "answer": "D", "explanation": "Still contrasts limitations with preference."}]}, {"n": 28, "concept": "Transition: specific treaty effect", "original": "In 1974, Mexican chemist Mario Molina and\nUS chemist F. Sherwood Rowland discovered that\nchemicals called CFCs were harmful to the ozone\nlayer. Their research was extremely influential in the\nfight against CFCs. _______ it laid the foundation\nfor a 1987 treaty that phased out the use of CFCs\nacross the globe.\nWhich choice completes the text with the most\nlogical transition?\nA) Regardless,\nB) Specifically,\nC) However,\nD) Earlier,", "generated": [{"id": "28.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The model did more than identify the ancient river's location. _______ it showed how seasonal floods deposited the layers of silt found across the valley.\n\nWhich choice completes the text with the most logical transition?\n\nA) Admittedly,\nB) However,\nC) Specifically,\nD) Hence,", "answer": "C", "explanation": "Specifically introduces the precise mechanism."}, {"id": "28.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The experiment revealed that the coating reduced heat loss. _______ it demonstrated that microscopic air pockets slowed the transfer of energy.\n\nWhich choice completes the text with the most logical transition?\n\nA) In contrast,\nB) Specifically,\nC) Hence,\nD) Nevertheless,", "answer": "B", "explanation": "Specifically gives the detailed explanation."}, {"id": "28.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The survey showed that the garden attracted more pollinators. _______ it recorded large increases in native bees during spring and early summer.\n\nWhich choice completes the text with the most logical transition?\n\nA) Specifically,\nB) However,\nC) Hence,\nD) Admittedly,", "answer": "A", "explanation": "Specifically narrows to an exact finding."}, {"id": "28.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The simulation explained why the coastline eroded so quickly. _______ it traced how waves redirected sand away from the beach after the pier was built.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Admittedly,\nC) Specifically,\nD) Hence,", "answer": "C", "explanation": "Specifically adds the mechanism."}, {"id": "28.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The analysis clarified how the mural was restored. _______ it identified the pigments that conservators matched when replacing damaged sections.\n\nWhich choice completes the text with the most logical transition?\n\nA) Admittedly,\nB) Hence,\nC) Nevertheless,\nD) Specifically,", "answer": "D", "explanation": "Specifically introduces detail."}]}, {"n": 29, "concept": "Transition: indeed reinforces whimsical experience", "original": "With his room-sized installation Unicorn/My Private\nSky, Norwegian artist Børre Sæthre succeeds in\ncreating a whimsical yet perplexing experience.\n_______ when visitors set foot inside the fantastically\nblue room and encounter the life-sized stuffed\nunicorn preening at the far end of it, they are both\ndazzled and confused—as if stepping into a strange\nand enchanting new world.\nWhich choice completes the text with the most\nlogical transition?\nA) Second,\nB) Instead,\nC) Indeed,\nD) Nevertheless,", "generated": [{"id": "29.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The installation initially seems playful and simple. _______ the longer visitors remain inside it, the more its odd scale and unexpected sounds make the room feel unsettling.\n\nWhich choice completes the text with the most logical transition?\n\nA) Second,\nB) Nevertheless,\nC) Instead,\nD) Indeed,", "answer": "D", "explanation": "Indeed reinforces the previous description."}, {"id": "29.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The new plaza has become a lively gathering place. _______ on warm evenings, musicians, vendors, and families fill nearly every corner.\n\nWhich choice completes the text with the most logical transition?\n\nA) Second,\nB) Nevertheless,\nC) Indeed,\nD) Instead,", "answer": "C", "explanation": "Indeed provides confirming detail."}, {"id": "29.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The novel is unusually attentive to small gestures. _______ entire chapters turn on pauses, glances, and barely audible replies.\n\nWhich choice completes the text with the most logical transition?\n\nA) Second,\nB) Indeed,\nC) Nevertheless,\nD) Instead,", "answer": "B", "explanation": "Indeed emphasizes the claim."}, {"id": "29.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The restoration revealed that the wall painting was more elaborate than expected. _______ conservators uncovered several layers of decorative borders beneath the whitewash.\n\nWhich choice completes the text with the most logical transition?\n\nA) Indeed,\nB) Second,\nC) Instead,\nD) Nevertheless,", "answer": "A", "explanation": "Indeed introduces evidence."}, {"id": "29.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The performance is both comic and unnerving. _______ audiences often laugh at the opening scene and then fall silent as the same joke darkens.\n\nWhich choice completes the text with the most logical transition?\n\nA) Instead,\nB) Second,\nC) Nevertheless,\nD) Indeed,", "answer": "D", "explanation": "Indeed supports the claim."}]}, {"n": 30, "concept": "Student Notes: emphasize distance covered", "original": "While researching a topic, a student has taken the\nfollowing notes:\n• The Philadelphia and Lancaster Turnpike was a\nroad built between 1792 and 1794.\n• It was the first private turnpike in the\nUnited States.\n• It connected the cities of Philadelphia and\nLancaster in the state of Pennsylvania.\n• It was sixty-two miles long.\nThe student wants to emphasize the distance covered\nby the Philadelphia and Lancaster Turnpike. Which\nchoice most effectively uses relevant information\nfrom the notes to accomplish this goal?\nA) The sixty-two-mile-long Philadelphia and\nLancaster Turnpike connected the Pennsylvania\ncities of Philadelphia and Lancaster.\nB) The Philadelphia and Lancaster Turnpike was\nthe first private turnpike in the United States.\nC) The Philadelphia and Lancaster Turnpike, which\nconnected two Pennsylvania cities, was built\nbetween 1792 and 1794.\nD) A historic Pennsylvania road, the Philadelphia\nand Lancaster Turnpike was completed in 1794.", "generated": [{"id": "30.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Aya Mori collected hundreds of plant samples.\nB) Fern A and Moss B were collected in different years.\nC) Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.\nD) Mori also collected Moss B from River Nami.", "answer": "C", "explanation": "The answer emphasizes the target sample."}, {"id": "30.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.\nB) Ortega collected many mineral samples.\nC) Cerro Azul and Valle Seco are different sites.\nD) Quartz was collected from Valle Seco.", "answer": "A", "explanation": "The answer focuses on the target sample."}, {"id": "30.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Fucus alba was collected from Stone Harbor.\nB) Both samples were collected in 1980.\nC) Lee cataloged more than one algae species.\nD) Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "answer": "D", "explanation": "The answer emphasizes the selected sample."}, {"id": "30.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Species M came from Lake Plain.\nB) One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.\nC) The Cedar Ridge and Lake Plain specimens were collected in different years.\nD) Singh collected beetles in multiple locations.", "answer": "B", "explanation": "The answer centers the target specimen."}, {"id": "30.5", d in birds but not in\nlizards.\nB) After they obtained data for over 3,900 lizard\nspecies, researchers determined that larger clutch\nsize was associated with environments in higher\nlatitudes that have more seasonal change.\nC) We now know that lizards in higher-latitude\nenvironments may lay larger clutches to take\nadvantage of shorter windows of favorable\nconditions.\nD) Researchers obtained clutch-size and habitat\ndata for over 3,900 lizard species and analyzed\nthe data with statistical models.", "generated": [{"id": "32.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.\nB) Mori also collected Moss B from River Nami.\nC) Aya Mori collected hundreds of plant samples.\nD) Fern A and Moss B were collected in different years.", "answer": "A", "explanation": "The answer emphasizes the target sample."}, {"id": "32.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to em  from the notes to accomplish this goal?\n\nA) The Cedar Ridge and Lake Plain specimens were collected in different years.\nB) Singh collected beetles in multiple locations.\nC) One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.\nD) Species M came from Lake Plain.", "answer": "C", "explanation": "The answer centers the target specimen."}, {"id": "32.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Cloud Peak and Green Valley were both collection sites.\nB) Ramos collected approximately 700 specimens.\nC) Ramos collected Fern Y the following year.\nD) Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "answer": "D", "explanation": "The answer emphasizes the target sample."}]}, {"n": 33, "concept": "Student Notes: generalize study type", "original": "While researching a topic, a student has taken the\nfollowing notes:\n• British musicians John Lennon and\nPaul McCartney shared writing credit for\nnumerous Beatles songs.\n• Many Lennon-McCartney songs were actually\nwritten by either Lennon or McCartney, not by\nboth.\n• The exact authorship of specific parts of many\nBeatles songs, such as the verse for “In My Life,” is\ndisputed.\n• Mark Glickman, Jason Brown, and Ryan Song\nused statistical methods to analyze the musical\ncontent of Beatles songs.\n• They concluded that there is 18.9% probability\nthat McCartney wrote the verse for “In My Life,”\nstating that the verse is “consistent with Lennon’s\nsongwriting style.”\nThe student wants to make a generalization about the\nkind of study conducted by Glickman, Brown, and\nSong. Which choice most effectively uses relevant\ninformation from the notes to accomplish this goal?\nA) Based on statistical analysis, Glickman, Brown,\nand Song claim that John Lennon wrote the\nverse of “In My Life.”\nB) There is only an 18.9% probability that\nPaul McCartney wrote the verse for “In My Life”;\nJohn Lennon is the more likely author.\nC) It is likely that John Lennon, not\nPaul McCartney, wrote the verse for “In My\nLife.”\nD) Researchers have used statistical methods to\naddress questions of authorship within the field\nof music.", "generated": [{"id": "33.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Sealed documents could cause major harm if released.\nB) Budget drafts are one kind of government document.\nC) Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.\nD) The records office classifies documents by release risk.", "answer": "C", "explanation": "The answer applies the classification rule."}, {"id": "33.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Diluted cleaner is handled in a lab.\nB) The lab uses hazard categories for materials.\nC) Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution.\nD) Danger materials can cause severe injury.", "answer": "C", "explanation": "The answer uses the correct category."}, {"id": "33.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Nineteenth-century pamphlets are historical documents.\nB) Restricted manuscripts cannot be handled by readers.\nC) The library classifies manuscripts by fragility.\nD) Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers.", "answer": "D", "explanation": "The answer applies the definitions."}, {"id": "33.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Coastal storms can affect travel.\nB) Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.\nC) The agency classifies storms by expected impact.\nD) Emergency storms cause widespread damage.", "answer": "B", "explanation": "The answer identifies the category."}, {"id": "33.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Most ceramic replicas are classified as Supervised because ordinary handling could damage them.\nB) Restricted objects could be seriously damaged by brief exposure.\nC) Museum loans are classified by security risk.\nD) Ceramic replicas may be used in educational displays.", "answer": "A", "explanation": "The answer applies the classification."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
