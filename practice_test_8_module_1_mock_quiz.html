entists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It proves that drought has no effect on plants.\nB) It gives a historical overview of plant classification.\nC) It lists the materials used in the experiment.\nD) It introduces a gap in knowledge that the experiment examines.", "answer": "D", "explanation": "The sentence identifies an unresolved issue."}, {"id": "9.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It introduces an unrelated theme.\nB) It summarizes the novel's publication history.\nC) It raises a difficulty with a common interpretation.\nD) It provides biographical information about the novelist.", "answer": "C", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "9.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It gives a personal anecdote about engineers.\nB) It explains the limitation that the new system is meant to address.\nC) It compares underwater vehicles with aircraft.\nD) It announces that the technology is already flawless.", "answer": "B", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 10, "concept": "Reading Detail: fossil outside Laurussia", "original": "For many years, the only existing fossil evidence of\nmixopterid eurypterids—an extinct family of large\naquatic arthropods known as sea scorpions and\nrelated to modern arachnids and horseshoe\ncrabs—came from four species living on the\npaleocontinent of Laurussia. In a discovery that\nexpands our understanding of the geographical\ndistribution of mixopterids, paleontologist Bo Wang\nand others have identified fossilized remains of a new\nmixopterid species, Terropterus xiushanensis, that\nlived over 400 million years ago on the\npaleocontinent of Gondwana.\nAccording to the text, why was Wang and his\nteam’s discovery of the Terropterus xiushanensis\nfossil significant?\nA) The fossil constitutes the first evidence found\nby scientists that mixopterids lived more than\n400 million years ago.\nB) The fossil helps establish that mixopterids are\nmore closely related to modern arachnids and\nhorseshoe crabs than previously thought.\nC) The fossil helps establish a more accurate\ntimeline of the evolution of mixopterids on the\npaleocontinents of Laurussia and Gondwana.\nD) The fossil constitutes the first evidence found by\nscientists that mixopterids existed outside the\npaleocontinent of Laurussia.", "generated": [{"id": "10.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice is best supported by the text?\n\nA) She is admired mainly for her wealth.\nB) She shows unusual maturity and self-command.\nC) She lacks affection for her family.\nD) She refuses to give advice to others.", "answer": "B", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "10.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice is best supported by the text?\n\nA) The grandmother avoids family matters entirely.\nB) The narrator thinks patience is useless.\nC) The grandmother's influence is quiet but substantial.\nD) The family ignores the grandmother's opinions.", "answer": "C", "explanation": "The family respects her careful judgment."}, {"id": "10.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice is best supported by the text?\n\nA) The clerk's carefulness is valuable despite being inconvenient.\nB) The clerk intentionally creates errors.\nC) The coworkers are more accurate than the clerk.\nD) The business fails because of excessive caution.", "answer": "A", "explanation": "The passage praises his precision."}, {"id": "10.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice is best supported by the text?\n\nA) The leader dislikes public meetings.\nB) The leader values inclusive deliberation.\nC) The leader makes decisions without hearing others.\nD) The leader is unable to reach conclusions.", "answer": "B", "explanation": "The evidence shows patience and inclusion."}, {"id": "10.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice is best supported by the text?\n\nA) She rejects all imaginative thinking.\nB) She publishes claims before testing them.\nC) She avoids working with students.\nD) She combines intellectual openness with rigorous standards.", "answer": "D", "explanation": "The contrast shows openness and rigor."}]}, {"n": 11, "concept": "Quantitative Evidence: games from 1995-1999", "original": "Video Game Availability by Initial Release Years\nInitial release years Percentage of games still available\n1975–1979 0.89\n1980–1984 3.65\n1985–1989 15.38\n1990–1994 19.33\n1995–1999 14.22\nIn a recent study, researchers found that relatively\nfew video games released over the decades remain\navailable today. For example, only 14.22 percent of\ngames are still available that were initially released\nin _______\nWhich choice most effectively uses data from the\ntable to complete the statement?\nA) 2000–2004.\nB) 1995–1999.\nC) 1970–1974.\nD) 1985–1989.", "generated": [{"id": "11.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's speeches are preserved in several archives.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "B", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "11.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nB) Some farmers grew vegetables, while others grew grain.\nC) The southern region was included in the survey.\nD) The graph contains information about three regions.", "answer": "A", "explanation": "The answer uses a specific contrast in the data."}, {"id": "11.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) One rocky planet has a thin atmosphere.\nB) The method used to study stars requires a telescope.\nC) Some stars contain hydrogen and helium.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "11.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nB) Some songs use a meter also found in older European poetry.\nC) The tradition is studied by scholars in several countries.\nD) Many performers learned songs from relatives.", "answer": "A", "explanation": "Recent blended features support cultural exchange."}, {"id": "11.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Both towns had some volunteers.\nB) The table includes more than one year.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) The program took place in a community.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 12, "concept": "Quantitative Evidence: fish depth range", "original": "Depths at Which Four Deep-Sea Fish Species Live\nDepth below the\nSpecies ocean surface\nFootballfish 200–1,000 meters\nSouthern stoplight loosejaw 500–2,000 meters\nBlack seadevil 250–2,000 meters\nBollons’ rattail 300–800 meters\nSome oceanic fish species live very deep underwater.\nResearchers collected data about the depths at which\nvarious species live.\nBased on the information in the table, at what depth\ndoes the southern stoplight loosejaw live?\nA) More than 2,000 meters below the surface\nB) 150 to 400 meters below the surface\nC) 500 to 2,000 meters below the surface\nD) 250 to 500 meters below the surface", "generated": [{"id": "12.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "12.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The graph contains information about three regions.\nB) Some farmers grew vegetables, while others grew grain.\nC) The southern region was included in the survey.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "12.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) One rocky planet has a thin atmosphere.\nB) The method used to study stars requires a telescope.\nC) Some stars contain hydrogen and helium.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "12.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) Many performers learned songs from relatives.\nD) Some songs use a meter also found in older European poetry.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "12.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) Both towns had some volunteers.\nC) The table includes more than one year.\nD) The program took place in a community.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 13, "concept": "Quantitative Evidence: highest housing starts", "original": "Housing Starts in the US, January–April 2022\n(in thousands)\nMonth Housing starts\nJanuary 1,669\nFebruary 1,771\nMarch 1,713\nApril 1,803\nWhen construction of a single-family house begins, it\nis called a housing start. In the first four months of\n2022, the highest number of housing starts in the\nUnited States was in _____\nWhich choice most effectively uses data from the\ntable to complete the statement?\nA) April.\nB) March.\nC) January.\nD) February.", "generated": [{"id": "13.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "13.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some farmers grew vegetables, while others grew grain.\nB) The southern region was included in the survey.\nC) The graph contains information about three regions.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "13.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The method used to study stars requires a telescope.\nB) Some stars contain hydrogen and helium.\nC) One rocky planet has a thin atmosphere.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "13.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Many performers learned songs from relatives.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) The tradition is studied by scholars in several countries.\nD) Some songs use a meter also found in older European poetry.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "13.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The table includes more than one year.\nB) The program took place in a community.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) Both towns had some volunteers.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 14, "concept": "Command of Evidence: ethnographic value of photographs", "original": "Born in 1891 to a Quechua-speaking family in the\nAndes Mountains of Peru, Martín Chambi is today\nconsidered to be one of the most renowned figures of\nLatin American photography. In a paper for an art\nhistory class, a student claims that Chambi’s\nphotographs have considerable ethnographic\nvalue—in his work, Chambi was able to capture\ndiverse elements of Peruvian society, representing his\nsubjects with both dignity and authenticity.\nWhich finding, if true, would most directly support\nthe student’s claim?\nA) Chambi took many commissioned portraits of\nwealthy Peruvians, but he also produced\nhundreds of images carefully documenting the\npeoples, sites, and customs of Indigenous\ncommunities of the Andes.\nB) Chambi’s photographs demonstrate a high level\nof technical skill, as seen in his strategic use of\nillumination to create dramatic light and shadow\ncontrasts.\nC) During his lifetime, Chambi was known and\ncelebrated both within and outside his native\nPeru, as his work was published in places like\nArgentina, Spain, and Mexico.\nD) Some of the peoples and places Chambi\nphotographed had long been popular subjects\nfor Peruvian photographers.", "generated": [{"id": "14.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "14.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some farmers grew vegetables, while others grew grain.\nB) The graph contains information about three regions.\nC) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nD) The southern region was included in the survey.", "answer": "C", "explanation": "The answer uses a specific contrast in the data."}, {"id": "14.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some stars contain hydrogen and helium.\nB) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nC) The method used to study stars requires a telescope.\nD) One rocky planet has a thin atmosphere.", "answer": "B", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "14.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Many performers learned songs from relatives.\nB) The tradition is studied by scholars in several countries.\nC) Some songs use a meter also found in older European poetry.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "14.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The program took place in a community.\nB) The table includes more than one year.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) Both towns had some volunteers.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 15, "concept": "Command of Evidence: shark decline increases rays", "original": "Researchers hypothesized that a decline in the\npopulation of dusky sharks near the mid-Atlantic\ncoast of North America led to a decline in the\npopulation of eastern oysters in the region. Dusky\nsharks do not typically consume eastern oysters but\ndo consume cownose rays, which are the main\npredators of the oysters.\nWhich finding, if true, would most directly support\nthe researchers’ hypothesis?\nA) Declines in the regional abundance of dusky\nsharks’ prey other than cownose rays are\nassociated with regional declines in dusky shark\nabundance.\nB) Eastern oyster abundance tends to be greater in\nareas with both dusky sharks and cownose rays\nthan in areas with only dusky sharks.\nC) Consumption of eastern oysters by cownose rays\nin the region substantially increased before the\nregional decline in dusky shark abundance\nbegan.\nD) Cownose rays have increased in regional\nabundance as dusky sharks have decreased in\nregional abundance.", "generated": [{"id": "15.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader's symbolic role in the bi s a telescope.\nB) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nC) Some stars contain hydrogen and helium.\nD) One rocky planet has a thin atmosphere.", "answer": "B", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "15.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Many performers learned songs from relatives.\nB) Some songs use a meter also found in older European poetry.\nC) The tradition is studied by scholars in several countries.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "15.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) The program took place in a community.\nC) The table includes more than one year.\nD) Both towns had some volunteers.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 16, "concept": "Command of Evidence: roots dissolve rock", "original": "In the mountains of Brazil, Barbacenia tomentosa\nand Barbacenia macrantha—two plants in the\nVelloziaceae family—establish themselves on soilless,\nnutrient-poor patches of quartzite rock. Plant\necologists Anna Abrahão and Patricia de Britto Costa\nused microscopic analysis to determine that the roots\nof B. tomentosa and B. macrantha, which grow\ndirectly into the quartzite, have clusters of fine hairs\nnear the root tip; further analysis indicated that these\nhairs secrete both malic and citric acids. The\nresearchers hypothesize that the plants depend on\ndissolving underlying rock with these acids, as the\nprocess not only creates channels for continued\ngrowth but also releases phosphates that provide the\nvital nutrient phosphorus.\nWhich finding, if true, would most directly support\nthe researchers’ hypothesis?\nA) Other species in the Velloziaceae family are\nfound in terrains with more soil but have root\nstructures similar to those of B. tomentosa and\nB. macrantha.\nB) Though B. tomentosa and B. macrantha both\nsecrete citric and malic acids, each species\nproduces the acids in different proportions.\nC) The roots of B. tomentosa and B. macrantha\ncarve new entry points into rocks even when\ncracks in the surface are readily available.\nD) B. tomentosa and B. macrantha thrive even when\ntransferred to the surfaces of rocks that do not\ncontain phosphates.", "generated": [{"id": "16.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader signed several decrees during his first month in office.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "16.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The southern region was included in the survey.\nB) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nC) The graph contains information about three regions.\nD) Some farmers grew vegetables, while others grew grain.", "answer": "B", "explanation": "The answer uses a specific contrast in the data."}, {"id": "16.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some stars contain hydrogen and helium.\nB) One rocky planet has a thin atmosphere.\nC) The method used to study stars requires a telescope.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "16.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) Many performers learned songs from relatives.\nD) The tradition is studied by scholars in several countries.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "16.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The program took place in a community.\nB) The table includes more than one year.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) Both towns had some volunteers.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 17, "concept": "Logical Completion: target Or31 receptor", "original": "Many mosquito repellents contain natural\ncomponents that work by activating multiple odor\nreceptors on mosquitoes’ antennae. As the insects\ndevelop resistance, new repellents are needed.\nKe Dong and her team found that EBF, a molecular\ncomponent of a chrysanthemum-flower extract, can\nrepel mosquitoes by activating just one odor\nreceptor—and this receptor, Or31, is present in all\nmosquito species known to carry diseases. Therefore,\nthe researchers suggest that in developing new\nrepellents, it would be most useful to _______\nWhich choice most logically completes the text?\nA) identify molecular components similar to EBF\nthat target the activation of Or31 receptors.\nB) investigate alternative methods for extracting\nEBF molecules from chrysanthemums.\nC) verify the precise locations of Or31 and other\nodor receptors on mosquitoes’ antennae.\nD) determine the maximum number of different\nodor receptors that can be activated by a single\nmolecule.", "generated": [{"id": "17.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the island populations were domesticated before mainland populations.\nB) all island plants descended from a single cultivated variety.\nC) human traders must have transported the seeds recently.\nD) the plant probably reached the islands without human assistance.", "answer": "D", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "17.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the island beetles must be younger than the coastal beetles.\nB) humans carried the beetles to the island during early trade voyages.\nC) the beetles were domesticated by island communities.\nD) the beetles were likely introduced by natural dispersal rather than by humans.", "answer": "D", "explanation": "The timing rules out human introduction."}, {"id": "17.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the song was probably not introduced to the archipelago by that migration.\nB) all versions of the song are identical.\nC) the song could not have changed after the migration.\nD) the migration must have begun earlier than any other human movement.", "answer": "A", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "17.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) the crop was first domesticated on the island.\nB) human settlement probably did not account for the plant's original arrival on the island.\nC) mainland farmers acquired the crop from island communities.\nD) the island variety must be genetically identical to wild mainland plants.", "answer": "B", "explanation": "The plant's arrival predates human settlement."}, {"id": "17.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the lakes did not contain snails until boating began.\nB) boats probably explain every modern snail population.\nC) the snails likely spread through an earlier nonhuman mechanism.\nD) human activity made the populations genetically identical.", "answer": "C", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 18, "concept": "Logical Completion: dishonest signal in tanagers", "original": "Birds of many species ingest foods containing\ncarotenoids, pigmented molecules that are converted\ninto feather coloration. Coloration tends to be\nespecially saturated in male birds’ feathers, and\nbecause carotenoids also confer health benefits,\nthe deeply saturated colors generally serve to\ncommunicate what is known as an honest signal of\na bird’s overall fitness to potential mates. However,\nornithologist Allison J. Shultz and others have found\nthat males in several species of the tanager genus\nRamphocelus use microstructures in their feathers to\nmanipulate light, creating the appearance of deeper\nsaturation without the birds necessarily having to\nmaintain a carotenoid-rich diet. These findings\nsuggest that _______\nWhich choice most logically completes the text?\nA) individual male tanagers can engage in honest\nsignaling without relying on carotenoid\nconsumption.\nB) feather microstructures may be less effective\nthan deeply saturated feathers for signaling\noverall fitness.\nC) scientists have yet to determine why tanagers\nhave a preference for mates with colorful\nappearances.\nD) a male tanager’s appearance may function as\na dishonest signal of the individual’s overall\nfitness.", "generated": [{"id": "18.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) all island plants descended from a single cultivated variety.\nB) human traders must have transported the seeds recently.\nC) the island populations were domesticated before mainland populations.\nD) the plant probably reached the islands without human assistance.", "answer": "D", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "18.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the island beetles must be younger than the coastal beetles.\nB) the beetles were domesticated by island communities.\nC) the beetles were likely introduced by natural dispersal rather than by humans.\nD) humans carried the beetles to the island during early trade voyages.", "answer": "C", "explanation": "The timing rules out human introduction."}, {"id": "18.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) all versions of the song are identical.\nB) the song was probably not introduced to the archipelago by that migration.\nC) the song could not have changed after the migration.\nD) the migration must have begun earlier than any other human movement.", "answer": "B", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "18.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) the crop was first domesticated on the island.\nB) human settlement probably did not account for the plant's original arrival on the island.\nC) the island variety must be genetically identical to wild mainland plants.\nD) mainland farmers acquired the crop from island communities.", "answer": "B", "explanation": "The plant's arrival predates human settlement."}, {"id": "18.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the snails likely spread through an earlier nonhuman mechanism.\nB) boats probably explain every modern snail population.\nC) human activity made the populations genetically identical.\nD) the lakes did not contain snails until boating began.", "answer": "A", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 19, "concept": "Grammar: present perfect singular has been", "original": "When writing The Other Black Girl (2021), novelist\nZakiya Dalila Harris drew on her own experiences\nworking at a publishing office. The award-winning\nbook is Harris’s first novel, but her writing _______\nhonored before. At the age of twelve, she entered a\ncontest to have a story published in American Girl\nmagazine—and won.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) were\nB) have been\nC) has been\nD) are", "generated": [{"id": "19.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) publishing\nC) having published\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "19.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device:\nB) device,\nC) device\nD) device--", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "19.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) it\nC) that\nD) this", "answer": "A", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "19.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family,\nB) family and\nC) family\nD) family, and", "answer": "C", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "19.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free in part because\nB) free. In part because\nC) free, in part because:\nD) free, in part because,", "answer": "B", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 20, "concept": "Grammar: create after would", "original": "In order to prevent nonnative fish species from\nmoving freely between the Mediterranean and Red\nSeas, marine biologist Bella Galil has proposed that a\nsaline lock system be installed along the Suez Canal\nin Egypt’s Great Bitter Lakes. The lock would\nincrease the salinity of the lakes and _______ a\nnatural barrier of water most marine creatures would\nbe unable to cross.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) creates\nB) create\nC) creating\nD) created", "generated": [{"id": "20.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) having published\nC) publishing\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "20.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device,\nB) device:\nC) device\nD) device--", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "20.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) it\nC) this\nD) that", "answer": "A", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "20.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family, and\nB) family\nC) family,\nD) family and", "answer": "B", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "20.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free in part because\nC) free. In part because\nD) free, in part because,", "answer": "C", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 21, "concept": "Grammar: plural artists appositive punctuation", "original": "Paintings by the renowned twentieth-century\nUS _______ were featured in Artist to Artist, an\nexhibition at the Smithsonian Art Museum that\npaired the works of artists whose career trajectories\nintersected in meaningful ways.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) artists: Thomas Hart Benton and Jackson\nPollock,\nB) artists Thomas Hart Benton and Jackson Pollock\nC) artists Thomas Hart Benton, and Jackson\nPollock,\nD) artists, Thomas Hart Benton and Jackson\nPollock", "generated": [{"id": "21.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) having published\nB) publishing\nC) to publish\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "21.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device\nB) device,\nC) device:\nD) device--", "answer": "A", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "21.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) it\nB) them\nC) that\nD) this", "answer": "B", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "21.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family, and\nB) family and\nC) family\nD) family,", "answer": "C", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "21.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free, in part because,\nC) free, in part because:\nD) free in part because", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 22, "concept": "Grammar: interrupter though with commas", "original": "In 1943, in the midst of World War II, mathematics\nprofessor Grace Hopper was recruited by the\nUS military to help the war effort by solving complex\nequations. Hopper’s subsequent career would involve\nmore than just _______ as a pioneering computer\nprogrammer, Hopper would help usher in the digital\nage.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) equations, though:\nB) equations, though,\nC) equations. Though,\nD) equations though", "generated": [{"id": "22.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) publishing\nC) published\nD) having published", "answer": "C", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "22.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device:\nB) device,\nC) device--\nD) device", "answer": "D", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "22.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) that\nB) this\nC) them\nD) it", "answer": "C", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "22.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family\nC) family,\nD) family, and", "answer": "B", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "22.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free in part because\nC) free, in part because,\nD) free, in part because:", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 23, "concept": "Grammar: plural accomplishments point", "original": "Increased gender diversity is revitalizing the field of\neconomics, according to Harvard’s Claudia Goldin.\nThe trailblazing accomplishments of Goldin, winner\nof the 2023 Nobel Prize in Economics for her work\non women in the labor force, _______ to the value of\nscholars of diverse backgrounds in spurring research\ninto previously unexplored, but vitally important,\ntopics.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) attests\nB) has attested\nC) is attesting\nD) attest", "generated": [{"id": "23.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) published\nB) publishing\nC) having published\nD) to publish", "answer": "A", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "23.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars e
