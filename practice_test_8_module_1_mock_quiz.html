  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: historically important figure", "original": "As Mexico’s first president from an Indigenous\ncommunity, Benito Juarez became one of the most\n______ figures in his country’s history: among the\nmany significant accomplishments of his long tenure\nin office (1858–1872), Juarez consolidated the\nauthority of the national government and advanced\nthe rights of Indigenous peoples.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) unpredictable\nB) important\nC) secretive\nD) ordinary", "generated": [{"id": "1.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Because the jurist expanded voting rights and helped stabilize the republic after years of crisis, historians regard her as one of the most _______ figures in the country's constitutional history.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) consequential\nB) secretive\nC) ordinary\nD) unpredictable", "answer": "A", "explanation": "Consequential means important."}, {"id": "1.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The engineer's bridge designs transformed transportation across the region, making him an _______ figure in the history of public infrastructure.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) irrelevant\nB) anonymous\nC) influential\nD) erratic", "answer": "C", "explanation": "Influential means important because of effect."}, {"id": "1.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The minister's education reforms were so widely adopted that she became a _______ figure in the development of modern public schools.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) minor\nB) incidental\nC) secretive\nD) prominent", "answer": "D", "explanation": "Prominent means important or well known."}, {"id": "1.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The poet's work reshaped the national literary tradition, so critics describe her as _______ rather than merely popular in her own time.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) ordinary\nB) seminal\nC) hidden\nD) unpredictable", "answer": "B", "explanation": "Seminal means highly influential."}, {"id": "1.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The judge's decisions altered civil rights law for decades, securing her place as a _______ figure in legal history.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) private\nB) obscure\nC) pivotal\nD) ordinary", "answer": "C", "explanation": "Pivotal means centrally important."}]}, {"n": 2, "concept": "Words in Context: substantial biological effect", "original": "Mônica Lopes-Ferreira and others at Brazil’s\nButantan Institute are studying the freshwater\nstingray species Potamotrygon rex to determine\nwhether biological characteristics such as the rays'\nage and sex have _______ effect on the toxicity of\ntheir venom—that is, to see if differences in these\ntraits are associated with considerable variations in\nvenom potency.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) a disconcerting\nB) an acceptable\nC) an imperceptible\nD) a substantial", "generated": [{"id": "2.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The researchers tested whether soil acidity had _______ effect on seed germination, since even small chemical differences can alter how quickly roots emerge.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a decorative\nB) a measurable\nC) an imperceptible\nD) an acceptable", "answer": "B", "explanation": "Measurable means detectably significant."}, {"id": "2.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The study asks whether sleep duration has _______ effect on memory consolidation or whether the apparent relationship disappears after stress is controlled.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) an unrelated\nB) a symbolic\nC) a substantial\nD) a trivial", "answer": "C", "explanation": "Substantial means considerable."}, {"id": "2.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Marine biologists examined whether water temperature has _______ influence on coral recovery after bleaching events.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a significant\nB) a temporary\nC) an acceptable\nD) an invisible", "answer": "A", "explanation": "Significant means important or substantial."}, {"id": "2.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The team wanted to know whether the coating would have _______ effect on heat loss in older buildings.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a considerable\nB) an imperceptible\nC) an unrelated\nD) a hidden", "answer": "A", "explanation": "Considerable means substantial."}, {"id": "2.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Economists tested whether transit access had _______ effect on employment rates in neighborhoods far from city centers.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a negligible\nB) an acceptable\nC) a decorative\nD) a pronounced", "answer": "D", "explanation": "Pronounced means clearly noticeable."}]}, {"n": 3, "concept": "Words in Context: tranquil environment", "original": "Kelp forests grow underwater along the eastern\nPacific Coast. These underwater forests are\nimportant to fish and other marine animals. Ocean\ncurrents can be powerful and rough, making it\ndifficult for animals to find safe places to hide from\npredators. The underwater forests slow down the\ncurrents. This creates a more _______ environment\nwith calmer waters where animals can take shelter.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) tranquil\nB) dangerous\nC) imaginative\nD) surprising", "generated": [{"id": "3.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The windbreaks slowed the gusts that usually swept across the field, creating a more _______ area where young plants could grow without being damaged.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) sheltered\nB) imaginative\nC) dangerous\nD) surprising", "answer": "A", "explanation": "Sheltered fits a calmer environment."}, {"id": "3.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The library's thick walls and shaded courtyard make the reading room unusually _______ even during the crowded afternoon hours.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unexpected\nB) tranquil\nC) inventive\nD) hazardous", "answer": "B", "explanation": "Tranquil means calm."}, {"id": "3.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Mangrove roots reduce wave energy along the shore, producing a _______ habitat where juvenile fish can avoid strong currents.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unstable\nB) dangerous\nC) dramatic\nD) calm", "answer": "D", "explanation": "Calm means tranquil."}, {"id": "3.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The curtains absorbed street noise and softened the light, making the studio feel _______ despite its location above a busy market.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) dangerous\nB) imaginative\nC) serene\nD) strange", "answer": "C", "explanation": "Serene means peaceful."}, {"id": "3.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The reef breaks the force of the surf, forming a _______ lagoon in which smaller organisms can feed and shelter.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) placid\nB) surprising\nC) dangerous\nD) ornate", "answer": "A", "explanation": "Placid means calm."}]}, {"n": 4, "concept": "Words in Context: collaboration between writers", "original": "The Mule Bone, a 1930 play written by Zora Neale\nHurston and Langston Hughes, is perhaps the\nbest-known of the few examples of ______ in\nliterature. Most writers prefer working alone, and\ngiven that working together cost Hurston and\nHughes their friendship, it is not hard to see why.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) characterization\nB) interpretation\nC) collaboration\nD) commercialization", "generated": [{"id": "4.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The film is a rare example of artistic _______: two directors wrote every scene together and shared responsibility for editing the final cut.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) interpretation\nB) commercialization\nC) collaboration\nD) characterization", "answer": "C", "explanation": "Collaboration means working together."}, {"id": "4.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The mural resulted from a close _______ between neighborhood residents and professional artists, each group shaping the final design.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) partnership\nB) characterization\nC) isolation\nD) interpretation", "answer": "A", "explanation": "Partnership means collaboration."}, {"id": "4.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The opera's score reflects unusual _______: the composer invited three poets to revise the libretto throughout rehearsals.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) commercialization\nB) cooperation\nC) characterization\nD) interpretation", "answer": "B", "explanation": "Cooperation means collaborative work."}, {"id": "4.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Although most mathematicians publish individually, this proof emerged from a sustained _______ among researchers in four countries.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) interpretation\nB) characterization\nC) commercialization\nD) collaboration", "answer": "D", "explanation": "Collaboration is joint work."}, {"id": "4.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The anthology was produced through editorial _______; each translator commented on the others' drafts before publication.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) secrecy\nB) teamwork\nC) interpretation\nD) commercialization", "answer": "B", "explanation": "Teamwork means collaboration."}]}, {"n": 5, "concept": "Words in Context: extensive contributions", "original": "Ofelia Zepeda’s contributions to the field of\nlinguistics are _______: her many accomplishments\ninclude working as a linguistics professor and\nbilingual poet, authoring the first Tohono O’odham\ngrammar book, and co-founding the American\nIndian Language Development Institute.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) pragmatic\nB) controversial\nC) extensive\nD) universal", "generated": [{"id": "5.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The scholar's influence is _______: she edited three journals, trained dozens of researchers, and published major books in two fields.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) pragmatic\nB) far-reaching\nC) controversial\nD) universal", "answer": "B", "explanation": "Far-reaching means extensive."}, {"id": "5.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The archivist's contributions were _______; beyond cataloging manuscripts, she founded a public lecture series and created a preservation lab.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) minor\nB) controversial\nC) universal\nD) extensive", "answer": "D", "explanation": "Extensive means large in scope."}, {"id": "5.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The dancer's accomplishments are _______: she choreographed ballets, directed a company, and developed a training method used internationally.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) wide-ranging\nB) ordinary\nC) contested\nD) pragmatic", "answer": "A", "explanation": "Wide-ranging means extensive."}, {"id": "5.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The scientist's service to the field was _______, including mentoring students, designing instruments, and leading long-term surveys.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) pragmatic\nB) universal\nC) substantial\nD) controversial", "answer": "C", "explanation": "Substantial means extensive/considerable."}, {"id": "5.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The novelist's body of work is _______, spanning essays, plays, translations, and more than twenty works of fiction.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) expansive\nB) temporary\nC) controversial\nD) universal", "answer": "A", "explanation": "Expansive means extensive."}]}, {"n": 6, "concept": "Main Purpose: archaeological discovery at Pompeii", "original": "Archaeologists studying the ancient city of Pompeii\nin Italy recently discovered a well-preserved food\nshop known as a thermopolium. The site contains\nfood remains, artworks, and decorations. These items\ngive researchers a better understanding of what daily\nlife in Pompeii may have been like. For example, the\narchaeologists found a ceramic jar that they believe\nlikely contained a meat and seafood stew.\nWhich choice best states the main purpose of\nthe text?\nA) To compare ancient artworks with modern ones\nB) To discuss the political system of Italy\nC) To present a recent archaeological discovery\nD) To describe a region’s climate", "generated": [{"id": "6.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose of the text?\n\nA) To explain why music has lost its importance\nB) To argue that the characters should leave the house\nC) To portray a setting and mood as characters prepare for an arrival\nD) To summarize a conflict between two relatives", "answer": "C", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "6.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose of the text?\n\nA) To list the technical features of a harbor\nB) To present an atmosphere of departure and possibility\nC) To criticize sailors for taking unnecessary risks\nD) To compare several forms of transportation", "answer": "B", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "6.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose of the text?\n\nA) To contrast rural and urban customs\nB) To describe a completed celebration from beginning to end\nC) To explain why the family dislikes visitors\nD) To depict preparations that reveal anticipation within a family", "answer": "D", "explanation": "The details focus on preparation and anticipation."}, {"id": "6.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose of the text?\n\nA) To describe the moments before a significant daily activity begins\nB) To recount a student's entire academic career\nC) To argue that early classes should be canceled\nD) To evaluate the quality of a school's curriculum", "answer": "A", "explanation": "The purpose is to depict a scene before an event."}, {"id": "6.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose of the text?\n\nA) To establish a reflective mood before a character acts\nB) To give instructions for maintaining a garden\nC) To reveal the full contents of a letter\nD) To compare two different seasons", "answer": "A", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 7, "concept": "Main Purpose: setting while awaiting visitor", "original": "The following text is from Sarah Orne Jewett’s 1899\nshort story “Martha’s Lady.” Martha is employed by\nMiss Pyne as a maid.\nMiss Pyne sat by the window watching, in her\nbest dress, looking stately and calm; she seldom\nwent out now, and it was almost time for the\ncarriage. Martha was just coming in from the\ngarden with the strawberries, and with more\nflowers in her apron. It was a bright cool evening\nin June, the golden robins sang in the elms, and\nthe sun was going down behind the apple-trees\nat the foot of the garden. The beautiful old house\nstood wide open to the long-expected guest.\nWhich choice best states the main purpose of the\ntext?\nA) To convey the worries brought about by a new\nguest\nB) To describe how the characters have changed\nover time\nC) To contrast the activity indoors with the stillness\noutside\nD) To depict the setting as the characters await a\nvisitor’s arrival", "generated": [{"id": "7.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose of the text?\n\nA) To argue that the characters should leave the house\nB) To explain why music has lost its importance\nC) To summarize a conflict between two relatives\nD) To portray a setting and mood as characters prepare for an arrival", "answer": "D", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "7.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose of the text?\n\nA) To compare several forms of transportation\nB) To present an atmosphere of departure and possibility\nC) To criticize sailors for taking unnecessary risks\nD) To list the technical features of a harbor", "answer": "B", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "7.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose of the text?\n\nA) To explain why the family dislikes visitors\nB) To contrast rural and urban customs\nC) To depict preparations that reveal anticipation within a family\nD) To describe a completed celebration from beginning to end", "answer": "C", "explanation": "The details focus on preparation and anticipation."}, {"id": "7.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose of the text?\n\nA) To argue that early classes should be canceled\nB) To evaluate the quality of a school's curriculum\nC) To recount a student's entire academic career\nD) To describe the moments before a significant daily activity begins", "answer": "D", "explanation": "The purpose is to depict a scene before an event."}, {"id": "7.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose of the text?\n\nA) To establish a reflective mood before a character acts\nB) To reveal the full contents of a letter\nC) To compare two different seasons\nD) To give instructions for maintaining a garden", "answer": "A", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 8, "concept": "Text Structure: letter delivery then joy", "original": "The following text is adapted from Aphra Behn’s\n1689 novel The Lucky Mistake. Atlante and Rinaldo\nare neighbors who have been secretly exchanging\nletters through Charlot, Atlante’s sister.\n[Atlante] gave this letter to Charlot; who\nimmediately ran into the balcony with it, where\nshe still found Rinaldo in a melancholy posture,\nleaning his head on his hand: She showed him\nthe letter, but was afraid to toss it to him, for fear\nit might fall to the ground; so he ran and fetched\na long cane, which he cleft at one end, and held it\nwhile she put the letter into the cleft, and stayed\nnot to hear what he said to it. But never was man\nso transported with joy, as he was at the reading\nof this letter; it gives him new wounds; for to the\ngenerous, nothing obliges love so much as love.\nWhich choice best describes the overall structure of\nthe text?\nA) It describes the delivery of a letter\nportrays a character’s happiness at reading that\nletter.\nB) It establishes that a character is desperate to\nreceive a letter, and then explains why another\ncharacter has not yet written that letter.\nC) It presents a character’s concerns about\ndelivering a letter, and then details the contents\nof that letter.\nD) It reveals the inspiration behind a character’s\nletter, and then emphasizes the excitement that\nanother character feels upon receiving that letter.", "generated": [{"id": "8.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the overall structure of the text?\n\nA) It describes how other researchers criticized the work.\nB) It offers evidence that radar is always reliable.\nC) It states the study's final conclusion.\nD) It identifies the uncertainty that motivated the study.", "answer": "D", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "8.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the overall structure of the text?\n\nA) It defines the problem the later investigation attempts to address.\nB) It summarizes the team's strongest result.\nC) It contradicts the claim made in the first sentence.\nD) It shifts the discussion away from archaeology.", "answer": "A", "explanation": "The sentence frames the central research question."}, {"id": "8.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the overall structure of the text?\n\nA) It lists the materials used in the experiment.\nB) It gives a historical overview of plant classification.\nC) It introduces a gap in knowledge that the experiment examines.\nD) It proves that drought has no effect on plants.", "answer": "C", "explanation": "The sentence identifies an unresolved issue."}, {"id": "8.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the overall structure of the text?\n\nA) It summarizes the novel's publication history.\nB) It raises a difficulty with a common interpretation.\nC) It introduces an unrelated theme.\nD) It provides biographical information about the novelist.", "answer": "B", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "8.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the overall structure of the text?\n\nA) It explains the limitation that the new system is meant to address.\nB) It compares underwater vehicles with aircraft.\nC) It gives a personal anecdote about engineers.\nD) It announces that the technology is already flawless.", "answer": "A", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 9, "concept": "Text Function: production quotas increased bargaining power", "original": "According to historian Vicki L. Ruiz, Mexican\nAmerican women made crucial contributions to the\nlabor movement during World War II. At the time,\nfood processing companies entered into contracts to\nsupply United States armed forces with canned\ngoods. Increased production quotas conferred\ngreater bargaining power on the companies’\nemployees, many of whom were Mexican American\nwomen: employees insisted on more favorable\nbenefits, and employers, who were anxious to fulfill\nthe contracts, complied. Thus, labor activism became\na platform for Mexican American women to assert\ntheir agency.\nWhich choice best describes the function of the\nunderlined portion in the text as a whole?\nA) It elaborates on a claim about labor relations in a\nparticular industry made earlier in the text.\nB) It offers an example of a trend in the World\nWar II–era economy discussed earlier in the text.\nC) It notes a possible exception to the historical\nnarrative of labor activism sketched earlier in the\ntext.\nD) It provides further details about the identities of\nthe workers discussed earlier in the text.", "generated": [{"id": "9.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not
