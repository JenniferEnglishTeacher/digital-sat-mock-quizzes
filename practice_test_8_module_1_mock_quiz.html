ched after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫、條件相當的城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The table includes more than one year.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這個計畫在一個社區中進行。", "B": "這張表格包含不只一個年份。", "C": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。", "D": "兩個城鎮都有一些志工。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: target Or31 receptor", "vocab": false, "body": "Many mosquito repellents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contain<\/a> natural components that work by activating multiple odor receptors on mosquitoes’ antennae. As the insects <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">develop<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resistance\" target=\"_blank\" rel=\"noopener\" data-w=\"resistance\" data-pos=\"n.\" data-en=\"a force that slows or opposes movement\" data-zh=\"阻力；抵抗\">resistance<\/a>, new repellents are needed. Ke Dong and her team found that EBF, a molecular component of a chrysanthemum-flower extract, can repel mosquitoes by activating just one odor receptor—and this receptor, Or31, is present in all mosquito <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> known to carry diseases. Therefore, the researchers suggest that in developing new repellents, it would be most useful to _______", "bodyPlain": "Many mosquito repellents contain natural components that work by activating multiple odor receptors on mosquitoes’ antennae. As the insects develop resistance, new repellents are needed. Ke Dong and her team found that EBF, a molecular component of a chrysanthemum-flower extract, can repel mosquitoes by activating just one odor receptor—and this receptor, Or31, is present in all mosquito species known to carry diseases. Therefore, the researchers suggest that in developing new repellents, it would be most useful to _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "許多防蚊液含有天然成分，其作用方式是活化蚊子觸角上的多種氣味受器。隨著這些昆蟲產生抗藥性，就需要新的防蚊液。Ke Dong 和她的團隊發現，EBF（菊花萃取物中的一種分子成分）只需活化一種氣味受器就能驅趕蚊子——而這個受器 Or31 存在於所有已知會傳播疾病的蚊種身上。因此，研究人員建議，在開發新的防蚊液時，最有用的做法是 _______", "opts": {"A": "identify molecular components similar to EBF that target the activation of Or31 receptors.", "B": "investigate alternative methods for extracting EBF molecules from chrysanthemums.", "C": "verify the precise locations of Or31 and other odor receptors on mosquitoes’ antennae.", "D": "determine the maximum number of different odor receptors that can be activated by a single molecule."}, "optsZh": {"A": "找出與 EBF 相似、能專門活化 Or31 受體的分子成分。", "B": "研究從菊花中萃取 EBF 分子的其他方法。", "C": "確認 Or31 及其他氣味受體在蚊子觸角上的精確位置。", "D": "確定單一分子最多能活化多少種不同的氣味受體。"}, "answer": "A", "expl": "EBF works by activating Or31, found in all disease-carrying mosquitoes, so it would be useful to find similar molecules that target Or31.", "explZh": "EBF 透過活化所有帶病蚊子都有的 Or31 受器來驅蚊，所以找出同樣作用於 Or31 的類似分子最有用。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: target Or31 receptor", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任何一座島嶼之前數千年，就已與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "the island populations were domesticated before mainland populations.", "B": "all island plants descended from a single cultivated variety.", "C": "human traders must have transported the seeds recently.", "D": "the plant probably reached the islands without human assistance."}, "optsZh": {"A": "島上族群比本土族群更早被馴化。", "B": "所有島嶼植物都源自單一的栽培品種。", "C": "人類商人必定是在最近才運送了這些種子。", "D": "這種植物很可能是在沒有人類協助的情況下到達這些島嶼的。"}, "answer": "D", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: target Or31 receptor", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。有一種甲蟲同時分布於某個大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前很久，就已從海岸族群中分化出來，因此研究團隊推論 ______", "opts": {"A": "the island beetles must be younger than the coastal beetles.", "B": "humans carried the beetles to the island during early trade voyages.", "C": "the beetles were domesticated by island communities.", "D": "the beetles were likely introduced by natural dispersal rather than by humans."}, "optsZh": {"A": "島上的甲蟲必定比沿海的甲蟲年輕。", "B": "人類在早期的貿易航行中把這些甲蟲帶到了島上。", "C": "這些甲蟲是被島上的社群馴化的。", "D": "這些甲蟲很可能是透過自然擴散而非人類引進的。"}, "answer": "D", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: target Or31 receptor", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳到某個群島的，但對相關口述傳統的比較顯示，這首歌的核心語句在遷徙發生之前就已形成。因此，語言學家得出結論：______", "opts": {"A": "the song was probably not introduced to the archipelago by that migration.", "B": "all versions of the song are identical.", "C": "the song could not have changed after the migration.", "D": "the migration must have begun earlier than any other human movement."}, "optsZh": {"A": "這首歌很可能不是藉由那次遷徙傳入這個群島的。", "B": "這首歌的所有版本都完全相同。", "C": "這首歌在遷徙之後不可能有所改變。", "D": "這次遷徙必定比其他任何人類遷移都更早開始。"}, "answer": "A", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: target Or31 receptor", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。研究某座偏遠島嶼上一種作物的植物學家發現，島上的品種在人類定居該島之前數萬年，就已與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "the crop was first domesticated on the island.", "B": "human settlement probably did not account for the plant's original arrival on the island.", "C": "mainland farmers acquired the crop from island communities.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "這種作物最初是在島上被馴化的。", "B": "人類定居很可能不是這種植物最初來到該島的原因。", "C": "本土農民是從島上的社群取得這種作物的。", "D": "島上的品種必定與本土的野生植物在基因上完全相同。"}, "answer": "B", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: target Or31 receptor", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。研究人員原本以為，一種淡水蝸牛是在人們開始在一連串湖泊之間移動船隻時抵達那些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "boats probably explain every modern snail population.", "C": "the snails likely spread through an earlier nonhuman mechanism.", "D": "human activity made the populations genetically identical."}, "optsZh": {"A": "在開始划船活動之前，這些湖泊中沒有蝸牛。", "B": "船隻很可能可以解釋每一個現代蝸牛族群的存在。", "C": "這些蝸牛很可能是透過更早的非人為機制擴散的。", "D": "人類活動使這些族群在基因上完全相同。"}, "answer": "C", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: dishonest signal in tanagers", "vocab": false, "body": "Birds of many species ingest foods containing carotenoids, pigmented molecules that are converted into feather <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coloration\" target=\"_blank\" rel=\"noopener\" data-w=\"coloration\" data-pos=\"n.\" data-en=\"the color pattern of an animal or plant\" data-zh=\"顏色；色彩圖案\">coloration<\/a>. Coloration tends to be especially <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=saturated\" target=\"_blank\" rel=\"noopener\" data-w=\"saturated\" data-pos=\"adj.\" data-en=\"(of color) very strong and deep\" data-zh=\"（顏色）飽和的；濃烈的\">saturated<\/a> in male birds’ feathers, and because carotenoids also confer health benefits, the deeply saturated colors generally serve to communicate what is known as an honest signal of a bird’s overall fitness to potential mates. However, ornithologist Allison J. Shultz and others have found that males in several species of the tanager genus Ramphocelus use microstructures in their feathers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manipulate\" target=\"_blank\" rel=\"noopener\" data-w=\"manipulate\" data-pos=\"v.\" data-en=\"to control or change something skillfully\" data-zh=\"操控；操縱\">manipulate<\/a> light, creating the appearance of deeper saturation without the birds <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=necessarily\" target=\"_blank\" rel=\"noopener\" data-w=\"necessarily\" data-pos=\"adv.\" data-en=\"in a way that cannot be avoided\" data-zh=\"必然地\">necessarily<\/a> having to maintain a carotenoid-rich diet. These findings suggest that _______", "bodyPlain": "Birds of many species ingest foods containing carotenoids, pigmented molecules that are converted into feather coloration. Coloration tends to be especially saturated in male birds’ feathers, and because carotenoids also confer health benefits, the deeply saturated colors generally serve to communicate what is known as an honest signal of a bird’s overall fitness to potential mates. However, ornithologist Allison J. Shultz and others have found that males in several species of the tanager genus Ramphocelus use microstructures in their feathers to manipulate light, creating the appearance of deeper saturation without the birds necessarily having to maintain a carotenoid-rich diet. These findings suggest that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "許多種類的鳥會攝取含有類胡蘿蔔素的食物；類胡蘿蔔素是一種帶有色素的分子，會被轉化為羽毛的顏色。雄鳥羽毛的顏色往往特別飽和，而由於類胡蘿蔔素也能帶來健康上的益處，這些深度飽和的顏色通常可向潛在配偶傳達所謂的「誠實訊號」，顯示這隻鳥的整體健康狀況。然而，鳥類學家 Allison J.Shultz 等人發現，唐納雀屬 Ramphocelus 中數個物種的雄鳥會利用羽毛中的微結構來操控光線，創造出更深的飽和度外觀，而這些鳥不一定需要維持富含類胡蘿蔔素的飲食。這些發現顯示 _______", "opts": {"A": "individual male tanagers can engage in honest signaling without relying on carotenoid consumption.", "B": "feather microstructures may be less effective than deeply saturated feathers for signaling overall fitness.", "C": "scientists have yet to determine why tanagers have a preference for mates with colorful appearances.", "D": "a male tanager’s appearance may function as a dishonest signal of the individual’s overall fitness."}, "optsZh": {"A": "個別雄性唐納雀可以不依賴攝取類胡蘿蔔素而進行誠實信號的展示。", "B": "羽毛的微結構在顯示整體健康狀況方面，可能不如色彩飽和的羽毛有效。", "C": "科學家尚未確定為什麼唐納雀偏好外表色彩鮮豔的配偶。", "D": "雄性唐納雀的外表可能是一種反映個體整體健康程度的不誠實訊號。"}, "answer": "D", "expl": "Male tanagers can appear deeply saturated without a carotenoid-rich diet, so their color may not honestly reflect fitness — a dishonest signal.", "explZh": "雄性唐納雀不必攝取大量類胡蘿蔔素也能呈現飽和色彩，因此其顏色未必真實反映健康狀況——是一種不誠實的訊號。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: dishonest signal in tanagers", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任何一座島嶼之前數千年，就已與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "all island plants descended from a single cultivated variety.", "B": "human traders must have transported the seeds recently.", "C": "the island populations were domesticated before mainland populations.", "D": "the plant probably reached the islands without human assistance."}, "optsZh": {"A": "所有島嶼植物都源自單一的栽培品種。", "B": "人類商人必定是在最近才運送了這些種子。", "C": "島上族群比本土族群更早被馴化。", "D": "這種植物很可能是在沒有人類協助的情況下到達這些島嶼的。"}, "answer": "D", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: dishonest signal in tanagers", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。有一種甲蟲同時分布於某個大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前很久，就已從海岸族群中分化出來，因此研究團隊推論 ______", "opts": {"A": "the island beetles must be younger than the coastal beetles.", "B": "the beetles were domesticated by island communities.", "C": "the beetles were likely introduced by natural dispersal rather than by humans.", "D": "humans carried the beetles to the island during early trade voyages."}, "optsZh": {"A": "島上的甲蟲必定比沿海的甲蟲年輕。", "B": "這些甲蟲是被島上的社群馴化的。", "C": "這些甲蟲很可能是透過自然擴散而非人類引進的。", "D": "人類在早期的貿易航行中把這些甲蟲帶到了島上。"}, "answer": "C", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: dishonest signal in tanagers", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳到某個群島的，但對相關口述傳統的比較顯示，這首歌的核心語句在遷徙發生之前就已形成。因此，語言學家得出結論：______", "opts": {"A": "all versions of the song are identical.", "B": "the song was probably not introduced to the archipelago by that migration.", "C": "the song could not have changed after the migration.", "D": "the migration must have begun earlier than any other human movement."}, "optsZh": {"A": "這首歌的所有版本都完全相同。", "B": "這首歌很可能不是藉由那次遷徙傳入這個群島的。", "C": "這首歌在遷徙之後不可能有所改變。", "D": "這次遷徙必定比其他任何人類遷移都更早開始。"}, "answer": "B", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: dishonest signal in tanagers", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。研究某座偏遠島嶼上一種作物的植物學家發現，島上的品種在人類定居該島之前數萬年，就已與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "the crop was first domesticated on the island.", "B": "human settlement probably did not account for the plant's original arrival on the island.", "C": "the island variety must be genetically identical to wild mainland plants.", "D": "mainland farmers acquired the crop from island communities."}, "optsZh": {"A": "這種作物最初是在島上被馴化的。", "B": "人類定居很可能不是這種植物最初來到該島的原因。", "C": "島上的品種必定與本土的野生植物在基因上完全相同。", "D": "本土農民是從島上的社群取得這種作物的。"}, "answer": "B", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: dishonest signal in tanagers", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。研究人員原本以為，一種淡水蝸牛是在人們開始在一連串湖泊之間移動船隻時抵達那些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the snails likely spread through an earlier nonhuman mechanism.", "B": "boats probably explain every modern snail population.", "C": "human activity made the populations genetically identical.", "D": "the lakes did not contain snails until boating began."}, "optsZh": {"A": "這些蝸牛很可能是透過更早的非人為機制擴散的。", "B": "船隻很可能可以解釋每一個現代蝸牛族群的存在。", "C": "人類活動使這些族群在基因上完全相同。", "D": "在開始划船活動之前，這些湖泊中沒有蝸牛。"}, "answer": "A", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Grammar: present perfect singular has been", "vocab": false, "body": "When writing The Other Black Girl (2021), <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novelist\" target=\"_blank\" rel=\"noopener\" data-w=\"novelist\" data-pos=\"n.\" data-en=\"a person who writes novels\" data-zh=\"小說家\">novelist<\/a> Zakiya Dalila Harris drew on her own <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experiences<\/a> working at a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publishing\" target=\"_blank\" rel=\"noopener\" data-w=\"publishing\" data-pos=\"n.\" data-en=\"the business of producing books and magazines\" data-zh=\"出版業\">publishing<\/a> office. The award-winning book is Harris’s first novel, but her writing _______ honored before. At the age of twelve, she entered a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contest\" target=\"_blank\" rel=\"noopener\" data-w=\"contest\" data-pos=\"n.\" data-en=\"a competition\" data-zh=\"比賽；競賽\">contest<\/a> to have a story published in American Girl magazine—and won.", "bodyPlain": "When writing The Other Black Girl (2021), novelist Zakiya Dalila Harris drew on her own experiences working at a publishing office. The award-winning book is Harris’s first novel, but her writing _______ honored before. At the age of twelve, she entered a contest to have a story published in American Girl magazine—and won.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在撰寫《The Other Black Girl》（2021）時，小說家 Zakiya Dalila Harris 汲取了自己在出版社工作的經驗。這本得獎著作是 Harris 的第一部小說，但她的寫作 _______ 獲得表揚。十二歲時，她參加了一項比賽，爭取在《American Girl》雜誌上發表故事——而且她贏了。", "opts": {"A": "were", "B": "have been", "C": "has been", "D": "are"}, "optsZh": {"A": "were（過去式複數 → 主詞 writing 為單數，且需完成式搭配 before，錯誤）", "B": "have been（複數現在完成式 → 主詞 writing 為單數，錯誤）", "C": "has been（單數現在完成式，搭配 before 與單數主詞 writing：正確）", "D": "are（現在式複數 → 主詞 writing 為單數，且需完成式搭配 before，錯誤）"}, "answer": "C", "expl": "The subject 'her writing' is singular, and 'before' signals the present perfect: 'has been honored.'", "explZh": "主詞 her writing 為單數，且 before 表示現在完成式：has been honored。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Grammar: present perfect singular has been", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。2022 年，該研究團隊 ______ 一篇論文，描述一種新發現的酶，能幫助某些細菌在高度酸性的水中存活。", "opts": {"A": "to publish", "B": "publishing", "C": "having published", "D": "published"}, "optsZh": {"A": "to publish（不定詞 → 句子缺少主要動詞，錯誤）", "B": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）", "C": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "D": "published（過去式，作句子主要動詞，搭配 In 2022：正確）"}, "answer": "D", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Grammar: present perfect singular has been", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這個古董音樂盒看起來是裝飾品，但轉動把手時，______ 內部的針會撞擊細小的金屬齒片，奏出旋律。", "opts": {"A": "device:", "B": "device,", "C": "device", "D": "device--"}, "optsZh": {"A": "device:（冒號 → 隔開主詞與動詞，錯誤）", "B": "device,（逗號 → 隔開主詞與動詞，錯誤）", "C": "device（裝置；設備）", "D": "device--（破折號 → 隔開主詞與動詞，錯誤）"}, "answer": "C", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Grammar: present perfect singular has been", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。當口袋型計算機首次出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會干擾算術學習。", "opts": {"A": "them", "B": "it", "C": "that", "D": "this"}, "optsZh": {"A": "them（他們；複數受格）", "B": "it（它；單數代名詞）", "C": "that（那個，單數指示代名詞 → 指涉複數 devices，錯誤）", "D": "this（這個，單數指示代名詞 → 指涉複數 devices，錯誤）"}, "answer": "A", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Grammar: present perfect singular has been", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常帶領讀者認識拉丁美洲文學中的魔幻寫實。", "opts": {"A": "family,", "B": "family and", "C": "family", "D": "family, and"}, "optsZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family and（無標點＋and）", "C": "family（無標點）", "D": "family, and（逗號＋and）"}, "answer": "C", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Grammar: present perfect singular has been", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free in part because", "B": "free. In part because", "C": "free, in part because:", "D": "free, in part because,"}, "optsZh": {"A": "free in part because（無標點，直接接原因子句）", "B": "free. In part because（句號，以 In part because 另起一句）", "C": "free, in part because:（逗號＋in part because＋冒號）", "D": "free, in part because,（逗號＋in part because＋逗號）"}, "answer": "B", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Grammar: create after would", "vocab": false, "body": "In order to prevent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nonnative\" target=\"_blank\" rel=\"noopener\" data-w=\"nonnative\" data-pos=\"adj.\" data-en=\"not originally from the place where it lives now\" data-zh=\"非本地的；外來的\">nonnative<\/a> fish <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> from moving freely between the Mediterranean and Red Seas, marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Bella Galil has proposed that a saline lock system be installed along the Suez Canal in Egypt’s Great Bitter Lakes. The lock would increase the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=salinity\" target=\"_blank\" rel=\"noopener\" data-w=\"salinity\" data-pos=\"n.\" data-en=\"the amount of salt in water\" data-zh=\"鹽度\">salinity<\/a> of the lakes and _______ a natural barrier of water most marine creatures would be unable to cross.", "bodyPlain": "In order to prevent nonnative fish species from moving freely between the Mediterranean and Red Seas, marine biologist Bella Galil has proposed that a saline lock system be installed along the Suez Canal in Egypt’s Great Bitter Lakes. The lock would increase the salinity of the lakes and _______ a natural barrier of water most marine creatures would be unable to cross.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "為了防止非原生魚種在地中海與紅海之間自由移動，海洋生物學家 Bella Galil 提議在埃及大苦湖（Great Bitter Lakes）的蘇伊士運河沿線設置一套鹽水閘門系統。這道閘門將提高湖泊的鹽度，並 _______ 一道大多數海洋生物都無法越過的天然水域屏障。", "opts": {"A": "creates", "B": "create", "C": "creating", "D": "created"}, "optsZh": {"A": "creates（第三人稱單數現在式 → 未與 would 後的原形動詞平行，錯誤）", "B": "create（原形動詞，與 would increase 平行：正確）", "C": "creating（現在分詞 → 未與 would 後的原形動詞平行，錯誤）", "D": "created（過去式 → 未與 would 後的原形動詞平行，錯誤）"}, "answer": "B", "expl": "'Would' governs both verbs: 'would increase … and create,' so the base form 'create' is needed.", "explZh": "would 同時接兩個動詞：would increase … and create，所以要用原形 create。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Grammar: create after would", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。2022 年，該研究團隊 ______ 一篇論文，描述一種新發現的酶，能幫助某些細菌在高度酸性的水中存活。", "opts": {"A": "to publish", "B": "having published", "C": "publishing", "D": "published"}, "optsZh": {"A": "to publish（不定詞 → 句子缺少主要動詞，錯誤）", "B": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "C": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）", "D": "published（過去式，作句子主要動詞，搭配 In 2022：正確）"}, "answer": "D", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Grammar: create after would", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這個古董音樂盒看起來是裝飾品，但轉動把手時，______ 內部的針會撞擊細小的金屬齒片，奏出旋律。", "opts": {"A": "device,", "B": "device:", "C": "device", "D": "device--"}, "optsZh": {"A": "device,（逗號 → 隔開主詞與動詞，錯誤）", "B": "device:（冒號 → 隔開主詞與動詞，錯誤）", "C": "device（裝置；設備）", "D": "device--（破折號 → 隔開主詞與動詞，錯誤）"}, "answer": "C", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Grammar: create after would", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。當口袋型計算機首次出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會干擾算術學習。", "opts": {"A": "them", "B": "it", "C": "this", "D": "that"}, "optsZh": {"A": "them（他們；複數受格）", "B": "it（它；單數代名詞）", "C": "this（這個，單數指示代名詞 → 指涉複數 devices，錯誤）", "D": "that（那個，單數指示代名詞 → 指涉複數 devices，錯誤）"}, "answer": "A", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Grammar: create after would", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常帶領讀者認識拉丁美洲文學中的魔幻寫實。", "opts": {"A": "family, and", "B": "family", "C": "family,", "D": "family and"}, "optsZh": {"A": "family, and（逗號＋and）", "B": "family（無標點）", "C": "family,（逗號，結束以 a family saga 開頭的同位語）", "D": "family and（無標點＋and）"}, "answer": "B", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Grammar: create after would", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free, in part because:", "B": "free in part because", "C": "free. In part because", "D": "free, in part because,"}, "optsZh": {"A": "free, in part because:（逗號＋in part because＋冒號）", "B": "free in part because（無標點，直接接原因子句）", "C": "free. In part because（句號，以 In part because 另起一句）", "D": "free, in part because,（逗號＋in part because＋逗號）"}, "answer": "C", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Grammar: plural artists appositive punctuation", "vocab": false, "body": "Paintings by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=renowned\" target=\"_blank\" rel=\"noopener\" data-w=\"renowned\" data-pos=\"adj.\" data-en=\"famous and respected\" data-zh=\"著名的；享有聲譽的\">renowned<\/a> twentieth-century US _______ were featured in Artist to Artist, an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> at the Smithsonian Art Museum that paired the works of artists whose career <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trajectory\" target=\"_blank\" rel=\"noopener\" data-w=\"trajectory\" data-pos=\"n.\" data-en=\"the path or course of development over time\" data-zh=\"軌跡；發展歷程\">trajectories<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intersect\" target=\"_blank\" rel=\"noopener\" data-w=\"intersect\" data-pos=\"v.\" data-en=\"to meet or cross each other\" data-zh=\"交會；交叉\">intersected<\/a> in meaningful ways.", "bodyPlain": "Paintings by the renowned twentieth-century US _______ were featured in Artist to Artist, an exhibition at the Smithsonian Art Museum that paired the works of artists whose career trajectories intersected in meaningful ways.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "二十世紀著名美國 _______ 的畫作曾在 Smithsonian Art Museum 的展覽「Artist to Artist」中展出，該展覽將職業生涯軌跡有著意義深遠交集的藝術家們的作品配對展示。", "opts": {"A": "artists: Thomas Hart Benton and Jackson Pollock,", "B": "artists Thomas Hart Benton and Jackson Pollock", "C": "artists Thomas Hart Benton, and Jackson Pollock,", "D": "artists, Thomas Hart Benton and Jackson Pollock"}, "optsZh": {"A": "artists: Thomas Hart Benton and Jackson Pollock,（冒號＋逗號 → 冒號前非完整句且逗號隔開主詞與動詞，錯誤）", "B": "artists Thomas Hart Benton and Jackson Pollock（限定性同位語，不加標點：正確）", "C": "artists Thomas Hart Benton, and Jackson Pollock,（多餘逗號 → 隔開主詞與動詞，錯誤）", "D": "artists, Thomas Hart Benton and Jackson Pollock（逗號 → 誤作非限定同位語且缺結尾逗號，錯誤）"}, "answer": "B", "expl": "'Thomas Hart Benton and Jackson Pollock' is a restrictive appositive identifying which artists, so no punctuation separates it from 'artists' or from the verb.", "explZh": "Thomas Hart Benton and Jackson Pollock 是限定性同位語，說明是哪兩位藝術家，因此與 artists 及
