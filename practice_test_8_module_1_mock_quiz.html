描述或結論是合理的。這部歌劇的樂譜反映出不尋常的 _______：作曲家邀請三位詩人在整個排練期間修改歌劇劇本。", "opts": {"A": "commercialization", "B": "cooperation", "C": "characterization", "D": "interpretation"}, "optsZh": {"A": "commercialization（商業化）", "B": "cooperation（合作）", "C": "characterization（人物塑造、性格描寫）", "D": "interpretation（詮釋、解讀）"}, "answer": "B", "expl": "Cooperation means collaborative work.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}, "B": {"pos": "n.", "en": "the act of working together toward a shared goal", "zh": "合作；協力", "word": "cooperation"}, "C": {"pos": "n.", "en": "the way a writer creates and describes characters", "zh": "人物塑造；性格描寫", "word": "characterization"}, "D": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: collaboration between writers", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Although most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematician\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematician\" data-pos=\"n.\" data-en=\"an expert in mathematics\" data-zh=\"數學家\">mathematicians<\/a> publish individually, this proof emerged from a sustained _______ among researchers in four countries.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Although most mathematicians publish individually, this proof emerged from a sustained _______ among researchers in four countries.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。雖然大多數數學家都是獨自發表論文，但這項證明卻出自四個國家研究人員之間持續的 _______。", "opts": {"A": "interpretation", "B": "characterization", "C": "commercialization", "D": "collaboration"}, "optsZh": {"A": "interpretation（詮釋、解讀）", "B": "characterization（人物塑造、性格描寫）", "C": "commercialization（商業化）", "D": "collaboration（合作、協作）"}, "answer": "D", "expl": "Collaboration is joint work.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}, "B": {"pos": "n.", "en": "the way a writer creates and describes characters", "zh": "人物塑造；性格描寫", "word": "characterization"}, "C": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}, "D": {"pos": "n.", "en": "the act of working together with others to create or achieve something", "zh": "合作；協作", "word": "collaboration"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: collaboration between writers", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The anthology was produced through editorial _______; each translator commented on the others&#x27; drafts before <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publication\" target=\"_blank\" rel=\"noopener\" data-w=\"publication\" data-pos=\"n.\" data-en=\"a book, magazine, or article that is printed; the act of publishing\" data-zh=\"出版品；發表\">publication<\/a>.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The anthology was produced through editorial _______; each translator commented on the others' drafts before publication.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這本選集是透過編輯上的 _______ 完成的；每位譯者在出版前都會對其他人的譯稿提出意見。", "opts": {"A": "secrecy", "B": "teamwork", "C": "interpretation", "D": "commercialization"}, "optsZh": {"A": "secrecy（保密、隱密）", "B": "teamwork（團隊合作）", "C": "interpretation（詮釋、解讀）", "D": "commercialization（商業化）"}, "answer": "B", "expl": "Teamwork means collaboration.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the practice of keeping things secret", "zh": "保密；隱祕", "word": "secrecy"}, "B": {"pos": "n.", "en": "the activity of working well together as a group", "zh": "團隊合作", "word": "teamwork"}, "C": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}, "D": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: extensive contributions", "vocab": true, "body": "Ofelia Zepeda’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contribution\" target=\"_blank\" rel=\"noopener\" data-w=\"contribution\" data-pos=\"n.\" data-en=\"something you give or do to help achieve something\" data-zh=\"貢獻\">contributions<\/a> to the field of linguistics are _______: her many accomplishments include working as a linguistics <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=professor\" target=\"_blank\" rel=\"noopener\" data-w=\"professor\" data-pos=\"n.\" data-en=\"a senior teacher at a university\" data-zh=\"教授\">professor<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bilingual\" target=\"_blank\" rel=\"noopener\" data-w=\"bilingual\" data-pos=\"adj.\" data-en=\"using or able to speak two languages\" data-zh=\"雙語的\">bilingual<\/a> poet, authoring the first Tohono O’odham grammar book, and co-founding the American Indian Language Development Institute.", "bodyPlain": "Ofelia Zepeda’s contributions to the field of linguistics are _______: her many accomplishments include working as a linguistics professor and bilingual poet, authoring the first Tohono O’odham grammar book, and co-founding the American Indian Language Development Institute.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "Ofelia Zepeda 對語言學領域的貢獻是 _______：她的眾多成就包括擔任語言學教授與雙語詩人、撰寫第一本 Tohono O’odham 語文法書，以及共同創辦 American Indian Language Development Institute。", "opts": {"A": "pragmatic", "B": "controversial", "C": "extensive", "D": "universal"}, "optsZh": {"A": "pragmatic（務實的）", "B": "controversial（有爭議的）", "C": "extensive（廣泛的、大規模的）", "D": "universal（普遍的、全體的）"}, "answer": "C", "expl": "Her 'many accomplishments' across teaching, poetry, a grammar book, and an institute show her contributions are 'extensive.'", "explZh": "她在教學、詩作、文法書與創辦機構等方面的「許多成就」顯示她的貢獻十分「extensive」（廣泛）。", "defs": {"A": {"pos": "adj.", "en": "dealing with things in a practical way", "zh": "務實的；實際的", "word": "pragmatic"}, "B": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}, "C": {"pos": "adj.", "en": "covering a large area or amount", "zh": "廣泛的；大規模的", "word": "extensive"}, "D": {"pos": "adj.", "en": "involving or true for everyone or everything", "zh": "普遍的；全體的", "word": "universal"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: extensive contributions", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The scholar&#x27;s influence is _______: she edited three journals, trained dozens of researchers, and published major books in two fields.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The scholar's influence is _______: she edited three journals, trained dozens of researchers, and published major books in two fields.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這位學者的影響力是 _______：她編輯過三份期刊、培育了數十位研究人員，並在兩個領域出版了重要著作。", "opts": {"A": "pragmatic", "B": "far-reaching", "C": "controversial", "D": "universal"}, "optsZh": {"A": "pragmatic（務實的）", "B": "far-reaching（影響深遠的）", "C": "controversial（有爭議的）", "D": "universal（普遍的、全體的）"}, "answer": "B", "expl": "Far-reaching means extensive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "dealing with things in a practical way", "zh": "務實的；實際的", "word": "pragmatic"}, "B": {"pos": "adj.", "en": "having a wide influence or many effects", "zh": "影響深遠的", "word": "far-reaching"}, "C": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}, "D": {"pos": "adj.", "en": "involving or true for everyone or everything", "zh": "普遍的；全體的", "word": "universal"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: extensive contributions", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. The archivist&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contribution\" target=\"_blank\" rel=\"noopener\" data-w=\"contribution\" data-pos=\"n.\" data-en=\"something you give or do to help achieve something\" data-zh=\"貢獻\">contributions<\/a> were _______; beyond cataloging <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a>, she founded a public lecture series and created a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preservation\" target=\"_blank\" rel=\"noopener\" data-w=\"preservation\" data-pos=\"n.\" data-en=\"the act of keeping something safe from loss or damage\" data-zh=\"保存；保護\">preservation<\/a> lab.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The archivist's contributions were _______; beyond cataloging manuscripts, she founded a public lecture series and created a preservation lab.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這位檔案管理員的貢獻是 _______；除了為手稿編目之外，她還創辦了一系列公開講座，並建立了一間文物保存實驗室。", "opts": {"A": "minor", "B": "controversial", "C": "universal", "D": "extensive"}, "optsZh": {"A": "minor（次要的；輕微的）", "B": "controversial（有爭議的）", "C": "universal（普遍的、全體的）", "D": "extensive（廣泛的、大規模的）"}, "answer": "D", "expl": "Extensive means large in scope.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "small and not very important", "zh": "次要的；輕微的", "word": "minor"}, "B": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}, "C": {"pos": "adj.", "en": "involving or true for everyone or everything", "zh": "普遍的；全體的", "word": "universal"}, "D": {"pos": "adj.", "en": "covering a large area or amount", "zh": "廣泛的；大規模的", "word": "extensive"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: extensive contributions", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The dancer&#x27;s accomplishments are _______: she choreographed ballets, directed a company, and developed a training method used <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=international\" target=\"_blank\" rel=\"noopener\" data-w=\"international\" data-pos=\"adj.\" data-en=\"involving more than one country\" data-zh=\"國際的\">internationally<\/a>.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The dancer's accomplishments are _______: she choreographed ballets, directed a company, and developed a training method used internationally.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這位舞者的成就是 _______：她編排芭蕾舞作、領導一個舞團，並發展出一套在國際間使用的訓練方法。", "opts": {"A": "wide-ranging", "B": "ordinary", "C": "contested", "D": "pragmatic"}, "optsZh": {"A": "wide-ranging（範圍廣泛的、多方面的）", "B": "ordinary（普通的；平凡的）", "C": "contested（有爭議的）", "D": "pragmatic（務實的）"}, "answer": "A", "expl": "Wide-ranging means extensive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "covering many different subjects or types", "zh": "範圍廣泛的；多方面的", "word": "wide-ranging"}, "B": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "C": {"pos": "adj.", "en": "argued about; disputed", "zh": "有爭議的", "word": "contested"}, "D": {"pos": "adj.", "en": "dealing with things in a practical way", "zh": "務實的；實際的", "word": "pragmatic"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: extensive contributions", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The scientist&#x27;s service to the field was _______, including mentoring students, designing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a>, and leading long-term surveys.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The scientist's service to the field was _______, including mentoring students, designing instruments, and leading long-term surveys.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這位科學家對該領域的貢獻是 _______，包括指導學生、設計儀器，以及主持長期的調查研究。", "opts": {"A": "pragmatic", "B": "universal", "C": "substantial", "D": "controversial"}, "optsZh": {"A": "pragmatic（務實的）", "B": "universal（普遍的、全體的）", "C": "substantial（相當大的、大量的）", "D": "controversial（有爭議的）"}, "answer": "C", "expl": "Substantial means extensive/considerable.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "dealing with things in a practical way", "zh": "務實的；實際的", "word": "pragmatic"}, "B": {"pos": "adj.", "en": "involving or true for everyone or everything", "zh": "普遍的；全體的", "word": "universal"}, "C": {"pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；重大的", "word": "substantial"}, "D": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: extensive contributions", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The novelist&#x27;s body of work is _______, spanning essays, plays, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translations<\/a>, and more than twenty works of fiction.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The novelist's body of work is _______, spanning essays, plays, translations, and more than twenty works of fiction.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這位小說家的作品是 _______，涵蓋散文、劇本、翻譯，以及二十多部小說作品。", "opts": {"A": "expansive", "B": "temporary", "C": "controversial", "D": "universal"}, "optsZh": {"A": "expansive（廣泛的、範圍廣大的）", "B": "temporary（暫時的）", "C": "controversial（有爭議的）", "D": "universal（普遍的、全體的）"}, "answer": "A", "expl": "Expansive means extensive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "covering a large area or range", "zh": "廣闊的；廣泛的", "word": "expansive"}, "B": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}, "C": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}, "D": {"pos": "adj.", "en": "involving or true for everyone or everything", "zh": "普遍的；全體的", "word": "universal"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Main Purpose: archaeological discovery at Pompeii", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">Archaeologists<\/a> studying the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> city of Pompeii in Italy recently discovered a well-preserved food shop known as a thermopolium. The site <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contains<\/a> food remains, artworks, and decorations. These items give researchers a better understanding of what daily life in Pompeii may have been like. For example, the archaeologists found a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ceramic\" target=\"_blank\" rel=\"noopener\" data-w=\"ceramic\" data-pos=\"adj.\" data-en=\"made of clay that has been fired\" data-zh=\"陶瓷的\">ceramic<\/a> jar that they believe likely contained a meat and seafood stew.", "bodyPlain": "Archaeologists studying the ancient city of Pompeii in Italy recently discovered a well-preserved food shop known as a thermopolium. The site contains food remains, artworks, and decorations. These items give researchers a better understanding of what daily life in Pompeii may have been like. For example, the archaeologists found a ceramic jar that they believe likely contained a meat and seafood stew.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "研究義大利古城龐貝的考古學家最近發現了一間保存完好、被稱為 thermopolium 的食物店。這個遺址中有食物殘留、藝術品和裝飾品。這些物品讓研究人員更了解龐貝的日常生活可能是什麼樣子。例如，考古學家發現了一個陶罐，他們認為裡面很可能裝過肉類和海鮮燉菜。", "opts": {"A": "To compare ancient artworks with modern ones", "B": "To discuss the political system of Italy", "C": "To present a recent archaeological discovery", "D": "To describe a region’s climate"}, "optsZh": {"A": "比較古代藝術品與現代藝術品", "B": "討論義大利的政治體制", "C": "介紹一項近期的考古發現", "D": "描述一個地區的氣候"}, "answer": "C", "expl": "The text mainly describes archaeologists' recent discovery of a well-preserved food shop in Pompeii.", "explZh": "本文主要介紹考古學家最近在龐貝發現一間保存完好的食物店。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Main Purpose: archaeological discovery at Pompeii", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。在一段短篇小說節錄中，一位年長的音樂家在敞開的窗邊等待，一位較年輕的親戚則從花園帶著花回來。敘述停留在傍晚的光線、已布置好的房間，以及那些顯示一位期待已久的訪客即將到來的細微跡象上。", "opts": {"A": "To explain why music has lost its importance", "B": "To argue that the characters should leave the house", "C": "To portray a setting and mood as characters prepare for an arrival", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "解釋為什麼音樂已失去其重要性", "B": "主張角色們應該離開這棟房子", "C": "在角色們為某人的到來做準備時，描繪場景與氣氛", "D": "概述兩位親戚之間的衝突"}, "answer": "C", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Main Purpose: archaeological discovery at Pompeii", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一首詩描寫一位說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並非敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入一種不確定卻充滿希望的處境。", "opts": {"A": "To list the technical features of a harbor", "B": "To present an atmosphere of departure and possibility", "C": "To criticize sailors for taking unnecessary risks", "D": "To compare several forms of transportation"}, "optsZh": {"A": "列出一座港口的技術特點", "B": "呈現一種啟程與充滿可能性的氛圍", "C": "批評水手們冒不必要的風險", "D": "比較幾種交通方式"}, "answer": "B", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Main Purpose: archaeological discovery at Pompeii", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一段小說節錄描寫了節慶大餐前擁擠的廚房。敘述者注意到擦亮的碗、精心排列的椅子，以及每當屋外傳來腳步聲時家人們便停下動作的樣子——他們正在等待一位多年未曾來訪的客人。", "opts": {"A": "To contrast rural and urban customs", "B": "To describe a completed celebration from beginning to end", "C": "To explain why the family dislikes visitors", "D": "To depict preparations that reveal anticipation within a family"}, "optsZh": {"A": "對比鄉村與都市的風俗", "B": "從頭到尾描述一場已經結束的慶祝活動", "C": "解釋為什麼這家人不喜歡訪客", "D": "描繪顯露出一家人期待之情的準備工作"}, "answer": "D", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Main Purpose: archaeological discovery at Pompeii", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段回憶錄文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字尚未呈現課程本身；相反地，它突顯的是課程開始前那些安靜的例行儀式。", "opts": {"A": "To describe the moments before a significant daily activity begins", "B": "To recount a student's entire academic career", "C": "To argue that early classes should be canceled", "D": "To evaluate the quality of a school's curriculum"}, "optsZh": {"A": "描述一項重要的日常活動開始前的時刻", "B": "敘述一名學生完整的求學經歷", "C": "主張應取消早上的課", "D": "評估一所學校課程的品質"}, "answer": "A", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Main Purpose: archaeological discovery at Pompeii", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一段文學文字呈現了雨後的花園：濕潤的小徑、明亮的葉子，以及一張擺在樹下的長椅。一個角色手拿一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To establish a reflective mood before a character acts", "B": "To give instructions for maintaining a garden", "C": "To reveal the full contents of a letter", "D": "To compare two different seasons"}, "optsZh": {"A": "在角色採取行動之前營造一種沉思的氛圍", "B": "提供照顧花園的指示", "C": "揭露一封信的完整內容", "D": "比較兩個不同的季節"}, "answer": "A", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Main Purpose: setting while awaiting visitor", "vocab": false, "body": "The following text is from Sarah Orne Jewett’s 1899 short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> “Martha’s Lady.” Martha is employed by Miss Pyne as a maid.<br><br>Miss Pyne sat by the window watching, in her best dress, looking <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stately\" target=\"_blank\" rel=\"noopener\" data-w=\"stately\" data-pos=\"adj.\" data-en=\"dignified and impressive\" data-zh=\"莊嚴的；威嚴的\">stately<\/a> and calm; she <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=seldom\" target=\"_blank\" rel=\"noopener\" data-w=\"seldom\" data-pos=\"adv.\" data-en=\"not often\" data-zh=\"很少；不常\">seldom<\/a> went out now, and it was almost time for the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=carriage\" target=\"_blank\" rel=\"noopener\" data-w=\"carriage\" data-pos=\"n.\" data-en=\"a vehicle pulled by horses\" data-zh=\"馬車\">carriage<\/a>. Martha was just coming in from the garden with the strawberries, and with more flowers in her apron. It was a bright cool evening in June, the golden robins sang in the elms, and the sun was going down behind the apple-trees at the foot of the garden. The beautiful old house stood wide open to the long-expected guest.", "bodyPlain": "The following text is from Sarah Orne Jewett’s 1899 short story “Martha’s Lady.” Martha is employed by Miss Pyne as a maid.\n\nMiss Pyne sat by the window watching, in her best dress, looking stately and calm; she seldom went out now, and it was almost time for the carriage. Martha was just coming in from the garden with the strawberries, and with more flowers in her apron. It was a bright cool evening in June, the golden robins sang in the elms, and the sun was going down behind the apple-trees at the foot of the garden. The beautiful old house stood wide open to the long-expected guest.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自 Sarah Orne Jewett 於 1899 年發表的短篇小說〈Martha’s Lady〉。Martha 受僱於 Miss Pyne，擔任女僕。\nPyne 小姐穿著她最好的衣服坐在窗邊望著，神情莊重而平靜；她現在很少出門，而馬車差不多快到了。Martha 正從花園帶著草莓走進來，圍裙裡還兜著更多的花。那是六月一個晴朗涼爽的傍晚，金黃色的知更鳥在榆樹上歌唱，太陽正從花園盡頭的蘋果樹後落下。這棟美麗的老房子敞開大門，迎接那位期待已久的客人。", "opts": {"A": "To convey the worries brought about by a new guest", "B": "To describe how the characters have changed over time", "C": "To contrast the activity indoors with the stillness outside", "D": "To depict the setting as the characters await a visitor’s arrival"}, "optsZh": {"A": "傳達一位新客人所帶來的憂慮", "B": "描述角色們如何隨時間改變", "C": "對比室內的活動與屋外的寂靜", "D": "描繪角色們等待一位訪客到來時的場景"}, "answer": "D", "expl": "The passage describes the house, garden, and evening as Miss Pyne waits for 'the long-expected guest.'", "explZh": "文中描寫房屋、花園與傍晚景色，而 Miss Pyne 正等待「期待已久的客人」。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Main Purpose: setting while awaiting visitor", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。在一段短篇小說節錄中，一位年長的音樂家在敞開的窗邊等待，一位較年輕的親戚則從花園帶著花回來。敘述停留在傍晚的光線、已布置好的房間，以及那些顯示一位期待已久的訪客即將到來的細微跡象上。", "opts": {"A": "To argue that the characters should leave the house", "B": "To explain why music has lost its importance", "C": "To summarize a conflict between two relatives", "D": "To portray a setting and mood as characters prepare for an arrival"}, "optsZh": {"A": "主張角色們應該離開這棟房子", "B": "解釋為什麼音樂已失去其重要性", "C": "概述兩位親戚之間的衝突", "D": "在角色們為某人的到來做準備時，描繪場景與氣氛"}, "answer": "D", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Main Purpose: setting while awaiting visitor", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一首詩描寫一位說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並非敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入一種不確定卻充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To present an atmosphere of departure and possibility", "C": "To criticize sailors for taking unnecessary risks", "D": "To list the technical features of a harbor"}, "optsZh": {"A": "比較幾種交通方式", "B": "呈現一種啟程與充滿可能性的氛圍", "C": "批評水手們冒不必要的風險", "D": "列出一座港口的技術特點"}, "answer": "B", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Main Purpose: setting while awaiting visitor", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一段小說節錄描寫了節慶大餐前擁擠的廚房。敘述者注意到擦亮的碗、精心排列的椅子，以及每當屋外傳來腳步聲時家人們便停下動作的樣子——他們正在等待一位多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To contrast rural and urban customs", "C": "To depict preparations that reveal anticipation within a family", "D": "To describe a completed celebration from beginning to end"}, "optsZh": {"A": "解釋為什麼這家人不喜歡訪客", "B": "對比鄉村與都市的風俗", "C": "描繪顯露出一家人期待之情的準備工作", "D": "從頭到尾描述一場已經結束的慶祝活動"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Main Purpose: setting while awaiting visitor", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。一段回憶錄文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字尚未呈現課程本身；相反地，它突顯的是課程開始前那些安靜的例行儀式。", "opts": {"A": "To argue that early classes should be canceled", "B": "To evaluate the quality of a school's curriculum", "C": "To recount a student's entire academic career", "D": "To describe the moments before a significant daily activity begins"}, "optsZh": {"A": "主張應取消早上的課", "B": "評估一所學校課程的品質", "C": "敘述一名學生完整的求學經歷", "D": "描述一項重要的日常活動開始前的時刻"}, "answer": "D", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Main Purpose: setting while awaiting visitor", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dramatic\" target=\"_blank\" rel=\"noopener\" data-w=\"dramatic\" data-pos=\"adj.\" data-en=\"sudden and very noticeable; exciting\" data-zh=\"劇烈的；戲劇性的\">dramatic<\/a> discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。一段文學文字呈現了雨後的花園：濕潤的小徑、明亮的葉子，以及一張擺在樹下的長椅。一個角色手拿一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To establish a reflective mood before a character acts", "B": "To reveal the full contents of a letter", "C": "To compare two different seasons", "D": "To give instructions for maintaining a garden"}, "optsZh": {"A": "在角色採取行動之前營造一種沉思的氛圍", "B": "揭露一封信的完整內容", "C": "比較兩個不同的季節", "D": "提供照顧花園的指示"}, "answer": "A", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Structure: letter delivery then joy", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Aphra Behn’s 1689 novel The Lucky Mistake. Atlante and Rinaldo are neighbors who have been secretly exchanging letters through Charlot, Atlante’s sister.<br><br>[Atlante] gave this letter to Charlot; who <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a> ran into the balcony with it, where she still found Rinaldo in a melancholy posture, leaning his head on his hand: She showed him the letter, but was afraid to toss it to him, for fear it might fall to the ground; so he ran and fetched a long cane, which he cleft at one end, and held it while she put the letter into the cleft, and stayed not to hear what he said to it. But never was man so transported with joy, as he was at the reading of this letter; it gives him new wounds; for to the generous, nothing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=oblige\" target=\"_blank\" rel=\"noopener\" data-w=\"oblige\" data-pos=\"v.\" data-en=\"to force someone to do something\" data-zh=\"迫使；不得不\">obliges<\/a> love so much as love.", "bodyPlain": "The following text is adapted from Aphra Behn’s 1689 novel The Lucky Mistake. Atlante and Rinaldo are neighbors who have been secretly exchanging letters through Charlot, Atlante’s sister.\n\n[Atlante] gave this letter to Charlot; who immediately ran into the balcony with it, where she still found Rinaldo in a melancholy posture, leaning his head on his hand: She showed him the letter, but was afraid to toss it to him, for fear it might fall to the ground; so he ran and fetched a long cane, which he cleft at one end, and held it while she put the letter into the cleft, and stayed not to hear what he said to it. But never was man so transported with joy, as he was at the reading of this letter; it gives him new wounds; for to the generous, nothing obliges love so much as love.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "以下文字改寫自 Aphra Behn 於 1689 年出版的小說《The Lucky Mistake》。Atlante 和 Rinaldo 是鄰居，兩人一直透過 Atlante 的妹妹 Charlot 秘密互通書信。\n〔Atlante〕把這封信交給 Charlot；Charlot 隨即拿著信奔到陽台上，發現 Rinaldo 仍以憂鬱的姿態待在那裡，一手托著頭：她把信拿給他看，卻不敢將信拋過去，唯恐信會掉落到地上；於是他跑去取來一根長竹竿，把一端劈開，舉著竿子讓她把信插進裂縫中，而她也未停留聽他對這封信說了些什麼。然而從來沒有哪個男子像他讀這封信時那樣欣喜若狂；這封信給了他新的創傷；因為對於慷慨高尚之人而言，再沒有什麼比愛更能令愛感恩相繫。", "opts": {"A": "It describes the delivery of a letter and then portrays a character’s happiness at reading that letter.", "B": "It establishes that a character is desperate to receive a letter, and then explains why another character has not yet written that letter.", "C": "It presents a character’s concerns about delivering a letter, and then details the contents of that letter.", "D": "It reveals the inspiration behind a character’s letter, and then emphasizes the excitement that another character feels upon receiving that letter."}, "optsZh": {"A": "它先描述一封信的遞送過程，接著描寫一個角色讀信時的喜悅。", "B": "它先說明一個角色急切地想收到一封信，接著解釋另一個角色為何還沒寫那封信。", "C": "它呈現一個角色對送信的擔憂，接著詳述那封信的內容。", "D": "它揭示一個角色寫信的靈感來源，接著強調另一個角色收到那封信時的興奮。"}, "answer": "A", "expl": "The text first describes how Charlot delivers the letter using a cane, then shows Rinaldo 'transported with joy' while reading it.", "explZh": "本文先描述 Charlot 如何用竹竿傳遞信件，接著呈現 Rinaldo 讀信時「欣喜若狂」。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Structure: letter delivery then joy", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號穿透得不夠深。", "opts": {"A": "It describes how other researchers criticized the work.", "B": "It offers evidence that radar is always reliable.", "C": "It states the study's final conclusion.", "D": "It identifies the uncertainty that motivated the study."}, "optsZh": {"A": "它描述其他研究者如何批評這項研究。", "B": "它提供證據證明雷達永遠可靠。", "C": "它陳述這項研究的最終結論。", "D": "它指出促成這項研究的不確定之處。"}, "answer": "D", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Structure: letter delivery then joy", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。一篇考古學文章一開頭就說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，用於這種交流的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。這篇文章接著討論一個團隊，他們在陶器中尋找化學特徵，卻只得到初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It summarizes the team's strongest result.", "C": "It contradicts the claim made in the first sentence.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它界定了後續研究試圖解決的問題。", "B": "它概述該團隊最有力的研究結果。", "C": "它反駁了第一句提出的主張。", "D": "它把討論從考古學轉移開來。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Structure: letter delivery then joy", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mechanism\" target=\"_blank\" rel=\"noopener\" data-w=\"mechanism\" data-pos=\"n.\" data-en=\"a set of moving parts in a machine that perform a function\" data-zh=\"機械裝置；機制\">mechanism<\/a> allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。一篇生物學文章指出，某種植物能在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述一項排除了其中一種可能機制的實驗。", "opts": {"A": "It lists the materials used in the experiment.", "B": "It gives a historical overview of plant classification.", "C": "It introduces a gap in knowledge that the experiment examines.", "D": "It proves that drought has no effect on plants."}, "optsZh": {"A": "它列出實驗中使用的材料。", "B": "它概述植物分類的歷史。", "C": "它引出實驗所要探究的知識空白。", "D": "它證明乾旱對植物沒有任何影響。"}, "answer": "C", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Text Structure: letter delivery then joy", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\"
