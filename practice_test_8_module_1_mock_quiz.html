<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 8, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 8, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: historically important figure", "vocab": true, "body": "As Mexico’s first president from an Indigenous community, Benito Juarez became one of the most ______ figures in his country’s history: among the many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> accomplishments of his long tenure in office (1858–1872), Juarez <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consolidate\" target=\"_blank\" rel=\"noopener\" data-w=\"consolidate\" data-pos=\"v.\" data-en=\"to make stronger or more secure; to combine\" data-zh=\"鞏固；統一\">consolidated<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> government and advanced the rights of Indigenous peoples.", "bodyPlain": "As Mexico’s first president from an Indigenous community, Benito Juarez became one of the most ______ figures in his country’s history: among the many significant accomplishments of his long tenure in office (1858–1872), Juarez consolidated the authority of the national government and advanced the rights of Indigenous peoples.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "身為墨西哥第一位出身原住民社群的總統，Benito Juarez 成為該國歷史上最 ______ 的人物之一：在他漫長的任期（1858–1872）中的眾多重大成就裡，Juarez 鞏固了中央政府的權威，並推進了原住民的權利。", "opts": {"A": "unpredictable", "B": "important", "C": "secretive", "D": "ordinary"}, "optsZh": {"A": "unpredictable（無法預測的）", "B": "important（重要的）", "C": "secretive（隱密的、守口如瓶的）", "D": "ordinary（普通的；平凡的）"}, "answer": "B", "expl": "Juarez's 'many significant accomplishments' show he was one of the most 'important' figures in Mexico's history.", "explZh": "Juarez「許多重大成就」顯示他是墨西哥歷史上最「important」（重要）的人物之一。", "defs": {"A": {"pos": "adj.", "en": "not able to be known or expected in advance", "zh": "無法預測的；難以預料的", "word": "unpredictable"}, "B": {"pos": "adj.", "en": "having great value, meaning, or effect", "zh": "重要的；重大的", "word": "important"}, "C": {"pos": "adj.", "en": "tending to hide feelings, plans, or information", "zh": "隱密的；守口如瓶的", "word": "secretive"}, "D": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: historically important figure", "vocab": true, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Because the jurist expanded voting rights and helped stabilize the republic after years of crisis, historians regard her as one of the most _______ figures in the country&#x27;s constitutional history.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Because the jurist expanded voting rights and helped stabilize the republic after years of crisis, historians regard her as one of the most _______ figures in the country's constitutional history.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。由於這位法學家擴大了投票權，並在多年危機後協助穩定共和國，歷史學家認為她是該國憲政史上最 _______ 的人物之一。", "opts": {"A": "consequential", "B": "secretive", "C": "ordinary", "D": "unpredictable"}, "optsZh": {"A": "consequential（重大的、影響深遠的）", "B": "secretive（隱密的、守口如瓶的）", "C": "ordinary（普通的；平凡的）", "D": "unpredictable（無法預測的）"}, "answer": "A", "expl": "Consequential means important.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "important and having significant results", "zh": "重大的；影響深遠的", "word": "consequential"}, "B": {"pos": "adj.", "en": "tending to hide feelings, plans, or information", "zh": "隱密的；守口如瓶的", "word": "secretive"}, "C": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "D": {"pos": "adj.", "en": "not able to be known or expected in advance", "zh": "無法預測的；難以預料的", "word": "unpredictable"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: historically important figure", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. The engineer&#x27;s bridge designs transformed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a> across the region, making him an _______ figure in the history of public infrastructure.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The engineer's bridge designs transformed transportation across the region, making him an _______ figure in the history of public infrastructure.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這位工程師的橋梁設計改變了整個地區的交通，使他成為公共基礎建設史上一位 _______ 的人物。", "opts": {"A": "irrelevant", "B": "anonymous", "C": "influential", "D": "erratic"}, "optsZh": {"A": "irrelevant（無關的）", "B": "anonymous（匿名的）", "C": "influential（有影響力的）", "D": "erratic（不穩定的、無規律的）"}, "answer": "C", "expl": "Influential means important because of effect.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not related to the matter being discussed", "zh": "無關的", "word": "irrelevant"}, "B": {"pos": "adj.", "en": "made or done by someone whose name is not known", "zh": "匿名的；不具名的", "word": "anonymous"}, "C": {"pos": "adj.", "en": "having a great effect on people or events", "zh": "有影響力的", "word": "influential"}, "D": {"pos": "adj.", "en": "not regular or predictable; changing often", "zh": "不規則的；反覆無常的", "word": "erratic"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: historically important figure", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The minister&#x27;s education reforms were so widely adopted that she became a _______ figure in the development of modern public schools.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The minister's education reforms were so widely adopted that she became a _______ figure in the development of modern public schools.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。這位部長的教育改革被廣泛採用，以至於她成為現代公立學校發展史上一位 _______ 的人物。", "opts": {"A": "minor", "B": "incidental", "C": "secretive", "D": "prominent"}, "optsZh": {"A": "minor（次要的；輕微的）", "B": "incidental（附帶的、偶然的）", "C": "secretive（隱密的、守口如瓶的）", "D": "prominent（顯著的；重要的）"}, "answer": "D", "expl": "Prominent means important or well known.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "small and not very important", "zh": "次要的；輕微的", "word": "minor"}, "B": {"pos": "adj.", "en": "happening by chance as a minor side effect, not by design", "zh": "偶然的；附帶的", "word": "incidental"}, "C": {"pos": "adj.", "en": "tending to hide feelings, plans, or information", "zh": "隱密的；守口如瓶的", "word": "secretive"}, "D": {"pos": "adj.", "en": "important and well known; easily noticed", "zh": "顯著的；重要的", "word": "prominent"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: historically important figure", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The poet&#x27;s work reshaped the national literary tradition, so critics describe her as _______ rather than merely popular in her own time.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The poet's work reshaped the national literary tradition, so critics describe her as _______ rather than merely popular in her own time.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中 than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The judge&#x27;s decisions altered civil rights law for decades, securing her place as a _______ figure in legal history.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The judge's decisions altered civil rights law for decades, securing her place as a _______ figure in legal history.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。這位法官的判決改變了數十年的民權法律，確立了她在法律史上作為一位 _______ 人物的地位。", "opts": {"A": "private", "B": "obscure", "C": "pivotal", "D": "ordinary"}, "optsZh": {"A": "private（私人的）", "B": "obscure（模糊的；鮮為人知的；使隱晦）", "C": "pivotal（關鍵的）", "D": "ordinary（普通的；平凡的）"}, "answer": "C", "expl": "Pivotal means centrally important.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "belonging to or meant for one person or group; not public", "zh": "私人的；私下的", "word": "private"}, "B": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "C": {"pos": "adj.", "en": "of central importance, especially in causing change", "zh": "關鍵的；舉足輕重的", "word": "pivotal"}, "D": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: substantial biological effect", "vocab": true, "body": "Mônica Lopes-Ferreira and others at Brazil’s Butantan Institute are studying the freshwater stingray species Potamotrygon rex to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether biological <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=characteristic\" target=\"_blank\" rel=\"noopener\" data-w=\"characteristic\" data-pos=\"n.\" data-en=\"a typical quality or feature\" data-zh=\"特徵；特性\">characteristics<\/a> such as the rays&#x27; age and sex have _______ effect on the toxicity of their venom—that is, to see if differences in these traits are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=considerable\" target=\"_blank\" rel=\"noopener\" data-w=\"considerable\" data-pos=\"adj.\" data-en=\"large in amount or importance\" data-zh=\"相當大的；可觀的\">considerable<\/a> variations in venom potency.", "bodyPlain": "Mônica Lopes-Ferreira and others at Brazil’s Butantan Institute are studying the freshwater stingray species Potamotrygon rex to determine whether biological characteristics such as the rays' age and sex have _______ effect on the toxicity of their venom—that is, to see if differences in these traits are associated with considerable variations in venom potency.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "巴西 Butantan Institute 的 Mônica Lopes-Ferreira 等人正在研究淡水魟魚物種 Potamotrygon rex，以確定魟魚的年齡和性別等生物特徵是否對其毒液的毒性有 _______ 影響——也就是說，要看看這些特徵的差異是否與毒液效力的顯著變化有關。", "opts": {"A": "a disconcerting", "B": "an acceptable", "C": "an imperceptible", "D": "a substantial"}, "optsZh": {"A": "a disconcerting（令人不安的）", "B": "an acceptable（可接受的）", "C": "an imperceptible（難以察覺的）", "D": "a substantial（相當大的）"}, "answer": "D", "expl": "The clarification says the researchers want to see whether the traits are linked to 'considerable variations' in potency, i.e., 'a substantial' effect.", "explZh": "後面的說明指出研究者想知道這些特徵是否與毒性的「相當大差異」有關，也就是「a substantial」（顯著的）影響。", "defs": {"A": {"w": "disconcerting", "pos": "adj.", "en": "causing worry, confusion, or unease", "zh": "令人不安的；使人困惑的", "word": "disconcerting"}, "B": {"w": "acceptable", "pos": "adj.", "en": "good enough to be allowed or approved", "zh": "可接受的；尚可的", "word": "acceptable"}, "C": {"w": "imperceptible", "pos": "adj.", "en": "too small or slight to be noticed", "zh": "察覺不到的；極細微的", "word": "imperceptible"}, "D": {"w": "substantial", "pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；相當大的；重大的", "word": "substantial"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: substantial biological effect", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The researchers tested whether soil acidity had _______ effect on seed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=germination\" target=\"_blank\" rel=\"noopener\" data-w=\"germination\" data-pos=\"n.\" data-en=\"the process of a seed or spore beginning to grow\" data-zh=\"發芽；萌發\">germination<\/a>, since even small chemical differences can alter how quickly roots emerge.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The researchers tested whether soil acidity had _______ effect on seed germination, since even small chemical differences can alter how quickly roots emerge.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。研究人員測試了土壤酸度是否對種子發芽有 _______ 影響，因為即使是微小的化學差異，也可能改變根部冒出的速度。", "opts": {"A": "a decorative", "B": "a measurable", "C": "an imperceptible", "D": "an acceptable"}, "optsZh": {"A": "a decorative（裝飾性的）", "B": "a measurable（可測量的、明顯的）", "C": "an imperceptible（難以察覺的）", "D": "an acceptable（可接受的）"}, "answer": "B", "expl": "Measurable means detectably significant.", "explZh": "", "defs": {"A": {"w": "decorative", "pos": "adj.", "en": "intended to look attractive rather than to be useful", "zh": "裝飾性的", "word": "decorative"}, "B": {"w": "measurable", "pos": "adj.", "en": "large enough to be measured or noticed", "zh": "可測量的；明顯的", "word": "measurable"}, "C": {"w": "imperceptible", "pos": "adj.", "en": "too small or slight to be noticed", "zh": "察覺不到的；極細微的", "word": "imperceptible"}, "D": {"w": "acceptable", "pos": "adj.", "en": "good enough to be allowed or approved", "zh": "可接受的；尚可的", "word": "acceptable"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: substantial biological effect", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. The study asks whether sleep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=duration\" target=\"_blank\" rel=\"noopener\" data-w=\"duration\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"持續時間\">duration<\/a> has _______ effect on memory consolidation or whether the apparent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> disappears after stress is controlled.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The study asks whether sleep duration has _______ effect on memory consolidation or whether the apparent relationship disappears after stress is controlled.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這項研究探討睡眠時間是否對記憶鞏固有 _______ 影響，或者在控制壓力因素之後，這種表面上的關聯是否就會消失。", "opts": {"A": "an unrelated", "B": "a symbolic", "C": "a substantial", "D": "a trivial"}, "optsZh": {"A": "an unrelated（無關的）", "B": "a symbolic（象徵性的）", "C": "a substantial（相當大的）", "D": "a trivial（瑣碎的、微不足道的）"}, "answer": "C", "expl": "Substantial means considerable.", "explZh": "", "defs": {"A": {"w": "unrelated", "pos": "adj.", "en": "not connected to something else", "zh": "無關的", "word": "unrelated"}, "B": {"w": "symbolic", "pos": "adj.", "en": "representing an idea rather than having practical effect", "zh": "象徵性的", "word": "symbolic"}, "C": {"w": "substantial", "pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；相當大的；重大的", "word": "substantial"}, "D": {"w": "trivial", "pos": "adj.", "en": "of little value or importance", "zh": "瑣碎的；微不足道的", "word": "trivial"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: substantial biological effect", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Marine biologists examined whether water <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> has _______ influence on coral recovery after bleaching events.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Marine biologists examined whether water temperature has _______ influence on coral recovery after bleaching events.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。海洋生物學家研究了水溫是否對白化事件後珊瑚的復原有 _______ 影響。", "opts": {"A": "a significant", "B": "a temporary", "C": "an acceptable", "D": "an invisible"}, "optsZh": {"A": "a significant（顯著的、重大的）", "B": "a temporary（暫時的）", "C": "an acceptable（可接受的）", "D": "an invisible（看不見的）"}, "answer": "A", "expl": "Significant means important or substantial.", "explZh": "", "defs": {"A": {"w": "significant", "pos": "adj.", "en": "large or important enough to be noticed", "zh": "顯著的；重大的", "word": "significant"}, "B": {"w": "temporary", "pos": "adj.", "en": "lasting only for a limited time", "zh": "暫時的", "word": "temporary"}, "C": {"w": "acceptable", "pos": "adj.", "en": "good enough to be allowed or approved", "zh": "可接受的；尚可的", "word": "acceptable"}, "D": {"w": "invisible", "pos": "adj.", "en": "not able to be seen", "zh": "看不見的", "word": "invisible"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: substantial biological effect", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The team wanted to know whether the coating would have _______ effect on heat loss in older buildings.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The team wanted to know whether the coating would have _______ effect on heat loss in older buildings.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。這個團隊想知道這種塗層是否會對老舊建築的熱能散失有 _______ 影響。", "opts": {"A": "a considerable", "B": "an imperceptible", "C": "an unrelated", "D": "a hidden"}, "optsZh": {"A": "a considerable（相當大的、可觀的）", "B": "an imperceptible（難以察覺的）", "C": "an unrelated（無關的）", "D": "a hidden（隱藏的）"}, "answer": "A", "expl": "Considerable means substantial.", "explZh": "", "defs": {"A": {"w": "considerable", "pos": "adj.", "en": "large in size, amount, or degree", "zh": "相當大的；可觀的", "word": "considerable"}, "B": {"w": "imperceptible", "pos": "adj.", "en": "too small or slight to be noticed", "zh": "察覺不到的；極細微的", "word": "imperceptible"}, "C": {"w": "unrelated", "pos": "adj.", "en": "not connected to something else", "zh": "無關的", "word": "unrelated"}, "D": {"w": "hidden", "pos": "adj.", "en": "not easy to see or notice", "zh": "隱藏的", "word": "hidden"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: substantial biological effect", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Economists tested whether transit access had _______ effect on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=employment\" target=\"_blank\" rel=\"noopener\" data-w=\"employment\" data-pos=\"n.\" data-en=\"work for which people are paid; the state of having a job\" data-zh=\"就業；雇用\">employment<\/a> rates in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> far from city centers.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Economists tested whether transit access had _______ effect on employment rates in neighborhoods far from city centers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。經濟學家測試了大眾運輸的可及性是否對遠離市中心的社區的就業率有 _______ 影響。", "opts": {"A": "a negligible", "B": "an acceptable", "C": "a decorative", "D": "a pronounced"}, "optsZh": {"A": "a negligible（微不足道的、可忽略的）", "B": "an acceptable（可接受的）", "C": "a decorative（裝飾性的）", "D": "a pronounced（顯著的、明顯的）"}, "answer": "D", "expl": "Pronounced means clearly noticeable.", "explZh": "", "defs": {"A": {"w": "negligible", "pos": "adj.", "en": "so small that it is not important", "zh": "微不足道的；可忽略的", "word": "negligible"}, "B": {"w": "acceptable", "pos": "adj.", "en": "good enough to be allowed or approved", "zh": "可接受的；尚可的", "word": "acceptable"}, "C": {"w": "decorative", "pos": "adj.", "en": "intended to look attractive rather than to be useful", "zh": "裝飾性的", "word": "decorative"}, "D": {"w": "pronounced", "pos": "adj.", "en": "very noticeable; strongly marked", "zh": "顯著的；明顯的", "word": "pronounced"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: tranquil environment", "vocab": true, "body": "Kelp forests grow underwater along the eastern Pacific Coast. These underwater forests are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=important\" target=\"_blank\" rel=\"noopener\" data-w=\"important\" data-pos=\"adj.\" data-en=\"having great value, meaning, or effect\" data-zh=\"重要的；重大的\">important<\/a> to fish and other marine animals. Ocean currents can be powerful and rough, making it difficult for animals to find safe places to hide from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a>. The underwater forests slow down the currents. This creates a more _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a> with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calm\" target=\"_blank\" rel=\"noopener\" data-w=\"calm\" data-pos=\"adj.\" data-en=\"peaceful and quiet; not rough\" data-zh=\"平靜的\">calmer<\/a> waters where animals can take shelter.", "bodyPlain": "Kelp forests grow underwater along the eastern Pacific Coast. These underwater forests are important to fish and other marine animals. Ocean currents can be powerful and rough, making it difficult for animals to find safe places to hide from predators. The underwater forests slow down the currents. This creates a more _______ environment with calmer waters where animals can take shelter.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "海帶森林生長在東太平洋沿岸的水下。這些水下森林對魚類和其他海洋動物十分重要。洋流可能強勁而洶湧，使動物難以找到安全的地方躲避掠食者。水下森林會減緩洋流的速度。這創造出一個更 _______ 的環境，水流較為平靜，動物可以在其中尋求庇護。", "opts": {"A": "tranquil", "B": "dangerous", "C": "imaginative", "D": "surprising"}, "optsZh": {"A": "tranquil（平靜的、寧靜的）", "B": "dangerous（危險的）", "C": "imaginative（富有想像力的）", "D": "surprising（令人驚訝的）"}, "answer": "A", "expl": "The forests slow currents, creating 'calmer waters,' so the environment is more 'tranquil.'", "explZh": "海藻林減緩洋流、形成「較平靜的水域」，所以環境更「tranquil」（寧靜）。", "defs": {"A": {"pos": "adj.", "en": "calm, quiet, and peaceful", "zh": "平靜的；寧靜的", "word": "tranquil"}, "B": {"pos": "adj.", "en": "likely to cause harm or injury", "zh": "危險的", "word": "dangerous"}, "C": {"pos": "adj.", "en": "having or showing new and interesting ideas", "zh": "富有想像力的", "word": "imaginative"}, "D": {"pos": "adj.", "en": "unexpected and causing surprise", "zh": "令人驚訝的", "word": "surprising"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: tranquil environment", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The windbreaks slowed the gusts that usually swept across the field, creating a more _______ area where young plants could grow without being damaged.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The windbreaks slowed the gusts that usually swept across the field, creating a more _______ area where young plants could grow without being damaged.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。防風林減緩了通常橫掃田野的強風，創造出一個更 _______ 的區域，讓幼苗得以生長而不受損害。", "opts": {"A": "sheltered", "B": "imaginative", "C": "dangerous", "D": "surprising"}, "optsZh": {"A": "sheltered（受庇護的、遮蔽的）", "B": "imaginative（富有想像力的）", "C": "dangerous（危險的）", "D": "surprising（令人驚訝的）"}, "answer": "A", "expl": "Sheltered fits a calmer environment.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "protected from wind, weather, or danger", "zh": "受庇護的；有遮蔽的", "word": "sheltered"}, "B": {"pos": "adj.", "en": "having or showing new and interesting ideas", "zh": "富有想像力的", "word": "imaginative"}, "C": {"pos": "adj.", "en": "likely to cause harm or injury", "zh": "危險的", "word": "dangerous"}, "D": {"pos": "adj.", "en": "unexpected and causing surprise", "zh": "令人驚訝的", "word": "surprising"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: tranquil environment", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. The library&#x27;s thick walls and shaded courtyard make the reading room unusually _______ even during the crowded afternoon hours.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The library's thick walls and shaded courtyard make the reading room unusually _______ even during the crowded afternoon hours.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。圖書館厚實的牆壁和遮蔭的中庭，使閱覽室即使在擁擠的午後時段也格外 _______。", "opts": {"A": "unexpected", "B": "tranquil", "C": "inventive", "D": "hazardous"}, "optsZh": {"A": "unexpected（出乎意料的）", "B": "tranquil（平靜的、寧靜的）", "C": "inventive（有創造力的、別出心裁的）", "D": "hazardous（危險的）"}, "answer": "B", "expl": "Tranquil means calm.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not expected or predicted", "zh": "意外的；出乎意料的", "word": "unexpected"}, "B": {"pos": "adj.", "en": "calm, quiet, and peaceful", "zh": "平靜的；寧靜的", "word": "tranquil"}, "C": {"pos": "adj.", "en": "good at thinking of new and original ideas", "zh": "有創造力的；別出心裁的", "word": "inventive"}, "D": {"pos": "adj.", "en": "dangerous; likely to cause harm", "zh": "危險的", "word": "hazardous"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: tranquil environment", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Mangrove roots reduce wave energy along the shore, producing a _______ habitat where juvenile fish can avoid strong currents.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Mangrove roots reduce wave energy along the shore, producing a _______ habitat where juvenile fish can avoid strong currents.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種描述或結論是合理的。紅樹林的根系減弱了沿岸的波浪能量，形成一個 _______ 的棲地，讓幼魚可以避開強勁的水流。", "opts": {"A": "unstable", "B": "dangerous", "C": "dramatic", "D": "calm"}, "optsZh": {"A": "unstable（不穩定的）", "B": "dangerous（危險的）", "C": "dramatic（戲劇性的、劇烈的）", "D": "calm（平靜的）"}, "answer": "D", "expl": "Calm means tranquil.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "likely to change or fall; not firm", "zh": "不穩定的", "word": "unstable"}, "B": {"pos": "adj.", "en": "likely to cause harm or injury", "zh": "危險的", "word": "dangerous"}, "C": {"pos": "adj.", "en": "sudden and very noticeable; exciting", "zh": "劇烈的；戲劇性的", "word": "dramatic"}, "D": {"pos": "adj.", "en": "peaceful and quiet; not rough", "zh": "平靜的", "word": "calm"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: tranquil environment", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The curtains absorbed street noise and softened the light, making the studio feel _______ despite its location above a busy market.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The curtains absorbed street noise and softened the light, making the studio feel _______ despite its location above a busy market.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採行了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的、哪些只是資料所暗示的。窗簾吸收了街道的噪音並柔化了光線，讓這間工作室儘管位於熱鬧市場的樓上，仍讓人感覺 _______。", "opts": {"A": "dangerous", "B": "imaginative", "C": "serene", "D": "strange"}, "optsZh": {"A": "dangerous（危險的）", "B": "imaginative（富有想像力的）", "C": "serene（寧靜的、安詳的）", "D": "strange（奇怪的）"}, "answer": "C", "expl": "Serene means peaceful.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "likely to cause harm or injury", "zh": "危險的", "word": "dangerous"}, "B": {"pos": "adj.", "en": "having or showing new and interesting ideas", "zh": "富有想像力的", "word": "imaginative"}, "C": {"pos": "adj.", "en": "calm, peaceful, and untroubled", "zh": "寧靜的；安詳的", "word": "serene"}, "D": {"pos": "adj.", "en": "unusual or surprising", "zh": "奇怪的", "word": "strange"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: tranquil environment", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The reef breaks the force of the surf, forming a _______ lagoon in which smaller organisms can feed and shelter.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The reef breaks the force of the surf, forming a _______ lagoon in which smaller organisms can feed and shelter.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而非某一次戲劇性的發現。研究人員先描述研究方法、對照組以及證據的侷限，再提出一個必須兼具精確與克制的結論。礁石削弱了浪潮的衝擊力，形成一個 _______ 的潟湖，較小的生物可以在其中覓食和棲身。", "opts": {"A": "placid", "B": "surprising", "C": "dangerous", "D": "ornate"}, "optsZh": {"A": "placid（平靜的、寧靜的）", "B": "surprising（令人驚訝的）", "C": "dangerous（危險的）", "D": "ornate（華麗的；裝飾繁複的）"}, "answer": "A", "expl": "Placid means calm.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "calm and peaceful, with little movement", "zh": "平靜的；寧靜的", "word": "placid"}, "B": {"pos": "adj.", "en": "unexpected and causing surprise", "zh": "令人驚訝的", "word": "surprising"}, "C": {"pos": "adj.", "en": "likely to cause harm or injury", "zh": "危險的", "word": "dangerous"}, "D": {"pos": "adj.", "en": "having a lot of complicated decoration", "zh": "華麗的；裝飾繁複的", "word": "ornate"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: collaboration between writers", "vocab": true, "body": "The Mule Bone, a 1930 play written by Zora Neale Hurston and Langston Hughes, is perhaps the best-known of the few examples of ______ in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>. Most writers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prefer\" target=\"_blank\" rel=\"noopener\" data-w=\"prefer\" data-pos=\"v.\" data-en=\"to like one thing more than another\" data-zh=\"偏好；比較喜歡\">prefer<\/a> working alone, and given that working together cost Hurston and Hughes their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=friendship\" target=\"_blank\" rel=\"noopener\" data-w=\"friendship\" data-pos=\"n.\" data-en=\"a relationship between friends\" data-zh=\"友誼\">friendship<\/a>, it is not hard to see why.", "bodyPlain": "The Mule Bone, a 1930 play written by Zora Neale Hurston and Langston Hughes, is perhaps the best-known of the few examples of ______ in literature. Most writers prefer working alone, and given that working together cost Hurston and Hughes their friendship, it is not hard to see why.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "《The Mule Bone》是 Zora Neale Hurston 與 Langston Hughes 於 1930 年合寫的劇作，它或許是文學中少數 ______ 例子裡最著名的一個。大多數作家偏好獨自寫作，而既然合作讓 Hurston 和 Hughes 失去了友誼，原因也就不難理解了。", "opts": {"A": "characterization", "B": "interpretation", "C": "collaboration", "D": "commercialization"}, "optsZh": {"A": "characterization（人物塑造、性格描寫）", "B": "interpretation（詮釋、解讀）", "C": "collaboration（合作、協作）", "D": "commercialization（商業化）"}, "answer": "C", "expl": "Hurston and Hughes wrote the play together, and most writers prefer working alone, so it is an example of 'collaboration.'", "explZh": "Hurston 和 Hughes 合寫這部劇本，而多數作家偏好獨自寫作，所以這是「collaboration」（合作）的例子。", "defs": {"A": {"pos": "n.", "en": "the way a writer creates and describes characters", "zh": "人物塑造；性格描寫", "word": "characterization"}, "B": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}, "C": {"pos": "n.", "en": "the act of working together with others to create or achieve something", "zh": "合作；協作", "word": "collaboration"}, "D": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: collaboration between writers", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The film is a rare example of artistic _______: two directors wrote every scene together and shared responsibility for editing the final cut.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The film is a rare example of artistic _______: two directors wrote every scene together and shared responsibility for editing the final cut.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一項主張；這項主張的措辭取決於各細節之間的確切關係，而非單一孤立的關鍵字。這部電影是藝術 _______ 的罕見例子：兩位導演一起撰寫每一場戲，並共同負責最終版本的剪輯。", "opts": {"A": "interpretation", "B": "commercialization", "C": "collaboration", "D": "characterization"}, "optsZh": {"A": "interpretation（詮釋、解讀）", "B": "commercialization（商業化）", "C": "collaboration（合作、協作）", "D": "characterization（人物塑造、性格描寫）"}, "answer": "C", "expl": "Collaboration means working together.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}, "B": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}, "C": {"pos": "n.", "en": "the act of working together with others to create or achieve something", "zh": "合作；協作", "word": "collaboration"}, "D": {"pos": "n.", "en": "the way a writer creates and describes characters", "zh": "人物塑造；性格描寫", "word": "characterization"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: collaboration between writers", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> seem less adequate. The mural resulted from a close _______ between <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=residents\" target=\"_blank\" rel=\"noopener\" data-w=\"residents\" data-pos=\"n.\" data-en=\"people who live in a particular place\" data-zh=\"居民\">residents<\/a> and professional artists, each group shaping the final design.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The mural resulted from a close _______ between neighborhood residents and professional artists, each group shaping the final design.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，編輯與合作者在計畫達到最終公開形式之前，修改了其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一項計畫如何隨時間演變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓某個先前過於簡單的詮釋顯得不夠充分。這幅壁畫源自社區居民與專業藝術家之間密切的 _______，雙方都參與塑造了最終的設計。", "opts": {"A": "partnership", "B": "characterization", "C": "isolation", "D": "interpretation"}, "optsZh": {"A": "partnership（合夥、合作關係）", "B": "characterization（人物塑造、性格描寫）", "C": "isolation（孤立、隔離）", "D": "interpretation（詮釋、解讀）"}, "answer": "A", "expl": "Partnership means collaboration.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a relationship in which people work together", "zh": "合夥；合作關係", "word": "partnership"}, "B": {"pos": "n.", "en": "the way a writer creates and describes characters", "zh": "人物塑造；性格描寫", "word": "characterization"}, "C": {"pos": "n.", "en": "the state of being alone or separated from others", "zh": "孤立；隔離", "word": "isolation"}, "D": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: collaboration between writers", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The opera&#x27;s score reflects unusual _______: the composer invited three poets to revise the libretto throughout rehearsals.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The opera's score reflects unusual _______: the composer invited three poets to revise the libretto throughout rehearsals.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "參觀展覽的民眾看到了素描、錄音和說明標籤，這些展品呈現出作品如何透過反覆實驗而逐步發展。一份博物館目錄將某位藝術家、某件物品或某場表演，與形塑它的社會及技術條件聯繫起來加以介紹。這份目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的串連起來，讓讀者理解為何某種
