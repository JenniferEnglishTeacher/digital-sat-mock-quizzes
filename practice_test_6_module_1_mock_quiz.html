thletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。幾本掛名名人運動員的回憶錄，實際上是由合作者撰寫的，他們把其他 ______ 塑造成精緻的敘事，自己卻始終不具名。", "opts": {"A": "people's stories", "B": "peoples stories", "C": "peoples story's", "D": "people's story's"}, "optsZh": {"A": "people's stories（people 的複數所有格＋複數名詞 stories：正確）", "B": "peoples stories（缺少所有格符號 → 錯誤）", "C": "peoples story's（所有格位置錯誤 → 錯誤）", "D": "people's story's（story's 為所有格 → 此處需要複數名詞：錯誤）"}, "answer": "A", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Grammar: no punctuation after complete verb.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動並 ______ 在扁平的石頭下，那裡的溫度比裸露的沙地更穩定。", "opts": {"A": "shelters", "B": "had sheltered", "C": "sheltered", "D": "would shelter"}, "optsZh": {"A": "shelters（第三人稱單數現在式，與 reduces 平行，表一般事實：正確）", "B": "had sheltered（過去完成式 → 與 reduces 的現在式不平行：錯誤）", "C": "sheltered（過去式 → 與 reduces 的現在式不平行：錯誤）", "D": "would shelter（would＋原形 → 與 reduces 的現在式不平行：錯誤）"}, "answer": "A", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Grammar: no punctuation after complete verb.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively, during", "B": "triumphed--decisively. During", "C": "triumphed--decisively during", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively, during（逗號 → 造成逗號連接錯誤：錯誤）", "B": "triumphed--decisively. During（句號，分隔兩個完整句子：正確）", "C": "triumphed--decisively during（缺少句號 → 造成連寫句：錯誤）", "D": "triumphed--decisively--during（破折號 → 無法分隔兩個獨立句子：錯誤）"}, "answer": "B", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Grammar: no punctuation after complete verb.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮革封面的筆記本。", "opts": {"A": "have been", "B": "are", "C": "is", "D": "were"}, "optsZh": {"A": "have been（現在完成式 → 本題答案採用過去式 were：錯誤）", "B": "are（複數現在式 be 動詞；本題答案採用表過去打撈事件的 were）", "C": "is（單數 be 動詞 → 主詞為複數（一個羅盤、三個碗和一本筆記本）：錯誤）", "D": "were（複數過去式 be 動詞，與複數主詞一致：正確）"}, "answer": "D", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Grammar: no punctuation after complete verb.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位工程師在 2011 年完成了一個小型原型 ______ 2018 年，她發表了一個可以運作數小時的全尺寸版本。", "opts": {"A": "prototype,", "B": "prototype later,", "C": "prototype;", "D": "prototype, later,"}, "optsZh": {"A": "prototype,（逗號 → 造成逗號連接錯誤：錯誤）", "B": "prototype later,（無標點連接兩個獨立子句 → 連寫句：錯誤）", "C": "prototype;（分號，連接兩個相關的獨立子句：正確）", "D": "prototype, later,（逗號 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Grammar: singular subject requires creates.", "vocab": false, "body": "&quot;He was just the man for such a place, and it was just the place for such a man.&quot; This line is from Frederick Douglass&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=autobiography\" target=\"_blank\" rel=\"noopener\" data-w=\"autobiography\" data-pos=\"n.\" data-en=\"a book about a person&#x27;s life written by that person\" data-zh=\"自傳\">autobiography<\/a> Narrative of the Life of Frederick Douglass (1845). It&#x27;s an example of antimetabole, a writing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> that _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasis\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasis\" data-pos=\"n.\" data-en=\"special importance or attention given to something\" data-zh=\"強調；重點\">emphasis<\/a> by repeating a statement in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reverse\" target=\"_blank\" rel=\"noopener\" data-w=\"reverse\" data-pos=\"v.\" data-en=\"to change something to its opposite order or direction\" data-zh=\"顛倒；反轉\">reversed<\/a> order.", "bodyPlain": "\"He was just the man for such a place, and it was just the place for such a man.\" This line is from Frederick Douglass's autobiography Narrative of the Life of Frederick Douglass (1845). It's an example of antimetabole, a writing technique that _______ emphasis by repeating a statement in a reversed order.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "「他正是適合這種地方的人，而這裡也正是適合這種人的地方。」這句話出自 Frederick Douglass 的自傳《Narrative of the Life of Frederick Douglass》（1845 年）。這是「迴文反覆法」（antimetabole）的例子，這種寫作技巧 _______ 藉由以顛倒的順序重複一句陳述來加強語氣。", "opts": {"A": "create", "B": "are creating", "C": "have created", "D": "creates"}, "optsZh": {"A": "create（複數動詞 → 主詞 a writing technique 為單數：錯誤）", "B": "are creating（現在進行式，複數 → 主詞為單數：錯誤）", "C": "have created（現在完成式，複數 → 主詞為單數：錯誤）", "D": "creates（單數現在式，與單數主詞一致並表一般事實：正確）"}, "answer": "D", "expl": "The subject 'a writing technique that' refers to a singular noun, so the verb must be singular 'creates'; it also describes a general fact in the present tense.", "explZh": "關係代名詞 that 指的是單數名詞 a writing technique，所以動詞要用單數「creates」，並以現在式描述一般事實。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Grammar: singular subject requires creates.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。幾本掛名名人運動員的回憶錄，實際上是由合作者撰寫的，他們把其他 ______ 塑造成精緻的敘事，自己卻始終不具名。", "opts": {"A": "people's stories", "B": "peoples story's", "C": "peoples stories", "D": "people's story's"}, "optsZh": {"A": "people's stories（people 的複數所有格＋複數名詞 stories：正確）", "B": "peoples story's（所有格位置錯誤 → 錯誤）", "C": "peoples stories（缺少所有格符號 → 錯誤）", "D": "people's story's（story's 為所有格 → 此處需要複數名詞：錯誤）"}, "answer": "A", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Grammar: singular subject requires creates.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動並 ______ 在扁平的石頭下，那裡的溫度比裸露的沙地更穩定。", "opts": {"A": "would shelter", "B": "sheltered", "C": "shelters", "D": "had sheltered"}, "optsZh": {"A": "would shelter（would＋原形 → 與 reduces 的現在式不平行：錯誤）", "B": "sheltered（過去式 → 與 reduces 的現在式不平行：錯誤）", "C": "shelters（第三人稱單數現在式，與 reduces 平行，表一般事實：正確）", "D": "had sheltered（過去完成式 → 與 reduces 的現在式不平行：錯誤）"}, "answer": "C", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Grammar: singular subject requires creates.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively, during", "B": "triumphed--decisively. During", "C": "triumphed--decisively during", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively, during（逗號 → 造成逗號連接錯誤：錯誤）", "B": "triumphed--decisively. During（句號，分隔兩個完整句子：正確）", "C": "triumphed--decisively during（缺少句號 → 造成連寫句：錯誤）", "D": "triumphed--decisively--during（破折號 → 無法分隔兩個獨立句子：錯誤）"}, "answer": "B", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Grammar: singular subject requires creates.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮革封面的筆記本。", "opts": {"A": "are", "B": "were", "C": "have been", "D": "is"}, "optsZh": {"A": "are（複數現在式 be 動詞；本題答案採用表過去打撈事件的 were）", "B": "were（複數過去式 be 動詞，與複數主詞一致：正確）", "C": "have been（現在完成式 → 本題答案採用過去式 were：錯誤）", "D": "is（單數 be 動詞 → 主詞為複數（一個羅盤、三個碗和一本筆記本）：錯誤）"}, "answer": "B", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Grammar: singular subject requires creates.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位工程師在 2011 年完成了一個小型原型 ______ 2018 年，她發表了一個可以運作數小時的全尺寸版本。", "opts": {"A": "prototype,", "B": "prototype, later,", "C": "prototype later,", "D": "prototype;"}, "optsZh": {"A": "prototype,（逗號 → 造成逗號連接錯誤：錯誤）", "B": "prototype, later,（逗號 → 造成逗號連接錯誤：錯誤）", "C": "prototype later,（無標點連接兩個獨立子句 → 連寫句：錯誤）", "D": "prototype;（分號，連接兩個相關的獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Grammar: embedded question uses statement order and period.", "vocab": false, "body": "Researchers Amit Kumar and Nicholas Epley <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> how _______ In a series of experiments <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conduct\" target=\"_blank\" rel=\"noopener\" data-w=\"conduct\" data-pos=\"v.\" data-en=\"to organize and carry out an activity\" data-zh=\"進行；實施\">conducted<\/a> in 2022, they found that people performing small acts of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=kindness\" target=\"_blank\" rel=\"noopener\" data-w=\"kindness\" data-pos=\"n.\" data-en=\"the quality of being friendly, generous, and caring\" data-zh=\"善意；仁慈\">kindness<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=underestimate\" target=\"_blank\" rel=\"noopener\" data-w=\"underestimate\" data-pos=\"v.\" data-en=\"to think something is smaller or less important than it really is\" data-zh=\"低估\">underestimated<\/a> the positive effect their actions had on others.", "bodyPlain": "Researchers Amit Kumar and Nicholas Epley investigated how _______ In a series of experiments conducted in 2022, they found that people performing small acts of kindness underestimated the positive effect their actions had on others.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員 Amit Kumar 和 Nicholas Epley 調查了 _______ 在 2022 年進行的一系列實驗中，他們發現做出小小善行的人低估了自己的行為對他人的正面影響。", "opts": {"A": "do people perceive acts of kindness.", "B": "do people perceive acts of kindness?", "C": "people perceive acts of kindness?", "D": "people perceive acts of kindness."}, "optsZh": {"A": "do people perceive acts of kindness.（疑問句語序 → 間接問句應用直述句語序：錯誤）", "B": "do people perceive acts of kindness?（疑問句語序＋問號 → 錯誤）", "C": "people perceive acts of kindness?（直述句語序但用問號 → 間接問句應用句號：錯誤）", "D": "people perceive acts of kindness.（直述句語序＋句號，作為間接問句：正確）"}, "answer": "D", "expl": "After 'investigated how,' the clause is an embedded (indirect) question, so it uses statement word order and ends with a period: 'people perceive acts of kindness.'", "explZh": "investigated how 後面接的是間接問句（名詞子句），要用直述句語序並以句號結尾：people perceive acts of kindness."}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Grammar: embedded question uses statement order and period.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。幾本掛名名人運動員的回憶錄，實際上是由合作者撰寫的，他們把其他 ______ 塑造成精緻的敘事，自己卻始終不具名。", "opts": {"A": "people's story's", "B": "peoples story's", "C": "people's stories", "D": "peoples stories"}, "optsZh": {"A": "people's story's（story's 為所有格 → 此處需要複數名詞：錯誤）", "B": "peoples story's（所有格位置錯誤 → 錯誤）", "C": "people's stories（people 的複數所有格＋複數名詞 stories：正確）", "D": "peoples stories（缺少所有格符號 → 錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Grammar: embedded question uses statement order and period.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動並 ______ 在扁平的石頭下，那裡的溫度比裸露的沙地更穩定。", "opts": {"A": "sheltered", "B": "would shelter", "C": "had sheltered", "D": "shelters"}, "optsZh": {"A": "sheltered（過去式 → 與 reduces 的現在式不平行：錯誤）", "B": "would shelter（would＋原形 → 與 reduces 的現在式不平行：錯誤）", "C": "had sheltered（過去完成式 → 與 reduces 的現在式不平行：錯誤）", "D": "shelters（第三人稱單數現在式，與 reduces 平行，表一般事實：正確）"}, "answer": "D", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Grammar: embedded question uses statement order and period.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively. During", "B": "triumphed--decisively during", "C": "triumphed--decisively, during", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively. During（句號，分隔兩個完整句子：正確）", "B": "triumphed--decisively during（缺少句號 → 造成連寫句：錯誤）", "C": "triumphed--decisively, during（逗號 → 造成逗號連接錯誤：錯誤）", "D": "triumphed--decisively--during（破折號 → 無法分隔兩個獨立句子：錯誤）"}, "answer": "A", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Grammar: embedded question uses statement order and period.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮革封面的筆記本。", "opts": {"A": "have been", "B": "were", "C": "are", "D": "is"}, "optsZh": {"A": "have been（現在完成式 → 本題答案採用過去式 were：錯誤）", "B": "were（複數過去式 be 動詞，與複數主詞一致：正確）", "C": "are（複數現在式 be 動詞；本題答案採用表過去打撈事件的 were）", "D": "is（單數 be 動詞 → 主詞為複數（一個羅盤、三個碗和一本筆記本）：錯誤）"}, "answer": "B", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Grammar: embedded question uses statement order and period.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位工程師在 2011 年完成了一個小型原型 ______ 2018 年，她發表了一個可以運作數小時的全尺寸版本。", "opts": {"A": "prototype later,", "B": "prototype, later,", "C": "prototype;", "D": "prototype,"}, "optsZh": {"A": "prototype later,（無標點連接兩個獨立子句 → 連寫句：錯誤）", "B": "prototype, later,（逗號 → 造成逗號連接錯誤：錯誤）", "C": "prototype;（分號，連接兩個相關的獨立子句：正確）", "D": "prototype,（逗號 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Grammar: plural subject requires reveal.", "vocab": false, "body": "In a painting titled &quot;The Milkmaid&quot; by Johannes Vermeer, the artist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prominent\" target=\"_blank\" rel=\"noopener\" data-w=\"prominent\" data-pos=\"adj.\" data-en=\"important and easy to notice\" data-zh=\"突出的；顯著的\">prominently<\/a> features a bread basket, milk pitcher, and bowl. Such quotidian objects, depicted in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exquisite\" target=\"_blank\" rel=\"noopener\" data-w=\"exquisite\" data-pos=\"adj.\" data-en=\"extremely beautiful and delicate\" data-zh=\"精緻的；優美的\">exquisite<\/a> detail by Vermeer, a painter <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrated\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrated\" data-pos=\"v.\" data-en=\"showed happiness about an event; praised publicly\" data-zh=\"慶祝；頌揚\">celebrated<\/a> for his naturalism, _______ the daily minutiae of a seventeenth-century Dutch <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a>.", "bodyPlain": "In a painting titled \"The Milkmaid\" by Johannes Vermeer, the artist prominently features a bread basket, milk pitcher, and bowl. Such quotidian objects, depicted in exquisite detail by Vermeer, a painter celebrated for his naturalism, _______ the daily minutiae of a seventeenth-century Dutch household.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "在 Johannes Vermeer 名為〈倒牛奶的女僕〉（The Milkmaid）的畫作中，畫家顯著地描繪了麵包籃、牛奶壺和碗。這些日常物品由以自然主義著稱的畫家 Vermeer 以精緻的細節描繪，_______ 十七世紀荷蘭家庭日常生活的瑣碎細節。", "opts": {"A": "was revealing", "B": "has revealed", "C": "reveals", "D": "reveal"}, "optsZh": {"A": "was revealing（單數過去進行式 → 主詞為複數：錯誤）", "B": "has revealed（現在完成式，單數 → 主詞為複數：錯誤）", "C": "reveals（單數現在式 → 主詞為複數：錯誤）", "D": "reveal（複數現在式，與複數主詞 objects 一致：正確）"}, "answer": "D", "expl": "The subject is the plural 'Such quotidian objects,' so the verb must be plural 'reveal'; the present tense fits the description of the painting.", "explZh": "主詞是複數的 Such quotidian objects，所以動詞要用複數「reveal」；描述畫作內容用現在式。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Grammar: plural subject requires reveal.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。幾本掛名名人運動員的回憶錄，實際上是由合作者撰寫的，他們把其他 ______ 塑造成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples story's", "B": "people's story's", "C": "people's stories", "D": "peoples stories"}, "optsZh": {"A": "peoples story's（所有格位置錯誤 → 錯誤）", "B": "people's story's（story's 為所有格 → 此處需要複數名詞：錯誤）", "C": "people's stories（people 的複數所有格＋複數名詞 stories：正確）", "D": "peoples stories（缺少所有格符號 → 錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Grammar: plural subject requires reveal.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動並 ______ 在扁平的石頭下，那裡的溫度比裸露的沙地更穩定。", "opts": {"A": "had sheltered", "B": "shelters", "C": "would shelter", "D": "sheltered"}, "optsZh": {"A": "had sheltered（過去完成式 → 與 reduces 的現在式不平行：錯誤）", "B": "shelters（第三人稱單數現在式，與 reduces 平行，表一般事實：正確）", "C": "would shelter（would＋原形 → 與 reduces 的現在式不平行：錯誤）", "D": "sheltered（過去式 → 與 reduces 的現在式不平行：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Grammar: plural subject requires reveal.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively--during", "B": "triumphed--decisively. During", "C": "triumphed--decisively during", "D": "triumphed--decisively, during"}, "optsZh": {"A": "triumphed--decisively--during（破折號 → 無法分隔兩個獨立句子：錯誤）", "B": "triumphed--decisively. During（句號，分隔兩個完整句子：正確）", "C": "triumphed--decisively during（缺少句號 → 造成連寫句：錯誤）", "D": "triumphed--decisively, during（逗號 → 造成逗號連接錯誤：錯誤）"}, "answer": "B", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Grammar: plural subject requires reveal.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮革封面的筆記本。", "opts": {"A": "were", "B": "are", "C": "have been", "D": "is"}, "optsZh": {"A": "were（複數過去式 be 動詞，與複數主詞一致：正確）", "B": "are（複數現在式 be 動詞；本題答案採用表過去打撈事件的 were）", "C": "have been（現在完成式 → 本題答案採用過去式 were：錯誤）", "D": "is（單數 be 動詞 → 主詞為複數（一個羅盤、三個碗和一本筆記本）：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Grammar: plural subject requires reveal.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位工程師在 2011 年完成了一個小型原型 ______ 2018 年，她發表了一個可以運作數小時的全尺寸版本。", "opts": {"A": "prototype,", "B": "prototype, later,", "C": "prototype later,", "D": "prototype;"}, "optsZh": {"A": "prototype,（逗號 → 造成逗號連接錯誤：錯誤）", "B": "prototype, later,（逗號 → 造成逗號連接錯誤：錯誤）", "C": "prototype later,（無標點連接兩個獨立子句 → 連寫句：錯誤）", "D": "prototype;（分號，連接兩個相關的獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Grammar: period separates complete sentence from fragment repair.", "vocab": false, "body": "Jamaican British artist Willard Wigan is known for his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remarkable\" target=\"_blank\" rel=\"noopener\" data-w=\"remarkable\" data-pos=\"adj.\" data-en=\"unusual and worth noticing\" data-zh=\"非凡的；值得注意的\">remarkable<\/a> _______ so small that they are best viewed through a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=microscope\" target=\"_blank\" rel=\"noopener\" data-w=\"microscope\" data-pos=\"n.\" data-en=\"an instrument that makes very small things look larger\" data-zh=\"顯微鏡\">microscope<\/a>, Wigan&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> are made from tiny natural materials, such as spiderweb <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strand\" target=\"_blank\" rel=\"noopener\" data-w=\"strand\" data-pos=\"n.\" data-en=\"a single thin thread or piece\" data-zh=\"（一）股；縷\">strands<\/a>.", "bodyPlain": "Jamaican British artist Willard Wigan is known for his remarkable _______ so small that they are best viewed through a microscope, Wigan's sculptures are made from tiny natural materials, such as spiderweb strands.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "牙買加裔英國藝術家 Willard Wigan 以他卓越的 _______ 小到最好用顯微鏡觀看，Wigan 的雕塑是用細小的天然材料製成的，例如蜘蛛絲。", "opts": {"A": "microsculptures creations", "B": "microsculptures, creations", "C": "microsculptures. Creations", "D": "microsculptures and creations"}, "optsZh": {"A": "microsculptures creations（無標點 → 造成連寫句：錯誤）", "B": "microsculptures, creations（逗號 → 造成逗號連接錯誤：錯誤）", "C": "microsculptures. Creations（句號分隔兩個完整句子：正確）", "D": "microsculptures and creations（用 and 連接 → 造成句子結構錯誤：錯誤）"}, "answer": "C", "expl": "The first sentence is complete after 'microsculptures,' and the next part ('Creations so small..., Wigan's sculptures are made...') is a separate sentence, so a period is needed.", "explZh": "第一句到 microsculptures 已完整；後面「Creations so small..., Wigan's sculptures are made...」是另一個獨立句子，所以需要句號分開。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Grammar: period separates complete sentence from fragment repair.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。幾本掛名名人運動員的回憶錄，實際上是由合作者撰寫的，他們把其他 ______ 塑造成精緻的敘事，自己卻始終不具名。", "opts": {"A": "people's stories", "B": "people's story's", "C": "peoples story's", "D": "peoples stories"}, "optsZh": {"A": "people's stories（people 的複數所有格＋複數名詞 stories：正確）", "B": "people's story's（story's 為所有格 → 此處需要複數名詞：錯誤）", "C": "peoples story's（所有格位置錯誤 → 錯誤）", "D": "peoples stories（缺少所有格符號 → 錯誤）"}, "answer": "A", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Grammar: period separates complete sentence from fragment repair.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動並 ______ 在扁平的石頭下，那裡的溫度比裸露的沙地更穩定。", "opts": {"A": "shelters", "B": "sheltered", "C": "would shelter", "D": "had sheltered"}, "optsZh": {"A": "shelters（第三人稱單數現在式，與 reduces 平行，表一般事實：正確）", "B": "sheltered（過去式 → 與 reduces 的現在式不平行：錯誤）", "C": "would shelter（would＋原形 → 與 reduces 的現在式不平行：錯誤）", "D": "had sheltered（過去完成式 → 與 reduces 的現在式不平行：錯誤）"}, "answer": "A", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Grammar: period separates complete sentence from fragment repair.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work devel
