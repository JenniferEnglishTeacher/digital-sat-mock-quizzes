oped through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively--during", "B": "triumphed--decisively, during", "C": "triumphed--decisively during", "D": "triumphed--decisively. During"}, "optsZh": {"A": "triumphed--decisively--during（破折號 → 無法分隔兩個獨立句子：錯誤）", "B": "triumphed--decisively, during（逗號 → 造成逗號連接錯誤：錯誤）", "C": "triumphed--decisively during（缺少句號 → 造成連寫句：錯誤）", "D": "triumphed--decisively. During（句號，分隔兩個完整句子：正確）"}, "answer": "D", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Grammar: period separates complete sentence from fragment repair.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮革封面的筆記本。", "opts": {"A": "have been", "B": "were", "C": "is", "D": "are"}, "optsZh": {"A": "have been（現在完成式 → 本題答案採用過去式 were：錯誤）", "B": "were（複數過去式 be 動詞，與複數主詞一致：正確）", "C": "is（單數 be 動詞 → 主詞為複數（一個羅盤、三個碗和一本筆記本）：錯誤）", "D": "are（複數現在式 be 動詞；本題答案採用表過去打撈事件的 were）"}, "answer": "B", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Grammar: period separates complete sentence from fragment repair.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位工程師在 2011 年完成了一個小型原型 ______ 2018 年，她發表了一個可以運作數小時的全尺寸版本。", "opts": {"A": "prototype,", "B": "prototype later,", "C": "prototype;", "D": "prototype, later,"}, "optsZh": {"A": "prototype,（逗號 → 造成逗號連接錯誤：錯誤）", "B": "prototype later,（無標點連接兩個獨立子句 → 連寫句：錯誤）", "C": "prototype;（分號，連接兩個相關的獨立子句：正確）", "D": "prototype, later,（逗號 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Grammar: period before because-clause explanation.", "vocab": false, "body": "Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this _______ the hole&#x27;s small size <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=restrict\" target=\"_blank\" rel=\"noopener\" data-w=\"restrict\" data-pos=\"v.\" data-en=\"to limit something\" data-zh=\"限制\">restricts<\/a> light to a single ray, all light passing through the hole can only arrive at a single <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=destination\" target=\"_blank\" rel=\"noopener\" data-w=\"destination\" data-pos=\"n.\" data-en=\"the place where someone or something is going\" data-zh=\"目的地\">destination<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eliminate\" target=\"_blank\" rel=\"noopener\" data-w=\"eliminate\" data-pos=\"v.\" data-en=\"to remove or get rid of something completely\" data-zh=\"消除；排除\">eliminating<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=diffraction\" target=\"_blank\" rel=\"noopener\" data-w=\"diffraction\" data-pos=\"n.\" data-en=\"the spreading of light or waves as they pass an edge or opening\" data-zh=\"繞射\">diffraction<\/a> and ensuring a clear image.", "bodyPlain": "Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this _______ the hole's small size restricts light to a single ray, all light passing through the hole can only arrive at a single destination, eliminating diffraction and ensuring a clear image.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "想想針孔相機的原理：光線穿過一個小孔，形成一個清晰的投影影像。光線圖揭示了這是如何 _______ 小孔的尺寸將光限制為單一光線，所有穿過小孔的光都只能到達單一位置，因而消除繞射並確保影像清晰。", "opts": {"A": "works because", "B": "works. Because", "C": "works, it's because", "D": "works: it's because"}, "optsZh": {"A": "works because（無標點 → 造成連寫句：錯誤）", "B": "works. Because（句號，下一句以 Because 子句開頭：正確）", "C": "works, it's because（逗號 → 造成逗號連接錯誤：錯誤）", "D": "works: it's because（冒號後的 it's because…, all light… 形成逗號連接錯誤：錯誤）"}, "answer": "B", "expl": "'A ray diagram reveals how this works' is a complete sentence; the next sentence begins with the dependent clause 'Because the hole's small size restricts light...' followed by the main clause 'all light ... can only arrive.'", "explZh": "「A ray diagram reveals how this works」是完整句子；下一句以從屬子句「Because the hole's small size restricts light...」開頭，後接主要子句「all light ... can only arrive」，所以用句號。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Grammar: period before because-clause explanation.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。幾本掛名名人運動員的回憶錄，實際上是由合作者撰寫的，他們把其他 ______ 塑造成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples story's", "B": "peoples stories", "C": "people's story's", "D": "people's stories"}, "optsZh": {"A": "peoples story's（所有格位置錯誤 → 錯誤）", "B": "peoples stories（缺少所有格符號 → 錯誤）", "C": "people's story's（story's 為所有格 → 此處需要複數名詞：錯誤）", "D": "people's stories（people 的複數所有格＋複數名詞 stories：正確）"}, "answer": "D", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Grammar: period before because-clause explanation.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動並 ______ 在扁平的石頭下，那裡的溫度比裸露的沙地更穩定。", "opts": {"A": "shelters", "B": "sheltered", "C": "had sheltered", "D": "would shelter"}, "optsZh": {"A": "shelters（第三人稱單數現在式，與 reduces 平行，表一般事實：正確）", "B": "sheltered（過去式 → 與 reduces 的現在式不平行：錯誤）", "C": "had sheltered（過去完成式 → 與 reduces 的現在式不平行：錯誤）", "D": "would shelter（would＋原形 → 與 reduces 的現在式不平行：錯誤）"}, "answer": "A", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Grammar: period before because-clause explanation.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively, during", "B": "triumphed--decisively during", "C": "triumphed--decisively. During", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively, during（逗號 → 造成逗號連接錯誤：錯誤）", "B": "triumphed--decisively during（缺少句號 → 造成連寫句：錯誤）", "C": "triumphed--decisively. During（句號，分隔兩個完整句子：正確）", "D": "triumphed--decisively--during（破折號 → 無法分隔兩個獨立句子：錯誤）"}, "answer": "C", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Grammar: period before because-clause explanation.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮革封面的筆記本。", "opts": {"A": "were", "B": "are", "C": "is", "D": "have been"}, "optsZh": {"A": "were（複數過去式 be 動詞，與複數主詞一致：正確）", "B": "are（複數現在式 be 動詞；本題答案採用表過去打撈事件的 were）", "C": "is（單數 be 動詞 → 主詞為複數（一個羅盤、三個碗和一本筆記本）：錯誤）", "D": "have been（現在完成式 → 本題答案採用過去式 were：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Grammar: period before because-clause explanation.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位工程師在 2011 年完成了一個小型原型 ______ 2018 年，她發表了一個可以運作數小時的全尺寸版本。", "opts": {"A": "prototype, later,", "B": "prototype;", "C": "prototype,", "D": "prototype later,"}, "optsZh": {"A": "prototype, later,（逗號 → 造成逗號連接錯誤：錯誤）", "B": "prototype;（分號，連接兩個相關的獨立子句：正確）", "C": "prototype,（逗號 → 造成逗號連接錯誤：錯誤）", "D": "prototype later,（無標點連接兩個獨立子句 → 連寫句：錯誤）"}, "answer": "B", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Transitions: instead marks replacement term.", "vocab": false, "body": "In the search for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extraterrestrial\" target=\"_blank\" rel=\"noopener\" data-w=\"extraterrestrial\" data-pos=\"adj.\" data-en=\"coming from or existing outside Earth\" data-zh=\"地球以外的；外星的\">extraterrestrial<\/a> life, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astrobiologist\" target=\"_blank\" rel=\"noopener\" data-w=\"astrobiologist\" data-pos=\"n.\" data-en=\"a scientist who studies the possibility of life in the universe\" data-zh=\"天體生物學家\">astrobiologists<\/a> Stuart Bartlett and Michael L. Wong propose that scientists avoid using the term &quot;life.&quot; _______ researchers should use another word: &quot;lyfe.&quot; This new term, they argue, could be used to draw <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinction\" target=\"_blank\" rel=\"noopener\" data-w=\"distinction\" data-pos=\"n.\" data-en=\"a clear difference between things\" data-zh=\"區別；差異\">distinctions<\/a> between the known <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=characteristic\" target=\"_blank\" rel=\"noopener\" data-w=\"characteristic\" data-pos=\"n.\" data-en=\"a typical quality or feature\" data-zh=\"特徵；特性\">characteristics<\/a> of life on Earth and the potentially differing characteristics of lyfe on other planets.", "bodyPlain": "In the search for extraterrestrial life, astrobiologists Stuart Bartlett and Michael L. Wong propose that scientists avoid using the term \"life.\" _______ researchers should use another word: \"lyfe.\" This new term, they argue, could be used to draw distinctions between the known characteristics of life on Earth and the potentially differing characteristics of lyfe on other planets.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在尋找外星生命的過程中，天體生物學家 Stuart Bartlett 和 Michael L. Wong 提議科學家避免使用「life（生命）」一詞。_______ 研究人員應使用另一個詞：「lyfe」。他們主張，這個新詞可以用來區分地球生命的已知特徵與其他行星上 lyfe 可能不同的特徵。", "opts": {"A": "Previously,", "B": "Regardless,", "C": "There,", "D": "Instead,"}, "optsZh": {"A": "Previously,（先前：表時間在前 → 錯誤）", "B": "Regardless,（無論如何：表不受前述影響 → 錯誤）", "C": "There,（在那裡：表地點 → 錯誤）", "D": "Instead,（反而；取而代之：表替代）"}, "answer": "D", "expl": "The scientists should avoid 'life' and use 'lyfe' in its place, so 'Instead' introduces the replacement.", "explZh": "科學家應避免使用 life，改用 lyfe 取代，所以用「Instead」（反而、改為）引出替代用語。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Transitions: instead marks replacement term.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Astronomers proposed retiring the label &quot;minor planet&quot; for certain icy bodies because the term implied a misleading similarity to rocky asteroids. _______ they recommended the label &quot;dwarf comet,&quot; which better captured those bodies&#x27; composition and behavior.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Astronomers proposed retiring the label \"minor planet\" for certain icy bodies because the term implied a misleading similarity to rocky asteroids. _______ they recommended the label \"dwarf comet,\" which better captured those bodies' composition and behavior.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。天文學家提議不再對某些冰質天體使用「minor planet（小行星）」這個標籤，因為這個詞暗示了它們與岩質小行星之間有誤導性的相似。_______ 他們建議使用「dwarf comet（矮彗星）」這個標籤，更能表現這些天體的組成和行為。", "opts": {"A": "Previously,", "B": "There,", "C": "Regardless,", "D": "Instead,"}, "optsZh": {"A": "Previously,（先前：表時間在前 → 錯誤）", "B": "There,（在那裡：表地點 → 錯誤）", "C": "Regardless,（無論如何：表不受前述影響 → 錯誤）", "D": "Instead,（反而；取而代之：表替代）"}, "answer": "D", "expl": "Instead introduces the replacement term.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Transitions: instead marks replacement term.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The committee advised writers not to use the phrase &quot;native speaker&quot; in the survey because it could obscure multilingual experience. _______ the survey should ask which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">languages<\/a> respondents use in specific settings.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The committee advised writers not to use the phrase \"native speaker\" in the survey because it could obscure multilingual experience. _______ the survey should ask which languages respondents use in specific settings.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。委員會建議撰寫者不要在調查中使用「native speaker（母語人士）」一詞，因為它可能掩蓋多語經驗。_______ 調查應詢問受訪者在特定場合使用哪些語言。", "opts": {"A": "For example,", "B": "Instead,", "C": "Meanwhile,", "D": "Afterward,"}, "optsZh": {"A": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "B": "Instead,（反而；取而代之：表替代）", "C": "Meanwhile,（同時：表同時發生 → 錯誤）", "D": "Afterward,（之後：表時間順序 → 錯誤）"}, "answer": "B", "expl": "Instead shows a substitute practice.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Transitions: instead marks replacement term.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Some botanists argue that the word &quot;weed&quot; is too imprecise for ecological research. _______ they favor the phrase &quot;spontaneous urban plant&quot; when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=describing\" target=\"_blank\" rel=\"noopener\" data-w=\"describing\" data-pos=\"v.\" data-en=\"telling what something is like\" data-zh=\"描述\">describing<\/a> species that grow without <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cultivation\" target=\"_blank\" rel=\"noopener\" data-w=\"cultivation\" data-pos=\"n.\" data-en=\"the growing of crops\" data-zh=\"耕種；栽培\">cultivation<\/a> in cities.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Some botanists argue that the word \"weed\" is too imprecise for ecological research. _______ they favor the phrase \"spontaneous urban plant\" when describing species that grow without cultivation in cities.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。有些植物學家認為「weed（雜草）」一詞對生態研究來說太不精確。_______ 他們在描述城市中未經栽培而自行生長的物種時，偏好使用「spontaneous urban plant（自生城市植物）」一詞。", "opts": {"A": "Similarly,", "B": "Instead,", "C": "Nevertheless,", "D": "Earlier,"}, "optsZh": {"A": "Similarly,（同樣地：表相似 → 前後並非相似關係：錯誤）", "B": "Instead,（反而；取而代之：表替代）", "C": "Nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "Earlier,（較早之前：表時間在前 → 錯誤）"}, "answer": "B", "expl": "Instead marks the preferred replacement.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Transitions: instead marks replacement term.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The editors decided not to call the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> a memoir, since several chapters blend memory with invented scenes. _______ they described it as autobiographical fiction.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The editors decided not to call the collection a memoir, since several chapters blend memory with invented scenes. _______ they described it as autobiographical fiction.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。編輯們決定不把這本文集稱為回憶錄，因為有幾章把記憶和虛構的場景混在一起。_______ 他們把它描述為自傳體小說。", "opts": {"A": "Instead,", "B": "Previously,", "C": "Therefore,", "D": "Likewise,"}, "optsZh": {"A": "Instead,（反而；取而代之：表替代）", "B": "Previously,（先前：表時間在前 → 錯誤）", "C": "Therefore,（因此：表因果結果 → 錯誤）", "D": "Likewise,（同樣地：表相似 → 前後並非相似關係：錯誤）"}, "answer": "A", "expl": "Instead introduces the new label.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Transitions: instead marks replacement term.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Marine biologists avoided the term &quot;invasive&quot; for the newly observed organism until its ecological effects were known. _______ they used the more neutral term &quot;non-native.&quot;", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Marine biologists avoided the term \"invasive\" for the newly observed organism until its ecological effects were known. _______ they used the more neutral term \"non-native.\"", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。在了解這種新觀察到的生物對生態的影響之前，海洋生物學家避免使用「invasive（入侵的）」一詞。_______ 他們使用較中性的「non-native（非原生的）」一詞。", "opts": {"A": "For instance,", "B": "However,", "C": "Instead,", "D": "In conclusion,"}, "optsZh": {"A": "For instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "B": "However,（然而：表轉折對比）", "C": "Instead,（反而；取而代之：表替代）", "D": "In conclusion,（總之：表總結 → 錯誤）"}, "answer": "C", "expl": "Instead signals a substitute term.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: today contrasts past and present.", "vocab": false, "body": "Before it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unveil\" target=\"_blank\" rel=\"noopener\" data-w=\"unveil\" data-pos=\"v.\" data-en=\"to show or introduce something new publicly for the first time\" data-zh=\"揭幕；公開推出\">unveiled<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=massive\" target=\"_blank\" rel=\"noopener\" data-w=\"massive\" data-pos=\"adj.\" data-en=\"very large\" data-zh=\"巨大的\">massive<\/a> new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gallery\" target=\"_blank\" rel=\"noopener\" data-w=\"gallery\" data-pos=\"n.\" data-en=\"a room or building where art is shown\" data-zh=\"展覽廳；美術館\">gallery<\/a> in 2009, the Art Institute of Chicago was only able to display about 5% of its art <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a>. _______ the museum is able to display close to 30% of its collection.", "bodyPlain": "Before it unveiled a massive new gallery in 2009, the Art Institute of Chicago was only able to display about 5% of its art collection. _______ the museum is able to display close to 30% of its collection.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在 2009 年啟用一座大型新展廳之前，芝加哥藝術博物館只能展出約 5% 的館藏。_______ 這間博物館能展出將近 30% 的館藏。", "opts": {"A": "Additionally,", "B": "For example,", "C": "Nevertheless,", "D": "Today,"}, "optsZh": {"A": "Additionally,（此外：表補充 → 前後並非補充關係：錯誤）", "B": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "Nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "Today,（如今：表與過去對比的現在，正確）"}, "answer": "D", "expl": "The text contrasts the situation before 2009 (5% displayed) with the present (close to 30%), so 'Today' is logical.", "explZh": "文章對比 2009 年前（只展出 5%）與現在（將近 30%）的情況，所以用「Today」（如今）。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: today contrasts past and present.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Before the restoration, only a handful of the archive&#x27;s fragile maps could be viewed by researchers each month. _______ high-resolution scans allow hundreds of users to examine the collection online.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Before the restoration, only a handful of the archive's fragile maps could be viewed by researchers each month. _______ high-resolution scans allow hundreds of users to examine the collection online.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在修復之前，研究人員每個月只能檢視檔案館中少數幾張脆弱的地圖。_______ 高解析度掃描讓數百名使用者能在線上檢視這批館藏。", "opts": {"A": "For example,", "B": "Today,", "C": "Additionally,", "D": "Nevertheless,"}, "optsZh": {"A": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "B": "Today,（如今：表與過去對比的現在，正確）", "C": "Additionally,（此外：表補充 → 前後並非補充關係：錯誤）", "D": "Nevertheless,（儘管如此：表讓步轉折 → 錯誤）"}, "answer": "B", "expl": "Today contrasts past limitation with present access.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: today contrasts past and present.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. When the theater opened in 1910, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audiences<\/a> entered through a narrow lobby lit by gas lamps. _______ visitors pass through a glass atrium that was added during the renovation.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. When the theater opened in 1910, audiences entered through a narrow lobby lit by gas lamps. _______ visitors pass through a glass atrium that was added during the renovation.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這間劇院在 1910 年開幕時，觀眾要穿過一個由煤氣燈照明的狹窄大廳進場。_______ 遊客會穿過一座在整修期間增建的玻璃中庭。", "opts": {"A": "Instead,", "B": "Furthermore,", "C": "For instance,", "D": "Today,"}, "optsZh": {"A": "Instead,（反而；取而代之：表替代）", "B": "Furthermore,（此外：表補充 → 錯誤）", "C": "For instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "Today,（如今：表與過去對比的現在，正確）"}, "answer": "D", "expl": "Today marks the present condition.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: today contrasts past and present.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. For decades, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> could analyze only a few soil samples per week. _______ automated equipment processes hundreds of samples in a single day.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. For decades, the laboratory could analyze only a few soil samples per week. _______ automated equipment processes hundreds of samples in a single day.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。數十年來，這間實驗室每週只能分析幾份土壤樣本。_______ 自動化設備一天就能處理數百份樣本。", "opts": {"A": "Similarly,", "B": "For example,", "C": "Today,", "D": "Nevertheless,"}, "optsZh": {"A": "Similarly,（同樣地：表相似 → 前後並非相似關係：錯誤）", "B": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "Today,（如今：表與過去對比的現在，正確）", "D": "Nevertheless,（儘管如此：表讓步轉折 → 錯誤）"}, "answer": "C", "expl": "Today contrasts past and present.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: today contrasts past and present.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Before the new ferry route began, residents often needed two hours to reach the mainland. _______ the same trip usually takes less than forty minutes.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Before the new ferry route began, residents often needed two hours to reach the mainland. _______ the same trip usually takes less than forty minutes.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。在新的渡輪航線開通之前，居民往往需要兩個小時才能到達本島。_______ 同樣的路程通常不到四十分鐘。", "opts": {"A": "However,", "B": "Additionally,", "C": "Today,", "D": "For instance,"}, "optsZh": {"A": "However,（然而：表轉折對比）", "B": "Additionally,（此外：表補充 → 前後並非補充關係：錯誤）", "C": "Today,（如今：表與過去對比的現在，正確）", "D": "For instance,（例如：表舉例 → 前後並非舉例關係：錯誤）"}, "answer": "C", "expl": "Today identifies the current situation.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transitions: today contrasts past and present.", "vocab": false, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In the museum&#x27;s early years, most of its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> remained in storage. _______ nearly the entire <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> can be searched through the museum&#x27;s digital catalog.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In the museum's early years, most of its photographs remained in storage. _______ nearly the entire collection can be searched through the museum's digital catalog.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。在博物館成立初期，大部分的照片都存放在庫房裡。_______ 幾乎所有館藏都可以透過博物館的數位目錄搜尋。", "opts": {"A": "Today,", "B": "Likewise,", "C": "For example,", "D": "Nevertheless,"}, "optsZh": {"A": "Today,（如今：表與過去對比的現在，正確）", "B": "Likewise,（同樣地：表相似 → 前後並非相似關係：錯誤）", "C": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "Nevertheless,（儘管如此：表讓步轉折 → 錯誤）"}, "answer": "A", "expl": "Today contrasts earlier and current access.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: on the other hand contrasts elevations.", "vocab": false, "body": "Working together with the Navajo Nation Department of Water Resources, Dr. Lani Tsinnajinnie <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=analyze\" target=\"_blank\" rel=\"noopener\" data-w=\"analyze\" data-pos=\"v.\" data-en=\"to examine something carefully in order to understand it\" data-zh=\"分析\">analyzed<\/a> data about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=snowpack\" target=\"_blank\" rel=\"noopener\" data-w=\"snowpack\" data-pos=\"n.\" data-en=\"a layer of snow that builds up on the ground over winter\" data-zh=\"積雪層\">snowpack<\/a> levels in the Chuska Mountains. She found that the snowpack was deepest in early March at lower <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elevation\" target=\"_blank\" rel=\"noopener\" data-w=\"elevation\" data-pos=\"n.\" data-en=\"the height of a place above sea level\" data-zh=\"海拔；高度\">elevations<\/a>. At higher elevations, _______ the snowpack was deepest in mid-March.", "bodyPlain": "Working together with the Navajo Nation Department of Water Resources, Dr. Lani Tsinnajinnie analyzed data about snowpack levels in the Chuska Mountains. She found that the snowpack was deepest in early March at lower elevations. At higher elevations, _______ the snowpack was deepest in mid-March.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "Lani Tsinnajinnie 博士與納瓦霍族水資源部合作，分析了 Chuska 山脈積雪量的資料。她發現，在較低海拔處，積雪在三月初最深。在較高海拔處，_______ 積雪在三月中旬最深。", "opts": {"A": "in other words,", "B": "for instance,", "C": "on the other hand,", "D": "in summary,"}, "optsZh": {"A": "in other words,（換句話說：表重述 → 錯誤）", "B": "for instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "on the other hand,（另一方面：表對比，正確）", "D": "in summary,（總之：表總結 → 錯誤）"}, "answer": "C", "expl": "At lower elevations snowpack peaked in early March, but at higher elevations it peaked in mid-March—a contrast, so 'on the other hand.'", "explZh": "低海拔積雪在三月初最深，高海拔則在三月中旬最深——兩者形成對比，所以用「on the other hand」（另一方面）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: on the other hand contrasts elevations.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. At low elevations, the flowers opened in late April. At higher elevations, _______ blooming did not begin until the middle of May.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. At low elevations, the flowers opened in late April. At higher elevations, _______ blooming did not begin until the middle of May.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在低海拔地區，花朵在四月底綻放。在較高海拔處，_______ 直到五月中旬才開始開花。", "opts": {"A": "in summary,", "B": "in other words,", "C": "for instance,", "D": "on the other hand,"}, "optsZh": {"A": "in summary,（總之：表總結 → 錯誤）", "B": "in other words,（換句話說：表重述 → 錯誤）", "C": "for instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "on the other hand,（另一方面：表對比，正確）"}, "answer": "D", "expl": "On the other hand contrasts the two elevations.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: on the other hand contrasts elevations.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The coastal stations recorded their strongest winds in the morning. Inland stations, _______ recorded their strongest winds after sunset.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The coastal stations recorded their strongest winds in the morning. Inland stations, _______ recorded their strongest winds after sunset.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。沿海測站在早上記錄到最強的風。內陸測站 _______ 在日落之後記錄到最強的風。", "opts": {"A": "for instance,", "B": "on the other hand,", "C": "therefore,", "D": "in summary,"}, "optsZh": {"A": "for instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "B": "on the other hand,（另一方面：表對比，正確）", "C": "therefore,（因此：表因果結果 → 錯誤）", "D": "in summary,（總之：表總結 → 錯誤）"}, "answer": "B", "expl": "On the other hand introduces a contrast.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: on the other hand contrasts elevations.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Younger participants preferred the audio guide with music. Older participants, _______ tended to choose the version with spoken narration only.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Younger participants preferred the audio guide with music. Older participants, _______ tended to choose the version with spoken narration only.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。較年輕的參與者偏好有音樂的語音導覽。較年長的參與者 _______ 傾向選擇只有口語旁白的版本。", "opts": {"A": "on the other hand,", "B": "accordingly,", "C": "for example,", "D": "in other words,"}, "optsZh": {"A": "on the other hand,（另一方面：表對比，正確）", "B": "accordingly,（因此：表因果結果 → 錯誤）", "C": "for example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "in other words,（換句話說：表重述 → 錯誤）"}, "answer": "A", "expl": "On the other hand contrasts groups.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: on the other hand contrasts elevations.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. In shallow water, the algae grew fastest under blue light. In deeper water, _______ growth was greatest under green light.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. In shallow water, the algae grew fastest under blue light. In deeper water, _______ growth was greatest under green light.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。在淺水中，藻類在藍光下生長最快。在較深的水中，_______ 藻類在綠光下生長最多。", "opts": {"A": "in summary,", "B": "for example,", "C": "on the other hand,", "D": "therefore,"}, "optsZh": {"A": "in summary,（總之：表總結 → 錯誤）", "B": "for example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "on the other hand,（另一方面：表對比，正確）", "D": "therefore,（因此：表因果結果 → 錯誤）"}, "answer": "C", "expl": "On the other hand contrasts conditions.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: on the other hand contrasts elevations.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The northern plots lost moisture quickly after rainfall. The southern plots, _______ retained moisture for several days.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The northern plots lost moisture quickly after rainfall. The southern plots, _______ retained moisture for several days.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個
