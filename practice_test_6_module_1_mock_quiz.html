n": "Recent blended features support cultural exchange."}, {"id": "16.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Both towns had some volunteers.\nB) The table includes more than one year.\nC) The program took place in a community.\nD) The program was associated with a clear increase in trained volunteers compared with the town without the program.", "answer": "D", "explanation": "The comparison supports the program's effect."}]}, {"n": 17, "concept": "Logical Completion: anatomy suggests less sustained flight.", "original": "The Cretaceous pterosaur Tupandactylus navigans is known for having an anomalously oversized head crest. Until an almost complete fossil skeleton was found in Brazil, paleontologists had been able to study only skull specimens from T. navigans, though it was presumed that, like other pterosaurs, the species's primary form of locomotion was powered flight. Examining the fuller skeleton in 2016, Victor Beccari and his team determined that T. navigans had long hind legs, short wings, and an unusually long neck--characteristics that, combined with the creature's large-crested head, would have made sustained flight difficult and walking upright relatively comfortable. Based on these findings the team suggests that T. navigans likely _______\n\nWhich choice most logically completes the text?\nA) flew for longer distances than did other pterosaur species that had oversized head crests.\nB) had longer wings than other pterosaur species considered to have been comfortable walking.\nC) had a smaller head than researchers expected based on the earlier T. navigans skull specimens.\nD) flew for shorter distances and spent more time walking than researchers previously thought.", "generated": [{"id": "17.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) all island plants descended from a single cultivated variety.\nB) the plant probably reached the islands without human assistance.\nC) human traders must have transported the seeds recently.\nD) the island populations were domesticated before mainland populations.", "answer": "B", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "17.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the beetles were domesticated by island communities.\nB) the island beetles must be younger than the coastal beetles.\nC) humans carried the beetles to the island during early trade voyages.\nD) the beetles were likely introduced by natural dispersal rather than by humans.", "answer": "D", "explanation": "The timing rules out human introduction."}, {"id": "17.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the migration must have begun earlier than any other human movement.\nB) all versions of the song are identical.\nC) the song was probably not introduced to the archipelago by that migration.\nD) the song could not have changed after the migration.", "answer": "C", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "17.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) mainland farmers acquired the crop from island communities.\nB) human settlement probably did not account for the plant's original arrival on the island.\nC) the island variety must be genetically identical to wild mainland plants.\nD) the crop was first domesticated on the island.", "answer": "B", "explanation": "The plant's arrival predates human settlement."}, {"id": "17.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the snails likely spread through an earlier nonhuman mechanism.\nB) the lakes did not contain snails until boating began.\nC) human activity made the populations genetically identical.\nD) boats probably explain every modern snail population.", "answer": "A", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 18, "concept": "Logical Completion: ethical consumers' ratings predict purchase likelihood.", "original": "Consumer psychologists have theorized that the likelihood that people who identify as ethical consumers--meaning that they strive to purchase goods and services with positive or neutral social and ecological effects--will purchase a given product positively correlates with their perception of that product's effects. In a recent study of the attitudes of self-identified ethical consumers toward purchasing a specific mobile phone coming to market, researchers found that, on average, study participants in their twenties rated the phone's social and ecological effects much less positively than did participants in other age groups. All other things being equal, if consumer psychologists' theory is correct, this finding suggests that _______\n\nWhich choice most logically completes the text?\nA) the phone is less appealing to ethical consumers in their twenties than other similar phones on the market are.\nB) ethical consumers in their twenties are less likely to purchase the phone than ethical consumers in other age groups are.\nC) there is not a meaningful difference in the likelihood of purchasing the phone among ethical consumers in different age groups.\nD) ethical consumers in their twenties are more likely than ethical consumers in other age groups to consider a phone's social and ecological effects when deciding whether to purchase that phone.", "generated": [{"id": "18.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) human traders must have transported the seeds recently.\nB) the island populations were domesticated before mainland populations.\nC) all island plants descended from a single cultivated variety.\nD) the plant probably reached the islands without human assistance.", "answer": "D", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "18.2", "text": "In a university archive, scholars examine icy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) human settlement probably did not account for the plant's original arrival on the island.\nB) mainland farmers acquired the crop from island communities.\nC) the island variety must be genetically identical to wild mainland plants.\nD) the crop was first domesticated on the island.", "answer": "A", "explanation": "The plant's arrival predates human settlement."}, {"id": "18.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) boats probably explain every modern snail population.\nB) the snails likely spread through an earlier nonhuman mechanism.\nC) human activity made the populations genetically identical.\nD) the lakes did not contain snails until boating began.", "answer": "B", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 19, "concept": "Grammar: participial modifier created.", "original": "The Boston Saloon was one of the most popular African American-owned establishments in nineteenth-century Nevada. _______ by businessman William A.G. Brown, the saloon was known to offer elegant accommodations and an inclusive environment.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) Created\nB) Creates\nC) Creating\nD) Create", "generated": [{"id": "19.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples stories\nB) people's stories\nC) peoples story's\nD) people's story's", "answer": "B", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "19.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) sheltered\nB) would shelter\nC) shelters\nD) had sheltered", "answer": "C", "explanation": "Simple present fits a general biological fact."}, {"id": "19.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively during\nB) triumphed--decisively--during\nC) triumphed--decisively, during\nD) triumphed--decisively. During", "answer": "D", "explanation": "A new sentence is needed before the time phrase."}, {"id": "19.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) are\nC) have been\nD) is", "answer": "A", "explanation": "The plura g\nB) triumphed--decisively. During\nC) triumphed--decisively during\nD) triumphed--decisively--during", "answer": "B", "explanation": "A new sentence is needed before the time phrase."}, {"id": "20.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) have been\nB) are\nC) is\nD) were", "answer": "D", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "20.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype,\nB) prototype later,\nC) prototype;\nD) prototype, later,", "answer": "C", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 21, "concept": "Grammar: singular subject requires creates.", "original": "\" ts recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) are\nC) have been\nD) is", "answer": "A", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "23.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype,\nB) prototype, later,\nC) prototype later,\nD) prototype;", "answer": "D", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 24, "concept": "Grammar: period separates complete sentence from fragment repair.", "original": "Jamaican British artist Willard Wigan is known for his remarkable _______ so small that they are best viewed through a microscope, Wigan's sculptures are made from tiny natural materials, such as spiderweb strands.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) microsculptures creations\nB) microsculptures, creations\nC) microsculptures. Creations\nD) microsculptures and creations", "generated": [{"id": "24.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) people's stories\nB) people's story's\nC) peoples story's\nD) peoples stories", "answer": "A", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "24.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) shelters\nB) sheltered\nC) would shelter\nD) had sheltered", "answer": "A", "explanation": "Simple present fits a general biological fact."}, {"id": "24.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, histo uld operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype,\nB) prototype later,\nC) prototype;\nD) prototype, later,", "answer": "C", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 25, "concept": "Grammar: period before because-clause explanation.", "original": "Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this _______ the hole's small size restricts light to a single ray, all light passing through the hole can only arrive at a single destination, eliminating diffraction and ensuring a clear image.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) works because\nB) works. Because\nC) works, it's because\nD) works: it's because", "generated": [{"id": "25.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples story's\nB) peoples stories\nC) people's story's\nD) people's stories", "answer": "D", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "25.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) shelters\nB) sheltered\nC) had sheltered\nD) would shelter", "answer": "A", "explanation": "Simple present fits a general biological fact."}, {"id": "25.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively, during\nB) triumphed--decisively during\nC) triumphed--decisively. During\nD) triumphed--decisively--during", "answer": "C", "explanation": "A new sentence is needed before the time phrase."}, {"id": "25.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) are\nC) is\nD) have been", "answer": "A", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "25.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype, later,\nB) prototype;\nC) prototype,\nD) prototype later,", "answer": "B", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 26, "concept": "Transitions: instead marks replacement term.", "original": "In the search for extraterrestrial life, astrobiologists Stuart Bartlett and Michael L. Wong propose that scientists avoid using the term \"life.\" _______ researchers should use another word: \"lyfe.\" This new term, they argue, could be used to draw distinctions between the known characteristics of life on Earth and the potentially differing characteristics of lyfe on other planets.\n\nWhich choice completes the text with the most logical transition?\nA) Previously,\nB) Regardless,\nC) There,\nD) Instead,", "generated": [{"id": "26.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Astronomers proposed retiring the label \"minor planet\" for certain icy bodies because the term implied a misleading similarity to rocky asteroids. _______ they recommended the label \"dwarf comet,\" which better captured those bodies' composition and behavior.\n\nWhich choice completes the text with the most logical transition?\n\nA) Previously,\nB) There,\nC) Regardless,\nD) Instead,", "answer": "D", "explanation": "Instead introduces the replacement term."}, {"id": "26.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The committee advised writers not to use the phrase \"native speaker\" in the survey because it could obscure multilingual experience. _______ the survey should ask which languages respondents use in specific settings.\n\nWhich choice completes the text with the most logical transition?\n\nA) For example,\nB) Instead,\nC) Meanwhile,\nD) Afterward,", "answer": "B", "explanation": "Instead shows a substitute practice."}, {"id": "26.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Some botanists argue that the word \"weed\" is too imprecise for ecological research. _______ they favor the phrase \"spontaneous urban plant\" when describing species that grow without cultivation in cities.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) Instead,\nC) Nevertheless,\nD) Earlier,", "answer": "B", "explanation": "Instead marks the preferred replacement."}, {"id": "26.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The editors decided not to call the collection a memoir, since several chapters blend memory with invented scenes. _______ they described it as autobiographical fiction.\n\nWhich choice completes the text with the most logical transition?\n\nA) Instead,\nB) Previously,\nC) Therefore,\nD) Likewise,", "answer": "A", "explanation": "Instead introduces the new label."}, {"id": "26.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Marine biologists avoided the term \"invasive\" for the newly observed organism until its ecological effects were known. _______ they used the more neutral term \"non-native.\"\n\nWhich choice completes the text with the most logical transition?\n\nA) For instance,\nB) However,\nC) Instead,\nD) In conclusion,", "answer": "C", "explanation": "Instead signals a substitute term."}]}, {"n": 27, "concept": "Transitions: today contrasts past and present.", "original": "Before it unveiled a massive new gallery in 2009, the Art Institute of Chicago was only able to display about 5% of its art collection. _______ the museum is able to display close to 30% of its collection.\n\nWhich choice completes the text with the most logical transition?\nA) Additionally,\nB) For example,\nC) Nevertheless,\nD) Today,", "generated": [{"id": "27.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Before the restoration, only a handful of the archive's fragile maps could be viewed by researchers each month. _______ high-resolution scans allow hundreds of users to examine the collection online.\n\nWhich choice completes the text with the most logical transition?\n\nA) For example,\nB) Today,\nC) Additionally,\nD) Nevertheless,", "answer": "B", "explanation": "Today contrasts past limitation with present access."}, {"id": "27.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. When the theater opened in 1910, audiences entered through a narrow lobby lit by gas lamps. _______ visitors pass through a glass atrium that was added during the renovation.\n\nWhich choice completes the text with the most logical transition?\n\nA) Instead,\nB) Furthermore,\nC) For instance,\nD) Today,", "answer": "D", "explanation": "Today marks the present condition."}, {"id": "27.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. For decades, the laboratory could analyze only a few soil samples per week. _______ automated equipment processes hundreds of samples in a single day.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) For example,\nC) Today,\nD) Nevertheless,", "answer": "C", "explanation": "Today contrasts past and present."}, {"id": "27.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Before the new ferry route began, residents often needed two hours to reach the mainland. _______ the same trip usually takes less than forty minutes.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Additionally,\nC) Today,\nD) For instance,", "answer": "C", "explanation": "Today identifies the current situation."}, {"id": "27.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In the museum's early years, most of its photographs remained in storage. _______ nearly the entire collection can be searched through the museum's digital catalog.\n\nWhich choice completes the text with the most logical transition?\n\nA) Today,\nB) Likewise,\nC) For example,\nD) Nevertheless,", "answer": "A", "explanation": "Today contrasts earlier and current access."}]}, {"n": 28, "concept": "Transitions: on the other hand contrasts elevations.", "original": "Working together with the Navajo Nation Department of Water Resources, Dr. Lani Tsinnajinnie analyzed data about snowpack levels in the Chuska Mountains. She found that the snowpack was deepest in early March at lower elevations. At higher elevations, _______ the snowpack was deepest in mid-March.\n\nWhich choice completes the text with the most logical transition?\nA) in other words,\nB) for instance,\nC) on the other hand,\nD) in summary,", "generated": [{"id": "28.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. At low elevations, the flowers opened in late April. At higher elevations, _______ blooming did not begin until the middle of May.\n\nWhich choice completes the text with the most logical transition?\n\nA) in summary,\nB) in other words,\nC) for instance,\nD) on the other hand,", "answer": "D", "explanation": "On the other hand contrasts the two elevations."}, {"id": "28.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The coastal stations recorded their strongest winds in the morning. Inland stations, _______ recorded their strongest winds after sunset.\n\nWhich choice completes the text with the most logical transition?\n\nA) for instance,\nB) on the other hand,\nC) therefore,\nD) in summary,", "answer": "B", "explanation": "On the other hand introduces a contrast."}, {"id": "28.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Younger participants preferred the audio guide with music. Older participants, _______ tended to choose the version with spoken narration only.\n\nWhich choice completes the text with the most logical transition?\n\nA) on the other hand,\nB) accordingly,\nC) for example,\nD) in other words,", "answer": "A", "explanation": "On the other hand contrasts groups."}, {"id": "28.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. In shallow water, the algae grew fastest under blue light. In deeper water, _______ growth was greatest under green light.\n\nWhich choice completes the text with the most logical transition?\n\nA) in summary,\nB) for example,\nC) on the other hand,\nD) therefore,", "answer": "C", "explanation": "On the other hand contrasts conditions."}, {"id": "28.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The northern plots lost moisture quickly after rainfall. The southern plots, _______ retained moisture for several days.\n\nWhich choice completes the text with the most logical transition?\n\nA) in other words,\nB) as a result,\nC) on the other hand,\nD) similarly,", "answer": "C", "explanation": "On the other hand marks contrast."}]}, {"n": 29, "concept": "Transitions: in addition adds possible use.", "original": "The Inca of South America used intricately knotted string devices called quipus to record countable information, like population data and payments. _______ they may have used quipus to record more complex information, like stories and myths, according to researchers.\n\nWhich choice completes the text with the most logical transition?\nA) As a result,\nB) In other words,\nC) In addition,\nD) For example,", "generated": [{"id": "29.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The tablets record grain deliveries and tax payments. _______ some scholars believe the tablets may also preserve hymns and legal formulas.\n\nWhich choice completes the text with the most logical transition?\n\nA) In other words,\nB) For example,\nC) In addition,\nD) As a result,", "answer": "C", "explanation": "In addition adds another possible use."}, {"id": "29.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The shells were used as ornaments and trade goods. _______ archaeologists think they may have served as tokens in ceremonial exchanges.\n\nWhich choice completes the text with the most logical transition?\n\nA) Therefore,\nB) For instance,\nC) In other words,\nD) In addition,", "answer": "D", "explanation": "In addition adds a further possibility."}, {"id": "29.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The archive contains letters and shipping receipts. _______ it may include coded messages between political organizers.\n\nWhich choice completes the text with the most logical transition?\n\nA) In addition,\nB) As a result,\nC) For example,\nD) That is,", "answer": "A", "explanation": "In addition introduces extra information."}, {"id": "29.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The instrument measured temperature and humidity. _______ it may have recorded changes in air pressure, according to a recent reconstruction.\n\nWhich choice completes the text with the most logical transition?\n\nA) In other words,\nB) In addition,\nC) For instance,\nD) Therefore,", "answer": "B", "explanation": "In addition adds another function."}, {"id": "29.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The murals likely marked ritual spaces. _______ they may have recorded historical events important to the community.\n\nWhich choice completes the text with the most logical transition?\n\nA) In addition,\nB) For example,\nC) Consequently,\nD) In other words,", "answer": "A", "explanation": "In addition adds a second possible role."}]}, {"n": 30, "concept": "Transitions: then means as a result of that situation.", "original": "In hindsight, given the ideas about the natural world circulating among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a coincidence, _______ that Charles Darwin and Alfred Wallace arrived at the concept independently. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.\n\nWhich choice completes the text with the most logical transition?\nA) however,\nB) then,\nC) moreover,\nD) for example,", "generated": [{"id": "30.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Given the number of laboratories already testing radio signals from space, the discovery was an obvious possibility. It is not surprising, _______ that two teams reported similar findings in the same year.\n\nWhich choice completes the text with the most logical transition?\n\nA) for example,\nB) moreover,\nC) then,\nD) however,", "answer": "C", "explanation": "Then means in that case or as a result."}, {"id": "30.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Because several composers were experimenting with electronic instruments at the time, the new style was a natural development. It was predictable, _______ that more than one musician arrived at it independently.\n\nWhich choice completes the text with the most logical transition?\n\nA) therefore,\nB) then,\nC) however,\nD) for example,", "answer": "B", "explanation": "Then links the conclusion to the context."}, {"id": "30.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The necessary statistical methods had become widely available by the 1990s. It was no accident, _______ that multiple research groups began studying the same pattern.\n\nWhich choice completes the text with the most logical transition?\n\nA) then,\nB) for instance,\nC) nevertheless,\nD) however,", "answer": "A", "explanation": "Then means given those circumstances."}, {"id": "30.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Once inexpensive cameras became common, documenting urban wildlife required no specialized equipment. It is understandable, _______ that several amateur naturalists made comparable observations.\n\nWhich choice completes the text with the most logical transition?\n\nA) moreover,\nB) then,\nC) for example,\nD) however,", "answer": "B", "explanation": "Then follows from the prior condition."}, {"id": "30.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archive had just been digitized, making thousands of letters searchable for the first time. It was perhaps inevitable, _______ that several historians noticed the same correspondence.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) moreover,\nC) for example,\nD) then,", "answer": "D", "explanation": "Then means consequently in context."}]}, {"n": 31, "concept": "Student Notes: emphasize Janaki Ammal's achievement.", "original": "While researching a topic, a student has taken the following notes:\n- In the 1930s, the Imperial Sugar Cane Institute in India sought to limit the country's dependence on imported sugarcane.\n- The institute enlisted botanist Janaki Ammal to breed a local variety of sugarcane.\n- She crossbred the imported sugarcane species Saccharum officinarum with grasses native to India.\n- She succeeded in creating sugarcane hybrids well suited to India's climate.\n\nThe student wants to emphasize Janaki Ammal's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) By crossbreeding the imported sugarcane species Saccharum officinarum with grasses native to India, Ammal succeeded in creating sugarcane hybrids well suited to India's climate.\nB) In the 1930s, the Imperial Sugar Cane Institute, which enlisted Ammal, sought to limit dependence on imported sugarcane.\nC) Ammal was enlisted by the Imperial Sugar Cane Institute at a time when a local variety of sugarcane needed to be produced.\nD) As part of efforts to breed a local variety of sugarcane, an imported sugarcane species called Saccharum officinarum was crossbred with grasses native to India.", "generated": [{"id": "31.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Mira Shah was asked to develop rice that could tolerate salty soil; she crossed a coastal rice variety with a high-yield farm variety; the resulting hybrid grew well in salty fields; the goal is to emphasize Shah's achievement.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Salty soil can make rice farming difficult in coastal regions.\nB) Shah was asked to work on rice because farmers needed a new variety.\nC) One of the parent varieties used by Shah was known for high yield.\nD) By crossing a coastal rice variety with a high-yield farm variety, Shah succeeded in creating a rice hybrid that grew well in salty fields.", "answer": "D", "explanation": "The answer emphasizes the achievement."}, {"id": "31.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Engineer Daniel Ruiz designed a low-cost water filter; he combined ceramic clay with powdered charcoal; the filter removed contaminants without electricity; the goal is to emphasize Ruiz's achievement.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Daniel Ruiz was an engineer interested in public health.\nB) Ruiz succeeded in designing a low-cost filter that removed contaminants without electricity.\nC) Some communities need water filters that do not require electricity.\nD) Ceramic clay and powdered charcoal can be used in water filters.", "answer": "B", "explanation": "The answer highlights what Ruiz accomplished."}, {"id": "31.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Chemist Lina Okafor studied biodegradable packaging; she blended cassava starch with plant fibers; the material resisted tearing and decomposed quickly; the goal is to emphasize Okafor's achievement.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Okafor created a cassava-starch packaging material that resisted tearing and decomposed quickly.\nB) Biodegradable packaging can reduce plastic waste.\nC) Plant fibers can strengthen starch-based materials.\nD) Cassava starch was one ingredient in Okafor's material.", "answer": "A", "explanation": "The answer centers the achievement."}, {"id": "31.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Architect Noor Haddad designed a school for a hot desert climate; she used shaded courtyards and thick earthen walls; the building stayed cool with little mechanical air-conditioning; the goal is to emphasize Haddad's achievement.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Using shaded courtyards and thick earthen walls, Haddad designed a school that stayed cool with little mechanical air-conditioning.\nB) The school was designed for a hot desert climate.\nC) The building used thick earthen walls.\nD) Shaded courtyards can reduce heat in buildings.", "answer": "A", "explanation": "The answer emphasizes the successful result."}, {"id": "31.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Computer scientist Elena Park developed translation software for an endangered language; she trained the system on community-recorded stories; the software produced accurate draft translations; the goal is to emphasize Park's achievement.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Translation software often requires large amounts of language data.\nB) Elena Park worked with speakers of an endangered language.\nC) Park developed translation software that produced accurate draft translations after being trained on community-recorded stories.\nD) Community-recorded stories can help preserve endangered languages.", "answer": "C", "explanation": "The answer states the achievement."}]}, {"n": 32, "concept": "Student Notes: emphasize similarity between sculptures.", "original": "While researching a topic, a student has taken the following notes:\n- Elizabeth Catlett's sculpture Recognition (1970) shows two African American figures with rounded, indistinct features.\n- The figures reach out to each other in a pose that symbolizes a close, supportive relationship.\n- Her sculpture Students Aspire (1978) shows two African American figures with sharply defined features.\n- The figures hold an equal sign above their heads with one hand and embrace each other with the other hand.\n- This pose symbolizes their support for each other in the pursuit of equality.\n\nThe student wants to emphasize a similarity between the two sculptures. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Catlett's Students Aspire depicts two figures supporting each other in the pursuit of equality.\nB) Recognition and Students Aspire both show African American figures in poses that symbolize supportive relationships.\nC) Catlett completed Recognition in 1970 and Students Aspire in 1978.\nD) The figures in Recognition have features that are rounded and indistinct, while the figures in Students Aspire have sharply defined features.", "generated": [{"id": "32.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Maya Lin's Wave Field uses raised earth forms; her Storm King Wavefield also uses raised earth forms; both works invite viewers to walk through sculpted landscapes; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Wave Field was completed before Storm King Wavefield.\nB) Maya Lin created several works that are installed outdoors.\nC) Wave Field and Storm King Wavefield both use raised earth forms to create landscapes viewers can walk through.\nD) Storm King Wavefield is larger than Wave Field.", "answer": "C", "explanation": "The answer emphasizes the similarity."}, {"id": "32.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Two murals by Diego Rivera show factory workers; Detroit Industry includes workers operating machines; Man at the Crossroads also includes workers with machines; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Both Detroit Industry and Man at the Crossroads depict factory workers using or standing near machines.\nB) Detroit Industry was painted in the United States.\nC) Rivera often painted scenes of labor and industry.\nD) Man at the Crossroads became controversial after it was commissioned.", "answer": "A", "explanation": "The answer states what the works share."}, {"id": "32.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Two poems by Gwendolyn Brooks focus on city life; one poem describes children playing in alleys; another describes neighbors gathering outside apartments; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The poems focus on different groups of people.\nB) One poem describes children in alleys.\nC) Brooks wrote about many subjects besides cities.\nD) Both poems portray everyday social life in the city.", "answer": "D", "explanation": "The answer emphasizes the shared focus."}, {"id": "32.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Two photographs by Dorothea Lange show migrant families; one photograph shows a mother with children; another shows a father standing beside a packed car; both images convey uncertainty during migration; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The photographs show different members of migrant families.\nB) Lange photographed many people during the Great Depression.\nC) One photograph includes a packed car.\nD) Both photographs convey the uncertainty experienced by migrant families.", "answer": "D", "explanation": "The answer states the similarity."}, {"id": "32.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Two sculptures by Barbara Hepworth include openings through solid forms; the openings allow light to pass through; both works encourage viewers to notice interior and exterior space; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) One of the sculptures is displayed outdoors.\nB) Both sculptures use openings through solid forms to draw attention to interior and exterior space.\nC) Light can pass through the openings in the sculptures.\nD) Hepworth often worked with abstract forms.", "answer": "B", "explanation": "The answer emphasizes what the sculptures share."}]}, {"n": 33, "concept": "Student Notes: generalize about materials in dhow replicas.", "original": "While researching a topic, a student has taken the following notes:\n- The ancient Arab dhow was a sailing vessel distinguishable by its triangular sails and stitched hull construction.\n- Dhows were used primarily for trade along the coasts of Arab, South Asian, and East African countries.\n- Contemporary shipbuilders in Oman use a mix of modern and traditional materials to build replicas of ancient dhows.\n- Most of the materials used are traditional.\n- Replica hulls are stitched together using the same traditional coconut palm fiber rope used on the hulls of ancient dhows.\n\nThe student wants to make a generalization about the materials used in dhow replicas. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) A traditional material that was used to stitch together the hulls of ancient dhows, coconut palm fiber rope is still used by shipbuilders.\nB) The ancient Arab dhow was a sailing vessel used primarily for trade and distinguishable by its triangular sails.\nC) Although most materials used in dhow replicas are traditional, some modern materials are used.\nD) Contemporary shipbuilders in Oman build replicas of the dhow, which was an ancient sailing vessel with a stitched hull construction.", "generated": [{"id": "33.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Modern builders of reed boats use bundles of local reeds; some synthetic cord is used for reinforcement; most materials are traditional; the goal is to generalize about materials.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Although modern reed boats use some synthetic cord, most of their materials are traditional.\nB) Synthetic cord is sometimes stronger than plant fiber.\nC) Reed boats can be built for ceremonies and tourism.\nD) Local reeds are gathered before boat construction begins.", "answer": "A", "explanation": "The answer makes the requested generalization."}, {"id": "33.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Replica medieval lutes are made mostly from maple, spruce, and gut strings; makers sometimes use modern adhesives; the goal is to generalize about materials.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Modern adhesives can help stabilize delicate instruments.\nB) Replica medieval lutes are musical instruments.\nC) Although replica medieval lutes may use modern adhesives, they are made mostly from traditional materials such as maple, spruce, and gut strings.\nD) Maple and spruce are common woods in instrument making.", "answer": "C", "explanation": "The answer generalizes across materials."}, {"id": "33.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Contemporary makers of bark canoes use birch bark, cedar ribs, and spruce root lashing; a small amount of waterproof synthetic sealant is sometimes added; most materials are traditional; the goal is to generalize about materials.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Cedar ribs help shape the canoe.\nB) Synthetic sealant can help prevent leaks.\nC) Birch bark is used on the exterior of many bark canoes.\nD) Contemporary bark-canoe replicas are built mostly with traditional materials, though some makers add a small amount of modern sealant.", "answer": "D", "explanation": "The answer summarizes the mix of materials."}, {"id": "33.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Replica Roman sandals use leather soles and straps; some makers add rubber inserts for durability; most visible materials are traditional; the goal is to generalize about materials.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Roman sandals had soles and straps.\nB) Replica Roman sandals are made mostly with traditional visible materials, even though some include modern rubber inserts.\nC) Leather was widely used in ancient footwear.\nD) Rubber inserts make some replica sandals more durable.", "answer": "B", "explanation": "The answer makes a generalization."}, {"id": "33.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Builders of historical kites use bamboo frames and paper coverings; nylon thread is sometimes substituted for silk; most materials remain traditional; the goal is to generalize about materials.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Nylon thread is a modern material.\nB) Historical kite replicas usually rely on traditional bamboo and paper, although some builders substitute nylon thread for silk.\nC) Bamboo frames give kites their shape.\nD) Silk was traditionally used to control kites.", "answer": "B", "explanation": "The answer generalizes about the material mix."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
</body>
