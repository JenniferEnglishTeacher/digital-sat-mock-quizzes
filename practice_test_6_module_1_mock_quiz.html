  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: similarities with.", "original": "Though not closely related, the hedgehog tenrecs of Madagascar share basic _______ true hedgehogs, including protective spines, pointed snouts, and small body size--traits the two groups of mammals independently developed in response to equivalent roles in their respective habitats.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) examples of\nB) concerns about\nC) indications of\nD) similarities with", "generated": [{"id": "1.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Though the two urban neighborhoods developed in different eras, they share basic _______ one another: narrow commercial streets, mixed-use buildings, and public squares that encourage informal gathering.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) similarities with\nB) warnings about\nC) examples of\nD) objections to", "answer": "A", "explanation": "The context calls for a phrase meaning resemblance."}, {"id": "1.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The two manuscripts were copied in different monasteries, but they preserve several _______ each other, including the same unusual spelling choices and nearly identical marginal notes.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) criticisms of\nB) concerns about\nC) likenesses to\nD) departures from", "answer": "C", "explanation": "The shared features are likenesses."}, {"id": "1.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Although the island fox is not a close relative of the mainland gray fox, it shows clear _______ that species in body shape, hunting behavior, and diet.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) evidence for\nB) resemblances to\nC) exceptions to\nD) reservations about", "answer": "B", "explanation": "The sentence compares shared traits."}, {"id": "1.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The newly discovered instrument is not a direct ancestor of the modern violin, but it has striking _______ it, including a curved body and strings tuned in fifths.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) inquiries into\nB) doubts about\nC) imitations of\nD) affinities with", "answer": "D", "explanation": "Affinities with means similarities to."}, {"id": "1.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Although the two legal systems arose independently, historians note several _______ them, particularly in rules governing contracts and inheritance.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) complaints about\nB) predictions about\nC) parallels between\nD) barriers between", "answer": "C", "explanation": "Parallels between means similarities."}]}, {"n": 2, "concept": "Words in Context: overtly signaled politics.", "original": "In editor Lisa Yaszek's introduction to her anthology The Future Is Female! More Classic Science Fiction Stories by Women, Yaszek identifies an increasing sense of _______ feminist mode of writing in the 1970s, in contrast to many woman-authored science fiction stories of the 1920s to 1960s whose politics were less deliberately signaled.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) a prudently\nB) an overtly\nC) a cordially\nD) an inadvertently", "generated": [{"id": "2.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The senator's speech marked a shift from cautious hints to _______ criticism of the policy: instead of implying disagreement, she directly called the measure unjust and ineffective.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) an accidental\nB) a cordial\nC) an overt\nD) a tentative", "answer": "C", "explanation": "The criticism is open and direct."}, {"id": "2.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Earlier murals encoded political messages through symbols, but the artist's later posters adopted _______ activist language, naming the campaign and urging viewers to join it.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a reluctantly\nB) an explicitly\nC) an inadvertently\nD) a privately", "answer": "B", "explanation": "Explicitly means openly and directly."}, {"id": "2.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The essay does not merely suggest its environmental commitments; it states them in _______ terms, repeatedly arguing that conservation must guide public policy.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unmistakable\nB) improvised\nC) decorative\nD) ambiguous", "answer": "A", "explanation": "Unmistakable means impossible to miss."}, {"id": "2.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. In contrast to the novelist's early work, whose social commentary was subtle, the later trilogy is _______ political, with characters debating labor rights on nearly every page.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) incidentally\nB) accidentally\nC) openly\nD) mildly", "answer": "C", "explanation": "Openly matches overtly."}, {"id": "2.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The director's first films hid their feminist themes in genre conventions, whereas her recent documentaries make those commitments _______ through interviews, archival footage, and narration.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unplanned\nB) courteous\nC) irrelevant\nD) plain", "answer": "D", "explanation": "Plain means clearly expressed."}]}, {"n": 3, "concept": "Words in Context: redressing an imbalance.", "original": "_______ the long-standing trend of overemphasizing teenagers and young adults in research on social media use, scholars have recently begun to expand their focus to include the fastest-growing cohort of social media users: senior citizens.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) Exacerbating\nB) Redressing\nC) Epitomizing\nD) Precluding", "generated": [{"id": "3.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. _______ decades of research that had focused almost exclusively on large mammals, ecologists have begun studying insects and soil organisms to obtain a fuller picture of forest recovery.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) Preventing\nB) Representing\nC) Counteracting\nD) Intensifying", "answer": "C", "explanation": "The new work corrects an old imbalance."}, {"id": "3.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. By collecting oral histories from factory workers as well as managers, the historian is _______ an earlier bias in archives that preserved executives' views far more often than laborers' experiences.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) embodying\nB) exacerbating\nC) excluding\nD) correcting", "answer": "D", "explanation": "Correcting means redressing."}, {"id": "3.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The museum's decision to acquire more works by women artists is intended to _______ a long-standing imbalance in a collection dominated by male painters.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) illustrate\nB) remedy\nC) worsen\nD) foreclose", "answer": "B", "explanation": "Remedy means fix or redress."}, {"id": "3.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The new survey includes rural households that previous studies omitted, thereby _______ a sampling problem that had made earlier conclusions less representative.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) symbolizing\nB) imitating\nC) addressing\nD) magnifying", "answer": "C", "explanation": "Addressing means dealing with a problem."}, {"id": "3.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. To _______ the underrepresentation of older adults in clinical trials, the research team redesigned its recruitment process and partnered with community health centers.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) redress\nB) prohibit\nC) typify\nD) heighten", "answer": "A", "explanation": "Redress means remedy an unfair or faulty situation."}]}, {"n": 4, "concept": "Words in Context: disputing as resisting passage.", "original": "The following text is adapted from James Baldwin's 1956 novel Giovanni's Room. The narrator is riding in a taxi down a street lined with food vendors and shoppers in Paris, France.\n\nThe multitude of Paris seems to be dressed in blue every day but Sunday, when, for the most part, they put on an unbelievably festive black. Here they were now, in blue, disputing, every inch, our passage, with their wagons, handtrucks, their bursting baskets carried at an angle steeply self-confident on the back.\n\nAs used in the text, what does the word \"disputing\" most nearly mean?\nA) Arguing about\nB) Disapproving of\nC) Asserting possession of\nD) Providing resistance to", "generated": [{"id": "4.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The parade's route was so crowded that vendors and spectators seemed to be _______ every meter of the dancers' progress, forcing the procession to slow repeatedly.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) describing\nB) blocking\nC) owning\nD) approving", "answer": "B", "explanation": "The context means resisting passage."}, {"id": "4.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. As the hikers moved through the market street, carts and delivery bicycles _______ their path, leaving them to squeeze sideways between crates.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) obstructed\nB) claimed\nC) discussed\nD) endorsed", "answer": "A", "explanation": "Obstructed means provided resistance to movement."}, {"id": "4.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The river did not merely curve around the fallen trees; its current seemed to be _______ them, breaking into noisy eddies before forcing a narrow channel through the branches.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) explaining\nB) admiring\nC) contesting\nD) summarizing", "answer": "C", "explanation": "Contesting can mean resisting or struggling against."}, {"id": "4.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The old gate, warped by years of rain, _______ our entrance until two people pushed together and made it swing inward.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) praised\nB) owned\nC) resisted\nD) announced", "answer": "C", "explanation": "Resisted matches the meaning in context."}, {"id": "4.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. During the evening rush, taxis, cyclists, and pedestrians _______ the bus's advance so thoroughly that a five-minute trip took nearly half an hour.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) celebrated\nB) debated\nC) possessed\nD) impeded", "answer": "D", "explanation": "Impeded means slowed or blocked."}]}, {"n": 5, "concept": "Words in Context: inconsequential to contemporaries.", "original": "While recent scholarship has undermined claims that the works of twelfth-century Islamic philosopher Ibn Rushd were _______ other Muslim philosophers of his time, it is indisputable that his location in the Muslim-ruled area of what is now Spain meant that his works were primarily available thousands of miles west of the era's center of Islamic thought.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) controversial among\nB) antagonistic toward\nC) imitated by\nD) inconsequential to", "generated": [{"id": "5.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Although later readers admired the poet, evidence suggests that his work was largely _______ critics of his own generation, who rarely reviewed it and almost never cited it.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) copied by\nB) hostile toward\nC) famous among\nD) irrelevant to", "answer": "D", "explanation": "The context calls for lacking importance to contemporaries."}, {"id": "5.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The composer's notebooks show that, contrary to earlier claims, her experiments were not _______ other musicians in the city; several performers discussed them in letters.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unimportant to\nB) opposed to\nC) imitated by\nD) praised by", "answer": "A", "explanation": "The sentence rejects the idea that the work did not matter to others."}, {"id": "5.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. New evidence undermines the view that the reformer's pamphlets were _______ local politics, since council minutes show that officials debated them repeatedly.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) central to\nB) directed against\nC) inconsequential to\nD) borrowed from", "answer": "C", "explanation": "Inconsequential to means unimportant to."}, {"id": "5.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. While the architect worked far from the capital, recent discoveries challenge the assumption that her designs were _______ the era's major builders.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) available to\nB) insignificant to\nC) modeled on\nD) celebrated by", "answer": "B", "explanation": "Insignificant to means not important to."}, {"id": "5.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archive has weakened the claim that the scientist's early articles were _______ contemporary researchers; several laboratories evidently changed their methods after reading them.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) of no consequence to\nB) critical of\nC) derived from\nD) in agreement with", "answer": "A", "explanation": "Of no consequence to means inconsequential to."}]}, {"n": 6, "concept": "Text Function: elaborate on Johnson's artistic transition.", "original": "On painter William H. Johnson's return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. Turning away from landscapes painted in an expressionist style--a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist's subjective experience of reality--Johnson began painting portraits of Black Americans in a bold new way. Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\nA) It elaborates on the previous sentence's statement about a transitional moment in Johnson's artistic career.\nB) It provides information about Johnson's travels in support of a claim about his artistic influences, which is advanced in the following sentence.\nC) It recounts a moment in Johnson's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.\nD) It presents evidence that calls into question the previous sentence's characterization of Johnson's artistic development.", "generated": [{"id": "6.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It identifies the uncertainty that motivated the study.\nB) It describes how other researchers criticized the work.\nC) It states the study's final conclusion.\nD) It offers evidence that radar is always reliable.", "answer": "A", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "6.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It defines the problem the later investigation attempts to address.\nB) It contradicts the claim made in the first sentence.\nC) It shifts the discussion away from archaeology.\nD) It summarizes the team's strongest result.", "answer": "A", "explanation": "The sentence frames the central research question."}, {"id": "6.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It gives a historical overview of plant classification.\nB) It proves that drought has no effect on plants.\nC) It lists the materials used in the experiment.\nD) It introduces a gap in knowledge that the experiment examines.", "answer": "D", "explanation": "The sentence identifies an unresolved issue."}, {"id": "6.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It provides biographical information about the novelist.\nB) It raises a difficulty with a common interpretation.\nC) It introduces an unrelated theme.\nD) It summarizes the novel's publication history.", "answer": "B", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "6.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It gives a personal anecdote about engineers.\nB) It compares underwater vehicles with aircraft.\nC) It explains the limitation that the new system is meant to address.\nD) It announces that the technology is already flawless.", "answer": "C", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 7, "concept": "Main Purpose: effortful preparation behind apparent ease.", "original": "When classical pianist Martha Argerich performs, it appears as if the music is coming to her spontaneously. She's highly skilled technically, but because of how freely she plays and her willingness to take risks, she seems relaxed and natural. Her apparent ease, however, is due to a tremendous amount of preparation. Despite Argerich's experience and virtuosity, she never takes for granted that she knows a piece of music. Instead, she approaches the music as if encountering it for the first time and tries to understand it anew.\n\nWhich choice best states the main purpose of the text?\nA) To provide details about how Argerich identifies which pieces of music she will perform\nB) To assert that Argerich's performances look effortless because of how she prepares for them\nC) To discuss the kinds of music Argerich feels most comfortable encountering for the first time\nD) To describe the unique way that Argerich approaches music she hasn't performed before", "generated": [{"id": "7.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To argue that the characters should leave the house\nB) To portray a setting and mood as characters prepare for an arrival\nC) To summarize a conflict between two relatives\nD) To explain why music has lost its importance", "answer": "B", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "7.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To compare several forms of transportation\nB) To criticize sailors for taking unnecessary risks\nC) To list the technical features of a harbor\nD) To present an atmosphere of departure and possibility", "answer": "D", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "7.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To depict preparations that reveal anticipation within a family\nB) To describe a completed celebration from beginning to end\nC) To explain why the family dislikes visitors\nD) To contrast rural and urban customs", "answer": "A", "explanation": "The details focus on preparation and anticipation."}, {"id": "7.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To argue that early classes should be canceled\nB) To evaluate the quality of a school's curriculum\nC) To recount a student's entire academic career\nD) To describe the moments before a significant daily activity begins", "answer": "D", "explanation": "The purpose is to depict a scene before an event."}, {"id": "7.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To reveal the full contents of a letter\nB) To compare two different seasons\nC) To establish a reflective mood before a character acts\nD) To give instructions for maintaining a garden", "answer": "C", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 8, "concept": "Text Function: character trait explains Israel's thwarted ambition.", "original": "The following text is adapted from Herman Melville's 1855 novel Israel Potter. Israel is a young man wandering through New England during the late eighteenth century.\n\nHe hired himself out for three months; at the end of that time to receive for his wages two hundred acres of land lying in New Hampshire. [...] His employer proving false to the contract in the matter of the land, and there being no law in the country to force him to fulfil it, Israel--who, however brave-hearted, and even much of a dare-devil upon a pinch, seems nevertheless to have evinced, throughout many parts of his career, a singular patience and mildness--was obliged to look round for other means of livelihood than clearing out a farm for himself in the wilderness.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\nA) It implies that Israel treasures a particular characteristic of his personality when that characteristic should usually be regarded as a flaw.\nB) It suggests that if not for a certain aspect of his character, Israel might not have been as easily thwarted in his ambition to establish a farm.\nC) It shows why Israel would not have been able to undertake the enormous amount of labor necessary to run a farm even if he had owned the necessary property.\nD) It explains why, when the situation requires it, Israel is able to undertake courageous acts that others would generally avoid.", "generated": [{"id": "8.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It describes how other researchers criticized the work.\nB) It identifies the uncertainty that motivated the study.\nC) It states the study's final conclusion.\nD) It offers evidence that radar is always reliable.", "answer": "B", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "8.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It defines the problem the later investigation attempts to address.\nB) It shifts the discussion away from archaeology.\nC) It summarizes the team's strongest result.\nD) It contradicts the claim made in the first sentence.", "answer": "A", "explanation": "The sentence frames the central research question."}, {"id": "8.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It lists the materials used in the experiment.\nB) It introduces a gap in knowledge that the experiment examines.\nC) It gives a historical overview of plant classification.\nD) It proves that drought has no effect on plants.", "answer": "B", "explanation": "The sentence identifies an unresolved issue."}, {"id": "8.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It introduces an unrelated theme.\nB) It summarizes the novel's publication history.\nC) It provides biographical information about the novelist.\nD) It raises a difficulty with a common interpretation.", "answer": "D", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "8.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined portion in the text as a whole?\n\nA) It announces that the technology is already flawless.\nB) It gives a personal anecdote about engineers.\nC) It explains the limitation that the new system is meant to address.\nD) It compares underwater vehicles with aircraft.", "answer": "C", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 9, "concept": "Paired Texts: update Nutcracker rather than reject it.", "original": "Text 1\nIn 1954 George Balanchine choreographed a production of The Nutcracker, a ballet by Pyotr Ilyich Tchaikovsky. It has since become a tradition for hundreds of dance companies in North America to stage The Nutcracker each year. But the show is stuck in the past, with an old-fashioned story and references, so it should no longer be produced. Ballet needs to create new traditions if it wants to stay relevant to contemporary audiences.\n\nText 2\nThe Nutcracker is outdated, but it should be kept because it's a holiday favorite and provides substantial income for some dance companies. Although it can be behind the times, there are creative ways to update the show. For example, Debbie Allen successfully modernized the story. Her show Hot Chocolate Nutcracker combines ballet, tap, hip-hop, and other styles, and it has been gaining in popularity since it opened in 2009.\n\nBased on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?\nA) By questioning the idea that the story of The Nutcracker is stuck in the past and by rejecting the suggestion that contemporary audiences would enjoy an updated version\nB) By agreeing that contemporary audiences have largely stopped going to see performances of The Nutcracker because it's so old-fashioned\nC) By pointing out that most dance companies could increase their incomes by offering modernized versions of The Nutcracker\nD) By suggesting that dance companies should consider offering revised versions of The Nutcracker instead of completely rejecting the show", "generated": [{"id": "9.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nBased on the texts, how would the author of Text 2 most likely respond?\n\nA) 'The leader's speeches are preserved in several archives.'\nB) 'The leader signed several decrees during his first month in office.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The administration faced economic challenges from the beginning.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "9.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nBased on the texts, how would the author of Text 2 most likely respond?\n\nA) Some farmers grew vegetables, while others grew grain.\nB) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nC) The southern region was included in the survey.\nD) The graph contains information about three regions.", "answer": "B", "explanation": "The answer uses a specific contrast in the data."}, {"id": "9.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nBased on the texts, how would the author of Text 2 most likely respond?\n\nA) Some stars contain hydrogen and helium.\nB) One rocky planet has a thin atmosphere.\nC) The method used to study stars requires a telescope.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "9.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nBased on the texts, how would the author of Text 2 most likely respond?\n\nA) The tradition is studied by scholars in several countries.\nB) Some songs use a meter also found in older European poetry.\nC) Many performers learned songs from relatives.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "9.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nBased on the texts, how would the author of Text 2 most likely respond?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) Both towns had some volunteers.\nC) The table includes more than one year.\nD) The program took place in a community.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 10, "concept": "Main Idea: testing Paleolithic light sources.", "original": "To understand how Paleolithic artists navigated dark caves, archaeologist Maria Angeles Medina-Alcaide and her team tested different lighting methods in a cave in Spain using replicas of artifacts found in European caves with art. They used three different Paleolithic light sources--torches, animal-fat lamps, and fireplaces--determining that each likely had a specific purpose. For instance, the team learned that the animal-fat lamps were less useful than torches while walking because the lamps didn't illuminate the cave floor.\n\nWhich choice best states the main idea of the text?\nA) Medina-Alcaide and her team's study demonstrated that fireplaces were essential to the creators of Paleolithic cave art.\nB) Medina-Alcaide and her team discovered that Paleolithic cave artists in Spain used animal-fat lamps more often than they used torches.\nC) Medina-Alcaide and her team were reluctant to draw many conclusions from their study because of the difficulty they had replicating light sources based on known artifacts.\nD) Medina-Alcaide and her team tested Paleolithic light sources and learned some details about how Paleolithic artists traveled within dark caves.", "generated": [{"id": "10.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To argue that the characters should leave the house\nB) To portray a setting and mood as characters prepare for an arrival\nC) To explain why music has lost its importance\nD) To summarize a conflict between two relatives", "answer": "B", "exp clined.", "original": "Annual Car Production in the United States, 1910-1925\n1910: 123,990 cars; 320 companies producing cars.\n1915: 548,139 cars; 224 companies producing cars.\n1920: 1,651,625 cars; 197 companies producing cars.\n1925: 3,185,881 cars; 80 companies producing cars.\n\nA student is using the table as part of a social studies class presentation on the US auto industry in the early twentieth century. The student notes that, according to the table, from 1910 to 1925 _______\n\nWhich choice most effectively uses data from the table to complete the statement?\nA) the number of cars produced increased but the number of companies producing cars decreased.\nB) both the number of cars produced and the number of companies producing cars remained unchanged.\nC) the number of cars produced decreased but the number of companies producing cars remained unchanged.\nD) both the number of cars produced and the number of companies producing cars increased.", "generated": [{"id": "11.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "11.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The southern region was included in the survey.\nB) The graph contains information about three regions.\nC) Some farmers grew vegetables, while others grew grain.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "11.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) One rocky planet has a thin atmosphere.\nC) Some stars contain hydrogen and helium.\nD) The method used to study stars requires a telescope.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "11.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) Many performers learned songs from relatives.\nD) The tradition is studied by scholars in several countries.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "11.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The table includes more than one year.\nB) The program took place in a community.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) Both towns had some volunteers.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 12, "concept": "Command of Evidence: shopper quote supports layout explanation.", "original": "External shopping cues are a type of marketing that uses obvious messaging--a display featuring a new product, for example, or a \"buy one, get one free\" offer--to entice consumers to make spontaneous purchases. In a study, data scientist Sam K. Hui and colleagues found that this effect can also be achieved with a less obvious cue: rearranging a store's layout. The researchers explain that trying to find items in new locations causes shoppers to move through more of the store, exposing them to more products and increasing the likelihood that they'll buy an item they hadn't planned on purchasing.\n\nWhich response from a survey given to shoppers who made a purchase at a retail store best supports the researchers' explanation?\nA) \"I needed to buy some cleaning supplies, but they weren't in their regular place. While I was looking for them, I saw this interesting notebook and decided to buy it, too.\"\nB) \"I didn't buy everything on my shopping list today. I couldn't find a couple of the items in the store, even though I looked all over for them.\"\nC) \"The store sent me a coupon for a new brand of soup, so I came here to find out what kinds of soup that brand offers. I decided to buy a few cans because I had the coupon.\"\nD) \"This store is larger than one that's closer to where I live, and it carries more products. I came here to buy some things that the other store doesn't always have.\"", "generated": [{"id": "12.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The leader signed several decrees during his first month in office.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "12.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The southern region was included in the survey.\nB) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nC) Some farmers grew vegetables, while others grew grain.\nD) The graph contains information about three regions.", "answer": "B", "explanation": "The answer uses a specific contrast in the data."}, {"id": "12.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The method used to study stars requires a telescope.\nB) One rocky planet has a thin atmosphere.\nC) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nD) Some stars contain hydrogen and helium.", "answer": "C", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "12.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nB) The tradition is studied by scholars in several countries.\nC) Some songs use a meter also found in older European poetry.\nD) Many performers learned songs from relatives.", "answer": "A", "explanation": "Recent blended features support cultural exchange."}, {"id": "12.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Both towns had some volunteers.\nB) The table includes more than one year.\nC) The program took place in a community.\nD) The program was associated with a clear increase in trained volunteers compared with the town without the program.", "answer": "D", "explanation": "The comparison supports the program's effect."}]}, {"n": 13, "concept": "Command of Evidence: diverse media in exhibitions.", "original": "The 2021 exhibition This Is the Day at Arkansas's Crystal Bridges Museum of American Art featured works dealing with expressions of faith and spirituality in the Black community. The museum's 2022 exhibition The Dirty South, meanwhile, focused on Black culture in the American South from 1920 to 2020, with a particular focus on the intersections between visual arts and music. Together, these exhibitions don't merely highlight the diversity of the Black experience in the US; they also showcase the diverse media through which artists have depicted and engaged with that experience.\n\nWhich statement about the exhibitions, if true, would most directly support the underlined claim?\nA) Between them, This Is the Day and The Dirty South included drawings, paintings, photographs, sculptures, textiles, videos, costumes, and music.\nB) This Is the Day included works by fewer than two dozen artists, whereas The Dirty South included works by more than 80 artists.\nC) This Is the Day exclusively included works in the permanent collection of the museum, whereas The Dirty South included works from multiple sources outside the museum.\nD) Between them, This Is the Day and The Dirty South included works depicting more than 300 years of Black experience in the United States.", "generated": [{"id": "13.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "answer": "D", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "13.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The graph contains information about three regions.\nB) The southern region was included in the survey.\nC) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nD) Some farmers grew vegetables, while others grew grain.", "answer": "C", "explanation": "The answer uses a specific contrast in the data."}, {"id": "13.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Some stars contain hydrogen and helium.\n ir maximal speed when escaping predation as they do when pursuing prey.\nB) multiple lizard species move at an average of less than 90% of their maximal speed while escaping predation.\nC) more lizard species use, on average, 90%-100% of their maximal speed while escaping predation than use any other percentage of their maximal speed.\nD) at least 4 lizard species use, on average, less than 100% of their maximal speed while pursuing prey.", "generated": [{"id": "15.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The leader signed several decrees during his first month in office.'\nD) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "answer": "D", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "15.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple i ": "Command of Evidence: TMAO stabilizes water under pressure.", "original": "Under normal atmospheric pressure at Earth's surface, water molecules form a tetrahedral network stabilized by hydrogen bonds between adjacent molecules. Extreme high pressure, such as can be found in deep ocean waters, destabilizes these bonds and compresses water's structure, allowing water molecules within organisms to permeate proteins and impede crucial biological functions; yet deep-sea organisms known as piezophiles have adapted to extreme pressure. Studies have found a positive correlation between the depths that various piezophiles inhabit and concentrations of a compound called trimethylamine N-oxide (TMAO) in their muscle tissues, which has led a team of researchers to hypothesize that TMAO reduces water's compressibility.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\nA) Water molecules are found to be impervious to TMAO even when the water molecules' tetrahedral configuration has been distorted by high pressure.\nB) Examination of TMAO's molecular structure shows that TMAO molecules retain their shape even as pressure increases.\nC) A positive correlation is found between concentrations of TMAO and the rate at which water's molecular structure compresses as pressure increases.\nD) Analysis of water's molecular structure under high pressure reveals that hydrogen bonds are more stable when TMAO is present than when it is not.", "generated": [{"id": "16.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single
