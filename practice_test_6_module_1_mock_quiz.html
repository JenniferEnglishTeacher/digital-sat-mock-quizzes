<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 6, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 6, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnDlDoc">⬇ Download wrong (Word 錯題講義)</button>
      <label class="scope">下載範圍 <select id="dlScope"><option value="session">本次作答 This attempt</option><option value="all">全部錯題本 All saved</option></select></label>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: similarities with.", "vocab": true, "body": "Though not closely related, the hedgehog tenrecs of Madagascar share basic _______ true hedgehogs, including protective spines, pointed snouts, and small body size--<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trait\" target=\"_blank\" rel=\"noopener\" data-w=\"trait\" data-pos=\"n.\" data-en=\"a particular quality or characteristic\" data-zh=\"特徵；特質\">traits<\/a> the two groups of mammals <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a> developed in response to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equivalent\" target=\"_blank\" rel=\"noopener\" data-w=\"equivalent\" data-pos=\"n./adj.\" data-en=\"something equal in value or meaning; equal\" data-zh=\"等值物；相等的\">equivalent<\/a> roles in their respective <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=habitat\" target=\"_blank\" rel=\"noopener\" data-w=\"habitat\" data-pos=\"n.\" data-en=\"the natural home of an animal or plant\" data-zh=\"棲息地\">habitats<\/a>.", "bodyPlain": "Though not closely related, the hedgehog tenrecs of Madagascar share basic _______ true hedgehogs, including protective spines, pointed snouts, and small body size--traits the two groups of mammals independently developed in response to equivalent roles in their respective habitats.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "雖然親緣關係並不接近，馬達加斯加的刺蝟馬島蝟與真正的刺蝟仍有許多基本的 _______，包括防禦用的棘刺、尖吻與小巧的體型——這兩類哺乳動物是為了在各自棲地扮演相同角色而各自獨立演化出這些特徵。", "opts": {"A": "examples of", "B": "concerns about", "C": "indications of", "D": "similarities with"}, "optsZh": {"A": "examples of（……的例子）", "B": "concerns about（對……的擔憂）", "C": "indications of（……的跡象）", "D": "similarities with（與……的相似之處）"}, "answer": "D", "expl": "Tenrecs and hedgehogs share spines, pointed snouts, and small size, so they share basic 'similarities with' each other.", "explZh": "馬島蝟和刺蝟都有棘刺、尖吻和小體型，所以兩者有基本的「similarities with」（與……的相似之處）。", "defs": {"A": {"pos": "n. phr.", "en": "particular cases that show what a group or type is like", "zh": "……的例子", "word": "examples of"}, "B": {"pos": "n. phr.", "en": "worries about something", "zh": "對……的擔憂", "word": "concerns about"}, "C": {"pos": "n. phr.", "en": "signs that suggest something is true or exists", "zh": "……的跡象", "word": "indications of"}, "D": {"pos": "n. phr.", "en": "ways in which things are alike", "zh": "與……的相似之處", "word": "similarities with"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: similarities with.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Though the two urban <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> developed in different eras, they share basic _______ one another: narrow commercial streets, mixed-use buildings, and public squares that encourage informal gathering.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Though the two urban neighborhoods developed in different eras, they share basic _______ one another: narrow commercial streets, mixed-use buildings, and public squares that encourage informal gathering.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。雖然這兩個城市街區發展於不同年代，它們彼此之間仍有基本的 _______：狹窄的商業街道、複合用途建築，以及鼓勵人們非正式聚集的公共廣場。", "opts": {"A": "similarities with", "B": "warnings about", "C": "examples of", "D": "objections to"}, "optsZh": {"A": "similarities with（與……的相似之處）", "B": "warnings about（關於……的警告）", "C": "examples of（……的例子）", "D": "objections to（對……的反對）"}, "answer": "A", "expl": "The context calls for a phrase meaning resemblance.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "ways in which things are alike", "zh": "與……的相似之處", "word": "similarities with"}, "B": {"pos": "n. phr.", "en": "statements that tell people about a possible danger", "zh": "關於……的警告", "word": "warnings about"}, "C": {"pos": "n. phr.", "en": "particular cases that show what a group or type is like", "zh": "……的例子", "word": "examples of"}, "D": {"pos": "n. phr.", "en": "reasons for disagreeing with or opposing something", "zh": "對……的反對", "word": "objections to"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: similarities with.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> were copied in different monasteries, but they <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserve<\/a> several _______ each other, including the same unusual spelling choices and nearly identical marginal notes.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The two manuscripts were copied in different monasteries, but they preserve several _______ each other, including the same unusual spelling choices and nearly identical marginal notes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這兩份手稿是在不同的修道院抄寫的，但它們保留了幾處彼此的 _______，包括同樣不尋常的拼寫方式和幾乎一模一樣的旁註。", "opts": {"A": "criticisms of", "B": "concerns about", "C": "likenesses to", "D": "departures from"}, "optsZh": {"A": "criticisms of（對……的批評）", "B": "concerns about（對……的擔憂）", "C": "likenesses to（與……的相似之處）", "D": "departures from（對……的背離）"}, "answer": "C", "expl": "The shared features are likenesses.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "comments pointing out faults in something", "zh": "對……的批評", "word": "criticisms of"}, "B": {"pos": "n. phr.", "en": "worries about something", "zh": "對……的擔憂", "word": "concerns about"}, "C": {"pos": "n. phr.", "en": "ways in which something resembles something else", "zh": "與……的相似之處", "word": "likenesses to"}, "D": {"pos": "n. phr.", "en": "changes away from a usual way or model", "zh": "對……的背離；偏離", "word": "departures from"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: similarities with.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Although the island fox is not a close relative of the mainland gray fox, it shows clear _______ that species in body shape, hunting behavior, and diet.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Although the island fox is not a close relative of the mainland gray fox, it shows clear _______ that species in body shape, hunting behavior, and diet.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。雖然島嶼灰狐並非大陸灰狐的近親，但牠在體型、狩獵行為和食性上，都與該物種有明顯的 _______。", "opts": {"A": "evidence for", "B": "resemblances to", "C": "exceptions to", "D": "reservations about"}, "optsZh": {"A": "evidence for（支持……的證據）", "B": "resemblances to（與……的相似之處）", "C": "exceptions to（……的例外）", "D": "reservations about（對……的保留）"}, "answer": "B", "expl": "The sentence compares shared traits.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "facts or signs that show something is true", "zh": "支持……的證據", "word": "evidence for"}, "B": {"pos": "n. phr.", "en": "ways in which something looks or acts like something else", "zh": "與……的相似之處", "word": "resemblances to"}, "C": {"pos": "n. phr.", "en": "cases that do not follow a general rule", "zh": "……的例外", "word": "exceptions to"}, "D": {"pos": "n. phr.", "en": "doubts or feelings of not fully agreeing with something", "zh": "對……的保留（疑慮）", "word": "reservations about"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: similarities with.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The newly discovered <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrument<\/a> is not a direct ancestor of the modern violin, but it has striking _______ it, including a curved body and strings tuned in fifths.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The newly discovered instrument is not a direct ancestor of the modern violin, but it has striking _______ it, including a curved body and strings tuned in fifths.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。這件新發現的樂器並不是現代小提琴的直系祖先，但它與小提琴有驚人的 _______，包括彎曲的琴身和以五度音程調音的琴弦。", "opts": {"A": "inquiries into", "B": "doubts about", "C": "imitations of", "D": "affinities with"}, "optsZh": {"A": "inquiries into（對……的調查）", "B": "doubts about（對……的懷疑）", "C": "imitations of（對……的模仿）", "D": "affinities with（與……的相似性）"}, "answer": "D", "expl": "Affinities with means similarities to.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "official or careful investigations of something", "zh": "對……的調查", "word": "inquiries into"}, "B": {"pos": "n. phr.", "en": "feelings of being unsure about something", "zh": "對……的懷疑", "word": "doubts about"}, "C": {"pos": "n. phr.", "en": "copies made to look or act like something else", "zh": "對……的模仿；仿製品", "word": "imitations of"}, "D": {"pos": "n. phr.", "en": "natural similarities or close connections with something", "zh": "與……的相似性；親緣關係", "word": "affinities with"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: similarities with.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Although the two legal systems arose <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>, historians note several _______ them, particularly in rules governing contracts and inheritance.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Although the two legal systems arose independently, historians note several _______ them, particularly in rules governing contracts and inheritance.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。雖然這兩種法律制度是各自獨立形成的，歷史學家指出它們之間有幾處 _______，特別是在規範契約與繼承的規則上。", "opts": {"A": "complaints about", "B": "predictions about", "C": "parallels between", "D": "barriers between"}, "optsZh": {"A": "complaints about（對……的抱怨）", "B": "predictions about（對……的預測）", "C": "parallels between（……之間的相似之處）", "D": "barriers between（……之間的障礙）"}, "answer": "C", "expl": "Parallels between means similarities.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "statements that something is wrong or unsatisfactory", "zh": "對……的抱怨", "word": "complaints about"}, "B": {"pos": "n. phr.", "en": "statements about what will happen in the future", "zh": "對……的預測", "word": "predictions about"}, "C": {"pos": "n. phr.", "en": "similarities between two things", "zh": "……之間的相似之處", "word": "parallels between"}, "D": {"pos": "n. phr.", "en": "things that separate or block contact between two groups", "zh": "……之間的障礙", "word": "barriers between"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: overtly signaled politics.", "vocab": true, "body": "In editor Lisa Yaszek&#x27;s introduction to her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=anthology\" target=\"_blank\" rel=\"noopener\" data-w=\"anthology\" data-pos=\"n.\" data-en=\"a book that collects writings by different authors\" data-zh=\"選集；文集\">anthology<\/a> The Future Is Female! More Classic Science Fiction Stories by Women, Yaszek identifies an increasing sense of _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=feminist\" target=\"_blank\" rel=\"noopener\" data-w=\"feminist\" data-pos=\"adj.\" data-en=\"supporting equal rights and opportunities for women\" data-zh=\"女性主義的\">feminist<\/a> mode of writing in the 1970s, in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contrast\" target=\"_blank\" rel=\"noopener\" data-w=\"contrast\" data-pos=\"v.\" data-en=\"to compare in order to show differences\" data-zh=\"對比；對照\">contrast<\/a> to many woman-authored science fiction stories of the 1920s to 1960s whose politics were less <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> signaled.", "bodyPlain": "In editor Lisa Yaszek's introduction to her anthology The Future Is Female! More Classic Science Fiction Stories by Women, Yaszek identifies an increasing sense of _______ feminist mode of writing in the 1970s, in contrast to many woman-authored science fiction stories of the 1920s to 1960s whose politics were less deliberately signaled.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "在編輯 Lisa Yaszek 為她的選集《The Future Is Female!More Classic Science Fiction Stories by Women》所寫的導言中，Yaszek 指出 1970 年代逐漸出現一種 _______ 女性主義寫作模式的趨勢，這與 1920 至 1960 年代許多女性作者的科幻故事形成對比，那些故事的政治立場較少刻意表明。", "opts": {"A": "a prudently", "B": "an overtly", "C": "a cordially", "D": "an inadvertently"}, "optsZh": {"A": "a prudently（謹慎地）", "B": "an overtly（公開地；明顯地）", "C": "a cordially（親切地）", "D": "an inadvertently（無意地）"}, "answer": "B", "expl": "The 1970s writing is contrasted with earlier stories whose politics were 'less deliberately signaled,' so the 1970s mode is 'an overtly' (openly) feminist one.", "explZh": "1970 年代的作品與早期「政治立場較少刻意表明」的故事形成對比，所以 1970 年代的寫作是「an overtly」（公開地、明確地）女性主義的。", "defs": {"A": {"w": "prudently", "pos": "adv.", "en": "in a careful and sensible way that avoids risk", "zh": "謹慎地；審慎地", "word": "prudently"}, "B": {"w": "overtly", "pos": "adv.", "en": "in an open and obvious way, not hidden", "zh": "公開地；明顯地", "word": "overtly"}, "C": {"w": "cordially", "pos": "adv.", "en": "in a warm and friendly way", "zh": "親切地；熱誠地", "word": "cordially"}, "D": {"w": "inadvertently", "pos": "adv.", "en": "without meaning to; by accident", "zh": "無意地；不經意地", "word": "inadvertently"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: overtly signaled politics.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The senator&#x27;s speech marked a shift from cautious hints to _______ criticism of the policy: instead of implying <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disagreement\" target=\"_blank\" rel=\"noopener\" data-w=\"disagreement\" data-pos=\"n.\" data-en=\"a situation in which people have different opinions\" data-zh=\"分歧；意見不合\">disagreement<\/a>, she directly called the measure unjust and ineffective.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The senator's speech marked a shift from cautious hints to _______ criticism of the policy: instead of implying disagreement, she directly called the measure unjust and ineffective.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位參議員的演說標誌著從謹慎的暗示轉向對該政策 _______ 批評：她不再只是暗示反對，而是直接稱這項措施不公正且無效。", "opts": {"A": "an accidental", "B": "a cordial", "C": "an overt", "D": "a tentative"}, "optsZh": {"A": "an accidental（意外的）", "B": "a cordial（親切的）", "C": "an overt（公開的；明顯的）", "D": "a tentative（試探性的）"}, "answer": "C", "expl": "The criticism is open and direct.", "explZh": "", "defs": {"A": {"w": "accidental", "pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "B": {"w": "cordial", "pos": "adj.", "en": "warm and friendly", "zh": "親切的；友好的", "word": "cordial"}, "C": {"w": "overt", "pos": "adj.", "en": "done openly and not hidden", "zh": "公開的；明顯的", "word": "overt"}, "D": {"w": "tentative", "pos": "adj.", "en": "not certain or confident; done as a trial", "zh": "試探性的；不確定的", "word": "tentative"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: overtly signaled politics.", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Earlier murals encoded political messages through symbols, but the artist&#x27;s later posters adopted _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activist\" target=\"_blank\" rel=\"noopener\" data-w=\"activist\" data-pos=\"n.\" data-en=\"a person who works for social or political change\" data-zh=\"社運人士；運動者\">activist<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a>, naming the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaign<\/a> and urging viewers to join it.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Earlier murals encoded political messages through symbols, but the artist's later posters adopted _______ activist language, naming the campaign and urging viewers to join it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。早期的壁畫透過符號隱含政治訊息，但這位藝術家後來的海報則採用了 _______ 社運語言，直接點名該運動並呼籲觀眾加入。", "opts": {"A": "a reluctantly", "B": "an explicitly", "C": "an inadvertently", "D": "a privately"}, "optsZh": {"A": "a reluctantly（不情願地）", "B": "an explicitly（明確地）", "C": "an inadvertently（無意地）", "D": "a privately（私下地）"}, "answer": "B", "expl": "Explicitly means openly and directly.", "explZh": "", "defs": {"A": {"w": "reluctantly", "pos": "adv.", "en": "in an unwilling or hesitant way", "zh": "不情願地；勉強地", "word": "reluctantly"}, "B": {"w": "explicitly", "pos": "adv.", "en": "in a clear and direct way, leaving no doubt", "zh": "明確地；直截了當地", "word": "explicitly"}, "C": {"w": "inadvertently", "pos": "adv.", "en": "without meaning to; by accident", "zh": "無意地；不經意地", "word": "inadvertently"}, "D": {"w": "privately", "pos": "adv.", "en": "in a way that is not shared with the public", "zh": "私下地；不公開地", "word": "privately"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: overtly signaled politics.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or conclusion is warranted. The essay does not merely suggest its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> commitments; it states them in _______ terms, repeatedly arguing that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> must guide public policy.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The essay does not merely suggest its environmental commitments; it states them in _______ terms, repeatedly arguing that conservation must guide public policy.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這篇文章並不只是暗示它的環保立場；它以 _______ 措辭陳述這些立場，一再主張保育必須引導公共政策。", "opts": {"A": "unmistakable", "B": "improvised", "C": "decorative", "D": "ambiguous"}, "optsZh": {"A": "unmistakable（明白無誤的）", "B": "improvised（即興的）", "C": "decorative（裝飾性的）", "D": "ambiguous（模稜兩可的）"}, "answer": "A", "expl": "Unmistakable means impossible to miss.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "so clear that it cannot be confused with anything else", "zh": "明白無誤的；不會弄錯的", "word": "unmistakable"}, "B": {"pos": "adj.", "en": "made or done without planning, using what is available", "zh": "即興的；臨時拼湊的", "word": "improvised"}, "C": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的", "word": "decorative"}, "D": {"pos": "adj.", "en": "having more than one possible meaning; unclear", "zh": "模稜兩可的；含糊的", "word": "ambiguous"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: overtly signaled politics.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. In contrast to the novelist&#x27;s early work, whose social commentary was subtle, the later trilogy is _______ political, with characters debating labor rights on nearly every page.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. In contrast to the novelist's early work, whose social commentary was subtle, the later trilogy is _______ political, with characters debating labor rights on nearly every page.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。與這位小說家早期社會評論含蓄的作品不同，後來的三部曲 _______ 具有政治性，角色們幾乎每一頁都在辯論勞工權益。", "opts": {"A": "incidentally", "B": "accidentally", "C": "openly", "D": "mildly"}, "optsZh": {"A": "incidentally（附帶地）", "B": "accidentally（意外地）", "C": "openly（公開地）", "D": "mildly（溫和地）"}, "answer": "C", "expl": "Openly matches overtly.", "explZh": "", "defs": {"A": {"pos": "adv.", "en": "as a minor point; by chance", "zh": "附帶地；順便地", "word": "incidentally"}, "B": {"pos": "adv.", "en": "by chance; without intending to", "zh": "意外地；不小心地", "word": "accidentally"}, "C": {"pos": "adv.", "en": "in a way that is not hidden or secret", "zh": "公開地；坦率地", "word": "openly"}, "D": {"pos": "adv.", "en": "slightly; in a gentle way", "zh": "溫和地；稍微地", "word": "mildly"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: overtly signaled politics.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The director&#x27;s first films hid their feminist themes in genre conventions, whereas her recent documentaries make those commitments _______ through interviews, archival footage, and narration.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The director's first films hid their feminist themes in genre conventions, whereas her recent documentaries make those commitments _______ through interviews, archival footage, and narration.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位導演的早期電影把女性主義主題隱藏在類型片的慣例之中，而她近期的紀錄片則透過訪談、檔案影像和旁白，使這些立場變得 _______。", "opts": {"A": "unplanned", "B": "courteous", "C": "irrelevant", "D": "plain"}, "optsZh": {"A": "unplanned（非計畫中的）", "B": "courteous（有禮貌的）", "C": "irrelevant（無關的）", "D": "plain（明白的；直白的）"}, "answer": "D", "expl": "Plain means clearly expressed.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not arranged or intended beforehand", "zh": "非計畫中的；意外的", "word": "unplanned"}, "B": {"pos": "adj.", "en": "polite and showing respect", "zh": "有禮貌的；謙恭的", "word": "courteous"}, "C": {"pos": "adj.", "en": "not connected with or important to the matter", "zh": "無關的；不相干的", "word": "irrelevant"}, "D": {"pos": "adj.", "en": "clear, simple, and easy to understand", "zh": "明白的；直白的", "word": "plain"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: redressing an imbalance.", "vocab": true, "body": "_______ the long-standing trend of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overemphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"overemphasize\" data-pos=\"v.\" data-en=\"to give something more importance than it deserves\" data-zh=\"過度強調\">overemphasizing<\/a> teenagers and young adults in research on social media use, scholars have recently begun to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expand\" target=\"_blank\" rel=\"noopener\" data-w=\"expand\" data-pos=\"v.\" data-en=\"to become or make larger\" data-zh=\"擴展\">expand<\/a> their focus to include the fastest-growing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cohort\" target=\"_blank\" rel=\"noopener\" data-w=\"cohort\" data-pos=\"n.\" data-en=\"a group of people who share a characteristic, such as age\" data-zh=\"（具共同特徵的）一群人；世代族群\">cohort<\/a> of social media users: senior <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=citizen\" target=\"_blank\" rel=\"noopener\" data-w=\"citizen\" data-pos=\"n.\" data-en=\"a legal member of a country or nation\" data-zh=\"公民\">citizens<\/a>.", "bodyPlain": "_______ the long-standing trend of overemphasizing teenagers and young adults in research on social media use, scholars have recently begun to expand their focus to include the fastest-growing cohort of social media users: senior citizens.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "_______ 長久以來研究社群媒體使用時過度著重青少年和年輕成人的趨勢，學者們最近開始擴大研究焦點，納入社群媒體使用者中成長最快的族群：銀髮族。", "opts": {"A": "Exacerbating", "B": "Redressing", "C": "Epitomizing", "D": "Precluding"}, "optsZh": {"A": "Exacerbating（使惡化；加劇）", "B": "Redressing（矯正；補救）", "C": "Epitomizing（作為……的典型）", "D": "Precluding（阻止；排除）"}, "answer": "B", "expl": "By studying senior citizens, scholars are correcting the long-standing overemphasis on young people, so they are 'redressing' (correcting) the trend.", "explZh": "學者們把研究對象擴大到銀髮族，是在矯正長期過度著重年輕人的偏差，所以用「Redressing」（矯正、補救）。", "defs": {"A": {"w": "exacerbating", "pos": "v.", "en": "making a problem or bad situation worse", "zh": "使惡化；加劇", "word": "exacerbating"}, "B": {"w": "redressing", "pos": "v.", "en": "correcting something that is wrong or unfair", "zh": "矯正；補救", "word": "redressing"}, "C": {"w": "epitomizing", "pos": "v.", "en": "being a perfect example of something", "zh": "作為……的典型；集中體現", "word": "epitomizing"}, "D": {"w": "precluding", "pos": "v.", "en": "preventing something from happening", "zh": "阻止；排除（可能性）", "word": "precluding"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: redressing an imbalance.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. _______ decades of research that had focused almost exclusively on large mammals, ecologists have begun studying insects and soil organisms to obtain a fuller picture of forest recovery.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. _______ decades of research that had focused almost exclusively on large mammals, ecologists have begun studying insects and soil organisms to obtain a fuller picture of forest recovery.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。_______ 數十年來幾乎只關注大型哺乳動物的研究，生態學家已開始研究昆蟲和土壤生物，以更完整地了解森林的復原。", "opts": {"A": "Preventing", "B": "Representing", "C": "Counteracting", "D": "Intensifying"}, "optsZh": {"A": "Preventing（防止）", "B": "Representing（代表；象徵）", "C": "Counteracting（抵消；對抗）", "D": "Intensifying（加強；使加劇）"}, "answer": "C", "expl": "The new work corrects an old imbalance.", "explZh": "", "defs": {"A": {"w": "preventing", "pos": "v.", "en": "stopping something from happening", "zh": "防止；預防", "word": "preventing"}, "B": {"w": "representing", "pos": "v.", "en": "standing for or being a typical example of something", "zh": "代表；象徵", "word": "representing"}, "C": {"w": "counteracting", "pos": "v.", "en": "acting against something to reduce its effect", "zh": "抵消；對抗", "word": "counteracting"}, "D": {"w": "intensifying", "pos": "v.", "en": "making something stronger or more extreme", "zh": "加強；使加劇", "word": "intensifying"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: redressing an imbalance.", "vocab": true, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. By collecting oral histories from factory workers as well as managers, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> is _______ an earlier bias in archives that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserved<\/a> executives&#x27; views far more often than laborers&#x27; experiences.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. By collecting oral histories from factory workers as well as managers, the historian is _______ an earlier bias in archives that preserved executives' views far more often than laborers' experiences.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。藉由收集工廠工人與管理者的口述歷史，這位歷史學家正在 _______ 早期檔案中的偏差——那些檔案保存高階主管觀點的頻率遠高於勞工的經驗。", "opts": {"A": "embodying", "B": "exacerbating", "C": "excluding", "D": "correcting"}, "optsZh": {"A": "embodying（體現）", "B": "exacerbating（使惡化）", "C": "excluding（排除）", "D": "correcting（修正；糾正）"}, "answer": "D", "expl": "Correcting means redressing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "being a clear expression or example of an idea", "zh": "體現；具體表現", "word": "embodying"}, "B": {"pos": "v.", "en": "making a problem or bad situation worse", "zh": "使惡化；加劇", "word": "exacerbating"}, "C": {"pos": "v.", "en": "leaving out; not including", "zh": "排除；不包括", "word": "excluding"}, "D": {"pos": "v.", "en": "making something right or accurate", "zh": "修正；糾正", "word": "correcting"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: redressing an imbalance.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The museum&#x27;s decision to acquire more works by women artists is intended to _______ a long-standing imbalance in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> dominated by male painters.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The museum's decision to acquire more works by women artists is intended to _______ a long-standing imbalance in a collection dominated by male painters.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這家博物館決定收藏更多女性藝術家的作品，目的是 _______ 一個以男性畫家為主的館藏中長期存在的失衡。", "opts": {"A": "illustrate", "B": "remedy", "C": "worsen", "D": "foreclose"}, "optsZh": {"A": "illustrate（說明；例證）", "B": "remedy（補救；糾正）", "C": "worsen（使惡化）", "D": "foreclose（排除；阻止）"}, "answer": "B", "expl": "Remedy means fix or redress.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to show or explain something by giving examples", "zh": "說明；例證", "word": "illustrate"}, "B": {"pos": "v.", "en": "to correct or improve a bad situation", "zh": "補救；糾正", "word": "remedy"}, "C": {"pos": "v.", "en": "to make or become worse", "zh": "使惡化", "word": "worsen"}, "D": {"pos": "v.", "en": "to rule out or prevent a possibility", "zh": "排除（可能性）；阻止", "word": "foreclose"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: redressing an imbalance.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The new survey includes rural households that previous studies omitted, thereby _______ a sampling problem that had made earlier <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a> less representative.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The new survey includes rural households that previous studies omitted, thereby _______ a sampling problem that had made earlier conclusions less representative.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。新的調查納入了先前研究遺漏的農村家庭，從而 _______ 一個使早期結論較不具代表性的抽樣問題。", "opts": {"A": "symbolizing", "B": "imitating", "C": "addressing", "D": "magnifying"}, "optsZh": {"A": "symbolizing（象徵）", "B": "imitating（模仿）", "C": "addressing（處理；解決）", "D": "magnifying（放大；誇大）"}, "answer": "C", "expl": "Addressing means dealing with a problem.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "representing an idea through a sign or image", "zh": "象徵", "word": "symbolizing"}, "B": {"pos": "v.", "en": "copying the way something looks or acts", "zh": "模仿", "word": "imitating"}, "C": {"pos": "v.", "en": "dealing with or trying to solve a problem", "zh": "處理；解決（問題）", "word": "addressing"}, "D": {"pos": "v.", "en": "making something seem bigger or more important", "zh": "放大；誇大", "word": "magnifying"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: redressing an imbalance.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. To _______ the underrepresentation of older adults in clinical trials, the research team redesigned its recruitment process and partnered with community health centers.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. To _______ the underrepresentation of older adults in clinical trials, the research team redesigned its recruitment process and partnered with community health centers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。為了 _______ 臨床試驗中高齡者代表性不足的問題，研究團隊重新設計了招募流程，並與社區健康中心合作。", "opts": {"A": "redress", "B": "prohibit", "C": "typify", "D": "heighten"}, "optsZh": {"A": "redress（矯正；補救）", "B": "prohibit（禁止）", "C": "typify（作為……的典型）", "D": "heighten（加強）"}, "answer": "A", "expl": "Redress means remedy an unfair or faulty situation.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to correct something that is wrong or unfair", "zh": "矯正；補救", "word": "redress"}, "B": {"pos": "v.", "en": "to officially forbid something", "zh": "禁止", "word": "prohibit"}, "C": {"pos": "v.", "en": "to be a typical example of something", "zh": "作為……的典型", "word": "typify"}, "D": {"pos": "v.", "en": "to make something stronger or greater", "zh": "提高；加強", "word": "heighten"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: disputing as resisting passage.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from James Baldwin&#x27;s 1956 novel Giovanni&#x27;s Room. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> is riding in a taxi down a street lined with food vendors and shoppers in Paris, France.<br><br>The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=multitude\" target=\"_blank\" rel=\"noopener\" data-w=\"multitude\" data-pos=\"n.\" data-en=\"a very large number of people or things\" data-zh=\"眾多；人群\">multitude<\/a> of Paris seems to be dressed in blue every day but Sunday, when, for the most part, they put on an unbelievably <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=festive\" target=\"_blank\" rel=\"noopener\" data-w=\"festive\" data-pos=\"adj.\" data-en=\"bright and cheerful in a way suited to a celebration\" data-zh=\"節慶的；歡樂的\">festive<\/a> black. Here they were now, in blue, disputing, every inch, our passage, with their wagons, handtrucks, their bursting baskets carried at an angle steeply self-confident on the back.", "bodyPlain": "The following text is adapted from James Baldwin's 1956 novel Giovanni's Room. The narrator is riding in a taxi down a street lined with food vendors and shoppers in Paris, France.\n\nThe multitude of Paris seems to be dressed in blue every day but Sunday, when, for the most part, they put on an unbelievably festive black. Here they were now, in blue, disputing, every inch, our passage, with their wagons, handtrucks, their bursting baskets carried at an angle steeply self-confident on the back.", "stem": "As used in the text, what does the word \"disputing\" most nearly mean?", "stemZh": "在文中，「disputing」一詞的意思最接近什麼？", "bodyZh": "以下文字改寫自 James Baldwin 1956 年的小說《Giovanni's Room》。敘述者正搭乘計程車，行經法國巴黎一條滿是食物攤販和購物人潮的街道。\n巴黎的人群似乎除了星期天以外每天都穿著藍色，而到了星期天，他們大多換上一身令人難以置信的節慶黑色。此刻他們就在這裡，穿著藍衣，用他們的推車、手推車，以及斜斜地、極其自信地揹在背上的滿溢籃子，寸寸爭奪著我們的通行。", "opts": {"A": "Arguing about", "B": "Disapproving of", "C": "Asserting possession of", "D": "Providing resistance to"}, "optsZh": {"A": "Arguing about（為……爭論）", "B": "Disapproving of（不贊成）", "C": "Asserting possession of（聲稱擁有）", "D": "Providing resistance to（對……形成阻礙）"}, "answer": "D", "expl": "The crowd with wagons and baskets blocks the taxi inch by inch, so 'disputing' means 'providing resistance to' its passage.", "explZh": "人群帶著推車和籃子寸步不讓地擋住計程車，所以 disputing 在此指「Providing resistance to」（對……形成阻礙）。", "defs": {"A": {"w": "arguing about", "pos": "phr. v.", "en": "disagreeing with someone in words about something", "zh": "爭論；為……爭吵", "word": "arguing about"}, "B": {"w": "disapproving of", "pos": "phr. v.", "en": "having a negative opinion of something", "zh": "不贊成；反對", "word": "disapproving of"}, "C": {"w": "asserting possession of", "pos": "v. phr.", "en": "firmly claiming that something belongs to you", "zh": "聲稱擁有；主張所有權", "word": "asserting possession of"}, "D": {"w": "providing resistance to", "pos": "v. phr.", "en": "acting against something so that it cannot move or progress easily", "zh": "對……形成阻礙；抵抗", "word": "providing resistance to"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: disputing as resisting passage.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The parade&#x27;s route was so crowded that vendors and spectators seemed to be _______ every meter of the dancers&#x27; progress, forcing the procession to slow repeatedly.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The parade's route was so crowded that vendors and spectators seemed to be _______ every meter of the dancers' progress, forcing the procession to slow repeatedly.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。遊行路線擁擠到攤販和觀眾似乎在 _______ 舞者每前進一公尺的路，迫使隊伍一再放慢腳步。", "opts": {"A": "describing", "B": "blocking", "C": "owning", "D": "approving"}, "optsZh": {"A": "describing（描述）", "B": "blocking（阻擋）", "C": "owning（擁有）", "D": "approving（贊同）"}, "answer": "B", "expl": "The context means resisting passage.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "telling what something is like", "zh": "描述", "word": "describing"}, "B": {"pos": "v.", "en": "getting in the way so t
