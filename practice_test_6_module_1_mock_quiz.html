hat something cannot pass", "zh": "阻擋；擋住", "word": "blocking"}, "C": {"pos": "v.", "en": "having something as your property", "zh": "擁有", "word": "owning"}, "D": {"pos": "v.", "en": "having a positive opinion of something", "zh": "贊同；認可", "word": "approving"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: disputing as resisting passage.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. As the hikers moved through the market street, carts and delivery bicycles _______ their path, leaving them to squeeze sideways between crates.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. As the hikers moved through the market street, carts and delivery bicycles _______ their path, leaving them to squeeze sideways between crates.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。當健行者穿過市集街道時，推車和送貨腳踏車 _______ 他們的路，讓他們只能側身從板條箱之間擠過去。", "opts": {"A": "obstructed", "B": "claimed", "C": "discussed", "D": "endorsed"}, "optsZh": {"A": "obstructed（阻擋）", "B": "claimed（聲稱）", "C": "discussed（討論）", "D": "endorsed（支持；認可）"}, "answer": "A", "expl": "Obstructed means provided resistance to movement.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "blocked a path or made movement difficult", "zh": "阻擋；阻礙", "word": "obstructed"}, "B": {"pos": "v.", "en": "said that something was true or belonged to you", "zh": "聲稱；宣稱擁有", "word": "claimed"}, "C": {"pos": "v.", "en": "talked about something", "zh": "討論", "word": "discussed"}, "D": {"pos": "v.", "en": "publicly supported or approved", "zh": "支持；認可", "word": "endorsed"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: disputing as resisting passage.", "vocab": true, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The river did not merely curve around the fallen trees; its current seemed to be _______ them, breaking into noisy eddies before forcing a narrow channel through the branches.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The river did not merely curve around the fallen trees; its current seemed to be _______ them, breaking into noisy eddies before forcing a narrow channel through the branches.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。河水不只是繞過倒下的樹木；它的水流似乎在 _______ 這些樹，激起嘈雜的漩渦，然後才從枝幹間強行沖出一條窄窄的水道。", "opts": {"A": "explaining", "B": "admiring", "C": "contesting", "D": "summarizing"}, "optsZh": {"A": "explaining（解釋）", "B": "admiring（欣賞）", "C": "contesting（爭奪；抗爭）", "D": "summarizing（總結）"}, "answer": "C", "expl": "Contesting can mean resisting or struggling against.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "making something clear or easy to understand", "zh": "解釋", "word": "explaining"}, "B": {"pos": "v.", "en": "looking at something with pleasure or respect", "zh": "欣賞；讚賞", "word": "admiring"}, "C": {"pos": "v.", "en": "fighting or competing for something; resisting", "zh": "爭奪；抗爭", "word": "contesting"}, "D": {"pos": "v.", "en": "giving a short version of the main points", "zh": "總結；概述", "word": "summarizing"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: disputing as resisting passage.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The old gate, warped by years of rain, _______ our entrance until two people pushed together and made it swing inward.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The old gate, warped by years of rain, _______ our entrance until two people pushed together and made it swing inward.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。那扇被多年雨水弄得變形的老門 _______ 我們進入，直到兩個人一起推，門才向內打開。", "opts": {"A": "praised", "B": "owned", "C": "resisted", "D": "announced"}, "optsZh": {"A": "praised（稱讚）", "B": "owned（擁有）", "C": "resisted（抵抗；阻擋）", "D": "announced（宣布）"}, "answer": "C", "expl": "Resisted matches the meaning in context.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "expressed approval or admiration", "zh": "稱讚", "word": "praised"}, "B": {"pos": "v.", "en": "had something as your property", "zh": "擁有", "word": "owned"}, "C": {"pos": "v.", "en": "acted against something; did not let it move easily", "zh": "抵抗；阻擋", "word": "resisted"}, "D": {"pos": "v.", "en": "told people something officially", "zh": "宣布", "word": "announced"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: disputing as resisting passage.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. During the evening rush, taxis, cyclists, and pedestrians _______ the bus&#x27;s advance so thoroughly that a five-minute trip took nearly half an hour.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. During the evening rush, taxis, cyclists, and pedestrians _______ the bus's advance so thoroughly that a five-minute trip took nearly half an hour.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。在傍晚尖峰時段，計程車、自行車騎士和行人嚴重 _______ 公車的前進，使得五分鐘的路程花了將近半小時。", "opts": {"A": "celebrated", "B": "debated", "C": "possessed", "D": "impeded"}, "optsZh": {"A": "celebrated（慶祝；頌揚）", "B": "debated（辯論）", "C": "possessed（擁有）", "D": "impeded（阻礙）"}, "answer": "D", "expl": "Impeded means slowed or blocked.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "showed happiness about an event; praised publicly", "zh": "慶祝；頌揚", "word": "celebrated"}, "B": {"pos": "v.", "en": "discussed different opinions formally", "zh": "辯論；討論", "word": "debated"}, "C": {"pos": "v.", "en": "owned or had something", "zh": "擁有", "word": "possessed"}, "D": {"pos": "v.", "en": "slowed down or blocked progress", "zh": "阻礙；妨礙", "word": "impeded"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: inconsequential to contemporaries.", "vocab": true, "body": "While recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholarship\" target=\"_blank\" rel=\"noopener\" data-w=\"scholarship\" data-pos=\"n.\" data-en=\"serious academic study and research\" data-zh=\"學術研究\">scholarship<\/a> has <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=undermine\" target=\"_blank\" rel=\"noopener\" data-w=\"undermine\" data-pos=\"v.\" data-en=\"to gradually weaken or damage something\" data-zh=\"削弱；暗中破壞\">undermined<\/a> claims that the works of twelfth-century Islamic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=philosopher\" target=\"_blank\" rel=\"noopener\" data-w=\"philosopher\" data-pos=\"n.\" data-en=\"a person who studies ideas about knowledge, truth, and life\" data-zh=\"哲學家\">philosopher<\/a> Ibn Rushd were _______ other Muslim philosophers of his time, it is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=indisputable\" target=\"_blank\" rel=\"noopener\" data-w=\"indisputable\" data-pos=\"adj.\" data-en=\"so clearly true that no one can argue against it\" data-zh=\"無可爭辯的\">indisputable<\/a> that his location in the Muslim-ruled area of what is now Spain meant that his works were primarily available thousands of miles west of the era&#x27;s center of Islamic thought.", "bodyPlain": "While recent scholarship has undermined claims that the works of twelfth-century Islamic philosopher Ibn Rushd were _______ other Muslim philosophers of his time, it is indisputable that his location in the Muslim-ruled area of what is now Spain meant that his works were primarily available thousands of miles west of the era's center of Islamic thought.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "雖然近來的學術研究已削弱了「十二世紀伊斯蘭哲學家 Ibn Rushd 的著作 _______ 同時代其他穆斯林哲學家」的說法，但無可爭議的是，他身處今日西班牙一帶的穆斯林統治地區，這意味著他的著作主要流通於距離當時伊斯蘭思想中心以西數千英里之處。", "opts": {"A": "controversial among", "B": "antagonistic toward", "C": "imitated by", "D": "inconsequential to"}, "optsZh": {"A": "controversial among（在……之間引起爭議的）", "B": "antagonistic toward（對……懷有敵意的）", "C": "imitated by（被……模仿）", "D": "inconsequential to（對……無足輕重的）"}, "answer": "D", "expl": "The scholarship 'undermined' a claim; the contrast with his works being far from the center of Islamic thought suggests the undermined claim was that his works didn't matter to his contemporaries, i.e., were 'inconsequential to' them.", "explZh": "近來研究「削弱」了某個說法；後半句強調他的著作遠離伊斯蘭思想中心，可見被削弱的說法是他的著作對同時代學者「無足輕重」，所以選「inconsequential to」。", "defs": {"A": {"pos": "adj. phr.", "en": "causing strong disagreement among a group", "zh": "在……之間引起爭議的", "word": "controversial among"}, "B": {"pos": "adj. phr.", "en": "showing strong opposition or hostility toward", "zh": "對……懷有敵意的", "word": "antagonistic toward"}, "C": {"pos": "v. phr.", "en": "copied by someone else", "zh": "被……模仿", "word": "imitated by"}, "D": {"pos": "adj. phr.", "en": "not important or having little effect for someone", "zh": "對……無足輕重的", "word": "inconsequential to"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: inconsequential to contemporaries.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Although later readers admired the poet, evidence suggests that his work was largely _______ critics of his own generation, who rarely reviewed it and almost never cited it.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Although later readers admired the poet, evidence suggests that his work was largely _______ critics of his own generation, who rarely reviewed it and almost never cited it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。雖然後來的讀者很欣賞這位詩人，但證據顯示他的作品在很大程度上 _______ 同一代的評論家，他們很少評論它，也幾乎從未引用它。", "opts": {"A": "copied by", "B": "hostile toward", "C": "famous among", "D": "irrelevant to"}, "optsZh": {"A": "copied by（被……抄襲、模仿）", "B": "hostile toward（對……懷有敵意的）", "C": "famous among（在……之間很有名的）", "D": "irrelevant to（與……無關的）"}, "answer": "D", "expl": "The context calls for lacking importance to contemporaries.", "explZh": "", "defs": {"A": {"pos": "v. phr.", "en": "reproduced or imitated by someone", "zh": "被……抄襲、模仿", "word": "copied by"}, "B": {"pos": "adj. phr.", "en": "unfriendly and opposed toward", "zh": "對……懷有敵意的", "word": "hostile toward"}, "C": {"pos": "adj. phr.", "en": "well known to a group of people", "zh": "在……之間很有名的", "word": "famous among"}, "D": {"pos": "adj. phr.", "en": "not connected with or important to", "zh": "與……無關的；對……不重要的", "word": "irrelevant to"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: inconsequential to contemporaries.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The composer&#x27;s notebooks show that, contrary to earlier claims, her experiments were not _______ other musicians in the city; several performers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discussed\" target=\"_blank\" rel=\"noopener\" data-w=\"discussed\" data-pos=\"v.\" data-en=\"talked about something\" data-zh=\"討論\">discussed<\/a> them in letters.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The composer's notebooks show that, contrary to earlier claims, her experiments were not _______ other musicians in the city; several performers discussed them in letters.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這位作曲家的筆記本顯示，與先前的說法相反，她的實驗並非 _______ 城裡的其他音樂家；好幾位演奏者都在信中討論過這些實驗。", "opts": {"A": "unimportant to", "B": "opposed to", "C": "imitated by", "D": "praised by"}, "optsZh": {"A": "unimportant to（對……不重要的）", "B": "opposed to（反對……的）", "C": "imitated by（被……模仿）", "D": "praised by（受到……讚揚）"}, "answer": "A", "expl": "The sentence rejects the idea that the work did not matter to others.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "not mattering to someone", "zh": "對……不重要的", "word": "unimportant to"}, "B": {"pos": "adj. phr.", "en": "disagreeing with or against something", "zh": "反對……的", "word": "opposed to"}, "C": {"pos": "v. phr.", "en": "copied by someone else", "zh": "被……模仿", "word": "imitated by"}, "D": {"pos": "v. phr.", "en": "spoken of with approval by someone", "zh": "受到……讚揚", "word": "praised by"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: inconsequential to contemporaries.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. New evidence undermines the view that the reformer&#x27;s pamphlets were _______ local politics, since council minutes show that officials debated them repeatedly.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. New evidence undermines the view that the reformer's pamphlets were _______ local politics, since council minutes show that officials debated them repeatedly.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。新證據削弱了「這位改革者的小冊子 _______ 地方政治」的看法，因為議會紀錄顯示官員們曾多次討論這些小冊子。", "opts": {"A": "central to", "B": "directed against", "C": "inconsequential to", "D": "borrowed from"}, "optsZh": {"A": "central to（對……至關重要的）", "B": "directed against（針對……的）", "C": "inconsequential to（對……無足輕重的）", "D": "borrowed from（借自……）"}, "answer": "C", "expl": "Inconsequential to means unimportant to.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "very important to; at the center of", "zh": "對……至關重要的", "word": "central to"}, "B": {"pos": "v. phr.", "en": "aimed at opposing someone or something", "zh": "針對……的", "word": "directed against"}, "C": {"pos": "adj. phr.", "en": "not important or having little effect for someone", "zh": "對……無足輕重的", "word": "inconsequential to"}, "D": {"pos": "v. phr.", "en": "taken or adapted from another source", "zh": "借自……；取材於……", "word": "borrowed from"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: inconsequential to contemporaries.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. While the architect worked far from the capital, recent discoveries challenge the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assumption\" target=\"_blank\" rel=\"noopener\" data-w=\"assumption\" data-pos=\"n.\" data-en=\"something accepted as true without proof\" data-zh=\"假設；假定\">assumption<\/a> that her designs were _______ the era&#x27;s major builders.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. While the architect worked far from the capital, recent discoveries challenge the assumption that her designs were _______ the era's major builders.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。雖然這位建築師在遠離首都的地方工作，但近來的發現挑戰了「她的設計 _______ 當時主要建築師」的假設。", "opts": {"A": "available to", "B": "insignificant to", "C": "modeled on", "D": "celebrated by"}, "optsZh": {"A": "available to（可供……取得的）", "B": "insignificant to（對……微不足道的）", "C": "modeled on（以……為範本）", "D": "celebrated by（受到……推崇）"}, "answer": "B", "expl": "Insignificant to means not important to.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "able to be used or obtained by", "zh": "可供……取得的", "word": "available to"}, "B": {"pos": "adj. phr.", "en": "too small or unimportant to matter to someone", "zh": "對……微不足道的", "word": "insignificant to"}, "C": {"pos": "v. phr.", "en": "made using something else as an example", "zh": "以……為範本", "word": "modeled on"}, "D": {"pos": "v. phr.", "en": "praised or honored by someone", "zh": "受到……推崇", "word": "celebrated by"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: inconsequential to contemporaries.", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The archive has weakened the claim that the scientist&#x27;s early articles were _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> researchers; several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratories<\/a> evidently changed their methods after reading them.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archive has weakened the claim that the scientist's early articles were _______ contemporary researchers; several laboratories evidently changed their methods after reading them.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這批檔案削弱了「這位科學家的早期論文 _______ 同時代研究者」的說法；有幾間實驗室在讀了這些論文後顯然改變了他們的方法。", "opts": {"A": "of no consequence to", "B": "critical of", "C": "derived from", "D": "in agreement with"}, "optsZh": {"A": "of no consequence to（對……毫無重要性的）", "B": "critical of（對……持批評態度的）", "C": "derived from（源自……）", "D": "in agreement with（與……意見一致的）"}, "answer": "A", "expl": "Of no consequence to means inconsequential to.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "not important at all to someone", "zh": "對……毫無重要性的", "word": "of no consequence to"}, "B": {"pos": "adj. phr.", "en": "expressing disapproval of", "zh": "對……持批評態度的", "word": "critical of"}, "C": {"pos": "v. phr.", "en": "coming or developed from a source", "zh": "源自……", "word": "derived from"}, "D": {"pos": "adj. phr.", "en": "having the same opinion as", "zh": "與……意見一致的", "word": "in agreement with"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Text Function: elaborate on Johnson's artistic transition.", "vocab": false, "body": "On painter William H. Johnson&#x27;s return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. <u>Turning away from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscapes<\/a> painted in an expressionist style--a style that often involves using fluid, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distorted\" target=\"_blank\" rel=\"noopener\" data-w=\"distorted\" data-pos=\"adj.\" data-en=\"changed in shape so as to look unnatural or unclear\" data-zh=\"扭曲的；變形的\">distorted<\/a> shapes and thick, textured brushstrokes to express the artist&#x27;s subjective experience of reality--Johnson began painting portraits of Black Americans in a bold new way.<\/u> Evocative of African <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculpture<\/a> and American and Scandinavian folk art, these portraits feature flat, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> oversimplified figures in a vibrant but limited color palette.", "bodyPlain": "On painter William H. Johnson's return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. Turning away from landscapes painted in an expressionist style--a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist's subjective experience of reality--Johnson began painting portraits of Black Americans in a bold new way. Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句在全文中的功能？", "bodyZh": "畫家 William H. Johnson 在歐洲待了十年之後，於 1938 年回到美國，他的風格隨即經歷了一次突然的轉變。Johnson 不再畫表現主義風格的風景畫——這種風格常以流動、扭曲的形狀和厚重、有質感的筆觸來表達藝術家對現實的主觀經驗——而開始以大膽的新方式描繪美國黑人的肖像。這些肖像令人聯想到非洲雕塑以及美國與斯堪地那維亞的民間藝術，以平面、刻意簡化的人物和鮮豔但有限的色彩為特色。", "opts": {"A": "It elaborates on the previous sentence's statement about a transitional moment in Johnson's artistic career.", "B": "It provides information about Johnson's travels in support of a claim about his artistic influences, which is advanced in the following sentence.", "C": "It recounts a moment in Johnson's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.", "D": "It presents evidence that calls into question the previous sentence's characterization of Johnson's artistic development."}, "optsZh": {"A": "它進一步闡述前一句所說的 Johnson 藝術生涯中的轉折時刻。", "B": "它提供 Johnson 旅行的資訊，以支持下一句提出的關於他藝術影響來源的主張。", "C": "它敘述 Johnson 個人生活中的一個時刻，這個時刻促成了他後來事業的成功，而下一句概述了這段事業。", "D": "它提出證據，質疑前一句對 Johnson 藝術發展的描述。"}, "answer": "A", "expl": "The first sentence says Johnson's style underwent an abrupt transformation; the underlined sentence elaborates by explaining what he turned away from and what he began painting instead.", "explZh": "第一句說 Johnson 的畫風突然轉變；畫線句進一步說明他捨棄了什麼風格、又開始畫什麼，是對這個轉折時刻的詳細闡述。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Text Function: elaborate on Johnson's artistic transition.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次接近太陽時，表面都會改變。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍了解甚少。最後一句描述一項研究，測試雷達能否解決這個問題，但發現訊號無法穿透得夠深。", "opts": {"A": "It identifies the uncertainty that motivated the study.", "B": "It describes how other researchers criticized the work.", "C": "It states the study's final conclusion.", "D": "It offers evidence that radar is always reliable."}, "optsZh": {"A": "它指出促成這項研究的不確定之處。", "B": "它描述其他研究人員如何批評這項研究。", "C": "它陳述研究的最終結論。", "D": "它提供證據證明雷達總是可靠的。"}, "answer": "A", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Text Function: elaborate on Johnson's artistic transition.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一篇考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線仍然不明，因為附近的道路幾乎沒有留下任何實體痕跡。接著文章討論一個團隊在陶器中尋找化學特徵，但只得到初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It contradicts the claim made in the first sentence.", "C": "It shifts the discussion away from archaeology.", "D": "It summarizes the team's strongest result."}, "optsZh": {"A": "它界定了後續研究試圖解決的問題。", "B": "它反駁第一句提出的主張。", "C": "它使討論離開考古學。", "D": "它總結團隊最有力的研究結果。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Text Function: elaborate on Johnson's artistic transition.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eliminate\" target=\"_blank\" rel=\"noopener\" data-w=\"eliminate\" data-pos=\"v.\" data-en=\"to remove or get rid of something completely\" data-zh=\"消除；排除\">eliminated<\/a> one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句說明，科學家仍不確定是哪一種細胞機制讓它得以存活。文章其餘部分描述了一項排除其中一種可能機制的實驗。", "opts": {"A": "It gives a historical overview of plant classification.", "B": "It proves that drought has no effect on plants.", "C": "It lists the materials used in the experiment.", "D": "It introduces a gap in knowledge that the experiment examines."}, "optsZh": {"A": "它概述植物分類的歷史。", "B": "它證明乾旱對植物沒有影響。", "C": "它列出實驗中使用的材料。", "D": "它提出實驗所要探討的知識缺口。"}, "answer": "D", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Text Function: elaborate on Johnson's artistic transition.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一篇文學分析開頭指出，某部小說的結局常被描述為樂觀的。第二句指出，這種詮釋很難成立，因為最後一章包含了好幾個象徵禁錮的意象。段落其餘部分說明這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It provides biographical information about the novelist.", "B": "It raises a difficulty with a common interpretation.", "C": "It introduces an unrelated theme.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它提供小說家的生平資料。", "B": "它對一個常見的詮釋提出質疑。", "C": "它引入一個不相關的主題。", "D": "它概述這部小說的出版歷史。"}, "answer": "B", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Text Function: elaborate on Johnson's artistic transition.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。一篇科技文章首先說，自主水下載具能夠繪製海底地圖。下一句說明，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師針對這些條件測試一套新的導航系統。", "opts": {"A": "It gives a personal anecdote about engineers.", "B": "It compares underwater vehicles with aircraft.", "C": "It explains the limitation that the new system is meant to address.", "D": "It announces that the technology is already flawless."}, "optsZh": {"A": "它講述一則關於工程師的個人軼事。", "B": "它將水下載具與飛機做比較。", "C": "它說明新系統所要解決的限制。", "D": "它宣稱這項技術已經完美無缺。"}, "answer": "C", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Main Purpose: effortful preparation behind apparent ease.", "vocab": false, "body": "When classical pianist Martha Argerich performs, it appears as if the music is coming to her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spontaneously\" target=\"_blank\" rel=\"noopener\" data-w=\"spontaneously\" data-pos=\"adv.\" data-en=\"naturally and without planning\" data-zh=\"自然而然地；自發地\">spontaneously<\/a>. She&#x27;s highly skilled technically, but because of how freely she plays and her willingness to take risks, she seems relaxed and natural. Her apparent ease, however, is due to a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tremendous\" target=\"_blank\" rel=\"noopener\" data-w=\"tremendous\" data-pos=\"adj.\" data-en=\"very great in amount or degree\" data-zh=\"極大的；巨大的\">tremendous<\/a> amount of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preparation\" target=\"_blank\" rel=\"noopener\" data-w=\"preparation\" data-pos=\"n.\" data-en=\"the work done to get ready for something\" data-zh=\"準備\">preparation<\/a>. Despite Argerich&#x27;s experience and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=virtuosity\" target=\"_blank\" rel=\"noopener\" data-w=\"virtuosity\" data-pos=\"n.\" data-en=\"very great skill in music or another art\" data-zh=\"精湛技藝\">virtuosity<\/a>, she never takes for granted that she knows a piece of music. Instead, she approaches the music as if encountering it for the first time and tries to understand it anew.", "bodyPlain": "When classical pianist Martha Argerich performs, it appears as if the music is coming to her spontaneously. She's highly skilled technically, but because of how freely she plays and her willingness to take risks, she seems relaxed and natural. Her apparent ease, however, is due to a tremendous amount of preparation. Despite Argerich's experience and virtuosity, she never takes for granted that she knows a piece of music. Instead, she approaches the music as if encountering it for the first time and tries to understand it anew.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "古典鋼琴家 Martha Argerich 演奏時，音樂彷彿是自然而然地來到她身上。她的技巧非常高超，但由於她演奏時的自由奔放以及勇於冒險，她看起來輕鬆又自然。然而，她表面上的從容，其實源自大量的準備。儘管 Argerich 經驗豐富、技藝精湛，她從不認為自己理所當然地了解一首樂曲。相反地，她以彷彿第一次接觸的心態面對音樂，努力重新理解它。", "opts": {"A": "To provide details about how Argerich identifies which pieces of music she will perform", "B": "To assert that Argerich's performances look effortless because of how she prepares for them", "C": "To discuss the kinds of music Argerich feels most comfortable encountering for the first time", "D": "To describe the unique way that Argerich approaches music she hasn't performed before"}, "optsZh": {"A": "提供 Argerich 如何決定要演奏哪些曲目的細節", "B": "說明 Argerich 的演出看似毫不費力，是因為她的準備方式", "C": "討論 Argerich 第一次接觸時感到最自在的音樂類型", "D": "描述 Argerich 面對她從未演奏過的音樂時的獨特方式"}, "answer": "B", "expl": "The text says Argerich seems relaxed and spontaneous, but her apparent ease 'is due to a tremendous amount of preparation'; the main purpose is to explain that her effortless look comes from how she prepares.", "explZh": "文章說 Argerich 看起來輕鬆自然，但她的從容「源自大量的準備」；主旨是說明她的演出之所以看似毫不費力，是因為她的準備方式。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Main Purpose: effortful preparation behind apparent ease.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，一位較年輕的親戚則從花園帶著花回來。敘述流連於傍晚的光線、準備好的房間，以及一位期盼已久的訪客即將到來的種種細微跡象。", "opts": {"A": "To argue that the characters should leave the house", "B": "To portray a setting and mood as characters prepare for an arrival", "C": "To summarize a conflict between two relatives", "D": "To explain why music has lost its importance"}, "optsZh": {"A": "主張角色們應該離開這棟房子", "B": "描繪角色們為迎接某人到來而準備時的場景與氛圍", "C": "概述兩位親戚之間的衝突", "D": "解釋音樂為何失去了它的重要性"}, "answer": "B", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Main Purpose: effortful preparation behind apparent ease.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並非敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定但充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To criticize sailors for taking unnecessary risks", "C": "To list the technical features of a harbor", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "比較幾種交通方式", "B": "批評水手冒不必要的風險", "C": "列出港口的技術特徵", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Main Purpose: effortful preparation behind apparent ease.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。一段小說節選呈現了節慶大餐前擁擠的廚房。敘述者注意到擦得發亮的碗、精心排好的椅子，以及每當外面傳來腳步聲時家人們便停下動作的模樣——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To depict preparations that reveal anticipation within a family", "B": "To describe a completed celebration from beginning to end", "C": "To explain why the family dislikes visitors", "D": "To contrast rural and urban customs"}, "optsZh": {"A": "描繪一個家庭中流露出期待之情的準備工作", "B": "從頭到尾描述一場已結束的慶典", "C": "解釋這個家庭為何不喜歡訪客", "D": "對比鄉村與城市的習俗"}, "answer": "A", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Main Purpose: effortful preparation behind apparent ease.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一段回憶錄描寫一位老師在日出前打開教室的門、把筆記本擺整齊，並聆聽學生們在走廊上聚集。這段文字還沒有呈現課程本身；而是凸顯了課程開始前那些安靜的例行儀式。", "opts": {"A": "To argue that early classes should be canceled", "B": "To evaluate the quality of a school's curriculum", "C": "To recount a student's entire academic career", "D": "To describe the moments before a significant daily activity begins"}, "optsZh": {"A": "主張應取消早上的課", "B": "評估一所學校課程的品質", "C": "敘述一位學生完整的求學歷程", "D": "描述一項重要的日常活動開始前的時刻"}, "answer": "D", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Main Purpose: effortful preparation behind apparent ease.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。一段文學文字呈現雨後的花園：潮濕的小徑、明亮的樹葉，以及一張放在樹下的長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓場景感覺平靜卻又充滿期待。", "opts": {"A": "To reveal the full contents of a letter", "B": "To compare two different seasons", "C": "To establish a reflective mood before a character acts", "D": "To give instructions for maintaining a garden"}, "optsZh": {"A": "揭露一封信的全部內容", "B": "比較兩個不同的季節", "C": "在角色行動之前營造一種沉思的氛圍", "D": "提供照料花園的指示"}, "answer": "C", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Function: character trait explains Israel's thwarted ambition.", "vocab": false, "body": "The following text is adapted from Herman Melville&#x27;s 1855 novel Israel Potter. Israel is a young man wandering through New England during the late eighteenth century.<br><br>He hired himself out for three months; at the end of that time to receive for his wages two hundred acres of land lying in New Hampshire. [...] His employer proving false to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contract\" target=\"_blank\" rel=\"noopener\" data-w=\"contract\" data-pos=\"n.\" data-en=\"a formal agreement between people, often legal\" data-zh=\"契約；合約\">contract<\/a> in the matter of the land, and there being no law in the country to force him to fulfil it, Israel--<u>who, however brave-hearted, and even much of a dare-devil upon a pinch, seems nevertheless to have evinced, throughout many parts of his career, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=singular\" target=\"_blank\" rel=\"noopener\" data-w=\"singular\" data-pos=\"adj.\" data-en=\"unusual and remarkable\" data-zh=\"非凡的；獨特的\">singular<\/a> patience and mildness<\/u>--was obliged to look round for other means of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=livelihood\" target=\"_blank\" rel=\"noopener\" data-w=\"livelihood\" data-pos=\"n.\" data-en=\"the way a person earns the money needed to live\" data-zh=\"生計\">livelihood<\/a> than clearing out a farm for himself in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=wilderness\" target=\"_blank\" rel=\"noopener\" data-w=\"wilderness\" data-pos=\"n.\" data-en=\"a wild natural area where people do not live\" data-zh=\"荒野\">wilderness<\/a>.", "bodyPlain": "The following text is adapted from Herman Melville's 1855 novel Israel Potter. Israel is a young man wandering through New England during the late eighteenth century.\n\nHe hired himself out for three months; at the end of that time to receive for his wages two hundred acres of land lying in New Hampshire. [...] His employer proving false to the contract in the matter of the land, and there being no law in the country to force him to fulfil it, Israel--who, however brave-hearted, and even much of a dare-devil upon a pinch, seems nevertheless to have evinced, throughout many parts of his career, a singular patience and mildness--was obliged to look round for other means of livelihood than clearing out a farm for himself in the wilderness.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "以下文字改寫自 Herman Melville 1855 年的小說《Israel Potter》。Israel 是一位在十八世紀末漫遊於新英格蘭的年輕人。\n他受僱工作三個月；期滿時應得的工資是位於新罕布夏的兩百英畝土地。[……] 由於僱主在土地一事上違背了契約，而當地又沒有法律能強制他履約，Israel——他雖然勇敢，在緊要關頭甚至頗有膽大妄為的一面，但在其一生的許多階段似乎都展現出一種獨特的耐心與溫和——只好另謀生計，而不是在荒野中為自己開墾一座農場。", "opts": {"A": "It implies that Israel treasures a particular characteristic of his personality when that characteristic should usually be regarded as a flaw.", "B": "It suggests that if not for a certain aspect of his character, Israel might not have been as easily thwarted in his ambition to establish a farm.", "C": "It shows why Israel would not have been able to undertake the enormous amount of labor necessary to run a farm even if he had owned the necessary property.", "D": "It explains why, when the situation requires it, Israel is able to undertake courageous acts that others would generally avoid."}, "optsZh": {"A": "它暗示 Israel 珍視自己性格中的某項特質，而這項特質通常應被視為缺點。", "B": "它暗示若不是因為性格中的某一面，Israel 想建立農場的抱負或許不會那麼輕易受挫。", "C": "它說明即使 Israel 擁有必要的土地，他為何也無法承擔經營農場所需的大量勞動。", "D": "它解釋了為何在情況需要時，Israel 能做出一般人會避免的勇敢行為。"}, "answer": "B", "expl": "The underlined portion says Israel showed 'a singular patience and mildness'; this trait helps explain why he simply looked for other work instead of fighting his employer, so without it he might not have been so easily thwarted.", "explZh": "畫底線部分說 Israel 展現出「一種獨特的耐心與溫和」；這個性格說明了他為何沒有與僱主抗爭、而是另謀生計——若非這種個性，他追求擁有農場的願望或許不會那麼輕易受挫。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Function: character trait explains Israel's thwarted ambition.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\
