">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次接近太陽時，表面都會改變。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍了解甚少。最後一句描述一項研究，測試雷達能否解決這個問題，但發現訊號無法穿透得夠深。", "opts": {"A": "It describes how other researchers criticized the work.", "B": "It identifies the uncertainty that motivated the study.", "C": "It states the study's final conclusion.", "D": "It offers evidence that radar is always reliable."}, "optsZh": {"A": "它描述其他研究人員如何批評這項研究。", "B": "它指出促成這項研究的不確定之處。", "C": "它陳述研究的最終結論。", "D": "它提供證據證明雷達總是可靠的。"}, "answer": "B", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Function: character trait explains Israel's thwarted ambition.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一篇考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線仍然不明，因為附近的道路幾乎沒有留下任何實體痕跡。接著文章討論一個團隊在陶器中尋找化學特徵，但只得到初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It shifts the discussion away from archaeology.", "C": "It summarizes the team's strongest result.", "D": "It contradicts the claim made in the first sentence."}, "optsZh": {"A": "它界定了後續研究試圖解決的問題。", "B": "它使討論離開考古學。", "C": "它總結團隊最有力的研究結果。", "D": "它反駁第一句提出的主張。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Function: character trait explains Israel's thwarted ambition.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eliminate\" target=\"_blank\" rel=\"noopener\" data-w=\"eliminate\" data-pos=\"v.\" data-en=\"to remove or get rid of something completely\" data-zh=\"消除；排除\">eliminated<\/a> one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句說明，科學家仍不確定是哪一種細胞機制讓它得以存活。文章其餘部分描述了一項排除其中一種可能機制的實驗。", "opts": {"A": "It lists the materials used in the experiment.", "B": "It introduces a gap in knowledge that the experiment examines.", "C": "It gives a historical overview of plant classification.", "D": "It proves that drought has no effect on plants."}, "optsZh": {"A": "它列出實驗中使用的材料。", "B": "它提出實驗所要探討的知識缺口。", "C": "它概述植物分類的歷史。", "D": "它證明乾旱對植物沒有影響。"}, "answer": "B", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Text Function: character trait explains Israel's thwarted ambition.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一篇文學分析開頭指出，某部小說的結局常被描述為樂觀的。第二句指出，這種詮釋很難成立，因為最後一章包含了好幾個象徵禁錮的意象。段落其餘部分說明這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It introduces an unrelated theme.", "B": "It summarizes the novel's publication history.", "C": "It provides biographical information about the novelist.", "D": "It raises a difficulty with a common interpretation."}, "optsZh": {"A": "它引入一個不相關的主題。", "B": "它概述這部小說的出版歷史。", "C": "它提供小說家的生平資料。", "D": "它對一個常見的詮釋提出質疑。"}, "answer": "D", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Text Function: character trait explains Israel's thwarted ambition.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。一篇科技文章首先說，自主水下載具能夠繪製海底地圖。下一句說明，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師針對這些條件測試一套新的導航系統。", "opts": {"A": "It announces that the technology is already flawless.", "B": "It gives a personal anecdote about engineers.", "C": "It explains the limitation that the new system is meant to address.", "D": "It compares underwater vehicles with aircraft."}, "optsZh": {"A": "它宣稱這項技術已經完美無缺。", "B": "它講述一則關於工程師的個人軼事。", "C": "它說明新系統所要解決的限制。", "D": "它將水下載具與飛機做比較。"}, "answer": "C", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Paired Texts: update Nutcracker rather than reject it.", "vocab": false, "body": "Text 1<br>In 1954 George Balanchine choreographed a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a> of The Nutcracker, a ballet by Pyotr Ilyich Tchaikovsky. It has since become a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> for hundreds of dance companies in North America to stage The Nutcracker each year. <u>But the show is stuck in the past, with an old-fashioned story and references, so it should no longer be produced.<\/u> Ballet needs to create new traditions if it wants to stay <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> audiences.<br><br>Text 2<br>The Nutcracker is outdated, but it should be kept because it&#x27;s a holiday favorite and provides substantial income for some dance companies. Although it can be behind the times, there are creative ways to update the show. For example, Debbie Allen successfully modernized the story. Her show Hot Chocolate Nutcracker combines ballet, tap, hip-hop, and other styles, and it has been gaining in popularity since it opened in 2009.", "bodyPlain": "Text 1\nIn 1954 George Balanchine choreographed a production of The Nutcracker, a ballet by Pyotr Ilyich Tchaikovsky. It has since become a tradition for hundreds of dance companies in North America to stage The Nutcracker each year. But the show is stuck in the past, with an old-fashioned story and references, so it should no longer be produced. Ballet needs to create new traditions if it wants to stay relevant to contemporary audiences.\n\nText 2\nThe Nutcracker is outdated, but it should be kept because it's a holiday favorite and provides substantial income for some dance companies. Although it can be behind the times, there are creative ways to update the show. For example, Debbie Allen successfully modernized the story. Her show Hot Chocolate Nutcracker combines ballet, tap, hip-hop, and other styles, and it has been gaining in popularity since it opened in 2009.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the underlined claim in Text 1?", "stemZh": "根據兩篇文本，文本 2 的作者最可能如何回應文本 1 中畫線的主張？", "bodyZh": "文本 1\n1954 年，George Balanchine 為 Pyotr Ilyich Tchaikovsky 的芭蕾舞劇《胡桃鉗》（The Nutcracker）編舞製作。從那時起，北美數百個舞團每年上演《胡桃鉗》已成為一項傳統。但這齣劇停留在過去，故事和典故都很過時，所以不應該再上演了。芭蕾若想與當代觀眾保持關聯，就需要創造新的傳統。\n文本 2\n《胡桃鉗》雖然過時，但應該保留，因為它是深受喜愛的節日表演，並為一些舞團帶來可觀的收入。雖然它可能跟不上時代，但仍有創新的方式可以更新這齣劇。例如，Debbie Allen 就成功地將這個故事現代化。她的作品《Hot Chocolate Nutcracker》結合了芭蕾、踢踏舞、嘻哈及其他舞風，自 2009 年首演以來愈來愈受歡迎。", "opts": {"A": "By questioning the idea that the story of The Nutcracker is stuck in the past and by rejecting the suggestion that contemporary audiences would enjoy an updated version", "B": "By agreeing that contemporary audiences have largely stopped going to see performances of The Nutcracker because it's so old-fashioned", "C": "By pointing out that most dance companies could increase their incomes by offering modernized versions of The Nutcracker", "D": "By suggesting that dance companies should consider offering revised versions of The Nutcracker instead of completely rejecting the show"}, "optsZh": {"A": "質疑《胡桃鉗》的故事停留在過去的說法，並否定當代觀眾會喜歡更新版本的看法", "B": "同意當代觀眾已大多不再觀看《胡桃鉗》的演出，因為它太過時了", "C": "指出大多數舞團若推出現代化版本的《胡桃鉗》就能增加收入", "D": "建議舞團考慮推出改編版的《胡桃鉗》，而不是完全放棄這齣劇"}, "answer": "D", "expl": "Text 1 says The Nutcracker should no longer be produced; Text 2 agrees it is outdated but argues it should be kept and updated creatively, as Debbie Allen did.", "explZh": "文本 1 認為《胡桃鉗》不應再上演；文本 2 雖同意它過時，但主張應保留並以創新方式改編（如 Debbie Allen 的版本），而不是完全放棄。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Paired Texts: update Nutcracker rather than reject it.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Based on the texts, how would the author of Text 2 most likely respond?", "stemZh": "根據兩篇文本，文本 2 的作者最可能如何回應？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在上任第一個月內簽署了數項法令。」", "C": "「這位領導人在國家誕生中所扮演的象徵角色，比他施政期間短暫而不均的紀錄更為重要。」", "D": "「這個政府從一開始就面臨經濟挑戰。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Paired Texts: update Nutcracker rather than reject it.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Based on the texts, how would the author of Text 2 most likely respond?", "stemZh": "根據兩篇文本，文本 2 的作者最可能如何回應？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持一個關於區域作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "The southern region was included in the survey.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "有些農民種植蔬菜，有些則種植穀物。", "B": "女性占南部蔬菜種植者的多數，但在北部或中部的穀物種植者中則不是多數。", "C": "南部地區被納入了調查。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Paired Texts: update Nutcracker rather than reject it.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Based on the texts, how would the author of Text 2 most likely respond?", "stemZh": "根據兩篇文本，文本 2 的作者最可能如何回應？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "One rocky planet has a thin atmosphere.", "C": "The method used to study stars requires a telescope.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有一顆岩石行星的大氣層很稀薄。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "研究發現有幾顆岩石行星所含鐵的比例遠高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Paired Texts: update Nutcracker rather than reject it.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Based on the texts, how would the author of Text 2 most likely respond?", "stemZh": "根據兩篇文本，文本 2 的作者最可能如何回應？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一位民俗學者主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國度原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Some songs use a meter also found in older European poetry.", "C": "Many performers learned songs from relatives.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有好幾個國家的學者在研究這項傳統。", "B": "有些歌曲使用的韻律也見於較古老的歐洲詩歌中。", "C": "許多表演者向親戚學習歌曲。", "D": "有幾首民謠包含在地歷史事件，以及在不同社群長期接觸後才出現的融合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Paired Texts: update Nutcracker rather than reject it.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Based on the texts, how would the author of Text 2 most likely respond?", "stemZh": "根據兩篇文本，文本 2 的作者最可能如何回應？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。一張表格顯示，在某社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "Both towns had some volunteers.", "C": "The table includes more than one year.", "D": "The program took place in a community."}, "optsZh": {"A": "與沒有實施計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "兩個城鎮都有一些志工。", "C": "這張表格包含不只一個年份。", "D": "這個計畫在一個社區中進行。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Main Idea: testing Paleolithic light sources.", "vocab": false, "body": "To understand how Paleolithic artists navigated dark caves, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> Maria Angeles Medina-Alcaide and her team tested different lighting methods in a cave in Spain using replicas of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artifact\" target=\"_blank\" rel=\"noopener\" data-w=\"artifact\" data-pos=\"n.\" data-en=\"an object made by people long ago\" data-zh=\"文物；人工製品\">artifacts<\/a> found in European caves with art. They used three different Paleolithic light sources--torches, animal-fat lamps, and fireplaces--<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determining<\/a> that each likely had a specific purpose. For instance, the team learned that the animal-fat lamps were less useful than torches while walking because the lamps didn&#x27;t illuminate the cave floor.", "bodyPlain": "To understand how Paleolithic artists navigated dark caves, archaeologist Maria Angeles Medina-Alcaide and her team tested different lighting methods in a cave in Spain using replicas of artifacts found in European caves with art. They used three different Paleolithic light sources--torches, animal-fat lamps, and fireplaces--determining that each likely had a specific purpose. For instance, the team learned that the animal-fat lamps were less useful than torches while walking because the lamps didn't illuminate the cave floor.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能說明本文的主旨？", "bodyZh": "為了了解舊石器時代的藝術家如何在黑暗的洞穴中行動，考古學家 Maria Angeles Medina-Alcaide 和她的團隊在西班牙的一個洞穴裡，使用在有藝術作品的歐洲洞穴中發現的文物複製品，測試了不同的照明方式。他們使用了三種舊石器時代的光源——火把、動物脂肪燈和火堆——並判定每一種很可能都有特定的用途。例如，團隊發現動物脂肪燈在行走時不如火把實用，因為脂肪燈照不亮洞穴地面。", "opts": {"A": "Medina-Alcaide and her team's study demonstrated that fireplaces were essential to the creators of Paleolithic cave art.", "B": "Medina-Alcaide and her team discovered that Paleolithic cave artists in Spain used animal-fat lamps more often than they used torches.", "C": "Medina-Alcaide and her team were reluctant to draw many conclusions from their study because of the difficulty they had replicating light sources based on known artifacts.", "D": "Medina-Alcaide and her team tested Paleolithic light sources and learned some details about how Paleolithic artists traveled within dark caves."}, "optsZh": {"A": "Medina-Alcaide 和她的團隊的研究證明，火堆對舊石器時代洞穴藝術的創作者而言不可或缺。", "B": "Medina-Alcaide 和她的團隊發現，西班牙的舊石器時代洞穴藝術家使用動物脂肪燈的頻率高於火把。", "C": "由於難以根據已知文物複製光源，Medina-Alcaide 和她的團隊不願從研究中得出太多結論。", "D": "Medina-Alcaide 和她的團隊測試了舊石器時代的光源，並了解到一些關於舊石器時代藝術家如何在黑暗洞穴中移動的細節。"}, "answer": "D", "expl": "The team tested three Paleolithic light sources and learned details such as lamps being less useful than torches for walking—i.e., how artists moved through dark caves.", "explZh": "研究團隊測試了三種舊石器時代光源，並得知一些細節（例如行走時脂肪燈不如火把實用），也就是當時藝術家如何在黑暗洞穴中行動。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Main Idea: testing Paleolithic light sources.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，一位較年輕的親戚則從花園帶著花回來。敘述流連於傍晚的光線、準備好的房間，以及一位期盼已久的訪客即將到來的種種細微跡象。", "opts": {"A": "To argue that the characters should leave the house", "B": "To portray a setting and mood as characters prepare for an arrival", "C": "To explain why music has lost its importance", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "主張角色們應該離開這棟房子", "B": "描繪角色們為迎接某人到來而準備時的場景與氛圍", "C": "解釋音樂為何失去了它的重要性", "D": "概述兩位親戚之間的衝突"}, "answer": "B", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Main Idea: testing Paleolithic light sources.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並非敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定但充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To criticize sailors for taking unnecessary risks", "C": "To list the technical features of a harbor", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "比較幾種交通方式", "B": "批評水手冒不必要的風險", "C": "列出港口的技術特徵", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Main Idea: testing Paleolithic light sources.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。一段小說節選呈現了節慶大餐前擁擠的廚房。敘述者注意到擦得發亮的碗、精心排好的椅子，以及每當外面傳來腳步聲時家人們便停下動作的模樣——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To describe a completed celebration from beginning to end", "B": "To contrast rural and urban customs", "C": "To depict preparations that reveal anticipation within a family", "D": "To explain why the family dislikes visitors"}, "optsZh": {"A": "從頭到尾描述一場已結束的慶典", "B": "對比鄉村與城市的習俗", "C": "描繪一個家庭中流露出期待之情的準備工作", "D": "解釋這個家庭為何不喜歡訪客"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Main Idea: testing Paleolithic light sources.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一段回憶錄描寫一位老師在日出前打開教室的門、把筆記本擺整齊，並聆聽學生們在走廊上聚集。這段文字還沒有呈現課程本身；而是凸顯了課程開始前那些安靜的例行儀式。", "opts": {"A": "To describe the moments before a significant daily activity begins", "B": "To recount a student's entire academic career", "C": "To argue that early classes should be canceled", "D": "To evaluate the quality of a school's curriculum"}, "optsZh": {"A": "描述一項重要的日常活動開始前的時刻", "B": "敘述一位學生完整的求學歷程", "C": "主張應取消早上的課", "D": "評估一所學校課程的品質"}, "answer": "A", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Main Idea: testing Paleolithic light sources.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "哪一個選項最能說明本文的主要目的或主旨？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。一段文學文字呈現雨後的花園：潮濕的小徑、明亮的樹葉，以及一張放在樹下的長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓場景感覺平靜卻又充滿期待。", "opts": {"A": "To compare two different seasons", "B": "To give instructions for maintaining a garden", "C": "To establish a reflective mood before a character acts", "D": "To reveal the full contents of a letter"}, "optsZh": {"A": "比較兩個不同的季節", "B": "提供照料花園的指示", "C": "在角色行動之前營造一種沉思的氛圍", "D": "揭露一封信的全部內容"}, "answer": "C", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Quantitative Evidence: production rose while companies declined.", "vocab": false, "body": "Annual Car Production in the United States, 1910-1925<br>1910: 123,990 cars; 320 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">companies<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">producing<\/a> cars.<br>1915: 548,139 cars; 224 companies producing cars.<br>1920: 1,651,625 cars; 197 companies producing cars.<br>1925: 3,185,881 cars; 80 companies producing cars.<br><br>A student is using the table as part of a social studies class <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=presentation\" target=\"_blank\" rel=\"noopener\" data-w=\"presentation\" data-pos=\"n.\" data-en=\"a talk that gives information to an audience\" data-zh=\"報告；簡報\">presentation<\/a> on the US auto <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industry\" target=\"_blank\" rel=\"noopener\" data-w=\"industry\" data-pos=\"n.\" data-en=\"the businesses that make a particular product\" data-zh=\"產業；工業\">industry<\/a> in the early twentieth century. The student notes that, according to the table, from 1910 to 1925 _______", "bodyPlain": "Annual Car Production in the United States, 1910-1925\n1910: 123,990 cars; 320 companies producing cars.\n1915: 548,139 cars; 224 companies producing cars.\n1920: 1,651,625 cars; 197 companies producing cars.\n1925: 3,185,881 cars; 80 companies producing cars.\n\nA student is using the table as part of a social studies class presentation on the US auto industry in the early twentieth century. The student notes that, according to the table, from 1910 to 1925 _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪一個選項最有效地運用表格數據來完成這個敘述？", "bodyZh": "美國年度汽車產量，1910–1925 年\n1910 年：123,990 輛汽車；320 家公司生產汽車。\n1915 年：548,139 輛汽車；224 家公司生產汽車。\n1920 年：1,651,625 輛汽車；197 家公司生產汽車。\n1925 年：3,185,881 輛汽車；80 家公司生產汽車。\n一位學生正在社會課的報告中使用這張表格，報告主題是二十世紀初的美國汽車產業。這位學生指出，根據表格，從 1910 年到 1925 年，_______", "opts": {"A": "the number of cars produced increased but the number of companies producing cars decreased.", "B": "both the number of cars produced and the number of companies producing cars remained unchanged.", "C": "the number of cars produced decreased but the number of companies producing cars remained unchanged.", "D": "both the number of cars produced and the number of companies producing cars increased."}, "optsZh": {"A": "汽車產量增加，但生產汽車的公司數量減少。", "B": "汽車產量和生產汽車的公司數量都維持不變。", "C": "汽車產量減少，但生產汽車的公司數量維持不變。", "D": "汽車產量和生產汽車的公司數量都增加了。"}, "answer": "A", "expl": "Cars produced rose from 123,990 to 3,185,881, while companies fell from 320 to 80.", "explZh": "汽車產量從 123,990 輛增加到 3,185,881 輛，而生產汽車的公司則從 320 家減少到 80 家。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Quantitative Evidence: production rose while companies declined.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人在國家誕生中所扮演的象徵角色，比他施政期間短暫而不均的紀錄更為重要。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Quantitative Evidence: production rose while companies declined.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持一個關於區域作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "The graph contains information about three regions.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "南部地區被納入了調查。", "B": "這張圖表包含三個地區的資訊。", "C": "有些農民種植蔬菜，有些則種植穀物。", "D": "女性占南部蔬菜種植者的多數，但在北部或中部的穀物種植者中則不是多數。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Quantitative Evidence: production rose while companies declined.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "One rocky planet has a thin atmosphere.", "C": "Some stars contain hydrogen and helium.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "研究發現有幾顆岩石行星所含鐵的比例遠高於它們所環繞的恆星。", "B": "有一顆岩石行星的大氣層很稀薄。", "C": "有些恆星含有氫和氦。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Quantitative Evidence: production rose while companies declined.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一位民俗學者主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國度原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "Many performers learned songs from relatives.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "有些歌曲使用的韻律也見於較古老的歐洲詩歌中。", "B": "有幾首民謠包含在地歷史事件，以及在不同社群長期接觸後才出現的融合音樂形式。", "C": "許多表演者向親戚學習歌曲。", "D": "有好幾個國家的學者在研究這項傳統。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Quantitative Evidence: production rose while companies declined.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。一張表格顯示，在某社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program took place in a community.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "這個計畫在一個社區中進行。", "C": "與沒有實施計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "D": "兩個城鎮都有一些志工。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence: shopper quote supports layout explanation.", "vocab": false, "body": "External shopping cues are a type of marketing that uses obvious messaging--a display featuring a new product, for example, or a &quot;buy one, get one free&quot; offer--to entice <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumer\" target=\"_blank\" rel=\"noopener\" data-w=\"consumer\" data-pos=\"n.\" data-en=\"a person who buys goods or services\" data-zh=\"消費者\">consumers<\/a> to make spontaneous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=purchase\" target=\"_blank\" rel=\"noopener\" data-w=\"purchase\" data-pos=\"v.\" data-en=\"to buy something\" data-zh=\"購買\">purchases<\/a>. In a study, data scientist Sam K. Hui and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> found that this effect can also be achieved with a less obvious cue: rearranging a store&#x27;s layout. The researchers explain that trying to find items in new locations causes shoppers to move through more of the store, exposing them to more products and increasing the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=likelihood\" target=\"_blank\" rel=\"noopener\" data-w=\"likelihood\" data-pos=\"n.\" data-en=\"the chance that something will happen\" data-zh=\"可能性\">likelihood<\/a> that they&#x27;ll buy an item they hadn&#x27;t planned on purchasing.", "bodyPlain": "External shopping cues are a type of marketing that uses obvious messaging--a display featuring a new product, for example, or a \"buy one, get one free\" offer--to entice consumers to make spontaneous purchases. In a study, data scientist Sam K. Hui and colleagues found that this effect can also be achieved with a less obvious cue: rearranging a store's layout. The researchers explain that trying to find items in new locations causes shoppers to move through more of the store, exposing them to more products and increasing the likelihood that they'll buy an item they hadn't planned on purchasing.", "stem": "Which response from a survey given to shoppers who made a purchase at a retail store best supports the researchers' explanation?", "stemZh": "在一家零售店購物的顧客所填寫的問卷中，哪一個回答最能支持研究人員的解釋？", "bodyZh": "外部購物線索是一種行銷方式，利用明顯的訊息——例如新產品的陳列，或「買一送一」的優惠——來誘使消費者衝動購物。在一項研究中，數據科學家 Sam K.Hui 和同事發現，一種較不明顯的線索也能達到這種效果：重新安排商店的布局。研究人員解釋，在新位置尋找商品會讓購物者走過商店更多區域，接觸到更多產品，因而提高他們購買原本沒打算買的商品的可能性。", "opts": {"A": "\"I needed to buy some cleaning supplies, but they weren't in their regular place. While I was looking for them, I saw this interesting notebook and decided to buy it, too.\"", "B": "\"I didn't buy everything on my shopping list today. I couldn't find a couple of the items in the store, even though I looked all over for them.\"", "C": "\"The store sent me a coupon for a new brand of soup, so I came here to find out what kinds of soup that brand offers. I decided to buy a few cans because I had the coupon.\"", "D": "\"This store is larger than one that's closer to where I live, and it carries more products. I came here to buy some things that the other store doesn't always have.\""}, "optsZh": {"A": "「我需要買一些清潔用品，但它們不在平常的位置。我在找它們的時候，看到這本有趣的筆記本，就決定也買下來。」", "B": "「我今天沒有買齊購物清單上的東西。我在店裡找不到其中幾樣，雖然我到處都找過了。」", "C": "「這家店寄給我一張新品牌湯品的折價券，所以我來這裡看看那個品牌有哪些湯。因為有折價券，我決定買幾罐。」", "D": "「這家店比我家附近那家大，商品也比較多。我來這裡買一些另一家店不一定有的東西。」"}, "answer": "A", "expl": "The shopper's usual item was moved, and while searching for it she saw and bought an unplanned notebook—exactly the researchers' explanation.", "explZh": "這位顧客常買的商品換了位置，她在尋找時看到並買下原本沒打算買的筆記本——正好符合研究人員的解釋。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence: shopper quote supports layout explanation.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make somethin
