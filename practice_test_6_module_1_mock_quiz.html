edral configuration has been distorted by high pressure.", "B": "Examination of TMAO's molecular structure shows that TMAO molecules retain their shape even as pressure increases.", "C": "A positive correlation is found between concentrations of TMAO and the rate at which water's molecular structure compresses as pressure increases.", "D": "Analysis of water's molecular structure under high pressure reveals that hydrogen bonds are more stable when TMAO is present than when it is not."}, "optsZh": {"A": "研究發現，即使水分子的四面體結構因高壓而扭曲，TMAO 仍無法滲入水分子。", "B": "檢視 TMAO 的分子結構後發現，即使壓力增加，TMAO 分子仍能保持形狀。", "C": "研究發現 TMAO 的濃度與水的分子結構隨壓力增加而被壓縮的速度呈正相關。", "D": "分析高壓下水的分子結構發現，有 TMAO 存在時氫鍵比沒有 TMAO 時更穩定。"}, "answer": "D", "expl": "The hypothesis is that TMAO keeps water from compressing; if hydrogen bonds stay more stable under pressure when TMAO is present, water's structure resists compression.", "explZh": "假說是 TMAO 能降低水的可壓縮性；若有 TMAO 時氫鍵在高壓下更穩定，水的結構就較不易被壓縮，直接支持假說。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Command of Evidence: TMAO stabilizes water under pressure.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人在上任第一個月內簽署了數項法令。」", "D": "「這位領導人在國家誕生中所扮演的象徵角色，比他施政期間短暫而不均的紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Command of Evidence: TMAO stabilizes water under pressure.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持一個關於區域作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "女性占南部蔬菜種植者的多數，但在北部或中部的穀物種植者中則不是多數。", "C": "有些農民種植蔬菜，有些則種植穀物。", "D": "南部地區被納入了調查。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Command of Evidence: TMAO stabilizes water under pressure.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "Some stars contain hydrogen and helium.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有一顆岩石行星的大氣層很稀薄。", "B": "有些恆星含有氫和氦。", "C": "研究發現有幾顆岩石行星所含鐵的比例遠高於它們所環繞的恆星。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Command of Evidence: TMAO stabilizes water under pressure.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一位民俗學者主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國度原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "The tradition is studied by scholars in several countries.", "C": "Some songs use a meter also found in older European poetry.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有幾首民謠包含在地歷史事件，以及在不同社群長期接觸後才出現的融合音樂形式。", "B": "有好幾個國家的學者在研究這項傳統。", "C": "有些歌曲使用的韻律也見於較古老的歐洲詩歌中。", "D": "許多表演者向親戚學習歌曲。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Command of Evidence: TMAO stabilizes water under pressure.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。一張表格顯示，在某社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The table includes more than one year.", "C": "The program took place in a community.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這張表格包含不只一個年份。", "C": "這個計畫在一個社區中進行。", "D": "與沒有實施計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: anatomy suggests less sustained flight.", "vocab": false, "body": "The Cretaceous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pterosaur\" target=\"_blank\" rel=\"noopener\" data-w=\"pterosaur\" data-pos=\"n.\" data-en=\"a flying reptile that lived in the time of dinosaurs\" data-zh=\"翼龍\">pterosaur<\/a> Tupandactylus navigans is known for having an anomalously oversized head crest. Until an almost complete fossil skeleton was found in Brazil, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=paleontologist\" target=\"_blank\" rel=\"noopener\" data-w=\"paleontologist\" data-pos=\"n.\" data-en=\"a scientist who studies fossils and ancient life\" data-zh=\"古生物學家\">paleontologists<\/a> had been able to study only skull specimens from T. navigans, though it was presumed that, like other pterosaurs, the species&#x27;s primary form of locomotion was powered flight. Examining the fuller skeleton in 2016, Victor Beccari and his team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that T. navigans had long hind legs, short wings, and an unusually long neck--<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=characteristic\" target=\"_blank\" rel=\"noopener\" data-w=\"characteristic\" data-pos=\"n.\" data-en=\"a typical quality or feature\" data-zh=\"特徵；特性\">characteristics<\/a> that, combined with the creature&#x27;s large-crested head, would have made sustained flight difficult and walking upright relatively comfortable. Based on these findings the team suggests that T. navigans likely _______", "bodyPlain": "The Cretaceous pterosaur Tupandactylus navigans is known for having an anomalously oversized head crest. Until an almost complete fossil skeleton was found in Brazil, paleontologists had been able to study only skull specimens from T. navigans, though it was presumed that, like other pterosaurs, the species's primary form of locomotion was powered flight. Examining the fuller skeleton in 2016, Victor Beccari and his team determined that T. navigans had long hind legs, short wings, and an unusually long neck--characteristics that, combined with the creature's large-crested head, would have made sustained flight difficult and walking upright relatively comfortable. Based on these findings the team suggests that T. navigans likely _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "白堊紀翼龍 Tupandactylus navigans 以其異常巨大的頭冠而聞名。在巴西發現一具幾乎完整的化石骨骼之前，古生物學家只能研究 T. navigans 的頭骨標本，但一般推測，這個物種和其他翼龍一樣，主要的移動方式是動力飛行。2016 年，Victor Beccari 和他的團隊研究這具較完整的骨骼後判定，T. navigans 有長長的後肢、短翅膀和異常長的脖子——這些特徵再加上牠頭冠巨大的頭部，會使持續飛行變得困難，而直立行走則相對輕鬆。根據這些發現，團隊認為 T. navigans 很可能 _______", "opts": {"A": "flew for longer distances than did other pterosaur species that had oversized head crests.", "B": "had longer wings than other pterosaur species considered to have been comfortable walking.", "C": "had a smaller head than researchers expected based on the earlier T. navigans skull specimens.", "D": "flew for shorter distances and spent more time walking than researchers previously thought."}, "optsZh": {"A": "飛行距離比其他頭冠過大的翼龍物種更長。", "B": "翅膀比其他被認為能輕鬆行走的翼龍物種更長。", "C": "頭部比研究人員根據早期 T. navigans 頭骨標本所預期的還小。", "D": "飛行距離較短，而且花在行走的時間比研究人員先前認為的更多。"}, "answer": "D", "expl": "Its anatomy made sustained flight difficult and walking comfortable, so T. navigans likely flew shorter distances and walked more than previously thought (powered flight had been presumed).", "explZh": "牠的身體構造使長時間飛行困難、直立行走則相對輕鬆，所以 T. navigans 很可能飛得比較短、走路的時間比過去認為的更多（過去推測牠主要靠飛行）。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: anatomy suggests less sustained flight.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。某種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任一島嶼的數千年前就已與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "all island plants descended from a single cultivated variety.", "B": "the plant probably reached the islands without human assistance.", "C": "human traders must have transported the seeds recently.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "島上所有植物都源自同一個栽培品種。", "B": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。", "C": "一定是人類商人最近才把這些種子運過去的。", "D": "島上族群比大陸族群更早被馴化。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: anatomy suggests less sustained flight.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。有一種甲蟲同時分布在大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前就已與海岸族群分開，因此團隊推論：______", "opts": {"A": "the beetles were domesticated by island communities.", "B": "the island beetles must be younger than the coastal beetles.", "C": "humans carried the beetles to the island during early trade voyages.", "D": "the beetles were likely introduced by natural dispersal rather than by humans."}, "optsZh": {"A": "這些甲蟲是被島上社群馴養的。", "B": "島上的甲蟲一定比海岸的甲蟲年輕。", "C": "人類在早期的貿易航行中把甲蟲帶到了島上。", "D": "這些甲蟲很可能是透過自然擴散、而非人類引進到島上的。"}, "answer": "D", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: anatomy suggests less sustained flight.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。語言學家曾提出某首儀式歌曲是透過近期的遷徙傳到一個群島，但比較相關的口述傳統後發現，這首歌的核心詞句在遷徙發生之前就已形成。因此語言學家得出結論：______", "opts": {"A": "the migration must have begun earlier than any other human movement.", "B": "all versions of the song are identical.", "C": "the song was probably not introduced to the archipelago by that migration.", "D": "the song could not have changed after the migration."}, "optsZh": {"A": "這次遷徙一定比其他任何人類遷移都更早開始。", "B": "這首歌的所有版本都一模一樣。", "C": "這首歌很可能不是由那次遷徙引進群島的。", "D": "這首歌在遷徙之後不可能有所改變。"}, "answer": "C", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: anatomy suggests less sustained flight.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。研究某座偏遠島嶼上一種作物的植物學家發現，該島的品種在人類定居島上的數萬年前就已與大陸近親分化。這項證據使他們主張：______", "opts": {"A": "mainland farmers acquired the crop from island communities.", "B": "human settlement probably did not account for the plant's original arrival on the island.", "C": "the island variety must be genetically identical to wild mainland plants.", "D": "the crop was first domesticated on the island."}, "optsZh": {"A": "大陸農民是從島上社群取得這種作物的。", "B": "人類定居很可能並不是這種植物最初抵達該島的原因。", "C": "島上的品種在基因上必定與大陸的野生植物完全相同。", "D": "這種作物最早是在島上被馴化的。"}, "answer": "B", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: anatomy suggests less sustained flight.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。研究人員原本以為，一種淡水螺是在人們開始在湖泊之間搬運船隻時，才到達這一連串湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前就已彼此分離。因此研究人員得出結論：______", "opts": {"A": "the snails likely spread through an earlier nonhuman mechanism.", "B": "the lakes did not contain snails until boating began.", "C": "human activity made the populations genetically identical.", "D": "boats probably explain every modern snail population."}, "optsZh": {"A": "這些螺類很可能是透過更早的非人為機制擴散的。", "B": "在划船活動開始之前，這些湖泊裡沒有螺類。", "C": "人類活動使這些族群在基因上完全相同。", "D": "船隻很可能說明了現今所有螺類族群的分布。"}, "answer": "A", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: ethical consumers' ratings predict purchase likelihood.", "vocab": false, "body": "Consumer psychologists have theorized that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=likelihood\" target=\"_blank\" rel=\"noopener\" data-w=\"likelihood\" data-pos=\"n.\" data-en=\"the chance that something will happen\" data-zh=\"可能性\">likelihood<\/a> that people who identify as ethical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumer\" target=\"_blank\" rel=\"noopener\" data-w=\"consumer\" data-pos=\"n.\" data-en=\"a person who buys goods or services\" data-zh=\"消費者\">consumers<\/a>--meaning that they strive to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=purchase\" target=\"_blank\" rel=\"noopener\" data-w=\"purchase\" data-pos=\"v.\" data-en=\"to buy something\" data-zh=\"購買\">purchase<\/a> goods and services with positive or neutral social and ecological effects--will purchase a given product positively correlates with their perception of that product&#x27;s effects. In a recent study of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attitude\" target=\"_blank\" rel=\"noopener\" data-w=\"attitude\" data-pos=\"n.\" data-en=\"a way of thinking or feeling about something\" data-zh=\"態度\">attitudes<\/a> of self-identified ethical consumers toward purchasing a specific mobile phone coming to market, researchers found that, on average, study participants in their twenties rated the phone&#x27;s social and ecological effects much less positively than did participants in other age groups. All other things being equal, if consumer psychologists&#x27; theory is correct, this finding suggests that _______", "bodyPlain": "Consumer psychologists have theorized that the likelihood that people who identify as ethical consumers--meaning that they strive to purchase goods and services with positive or neutral social and ecological effects--will purchase a given product positively correlates with their perception of that product's effects. In a recent study of the attitudes of self-identified ethical consumers toward purchasing a specific mobile phone coming to market, researchers found that, on average, study participants in their twenties rated the phone's social and ecological effects much less positively than did participants in other age groups. All other things being equal, if consumer psychologists' theory is correct, this finding suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "消費心理學家提出理論：自認為「道德消費者」的人——意即他們努力購買對社會和生態有正面或中性影響的商品與服務——購買某項產品的可能性，與他們對該產品影響的看法呈正相關。在最近一項研究中，研究人員調查自認為道德消費者的人對購買一款即將上市手機的態度，發現平均而言，二十多歲的受試者對這款手機的社會與生態影響的評價，遠比其他年齡層的受試者負面。在其他條件都相同的情況下，如果消費心理學家的理論正確，這項發現意味著 _______", "opts": {"A": "the phone is less appealing to ethical consumers in their twenties than other similar phones on the market are.", "B": "ethical consumers in their twenties are less likely to purchase the phone than ethical consumers in other age groups are.", "C": "there is not a meaningful difference in the likelihood of purchasing the phone among ethical consumers in different age groups.", "D": "ethical consumers in their twenties are more likely than ethical consumers in other age groups to consider a phone's social and ecological effects when deciding whether to purchase that phone."}, "optsZh": {"A": "對二十多歲的道德消費者而言，這款手機的吸引力比市面上其他類似手機低。", "B": "二十多歲的道德消費者購買這款手機的可能性，低於其他年齡層的道德消費者。", "C": "不同年齡層的道德消費者購買這款手機的可能性沒有明顯差異。", "D": "二十多歲的道德消費者比其他年齡層的道德消費者更可能在決定是否購買手機時，考慮手機的社會與生態影響。"}, "answer": "B", "expl": "The theory says purchase likelihood rises with positive perception of effects; since people in their twenties rated the phone's effects less positively, they should be less likely to buy it than other age groups.", "explZh": "理論指出購買可能性與對產品影響的正面看法呈正相關；二十多歲的人對手機影響評價較低，因此他們購買的可能性應低於其他年齡層。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: ethical consumers' ratings predict purchase likelihood.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。某種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任一島嶼的數千年前就已與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "human traders must have transported the seeds recently.", "B": "the island populations were domesticated before mainland populations.", "C": "all island plants descended from a single cultivated variety.", "D": "the plant probably reached the islands without human assistance."}, "optsZh": {"A": "一定是人類商人最近才把這些種子運過去的。", "B": "島上族群比大陸族群更早被馴化。", "C": "島上所有植物都源自同一個栽培品種。", "D": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。"}, "answer": "D", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: ethical consumers' ratings predict purchase likelihood.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。有一種甲蟲同時分布在大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前就已與海岸族群分開，因此團隊推論：______", "opts": {"A": "humans carried the beetles to the island during early trade voyages.", "B": "the island beetles must be younger than the coastal beetles.", "C": "the beetles were domesticated by island communities.", "D": "the beetles were likely introduced by natural dispersal rather than by humans."}, "optsZh": {"A": "人類在早期的貿易航行中把甲蟲帶到了島上。", "B": "島上的甲蟲一定比海岸的甲蟲年輕。", "C": "這些甲蟲是被島上社群馴養的。", "D": "這些甲蟲很可能是透過自然擴散、而非人類引進到島上的。"}, "answer": "D", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: ethical consumers' ratings predict purchase likelihood.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。語言學家曾提出某首儀式歌曲是透過近期的遷徙傳到一個群島，但比較相關的口述傳統後發現，這首歌的核心詞句在遷徙發生之前就已形成。因此語言學家得出結論：______", "opts": {"A": "the song could not have changed after the migration.", "B": "all versions of the song are identical.", "C": "the song was probably not introduced to the archipelago by that migration.", "D": "the migration must have begun earlier than any other human movement."}, "optsZh": {"A": "這首歌在遷徙之後不可能有所改變。", "B": "這首歌的所有版本都一模一樣。", "C": "這首歌很可能不是由那次遷徙引進群島的。", "D": "這次遷徙一定比其他任何人類遷移都更早開始。"}, "answer": "C", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: ethical consumers' ratings predict purchase likelihood.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。研究某座偏遠島嶼上一種作物的植物學家發現，該島的品種在人類定居島上的數萬年前就已與大陸近親分化。這項證據使他們主張：______", "opts": {"A": "human settlement probably did not account for the plant's original arrival on the island.", "B": "mainland farmers acquired the crop from island communities.", "C": "the island variety must be genetically identical to wild mainland plants.", "D": "the crop was first domesticated on the island."}, "optsZh": {"A": "人類定居很可能並不是這種植物最初抵達該島的原因。", "B": "大陸農民是從島上社群取得這種作物的。", "C": "島上的品種在基因上必定與大陸的野生植物完全相同。", "D": "這種作物最早是在島上被馴化的。"}, "answer": "A", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: ethical consumers' ratings predict purchase likelihood.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。研究人員原本以為，一種淡水螺是在人們開始在湖泊之間搬運船隻時，才到達這一連串湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前就已彼此分離。因此研究人員得出結論：______", "opts": {"A": "boats probably explain every modern snail population.", "B": "the snails likely spread through an earlier nonhuman mechanism.", "C": "human activity made the populations genetically identical.", "D": "the lakes did not contain snails until boating began."}, "optsZh": {"A": "船隻很可能說明了現今所有螺類族群的分布。", "B": "這些螺類很可能是透過更早的非人為機制擴散的。", "C": "人類活動使這些族群在基因上完全相同。", "D": "在划船活動開始之前，這些湖泊裡沒有螺類。"}, "answer": "B", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Grammar: participial modifier created.", "vocab": false, "body": "The Boston Saloon was one of the most popular African American-owned <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establishment\" target=\"_blank\" rel=\"noopener\" data-w=\"establishment\" data-pos=\"n.\" data-en=\"a business such as a shop, hotel, or restaurant\" data-zh=\"營業場所；機構\">establishments<\/a> in nineteenth-century Nevada. _______ by businessman William A.G. Brown, the saloon was known to offer elegant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accommodation\" target=\"_blank\" rel=\"noopener\" data-w=\"accommodation\" data-pos=\"n.\" data-en=\"a place to stay or be served, such as rooms or seating\" data-zh=\"住宿；設施\">accommodations<\/a> and an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inclusive\" target=\"_blank\" rel=\"noopener\" data-w=\"inclusive\" data-pos=\"adj.\" data-en=\"including everyone; not leaving anyone out\" data-zh=\"包容的；涵蓋廣泛的\">inclusive<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>.", "bodyPlain": "The Boston Saloon was one of the most popular African American-owned establishments in nineteenth-century Nevada. _______ by businessman William A.G. Brown, the saloon was known to offer elegant accommodations and an inclusive environment.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "Boston Saloon 是十九世紀內華達州最受歡迎的非裔美國人經營的場所之一。_______ 由商人 William A.G.Brown（經營），這家酒館以提供優雅的設施和包容的環境而聞名。", "opts": {"A": "Created", "B": "Creates", "C": "Creating", "D": "Create"}, "optsZh": {"A": "Created（過去分詞，引導被動意義的修飾語「由……創立」：正確）", "B": "Creates（第三人稱單數現在式動詞 → 造成句子結構錯誤：錯誤）", "C": "Creating（現在分詞，表主動 → 酒館不是「創立者」：錯誤）", "D": "Create（原形動詞 → 無法引導修飾語：錯誤）"}, "answer": "A", "expl": "The past participle 'Created' begins a modifier describing the saloon (which was created by Brown); the other forms are finite verbs or an active participle.", "explZh": "過去分詞「Created」引導修飾語，描述酒館「由 Brown 創立」（被動意義）；其他選項是限定動詞或主動的現在分詞，不合文法。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Grammar: participial modifier created.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。幾本掛名名人運動員的回憶錄，實際上是由合作者撰寫的，他們把其他 ______ 塑造成精緻的敘事，自己卻始終不具名。", "opts": {"A": "peoples stories", "B": "people's stories", "C": "peoples story's", "D": "people's story's"}, "optsZh": {"A": "peoples stories（缺少所有格符號 → 錯誤）", "B": "people's stories（people 的複數所有格＋複數名詞 stories：正確）", "C": "peoples story's（所有格位置錯誤 → 錯誤）", "D": "people's story's（story's 為所有格 → 此處需要複數名詞：錯誤）"}, "answer": "B", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Grammar: participial modifier created.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> remain more stable than on the exposed sand.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在寒冷的月份，這種沙漠蜥蜴會減少活動並 ______ 在扁平的石頭下，那裡的溫度比裸露的沙地更穩定。", "opts": {"A": "sheltered", "B": "would shelter", "C": "shelters", "D": "had sheltered"}, "optsZh": {"A": "sheltered（過去式 → 與 reduces 的現在式不平行：錯誤）", "B": "would shelter（would＋原形 → 與 reduces 的現在式不平行：錯誤）", "C": "shelters（第三人稱單數現在式，與 reduces 平行，表一般事實：正確）", "D": "had sheltered（過去完成式 → 與 reduces 的現在式不平行：錯誤）"}, "answer": "C", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Grammar: participial modifier created.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這位小提琴家不只是表現出色，她 ______ 比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively during", "B": "triumphed--decisively--during", "C": "triumphed--decisively, during", "D": "triumphed--decisively. During"}, "optsZh": {"A": "triumphed--decisively during（缺少句號 → 造成連寫句：錯誤）", "B": "triumphed--decisively--during（破折號 → 無法分隔兩個獨立句子：錯誤）", "C": "triumphed--decisively, during（逗號 → 造成逗號連接錯誤：錯誤）", "D": "triumphed--decisively. During（句號，分隔兩個完整句子：正確）"}, "answer": "D", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Grammar: participial modifier created.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮革封面的筆記本。", "opts": {"A": "were", "B": "are", "C": "have been", "D": "is"}, "optsZh": {"A": "were（複數過去式 be 動詞，與複數主詞一致：正確）", "B": "are（複數現在式 be 動詞；本題答案採用表過去打撈事件的 were）", "C": "have been（現在完成式 → 本題答案採用過去式 were：錯誤）", "D": "is（單數 be 動詞 → 主詞為複數（一個羅盤、三個碗和一本筆記本）：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Grammar: participial modifier created.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這位工程師在 2011 年完成了一個小型原型 ______ 2018 年，她發表了一個可以運作數小時的全尺寸版本。", "opts": {"A": "prototype, later,", "B": "prototype later,", "C": "prototype,", "D": "prototype;"}, "optsZh": {"A": "prototype, later,（逗號 → 造成逗號連接錯誤：錯誤）", "B": "prototype later,（無標點連接兩個獨立子句 → 連寫句：錯誤）", "C": "prototype,（逗號 → 造成逗號連接錯誤：錯誤）", "D": "prototype;（分號，連接兩個相關的獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Grammar: no punctuation after complete verb.", "vocab": false, "body": "Louise Bennett (1919-2006), also known as &quot;Miss Lou,&quot; was an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=influential\" target=\"_blank\" rel=\"noopener\" data-w=\"influential\" data-pos=\"adj.\" data-en=\"having a strong effect on people or events\" data-zh=\"有影響力的\">influential<\/a> Jamaican poet and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a>. Her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=innovative\" target=\"_blank\" rel=\"noopener\" data-w=\"innovative\" data-pos=\"adj.\" data-en=\"using new methods or ideas\" data-zh=\"創新的\">innovative<\/a> poems _______ the use of Jamaican Creole (a spoken language) in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "Louise Bennett (1919-2006), also known as \"Miss Lou,\" was an influential Jamaican poet and folklorist. Her innovative poems _______ the use of Jamaican Creole (a spoken language) in literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的規範？", "bodyZh": "Louise Bennett（1919–2006），又稱「Miss Lou」，是一位具影響力的牙買加詩人與民俗學者。她富有創新精神的詩作 _______ 在文學中使用牙買加克里奧爾語（一種口語）。", "opts": {"A": "popularized;", "B": "popularized,", "C": "popularized", "D": "popularized:"}, "optsZh": {"A": "popularized;（分號 → 不應隔開動詞與受詞：錯誤）", "B": "popularized,（逗號 → 不應隔開動詞與受詞：錯誤）", "C": "popularized（動詞後直接接受詞，不加標點：正確）", "D": "popularized:（冒號 → 前面不是完整句子，且不應隔開動詞與受詞：錯誤）"}, "answer": "C", "expl": "The verb 'popularized' is followed directly by its object 'the use of Jamaican Creole,' so no punctuation should separate them.", "explZh": "動詞 popularized 後面直接接受詞 the use of Jamaican Creole，動詞與受詞之間不應加任何標點。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Grammar: no punctuation after complete verb.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Several memoirs credited to celebrity a
