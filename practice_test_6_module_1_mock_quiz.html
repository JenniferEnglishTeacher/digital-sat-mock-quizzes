選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。北側的試驗區在降雨後很快就失去水分。南側的試驗區 _______ 則能保持水分好幾天。", "opts": {"A": "in other words,", "B": "as a result,", "C": "on the other hand,", "D": "similarly,"}, "optsZh": {"A": "in other words,（換句話說：表重述 → 錯誤）", "B": "as a result,（因此：表因果結果 → 錯誤）", "C": "on the other hand,（另一方面：表對比，正確）", "D": "similarly,（同樣地：表相似 → 前後是對比關係：錯誤）"}, "answer": "C", "expl": "On the other hand marks contrast.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: in addition adds possible use.", "vocab": false, "body": "The Inca of South America used <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricately\" target=\"_blank\" rel=\"noopener\" data-w=\"intricately\" data-pos=\"adv.\" data-en=\"in a very detailed and complicated way\" data-zh=\"錯綜複雜地；精細地\">intricately<\/a> knotted string <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=device\" target=\"_blank\" rel=\"noopener\" data-w=\"device\" data-pos=\"n.\" data-en=\"a tool or object made for a particular purpose\" data-zh=\"裝置；器具\">devices<\/a> called quipus to record <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=countable\" target=\"_blank\" rel=\"noopener\" data-w=\"countable\" data-pos=\"adj.\" data-en=\"able to be counted\" data-zh=\"可計數的\">countable<\/a> information, like <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> data and payments. _______ they may have used quipus to record more complex information, like stories and myths, according to researchers.", "bodyPlain": "The Inca of South America used intricately knotted string devices called quipus to record countable information, like population data and payments. _______ they may have used quipus to record more complex information, like stories and myths, according to researchers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "南美洲的印加人使用一種打著複雜繩結、稱為「奇普」（quipu）的繩子裝置來記錄可計數的資訊，例如人口資料和付款。_______ 據研究人員表示，他們也可能用奇普記錄更複雜的資訊，例如故事和神話。", "opts": {"A": "As a result,", "B": "In other words,", "C": "In addition,", "D": "For example,"}, "optsZh": {"A": "As a result,（因此：表因果結果 → 錯誤）", "B": "In other words,（換句話說：表重述 → 後句並非重述：錯誤）", "C": "In addition,（此外：表補充另一項內容，正確）", "D": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）"}, "answer": "C", "expl": "Beyond recording countable information, quipus may also have recorded stories and myths, so 'In addition' adds a further use.", "explZh": "奇普除了記錄可計數的資訊外，可能還記錄了故事和神話，所以用「In addition」（此外）補充另一種用途。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: in addition adds possible use.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The tablets record grain deliveries and tax payments. _______ some scholars believe the tablets may also preserve hymns and legal formulas.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The tablets record grain deliveries and tax payments. _______ some scholars believe the tablets may also preserve hymns and legal formulas.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這些泥板記錄了穀物的交付和稅金的繳納。_______ 有些學者認為這些泥板可能也保存了讚美詩和法律條文。", "opts": {"A": "In other words,", "B": "For example,", "C": "In addition,", "D": "As a result,"}, "optsZh": {"A": "In other words,（換句話說：表重述 → 後句並非重述：錯誤）", "B": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "In addition,（此外：表補充另一項內容，正確）", "D": "As a result,（因此：表因果結果 → 錯誤）"}, "answer": "C", "expl": "In addition adds another possible use.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: in addition adds possible use.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The shells were used as ornaments and trade goods. _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> think they may have served as tokens in ceremonial exchanges.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The shells were used as ornaments and trade goods. _______ archaeologists think they may have served as tokens in ceremonial exchanges.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這些貝殼曾被用作裝飾品和交易物品。_______ 考古學家認為它們可能曾在儀式性的交換中充當信物。", "opts": {"A": "Therefore,", "B": "For instance,", "C": "In other words,", "D": "In addition,"}, "optsZh": {"A": "Therefore,（因此：表因果結果 → 錯誤）", "B": "For instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "In other words,（換句話說：表重述 → 後句並非重述：錯誤）", "D": "In addition,（此外：表補充另一項內容，正確）"}, "answer": "D", "expl": "In addition adds a further possibility.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: in addition adds possible use.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The archive contains letters and shipping receipts. _______ it may include coded messages between political organizers.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The archive contains letters and shipping receipts. _______ it may include coded messages between political organizers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。這批檔案包含書信和運貨收據。_______ 其中可能還有政治運動組織者之間的密碼訊息。", "opts": {"A": "In addition,", "B": "As a result,", "C": "For example,", "D": "That is,"}, "optsZh": {"A": "In addition,（此外：表補充另一項內容，正確）", "B": "As a result,（因此：表因果結果 → 錯誤）", "C": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "That is,（也就是說：表重述 → 錯誤）"}, "answer": "A", "expl": "In addition introduces extra information.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: in addition adds possible use.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrument<\/a> measured <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> and humidity. _______ it may have recorded changes in air pressure, according to a recent reconstruction.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The instrument measured temperature and humidity. _______ it may have recorded changes in air pressure, according to a recent reconstruction.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。這台儀器測量溫度和濕度。_______ 根據最近的一項復原研究，它可能也記錄了氣壓的變化。", "opts": {"A": "In other words,", "B": "In addition,", "C": "For instance,", "D": "Therefore,"}, "optsZh": {"A": "In other words,（換句話說：表重述 → 後句並非重述：錯誤）", "B": "In addition,（此外：表補充另一項內容，正確）", "C": "For instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "Therefore,（因此：表因果結果 → 錯誤）"}, "answer": "B", "expl": "In addition adds another function.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: in addition adds possible use.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The murals likely marked ritual spaces. _______ they may have recorded <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> events important to the community.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The murals likely marked ritual spaces. _______ they may have recorded historical events important to the community.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這些壁畫可能標示了儀式空間。_______ 它們可能也記錄了對該社群而言重要的歷史事件。", "opts": {"A": "In addition,", "B": "For example,", "C": "Consequently,", "D": "In other words,"}, "optsZh": {"A": "In addition,（此外：表補充另一項內容，正確）", "B": "For example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "Consequently,（因此：表因果結果 → 錯誤）", "D": "In other words,（換句話說：表重述 → 後句並非重述：錯誤）"}, "answer": "A", "expl": "In addition adds a second possible role.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transitions: then means as a result of that situation.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hindsight\" target=\"_blank\" rel=\"noopener\" data-w=\"hindsight\" data-pos=\"n.\" data-en=\"understanding of an event only after it has happened\" data-zh=\"事後的認識\">hindsight<\/a>, given the ideas about the natural world <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulating<\/a> among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coincidence\" target=\"_blank\" rel=\"noopener\" data-w=\"coincidence\" data-pos=\"n.\" data-en=\"a surprising situation where things happen together by chance\" data-zh=\"巧合\">coincidence<\/a>, _______ that Charles Darwin and Alfred Wallace arrived at the concept <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.", "bodyPlain": "In hindsight, given the ideas about the natural world circulating among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a coincidence, _______ that Charles Darwin and Alfred Wallace arrived at the concept independently. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "事後看來，考慮到 1800 年代英國科學家之間流傳的關於自然界的各種想法，天擇理論是顯而易見的下一步。這或許並非巧合，_______ 達爾文（Charles Darwin）和華萊士（Alfred Wallace）各自獨立得出了這個概念。事實上，與「孤獨天才」的流行迷思相反，他們的理論並不是第一個由多位學者平行研究而產生的典範轉移理論。", "opts": {"A": "however,", "B": "then,", "C": "moreover,", "D": "for example,"}, "optsZh": {"A": "however,（然而：表轉折對比 → 錯誤）", "B": "then,（那麼；因此：表由前述情況推出的結果，正確）", "C": "moreover,（而且：表補充 → 錯誤）", "D": "for example,（例如：表舉例 → 前後並非舉例關係：錯誤）"}, "answer": "B", "expl": "Since the theory was an obvious next step given the ideas of the time, it follows that the simultaneous discovery may not have been a coincidence; 'then' signals this consequence.", "explZh": "既然在當時的思想背景下，天擇理論是顯而易見的下一步，那麼兩人各自獨立提出這個概念也就未必是巧合；「then」（那麼、因此）表示這個推論結果。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transitions: then means as a result of that situation.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Given the number of laboratories already testing radio signals from space, the discovery was an obvious possibility. It is not surprising, _______ that two teams reported similar findings in the same year.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Given the number of laboratories already testing radio signals from space, the discovery was an obvious possibility. It is not surprising, _______ that two teams reported similar findings in the same year.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。考慮到已經有許多實驗室在測試來自太空的無線電訊號，這項發現是一個顯而易見的可能性。這並不令人意外，_______ 兩個團隊在同一年發表了相似的發現。", "opts": {"A": "for example,", "B": "moreover,", "C": "then,", "D": "however,"}, "optsZh": {"A": "for example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "B": "moreover,（而且：表補充 → 錯誤）", "C": "then,（那麼；因此：表由前述情況推出的結果，正確）", "D": "however,（然而：表轉折對比 → 錯誤）"}, "answer": "C", "expl": "Then means in that case or as a result.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transitions: then means as a result of that situation.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Because several composers were experimenting with electronic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> at the time, the new style was a natural development. It was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predictable\" target=\"_blank\" rel=\"noopener\" data-w=\"predictable\" data-pos=\"adj.\" data-en=\"able to be known in advance\" data-zh=\"可預測的\">predictable<\/a>, _______ that more than one musician arrived at it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Because several composers were experimenting with electronic instruments at the time, the new style was a natural development. It was predictable, _______ that more than one musician arrived at it independently.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。由於當時有好幾位作曲家在實驗電子樂器，這種新風格是自然的發展。這是可以預料的，_______ 不只一位音樂家各自獨立發展出這種風格。", "opts": {"A": "therefore,", "B": "then,", "C": "however,", "D": "for example,"}, "optsZh": {"A": "therefore,（因此：表因果結果 → 錯誤）", "B": "then,（那麼；因此：表由前述情況推出的結果，正確）", "C": "however,（然而：表轉折對比 → 錯誤）", "D": "for example,（例如：表舉例 → 前後並非舉例關係：錯誤）"}, "answer": "B", "expl": "Then links the conclusion to the context.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transitions: then means as a result of that situation.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The necessary statistical methods had become widely available by the 1990s. It was no accident, _______ that multiple research groups began studying the same pattern.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The necessary statistical methods had become widely available by the 1990s. It was no accident, _______ that multiple research groups began studying the same pattern.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "參觀展覽的民眾看到了草圖、錄音和說明標籤，展示這件作品如何經由反覆實驗逐步發展而成。博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。到了 1990 年代，必要的統計方法已經普及。這並非偶然，_______ 多個研究團隊開始研究同一個模式。", "opts": {"A": "then,", "B": "for instance,", "C": "nevertheless,", "D": "however,"}, "optsZh": {"A": "then,（那麼；因此：表由前述情況推出的結果，正確）", "B": "for instance,（例如：表舉例 → 前後並非舉例關係：錯誤）", "C": "nevertheless,（儘管如此：表讓步轉折 → 錯誤）", "D": "however,（然而：表轉折對比 → 錯誤）"}, "answer": "A", "expl": "Then means given those circumstances.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transitions: then means as a result of that situation.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Once inexpensive cameras became common, documenting urban wildlife required no <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> equipment. It is understandable, _______ that several amateur naturalists made comparable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Once inexpensive cameras became common, documenting urban wildlife required no specialized equipment. It is understandable, _______ that several amateur naturalists made comparable observations.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。一旦便宜的相機變得普遍，記錄城市野生動物就不再需要專業設備。這是可以理解的，_______ 好幾位業餘博物學家做出了類似的觀察。", "opts": {"A": "moreover,", "B": "then,", "C": "for example,", "D": "however,"}, "optsZh": {"A": "moreover,（而且：表補充 → 錯誤）", "B": "then,（那麼；因此：表由前述情況推出的結果，正確）", "C": "for example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "however,（然而：表轉折對比 → 錯誤）"}, "answer": "B", "expl": "Then follows from the prior condition.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transitions: then means as a result of that situation.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The archive had just been digitized, making thousands of letters searchable for the first time. It was perhaps inevitable, _______ that several historians noticed the same correspondence.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archive had just been digitized, making thousands of letters searchable for the first time. It was perhaps inevitable, _______ that several historians noticed the same correspondence.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。這批檔案剛完成數位化，使數千封信件首次可以被搜尋。這或許是必然的，_______ 好幾位歷史學家注意到了同一批書信。", "opts": {"A": "however,", "B": "moreover,", "C": "for example,", "D": "then,"}, "optsZh": {"A": "however,（然而：表轉折對比 → 錯誤）", "B": "moreover,（而且：表補充 → 錯誤）", "C": "for example,（例如：表舉例 → 前後並非舉例關係：錯誤）", "D": "then,（那麼；因此：表由前述情況推出的結果，正確）"}, "answer": "D", "expl": "Then means consequently in context.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: emphasize Janaki Ammal's achievement.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In the 1930s, the Imperial Sugar Cane Institute in India sought to limit the country&#x27;s dependence on imported sugarcane.<br>- The institute enlisted <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanist\" target=\"_blank\" rel=\"noopener\" data-w=\"botanist\" data-pos=\"n.\" data-en=\"a scientist who studies plants\" data-zh=\"植物學家\">botanist<\/a> Janaki Ammal to breed a local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=variety\" target=\"_blank\" rel=\"noopener\" data-w=\"variety\" data-pos=\"n.\" data-en=\"a type of plant within a species\" data-zh=\"品種；種類\">variety<\/a> of sugarcane.<br>- She crossbred the imported sugarcane <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> Saccharum officinarum with grasses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=native\" target=\"_blank\" rel=\"noopener\" data-w=\"native\" data-pos=\"adj.\" data-en=\"originally from a particular place\" data-zh=\"本土的；原生的\">native<\/a> to India.<br>- She succeeded in creating sugarcane hybrids well suited to India&#x27;s climate.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the 1930s, the Imperial Sugar Cane Institute in India sought to limit the country's dependence on imported sugarcane.\n- The institute enlisted botanist Janaki Ammal to breed a local variety of sugarcane.\n- She crossbred the imported sugarcane species Saccharum officinarum with grasses native to India.\n- She succeeded in creating sugarcane hybrids well suited to India's climate.", "stem": "The student wants to emphasize Janaki Ammal's achievement. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想強調 Janaki Ammal 的成就。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- 1930 年代，印度帝國甘蔗研究所試圖減少該國對進口甘蔗的依賴。\n- 該研究所延攬植物學家 Janaki Ammal 培育本土的甘蔗品種。\n- 她將進口的甘蔗品種 Saccharum officinarum 與印度原生的禾草雜交。\n- 她成功培育出非常適合印度氣候的甘蔗雜交種。", "opts": {"A": "By crossbreeding the imported sugarcane species Saccharum officinarum with grasses native to India, Ammal succeeded in creating sugarcane hybrids well suited to India's climate.", "B": "In the 1930s, the Imperial Sugar Cane Institute, which enlisted Ammal, sought to limit dependence on imported sugarcane.", "C": "Ammal was enlisted by the Imperial Sugar Cane Institute at a time when a local variety of sugarcane needed to be produced.", "D": "As part of efforts to breed a local variety of sugarcane, an imported sugarcane species called Saccharum officinarum was crossbred with grasses native to India."}, "optsZh": {"A": "Ammal 將進口甘蔗品種 Saccharum officinarum 與印度原生禾草雜交，成功培育出非常適合印度氣候的甘蔗雜交種。", "B": "1930 年代，延攬 Ammal 的印度帝國甘蔗研究所試圖減少對進口甘蔗的依賴。", "C": "Ammal 在需要培育本土甘蔗品種的時期，受到印度帝國甘蔗研究所延攬。", "D": "作為培育本土甘蔗品種計畫的一部分，一種名為 Saccharum officinarum 的進口甘蔗品種與印度原生禾草進行了雜交。"}, "answer": "A", "expl": "This choice names what Ammal did and states that she 'succeeded in creating sugarcane hybrids well suited to India's climate,' emphasizing her achievement.", "explZh": "此選項說明 Ammal 做了什麼，並指出她「成功培育出非常適合印度氣候的甘蔗雜交種」，最能強調她的成就。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: emphasize Janaki Ammal's achievement.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Mira Shah was asked to develop rice that could tolerate salty soil; she crossed a coastal rice variety with a high-yield farm variety; the resulting hybrid grew well in salty fields; the goal is to emphasize Shah&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Mira Shah was asked to develop rice that could tolerate salty soil; she crossed a coastal rice variety with a high-yield farm variety; the resulting hybrid grew well in salty fields; the goal is to emphasize Shah's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：植物學家 Mira Shah 受託開發能耐受鹽分土壤的稻米；她將一種沿海稻米品種與一種高產量的農場品種雜交；培育出的雜交種在鹽分高的田地裡生長良好；目標是強調 Shah 的成就。", "opts": {"A": "Salty soil can make rice farming difficult in coastal regions.", "B": "Shah was asked to work on rice because farmers needed a new variety.", "C": "One of the parent varieties used by Shah was known for high yield.", "D": "By crossing a coastal rice variety with a high-yield farm variety, Shah succeeded in creating a rice hybrid that grew well in salty fields."}, "optsZh": {"A": "鹽分高的土壤會讓沿海地區的稻米種植變得困難。", "B": "Shah 被要求研究稻米，因為農民需要一個新品種。", "C": "Shah 使用的其中一個親本品種以高產量著稱。", "D": "Shah 將一種沿海稻米品種與一種高產量農場品種雜交，成功培育出能在鹽分高的田地中生長良好的稻米雜交種。"}, "answer": "D", "expl": "The answer emphasizes the achievement.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: emphasize Janaki Ammal's achievement.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Engineer Daniel Ruiz designed a low-cost water filter; he combined ceramic clay with powdered charcoal; the filter removed contaminants without electricity; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> Ruiz&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Engineer Daniel Ruiz designed a low-cost water filter; he combined ceramic clay with powdered charcoal; the filter removed contaminants without electricity; the goal is to emphasize Ruiz's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：工程師 Daniel Ruiz 設計了一款低成本濾水器；他將陶土與粉狀木炭結合；這款濾水器不需用電就能去除汙染物；目標是強調 Ruiz 的成就。", "opts": {"A": "Daniel Ruiz was an engineer interested in public health.", "B": "Ruiz succeeded in designing a low-cost filter that removed contaminants without electricity.", "C": "Some communities need water filters that do not require electricity.", "D": "Ceramic clay and powdered charcoal can be used in water filters."}, "optsZh": {"A": "Daniel Ruiz 是一位關心公共衛生的工程師。", "B": "Ruiz 成功設計出一款不需用電就能去除汙染物的低成本濾水器。", "C": "有些社區需要不用電的濾水器。", "D": "陶土和粉狀木炭可用於製作濾水器。"}, "answer": "B", "expl": "The answer highlights what Ruiz accomplished.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: emphasize Janaki Ammal's achievement.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Chemist Lina Okafor studied biodegradable packaging; she blended cassava starch with plant fibers; the material resisted tearing and decomposed quickly; the goal is to emphasize Okafor&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Chemist Lina Okafor studied biodegradable packaging; she blended cassava starch with plant fibers; the material resisted tearing and decomposed quickly; the goal is to emphasize Okafor's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。筆記：化學家 Lina Okafor 研究可生物分解的包裝；她將樹薯澱粉與植物纖維混合；這種材料不易撕破且能快速分解；目標是強調 Okafor 的成就。", "opts": {"A": "Okafor created a cassava-starch packaging material that resisted tearing and decomposed quickly.", "B": "Biodegradable packaging can reduce plastic waste.", "C": "Plant fibers can strengthen starch-based materials.", "D": "Cassava starch was one ingredient in Okafor's material."}, "optsZh": {"A": "Okafor 研發出一種以樹薯澱粉製成的包裝材料，不易撕破且能快速分解。", "B": "可生物分解的包裝可以減少塑膠垃圾。", "C": "植物纖維可以強化以澱粉為基礎的材料。", "D": "樹薯澱粉是 Okafor 所研發材料的成分之一。"}, "answer": "A", "expl": "The answer centers the achievement.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: emphasize Janaki Ammal's achievement.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Architect Noor Haddad designed a school for a hot desert climate; she used shaded courtyards and thick earthen walls; the building stayed cool with little mechanical air-conditioning; the goal is to emphasize Haddad&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Architect Noor Haddad designed a school for a hot desert climate; she used shaded courtyards and thick earthen walls; the building stayed cool with little mechanical air-conditioning; the goal is to emphasize Haddad's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。筆記：建築師 Noor Haddad 為炎熱的沙漠氣候設計了一所學校；她採用有遮蔭的中庭和厚實的土牆；這棟建築幾乎不需要機械空調就能保持涼爽；目標是強調 Haddad 的成就。", "opts": {"A": "Using shaded courtyards and thick earthen walls, Haddad designed a school that stayed cool with little mechanical air-conditioning.", "B": "The school was designed for a hot desert climate.", "C": "The building used thick earthen walls.", "D": "Shaded courtyards can reduce heat in buildings."}, "optsZh": {"A": "Haddad 利用有遮蔭的中庭和厚實的土牆，設計出一所幾乎不需機械空調就能保持涼爽的學校。", "B": "這所學校是為炎熱的沙漠氣候而設計的。", "C": "這棟建築採用了厚實的土牆。", "D": "有遮蔭的中庭可以降低建築物內的熱度。"}, "answer": "A", "expl": "The answer emphasizes the successful result.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: emphasize Janaki Ammal's achievement.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Computer scientist Elena Park developed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translation<\/a> software for an endangered language; she trained the system on community-recorded stories; the software produced accurate draft translations; the goal is to emphasize Park&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Computer scientist Elena Park developed translation software for an endangered language; she trained the system on community-recorded stories; the software produced accurate draft translations; the goal is to emphasize Park's achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。筆記：電腦科學家 Elena Park 為一種瀕危語言開發翻譯軟體；她用社群錄製的故事來訓練系統；該軟體產出了準確的翻譯初稿；目標是強調 Park 的成就。", "opts": {"A": "Translation software often requires large amounts of language data.", "B": "Elena Park worked with speakers of an endangered language.", "C": "Park developed translation software that produced accurate draft translations after being trained on community-recorded stories.", "D": "Community-recorded stories can help preserve endangered languages."}, "optsZh": {"A": "翻譯軟體通常需要大量的語言資料。", "B": "Elena Park 與一種瀕危語言的使用者合作。", "C": "Park 以社群錄製的故事訓練系統後，開發出能產出準確翻譯初稿的翻譯軟體。", "D": "社群錄製的故事有助於保存瀕危語言。"}, "answer": "C", "expl": "The answer states the achievement.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: emphasize similarity between sculptures.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Elizabeth Catlett&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculpture<\/a> Recognition (1970) shows two African American figures with rounded, indistinct features.<br>- The figures reach out to each other in a pose that symbolizes a close, supportive <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a>.<br>- Her sculpture Students Aspire (1978) shows two African American figures with sharply defined features.<br>- The figures hold an equal sign above their heads with one hand and embrace each other with the other hand.<br>- This pose symbolizes their support for each other in the pursuit of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equality\" target=\"_blank\" rel=\"noopener\" data-w=\"equality\" data-pos=\"n.\" data-en=\"the state of having the same rights and status\" data-zh=\"平等\">equality<\/a>.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Elizabeth Catlett's sculpture Recognition (1970) shows two African American figures with rounded, indistinct features.\n- The figures reach out to each other in a pose that symbolizes a close, supportive relationship.\n- Her sculpture Students Aspire (1978) shows two African American figures with sharply defined features.\n- The figures hold an equal sign above their heads with one hand and embrace each other with the other hand.\n- This pose symbolizes their support for each other in the pursuit of equality.", "stem": "The student wants to emphasize a similarity between the two sculptures. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想強調這兩件雕塑之間的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- Elizabeth Catlett 的雕塑《Recognition》（1970 年）呈現兩個五官圓潤、模糊的非裔美國人形象。\n- 這兩個人物向彼此伸出手，姿勢象徵親密、互相扶持的關係。\n- 她的雕塑《Students Aspire》（1978 年）呈現兩個五官輪廓鮮明的非裔美國人形象。\n- 這兩個人物一手將等號舉過頭頂，另一手互相擁抱。\n- 這個姿勢象徵他們在追求平等的路上互相支持。", "opts": {"A": "Catlett's Students Aspire depicts two figures supporting each other in the pursuit of equality.", "B": "Recognition and Students Aspire both show African American figures in poses that symbolize supportive relationships.", "C": "Catlett completed Recognition in 1970 and Students Aspire in 1978.", "D": "The figures in Recognition have features that are rounded and indistinct, while the figures in Students Aspire have sharply defined features."}, "optsZh": {"A": "Catlett 的《Students Aspire》描繪兩個人物在追求平等的過程中互相扶持。", "B": "《Recognition》和《Students Aspire》都呈現了以象徵互相扶持關係的姿勢出現的非裔美國人形象。", "C": "Catlett 在 1970 年完成《Recognition》，在 1978 年完成《Students Aspire》。", "D": "《Recognition》中的人物五官圓潤而模糊，而《Students Aspire》中的人物五官輪廓鮮明。"}, "answer": "B", "expl": "Both sculptures show African American figures in poses symbolizing supportive relationships; this choice states that shared feature.", "explZh": "兩件雕塑都呈現非裔美國人以象徵互相扶持的姿勢出現；此選項正好點出兩者的共同點。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: emphasize similarity between sculptures.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Maya Lin&#x27;s Wave Field uses raised earth forms; her Storm King Wavefield also uses raised earth forms; both works invite viewers to walk through sculpted landscapes; the goal is to emphasize a similarity.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Maya Lin's Wave Field uses raised earth forms; her Storm King Wavefield also uses raised earth forms; both works invite viewers to walk through sculpted landscapes; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：Maya Lin 的《Wave Field》使用隆起的土丘造型；她的《Storm King Wavefield》也使用隆起的土丘造型；兩件作品都邀請觀眾走進雕塑而成的地景中；目標是強調相似之處。", "opts": {"A": "Wave Field was completed before Storm King Wavefield.", "B": "Maya Lin created several works that are installed outdoors.", "C": "Wave Field and Storm King Wavefield both use raised earth forms to create landscapes viewers can walk through.", "D": "Storm King Wavefield is larger than Wave Field."}, "optsZh": {"A": "《Wave Field》比《Storm King Wavefield》更早完成。", "B": "Maya Lin 創作了數件安置於戶外的作品。", "C": "《Wave Field》和《Storm King Wavefield》都使用隆起的土丘造型，創造出觀眾可以走進的地景。", "D": "《Storm King Wavefield》比《Wave Field》大。"}, "answer": "C", "expl": "The answer emphasizes the similarity.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: emphasize similarity between sculptures.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Two murals by Diego Rivera show factory workers; Detroit Industry includes workers operating machines; Man at the Crossroads also includes workers with machines; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Two murals by Diego Rivera show factory workers; Detroit Industry includes workers operating machines; Man at the Crossroads also includes workers with machines; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：Diego Rivera 的兩幅壁畫描繪工廠工人；《Detroit Industry》中有操作機器的工人；《Man at the Crossroads》中也有與機器一起的工人；目標是強調相似之處。", "opts": {"A": "Both Detroit Industry and Man at the Crossroads depict factory workers using or standing near machines.", "B": "Detroit Industry was painted in the United States.", "C": "Rivera often painted scenes of labor and industry.", "D": "Man at the Crossroads became controversial after it was commissioned."}, "optsZh": {"A": "《Detroit Industry》和《Man at the Crossroads》都描繪了使用機器或站在機器旁的工廠工人。", "B": "《Detroit Industry》是在美國繪製的。", "C": "Rivera 經常描繪勞動與工業的場景。", "D": "《Man at the Crossroads》在受委託創作後引發爭議。"}, "answer": "A", "expl": "The answer states what the works share.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: emphasize similarity between sculptures.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Two poems by Gwendolyn Brooks focus on city life; one poem describes children playing in alleys; another describes neighbors gathering outside apartments; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Two poems by Gwendolyn Brooks focus on city life; one poem describes children playing in alleys; another describes neighbors gathering outside apartments; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。筆記：Gwendolyn Brooks 的兩首詩聚焦城市生活；一首描寫在巷弄裡玩耍的孩子；另一首描寫聚集在公寓外的鄰居；目標是強調相似之處。", "opts": {"A": "The poems focus on different groups of people.", "B": "One poem describes children in alleys.", "C": "Brooks wrote about many subjects besides cities.", "D": "Both poems portray everyday social life in the city."}, "optsZh": {"A": "這些詩聚焦於不同的人群。", "B": "其中一首詩描寫巷弄裡的孩子。", "C": "Brooks 除了城市之外還寫過許多其他主題。", "D": "兩首詩都描寫了城市中的日常社交生活。"}, "answer": "D", "expl": "The answer emphasizes the shared focus.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: emphasize similarity between sculptures.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> by Dorothea Lange show migrant families; one photograph shows a mother with children; another shows a father standing beside a packed car; both images convey <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertainty\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertainty\" data-pos=\"n.\" data-en=\"the state of not being sure\" data-zh=\"不確定性\">uncertainty<\/a> during migration; the goal is to emphasize a similarity.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Two photographs by Dorothea Lange show migrant families; one photograph shows a mother with children; another shows a father standing beside a packed car; both images convey uncertainty during migration; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。筆記：Dorothea Lange 的兩張照片呈現移民家庭；一張是一位母親和孩子們；另一張是一位父親站在一輛裝滿行李的車旁；兩張影像都傳達了遷徙途中的不確定感；目標是強調相似之處。", "opts": {"A": "The photographs show different members of migrant families.", "B": "Lange photographed many people during the Great Depression.", "C": "One photograph includes a packed car.", "D": "Both photographs convey the uncertainty experienced by migrant families."}, "optsZh": {"A": "這些照片呈現了移民家庭的不同成員。", "B": "Lange 在經濟大蕭條期間拍攝了許多人。", "C": "其中一張照片裡有一輛裝滿行李的車。", "D": "兩張照片都傳達了移民家庭所經歷的不確定感。"}, "answer": "D", "expl": "The answer states the similarity.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: emphasize similarity between sculptures.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> by Barbara Hepworth include openings through solid forms; the openings allow light to pass through; both works encourage viewers to notice interior and exterior space; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Two sculptures by Barbara Hepworth include openings through solid forms; the openings allow light to pass through; both works encourage viewers to notice interior and exterior space; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。筆記：Barbara Hepworth 的兩件雕塑都在實心造型上開了孔洞；這些孔洞讓光線得以穿透；兩件作品都鼓勵觀眾注意內部與外部的空間；目標是強調相似之處。", "opts": {"A": "One of the sculptures is displayed outdoors.", "B": "Both sculptures use openings through solid forms to draw attention to interior and exterior space.", "C": "Light can pass through the openings in the sculptures.", "D": "Hepworth often worked with abstract forms."}, "optsZh": {"A": "其中一件雕塑展示於戶外。", "B": "兩件雕塑都利用貫穿實心造型的孔洞，引導觀者注意內部與外部的空間。", "C": "光線可以穿過雕塑上的孔洞。", "D": "Hepworth 經常創作抽象造型的作品。"}, "answer": "B", "expl": "The answer emphasizes what the sculptures share.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: generalize about materials in dhow replicas.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Arab dhow was a sailing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vessel\" target=\"_blank\" rel=\"noopener\" data-w=\"vessel\" data-pos=\"n.\" data-en=\"a container such as a pot or bowl\" data-zh=\"器皿；容器\">vessel<\/a> distinguishable by its triangular sails and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stitch\" target=\"_blank\" rel=\"noopener\" data-w=\"stitch\" data-pos=\"v.\" data-en=\"to sew\" data-zh=\"縫；縫合\">stitched<\/a> hull construction.<br>- Dhows were used primarily for trade along the coasts of Arab, South Asian, and East African countries.<br>- Contemporary shipbuilders in Oman use a mix of modern and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> materials to build replicas of ancient dhows.<br>- Most of the materials used are traditional.<br>- Replica hulls are stitched together using the same traditional coconut palm fiber rope used on the hulls of ancient dhows.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The ancient Arab dhow was a sailing vessel distinguishable by its triangular sails and stitched hull construction.\n- Dhows were used primarily for trade along the coasts of Arab, South Asian, and East African countries.\n- Contemporary shipbuilders in Oman use a mix of modern and traditional materials to build replicas of ancient dhows.\n- Most of the materials used are traditional.\n- Replica hulls are stitched together using the same traditional coconut palm fiber rope used on the hulls of ancient dhows.", "stem": "The student wants to make a generalization about the materials used in dhow replicas. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想對單桅帆船複製品所使用的材料做出概括。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一位學生在研究某個主題時，做了以下筆記：\n- 古代阿拉伯單桅帆船（dhow）是一種帆船，特色是三角帆和縫合式船身結構。\n- 單桅帆船主要用於阿拉伯、南亞和東非國家沿岸的貿易。\n- 阿曼的當代造船師混合使用現代與傳統材料，建造古代單桅帆船的複製品。\n- 所使用的材料大多是傳統材料。\n- 複製船的船身是用與古代單桅帆船船身相同的傳統椰子纖維繩縫合而成。", "opts": {"A": "A traditional material that was used to stitch together the hulls of ancient dhows, coconut palm fiber rope is still used by shipbuilders.", "B": "The ancient Arab dhow was a sailing vessel used primarily for trade and distinguishable by its triangular sails.", "C": "Although most materials used in dhow replicas are traditional, some modern materials are used.", "D": "Contemporary shipbuilders in Oman build replicas of the dhow, which was an ancient sailing vessel with a stitched hull construction."}, "optsZh": {"A": "椰子纖維繩是古代用來縫合單桅帆船船身的傳統材料，至今仍被造船師使用。", "B": "古代阿拉伯單桅帆船是一種主要用於貿易、以三角帆為特色的帆船。", "C": "雖然單桅帆船複製品使用的材料大多是傳統的，但也使用了一些現代材料。", "D": "阿曼的當代造船師建造單桅帆船的複製品；單桅帆船是一種具有縫合式船身結構的古代帆船。"}, "answer": "C", "expl": "The notes say most materials are traditional but a mix with modern materials is used; this choice generalizes about all the materials.", "explZh": "筆記指出大多數材料是傳統的，但也混用現代材料；此選項對材料做出了整體的概括。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: generalize about materials in dhow replicas.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicat
