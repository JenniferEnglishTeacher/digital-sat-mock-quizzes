e\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Modern builders of reed boats use bundles of local reeds; some synthetic cord is used for reinforcement; most materials are traditional; the goal is to generalize about materials.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Modern builders of reed boats use bundles of local reeds; some synthetic cord is used for reinforcement; most materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：現代的蘆葦船建造者使用成捆的當地蘆葦；有些合成繩用於加固；大部分材料是傳統的；目標是對材料做出概括。", "opts": {"A": "Although modern reed boats use some synthetic cord, most of their materials are traditional.", "B": "Synthetic cord is sometimes stronger than plant fiber.", "C": "Reed boats can be built for ceremonies and tourism.", "D": "Local reeds are gathered before boat construction begins."}, "optsZh": {"A": "雖然現代蘆葦船使用一些合成繩，但大部分材料是傳統的。", "B": "合成繩有時比植物纖維更堅固。", "C": "蘆葦船可以為了儀式和觀光而建造。", "D": "在開始造船之前，會先採集當地的蘆葦。"}, "answer": "A", "expl": "The answer makes the requested generalization.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: generalize about materials in dhow replicas.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Replica medieval lutes are made mostly from maple, spruce, and gut strings; makers sometimes use modern <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adhesive\" target=\"_blank\" rel=\"noopener\" data-w=\"adhesive\" data-pos=\"n.\" data-en=\"a substance used to stick things together\" data-zh=\"黏著劑\">adhesives<\/a>; the goal is to generalize about materials.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Replica medieval lutes are made mostly from maple, spruce, and gut strings; makers sometimes use modern adhesives; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：複製的中世紀魯特琴大多使用楓木、雲杉和羊腸弦製作；製琴師有時會使用現代黏著劑；目標是對材料做出概括。", "opts": {"A": "Modern adhesives can help stabilize delicate instruments.", "B": "Replica medieval lutes are musical instruments.", "C": "Although replica medieval lutes may use modern adhesives, they are made mostly from traditional materials such as maple, spruce, and gut strings.", "D": "Maple and spruce are common woods in instrument making."}, "optsZh": {"A": "現代黏著劑有助於穩固脆弱的樂器。", "B": "複製的中世紀魯特琴是樂器。", "C": "雖然複製的中世紀魯特琴可能使用現代黏著劑，但大部分仍以楓木、雲杉和羊腸弦等傳統材料製成。", "D": "楓木和雲杉是製作樂器常用的木材。"}, "answer": "C", "expl": "The answer generalizes across materials.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: generalize about materials in dhow replicas.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Contemporary makers of bark canoes use birch bark, cedar ribs, and spruce root lashing; a small amount of waterproof <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthetic\" target=\"_blank\" rel=\"noopener\" data-w=\"synthetic\" data-pos=\"adj.\" data-en=\"made artificially, not natural\" data-zh=\"合成的；人造的\">synthetic<\/a> sealant is sometimes added; most materials are traditional; the goal is to generalize about materials.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Contemporary makers of bark canoes use birch bark, cedar ribs, and spruce root lashing; a small amount of waterproof synthetic sealant is sometimes added; most materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展品目錄會將一位藝術家、一件物品或一場表演，與形塑它的社會及技術條件連結起來呈現。目錄並不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者了解為什麼某個描述或結論是合理的。筆記：當代樹皮獨木舟的製作者使用樺樹皮、雪松肋材和雲杉根綁紮；有時會加入少量防水合成密封劑；大部分材料是傳統的；目標是對材料做出概括。", "opts": {"A": "Cedar ribs help shape the canoe.", "B": "Synthetic sealant can help prevent leaks.", "C": "Birch bark is used on the exterior of many bark canoes.", "D": "Contemporary bark-canoe replicas are built mostly with traditional materials, though some makers add a small amount of modern sealant."}, "optsZh": {"A": "雪松肋材有助於塑造獨木舟的形狀。", "B": "合成密封劑有助於防止漏水。", "C": "許多樹皮獨木舟的外層使用樺樹皮。", "D": "當代的樹皮獨木舟複製品大多以傳統材料建造，雖然有些製作者會加入少量現代密封劑。"}, "answer": "D", "expl": "The answer summarizes the mix of materials.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: generalize about materials in dhow replicas.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Replica Roman sandals use leather soles and straps; some makers add rubber inserts for durability; most visible materials are traditional; the goal is to generalize about materials.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Replica Roman sandals use leather soles and straps; some makers add rubber inserts for durability; most visible materials are traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究指出，當交通、住房、經費及民眾信任度因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個在不同在地條件下採取類似措施的社區的成效。由於證據中既有普遍模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容和僅僅暗示的內容。筆記：複製的羅馬涼鞋使用皮革鞋底和皮革綁帶；有些製作者會加上橡膠鞋墊以增加耐用度；大部分可見的材料是傳統的；目標是對材料做出概括。", "opts": {"A": "Roman sandals had soles and straps.", "B": "Replica Roman sandals are made mostly with traditional visible materials, even though some include modern rubber inserts.", "C": "Leather was widely used in ancient footwear.", "D": "Rubber inserts make some replica sandals more durable."}, "optsZh": {"A": "羅馬涼鞋有鞋底和綁帶。", "B": "複製的羅馬涼鞋大多以傳統的可見材料製成，雖然有些會加入現代的橡膠鞋墊。", "C": "皮革在古代鞋類中被廣泛使用。", "D": "橡膠鞋墊讓一些複製涼鞋更耐用。"}, "answer": "B", "expl": "The answer makes a generalization.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: generalize about materials in dhow replicas.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Builders of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> kites use bamboo frames and paper coverings; nylon thread is sometimes substituted for silk; most materials remain traditional; the goal is to generalize about materials.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Builders of historical kites use bamboo frames and paper coverings; nylon thread is sometimes substituted for silk; most materials remain traditional; the goal is to generalize about materials.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學研究中，結果取決於一連串的觀察，而不是某一次戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才得出一個必須兼具精確與節制的結論。筆記：歷史風箏的製作者使用竹製骨架和紙張覆面；有時會以尼龍線取代絲線；大部分材料仍是傳統的；目標是對材料做出概括。", "opts": {"A": "Nylon thread is a modern material.", "B": "Historical kite replicas usually rely on traditional bamboo and paper, although some builders substitute nylon thread for silk.", "C": "Bamboo frames give kites their shape.", "D": "Silk was traditionally used to control kites."}, "optsZh": {"A": "尼龍線是一種現代材料。", "B": "歷史風箏的複製品通常使用傳統的竹子和紙張，雖然有些製作者會以尼龍線取代絲線。", "C": "竹製骨架賦予風箏形狀。", "D": "傳統上會用絲線來操控風箏。"}, "answer": "B", "expl": "The answer generalizes about the material mix.", "explZh": ""}];
    const SLUG = 'dsat_t6m1';
    const SOURCE = 'Digital SAT Practice Test 6, Module 1';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        sessionWrong[q.id] = { picked, ts: Date.now(), count: (sessionWrong[q.id]?.count || 0) + 1 };
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    const sessionWrong = {}; // questions answered wrong since this page was opened (kept even if fixed later)
    function wrongList(scope = 'all') {
      const w = scope === 'session' ? sessionWrong : loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    // list for downloads: the chosen scope; if "this attempt" is empty, offer the saved list instead
    function dlList() {
      let scope = document.getElementById('dlScope').value;
      let list = wrongList(scope);
      if (!list.length && scope === 'session') {
        const all = wrongList('all');
        if (!all.length) { alert('還沒有錯題 No wrong questions yet. 作答後答錯的題目會自動收錄。'); return null; }
        if (!confirm(`本次作答還沒有錯題。要改下載全部錯題本（${all.length} 題）嗎？\nNo wrong answers in this attempt yet. Download all ${all.length} saved wrong questions instead?`)) return null;
        scope = 'all'; list = all;
      }
      if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return null; }
      return { list, scope, tag: scope === 'session' ? 'this_attempt' : 'all_saved', label: scope === 'session' ? '本次作答 This attempt' : '全部錯題本 All saved' };
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag, label } = sel;
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 · ${label} (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${tag}_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag } = sel;
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${tag}_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // Word handout: Part 1 = redo the questions (no answers), Part 2 = answer key with explanations + 中文翻譯
    document.getElementById('btnDlDoc').onclick = () => {
      const sel = dlList(); if (!sel) return; const { list, tag, label } = sel;
      const d = new Date().toISOString().slice(0,10);
      const body = q => String(q.body || '').replace(/<a\b[^>]*>/g, '').replace(/<\/a>/g, '');
      const opts = q => ['A','B','C','D'].map(L => `<p class="opt">${L}) ${esc(q.opts[L] || '')}</p>`).join('');
      const part1 = list.map(({q}, i) => `<div class="q"><p class="qh">${i+1}. ${esc(q.label)}</p>
        <p>${body(q)}</p><p class="stem">${esc(q.stem || '')}</p>${opts(q)}<p class="ans">Answer 作答：______</p></div>`).join('');
      const part2 = list.map(({q, meta}, i) => `<div class="q"><p class="qh">${i+1}. ${esc(q.label)}　Your answer 你的答案：${esc(meta.picked)}　Correct 正確答案：<b>${esc(q.answer)}</b>${meta.count > 1 ? `　(錯 ${meta.count} 次)` : ''}</p><p class="tag">${esc(q.concept)}</p>
        <p class="ex">${esc(q.expl || '')}</p>${q.explZh ? `<p class="ex">解析：${esc(q.explZh)}</p>` : ''}
        <p class="zh">${esc(q.bodyZh || '')}</p><p class="zh">${esc(q.stemZh || '')}</p>
        ${['A','B','C','D'].map(L => `<p class="zh">${L}) ${esc(q.optsZh[L] || '')}</p>`).join('')}</div>`).join('');
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(SOURCE)} 錯題講義</title>
        <style>body{font-family:Calibri,"Microsoft JhengHei",sans-serif;font-size:11pt;line-height:1.4}h1{font-size:16pt;margin:0}h2{font-size:13pt;border-bottom:1px solid #999;margin-top:18pt}
        .q{margin:0 0 12pt}.qh{font-weight:bold;margin:0 0 4pt}.tag{font-weight:normal;color:#555;font-size:9pt}.stem{font-weight:bold}.opt{margin:0 0 0 18pt}.ans{margin-top:4pt;color:#333}
        .ex{margin:2pt 0;color:#14532d}.zh{margin:2pt 0;color:#5b3a8a;font-size:10pt}p{margin:3pt 0}</style></head><body>
        <h1>${esc(SOURCE)} — 錯題講義 Wrong-Question Review</h1><p>${label} · ${list.length} 題 · ${d}　Name 姓名：____________</p>
        <h2>Part 1 重新作答 Try again (no answers)</h2>${part1}
        <br style="page-break-before:always" clear="all"><h2>Part 2 解答與解析 Answer key & explanations</h2>${part2}</body></html>`;
      download(`${SLUG}_wrong_questions_${tag}_${d}.doc`, html, 'application/msword;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
    if (location.hash.startsWith('#item-')) revealItem(location.hash.slice(1));
  </script>
