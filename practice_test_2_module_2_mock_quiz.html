" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Some songs use a meter also found in older European poetry.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有好幾個國家的學者都在研究這項傳統。", "B": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "C": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Quantitative Evidence: graph data supporting a technology conclusion.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "Both towns had some volunteers.", "D": "The table includes more than one year."}, "optsZh": {"A": "這項計畫在一個社區中進行。", "B": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "兩個城鎮都有一些志工。", "D": "這張表格包含不只一個年份。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Command of Evidence: support a claim about curatorial practice.", "vocab": false, "body": "While attending school in New York City in the 1980s, Okwui Enwezor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> few works by African artists in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibitions<\/a>, despite New York&#x27;s reputation as a place to view <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> art from around the world. An arts journalist claims that later in his career as a curator and art <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a>, Enwezor sought to remedy this deficiency not by focusing solely on modern African artists but by showing how their work fits into the larger context of global modern art and art history.<br><br>Which finding, if true, would most directly support the journalist&#x27;s claim?", "bodyPlain": "While attending school in New York City in the 1980s, Okwui Enwezor encountered few works by African artists in exhibitions, despite New York's reputation as a place to view contemporary art from around the world. An arts journalist claims that later in his career as a curator and art historian, Enwezor sought to remedy this deficiency not by focusing solely on modern African artists but by showing how their work fits into the larger context of global modern art and art history.\n\nWhich finding, if true, would most directly support the journalist's claim?", "stem": "", "stemZh": "", "bodyZh": "1980 年代在紐約市求學期間，Okwui Enwezor 在展覽中很少看到非洲藝術家的作品，儘管紐約素有可欣賞世界各地當代藝術之地的美譽。一位藝術記者主張，Enwezor 在後來擔任策展人與藝術史學家的生涯中，試圖彌補這項不足——方式不是只聚焦於現代非洲藝術家，而是展示他們的作品如何融入全球現代藝術與藝術史的更大脈絡中。\n如果下列哪一項發現屬實，最能直接支持這位記者的主張？", "opts": {"A": "As curator of the Haus der Kunst in Munich, Enwezor organized a retrospective of Ghanaian sculptor El Anatsui's work, one of the largest art exhibitions devoted to a Black artist in Europe's history.", "B": "In Postwar: Art Between the Pacific and the Atlantic, 1945-1965, Enwezor and Katy Siegel brought works by African artists such as Malangatana Ngwenya together with pieces by major figures from other countries, like Andy Warhol and David Siqueiros.", "C": "Enwezor's exhibition The Short Century: Independence and Liberation Movements in Africa, 1945-1994 showed how African independence movements influenced work by African artists of the period.", "D": "Enwezor organized In/sight: African Photographers, 1940 to the Present to demonstrate the broad range of ways African artists approached photography."}, "optsZh": {"A": "身為慕尼黑藝術之家（Haus der Kunst）的策展人，Enwezor 為迦納雕塑家 El Anatsui 舉辦了一場回顧展，這是歐洲史上規模最大的黑人藝術家專題展覽之一。", "B": "在《Postwar: Art Between the Pacific and the Atlantic, 1945-1965》中，Enwezor 與 Katy Siegel 把 Malangatana Ngwenya 等非洲藝術家的作品，與其他國家的重要人物如 Andy Warhol 和 David Siqueiros 的作品並列展出。", "C": "Enwezor 的展覽《The Short Century: Independence and Liberation Movements in Africa, 1945-1994》展示了非洲獨立運動如何影響當時非洲藝術家的作品。", "D": "Enwezor 策劃了《In/sight: African Photographers, 1940 to the Present》展覽，以展示非洲藝術家從事攝影的多元方式。"}, "answer": "B", "expl": "Placing African artists such as Ngwenya alongside Warhol and Siqueiros shows their work within the larger context of global modern art, not in isolation.", "explZh": "把 Ngwenya 等非洲藝術家與 Warhol、Siqueiros 並列展出，正是把他們的作品放在全球現代藝術的大脈絡中，而非單獨呈現。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Command of Evidence: support a claim about curatorial practice.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這個政府從一開始就面臨經濟上的挑戰。」", "C": "「這位領導人在上任的第一個月簽署了數項法令。」", "D": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Command of Evidence: support a claim about curatorial practice.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The graph contains information about three regions.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "有些農民種植蔬菜，而另一些則種植穀物。", "B": "這張圖表包含了三個地區的資訊。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "南部地區也被納入調查之中。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Command of Evidence: support a claim about curatorial practice.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "Some stars contain hydrogen and helium.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有些恆星含有氫和氦。", "D": "有一顆岩質行星擁有稀薄的大氣層。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Command of Evidence: support a claim about curatorial practice.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "Many performers learned songs from relatives.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "有好幾個國家的學者都在研究這項傳統。", "B": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "C": "許多表演者是向親戚學習歌曲的。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Command of Evidence: support a claim about curatorial practice.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program took place in a community.", "C": "Both towns had some volunteers.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "這項計畫在一個社區中進行。", "C": "兩個城鎮都有一些志工。", "D": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Standard English: finite verb in past-to-present statement.", "vocab": false, "body": "For thousands of years, people in the Americas _______ the bottle gourd, a large bitter fruit with a thick rind, to make bottles, other types of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=container\" target=\"_blank\" rel=\"noopener\" data-w=\"container\" data-pos=\"n.\" data-en=\"an object such as a box or bottle used for holding things\" data-zh=\"容器\">containers<\/a>, and even musical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a>. Oddly, there is no <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> that any type of bottle gourd is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=native\" target=\"_blank\" rel=\"noopener\" data-w=\"native\" data-pos=\"adj.\" data-en=\"originally from a particular place\" data-zh=\"本土的；原生的\">native<\/a> to the Western Hemisphere.", "bodyPlain": "For thousands of years, people in the Americas _______ the bottle gourd, a large bitter fruit with a thick rind, to make bottles, other types of containers, and even musical instruments. Oddly, there is no evidence that any type of bottle gourd is native to the Western Hemisphere.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數千年來，美洲的人們 _______ 葫蘆——一種果皮厚、味道苦的大型果實——來製作瓶子、其他種類的容器，甚至樂器。奇怪的是，沒有任何證據顯示有哪一種葫蘆原生於西半球。", "opts": {"A": "to use", "B": "have used", "C": "having used", "D": "using"}, "optsZh": {"A": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "B": "have used（現在完成式，作為主要動詞：正確）", "C": "having used（分詞 → 句子缺少主要動詞：錯誤）", "D": "using（分詞 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The sentence needs a main verb; the present perfect 'have used' fits an action continuing 'for thousands of years.'", "explZh": "句子需要主要動詞；現在完成式「have used」符合「數千年來」持續至今的動作。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Standard English: finite verb in past-to-present statement.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n幾個世紀以來，沿海社區 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "using", "B": "to use", "C": "have used", "D": "having used"}, "optsZh": {"A": "using（分詞 → 句子缺少主要動詞：錯誤）", "B": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "C": "have used（現在完成式，作為主要動詞：正確）", "D": "having used（分詞 → 句子缺少主要動詞：錯誤）"}, "answer": "C", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Standard English: finite verb in past-to-present statement.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗色彩與方塊狀造型。", "opts": {"A": "effects but", "B": "effects", "C": "effects,", "D": "effects, but"}, "optsZh": {"A": "effects but（but 前缺少逗號：錯誤）", "B": "effects（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "C": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "effects, but（逗號＋對等連接詞連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Standard English: finite verb in past-to-present statement.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種更簡單的鎖定機構。", "opts": {"A": "proposed", "B": "had proposed", "C": "was proposing", "D": "proposes"}, "optsZh": {"A": "proposed（一般過去式，與 recommended 一致：正確）", "B": "had proposed（過去完成式 → 時間順序不符：錯誤）", "C": "was proposing（過去進行式 → 不符合單一完成的動作：錯誤）", "D": "proposes（現在式 → 與過去時間 1984 不符：錯誤）"}, "answer": "A", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Standard English: finite verb in past-to-present statement.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位藝術家研究昆蟲學，也就是研究 ______ 的科學，並在遊歷南美洲期間畫了數百幅甲蟲和蝴蝶的圖。", "opts": {"A": "insects, producing", "B": "insects producing", "C": "insects; producing", "D": "insects. Producing"}, "optsZh": {"A": "insects, producing（用逗號結束同位語 the science of insects：正確）", "B": "insects producing（缺少逗號 → 無法結束同位語：錯誤）", "C": "insects; producing（分號後不是獨立子句：錯誤）", "D": "insects. Producing（句號 → 造成句子片段：錯誤）"}, "answer": "A", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Standard English: finite verb in past-to-present statement.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "the focus of many critics has been her religious imagery; they", "B": "many critics have focused on her religious imagery but", "C": "her religious imagery has been the focus of many critics, who", "D": "there are many critics who focused on her religious imagery, but they"}, "optsZh": {"A": "the focus of many critics has been her religious imagery; they（主詞變成 the focus → 修飾語懸垂：錯誤）", "B": "many critics have focused on her religious imagery but（主詞 critics 正是做 interpreting 的人：正確）", "C": "her religious imagery has been the focus of many critics, who（主詞變成「她的宗教意象」→ 修飾語懸垂：錯誤）", "D": "there are many critics who focused on her religious imagery, but they（主詞變成 there → 修飾語懸垂：錯誤）"}, "answer": "B", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English: comma before contrasting but.", "vocab": false, "body": "While many video game creators <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strive\" target=\"_blank\" rel=\"noopener\" data-w=\"strive\" data-pos=\"v.\" data-en=\"to try very hard to achieve something\" data-zh=\"努力；力求\">strive<\/a> to make their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=graphics\" target=\"_blank\" rel=\"noopener\" data-w=\"graphics\" data-pos=\"n.\" data-en=\"pictures and images, especially those produced by a computer\" data-zh=\"圖像；（電腦）畫面\">graphics<\/a> ever more _______ others look to the past, developing titles with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visual\" target=\"_blank\" rel=\"noopener\" data-w=\"visual\" data-pos=\"n.\" data-en=\"an image or picture used to show or explain something\" data-zh=\"視覺效果；影像\">visuals<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> by the &#x27;8-bit&#x27; games of the 1980s and 1990s.", "bodyPlain": "While many video game creators strive to make their graphics ever more _______ others look to the past, developing titles with visuals inspired by the '8-bit' games of the 1980s and 1990s.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "許多電玩創作者努力讓遊戲畫面越來越 _______ 另一些人則回顧過去，開發畫面受 1980 與 1990 年代「8 位元」遊戲啟發的作品。", "opts": {"A": "lifelike but", "B": "lifelike", "C": "lifelike,", "D": "lifelike, but"}, "optsZh": {"A": "lifelike but（While 已表對比，再加 but 多餘：錯誤）", "B": "lifelike（無標點 → 從屬子句與主要子句之間缺少逗號：錯誤）", "C": "lifelike,（逗號分隔 While 引導的從屬子句與主要子句：正確）", "D": "lifelike, but（While 與 but 重複 → 結構錯誤）"}, "answer": "C", "expl": "'While ... lifelike' is a dependent clause, so a comma alone separates it from the main clause 'others look to the past'; adding 'but' would be redundant.", "explZh": "「While ... lifelike」是從屬子句，只需逗號與主要子句「others look to the past」分開；再加 but 就多餘。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English: comma before contrasting but.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n幾個世紀以來，沿海社區 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "have used", "B": "using", "C": "to use", "D": "having used"}, "optsZh": {"A": "have used（現在完成式，作為主要動詞：正確）", "B": "using（分詞 → 句子缺少主要動詞：錯誤）", "C": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "D": "having used（分詞 → 句子缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English: comma before contrasting but.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗色彩與方塊狀造型。", "opts": {"A": "effects but", "B": "effects,", "C": "effects, but", "D": "effects"}, "optsZh": {"A": "effects but（but 前缺少逗號：錯誤）", "B": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "effects, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "D": "effects（無標點 → 兩個獨立子句直接相連：連寫句錯誤）"}, "answer": "C", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English: comma before contrasting but.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種更簡單的鎖定機構。", "opts": {"A": "had proposed", "B": "proposed", "C": "proposes", "D": "was proposing"}, "optsZh": {"A": "had proposed（過去完成式 → 時間順序不符：錯誤）", "B": "proposed（一般過去式，與 recommended 一致：正確）", "C": "proposes（現在式 → 與過去時間 1984 不符：錯誤）", "D": "was proposing（過去進行式 → 不符合單一完成的動作：錯誤）"}, "answer": "B", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English: comma before contrasting but.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位藝術家研究昆蟲學，也就是研究 ______ 的科學，並在遊歷南美洲期間畫了數百幅甲蟲和蝴蝶的圖。", "opts": {"A": "insects producing", "B": "insects; producing", "C": "insects. Producing", "D": "insects, producing"}, "optsZh": {"A": "insects producing（缺少逗號 → 無法結束同位語：錯誤）", "B": "insects; producing（分號後不是獨立子句：錯誤）", "C": "insects. Producing（句號 → 造成句子片段：錯誤）", "D": "insects, producing（用逗號結束同位語 the science of insects：正確）"}, "answer": "D", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English: comma before contrasting but.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "there are many critics who focused on her religious imagery, but they", "B": "the focus of many critics has been her religious imagery; they", "C": "her religious imagery has been the focus of many critics, who", "D": "many critics have focused on her religious imagery but"}, "optsZh": {"A": "there are many critics who focused on her religious imagery, but they（主詞變成 there → 修飾語懸垂：錯誤）", "B": "the focus of many critics has been her religious imagery; they（主詞變成 the focus → 修飾語懸垂：錯誤）", "C": "her religious imagery has been the focus of many critics, who（主詞變成「她的宗教意象」→ 修飾語懸垂：錯誤）", "D": "many critics have focused on her religious imagery but（主詞 critics 正是做 interpreting 的人：正確）"}, "answer": "D", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: tense consistency in narrative.", "vocab": false, "body": "In the 1950s, Joseph McVicker was struggling to keep his business afloat when his sister-in-law Kay Zufall advised him to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=repurpose\" target=\"_blank\" rel=\"noopener\" data-w=\"repurpose\" data-pos=\"v.\" data-en=\"to use something for a different purpose\" data-zh=\"改作他用；重新利用\">repurpose<\/a> the company&#x27;s product, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nontoxic\" target=\"_blank\" rel=\"noopener\" data-w=\"nontoxic\" data-pos=\"adj.\" data-en=\"not poisonous\" data-zh=\"無毒的\">nontoxic<\/a>, clay-like <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=substance\" target=\"_blank\" rel=\"noopener\" data-w=\"substance\" data-pos=\"n.\" data-en=\"a particular kind of material\" data-zh=\"物質\">substance<\/a> for removing soot from wallpaper, as a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=modeling\" target=\"_blank\" rel=\"noopener\" data-w=\"modeling\" data-pos=\"n.\" data-en=\"the use of mathematical or computer models to study something\" data-zh=\"建模\">modeling<\/a> putty for kids. In addition, Zufall _______ selling the product under a child-friendly name: Play-Doh.", "bodyPlain": "In the 1950s, Joseph McVicker was struggling to keep his business afloat when his sister-in-law Kay Zufall advised him to repurpose the company's product, a nontoxic, clay-like substance for removing soot from wallpaper, as a modeling putty for kids. In addition, Zufall _______ selling the product under a child-friendly name: Play-Doh.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "1950 年代，Joseph McVicker 正努力讓他的公司維持營運，這時他的弟媳 Kay Zufall 建議他把公司的產品——一種用來清除壁紙煤灰、無毒的黏土狀物質——改作為兒童用的造型黏土。此外，Zufall _______ 以一個適合兒童的名字來販售這項產品：Play-Doh（培樂多）。", "opts": {"A": "suggested", "B": "suggests", "C": "had suggested", "D": "was suggesting"}, "optsZh": {"A": "suggested（一般過去式，與 advised 一致：正確）", "B": "suggests（現在式 → 與 1950 年代的過去敘事不符：錯誤）", "C": "had suggested（過去完成式 → 不表示更早發生的動作：錯誤）", "D": "was suggesting（過去進行式 → 不符合單一完成的動作：錯誤）"}, "answer": "A", "expl": "The narrative is in the past ('was struggling,' 'advised'), so the simple past 'suggested' keeps the tense consistent.", "explZh": "敘事使用過去式（was struggling、advised），因此用一般過去式「suggested」保持時態一致。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: tense consistency in narrative.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n幾個世紀以來，沿海社區 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "using", "B": "having used", "C": "to use", "D": "have used"}, "optsZh": {"A": "using（分詞 → 句子缺少主要動詞：錯誤）", "B": "having used（分詞 → 句子缺少主要動詞：錯誤）", "C": "to use（不定詞 → 句子缺少主要動詞：錯誤）", "D": "have used（現在完成式，作為主要動詞：正確）"}, "answer": "D", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: tense consistency in narrative.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗色彩與方塊狀造型。", "opts": {"A": "effects,", "B": "effects but", "C": "effects, but", "D": "effects"}, "optsZh": {"A": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "effects but（but 前缺少逗號：錯誤）", "C": "effects, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "D": "effects（無標點 → 兩個獨立子句直接相連：連寫句錯誤）"}, "answer": "C", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: tense consistency in narrative.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種更簡單的鎖定機構。", "opts": {"A": "was proposing", "B": "proposed", "C": "proposes", "D": "had proposed"}, "optsZh": {"A": "was proposing（過去進行式 → 不符合單一完成的動作：錯誤）", "B": "proposed（一般過去式，與 recommended 一致：正確）", "C": "proposes（現在式 → 與過去時間 1984 不符：錯誤）", "D": "had proposed（過去完成式 → 時間順序不符：錯誤）"}, "answer": "B", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: tense consistency in narrative.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位藝術家研究昆蟲學，也就是研究 ______ 的科學，並在遊歷南美洲期間畫了數百幅甲蟲和蝴蝶的圖。", "opts": {"A": "insects, producing", "B": "insects. Producing", "C": "insects producing", "D": "insects; producing"}, "optsZh": {"A": "insects, producing（用逗號結束同位語 the science of insects：正確）", "B": "insects. Producing（句號 → 造成句子片段：錯誤）", "C": "insects producing（缺少逗號 → 無法結束同位語：錯誤）", "D": "insects; producing（分號後不是獨立子句：錯誤）"}, "answer": "A", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: tense consistency in narrative.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "there are many critics who focused on her religious imagery, but they", "B": "the focus of many critics has been her religious imagery; they", "C": "her religious imagery has been the focus of many critics, who", "D": "many critics have focused on her religious imagery but"}, "optsZh": {"A": "there are many critics who focused on her religious imagery, but they（主詞變成 there → 修飾語懸垂：錯誤）", "B": "the focus of many critics has been her religious imagery; they（主詞變成 the focus → 修飾語懸垂：錯誤）", "C": "her religious imagery has been the focus of many critics, who（主詞變成「她的宗教意象」→ 修飾語懸垂：錯誤）", "D": "many critics have focused on her religious imagery but（主詞 critics 正是做 interpreting 的人：正確）"}, "answer": "D", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: punctuation after explanatory appositive phrase.", "vocab": false, "body": "Beatrix Potter is perhaps best known for writing and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrating<\/a> children&#x27;s books such as The Tale of Peter Rabbit (1902), but she also dedicated herself to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mycology\" target=\"_blank\" rel=\"noopener\" data-w=\"mycology\" data-pos=\"n.\" data-en=\"the scientific study of fungi\" data-zh=\"真菌學\">mycology<\/a>, the study of _______ more than 350 paintings of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fungal\" target=\"_blank\" rel=\"noopener\" data-w=\"fungal\" data-pos=\"adj.\" data-en=\"relating to fungi\" data-zh=\"真菌的\">fungal<\/a> species she observed in nature and submitting her research on spore <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=germination\" target=\"_blank\" rel=\"noopener\" data-w=\"germination\" data-pos=\"n.\" data-en=\"the process of a seed or spore beginning to grow\" data-zh=\"發芽；萌發\">germination<\/a> to the Linnean Society of London.", "bodyPlain": "Beatrix Potter is perhaps best known for writing and illustrating children's books such as The Tale of Peter Rabbit (1902), but she also dedicated herself to mycology, the study of _______ more than 350 paintings of the fungal species she observed in nature and submitting her research on spore germination to the Linnean Society of London.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "Beatrix Potter 或許最廣為人知的是撰寫並繪製《The Tale of Peter Rabbit》（彼得兔的故事，1902）等兒童讀物，但她也投身於真菌學，也就是研究 _______ 的學問，她畫了 350 多幅她在大自然中觀察到的真菌物種，並向倫敦林奈學會提交了她關於孢子萌發的研究。", "opts": {"A": "fungi; producing", "B": "fungi. Producing", "C": "fungi producing", "D": "fungi, producing"}, "optsZh": {"A": "fungi; producing（分號後不是獨立子句：錯誤）", "B": "fungi. Producing（句號 → 造成句子片段：錯誤）", "C": "fungi producing（缺少逗號 → 無法結束同位語：錯誤）", "D": "fungi, producing（用逗號結束同位語 the study of fungi：正確）"}, "answer": "D", "expl": "'The study of fungi' is an appositive set off by commas; a comma after 'fungi' closes it before the participial phrase 'producing ...'.", "explZh": "「the study of fungi」是用逗號隔開的同位語；在 fungi 後加逗號結束它，再接分詞片語「producing ...」。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: punctuation after explanatory appositive phrase.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of
