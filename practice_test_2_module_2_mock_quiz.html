B": "insects; producing（分號後不是獨立子句：錯誤）", "C": "insects, producing（用逗號結束同位語 the science of insects：正確）", "D": "insects producing（缺少逗號 → 無法結束同位語：錯誤）"}, "answer": "C", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: punctuation between independent clauses.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "many critics have focused on her religious imagery but", "B": "there are many critics who focused on her religious imagery, but they", "C": "the focus of many critics has been her religious imagery; they", "D": "her religious imagery has been the focus of many critics, who"}, "optsZh": {"A": "many critics have focused on her religious imagery but（主詞 critics 正是做 interpreting 的人：正確）", "B": "there are many critics who focused on her religious imagery, but they（主詞變成 there → 修飾語懸垂：錯誤）", "C": "the focus of many critics has been her religious imagery; they（主詞變成 the focus → 修飾語懸垂：錯誤）", "D": "her religious imagery has been the focus of many critics, who（主詞變成「她的宗教意象」→ 修飾語懸垂：錯誤）"}, "answer": "A", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: semicolon in a complex series.", "vocab": false, "body": "Nigerian author Buchi Emecheta&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrate\" data-pos=\"v.\" data-en=\"to praise someone or something publicly\" data-zh=\"讚揚；頌揚\">celebrated<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> oeuvre includes The Joys of Motherhood, a novel about the changing roles of women in 1950s _______ a television play about the private struggles of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=newlywed\" target=\"_blank\" rel=\"noopener\" data-w=\"newlywed\" data-pos=\"adj.\" data-en=\"recently married\" data-zh=\"新婚的\">newlywed<\/a> couple in Nigeria; and Head Above Water, her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=autobiography\" target=\"_blank\" rel=\"noopener\" data-w=\"autobiography\" data-pos=\"n.\" data-en=\"a book about a person&#x27;s life written by that person\" data-zh=\"自傳\">autobiography<\/a>.", "bodyPlain": "Nigerian author Buchi Emecheta's celebrated literary oeuvre includes The Joys of Motherhood, a novel about the changing roles of women in 1950s _______ a television play about the private struggles of a newlywed couple in Nigeria; and Head Above Water, her autobiography.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "奈及利亞作家 Buchi Emecheta 備受讚譽的文學作品包括：《The Joys of Motherhood》，一部關於 1950 年代 _______ 一齣描寫奈及利亞一對新婚夫妻私人掙扎的電視劇；以及她的自傳《Head Above Water》。", "opts": {"A": "Lagos, A Kind of Marriage,", "B": "Lagos; A Kind of Marriage,", "C": "Lagos, A Kind of Marriage:", "D": "Lagos; A Kind of Marriage"}, "optsZh": {"A": "Lagos, A Kind of Marriage,（系列項目間用逗號 → 無法與含逗號的項目區分：錯誤）", "B": "Lagos; A Kind of Marriage,（分號分隔系列項目、逗號引出同位語：正確）", "C": "Lagos, A Kind of Marriage:（逗號＋冒號 → 標點錯誤）", "D": "Lagos; A Kind of Marriage（分號分隔項目，但缺少逗號引出同位語：錯誤）"}, "answer": "B", "expl": "The series items contain internal commas, so a semicolon separates 'Lagos' from the next item, and a comma follows the title 'A Kind of Marriage' before its description.", "explZh": "系列項目內含逗號，所以用分號把 Lagos 與下一項分開，並在書名「A Kind of Marriage」後用逗號接其說明。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: semicolon in a complex series.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For centuries, coastal communities ______ tidal pools as natural storage areas for shellfish gathered during low tide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n幾個世紀以來，沿海社區 ______ 潮池作為天然的儲存區，存放退潮時採集的貝類。", "opts": {"A": "using", "B": "have used", "C": "having used", "D": "to use"}, "optsZh": {"A": "using（分詞 → 句子缺少主要動詞：錯誤）", "B": "have used（現在完成式，作為主要動詞：正確）", "C": "having used（分詞 → 句子缺少主要動詞：錯誤）", "D": "to use（不定詞 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The present perfect connects past practice to the present.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: semicolon in a complex series.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Many designers seek ever more realistic digital effects, ______ some deliberately preserve the flat colors and blocky shapes of early computer games.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n許多設計師追求越來越逼真的數位效果，______ 有些設計師則刻意保留早期電腦遊戲那種平塗色彩與方塊狀造型。", "opts": {"A": "effects but", "B": "effects", "C": "effects, but", "D": "effects,"}, "optsZh": {"A": "effects but（but 前缺少逗號：錯誤）", "B": "effects（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "C": "effects, but（逗號＋對等連接詞連接兩個獨立子句：正確）", "D": "effects,（只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "C", "expl": "A comma before 'but' joins two independent clauses.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: semicolon in a complex series.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. In 1984, the engineer recommended a cheaper material for the casing. She also ______ a simpler locking mechanism.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n1984 年，這位工程師建議外殼改用較便宜的材料。她也 ______ 一種更簡單的鎖定機構。", "opts": {"A": "had proposed", "B": "was proposing", "C": "proposes", "D": "proposed"}, "optsZh": {"A": "had proposed（過去完成式 → 時間順序不符：錯誤）", "B": "was proposing（過去進行式 → 不符合單一完成的動作：錯誤）", "C": "proposes（現在式 → 與過去時間 1984 不符：錯誤）", "D": "proposed（一般過去式，與 recommended 一致：正確）"}, "answer": "D", "expl": "Simple past matches the narrative time.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: semicolon in a complex series.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The artist studied entomology, the science of ______ hundreds of drawings of beetles and butterflies while traveling through South America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位藝術家研究昆蟲學，也就是研究 ______ 的科學，並在遊歷南美洲期間畫了數百幅甲蟲和蝴蝶的圖。", "opts": {"A": "insects, producing", "B": "insects. Producing", "C": "insects; producing", "D": "insects producing"}, "optsZh": {"A": "insects, producing（用逗號結束同位語 the science of insects：正確）", "B": "insects. Producing（句號 → 造成句子片段：錯誤）", "C": "insects; producing（分號後不是獨立子句：錯誤）", "D": "insects producing（缺少逗號 → 無法結束同位語：錯誤）"}, "answer": "A", "expl": "A comma closes the appositive and introduces the participial phrase.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: semicolon in a complex series.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In interpreting the poems of Sor Juana, ______ have sometimes overlooked her engagement with scientific debates of her era.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在詮釋 Sor Juana 的詩作時，______ 有時忽略了她對當時科學辯論的參與。", "opts": {"A": "the focus of many critics has been her religious imagery; they", "B": "many critics have focused on her religious imagery but", "C": "her religious imagery has been the focus of many critics, who", "D": "there are many critics who focused on her religious imagery, but they"}, "optsZh": {"A": "the focus of many critics has been her religious imagery; they（主詞變成 the focus → 修飾語懸垂：錯誤）", "B": "many critics have focused on her religious imagery but（主詞 critics 正是做 interpreting 的人：正確）", "C": "her religious imagery has been the focus of many critics, who（主詞變成「她的宗教意象」→ 修飾語懸垂：錯誤）", "D": "there are many critics who focused on her religious imagery, but they（主詞變成 there → 修飾語懸垂：錯誤）"}, "answer": "B", "expl": "The introductory phrase needs the logical subject 'many critics'.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: simultaneous contrast.", "vocab": false, "body": "Chimamanda Ngozi Adichie&#x27;s 2013 novel Americanah <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chronicle\" target=\"_blank\" rel=\"noopener\" data-w=\"chronicle\" data-pos=\"v.\" data-en=\"to record events in the order they happened\" data-zh=\"記錄；記述\">chronicles<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=divergent\" target=\"_blank\" rel=\"noopener\" data-w=\"divergent\" data-pos=\"adj.\" data-en=\"developing in different directions; different\" data-zh=\"分歧的；不同的\">divergent<\/a> experiences of Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to attend a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prestigious\" target=\"_blank\" rel=\"noopener\" data-w=\"prestigious\" data-pos=\"adj.\" data-en=\"respected and admired as very important or of high quality\" data-zh=\"有名望的；聲望高的\">prestigious<\/a> university. _______ Obinze travels to London, hoping to start a career there. However, frustrated with the lack of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opportunity\" target=\"_blank\" rel=\"noopener\" data-w=\"opportunity\" data-pos=\"n.\" data-en=\"a chance to do something\" data-zh=\"機會\">opportunities<\/a>, he soon returns to Nigeria.", "bodyPlain": "Chimamanda Ngozi Adichie's 2013 novel Americanah chronicles the divergent experiences of Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to attend a prestigious university. _______ Obinze travels to London, hoping to start a career there. However, frustrated with the lack of opportunities, he soon returns to Nigeria.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "Chimamanda Ngozi Adichie 2013 年的小說《Americanah》（美國佬）記錄了一對年輕的奈及利亞情侶 Ifemelu 與 Obinze 高中畢業後截然不同的經歷。Ifemelu 搬到美國就讀一所著名大學。_______ Obinze 前往倫敦，希望在那裡開創事業。然而，由於對缺乏機會感到沮喪，他很快就回到了奈及利亞。", "opts": {"A": "Meanwhile,", "B": "Nevertheless,", "C": "Secondly,", "D": "In fact,"}, "optsZh": {"A": "Meanwhile,（與此同時；表兩件事同時發生）", "B": "Nevertheless,（儘管如此、然而；表對比）", "C": "Secondly,（其次）", "D": "In fact,（事實上；表強調或補充更強的說法）"}, "answer": "A", "expl": "Ifemelu goes to the US while, at the same time, Obinze goes to London; 'Meanwhile' signals these simultaneous, divergent experiences.", "explZh": "Ifemelu 前往美國，同一時期 Obinze 前往倫敦；「Meanwhile」表示同時發生、各自不同的經歷。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: simultaneous contrast.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer had achieved success in Vienna, where audiences praised his chamber works and critics followed his premieres closely. ______, he felt that his musical imagination depended on returning to the folk songs of his rural birthplace.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer had achieved success in Vienna, where audiences praised his chamber works and critics followed his premieres closely. ______, he felt that his musical imagination depended on returning to the folk songs of his rural birthplace.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這位作曲家在維也納已獲得成功，當地觀眾讚賞他的室內樂作品，評論家也密切關注他的首演。______，他覺得自己的音樂想像力有賴於回歸他鄉村出生地的民謠。", "opts": {"A": "Furthermore,", "B": "Still,", "C": "Therefore,", "D": "For example,"}, "optsZh": {"A": "Furthermore,（此外、而且；表補充）", "B": "Still,（儘管如此、然而；表對比）", "C": "Therefore,（因此；表結果）", "D": "For example,（例如；舉例說明）"}, "answer": "B", "expl": "Still introduces a contrast.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: simultaneous contrast.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The research station offered modern <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratories<\/a>, reliable funding, and access to advanced equipment. ______, several scientists preferred the older field site because it allowed them to observe the animals in their natural habitat.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The research station offered modern laboratories, reliable funding, and access to advanced equipment. ______, several scientists preferred the older field site because it allowed them to observe the animals in their natural habitat.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這個研究站提供現代化的實驗室、穩定的經費以及先進設備。______，好幾位科學家仍偏好較舊的野外研究地點，因為在那裡可以觀察動物在自然棲地中的樣子。", "opts": {"A": "Consequently,", "B": "Indeed,", "C": "Nevertheless,", "D": "Similarly,"}, "optsZh": {"A": "Consequently,（因此、結果；表結果）", "B": "Indeed,（的確、事實上；表強調）", "C": "Nevertheless,（儘管如此、然而；表對比）", "D": "Similarly,（同樣地；表相似）"}, "answer": "C", "expl": "Nevertheless marks contrast.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: simultaneous contrast.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The poet&#x27;s early career seemed firmly rooted in London: she published there, taught there, and joined several literary circles there. ______, she repeatedly wrote that her artistic future lay in returning to the Caribbean.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The poet's early career seemed firmly rooted in London: she published there, taught there, and joined several literary circles there. ______, she repeatedly wrote that her artistic future lay in returning to the Caribbean.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這位詩人的早期生涯似乎牢牢紮根於倫敦：她在那裡出版作品、在那裡教書，也在那裡加入了好幾個文學圈。______，她一再寫道，她的藝術前途在於回到加勒比海。", "opts": {"A": "Yet,", "B": "In addition,", "C": "For instance,", "D": "As a result,"}, "optsZh": {"A": "Yet,（然而；表對比）", "B": "In addition,（此外；表補充）", "C": "For instance,（例如；舉例說明）", "D": "As a result,（因此、結果；表結果）"}, "answer": "A", "expl": "Yet introduces an unexpected contrast.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: simultaneous contrast.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The architect&#x27;s office was thriving in the capital, with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commission\" target=\"_blank\" rel=\"noopener\" data-w=\"commission\" data-pos=\"v.\" data-en=\"to formally ask someone to create a piece of work\" data-zh=\"委託製作\">commissions<\/a> from banks, theaters, and universities. ______, she left to design schools in the small coastal towns where she had grown up.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The architect's office was thriving in the capital, with commissions from banks, theaters, and universities. ______, she left to design schools in the small coastal towns where she had grown up.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位建築師的事務所在首都蓬勃發展，接到來自銀行、劇院和大學的委託案。______，她離開了，去她成長的小型沿海城鎮設計學校。", "opts": {"A": "Likewise,", "B": "Indeed,", "C": "Therefore,", "D": "Even so,"}, "optsZh": {"A": "Likewise,（同樣地；表相似）", "B": "Indeed,（的確、事實上；表強調）", "C": "Therefore,（因此；表結果）", "D": "Even so,（即便如此；表讓步／對比）"}, "answer": "D", "expl": "Even so signals contrast.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transitions: simultaneous contrast.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The actor was receiving major roles in New York and had just won a national award. ______, he decided to move back to his hometown to establish a community theater.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The actor was receiving major roles in New York and had just won a national award. ______, he decided to move back to his hometown to establish a community theater.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這位演員在紐約接到許多重要角色，而且剛獲得一個全國性的獎項。______，他決定搬回家鄉創立一個社區劇團。", "opts": {"A": "For example,", "B": "Accordingly,", "C": "Similarly,", "D": "Still,"}, "optsZh": {"A": "For example,（例如；舉例說明）", "B": "Accordingly,（因此、據此；表結果）", "C": "Similarly,（同樣地；表相似）", "D": "Still,（儘管如此、然而；表對比）"}, "answer": "D", "expl": "Still shows contrast with the expected outcome.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: example.", "vocab": false, "body": "Organisms have evolved a number of surprising adaptations to ensure their survival in adverse <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Tadpole shrimp (Triops longicaudatus) <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=embryo\" target=\"_blank\" rel=\"noopener\" data-w=\"embryo\" data-pos=\"n.\" data-en=\"an animal or plant in the earliest stage of development\" data-zh=\"胚胎\">embryos<\/a>, _______ can pause development for over ten years during <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extend\" target=\"_blank\" rel=\"noopener\" data-w=\"extend\" data-pos=\"v.\" data-en=\"to make something last longer or reach farther\" data-zh=\"延長；擴展\">extended<\/a> periods of drought.", "bodyPlain": "Organisms have evolved a number of surprising adaptations to ensure their survival in adverse conditions. Tadpole shrimp (Triops longicaudatus) embryos, _______ can pause development for over ten years during extended periods of drought.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "生物已演化出許多令人驚訝的適應方式，以確保能在惡劣的環境中生存。蝌蚪蝦（Triops longicaudatus）的胚胎，_______ 能在長期乾旱期間暫停發育長達十年以上。", "opts": {"A": "in contrast,", "B": "for example,", "C": "meanwhile,", "D": "consequently,"}, "optsZh": {"A": "in contrast,（相較之下；表對比）", "B": "for example,（例如）", "C": "meanwhile,（與此同時）", "D": "consequently,（因此、結果）"}, "answer": "B", "expl": "Tadpole shrimp embryos pausing development during drought is an example of a surprising survival adaptation, so 'for example' fits.", "explZh": "蝌蚪蝦胚胎在乾旱時暫停發育是一種令人驚訝的生存適應的例子，所以用「for example」。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: example.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The resin hardens when exposed to air, forming a waterproof layer over the damaged bark. ______, the tree can seal small wounds before insects or fungi enter.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The resin hardens when exposed to air, forming a waterproof layer over the damaged bark. ______, the tree can seal small wounds before insects or fungi enter.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n樹脂接觸空氣後會變硬，在受損的樹皮上形成一層防水層。______，這棵樹能在昆蟲或真菌入侵前封住小傷口。", "opts": {"A": "As a result,", "B": "However,", "C": "For example,", "D": "Similarly,"}, "optsZh": {"A": "As a result,（因此、結果；表結果）", "B": "However,（然而；表轉折／對比）", "C": "For example,（例如；舉例說明）", "D": "Similarly,（同樣地；表相似）"}, "answer": "A", "expl": "The second sentence gives the result of the first.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: example.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The new coating reflects most incoming sunlight rather than absorbing it. ______, roofs treated with the coating remain cooler during summer afternoons.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The new coating reflects most incoming sunlight rather than absorbing it. ______, roofs treated with the coating remain cooler during summer afternoons.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這種新塗層會反射大部分射入的陽光，而不是吸收它。______，塗有這種塗層的屋頂在夏日午後仍能保持較涼爽。", "opts": {"A": "Nevertheless,", "B": "In contrast,", "C": "Consequently,", "D": "For instance,"}, "optsZh": {"A": "Nevertheless,（儘管如此、然而；表對比）", "B": "In contrast,（相反地、相較之下；表對比）", "C": "Consequently,（因此、結果；表結果）", "D": "For instance,（例如；舉例說明）"}, "answer": "C", "expl": "Consequently signals a result.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: example.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The archive converted its handwritten index into a searchable database. ______, researchers can now locate many letters in minutes rather than days.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The archive converted its handwritten index into a searchable database. ______, researchers can now locate many letters in minutes rather than days.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這個檔案館把手寫索引轉換成可搜尋的資料庫。______，研究人員現在只要幾分鐘、而非幾天，就能找到許多信件。", "opts": {"A": "Likewise,", "B": "Still,", "C": "Therefore,", "D": "Instead,"}, "optsZh": {"A": "Likewise,（同樣地；表相似）", "B": "Still,（儘管如此、然而；表對比）", "C": "Therefore,（因此；表結果）", "D": "Instead,（反而、取而代之；表替代）"}, "answer": "C", "expl": "Therefore introduces the result.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: example.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The bridge&#x27;s sensors transmit stress data <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continuously\" target=\"_blank\" rel=\"noopener\" data-w=\"continuously\" data-pos=\"adv.\" data-en=\"without stopping or interruption\" data-zh=\"持續不斷地\">continuously<\/a> to engineers. ______, maintenance teams can identify developing problems before visible cracks appear.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The bridge's sensors transmit stress data continuously to engineers. ______, maintenance teams can identify developing problems before visible cracks appear.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這座橋的感測器會持續把應力數據傳送給工程師。______，維修團隊能在明顯裂縫出現之前就發現正在形成的問題。", "opts": {"A": "Similarly,", "B": "For example,", "C": "However,", "D": "Thus,"}, "optsZh": {"A": "Similarly,（同樣地；表相似）", "B": "For example,（例如；舉例說明）", "C": "However,（然而；表轉折／對比）", "D": "Thus,（因此；表結果）"}, "answer": "D", "expl": "Thus signals a logical result.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: example.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The shells contain tiny chambers that trap air and reduce heat transfer. ______, the animals can remain active in environments where unprotected tissues would overheat.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The shells contain tiny chambers that trap air and reduce heat transfer. ______, the animals can remain active in environments where unprotected tissues would overheat.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這些殼含有能困住空氣、減少熱傳導的微小腔室。______，這些動物能在沒有保護的組織會過熱的環境中保持活動。", "opts": {"A": "Nevertheless,", "B": "As a result,", "C": "In other words,", "D": "By contrast,"}, "optsZh": {"A": "Nevertheless,（儘管如此、然而；表對比）", "B": "As a result,（因此、結果；表結果）", "C": "In other words,（換句話說；表重述）", "D": "By contrast,（相較之下；表對比）"}, "answer": "B", "expl": "As a result links the cause to the effect.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: addition.", "vocab": false, "body": "In 1933, the Twentieth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=amendment\" target=\"_blank\" rel=\"noopener\" data-w=\"amendment\" data-pos=\"n.\" data-en=\"a change made to a law or constitution\" data-zh=\"修正案；修訂\">Amendment<\/a> to the US Constitution was ratified. The amendment <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mandate\" target=\"_blank\" rel=\"noopener\" data-w=\"mandate\" data-pos=\"v.\" data-en=\"to officially require something\" data-zh=\"規定；強制要求\">mandates<\/a> that presidential <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inauguration\" target=\"_blank\" rel=\"noopener\" data-w=\"inauguration\" data-pos=\"n.\" data-en=\"a ceremony at which a new leader officially begins a job\" data-zh=\"就職典禮\">inaugurations<\/a> be held on January 20, approximately ten weeks after the November election. _______ this amendment requires newly elected US senators and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=representative\" target=\"_blank\" rel=\"noopener\" data-w=\"representative\" data-pos=\"adj.\" data-en=\"typical of a larger group\" data-zh=\"具代表性的；典型的\">representatives<\/a> to be sworn into their respective offices on January 3.", "bodyPlain": "In 1933, the Twentieth Amendment to the US Constitution was ratified. The amendment mandates that presidential inaugurations be held on January 20, approximately ten weeks after the November election. _______ this amendment requires newly elected US senators and representatives to be sworn into their respective offices on January 3.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "1933 年，美國憲法第二十條修正案獲得批准。這條修正案規定總統就職典禮須在 1 月 20 日舉行，大約是十一月選舉後十週。_______ 這條修正案要求新當選的美國參議員和眾議員在 1 月 3 日宣誓就任各自的職務。", "opts": {"A": "Instead,", "B": "For instance,", "C": "Specifically,", "D": "In addition,"}, "optsZh": {"A": "Instead,（反而、取而代之；表替代）", "B": "For instance,（例如；舉例說明）", "C": "Specifically,（具體來說；表進一步說明細節）", "D": "In addition,（此外；表補充）"}, "answer": "D", "expl": "The sentence adds a second requirement of the amendment (senators' swearing-in date) to the first (inauguration date), so 'In addition' fits.", "explZh": "這句補充修正案的第二項規定（議員就職日期），接在第一項（總統就職日期）之後，所以用「In addition」。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: addition.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer had achieved success in Vienna, where audiences praised his chamber works and critics followed his premieres closely. ______, he felt that his musical imagination depended on returning to the folk songs of his rural birthplace.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer had achieved success in Vienna, where audiences praised his chamber works and critics followed his premieres closely. ______, he felt that his musical imagination depended on returning to the folk songs of his rural birthplace.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這位作曲家在維也納已獲得成功，當地觀眾讚賞他的室內樂作品，評論家也密切關注他的首演。______，他覺得自己的音樂想像力有賴於回歸他鄉村出生地的民謠。", "opts": {"A": "Still,", "B": "Furthermore,", "C": "Therefore,", "D": "For example,"}, "optsZh": {"A": "Still,（儘管如此、然而；表對比）", "B": "Furthermore,（此外、而且；表補充）", "C": "Therefore,（因此；表結果）", "D": "For example,（例如；舉例說明）"}, "answer": "A", "expl": "Still introduces a contrast.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: addition.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The research station offered modern <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratories<\/a>, reliable funding, and access to advanced equipment. ______, several scientists preferred the older field site because it allowed them to observe the animals in their natural habitat.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The research station offered modern laboratories, reliable funding, and access to advanced equipment. ______, several scientists preferred the older field site because it allowed them to observe the animals in their natural habitat.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這個研究站提供現代化的實驗室、穩定的經費以及先進設備。______，好幾位科學家仍偏好較舊的野外研究地點，因為在那裡可以觀察動物在自然棲地中的樣子。", "opts": {"A": "Indeed,", "B": "Nevertheless,", "C": "Similarly,", "D": "Consequently,"}, "optsZh": {"A": "Indeed,（的確、事實上；表強調）", "B": "Nevertheless,（儘管如此、然而；表對比）", "C": "Similarly,（同樣地；表相似）", "D": "Consequently,（因此、結果；表結果）"}, "answer": "B", "expl": "Nevertheless marks contrast.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: addition.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The poet&#x27;s early career seemed firmly rooted in London: she published there, taught there, and joined several literary circles there. ______, she repeatedly wrote that her artistic future lay in returning to the Caribbean.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The poet's early career seemed firmly rooted in London: she published there, taught there, and joined several literary circles there. ______, she repeatedly wrote that her artistic future lay in returning to the Caribbean.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這位詩人的早期生涯似乎牢牢紮根於倫敦：她在那裡出版作品、在那裡教書，也在那裡加入了好幾個文學圈。______，她一再寫道，她的藝術前途在於回到加勒比海。", "opts": {"A": "As a result,", "B": "In addition,", "C": "For instance,", "D": "Yet,"}, "optsZh": {"A": "As a result,（因此、結果；表結果）", "B": "In addition,（此外；表補充）", "C": "For instance,（例如；舉例說明）", "D": "Yet,（然而；表對比）"}, "answer": "D", "expl": "Yet introduces an unexpected contrast.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: addition.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The architect&#x27;s office was thriving in the capital, with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commission\" target=\"_blank\" rel=\"noopener\" data-w=\"commission\" data-pos=\"v.\" data-en=\"to formally ask someone to create a piece of work\" data-zh=\"委託製作\">commissions<\/a> from banks, theaters, and universities. ______, she left to design schools in the small coastal towns where she had grown up.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The architect's office was thriving in the capital, with commissions from banks, theaters, and universities. ______, she left to design schools in the small coastal towns where she had grown up.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位建築師的事務所在首都蓬勃發展，接到來自銀行、劇院和大學的委託案。______，她離開了，去她成長的小型沿海城鎮設計學校。", "opts": {"A": "Indeed,", "B": "Therefore,", "C": "Even so,", "D": "Likewise,"}, "optsZh": {"A": "Indeed,（的確、事實上；表強調）", "B": "Therefore,（因此；表結果）", "C": "Even so,（即便如此；表讓步／對比）", "D": "Likewise,（同樣地；表相似）"}, "answer": "C", "expl": "Even so signals contrast.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: addition.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The actor was receiving major roles in New York and had just won a national award. ______, he decided to move back to his hometown to establish a community theater.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The actor was receiving major roles in New York and had just won a national award. ______, he decided to move back to his hometown to establish a community theater.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這位演員在紐約接到許多重要角色，而且剛獲得一個全國性的獎項。______，他決定搬回家鄉創立一個社區劇團。", "opts": {"A": "Still,", "B": "Similarly,", "C": "Accordingly,", "D": "For example,"}, "optsZh": {"A": "Still,（儘管如此、然而；表對比）", "B": "Similarly,（同樣地；表相似）", "C": "Accordingly,（因此、據此；表結果）", "D": "For example,（例如；舉例說明）"}, "answer": "A", "expl": "Still shows contrast with the expected outcome.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transitions: parallel comparison.", "vocab": false, "body": "In her poetry collection Thomas and Beulah, Rita Dove <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interweave\" target=\"_blank\" rel=\"noopener\" data-w=\"interweave\" data-pos=\"v.\" data-en=\"to combine closely together\" data-zh=\"交織；使交錯\">interweaves<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=titular\" target=\"_blank\" rel=\"noopener\" data-w=\"titular\" data-pos=\"adj.\" data-en=\"named in the title of a work\" data-zh=\"作品名稱中所提的；書名的\">titular<\/a> characters&#x27; personal stories with broader historical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrative\" target=\"_blank\" rel=\"noopener\" data-w=\"narrative\" data-pos=\"n.\" data-en=\"a story or account of events\" data-zh=\"敘事；故事\">narratives<\/a>. She places Thomas&#x27;s journey from the American South to the Midwest in the early 1900s within the larger context of the Great Migration. _______ Dove sets events from Beulah&#x27;s personal life against the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=backdrop\" target=\"_blank\" rel=\"noopener\" data-w=\"backdrop\" data-pos=\"n.\" data-en=\"the background or conditions in which events happen\" data-zh=\"背景\">backdrop<\/a> of the US Civil Rights Movement.", "bodyPlain": "In her poetry collection Thomas and Beulah, Rita Dove interweaves the titular characters' personal stories with broader historical narratives. She places Thomas's journey from the American South to the Midwest in the early 1900s within the larger context of the Great Migration. _______ Dove sets events from Beulah's personal life against the backdrop of the US Civil Rights Movement.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在詩集《Thomas and Beulah》中，Rita Dove 將書名中兩位主角的個人故事與更廣大的歷史敘事交織在一起。她把 Thomas 在 1900 年代初期從美國南方前往中西部的旅程，放進「大遷徙」這個更大的脈絡中。_______ Dove 把 Beulah 個人生活中的事件，放在美國民權運動的背景下。", "opts": {"A": "Specifically,", "B": "Thus,", "C": "Regardless,", "D": "Similarly,"}, "optsZh": {"A": "Specifically,（具體來說；表進一步說明細節）", "B": "Thus,（因此；表結果）", "C": "Regardless,（無論如何、不管怎樣）", "D": "Similarly,（同樣地；表相似）"}, "answer": "D", "expl": "Dove places Beulah's story in a historical context just as she did with Thomas's, so 'Similarly' signals the parallel.", "explZh": "Dove 把 Beulah 的故事放在歷史背景中，就像她對 Thomas 所做的一樣，因此用「Similarly」表示平行比較。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transitions: parallel comparison.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. During the campaign, volunteers in Boston organized public lectures to raise funds. ______, volunteers in Providence held <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> concerts whose ticket sales supported the same cause.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. During the campaign, volunteers in Boston organized public lectures to raise funds. ______, volunteers in Providence held neighborhood concerts whose ticket sales supported the same cause.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n在這項活動期間，波士頓的志工舉辦公開演講來募款。______，普羅維登斯的志工則舉辦社區音樂會，以門票收入支持同一個目標。", "opts": {"A": "To conclude,", "B": "In other words,", "C": "Nevertheless,", "D": "Similarly,"}, "optsZh": {"A": "To conclude,（總而言之；表總結）", "B": "In other words,（換句話說；表重述）", "C": "Nevertheless,（儘管如此、然而；表對比）", "D": "Similarly,（同樣地；表相似）"}, "answer": "D", "expl": "Similarly introduces a comparable action.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transitions: parallel comparison.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In Chicago, reformers printed pamphlets explaining the proposed law. ______, activists in Detroit <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distribute\" target=\"_blank\" rel=\"noopener\" data-w=\"distribute\" data-pos=\"v.\" data-en=\"to spread or give out over an area or among people\" data-zh=\"分布；分配\">distributed<\/a> illustrated cards summarizing the law&#x27;s major provisions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In Chicago, re
