formers printed pamphlets explaining the proposed law. ______, activists in Detroit distributed illustrated cards summarizing the law's major provisions.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n在芝加哥，改革人士印製小冊子來說明這項擬議中的法律。______，底特律的社運人士發放附有插圖的卡片，摘要說明這項法律的主要條款。", "opts": {"A": "By contrast,", "B": "Instead,", "C": "Likewise,", "D": "However,"}, "optsZh": {"A": "By contrast,（相較之下；表對比）", "B": "Instead,（反而、取而代之；表替代）", "C": "Likewise,（同樣地；表相似）", "D": "However,（然而；表轉折／對比）"}, "answer": "C", "expl": "Likewise indicates a similar example.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transitions: parallel comparison.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. At the northern campus, students collected books for the new library. ______, at the southern campus, student groups gathered maps, journals, and laboratory manuals for the same project.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. At the northern campus, students collected books for the new library. ______, at the southern campus, student groups gathered maps, journals, and laboratory manuals for the same project.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n在北校區，學生為新圖書館募集書籍。______，在南校區，學生社團為同一個計畫蒐集地圖、期刊和實驗手冊。", "opts": {"A": "Similarly,", "B": "Nevertheless,", "C": "Therefore,", "D": "To conclude,"}, "optsZh": {"A": "Similarly,（同樣地；表相似）", "B": "Nevertheless,（儘管如此、然而；表對比）", "C": "Therefore,（因此；表結果）", "D": "To conclude,（總而言之；表總結）"}, "answer": "A", "expl": "Similarly connects parallel actions.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transitions: parallel comparison.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. In one district, residents planted trees along the main road to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or claim is likely to be true\" data-zh=\"支持；證實\">support<\/a> the beautification plan. ______, residents in a neighboring district created small gardens beside public buildings.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. In one district, residents planted trees along the main road to support the beautification plan. ______, residents in a neighboring district created small gardens beside public buildings.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n在某一區，居民沿著主要道路種樹，以支持美化計畫。______，鄰近一區的居民則在公共建築旁打造小花園。", "opts": {"A": "In other words,", "B": "Likewise,", "C": "Consequently,", "D": "However,"}, "optsZh": {"A": "In other words,（換句話說；表重述）", "B": "Likewise,（同樣地；表相似）", "C": "Consequently,（因此、結果；表結果）", "D": "However,（然而；表轉折／對比）"}, "answer": "B", "expl": "Likewise introduces a similar case.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transitions: parallel comparison.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The first group of volunteers translated health notices into Spanish and Vietnamese. ______, another group recorded audio versions of the same notices for residents with limited vision.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The first group of volunteers translated health notices into Spanish and Vietnamese. ______, another group recorded audio versions of the same notices for residents with limited vision.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n第一組志工把衛生公告翻譯成西班牙文和越南文。______，另一組則為視力有限的居民錄製同一批公告的語音版本。", "opts": {"A": "Similarly,", "B": "Still,", "C": "To conclude,", "D": "Therefore,"}, "optsZh": {"A": "Similarly,（同樣地；表相似）", "B": "Still,（儘管如此、然而；表對比）", "C": "To conclude,（總而言之；表總結）", "D": "Therefore,（因此；表結果）"}, "answer": "A", "expl": "Similarly links comparable volunteer efforts.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Rhetorical Synthesis: emphasize distance covered.", "vocab": false, "body": "While researching a topic, a student has taken notes: the Philadelphia and Lancaster Turnpike was a road built between 1792 and 1794; it was the first private turnpike in the United States; it connected Philadelphia and Lancaster in Pennsylvania; it was sixty-two miles long.<br><br>The student wants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to show that something is especially important\" data-zh=\"強調\">emphasize<\/a> the distance covered by the Philadelphia and Lancaster Turnpike. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken notes: the Philadelphia and Lancaster Turnpike was a road built between 1792 and 1794; it was the first private turnpike in the United States; it connected Philadelphia and Lancaster in Pennsylvania; it was sixty-two miles long.\n\nThe student wants to emphasize the distance covered by the Philadelphia and Lancaster Turnpike. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "一名學生在研究某個主題時做了以下筆記：Philadelphia and Lancaster Turnpike 是一條建於 1792 年至 1794 年之間的道路；它是美國第一條私營收費公路；它連接賓州的費城與蘭開斯特；全長六十二英里。\n這名學生想要強調 Philadelphia and Lancaster Turnpike 所涵蓋的距離。哪個選項最有效地運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "The sixty-two-mile-long Philadelphia and Lancaster Turnpike connected the Pennsylvania cities of Philadelphia and Lancaster.", "B": "The Philadelphia and Lancaster Turnpike was the first private turnpike in the United States.", "C": "The Philadelphia and Lancaster Turnpike, which connected two Pennsylvania cities, was built between 1792 and 1794.", "D": "A historic Pennsylvania road, the Philadelphia and Lancaster Turnpike was completed in 1794."}, "optsZh": {"A": "全長六十二英里的 Philadelphia and Lancaster Turnpike 連接賓州的費城與蘭開斯特兩座城市。", "B": "Philadelphia and Lancaster Turnpike 是美國第一條私營收費公路。", "C": "連接賓州兩座城市的 Philadelphia and Lancaster Turnpike 建於 1792 年至 1794 年之間。", "D": "Philadelphia and Lancaster Turnpike 是賓州一條歷史悠久的道路，於 1794 年完工。"}, "answer": "A", "expl": "Only this choice gives the road's length (sixty-two miles) and the two cities it connected, emphasizing the distance covered.", "explZh": "只有這個選項提到道路長度（六十二英里）與所連接的兩座城市，強調了涵蓋的距離。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Rhetorical Synthesis: emphasize distance covered.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A mountain road connects Valley City and Pine Harbor; the road is 74 miles long; it was completed in 1912; the student wants to emphasize distance.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A mountain road connects Valley City and Pine Harbor; the road is 74 miles long; it was completed in 1912; the student wants to emphasize distance.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：一條山路連接 Valley City 與 Pine Harbor；這條路長 74 英里；於 1912 年完工；學生想要強調距離。", "opts": {"A": "The road passes through a mountain region.", "B": "Valley City and Pine Harbor are connected by a road.", "C": "The 74-mile mountain road connects Valley City and Pine Harbor.", "D": "The road was completed in 1912."}, "optsZh": {"A": "這條路穿過一個山區。", "B": "Valley City 與 Pine Harbor 由一條道路相連。", "C": "這條 74 英里長的山路連接 Valley City 與 Pine Harbor。", "D": "這條路於 1912 年完工。"}, "answer": "C", "expl": "The answer emphasizes the distance covered.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Rhetorical Synthesis: emphasize distance covered.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: The Coastal Causeway links Northport and East Island; it measures 18 miles; construction ended in 1965; the goal is to emphasize distance.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: The Coastal Causeway links Northport and East Island; it measures 18 miles; construction ended in 1965; the goal is to emphasize distance.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：Coastal Causeway（海岸堤道）連接 Northport 與 East Island；長 18 英里；於 1965 年完工；目標是強調距離。", "opts": {"A": "The Coastal Causeway spans 18 miles between Northport and East Island.", "B": "The Coastal Causeway was completed in 1965.", "C": "East Island is connected to Northport.", "D": "Causeways can cross water or wetlands."}, "optsZh": {"A": "Coastal Causeway 橫跨 Northport 與 East Island 之間共 18 英里。", "B": "Coastal Causeway 於 1965 年完工。", "C": "East Island 與 Northport 相連。", "D": "堤道可以橫跨水域或濕地。"}, "answer": "A", "expl": "The answer highlights the measured distance.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Rhetorical Synthesis: emphasize distance covered.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: A historic canal connected Milltown and Lake Junction; it ran for 42 miles; it opened in 1821; the goal is to emphasize distance.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A historic canal connected Milltown and Lake Junction; it ran for 42 miles; it opened in 1821; the goal is to emphasize distance.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：一條歷史悠久的運河連接 Milltown 與 Lake Junction；全長 42 英里；於 1821 年開通；目標是強調距離。", "opts": {"A": "The canal connected two communities.", "B": "Milltown and Lake Junction were connected by water.", "C": "The canal opened in 1821.", "D": "The historic canal covered 42 miles between Milltown and Lake Junction."}, "optsZh": {"A": "這條運河連接兩個社區。", "B": "Milltown 與 Lake Junction 由水路相連。", "C": "這條運河於 1821 年開通。", "D": "這條歷史悠久的運河在 Milltown 與 Lake Junction 之間綿延 42 英里。"}, "answer": "D", "expl": "The answer foregrounds the distance.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Rhetorical Synthesis: emphasize distance covered.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: A rail line connected two mining towns; it was 96 kilometers long; it operated by 1908; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to show that something is especially important\" data-zh=\"強調\">emphasize<\/a> distance.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: A rail line connected two mining towns; it was 96 kilometers long; it operated by 1908; the goal is to emphasize distance.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：一條鐵路連接兩個礦業城鎮；全長 96 公里；1908 年時已在營運；目標是強調距離。", "opts": {"A": "The line operated by 1908.", "B": "The rail line served mining towns.", "C": "The rail line stretched 96 kilometers between the two mining towns.", "D": "The towns were connected by rail."}, "optsZh": {"A": "這條鐵路在 1908 年時已經營運。", "B": "這條鐵路為礦業城鎮服務。", "C": "這條鐵路在兩個礦業城鎮之間綿延 96 公里。", "D": "這兩個城鎮由鐵路相連。"}, "answer": "C", "expl": "The answer states the length and endpoints.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Rhetorical Synthesis: emphasize distance covered.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: A desert trail linked two trading posts; it was 53 miles long; merchants used it in the 1880s; the goal is to emphasize distance.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: A desert trail linked two trading posts; it was 53 miles long; merchants used it in the 1880s; the goal is to emphasize distance.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：一條沙漠小徑連接兩個貿易站；全長 53 英里；商人們在 1880 年代使用它；目標是強調距離。", "opts": {"A": "The two trading posts were linked.", "B": "The 53-mile desert trail linked two trading posts used by merchants in the 1880s.", "C": "Merchants used the trail in the 1880s.", "D": "The trail crossed desert terrain."}, "optsZh": {"A": "這兩個貿易站是相連的。", "B": "這條 53 英里長的沙漠小徑連接兩個在 1880 年代為商人所使用的貿易站。", "C": "商人們在 1880 年代使用這條小徑。", "D": "這條小徑穿越沙漠地形。"}, "answer": "B", "expl": "The answer emphasizes the distance covered.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Rhetorical Synthesis: emphasize research aim.", "vocab": false, "body": "While researching a topic, a student has taken notes: most, but not all, of the Moon&#x27;s oxygen comes from the Sun via solar wind; cosmochemist Kentaro Terada wondered if some unaccounted-for oxygen could be coming from Earth; in 2008 he analyzed data from the Japanese satellite Kaguya; based on the data, Terada confirmed that Earth is sending oxygen to the Moon.<br><br>The student wants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to show that something is especially important\" data-zh=\"強調\">emphasize<\/a> the aim of the research study. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken notes: most, but not all, of the Moon's oxygen comes from the Sun via solar wind; cosmochemist Kentaro Terada wondered if some unaccounted-for oxygen could be coming from Earth; in 2008 he analyzed data from the Japanese satellite Kaguya; based on the data, Terada confirmed that Earth is sending oxygen to the Moon.\n\nThe student wants to emphasize the aim of the research study. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "一名學生在研究某個主題時做了以下筆記：月球上的氧大部分（但並非全部）是透過太陽風從太陽而來；宇宙化學家 Kentaro Terada（寺田健太郎）想知道，一些來源不明的氧是否可能來自地球；2008 年，他分析了日本人造衛星「輝夜號」（Kaguya）的數據；根據這些數據，Terada 證實了地球正在把氧送往月球。\n這名學生想要強調這項研究的目的。哪個選項最有效地運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "As it orbited the Moon, the Kaguya satellite collected data that was later analyzed by cosmochemist Kentaro Terada.", "B": "Before 2008, Kentaro Terada wondered if the Moon was receiving some of its oxygen from Earth.", "C": "Cosmochemist Kentaro Terada set out to determine whether some of the Moon's oxygen was coming from Earth.", "D": "Kentaro Terada's study determined that Earth is sending a small amount of oxygen to the Moon."}, "optsZh": {"A": "輝夜號（Kaguya）衛星在環繞月球時蒐集了數據，這些數據後來由宇宙化學家 Kentaro Terada 加以分析。", "B": "2008 年以前，Kentaro Terada 想知道月球是否從地球獲得部分的氧。", "C": "宇宙化學家 Kentaro Terada 著手確定月球上的部分氧是否來自地球。", "D": "Kentaro Terada 的研究確定地球正在把少量的氧送往月球。"}, "answer": "C", "expl": "'Set out to determine whether ...' states the aim of Terada's research — finding out whether some of the Moon's oxygen comes from Earth.", "explZh": "「set out to determine whether ...」說明了 Terada 研究的目的——查明月球上的部分氧是否來自地球。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Rhetorical Synthesis: emphasize research aim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A geologist wondered whether unusual sand on a beach came from a distant volcanic island; she compared mineral samples from both places; the goal is to emphasize the study aim.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A geologist wondered whether unusual sand on a beach came from a distant volcanic island; she compared mineral samples from both places; the goal is to emphasize the study aim.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：一位地質學家想知道海灘上不尋常的沙子是否來自遠方的一座火山島；她比較了兩地的礦物樣本；目標是強調研究目的。", "opts": {"A": "The geologist set out to determine whether unusual beach sand came from a distant volcanic island.", "B": "The geologist compared mineral samples from a beach and a volcanic island.", "C": "The study used mineral comparison.", "D": "The volcanic island contained unusual minerals."}, "optsZh": {"A": "這位地質學家著手確定海灘上不尋常的沙子是否來自遠方的一座火山島。", "B": "這位地質學家比較了來自海灘與火山島的礦物樣本。", "C": "這項研究使用了礦物比對。", "D": "這座火山島含有不尋常的礦物。"}, "answer": "A", "expl": "The answer states the aim.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Rhetorical Synthesis: emphasize research aim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A biologist wondered whether city moths were adapting to artificial light; she tracked moth behavior near lamps; the goal is to emphasize the study aim.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A biologist wondered whether city moths were adapting to artificial light; she tracked moth behavior near lamps; the goal is to emphasize the study aim.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：一位生物學家想知道城市裡的蛾是否正在適應人造光；她追蹤了蛾在路燈附近的行為；目標是強調研究目的。", "opts": {"A": "The study examined moths.", "B": "The biologist tracked moth behavior near lamps.", "C": "Before collecting data, the biologist asked whether city moths were adapting to artificial light.", "D": "Artificial light can affect insects."}, "optsZh": {"A": "這項研究調查了蛾。", "B": "這位生物學家追蹤了蛾在路燈附近的行為。", "C": "在蒐集數據之前，這位生物學家提出了城市裡的蛾是否正在適應人造光的問題。", "D": "人造光可能影響昆蟲。"}, "answer": "C", "expl": "The answer emphasizes what the study was trying to determine.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Rhetorical Synthesis: emphasize research aim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: A historian suspected that a manuscript&#x27;s ink came from two workshops; he analyzed chemical traces in the ink; the goal is to emphasize the study aim.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A historian suspected that a manuscript's ink came from two workshops; he analyzed chemical traces in the ink; the goal is to emphasize the study aim.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：一位歷史學家懷疑某份手稿的墨水來自兩間工坊；他分析了墨水中的化學痕跡；目標是強調研究目的。", "opts": {"A": "The manuscript contained several pages.", "B": "Chemical traces can identify ink sources.", "C": "The historian sought to determine whether the manuscript's ink came from two different workshops.", "D": "The historian analyzed ink."}, "optsZh": {"A": "這份手稿有好幾頁。", "B": "化學痕跡可以辨識墨水的來源。", "C": "這位歷史學家試圖確定這份手稿的墨水是否來自兩間不同的工坊。", "D": "這位歷史學家分析了墨水。"}, "answer": "C", "expl": "The answer states the research aim.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Rhetorical Synthesis: emphasize research aim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: An astronomer wondered whether dust around a star came from a recent collision; she studied infrared data; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to show that something is especially important\" data-zh=\"強調\">emphasize<\/a> the study aim.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: An astronomer wondered whether dust around a star came from a recent collision; she studied infrared data; the goal is to emphasize the study aim.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：一位天文學家想知道某顆恆星周圍的塵埃是否來自一次近期的碰撞；她研究了紅外線數據；目標是強調研究目的。", "opts": {"A": "A collision can create dust.", "B": "The astronomer set out to determine whether the star's dust came from a recent collision.", "C": "Dust can surround young stars.", "D": "The astronomer used infrared data."}, "optsZh": {"A": "碰撞可能產生塵埃。", "B": "這位天文學家著手確定這顆恆星的塵埃是否來自一次近期的碰撞。", "C": "塵埃可能環繞在年輕恆星周圍。", "D": "這位天文學家使用了紅外線數據。"}, "answer": "B", "expl": "The answer emphasizes the aim.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Rhetorical Synthesis: emphasize research aim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: A linguist wondered whether two dialects shared a recent source; she compared pronunciation patterns; the goal is to emphasize the study aim.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: A linguist wondered whether two dialects shared a recent source; she compared pronunciation patterns; the goal is to emphasize the study aim.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：一位語言學家想知道兩種方言是否有共同的近期來源；她比較了發音模式；目標是強調研究目的。", "opts": {"A": "The dialects may have been related.", "B": "The linguist studied two dialects.", "C": "Pronunciation can differ across dialects.", "D": "The linguist investigated whether the two dialects shared a recent source by comparing pronunciation patterns."}, "optsZh": {"A": "這兩種方言可能有關聯。", "B": "這位語言學家研究了兩種方言。", "C": "不同方言的發音可能不同。", "D": "這位語言學家藉由比較發音模式，研究兩種方言是否有共同的近期來源。"}, "answer": "D", "expl": "The answer states the goal of the research.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Rhetorical Synthesis: present study and methodology.", "vocab": false, "body": "While researching a topic, a student has taken notes: ducklings expend up to 62.8% less energy when swimming in a line behind their mother than when swimming alone; naval architect Zhiming Yuan used computer simulations to study the effect of the mother duck&#x27;s wake; the study revealed that ducklings are pushed forward by the wake&#x27;s waves; Yuan <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> this push reduces wave drag on ducklings by 158%.<br><br>The student wants to present the study and its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a>. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses relevant information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken notes: ducklings expend up to 62.8% less energy when swimming in a line behind their mother than when swimming alone; naval architect Zhiming Yuan used computer simulations to study the effect of the mother duck's wake; the study revealed that ducklings are pushed forward by the wake's waves; Yuan determined this push reduces wave drag on ducklings by 158%.\n\nThe student wants to present the study and its methodology. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "一名學生在研究某個主題時做了以下筆記：小鴨排成一列跟在母鴨後面游泳時，消耗的能量比單獨游泳時少達 62.8%；船舶設計師 Zhiming Yuan 用電腦模擬研究母鴨尾流的影響；研究顯示小鴨會被尾流的波浪往前推；Yuan 確定這股推力使小鴨受到的興波阻力減少了 158%。\n這名學生想要介紹這項研究及其研究方法。哪個選項最有效地運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "A study revealed that ducklings, which expend up to 62.8% less energy when swimming in a line behind their mother, also experience 158% less drag.", "B": "Seeking to understand how ducklings swimming in a line behind their mother save energy, Zhiming Yuan used computer simulations to study the effect of the mother duck's wake.", "C": "Zhiming Yuan studied the physics behind the fact that by being pushed in a forward direction by waves, ducklings save energy.", "D": "Naval architect Zhiming Yuan discovered that ducklings are pushed in a forward direction by the waves of their mother's wake, reducing the effect of drag by 158%."}, "optsZh": {"A": "一項研究顯示，小鴨排成一列跟在母鴨後面游泳時消耗的能量少達 62.8%，而且受到的阻力也少了 158%。", "B": "為了了解排成一列跟在母鴨後面游泳的小鴨如何節省能量，Zhiming Yuan 使用電腦模擬來研究母鴨尾流的影響。", "C": "Zhiming Yuan 研究了「小鴨被波浪往前推因而節省能量」這個事實背後的物理原理。", "D": "船舶設計師 Zhiming Yuan 發現，小鴨會被母鴨尾流的波浪往前推，使阻力的影響減少 158%。"}, "answer": "B", "expl": "This choice presents the study's purpose (understanding how ducklings save energy) and its methodology (computer simulations of the mother's wake).", "explZh": "這個選項同時說明研究目的（了解小鴨如何節省能量）與研究方法（以電腦模擬母鴨的尾流）。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Rhetorical Synthesis: present study and methodology.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers wanted to know why young fish save energy when swimming behind adults; they used water-tank simulations; the goal is to present the study and methodology.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Researchers wanted to know why young fish save energy when swimming behind adults; they used water-tank simulations; the goal is to present the study and methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n筆記：研究人員想知道幼魚游在成魚後方時為何能節省能量；他們使用水槽模擬；目標是介紹這項研究及其方法。", "opts": {"A": "A study found that young fish can save energy near adults.", "B": "To investigate why young fish save energy behind adults, researchers used water-tank simulations to model the adults' wake.", "C": "Fish sometimes swim in groups.", "D": "The researchers studied adult fish."}, "optsZh": {"A": "一項研究發現，幼魚在成魚附近可以節省能量。", "B": "為了研究幼魚為何在成魚後方能節省能量，研究人員使用水槽模擬來模擬成魚的尾流。", "C": "魚有時會成群游動。", "D": "研究人員研究了成魚。"}, "answer": "B", "expl": "The answer gives the study purpose and method.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Rhetorical Synthesis: present study and methodology.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Scientists investigated how cyclists reduce air resistance when riding in a line; they used wind-tunnel tests; the goal is to present the study and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a>.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Scientists investigated how cyclists reduce air resistance when riding in a line; they used wind-tunnel tests; the goal is to present the study and methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n筆記：科學家研究自行車騎士排成一列騎乘時如何減少空氣阻力；他們使用風洞測試；目標是介紹這項研究及其方法。", "opts": {"A": "Scientists used wind-tunnel tests to study how cyclists reduce air resistance when riding in a line.", "B": "Cyclists can reduce air resistance in groups.", "C": "Wind tunnels are used in engineering.", "D": "The study involved cyclists."}, "optsZh": {"A": "科學家使用風洞測試，研究自行車騎士排成一列騎乘時如何減少空氣阻力。", "B": "自行車騎士成群騎乘時可以減少空氣阻力。", "C": "風洞被用於工程領域。", "D": "這項研究以自行車騎士為對象。"}, "answer": "A", "expl": "The answer presents both aim and method.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Rhetorical Synthesis: present study and methodology.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: Engineers studied why seeds travel farther in rotating flight; they used computer models of airflow; the goal is to present the study and methodology.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Engineers studied why seeds travel farther in rotating flight; they used computer models of airflow; the goal is to present the study and methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：工程師研究種子為何在旋轉飛行時能飛得更遠；他們使用氣流的電腦模型；目標是介紹這項研究及其方法。", "opts": {"A": "Seeds may travel by wind.", "B": "Computer models are useful in engineering.", "C": "Engineers used computer airflow models to study why rotating flight allows some seeds to travel farther.", "D": "The study examined seed movement."}, "optsZh": {"A": "種子可能藉由風傳播。", "B": "電腦模型在工程上很有用。", "C": "工程師使用氣流的電腦模型，研究為什麼旋轉飛行能讓某些種子飛得更遠。", "D": "這項研究調查了種子的移動。"}, "answer": "C", "expl": "The answer states the study and method.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Rhetorical Synthesis: present study and methodology.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: A team examined how penguins conserve heat in huddles; they used thermal imaging; the goal is to present the study and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a>.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: A team examined how penguins conserve heat in huddles; they used thermal imaging; the goal is to present the study and methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：一個團隊研究企鵝如何在擠成一團時保存熱量；他們使用熱成像技術；目標是介紹這項研究及其方法。", "opts": {"A": "The team studied penguins in cold conditions.", "B": "Thermal imaging detects heat.", "C": "Penguins sometimes form huddles.", "D": "To examine how penguins conserve heat in huddles, the team used thermal imaging."}, "optsZh": {"A": "這個團隊研究了處於寒冷環境中的企鵝。", "B": "熱成像可以偵測熱量。", "C": "企鵝有時會擠成一團。", "D": "為了研究企鵝如何在擠成一團時保存熱量，這個團隊使用了熱成像技術。"}, "answer": "D", "expl": "The answer gives the method and purpose.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Rhetorical Synthesis: present study and methodology.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Researchers studied how leaves shed rainwater quickly; they used high-speed video; the goal is to present the study and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a>.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Researchers studied how leaves shed rainwater quickly; they used high-speed video; the goal is to present the study and methodology.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n筆記：研究人員研究葉子如何快速排掉雨水；他們使用高速攝影；目標是介紹這項研究及其方法。", "opts": {"A": "The study concerned plant surfaces.", "B": "Researchers used high-speed video to study how leaves shed rainwater quickly.", "C": "High-speed video can capture fast motion.", "D": "Leaves are often exposed to rain."}, "optsZh": {"A": "這項研究與植物表面有關。", "B": "研究人員使用高速攝影研究葉子如何快速排掉雨水。", "C": "高速攝影可以捕捉快速的動作。", "D": "葉子經常暴露在雨中。"}, "answer": "B", "expl": "The answer presents the study and its methodology.", "explZh": ""}];
    const SLUG = 'dsat_t2m2';
    const SOURCE = 'Digital SAT Practice Test 2, Module 2';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    function wrongList() {
      const w = loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
    if (location.hash.startsWith('#item-')) revealItem(location.hash.slice(1));
  </script>
