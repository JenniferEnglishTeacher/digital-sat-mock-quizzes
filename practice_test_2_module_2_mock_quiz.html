or", "C": "predictable", "D": "inexplicable"}, "optsZh": {"A": "imaginative（富有想像力的）", "B": "minor（次要的、不重要的）", "C": "predictable（可預測的）", "D": "inexplicable（無法解釋的、費解的）"}, "answer": "A", "expl": "Imaginative means creative or original.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having or showing new and interesting ideas", "zh": "富有想像力的", "word": "imaginative"}, "B": {"pos": "adj.", "en": "small or not very important", "zh": "次要的；較小的；不重要的", "word": "minor"}, "C": {"pos": "adj.", "en": "happening in a way that can be expected", "zh": "可預測的；意料之中的", "word": "predictable"}, "D": {"pos": "adj.", "en": "impossible to explain or understand", "zh": "無法解釋的；費解的", "word": "inexplicable"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: creative or original.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The museum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a> was ______, turning visitors&#x27; shadows into projected constellations that changed as people moved through the room.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The museum installation was ______, turning visitors' shadows into projected constellations that changed as people moved through the room.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這個博物館裝置作品很 ______，它把參觀者的影子變成投影出的星座，並隨著人們在室內走動而變化。", "opts": {"A": "original", "B": "restrained", "C": "incomplete", "D": "traditional"}, "optsZh": {"A": "original（原創的；原本的）", "B": "restrained（克制的、拘謹的）", "C": "incomplete（不完整的）", "D": "traditional（傳統的）"}, "answer": "A", "expl": "Original means new and creative.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "new and different; not copied", "zh": "原創的；新穎的；原本的", "word": "original"}, "B": {"pos": "adj.", "en": "calm and controlled; not showing strong feelings or bold effects", "zh": "克制的；低調的；拘謹的", "word": "restrained"}, "C": {"pos": "adj.", "en": "missing some parts; not finished", "zh": "不完整的；未完成的", "word": "incomplete"}, "D": {"pos": "adj.", "en": "following ways of doing things that have existed for a long time", "zh": "傳統的", "word": "traditional"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: creative or original.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The composer was admired for her ______ use of everyday sounds, transforming subway brakes, footsteps, and market calls into the rhythmic basis of a symphony.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The composer was admired for her ______ use of everyday sounds, transforming subway brakes, footsteps, and market calls into the rhythmic basis of a symphony.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這位作曲家因 ______ 地運用日常聲音而受到讚賞，她把地鐵煞車聲、腳步聲和市場叫賣聲轉化為一首交響曲的節奏基礎。", "opts": {"A": "cautious", "B": "inexplicable", "C": "creative", "D": "literal"}, "optsZh": {"A": "cautious（謹慎的、小心的）", "B": "inexplicable（無法解釋的、費解的）", "C": "creative（有創意的）", "D": "literal（字面上的）"}, "answer": "C", "expl": "Creative means producing something original.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "careful to avoid risks or mistakes", "zh": "謹慎的；小心的", "word": "cautious"}, "B": {"pos": "adj.", "en": "impossible to explain or understand", "zh": "無法解釋的；費解的", "word": "inexplicable"}, "C": {"pos": "adj.", "en": "producing or using new and original ideas", "zh": "有創意的；有創造力的", "word": "creative"}, "D": {"pos": "adj.", "en": "following the most basic, exact meaning of words", "zh": "字面上的；照字面的", "word": "literal"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: varied or including many different types.", "vocab": true, "body": "Some scientists have suggested that mammals in the Mesozoic era were not a very _______ group, but <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=paleontologist\" target=\"_blank\" rel=\"noopener\" data-w=\"paleontologist\" data-pos=\"n.\" data-en=\"a scientist who studies fossils and ancient life\" data-zh=\"古生物學家\">paleontologist<\/a> Zhe-Xi Luo&#x27;s research suggests that early mammals living in the shadow of dinosaurs weren&#x27;t all ground-dwelling <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=insectivore\" target=\"_blank\" rel=\"noopener\" data-w=\"insectivore\" data-pos=\"n.\" data-en=\"an animal that eats insects\" data-zh=\"食蟲動物\">insectivores<\/a>. Fossils of various plant-eating mammals have been found in China, including species like Vilevolodon diplomylos, which Luo says could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=glide\" target=\"_blank\" rel=\"noopener\" data-w=\"glide\" data-pos=\"v.\" data-en=\"to move smoothly through the air without flapping wings\" data-zh=\"滑翔；滑行\">glide<\/a> like a flying <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=squirrel\" target=\"_blank\" rel=\"noopener\" data-w=\"squirrel\" data-pos=\"n.\" data-en=\"a small animal with a long bushy tail that lives in trees\" data-zh=\"松鼠\">squirrel<\/a>.", "bodyPlain": "Some scientists have suggested that mammals in the Mesozoic era were not a very _______ group, but paleontologist Zhe-Xi Luo's research suggests that early mammals living in the shadow of dinosaurs weren't all ground-dwelling insectivores. Fossils of various plant-eating mammals have been found in China, including species like Vilevolodon diplomylos, which Luo says could glide like a flying squirrel.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "有些科學家認為中生代的哺乳動物並不是一個很 _______ 的類群，但古生物學家 Zhe-Xi Luo（羅哲西）的研究顯示，生活在恐龍陰影下的早期哺乳動物並非全都是在地面生活的食蟲動物。在中國已發現多種草食性哺乳動物的化石，包括 Vilevolodon diplomylos 等物種；Luo 表示這種動物能像鼯鼠一樣滑翔。", "opts": {"A": "predatory", "B": "obscure", "C": "diverse", "D": "localized"}, "optsZh": {"A": "predatory（掠食性的）", "B": "obscure（模糊的；鮮為人知的；使隱晦）", "C": "diverse（多樣的、各式各樣的）", "D": "localized（局部的、限於某地的）"}, "answer": "C", "expl": "Luo's research shows early mammals were not all ground-dwelling insectivores (some ate plants, some glided), contradicting the idea that they were not a 'diverse' (varied) group.", "explZh": "Luo 的研究顯示早期哺乳動物並非全是地面食蟲動物（有草食、會滑翔的），反駁了牠們「不夠 diverse（多樣）」的說法。", "defs": {"A": {"pos": "adj.", "en": "living by killing and eating other animals", "zh": "掠食性的；捕食其他動物的", "word": "predatory"}, "B": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "C": {"pos": "adj.", "en": "including many different types of people or things", "zh": "多樣的；各式各樣的", "word": "diverse"}, "D": {"pos": "adj.", "en": "limited to one small area", "zh": "局部的；限於某地的", "word": "localized"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: varied or including many different types.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The island&#x27;s insects were once thought to be a fairly uniform group, but recent surveys show that they are remarkably ______, including burrowing species, pollinators, and predators adapted to high winds.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The island's insects were once thought to be a fairly uniform group, but recent surveys show that they are remarkably ______, including burrowing species, pollinators, and predators adapted to high winds.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這座島上的昆蟲曾被認為是相當單一的類群，但最近的調查顯示牠們非常 ______，包括穴居物種、授粉者，以及適應強風的掠食者。", "opts": {"A": "predatory", "B": "obscure", "C": "diverse", "D": "localized"}, "optsZh": {"A": "predatory（掠食性的）", "B": "obscure（模糊的；鮮為人知的；使隱晦）", "C": "diverse（多樣的、各式各樣的）", "D": "localized（局部的、限於某地的）"}, "answer": "C", "expl": "Diverse means varied.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "living by killing and eating other animals", "zh": "掠食性的；捕食其他動物的", "word": "predatory"}, "B": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "C": {"pos": "adj.", "en": "including many different types of people or things", "zh": "多樣的；各式各樣的", "word": "diverse"}, "D": {"pos": "adj.", "en": "limited to one small area", "zh": "局部的；限於某地的", "word": "localized"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: varied or including many different types.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The archive demonstrates that early radio audiences were ______: letters came not only from urban listeners but also from farmers, factory workers, teachers, and recent immigrants.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The archive demonstrates that early radio audiences were ______: letters came not only from urban listeners but also from farmers, factory workers, teachers, and recent immigrants.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這批檔案顯示早期的廣播聽眾是 ______ 的：來信不僅來自都市聽眾，也來自農民、工廠工人、教師和新移民。", "opts": {"A": "predatory", "B": "localized", "C": "varied", "D": "hidden"}, "optsZh": {"A": "predatory（掠食性的）", "B": "localized（局部的、限於某地的）", "C": "varied（無標點 → 兩個獨立子句直接相連：錯誤）", "D": "hidden（隱藏的）"}, "answer": "C", "expl": "Varied means including different kinds.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "living by killing and eating other animals", "zh": "掠食性的；捕食其他動物的", "word": "predatory"}, "B": {"pos": "adj.", "en": "limited to one small area", "zh": "局部的；限於某地的", "word": "localized"}, "C": {"pos": "adj.", "en": "including many different types", "zh": "各式各樣的；多變的", "word": "varied"}, "D": {"pos": "adj.", "en": "kept out of sight; not easily seen", "zh": "隱藏的；隱蔽的", "word": "hidden"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: varied or including many different types.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The region&#x27;s pottery styles were more ______ than scholars had assumed, ranging from plain cooking vessels to elaborately painted ceremonial bowls.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The region's pottery styles were more ______ than scholars had assumed, ranging from plain cooking vessels to elaborately painted ceremonial bowls.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這個地區的陶器風格比學者原先以為的更 ______，從樸素的炊煮器皿到精心彩繪的祭典用碗都有。", "opts": {"A": "localized", "B": "obscure", "C": "fragile", "D": "heterogeneous"}, "optsZh": {"A": "localized（局部的、限於某地的）", "B": "obscure（模糊的；鮮為人知的；使隱晦）", "C": "fragile（脆弱的）", "D": "heterogeneous（異質的、由不同成分組成的）"}, "answer": "D", "expl": "Heterogeneous means made up of different kinds.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "limited to one small area", "zh": "局部的；限於某地的", "word": "localized"}, "B": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "C": {"pos": "adj.", "en": "easily broken or damaged", "zh": "脆弱的；易碎的", "word": "fragile"}, "D": {"pos": "adj.", "en": "made up of parts or members that are very different from one another", "zh": "異質的；由不同成分組成的", "word": "heterogeneous"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: varied or including many different types.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The fossil site revealed a ______ community of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> mammals, including gliding, swimming, burrowing, and plant-eating species.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The fossil site revealed a ______ community of ancient mammals, including gliding, swimming, burrowing, and plant-eating species.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這個化石遺址揭露了一個 ______ 的古代哺乳動物群落，包括會滑翔、游泳、挖洞以及草食性的物種。", "opts": {"A": "diverse", "B": "minor", "C": "obscure", "D": "localized"}, "optsZh": {"A": "diverse（多樣的、各式各樣的）", "B": "minor（次要的、不重要的）", "C": "obscure（模糊的；鮮為人知的；使隱晦）", "D": "localized（局部的、限於某地的）"}, "answer": "A", "expl": "Diverse means varied in kind.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "including many different types of people or things", "zh": "多樣的；各式各樣的", "word": "diverse"}, "B": {"pos": "adj.", "en": "small or not very important", "zh": "次要的；較小的；不重要的", "word": "minor"}, "C": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "D": {"pos": "adj.", "en": "limited to one small area", "zh": "局部的；限於某地的", "word": "localized"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: varied or including many different types.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The professor rejected the idea that the movement was ideologically narrow, pointing to its ______ membership of labor organizers, artists, clergy, students, and small-business owners.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The professor rejected the idea that the movement was ideologically narrow, pointing to its ______ membership of labor organizers, artists, clergy, students, and small-business owners.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n這位教授反駁這項運動在意識形態上很狹隘的說法，並指出其成員 ______，包括勞工組織者、藝術家、神職人員、學生和小企業主。", "opts": {"A": "predatory", "B": "wide-ranging", "C": "obscure", "D": "localized"}, "optsZh": {"A": "predatory（掠食性的）", "B": "wide-ranging（範圍廣泛的、多方面的）", "C": "obscure（模糊的；鮮為人知的；使隱晦）", "D": "localized（局部的、限於某地的）"}, "answer": "B", "expl": "Wide-ranging means covering many different kinds or areas.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "living by killing and eating other animals", "zh": "掠食性的；捕食其他動物的", "word": "predatory"}, "B": {"pos": "adj.", "en": "covering many different subjects or types", "zh": "範圍廣泛的；多方面的", "word": "wide-ranging"}, "C": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "D": {"pos": "adj.", "en": "limited to one small area", "zh": "局部的；限於某地的", "word": "localized"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Poetry structure: extended comparison.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Gwendolyn Bennett&#x27;s 1926 poem &#x27;Street Lamps in Early Spring.&#x27;<br><br>Night wears a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=garment\" target=\"_blank\" rel=\"noopener\" data-w=\"garment\" data-pos=\"n.\" data-en=\"a piece of clothing\" data-zh=\"衣服；服裝\">garment<\/a><br>All <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=velvet\" target=\"_blank\" rel=\"noopener\" data-w=\"velvet\" data-pos=\"n.\" data-en=\"a soft cloth with a thick smooth surface\" data-zh=\"絲絨；天鵝絨\">velvet<\/a> soft, all violet blue...<br>And over her face she draws a veil<br>As <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=shimmer\" target=\"_blank\" rel=\"noopener\" data-w=\"shimmer\" data-pos=\"v.\" data-en=\"to shine with a soft, unsteady light\" data-zh=\"閃爍；發出微光\">shimmering<\/a> fine as floating dew...<br>And here and there<br>In the black of her hair<br>The subtle hands of Night<br>Move slowly with their gem-starred light.", "bodyPlain": "The following text is adapted from Gwendolyn Bennett's 1926 poem 'Street Lamps in Early Spring.'\n\nNight wears a garment\nAll velvet soft, all violet blue...\nAnd over her face she draws a veil\nAs shimmering fine as floating dew...\nAnd here and there\nIn the black of her hair\nThe subtle hands of Night\nMove slowly with their gem-starred light.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述這段文字的整體結構？", "bodyZh": "以下文字改編自 Gwendolyn Bennett 1926 年的詩作〈Street Lamps in Early Spring〉（早春的街燈）。\n夜穿上一件衣裳\n全然如絲絨般柔軟，全然是紫羅蘭般的藍……\n她在臉上拉起一層面紗\n細緻閃爍，宛如飄浮的露珠……\n而在這裡、在那裡\n在她烏黑的髮間\n夜那雙細膩的手\n帶著綴滿寶石星辰的光，緩緩移動。", "opts": {"A": "It presents alternating descriptions of night in a rural area and in a city.", "B": "It sketches an image of nightfall, then an image of sunrise.", "C": "It makes an extended comparison of night to a human being.", "D": "It portrays how night changes from one season of the year to the next."}, "optsZh": {"A": "它交替描寫鄉村地區與城市中的夜晚。", "B": "它先勾勒夜幕降臨的景象，再描繪日出的景象。", "C": "它把夜晚延伸比喻成一個人。", "D": "它描寫夜晚如何從一年中的某個季節變化到下一個季節。"}, "answer": "C", "expl": "The poem describes Night as a woman who 'wears a garment,' draws a veil over 'her face,' and has 'hands' in 'her hair' — an extended comparison of night to a human being.", "explZh": "詩中把夜描寫成一位女性：她「穿上衣裳」、在「她的臉」上拉起面紗、在「她的髮間」有一雙「手」——這是把夜延伸比喻成人。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Poetry structure: extended comparison.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n在一篇短篇小說的節錄中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園帶著花回來。敘述停留在傍晚的光線、已準備好的房間，以及一位期待已久的訪客即將到來的種種細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To explain why music has lost its importance", "C": "To argue that the characters should leave the house", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "在角色們為某人的到來做準備時，描繪場景與氣氛", "B": "解釋為什麼音樂已失去其重要性", "C": "主張這些角色應該離開這棟房子", "D": "概述兩位親戚之間的衝突"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Poetry structure: extended comparison.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一首詩描寫說話者在黎明時分站在港口邊，看著船隻啟航。這首詩並未敘述一段已完成的旅程，而是強調薄霧、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To present an atmosphere of departure and possibility", "B": "To compare several forms of transportation", "C": "To criticize sailors for taking unnecessary risks", "D": "To list the technical features of a harbor"}, "optsZh": {"A": "呈現一種啟程與充滿可能性的氛圍", "B": "比較幾種不同的交通方式", "C": "批評水手們冒不必要的風險", "D": "列出一座港口的技術特點"}, "answer": "A", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Poetry structure: extended comparison.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一段小說節錄呈現節慶餐會前擁擠的廚房。敘述者注意到擦亮的碗、精心排列的椅子，以及每當屋外響起腳步聲時家人們便停下動作的樣子——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To depict preparations that reveal anticipation within a family", "C": "To contrast rural and urban customs", "D": "To describe a completed celebration from beginning to end"}, "optsZh": {"A": "解釋為什麼這家人不喜歡訪客", "B": "描繪顯露出一家人期待之情的準備工作", "C": "對比鄉村與都市的風俗", "D": "從頭到尾描述一場已經結束的慶祝活動"}, "answer": "B", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Poetry structure: extended comparison.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；相反地，它著重描寫課前那些安靜的例行儀式。", "opts": {"A": "To recount a student's entire academic career", "B": "To evaluate the quality of a school's curriculum", "C": "To argue that early classes should be canceled", "D": "To describe the moments before a significant daily activity begins"}, "optsZh": {"A": "敘述一名學生完整的求學經歷", "B": "評估一所學校課程的品質", "C": "主張應該取消早上的課程", "D": "描述一項重要的日常活動開始前的時刻"}, "answer": "D", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Poetry structure: extended comparison.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一段文學作品呈現雨後的花園：濕漉漉的小徑、明亮的葉子，以及一張放在樹下的長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To reveal the full contents of a letter", "C": "To establish a reflective mood before a character acts", "D": "To compare two different seasons"}, "optsZh": {"A": "提供照顧花園的指示", "B": "揭露一封信的完整內容", "C": "在角色採取行動之前營造一種沉思的氛圍", "D": "比較兩個不同的季節"}, "answer": "C", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Text Structure: function of supporting detail.", "vocab": false, "body": "According to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Vicki L. Ruiz, Mexican American women made crucial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contribution\" target=\"_blank\" rel=\"noopener\" data-w=\"contribution\" data-pos=\"n.\" data-en=\"something you give or do to help achieve something\" data-zh=\"貢獻\">contributions<\/a> to the labor movement during World War II. At the time, food processing companies entered into contracts to supply United States armed forces with canned goods. Increased <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a> quotas conferred greater bargaining power on the companies&#x27; employees, <u>many of whom were Mexican American women<\/u>: employees insisted on more favorable benefits, and employers, who were anxious to fulfill the contracts, complied. Thus, labor activism became a platform for Mexican American women to assert their agency.", "bodyPlain": "According to historian Vicki L. Ruiz, Mexican American women made crucial contributions to the labor movement during World War II. At the time, food processing companies entered into contracts to supply United States armed forces with canned goods. Increased production quotas conferred greater bargaining power on the companies' employees, many of whom were Mexican American women: employees insisted on more favorable benefits, and employers, who were anxious to fulfill the contracts, complied. Thus, labor activism became a platform for Mexican American women to assert their agency.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "根據歷史學家 Vicki L. Ruiz 的說法，墨西哥裔美國女性在第二次世界大戰期間對勞工運動做出了關鍵貢獻。當時，食品加工公司簽訂合約，為美國軍隊供應罐頭食品。提高的生產配額賦予這些公司的員工更大的談判籌碼，而這些員工中有許多是墨西哥裔美國女性：員工堅持要求更優渥的福利，而急於履行合約的雇主也照辦了。因此，勞工運動成為墨西哥裔美國女性展現自身能動性的平台。", "opts": {"A": "It elaborates on a claim about labor relations in a particular industry made earlier in the text.", "B": "It offers an example of a trend in the World War II-era economy discussed earlier in the text.", "C": "It notes a possible exception to the historical narrative of labor activism sketched earlier in the text.", "D": "It provides further details about the identities of the workers discussed earlier in the text."}, "optsZh": {"A": "它詳細說明前文提出的、關於某個特定產業勞資關係的主張。", "B": "它舉出一個例子，說明前文所討論的二戰時期經濟中的某種趨勢。", "C": "它指出前文所描述的勞工運動歷史敘事中一個可能的例外。", "D": "它提供關於前文所討論之工人身分的進一步細節。"}, "answer": "D", "expl": "The underlined portion, 'many of whom were Mexican American women,' tells who the companies' employees were, giving further detail about the workers' identities.", "explZh": "畫底線部分「其中許多是墨西哥裔美國女性」說明了這些公司員工是誰，提供了關於前文工人身分的進一步細節。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Text Structure: function of supporting detail.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一篇科學文章首先說明，每當彗星接近太陽時，它的表面就會改變。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述一項研究，它測試雷達能否解決這個問題，卻發現訊號穿透得不夠深。", "opts": {"A": "It states the study's final conclusion.", "B": "It offers evidence that radar is always reliable.", "C": "It describes how other researchers criticized the work.", "D": "It identifies the uncertainty that motivated the study."}, "optsZh": {"A": "它陳述了這項研究的最終結論。", "B": "它提供了雷達永遠可靠的證據。", "C": "它描述了其他研究人員如何批評這項研究。", "D": "它指出了促成這項研究的不確定之處。"}, "answer": "D", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Text Structure: function of supporting detail.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一篇考古學文章開頭指出，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不清楚，因為附近的道路幾乎沒有留下任何實體痕跡。文章接著討論一個團隊在陶器中尋找化學特徵，但只得出初步的結論。", "opts": {"A": "It contradicts the claim made in the first sentence.", "B": "It shifts the discussion away from archaeology.", "C": "It summarizes the team's strongest result.", "D": "It defines the problem the later investigation attempts to address."}, "optsZh": {"A": "它反駁了第一句中提出的主張。", "B": "它將討論從考古學轉移開來。", "C": "它概述了這個團隊最有力的研究結果。", "D": "它界定了後續研究試圖解決的問題。"}, "answer": "D", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Text Structure: function of supporting detail.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇生物學文章指出，某種植物能夠在長期乾旱中存活。接下來的句子說明，科學家仍不確定是哪一種細胞機制使它得以存活。文章其餘部分描述一項排除了其中一種可能機制的實驗。", "opts": {"A": "It introduces a gap in knowledge that the experiment examines.", "B": "It lists the materials used in the experiment.", "C": "It proves that drought has no effect on plants.", "D": "It gives a historical overview of plant classification."}, "optsZh": {"A": "它引出了這項實驗所探討的知識缺口。", "B": "它列出了實驗中使用的材料。", "C": "它證明了乾旱對植物沒有影響。", "D": "它提供了植物分類的歷史概述。"}, "answer": "A", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Text Structure: function of supporting detail.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A literary analysis begins by noting that a novel&#x27;s ending has often been described as optimistic. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文學分析的開頭指出，一部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋很難站得住腳，因為最後一章包含了好幾個禁錮的意象。段落的其餘部分解釋這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It provides biographical information about the novelist.", "B": "It raises a difficulty with a common interpretation.", "C": "It introduces an unrelated theme.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它提供了關於這位小說家的生平資料。", "B": "它提出了一個常見詮釋所面臨的難題。", "C": "它引入了一個不相關的主題。", "D": "它概述了這部小說的出版歷史。"}, "answer": "B", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Text Structure: function of supporting detail.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一篇科技文章首先說，自主水下載具能夠繪製海底地圖。下一句解釋，它們在狹窄的洞穴中常常失效，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師針對這些條件測試一套新的導航系統。", "opts": {"A": "It announces that the technology is already flawless.", "B": "It compares underwater vehicles with aircraft.", "C": "It explains the limitation that the new system is meant to address.", "D": "It gives a personal anecdote about engineers."}, "optsZh": {"A": "它宣稱這項技術已經完美無缺。", "B": "它將水下載具與飛機加以比較。", "C": "它說明了新系統所要解決的限制。", "D": "它提供了一則關於工程師的個人軼事。"}, "answer": "C", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Literary function: reveal a character's longing.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Zora Neale Hurston&#x27;s 1921 short story &#x27;John Redding Goes to Sea.&#x27; John is a child who lives in a town in the woods.<br><br>Perhaps ten-year-old John was puzzling to the folk there in the Florida woods for he was an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=imaginative\" target=\"_blank\" rel=\"noopener\" data-w=\"imaginative\" data-pos=\"adj.\" data-en=\"having or showing new and interesting ideas\" data-zh=\"富有想像力的\">imaginative<\/a> child and fond of day-dreams. The St. John River flowed a scarce three hundred feet from his back door. On its banks at this point grow <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=numerous\" target=\"_blank\" rel=\"noopener\" data-w=\"numerous\" data-pos=\"adj.\" data-en=\"many\" data-zh=\"眾多的\">numerous<\/a> palms, luxuriant magnolias and bay trees. On the bosom of the stream float millions of delicately colored hyacinths. <u>[John Redding] loved to wander down to the water&#x27;s edge, and, casting in dry twigs, watch them sail away down stream to Jacksonville, the sea, the wide world and [he] wanted to follow them.<\/u>", "bodyPlain": "The following text is adapted from Zora Neale Hurston's 1921 short story 'John Redding Goes to Sea.' John is a child who lives in a town in the woods.\n\nPerhaps ten-year-old John was puzzling to the folk there in the Florida woods for he was an imaginative child and fond of day-dreams. The St. John River flowed a scarce three hundred feet from his back door. On its banks at this point grow numerous palms, luxuriant magnolias and bay trees. On the bosom of the stream float millions of delicately colored hyacinths. [John Redding] loved to wander down to the water's edge, and, casting in dry twigs, watch them sail away down stream to Jacksonville, the sea, the wide world and [he] wanted to follow them.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "以下文字改編自 Zora Neale Hurston 1921 年的短篇小說〈John Redding Goes to Sea〉（John Redding 出海去）。John 是一個住在森林小鎮裡的孩子。\n對佛羅里達森林裡的鄉親來說，十歲的 John 或許令人費解，因為他是個富有想像力、喜歡做白日夢的孩子。St. John 河就在離他家後門不到三百英尺的地方流過。在這一段的河岸上，長著許多棕櫚樹、繁茂的木蘭與月桂樹。河面上漂浮著數以百萬計、顏色淡雅的布袋蓮。[John Redding] 喜歡漫步到水邊，把乾樹枝丟進河裡，看著它們順流漂向 Jacksonville、漂向大海、漂向廣闊的世界——而 [他] 也想跟著它們去。", "opts": {"A": "It provides an extended description of a location that John likes to visit.", "B": "It reveals that some residents of John's town are confused by his behavior.", "C": "It illustrates the uniqueness of John's imagination compared to the imaginations of other children.", "D": "It suggests that John longs to experience a larger life outside the Florida woods."}, "optsZh": {"A": "它對 John 喜歡造訪的一個地點做了詳盡的描述。", "B": "它揭示 John 鎮上的一些居民對他的行為感到困惑。", "C": "它說明 John 的想像力與其他孩子相比有多麼獨特。", "D": "它暗示 John 渴望體驗佛羅里達森林之外更廣闊的人生。"}, "answer": "D", "expl": "John watches the twigs sail 'to Jacksonville, the sea, the wide world' and wants 'to follow them,' suggesting he longs for a larger life beyond the Florida woods.", "explZh": "John 看著樹枝漂向「Jacksonville、大海、廣闊的世界」，並且「想跟著它們去」，暗示他渴望佛羅里達森林以外更廣闊的人生。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Literary function: reveal a character's longing.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一篇科學文章首先說明，每當彗星接近太陽時，它的表面就會改變。第二句指出，由於人們對彗星的內部結構仍了解甚少，研究人員無法準確預測這些變化。最後一句描述一項研究，它測試雷達能否解決這個問題，卻發現訊號穿透得不夠深。", "opts": {"A": "It offers evidence that radar is always reliable.", "B": "It states the study's final conclusion.", "C": "It describes how other researchers criticized the work.", "D": "It identifies the uncertainty that motivated the study."}, "optsZh": {"A": "它提供了雷達永遠可靠的證據。", "B": "它陳述了這項研究的最終結論。", "C": "它描述了其他研究人員如何批評這項研究。", "D": "它指出了促成這項研究的不確定之處。"}, "answer": "D", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Literary function: reveal a character's longing.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一篇考古學文章開頭指出，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不清楚，因為附近的道路幾乎沒有留下任何實體痕跡。文章接著討論一個團隊在陶器中尋找化學特徵，但只得出初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It contradicts the claim made in the first sentence.", "C": "It summarizes the team's strongest result.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它界定了後續研究試圖解決的問題。", "B": "它反駁了第一句中提出的主張。", "C": "它概述了這個團隊最有力的研究結果。", "D": "它將討論從考古學轉移開來。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Literary function: reveal a character's longing.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇生物學文章指出，某種植物能夠在長期乾旱中存活。接下
