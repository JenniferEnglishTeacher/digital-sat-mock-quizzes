來的句子說明，科學家仍不確定是哪一種細胞機制使它得以存活。文章其餘部分描述一項排除了其中一種可能機制的實驗。", "opts": {"A": "It proves that drought has no effect on plants.", "B": "It gives a historical overview of plant classification.", "C": "It introduces a gap in knowledge that the experiment examines.", "D": "It lists the materials used in the experiment."}, "optsZh": {"A": "它證明了乾旱對植物沒有影響。", "B": "它提供了植物分類的歷史概述。", "C": "它引出了這項實驗所探討的知識缺口。", "D": "它列出了實驗中使用的材料。"}, "answer": "C", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Literary function: reveal a character's longing.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A literary analysis begins by noting that a novel&#x27;s ending has often been described as optimistic. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文學分析的開頭指出，一部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋很難站得住腳，因為最後一章包含了好幾個禁錮的意象。段落的其餘部分解釋這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It provides biographical information about the novelist.", "B": "It raises a difficulty with a common interpretation.", "C": "It introduces an unrelated theme.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它提供了關於這位小說家的生平資料。", "B": "它提出了一個常見詮釋所面臨的難題。", "C": "它引入了一個不相關的主題。", "D": "它概述了這部小說的出版歷史。"}, "answer": "B", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Literary function: reveal a character's longing.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一篇科技文章首先說，自主水下載具能夠繪製海底地圖。下一句解釋，它們在狹窄的洞穴中常常失效，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師針對這些條件測試一套新的導航系統。", "opts": {"A": "It announces that the technology is already flawless.", "B": "It explains the limitation that the new system is meant to address.", "C": "It compares underwater vehicles with aircraft.", "D": "It gives a personal anecdote about engineers."}, "optsZh": {"A": "它宣稱這項技術已經完美無缺。", "B": "它說明了新系統所要解決的限制。", "C": "它將水下載具與飛機加以比較。", "D": "它提供了一則關於工程師的個人軼事。"}, "answer": "B", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Literary detail: infer a character's reaction.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Oscar Wilde&#x27;s 1891 novel The Picture of Dorian Gray. Dorian Gray is taking his first look at a portrait that Hallward has painted of him.<br><br>Dorian passed listlessly in front of his picture and turned towards it. When he saw it he drew back, and his cheeks flushed for a moment with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pleasure\" target=\"_blank\" rel=\"noopener\" data-w=\"pleasure\" data-pos=\"n.\" data-en=\"a feeling of happiness or enjoyment\" data-zh=\"快樂\">pleasure<\/a>. A look of joy came into his eyes, as if he had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognized<\/a> himself for the first time. He stood there motionless and in wonder, dimly conscious that Hallward was speaking to him, but not catching the meaning of his words. The sense of his own beauty came on him like a revelation. He had never felt it before.<br><br>According to the text, what is true about Dorian?", "bodyPlain": "The following text is adapted from Oscar Wilde's 1891 novel The Picture of Dorian Gray. Dorian Gray is taking his first look at a portrait that Hallward has painted of him.\n\nDorian passed listlessly in front of his picture and turned towards it. When he saw it he drew back, and his cheeks flushed for a moment with pleasure. A look of joy came into his eyes, as if he had recognized himself for the first time. He stood there motionless and in wonder, dimly conscious that Hallward was speaking to him, but not catching the meaning of his words. The sense of his own beauty came on him like a revelation. He had never felt it before.\n\nAccording to the text, what is true about Dorian?", "stem": "", "stemZh": "", "bodyZh": "以下文字改編自 Oscar Wilde 1891 年的小說《The Picture of Dorian Gray》（格雷的畫像）。Dorian Gray 正第一次觀看 Hallward 為他畫的肖像。\nDorian 無精打采地走過他的畫像前，然後轉身面向它。當他看見它時，他往後退了一步，臉頰因喜悅而泛紅了一會兒。他的眼中閃現喜悅的神情，彷彿第一次認出了自己。他一動也不動地站在那裡，滿心驚奇，隱約意識到 Hallward 正在對他說話，卻沒有聽懂他話中的意思。對自身美貌的感受如同一種啟示般降臨在他身上。他以前從未有過這種感覺。\n根據本文，關於 Dorian 何者為真？", "opts": {"A": "He wants to know Hallward's opinion of the portrait.", "B": "He is delighted by what he sees in the portrait.", "C": "He prefers portraits to other types of paintings.", "D": "He is uncertain of Hallward's talent as an artist."}, "optsZh": {"A": "他想知道 Hallward 對這幅肖像的看法。", "B": "他對自己在肖像中看到的樣子感到欣喜。", "C": "比起其他類型的畫作，他更喜歡肖像畫。", "D": "他不確定 Hallward 作為藝術家的才華。"}, "answer": "B", "expl": "His cheeks 'flushed ... with pleasure' and 'a look of joy' came into his eyes, so Dorian is delighted by what he sees in the portrait.", "explZh": "他的臉頰「因喜悅而泛紅」，眼中出現「喜悅的神情」，因此 Dorian 對肖像中所見感到欣喜。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Literary detail: infer a character's reaction.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.<br><br>According to the text, which choice is best supported?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nAccording to the text, which choice is best supported?", "stem": "", "stemZh": "", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常給年長的親戚建議，因為當別人衝動行事時，她仍能保持冷靜。敘述者強調她的感情是真誠的，但在需要判斷力時，她能克制自己的情緒。\n根據本文，哪個選項最有根據？", "opts": {"A": "She shows unusual maturity and self-command.", "B": "She lacks affection for her family.", "C": "She refuses to give advice to others.", "D": "She is admired mainly for her wealth."}, "optsZh": {"A": "她展現出不尋常的成熟與自制。", "B": "她對家人缺乏感情。", "C": "她拒絕給別人建議。", "D": "她主要因財富而受人景仰。"}, "answer": "A", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Literary detail: infer a character's reaction.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.<br><br>According to the text, which choice is best supported?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nAccording to the text, which choice is best supported?", "stem": "", "stemZh": "", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當她終於提出建議時，屋裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強勢。\n根據本文，哪個選項最有根據？", "opts": {"A": "The grandmother avoids family matters entirely.", "B": "The grandmother's influence is quiet but substantial.", "C": "The narrator thinks patience is useless.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "祖母完全避開家務事。", "B": "祖母的影響力低調卻深遠。", "C": "敘述者認為耐心毫無用處。", "D": "家人忽視祖母的意見。"}, "answer": "B", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Literary detail: infer a character's reaction.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.<br><br>According to the text, which choice is best supported?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nAccording to the text, which choice is best supported?", "stem": "", "stemZh": "", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n一則故事描述一位職員，他會注意到別人已經核准的帳簿中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。\n根據本文，哪個選項最有根據？", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk intentionally creates errors.", "C": "The clerk's carefulness is valuable despite being inconvenient.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這家店因過度謹慎而倒閉。", "B": "這位職員故意製造錯誤。", "C": "這位職員的細心雖然帶來不便，卻很有價值。", "D": "同事們比這位職員更精確。"}, "answer": "C", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Literary detail: infer a character's reaction.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=obvious\" target=\"_blank\" rel=\"noopener\" data-w=\"obvious\" data-pos=\"adj.\" data-en=\"easy to see or understand\" data-zh=\"明顯的\">obvious<\/a>. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.<br><br>According to the text, which choice is best supported?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nAccording to the text, which choice is best supported?", "stem": "", "stemZh": "", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一段文字指出，一位村莊領袖在做決定前會聆聽每一位發言者，即使答案看似顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。\n根據本文，哪個選項最有根據？", "opts": {"A": "The leader is unable to reach conclusions.", "B": "The leader makes decisions without hearing others.", "C": "The leader dislikes public meetings.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人無法做出結論。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人不喜歡公開會議。", "D": "這位領導人重視包容各方的審議。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Literary detail: infer a character's reaction.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.<br><br>According to the text, which choice is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nAccording to the text, which choice is best supported?", "stem": "", "stemZh": "", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n在一段節錄中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期的討論中鼓勵大膽推測，但在每一項測量都經過檢查之前，她不會發表任何主張。\n根據本文，哪個選項最有根據？", "opts": {"A": "She combines intellectual openness with rigorous standards.", "B": "She publishes claims before testing them.", "C": "She rejects all imaginative thinking.", "D": "She avoids working with students."}, "optsZh": {"A": "她兼具開放的求知態度與嚴格的標準。", "B": "她在驗證主張之前就將其發表。", "C": "她排斥一切富有想像力的思考。", "D": "她避免與學生共事。"}, "answer": "A", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Quantitative Evidence: graph data supporting a claim.", "vocab": false, "body": "Economists Kerwin Kofi Charles and Melvin Stephens Jr. investigated factors that influence voter <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=turnout\" target=\"_blank\" rel=\"noopener\" data-w=\"turnout\" data-pos=\"n.\" data-en=\"the number of people who take part in an event such as an election\" data-zh=\"投票率；出席人數\">turnout<\/a> in the United States. Using survey data about whether respondents voted and how knowledgeable they are about politics, Charles and Stephens claim that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=likelihood\" target=\"_blank\" rel=\"noopener\" data-w=\"likelihood\" data-pos=\"n.\" data-en=\"the chance that something will happen\" data-zh=\"可能性\">likelihood<\/a> of voting is driven partly by voters&#x27; confidence in evaluating candidates. In the graph, at each point on a political <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orientation\" target=\"_blank\" rel=\"noopener\" data-w=\"orientation\" data-pos=\"n.\" data-en=\"a person&#x27;s basic beliefs or attitudes\" data-zh=\"傾向；取向\">orientation<\/a> scale from strong Democrat/liberal to strong Republican/conservative, high-information voters have a higher <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=probability\" target=\"_blank\" rel=\"noopener\" data-w=\"probability\" data-pos=\"n.\" data-en=\"how likely it is that something will happen\" data-zh=\"機率；可能性\">probability<\/a> of voting than low-information voters.", "bodyPlain": "Economists Kerwin Kofi Charles and Melvin Stephens Jr. investigated factors that influence voter turnout in the United States. Using survey data about whether respondents voted and how knowledgeable they are about politics, Charles and Stephens claim that likelihood of voting is driven partly by voters' confidence in evaluating candidates. In the graph, at each point on a political orientation scale from strong Democrat/liberal to strong Republican/conservative, high-information voters have a higher probability of voting than low-information voters.", "stem": "Which choice best describes data in the graph that support Charles and Stephens's claim?", "stemZh": "哪個選項最能描述圖表中支持 Charles 與 Stephens 主張的數據？", "bodyZh": "經濟學家 Kerwin Kofi Charles 與 Melvin Stephens Jr. 研究了影響美國投票率的因素。Charles 與 Stephens 利用關於受訪者是否投票以及他們對政治了解程度的調查資料，主張投票的可能性有一部分是由選民評估候選人的信心所驅動。在圖表中，從「強烈民主黨／自由派」到「強烈共和黨／保守派」的政治傾向量表上的每一個點，高資訊選民的投票機率都高於低資訊選民。", "opts": {"A": "At each point on the political orientation scale, high-information voters were more likely than low-information voters to vote.", "B": "Only low-information voters who identify as independents had a voting probability below 50%.", "C": "The closer that low-information voters are to the ends of the political orientation scale, the more likely they were to vote.", "D": "High-information voters were more likely to identify as strong Democrats or strong Republicans than low-information voters were."}, "optsZh": {"A": "在政治傾向量表上的每一個點，高資訊選民的投票可能性都高於低資訊選民。", "B": "只有自認為獨立選民的低資訊選民，投票機率低於 50%。", "C": "低資訊選民越接近政治傾向量表的兩端，投票的可能性就越高。", "D": "與低資訊選民相比，高資訊選民更可能自認為是強烈民主黨或強烈共和黨支持者。"}, "answer": "A", "expl": "If confidence in evaluating candidates drives voting, better-informed voters should vote more; the graph shows high-information voters were more likely to vote at every point on the scale.", "explZh": "若評估候選人的信心會促使投票，資訊較多的選民應更常投票；圖表顯示在量表每一點上，高資訊選民的投票可能性都較高。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Quantitative Evidence: graph data supporting a claim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人在上任的第一個月簽署了數項法令。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這個政府從一開始就面臨經濟上的挑戰。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Quantitative Evidence: graph data supporting a claim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "南部地區也被納入調查之中。", "B": "有些農民種植蔬菜，而另一些則種植穀物。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "這張圖表包含了三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Quantitative Evidence: graph data supporting a claim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Quantitative Evidence: graph data supporting a claim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "B": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "C": "有好幾個國家的學者都在研究這項傳統。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Quantitative Evidence: graph data supporting a claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The table includes more than one year.", "C": "Both towns had some volunteers.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這項計畫在一個社區中進行。", "B": "這張表格包含不只一個年份。", "C": "兩個城鎮都有一些志工。", "D": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Quantitative Evidence: graph data weakening a conclusion.", "vocab": false, "body": "To investigate the effect of lizard predation on spider <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a>, a student placed spiders in two enclosures, one with lizards and one without, and tracked the number of spiders for 30 days. The student <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduction\" target=\"_blank\" rel=\"noopener\" data-w=\"reduction\" data-pos=\"n.\" data-en=\"the act of making something smaller or less\" data-zh=\"減少\">reduction<\/a> in spider population count in the enclosure with lizards by day 30 was entirely attributable to the presence of the lizards. The graph shows that the spider population also <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=substantially\" target=\"_blank\" rel=\"noopener\" data-w=\"substantially\" data-pos=\"adv.\" data-en=\"to a large degree\" data-zh=\"大幅地；實質上\">substantially<\/a> declined in the enclosure without lizards by day 30.", "bodyPlain": "To investigate the effect of lizard predation on spider populations, a student placed spiders in two enclosures, one with lizards and one without, and tracked the number of spiders for 30 days. The student concluded that the reduction in spider population count in the enclosure with lizards by day 30 was entirely attributable to the presence of the lizards. The graph shows that the spider population also substantially declined in the enclosure without lizards by day 30.", "stem": "Which choice best describes data from the graph that weaken the student's conclusion?", "stemZh": "哪個選項最能描述圖表中削弱這名學生結論的數據？", "bodyZh": "為了研究蜥蜴捕食對蜘蛛族群的影響，一名學生把蜘蛛放在兩個圍欄中，一個有蜥蜴、一個沒有，並追蹤蜘蛛數量 30 天。這名學生得出結論：到第 30 天時，有蜥蜴的圍欄中蜘蛛族群數量的減少，完全是因為蜥蜴的存在。圖表顯示，到第 30 天時，沒有蜥蜴的圍欄中，蜘蛛族群也大幅減少。", "opts": {"A": "The spider population count was the same in both enclosures on day 1.", "B": "The spider population count also substantially declined by day 30 in the enclosure without lizards.", "C": "The largest decline in spider population count in the enclosure with lizards occurred from day 1 to day 10.", "D": "The spider population count on day 30 was lower in the enclosure with lizards than in the enclosure without lizards."}, "optsZh": {"A": "第 1 天時，兩個圍欄中的蜘蛛族群數量相同。", "B": "到第 30 天時，沒有蜥蜴的圍欄中，蜘蛛族群數量也大幅減少。", "C": "有蜥蜴的圍欄中，蜘蛛族群數量最大的減少發生在第 1 天到第 10 天之間。", "D": "第 30 天時，有蜥蜴的圍欄中蜘蛛族群數量比沒有蜥蜴的圍欄少。"}, "answer": "B", "expl": "If spiders also declined substantially in the enclosure without lizards, something other than lizards contributed, so the decline was not 'entirely' due to lizards.", "explZh": "如果沒有蜥蜴的圍欄中蜘蛛也大幅減少，就表示有蜥蜴以外的因素，因此減少並非「完全」由蜥蜴造成。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Quantitative Evidence: graph data weakening a conclusion.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人在上任的第一個月簽署了數項法令。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這個政府從一開始就面臨經濟上的挑戰。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Quantitative Evidence: graph data weakening a conclusion.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "南部地區也被納入調查之中。", "B": "有些農民種植蔬菜，而另一些則種植穀物。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "這張圖表包含了三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Quantitative Evidence: graph data weakening a conclusion.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "One rocky planet has a thin atmosphere.", "C": "The method used to study stars requires a telescope.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Quantitative Evidence: graph data weakening a conclusion.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "The tradition is studied by scholars in several countries.", "C": "Some songs use a meter also found in older European poetry.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "B": "有好幾個國家的學者都在研究這項傳統。", "C": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Quantitative Evidence: graph data weakening a conclusion.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The table includes more than one year.", "C": "Both towns had some volunteers.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這項計畫在一個社區中進行。", "B": "這張表格包含不只一個年份。", "C": "兩個城鎮都有一些志工。", "D": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence: support an archaeological conclusion.", "vocab": false, "body": "Archaeologist Petra Vaiglova, anthropologist Xinyi Liu, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> investigated domestication of farm animals in China during the Bronze Age. By analyzing bones of sheep, goats, and cattle, the team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that wild plants made up the bulk of sheep&#x27;s and goats&#x27; diets, while cattle&#x27;s diet consisted largely of millet, a crop cultivated by humans. The team <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that cattle were likely raised closer to human settlements, whereas sheep and goats were allowed to roam farther away.<br><br>Which finding, if true, would most strongly support the team&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a>?", "bodyPlain": "Archaeologist Petra Vaiglova, anthropologist Xinyi Liu, and colleagues investigated domestication of farm animals in China during the Bronze Age. By analyzing bones of sheep, goats, and cattle, the team determined that wild plants made up the bulk of sheep's and goats' diets, while cattle's diet consisted largely of millet, a crop cultivated by humans. The team concluded that cattle were likely raised closer to human settlements, whereas sheep and goats were allowed to roam farther away.\n\nWhich finding, if true, would most strongly support the team's conclusion?", "stem": "", "stemZh": "", "bodyZh": "考古學家 Petra Vaiglova、人類學家 Xinyi Liu 及其同事研究了中國青銅器時代農場動物的馴化。透過分析綿羊、山羊和牛的骨骼，研究團隊確定野生植物構成綿羊和山羊飲食的大部分，而牛的飲食則主要是小米——一種由人類栽種的作物。研究團隊得出結論：牛很可能是在較靠近人類聚落的地方飼養，而綿羊和山羊則被允許漫遊到較遠的地方。\n如果下列哪一項發現屬實，最能有力支持研究團隊的結論？", "opts": {"A": "Analysis of the animal bones showed that the cattle's diet also consisted of wheat, which humans widely cultivated in China during the Bronze Age.", "B": "Further investigation of sheep and goat bones revealed that their diets consisted of small portions of millet as well.", "C": "Cattle's diets generally require larger amounts of food and a greater variety of nutrients than do sheep's and goats' diets.", "D": "The diets of sheep, goats, and cattle were found to vary based on what the farmers in each Bronze Age settlement could grow."}, "optsZh": {"A": "對動物骨骼的分析顯示，牛的飲食中也包含小麥，而小麥是青銅器時代中國人廣泛種植的作物。", "B": "對綿羊和山羊骨骼的進一步研究顯示，牠們的飲食中也包含少量的小米。", "C": "牛的飲食通常比綿羊和山羊需要更大量的食物和更多樣的營養。", "D": "研究發現，綿羊、山羊和牛的飲食會依各青銅器時代聚落的農民能種植什麼作物而有所不同。"}, "answer": "A", "expl": "If cattle also ate wheat, another human-cultivated crop, that further shows they fed on crops near settlements, supporting the conclusion that they were raised close to people.", "explZh": "如果牛也吃小麥這種人類栽種的作物，就更顯示牠們在聚落附近以農作物為食，支持牛是在靠近人類的地方飼養的結論。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence: support an archaeological conclusion.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在上任的第一個月簽署了數項法令。」", "B": "「這個政府從一開始就面臨經濟上的挑戰。」", "C": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Command of Evidence: support an archaeological conclusion.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "南部地區也被納入調查之中。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "這張圖表包含了三個地區的資訊。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Command of Evidence: support an archaeological conclusion.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "Some stars contain hydrogen and helium.", "C": "One rocky planet has a thin atmosphere.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "有些恆星含有氫和氦。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Command of Evidence: support an archaeological conclusion.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\
