"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "The tradition is studied by scholars in several countries.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "B": "有好幾個國家的學者都在研究這項傳統。", "C": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Command of Evidence: support an archaeological conclusion.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The table includes more than one year.", "C": "The program took place in a community.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這張表格包含不只一個年份。", "C": "這項計畫在一個社區中進行。", "D": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Command of Evidence: support a scientific claim.", "vocab": false, "body": "Mosasaurs were large marine reptiles that lived in the Late Cretaceous period. Celina Suarez, Alberto Perez-Huerta, and T. Lynn Harrell Jr. examined oxygen-18 isotopes in mosasaur tooth enamel to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculate\" target=\"_blank\" rel=\"noopener\" data-w=\"calculate\" data-pos=\"v.\" data-en=\"to find an answer using mathematics\" data-zh=\"計算\">calculate<\/a> likely body temperatures and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that mosasaurs were endothermic. They <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> that endothermy would have enabled mosasaurs to include relatively cold polar waters in their range.<br><br>Which finding, if true, would most directly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or claim is likely to be true\" data-zh=\"支持；證實\">support<\/a> Suarez, Perez-Huerta, and Harrell&#x27;s claim?", "bodyPlain": "Mosasaurs were large marine reptiles that lived in the Late Cretaceous period. Celina Suarez, Alberto Perez-Huerta, and T. Lynn Harrell Jr. examined oxygen-18 isotopes in mosasaur tooth enamel to calculate likely body temperatures and determined that mosasaurs were endothermic. They claim that endothermy would have enabled mosasaurs to include relatively cold polar waters in their range.\n\nWhich finding, if true, would most directly support Suarez, Perez-Huerta, and Harrell's claim?", "stem": "", "stemZh": "", "bodyZh": "滄龍是生活在白堊紀晚期的大型海生爬行動物。Celina Suarez、Alberto Perez-Huerta 與 T. Lynn Harrell Jr. 檢驗了滄龍牙釉質中的氧-18 同位素，以計算其可能的體溫，並確定滄龍是內溫動物（溫血動物）。他們主張，內溫性能讓滄龍把相對寒冷的極地水域也納入其活動範圍。\n如果下列哪一項發現屬實，最能直接支持 Suarez、Perez-Huerta 與 Harrell 的主張？", "opts": {"A": "Mosasaurs' likely body temperatures are easier to determine from tooth enamel oxygen-18 isotope data than the body temperatures of nonendothermic Late Cretaceous marine reptiles are.", "B": "Fossils of both mosasaurs and nonendothermic marine reptiles have been found in roughly equal numbers in regions known to be near the poles during the Late Cretaceous, though in lower concentrations than elsewhere.", "C": "Several mosasaur fossils have been found in regions known to be near the poles during the Late Cretaceous, while relatively few fossils of nonendothermic marine reptiles have been found in those locations.", "D": "During the Late Cretaceous, seawater temperatures were likely higher throughout mosasaurs' range, including near the poles, than seawater temperatures at those same latitudes are today."}, "optsZh": {"A": "利用牙釉質氧-18 同位素數據來推算滄龍可能的體溫，比推算白堊紀晚期非內溫性海生爬行動物的體溫更容易。", "B": "在白堊紀晚期已知靠近極地的地區，滄龍與非內溫性海生爬行動物的化石數量大致相同，但濃度都比其他地方低。", "C": "在白堊紀晚期已知靠近極地的地區發現了數具滄龍化石，而在這些地點發現的非內溫性海生爬行動物化石則相對較少。", "D": "在白堊紀晚期，滄龍整個活動範圍（包括極地附近）的海水溫度，可能都比今天同緯度的海水溫度高。"}, "answer": "C", "expl": "Finding many mosasaur fossils but few nonendothermic reptile fossils near the poles suggests endothermy let mosasaurs live in cold polar waters.", "explZh": "在極地附近發現許多滄龍化石，非內溫性爬行動物化石卻很少，顯示內溫性讓滄龍能生活在寒冷的極地水域。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Command of Evidence: support a scientific claim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在上任的第一個月簽署了數項法令。」", "C": "「這個政府從一開始就面臨經濟上的挑戰。」", "D": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Command of Evidence: support a scientific claim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "The graph contains information about three regions.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "南部地區也被納入調查之中。", "B": "這張圖表包含了三個地區的資訊。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Command of Evidence: support a scientific claim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "One rocky planet has a thin atmosphere.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Command of Evidence: support a scientific claim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Some songs use a meter also found in older European poetry.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "B": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "C": "有好幾個國家的學者都在研究這項傳統。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Command of Evidence: support a scientific claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The program took place in a community.", "D": "The table includes more than one year."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "這項計畫在一個社區中進行。", "D": "這張表格包含不只一個年份。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Command of Evidence: support a food-web hypothesis.", "vocab": false, "body": "Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that a decline in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> of dusky sharks near the mid-Atlantic coast of North America led to a decline in the population of eastern oysters in the region. Dusky sharks do not typically consume eastern oysters but do consume cownose rays, which are the main <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a> of the oysters.<br><br>Which finding, if true, would most directly support the researchers&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a>?", "bodyPlain": "Researchers hypothesized that a decline in the population of dusky sharks near the mid-Atlantic coast of North America led to a decline in the population of eastern oysters in the region. Dusky sharks do not typically consume eastern oysters but do consume cownose rays, which are the main predators of the oysters.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?", "stem": "", "stemZh": "", "bodyZh": "研究人員假設，北美洲中大西洋沿岸附近暗色真鯊族群的減少，導致該地區東部牡蠣族群的減少。暗色真鯊通常不吃東部牡蠣，但會吃牛鼻鱝，而牛鼻鱝正是牡蠣的主要掠食者。\n如果下列哪一項發現屬實，最能直接支持研究人員的假設？", "opts": {"A": "Declines in the regional abundance of dusky sharks' prey other than cownose rays are associated with regional declines in dusky shark abundance.", "B": "Eastern oyster abundance tends to be greater in areas with both dusky sharks and cownose rays than in areas with only dusky sharks.", "C": "Consumption of eastern oysters by cownose rays in the region substantially increased before the regional decline in dusky shark abundance began.", "D": "Cownose rays have increased in regional abundance as dusky sharks have decreased in regional abundance."}, "optsZh": {"A": "暗色真鯊除了牛鼻鱝以外的其他獵物在該地區的數量下降，與暗色真鯊在該地區數量的下降有關。", "B": "在同時有暗色真鯊和牛鼻鱝的區域，東部牡蠣的數量往往比只有暗色真鯊的區域多。", "C": "在該地區暗色真鯊數量開始減少之前，牛鼻鱝對東部牡蠣的捕食就已大幅增加。", "D": "隨著暗色真鯊在該地區的數量減少，牛鼻鱝在該地區的數量增加了。"}, "answer": "D", "expl": "The hypothesis links fewer sharks to more rays (their oyster-eating prey); finding that rays increased as sharks decreased supports that chain.", "explZh": "假設的因果鏈是：鯊魚減少 → 吃牡蠣的牛鼻鱝增加 → 牡蠣減少；發現鯊魚減少時牛鼻鱝增加，正支持這個推論。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Command of Evidence: support a food-web hypothesis.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」", "B": "「這個政府從一開始就面臨經濟上的挑戰。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "A", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Command of Evidence: support a food-web hypothesis.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "這張圖表包含了三個地區的資訊。", "B": "有些農民種植蔬菜，而另一些則種植穀物。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "南部地區也被納入調查之中。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Command of Evidence: support a food-web hypothesis.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "One rocky planet has a thin atmosphere.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Command of Evidence: support a food-web hypothesis.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "The tradition is studied by scholars in several countries.", "C": "Some songs use a meter also found in older European poetry.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "許多表演者是向親戚學習歌曲的。", "B": "有好幾個國家的學者都在研究這項傳統。", "C": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "D": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Command of Evidence: support a food-web hypothesis.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The program took place in a community.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "這項計畫在一個社區中進行。", "D": "兩個城鎮都有一些志工。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Command of Evidence: weaken a traditional-view claim.", "vocab": false, "body": "Political scientists who favor the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditional\" target=\"_blank\" rel=\"noopener\" data-w=\"traditional\" data-pos=\"adj.\" data-en=\"following ways of doing things that have existed for a long time\" data-zh=\"傳統的\">traditional<\/a> view of voter behavior <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> that voting in an election does not change a voter&#x27;s attitude toward the candidates in that election. Ebonya Washington and Sendhil Mullainathan tested this claim by comparing subjects who had just become old enough to vote with otherwise similar subjects who were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=slightly\" target=\"_blank\" rel=\"noopener\" data-w=\"slightly\" data-pos=\"adv.\" data-en=\"a little\" data-zh=\"稍微；略微\">slightly<\/a> too young to vote. They compared attitudes toward the winning candidate two years after each election.<br><br>Which finding from Washington and Mullainathan&#x27;s study, if true, would most directly weaken the traditional view?", "bodyPlain": "Political scientists who favor the traditional view of voter behavior claim that voting in an election does not change a voter's attitude toward the candidates in that election. Ebonya Washington and Sendhil Mullainathan tested this claim by comparing subjects who had just become old enough to vote with otherwise similar subjects who were slightly too young to vote. They compared attitudes toward the winning candidate two years after each election.\n\nWhich finding from Washington and Mullainathan's study, if true, would most directly weaken the traditional view?", "stem": "", "stemZh": "", "bodyZh": "支持傳統選民行為觀點的政治學家主張，在一場選舉中投票並不會改變選民對該次選舉候選人的態度。Ebonya Washington 與 Sendhil Mullainathan 檢驗了這項主張，他們比較了剛達到投票年齡的受試者，以及其他條件相似但年紀稍微不足、還不能投票的受試者。他們比較了每次選舉兩年後受試者對當選候選人的態度。\n如果 Washington 與 Mullainathan 研究中的下列哪一項發現屬實，最能直接削弱傳統觀點？", "opts": {"A": "Subjects' attitudes toward the winning candidate two years after a given election were strongly predicted by subjects' general political orientation, regardless of whether subjects were old enough to vote.", "B": "Subjects who were not old enough to vote in a given election held significantly more positive attitudes towards the winning candidate two years later than they held at the time of the election.", "C": "Subjects who voted in a given election held significantly more polarized attitudes toward the winning candidate two years later than did subjects who were not old enough to vote in that election.", "D": "Two years after a given election, subjects who voted and subjects who were not old enough to vote were significantly more likely to express negative attitudes than positive attitudes toward the winning candidate in that election."}, "optsZh": {"A": "無論受試者是否已達投票年齡，他們在選舉兩年後對當選候選人的態度，都能由其整體政治傾向強烈預測。", "B": "在某次選舉中年紀不足而未能投票的受試者，兩年後對當選候選人的態度，比選舉當時明顯更加正面。", "C": "在某次選舉中投過票的受試者，兩年後對當選候選人的態度，比當時年紀不足而未能投票的受試者明顯更加兩極化。", "D": "在某次選舉兩年後，投過票的受試者與年紀不足而未能投票的受試者，對該次當選候選人表達負面態度的可能性都明顯高於正面態度。"}, "answer": "C", "expl": "The traditional view says voting does not change attitudes; if voters later held more polarized attitudes than similar non-voters, voting apparently did change attitudes.", "explZh": "傳統觀點認為投票不會改變態度；如果投票者後來的態度比條件相似的未投票者更兩極化，就表示投票確實改變了態度。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Command of Evidence: weaken a traditional-view claim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」", "C": "「這位領導人在上任的第一個月簽署了數項法令。」", "D": "「這個政府從一開始就面臨經濟上的挑戰。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Command of Evidence: weaken a traditional-view claim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "The southern region was included in the survey.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "有些農民種植蔬菜，而另一些則種植穀物。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "南部地區也被納入調查之中。", "D": "這張圖表包含了三個地區的資訊。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Command of Evidence: weaken a traditional-view claim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Some stars contain hydrogen and helium.", "C": "One rocky planet has a thin atmosphere.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "研究恆星所用的方法需要望遠鏡。", "B": "有些恆星含有氫和氦。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Command of Evidence: weaken a traditional-view claim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近代的文化交流而發展出來的，而不僅僅是從遙遠國度原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "The tradition is studied by scholars in several countries.", "C": "Some songs use a meter also found in older European poetry.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "B": "有好幾個國家的學者都在研究這項傳統。", "C": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Command of Evidence: weaken a traditional-view claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個條件相當、沒有這項計畫的城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "Both towns had some volunteers.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "The program took place in a community."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "兩個城鎮都有一些志工。", "C": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "D": "這項計畫在一個社區中進行。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Quantitative Evidence: graph data supporting a technology conclusion.", "vocab": false, "body": "Perovskite solar cells <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=convert\" target=\"_blank\" rel=\"noopener\" data-w=\"convert\" data-pos=\"v.\" data-en=\"to change something into a different form\" data-zh=\"轉換\">convert<\/a> light into electricity efficiently, but a limitation concerns their electron transport layer (ETL). Often the ETL is applied through spin coating, but such ETLs are fairly inefficient. Andre Taylor and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> tested a spray coating method for applying the ETL and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that spray coating holds promise for improving the power conversion efficiency of ETLs in perovskite solar cells. The graph shows that the lowest performing ETL applied through spray coating had a higher power conversion efficiency than the highest performing ETL applied through spin coating.", "bodyPlain": "Perovskite solar cells convert light into electricity efficiently, but a limitation concerns their electron transport layer (ETL). Often the ETL is applied through spin coating, but such ETLs are fairly inefficient. Andre Taylor and colleagues tested a spray coating method for applying the ETL and concluded that spray coating holds promise for improving the power conversion efficiency of ETLs in perovskite solar cells. The graph shows that the lowest performing ETL applied through spray coating had a higher power conversion efficiency than the highest performing ETL applied through spin coating.", "stem": "Which choice best describes data from the graph that support Taylor and colleagues' conclusion?", "stemZh": "哪個選項最能描述圖表中支持 Taylor 與同事結論的數據？", "bodyZh": "鈣鈦礦太陽能電池能有效率地把光轉換成電，但其中一個限制與它們的電子傳輸層（ETL）有關。ETL 通常是以旋轉塗佈的方式施加，但這樣的 ETL 效率相當低。Andre Taylor 與同事測試了一種以噴霧塗佈施加 ETL 的方法，並得出結論：噴霧塗佈有望提升鈣鈦礦太陽能電池中 ETL 的功率轉換效率。圖表顯示，以噴霧塗佈施加、表現最差的 ETL，其功率轉換效率仍高於以旋轉塗佈施加、表現最好的 ETL。", "opts": {"A": "Both the ETL applied through spin coating and the ETL applied through spray coating showed a power conversion efficiency greater than 10% at their lowest performing thickness.", "B": "The lowest performing ETL applied through spray coating had a higher power conversion efficiency than the highest performing ETL applied through spin coating.", "C": "The highest performing ETL applied through spray coating showed a power conversion efficiency of approximately 13%, while the highest performing ETL applied through spin coating showed a power conversion efficiency of approximately 11%.", "D": "There was a substantial difference in power conversion efficiency between the lowest and highest performing ETLs applied through spray coating."}, "optsZh": {"A": "以旋轉塗佈施加的 ETL 與以噴霧塗佈施加的 ETL，在其表現最差的厚度下，功率轉換效率都高於 10%。", "B": "以噴霧塗佈施加、表現最差的 ETL，其功率轉換效率仍高於以旋轉塗佈施加、表現最好的 ETL。", "C": "以噴霧塗佈施加、表現最好的 ETL，功率轉換效率約為 13%；而以旋轉塗佈施加、表現最好的 ETL，功率轉換效率約為 11%。", "D": "以噴霧塗佈施加的 ETL 中，表現最差與表現最好者之間的功率轉換效率有明顯差異。"}, "answer": "B", "expl": "Even the worst spray-coated ETL beat the best spin-coated ETL, which strongly shows spray coating's promise for improving efficiency.", "explZh": "即使表現最差的噴霧塗佈 ETL 也勝過表現最好的旋轉塗佈 ETL，有力顯示噴霧塗佈在提升效率上的潛力。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Quantitative Evidence: graph data supporting a technology conclusion.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n一位學生主張，某位歷史學家把一位革命領袖視為國家象徵，多於視為務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Quantitative Evidence: graph data supporting a technology conclusion.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部和中部地區，她們占穀物種植者的比例不到 35%。哪一項陳述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "The graph contains information about three regions.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "這張圖表包含了三個地區的資訊。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "南部地區也被納入調查之中。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Quantitative Evidence: graph data supporting a technology conclusion.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩石行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "One rocky planet has a thin atmosphere.", "C": "The method used to study stars requires a telescope.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Quantitative Evidence: graph data supporting a technology conclusion.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\
