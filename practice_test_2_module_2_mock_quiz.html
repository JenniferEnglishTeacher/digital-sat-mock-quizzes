<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 2, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 2, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: working together.", "vocab": true, "body": "The Mule Bone, a 1930 play written by Zora Neale Hurston and Langston Hughes, is perhaps the best-known of the few examples of _______ in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>. Most writers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prefer\" target=\"_blank\" rel=\"noopener\" data-w=\"prefer\" data-pos=\"v.\" data-en=\"to like one thing more than another\" data-zh=\"偏好；比較喜歡\">prefer<\/a> working alone, and given that working together cost Hurston and Hughes their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=friendship\" target=\"_blank\" rel=\"noopener\" data-w=\"friendship\" data-pos=\"n.\" data-en=\"a relationship between friends\" data-zh=\"友誼\">friendship<\/a>, it is not hard to see why.", "bodyPlain": "The Mule Bone, a 1930 play written by Zora Neale Hurston and Langston Hughes, is perhaps the best-known of the few examples of _______ in literature. Most writers prefer working alone, and given that working together cost Hurston and Hughes their friendship, it is not hard to see why.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "《The Mule Bone》是 Zora Neale Hurston 與 Langston Hughes 於 1930 年合寫的劇本，或許是文學中少數 _______ 作品裡最知名的一部。大多數作家偏好獨自寫作，而既然合作讓 Hurston 和 Hughes 失去了友誼，原因也就不難理解了。", "opts": {"A": "characterization", "B": "interpretation", "C": "collaboration", "D": "commercialization"}, "optsZh": {"A": "characterization（人物塑造、性格描寫）", "B": "interpretation（詮釋、解讀）", "C": "collaboration（合作、協作）", "D": "commercialization（商業化）"}, "answer": "C", "expl": "Most writers work alone, and 'working together' cost Hurston and Hughes their friendship, so The Mule Bone is a rare example of literary 'collaboration.'", "explZh": "文中說多數作家偏好獨自寫作，而「一起工作」讓 Hurston 與 Hughes 失去友誼，所以《The Mule Bone》是文學中少見的「collaboration」（合作）例子。", "defs": {"A": {"pos": "n.", "en": "the way a writer creates and describes characters", "zh": "人物塑造；性格描寫", "word": "characterization"}, "B": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}, "C": {"pos": "n.", "en": "the act of working together with others to create or achieve something", "zh": "合作；協作", "word": "collaboration"}, "D": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: working together.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The anthology was unusual because it grew out of genuine ______: three poets revised one another&#x27;s drafts, debated the order of the poems, and signed the final preface together.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The anthology was unusual because it grew out of genuine ______: three poets revised one another's drafts, debated the order of the poems, and signed the final preface together.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這本選集之所以不尋常，是因為它源自真正的 ______：三位詩人互相修改彼此的草稿、討論詩作的順序，並共同簽署最後的序言。", "opts": {"A": "isolation", "B": "commercialization", "C": "collaboration", "D": "interpretation"}, "optsZh": {"A": "isolation（孤立、隔離）", "B": "commercialization（商業化）", "C": "collaboration（合作、協作）", "D": "interpretation（詮釋、解讀）"}, "answer": "C", "expl": "Collaboration means working together.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the state of being alone or separated from others", "zh": "孤立；隔離", "word": "isolation"}, "B": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}, "C": {"pos": "n.", "en": "the act of working together with others to create or achieve something", "zh": "合作；協作", "word": "collaboration"}, "D": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: working together.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The mural&#x27;s complexity reflects a long period of ______ between the lead painter and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> residents, who suggested images, corrected historical details, and helped choose the final colors.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The mural's complexity reflects a long period of ______ between the lead painter and neighborhood residents, who suggested images, corrected historical details, and helped choose the final colors.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這幅壁畫的複雜性反映出主要畫家與社區居民之間長期的 ______；居民們提供圖像建議、修正歷史細節，並協助挑選最後的配色。", "opts": {"A": "characterization", "B": "cooperation", "C": "competition", "D": "withdrawal"}, "optsZh": {"A": "characterization（人物塑造、性格描寫）", "B": "cooperation（合作）", "C": "competition（競爭）", "D": "withdrawal（退出、撤回）"}, "answer": "B", "expl": "Cooperation means working jointly toward a goal.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the way a writer creates and describes characters", "zh": "人物塑造；性格描寫", "word": "characterization"}, "B": {"pos": "n.", "en": "the act of working together toward a shared goal", "zh": "合作；協力", "word": "cooperation"}, "C": {"pos": "n.", "en": "a situation in which people try to be more successful than others", "zh": "競爭", "word": "competition"}, "D": {"pos": "n.", "en": "the act of leaving or no longer taking part", "zh": "退出；撤離", "word": "withdrawal"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: working together.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Although the two scientists usually published independently, their study of coastal erosion required close ______ because one specialized in satellite mapping and the other in sediment chemistry.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the two scientists usually published independently, their study of coastal erosion required close ______ because one specialized in satellite mapping and the other in sediment chemistry.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n雖然這兩位科學家通常各自發表研究，但他們對海岸侵蝕的研究需要密切的 ______，因為一位專精衛星測繪，另一位專精沉積物化學。", "opts": {"A": "publicity", "B": "commercialization", "C": "interpretation", "D": "partnership"}, "optsZh": {"A": "publicity（宣傳、曝光）", "B": "commercialization（商業化）", "C": "interpretation（詮釋、解讀）", "D": "partnership（合夥、合作關係）"}, "answer": "D", "expl": "Partnership means cooperative work between people.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "attention given to someone or something by the media", "zh": "宣傳；曝光度", "word": "publicity"}, "B": {"pos": "n.", "en": "the process of managing something mainly to make money", "zh": "商業化", "word": "commercialization"}, "C": {"pos": "n.", "en": "an explanation of the meaning of something", "zh": "詮釋；解讀", "word": "interpretation"}, "D": {"pos": "n.", "en": "a relationship in which people work together", "zh": "合夥；合作關係", "word": "partnership"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: working together.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The film was not the product of a single director&#x27;s vision but of ______ among animators, musicians, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a>, and language consultants.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The film was not the product of a single director's vision but of ______ among animators, musicians, historians, and language consultants.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部電影並非單一導演構想的產物，而是動畫師、音樂家、歷史學家與語言顧問之間 ______ 的成果。", "opts": {"A": "prediction", "B": "controversy", "C": "isolation", "D": "teamwork"}, "optsZh": {"A": "prediction（預測）", "B": "controversy（爭議）", "C": "isolation（孤立、隔離）", "D": "teamwork（團隊合作）"}, "answer": "D", "expl": "Teamwork means cooperative effort by a group.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "B": {"pos": "n.", "en": "a lot of public disagreement about something", "zh": "爭議；爭論", "word": "controversy"}, "C": {"pos": "n.", "en": "the state of being alone or separated from others", "zh": "孤立；隔離", "word": "isolation"}, "D": {"pos": "n.", "en": "the activity of working well together as a group", "zh": "團隊合作", "word": "teamwork"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: working together.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The architects described the library as a work of ______, since its final design combined ideas from engineers, local teachers, and students who would use the building.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The architects described the library as a work of ______, since its final design combined ideas from engineers, local teachers, and students who would use the building.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n建築師們把這座圖書館形容為一件 ______ 的作品，因為它的最終設計融合了工程師、當地教師以及將使用這棟建築的學生們的構想。", "opts": {"A": "joint effort", "B": "character study", "C": "private ownership", "D": "market research"}, "optsZh": {"A": "joint effort（共同努力）", "B": "character study（人物研究）", "C": "private ownership（私人所有權）", "D": "market research（市場調查）"}, "answer": "A", "expl": "Joint effort means a collaborative undertaking.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "work that two or more people do together", "zh": "共同努力；合力", "word": "joint effort"}, "B": {"pos": "n.", "en": "a work or analysis that focuses closely on one person's personality", "zh": "人物研究；人物刻畫作品", "word": "character study"}, "C": {"pos": "n.", "en": "the state of being owned by a person or company rather than the government", "zh": "私人所有權；私有制", "word": "private ownership"}, "D": {"pos": "n.", "en": "the study of what customers want and buy", "zh": "市場調查；市場研究", "word": "market research"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: not good enough or insufficient.", "vocab": true, "body": "The process of mechanically recycling plastics is often considered _______ because of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> impact and the loss of material quality that often occurs. But chemist Takunda Chazovachii has helped develop a cleaner process of chemical recycling that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=convert\" target=\"_blank\" rel=\"noopener\" data-w=\"convert\" data-pos=\"v.\" data-en=\"to change something into a different form\" data-zh=\"轉換\">converts<\/a> superabsorbent polymers from diapers into a desirable reusable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adhesive\" target=\"_blank\" rel=\"noopener\" data-w=\"adhesive\" data-pos=\"n.\" data-en=\"a substance used to stick things together\" data-zh=\"黏著劑\">adhesive<\/a>.", "bodyPlain": "The process of mechanically recycling plastics is often considered _______ because of the environmental impact and the loss of material quality that often occurs. But chemist Takunda Chazovachii has helped develop a cleaner process of chemical recycling that converts superabsorbent polymers from diapers into a desirable reusable adhesive.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "由於對環境的影響以及經常發生的材料品質下降，塑膠的機械回收過程常被認為是 _______ 的。但化學家 Takunda Chazovachii 協助開發出一種更乾淨的化學回收製程，能把尿布中的高吸水性聚合物轉化為理想的可重複使用黏著劑。", "opts": {"A": "resilient", "B": "inadequate", "C": "dynamic", "D": "satisfactory"}, "optsZh": {"A": "resilient（有韌性的、能迅速恢復的）", "B": "inadequate（不充分的、不夠好的）", "C": "dynamic（充滿活力的、動態的）", "D": "satisfactory（令人滿意的）"}, "answer": "B", "expl": "The 'But' introduces a cleaner process as an improvement, so mechanical recycling is seen as 'inadequate' (not good enough) because of its environmental impact and quality loss.", "explZh": "「But」引出一種更乾淨的製程作為改進，可見機械回收因環境影響與品質下降被認為「inadequate」（不夠好、不充分）。", "defs": {"A": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "B": {"pos": "adj.", "en": "not good enough or not enough for a purpose", "zh": "不充分的；不夠好的", "word": "inadequate"}, "C": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}, "D": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: not good enough or insufficient.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The first cleanup plan was judged ______ because it removed visible trash from the riverbanks but failed to address the industrial chemicals still entering the water upstream.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The first cleanup plan was judged ______ because it removed visible trash from the riverbanks but failed to address the industrial chemicals still entering the water upstream.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n第一個清理計畫被評為 ______，因為它雖然清除了河岸上看得見的垃圾，卻沒有處理仍從上游流入水中的工業化學物質。", "opts": {"A": "dynamic", "B": "satisfactory", "C": "resilient", "D": "inadequate"}, "optsZh": {"A": "dynamic（充滿活力的、動態的）", "B": "satisfactory（令人滿意的）", "C": "resilient（有韌性的、能迅速恢復的）", "D": "inadequate（不充分的、不夠好的）"}, "answer": "D", "expl": "Inadequate means not sufficient or not good enough.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}, "B": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}, "C": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "D": {"pos": "adj.", "en": "not good enough or not enough for a purpose", "zh": "不充分的；不夠好的", "word": "inadequate"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: not good enough or insufficient.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Although the museum&#x27;s early catalog listed every object, scholars considered it ______ because it rarely included dates, materials, or information about where the objects had been found.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Although the museum's early catalog listed every object, scholars considered it ______ because it rarely included dates, materials, or information about where the objects had been found.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n雖然博物館早期的目錄列出了每件物品，學者們仍認為它 ______，因為它很少記載年代、材質，或物品出土地點的資訊。", "opts": {"A": "satisfactory", "B": "insufficient", "C": "innovative", "D": "durable"}, "optsZh": {"A": "satisfactory（令人滿意的）", "B": "insufficient（不足的）", "C": "innovative（創新的）", "D": "durable（耐用的、持久的）"}, "answer": "B", "expl": "Insufficient means not enough.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}, "B": {"pos": "adj.", "en": "not enough for a particular purpose", "zh": "不足的；不夠的", "word": "insufficient"}, "C": {"pos": "adj.", "en": "using new methods or ideas", "zh": "創新的", "word": "innovative"}, "D": {"pos": "adj.", "en": "able to last a long time without breaking or wearing out", "zh": "耐用的；持久的", "word": "durable"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: not good enough or insufficient.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The town&#x27;s emergency shelter system proved ______ during the storm: it had room for only half the residents who needed help and lacked supplies for medical care.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The town's emergency shelter system proved ______ during the storm: it had room for only half the residents who needed help and lacked supplies for medical care.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n這個城鎮的緊急避難所系統在暴風雨期間證明是 ______ 的：它只能容納一半需要幫助的居民，而且缺乏醫療用品。", "opts": {"A": "convenient", "B": "dynamic", "C": "deficient", "D": "resilient"}, "optsZh": {"A": "convenient（方便的）", "B": "dynamic（充滿活力的、動態的）", "C": "deficient（不足的、有缺陷的）", "D": "resilient（有韌性的、能迅速恢復的）"}, "answer": "C", "expl": "Deficient means lacking something necessary.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "easy to use or suitable for your needs", "zh": "方便的；合宜的", "word": "convenient"}, "B": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}, "C": {"pos": "adj.", "en": "not having enough of something; not good enough", "zh": "不足的；有缺陷的", "word": "deficient"}, "D": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: not good enough or insufficient.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The translation was ______ for advanced research because it conveyed the general plot but omitted the technical terms central to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=original\" target=\"_blank\" rel=\"noopener\" data-w=\"original\" data-pos=\"adj.\" data-en=\"new and different; not copied\" data-zh=\"原創的；新穎的；原本的\">original<\/a> legal document.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The translation was ______ for advanced research because it conveyed the general plot but omitted the technical terms central to the original legal document.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這份譯本對進階研究而言是 ______ 的，因為它雖傳達了大致情節，卻省略了原始法律文件中關鍵的專業術語。", "opts": {"A": "flexible", "B": "unsatisfactory", "C": "inventive", "D": "popular"}, "optsZh": {"A": "flexible（有彈性的、靈活的）", "B": "unsatisfactory（不令人滿意的）", "C": "inventive（有創造力的、別出心裁的）", "D": "popular（受歡迎的）"}, "answer": "B", "expl": "Unsatisfactory means not acceptable or not good enough.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to change or bend easily", "zh": "有彈性的；靈活的", "word": "flexible"}, "B": {"pos": "adj.", "en": "not good enough", "zh": "不令人滿意的；不合格的", "word": "unsatisfactory"}, "C": {"pos": "adj.", "en": "good at thinking of new and original ideas", "zh": "有創造力的；別出心裁的", "word": "inventive"}, "D": {"pos": "adj.", "en": "liked or enjoyed by many people", "zh": "受歡迎的；流行的", "word": "popular"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: not good enough or insufficient.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The researchers rejected the initial sample as ______; it included too few participants from rural communities to support conclusions about the entire region.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The researchers rejected the initial sample as ______; it included too few participants from rural communities to support conclusions about the entire region.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n研究人員以 ______ 為由拒絕了最初的樣本；其中來自鄉村社區的參與者太少，不足以支持關於整個地區的結論。", "opts": {"A": "inadequate", "B": "representative", "C": "resilient", "D": "precise"}, "optsZh": {"A": "inadequate（不充分的、不夠好的）", "B": "representative（具代表性的）", "C": "resilient（有韌性的、能迅速恢復的）", "D": "precise（精確的）"}, "answer": "A", "expl": "Inadequate means insufficient for a purpose.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not good enough or not enough for a purpose", "zh": "不充分的；不夠好的", "word": "inadequate"}, "B": {"pos": "adj.", "en": "typical of a larger group", "zh": "具代表性的；典型的", "word": "representative"}, "C": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "D": {"pos": "adj.", "en": "exact and accurate", "zh": "精確的；準確的", "word": "precise"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: prove invalid or make unsound.", "vocab": true, "body": "Interruptions in the supply chain for microchips used in personal electronics have challenged an economist&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assertion\" target=\"_blank\" rel=\"noopener\" data-w=\"assertion\" data-pos=\"n.\" data-en=\"a statement that someone says is true\" data-zh=\"主張；斷言\">assertion<\/a> that retailers can expect <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=robust\" target=\"_blank\" rel=\"noopener\" data-w=\"robust\" data-pos=\"adj.\" data-en=\"strong and healthy; strong enough to last\" data-zh=\"強勁的；穩健的\">robust<\/a> growth in sales of those devices in the coming months. The delays are unlikely to _______ her projection <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> but will almost certainly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extend\" target=\"_blank\" rel=\"noopener\" data-w=\"extend\" data-pos=\"v.\" data-en=\"to make something last longer or reach farther\" data-zh=\"延長；擴展\">extend<\/a> its time frame.", "bodyPlain": "Interruptions in the supply chain for microchips used in personal electronics have challenged an economist's assertion that retailers can expect robust growth in sales of those devices in the coming months. The delays are unlikely to _______ her projection entirely but will almost certainly extend its time frame.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "個人電子產品所用微晶片的供應鏈中斷，挑戰了一位經濟學家的論點：她認為零售商在未來幾個月可望看到這些裝置的銷售強勁成長。這些延遲不太可能完全 _______ 她的預測，但幾乎肯定會延長其時間範圍。", "opts": {"A": "dispute", "B": "withdraw", "C": "underscore", "D": "invalidate"}, "optsZh": {"A": "dispute（爭論、質疑）", "B": "withdraw（撤回、撤銷）", "C": "underscore（強調）", "D": "invalidate（使無效、證明…不成立）"}, "answer": "D", "expl": "The delays will extend the projection's time frame but are unlikely to 'invalidate' it entirely, that is, prove it completely wrong.", "explZh": "延遲會延長預測的時間範圍，但不太可能完全「invalidate」（使其不成立），也就是證明它完全錯誤。", "defs": {"A": {"pos": "v.", "en": "to say that something is not correct or true", "zh": "對…提出異議；質疑", "word": "dispute"}, "B": {"pos": "v.", "en": "to take back something you said or offered", "zh": "撤回；撤銷", "word": "withdraw"}, "C": {"pos": "v.", "en": "to emphasize or show that something is important", "zh": "強調；突顯", "word": "underscore"}, "D": {"pos": "v.", "en": "to show that an idea or argument is wrong or no longer valid", "zh": "使無效；證明…不成立", "word": "invalidate"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: prove invalid or make unsound.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. New evidence may complicate the historian&#x27;s timeline, but it does not ______ the central claim that the settlement was occupied <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continuously\" target=\"_blank\" rel=\"noopener\" data-w=\"continuously\" data-pos=\"adv.\" data-en=\"without stopping or interruption\" data-zh=\"持續不斷地\">continuously<\/a> for several centuries.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. New evidence may complicate the historian's timeline, but it does not ______ the central claim that the settlement was occupied continuously for several centuries.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n新證據或許會使這位歷史學家的年表變得複雜，但並不會 ______ 該聚落曾連續數百年有人居住這個核心主張。", "opts": {"A": "withdraw", "B": "invalidate", "C": "underscore", "D": "dispute"}, "optsZh": {"A": "withdraw（撤回、撤銷）", "B": "invalidate（使無效、證明…不成立）", "C": "underscore（強調）", "D": "dispute（爭論、質疑）"}, "answer": "B", "expl": "Invalidate means prove unsound or make no longer valid.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to take back something you said or offered", "zh": "撤回；撤銷", "word": "withdraw"}, "B": {"pos": "v.", "en": "to show that an idea or argument is wrong or no longer valid", "zh": "使無效；證明…不成立", "word": "invalidate"}, "C": {"pos": "v.", "en": "to emphasize or show that something is important", "zh": "強調；突顯", "word": "underscore"}, "D": {"pos": "v.", "en": "to say that something is not correct or true", "zh": "對…提出異議；質疑", "word": "dispute"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: prove invalid or make unsound.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The failed trial did not ______ the medical theory altogether; it showed only that the dosage used in the study was too low to produce a measurable effect.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The failed trial did not ______ the medical theory altogether; it showed only that the dosage used in the study was too low to produce a measurable effect.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這次失敗的試驗並沒有完全 ______ 這個醫學理論；它只顯示研究中使用的劑量太低，無法產生可測量的效果。", "opts": {"A": "extend", "B": "emphasize", "C": "repeat", "D": "nullify"}, "optsZh": {"A": "extend（延長、擴展）", "B": "emphasize（強調）", "C": "repeat（重複）", "D": "nullify（使無效、抵銷）"}, "answer": "D", "expl": "Nullify means make invalid.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something last longer or reach farther", "zh": "延長；擴展", "word": "extend"}, "B": {"pos": "v.", "en": "to show that something is especially important", "zh": "強調", "word": "emphasize"}, "C": {"pos": "v.", "en": "to say or do something again", "zh": "重複", "word": "repeat"}, "D": {"pos": "v.", "en": "to make something have no effect or value", "zh": "使無效；抵銷", "word": "nullify"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: prove invalid or make unsound.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> expected the new radiocarbon dates to refine their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a>, not to ______ it, since the dates still fell within the broader period they had proposed.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The archaeologists expected the new radiocarbon dates to refine their interpretation, not to ______ it, since the dates still fell within the broader period they had proposed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n考古學家原本預期新的放射性碳定年結果會讓他們的詮釋更精確，而不是 ______ 它，因為這些年代仍落在他們先前提出的較大時期範圍內。", "opts": {"A": "disprove", "B": "revise", "C": "support", "D": "confirm"}, "optsZh": {"A": "disprove（證明…是錯的、反駁）", "B": "revise（修訂、修改）", "C": "support（支持、證實）", "D": "confirm（證實、確認）"}, "answer": "A", "expl": "Disprove means show that something is false.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to show that something is false", "zh": "證明…是錯的；反駁", "word": "disprove"}, "B": {"pos": "v.", "en": "to change something in order to improve or correct it", "zh": "修訂；修改", "word": "revise"}, "C": {"pos": "v.", "en": "to show that an idea or claim is likely to be true", "zh": "支持；證實", "word": "support"}, "D": {"pos": "v.", "en": "to show or state that something is true", "zh": "證實；確認", "word": "confirm"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: prove invalid or make unsound.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The discovery of one mislabeled specimen was embarrassing, but it did not ______ the entire classification system, which was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that an idea or claim is likely to be true\" data-zh=\"支持；證實\">supported<\/a> by hundreds of correctly identified examples.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The discovery of one mislabeled specimen was embarrassing, but it did not ______ the entire classification system, which was supported by hundreds of correctly identified examples.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例連結到更廣泛的模式，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n發現一件標錯的標本雖令人尷尬，但並沒有 ______ 整個分類系統，因為該系統有數百件正確鑑定的例子支持。", "opts": {"A": "clarify", "B": "undermine", "C": "preserve", "D": "underscore"}, "optsZh": {"A": "clarify（澄清、闡明）", "B": "undermine（削弱、破壞）", "C": "preserve（保存、維護）", "D": "underscore（強調）"}, "answer": "B", "expl": "Undermine means weaken or damage the basis of something.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something easier to understand", "zh": "澄清；闡明", "word": "clarify"}, "B": {"pos": "v.", "en": "to gradually make something weaker or less effective", "zh": "削弱；破壞", "word": "undermine"}, "C": {"pos": "v.", "en": "to keep something in its original state or protect it from harm", "zh": "保存；維護", "word": "preserve"}, "D": {"pos": "v.", "en": "to emphasize or show that something is important", "zh": "強調；突顯", "word": "underscore"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: prove invalid or make unsound.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The unexpected survey results forced economists to adjust the forecast&#x27;s timing, but the results did not ______ the forecast&#x27;s basic assumption that demand would eventually increase.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The unexpected survey results forced economists to adjust the forecast's timing, but the results did not ______ the forecast's basic assumption that demand would eventually increase.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個過程的多個階段，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響論點的精確度，並可能使結論聽起來比資料所支持的範圍更廣。\n出乎意料的調查結果迫使經濟學家調整預測的時程，但這些結果並沒有 ______ 該預測「需求最終會增加」的基本假設。", "opts": {"A": "withdraw", "B": "summarize", "C": "invalidate", "D": "emphasize"}, "optsZh": {"A": "withdraw（撤回、撤銷）", "B": "summarize（摘要、總結）", "C": "invalidate（使無效、證明…不成立）", "D": "emphasize（強調）"}, "answer": "C", "expl": "Invalidate means show that a claim is not valid.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to take back something you said or offered", "zh": "撤回；撤銷", "word": "withdraw"}, "B": {"pos": "v.", "en": "to give a short statement of the main points", "zh": "摘要；總結", "word": "summarize"}, "C": {"pos": "v.", "en": "to show that an idea or argument is wrong or no longer valid", "zh": "使無效；證明…不成立", "word": "invalidate"}, "D": {"pos": "v.", "en": "to show that something is especially important", "zh": "強調", "word": "emphasize"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: creative or original.", "vocab": true, "body": "For her 2021 art <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a> Anthem, Wu Tsang joined forces with singer and composer Beverly Glenn-Copeland to produce a piece that critics found truly _______: they praised Tsang for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=creative\" target=\"_blank\" rel=\"noopener\" data-w=\"creative\" data-pos=\"adj.\" data-en=\"producing or using new and original ideas\" data-zh=\"有創意的；有創造力的\">creatively<\/a> transforming a museum rotunda into a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dynamic\" target=\"_blank\" rel=\"noopener\" data-w=\"dynamic\" data-pos=\"adj.\" data-en=\"full of energy, activity, or change\" data-zh=\"充滿活力的；動態的\">dynamic<\/a> exhibit by projecting filmed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> of Glenn-Copeland onto a massive 84-foot curtain and filling the space with the sounds of his and other voices singing.", "bodyPlain": "For her 2021 art installation Anthem, Wu Tsang joined forces with singer and composer Beverly Glenn-Copeland to produce a piece that critics found truly _______: they praised Tsang for creatively transforming a museum rotunda into a dynamic exhibit by projecting filmed images of Glenn-Copeland onto a massive 84-foot curtain and filling the space with the sounds of his and other voices singing.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在 2021 年的藝術裝置作品《Anthem》中，Wu Tsang 與歌手兼作曲家 Beverly Glenn-Copeland 合作，創作出一件評論家認為非常 _______ 的作品：他們稱讚 Tsang 富有創意地把博物館的圓形大廳變成一個動態展場，將 Glenn-Copeland 的影像投射在一面巨大的 84 英尺布幕上，並讓空間充滿他與其他人的歌聲。", "opts": {"A": "restrained", "B": "inventive", "C": "inexplicable", "D": "mystifying"}, "optsZh": {"A": "restrained（克制的、拘謹的）", "B": "inventive（有創造力的、別出心裁的）", "C": "inexplicable（無法解釋的、費解的）", "D": "mystifying（令人困惑的、神祕難解的）"}, "answer": "B", "expl": "Critics praised Tsang for 'creatively transforming' the rotunda, so they found the piece 'inventive' (creative and original).", "explZh": "評論家稱讚 Tsang「富有創意地改造」圓形大廳，因此認為這件作品「inventive」（有創造力、別出心裁的）。", "defs": {"A": {"pos": "adj.", "en": "calm and controlled; not showing strong feelings or bold effects", "zh": "克制的；低調的；拘謹的", "word": "restrained"}, "B": {"pos": "adj.", "en": "good at thinking of new and original ideas", "zh": "有創造力的；別出心裁的", "word": "inventive"}, "C": {"pos": "adj.", "en": "impossible to explain or understand", "zh": "無法解釋的；費解的", "word": "inexplicable"}, "D": {"pos": "adj.", "en": "very difficult to understand or explain", "zh": "令人困惑的；神祕難解的", "word": "mystifying"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: creative or original.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解讀\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The director&#x27;s staging of the ancient play was widely described as ______ because it used mirrors, live video, and overlapping voices to make a familiar story feel newly urgent.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The director's staging of the ancient play was widely described as ______ because it used mirrors, live video, and overlapping voices to make a familiar story feel newly urgent.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度是謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上仰賴於在不同季節與地點所蒐集、雖不完整但具啟發性的證據。\n這位導演對這齣古老戲劇的舞台呈現被普遍形容為 ______，因為它運用鏡子、即時影像和重疊的人聲，讓一個熟悉的故事顯得重新迫切。", "opts": {"A": "routine", "B": "inexplicable", "C": "restrained", "D": "inventive"}, "optsZh": {"A": "routine（例行的、平常的）", "B": "inexplicable（無法解釋的、費解的）", "C": "restrained（克制的、拘謹的）", "D": "inventive（有創造力的、別出心裁的）"}, "answer": "D", "expl": "Inventive means creative and original.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "ordinary and done regularly; not special", "zh": "例行的；平常的", "word": "routine"}, "B": {"pos": "adj.", "en": "impossible to explain or understand", "zh": "無法解釋的；費解的", "word": "inexplicable"}, "C": {"pos": "adj.", "en": "calm and controlled; not showing strong feelings or bold effects", "zh": "克制的；低調的；拘謹的", "word": "restrained"}, "D": {"pos": "adj.", "en": "good at thinking of new and original ideas", "zh": "有創造力的；別出心裁的", "word": "inventive"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: creative or original.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditional\" target=\"_blank\" rel=\"noopener\" data-w=\"traditional\" data-pos=\"adj.\" data-en=\"following ways of doing things that have existed for a long time\" data-zh=\"傳統的\">traditional<\/a>/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The chef&#x27;s menu was ______, combining traditional fermentation techniques with unexpected ingredients such as pine needles, seaweed, and roasted fruit skins.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The chef's menu was ______, combining traditional fermentation techniques with unexpected ingredients such as pine needles, seaweed, and roasted fruit skins.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於紀錄零散不全，學者們必須先在多個來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽略。\n這位主廚的菜單很 ______，把傳統發酵技術與松針、海藻、烤水果皮等意想不到的食材結合在一起。", "opts": {"A": "ordinary", "B": "innovative", "C": "restrained", "D": "mystifying"}, "optsZh": {"A": "ordinary（普通的）", "B": "innovative（創新的）", "C": "restrained（克制的、拘謹的）", "D": "mystifying（令人困惑的、神祕難解的）"}, "answer": "B", "expl": "Innovative means introducing new ideas.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "B": {"pos": "adj.", "en": "using new methods or ideas", "zh": "創新的", "word": "innovative"}, "C": {"pos": "adj.", "en": "calm and controlled; not showing strong feelings or bold effects", "zh": "克制的；低調的；拘謹的", "word": "restrained"}, "D": {"pos": "adj.", "en": "very difficult to understand or explain", "zh": "令人困惑的；神祕難解的", "word": "mystifying"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: creative or original.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together with others to create or achieve something\" data-zh=\"合作；協作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Critics praised the architect&#x27;s ______ solution to the narrow site: rather than building upward in a simple tower, she arranged classrooms around a series of shared terraces.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Critics praised the architect's ______ solution to the narrow site: rather than building upward in a simple tower, she arranged classrooms around a series of shared terraces.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些以科學觀察、在地歷史與合作為創作根基的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。\n評論家稱讚這位建築師對狹窄基地提出的 ______ 解決方案：她沒有簡單地蓋一座高塔，而是把教室安排在一系列共用的露臺周圍。", "opts": {"A": "imaginative", "B": "min
