 "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n天文學家主張，岩質行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Some stars contain hydrogen and helium.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "研究恆星所用的方法需要望遠鏡。", "B": "有些恆星含有氫和氦。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "有一顆岩質行星擁有稀薄的大氣層。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Command of Evidence: support a claim about human expertise and AI.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distant\" target=\"_blank\" rel=\"noopener\" data-w=\"distant\" data-pos=\"adj.\" data-en=\"far away in space or time\" data-zh=\"遙遠的；遠方的；疏遠的\">distant<\/a> country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而非原封不動地從遙遠國度引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Many performers learned songs from relatives.", "C": "The tradition is studied by scholars in several countries.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "有數首民謠包含了當地的歷史事件，以及在不同群體長期接觸之後才出現的混合音樂形式。", "B": "許多表演者是向親戚學習歌曲的。", "C": "有好幾個國家的學者都在研究這項傳統。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Command of Evidence: support a claim about human expertise and AI.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n一張表格顯示，某個社區計畫開始之後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的條件相當的城鎮，這個人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The program took place in a community.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "The table includes more than one year."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這項計畫在一個社區中進行。", "C": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "D": "這張表格包含不只一個年份。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Inferences: complete a causal explanation.", "vocab": false, "body": "Although military veterans make up a small <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proportion\" target=\"_blank\" rel=\"noopener\" data-w=\"proportion\" data-pos=\"n.\" data-en=\"a part or share of a whole\" data-zh=\"比例\">proportion<\/a> of the total <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> of the United States, they occupy a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"large or important enough to have an effect\" data-zh=\"重大的；顯著的；有意義的\">significantly<\/a> higher proportion of the jobs in the civilian government. One possible explanation for this disproportionate representation is that military service familiarizes people with certain organizational <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a> that are also reflected in the civilian government bureaucracy, and this familiarity thus _______", "bodyPlain": "Although military veterans make up a small proportion of the total population of the United States, they occupy a significantly higher proportion of the jobs in the civilian government. One possible explanation for this disproportionate representation is that military service familiarizes people with certain organizational structures that are also reflected in the civilian government bureaucracy, and this familiarity thus _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "雖然退伍軍人只占美國總人口的一小部分，他們在文職政府職位中所占的比例卻明顯較高。對這種比例失衡的一個可能解釋是，軍旅生涯讓人熟悉某些組織架構，而這些架構也反映在文職政府的官僚體系中，因此這種熟悉感 _______", "opts": {"A": "makes civilian government jobs especially appealing to military veterans.", "B": "alters the typical relationship between military service and subsequent career preferences.", "C": "encourages nonveterans applying for civilian government jobs to consider military service instead.", "D": "increases the number of civilian government jobs that require some amount of military experience to perform."}, "optsZh": {"A": "使文職政府工作對退伍軍人特別有吸引力。", "B": "改變了服役經歷與日後職業偏好之間的一般關係。", "C": "鼓勵申請文職政府工作的非退伍軍人改為考慮從軍。", "D": "增加需要某種程度軍事經驗才能勝任的文職政府工作數量。"}, "answer": "A", "expl": "Familiarity with similar organizational structures would make government jobs appealing to veterans, explaining why they hold so many.", "explZh": "熟悉相似的組織結構會使政府工作對退伍軍人特別有吸引力，這解釋了他們占比偏高的原因。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Inferences: complete a causal explanation.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n某個地區的農民採用了一個遙遠原住民族所發明的種植技術，但紀錄顯示，這些農民中很少有人與該民族有直接接觸。如果這項技術並非獨立發明的，證據顯示 ______", "opts": {"A": "the Indigenous nation adopted the technique from those farmers.", "B": "the farmers likely learned it through intermediaries who had more direct contact with the original practitioners.", "C": "the records prove that all farms used identical crops.", "D": "the technique could not have been useful in the region."}, "optsZh": {"A": "這個原住民族是從那些農民那裡學到這項技術的。", "B": "那些農民很可能是透過與最初使用者有更直接接觸的中間人學到這項技術的。", "C": "這些紀錄證明所有農場都種植完全相同的作物。", "D": "這項技術在該地區不可能派上用場。"}, "answer": "B", "expl": "Indirect transmission best explains the evidence.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Inferences: complete a causal explanation.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Artifacts at a coastal settlement include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Artifacts at a coastal settlement include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n一處沿海聚落出土的文物中，包含了在該聚落建立前兩個世紀所製作的珠子。如果珠子的年代與聚落建立的年代都正確，那麼這些珠子很可能 ______", "opts": {"A": "were made elsewhere and reached the settlement through trade, inheritance, or migration.", "B": "prove the settlement was founded two centuries earlier.", "C": "were all produced by the settlement's first residents.", "D": "show that dating methods are never useful."}, "optsZh": {"A": "是在別處製作，再透過貿易、繼承或遷徙傳到這個聚落的。", "B": "證明這個聚落早了兩個世紀建立。", "C": "全都是由這個聚落最早的居民製作的。", "D": "顯示定年方法從來都沒有用。"}, "answer": "A", "expl": "Older objects can move before being deposited at a later site.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Inferences: complete a causal explanation.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n研究人員將一種植物蛋白質替換成另一個物種的類似蛋白質，而該物種在氣溫上升時並不會改變開花時間。經過改造的植物在溫和氣溫下生長正常，但與未經改造的植物不同，它們在較溫暖的環境下無法提早開花。研究結果顯示 ______", "opts": {"A": "all plants accelerate flowering at the same temperature.", "B": "the replacement protein improves warm-weather flowering.", "C": "the original protein helps the plant respond to increased temperature.", "D": "temperature has no effect on the species."}, "optsZh": {"A": "所有植物都在相同的溫度下加速開花。", "B": "替代的蛋白質能改善溫暖天氣下的開花情形。", "C": "原本的蛋白質幫助植物對溫度升高做出反應。", "D": "溫度對這個物種沒有影響。"}, "answer": "C", "expl": "Only plants with the original protein showed the temperature response.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Inferences: complete a causal explanation.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A study compares students&#x27; reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A study compares students' reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一項研究使用閱讀難度差異極大的謎題來比較學生的推理能力。由於有些學生拿到的是簡單的措辭，另一些學生拿到的則是艱深的技術性描述，研究結果 ______", "opts": {"A": "prove that all students have the same reasoning ability.", "B": "show that wording never affects performance.", "C": "can be generalized to every kind of test.", "D": "may reflect differences in reading load rather than differences in reasoning ability."}, "optsZh": {"A": "證明所有學生的推理能力都相同。", "B": "顯示措辭從不影響表現。", "C": "可以推廣到每一種測驗。", "D": "可能反映的是閱讀負擔的差異，而非推理能力的差異。"}, "answer": "D", "expl": "An uncontrolled task feature limits the conclusion.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Inferences: complete a causal explanation.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n一份手稿主要保存了遷徙之前的歌謠，但其中有幾行提到的地方，是這個群體在遷徙之後才接觸到的。因此，學者推斷 ______", "opts": {"A": "none of the songs can predate the migration.", "B": "the references to later places must be accidental.", "C": "the manuscript probably combines earlier material with later additions or revisions.", "D": "the scribes were unable to understand the songs."}, "optsZh": {"A": "沒有任何一首歌可能早於這次遷徙。", "B": "提及後來地點的內容必定是出於偶然。", "C": "這份手稿很可能結合了較早的素材與後來的增補或修訂。", "D": "抄寫員無法理解這些歌曲。"}, "answer": "C", "expl": "Mixed evidence supports mixed origins.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Inferences: draw a conclusion that complicates an honest-signal theory.", "vocab": false, "body": "Birds of many species ingest foods containing carotenoids, pigmented <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molecule\" target=\"_blank\" rel=\"noopener\" data-w=\"molecule\" data-pos=\"n.\" data-en=\"the smallest unit of a substance, made of atoms\" data-zh=\"分子\">molecules<\/a> that are converted into feather <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coloration\" target=\"_blank\" rel=\"noopener\" data-w=\"coloration\" data-pos=\"n.\" data-en=\"the color pattern of an animal or plant\" data-zh=\"顏色；色彩圖案\">coloration<\/a>. Coloration tends to be especially <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=saturated\" target=\"_blank\" rel=\"noopener\" data-w=\"saturated\" data-pos=\"adj.\" data-en=\"(of color) very strong and deep\" data-zh=\"（顏色）飽和的；濃烈的\">saturated<\/a> in male birds&#x27; feathers, and because carotenoids also confer health benefits, the deeply saturated colors generally serve to communicate what is known as an honest signal of a bird&#x27;s overall fitness to potential mates. However, ornithologist Allison J. Shultz and others have found that males in several species of the tanager genus Ramphocelus use microstructures in their feathers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manipulate\" target=\"_blank\" rel=\"noopener\" data-w=\"manipulate\" data-pos=\"v.\" data-en=\"to control or change something skillfully\" data-zh=\"操控；操縱\">manipulate<\/a> light, creating the appearance of deeper saturation without the birds necessarily having to maintain a carotenoid-rich diet. These findings suggest that _______", "bodyPlain": "Birds of many species ingest foods containing carotenoids, pigmented molecules that are converted into feather coloration. Coloration tends to be especially saturated in male birds' feathers, and because carotenoids also confer health benefits, the deeply saturated colors generally serve to communicate what is known as an honest signal of a bird's overall fitness to potential mates. However, ornithologist Allison J. Shultz and others have found that males in several species of the tanager genus Ramphocelus use microstructures in their feathers to manipulate light, creating the appearance of deeper saturation without the birds necessarily having to maintain a carotenoid-rich diet. These findings suggest that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "許多種類的鳥會攝取含有類胡蘿蔔素的食物；類胡蘿蔔素是一種帶有色素的分子，會被轉化為羽毛的顏色。雄鳥羽毛的顏色往往特別飽和，而且由於類胡蘿蔔素也有益健康，這種深度飽和的顏色通常可以向潛在配偶傳達一種所謂的「誠實訊號」，顯示鳥的整體健康狀況。然而，鳥類學家 Allison J.Shultz 等人發現，唐納雀屬 Ramphocelus 中數個物種的雄鳥會利用羽毛中的微結構來操控光線，創造出更深的飽和度外觀，而這些鳥不一定需要維持富含類胡蘿蔔素的飲食。這些發現顯示 _______", "opts": {"A": "individual male tanagers can engage in honest signaling without relying on carotenoid consumption.", "B": "feather microstructures may be less effective than deeply saturated feathers for signaling overall fitness.", "C": "scientists have yet to determine why tanagers have a preference for mates with colorful appearances.", "D": "a male tanager's appearance may function as a dishonest signal of the individual's overall fitness."}, "optsZh": {"A": "個別雄性唐納雀可以不依賴攝取類胡蘿蔔素而進行誠實信號的展示。", "B": "羽毛的微結構在顯示整體健康狀況方面，可能不如色彩飽和的羽毛有效。", "C": "科學家尚未確定為什麼唐納雀偏好外表色彩鮮豔的配偶。", "D": "雄性唐納雀的外觀可能是個體整體健康狀況的不誠實信號。"}, "answer": "D", "expl": "Males can look deeply saturated without a carotenoid-rich diet, so their color may not honestly reflect fitness—a dishonest signal.", "explZh": "雄鳥不必攝取大量類胡蘿蔔素也能呈現飽和色彩，因此其外觀可能無法真實反映健康狀況，是「不誠實的訊號」。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Inferences: draw a conclusion that complicates an honest-signal theory.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Farmers in one region adopted a planting technique invented by a distant Indigenous nation, but records show that few of the farmers had direct contact with that nation. If the technique was not independently invented, the evidence suggests ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n某個地區的農民採用了一個遙遠原住民族所發明的種植技術，但紀錄顯示，這些農民中很少有人與該民族有直接接觸。如果這項技術並非獨立發明的，證據顯示 ______", "opts": {"A": "the farmers likely learned it through intermediaries who had more direct contact with the original practitioners.", "B": "the technique could not have been useful in the region.", "C": "the Indigenous nation adopted the technique from those farmers.", "D": "the records prove that all farms used identical crops."}, "optsZh": {"A": "那些農民很可能是透過與最初使用者有更直接接觸的中間人學到這項技術的。", "B": "這項技術在該地區不可能派上用場。", "C": "這個原住民族是從那些農民那裡學到這項技術的。", "D": "這些紀錄證明所有農場都種植完全相同的作物。"}, "answer": "A", "expl": "Indirect transmission best explains the evidence.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Inferences: draw a conclusion that complicates an honest-signal theory.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Artifacts at a coastal settlement include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Artifacts at a coastal settlement include beads made two centuries before the settlement was founded. If both the bead dates and the founding date are accurate, then the beads likely ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n一處沿海聚落出土的文物中，包含了在該聚落建立前兩個世紀所製作的珠子。如果珠子的年代與聚落建立的年代都正確，那麼這些珠子很可能 ______", "opts": {"A": "prove the settlement was founded two centuries earlier.", "B": "were all produced by the settlement's first residents.", "C": "show that dating methods are never useful.", "D": "were made elsewhere and reached the settlement through trade, inheritance, or migration."}, "optsZh": {"A": "證明這個聚落早了兩個世紀建立。", "B": "全都是由這個聚落最早的居民製作的。", "C": "顯示定年方法從來都沒有用。", "D": "是在別處製作，再透過貿易、繼承或遷徙傳到這個聚落的。"}, "answer": "D", "expl": "Older objects can move before being deposited at a later site.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Inferences: draw a conclusion that complicates an honest-signal theory.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Researchers replaced a plant protein with a similar protein from a species that does not change flowering time when temperatures rise. The altered plants grew normally at moderate temperatures but failed to accelerate flowering under warmer conditions, unlike unmodified plants. The results suggest that ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n研究人員將一種植物蛋白質替換成另一個物種的類似蛋白質，而該物種在氣溫上升時並不會改變開花時間。經過改造的植物在溫和氣溫下生長正常，但與未經改造的植物不同，它們在較溫暖的環境下無法提早開花。研究結果顯示 ______", "opts": {"A": "all plants accelerate flowering at the same temperature.", "B": "the original protein helps the plant respond to increased temperature.", "C": "the replacement protein improves warm-weather flowering.", "D": "temperature has no effect on the species."}, "optsZh": {"A": "所有植物都在相同的溫度下加速開花。", "B": "原本的蛋白質幫助植物對溫度升高做出反應。", "C": "替代的蛋白質能改善溫暖天氣下的開花情形。", "D": "溫度對這個物種沒有影響。"}, "answer": "B", "expl": "Only plants with the original protein showed the temperature response.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Inferences: draw a conclusion that complicates an honest-signal theory.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A study compares students&#x27; reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A study compares students' reasoning using puzzles that differ greatly in reading difficulty. Because some students received simple wording and others received dense technical descriptions, the results ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一項研究使用閱讀難度差異極大的謎題來比較學生的推理能力。由於有些學生拿到的是簡單的措辭，另一些學生拿到的則是艱深的技術性描述，研究結果 ______", "opts": {"A": "can be generalized to every kind of test.", "B": "show that wording never affects performance.", "C": "prove that all students have the same reasoning ability.", "D": "may reflect differences in reading load rather than differences in reasoning ability."}, "optsZh": {"A": "可以推廣到每一種測驗。", "B": "顯示措辭從不影響表現。", "C": "證明所有學生的推理能力都相同。", "D": "可能反映的是閱讀負擔的差異，而非推理能力的差異。"}, "answer": "D", "expl": "An uncontrolled task feature limits the conclusion.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Inferences: draw a conclusion that complicates an honest-signal theory.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A manuscript mostly preserves songs from before a migration, but several lines refer to places the community encountered only after that migration. Scholars therefore infer that ______", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n一份手稿主要保存了遷徙之前的歌謠，但其中有幾行提到的地方，是這個群體在遷徙之後才接觸到的。因此，學者推斷 ______", "opts": {"A": "the scribes were unable to understand the songs.", "B": "the references to later places must be accidental.", "C": "the manuscript probably combines earlier material with later additions or revisions.", "D": "none of the songs can predate the migration."}, "optsZh": {"A": "抄寫員無法理解這些歌曲。", "B": "提及後來地點的內容必定是出於偶然。", "C": "這份手稿很可能結合了較早的素材與後來的增補或修訂。", "D": "沒有任何一首歌可能早於這次遷徙。"}, "answer": "C", "expl": "Mixed evidence supports mixed origins.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English: subject-verb agreement and tense.", "vocab": false, "body": "When writing The Other Black Girl (2021), novelist Zakiya Dalila Harris drew on her own experiences working at a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publishing\" target=\"_blank\" rel=\"noopener\" data-w=\"publishing\" data-pos=\"n.\" data-en=\"the business of producing books and magazines\" data-zh=\"出版業\">publishing<\/a> office. The award-winning book is Harris&#x27;s first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novel\" target=\"_blank\" rel=\"noopener\" data-w=\"novel\" data-pos=\"adj.\" data-en=\"new and original; not seen before\" data-zh=\"新穎的；新奇的\">novel<\/a>, but her writing _______ honored before. At the age of twelve, she entered a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contest\" target=\"_blank\" rel=\"noopener\" data-w=\"contest\" data-pos=\"n.\" data-en=\"a competition\" data-zh=\"比賽；競賽\">contest<\/a> to have a story published in American Girl magazine-and won.", "bodyPlain": "When writing The Other Black Girl (2021), novelist Zakiya Dalila Harris drew on her own experiences working at a publishing office. The award-winning book is Harris's first novel, but her writing _______ honored before. At the age of twelve, she entered a contest to have a story published in American Girl magazine-and won.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在撰寫《The Other Black Girl》（2021）時，小說家 Zakiya Dalila Harris 汲取了自己在出版社工作的經驗。這本得獎的書是 Harris 的第一部小說，但她的寫作 _______ 獲得肯定。十二歲時，她參加了一項比賽，爭取讓自己的故事刊登在《American Girl》雜誌上——結果她贏了。", "opts": {"A": "were", "B": "have been", "C": "has been", "D": "are"}, "optsZh": {"A": "were（複數過去式，與單數主詞不一致且缺少完成式：錯誤）", "B": "have been（複數完成式，與單數主詞 writing 不一致：錯誤）", "C": "has been（現在完成式，單數主詞：正確）", "D": "are（複數現在式，與單數主詞 writing 不一致：錯誤）"}, "answer": "C", "expl": "The subject 'writing' is singular, and 'before' points to the past up to now, so the singular present perfect 'has been' is correct.", "explZh": "主詞「writing」是單數，「before」表示從過去到現在的經驗，所以用單數現在完成式「has been」。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English: subject-verb agreement and tense.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "includes", "B": "to include", "C": "including", "D": "having included"}, "optsZh": {"A": "includes（第三人稱單數現在式，作關係子句的動詞：正確）", "B": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "C": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）", "D": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English: subject-verb agreement and tense.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices,", "B": "prices, but", "C": "prices", "D": "prices but"}, "optsZh": {"A": "prices,（只有逗號 → 造成逗號連接錯誤）", "B": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "C": "prices（無標點：錯誤）", "D": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）"}, "answer": "B", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English: subject-verb agreement and tense.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "however,", "B": "However;", "C": "However", "D": "However,"}, "optsZh": {"A": "however,（小寫 however → 句首應大寫：錯誤）", "B": "However;（句首轉折詞後接分號：錯誤）", "C": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "D": "However,（句首轉折詞後加逗號：正確）"}, "answer": "D", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English: subject-verb agreement and tense.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "whenever", "B": "whenever,", "C": "; whenever", "D": ". Whenever"}, "optsZh": {"A": "whenever（從屬連接詞，不加標點：正確）", "B": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "C": "; whenever（分號 → 後面接的不是獨立子句：錯誤）", "D": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）"}, "answer": "A", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English: subject-verb agreement and tense.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "have expanded", "B": "expand", "C": "has expanded", "D": "are expanding"}, "optsZh": {"A": "have expanded（複數完成式，主詞為單數：錯誤）", "B": "expand（複數動詞原形，主詞為單數：錯誤）", "C": "has expanded（現在完成式，單數主詞：正確）", "D": "are expanding（複數現在進行式，主詞為單數：錯誤）"}, "answer": "C", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: comma before but joining independent clauses.", "vocab": false, "body": "The Alvarez theory, developed in 1980 by physicist Luis Walter Alvarez and his geologist son Walter Alvarez, maintained that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secondary\" target=\"_blank\" rel=\"noopener\" data-w=\"secondary\" data-pos=\"adj.\" data-en=\"less important than something else\" data-zh=\"次要的\">secondary<\/a> effects of an asteroid impact caused many dinosaurs and other animals to die _______ it left unexplored the question of whether <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unrelated\" target=\"_blank\" rel=\"noopener\" data-w=\"unrelated\" data-pos=\"adj.\" data-en=\"not connected\" data-zh=\"無關的；不相關的\">unrelated<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> activity might have also contributed to the mass <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extinction\" target=\"_blank\" rel=\"noopener\" data-w=\"extinction\" data-pos=\"n.\" data-en=\"the dying out of a whole species\" data-zh=\"滅絕\">extinctions<\/a>.", "bodyPlain": "The Alvarez theory, developed in 1980 by physicist Luis Walter Alvarez and his geologist son Walter Alvarez, maintained that the secondary effects of an asteroid impact caused many dinosaurs and other animals to die _______ it left unexplored the question of whether unrelated volcanic activity might have also contributed to the mass extinctions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "由物理學家 Luis Walter Alvarez 與他身為地質學家的兒子 Walter Alvarez 於 1980 年提出的 Alvarez 理論主張，小行星撞擊的次生效應導致許多恐龍及其他動物死亡 _______ 它並未探討不相關的火山活動是否也可能促成了這些大滅絕。", "opts": {"A": "out but", "B": "out, but", "C": "out", "D": "out,"}, "optsZh": {"A": "out but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "B": "out, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "C": "out（無標點 → 兩個獨立子句直接相連：錯誤）", "D": "out,（只有逗號 → 造成逗號連接錯誤）"}, "answer": "B", "expl": "Two independent clauses joined by the coordinating conjunction 'but' need a comma before 'but.'", "explZh": "以對等連接詞 but 連接兩個獨立子句時，but 前面需要加逗號。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: comma before but joining independent clauses.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "to include", "B": "includes", "C": "having included", "D": "including"}, "optsZh": {"A": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "B": "includes（第三人稱單數現在式，作關係子句的動詞：正確）", "C": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）", "D": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: comma before but joining independent clauses.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices but", "B": "prices", "C": "prices, but", "D": "prices,"}, "optsZh": {"A": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "B": "prices（無標點：錯誤）", "C": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "D": "prices,（只有逗號 → 造成逗號連接錯誤）"}, "answer": "C", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: comma before but joining independent clauses.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However,", "B": "however,", "C": "However", "D": "However;"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "however,（小寫 however → 句首應大寫：錯誤）", "C": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "D": "However;（句首轉折詞後接分號：錯誤）"}, "answer": "A", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: comma before but joining independent clauses.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever,", "C": "whenever", "D": "; whenever"}, "optsZh": {"A": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "B": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "C": "whenever（從屬連接詞，不加標點：正確）", "D": "; whenever（分號 → 後面接的不是獨立子句：錯誤）"}, "answer": "C", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: comma before but joining independent clauses.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english
