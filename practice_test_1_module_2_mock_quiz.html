<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 1, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 1, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnDlDoc">⬇ Download wrong (Word 錯題講義)</button>
      <label class="scope">下載範圍 <select id="dlScope"><option value="session">本次作答 This attempt</option><option value="all">全部錯題本 All saved</option></select></label>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: attentive to details.", "vocab": true, "body": "For painter Jacob Lawrence, being _______ was an important part of the artistic process. Because he paid close attention to all the details of his Harlem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a>, Lawrence&#x27;s artwork captured <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nuance\" target=\"_blank\" rel=\"noopener\" data-w=\"nuance\" data-pos=\"n.\" data-en=\"a very small difference in meaning, color, or feeling\" data-zh=\"細微差別\">nuances<\/a> in the beauty and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vitality\" target=\"_blank\" rel=\"noopener\" data-w=\"vitality\" data-pos=\"n.\" data-en=\"energy, strength, and liveliness\" data-zh=\"活力；生命力\">vitality<\/a> of the Black experience during the Harlem Renaissance and the Great Migration.", "bodyPlain": "For painter Jacob Lawrence, being _______ was an important part of the artistic process. Because he paid close attention to all the details of his Harlem neighborhood, Lawrence's artwork captured nuances in the beauty and vitality of the Black experience during the Harlem Renaissance and the Great Migration.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "對畫家 Jacob Lawrence 而言，保持 _______ 是藝術創作過程中的重要一環。由於他密切留意哈林區鄰里的一切細節，Lawrence 的作品捕捉到了哈林文藝復興與黑人大遷徙時期黑人生活經驗中美感與活力的細微之處。", "opts": {"A": "skeptical", "B": "observant", "C": "critical", "D": "confident"}, "optsZh": {"A": "skeptical（懷疑的）", "B": "observant（善於觀察的）", "C": "critical（批判的、關鍵的）", "D": "confident（有自信的）"}, "answer": "B", "expl": "Lawrence 'paid close attention to all the details,' so being 'observant' (quick to notice things) was part of his process.", "explZh": "Lawrence「密切注意所有細節」，因此「observant」（善於觀察的）是他創作過程的重要部分。", "defs": {"A": {"pos": "adj.", "en": "doubting that something is true", "zh": "懷疑的；持保留態度的", "word": "skeptical"}, "B": {"pos": "adj.", "en": "quick to notice details", "zh": "觀察敏銳的；善於觀察的", "word": "observant"}, "C": {"pos": "adj.", "en": "very important; or expressing disapproval", "zh": "關鍵的；批判的；挑剔的", "word": "critical"}, "D": {"pos": "adj.", "en": "feeling sure of oneself or of something", "zh": "有信心的；自信的；確信的", "word": "confident"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: attentive to details.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The documentary photographer&#x27;s portraits feel intimate because she was unusually ______; she noticed not only facial expressions but also the worn tools, taped windows, and half-finished meals that revealed how her subjects lived.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The documentary photographer's portraits feel intimate because she was unusually ______; she noticed not only facial expressions but also the worn tools, taped windows, and half-finished meals that revealed how her subjects lived.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這位紀實攝影師的肖像作品令人感到親密，因為她格外 ______；她不僅注意到人物的臉部表情，也留意到那些磨損的工具、貼著膠帶的窗戶，以及吃到一半的飯菜，這些都透露出拍攝對象的生活方式。", "opts": {"A": "observant", "B": "detached", "C": "impulsive", "D": "skeptical"}, "optsZh": {"A": "observant（善於觀察的）", "B": "detached（疏離的、超然的）", "C": "impulsive（衝動的）", "D": "skeptical（懷疑的）"}, "answer": "A", "expl": "Observant means quick to notice details.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "quick to notice details", "zh": "觀察敏銳的；善於觀察的", "word": "observant"}, "B": {"pos": "adj.", "en": "emotionally uninvolved or separated; not connected", "zh": "超然的；冷漠的；分離的", "word": "detached"}, "C": {"pos": "adj.", "en": "acting suddenly without careful thought", "zh": "衝動的；一時興起的", "word": "impulsive"}, "D": {"pos": "adj.", "en": "doubting that something is true", "zh": "懷疑的；持保留態度的", "word": "skeptical"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: attentive to details.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. During fieldwork in a crowded market, the anthropologist remained ______, recording small gestures between vendors and customers that other researchers had dismissed as ordinary <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a> activity.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During fieldwork in a crowded market, the anthropologist remained ______, recording small gestures between vendors and customers that other researchers had dismissed as ordinary background activity.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n在擁擠市集進行田野調查期間，這位人類學家始終保持 ______，記錄下攤販與顧客之間的細微動作，而其他研究人員卻把這些當作平凡的背景活動而不予理會。", "opts": {"A": "reckless", "B": "confident", "C": "indifferent", "D": "attentive"}, "optsZh": {"A": "reckless（魯莽的）", "B": "confident（有自信的）", "C": "indifferent（漠不關心的）", "D": "attentive（專注的、留心的）"}, "answer": "D", "expl": "Attentive means carefully noticing and considering details.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not caring about danger or the results of one's actions", "zh": "魯莽的；不顧後果的", "word": "reckless"}, "B": {"pos": "adj.", "en": "feeling sure of oneself or of something", "zh": "有信心的；自信的；確信的", "word": "confident"}, "C": {"pos": "adj.", "en": "having no interest or concern", "zh": "漠不關心的；冷淡的", "word": "indifferent"}, "D": {"pos": "adj.", "en": "paying close attention; watchful", "zh": "專注的；留心的", "word": "attentive"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: attentive to details.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The novelist&#x27;s city scenes are convincing because she is ______: she registers the rhythm of street vendors&#x27; calls, the timing of buses, and the quiet routines that shape daily life.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The novelist's city scenes are convincing because she is ______: she registers the rhythm of street vendors' calls, the timing of buses, and the quiet routines that shape daily life.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這位小說家筆下的城市場景令人信服，因為她很 ______：她留意到街頭小販叫賣的節奏、公車的班次時間，以及形塑日常生活的安靜例行事務。", "opts": {"A": "careless", "B": "perceptive", "C": "hesitant", "D": "argumentative"}, "optsZh": {"A": "careless（粗心的）", "B": "perceptive（敏銳的、有洞察力的）", "C": "hesitant（猶豫的）", "D": "argumentative（好爭論的）"}, "answer": "B", "expl": "Perceptive means able to notice and understand subtle details.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not paying enough attention; causing mistakes", "zh": "粗心的；疏忽的", "word": "careless"}, "B": {"pos": "adj.", "en": "quick to notice and understand things", "zh": "有洞察力的；敏銳的", "word": "perceptive"}, "C": {"pos": "adj.", "en": "slow to act or speak because of doubt or uncertainty", "zh": "猶豫的；遲疑的", "word": "hesitant"}, "D": {"pos": "adj.", "en": "tending to argue or disagree", "zh": "好爭論的；愛抬槓的", "word": "argumentative"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: attentive to details.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A wildlife tracker must be ______ enough to identify a bent reed, a faint footprint, or a sudden silence among birds as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> that an animal recently passed through the area.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A wildlife tracker must be ______ enough to identify a bent reed, a faint footprint, or a sudden silence among birds as evidence that an animal recently passed through the area.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n野生動物追蹤者必須足夠 ______，才能把一根彎折的蘆葦、一個模糊的腳印，或鳥群突然的安靜，辨識為某隻動物最近曾經過此地的證據。", "opts": {"A": "casual", "B": "restless", "C": "watchful", "D": "dismissive"}, "optsZh": {"A": "casual（隨意的、漫不經心的）", "B": "restless（不安的、靜不下來的）", "C": "watchful（警覺的、留心的）", "D": "dismissive（輕視的、不屑一顧的）"}, "answer": "C", "expl": "Watchful means alert and carefully observant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "relaxed and informal; not planned or required", "zh": "隨意的；非正式的；不經意的", "word": "casual"}, "B": {"pos": "adj.", "en": "unable to stay still or relax", "zh": "焦躁不安的；坐立不安的", "word": "restless"}, "C": {"pos": "adj.", "en": "paying close attention to possible danger or detail", "zh": "警惕的；留意的", "word": "watchful"}, "D": {"pos": "adj.", "en": "showing that something is not worth considering", "zh": "不屑一顧的；輕視的", "word": "dismissive"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: attentive to details.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The critic praised the painter&#x27;s ______ eye, noting that even the background objects in the canvas-a chipped cup, a folded newspaper, and a loose thread on a sleeve-contributed to the scene&#x27;s emotional force.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The critic praised the painter's ______ eye, noting that even the background objects in the canvas-a chipped cup, a folded newspaper, and a loose thread on a sleeve-contributed to the scene's emotional force.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n這位評論家稱讚這位畫家 ______ 的眼光，指出就連畫布上的背景物件——一個有缺口的杯子、一份摺起的報紙、袖子上一根鬆脫的線頭——都增添了畫面的情感力量。", "opts": {"A": "skeptical", "B": "unfocused", "C": "discerning", "D": "impatient"}, "optsZh": {"A": "skeptical（懷疑的）", "B": "unfocused（不專注的）", "C": "discerning（有洞察力的、眼光敏銳的）", "D": "impatient（不耐煩的）"}, "answer": "C", "expl": "Discerning means showing good judgment and careful perception.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "doubting that something is true", "zh": "懷疑的；持保留態度的", "word": "skeptical"}, "B": {"pos": "adj.", "en": "not concentrated on one thing; lacking clear direction", "zh": "不專注的；缺乏焦點的", "word": "unfocused"}, "C": {"pos": "adj.", "en": "showing good judgment and the ability to notice fine differences", "zh": "有眼光的；有辨別力的", "word": "discerning"}, "D": {"pos": "adj.", "en": "unwilling to wait; easily annoyed by delays", "zh": "不耐煩的；急躁的", "word": "impatient"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: considerable in amount or importance.", "vocab": true, "body": "Monica Lopes-Ferreira and others at Brazil&#x27;s Butantan Institute are studying the freshwater stingray species Potamotrygon rex to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether biological characteristics such as the rays&#x27; age and sex have _______ effect on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=toxicity\" target=\"_blank\" rel=\"noopener\" data-w=\"toxicity\" data-pos=\"n.\" data-en=\"the degree to which something is poisonous\" data-zh=\"毒性\">toxicity<\/a> of their venom-that is, to see if differences in these traits are associated with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=considerable\" target=\"_blank\" rel=\"noopener\" data-w=\"considerable\" data-pos=\"adj.\" data-en=\"large in size, amount, or importance\" data-zh=\"相當大的；可觀的\">considerable<\/a> variations in venom <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=potency\" target=\"_blank\" rel=\"noopener\" data-w=\"potency\" data-pos=\"n.\" data-en=\"strength or power to produce an effect\" data-zh=\"效力；強度\">potency<\/a>.", "bodyPlain": "Monica Lopes-Ferreira and others at Brazil's Butantan Institute are studying the freshwater stingray species Potamotrygon rex to determine whether biological characteristics such as the rays' age and sex have _______ effect on the toxicity of their venom-that is, to see if differences in these traits are associated with considerable variations in venom potency.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "巴西 Butantan 研究所的 Monica Lopes-Ferreira 等人正在研究淡水魟魚 Potamotrygon rex，以確定魟魚的年齡與性別等生物特徵是否對其毒液的毒性有 _______ 影響——也就是說，要了解這些特徵的差異是否與毒液強度的顯著變化有關。", "opts": {"A": "a disconcerting", "B": "an acceptable", "C": "an imperceptible", "D": "a substantial"}, "optsZh": {"A": "a disconcerting（令人不安的）", "B": "an acceptable（可接受的）", "C": "an imperceptible（難以察覺的）", "D": "a substantial（相當大的）"}, "answer": "D", "expl": "The text explains the goal as checking for 'considerable variations,' so the researchers want to know whether age and sex have 'a substantial' effect.", "explZh": "文中說明目的是查看是否有「相當大的差異」，因此要知道年齡與性別是否有「substantial」（相當大的）影響。", "defs": {"A": {"w": "disconcerting", "pos": "adj.", "en": "causing worry, confusion, or unease", "zh": "令人不安的；使人困惑的", "word": "disconcerting"}, "B": {"w": "acceptable", "pos": "adj.", "en": "good enough to be allowed or approved", "zh": "可接受的；尚可的", "word": "acceptable"}, "C": {"w": "imperceptible", "pos": "adj.", "en": "too small or slight to be noticed", "zh": "察覺不到的；極細微的", "word": "imperceptible"}, "D": {"w": "substantial", "pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；相當大的；重大的", "word": "substantial"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: considerable in amount or importance.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The engineers wanted to know whether small changes in blade angle would have a ______ effect on energy production, so they compared turbines under identical wind conditions and measured even minor differences in output.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The engineers wanted to know whether small changes in blade angle would have a ______ effect on energy production, so they compared turbines under identical wind conditions and measured even minor differences in output.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n工程師們想知道葉片角度的微小改變是否會對發電量產生 ______ 影響，因此他們在相同的風力條件下比較渦輪機，並測量輸出上即使是極小的差異。", "opts": {"A": "substantial", "B": "temporary", "C": "trivial", "D": "decorative"}, "optsZh": {"A": "substantial（相當大的、大量的）", "B": "temporary（暫時的）", "C": "trivial（瑣碎的、不重要的）", "D": "decorative（裝飾性的）"}, "answer": "A", "expl": "Substantial means considerable in size, value, or importance.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；相當大的；重大的", "word": "substantial"}, "B": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}, "C": {"pos": "adj.", "en": "of little value or importance", "zh": "瑣碎的；微不足道的", "word": "trivial"}, "D": {"pos": "adj.", "en": "serving to make something look attractive", "zh": "裝飾性的；裝飾用的", "word": "decorative"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: considerable in amount or importance.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The new policy did not merely change the wording of applications; by reducing fees and simplifying documentation, it had a ______ impact on the number of families able to request assistance.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The new policy did not merely change the wording of applications; by reducing fees and simplifying documentation, it had a ______ impact on the number of families able to request assistance.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這項新政策不只是更改了申請表的措辭；藉由降低費用並簡化文件，它對能夠申請補助的家庭數量產生了 ______ 影響。", "opts": {"A": "accidental", "B": "symbolic", "C": "imperceptible", "D": "considerable"}, "optsZh": {"A": "accidental（意外的、偶然的）", "B": "symbolic（象徵性的）", "C": "imperceptible（難以察覺的）", "D": "considerable（相當大的、可觀的）"}, "answer": "D", "expl": "Considerable means notably large or important.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening by chance, not on purpose", "zh": "意外的；偶然的", "word": "accidental"}, "B": {"pos": "adj.", "en": "serving as a symbol; representing something else", "zh": "象徵性的；象徵的", "word": "symbolic"}, "C": {"pos": "adj.", "en": "too small or slight to be noticed", "zh": "察覺不到的；極細微的", "word": "imperceptible"}, "D": {"pos": "adj.", "en": "large in size, amount, or importance", "zh": "相當大的；可觀的", "word": "considerable"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: considerable in amount or importance.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Although the medication&#x27;s side effects were mild for most participants, its benefits were ______, with patients in the trial reporting far greater mobility than those who received the placebo.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the medication's side effects were mild for most participants, its benefits were ______, with patients in the trial reporting far greater mobility than those who received the placebo.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n雖然這種藥物對大多數受試者的副作用都很輕微，但它的益處卻是 ______，試驗中的病患回報的行動能力遠優於服用安慰劑的人。", "opts": {"A": "questionable", "B": "unrelated", "C": "significant", "D": "unmeasured"}, "optsZh": {"A": "questionable（可疑的）", "B": "unrelated（不相關的）", "C": "significant（重大的、顯著的）", "D": "unmeasured（未經測量的）"}, "answer": "C", "expl": "Significant means important or large enough to matter.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "doubtful or not certain to be true or proper", "zh": "可疑的；有疑問的", "word": "questionable"}, "B": {"pos": "adj.", "en": "not connected", "zh": "無關的；不相關的", "word": "unrelated"}, "C": {"pos": "adj.", "en": "large or important enough to have an effect", "zh": "重大的；顯著的；有意義的", "word": "significant"}, "D": {"pos": "adj.", "en": "not measured or calculated", "zh": "未經測量的；無法衡量的", "word": "unmeasured"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: considerable in amount or importance.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The committee expected only minor savings, but the revised shipping schedule produced a ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduction\" target=\"_blank\" rel=\"noopener\" data-w=\"reduction\" data-pos=\"n.\" data-en=\"the act of making something smaller or less\" data-zh=\"減少\">reduction<\/a> in costs across all three regional offices.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The committee expected only minor savings, but the revised shipping schedule produced a ______ reduction in costs across all three regional offices.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n委員會原本只預期能省下少量經費，但修訂後的運送時程卻讓三個區域辦公室的成本都出現了 ______ 下降。", "opts": {"A": "acceptable", "B": "temporary", "C": "misleading", "D": "marked"}, "optsZh": {"A": "acceptable（可接受的）", "B": "temporary（暫時的）", "C": "misleading（誤導的）", "D": "marked（顯著的、明顯的）"}, "answer": "D", "expl": "Marked means clearly noticeable or significant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "good enough to be allowed or approved", "zh": "可接受的；尚可的", "word": "acceptable"}, "B": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}, "C": {"pos": "adj.", "en": "giving the wrong idea or impression", "zh": "誤導的；使人誤解的", "word": "misleading"}, "D": {"pos": "adj.", "en": "clearly noticeable", "zh": "明顯的；顯著的", "word": "marked"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: considerable in amount or importance.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers tested whether soil acidity had a ______ influence on seedling growth; the large differences among the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> groups suggested that pH was not a minor factor.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers tested whether soil acidity had a ______ influence on seedling growth; the large differences among the experimental groups suggested that pH was not a minor factor.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n研究人員檢驗土壤酸度是否對幼苗生長有 ______ 影響；各實驗組之間的巨大差異顯示，酸鹼值並非次要因素。", "opts": {"A": "confusing", "B": "pronounced", "C": "routine", "D": "negligible"}, "optsZh": {"A": "confusing（令人困惑的）", "B": "pronounced（顯著的、明顯的）", "C": "routine（例行的）", "D": "negligible（微不足道的、可忽略的）"}, "answer": "B", "expl": "Pronounced means very noticeable or strong.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "difficult to understand; unclear", "zh": "令人困惑的；混亂的", "word": "confusing"}, "B": {"pos": "adj.", "en": "very noticeable; strongly marked", "zh": "明顯的；顯著的", "word": "pronounced"}, "C": {"pos": "adj.", "en": "ordinary and done regularly as part of normal practice", "zh": "例行的；平常的", "word": "routine"}, "D": {"pos": "adj.", "en": "so small or unimportant that it can be ignored", "zh": "微不足道的；可忽略的", "word": "negligible"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: without conscious control.", "vocab": true, "body": "Researchers have struggled to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pinpoint\" target=\"_blank\" rel=\"noopener\" data-w=\"pinpoint\" data-pos=\"v.\" data-en=\"to find or identify something exactly\" data-zh=\"精確找出；準確指出\">pinpoint<\/a> specific causes for hiccups, which happen when a person&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=diaphragm\" target=\"_blank\" rel=\"noopener\" data-w=\"diaphragm\" data-pos=\"n.\" data-en=\"the large muscle between the chest and stomach used in breathing\" data-zh=\"橫膈膜\">diaphragm<\/a> contracts _______. However, neuroscientist Kimberley Whitehead has found that these uncontrollable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contraction\" target=\"_blank\" rel=\"noopener\" data-w=\"contraction\" data-pos=\"n.\" data-en=\"the tightening or shortening of a muscle\" data-zh=\"收縮\">contractions<\/a> may play an important role in helping infants <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=regulate\" target=\"_blank\" rel=\"noopener\" data-w=\"regulate\" data-pos=\"v.\" data-en=\"to control something so it works correctly\" data-zh=\"調節；控制\">regulate<\/a> their breathing.", "bodyPlain": "Researchers have struggled to pinpoint specific causes for hiccups, which happen when a person's diaphragm contracts _______. However, neuroscientist Kimberley Whitehead has found that these uncontrollable contractions may play an important role in helping infants regulate their breathing.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究人員一直難以確切找出打嗝的具體成因；打嗝是在一個人的橫膈膜 _______ 收縮時發生的。然而，神經科學家 Kimberley Whitehead 發現，這些無法控制的收縮可能在幫助嬰兒調節呼吸上扮演重要角色。", "opts": {"A": "involuntarily", "B": "beneficially", "C": "strenuously", "D": "smoothly"}, "optsZh": {"A": "involuntarily（不由自主地）", "B": "beneficially（有益地）", "C": "strenuously（費力地、激烈地）", "D": "smoothly（順利地）"}, "answer": "A", "expl": "The next sentence calls the contractions 'uncontrollable,' so the diaphragm contracts 'involuntarily' (without conscious control).", "explZh": "下一句稱這些收縮為「無法控制的」，所以橫膈膜是「involuntarily」（不由自主地）收縮。", "defs": {"A": {"pos": "adv.", "en": "without conscious control or choice", "zh": "不由自主地；非自願地", "word": "involuntarily"}, "B": {"pos": "adv.", "en": "in a way that is helpful or produces good results", "zh": "有益地；有利地", "word": "beneficially"}, "C": {"pos": "adv.", "en": "with great energy or effort", "zh": "費力地；奮力地；強烈地", "word": "strenuously"}, "D": {"pos": "adv.", "en": "without problems or difficulties", "zh": "順利地；平穩地", "word": "smoothly"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: without conscious control.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The patient&#x27;s hand moved ______ when the physician tapped a tendon below the knee; the motion occurred before the patient had time to decide how to respond.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The patient's hand moved ______ when the physician tapped a tendon below the knee; the motion occurred before the patient had time to decide how to respond.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n當醫師輕敲膝蓋下方的肌腱時，病人的手 ______ 動了一下；這個動作發生在病人還來不及決定如何反應之前。", "opts": {"A": "involuntarily", "B": "smoothly", "C": "beneficially", "D": "deliberately"}, "optsZh": {"A": "involuntarily（不由自主地）", "B": "smoothly（順利地）", "C": "beneficially（有益地）", "D": "deliberately（故意地、刻意地）"}, "answer": "A", "expl": "Involuntarily means without conscious control.", "explZh": "", "defs": {"A": {"pos": "adv.", "en": "without conscious control or choice", "zh": "不由自主地；非自願地", "word": "involuntarily"}, "B": {"pos": "adv.", "en": "without problems or difficulties", "zh": "順利地；平穩地", "word": "smoothly"}, "C": {"pos": "adv.", "en": "in a way that is helpful or produces good results", "zh": "有益地；有利地", "word": "beneficially"}, "D": {"pos": "adv.", "en": "on purpose; intentionally", "zh": "故意地；刻意地", "word": "deliberately"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: without conscious control.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. During sleep studies, researchers observed that some participants&#x27; leg muscles contracted ______, producing movements that the participants did not remember making when they woke.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During sleep studies, researchers observed that some participants' leg muscles contracted ______, producing movements that the participants did not remember making when they woke.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n在睡眠研究中，研究人員觀察到部分受試者的腿部肌肉會 ______ 收縮，產生一些受試者醒來後並不記得自己做過的動作。", "opts": {"A": "politely", "B": "carefully", "C": "strenuously", "D": "automatically"}, "optsZh": {"A": "politely（有禮貌地）", "B": "carefully（小心地）", "C": "strenuously（費力地、激烈地）", "D": "automatically（自動地、不自覺地）"}, "answer": "D", "expl": "Automatically means occurring without conscious control.", "explZh": "", "defs": {"A": {"pos": "adv.", "en": "in a courteous, respectful way", "zh": "有禮貌地；客氣地", "word": "politely"}, "B": {"pos": "adv.", "en": "with close attention so as to avoid mistakes or harm", "zh": "小心地；仔細地", "word": "carefully"}, "C": {"pos": "adv.", "en": "with great energy or effort", "zh": "費力地；奮力地；強烈地", "word": "strenuously"}, "D": {"pos": "adv.", "en": "without conscious thought or control; by itself", "zh": "自動地；不假思索地", "word": "automatically"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: without conscious control.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The frog&#x27;s sudden jump was not a learned response but a reflexive one: its muscles contracted ______ when the shadow passed overhead.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The frog's sudden jump was not a learned response but a reflexive one: its muscles contracted ______ when the shadow passed overhead.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這隻青蛙突然的跳躍並非學習而來的反應，而是一種反射動作：當陰影從頭頂掠過時，牠的肌肉 ______ 收縮。", "opts": {"A": "rarely", "B": "beneficially", "C": "smoothly", "D": "unconsciously"}, "optsZh": {"A": "rarely（很少）", "B": "beneficially（有益地）", "C": "smoothly（順利地）", "D": "unconsciously（無意識地）"}, "answer": "D", "expl": "Unconsciously means without awareness or deliberate control.", "explZh": "", "defs": {"A": {"pos": "adv.", "en": "not often; seldom", "zh": "很少；難得", "word": "rarely"}, "B": {"pos": "adv.", "en": "in a way that is helpful or produces good results", "zh": "有益地；有利地", "word": "beneficially"}, "C": {"pos": "adv.", "en": "without problems or difficulties", "zh": "順利地；平穩地", "word": "smoothly"}, "D": {"pos": "adv.", "en": "without being aware", "zh": "無意識地；不知不覺地", "word": "unconsciously"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: without conscious control.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Infants may grasp a finger ______ when it touches their palm, a response that appears before they can intentionally coordinate many hand movements.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Infants may grasp a finger ______ when it touches their palm, a response that appears before they can intentionally coordinate many hand movements.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n當手指碰觸到嬰兒的掌心時，嬰兒可能會 ______ 握住它，這種反應在他們能有意識地協調許多手部動作之前就已出現。", "opts": {"A": "gradually", "B": "reflexively", "C": "awkwardly", "D": "strenuously"}, "optsZh": {"A": "gradually（逐漸地）", "B": "reflexively（反射性地）", "C": "awkwardly（笨拙地）", "D": "strenuously（費力地、激烈地）"}, "answer": "B", "expl": "Reflexively means as an automatic response.", "explZh": "", "defs": {"A": {"pos": "adv.", "en": "slowly and over a period of time", "zh": "逐漸地；漸漸地", "word": "gradually"}, "B": {"pos": "adv.", "en": "automatically, as a reflex, without conscious thought", "zh": "反射性地；本能地", "word": "reflexively"}, "C": {"pos": "adv.", "en": "in a clumsy or uncomfortable way", "zh": "笨拙地；尷尬地", "word": "awkwardly"}, "D": {"pos": "adv.", "en": "with great energy or effort", "zh": "費力地；奮力地；強烈地", "word": "strenuously"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: without conscious control.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The study distinguished voluntary movements from those that occur ______, such as blinking when air suddenly blows toward the eye.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The study distinguished voluntary movements from those that occur ______, such as blinking when air suddenly blows toward the eye.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n這項研究區分了自主動作與那些 ______ 發生的動作，例如空氣突然吹向眼睛時的眨眼。", "opts": {"A": "beneficially", "B": "confidently", "C": "spontaneously", "D": "smoothly"}, "optsZh": {"A": "beneficially（有益地）", "B": "confidently（自信地）", "C": "spontaneously（自發地、不由自主地）", "D": "smoothly（順利地）"}, "answer": "C", "expl": "Spontaneously can mean arising naturally without deliberate action.", "explZh": "", "defs": {"A": {"pos": "adv.", "en": "in a way that is helpful or produces good results", "zh": "有益地；有利地", "word": "beneficially"}, "B": {"pos": "adv.", "en": "in a sure and self-assured way", "zh": "有把握地；自信地", "word": "confidently"}, "C": {"pos": "adv.", "en": "without planning or outside cause; naturally", "zh": "自發地；自然而然地", "word": "spontaneously"}, "D": {"pos": "adv.", "en": "without problems or difficulties", "zh": "順利地；平穩地", "word": "smoothly"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: overlap or meet despite seeming separate.", "vocab": true, "body": "Critics have asserted that fine art and fashion <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rarely\" target=\"_blank\" rel=\"noopener\" data-w=\"rarely\" data-pos=\"adv.\" data-en=\"not often; seldom\" data-zh=\"很少；難得\">rarely<\/a> _______ in a world where artists create timeless works for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> and designers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=periodically\" target=\"_blank\" rel=\"noopener\" data-w=\"periodically\" data-pos=\"adv.\" data-en=\"happening again and again at regular times\" data-zh=\"定期地；週期性地\">periodically<\/a> produce new styles for the public to buy. Luiseno/Shoshone-Bannock beadwork artist and designer Jamie Okuma challenges this view: her work can be seen in the Metropolitan Museum of Art and purchased through her online <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=boutique\" target=\"_blank\" rel=\"noopener\" data-w=\"boutique\" data-pos=\"n.\" data-en=\"a small shop selling fashionable goods\" data-zh=\"精品店\">boutique<\/a>.", "bodyPlain": "Critics have asserted that fine art and fashion rarely _______ in a world where artists create timeless works for exhibition and designers periodically produce new styles for the public to buy. Luiseno/Shoshone-Bannock beadwork artist and designer Jamie Okuma challenges this view: her work can be seen in the Metropolitan Museum of Art and purchased through her online boutique.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "評論家曾主張，在一個藝術家創作永恆作品供展覽、設計師定期推出新款式供大眾購買的世界裡，純藝術與時尚很少 _______。Luiseño／Shoshone-Bannock 族的串珠藝術家暨設計師 Jamie Okuma 挑戰了這種看法：她的作品既能在大都會藝術博物館看到，也能透過她的線上精品店購買。", "opts": {"A": "prevail", "B": "succumb", "C": "diverge", "D": "intersect"}, "optsZh": {"A": "prevail（占優勢、盛行）", "B": "succumb（屈服）", "C": "diverge（分歧、分開）", "D": "intersect（交叉、相交）"}, "answer": "D", "expl": "Critics say art and fashion rarely meet; Okuma's work belongs to both worlds, so the missing verb is 'intersect' (overlap).", "explZh": "評論者認為藝術與時尚很少交集，而 Okuma 的作品同時屬於兩者，因此答案是「intersect」（交會、重疊）。", "defs": {"A": {"pos": "v.", "en": "to win or prove more powerful; to be widespread", "zh": "勝過；占優勢；盛行", "word": "prevail"}, "B": {"pos": "v.", "en": "to give in to a force or pressure", "zh": "屈服；屈從；不敵", "word": "succumb"}, "C": {"pos": "v.", "en": "to separate and go in different directions; to differ", "zh": "分歧；岔開；相異", "word": "diverge"}, "D": {"pos": "v.", "en": "to cross or overlap with each other", "zh": "交叉；相交；交會", "word": "intersect"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: overlap or meet despite seeming separate.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Historians once treated scientific illustration and fine art as separate traditions, but the botanical drawings of Maria Sibylla Merian show how the two fields can ______: her images are both accurate records and visually sophisticated compositions.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Historians once treated scientific illustration and fine art as separate traditions, but the botanical drawings of Maria Sibylla Merian show how the two fields can ______: her images are both accurate records and visually sophisticated compositions.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n歷史學家過去將科學插畫與純藝術視為兩種不同的傳統，但 Maria Sibylla Merian 的植物繪畫顯示這兩個領域能夠 ______：她的圖像既是精確的紀錄，也是視覺上精緻的構圖。", "opts": {"A": "intersect", "B": "compete", "C": "prevail", "D": "vanish"}, "optsZh": {"A": "intersect（交叉、相交）", "B": "compete（競爭）", "C": "prevail（占優勢、盛行）", "D": "vanish（消失）"}, "answer": "A", "expl": "Intersect means overlap or meet.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to cross or overlap with each other", "zh": "交叉；相交；交會", "word": "intersect"}, "B": {"pos": "v.", "en": "to try to win or do better than others", "zh": "競爭；比賽", "word": "compete"}, "C": {"pos": "v.", "en": "to win or prove more powerful; to be widespread", "zh": "勝過；占優勢；盛行", "word": "prevail"}, "D": {"pos": "v.", "en": "to disappear suddenly or completely", "zh": "消失；消逝", "word": "vanish"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: overlap or meet despite seeming separate.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The festival demonstrates that literature and public policy sometimes ______, since many panels feature poets, city planners, and housing advocates discussing the same urban problems from different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspectives<\/a>.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The festival demonstrates that literature and public policy sometimes ______, since many panels feature poets, city planners, and housing advocates discussing the same urban problems from different perspectives.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這個節慶顯示文學與公共政策有時會 ______，因為許多座談會都由詩人、都市計畫人員與住宅權益倡議者從不同角度討論相同的城市問題。", "opts": {"A": "collapse", "B": "overlap", "C": "hesitate", "D": "retreat"}, "optsZh": {"A": "collapse（崩塌、瓦解）", "B": "overlap（重疊）", "C": "hesitate（猶豫）", "D": "retreat（撤退）"}, "answer": "B", "expl": "Overlap means partly coincide or share common ground.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to fall down or fail suddenly", "zh": "倒塌；崩潰；瓦解", "word": "collapse"}, "B": {"pos": "v.", "en": "to cover part of the same area or share some features", "zh": "重疊；部分相同", "word": "overlap"}, "C": {"pos": "v.", "en": "to pause before acting because of uncertainty", "zh": "猶豫；遲疑", "word": "hesitate"}, "D": {"pos": "v.", "en": "to move back or withdraw", "zh": "撤退；退卻", "word": "retreat"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: overlap or meet despite seeming separate.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel
