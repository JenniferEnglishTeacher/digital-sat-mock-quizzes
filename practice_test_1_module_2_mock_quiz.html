etation depends on incomplete but suggestive evidence gathered across different seasons and locations. During the campaign, volunteers in Boston organized public lectures to raise funds. ______, volunteers in Providence held neighborhood concerts whose ticket sales supported the same cause.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n在競選期間，波士頓的志工舉辦公開演講來募款。______，普羅維登斯的志工舉辦社區音樂會，其門票收入也用來支持同一項理念。", "opts": {"A": "Nevertheless,", "B": "To conclude,", "C": "Similarly,", "D": "In other words,"}, "optsZh": {"A": "Nevertheless,（儘管如此、然而；表對比）", "B": "To conclude,（總而言之；表總結）", "C": "Similarly,（同樣地；表相似）", "D": "In other words,（換句話說；表重述）"}, "answer": "C", "expl": "Similarly introduces a comparable action.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transitions: choose a similarity/example transition.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In Chicago, reformers printed pamphlets explaining the proposed law. ______, activists in Detroit distributed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrated\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrated\" data-pos=\"v.\" data-en=\"showed or explained with examples or pictures\" data-zh=\"說明；舉例闡明；配插圖\">illustrated<\/a> cards summarizing the law&#x27;s major provisions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In Chicago, reformers printed pamphlets explaining the proposed law. ______, activists in Detroit distributed illustrated cards summarizing the law's major provisions.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n在芝加哥，改革人士印製小冊子來說明這項擬議中的法律。______，底特律的運動人士則發送圖解卡片，摘要說明該法律的主要條款。", "opts": {"A": "Instead,", "B": "By contrast,", "C": "However,", "D": "Likewise,"}, "optsZh": {"A": "Instead,（反而、取而代之；表替代）", "B": "By contrast,（相較之下；表對比）", "C": "However,（句首轉折詞後加逗號：正確）", "D": "Likewise,（同樣地；表相似）"}, "answer": "D", "expl": "Likewise indicates a similar example.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transitions: choose a similarity/example transition.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. At the northern campus, students collected books for the new library. ______, at the southern campus, student groups gathered maps, journals, and laboratory manuals for the same project.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. At the northern campus, students collected books for the new library. ______, at the southern campus, student groups gathered maps, journals, and laboratory manuals for the same project.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n在北校區，學生們為新圖書館募集書籍。______，在南校區，學生社團則為同一項計畫蒐集地圖、期刊與實驗手冊。", "opts": {"A": "Similarly,", "B": "To conclude,", "C": "Nevertheless,", "D": "Therefore,"}, "optsZh": {"A": "Similarly,（同樣地；表相似）", "B": "To conclude,（總而言之；表總結）", "C": "Nevertheless,（儘管如此、然而；表對比）", "D": "Therefore,（因此；表結果）"}, "answer": "A", "expl": "Similarly connects parallel actions.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transitions: choose a similarity/example transition.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. In one district, residents planted trees along the main road to support the beautification plan. ______, residents in a neighboring district created small gardens beside public buildings.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. In one district, residents planted trees along the main road to support the beautification plan. ______, residents in a neighboring district created small gardens beside public buildings.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n在某一區，居民沿著主要道路種樹，以支持市容美化計畫。______，鄰近一區的居民則在公共建築旁打造小型花園。", "opts": {"A": "However,", "B": "Likewise,", "C": "In other words,", "D": "Consequently,"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "Likewise,（同樣地；表相似）", "C": "In other words,（換句話說；表重述）", "D": "Consequently,（因此、結果；表結果）"}, "answer": "B", "expl": "Likewise introduces a similar case.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transitions: choose a similarity/example transition.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The first group of volunteers translated health notices into Spanish and Vietnamese. ______, another group recorded audio versions of the same notices for residents with limited vision.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The first group of volunteers translated health notices into Spanish and Vietnamese. ______, another group recorded audio versions of the same notices for residents with limited vision.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n第一組志工將衛生公告翻譯成西班牙文與越南文。______，另一組志工則為視力有限的居民錄製了同一批公告的語音版本。", "opts": {"A": "Similarly,", "B": "Still,", "C": "Therefore,", "D": "To conclude,"}, "optsZh": {"A": "Similarly,（同樣地；表相似）", "B": "Still,（儘管如此、然而；表對比）", "C": "Therefore,（因此；表結果）", "D": "To conclude,（總而言之；表總結）"}, "answer": "A", "expl": "Similarly links comparable volunteer efforts.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Rhetorical Synthesis: compare two lengths.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The Seikan Tunnel is a rail tunnel in Japan.<br>- It connects the island of Honshu to the island of Hokkaido.<br>- It is roughly 33 miles long.<br>- The Channel Tunnel is a rail tunnel in Europe.<br>- It connects Folkestone, England, to Coquelles, France.<br>- It is about 31 miles long.<br><br>The student wants to compare the lengths of the two rail tunnels. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Seikan Tunnel is a rail tunnel in Japan.\n- It connects the island of Honshu to the island of Hokkaido.\n- It is roughly 33 miles long.\n- The Channel Tunnel is a rail tunnel in Europe.\n- It connects Folkestone, England, to Coquelles, France.\n- It is about 31 miles long.\n\nThe student wants to compare the lengths of the two rail tunnels. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 青函隧道（Seikan Tunnel）是日本的一條鐵路隧道。\n- 它連接本州島與北海道島。\n- 它長約 33 英里。\n- 英法海底隧道（Channel Tunnel）是歐洲的一條鐵路隧道。\n- 它連接英國的福克斯通（Folkestone）與法國的科屈艾勒（Coquelles）。\n- 它長約 31 英里。\n這名學生想比較這兩條鐵路隧道的長度。哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "Some of the world's rail tunnels, including one tunnel that extends from Folkestone, England, to Coquelles, France, are longer than 30 miles.", "B": "The Seikan Tunnel is roughly 33 miles long, while the slightly shorter Channel Tunnel is about 31 miles long.", "C": "The Seikan Tunnel, which is roughly 33 miles long, connects the Japanese islands of Honshu and Hokkaido.", "D": "Both the Seikan Tunnel, which is located in Japan, and the Channel Tunnel, which is located in Europe, are examples of rail tunnels."}, "optsZh": {"A": "世界上有些鐵路隧道長度超過 30 英里，包括一條從英國 Folkestone 延伸到法國 Coquelles 的隧道。", "B": "Seikan Tunnel 長約 33 英里，而稍短的 Channel Tunnel 長約 31 英里。", "C": "長約 33 英里的 Seikan Tunnel 連接日本的本州與北海道兩島。", "D": "位於日本的 Seikan Tunnel 和位於歐洲的 Channel Tunnel 都是鐵路隧道的例子。"}, "answer": "B", "expl": "Choice B gives both lengths and directly compares them ('slightly shorter').", "explZh": "B 選項同時列出兩條隧道的長度，並以「稍短」直接比較。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Rhetorical Synthesis: compare two lengths.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Tunnel A is 24 miles long; Tunnel B is 29 miles long; both are rail tunnels; the student wants to compare their lengths.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Tunnel A is 24 miles long; Tunnel B is 29 miles long; both are rail tunnels; the student wants to compare their lengths.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n筆記：隧道 A 長 24 英里；隧道 B 長 29 英里；兩者都是鐵路隧道；學生想比較它們的長度。", "opts": {"A": "Tunnel B is about 5 miles longer than Tunnel A, which is 24 miles long.", "B": "Both Tunnel A and Tunnel B are rail tunnels.", "C": "Tunnel A carries trains through a mountain region.", "D": "Tunnel B opened several decades after Tunnel A."}, "optsZh": {"A": "Tunnel B 比長 24 英里的 Tunnel A 長約 5 英里。", "B": "Tunnel A 和 Tunnel B 都是鐵路隧道。", "C": "Tunnel A 讓火車穿越一個山區。", "D": "Tunnel B 比 Tunnel A 晚了數十年才啟用。"}, "answer": "A", "expl": "The choice directly compares the two lengths.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Rhetorical Synthesis: compare two lengths.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Bridge A is 1.8 miles long; Bridge B is 2.4 miles long; both cross large bays; the goal is to compare the lengths.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Bridge A is 1.8 miles long; Bridge B is 2.4 miles long; both cross large bays; the goal is to compare the lengths.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n筆記：橋 A 長 1.8 英里；橋 B 長 2.4 英里；兩座橋都橫跨大型海灣；目標是比較它們的長度。", "opts": {"A": "Bridge B has several traffic lanes.", "B": "Bridge A and Bridge B both cross bays.", "C": "Bridge B, at 2.4 miles, is longer than Bridge A, which is 1.8 miles long.", "D": "Bridge A is used by commuters."}, "optsZh": {"A": "Bridge B 有數條車道。", "B": "Bridge A 和 Bridge B 都橫跨海灣。", "C": "Bridge B 長 2.4 英里，比長 1.8 英里的 Bridge A 更長。", "D": "Bridge A 供通勤者使用。"}, "answer": "C", "expl": "The choice compares both measurements.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Rhetorical Synthesis: compare two lengths.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: Canal A is 51 miles long; Canal B is 48 miles long; both connect major waterways; the goal is to compare the lengths.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Canal A is 51 miles long; Canal B is 48 miles long; both connect major waterways; the goal is to compare the lengths.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：運河 A 長 51 英里；運河 B 長 48 英里；兩條運河都連接主要水道；目標是比較它們的長度。", "opts": {"A": "Canals can shorten shipping routes.", "B": "Canal A is slightly longer than Canal B, 51 miles compared with 48 miles.", "C": "Canal B is used by cargo ships.", "D": "Canal A and Canal B connect waterways."}, "optsZh": {"A": "運河可以縮短航運路線。", "B": "Canal A 比 Canal B 略長，分別為 51 英里與 48 英里。", "C": "Canal B 供貨船使用。", "D": "Canal A 和 Canal B 都連接水道。"}, "answer": "B", "expl": "The choice gives a clear length comparison.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Rhetorical Synthesis: compare two lengths.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Trail A is 75 kilometers long; Trail B is 62 kilometers long; both pass through national parks; the goal is to compare the lengths.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Trail A is 75 kilometers long; Trail B is 62 kilometers long; both pass through national parks; the goal is to compare the lengths.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：步道 A 長 75 公里；步道 B 長 62 公里；兩條步道都穿越國家公園；目標是比較它們的長度。", "opts": {"A": "Both trails are located in protected areas.", "B": "Trail A passes through a national park.", "C": "Trail B is popular with hikers.", "D": "Trail A is longer than Trail B, measuring 75 kilometers rather than 62."}, "optsZh": {"A": "兩條步道都位於保護區內。", "B": "Trail A 穿越一座國家公園。", "C": "Trail B 很受健行者歡迎。", "D": "Trail A 比 Trail B 長，長度為 75 公里，而 Trail B 為 62 公里。"}, "answer": "D", "expl": "The choice uses both relevant lengths.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Rhetorical Synthesis: compare two lengths.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Subway Line A is 18 miles long; Subway Line B is 21 miles long; both serve airport terminals; the goal is to compare the lengths.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Subway Line A is 18 miles long; Subway Line B is 21 miles long; both serve airport terminals; the goal is to compare the lengths.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n筆記：地鐵 A 線長 18 英里；地鐵 B 線長 21 英里；兩條路線都通往機場航廈；目標是比較它們的長度。", "opts": {"A": "Line B has several underground stations.", "B": "Line A opened before Line B.", "C": "Both subway lines serve airports.", "D": "Subway Line B is about 3 miles longer than Subway Line A."}, "optsZh": {"A": "Line B 有數個地下車站。", "B": "Line A 比 Line B 更早通車。", "C": "兩條地鐵路線都有通往機場。", "D": "Subway Line B 比 Subway Line A 長約 3 英里。"}, "answer": "D", "expl": "The answer compares the lengths directly.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Rhetorical Synthesis: explain a coined term and provide an example.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Jon Ching is a Los Angeles-based painter.<br>- He uses the term &#x27;flauna&#x27; to describe the plant-animal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hybrid\" target=\"_blank\" rel=\"noopener\" data-w=\"hybrid\" data-pos=\"adj./n.\" data-en=\"made by combining two different things\" data-zh=\"混合的；混合體\">hybrids<\/a> that he depicts in his surreal paintings.<br>- &#x27;Flauna&#x27; is a combination of the words &#x27;flora&#x27; and &#x27;fauna.&#x27;<br>- His painting Nectar depicts a parrot with leaves for feathers.<br>- His painting Primaveral depicts a snow leopard whose fur sprouts flowers.<br><br>The student wants to provide an explanation and example of &#x27;flauna.&#x27; Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Jon Ching is a Los Angeles-based painter.\n- He uses the term 'flauna' to describe the plant-animal hybrids that he depicts in his surreal paintings.\n- 'Flauna' is a combination of the words 'flora' and 'fauna.'\n- His painting Nectar depicts a parrot with leaves for feathers.\n- His painting Primaveral depicts a snow leopard whose fur sprouts flowers.\n\nThe student wants to provide an explanation and example of 'flauna.' Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- Jon Ching 是一位以洛杉磯為據點的畫家。\n- 他用「flauna」一詞來稱呼他在超現實畫作中描繪的植物與動物混合體。\n- 「Flauna」是由「flora」（植物群）與「fauna」（動物群）兩個字組合而成。\n- 他的畫作《Nectar》描繪一隻以樹葉為羽毛的鸚鵡。\n- 他的畫作《Primaveral》描繪一隻毛皮上長出花朵的雪豹。\n這名學生想要說明「flauna」並舉出一個例子。哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "The term 'flauna,' used by Los Angeles-based painter Jon Ching, is a combination of the words 'flora' and 'fauna.'", "B": "Jon Ching uses the term 'flauna,' a combination of the words 'flora' and 'fauna,' to describe the subjects of his surreal paintings: plant-animal hybrids such as a parrot with leaves for feathers.", "C": "Jon Ching, who created Nectar, refers to the subjects of his paintings as 'flauna.'", "D": "The subjects of Nectar and Primaveral are types of 'flauna,' a term that the paintings' creator, Jon Ching, uses when describing his surreal artworks."}, "optsZh": {"A": "洛杉磯畫家 Jon Ching 使用的「flauna」一詞，是「flora」（植物）與「fauna」（動物）兩個字的組合。", "B": "Jon Ching 使用「flauna」一詞——由「flora」（植物）與「fauna」（動物）組合而成——來描述他超現實畫作的主題：動植物的混種，例如一隻以葉子為羽毛的鸚鵡。", "C": "創作《Nectar》的 Jon Ching 將他畫作的主題稱為「flauna」。", "D": "《Nectar》與《Primaveral》的主題都屬於「flauna」，這是這些畫作的創作者 Jon Ching 用來描述其超現實藝術作品的詞。"}, "answer": "B", "expl": "Choice B explains the term (a combination of 'flora' and 'fauna' describing plant-animal hybrids) and gives an example (a parrot with leaves for feathers).", "explZh": "B 選項解釋了這個詞（flora 與 fauna 的組合，指動植物混種），並舉出例子（以葉子為羽毛的鸚鵡）。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Rhetorical Synthesis: explain a coined term and provide an example.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: An artist calls her bird-plant hybrids &#x27;avianflora&#x27;; the word combines &#x27;avian&#x27; and &#x27;flora&#x27;; one painting shows a hawk with branches for wings; the goal is to explain the term and give an example.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: An artist calls her bird-plant hybrids 'avianflora'; the word combines 'avian' and 'flora'; one painting shows a hawk with branches for wings; the goal is to explain the term and give an example.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n筆記：一位藝術家把她筆下的鳥與植物混合體稱為「avianflora」；這個字結合了「avian」（鳥類的）與「flora」（植物群）；其中一幅畫描繪一隻以樹枝為翅膀的鷹；目標是說明這個詞並舉出一個例子。", "opts": {"A": "The artist uses 'avianflora' for bird-plant hybrids, such as a hawk with branches for wings.", "B": "One painting includes a hawk.", "C": "The term 'avianflora' combines 'avian' and 'flora.'", "D": "The artist has painted several hybrid creatures."}, "optsZh": {"A": "這位藝術家用「avianflora」來指稱鳥與植物的混種，例如一隻以樹枝為翅膀的鷹。", "B": "其中一幅畫作中有一隻鷹。", "C": "「avianflora」這個詞結合了「avian」（鳥類的）與「flora」（植物）。", "D": "這位藝術家畫過數種混種生物。"}, "answer": "A", "expl": "The answer explains the term and gives an example.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Rhetorical Synthesis: explain a coined term and provide an example.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A sculptor calls machine-animal forms &#x27;mechanimals&#x27;; the word blends &#x27;mechanical&#x27; and &#x27;animal&#x27;; one sculpture shows a deer with gears in place of antlers; the goal is to explain and exemplify the term.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A sculptor calls machine-animal forms 'mechanimals'; the word blends 'mechanical' and 'animal'; one sculpture shows a deer with gears in place of antlers; the goal is to explain and exemplify the term.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n筆記：一位雕塑家把機械與動物結合的形體稱為「mechanimals」；這個字融合了「mechanical」（機械的）與「animal」（動物）；其中一件雕塑呈現一隻以齒輪取代鹿角的鹿；目標是說明這個詞並舉例。", "opts": {"A": "The sculptor exhibits works in several galleries.", "B": "The word 'mechanimals' is a blended term.", "C": "'Mechanimals' are the sculptor's machine-animal forms, including a deer with gears for antlers.", "D": "A deer appears in one of the sculptor's works."}, "optsZh": {"A": "這位雕塑家在數間藝廊展出作品。", "B": "「mechanimals」這個字是一個混成詞。", "C": "「Mechanimals」是這位雕塑家的機械動物造型作品，包括一隻以齒輪為鹿角的鹿。", "D": "一隻鹿出現在這位雕塑家的其中一件作品中。"}, "answer": "C", "expl": "The answer includes definition and example.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Rhetorical Synthesis: explain a coined term and provide an example.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: A poet uses &#x27;riverlight&#x27; for images combining water and illumination; the word joins &#x27;river&#x27; and &#x27;light&#x27;; one poem describes moonlit currents as silver threads; the goal is to explain and exemplify the term.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A poet uses 'riverlight' for images combining water and illumination; the word joins 'river' and 'light'; one poem describes moonlit currents as silver threads; the goal is to explain and exemplify the term.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：一位詩人用「riverlight」來指結合水與光的意象；這個字由「river」（河流）與「light」（光）組成；其中一首詩把月光下的水流描寫成銀色的絲線；目標是說明這個詞並舉例。", "opts": {"A": "One poem describes moonlit currents.", "B": "'Riverlight' refers to the poet's water-and-illumination images, such as moonlit currents described as silver threads.", "C": "The word 'riverlight' combines two nouns.", "D": "The poet often writes about landscapes."}, "optsZh": {"A": "其中一首詩描寫了月光下的水流。", "B": "「Riverlight」指的是這位詩人融合水與光的意象，例如被描寫成銀色絲線的月光下水流。", "C": "「riverlight」這個字結合了兩個名詞。", "D": "這位詩人經常描寫風景。"}, "answer": "B", "expl": "The choice explains the coined term and gives an example.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Rhetorical Synthesis: explain a coined term and provide an example.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: A painter uses &#x27;urbanscape&#x27; for scenes that blend buildings and natural terrain; the word combines &#x27;urban&#x27; and &#x27;<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscape<\/a>&#x27;; one painting shows skyscrapers rising like cliffs; the goal is to explain and exemplify the term.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: A painter uses 'urbanscape' for scenes that blend buildings and natural terrain; the word combines 'urban' and 'landscape'; one painting shows skyscrapers rising like cliffs; the goal is to explain and exemplify the term.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：一位畫家用「urbanscape」來指融合建築物與自然地形的場景；這個字結合了「urban」（都市的）與「landscape」（風景）；其中一幅畫呈現摩天大樓如懸崖般聳立；目標是說明這個詞並舉例。", "opts": {"A": "Skyscrapers appear in one painting.", "B": "The term combines 'urban' and 'landscape.'", "C": "The painter works in a large city.", "D": "'Urbanscape' is the painter's term for scenes blending city buildings with natural terrain, such as skyscrapers rising like cliffs."}, "optsZh": {"A": "摩天大樓出現在其中一幅畫作中。", "B": "這個詞結合了「urban」（都市的）與「landscape」（風景）。", "C": "這位畫家在一座大城市工作。", "D": "「Urbanscape」是這位畫家用來指稱融合城市建築與自然地形之場景的詞，例如像懸崖般聳立的摩天大樓。"}, "answer": "D", "expl": "The answer defines and exemplifies the term.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Rhetorical Synthesis: explain a coined term and provide an example.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: A designer uses &#x27;floratech&#x27; for devices shaped like plants; the word combines &#x27;flora&#x27; and &#x27;technology&#x27;; one lamp opens like a metal tulip; the goal is to explain and exemplify the term.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: A designer uses 'floratech' for devices shaped like plants; the word combines 'flora' and 'technology'; one lamp opens like a metal tulip; the goal is to explain and exemplify the term.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n筆記：一位設計師用「floratech」來指外形像植物的裝置；這個字結合了「flora」（植物群）與「technology」（科技）；其中一盞燈會像一朵金屬鬱金香般綻放；目標是說明這個詞並舉例。", "opts": {"A": "'Floratech' describes the designer's plant-shaped devices, such as a lamp that opens like a metal tulip.", "B": "The word contains a reference to technology.", "C": "A tulip is a type of flower.", "D": "The designer has created several unusual lamps."}, "optsZh": {"A": "「Floratech」指的是這位設計師的植物造型裝置，例如一盞會像金屬鬱金香般綻放的燈。", "B": "這個字包含了與科技相關的意涵。", "C": "鬱金香是一種花。", "D": "這位設計師創作了數盞造型特殊的燈。"}, "answer": "A", "expl": "The answer includes both explanation and example.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Rhetorical Synthesis: emphasize uniqueness of an accomplishment.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In the midst of the US Civil War, Susie Taylor escaped slavery and fled to Union-army-occupied St. Simons Island off the Georgia coast.<br>- She began working for an all-Black army regiment as a nurse and teacher.<br>- In 1902, she published a book about the time she spent with the regiment.<br>- Her book was the only Civil War memoir to be published by a Black woman.<br>- It is still available to readers in print and online.<br><br>The student wants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the uniqueness of Taylor&#x27;s accomplishment. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relevant\" target=\"_blank\" rel=\"noopener\" data-w=\"relevant\" data-pos=\"adj.\" data-en=\"connected with the matter being discussed\" data-zh=\"相關的\">relevant<\/a> information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In the midst of the US Civil War, Susie Taylor escaped slavery and fled to Union-army-occupied St. Simons Island off the Georgia coast.\n- She began working for an all-Black army regiment as a nurse and teacher.\n- In 1902, she published a book about the time she spent with the regiment.\n- Her book was the only Civil War memoir to be published by a Black woman.\n- It is still available to readers in print and online.\n\nThe student wants to emphasize the uniqueness of Taylor's accomplishment. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 在美國南北戰爭期間，Susie Taylor 逃離奴隸制度，逃往喬治亞州外海、由北軍占領的聖西蒙斯島（St. Simons Island）。\n- 她開始為一支全由黑人組成的軍團擔任護士與教師。\n- 1902 年，她出版了一本書，記述她與該軍團共度的時光。\n- 她的書是唯一一本由黑人女性出版的南北戰爭回憶錄。\n- 這本書至今仍有紙本與線上版本供讀者閱讀。\n這名學生想強調 Taylor 這項成就的獨特性。哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "Taylor fled to St. Simons Island, which was then occupied by the Union army, for whom she began working.", "B": "After escaping slavery, Taylor began working for an all-Black army regiment as a nurse and teacher.", "C": "The book Taylor wrote about the time she spent with the regiment is still available to readers in print and online.", "D": "Taylor was the only Black woman to publish a Civil War memoir."}, "optsZh": {"A": "Taylor 逃到當時由北軍占領的 St. Simons Island，並開始為北軍工作。", "B": "逃離奴隸制度後，Taylor 開始在一個全由黑人組成的軍團擔任護理師與教師。", "C": "Taylor 所寫、記述她在軍團中那段時光的書，至今仍可透過紙本與網路取得。", "D": "Taylor 是唯一出版過南北戰爭回憶錄的黑人女性。"}, "answer": "D", "expl": "Choice D uses the note that hers was the only Civil War memoir by a Black woman, emphasizing uniqueness.", "explZh": "D 選項運用「她是唯一出版南北戰爭回憶錄的黑人女性」這項資訊，強調其獨特性。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Rhetorical Synthesis: emphasize uniqueness of an accomplishment.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A scientist published a 1910 field guide; it was the first regional bird guide written by an Indigenous woman; the goal is to emphasize uniqueness.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A scientist published a 1910 field guide; it was the first regional bird guide written by an Indigenous woman; the goal is to emphasize uniqueness.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n筆記：一位科學家在 1910 年出版了一本野外圖鑑；這是第一本由原住民女性撰寫的地區鳥類圖鑑；目標是強調其獨特性。", "opts": {"A": "The scientist conducted field research for many years.", "B": "The book included drawings of several birds.", "C": "Her guide is still consulted by researchers.", "D": "The 1910 book was the first regional bird guide written by an Indigenous woman."}, "optsZh": {"A": "這位科學家進行了多年的田野研究。", "B": "這本書收錄了數種鳥類的插圖。", "C": "她的指南至今仍被研究人員參考使用。", "D": "這本 1910 年的書是第一本由原住民女性撰寫的地區鳥類圖鑑。"}, "answer": "D", "expl": "The choice emphasizes what made the accomplishment unique.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Rhetorical Synthesis: emphasize uniqueness of an accomplishment.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A pilot completed a polar rescue flight in 1932; she was the only woman on the crew; the goal is to emphasize uniqueness.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A pilot completed a polar rescue flight in 1932; she was the only woman on the crew; the goal is to emphasize uniqueness.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n筆記：一位飛行員於 1932 年完成了一次極地救援飛行；她是機組人員中唯一的女性；目標是強調其獨特性。", "opts": {"A": "The pilot trained for many years before the mission.", "B": "She was the only woman on the crew that completed the 1932 polar rescue flight.", "C": "The rescue flight took place in 1932.", "D": "The flight crossed polar conditions."}, "optsZh": {"A": "這位飛行員在執行任務前受訓多年。", "B": "她是完成 1932 年極地救援飛行的機組人員中唯一的女性。", "C": "這次救援飛行發生於 1932 年。", "D": "這趟飛行穿越了極地環境。"}, "answer": "B", "expl": "The answer highlights the unique aspect.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Rhetorical Synthesis: emphasize uniqueness of an accomplishment.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: A journalist founded a newspaper in 1895; it was the first newspaper in the region edited by a Black woman; the goal is to emphasize uniqueness.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A journalist founded a newspaper in 1895; it was the first newspaper in the region edited by a Black woman; the goal is to emphasize uniqueness.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n筆記：一位記者於 1895 年創辦了一份報紙；這是該地區第一份由黑人女性擔任編輯的報紙；目標是強調其獨特性。", "opts": {"A": "The newspaper published weekly.", "B": "The journalist wrote about local politics.", "C": "The journalist's 1895 newspaper was the first in the region edited by a Black woman.", "D": "The region had several other newspapers."}, "optsZh": {"A": "這份報紙每週出刊。", "B": "這位記者撰寫有關地方政治的文章。", "C": "這位記者在 1895 年創辦的報紙是該地區第一份由黑人女性擔任編輯的報紙。", "D": "該地區還有其他數份報紙。"}, "answer": "C", "expl": "The answer directly emphasizes uniqueness.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Rhetorical Synthesis: emphasize uniqueness of an accomplishment.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematician\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematician\" data-pos=\"n.\" data-en=\"an expert in mathematics\" data-zh=\"數學家\">mathematician<\/a> published a textbook in 1924; it was the only advanced algebra textbook of the decade written by a woman in her country; the goal is to emphasize uniqueness.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: A mathematician published a textbook in 1924; it was the only advanced algebra textbook of the decade written by a woman in her country; the goal is to emphasize uniqueness.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n筆記：一位數學家於 1924 年出版了一本教科書；這是那十年間她的國家唯一一本由女性撰寫的高等代數教科書；目標是強調其獨特性。", "opts": {"A": "The mathematician's book was the only advanced algebra textbook of the decade written by a woman in her country.", "B": "The textbook included practice problems.", "C": "The mathematician taught at a university.", "D": "The textbook was published in 1924."}, "optsZh": {"A": "這位數學家的書是該年代她的國家中唯一一本由女性撰寫的高等代數教科書。", "B": "這本教科書收錄了練習題。", "C": "這位數學家曾在大學任教。", "D": "這本教科書於 1924 年出版。"}, "answer": "A", "expl": "The answer states the unique accomplishment.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Rhetorical Synthesis: emphasize uniqueness of an accomplishment.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: A filmmaker released a documentary in 1968; it was the first nationally distributed documentary directed by a Latina filmmaker; the goal is to emphasize uniqueness.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: A filmmaker released a documentary in 1968; it was the first nationally distributed documentary directed by a Latina filmmaker; the goal is to emphasize uniqueness.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成此目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n筆記：一位電影工作者於 1968 年推出了一部紀錄片；這是第一部由拉丁裔女性導演執導、並在全國發行的紀錄片；目標是強調其獨特性。", "opts": {"A": "The 1968 film was the first nationally distributed documentary directed by a Latina filmmaker.", "B": "The documentary remained available in archives.", "C": "The filmmaker later directed several other works.", "D": "The documentary was released in 1968."}, "optsZh": {"A": "這部 1968 年的影片是第一部由拉丁裔女性導演執導、在全國發行的紀錄片。", "B": "這部紀錄片仍保存在檔案館中可供取用。", "C": "這位電影工作者後來又執導了數部其他作品。", "D": "這部紀錄片於 1968 年上映。"}, "answer": "A", "expl": "The answer highlights what made the achievement unique.", "explZh": ""}];
    const SLUG = 'dsat_t1m2';
    const SOURCE = 'Digital SAT Practice Test 1, Module 2';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        sessionWrong[q.id] = { picked, ts: Date.now(), count: (sessionWrong[q.id]?.count || 0) + 1 };
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    const sessionWrong = {}; // questions answered wrong since this page was opened (kept even if fixed later)
    function wrongList(scope = 'all') {
      const w = scope === 'session' ? sessionWrong : loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    // list for downloads: the chosen scope; if "this attempt" is empty, offer the saved list instead
    function dlList() {
      let scope = document.getElementById('dlScope').value;
      let list = wrongList(scope);
      if (!list.length && scope === 'session') {
        const all = wrongList('all');
        if (!all.length) { alert('還沒有錯題 No wrong questions yet. 作答後答錯的題目會自動收錄。'); return null; }
        if (!confirm(`本次作答還沒有錯題。要改下載全部錯題本（${all.length} 題）嗎？\nNo wrong answers in this attempt yet. Download all ${all.length} saved wrong questions instead?`)) return null;
        scope = 'all'; list = all;
      }
      if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return null; }
      return { list, scope, tag: scope === 'session' ? 'this_attempt' : 'all_saved', label: scope === 'session' ? '本次作答 This attempt' : '全部錯題本 All saved' };
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
