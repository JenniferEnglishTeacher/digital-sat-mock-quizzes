treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However,", "B": "However", "C": "however,", "D": "However;"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "C": "however,（小寫 however → 句首應大寫：錯誤）", "D": "However;（句首轉折詞後接分號：錯誤）"}, "answer": "A", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: parallel verb after would.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever,", "C": "whenever", "D": "; whenever"}, "optsZh": {"A": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "B": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "C": "whenever（從屬連接詞，不加標點：正確）", "D": "; whenever（分號 → 後面接的不是獨立子句：錯誤）"}, "answer": "C", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: parallel verb after would.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "has expanded", "B": "have expanded", "C": "expand", "D": "are expanding"}, "optsZh": {"A": "has expanded（現在完成式，單數主詞：正確）", "B": "have expanded（複數完成式，主詞為單數：錯誤）", "C": "expand（複數動詞原形，主詞為單數：錯誤）", "D": "are expanding（複數現在進行式，主詞為單數：錯誤）"}, "answer": "A", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: complete main clause after modifier.", "vocab": false, "body": "Despite being cheap, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=versatile\" target=\"_blank\" rel=\"noopener\" data-w=\"versatile\" data-pos=\"adj.\" data-en=\"able to be used in many different ways\" data-zh=\"多用途的；多才多藝的\">versatile<\/a>, and easy to produce, _______ they are made from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nonrenewable\" target=\"_blank\" rel=\"noopener\" data-w=\"nonrenewable\" data-pos=\"adj.\" data-en=\"not able to be replaced naturally once used up\" data-zh=\"不可再生的\">nonrenewable<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=petroleum\" target=\"_blank\" rel=\"noopener\" data-w=\"petroleum\" data-pos=\"n.\" data-en=\"oil found under the ground, used to make fuel and plastics\" data-zh=\"石油\">petroleum<\/a>, and most do not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biodegrade\" target=\"_blank\" rel=\"noopener\" data-w=\"biodegrade\" data-pos=\"v.\" data-en=\"to break down naturally by bacteria\" data-zh=\"生物分解\">biodegrade<\/a> in landfills.", "bodyPlain": "Despite being cheap, versatile, and easy to produce, _______ they are made from nonrenewable petroleum, and most do not biodegrade in landfills.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "儘管便宜、用途廣泛又容易生產，_______ 它們由不可再生的石油製成，而且大多數在掩埋場中無法生物分解。", "opts": {"A": "there are two problems associated with commercial plastics:", "B": "two problems are associated with commercial plastics:", "C": "commercial plastics' two associated problems are that", "D": "commercial plastics have two associated problems:"}, "optsZh": {"A": "there are two problems associated with commercial plastics:（主詞變成 there → 造成修飾語懸空：錯誤）", "B": "two problems are associated with commercial plastics:（主詞變成 problems → 造成修飾語懸空：錯誤）", "C": "commercial plastics' two associated problems are that（主詞變成 problems → 造成修飾語懸空：錯誤）", "D": "commercial plastics have two associated problems:（主詞 commercial plastics 緊接修飾語，冒號引出說明：正確）"}, "answer": "D", "expl": "The introductory modifier describes plastics as cheap and versatile, so 'commercial plastics' must come right after it as the subject; the colon then introduces the two problems.", "explZh": "句首修飾語描述的是便宜、用途多的塑膠，所以後面必須緊接主詞「commercial plastics」；冒號再引出兩個問題。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: complete main clause after modifier.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "including", "B": "having included", "C": "to include", "D": "includes"}, "optsZh": {"A": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）", "B": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）", "C": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "D": "includes（第三人稱單數現在式，作關係子句的動詞：正確）"}, "answer": "D", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: complete main clause after modifier.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices, but", "B": "prices", "C": "prices,", "D": "prices but"}, "optsZh": {"A": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "B": "prices（無標點：錯誤）", "C": "prices,（只有逗號 → 造成逗號連接錯誤）", "D": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）"}, "answer": "A", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: complete main clause after modifier.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However", "B": "However;", "C": "However,", "D": "however,"}, "optsZh": {"A": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "B": "However;（句首轉折詞後接分號：錯誤）", "C": "However,（句首轉折詞後加逗號：正確）", "D": "however,（小寫 however → 句首應大寫：錯誤）"}, "answer": "C", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: complete main clause after modifier.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "whenever,", "B": "whenever", "C": ". Whenever", "D": "; whenever"}, "optsZh": {"A": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "B": "whenever（從屬連接詞，不加標點：正確）", "C": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "D": "; whenever（分號 → 後面接的不是獨立子句：錯誤）"}, "answer": "B", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: complete main clause after modifier.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "has expanded", "B": "are expanding", "C": "have expanded", "D": "expand"}, "optsZh": {"A": "has expanded（現在完成式，單數主詞：正確）", "B": "are expanding（複數現在進行式，主詞為單數：錯誤）", "C": "have expanded（複數完成式，主詞為單數：錯誤）", "D": "expand（複數動詞原形，主詞為單數：錯誤）"}, "answer": "A", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Standard English: no commas around essential name.", "vocab": false, "body": "Stomata, tiny pore <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a> in a leaf that absorb gases needed for plant growth, open when guard cells surrounding each pore swell with water. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pivotal\" target=\"_blank\" rel=\"noopener\" data-w=\"pivotal\" data-pos=\"adj.\" data-en=\"very important; central to a result\" data-zh=\"關鍵的；舉足輕重的\">pivotal<\/a> 2007 article, plant cell _______ showed that lipid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molecule\" target=\"_blank\" rel=\"noopener\" data-w=\"molecule\" data-pos=\"n.\" data-en=\"the smallest unit of a substance, made of atoms\" data-zh=\"分子\">molecules<\/a> called phosphatidylinositol phosphates are responsible for signaling guard cells to open stomata.", "bodyPlain": "Stomata, tiny pore structures in a leaf that absorb gases needed for plant growth, open when guard cells surrounding each pore swell with water. In a pivotal 2007 article, plant cell _______ showed that lipid molecules called phosphatidylinositol phosphates are responsible for signaling guard cells to open stomata.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "氣孔是葉片上用來吸收植物生長所需氣體的微小孔隙構造，當包圍每個孔隙的保衛細胞充滿水分而膨脹時，氣孔就會打開。在一篇 2007 年具關鍵意義的論文中，植物細胞 _______ 證明了一種稱為磷脂醯肌醇磷酸的脂質分子負責發出訊號，讓保衛細胞打開氣孔。", "opts": {"A": "biologist, Yuree Lee", "B": "biologist Yuree Lee,", "C": "biologist Yuree Lee", "D": "biologist, Yuree Lee,"}, "optsZh": {"A": "biologist, Yuree Lee（逗號位置錯誤：錯誤）", "B": "biologist Yuree Lee,（主詞與動詞之間加逗號：錯誤）", "C": "biologist Yuree Lee（必要的名字，不加逗號：正確）", "D": "biologist, Yuree Lee,（把必要的名字當成非必要同位語加逗號：錯誤）"}, "answer": "C", "expl": "'Plant cell biologist Yuree Lee' is a title + essential name directly before the verb 'showed,' so no commas are used.", "explZh": "「plant cell biologist Yuree Lee」是職稱加必要的人名，直接接動詞 showed，不加逗號。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Standard English: no commas around essential name.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "includes", "B": "including", "C": "having included", "D": "to include"}, "optsZh": {"A": "includes（第三人稱單數現在式，作關係子句的動詞：正確）", "B": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）", "C": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）", "D": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Standard English: no commas around essential name.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices", "B": "prices but", "C": "prices, but", "D": "prices,"}, "optsZh": {"A": "prices（無標點：錯誤）", "B": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "C": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "D": "prices,（只有逗號 → 造成逗號連接錯誤）"}, "answer": "C", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Standard English: no commas around essential name.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However", "B": "however,", "C": "However;", "D": "However,"}, "optsZh": {"A": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "B": "however,（小寫 however → 句首應大寫：錯誤）", "C": "However;（句首轉折詞後接分號：錯誤）", "D": "However,（句首轉折詞後加逗號：正確）"}, "answer": "D", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Standard English: no commas around essential name.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever", "C": "whenever,", "D": "; whenever"}, "optsZh": {"A": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "B": "whenever（從屬連接詞，不加標點：正確）", "C": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "D": "; whenever（分號 → 後面接的不是獨立子句：錯誤）"}, "answer": "B", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Standard English: no commas around essential name.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "expand", "B": "has expanded", "C": "have expanded", "D": "are expanding"}, "optsZh": {"A": "expand（複數動詞原形，主詞為單數：錯誤）", "B": "has expanded（現在完成式，單數主詞：正確）", "C": "have expanded（複數完成式，主詞為單數：錯誤）", "D": "are expanding（複數現在進行式，主詞為單數：錯誤）"}, "answer": "B", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: choose a result transition.", "vocab": false, "body": "Small, flat <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a> called <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spatulae\" target=\"_blank\" rel=\"noopener\" data-w=\"spatulae\" data-pos=\"n.\" data-en=\"tiny flat structures at the tips of hairs (plural of spatula)\" data-zh=\"匙狀毛（複數）\">spatulae<\/a> are found at the tips of the hairs on a spider&#x27;s leg. These spatulae <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temporarily\" target=\"_blank\" rel=\"noopener\" data-w=\"temporarily\" data-pos=\"adv.\" data-en=\"for a limited time only\" data-zh=\"暫時地\">temporarily<\/a> bond with the atoms of whatever they touch. _______ spiders are able to cling to and climb almost any <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a>.", "bodyPlain": "Small, flat structures called spatulae are found at the tips of the hairs on a spider's leg. These spatulae temporarily bond with the atoms of whatever they touch. _______ spiders are able to cling to and climb almost any surface.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "蜘蛛腳上毛髮的末端有一種稱為匙突（spatulae）的扁平微小構造。這些匙突會與它們接觸到的任何物體的原子暫時結合。_______ 蜘蛛幾乎能夠攀附並爬上任何表面。", "opts": {"A": "For instance,", "B": "However,", "C": "Similarly,", "D": "As a result,"}, "optsZh": {"A": "For instance,（例如；舉例說明）", "B": "However,（句首轉折詞後加逗號：正確）", "C": "Similarly,（同樣地；表相似）", "D": "As a result,（因此、結果；表結果）"}, "answer": "D", "expl": "Because spatulae bond with whatever they touch, spiders can climb almost any surface—a result, so 'As a result' fits.", "explZh": "因為匙狀毛能與接觸的任何物體結合，蜘蛛才能攀爬幾乎所有表面，這是結果關係，故用「As a result」。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: choose a result transition.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The resin hardens when exposed to air, forming a waterproof layer over the damaged bark. ______, the tree can seal small wounds before insects or fungi enter.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The resin hardens when exposed to air, forming a waterproof layer over the damaged bark. ______, the tree can seal small wounds before insects or fungi enter.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n樹脂接觸空氣後會硬化，在受損的樹皮上形成一層防水層。______，樹木能在昆蟲或真菌入侵之前封住小傷口。", "opts": {"A": "For example,", "B": "Similarly,", "C": "However,", "D": "As a result,"}, "optsZh": {"A": "For example,（例如；舉例說明）", "B": "Similarly,（同樣地；表相似）", "C": "However,（句首轉折詞後加逗號：正確）", "D": "As a result,（因此、結果；表結果）"}, "answer": "D", "expl": "The second sentence gives the result of the first.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: choose a result transition.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The new coating reflects most incoming sunlight rather than absorbing it. ______, roofs treated with the coating remain cooler during summer afternoons.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The new coating reflects most incoming sunlight rather than absorbing it. ______, roofs treated with the coating remain cooler during summer afternoons.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這種新塗料會反射大部分的入射陽光，而非吸收它。______，塗上這種塗料的屋頂在夏日午後能保持較涼爽。", "opts": {"A": "For instance,", "B": "In contrast,", "C": "Consequently,", "D": "Nevertheless,"}, "optsZh": {"A": "For instance,（例如；舉例說明）", "B": "In contrast,（相反地、相較之下；表對比）", "C": "Consequently,（因此、結果；表結果）", "D": "Nevertheless,（儘管如此、然而；表對比）"}, "answer": "C", "expl": "Consequently signals a result.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: choose a result transition.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The archive converted its handwritten index into a searchable database. ______, researchers can now locate many letters in minutes rather than days.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The archive converted its handwritten index into a searchable database. ______, researchers can now locate many letters in minutes rather than days.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n檔案館將手寫索引轉換成可搜尋的資料庫。______，研究人員現在只需幾分鐘、而非數天，就能找到許多信件。", "opts": {"A": "Instead,", "B": "Therefore,", "C": "Likewise,", "D": "Still,"}, "optsZh": {"A": "Instead,（反而、取而代之；表替代）", "B": "Therefore,（因此；表結果）", "C": "Likewise,（同樣地；表相似）", "D": "Still,（儘管如此、然而；表對比）"}, "answer": "B", "expl": "Therefore introduces the result.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: choose a result transition.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The bridge&#x27;s sensors transmit stress data <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continuously\" target=\"_blank\" rel=\"noopener\" data-w=\"continuously\" data-pos=\"adv.\" data-en=\"without stopping or interruption\" data-zh=\"持續不斷地\">continuously<\/a> to engineers. ______, maintenance teams can identify developing problems before visible cracks appear.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The bridge's sensors transmit stress data continuously to engineers. ______, maintenance teams can identify developing problems before visible cracks appear.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這座橋的感測器持續將應力資料傳送給工程師。______，維修團隊能在出現肉眼可見的裂縫之前就發現正在形成的問題。", "opts": {"A": "However,", "B": "Similarly,", "C": "For example,", "D": "Thus,"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "Similarly,（同樣地；表相似）", "C": "For example,（例如；舉例說明）", "D": "Thus,（因此；表結果）"}, "answer": "D", "expl": "Thus signals a logical result.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: choose a result transition.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The shells contain tiny chambers that trap air and reduce heat transfer. ______, the animals can remain active in environments where unprotected tissues would overheat.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The shells contain tiny chambers that trap air and reduce heat transfer. ______, the animals can remain active in environments where unprotected tissues would overheat.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n這些外殼含有能困住空氣並減少熱傳導的微小腔室。______，這些動物能在沒有保護的組織會過熱的環境中保持活躍。", "opts": {"A": "As a result,", "B": "Nevertheless,", "C": "In other words,", "D": "By contrast,"}, "optsZh": {"A": "As a result,（因此、結果；表結果）", "B": "Nevertheless,（儘管如此、然而；表對比）", "C": "In other words,（換句話說；表重述）", "D": "By contrast,（相較之下；表對比）"}, "answer": "A", "expl": "As a result links the cause to the effect.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: choose a contrast transition.", "vocab": false, "body": "In November 1934, Amrita Sher-Gil was living in what must have seemed like the ideal city for a young artist: Paris. She was studying <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=firsthand\" target=\"_blank\" rel=\"noopener\" data-w=\"firsthand\" data-pos=\"adv./adj.\" data-en=\"directly from personal experience\" data-zh=\"第一手地；親身的\">firsthand<\/a> the color-saturated style of France&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=modernist\" target=\"_blank\" rel=\"noopener\" data-w=\"modernist\" data-pos=\"adj.\" data-en=\"relating to modern art styles that broke with tradition\" data-zh=\"現代主義的\">modernist<\/a> masters and beginning to make a name for herself as a painter. _______ Sher-Gil longed to return to her childhood home of India; only there, she believed, could her art truly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flourish\" target=\"_blank\" rel=\"noopener\" data-w=\"flourish\" data-pos=\"v.\" data-en=\"to grow or develop successfully\" data-zh=\"蓬勃發展；興盛\">flourish<\/a>.", "bodyPlain": "In November 1934, Amrita Sher-Gil was living in what must have seemed like the ideal city for a young artist: Paris. She was studying firsthand the color-saturated style of France's modernist masters and beginning to make a name for herself as a painter. _______ Sher-Gil longed to return to her childhood home of India; only there, she believed, could her art truly flourish.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "1934 年 11 月，Amrita Sher-Gil 住在一座對年輕藝術家而言想必是理想之城的地方：巴黎。她正親身研習法國現代主義大師們色彩飽和的風格，並開始以畫家的身分嶄露頭角。_______ Sher-Gil 渴望回到她童年的家鄉印度；她相信，唯有在那裡，她的藝術才能真正蓬勃發展。", "opts": {"A": "Still,", "B": "Therefore,", "C": "Indeed,", "D": "Furthermore,"}, "optsZh": {"A": "Still,（儘管如此、然而；表對比）", "B": "Therefore,（因此；表結果）", "C": "Indeed,（的確、事實上；表強調）", "D": "Furthermore,（此外、而且；表補充）"}, "answer": "A", "expl": "Paris seemed ideal and she was succeeding, yet she longed to return to India—a contrast, so 'Still' fits.", "explZh": "巴黎看似理想且她正嶄露頭角，但她仍渴望回到印度，屬於轉折對比，故用「Still」。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: choose a contrast transition.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer had achieved success in Vienna, where audiences praised his chamber works and critics followed his premieres closely. ______, he felt that his musical imagination depended on returning to the folk songs of his rural birthplace.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer had achieved success in Vienna, where audiences praised his chamber works and critics followed his premieres closely. ______, he felt that his musical imagination depended on returning to the folk songs of his rural birthplace.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這位作曲家已在維也納獲得成功，那裡的觀眾讚賞他的室內樂作品，評論家也密切關注他的首演。______，他覺得自己的音樂想像力取決於能否回歸他鄉村出生地的民謠。", "opts": {"A": "Still,", "B": "For example,", "C": "Therefore,", "D": "Furthermore,"}, "optsZh": {"A": "Still,（儘管如此、然而；表對比）", "B": "For example,（例如；舉例說明）", "C": "Therefore,（因此；表結果）", "D": "Furthermore,（此外、而且；表補充）"}, "answer": "A", "expl": "Still introduces a contrast.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: choose a contrast transition.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The research station offered modern <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratories<\/a>, reliable funding, and access to advanced equipment. ______, several scientists preferred the older field site because it allowed them to observe the animals in their natural habitat.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The research station offered modern laboratories, reliable funding, and access to advanced equipment. ______, several scientists preferred the older field site because it allowed them to observe the animals in their natural habitat.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這座研究站提供現代化的實驗室、穩定的經費以及先進設備的使用權。______，有幾位科學家偏好較舊的野外研究站，因為在那裡他們能在動物的自然棲地中觀察牠們。", "opts": {"A": "Indeed,", "B": "Nevertheless,", "C": "Consequently,", "D": "Similarly,"}, "optsZh": {"A": "Indeed,（的確、事實上；表強調）", "B": "Nevertheless,（儘管如此、然而；表對比）", "C": "Consequently,（因此、結果；表結果）", "D": "Similarly,（同樣地；表相似）"}, "answer": "B", "expl": "Nevertheless marks contrast.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: choose a contrast transition.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The poet&#x27;s early career seemed firmly rooted in London: she published there, taught there, and joined several literary circles there. ______, she repeatedly wrote that her artistic future lay in returning to the Caribbean.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The poet's early career seemed firmly rooted in London: she published there, taught there, and joined several literary circles there. ______, she repeatedly wrote that her artistic future lay in returning to the Caribbean.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這位詩人早期的事業似乎牢牢紮根於倫敦：她在那裡出版作品、在那裡教書，也在那裡加入了數個文學圈。______，她一再寫道，她的藝術前途在於回到加勒比海地區。", "opts": {"A": "In addition,", "B": "As a result,", "C": "For instance,", "D": "Yet,"}, "optsZh": {"A": "In addition,（此外；表補充）", "B": "As a result,（因此、結果；表結果）", "C": "For instance,（例如；舉例說明）", "D": "Yet,（然而；表對比）"}, "answer": "D", "expl": "Yet introduces an unexpected contrast.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: choose a contrast transition.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The architect&#x27;s office was thriving in the capital, with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commission\" target=\"_blank\" rel=\"noopener\" data-w=\"commission\" data-pos=\"v.\" data-en=\"to formally ask someone to create a piece of work\" data-zh=\"委託製作\">commissions<\/a> from banks, theaters, and universities. ______, she left to design schools in the small coastal towns where she had grown up.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The architect's office was thriving in the capital, with commissions from banks, theaters, and universities. ______, she left to design schools in the small coastal towns where she had grown up.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位建築師的事務所在首都蓬勃發展，接到來自銀行、劇院與大學的委託案。______，她離開了首都，到她成長的那些濱海小鎮設計學校。", "opts": {"A": "Likewise,", "B": "Indeed,", "C": "Even so,", "D": "Therefore,"}, "optsZh": {"A": "Likewise,（同樣地；表相似）", "B": "Indeed,（的確、事實上；表強調）", "C": "Even so,（即便如此；表讓步／對比）", "D": "Therefore,（因此；表結果）"}, "answer": "C", "expl": "Even so signals contrast.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: choose a contrast transition.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The actor was receiving major roles in New York and had just won a national award. ______, he decided to move back to his hometown to establish a community theater.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The actor was receiving major roles in New York and had just won a national award. ______, he decided to move back to his hometown to establish a community theater.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n這位演員在紐約接連獲得重要角色，而且剛贏得一項全國性大獎。______，他決定搬回家鄉創立一座社區劇場。", "opts": {"A": "Still,", "B": "For example,", "C": "Accordingly,", "D": "Similarly,"}, "optsZh": {"A": "Still,（儘管如此、然而；表對比）", "B": "For example,（例如；舉例說明）", "C": "Accordingly,（因此、據此；表結果）", "D": "Similarly,（同樣地；表相似）"}, "answer": "A", "expl": "Still shows contrast with the expected outcome.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transitions: choose a similarity/example transition.", "vocab": false, "body": "Before California&#x27;s 1911 election to approve a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proposition\" target=\"_blank\" rel=\"noopener\" data-w=\"proposition\" data-pos=\"n.\" data-en=\"a proposal voted on by the public; an idea offered for consideration\" data-zh=\"（公投）提案；主張\">proposition<\/a> granting women the right to vote, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activist\" target=\"_blank\" rel=\"noopener\" data-w=\"activist\" data-pos=\"n.\" data-en=\"a person who works for social or political change\" data-zh=\"社運人士；運動者\">activists<\/a> across the state sold tea to promote the cause of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suffrage\" target=\"_blank\" rel=\"noopener\" data-w=\"suffrage\" data-pos=\"n.\" data-en=\"the right to vote in elections\" data-zh=\"投票權；選舉權\">suffrage<\/a>. In San Francisco, the Woman&#x27;s Suffrage Party sold Equality Tea at local fairs. _______ in Los Angeles, activist Nancy Tuttle Craig, who ran one of California&#x27;s largest grocery store firms, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distribute\" target=\"_blank\" rel=\"noopener\" data-w=\"distribute\" data-pos=\"v.\" data-en=\"to spread or give out over an area or among people\" data-zh=\"分布；分配\">distributed<\/a> Votes for Women Tea.", "bodyPlain": "Before California's 1911 election to approve a proposition granting women the right to vote, activists across the state sold tea to promote the cause of suffrage. In San Francisco, the Woman's Suffrage Party sold Equality Tea at local fairs. _______ in Los Angeles, activist Nancy Tuttle Craig, who ran one of California's largest grocery store firms, distributed Votes for Women Tea.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在加州 1911 年就賦予女性投票權的提案舉行選舉之前，全州各地的運動人士販售茶葉來推廣婦女參政的理念。在舊金山，婦女參政黨在當地的市集販售「平等茶」。_______ 在洛杉磯，經營加州最大連鎖雜貨公司之一的運動人士 Nancy Tuttle Craig 則發送「女性投票權茶」。", "opts": {"A": "For example,", "B": "To conclude,", "C": "Similarly,", "D": "In other words,"}, "optsZh": {"A": "For example,（例如；舉例說明）", "B": "To conclude,（總而言之；表總結）", "C": "Similarly,（同樣地；表相似）", "D": "In other words,（換句話說；表重述）"}, "answer": "C", "expl": "Los Angeles activists also sold tea, just like those in San Francisco, so 'Similarly' signals a parallel example.", "explZh": "洛杉磯的運動人士也和舊金山一樣販售茶葉，屬於相似關係，故用「Similarly」。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transitions: choose a similarity/example transition.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. During the campaign, volunteers in Boston organized public lectures to raise funds. ______, volunteers in Providence held <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> concerts whose ticket sales supported the same cause.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpr
