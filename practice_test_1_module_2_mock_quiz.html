=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Although fashion design and engineering are often taught in different schools, wearable technology has made the disciplines ______, requiring designers to consider circuits, sensors, and aesthetics together.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although fashion design and engineering are often taught in different schools, wearable technology has made the disciplines ______, requiring designers to consider circuits, sensors, and aesthetics together.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n雖然時尚設計與工程通常在不同的學院中教授，但穿戴式科技已使這兩個學科 ______，要求設計師同時考量電路、感測器與美感。", "opts": {"A": "diverge", "B": "weaken", "C": "disappear", "D": "converge"}, "optsZh": {"A": "diverge（分歧、分開）", "B": "weaken（減弱）", "C": "disappear（消失）", "D": "converge（匯合、交會）"}, "answer": "D", "expl": "Converge means come together.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to separate and go in different directions; to differ", "zh": "分歧；岔開；相異", "word": "diverge"}, "B": {"pos": "v.", "en": "to make or become less strong", "zh": "削弱；減弱", "word": "weaken"}, "C": {"pos": "v.", "en": "to stop being visible or to stop existing", "zh": "消失；不見", "word": "disappear"}, "D": {"pos": "v.", "en": "to come together from different directions; to meet or overlap", "zh": "匯合；交會；趨於一致", "word": "converge"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: overlap or meet despite seeming separate.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The chef&#x27;s work shows that chemistry and cooking can ______: she uses knowledge of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protein\" target=\"_blank\" rel=\"noopener\" data-w=\"protein\" data-pos=\"n.\" data-en=\"a substance in living things that is needed for growth\" data-zh=\"蛋白質\">proteins<\/a> and heat transfer to create dishes that are both scientifically precise and appealing.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The chef's work shows that chemistry and cooking can ______: she uses knowledge of proteins and heat transfer to create dishes that are both scientifically precise and appealing.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這位主廚的作品顯示化學與烹飪能夠 ______：她運用蛋白質與熱傳導的知識，創造出既科學精準又誘人的料理。", "opts": {"A": "succumb", "B": "intertwine", "C": "separate", "D": "prevail"}, "optsZh": {"A": "succumb（屈服）", "B": "intertwine（交織、纏繞）", "C": "separate（分開）", "D": "prevail（占優勢、盛行）"}, "answer": "B", "expl": "Intertwine means become closely connected.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to give in to a force or pressure", "zh": "屈服；屈從；不敵", "word": "succumb"}, "B": {"pos": "v.", "en": "to twist or connect closely together", "zh": "交織；纏繞；緊密相連", "word": "intertwine"}, "C": {"pos": "adj.", "en": "not joined or connected; distinct", "zh": "分開的；個別的；獨立的", "word": "separate"}, "D": {"pos": "v.", "en": "to win or prove more powerful; to be widespread", "zh": "勝過；占優勢；盛行", "word": "prevail"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: overlap or meet despite seeming separate.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The exhibition challenges the assumption that craft and sculpture rarely ______, presenting woven objects that function as both traditional textiles and large-scale museum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a>.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The exhibition challenges the assumption that craft and sculpture rarely ______, presenting woven objects that function as both traditional textiles and large-scale museum installations.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n這場展覽挑戰了工藝與雕塑很少 ______ 的假設，展出既可作為傳統紡織品、又可作為大型博物館裝置藝術的編織作品。", "opts": {"A": "retreat", "B": "diminish", "C": "coincide", "D": "fail"}, "optsZh": {"A": "retreat（撤退）", "B": "diminish（減少、減弱）", "C": "coincide（同時發生、重合）", "D": "fail（失敗）"}, "answer": "C", "expl": "Coincide can mean occur together or correspond.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to move back or withdraw", "zh": "撤退；退卻", "word": "retreat"}, "B": {"pos": "v.", "en": "to become or make smaller or less", "zh": "減少；減弱；縮小", "word": "diminish"}, "C": {"pos": "v.", "en": "to happen at the same time or to agree exactly", "zh": "同時發生；相符；一致", "word": "coincide"}, "D": {"pos": "v.", "en": "to not succeed or not do what is expected", "zh": "失敗；未能", "word": "fail"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: imposed or set as a rule.", "vocab": true, "body": "Scholarly discussions of gender in Shakespeare&#x27;s comedies often celebrate the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rebellion\" target=\"_blank\" rel=\"noopener\" data-w=\"rebellion\" data-pos=\"n.\" data-en=\"opposition to authority or accepted rules\" data-zh=\"反叛；反抗\">rebellion<\/a> of the playwright&#x27;s characters against the rigid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expectation\" target=\"_blank\" rel=\"noopener\" data-w=\"expectation\" data-pos=\"n.\" data-en=\"a belief that something will happen\" data-zh=\"預期；期望\">expectations<\/a> _______ by Elizabethan society. Most of the comedies end in marriage, with characters returning to their socially <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dictated\" target=\"_blank\" rel=\"noopener\" data-w=\"dictated\" data-pos=\"v.\" data-en=\"ordered or required with authority\" data-zh=\"規定；支配；命令\">dictated<\/a> gender roles after previously <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=defy\" target=\"_blank\" rel=\"noopener\" data-w=\"defy\" data-pos=\"v.\" data-en=\"to refuse to obey or follow\" data-zh=\"違抗；公然反抗\">defying<\/a> them, but there are some notable exceptions.", "bodyPlain": "Scholarly discussions of gender in Shakespeare's comedies often celebrate the rebellion of the playwright's characters against the rigid expectations _______ by Elizabethan society. Most of the comedies end in marriage, with characters returning to their socially dictated gender roles after previously defying them, but there are some notable exceptions.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "學界對莎士比亞喜劇中性別議題的討論，常常讚揚劇中角色對伊莉莎白時代社會所 _______ 的嚴格期待的反抗。大多數喜劇都以婚姻收場，角色們在先前違抗社會規定的性別角色之後又回歸其中，但也有一些值得注意的例外。", "opts": {"A": "interjected", "B": "committed", "C": "illustrated", "D": "prescribed"}, "optsZh": {"A": "interjected（插話、插入）", "B": "committed（承諾的、投入的）", "C": "illustrated（加以說明的、有插圖的）", "D": "prescribed（規定的、指定的）"}, "answer": "D", "expl": "The expectations were 'socially dictated' rules set by society, so they were 'prescribed' (imposed as a rule).", "explZh": "這些期望是社會所規定的角色要求，因此是「prescribed」（規定的、強加的）。", "defs": {"A": {"pos": "v.", "en": "said something suddenly as an interruption", "zh": "插話；突然插入", "word": "interjected"}, "B": {"pos": "adj.", "en": "dedicated and loyal to a cause or task", "zh": "投入的；忠誠的；堅定的", "word": "committed"}, "C": {"pos": "v.", "en": "showed or explained with examples or pictures", "zh": "說明；舉例闡明；配插圖", "word": "illustrated"}, "D": {"pos": "v.", "en": "set down as a rule to be followed", "zh": "規定；指定；開（藥方）", "word": "prescribed"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: imposed or set as a rule.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The school uniform was not a casual custom but an expectation ______ by administrators, who could send students home for arriving in clothes that violated the dress code.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The school uniform was not a casual custom but an expectation ______ by administrators, who could send students home for arriving in clothes that violated the dress code.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n校服並非隨意的習俗，而是由行政人員 ______ 的規定，他們可以把穿著違反服裝規定衣物到校的學生遣送回家。", "opts": {"A": "prescribed", "B": "translated", "C": "interrupted", "D": "illustrated"}, "optsZh": {"A": "prescribed（規定的、指定的）", "B": "translated（翻譯的）", "C": "interrupted（打斷、中斷）", "D": "illustrated（加以說明的、有插圖的）"}, "answer": "A", "expl": "Prescribed means officially set down as a rule.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "set down as a rule to be followed", "zh": "規定；指定；開（藥方）", "word": "prescribed"}, "B": {"pos": "v.", "en": "changed words into another language; converted into another form", "zh": "翻譯；轉化", "word": "translated"}, "C": {"pos": "v.", "en": "stopped something for a short time; broke in", "zh": "打斷；中斷", "word": "interrupted"}, "D": {"pos": "v.", "en": "showed or explained with examples or pictures", "zh": "說明；舉例闡明；配插圖", "word": "illustrated"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: imposed or set as a rule.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In the courtly ceremony, each gesture followed rules ______ by tradition, from the order of greetings to the exact moment when guests could sit.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In the courtly ceremony, each gesture followed rules ______ by tradition, from the order of greetings to the exact moment when guests could sit.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n在宮廷儀式中，每個動作都遵循傳統所 ______ 的規則，從問候的順序到賓客可以入座的確切時刻都是如此。", "opts": {"A": "summarized", "B": "imposed", "C": "invented", "D": "ignored"}, "optsZh": {"A": "summarized（總結的）", "B": "imposed（強加的、規定的）", "C": "invented（發明的、捏造的）", "D": "ignored（被忽視的）"}, "answer": "B", "expl": "Imposed means established or forced upon people.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "gave a brief statement of the main points", "zh": "總結；概述", "word": "summarized"}, "B": {"pos": "v.", "en": "forced a rule, duty, or burden on someone", "zh": "強加；施加；規定", "word": "imposed"}, "C": {"pos": "v.", "en": "created something new for the first time", "zh": "發明；創造；捏造", "word": "invented"}, "D": {"pos": "v.", "en": "paid no attention to", "zh": "忽視；不理會", "word": "ignored"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: imposed or set as a rule.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The dancers&#x27; apparent spontaneity is limited by steps ______ in a centuries-old manual, which specifies where each performer should stand and when each turn should occur.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The dancers' apparent spontaneity is limited by steps ______ in a centuries-old manual, which specifies where each performer should stand and when each turn should occur.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n舞者們看似即興的表現，其實受限於一本數百年歷史的手冊中所 ______ 的舞步，手冊明確規定了每位表演者應站的位置以及每次轉身的時機。", "opts": {"A": "concealed", "B": "interjected", "C": "questioned", "D": "dictated"}, "optsZh": {"A": "concealed（隱藏的）", "B": "interjected（插話、插入）", "C": "questioned（受質疑的）", "D": "dictated（規定的、強制要求的）"}, "answer": "D", "expl": "Dictated means required or prescribed.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "hidden from view", "zh": "隱藏的；隱蔽的", "word": "concealed"}, "B": {"pos": "v.", "en": "said something suddenly as an interruption", "zh": "插話；突然插入", "word": "interjected"}, "C": {"pos": "v.", "en": "expressed doubt about; asked questions about", "zh": "質疑；詢問", "word": "questioned"}, "D": {"pos": "v.", "en": "ordered or required with authority", "zh": "規定；支配；命令", "word": "dictated"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: imposed or set as a rule.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The novel&#x27;s heroine resists the roles ______ by her community, especially the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expectation\" target=\"_blank\" rel=\"noopener\" data-w=\"expectation\" data-pos=\"n.\" data-en=\"a belief that something will happen\" data-zh=\"預期；期望\">expectation<\/a> that she abandon her scientific studies after marriage.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The novel's heroine resists the roles ______ by her community, especially the expectation that she abandon her scientific studies after marriage.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這部小說的女主角抗拒她所屬社群 ______ 的角色，尤其是期待她婚後放棄科學研究的要求。", "opts": {"A": "borrowed", "B": "mandated", "C": "celebrated", "D": "illustrated"}, "optsZh": {"A": "borrowed（借來的）", "B": "mandated（強制規定的）", "C": "celebrated（受讚揚的、著名的）", "D": "illustrated（加以說明的、有插圖的）"}, "answer": "B", "expl": "Mandated means required by authority or rule.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "took or used something from another source", "zh": "借用；借來", "word": "borrowed"}, "B": {"pos": "v.", "en": "officially required or ordered", "zh": "規定；強制要求；授權", "word": "mandated"}, "C": {"pos": "adj.", "en": "famous and widely praised", "zh": "著名的；受讚揚的", "word": "celebrated"}, "D": {"pos": "v.", "en": "showed or explained with examples or pictures", "zh": "說明；舉例闡明；配插圖", "word": "illustrated"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: imposed or set as a rule.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The debate concerned whether rules ______ by a distant colonial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=administration\" target=\"_blank\" rel=\"noopener\" data-w=\"administration\" data-pos=\"n.\" data-en=\"the government or management of a country or organization during a period\" data-zh=\"政府；行政當局\">administration<\/a> should continue to govern local land use after independence.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The debate concerned whether rules ______ by a distant colonial administration should continue to govern local land use after independence.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n這場辯論的焦點在於：由遙遠的殖民政府 ______ 的規定，在獨立之後是否仍應繼續管理當地的土地使用。", "opts": {"A": "softened", "B": "imagined", "C": "enforced", "D": "misread"}, "optsZh": {"A": "softened（軟化的、緩和的）", "B": "imagined（想像的）", "C": "enforced（強制執行的）", "D": "misread（誤讀）"}, "answer": "C", "expl": "Enforced means compelled or made effective as rules.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "made less harsh, strong, or severe", "zh": "緩和；軟化；減輕", "word": "softened"}, "B": {"pos": "adj.", "en": "existing only in the mind; not real", "zh": "想像的；虛構的", "word": "imagined"}, "C": {"pos": "v.", "en": "made sure that a rule or law was obeyed", "zh": "強制執行；實施", "word": "enforced"}, "D": {"pos": "v.", "en": "read or interpreted something incorrectly", "zh": "誤讀；誤解", "word": "misread"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Words in Context: harmless or not damaging.", "vocab": true, "body": "In studying the use of external stimuli to reduce the itching <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sensation\" target=\"_blank\" rel=\"noopener\" data-w=\"sensation\" data-pos=\"n.\" data-en=\"a physical feeling; a strong feeling\" data-zh=\"感覺；知覺\">sensation<\/a> caused by an allergic histamine response, Louise Ward and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> found that while <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=harmless\" target=\"_blank\" rel=\"noopener\" data-w=\"harmless\" data-pos=\"adj.\" data-en=\"not able or likely to cause harm\" data-zh=\"無害的；無惡意的\">harmless<\/a> applications of vibration or warming can provide a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temporary\" target=\"_blank\" rel=\"noopener\" data-w=\"temporary\" data-pos=\"adj.\" data-en=\"lasting for only a limited time\" data-zh=\"暫時的；臨時的\">temporary<\/a> distraction, such _______ stimuli actually offer less relief than a stimulus that seems less benign, like a mild electric shock.", "bodyPlain": "In studying the use of external stimuli to reduce the itching sensation caused by an allergic histamine response, Louise Ward and colleagues found that while harmless applications of vibration or warming can provide a temporary distraction, such _______ stimuli actually offer less relief than a stimulus that seems less benign, like a mild electric shock.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "Louise Ward 及其同事在研究如何利用外部刺激來減輕過敏性組織胺反應所引起的搔癢感時發現，雖然無害的振動或加熱可以提供暫時的分散注意力效果，但這類 _______ 刺激實際上所提供的緩解，不如一個看似較不溫和的刺激，例如輕微電擊。", "opts": {"A": "deceptive", "B": "innocuous", "C": "novel", "D": "impractical"}, "optsZh": {"A": "deceptive（欺騙性的）", "B": "innocuous（無害的、無傷大雅的）", "C": "novel（新穎的）", "D": "impractical（不切實際的）"}, "answer": "B", "expl": "'Such _______ stimuli' refers back to the 'harmless' applications, and 'innocuous' means harmless.", "explZh": "「such ___ stimuli」回指前面「harmless（無害的）」的刺激，而「innocuous」即無害的。", "defs": {"A": {"pos": "adj.", "en": "giving a false impression; misleading", "zh": "欺騙性的；誤導人的", "word": "deceptive"}, "B": {"pos": "adj.", "en": "not harmful or offensive", "zh": "無害的；無傷大雅的", "word": "innocuous"}, "C": {"pos": "adj.", "en": "new and original; not seen before", "zh": "新穎的；新奇的", "word": "novel"}, "D": {"pos": "adj.", "en": "not sensible or realistic to do or use", "zh": "不切實際的；不實用的", "word": "impractical"}}}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Words in Context: harmless or not damaging.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The cream was advertised as gentle, but the researchers tested whether even apparently ______ ingredients could irritate skin when applied repeatedly over several weeks.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The cream was advertised as gentle, but the researchers tested whether even apparently ______ ingredients could irritate skin when applied repeatedly over several weeks.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這款乳霜被宣傳為溫和，但研究人員測試了即使是看似 ______ 的成分，在連續數週重複塗抹後是否仍會刺激皮膚。", "opts": {"A": "deceptive", "B": "innocuous", "C": "harmful", "D": "novel"}, "optsZh": {"A": "deceptive（欺騙性的）", "B": "innocuous（無害的、無傷大雅的）", "C": "harmful（有害的）", "D": "novel（新穎的）"}, "answer": "B", "expl": "Innocuous means harmless.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "giving a false impression; misleading", "zh": "欺騙性的；誤導人的", "word": "deceptive"}, "B": {"pos": "adj.", "en": "not harmful or offensive", "zh": "無害的；無傷大雅的", "word": "innocuous"}, "C": {"pos": "adj.", "en": "causing damage or injury", "zh": "有害的", "word": "harmful"}, "D": {"pos": "adj.", "en": "new and original; not seen before", "zh": "新穎的；新奇的", "word": "novel"}}}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Words in Context: harmless or not damaging.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The warning label surprised consumers because the product seemed ______: it contained only water, fragrance, and a mild soap used in many household cleaners.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The warning label surprised consumers because the product seemed ______: it contained only water, fragrance, and a mild soap used in many household cleaners.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這個警告標示讓消費者感到意外，因為這項產品看似 ______：它只含有水、香料，以及許多家用清潔劑中都會使用的溫和肥皂。", "opts": {"A": "impractical", "B": "dangerous", "C": "benign", "D": "unusual"}, "optsZh": {"A": "impractical（不切實際的）", "B": "dangerous（危險的）", "C": "benign（無害的、良性的）", "D": "unusual（不尋常的）"}, "answer": "C", "expl": "Benign means not harmful.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not sensible or realistic to do or use", "zh": "不切實際的；不實用的", "word": "impractical"}, "B": {"pos": "adj.", "en": "likely to cause harm or injury", "zh": "危險的", "word": "dangerous"}, "C": {"pos": "adj.", "en": "gentle and not harmful", "zh": "無害的；溫和的；良性的", "word": "benign"}, "D": {"pos": "adj.", "en": "not common or ordinary", "zh": "不尋常的；罕見的", "word": "unusual"}}}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Words in Context: harmless or not damaging.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The study compared a mild vibration with a more intense stimulus, asking whether a seemingly ______ sensation could distract the nervous system enough to reduce discomfort.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The study compared a mild vibration with a more intense stimulus, asking whether a seemingly ______ sensation could distract the nervous system enough to reduce discomfort.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項研究比較了輕微振動與較強烈的刺激，探討一種看似 ______ 的感覺是否能充分分散神經系統的注意力以減輕不適。", "opts": {"A": "artificial", "B": "deceptive", "C": "novel", "D": "harmless"}, "optsZh": {"A": "artificial（人造的）", "B": "deceptive（欺騙性的）", "C": "novel（新穎的）", "D": "harmless（無害的）"}, "answer": "D", "expl": "Harmless means not damaging or dangerous.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "made by people rather than occurring naturally; not genuine", "zh": "人造的；人工的；不自然的", "word": "artificial"}, "B": {"pos": "adj.", "en": "giving a false impression; misleading", "zh": "欺騙性的；誤導人的", "word": "deceptive"}, "C": {"pos": "adj.", "en": "new and original; not seen before", "zh": "新穎的；新奇的", "word": "novel"}, "D": {"pos": "adj.", "en": "not able or likely to cause harm", "zh": "無害的；無惡意的", "word": "harmless"}}}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Words in Context: harmless or not damaging.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Although the plant looks ______, touching its leaves can cause a painful rash, so hikers are advised not to brush against it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Although the plant looks ______, touching its leaves can cause a painful rash, so hikers are advised not to brush against it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n雖然這種植物看起來 ______，但觸碰它的葉子可能引起疼痛的疹子，因此建議健行者不要擦碰到它。", "opts": {"A": "benign", "B": "rare", "C": "beautiful", "D": "ordinary"}, "optsZh": {"A": "benign（無害的、良性的）", "B": "rare（罕見的）", "C": "beautiful（美麗的）", "D": "ordinary（普通的）"}, "answer": "A", "expl": "Benign means harmless.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "gentle and not harmful", "zh": "無害的；溫和的；良性的", "word": "benign"}, "B": {"pos": "adj.", "en": "not happening or found very often", "zh": "罕見的；稀有的", "word": "rare"}, "C": {"pos": "adj.", "en": "very pleasing to look at or experience", "zh": "美麗的；優美的", "word": "beautiful"}, "D": {"pos": "adj.", "en": "normal and common; not special", "zh": "普通的；平凡的", "word": "ordinary"}}}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Words in Context: harmless or not damaging.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The team selected a ______ control stimulus, a soft tone played at low volume, so any stress response could be attributed to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> condition rather than the comparison task.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The team selected a ______ control stimulus, a soft tone played at low volume, so any stress response could be attributed to the experimental condition rather than the comparison task.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n研究團隊選擇了一個 ______ 對照刺激——以低音量播放的柔和音調——如此一來，任何壓力反應都能歸因於實驗條件，而非對照任務。", "opts": {"A": "impractical", "B": "nonthreatening", "C": "abrasive", "D": "deceptive"}, "optsZh": {"A": "impractical（不切實際的）", "B": "nonthreatening（不具威脅性的）", "C": "abrasive（粗糙的、有磨損性的）", "D": "deceptive（欺騙性的）"}, "answer": "B", "expl": "Nonthreatening means not likely to cause harm or fear.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not sensible or realistic to do or use", "zh": "不切實際的；不實用的", "word": "impractical"}, "B": {"pos": "adj.", "en": "not likely to cause fear or harm", "zh": "不具威脅性的；溫和的", "word": "nonthreatening"}, "C": {"pos": "adj.", "en": "rough or harsh in manner; also able to scrape or rub away a surface", "zh": "粗魯的；刺耳的；有磨蝕性的", "word": "abrasive"}, "D": {"pos": "adj.", "en": "giving a false impression; misleading", "zh": "欺騙性的；誤導人的", "word": "deceptive"}}}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Words in Context: distant from the center or edge-positioned.", "vocab": true, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=province\" target=\"_blank\" rel=\"noopener\" data-w=\"province\" data-pos=\"n.\" data-en=\"a large region of a country or empire with its own government\" data-zh=\"省；行省\">province<\/a> of Xoconochco was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=situate\" target=\"_blank\" rel=\"noopener\" data-w=\"situate\" data-pos=\"v.\" data-en=\"to place in a particular location\" data-zh=\"使位於\">situated<\/a> on the Pacific coast, hundreds of kilometers southeast of Tenochtitlan, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=capital\" target=\"_blank\" rel=\"noopener\" data-w=\"capital\" data-pos=\"n.\" data-en=\"the city where a country&#x27;s government is\" data-zh=\"首都\">capital<\/a> of the Aztec Empire. Because Xoconochco&#x27;s location within the empire was so _______, cacao and other trade goods produced there could reach the capital only after a long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overland\" target=\"_blank\" rel=\"noopener\" data-w=\"overland\" data-pos=\"adj.\" data-en=\"traveling across land rather than by sea or air\" data-zh=\"陸路的\">overland<\/a> journey.", "bodyPlain": "The province of Xoconochco was situated on the Pacific coast, hundreds of kilometers southeast of Tenochtitlan, the capital of the Aztec Empire. Because Xoconochco's location within the empire was so _______, cacao and other trade goods produced there could reach the capital only after a long overland journey.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "Xoconochco 省位於太平洋沿岸，在阿茲特克帝國首都 Tenochtitlan 東南方數百公里處。由於 Xoconochco 在帝國中的位置如此 _______，當地生產的可可與其他貿易商品必須經過漫長的陸路旅程才能抵達首都。", "opts": {"A": "unobtrusive", "B": "concealed", "C": "approximate", "D": "peripheral"}, "optsZh": {"A": "unobtrusive（不顯眼的）", "B": "concealed（隱藏的）", "C": "approximate（大約的、近似的）", "D": "peripheral（周邊的、邊緣的）"}, "answer": "D", "expl": "Xoconochco was hundreds of kilometers from the capital and goods needed a long journey, so its location was 'peripheral' (on the outer edge).", "explZh": "Xoconochco 距首都數百公里，貨物需長途運送，所以它的位置是「peripheral」（邊陲的）。", "defs": {"A": {"pos": "adj.", "en": "not attracting attention; not noticeable", "zh": "不顯眼的；不引人注目的", "word": "unobtrusive"}, "B": {"pos": "adj.", "en": "hidden from view", "zh": "隱藏的；隱蔽的", "word": "concealed"}, "C": {"pos": "adj.", "en": "close to the actual amount but not exact", "zh": "大約的；近似的", "word": "approximate"}, "D": {"pos": "adj.", "en": "located at the outer edge; of minor importance", "zh": "周邊的；邊緣的；次要的", "word": "peripheral"}}}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Words in Context: distant from the center or edge-positioned.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Because the fortress stood in a ______ district far from the capital&#x27;s roads and markets, messages from the central government often arrived weeks after they were issued.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Because the fortress stood in a ______ district far from the capital's roads and markets, messages from the central government often arrived weeks after they were issued.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n由於這座要塞位於遠離首都道路與市集的 ______ 地區，中央政府發出的訊息往往在發布數週後才送達。", "opts": {"A": "central", "B": "approximate", "C": "peripheral", "D": "concealed"}, "optsZh": {"A": "central（中心的、核心的）", "B": "approximate（大約的、近似的）", "C": "peripheral（周邊的、邊緣的）", "D": "concealed（隱藏的）"}, "answer": "C", "expl": "Peripheral means located at the edge or away from the center.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "located in the middle; most important", "zh": "中央的；核心的；主要的", "word": "central"}, "B": {"pos": "adj.", "en": "close to the actual amount but not exact", "zh": "大約的；近似的", "word": "approximate"}, "C": {"pos": "adj.", "en": "located at the outer edge; of minor importance", "zh": "周邊的；邊緣的；次要的", "word": "peripheral"}, "D": {"pos": "adj.", "en": "hidden from view", "zh": "隱藏的；隱蔽的", "word": "concealed"}}}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Words in Context: distant from the center or edge-positioned.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The village&#x27;s ______ position made trade difficult: merchants had to cross two mountain passes before reaching the nearest major city.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The village's ______ position made trade difficult: merchants had to cross two mountain passes before reaching the nearest major city.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這座村莊 ______ 的位置使貿易變得困難：商人必須翻越兩座山口，才能抵達最近的大城市。", "opts": {"A": "unobtrusive", "B": "symbolic", "C": "temporary", "D": "remote"}, "optsZh": {"A": "unobtrusive（不顯眼的）", "B": "symbolic（象徵性的）", "C": "temporary（暫時的）", "D": "remote（偏遠的）"}, "answer": "D", "expl": "Remote means far away or distant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not attracting attention; not noticeable", "zh": "不顯眼的；不引人注目的", "word": "unobtrusive"}, "B": {"pos": "adj.", "en": "serving as a symbol; representing something else", "zh": "象徵性的；象徵的", "word": "symbolic"}, "C": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}, "D": {"pos": "adj.", "en": "far away from other places; isolated", "zh": "遙遠的；偏僻的", "word": "remote"}}}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Words in Context: distant from the center or edge-positioned.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Although the island was politically important, it remained geographically ______, lying near the outer edge of the empire rather than near its administrative center.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the island was politically important, it remained geographically ______, lying near the outer edge of the empire rather than near its administrative center.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n雖然這座島在政治上很重要，但它在地理上仍然 ______，位於帝國的外緣，而非靠近其行政中心。", "opts": {"A": "marginal", "B": "wealthy", "C": "ordinary", "D": "hidden"}, "optsZh": {"A": "marginal（邊緣的）", "B": "wealthy（富有的）", "C": "ordinary（普通的）", "D": "hidden（隱藏的）"}, "answer": "A", "expl": "Marginal can mean located at the edge.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "small and not important; at the edge", "zh": "微小的；次要的；邊緣的", "word": "marginal"}, "B": {"pos": "adj.", "en": "having a lot of money or possessions", "zh": "富有的；富裕的", "word": "wealthy"}, "C": {"pos": "adj.", "en": "normal and common; not special", "zh": "普通的；平凡的", "word": "ordinary"}, "D": {"pos": "adj.", "en": "kept out of sight; not easily seen", "zh": "隱藏的；隱蔽的", "word": "hidden"}}}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Words in Context: distant from the center or edge-positioned.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=province\" target=\"_blank\" rel=\"noopener\" data-w=\"province\" data-pos=\"n.\" data-en=\"a large region of a country or empire with its own government\" data-zh=\"省；行省\">province<\/a>&#x27;s ______ location explains why goods from the region reached the capital only after a long journey through difficult terrain.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The province's ______ location explains why goods from the region reached the capital only after a long journey through difficult terrain.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n這個省分 ______ 的位置說明了為什麼該地區的貨物必須經過崎嶇地形的漫長旅程才能抵達首都。", "opts": {"A": "prosperous", "B": "famous", "C": "outlying", "D": "unified"}, "optsZh": {"A": "prosperous（繁榮的）", "B": "famous（著名的）", "C": "outlying（偏遠的、外圍的）", "D": "unified（統一的）"}, "answer": "C", "expl": "Outlying means far from the center.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "successful and wealthy", "zh": "繁榮的；富裕的", "word": "prosperous"}, "B": {"pos": "adj.", "en": "known by many people", "zh": "著名的；出名的", "word": "famous"}, "C": {"pos": "adj.", "en": "far from the center of a place", "zh": "偏遠的；外圍的", "word": "outlying"}, "D": {"pos": "adj.", "en": "joined together as one whole", "zh": "統一的；一致的；整合的", "word": "unified"}}}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Words in Context: distant from the center or edge-positioned.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The settlement was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strategically\" target=\"_blank\" rel=\"noopener\" data-w=\"strategically\" data-pos=\"adv.\" data-en=\"in a way that is carefully planned to achieve a goal\" data-zh=\"策略性地\">strategically<\/a> valuable but ______, positioned near the frontier rather than in the densely connected heart of the kingdom.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The settlement was strategically valuable but ______, positioned near the frontier rather than in the densely connected heart of the kingdom.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n這個聚落在戰略上很有價值，但卻 ______，位於邊境附近，而非王國中交通往來緊密的核心地帶。", "opts": {"A": "invisible", "B": "distant", "C": "approximate", "D": "urban"}, "optsZh": {"A": "invisible（看不見的）", "B": "distant（遙遠的）", "C": "approximate（大約的、近似的）", "D": "urban（都市的）"}, "answer": "B", "expl": "Distant means far away.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "unable to be seen", "zh": "看不見的；隱形的", "word": "invisible"}, "B": {"pos": "adj.", "en": "far away in space or time", "zh": "遙遠的；遠方的；疏遠的", "word": "distant"}, "C": {"pos": "adj.", "en": "close to the actual amount but not exact", "zh": "大約的；近似的", "word": "approximate"}, "D": {"pos": "adj.", "en": "relating to a city or town", "zh": "都市的；城市的", "word": "urban"}}}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Literary purpose: contrast outward calm with inward restlessness.", "vocab": false, "body": "The following text is from Charlotte Bronte&#x27;s 1847 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novel\" target=\"_blank\" rel=\"noopener\" data-w=\"novel\" data-pos=\"adj.\" data-en=\"new and original; not seen before\" data-zh=\"新穎的；新奇的\">novel<\/a> Jane Eyre. Jane works as a governess at Thornfield Hall.<br><br>I went on with my day&#x27;s business tranquilly; but ever and anon vague suggestions kept wandering across my brain of reasons why I should quit Thornfield; and I kept <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=involuntarily\" target=\"_blank\" rel=\"noopener\" data-w=\"involuntarily\" data-pos=\"adv.\" data-en=\"without conscious control or choice\" data-zh=\"不由自主地；非自願地\">involuntarily<\/a> framing advertisements and pondering <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conjecture\" target=\"_blank\" rel=\"noopener\" data-w=\"conjecture\" data-pos=\"n.\" data-en=\"a guess or opinion based on incomplete information\" data-zh=\"推測\">conjectures<\/a> about new situations: these thoughts I did not think to check; they might germinate and bear fruit if they could.", "bodyPlain": "The following text is from Charlotte Bronte's 1847 novel Jane Eyre. Jane works as a governess at Thornfield Hall.\n\nI went on with my day's business tranquilly; but ever and anon vague suggestions kept wandering across my brain of reasons why I should quit Thornfield; and I kept involuntarily framing advertisements and pondering conjectures about new situations: these thoughts I did not think to check; they might germinate and bear fruit if they could.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主要目的？", "bodyZh": "以下文字出自 Charlotte Brontë 1847 年的小說《Jane Eyre》。Jane 在 Thornfield 莊園擔任家庭教師。\n我平靜地繼續處理一天的事務；但不時有各種模糊的念頭在我腦海中遊蕩，提示我應該離開 Thornfield 的理由；我不由自主地一再擬著求職廣告，思索著新工作的種種可能：這些念頭我並不打算遏止；只要它們能夠，就讓它們萌芽結果吧。", "opts": {"A": "To convey a contrast between Jane's outward calmness and internal restlessness", "B": "To emphasize Jane's loyalty to the people she works for at Thornfield Hall", "C": "To demonstrate that Jane finds her situation both challenging and deeply fulfilling", "D": "To describe Jane's determination to secure employment outside of Thornfield Hall"}, "optsZh": {"A": "傳達 Jane 外表的平靜與內心的不安之間的對比", "B": "強調 Jane 對她在 Thornfield Hall 所服務之人的忠誠", "C": "表明 Jane 覺得自己的處境既具挑戰性又非常令人滿足", "D": "描述 Jane 想在 Thornfield Hall 以外找到工作的決心"}, "answer": "A", "expl": "Jane does her business 'tranquilly' yet keeps thinking about leaving, so the text contrasts outer calm with inner restlessness.", "explZh": "Jane 外表平靜地工作，內心卻不斷想著離開，因此本文呈現外在平靜與內在不安的對比。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Literary purpose: contrast outward calm with inward restlessness.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n在一段短篇小說節選中，一位年邁的音樂家在敞開的窗邊等待，而一位較年輕的親戚正從花園帶著花回來。敘事細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To explain why music has lost its importance", "C": "To argue that the characters should leave the house", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "在角色們為某人的到來做準備時，描繪場景與氣氛", "B": "解釋為什麼音樂已失去其重要性", "C": "主張這些角色應該離開這棟房子", "D": "概述兩位親戚之間的衝突"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Literary purpose: contrast outward calm with inward restlessness.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n一首詩描寫說話者站在港口邊緣，看著船隻在黎明時分啟航。這首詩並未敘述一段已完成的旅程，而是強調霧氣、移動，以及說話者意識到旅人們正駛入未知卻充滿希望的境況。", "opts": {"A": "To criticize sailors for taking unnecessary risks", "B": "To list the technical features of a harbor", "C": "To present an atmosphere of departure and possibility", "D": "To compare several forms of transportation"}, "optsZh": {"A": "批評水手們冒不必要的風險", "B": "列出一座港口的技術特點", "C": "呈現一種啟程與充滿可能性的氛圍", "D": "比較幾種不同的交通方式"}, "answer": "C", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Literary purpose: contrast outward calm with inward restlessness.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n一段小說節選呈現節慶大餐前擁擠的廚房。敘述者注意到擦得發亮的碗、精心排放的椅子，以及每當屋外傳來腳步聲時家人們停頓下來的樣子——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To depict preparations that reveal anticipation within a family", "C": "To contrast rural and urban customs", "D": "To describe a completed celebration from beginning to end"}, "optsZh": {"A": "解釋為什麼這家人不喜歡訪客", "B": "描繪顯露出一家人期待之情的準備工作", "C": "對比鄉村與都市的風俗", "D": "從頭到尾描述一
