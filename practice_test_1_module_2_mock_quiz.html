-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "are expanding", "B": "expand", "C": "have expanded", "D": "has expanded"}, "optsZh": {"A": "are expanding（複數現在進行式，主詞為單數：錯誤）", "B": "expand（複數動詞原形，主詞為單數：錯誤）", "C": "have expanded（複數完成式，主詞為單數：錯誤）", "D": "has expanded（現在完成式，單數主詞：正確）"}, "answer": "D", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: participial phrase showing result.", "vocab": false, "body": "In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=availability\" target=\"_blank\" rel=\"noopener\" data-w=\"availability\" data-pos=\"n.\" data-en=\"the state of being able to be obtained or used\" data-zh=\"可取得性；供應情況\">availability<\/a> than by food preference. Although the monkeys prefer to eat <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a> and land-dwelling <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invertebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"invertebrate\" data-pos=\"n.\" data-en=\"an animal without a backbone\" data-zh=\"無脊椎動物\">invertebrates<\/a>, those food sources may become unavailable because of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extensive\" target=\"_blank\" rel=\"noopener\" data-w=\"extensive\" data-pos=\"adj.\" data-en=\"covering a large area or amount\" data-zh=\"廣泛的；大面積的\">extensive<\/a> snow and ice cover, _______ the monkeys to hunt for marine animals in any streams that have not frozen over.", "bodyPlain": "In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food availability than by food preference. Although the monkeys prefer to eat vegetation and land-dwelling invertebrates, those food sources may become unavailable because of extensive snow and ice cover, _______ the monkeys to hunt for marine animals in any streams that have not frozen over.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "冬季時，日本獼猴（又稱雪猴）的飲食受食物可得性的影響大於受食物偏好的影響。雖然這些猴子偏好吃植物與陸生無脊椎動物，但這些食物來源可能因大範圍的冰雪覆蓋而無法取得，_______ 猴子們到尚未結冰的溪流中捕食水生動物。", "opts": {"A": "forces", "B": "to force", "C": "forcing", "D": "forced"}, "optsZh": {"A": "forces（現在式 → 造成兩個主要動詞缺乏連接：錯誤）", "B": "to force（不定詞 → 無法表示前句造成的結果：錯誤）", "C": "forcing（現在分詞片語，表示結果：正確）", "D": "forced（過去式 → 造成兩個主要動詞缺乏連接：錯誤）"}, "answer": "C", "expl": "'Forcing' begins a participial phrase describing the result of the food sources becoming unavailable; a finite verb would create an error.", "explZh": "「forcing」引導分詞片語，說明食物來源消失所造成的結果；用限定動詞會造成文法錯誤。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: participial phrase showing result.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "including", "B": "includes", "C": "to include", "D": "having included"}, "optsZh": {"A": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）", "B": "includes（第三人稱單數現在式，作關係子句的動詞：正確）", "C": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "D": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "B", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English: participial phrase showing result.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices", "B": "prices but", "C": "prices,", "D": "prices, but"}, "optsZh": {"A": "prices（無標點：錯誤）", "B": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "C": "prices,（只有逗號 → 造成逗號連接錯誤）", "D": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English: participial phrase showing result.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However,", "B": "However;", "C": "However", "D": "however,"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "However;（句首轉折詞後接分號：錯誤）", "C": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "D": "however,（小寫 however → 句首應大寫：錯誤）"}, "answer": "A", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English: participial phrase showing result.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "whenever,", "B": "whenever", "C": ". Whenever", "D": "; whenever"}, "optsZh": {"A": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "B": "whenever（從屬連接詞，不加標點：正確）", "C": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "D": "; whenever（分號 → 後面接的不是獨立子句：錯誤）"}, "answer": "B", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English: participial phrase showing result.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "are expanding", "B": "have expanded", "C": "has expanded", "D": "expand"}, "optsZh": {"A": "are expanding（複數現在進行式，主詞為單數：錯誤）", "B": "have expanded（複數完成式，主詞為單數：錯誤）", "C": "has expanded（現在完成式，單數主詞：正確）", "D": "expand（複數動詞原形，主詞為單數：錯誤）"}, "answer": "C", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English: question clause at end of sentence.", "vocab": false, "body": "Lucia Michel of the University of Chile observed that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=alkaline\" target=\"_blank\" rel=\"noopener\" data-w=\"alkaline\" data-pos=\"adj.\" data-en=\"having a pH greater than 7; not acidic\" data-zh=\"鹼性的\">alkaline<\/a> soils <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">contain<\/a> an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=insoluble\" target=\"_blank\" rel=\"noopener\" data-w=\"insoluble\" data-pos=\"adj.\" data-en=\"not able to be dissolved in liquid\" data-zh=\"不溶的\">insoluble<\/a> form of iron that blueberry plants cannot absorb, thus inhibiting blueberry growth. If these plants were grown in alkaline soil alongside grasses that aid in iron solubilization, _______ Michel was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> to find out.", "bodyPlain": "Lucia Michel of the University of Chile observed that alkaline soils contain an insoluble form of iron that blueberry plants cannot absorb, thus inhibiting blueberry growth. If these plants were grown in alkaline soil alongside grasses that aid in iron solubilization, _______ Michel was determined to find out.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "智利大學的 Lucia Michel 觀察到，鹼性土壤中含有一種藍莓植株無法吸收的不溶性鐵，因而抑制了藍莓的生長。如果將這些植株種在鹼性土壤中，並與有助於鐵溶解的草類一起栽種，_______ Michel 決心要找出答案。", "opts": {"A": "could the blueberries thrive.", "B": "the blueberries could thrive.", "C": "the blueberries could thrive?", "D": "could the blueberries thrive?"}, "optsZh": {"A": "could the blueberries thrive.（倒裝問句語序卻用句號：錯誤）", "B": "the blueberries could thrive.（陳述句語序＋句號 → 直接問句結構錯誤）", "C": "the blueberries could thrive?（陳述句語序卻用問號：錯誤）", "D": "could the blueberries thrive?（直接問句：倒裝語序＋問號：正確）"}, "answer": "D", "expl": "The sentence asks a direct question ('could the blueberries thrive?') before 'Michel was determined to find out,' so it needs question word order and a question mark.", "explZh": "這是直接問句（could the blueberries thrive?），之後才接 Michel was determined to find out，因此需要倒裝語序與問號。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English: question clause at end of sentence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "includes", "B": "to include", "C": "having included", "D": "including"}, "optsZh": {"A": "includes（第三人稱單數現在式，作關係子句的動詞：正確）", "B": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "C": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）", "D": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English: question clause at end of sentence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices", "B": "prices but", "C": "prices, but", "D": "prices,"}, "optsZh": {"A": "prices（無標點：錯誤）", "B": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "C": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "D": "prices,（只有逗號 → 造成逗號連接錯誤）"}, "answer": "C", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English: question clause at end of sentence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "however,", "B": "However", "C": "However,", "D": "However;"}, "optsZh": {"A": "however,（小寫 however → 句首應大寫：錯誤）", "B": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "C": "However,（句首轉折詞後加逗號：正確）", "D": "However;（句首轉折詞後接分號：錯誤）"}, "answer": "C", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English: question clause at end of sentence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever,", "C": "; whenever", "D": "whenever"}, "optsZh": {"A": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "B": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "C": "; whenever（分號 → 後面接的不是獨立子句：錯誤）", "D": "whenever（從屬連接詞，不加標點：正確）"}, "answer": "D", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English: question clause at end of sentence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "are expanding", "B": "has expanded", "C": "have expanded", "D": "expand"}, "optsZh": {"A": "are expanding（複數現在進行式，主詞為單數：錯誤）", "B": "has expanded（現在完成式，單數主詞：正確）", "C": "have expanded（複數完成式，主詞為單數：錯誤）", "D": "expand（複數動詞原形，主詞為單數：錯誤）"}, "answer": "B", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English: present-tense passive verb.", "vocab": false, "body": "In his 1963 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> Exposition of Music-Electronic Television, Korean American artist Nam June Paik showed how television <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> could be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manipulate\" target=\"_blank\" rel=\"noopener\" data-w=\"manipulate\" data-pos=\"v.\" data-en=\"to control or change something skillfully\" data-zh=\"操控；操縱\">manipulated<\/a> to express an artist&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspective<\/a>. Today, Paik _______ considered the first video artist.", "bodyPlain": "In his 1963 exhibition Exposition of Music-Electronic Television, Korean American artist Nam June Paik showed how television images could be manipulated to express an artist's perspective. Today, Paik _______ considered the first video artist.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在 1963 年的展覽〈Exposition of Music-Electronic Television〉中，韓裔美籍藝術家 Nam June Paik 展示了如何操控電視影像來表達藝術家的觀點。如今，Paik _______ 被視為第一位錄像藝術家。", "opts": {"A": "will be", "B": "had been", "C": "was", "D": "is"}, "optsZh": {"A": "will be（未來式 → 與 Today 不符：錯誤）", "B": "had been（過去完成式 → 與 Today 不符：錯誤）", "C": "was（過去式 → 與 Today 不符：錯誤）", "D": "is（單數現在式被動語態，與 Today 相符：正確）"}, "answer": "D", "expl": "'Today' signals the present, and Paik receives the action (is considered), so the present-tense passive 'is' is correct.", "explZh": "「Today」表示現在，且 Paik 是被認為的對象，所以用現在式被動「is」。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English: present-tense passive verb.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "includes", "B": "to include", "C": "having included", "D": "including"}, "optsZh": {"A": "includes（第三人稱單數現在式，作關係子句的動詞：正確）", "B": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "C": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）", "D": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English: present-tense passive verb.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices but", "B": "prices", "C": "prices, but", "D": "prices,"}, "optsZh": {"A": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "B": "prices（無標點：錯誤）", "C": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "D": "prices,（只有逗號 → 造成逗號連接錯誤）"}, "answer": "C", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English: present-tense passive verb.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However,", "B": "However", "C": "however,", "D": "However;"}, "optsZh": {"A": "However,（句首轉折詞後加逗號：正確）", "B": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "C": "however,（小寫 however → 句首應大寫：錯誤）", "D": "However;（句首轉折詞後接分號：錯誤）"}, "answer": "A", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English: present-tense passive verb.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": "; whenever", "B": "whenever,", "C": ". Whenever", "D": "whenever"}, "optsZh": {"A": "; whenever（分號 → 後面接的不是獨立子句：錯誤）", "B": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "C": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "D": "whenever（從屬連接詞，不加標點：正確）"}, "answer": "D", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English: present-tense passive verb.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "have expanded", "B": "has expanded", "C": "expand", "D": "are expanding"}, "optsZh": {"A": "have expanded（複數完成式，主詞為單數：錯誤）", "B": "has expanded（現在完成式，單數主詞：正確）", "C": "expand（複數動詞原形，主詞為單數：錯誤）", "D": "are expanding（複數現在進行式，主詞為單數：錯誤）"}, "answer": "B", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "The first computerized <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spreadsheet\" target=\"_blank\" rel=\"noopener\" data-w=\"spreadsheet\" data-pos=\"n.\" data-en=\"a computer program or table for organizing and calculating numbers\" data-zh=\"試算表\">spreadsheet<\/a>, Dan Bricklin&#x27;s VisiCalc, improved financial recordkeeping not only by providing users with an easy means of adjusting data in spreadsheets but also by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=automatically\" target=\"_blank\" rel=\"noopener\" data-w=\"automatically\" data-pos=\"adv.\" data-en=\"without conscious thought or control; by itself\" data-zh=\"自動地；不假思索地\">automatically<\/a> updating all <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculation\" target=\"_blank\" rel=\"noopener\" data-w=\"calculation\" data-pos=\"n.\" data-en=\"the process of working out an amount using numbers\" data-zh=\"計算\">calculations<\/a> that were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dependent\" target=\"_blank\" rel=\"noopener\" data-w=\"dependent\" data-pos=\"adj.\" data-en=\"relying on or determined by something else\" data-zh=\"依賴的；取決於…的\">dependent<\/a> on these _______ to VisiCalc&#x27;s release, changing a paper spreadsheet often required redoing the entire sheet by hand, a process that could take days.", "bodyPlain": "The first computerized spreadsheet, Dan Bricklin's VisiCalc, improved financial recordkeeping not only by providing users with an easy means of adjusting data in spreadsheets but also by automatically updating all calculations that were dependent on these _______ to VisiCalc's release, changing a paper spreadsheet often required redoing the entire sheet by hand, a process that could take days.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "第一個電腦化試算表——Dan Bricklin 的 VisiCalc——改善了財務紀錄的保存，不僅為使用者提供了調整試算表資料的簡便方法，還能自動更新所有依賴這些 _______ VisiCalc 發行之前，修改紙本試算表往往需要用手重做整張表，這個過程可能要花上好幾天。", "opts": {"A": "adjustments prior", "B": "adjustments, prior", "C": "adjustments. Prior", "D": "adjustments and prior"}, "optsZh": {"A": "adjustments prior（無標點 → 兩個獨立子句直接相連：錯誤）", "B": "adjustments, prior（逗號 → 造成逗號連接錯誤）", "C": "adjustments. Prior（句號分隔兩個獨立子句：正確）", "D": "adjustments and prior（以 and 連接 → 造成連寫句：錯誤）"}, "answer": "C", "expl": "The sentence ending in 'adjustments' is complete, and 'Prior to VisiCalc's release...' is a new independent clause, so a period is needed.", "explZh": "「adjustments」處句子已完整，「Prior to VisiCalc's release...」是新的獨立子句，因此需要句號分隔。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "includes", "B": "including", "C": "having included", "D": "to include"}, "optsZh": {"A": "includes（第三人稱單數現在式，作關係子句的動詞：正確）", "B": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）", "C": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）", "D": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices,", "B": "prices", "C": "prices but", "D": "prices, but"}, "optsZh": {"A": "prices,（只有逗號 → 造成逗號連接錯誤）", "B": "prices（無標點：錯誤）", "C": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "D": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The survey received more than ten thousand responses. ______ researchers warned that online polls may overrepresent people with strong opinions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n這項調查收到了超過一萬份回覆。______ 研究人員提醒，網路民調可能會過度呈現意見強烈者的看法。", "opts": {"A": "However", "B": "However;", "C": "However,", "D": "however,"}, "optsZh": {"A": "However（缺少逗號 → 句首轉折詞後應加逗號：錯誤）", "B": "However;（句首轉折詞後接分號：錯誤）", "C": "However,（句首轉折詞後加逗號：正確）", "D": "however,（小寫 however → 句首應大寫：錯誤）"}, "answer": "C", "expl": "A transition at the start of a sentence is followed by a comma.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The clock is adjusted ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> from atomic instruments no longer align closely with astronomical time.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The clock is adjusted ______ measurements from atomic instruments no longer align closely with astronomical time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n______ 原子儀器的測量值與天文時間不再緊密吻合，時鐘就會被調整。", "opts": {"A": ". Whenever", "B": "whenever,", "C": "; whenever", "D": "whenever"}, "optsZh": {"A": ". Whenever（句號＋大寫 Whenever → 造成句子殘缺：錯誤）", "B": "whenever,（從屬連接詞後加逗號 → 切斷子句：錯誤）", "C": "; whenever（分號 → 後面接的不是獨立子句：錯誤）", "D": "whenever（從屬連接詞，不加標點：正確）"}, "answer": "D", "expl": "No punctuation is needed before the dependent whenever-clause.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: punctuation between sentences.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy&#x27;s Lunar Baedeker, a collection of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> poems, ______ scholars&#x27; understanding of modernist style.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Mina Loy's Lunar Baedeker, a collection of experimental poems, ______ scholars' understanding of modernist style.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\nMina Loy 的實驗詩集《Lunar Baedeker》______ 學者對現代主義風格的理解。", "opts": {"A": "expand", "B": "has expanded", "C": "are expanding", "D": "have expanded"}, "optsZh": {"A": "expand（複數動詞原形，主詞為單數：錯誤）", "B": "has expanded（現在完成式，單數主詞：正確）", "C": "are expanding（複數現在進行式，主詞為單數：錯誤）", "D": "have expanded（複數完成式，主詞為單數：錯誤）"}, "answer": "B", "expl": "The singular title takes the singular verb phrase 'has expanded'.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: parallel verb after would.", "vocab": false, "body": "In order to prevent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nonnative\" target=\"_blank\" rel=\"noopener\" data-w=\"nonnative\" data-pos=\"adj.\" data-en=\"not originally from the place where it lives now\" data-zh=\"非本地的；外來的\">nonnative<\/a> fish species from moving freely between the Mediterranean and Red Seas, marine biologist Bella Galil has proposed that a saline lock system be installed along the Suez Canal in Egypt&#x27;s Great Bitter Lakes. The lock would increase the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=salinity\" target=\"_blank\" rel=\"noopener\" data-w=\"salinity\" data-pos=\"n.\" data-en=\"the amount of salt in water\" data-zh=\"鹽度\">salinity<\/a> of the lakes and _______ a natural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=barrier\" target=\"_blank\" rel=\"noopener\" data-w=\"barrier\" data-pos=\"n.\" data-en=\"something that blocks movement or access\" data-zh=\"屏障；障礙\">barrier<\/a> of water most marine creatures would be unable to cross.", "bodyPlain": "In order to prevent nonnative fish species from moving freely between the Mediterranean and Red Seas, marine biologist Bella Galil has proposed that a saline lock system be installed along the Suez Canal in Egypt's Great Bitter Lakes. The lock would increase the salinity of the lakes and _______ a natural barrier of water most marine creatures would be unable to cross.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "為了防止非原生魚種在地中海與紅海之間自由移動，海洋生物學家 Bella Galil 提議在埃及大苦湖沿著蘇伊士運河設置一套鹽度閘門系統。這道閘門將提高湖泊的鹽度，並 _______ 一道大多數海洋生物都無法越過的天然水域屏障。", "opts": {"A": "creates", "B": "create", "C": "creating", "D": "created"}, "optsZh": {"A": "creates（第三人稱單數現在式 → 不平行：錯誤）", "B": "create（原形動詞，與 would increase 平行：正確）", "C": "creating（現在分詞 → 不平行：錯誤）", "D": "created（過去式 → 與 would 後的原形動詞不平行：錯誤）"}, "answer": "B", "expl": "'Would increase ... and create' requires a base-form verb parallel to 'increase' after 'would.'", "explZh": "「would increase ... and ___」需要與 increase 平行的原形動詞「create」。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: parallel verb after would.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive&#x27;s most requested resources.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The catalog of early maps, which ______ detailed notes about coastlines and river systems, remains one of the archive's most requested resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n這份早期地圖目錄 ______ 有關海岸線與河川系統的詳細註記，至今仍是該檔案館最常被調閱的資料之一。", "opts": {"A": "having included", "B": "including", "C": "to include", "D": "includes"}, "optsZh": {"A": "having included（完成分詞 → 關係子句缺少主要動詞：錯誤）", "B": "including（現在分詞 → 關係子句缺少主要動詞：錯誤）", "C": "to include（不定詞 → 關係子句缺少主要動詞：錯誤）", "D": "includes（第三人稱單數現在式，作關係子句的動詞：正確）"}, "answer": "D", "expl": "The relative clause needs the finite verb 'includes'.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: parallel verb after would.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The poet&#x27;s letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The poet's letters usually sell for modest prices, ______ when the letter contains a draft of a famous poem, collectors may pay far more.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能完成這段文字，並符合標準英文的規範？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n這位詩人的信件通常以不高的價格售出，______ 當信中含有某首名詩的草稿時，收藏家可能會付出高得多的價錢。", "opts": {"A": "prices", "B": "prices, but", "C": "prices but", "D": "prices,"}, "optsZh": {"A": "prices（無標點：錯誤）", "B": "prices, but（逗號＋對等連接詞 but 連接兩個獨立子句：正確）", "C": "prices but（缺少逗號 → 連接兩個獨立子句時標點錯誤）", "D": "prices,（只有逗號 → 造成逗號連接錯誤）"}, "answer": "B", "expl": "A comma before 'but' correctly joins independent clauses.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: parallel verb after would.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than
