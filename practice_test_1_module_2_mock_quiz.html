場已經結束的慶祝活動"}, "answer": "B", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Literary purpose: contrast outward calm with inward restlessness.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一段回憶錄的文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集。這段文字尚未呈現課程本身；相反地，它強調的是課程開始前的那些安靜儀式。", "opts": {"A": "To argue that early classes should be canceled", "B": "To describe the moments before a significant daily activity begins", "C": "To evaluate the quality of a school's curriculum", "D": "To recount a student's entire academic career"}, "optsZh": {"A": "主張應該取消早上的課程", "B": "描述一項重要的日常活動開始前的時刻", "C": "評估一所學校課程的品質", "D": "敘述一名學生完整的求學經歷"}, "answer": "B", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Literary purpose: contrast outward calm with inward restlessness.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n一段文學作品呈現雨後的花園：濕漉漉的小徑、明亮的葉子，以及一張擺在樹下的長椅。一個角色手拿著一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To compare two different seasons", "B": "To give instructions for maintaining a garden", "C": "To reveal the full contents of a letter", "D": "To establish a reflective mood before a character acts"}, "optsZh": {"A": "比較兩個不同的季節", "B": "提供照顧花園的指示", "C": "揭露一封信的完整內容", "D": "在角色採取行動之前營造一種沉思的氛圍"}, "answer": "D", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Cross-Text Connections: evaluate a characterization of a scientific discovery.", "vocab": false, "body": "Text 1<br>Most animals can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=regenerate\" target=\"_blank\" rel=\"noopener\" data-w=\"regenerate\" data-pos=\"v.\" data-en=\"to grow again after being lost or damaged\" data-zh=\"再生\">regenerate<\/a> some parts of their bodies, such as skin. But when a three-banded panther worm is cut into three pieces, each piece grows into a new worm. Researchers are investigating this feat partly to learn more about humans&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=comparatively\" target=\"_blank\" rel=\"noopener\" data-w=\"comparatively\" data-pos=\"adv.\" data-en=\"when compared with something else\" data-zh=\"相對地；比較而言\">comparatively<\/a> limited abilities to regenerate, and they&#x27;re making exciting progress. An especially promising discovery is that both humans and panther worms have a gene for early growth response (EGR) linked to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=regeneration\" target=\"_blank\" rel=\"noopener\" data-w=\"regeneration\" data-pos=\"n.\" data-en=\"the regrowth of lost or damaged body parts\" data-zh=\"再生\">regeneration<\/a>.<br><br>Text 2<br>When Mansi Srivastava and her team reported that panther worms, like humans, possess a gene for EGR, it caused excitement. However, as the team pointed out, the gene likely <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=function\" target=\"_blank\" rel=\"noopener\" data-w=\"function\" data-pos=\"n.\" data-en=\"the purpose or role of something\" data-zh=\"功能；作用\">functions<\/a> very differently in humans than it does in panther worms. Srivastava has likened EGR to a switch that activates other genes involved in regeneration in panther worms, but how this switch operates in humans remains unclear.<br><br>Based on the texts, what would the author of Text 2 most likely say about Text 1&#x27;s characterization of the discovery involving EGR?", "bodyPlain": "Text 1\nMost animals can regenerate some parts of their bodies, such as skin. But when a three-banded panther worm is cut into three pieces, each piece grows into a new worm. Researchers are investigating this feat partly to learn more about humans' comparatively limited abilities to regenerate, and they're making exciting progress. An especially promising discovery is that both humans and panther worms have a gene for early growth response (EGR) linked to regeneration.\n\nText 2\nWhen Mansi Srivastava and her team reported that panther worms, like humans, possess a gene for EGR, it caused excitement. However, as the team pointed out, the gene likely functions very differently in humans than it does in panther worms. Srivastava has likened EGR to a switch that activates other genes involved in regeneration in panther worms, but how this switch operates in humans remains unclear.\n\nBased on the texts, what would the author of Text 2 most likely say about Text 1's characterization of the discovery involving EGR?", "stem": "", "stemZh": "", "bodyZh": "文本 1\n大多數動物都能再生身體的某些部位，例如皮膚。但當一隻三帶豹紋蟲被切成三段時，每一段都會長成一隻新的蟲。研究人員研究這項驚人的能力，部分是為了更了解人類相對有限的再生能力，而且他們正取得令人振奮的進展。一項特別有希望的發現是，人類與豹紋蟲都擁有一個與再生相關的早期生長反應（EGR）基因。\n文本 2\n當 Mansi Srivastava 和她的團隊發表報告，指出豹紋蟲和人類一樣擁有 EGR 基因時，引起了一陣興奮。然而，正如該團隊所指出的，這個基因在人類體內的運作方式很可能與在豹紋蟲體內截然不同。Srivastava 曾把 EGR 比喻為一個開關，在豹紋蟲體內啟動其他與再生相關的基因，但這個開關在人類體內如何運作仍不清楚。\n根據這兩篇文本，文本 2 的作者最可能如何評論文本 1 對 EGR 相關發現的描述？", "opts": {"A": "It is reasonable given that Srivastava and her team have identified how EGR functions in both humans and panther worms.", "B": "It is overly optimistic given additional observations from Srivastava and her team.", "C": "It is unexpected given that Srivastava and her team's findings were generally met with enthusiasm.", "D": "It is unfairly dismissive given the progress that Srivastava and her team have reported."}, "optsZh": {"A": "考量到 Srivastava 和她的團隊已確認 EGR 在人類與三分節渦蟲體內如何運作，這個說法是合理的。", "B": "考量到 Srivastava 和她的團隊的其他觀察結果，這個說法過於樂觀。", "C": "考量到 Srivastava 和她的團隊的研究結果普遍受到熱烈歡迎，這個說法令人意外。", "D": "考量到 Srivastava 和她的團隊所報告的進展，這個說法過於輕率地否定其成果。"}, "answer": "B", "expl": "Text 2 notes the gene likely works very differently in humans and its role there is unclear, so Text 1's 'exciting progress' claim is overly optimistic.", "explZh": "Text 2 指出此基因在人類身上的作用可能截然不同且仍不清楚，因此 Text 1 所說「令人興奮的進展」過於樂觀。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Cross-Text Connections: evaluate a characterization of a scientific discovery.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n一篇科學文章首先說明，彗星每次接近太陽時，其表面都會發生變化。第二句指出，由於人們對彗星的內部結構仍所知甚少，研究人員無法準確預測這些變化。最後一句描述了一項研究，該研究測試雷達能否解決這個問題，但發現訊號無法穿透到足夠的深度。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "It identifies the uncertainty that motivated the study.", "B": "It offers evidence that radar is always reliable.", "C": "It states the study's final conclusion.", "D": "It describes how other researchers criticized the work."}, "optsZh": {"A": "它指出了促成這項研究的不確定之處。", "B": "它提供了雷達永遠可靠的證據。", "C": "它陳述了這項研究的最終結論。", "D": "它描述了其他研究人員如何批評這項研究。"}, "answer": "A", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Cross-Text Connections: evaluate a characterization of a scientific discovery.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n一篇考古學文章開頭指出，某個聚落顯然曾與遙遠的地區進行貿易。下一句說明，這種交流所使用的路線至今仍然不明，因為附近的道路幾乎沒有留下任何實體痕跡。接著，文章討論一個團隊在陶器中尋找化學特徵，但只得到初步的結論。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "It summarizes the team's strongest result.", "B": "It contradicts the claim made in the first sentence.", "C": "It defines the problem the later investigation attempts to address.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它概述了這個團隊最有力的研究結果。", "B": "它反駁了第一句中提出的主張。", "C": "它界定了後續研究試圖解決的問題。", "D": "它將討論從考古學轉移開來。"}, "answer": "C", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Cross-Text Connections: evaluate a characterization of a scientific discovery.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n一篇生物學文章指出，某種植物能夠在長期乾旱中存活。接下來的句子說明，科學家仍不確定是哪一種細胞機制使它得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "It gives a historical overview of plant classification.", "B": "It proves that drought has no effect on plants.", "C": "It introduces a gap in knowledge that the experiment examines.", "D": "It lists the materials used in the experiment."}, "optsZh": {"A": "它提供了植物分類的歷史概述。", "B": "它證明了乾旱對植物沒有影響。", "C": "它引出了這項實驗所探討的知識缺口。", "D": "它列出了實驗中使用的材料。"}, "answer": "C", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Cross-Text Connections: evaluate a characterization of a scientific discovery.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A literary analysis begins by noting that a novel&#x27;s ending has often been described as optimistic. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一篇文學分析開頭指出，某部小說的結局常被形容為樂觀。第二句觀察到，這種詮釋很難成立，因為最後一章包含了好幾個囚禁的意象。段落其餘部分說明這些意象如何使先前的解讀變得更加複雜。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "It summarizes the novel's publication history.", "B": "It introduces an unrelated theme.", "C": "It provides biographical information about the novelist.", "D": "It raises a difficulty with a common interpretation."}, "optsZh": {"A": "它概述了這部小說的出版歷史。", "B": "它引入了一個不相關的主題。", "C": "它提供了關於這位小說家的生平資料。", "D": "它提出了一個常見詮釋所面臨的難題。"}, "answer": "D", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Cross-Text Connections: evaluate a characterization of a scientific discovery.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.<br><br>Based on the texts, which choice best describes how the second text would respond to the first?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nBased on the texts, which choice best describes how the second text would respond to the first?", "stem": "", "stemZh": "", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n一篇科技文章首先說明，自主水下載具能夠繪製海底地圖。下一句說明，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，而且水流難以預測。最後一句描述工程師們正針對這些狀況測試一套新的導航系統。\n根據這兩篇文本，哪一個選項最能描述第二篇文本會如何回應第一篇？", "opts": {"A": "It gives a personal anecdote about engineers.", "B": "It explains the limitation that the new system is meant to address.", "C": "It announces that the technology is already flawless.", "D": "It compares underwater vehicles with aircraft."}, "optsZh": {"A": "它提供了一則關於工程師的個人軼事。", "B": "它說明了新系統所要解決的限制。", "C": "它宣稱這項技術已經完美無缺。", "D": "它將水下載具與飛機加以比較。"}, "answer": "B", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Poetry main idea: identify a speaker's thoughts before sleep.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from William Shakespeare&#x27;s 1609 poem &#x27;Sonnet 27.&#x27; The poem is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=address\" target=\"_blank\" rel=\"noopener\" data-w=\"address\" data-pos=\"v./n.\" data-en=\"to deal with a problem; a formal speech\" data-zh=\"處理；演說\">addressed<\/a> to a close friend as if he were physically present.<br><br>Weary with toil, I [hurry] to my bed,<br>The dear repose for limbs with travel tired;<br>But then begins a journey in my head<br>To work my mind, when body&#x27;s work&#x27;s expired:<br>For then my thoughts-from far where I abide-<br>[Begin] a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=zealous\" target=\"_blank\" rel=\"noopener\" data-w=\"zealous\" data-pos=\"adj.\" data-en=\"full of strong enthusiasm\" data-zh=\"熱切的；熱情的\">zealous<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pilgrimage\" target=\"_blank\" rel=\"noopener\" data-w=\"pilgrimage\" data-pos=\"n.\" data-en=\"a long journey to a special or holy place\" data-zh=\"朝聖之旅\">pilgrimage<\/a> to thee,<br>And keep my drooping eyelids open wide,<br><br>What is the main idea of the text?", "bodyPlain": "The following text is adapted from William Shakespeare's 1609 poem 'Sonnet 27.' The poem is addressed to a close friend as if he were physically present.\n\nWeary with toil, I [hurry] to my bed,\nThe dear repose for limbs with travel tired;\nBut then begins a journey in my head\nTo work my mind, when body's work's expired:\nFor then my thoughts-from far where I abide-\n[Begin] a zealous pilgrimage to thee,\nAnd keep my drooping eyelids open wide,\n\nWhat is the main idea of the text?", "stem": "", "stemZh": "", "bodyZh": "以下文字改編自 William Shakespeare 1609 年的詩〈Sonnet 27〉。這首詩是寫給一位親密好友的，彷彿他就在眼前。\n因勞累而疲倦，我［趕忙］上床，\n那是旅途勞頓的四肢所珍視的安歇；\n但隨即在我腦中展開一段旅程，\n讓我的心思勞動，在身體的工作結束之時：\n因為那時我的思緒——從我遙遠的居處——\n［開始］一趟奔向你的熱切朝聖，\n並讓我低垂的眼皮睜得大大的，\n這篇文字的主旨是什麼？", "opts": {"A": "The speaker is asleep and dreaming about traveling to see the friend.", "B": "The speaker is planning an upcoming trip to the friend's house.", "C": "The speaker is too fatigued to continue a discussion with the friend.", "D": "The speaker is thinking about the friend instead of immediately falling asleep."}, "optsZh": {"A": "說話者睡著了，夢見自己去探望朋友。", "B": "說話者正在計畫一趟即將前往朋友家的旅程。", "C": "說話者太過疲倦，無法繼續和朋友討論。", "D": "說話者沒有立刻入睡，而是在想著這位朋友。"}, "answer": "D", "expl": "The speaker goes to bed tired, but his thoughts travel to the friend and keep his eyes open, so he thinks of the friend instead of sleeping.", "explZh": "說話者疲倦上床，但思緒飛向朋友，使他睜著眼睛無法入睡，所以他在想念朋友而非立刻入睡。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Poetry main idea: identify a speaker's thoughts before sleep.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n在一段短篇小說節選中，一位年邁的音樂家在敞開的窗邊等待，而一位較年輕的親戚正從花園帶著花回來。敘事細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To argue that the characters should leave the house", "B": "To explain why music has lost its importance", "C": "To summarize a conflict between two relatives", "D": "To portray a setting and mood as characters prepare for an arrival"}, "optsZh": {"A": "主張這些角色應該離開這棟房子", "B": "解釋為什麼音樂已失去其重要性", "C": "概述兩位親戚之間的衝突", "D": "在角色們為某人的到來做準備時，描繪場景與氣氛"}, "answer": "D", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Poetry main idea: identify a speaker's thoughts before sleep.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n一首詩描寫說話者站在港口邊緣，看著船隻在黎明時分啟航。這首詩並未敘述一段已完成的旅程，而是強調霧氣、移動，以及說話者意識到旅人們正駛入未知卻充滿希望的境況。", "opts": {"A": "To compare several forms of transportation", "B": "To criticize sailors for taking unnecessary risks", "C": "To present an atmosphere of departure and possibility", "D": "To list the technical features of a harbor"}, "optsZh": {"A": "比較幾種不同的交通方式", "B": "批評水手們冒不必要的風險", "C": "呈現一種啟程與充滿可能性的氛圍", "D": "列出一座港口的技術特點"}, "answer": "C", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Poetry main idea: identify a speaker's thoughts before sleep.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n一段小說節選呈現節慶大餐前擁擠的廚房。敘述者注意到擦得發亮的碗、精心排放的椅子，以及每當屋外傳來腳步聲時家人們停頓下來的樣子——他們在等待一位多年未曾來訪的客人。", "opts": {"A": "To depict preparations that reveal anticipation within a family", "B": "To describe a completed celebration from beginning to end", "C": "To explain why the family dislikes visitors", "D": "To contrast rural and urban customs"}, "optsZh": {"A": "描繪顯露出一家人期待之情的準備工作", "B": "從頭到尾描述一場已經結束的慶祝活動", "C": "解釋為什麼這家人不喜歡訪客", "D": "對比鄉村與都市的風俗"}, "answer": "A", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Poetry main idea: identify a speaker's thoughts before sleep.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一段回憶錄的文字描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集。這段文字尚未呈現課程本身；相反地，它強調的是課程開始前的那些安靜儀式。", "opts": {"A": "To evaluate the quality of a school's curriculum", "B": "To recount a student's entire academic career", "C": "To describe the moments before a significant daily activity begins", "D": "To argue that early classes should be canceled"}, "optsZh": {"A": "評估一所學校課程的品質", "B": "敘述一名學生完整的求學經歷", "C": "描述一項重要的日常活動開始前的時刻", "D": "主張應該取消早上的課程"}, "answer": "C", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Poetry main idea: identify a speaker's thoughts before sleep.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這篇文章的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n一段文學作品呈現雨後的花園：濕漉漉的小徑、明亮的葉子，以及一張擺在樹下的長椅。一個角色手拿著一封信在那裡停下腳步，而這段描寫讓場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To establish a reflective mood before a character acts", "C": "To compare two different seasons", "D": "To reveal the full contents of a letter"}, "optsZh": {"A": "提供照顧花園的指示", "B": "在角色採取行動之前營造一種沉思的氛圍", "C": "比較兩個不同的季節", "D": "揭露一封信的完整內容"}, "answer": "B", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Literary detail: recognize contradiction between a character's claim and evidence.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Lewis Carroll&#x27;s 1889 satirical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novel\" target=\"_blank\" rel=\"noopener\" data-w=\"novel\" data-pos=\"adj.\" data-en=\"new and original; not seen before\" data-zh=\"新穎的；新奇的\">novel<\/a> Sylvie and Bruno. A crowd has gathered outside a room belonging to the Warden, an official who reports to the Lord Chancellor.<br><br>One man, who was more excited than the rest, flung his hat high into the air, and shouted (as well as I could make out) &#x27;Who roar for the Sub-Warden?&#x27; Everybody roared, but whether it was for the Sub-Warden, or not, did not clearly appear: some were shouting &#x27;Bread!&#x27; and some &#x27;Taxes!&#x27;, but no one seemed to know what it was they really wanted.<br><br>All this I saw from the open window of the Warden&#x27;s breakfast-saloon, looking across the shoulder of the Lord Chancellor.<br><br>&#x27;What can it all mean?&#x27; he kept repeating to himself. &#x27;I never heard such shouting before-and at this time of the morning, too! And with such unanimity!&#x27;<br><br>Based on the text, how does the Lord Chancellor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">respond<\/a> to the crowd?", "bodyPlain": "The following text is adapted from Lewis Carroll's 1889 satirical novel Sylvie and Bruno. A crowd has gathered outside a room belonging to the Warden, an official who reports to the Lord Chancellor.\n\nOne man, who was more excited than the rest, flung his hat high into the air, and shouted (as well as I could make out) 'Who roar for the Sub-Warden?' Everybody roared, but whether it was for the Sub-Warden, or not, did not clearly appear: some were shouting 'Bread!' and some 'Taxes!', but no one seemed to know what it was they really wanted.\n\nAll this I saw from the open window of the Warden's breakfast-saloon, looking across the shoulder of the Lord Chancellor.\n\n'What can it all mean?' he kept repeating to himself. 'I never heard such shouting before-and at this time of the morning, too! And with such unanimity!'\n\nBased on the text, how does the Lord Chancellor respond to the crowd?", "stem": "", "stemZh": "", "bodyZh": "以下文字改編自 Lewis Carroll 1889 年的諷刺小說《Sylvie and Bruno》。一群人聚集在典獄長（Warden）的房間外；典獄長是一位向大法官（Lord Chancellor）負責的官員。\n有一個人比其他人更激動，他把帽子高高拋向空中，並喊道（就我所能聽清楚的）：「誰為副典獄長歡呼？」每個人都歡呼起來，但他們究竟是不是為副典獄長歡呼，並不清楚：有些人喊著「麵包！」，有些人喊著「稅！」，但似乎沒有人知道自己真正想要的是什麼。\n這一切我都是從典獄長早餐廳敞開的窗戶看到的，視線越過大法官的肩膀望出去。\n「這一切到底是什麼意思？」他不停地喃喃自語。「我從來沒聽過這樣的叫喊——而且還是在一大清早！而且還如此齊心一致！」\n根據本文，大法官對群眾的反應如何？", "opts": {"A": "He asks about the meaning of the crowd's shouting, even though he claims to know what the crowd wants.", "B": "He indicates a desire to speak to the crowd, even though the crowd has asked to speak to the Sub-Warden.", "C": "He expresses sympathy for the crowd's demands, even though the crowd's shouting annoys him.", "D": "He describes the crowd as being united, even though the crowd clearly appears otherwise."}, "optsZh": {"A": "他詢問群眾呼喊的意思，即使他聲稱自己知道群眾想要什麼。", "B": "他表示想要對群眾講話，即使群眾要求的是和 Sub-Warden 說話。", "C": "他對群眾的訴求表示同情，即使群眾的呼喊讓他感到厭煩。", "D": "他把群眾描述為團結一致，即使群眾顯然並非如此。"}, "answer": "D", "expl": "The crowd shouts different things and no one knows what they want, yet the Chancellor praises their 'unanimity,' calling them united.", "explZh": "群眾喊著不同的口號，沒人知道他們要什麼，大法官卻說他們「意見一致」，與事實相反。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Literary detail: recognize contradiction between a character's claim and evidence.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常給年長的親戚建議，因為在別人衝動行事時，她總能保持冷靜。敘述者強調她的關愛是真誠的，但在需要判斷時，她能夠克制自己的情緒。", "opts": {"A": "She refuses to give advice to others.", "B": "She is admired mainly for her wealth.", "C": "She shows unusual maturity and self-command.", "D": "She lacks affection for her family."}, "optsZh": {"A": "她拒絕給別人建議。", "B": "她主要因財富而受人景仰。", "C": "她展現出不尋常的成熟與自制。", "D": "她對家人缺乏感情。"}, "answer": "C", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Literary detail: recognize contradiction between a character's claim and evidence.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當祖母終於提出建議時，屋裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強勢。", "opts": {"A": "The family ignores the grandmother's opinions.", "B": "The grandmother avoids family matters entirely.", "C": "The narrator thinks patience is useless.", "D": "The grandmother's influence is quiet but substantial."}, "optsZh": {"A": "家人忽視祖母的意見。", "B": "祖母完全避開家務事。", "C": "敘述者認為耐心毫無用處。", "D": "祖母的影響力低調卻深遠。"}, "answer": "D", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Literary detail: recognize contradiction between a character's claim and evidence.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "在一處社區藝術中心，一位策展人籌備了一場展覽，介紹那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾以及機構環境如何隨著時間形塑每件作品的意義，而不是把完成的作品視為孤立的成就。\n一個故事描述一位職員，他會注意到帳簿中其他人已經核准過的細小錯誤。雖然同事們有時覺得他的謹慎令人厭煩，但敘述者說，這家公司之所以能夠生存，正是因為他的嚴謹。", "opts": {"A": "The clerk's carefulness is valuable despite being inconvenient.", "B": "The business fails because of excessive caution.", "C": "The clerk intentionally creates errors.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這位職員的細心雖然帶來不便，卻很有價值。", "B": "這家店因過度謹慎而倒閉。", "C": "這位職員故意製造錯誤。", "D": "同事們比這位職員更精確。"}, "answer": "A", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Literary detail: recognize contradiction between a character's claim and evidence.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=obvious\" target=\"_blank\" rel=\"noopener\" data-w=\"obvious\" data-pos=\"adj.\" data-en=\"easy to see or understand\" data-zh=\"明顯的\">obvious<\/a>. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "一份都市計畫報告比較了幾種改善交通、公共衛生以及公共空間可及性的方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的效果，尤其是當不同社區以不同方式經歷同一項政策時。\n一段文章指出，一位村莊領袖在做決定前會聆聽每一位發言者的意見，即使答案看似顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader dislikes public meetings.", "B": "The leader is unable to reach conclusions.", "C": "The leader makes decisions without hearing others.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人不喜歡公開會議。", "B": "這位領導人無法做出結論。", "C": "這位領導人不聽取他人意見就做決定。", "D": "這位領導人重視包容各方的審議。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Literary detail: recognize contradiction between a character's claim and evidence.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most logically follows from the text?", "stemZh": "根據這篇文章，哪個選項是最合乎邏輯的推論？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個歷經多個階段的過程，發現結果取決於時機、環境以及數個變因之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所能支持的更廣泛。\n在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在初期討論中鼓勵大膽推測，但在每一項測量數據都經過檢查之前，她不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She combines intellectual openness with rigorous standards.", "C": "She avoids working with students.", "D": "She publishes claims before testing them."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她兼具開放的求知態度與嚴格的標準。", "C": "她避免與學生共事。", "D": "她在驗證主張之前就將其發表。"}, "answer": "B", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence: choose a quotation that illustrates a claim.", "vocab": false, "body": "O Pioneers! is a 1913 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novel\" target=\"_blank\" rel=\"noopener\" data-w=\"novel\" data-pos=\"adj.\" data-en=\"new and original; not seen before\" data-zh=\"新穎的；新奇的\">novel<\/a> by Willa Cather. In the novel, Cather <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portray\" target=\"_blank\" rel=\"noopener\" data-w=\"portray\" data-pos=\"v.\" data-en=\"to represent or describe someone or something in a particular way\" data-zh=\"描繪；呈現\">portrays<\/a> Alexandra Bergson as having a deep emotional connection to her natural surroundings: _______<br><br>Which quotation from O Pioneers! most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrates<\/a> the claim?", "bodyPlain": "O Pioneers! is a 1913 novel by Willa Cather. In the novel, Cather portrays Alexandra Bergson as having a deep emotional connection to her natural surroundings: _______\n\nWhich quotation from O Pioneers! most effectively illustrates the claim?", "stem": "", "stemZh": "", "bodyZh": "《O Pioneers!》是 Willa Cather 於 1913 年出版的小說。在這部小說中，Cather 將 Alexandra Bergson 描繪成與周遭大自然有著深厚情感連結的人：_______\n《O Pioneers!》中的哪一段引文最能有效說明這個主張？", "opts": {"A": "'She had never known before how much the country meant to her. The chirping of the insects down in the long grass had been like the sweetest music. She had felt as if her heart were hiding down there, somewhere, with the quail and the plover and all the little wild things that crooned or buzzed in the sun. Under the long shaggy ridges, she felt the future stirring.'", "B": "'Alexandra talked to the men about their crops and to the women about their poultry. She spent a whole day with one young farmer who had been away at school, and who was experimenting with a new kind of clover hay. She learned a great deal.'", "C": "'Alexandra drove off alone. The rattle of her wagon was lost in the howling of the wind, but her lantern, held firmly between her feet, made a moving point of light along the highway, going deeper and deeper into the dark country.'", "D": "'It was Alexandra who read the papers and followed the markets, and who learned by the mistakes of their neighbors. It was Alexandra who could always tell about what it had cost to fatten each steer, and who could guess the weight of a hog before it went on the scales closer than John Bergson [her father] himself.'"}, "optsZh": {"A": "「她從來不知道這片土地對她而言有多重要。長草叢中昆蟲的鳴叫聲，猶如最甜美的音樂。她覺得自己的心彷彿就藏在那裡的某處，與鵪鶉、鴴鳥，以及所有在陽光下低吟或嗡鳴的小生物在一起。在那綿長而蓬亂的山脊下，她感覺到未來正在萌動。」", "B": "「Alexandra 和男人們談論他們的作物，和女人們談論她們的家禽。她花了一整天和一位曾離鄉求學、正在試種一種新苜蓿乾草的年輕農夫在一起。她學到了很多。」", "C": "「Alexandra 獨自駕車離去。她馬車的嘎嘎聲淹沒在呼嘯的風聲中，但她穩穩夾在雙腳之間的提燈，在公路上形成一個移動的光點，越來越深入那片黑暗的鄉野。」", "D": "「是 Alexandra 閱讀報紙、關注市場行情，並從鄰居的錯誤中學習。是 Alexandra 總是能說出養肥每頭閹牛大約花了多少錢，而且在豬上秤之前，她估計的重量比 John Bergson［她的父親］本人還要準確。」"}, "answer": "A", "expl": "Choice A describes the insects' chirping as 'the sweetest music' and her heart hiding in the grass, showing a deep emotional bond with nature.", "explZh": "A 選項把蟲鳴形容為「最甜美的音樂」，並說她的心彷彿藏在草叢中，顯示她與自然深厚的情感連結。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence: choose a quotation that illustrates a claim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "數年來的實地觀察使先前對某個自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於跨越不同季節與地點所蒐集到、雖不完整卻具啟發性的證據。\n一名學生主張，一位歷史學家把一位革命領袖更多地當作國家象徵，而非務實的政策制定者來看待。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在上任的第一個月簽署了數項法令。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且參差不齊的施政紀錄更為重要。」", "C": "「這個政府從一開始就面臨經濟上的挑戰。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Command of Evidence: choose a quotation that illustrates a claim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence to support, illustrate, or weaken the claim?", "stemZh": "哪個選項最能有效運用證據來支持、說明或削弱這項主張？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對某項公共工程的理解。由於這些紀錄殘缺不全，學者們必須在多個資料來源之間串連零碎的證據，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直遭到忽視。\n一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於各地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "The graph contains information about three regions.", "C": "The southern region was included in the survey.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "這張圖表包含了三個地區的資訊。", "C": "南部地區也被納入調查之中。", "D": "有些農民種植蔬菜，而另一些則種植穀物。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Command of Evidence: choose a quotation that illustrates a claim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly
