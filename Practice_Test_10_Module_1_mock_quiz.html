tings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。一則故事描寫一位職員，他能發現其他人已經核准的帳冊中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The coworkers are more accurate than the clerk.", "B": "The clerk's carefulness is valuable despite being inconvenient.", "C": "The clerk intentionally creates errors.", "D": "The business fails because of excessive caution."}, "optsZh": {"A": "同事們比這位職員更精確。", "B": "這位職員的細心雖然造成不便，卻很有價值。", "C": "這位職員故意製造錯誤。", "D": "這家公司因為過度謹慎而倒閉。"}, "answer": "B", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Reading Detail: camp narrator mixed emotions", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一段文字指出，一位村長在做決定之前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader is unable to reach conclusions.", "B": "The leader makes decisions without hearing others.", "C": "The leader dislikes public meetings.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人無法做出結論。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人不喜歡公開會議。", "D": "這位領導人重視包容各方意見的審議。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Reading Detail: camp narrator mixed emotions", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。在一段節選中，一位科學家被描寫為對學生慷慨，但對證據毫不妥協。她在初期的討論中鼓勵大膽推測，但在每一項測量都經過核對之前，她絕不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She combines intellectual openness with rigorous standards.", "C": "She avoids working with students.", "D": "She publishes claims before testing them."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她兼具思想上的開放與嚴謹的標準。", "C": "她避免和學生一起工作。", "D": "她在檢驗主張之前就把它們發表。"}, "answer": "B", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Reading Detail: Dorian delighted by portrait", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Oscar Wilde’s 1891 novel The Picture of Dorian Gray. Dorian Gray is taking his first look at a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portrait\" target=\"_blank\" rel=\"noopener\" data-w=\"portrait\" data-pos=\"n.\" data-en=\"a painting, drawing, or photograph of a person\" data-zh=\"肖像；畫像\">portrait<\/a> that Hallward has painted of him.<br><br>Dorian passed listlessly in front of his picture and turned towards it. When he saw it he drew back, and his cheeks flushed for a moment with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pleasure\" target=\"_blank\" rel=\"noopener\" data-w=\"pleasure\" data-pos=\"n.\" data-en=\"a feeling of happiness or enjoyment\" data-zh=\"快樂\">pleasure<\/a>. A look of joy came into his eyes, as if he had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognized<\/a> himself for the first time. He stood there motionless and in wonder, dimly conscious that Hallward was speaking to him, but not catching the meaning of his words. The sense of his own beauty came on him like a revelation. He had never felt it before.", "bodyPlain": "The following text is adapted from Oscar Wilde’s 1891 novel The Picture of Dorian Gray. Dorian Gray is taking his first look at a portrait that Hallward has painted of him.\n\nDorian passed listlessly in front of his picture and turned towards it. When he saw it he drew back, and his cheeks flushed for a moment with pleasure. A look of joy came into his eyes, as if he had recognized himself for the first time. He stood there motionless and in wonder, dimly conscious that Hallward was speaking to him, but not catching the meaning of his words. The sense of his own beauty came on him like a revelation. He had never felt it before.", "stem": "According to the text, what is true about Dorian?", "stemZh": "根據本文，關於 Dorian 何者正確？", "bodyZh": "以下文字改編自 Oscar Wilde 1891 年的小說《The Picture of Dorian Gray》（格雷的畫像）。Dorian Gray 正第一次觀看 Hallward 為他畫的肖像。\nDorian 無精打采地走過自己的畫像前，然後轉身面向它。當他看到畫像時，他往後一退，臉頰因喜悅而泛紅了片刻。他的眼中流露出喜悅的神情，彷彿他第一次認出了自己。他站在那裡一動也不動，滿心驚奇，隱約意識到 Hallward 正在對他說話，卻沒有聽懂他話中的意思。對自身美貌的感受如同天啟般降臨在他身上。他以前從未有過這種感覺。", "opts": {"A": "He wants to know Hallward’s opinion of the portrait.", "B": "He is delighted by what he sees in the portrait.", "C": "He prefers portraits to other types of paintings.", "D": "He is uncertain of Hallward’s talent as an artist."}, "optsZh": {"A": "他想知道 Hallward 對這幅肖像的看法。", "B": "他對自己在肖像中看到的樣子感到欣喜。", "C": "他比較喜歡肖像畫，勝過其他類型的畫作。", "D": "他不確定 Hallward 身為藝術家的才華。"}, "answer": "B", "expl": "Dorian's cheeks flush 'with pleasure' and 'a look of joy' comes into his eyes, so he is delighted by the portrait.", "explZh": "Dorian 的臉頰因「喜悅」而泛紅，眼中流露「喜悅的神情」，所以他對肖像感到欣喜。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Reading Detail: Dorian delighted by portrait", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常為年長的親戚出主意，因為在別人衝動行事時，她依然保持冷靜。敘述者強調她的感情是真誠的，但在需要判斷時她能克制自己的情緒。", "opts": {"A": "She shows unusual maturity and self-command.", "B": "She refuses to give advice to others.", "C": "She is admired mainly for her wealth.", "D": "She lacks affection for her family."}, "optsZh": {"A": "她展現出不尋常的成熟與自制。", "B": "她拒絕給別人建議。", "C": "她主要因為財富而受人欽佩。", "D": "她對家人缺乏感情。"}, "answer": "A", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Reading Detail: Dorian delighted by portrait", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋說，祖母的威信來自耐心，而非強勢。", "opts": {"A": "The narrator thinks patience is useless.", "B": "The family ignores the grandmother's opinions.", "C": "The grandmother avoids family matters entirely.", "D": "The grandmother's influence is quiet but substantial."}, "optsZh": {"A": "敘述者認為耐心毫無用處。", "B": "家人忽視祖母的意見。", "C": "祖母完全避開家庭事務。", "D": "祖母的影響力低調卻相當可觀。"}, "answer": "D", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Reading Detail: Dorian delighted by portrait", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。一則故事描寫一位職員，他能發現其他人已經核准的帳冊中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk's carefulness is valuable despite being inconvenient.", "C": "The clerk intentionally creates errors.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這家公司因為過度謹慎而倒閉。", "B": "這位職員的細心雖然造成不便，卻很有價值。", "C": "這位職員故意製造錯誤。", "D": "同事們比這位職員更精確。"}, "answer": "B", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Reading Detail: Dorian delighted by portrait", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一段文字指出，一位村長在做決定之前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader is unable to reach conclusions.", "B": "The leader makes decisions without hearing others.", "C": "The leader values inclusive deliberation.", "D": "The leader dislikes public meetings."}, "optsZh": {"A": "這位領導人無法做出結論。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人重視包容各方意見的審議。", "D": "這位領導人不喜歡公開會議。"}, "answer": "C", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Reading Detail: Dorian delighted by portrait", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice is best supported by the text or table?", "stemZh": "哪一個選項最能得到本文或表格的支持？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。在一段節選中，一位科學家被描寫為對學生慷慨，但對證據毫不妥協。她在初期的討論中鼓勵大膽推測，但在每一項測量都經過核對之前，她絕不會發表任何主張。", "opts": {"A": "She publishes claims before testing them.", "B": "She rejects all imaginative thinking.", "C": "She combines intellectual openness with rigorous standards.", "D": "She avoids working with students."}, "optsZh": {"A": "她在檢驗主張之前就把它們發表。", "B": "她排斥一切富有想像力的思考。", "C": "她兼具思想上的開放與嚴謹的標準。", "D": "她避免和學生一起工作。"}, "answer": "C", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Main Idea: Jeffrey Gibson combines gendered art forms", "vocab": false, "body": "Choctaw/Cherokee artist Jeffrey Gibson turns punching bags used by boxers into art by decorating them with beadwork and elements of Native dressmaking. These elements include leather fringe and jingles, the metal cones that cover the dresses worn in the jingle dance, a women’s dance of the Ojibwe people. Thus, Gibson combines an object commonly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with masculinity (a punching bag) with art forms <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> practiced by women in most Native communities (beadwork and dressmaking). In this way, he rejects the division of male and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> gender roles.", "bodyPlain": "Choctaw/Cherokee artist Jeffrey Gibson turns punching bags used by boxers into art by decorating them with beadwork and elements of Native dressmaking. These elements include leather fringe and jingles, the metal cones that cover the dresses worn in the jingle dance, a women’s dance of the Ojibwe people. Thus, Gibson combines an object commonly associated with masculinity (a punching bag) with art forms traditionally practiced by women in most Native communities (beadwork and dressmaking). In this way, he rejects the division of male and female gender roles.", "stem": "Which choice best describes Gibson’s approach to art, as presented in the text?", "stemZh": "根據本文所述，哪一個選項最能描述 Gibson 的藝術創作方式？", "bodyZh": "Choctaw／Cherokee 族藝術家 Jeffrey Gibson 用串珠工藝和原住民服裝製作的元素裝飾拳擊手用的沙包，把它們變成藝術品。這些元素包括皮革流蘇和鈴片——鈴片是覆蓋在鈴鐺舞（Ojibwe 族的一種女性舞蹈）舞衣上的金屬圓錐。因此，Gibson 把一個通常與男子氣概相關的物品（沙包），與大多數原住民社群中傳統上由女性從事的藝術形式（串珠工藝和製衣）結合在一起。藉由這種方式，他拒絕了男女性別角色的劃分。", "opts": {"A": "He draws from traditional Native art forms to create his original works.", "B": "He has been influenced by Native and non-Native artists equally.", "C": "He finds inspiration from boxing in designing the dresses he makes.", "D": "He rejects expectations about color and pattern when incorporating beadwork."}, "optsZh": {"A": "他取材自傳統的原住民藝術形式來創作原創作品。", "B": "他同樣受到原住民和非原住民藝術家的影響。", "C": "他從拳擊中獲得靈感來設計他製作的舞衣。", "D": "他在運用串珠工藝時，拒絕了對顏色和圖案的既定期待。"}, "answer": "A", "expl": "Gibson decorates punching bags with beadwork and elements of Native dressmaking, so he draws on traditional Native art forms to make original works.", "explZh": "Gibson 用串珠工藝和原住民服裝製作元素裝飾沙包，所以他是取材自傳統原住民藝術形式來創作原創作品。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Main Idea: Jeffrey Gibson combines gendered art forms", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常為年長的親戚出主意，因為在別人衝動行事時，她依然保持冷靜。敘述者強調她的感情是真誠的，但在需要判斷時她能克制自己的情緒。", "opts": {"A": "She lacks affection for her family.", "B": "She refuses to give advice to others.", "C": "She shows unusual maturity and self-command.", "D": "She is admired mainly for her wealth."}, "optsZh": {"A": "她對家人缺乏感情。", "B": "她拒絕給別人建議。", "C": "她展現出不尋常的成熟與自制。", "D": "她主要因為財富而受人欽佩。"}, "answer": "C", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Main Idea: Jeffrey Gibson combines gendered art forms", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋說，祖母的威信來自耐心，而非強勢。", "opts": {"A": "The grandmother's influence is quiet but substantial.", "B": "The grandmother avoids family matters entirely.", "C": "The family ignores the grandmother's opinions.", "D": "The narrator thinks patience is useless."}, "optsZh": {"A": "祖母的影響力低調卻相當可觀。", "B": "祖母完全避開家庭事務。", "C": "家人忽視祖母的意見。", "D": "敘述者認為耐心毫無用處。"}, "answer": "A", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Main Idea: Jeffrey Gibson combines gendered art forms", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。一則故事描寫一位職員，他能發現其他人已經核准的帳冊中的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The coworkers are more accurate than the clerk.", "B": "The clerk's carefulness is valuable despite being inconvenient.", "C": "The clerk intentionally creates errors.", "D": "The business fails because of excessive caution."}, "optsZh": {"A": "同事們比這位職員更精確。", "B": "這位職員的細心雖然造成不便，卻很有價值。", "C": "這位職員故意製造錯誤。", "D": "這家公司因為過度謹慎而倒閉。"}, "answer": "B", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Main Idea: Jeffrey Gibson combines gendered art forms", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一段文字指出，一位村長在做決定之前會聆聽每一位發言者的意見，即使答案看起來顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader is unable to reach conclusions.", "B": "The leader makes decisions without hearing others.", "C": "The leader dislikes public meetings.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人無法做出結論。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人不喜歡公開會議。", "D": "這位領導人重視包容各方意見的審議。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Main Idea: Jeffrey Gibson combines gendered art forms", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。在一段節選中，一位科學家被描寫為對學生慷慨，但對證據毫不妥協。她在初期的討論中鼓勵大膽推測，但在每一項測量都經過核對之前，她絕不會發表任何主張。", "opts": {"A": "She combines intellectual openness with rigorous standards.", "B": "She avoids working with students.", "C": "She publishes claims before testing them.", "D": "She rejects all imaginative thinking."}, "optsZh": {"A": "她兼具思想上的開放與嚴謹的標準。", "B": "她避免和學生一起工作。", "C": "她在檢驗主張之前就把它們發表。", "D": "她排斥一切富有想像力的思考。"}, "answer": "A", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Command of Evidence: Alexandra connected to nature", "vocab": false, "body": "O Pioneers! is a 1913 novel by Willa Cather. In the novel, Cather <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portray\" target=\"_blank\" rel=\"noopener\" data-w=\"portray\" data-pos=\"v.\" data-en=\"to represent or describe someone or something in a particular way\" data-zh=\"描繪；呈現\">portrays<\/a> Alexandra Bergson as having a deep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emotional\" target=\"_blank\" rel=\"noopener\" data-w=\"emotional\" data-pos=\"adj.\" data-en=\"relating to feelings\" data-zh=\"情感的；情緒的\">emotional<\/a> connection to her natural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surroundings\" target=\"_blank\" rel=\"noopener\" data-w=\"surroundings\" data-pos=\"n.\" data-en=\"the place and conditions around a person\" data-zh=\"周遭環境\">surroundings<\/a>: _______", "bodyPlain": "O Pioneers! is a 1913 novel by Willa Cather. In the novel, Cather portrays Alexandra Bergson as having a deep emotional connection to her natural surroundings: _______", "stem": "Which quotation from O Pioneers! most effectively illustrates the claim?", "stemZh": "哪一句出自《O Pioneers!》的引文最能有效說明這個主張？", "bodyZh": "《O Pioneers!》（啊，拓荒者！）是 Willa Cather 1913 年的小說。在這部小說中，Cather 把 Alexandra Bergson 描寫成與她周遭的大自然有深厚的情感連結：_______", "opts": {"A": "“She had never known before how much the country meant to her. The chirping of the insects down in the long grass had been like the sweetest music. She had felt as if her heart were hiding down there, somewhere, with the quail and the plover and all the little wild things that crooned or buzzed in the sun. Under the long shaggy ridges, she felt the future stirring.”", "B": "“Alexandra talked to the men about their crops and to the women about their poultry. She spent a whole day with one young farmer who had been away at school, and who was experimenting with a new kind of clover hay. She learned a great deal.”", "C": "“Alexandra drove off alone. The rattle of her wagon was lost in the howling of the wind, but her lantern, held firmly between her feet, made a moving point of light along the highway, going deeper and deeper into the dark country.”", "D": "“It was Alexandra who read the papers and followed the markets, and who learned by the mistakes of their neighbors. It was Alexandra who could always tell about what it had cost to fatten each steer, and who could guess the weight of a hog before it went on the scales closer than John Bergson [her father] himself.”"}, "optsZh": {"A": "「她以前從不知道這片土地對她有多重要。長草中昆蟲的鳴叫聲宛如最甜美的音樂。她覺得彷彿自己的心就藏在那下面的某處，與鵪鶉、鴴鳥，以及所有在陽光下低吟或嗡嗡作響的小小野生動物在一起。在那綿長而蓬亂的山脊下，她感覺到未來正在萌動。」", "B": "「Alexandra 和男人們談他們的作物，和女人們談她們的家禽。她花了一整天和一位曾離鄉求學、正在試種一種新苜蓿乾草的年輕農夫在一起。她學到了很多。」", "C": "「Alexandra 獨自駕車離去。她馬車的嘎嘎聲淹沒在呼嘯的風聲中，但她穩穩夾在雙腳之間的提燈，在公路上形成一個移動的光點，越來越深入黑暗的鄉間。」", "D": "「讀報紙、留意市場行情、從鄰居的錯誤中學習的都是 Alexandra。總是能說出養肥每頭閹牛大約花了多少錢、並且在豬上秤之前就能比 John Bergson〔她的父親〕本人更準確地猜出牠重量的，也是 Alexandra。」"}, "answer": "A", "expl": "Only choice A shows deep feeling for nature: the country 'meant' so much to her, insect sounds were 'the sweetest music,' and her heart seemed to hide among the wild things.", "explZh": "只有 A 表現出對大自然的深厚情感：這片土地對她意義重大，昆蟲的鳴叫是「最甜美的音樂」，她的心彷彿藏在野生動物之間。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Command of Evidence: Alexandra connected to nature", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一句引文最能說明這個主張？", "opts": {"A": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且起伏不定的執政紀錄更加重要。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這位領導人在上任的第一個月簽署了數項法令。」", "D": "「這個政府從一開始就面臨經濟上的挑戰。」"}, "answer": "A", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Command of Evidence: Alexandra connected to nature", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。一張圖表顯示，女性農民占南部地區蔬菜種植者的 64%，但在北部和中部地區的穀物種植者中占不到 35%。哪一個敘述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "有些農民種蔬菜，有些則種穀物。", "C": "女性在南部的蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不是。", "D": "南部地區被納入了調查。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Command of Evidence: Alexandra connected to nature", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "One rocky planet has a thin atmosphere.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究恆星所用的方法需要望遠鏡。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "研究發現有好幾顆岩質行星所含鐵的比例遠高於它們所環繞的恆星。", "D": "有些恆星含有氫和氦。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Command of Evidence: Alexandra connected to nature", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一位民俗學者主張，某項傳統是透過近代的文化交流發展而成，而不只是從遙遠的國家原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "Some songs use a meter also found in older European poetry.", "C": "The tradition is studied by scholars in several countries.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "許多表演者是從親戚那裡學會歌曲的。", "B": "有些歌曲使用的韻律在較古老的歐洲詩歌中也可見到。", "C": "好幾個國家的學者都在研究這項傳統。", "D": "有幾首民謠包含了地方歷史事件，以及在不同社群持續接觸之後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Command of Evidence: Alexandra connected to nature", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮中，人數一直維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The table includes more than one year.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這項計畫在一個社區中進行。", "B": "與沒有這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "這張表格包含不只一年的資料。", "D": "兩個城鎮都有一些志工。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Command of Evidence: Morrison strengthened Black author presence", "vocab": false, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novelist\" target=\"_blank\" rel=\"noopener\" data-w=\"novelist\" data-pos=\"n.\" data-en=\"a person who writes novels\" data-zh=\"小說家\">novelist<\/a> Toni Morrison was the first Black woman to work as an editor at the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publishing\" target=\"_blank\" rel=\"noopener\" data-w=\"publishing\" data-pos=\"n.\" data-en=\"the business of producing books and magazines\" data-zh=\"出版業\">publishing<\/a> company Random House, from 1967 to 1983. A scholar asserts that one of Morrison’s likely aims during her time as an editor was to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strengthen\" target=\"_blank\" rel=\"noopener\" data-w=\"strengthen\" data-pos=\"v.\" data-en=\"to make stronger\" data-zh=\"加強；鞏固\">strengthen<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=presence\" target=\"_blank\" rel=\"noopener\" data-w=\"presence\" data-pos=\"n.\" data-en=\"the fact of being present or represented\" data-zh=\"存在；出現\">presence<\/a> of Black writers on the list of Random House’s published authors.", "bodyPlain": "The novelist Toni Morrison was the first Black woman to work as an editor at the publishing company Random House, from 1967 to 1983. A scholar asserts that one of Morrison’s likely aims during her time as an editor was to strengthen the presence of Black writers on the list of Random House’s published authors.", "stem": "Which finding, if true, would most strongly support the scholar’s claim?", "stemZh": "如果屬實，哪一項發現最能支持這位學者的主張？", "bodyZh": "小說家 Toni Morrison 是第一位在出版公司 Random House 擔任編輯的黑人女性，任職期間為 1967 年到 1983 年。一位學者主張，Morrison 擔任編輯期間可能的目標之一，是加強黑人作家在 Random House 出版作者名單中的比重。", "opts": {"A": "The percentage of authors published by Random House who were Black rose in the early 1970s and stabilized throughout the decade.", "B": "Black authors who were interviewed in the 1980s and 1990s were highly likely to cite Toni Morrison’s novels as a principal influence on their work.", "C": "The novels written by Toni Morrison that were published after 1983 sold significantly more copies and received wider critical acclaim than the novels she wrote that were published before 1983.", "D": "Works that were edited by Toni Morrison during her time at Random House displayed stylistic characteristics that distinguished them from works that were not edited by Morrison."}, "optsZh": {"A": "Random House 所出版的作者中黑人所占的百分比在 1970 年代初期上升，並在整個十年間維持穩定。", "B": "在 1980 和 1990 年代接受訪問的黑人作家，極有可能把 Toni Morrison 的小說列為對自己作品的主要影響。", "C": "Toni Morrison 在 1983 年之後出版的小說，比她在 1983 年之前出版的小說賣出多得多的冊數，也獲得更廣泛的評論讚譽。", "D": "Toni Morrison 在 Random House 任職期間所編輯的作品，展現出有別於非由她編輯之作品的風格特徵。"}, "answer": "A", "expl": "A rise in the percentage of Black authors published by Random House during Morrison's time as editor (1967–1983) would support the claim that she aimed to strengthen their presence.", "explZh": "Morrison 擔任編輯期間（1967–1983），Random House 出版作者中黑人比例上升，可支持她有意加強黑人作家比重的說法。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Command of Evidence: Morrison strengthened Black author presence", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一句引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在上任的第一個月簽署了數項法令。」", "B": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且起伏不定的執政紀錄更加重要。」", "C": "「這個政府從一開始就面臨經濟上的挑戰。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Command of Evidence: Morrison strengthened Black author presence", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the schola
