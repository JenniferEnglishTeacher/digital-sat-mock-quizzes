ge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer achieved a striking _______ between percussion and projected images, timing each drumbeat to coincide with a shift in color on the screen.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The composer achieved a striking _______ between percussion and projected images, timing each drumbeat to coincide with a shift in color on the screen.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。這位作曲家在打擊樂與投影影像之間達成了驚人的 _______，讓每一聲鼓響都恰好配合螢幕上色彩的轉換。", "opts": {"A": "prediction", "B": "moderation", "C": "hibernation", "D": "synchronization"}, "optsZh": {"A": "prediction（預測）", "B": "moderation（節制、適度）", "C": "hibernation（冬眠）", "D": "synchronization（同步）"}, "answer": "D", "expl": "Synchronization means occurring at the same time.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "B": {"pos": "n.", "en": "the quality of avoiding extremes", "zh": "節制；適度", "word": "moderation"}, "C": {"pos": "n.", "en": "the state of an animal spending the winter in a deep sleep", "zh": "冬眠", "word": "hibernation"}, "D": {"pos": "n.", "en": "the act of making things happen at the same time", "zh": "同步；同時發生", "word": "synchronization"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: synchronization with host plant", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The study found remarkable _______ between the bees&#x27; foraging trips and the opening of nearby flowers, suggesting that the insects respond to plant cues.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The study found remarkable _______ between the bees' foraging trips and the opening of nearby flowers, suggesting that the insects respond to plant cues.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。研究發現蜜蜂的覓食行程與附近花朵的開放之間有顯著的 _______，顯示這些昆蟲會對植物的訊號做出反應。", "opts": {"A": "moderation", "B": "coordination", "C": "prediction", "D": "hibernation"}, "optsZh": {"A": "moderation（節制、適度）", "B": "coordination（協調、配合）", "C": "prediction（預測）", "D": "hibernation（冬眠）"}, "answer": "B", "expl": "Coordination means synchronization.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the quality of avoiding extremes", "zh": "節制；適度", "word": "moderation"}, "B": {"pos": "n.", "en": "the organization of different parts so they work together smoothly", "zh": "協調；配合", "word": "coordination"}, "C": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "D": {"pos": "n.", "en": "the state of an animal spending the winter in a deep sleep", "zh": "冬眠", "word": "hibernation"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: synchronization with host plant", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The dancers practiced until their movements and the recorded narration reached near-perfect _______ even during the performance&#x27;s fastest sections.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The dancers practiced until their movements and the recorded narration reached near-perfect _______ even during the performance's fastest sections.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。舞者們反覆練習，直到他們的動作與錄製的旁白達到近乎完美的 _______，即使在表演最快速的段落也是如此。", "opts": {"A": "moderation", "B": "hibernation", "C": "alignment", "D": "prediction"}, "optsZh": {"A": "moderation（節制、適度）", "B": "hibernation（冬眠）", "C": "alignment（一致；協調）", "D": "prediction（預測）"}, "answer": "C", "expl": "Alignment means synchronization.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the quality of avoiding extremes", "zh": "節制；適度", "word": "moderation"}, "B": {"pos": "n.", "en": "the state of an animal spending the winter in a deep sleep", "zh": "冬眠", "word": "hibernation"}, "C": {"pos": "n.", "en": "an arrangement in which things match up or agree", "zh": "一致；對齊；協調", "word": "alignment"}, "D": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: synchronization with host plant", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The engineers adjusted the clocks on the satellites to maintain _______ with receivers on Earth, since tiny timing errors could distort location data.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The engineers adjusted the clocks on the satellites to maintain _______ with receivers on Earth, since tiny timing errors could distort location data.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。工程師調整衛星上的時鐘，以維持與地球上接收器的 _______，因為微小的時間誤差就可能扭曲定位資料。", "opts": {"A": "prediction", "B": "moderation", "C": "hibernation", "D": "simultaneity"}, "optsZh": {"A": "prediction（預測）", "B": "moderation（節制、適度）", "C": "hibernation（冬眠）", "D": "simultaneity（同時發生）"}, "answer": "D", "expl": "Simultaneity means synchronization.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "B": {"pos": "n.", "en": "the quality of avoiding extremes", "zh": "節制；適度", "word": "moderation"}, "C": {"pos": "n.", "en": "the state of an animal spending the winter in a deep sleep", "zh": "冬眠", "word": "hibernation"}, "D": {"pos": "n.", "en": "the fact of happening at the same time", "zh": "同時發生；同時性", "word": "simultaneity"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: synchronization with host plant", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The plant&#x27;s release of pollen shows precise _______ with the arrival of its pollinating moth, increasing the chance of reproduction.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The plant's release of pollen shows precise _______ with the arrival of its pollinating moth, increasing the chance of reproduction.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這種植物釋放花粉的時間與其授粉蛾的到來呈現精確的 _______，提高了繁殖的機會。", "opts": {"A": "coordination", "B": "prediction", "C": "moderation", "D": "hibernation"}, "optsZh": {"A": "coordination（協調、配合）", "B": "prediction（預測）", "C": "moderation（節制、適度）", "D": "hibernation（冬眠）"}, "answer": "A", "expl": "Coordination means synchronization.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the organization of different parts so they work together smoothly", "zh": "協調；配合", "word": "coordination"}, "B": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "C": {"pos": "n.", "en": "the quality of avoiding extremes", "zh": "節制；適度", "word": "moderation"}, "D": {"pos": "n.", "en": "the state of an animal spending the winter in a deep sleep", "zh": "冬眠", "word": "hibernation"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: exhaustive account", "vocab": true, "body": "Barring major <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeological\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeological\" data-pos=\"adj.\" data-en=\"relating to the study of ancient remains\" data-zh=\"考古的\">archaeological<\/a> discoveries, we are unlikely to ever have _______ account of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Egypt under the female pharaoh Hatshepsut, as much of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of her reign was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> destroyed by her successors.", "bodyPlain": "Barring major archaeological discoveries, we are unlikely to ever have _______ account of ancient Egypt under the female pharaoh Hatshepsut, as much of the evidence of her reign was deliberately destroyed by her successors.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "除非有重大的考古發現，否則我們不太可能對女法老 Hatshepsut 統治下的古埃及有 _______ 記述，因為她統治時期的許多證據都被她的繼任者蓄意摧毀了。", "opts": {"A": "an imaginative", "B": "a superficial", "C": "an exhaustive", "D": "a questionable"}, "optsZh": {"A": "an imaginative（富有想像力的）", "B": "a superficial（膚淺的、表面的）", "C": "an exhaustive（詳盡無遺的）", "D": "a questionable（令人懷疑的）"}, "answer": "C", "expl": "Because much of the evidence of Hatshepsut's reign was destroyed, we are unlikely ever to have a complete, exhaustive account of it.", "explZh": "因為 Hatshepsut 統治時期的許多證據都已被摧毀，我們不太可能得到完整詳盡（exhaustive）的記述。", "defs": {"A": {"w": "imaginative", "pos": "adj.", "en": "showing creative, original ideas", "zh": "富有想像力的", "word": "imaginative"}, "B": {"w": "superficial", "pos": "adj.", "en": "concerned only with obvious or surface details; not deep", "zh": "膚淺的；表面的", "word": "superficial"}, "C": {"w": "exhaustive", "pos": "adj.", "en": "complete and including every detail", "zh": "詳盡無遺的；全面徹底的", "word": "exhaustive"}, "D": {"w": "questionable", "pos": "adj.", "en": "possibly not true or reliable; open to doubt", "zh": "令人懷疑的；有問題的", "word": "questionable"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: exhaustive account", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Because several archives from the kingdom were destroyed during later wars, historians doubt that they will ever produce an _______ account of its economic system.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Because several archives from the kingdom were destroyed during later wars, historians doubt that they will ever produce an _______ account of its economic system.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。由於該王國的數座檔案庫在後來的戰爭中被摧毀，歷史學家懷疑他們能否對其經濟制度提出 _______ 記述。", "opts": {"A": "imaginative", "B": "questionable", "C": "exhaustive", "D": "superficial"}, "optsZh": {"A": "imaginative（富有想像力的）", "B": "questionable（令人懷疑的）", "C": "exhaustive（詳盡無遺的）", "D": "superficial（膚淺的、表面的）"}, "answer": "C", "expl": "Exhaustive means complete and thorough.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "showing creative, original ideas", "zh": "富有想像力的", "word": "imaginative"}, "B": {"pos": "adj.", "en": "possibly not true or reliable; open to doubt", "zh": "令人懷疑的；有問題的", "word": "questionable"}, "C": {"pos": "adj.", "en": "complete and including every detail", "zh": "詳盡無遺的；全面徹底的", "word": "exhaustive"}, "D": {"pos": "adj.", "en": "concerned only with obvious or surface details; not deep", "zh": "膚淺的；表面的", "word": "superficial"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: exhaustive account", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The committee described the report as _______ because it considered not only test scores but also attendance, class size, teacher turnover, and family income.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The committee described the report as _______ because it considered not only test scores but also attendance, class size, teacher turnover, and family income.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。委員會形容這份報告很 _______，因為它不僅考量了考試成績，也考量了出席率、班級人數、教師流動率和家庭收入。", "opts": {"A": "superficial", "B": "questionable", "C": "comprehensive", "D": "imaginative"}, "optsZh": {"A": "superficial（膚淺的、表面的）", "B": "questionable（令人懷疑的）", "C": "comprehensive（全面的）", "D": "imaginative（富有想像力的）"}, "answer": "C", "expl": "Comprehensive means exhaustive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "concerned only with obvious or surface details; not deep", "zh": "膚淺的；表面的", "word": "superficial"}, "B": {"pos": "adj.", "en": "possibly not true or reliable; open to doubt", "zh": "令人懷疑的；有問題的", "word": "questionable"}, "C": {"pos": "adj.", "en": "including all or nearly all parts or aspects", "zh": "全面的；綜合的", "word": "comprehensive"}, "D": {"pos": "adj.", "en": "showing creative, original ideas", "zh": "富有想像力的", "word": "imaginative"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: exhaustive account", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The catalog is unusually _______ listing every known manuscript, fragment, ownership mark, and restoration note associated with the poet.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The catalog is unusually _______ listing every known manuscript, fragment, ownership mark, and restoration note associated with the poet.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這份目錄異常 _______，列出了與這位詩人相關的每一份已知手稿、殘篇、所有權標記和修復紀錄。", "opts": {"A": "superficial", "B": "questionable", "C": "imaginative", "D": "thorough"}, "optsZh": {"A": "superficial（膚淺的、表面的）", "B": "questionable（令人懷疑的）", "C": "imaginative（富有想像力的）", "D": "thorough（徹底的、詳盡的）"}, "answer": "D", "expl": "Thorough means exhaustive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "concerned only with obvious or surface details; not deep", "zh": "膚淺的；表面的", "word": "superficial"}, "B": {"pos": "adj.", "en": "possibly not true or reliable; open to doubt", "zh": "令人懷疑的；有問題的", "word": "questionable"}, "C": {"pos": "adj.", "en": "showing creative, original ideas", "zh": "富有想像力的", "word": "imaginative"}, "D": {"pos": "adj.", "en": "done completely and carefully, with attention to every detail", "zh": "徹底的；詳盡的", "word": "thorough"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: exhaustive account", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Given the loss of many expedition journals, no scholar can offer a truly _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reconstruction\" target=\"_blank\" rel=\"noopener\" data-w=\"reconstruction\" data-pos=\"n.\" data-en=\"something built again to look like the original\" data-zh=\"重建；重建物\">reconstruction<\/a> of the route the travelers took.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Given the loss of many expedition journals, no scholar can offer a truly _______ reconstruction of the route the travelers took.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。由於許多探險日誌已經遺失，沒有任何學者能對這些旅行者所走的路線提出真正 _______ 的重建。", "opts": {"A": "complete", "B": "questionable", "C": "imaginative", "D": "superficial"}, "optsZh": {"A": "complete（完整的）", "B": "questionable（令人懷疑的）", "C": "imaginative（富有想像力的）", "D": "superficial（膚淺的、表面的）"}, "answer": "A", "expl": "Complete means exhaustive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having all the necessary parts; whole", "zh": "完整的；全部的", "word": "complete"}, "B": {"pos": "adj.", "en": "possibly not true or reliable; open to doubt", "zh": "令人懷疑的；有問題的", "word": "questionable"}, "C": {"pos": "adj.", "en": "showing creative, original ideas", "zh": "富有想像力的", "word": "imaginative"}, "D": {"pos": "adj.", "en": "concerned only with obvious or surface details; not deep", "zh": "膚淺的；表面的", "word": "superficial"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: exhaustive account", "vocab": true, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The museum&#x27;s database is intended to be _______ including every object acquired since the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institution<\/a> opened, even those no longer on display.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The museum's database is intended to be _______ including every object acquired since the institution opened, even those no longer on display.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這座博物館的資料庫原本就打算做得 _______，涵蓋自館方開館以來取得的每一件物品，包括那些已不再展出的物品。", "opts": {"A": "superficial", "B": "all-inclusive", "C": "imaginative", "D": "questionable"}, "optsZh": {"A": "superficial（膚淺的、表面的）", "B": "all-inclusive（無所不包的）", "C": "imaginative（富有想像力的）", "D": "questionable（令人懷疑的）"}, "answer": "B", "expl": "All-inclusive means exhaustive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "concerned only with obvious or surface details; not deep", "zh": "膚淺的；表面的", "word": "superficial"}, "B": {"pos": "adj.", "en": "including everything", "zh": "無所不包的；包羅萬象的", "word": "all-inclusive"}, "C": {"pos": "adj.", "en": "showing creative, original ideas", "zh": "富有想像力的", "word": "imaginative"}, "D": {"pos": "adj.", "en": "possibly not true or reliable; open to doubt", "zh": "令人懷疑的；有問題的", "word": "questionable"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Main Purpose: development of jazz tap", "vocab": false, "body": "Jazz tap is a dance form that was first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> in African American communities. Jazz tap was heavily influenced by jazz music, which became widely <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=popular\" target=\"_blank\" rel=\"noopener\" data-w=\"popular\" data-pos=\"adj.\" data-en=\"liked or enjoyed by many people\" data-zh=\"受歡迎的；流行的\">popular<\/a> in the United States in the 1920s. Tap dancers were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> by jazz music’s quick rhythms and by the way jazz <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=musician\" target=\"_blank\" rel=\"noopener\" data-w=\"musician\" data-pos=\"n.\" data-en=\"a person who plays music, especially as a job\" data-zh=\"音樂家；樂手\">musicians<\/a> would make up melodies as they played. As jazz music continued to develop in the 1930s and 1940s, jazz tap evolved with it. Because of jazz music’s influence, jazz tap quickly developed into a dance form that was very different from earlier kinds of tap dance.", "bodyPlain": "Jazz tap is a dance form that was first developed in African American communities. Jazz tap was heavily influenced by jazz music, which became widely popular in the United States in the 1920s. Tap dancers were inspired by jazz music’s quick rhythms and by the way jazz musicians would make up melodies as they played. As jazz music continued to develop in the 1930s and 1940s, jazz tap evolved with it. Because of jazz music’s influence, jazz tap quickly developed into a dance form that was very different from earlier kinds of tap dance.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "爵士踢踏舞是一種最初在非裔美國人社群中發展起來的舞蹈形式。爵士踢踏舞深受爵士樂影響，而爵士樂在 1920 年代的美國廣為流行。踢踏舞者受到爵士樂輕快的節奏，以及爵士樂手邊演奏邊即興創作旋律的方式所啟發。隨著爵士樂在 1930 和 1940 年代持續發展，爵士踢踏舞也隨之演變。由於爵士樂的影響，爵士踢踏舞很快就發展成一種與早期踢踏舞截然不同的舞蹈形式。", "opts": {"A": "It explains why audiences prefer some kinds of music over others.", "B": "It discusses the development of a dance form.", "C": "It describes how to play a musical instrument.", "D": "It emphasizes the popularity of a famous dancer."}, "optsZh": {"A": "它解釋觀眾為什麼偏好某些類型的音樂。", "B": "它討論一種舞蹈形式的發展。", "C": "它說明如何演奏一種樂器。", "D": "它強調一位知名舞者受歡迎的程度。"}, "answer": "B", "expl": "The whole text traces how jazz tap began and evolved under the influence of jazz music, so it discusses the development of a dance form.", "explZh": "全文追溯爵士踢踏舞如何在爵士樂影響下誕生並演變，所以是在討論一種舞蹈形式的發展。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Main Purpose: development of jazz tap", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園帶著花回來。敘述停留在傍晚的光線、已布置好的房間，以及一位期待已久的訪客即將到來的種種細微跡象上。", "opts": {"A": "To explain why music has lost its importance", "B": "To summarize a conflict between two relatives", "C": "To argue that the characters should leave the house", "D": "To portray a setting and mood as characters prepare for an arrival"}, "optsZh": {"A": "解釋音樂為什麼失去了重要性", "B": "總結兩位親戚之間的衝突", "C": "主張角色們應該離開這棟房子", "D": "描繪角色們準備迎接某人到來時的場景與氛圍"}, "answer": "D", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Main Purpose: development of jazz tap", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。一首詩描寫說話者在黎明時分站在港口邊，看著船隻啟航。這首詩並非敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To list the technical features of a harbor", "C": "To present an atmosphere of departure and possibility", "D": "To criticize sailors for taking unnecessary risks"}, "optsZh": {"A": "比較幾種交通方式", "B": "列出一座港口的技術特點", "C": "呈現一種啟程與充滿可能的氛圍", "D": "批評水手冒不必要的風險"}, "answer": "C", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Main Purpose: development of jazz tap", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。一段小說節選描寫節慶大餐前擁擠的廚房。敘述者注意到擦亮的碗、精心排列的椅子，以及每當屋外傳來腳步聲時家人們停下動作的樣子——他們在等待一位已經多年沒有來訪的客人。", "opts": {"A": "To depict preparations that reveal anticipation within a family", "B": "To describe a completed celebration from beginning to end", "C": "To contrast rural and urban customs", "D": "To explain why the family dislikes visitors"}, "optsZh": {"A": "描寫家人們的準備工作，以顯露一家人的期待之情", "B": "從頭到尾描述一場已經結束的慶祝活動", "C": "對比鄉村與城市的習俗", "D": "解釋這家人為什麼不喜歡訪客"}, "answer": "A", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Main Purpose: development of jazz tap", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一段回憶錄描寫一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生在走廊上聚集的聲音。這段文字尚未呈現課堂本身；相反地，它突顯了課前那些安靜的例行儀式。", "opts": {"A": "To evaluate the quality of a school's curriculum", "B": "To describe the moments before a significant daily activity begins", "C": "To recount a student's entire academic career", "D": "To argue that early classes should be canceled"}, "optsZh": {"A": "評估一所學校課程的品質", "B": "描述一項重要日常活動開始之前的時刻", "C": "敘述一名學生完整的求學歷程", "D": "主張應該取消早上的課"}, "answer": "B", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Main Purpose: development of jazz tap", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪一個選項最能說明本文的主要目的？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。一段文學節選呈現雨後的花園：濕潤的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫使場景感覺平靜卻充滿期待。", "opts": {"A": "To establish a reflective mood before a character acts", "B": "To give instructions for maintaining a garden", "C": "To compare two different seasons", "D": "To reveal the full contents of a letter"}, "optsZh": {"A": "在角色採取行動之前營造一種沉思的氛圍", "B": "提供照顧花園的指導", "C": "比較兩個不同的季節", "D": "揭露一封信的完整內容"}, "answer": "A", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Text Structure: NCP daytime navigation method", "vocab": false, "body": "The north celestial pole (NCP)—the fixed point around which stars in the Northern Hemisphere (including the Sun) appear to rotate—is discernible only at night. Inspired by the navigational strategies of some insects and birds, researchers devised a method for locating the NCP in daytime using skylight polarization, which occurs as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=particle\" target=\"_blank\" rel=\"noopener\" data-w=\"particle\" data-pos=\"n.\" data-en=\"an extremely small piece of matter\" data-zh=\"粒子；微粒\">particles<\/a> scatter sunlight. A polarimetric camera captures <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> of polarization patterns, which rotate as the Sun’s position in the sky changes; temporal variances across images can then be used to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> an observer’s latitude and bearing relative to the NCP.", "bodyPlain": "The north celestial pole (NCP)—the fixed point around which stars in the Northern Hemisphere (including the Sun) appear to rotate—is discernible only at night. Inspired by the navigational strategies of some insects and birds, researchers devised a method for locating the NCP in daytime using skylight polarization, which occurs as atmospheric particles scatter sunlight. A polarimetric camera captures images of polarization patterns, which rotate as the Sun’s position in the sky changes; temporal variances across images can then be used to determine an observer’s latitude and bearing relative to the NCP.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "北天極（NCP）——北半球的星體（包括太陽）看起來繞之旋轉的固定點——只有在夜間才能辨識。受到某些昆蟲和鳥類導航策略的啟發，研究人員設計出一種利用天空光偏振在白天定位北天極的方法；天空光偏振是大氣粒子散射陽光時產生的現象。偏振相機會拍攝偏振圖樣的影像，這些圖樣會隨著太陽在天空中位置的改變而旋轉；接著就可以利用各影像之間隨時間產生的差異，來判定觀察者的緯度以及相對於北天極的方位。", "opts": {"A": "It illustrates how most navigational tools utilize the NCP, recounts how researchers discovered that certain animals are able to navigate without using the NCP, and then proposes that this discovery could be used to avoid problems in navigation associated with reliance on the NCP.", "B": "It presents a celestial-based method of navigation, enumerates the comparative benefits of an alternative method used by certain animals that is based on an unrelated natural occurrence, and then indicates how researchers assessed the relative accuracy of the two methods.", "C": "It explains how the NCP is typically located, emphasizes a key difference between how humans and certain animals use the NCP for navigation, and then suggests an alternative way of using the NCP to improve existing navigational instruments.", "D": "It notes an obstacle to observing an astronomical phenomenon, mentions a navigational ability of certain animals that inspired a solution to that obstacle, and then explains how researchers used an optical device to mimic that ability."}, "optsZh": {"A": "它說明大多數導航工具如何利用北天極，敘述研究人員如何發現某些動物不需要北天極就能導航，接著提出這項發現可用來避免依賴北天極所帶來的導航問題。", "B": "它介紹一種以天體為基礎的導航方法，列舉某些動物所使用、以一種不相關自然現象為基礎的替代方法的相對優點，接著說明研究人員如何評估這兩種方法的相對準確度。", "C": "它說明北天極通常如何被定位，強調人類與某些動物在利用北天極導航上的一項關鍵差異，接著提出一種利用北天極來改良現有導航儀器的替代方式。", "D": "它指出觀測一種天文現象的障礙，提到某些動物的一種導航能力啟發了克服這個障礙的方法，接著說明研究人員如何使用一種光學裝置來模仿這種能力。"}, "answer": "D", "expl": "The text notes the NCP is visible only at night (an obstacle), mentions insects and birds whose navigation inspired a daytime method, and then explains the polarimetric camera that mimics that ability.", "explZh": "本文先指出北天極只有夜間可見（障礙），再提到啟發白天定位方法的昆蟲和鳥類導航能力，最後說明模仿該能力的偏振相機。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Text Structure: NCP daytime navigation method", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一篇科學文章首先說明，彗星每次接近太陽時，表面都會發生變化。第二句指出，研究人員無法準確預測這些變化，因為彗星的內部結構仍不甚清楚。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號穿透得不夠深。", "opts": {"A": "It offers evidence that radar is always reliable.", "B": "It identifies the uncertainty that motivated the study.", "C": "It states the study's final conclusion.", "D": "It describes how other researchers criticized the work."}, "optsZh": {"A": "它提供證據說明雷達總是可靠的。", "B": "它指出促使這項研究進行的不確定之處。", "C": "它陳述研究的最終結論。", "D": "它描述了其他研究人員如何批評這項研究。"}, "answer": "B", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Text Structure: NCP daytime navigation method", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。一篇考古學文章一開頭就說，某個聚落顯然曾與遙遠的地區進行貿易。下一句說明，這種交流所使用的路線至今仍不清楚，因為附近的道路幾乎沒有留下任何實體痕跡。文章接著討論一個團隊在陶器中尋找化學特徵，但只得到初步的結論。", "opts": {"A": "It shifts the discussion away from archaeology.", "B": "It summarizes the team's strongest result.", "C": "It contradicts the claim made in the first sentence.", "D": "It defines the problem the later investigation attempts to address."}, "optsZh": {"A": "它把討論從考古學轉移開。", "B": "它總結研究團隊最有力的結果。", "C": "它反駁了第一句提出的主張。", "D": "它界定了後續研究試圖解決的問題。"}, "answer": "D", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Text Structure: NCP daytime navigation method", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。一篇生物學文章指出，某種植物能夠撐過長期乾旱。接下來的一句說明，科學家仍不確定是哪一種細胞機制讓它得以存活。文章其餘部分描述了一項排除其中一種可能機制的實驗。", "opts": {"A": "It proves that drought has no effect on plants.", "B": "It lists the materials used in the experiment.", "C": "It introduces a gap in knowledge that the experiment examines.", "D": "It gives a historical overview of plant classification."}, "optsZh": {"A": "它證明乾旱對植物沒有影響。", "B": "它列出實驗中使用的材料。", "C": "它提出實驗所探討的知識缺口。", "D": "它概述植物分類的歷史。"}, "answer": "C", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Text Structure: NCP daytime navigation method", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A literary analysis begins by noting that a novel&#x27;s ending has often been described as optimistic. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一篇文學分析一開頭就指出，某部小說的結局常被形容為樂觀的。第二句指出這種詮釋
