Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任何一座島嶼的數千年前就已經從大陸族群中分化出來；因此，研究人員得出結論：______", "opts": {"A": "human traders must have transported the seeds recently.", "B": "the plant probably reached the islands without human assistance.", "C": "all island plants descended from a single cultivated variety.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "人類商人必定是在近期才運送這些種子的。", "B": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。", "C": "島上所有植物都源自同一個栽培品種。", "D": "島上的族群比大陸族群更早被馴化。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Logical Completion: ELF3 temperature response", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。有一種甲蟲同時分布在大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前很久就已經和海岸族群分開，因此研究團隊推論：______", "opts": {"A": "the beetles were likely introduced by natural dispersal rather than by humans.", "B": "humans carried the beetles to the island during early trade voyages.", "C": "the beetles were domesticated by island communities.", "D": "the island beetles must be younger than the coastal beetles."}, "optsZh": {"A": "這些甲蟲很可能是透過自然擴散而非人類引進的。", "B": "人類在早期的貿易航行中把甲蟲帶到了島上。", "C": "這些甲蟲是被島上的社群馴養的。", "D": "島上的甲蟲必定比海岸的甲蟲年輕。"}, "answer": "A", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Logical Completion: ELF3 temperature response", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。語言學家曾經提出，一首儀式歌曲是透過近代移民傳到某個群島的，但比較相關的口述傳統後發現，這首歌的核心詞句在移民發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "all versions of the song are identical.", "B": "the migration must have begun earlier than any other human movement.", "C": "the song was probably not introduced to the archipelago by that migration.", "D": "the song could not have changed after the migration."}, "optsZh": {"A": "這首歌的所有版本都完全相同。", "B": "這次移民必定比任何其他人類遷徙更早開始。", "C": "這首歌很可能不是透過那次移民傳入群島的。", "D": "這首歌在移民之後不可能有所改變。"}, "answer": "C", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Logical Completion: ELF3 temperature response", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。研究某座偏遠島嶼上一種作物的植物學家發現，這個島嶼品種在人類定居該島的數萬年前就已經和它在大陸上的近親分化。這項證據使他們主張：______", "opts": {"A": "mainland farmers acquired the crop from island communities.", "B": "the island variety must be genetically identical to wild mainland plants.", "C": "the crop was first domesticated on the island.", "D": "human settlement probably did not account for the plant's original arrival on the island."}, "optsZh": {"A": "大陸上的農民是從島上的社群取得這種作物的。", "B": "島上的品種在基因上必定與大陸上的野生植物完全相同。", "C": "這種作物最初是在島上被馴化的。", "D": "這種植物最初來到島上，可能不是由人類定居造成的。"}, "answer": "D", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Logical Completion: ELF3 temperature response", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。研究人員原本認為，一種淡水螺是在人們開始在一連串湖泊之間移動船隻時才到達那些湖泊的。然而，基因資料顯示，這些湖泊中的族群早在划船活動開始之前很久就已經彼此分開。因此，研究人員得出結論：______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "human activity made the populations genetically identical.", "C": "the snails likely spread through an earlier nonhuman mechanism.", "D": "boats probably explain every modern snail population."}, "optsZh": {"A": "在划船活動開始之前，這些湖泊裡沒有螺。", "B": "人類活動使這些族群在基因上完全相同。", "C": "這些螺很可能是透過一種更早的、非人類的機制擴散的。", "D": "船隻可能可以解釋現今所有的螺類族群。"}, "answer": "C", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Grammar: comma before but independent clause", "vocab": false, "body": "The Alvarez theory, developed in 1980 by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=physicist\" target=\"_blank\" rel=\"noopener\" data-w=\"physicist\" data-pos=\"n.\" data-en=\"a scientist who studies physics\" data-zh=\"物理學家\">physicist<\/a> Luis Walter Alvarez and his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geologist\" target=\"_blank\" rel=\"noopener\" data-w=\"geologist\" data-pos=\"n.\" data-en=\"a scientist who studies rocks and the structure of the earth\" data-zh=\"地質學家\">geologist<\/a> son Walter Alvarez, maintained that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secondary\" target=\"_blank\" rel=\"noopener\" data-w=\"secondary\" data-pos=\"adj.\" data-en=\"less important than something else\" data-zh=\"次要的\">secondary<\/a> effects of an asteroid impact caused many dinosaurs and other animals to die _______ it left unexplored the question of whether unrelated volcanic activity might have also contributed to the mass <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extinction\" target=\"_blank\" rel=\"noopener\" data-w=\"extinction\" data-pos=\"n.\" data-en=\"the dying out of a whole species\" data-zh=\"滅絕\">extinctions<\/a>.", "bodyPlain": "The Alvarez theory, developed in 1980 by physicist Luis Walter Alvarez and his geologist son Walter Alvarez, maintained that the secondary effects of an asteroid impact caused many dinosaurs and other animals to die _______ it left unexplored the question of whether unrelated volcanic activity might have also contributed to the mass extinctions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "由物理學家 Luis Walter Alvarez 和他身為地質學家的兒子 Walter Alvarez 於 1980 年提出的 Alvarez 理論主張，小行星撞擊的次生效應導致許多恐龍和其他動物滅絕 _______ 這個理論沒有探討不相關的火山活動是否也可能促成了這次大滅絕的問題。", "opts": {"A": "out but", "B": "out, but", "C": "out", "D": "out,"}, "optsZh": {"A": "out but（缺少逗號 → 連接兩個獨立子句時 but 前需要逗號：錯誤）", "B": "out, but（逗號＋but 連接兩個獨立子句：正確）", "C": "out（不加標點 → 兩個獨立子句直接相連，造成連寫句：錯誤）", "D": "out,（只用逗號 → 造成逗號連接錯誤：錯誤）"}, "answer": "B", "expl": "Two independent clauses joined by the coordinating conjunction 'but' need a comma before 'but.'", "explZh": "用對等連接詞 but 連接兩個獨立子句時，but 前面需要逗號。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Grammar: comma before but independent clause", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。2022 年，研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在高酸性的水中存活。", "opts": {"A": "publishing", "B": "to publish", "C": "having published", "D": "published"}, "optsZh": {"A": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "B": "to publish（不定詞 → 句子缺少主要動詞：錯誤）", "C": "having published（完成式分詞 → 句子缺少主要動詞：錯誤）", "D": "published（過去式動詞，作句子的主要動詞：正確）"}, "answer": "D", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Grammar: comma before but independent clause", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。這個古董音樂盒看起來只是裝飾品，但轉動把手時，______ 內部的針會撥動細小的金屬齒片，奏出旋律。", "opts": {"A": "device", "B": "device,", "C": "device--", "D": "device:"}, "optsZh": {"A": "device（不加標點：名詞直接接動詞 strike）", "B": "device,（逗號 → 不當隔開主詞與動詞：錯誤）", "C": "device--（破折號 → 不當隔開主詞與動詞：錯誤）", "D": "device:（冒號 → 前面不是完整句子，且隔開主詞與動詞：錯誤）"}, "answer": "A", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Grammar: comma before but independent clause", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。袖珍計算機剛出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "it", "B": "this", "C": "them", "D": "that"}, "optsZh": {"A": "it（它 → 單數代名詞，與複數 devices 不一致：錯誤）", "B": "this（這個 → 單數代名詞，與複數 devices 不一致：錯誤）", "C": "them（它們，複數受格代名詞，指 devices：正確）", "D": "that（那個 → 單數代名詞，與複數 devices 不一致：錯誤）"}, "answer": "C", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Grammar: comma before but independent clause", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。Isabel Allende 的小說《The House of the Spirits》（精靈之屋）是一部以 Trueba _______ 為中心的家族史詩，常常是讀者接觸拉丁美洲文學中魔幻寫實主義的入門作品。", "opts": {"A": "family, and", "B": "family,", "C": "family", "D": "family and"}, "optsZh": {"A": "family, and（逗號＋and → 句子缺少主要動詞的主詞：錯誤）", "B": "family,（逗號：結束同位語 a family saga…，再接動詞 introduces）", "C": "family（不加逗號 → 同位語 a family saga… 沒有結束，主詞與動詞未正確分隔）", "D": "family and（加 and → 造成句子結構錯誤：錯誤）"}, "answer": "C", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Grammar: comma before but independent clause", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這艘擱淺的研究船花了三天才 _______ 它的船身卡在兩層冰棚之間。", "opts": {"A": "free, in part because,", "B": "free. In part because", "C": "free, in part because:", "D": "free in part because"}, "optsZh": {"A": "free, in part because,（because 後加逗號 → 不當隔開連接詞與子句：錯誤）", "B": "free. In part because（句號 → 後面的 because 子句成為不完整句）", "C": "free, in part because:（because 後加冒號：錯誤）", "D": "free in part because（不加標點，because 子句直接修飾 free）"}, "answer": "B", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Grammar: punctuation before contrast", "vocab": false, "body": "Typically, underlines, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scribble\" target=\"_blank\" rel=\"noopener\" data-w=\"scribble\" data-pos=\"n.\" data-en=\"careless or untidy writing or drawing\" data-zh=\"塗鴉；潦草的字\">scribbles<\/a>, and notes left in the margins by a former owner lower a book’s _______ when the former owner is a famous poet like Walt Whitman, such markings, known as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=marginalia\" target=\"_blank\" rel=\"noopener\" data-w=\"marginalia\" data-pos=\"n.\" data-en=\"notes written in the margins of a book\" data-zh=\"頁緣註記\">marginalia<\/a>, can be a gold mine to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a>.", "bodyPlain": "Typically, underlines, scribbles, and notes left in the margins by a former owner lower a book’s _______ when the former owner is a famous poet like Walt Whitman, such markings, known as marginalia, can be a gold mine to literary scholars.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "通常，前任擁有者在書頁空白處留下的畫線、塗鴉和筆記會降低書的 _______ 但當前任擁有者是像 Walt Whitman 這樣的著名詩人時，這些被稱為「旁註」的痕跡對文學學者來說可能是一座金礦。", "opts": {"A": "value, but", "B": "value", "C": "value,", "D": "value but"}, "optsZh": {"A": "value, but（逗號＋but 連接兩個獨立子句並表示對比：正確）", "B": "value（不加標點 → 兩個子句直接相連，造成連寫句：錯誤）", "C": "value,（只用逗號 → 造成逗號連接錯誤：錯誤）", "D": "value but（缺少逗號：錯誤）"}, "answer": "A", "expl": "'Typically ... lower a book's value' and 'when the former owner is a famous poet ..., such markings ... can be a gold mine' are independent clauses, so they need a comma plus 'but.'", "explZh": "前後兩部分都是獨立子句，必須用「逗號＋but」連接，同時表達對比。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Grammar: punctuation before contrast", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。2022 年，研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在高酸性的水中存活。", "opts": {"A": "having published", "B": "published", "C": "publishing", "D": "to publish"}, "optsZh": {"A": "having published（完成式分詞 → 句子缺少主要動詞：錯誤）", "B": "published（過去式動詞，作句子的主要動詞：正確）", "C": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "D": "to publish（不定詞 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Grammar: punctuation before contrast", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。這個古董音樂盒看起來只是裝飾品，但轉動把手時，______ 內部的針會撥動細小的金屬齒片，奏出旋律。", "opts": {"A": "device--", "B": "device:", "C": "device,", "D": "device"}, "optsZh": {"A": "device--（破折號 → 不當隔開主詞與動詞：錯誤）", "B": "device:（冒號 → 前面不是完整句子，且隔開主詞與動詞：錯誤）", "C": "device,（逗號 → 不當隔開主詞與動詞：錯誤）", "D": "device（不加標點：名詞直接接動詞 strike）"}, "answer": "D", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Grammar: punctuation before contrast", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。袖珍計算機剛出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "them", "B": "this", "C": "it", "D": "that"}, "optsZh": {"A": "them（它們，複數受格代名詞，指 devices：正確）", "B": "this（這個 → 單數代名詞，與複數 devices 不一致：錯誤）", "C": "it（它 → 單數代名詞，與複數 devices 不一致：錯誤）", "D": "that（那個 → 單數代名詞，與複數 devices 不一致：錯誤）"}, "answer": "A", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Grammar: punctuation before contrast", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。Isabel Allende 的小說《The House of the Spirits》（精靈之屋）是一部以 Trueba _______ 為中心的家族史詩，常常是讀者接觸拉丁美洲文學中魔幻寫實主義的入門作品。", "opts": {"A": "family,", "B": "family, and", "C": "family", "D": "family and"}, "optsZh": {"A": "family,（逗號：結束同位語 a family saga…，再接動詞 introduces）", "B": "family, and（逗號＋and → 句子缺少主要動詞的主詞：錯誤）", "C": "family（不加逗號 → 同位語 a family saga… 沒有結束，主詞與動詞未正確分隔）", "D": "family and（加 and → 造成句子結構錯誤：錯誤）"}, "answer": "C", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Grammar: punctuation before contrast", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這艘擱淺的研究船花了三天才 _______ 它的船身卡在兩層冰棚之間。", "opts": {"A": "free. In part because", "B": "free in part because", "C": "free, in part because:", "D": "free, in part because,"}, "optsZh": {"A": "free. In part because（句號 → 後面的 because 子句成為不完整句）", "B": "free in part because（不加標點，because 子句直接修飾 free）", "C": "free, in part because:（because 後加冒號：錯誤）", "D": "free, in part because,（because 後加逗號 → 不當隔開連接詞與子句：錯誤）"}, "answer": "A", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Grammar: participial phrase forcing", "vocab": false, "body": "In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=availability\" target=\"_blank\" rel=\"noopener\" data-w=\"availability\" data-pos=\"n.\" data-en=\"the state of being able to be obtained or used\" data-zh=\"可取得性；供應情況\">availability<\/a> than by food preference. Although the monkeys prefer to eat <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a> and land-dwelling <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invertebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"invertebrate\" data-pos=\"n.\" data-en=\"an animal without a backbone\" data-zh=\"無脊椎動物\">invertebrates<\/a>, those food sources may become unavailable because of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extensive\" target=\"_blank\" rel=\"noopener\" data-w=\"extensive\" data-pos=\"adj.\" data-en=\"covering a large area or amount\" data-zh=\"廣泛的；大面積的\">extensive<\/a> snow and ice cover, _______ the monkeys to hunt for marine animals in any streams that have not frozen over.", "bodyPlain": "In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food availability than by food preference. Although the monkeys prefer to eat vegetation and land-dwelling invertebrates, those food sources may become unavailable because of extensive snow and ice cover, _______ the monkeys to hunt for marine animals in any streams that have not frozen over.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "冬天時，日本獼猴（又稱雪猴）的飲食受食物可得性的影響大於食物偏好。雖然這些猴子偏好吃植物和陸生無脊椎動物，但這些食物來源可能因為大範圍的積雪和結冰而無法取得，_______ 猴子到尚未結冰的溪流中捕食海洋動物。", "opts": {"A": "forces", "B": "to force", "C": "forcing", "D": "forced"}, "optsZh": {"A": "forces（現在式動詞 → 造成逗號連接錯誤：錯誤）", "B": "to force（不定詞 → 無法表達前句造成的結果：錯誤）", "C": "forcing（分詞片語，修飾前面整個子句：正確）", "D": "forced（過去式動詞 → 造成逗號連接錯誤：錯誤）"}, "answer": "C", "expl": "'Forcing' begins a participial phrase that describes the result of the preceding clause; a finite verb (forces/forced) would create a comma splice.", "explZh": "forcing 引導分詞片語，說明前面子句造成的結果；用 forces 或 forced 等限定動詞會造成逗號連接錯誤。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Grammar: participial phrase forcing", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。2022 年，研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在高酸性的水中存活。", "opts": {"A": "to publish", "B": "publishing", "C": "having published", "D": "published"}, "optsZh": {"A": "to publish（不定詞 → 句子缺少主要動詞：錯誤）", "B": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "C": "having published（完成式分詞 → 句子缺少主要動詞：錯誤）", "D": "published（過去式動詞，作句子的主要動詞：正確）"}, "answer": "D", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Grammar: participial phrase forcing", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。這個古董音樂盒看起來只是裝飾品，但轉動把手時，______ 內部的針會撥動細小的金屬齒片，奏出旋律。", "opts": {"A": "device,", "B": "device", "C": "device:", "D": "device--"}, "optsZh": {"A": "device,（逗號 → 不當隔開主詞與動詞：錯誤）", "B": "device（不加標點：名詞直接接動詞 strike）", "C": "device:（冒號 → 前面不是完整句子，且隔開主詞與動詞：錯誤）", "D": "device--（破折號 → 不當隔開主詞與動詞：錯誤）"}, "answer": "B", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Grammar: participial phrase forcing", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。袖珍計算機剛出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "this", "B": "them", "C": "that", "D": "it"}, "optsZh": {"A": "this（這個 → 單數代名詞，與複數 devices 不一致：錯誤）", "B": "them（它們，複數受格代名詞，指 devices：正確）", "C": "that（那個 → 單數代名詞，與複數 devices 不一致：錯誤）", "D": "it（它 → 單數代名詞，與複數 devices 不一致：錯誤）"}, "answer": "B", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Grammar: participial phrase forcing", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。Isabel Allende 的小說《The House of the Spirits》（精靈之屋）是一部以 Trueba _______ 為中心的家族史詩，常常是讀者接觸拉丁美洲文學中魔幻寫實主義的入門作品。", "opts": {"A": "family", "B": "family, and", "C": "family,", "D": "family and"}, "optsZh": {"A": "family（不加逗號 → 同位語 a family saga… 沒有結束，主詞與動詞未正確分隔）", "B": "family, and（逗號＋and → 句子缺少主要動詞的主詞：錯誤）", "C": "family,（逗號：結束同位語 a family saga…，再接動詞 introduces）", "D": "family and（加 and → 造成句子結構錯誤：錯誤）"}, "answer": "A", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Grammar: participial phrase forcing", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這艘擱淺的研究船花了三天才 _______ 它的船身卡在兩層冰棚之間。", "opts": {"A": "free, in part because,", "B": "free in part because", "C": "free. In part because", "D": "free, in part because:"}, "optsZh": {"A": "free, in part because,（because 後加逗號 → 不當隔開連接詞與子句：錯誤）", "B": "free in part because（不加標點，because 子句直接修飾 free）", "C": "free. In part because（句號 → 後面的 because 子句成為不完整句）", "D": "free, in part because:（because 後加冒號：錯誤）"}, "answer": "C", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Grammar: comma before but contrast", "vocab": false, "body": "While many video game creators <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strive\" target=\"_blank\" rel=\"noopener\" data-w=\"strive\" data-pos=\"v.\" data-en=\"to try very hard to achieve something\" data-zh=\"努力；力求\">strive<\/a> to make their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=graphics\" target=\"_blank\" rel=\"noopener\" data-w=\"graphics\" data-pos=\"n.\" data-en=\"pictures and images, especially those produced by a computer\" data-zh=\"圖像；（電腦）畫面\">graphics<\/a> ever more ______ others look to the past, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developing<\/a> titles with visuals <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> by the “8-bit” games of the 1980s and 1990s. (The term “8-bit” refers to a console whose processor could only handle eight bits of data at once.)", "bodyPlain": "While many video game creators strive to make their graphics ever more ______ others look to the past, developing titles with visuals inspired by the “8-bit” games of the 1980s and 1990s. (The term “8-bit” refers to a console whose processor could only handle eight bits of data at once.)", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "許多電子遊
