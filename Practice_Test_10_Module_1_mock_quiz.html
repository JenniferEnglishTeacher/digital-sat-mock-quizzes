China, in 2013."}, "optsZh": {"A": "作為 2013 年一項貓馴化研究的一部分，研究人員對在中國泉護村發現的貓骨碎片進行了化學分析。", "B": "2013 年對中國泉護村發現的貓骨碎片所做的分析顯示，那裡的貓可能在 5,300 年前就已經被馴化。", "C": "2013 年，考古學家研究了中國泉護村的貓在五千多年前吃了什麼。", "D": "2013 年在中國泉護村發現了估計有 5,300 年歷史的貓骨碎片。"}, "answer": "B", "expl": "Choice B presents the 2013 study (analysis of cat bone fragments from Quanhucun) and its conclusion (the cats may have been domesticated 5,300 years ago).", "explZh": "B 同時介紹了 2013 年的研究（分析泉護村的貓骨碎片）及其結論（那裡的貓可能在 5,300 年前已被馴化）。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: present Quanhucun cat study", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。筆記：植物學家 Aya Mori 採集了 600 件植物樣本；她於 1932 年在 Mount Kuro 採集了 Fern A；她於 1933 年在 River Nami 採集了 Moss B；目標是強調 Mount Kuro 的樣本。", "opts": {"A": "Aya Mori collected hundreds of plant samples.", "B": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "C": "Mori also collected Moss B from River Nami.", "D": "Fern A and Moss B were collected in different years."}, "optsZh": {"A": "Aya Mori 採集了數百件植物樣本。", "B": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "C": "Mori 也在 River Nami 採集了 Moss B。", "D": "Fern A 和 Moss B 是在不同年份採集的。"}, "answer": "B", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: present Quanhucun cat study", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。筆記：地質學家 Luis Ortega 採集了許多礦物樣本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的樣本。", "opts": {"A": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.", "B": "Ortega collected many mineral samples.", "C": "Quartz was collected from Valle Seco.", "D": "Cerro Azul and Valle Seco are different sites."}, "optsZh": {"A": "Ortega 在 1910 年於 Cerro Azul 採集了玄武岩，這是他礦物採樣工作的一部分。", "B": "Ortega 採集了許多礦物樣本。", "C": "石英是在 Valle Seco 採集的。", "D": "Cerro Azul 和 Valle Seco 是不同的地點。"}, "answer": "A", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: present Quanhucun cat study", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的樣本。", "opts": {"A": "Fucus alba was collected from Stone Harbor.", "B": "Both samples were collected in 1980.", "C": "Lee cataloged more than one algae species.", "D": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980."}, "optsZh": {"A": "Fucus alba 是在 Stone Harbor 採集的。", "B": "兩件樣本都是在 1980 年採集的。", "C": "Lee 為不只一種藻類編目。", "D": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。"}, "answer": "D", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: present Quanhucun cat study", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 Species L；他於 1976 年在 Lake Plain 採集了 Species M；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "Singh collected beetles in multiple locations.", "B": "Species M came from Lake Plain.", "C": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "D": "The Cedar Ridge and Lake Plain specimens were collected in different years."}, "optsZh": {"A": "Singh 在多個地點採集甲蟲。", "B": "Species M 來自 Lake Plain。", "C": "Singh 採集的標本之一是 Species L，那是 1975 年在 Cedar Ridge 採集的一種甲蟲。", "D": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。"}, "answer": "C", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: present Quanhucun cat study", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。筆記：植物學家 Celia Ramos 採集了大約 700 件標本；她於 1948 年在 Cloud Peak 採集了 Orchid X；她於 1949 年在 Green Valley 採集了 Fern Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Cloud Peak and Green Valley were both collection sites.", "B": "Ramos collected Fern Y the following year.", "C": "Ramos collected approximately 700 specimens.", "D": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948."}, "optsZh": {"A": "Cloud Peak 和 Green Valley 都是採集地點。", "B": "Ramos 在隔年採集了 Fern Y。", "C": "Ramos 採集了大約 700 件標本。", "D": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。"}, "answer": "D", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: emphasize portrait difference", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Gaspar Enriquez is an artist.<br>- He <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portrait\" target=\"_blank\" rel=\"noopener\" data-w=\"portrait\" data-pos=\"n.\" data-en=\"a painting, drawing, or photograph of a person\" data-zh=\"肖像；畫像\">portraits<\/a> of Mexican Americans.<br>- A portrait is an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artistic\" target=\"_blank\" rel=\"noopener\" data-w=\"artistic\" data-pos=\"adj.\" data-en=\"relating to art or artists; showing skill in art\" data-zh=\"藝術的；有藝術才能的\">artistic<\/a> representation of a person.<br>- Enriquez <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complete\" target=\"_blank\" rel=\"noopener\" data-w=\"complete\" data-pos=\"adj.\" data-en=\"having all the necessary parts; whole\" data-zh=\"完整的；全部的\">completed<\/a> a painting of the sculptor Luis Jimenez in 2003.<br>- He completed a drawing of the writer Rudolfo Anaya in 2016.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Gaspar Enriquez is an artist.\n- He specializes in portraits of Mexican Americans.\n- A portrait is an artistic representation of a person.\n- Enriquez completed a painting of the sculptor Luis Jimenez in 2003.\n- He completed a drawing of the writer Rudolfo Anaya in 2016.", "stem": "The student wants to emphasize a difference between the two portraits. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調這兩幅肖像之間的差異。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- Gaspar Enriquez 是一位藝術家。\n- 他專門描繪墨西哥裔美國人的肖像。\n- 肖像是對一個人的藝術呈現。\n- Enriquez 在 2003 年完成了一幅雕塑家 Luis Jimenez 的畫作。\n- 他在 2016 年完成了一幅作家 Rudolfo Anaya 的素描。", "opts": {"A": "The portraits, or artistic representations, of Luis Jimenez and Rudolfo Anaya were both completed by Enriquez in the early 2000s.", "B": "Enriquez has completed portraits of numerous Mexican Americans, including sculptor Luis Jimenez and writer Rudolfo Anaya.", "C": "While both are by Enriquez, the 2003 portrait of Luis Jimenez is a painting, and the 2016 portrait of Rudolfo Anaya is a drawing.", "D": "Luis Jimenez was a Mexican American sculptor, and Rudolfo Anaya was a Mexican American writer."}, "optsZh": {"A": "Luis Jimenez 和 Rudolfo Anaya 的肖像（即藝術呈現）都是 Enriquez 在 2000 年代初期完成的。", "B": "Enriquez 完成了許多墨西哥裔美國人的肖像，包括雕塑家 Luis Jimenez 和作家 Rudolfo Anaya。", "C": "雖然兩幅都是 Enriquez 的作品，但 2003 年的 Luis Jimenez 肖像是一幅畫作，而 2016 年的 Rudolfo Anaya 肖像則是一幅素描。", "D": "Luis Jimenez 是一位墨西哥裔美國雕塑家，而 Rudolfo Anaya 是一位墨西哥裔美國作家。"}, "answer": "C", "expl": "Choice C emphasizes a difference: the 2003 Jimenez portrait is a painting, while the 2016 Anaya portrait is a drawing.", "explZh": "C 強調了差異：2003 年的 Jimenez 肖像是畫作，而 2016 年的 Anaya 肖像是素描。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: emphasize portrait difference", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。筆記：植物學家 Aya Mori 採集了 600 件植物樣本；她於 1932 年在 Mount Kuro 採集了 Fern A；她於 1933 年在 River Nami 採集了 Moss B；目標是強調 Mount Kuro 的樣本。", "opts": {"A": "Mori also collected Moss B from River Nami.", "B": "Aya Mori collected hundreds of plant samples.", "C": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "D": "Fern A and Moss B were collected in different years."}, "optsZh": {"A": "Mori 也在 River Nami 採集了 Moss B。", "B": "Aya Mori 採集了數百件植物樣本。", "C": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "D": "Fern A 和 Moss B 是在不同年份採集的。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: emphasize portrait difference", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。筆記：地質學家 Luis Ortega 採集了許多礦物樣本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的樣本。", "opts": {"A": "Quartz was collected from Valle Seco.", "B": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.", "C": "Ortega collected many mineral samples.", "D": "Cerro Azul and Valle Seco are different sites."}, "optsZh": {"A": "石英是在 Valle Seco 採集的。", "B": "Ortega 在 1910 年於 Cerro Azul 採集了玄武岩，這是他礦物採樣工作的一部分。", "C": "Ortega 採集了許多礦物樣本。", "D": "Cerro Azul 和 Valle Seco 是不同的地點。"}, "answer": "B", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: emphasize portrait difference", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的樣本。", "opts": {"A": "Both samples were collected in 1980.", "B": "Fucus alba was collected from Stone Harbor.", "C": "Lee cataloged more than one algae species.", "D": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980."}, "optsZh": {"A": "兩件樣本都是在 1980 年採集的。", "B": "Fucus alba 是在 Stone Harbor 採集的。", "C": "Lee 為不只一種藻類編目。", "D": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。"}, "answer": "D", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: emphasize portrait difference", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 Species L；他於 1976 年在 Lake Plain 採集了 Species M；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "B": "Singh collected beetles in multiple locations.", "C": "Species M came from Lake Plain.", "D": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975."}, "optsZh": {"A": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "B": "Singh 在多個地點採集甲蟲。", "C": "Species M 來自 Lake Plain。", "D": "Singh 採集的標本之一是 Species L，那是 1975 年在 Cedar Ridge 採集的一種甲蟲。"}, "answer": "D", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: emphasize portrait difference", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。筆記：植物學家 Celia Ramos 採集了大約 700 件標本；她於 1948 年在 Cloud Peak 採集了 Orchid X；她於 1949 年在 Green Valley 採集了 Fern Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "B": "Ramos collected Fern Y the following year.", "C": "Ramos collected approximately 700 specimens.", "D": "Cloud Peak and Green Valley were both collection sites."}, "optsZh": {"A": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "B": "Ramos 在隔年採集了 Fern Y。", "C": "Ramos 採集了大約 700 件標本。", "D": "Cloud Peak 和 Green Valley 都是採集地點。"}, "answer": "A", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: duration and purpose of Gullah preservation work", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Gullah are a group of African Americans who have lived in parts of the southeastern United States since the 18th <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=century\" target=\"_blank\" rel=\"noopener\" data-w=\"century\" data-pos=\"n.\" data-en=\"a period of 100 years\" data-zh=\"世紀\">century<\/a>.<br>- Gullah culture is influenced by West African and Central African <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a>.<br>- Louise Miller Cohen is a Gullah <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a>, storyteller, and preservationist.<br>- She founded the Gullah Museum of Hilton Head Island, South Carolina, in 2003.<br>- Vermelle Rodrigues is a Gullah historian, artist, and preservationist.<br>- She founded the Gullah Museum of Georgetown, South Carolina, in 2003.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Gullah are a group of African Americans who have lived in parts of the southeastern United States since the 18th century.\n- Gullah culture is influenced by West African and Central African traditions.\n- Louise Miller Cohen is a Gullah historian, storyteller, and preservationist.\n- She founded the Gullah Museum of Hilton Head Island, South Carolina, in 2003.\n- Vermelle Rodrigues is a Gullah historian, artist, and preservationist.\n- She founded the Gullah Museum of Georgetown, South Carolina, in 2003.", "stem": "The student wants to emphasize the duration and purpose of Cohen’s and Rodrigues’s work. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調 Cohen 和 Rodrigues 工作的持續時間與目的。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- Gullah 人是一群自 18 世紀以來就居住在美國東南部部分地區的非裔美國人。\n- Gullah 文化受到西非和中非傳統的影響。\n- Louise Miller Cohen 是一位 Gullah 歷史學家、說書人和文化保存者。\n- 她於 2003 年在南卡羅來納州的 Hilton Head Island 創立了 Gullah 博物館。\n- Vermelle Rodrigues 是一位 Gullah 歷史學家、藝術家和文化保存者。\n- 她於 2003 年在南卡羅來納州的 Georgetown 創立了 Gullah 博物館。", "opts": {"A": "At the Gullah Museums in Hilton Head Island and Georgetown, South Carolina, visitors can learn more about the Gullah people who have lived in the region for centuries.", "B": "Louise Miller Cohen and Vermelle Rodrigues have worked to preserve the culture of the Gullah people, who have lived in the United States since the 18th century.", "C": "Since 2003, Louise Miller Cohen and Vermelle Rodrigues have worked to preserve Gullah culture through their museums.", "D": "Influenced by the traditions of West and Central Africa, Gullah culture developed in parts of the southeastern United States in the 18th century."}, "optsZh": {"A": "在南卡羅來納州 Hilton Head Island 和 Georgetown 的 Gullah 博物館，遊客可以更深入了解在該地區生活了數百年的 Gullah 人。", "B": "Louise Miller Cohen 和 Vermelle Rodrigues 一直致力於保存 Gullah 人的文化，Gullah 人自 18 世紀以來就居住在美國。", "C": "自 2003 年以來，Louise Miller Cohen 和 Vermelle Rodrigues 一直透過她們的博物館致力於保存 Gullah 文化。", "D": "受到西非和中非傳統的影響，Gullah 文化於 18 世紀在美國東南部的部分地區發展起來。"}, "answer": "C", "expl": "Choice C gives both the duration ('Since 2003') and the purpose ('to preserve Gullah culture through their museums') of Cohen's and Rodrigues's work.", "explZh": "C 同時說明了 Cohen 和 Rodrigues 工作的持續時間（自 2003 年起）與目的（透過博物館保存 Gullah 文化）。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: duration and purpose of Gullah preservation work", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。筆記：某檔案室依風險等級分類文件；公開後可能造成輕微傷害的文件列為「限閱」（Restricted）；公開後可能造成重大傷害的文件列為「密封」（Sealed）；例行預算草稿可能造成輕微但不會造成重大傷害；目標是為這些草稿分類。", "opts": {"A": "Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.", "B": "The records office classifies documents by release risk.", "C": "Sealed documents could cause major harm if released.", "D": "Budget drafts are one kind of government document."}, "optsZh": {"A": "由於公開後可能造成輕微但不會造成重大的傷害，例行預算草稿被列為「限閱」（Restricted）。", "B": "檔案室依公開風險為文件分類。", "C": "「密封」（Sealed）類文件若公開可能造成重大傷害。", "D": "預算草稿是一種政府文件。"}, "answer": "A", "expl": "The answer applies the classification rule.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: duration and purpose of Gullah preservation work", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。筆記：某實驗室依危險程度標示材料；會刺激皮膚的材料標為「注意」（Caution）；可能造成嚴重傷害的材料標為「危險」（Danger）；稀釋過的清潔劑會刺激皮膚，但不會造成嚴重傷害；目標是為稀釋清潔劑分類。", "opts": {"A": "Danger materials can cause severe injury.", "B": "Diluted cleaner is handled in a lab.", "C": "The lab uses hazard categories for materials.", "D": "Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution."}, "optsZh": {"A": "「危險」（Danger）類材料可能造成嚴重傷害。", "B": "稀釋過的清潔劑在實驗室中使用。", "C": "這間實驗室對材料使用危險等級分類。", "D": "由於會刺激皮膚但不會造成嚴重傷害，稀釋過的清潔劑被標為「注意」（Caution）。"}, "answer": "D", "expl": "The answer uses the correct category.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: duration and purpose of Gullah preservation work", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。筆記：某圖書館依脆弱程度分類手稿；需要小心處理的物品列為「監管」（Monitored）；讀者不能接觸的物品列為「限閱」（Restricted）；大多數十九世紀的小冊子需要小心處理，但仍可以接觸；目標是為這些小冊子分類。", "opts": {"A": "The library classifies manuscripts by fragility.", "B": "Nineteenth-century pamphlets are historical documents.", "C": "Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers.", "D": "Restricted manuscripts cannot be handled by readers."}, "optsZh": {"A": "這間圖書館依脆弱程度為手稿分類。", "B": "十九世紀的小冊子是歷史文件。", "C": "大多數十九世紀的小冊子被列為「監管」（Monitored），因為它們需要小心處理，但讀者仍然可以接觸。", "D": "「限閱」（Restricted）類手稿讀者不能接觸。"}, "answer": "C", "expl": "The answer applies the definitions.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: duration and purpose of Gullah preservation work", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a> the same policy in different ways. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。筆記：某機構依預期影響分類暴風；預期造成局部干擾的暴風列為「注意報」（Advisory）；預期造成大範圍損害的暴風列為「緊急」（Emergency）；某場沿海暴風預期會造成局部干擾，但不會造成大範圍損害；目標是為這場暴風分類。", "opts": {"A": "Coastal storms can affect travel.", "B": "Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.", "C": "Emergency storms cause widespread damage.", "D": "The agency classifies storms by expected impact."}, "optsZh": {"A": "沿海暴風可能會影響交通。", "B": "由於預期會造成局部干擾但不會造成大範圍損害，這場沿海暴風被列為「注意報」（Advisory）。", "C": "「緊急」（Emergency）類暴風會造成大範圍損害。", "D": "該機構依預期影響為暴風分類。"}, "answer": "B", "expl": "The answer identifies the category.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: duration and purpose of Gullah preservation work", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.or         .ex{margin:2pt 0;color:#14532d}.zh{margin:2pt 0;color:#5b3a8a;font-size:10pt}p{margin:3pt 0}</style></head><body>
        <h1>${esc(SOURCE)} — 錯題講義 Wrong-Question Review</h1><p>${label} · ${list.length} 題 · ${d}　Name 姓名：____________</p>
        <h2>Part 1 重新作答 Try again (no answers)</h2>${part1}
        <br style="page-break-before:always" clear="all"><h2>Part 2 解答與解析 Answer key & explanations</h2>${part2}</body></html>`;
      download(`${SLUG}_wrong_questions_${tag}_${d}.doc`, html, 'application/msword;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
    if (location.hash.startsWith('#item-')) revealItem(location.hash.slice(1));
  </script>
