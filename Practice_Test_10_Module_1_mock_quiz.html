rs had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。一張圖表顯示，女性農民占南部地區蔬菜種植者的 64%，但在北部和中部地區的穀物種植者中占不到 35%。哪一個敘述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "The southern region was included in the survey.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "南部地區被納入了調查。", "C": "有些農民種蔬菜，有些則種穀物。", "D": "女性在南部的蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不是。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Command of Evidence: Morrison strengthened Black author presence", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "Some stars contain hydrogen and helium.", "C": "One rocky planet has a thin atmosphere.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "研究發現有好幾顆岩質行星所含鐵的比例遠高於它們所環繞的恆星。", "B": "有些恆星含有氫和氦。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Command of Evidence: Morrison strengthened Black author presence", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一位民俗學者主張，某項傳統是透過近代的文化交流發展而成，而不只是從遙遠的國家原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Some songs use a meter also found in older European poetry.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "好幾個國家的學者都在研究這項傳統。", "B": "有些歌曲使用的韻律在較古老的歐洲詩歌中也可見到。", "C": "有幾首民謠包含了地方歷史事件，以及在不同社群持續接觸之後才出現的混合音樂形式。", "D": "許多表演者是從親戚那裡學會歌曲的。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Command of Evidence: Morrison strengthened Black author presence", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮中，人數一直維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "Both towns had some volunteers.", "C": "The table includes more than one year.", "D": "The program took place in a community."}, "optsZh": {"A": "與沒有這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "兩個城鎮都有一些志工。", "C": "這張表格包含不只一年的資料。", "D": "這項計畫在一個社區中進行。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Command of Evidence: cattle raised closer to settlements", "vocab": false, "body": "Archaeologist Petra Vaiglova, anthropologist Xinyi Liu, and their colleagues <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=domestication\" target=\"_blank\" rel=\"noopener\" data-w=\"domestication\" data-pos=\"n.\" data-en=\"the process of taming animals or plants for human use\" data-zh=\"馴化\">domestication<\/a> of farm animals in China during the Bronze Age (<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 2000 to 1000 BCE). By analyzing the chemical composition of the bones of sheep, goats, and cattle from this era, the team determined that wild plants made up the bulk of sheep’s and goats’ diets, while the cattle’s diet consisted largely of millet, a crop cultivated by humans. The team concluded that cattle were likely raised closer to human <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlements<\/a>, whereas sheep and goats were allowed to roam farther away.", "bodyPlain": "Archaeologist Petra Vaiglova, anthropologist Xinyi Liu, and their colleagues investigated the domestication of farm animals in China during the Bronze Age (approximately 2000 to 1000 BCE). By analyzing the chemical composition of the bones of sheep, goats, and cattle from this era, the team determined that wild plants made up the bulk of sheep’s and goats’ diets, while the cattle’s diet consisted largely of millet, a crop cultivated by humans. The team concluded that cattle were likely raised closer to human settlements, whereas sheep and goats were allowed to roam farther away.", "stem": "Which finding, if true, would most strongly support the team’s conclusion?", "stemZh": "如果屬實，哪一項發現最能支持研究團隊的結論？", "bodyZh": "考古學家 Petra Vaiglova、人類學家 Xinyi Liu 及其同事研究了青銅時代（約西元前 2000 年至 1000 年）中國農場動物的馴化。透過分析這個時期綿羊、山羊和牛骨頭的化學成分，研究團隊確定野生植物構成了綿羊和山羊飲食的大部分，而牛的飲食則主要是小米——一種由人類種植的作物。研究團隊的結論是，牛很可能被飼養在離人類聚落較近的地方，而綿羊和山羊則被放牧到較遠的地方。", "opts": {"A": "Analysis of the animal bones showed that the cattle’s diet also consisted of wheat, which humans widely cultivated in China during the Bronze Age.", "B": "Further investigation of sheep and goat bones revealed that their diets consisted of small portions of millet as well.", "C": "Cattle’s diets generally require larger amounts of food and a greater variety of nutrients than do sheep’s and goats’ diets.", "D": "The diets of sheep, goats, and cattle were found to vary based on what the farmers in each Bronze Age settlement could grow."}, "optsZh": {"A": "對動物骨頭的分析顯示，牛的飲食中也有小麥，而小麥是青銅時代中國人廣泛種植的作物。", "B": "對綿羊和山羊骨頭的進一步研究顯示，牠們的飲食中也有少量小米。", "C": "牛的飲食通常比綿羊和山羊的飲食需要更多的食物和更多樣的營養。", "D": "研究發現，綿羊、山羊和牛的飲食會因每個青銅時代聚落的農民能種植什麼而有所不同。"}, "answer": "A", "expl": "If cattle also ate wheat, another human-cultivated crop, that further suggests they were fed near human settlements.", "explZh": "如果牛也吃小麥這種人類種植的作物，就更顯示牛是在人類聚落附近被餵養的。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Command of Evidence: cattle raised closer to settlements", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一句引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人在上任的第一個月簽署了數項法令。」", "C": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且起伏不定的執政紀錄更加重要。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Command of Evidence: cattle raised closer to settlements", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。一張圖表顯示，女性農民占南部地區蔬菜種植者的 64%，但在北部和中部地區的穀物種植者中占不到 35%。哪一個敘述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "The graph contains information about three regions.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "有些農民種蔬菜，有些則種穀物。", "B": "女性在南部的蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不是。", "C": "這張圖表包含三個地區的資訊。", "D": "南部地區被納入了調查。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Command of Evidence: cattle raised closer to settlements", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "One rocky planet has a thin atmosphere.", "C": "The method used to study stars requires a telescope.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究發現有好幾顆岩質行星所含鐵的比例遠高於它們所環繞的恆星。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Command of Evidence: cattle raised closer to settlements", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一位民俗學者主張，某項傳統是透過近代的文化交流發展而成，而不只是從遙遠的國家原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Many performers learned songs from relatives.", "C": "The tradition is studied by scholars in several countries.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有些歌曲使用的韻律在較古老的歐洲詩歌中也可見到。", "B": "許多表演者是從親戚那裡學會歌曲的。", "C": "好幾個國家的學者都在研究這項傳統。", "D": "有幾首民謠包含了地方歷史事件，以及在不同社群持續接觸之後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Command of Evidence: cattle raised closer to settlements", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用了本文、表格、圖表、引文或研究中的證據？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮中，人數一直維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The program took place in a community.", "D": "The table includes more than one year."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "與沒有這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "這項計畫在一個社區中進行。", "D": "這張表格包含不只一年的資料。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Quantitative Evidence: DptB specific defense", "vocab": false, "body": "In a study of the evolution of DptA and DptB—Diptericin genes encoding antimicrobial peptides that combat pathogens and foster beneficial microbes in fruit flies (Drosophila)—researchers assessed Drosophila melanogaster <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resistance\" target=\"_blank\" rel=\"noopener\" data-w=\"resistance\" data-pos=\"n.\" data-en=\"a force that slows or opposes movement\" data-zh=\"阻力；抵抗\">resistance<\/a> to pathogenic infections by Providencia rettgeri and Acetobacter sicerae, bacteria common in the flies’ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a>. Subjects included flies identified by mutations silencing DptA, DptB, or both DptA and DptB (termed types A, B, and AB, respectively). In conjunction with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a> that resistance to P. rettgeri correlates with DptA activity but is not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a> affected by DptB activity, data in the graph of survival rates post-A. sicerae infection suggest that _______", "bodyPlain": "In a study of the evolution of DptA and DptB—Diptericin genes encoding antimicrobial peptides that combat pathogens and foster beneficial microbes in fruit flies (Drosophila)—researchers assessed Drosophila melanogaster resistance to pathogenic infections by Providencia rettgeri and Acetobacter sicerae, bacteria common in the flies’ environments. Subjects included flies identified by mutations silencing DptA, DptB, or both DptA and DptB (termed types A, B, and AB, respectively). In conjunction with the observation that resistance to P. rettgeri correlates with DptA activity but is not significantly affected by DptB activity, data in the graph of survival rates post-A. sicerae infection suggest that _______", "stem": "Which completion of the text is best supported by data in the graph?", "stemZh": "哪一個完成本文的選項最能得到圖表資料的支持？", "bodyZh": "在一項關於 DptA 和 DptB 演化的研究中（這兩個 Diptericin 基因編碼抗菌胜肽，能對抗病原體並促進果蠅〔Drosophila〕體內的有益微生物），研究人員評估了黑腹果蠅對 Providencia rettgeri 和 Acetobacter sicerae 這兩種果蠅環境中常見細菌的病原性感染的抵抗力。實驗對象包括經由突變使 DptA、DptB 或 DptA 和 DptB 兩者都失去作用的果蠅（分別稱為 A 型、B 型和 AB 型）。結合「對 P. rettgeri 的抵抗力與 DptA 的活性相關、但不受 DptB 活性顯著影響」這項觀察，圖中感染 A. sicerae 後的存活率資料顯示 _______", "opts": {"A": "DptA confers defense against A. sicerae regardless of the presence of DptB.", "B": "DptB protects against only one bacteria species, whereas DptA protects against multiple species.", "C": "DptB may have developed as a specific defense against A. sicerae.", "D": "defense against A. sicerae is strongest when both DptA and DptB are present."}, "optsZh": {"A": "無論有沒有 DptB，DptA 都能提供對 A. sicerae 的防禦。", "B": "DptB 只能防禦一種細菌，而 DptA 能防禦多種細菌。", "C": "DptB 可能是作為針對 A. sicerae 的專門防禦而演化出來的。", "D": "當 DptA 和 DptB 同時存在時，對 A. sicerae 的防禦力最強。"}, "answer": "C", "expl": "Resistance to P. rettgeri depends on DptA, not DptB, while the graph shows flies lacking DptB (types B and AB) survive A. sicerae poorly; so DptB may have developed specifically to defend against A. sicerae. (The graph is not reproduced in this text version.)", "explZh": "對 P. rettgeri 的抵抗力取決於 DptA 而非 DptB，而圖表顯示缺少 DptB 的果蠅（B 型和 AB 型）感染 A. sicerae 後存活率低，因此 DptB 可能是專門為對抗 A. sicerae 而演化出來的。（本文字版未附圖表。）"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Quantitative Evidence: DptB specific defense", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一句引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這位領導人在國家誕生過程中的象徵角色，比他短暫且起伏不定的執政紀錄更加重要。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Quantitative Evidence: DptB specific defense", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。一張圖表顯示，女性農民占南部地區蔬菜種植者的 64%，但在北部和中部地區的穀物種植者中占不到 35%。哪一個敘述最能運用圖表來支持關於地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The graph contains information about three regions.", "C": "The southern region was included in the survey.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "有些農民種蔬菜，有些則種穀物。", "B": "這張圖表包含三個地區的資訊。", "C": "南部地區被納入了調查。", "D": "女性在南部的蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不是。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Quantitative Evidence: DptB specific defense", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。天文學家主張，岩質行星所含的鐵絕不會比它們的母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "Some stars contain hydrogen and helium.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有一顆岩質行星擁有稀薄的大氣層。", "B": "研究發現有好幾顆岩質行星所含鐵的比例遠高於它們所環繞的恆星。", "C": "有些恆星含有氫和氦。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Quantitative Evidence: DptB specific defense", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。一位民俗學者主張，某項傳統是透過近代的文化交流發展而成，而不只是從遙遠的國家原封不動地傳入。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Some songs use a meter also found in older European poetry.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有幾首民謠包含了地方歷史事件，以及在不同社群持續接觸之後才出現的混合音樂形式。", "B": "有些歌曲使用的韻律在較古老的歐洲詩歌中也可見到。", "C": "好幾個國家的學者都在研究這項傳統。", "D": "許多表演者是從親戚那裡學會歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Quantitative Evidence: DptB specific defense", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮中，人數一直維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The table includes more than one year.", "D": "The program took place in a community."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "與沒有這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "這張表格包含不只一年的資料。", "D": "這項計畫在一個社區中進行。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: targeted invasive plant reduction", "vocab": false, "body": "Euphorbia esula (leafy spurge) is a Eurasian plant that has become invasive in North America, where it displaces native <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a> and sickens cattle. E. esula can be controlled with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> herbicides, but that approach can also kill harmless plants nearby. Recent research on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introducing<\/a> engineered DNA into plant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> to inhibit their reproduction may offer a path toward exclusively targeting E. esula, consequently _______", "bodyPlain": "Euphorbia esula (leafy spurge) is a Eurasian plant that has become invasive in North America, where it displaces native vegetation and sickens cattle. E. esula can be controlled with chemical herbicides, but that approach can also kill harmless plants nearby. Recent research on introducing engineered DNA into plant species to inhibit their reproduction may offer a path toward exclusively targeting E. esula, consequently _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "Euphorbia esula（乳漿大戟）是一種歐亞植物，已在北美成為入侵物種，它會排擠原生植被並使牛隻生病。乳漿大戟可以用化學除草劑控制，但這種方法也可能殺死附近無害的植物。近來關於把工程改造的 DNA 導入植物物種以抑制其繁殖的研究，可能為專門針對乳漿大戟提供一條途徑，從而 _______", "opts": {"A": "making individual E. esula plants more susceptible to existing chemical herbicides.", "B": "enhancing the ecological benefits of E. esula in North America.", "C": "enabling cattle to consume E. esula without becoming sick.", "D": "reducing invasive E. esula numbers without harming other organisms."}, "optsZh": {"A": "使個別的乳漿大戟植株更容易受到現有化學除草劑的影響。", "B": "增強乳漿大戟在北美的生態效益。", "C": "使牛隻能夠吃乳漿大戟而不會生病。", "D": "在不傷害其他生物的情況下減少入侵的乳漿大戟數量。"}, "answer": "D", "expl": "Herbicides also kill harmless plants, while engineered DNA could target only E. esula, so it would reduce E. esula without harming other organisms.", "explZh": "除草劑也會殺死無害的植物，而工程改造的 DNA 可以只針對乳漿大戟，因此能在不傷害其他生物的情況下減少它的數量。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: targeted invasive plant reduction", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任何一座島嶼的數千年前就已經從大陸族群中分化出來；因此，研究人員得出結論：______", "opts": {"A": "human traders must have transported the seeds recently.", "B": "the plant probably reached the islands without human assistance.", "C": "all island plants descended from a single cultivated variety.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "人類商人必定是在近期才運送這些種子的。", "B": "這種植物很可能是在沒有人類協助的情況下抵達這些島嶼的。", "C": "島上所有植物都源自同一個栽培品種。", "D": "島上的族群比大陸族群更早被馴化。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: targeted invasive plant reduction", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。有一種甲蟲同時分布在大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前很久就已經和海岸族群分開，因此研究團隊推論：______", "opts": {"A": "humans carried the beetles to the island during early trade voyages.", "B": "the island beetles must be younger than the coastal beetles.", "C": "the beetles were domesticated by island communities.", "D": "the beetles were likely introduced by natural dispersal rather than by humans."}, "optsZh": {"A": "人類在早期的貿易航行中把甲蟲帶到了島上。", "B": "島上的甲蟲必定比海岸的甲蟲年輕。", "C": "這些甲蟲是被島上的社群馴養的。", "D": "這些甲蟲很可能是透過自然擴散而非人類引進的。"}, "answer": "D", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: targeted invasive plant reduction", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。語言學家曾經提出，一首儀式歌曲是透過近代移民傳到某個群島的，但比較相關的口述傳統後發現，這首歌的核心詞句在移民發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "all versions of the song are identical.", "B": "the song was probably not introduced to the archipelago by that migration.", "C": "the song could not have changed after the migration.", "D": "the migration must have begun earlier than any other human movement."}, "optsZh": {"A": "這首歌的所有版本都完全相同。", "B": "這首歌很可能不是透過那次移民傳入群島的。", "C": "這首歌在移民之後不可能有所改變。", "D": "這次移民必定比任何其他人類遷徙更早開始。"}, "answer": "B", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: targeted invasive plant reduction", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。研究某座偏遠島嶼上一種作物的植物學家發現，這個島嶼品種在人類定居該島的數萬年前就已經和它在大陸上的近親分化。這項證據使他們主張：______", "opts": {"A": "human settlement probably did not account for the plant's original arrival on the island.", "B": "the crop was first domesticated on the island.", "C": "mainland farmers acquired the crop from island communities.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "這種植物最初來到島上，可能不是由人類定居造成的。", "B": "這種作物最初是在島上被馴化的。", "C": "大陸上的農民是從島上的社群取得這種作物的。", "D": "島上的品種在基因上必定與大陸上的野生植物完全相同。"}, "answer": "A", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: targeted invasive plant reduction", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。研究人員原本認為，一種淡水螺是在人們開始在一連串湖泊之間移動船隻時才到達那些湖泊的。然而，基因資料顯示，這些湖泊中的族群早在划船活動開始之前很久就已經彼此分開。因此，研究人員得出結論：______", "opts": {"A": "boats probably explain every modern snail population.", "B": "human activity made the populations genetically identical.", "C": "the snails likely spread through an earlier nonhuman mechanism.", "D": "the lakes did not contain snails until boating began."}, "optsZh": {"A": "船隻可能可以解釋現今所有的螺類族群。", "B": "人類活動使這些族群在基因上完全相同。", "C": "這些螺很可能是透過一種更早的、非人類的機制擴散的。", "D": "在划船活動開始之前，這些湖泊裡沒有螺。"}, "answer": "C", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Logical Completion: ELF3 temperature response", "vocab": false, "body": "A team of biologists led by Jae-Hoon Jung, Antonio D. Barbosa, and Stephanie Hutin <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> the mechanism that allows Arabidopsis thaliana (thale cress) plants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accelerate\" target=\"_blank\" rel=\"noopener\" data-w=\"accelerate\" data-pos=\"v.\" data-en=\"to happen faster or earlier\" data-zh=\"加速；提早\">accelerate<\/a> flowering at high <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>. They replaced the protein ELF3 in the plants with a similar protein found in another species (stiff brome) that, unlike A. thaliana, displays no acceleration in flowering with increased temperature. A comparison of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unmodified\" target=\"_blank\" rel=\"noopener\" data-w=\"unmodified\" data-pos=\"adj.\" data-en=\"not changed\" data-zh=\"未經改造的；未修改的\">unmodified<\/a> A. thaliana plants with the altered plants showed no difference in flowering at 22° Celsius, but at 27° Celsius, the unmodified plants exhibited accelerated flowering while the altered ones did not, which suggests that _______", "bodyPlain": "A team of biologists led by Jae-Hoon Jung, Antonio D. Barbosa, and Stephanie Hutin investigated the mechanism that allows Arabidopsis thaliana (thale cress) plants to accelerate flowering at high temperatures. They replaced the protein ELF3 in the plants with a similar protein found in another species (stiff brome) that, unlike A. thaliana, displays no acceleration in flowering with increased temperature. A comparison of unmodified A. thaliana plants with the altered plants showed no difference in flowering at 22° Celsius, but at 27° Celsius, the unmodified plants exhibited accelerated flowering while the altered ones did not, which suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "由 Jae-Hoon Jung、Antonio D.Barbosa 和 Stephanie Hutin 率領的生物學家團隊，研究了讓阿拉伯芥（Arabidopsis thaliana）在高溫下加速開花的機制。他們把植株中的 ELF3 蛋白質，替換成另一個物種（短柄草）中的類似蛋白質；與阿拉伯芥不同，該物種在溫度升高時並不會加速開花。比較未改造的阿拉伯芥與改造過的植株後發現，在攝氏 22 度時兩者開花沒有差異，但在攝氏 27 度時，未改造的植株加速開花，而改造過的植株沒有，這顯示 _______", "opts": {"A": "temperature-sensitive accelerated flowering is unique to A. thaliana.", "B": "A. thaliana increases ELF3 production as temperatures rise.", "C": "ELF3 enables A. thaliana to respond to increased temperatures.", "D": "temperatures of at least 22° Celsius are required for A. thaliana to flower."}, "optsZh": {"A": "對溫度敏感的加速開花現象是阿拉伯芥獨有的。", "B": "阿拉伯芥會隨著溫度上升而增加 ELF3 的產量。", "C": "ELF3 使阿拉伯芥能夠對溫度升高做出反應。", "D": "阿拉伯芥需要至少攝氏 22 度的溫度才能開花。"}, "answer": "C", "expl": "Plants with their own ELF3 flowered faster at 27°C, but plants with the substitute protein did not, which suggests ELF3 enables the temperature response.", "explZh": "保有自身 ELF3 的植株在 27°C 時加速開花，換成替代蛋白質的植株則沒有，顯示 ELF3 讓阿拉伯芥能對升溫做出反應。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Logical Completion: ELF3 temperature response", "vocab": false, "body": "
