<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 10, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>

  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: source of information", "vocab": true, "body": "The general store was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essential<\/a> to daily life in the rural United States during the 1800s because it provided the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=supplies\" target=\"_blank\" rel=\"noopener\" data-w=\"supplies\" data-pos=\"n.\" data-en=\"materials or things needed for a particular activity\" data-zh=\"用品；物資\">supplies<\/a> that the people living in nearby communities needed. Also, the store was a _______ of information. People <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=socialize\" target=\"_blank\" rel=\"noopener\" data-w=\"socialize\" data-pos=\"v.\" data-en=\"to spend time talking and being friendly with other people\" data-zh=\"交際；與人往來\">socializing<\/a> at the general store would share news and help spread it throughout their communities.", "bodyPlain": "The general store was essential to daily life in the rural United States during the 1800s because it provided the supplies that the people living in nearby communities needed. Also, the store was a _______ of information. People socializing at the general store would share news and help spread it throughout their communities.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "在 1800 年代的美國鄉村，雜貨店是日常生活中不可或缺的，因為它提供了附近社區居民所需的各種物資。此外，雜貨店也是資訊的 _______。在雜貨店裡交際的人們會分享消息，並幫助把消息傳遍整個社區。", "opts": {"A": "source", "B": "rival", "C": "condition", "D": "waste"}, "optsZh": {"A": "source（來源）", "B": "rival（對手）", "C": "condition（狀況、條件）", "D": "waste（浪費、廢物）"}, "answer": "A", "expl": "People shared news at the store and spread it through their communities, so the store was a source of information.", "explZh": "人們在雜貨店分享消息並把消息傳遍社區，所以雜貨店是資訊的來源（source）。", "defs": {"A": {"pos": "n.", "en": "a person, place, or thing that provides something, such as information", "zh": "來源；出處", "word": "source"}, "B": {"pos": "n.", "en": "a person or thing competing with another for the same goal", "zh": "對手；競爭者", "word": "rival"}, "C": {"pos": "n.", "en": "the state that something is in; a requirement", "zh": "狀況；條件", "word": "condition"}, "D": {"pos": "n.", "en": "something used carelessly or thrown away because it is no longer wanted", "zh": "浪費；廢物", "word": "waste"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: source of information", "vocab": true, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In many port cities, the coffeehouse was not merely a place to drink coffee; it was also a _______ of commercial intelligence, since merchants exchanged shipping news there before newspapers could print it.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In many port cities, the coffeehouse was not merely a place to drink coffee; it was also a _______ of commercial intelligence, since merchants exchanged shipping news there before newspapers could print it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。在許多港口城市，咖啡館不只是喝咖啡的地方；它也是商業情報的 _______，因為商人在報紙能刊登之前就在那裡交換航運消息。", "opts": {"A": "condition", "B": "rival", "C": "waste", "D": "source"}, "optsZh": {"A": "condition（狀況、條件）", "B": "rival（對手）", "C": "waste（浪費、廢物）", "D": "source（來源）"}, "answer": "D", "expl": "Source means origin or provider of information.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the state that something is in; a requirement", "zh": "狀況；條件", "word": "condition"}, "B": {"pos": "n.", "en": "a person or thing competing with another for the same goal", "zh": "對手；競爭者", "word": "rival"}, "C": {"pos": "n.", "en": "something used carelessly or thrown away because it is no longer wanted", "zh": "浪費；廢物", "word": "waste"}, "D": {"pos": "n.", "en": "a person, place, or thing that provides something, such as information", "zh": "來源；出處", "word": "source"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: source of information", "vocab": true, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Because elders met at the weaving house each evening to discuss harvests, marriages, and disputes, the building gradually became an important _______ of local knowledge.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Because elders met at the weaving house each evening to discuss harvests, marriages, and disputes, the building gradually became an important _______ of local knowledge.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。因為長老們每天傍晚都在織布屋聚會，討論收成、婚事和糾紛，這棟建築逐漸成為地方知識的重要 _______。", "opts": {"A": "condition", "B": "repository", "C": "rival", "D": "waste"}, "optsZh": {"A": "condition（狀況、條件）", "B": "repository（寶庫、儲藏處）", "C": "rival（對手）", "D": "waste（浪費、廢物）"}, "answer": "B", "expl": "Repository means a source or store of information.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the state that something is in; a requirement", "zh": "狀況；條件", "word": "condition"}, "B": {"pos": "n.", "en": "a place where things, especially information or knowledge, are stored", "zh": "寶庫；儲藏處", "word": "repository"}, "C": {"pos": "n.", "en": "a person or thing competing with another for the same goal", "zh": "對手；競爭者", "word": "rival"}, "D": {"pos": "n.", "en": "something used carelessly or thrown away because it is no longer wanted", "zh": "浪費；廢物", "word": "waste"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: source of information", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The archive served as a _______ for scholars studying migration, preserving letters, maps, and oral histories that would otherwise have disappeared.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The archive served as a _______ for scholars studying migration, preserving letters, maps, and oral histories that would otherwise have disappeared.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這座檔案館是研究移民的學者的 _______，保存了原本可能會消失的信件、地圖和口述歷史。", "opts": {"A": "resource", "B": "rival", "C": "waste", "D": "condition"}, "optsZh": {"A": "resource（資源）", "B": "rival（對手）", "C": "waste（浪費、廢物）", "D": "condition（狀況、條件）"}, "answer": "A", "expl": "Resource means source of useful information.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "something useful that people can draw on for help or information", "zh": "資源；可利用的來源", "word": "resource"}, "B": {"pos": "n.", "en": "a person or thing competing with another for the same goal", "zh": "對手；競爭者", "word": "rival"}, "C": {"pos": "n.", "en": "something used carelessly or thrown away because it is no longer wanted", "zh": "浪費；廢物", "word": "waste"}, "D": {"pos": "n.", "en": "the state that something is in; a requirement", "zh": "狀況；條件", "word": "condition"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: source of information", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Before radio broadcasts reached the valley, the weekly market functioned as the community&#x27;s main _______ for news about prices, weather, and politics.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Before radio broadcasts reached the valley, the weekly market functioned as the community's main _______ for news about prices, weather, and politics.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。在廣播傳到山谷之前，每週的市集是社區取得物價、天氣和政治消息的主要 _______。", "opts": {"A": "rival", "B": "waste", "C": "condition", "D": "conduit"}, "optsZh": {"A": "rival（對手）", "B": "waste（浪費、廢物）", "C": "condition（狀況、條件）", "D": "conduit（管道、傳遞途徑）"}, "answer": "D", "expl": "Conduit means channel or source through which information passes.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a person or thing competing with another for the same goal", "zh": "對手；競爭者", "word": "rival"}, "B": {"pos": "n.", "en": "something used carelessly or thrown away because it is no longer wanted", "zh": "浪費；廢物", "word": "waste"}, "C": {"pos": "n.", "en": "the state that something is in; a requirement", "zh": "狀況；條件", "word": "condition"}, "D": {"pos": "n.", "en": "a channel through which something, such as news or water, passes", "zh": "管道；傳遞途徑", "word": "conduit"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: source of information", "vocab": true, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The botanist&#x27;s field notebook became a crucial _______ for later researchers because it recorded plant locations that were never entered into official surveys.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The botanist's field notebook became a crucial _______ for later researchers because it recorded plant locations that were never entered into official surveys.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這位植物學家的野外筆記成為後來研究者的重要 _______，因為它記錄了從未登錄到官方調查中的植物位置。", "opts": {"A": "condition", "B": "rival", "C": "record", "D": "waste"}, "optsZh": {"A": "condition（狀況、條件）", "B": "rival（對手）", "C": "record（紀錄）", "D": "waste（浪費、廢物）"}, "answer": "C", "expl": "Record can mean a source of information.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the state that something is in; a requirement", "zh": "狀況；條件", "word": "condition"}, "B": {"pos": "n.", "en": "a person or thing competing with another for the same goal", "zh": "對手；競爭者", "word": "rival"}, "C": {"pos": "n.", "en": "a written or stored account of facts or events", "zh": "紀錄", "word": "record"}, "D": {"pos": "n.", "en": "something used carelessly or thrown away because it is no longer wanted", "zh": "浪費；廢物", "word": "waste"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: observant artist", "vocab": true, "body": "For painter Jacob Lawrence, being _______ was an important part of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artistic\" target=\"_blank\" rel=\"noopener\" data-w=\"artistic\" data-pos=\"adj.\" data-en=\"relating to art or artists; showing skill in art\" data-zh=\"藝術的；有藝術才能的\">artistic<\/a> process. Because he paid close attention to all the details of his Harlem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a>, Lawrence’s artwork captured nuances in the beauty and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vitality\" target=\"_blank\" rel=\"noopener\" data-w=\"vitality\" data-pos=\"n.\" data-en=\"energy, strength, and liveliness\" data-zh=\"活力；生命力\">vitality<\/a> of the Black <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a> during the Harlem Renaissance and the Great Migration.", "bodyPlain": "For painter Jacob Lawrence, being _______ was an important part of the artistic process. Because he paid close attention to all the details of his Harlem neighborhood, Lawrence’s artwork captured nuances in the beauty and vitality of the Black experience during the Harlem Renaissance and the Great Migration.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "對畫家 Jacob Lawrence 來說，保持 _______ 是藝術創作過程中很重要的一部分。因為他密切注意自己所住的 Harlem 社區的一切細節，Lawrence 的作品捕捉到了哈林文藝復興與黑人大遷徙時期黑人經驗之美與活力中的細微差異。", "opts": {"A": "skeptical", "B": "observant", "C": "critical", "D": "confident"}, "optsZh": {"A": "skeptical（懷疑的）", "B": "observant（善於觀察的）", "C": "critical（批判的、挑剔的）", "D": "confident（有自信的）"}, "answer": "B", "expl": "Lawrence 'paid close attention to all the details' of his neighborhood, so being observant was central to his process.", "explZh": "Lawrence「密切注意社區的一切細節」，所以善於觀察（observant）是他創作過程的核心。", "defs": {"A": {"pos": "adj.", "en": "doubting that something is true or useful", "zh": "懷疑的", "word": "skeptical"}, "B": {"pos": "adj.", "en": "good at noticing details", "zh": "善於觀察的；觀察入微的", "word": "observant"}, "C": {"pos": "adj.", "en": "expressing disapproval; finding faults", "zh": "批判的；挑剔的", "word": "critical"}, "D": {"pos": "adj.", "en": "feeling sure about yourself or your abilities", "zh": "有自信的", "word": "confident"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: observant artist", "vocab": true, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The illustrator&#x27;s city scenes feel unusually alive because she is intensely _______; even a half-open shop gate or a child&#x27;s chalk mark on the pavement becomes meaningful in her drawings.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The illustrator's city scenes feel unusually alive because she is intensely _______; even a half-open shop gate or a child's chalk mark on the pavement becomes meaningful in her drawings.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。這位插畫家的城市景象顯得格外生動，因為她極為 _______；即使是半開的店門或孩子在人行道上的粉筆痕跡，在她的畫中都變得意味深長。", "opts": {"A": "skeptical", "B": "confident", "C": "observant", "D": "critical"}, "optsZh": {"A": "skeptical（懷疑的）", "B": "confident（有自信的）", "C": "observant（善於觀察的）", "D": "critical（批判的、挑剔的）"}, "answer": "C", "expl": "Observant means carefully attentive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "doubting that something is true or useful", "zh": "懷疑的", "word": "skeptical"}, "B": {"pos": "adj.", "en": "feeling sure about yourself or your abilities", "zh": "有自信的", "word": "confident"}, "C": {"pos": "adj.", "en": "good at noticing details", "zh": "善於觀察的；觀察入微的", "word": "observant"}, "D": {"pos": "adj.", "en": "expressing disapproval; finding faults", "zh": "批判的；挑剔的", "word": "critical"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: observant artist", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. As a field journalist, Malik was especially _______ noticing changes in a witness&#x27;s tone and tiny inconsistencies in the layout of a room.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. As a field journalist, Malik was especially _______ noticing changes in a witness's tone and tiny inconsistencies in the layout of a room.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。身為一名現場記者，Malik 特別 _______ 察覺證人語氣的變化，以及房間擺設中微小的不一致之處。", "opts": {"A": "critical", "B": "skeptical", "C": "confident", "D": "attentive"}, "optsZh": {"A": "critical（批判的、挑剔的）", "B": "skeptical（懷疑的）", "C": "confident（有自信的）", "D": "attentive（專注的、留心的）"}, "answer": "D", "expl": "Attentive means observant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "expressing disapproval; finding faults", "zh": "批判的；挑剔的", "word": "critical"}, "B": {"pos": "adj.", "en": "doubting that something is true or useful", "zh": "懷疑的", "word": "skeptical"}, "C": {"pos": "adj.", "en": "feeling sure about yourself or your abilities", "zh": "有自信的", "word": "confident"}, "D": {"pos": "adj.", "en": "paying close attention", "zh": "專注的；留心的", "word": "attentive"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: observant artist", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The naturalist&#x27;s journals reveal how _______ she was: she recorded not only bird calls but also wind direction, cloud height, and the angle of shadows.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The naturalist's journals reveal how _______ she was: she recorded not only bird calls but also wind direction, cloud height, and the angle of shadows.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這位博物學家的日記顯示她有多麼 _______：她不僅記錄鳥鳴，也記錄風向、雲高和影子的角度。", "opts": {"A": "perceptive", "B": "confident", "C": "critical", "D": "skeptical"}, "optsZh": {"A": "perceptive（敏銳的、有洞察力的）", "B": "confident（有自信的）", "C": "critical（批判的、挑剔的）", "D": "skeptical（懷疑的）"}, "answer": "A", "expl": "Perceptive means observant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "quick to notice and understand things", "zh": "敏銳的；有洞察力的", "word": "perceptive"}, "B": {"pos": "adj.", "en": "feeling sure about yourself or your abilities", "zh": "有自信的", "word": "confident"}, "C": {"pos": "adj.", "en": "expressing disapproval; finding faults", "zh": "批判的；挑剔的", "word": "critical"}, "D": {"pos": "adj.", "en": "doubting that something is true or useful", "zh": "懷疑的", "word": "skeptical"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: observant artist", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Because the director was _______ she noticed that the actors&#x27; pauses changed when the set lighting was altered.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Because the director was _______ she noticed that the actors' pauses changed when the set lighting was altered.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。因為這位導演很 _______，她注意到當布景燈光改變時，演員停頓的方式也跟著改變。", "opts": {"A": "critical", "B": "watchful", "C": "skeptical", "D": "confident"}, "optsZh": {"A": "critical（批判的、挑剔的）", "B": "watchful（警覺的、留心觀察的）", "C": "skeptical（懷疑的）", "D": "confident（有自信的）"}, "answer": "B", "expl": "Watchful means observant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "expressing disapproval; finding faults", "zh": "批判的；挑剔的", "word": "critical"}, "B": {"pos": "adj.", "en": "carefully watching and noticing what happens", "zh": "警覺的；留心觀察的", "word": "watchful"}, "C": {"pos": "adj.", "en": "doubting that something is true or useful", "zh": "懷疑的", "word": "skeptical"}, "D": {"pos": "adj.", "en": "feeling sure about yourself or your abilities", "zh": "有自信的", "word": "confident"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: observant artist", "vocab": true, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The painter&#x27;s portraits depended on his being _______; he captured small gestures that revealed how his subjects wished to be seen.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The painter's portraits depended on his being _______; he captured small gestures that revealed how his subjects wished to be seen.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這位畫家的肖像畫有賴於他的 _______；他捕捉到能顯露畫中人物希望如何被看待的細微姿態。", "opts": {"A": "critical", "B": "confident", "C": "skeptical", "D": "discerning"}, "optsZh": {"A": "critical（批判的、挑剔的）", "B": "confident（有自信的）", "C": "skeptical（懷疑的）", "D": "discerning（有洞察力的、眼光敏銳的）"}, "answer": "D", "expl": "Discerning means observant and perceptive.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "expressing disapproval; finding faults", "zh": "批判的；挑剔的", "word": "critical"}, "B": {"pos": "adj.", "en": "feeling sure about yourself or your abilities", "zh": "有自信的", "word": "confident"}, "C": {"pos": "adj.", "en": "doubting that something is true or useful", "zh": "懷疑的", "word": "skeptical"}, "D": {"pos": "adj.", "en": "able to notice fine differences and judge well", "zh": "有洞察力的；眼光敏銳的", "word": "discerning"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: speculates about future habitats", "vocab": true, "body": "Former <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronaut\" target=\"_blank\" rel=\"noopener\" data-w=\"astronaut\" data-pos=\"n.\" data-en=\"a person trained to travel into space\" data-zh=\"太空人\">astronaut<\/a> Ellen Ochoa says that although she doesn’t have a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=definite\" target=\"_blank\" rel=\"noopener\" data-w=\"definite\" data-pos=\"adj.\" data-en=\"clear and certain; fixed\" data-zh=\"明確的；確定的\">definite<\/a> idea of when it might happen, she _______ that humans will someday need to be able to live in other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a> than those found on Earth. This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conjecture\" target=\"_blank\" rel=\"noopener\" data-w=\"conjecture\" data-pos=\"n.\" data-en=\"a guess or opinion based on incomplete information\" data-zh=\"推測\">conjecture<\/a> informs her interest in future research missions to the moon.", "bodyPlain": "Former astronaut Ellen Ochoa says that although she doesn’t have a definite idea of when it might happen, she _______ that humans will someday need to be able to live in other environments than those found on Earth. This conjecture informs her interest in future research missions to the moon.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "前太空人 Ellen Ochoa 表示，雖然她不確定何時會發生，但她 _______ 人類總有一天需要能夠在地球以外的環境中生活。這個推測影響了她對未來登月研究任務的興趣。", "opts": {"A": "demands", "B": "speculates", "C": "doubts", "D": "establishes"}, "optsZh": {"A": "demands（要求）", "B": "speculates（推測）", "C": "doubts（懷疑）", "D": "establishes（確立）"}, "answer": "B", "expl": "Ochoa has no definite idea of when it will happen, and the next sentence calls her view a 'conjecture,' so she speculates.", "explZh": "Ochoa 不確定何時會發生，下一句又把她的看法稱為「推測」（conjecture），所以她是在推測（speculates）。", "defs": {"A": {"pos": "v.", "en": "asks for something firmly, as if it is owed", "zh": "要求；強烈要求", "word": "demands"}, "B": {"pos": "v.", "en": "forms an opinion or guess without having firm evidence", "zh": "推測；揣測", "word": "speculates"}, "C": {"pos": "v.", "en": "feels unsure whether something is true", "zh": "懷疑；不相信", "word": "doubts"}, "D": {"pos": "v.", "en": "proves or shows something to be true; sets something up", "zh": "確立；證實；建立", "word": "establishes"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: speculates about future habitats", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The oceanographer cannot identify the exact decade when low-lying islands may become uninhabitable, but she _______ that communities will eventually need floating infrastructure.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The oceanographer cannot identify the exact decade when low-lying islands may become uninhabitable, but she _______ that communities will eventually need floating infrastructure.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。這位海洋學家無法確定低窪島嶼可能在哪個十年變得無法居住，但她 _______ 這些社區最終將需要漂浮式的基礎設施。", "opts": {"A": "demands", "B": "establishes", "C": "doubts", "D": "speculates"}, "optsZh": {"A": "demands（要求）", "B": "establishes（確立）", "C": "doubts（懷疑）", "D": "speculates（推測）"}, "answer": "D", "expl": "Speculates means conjectures.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "asks for something firmly, as if it is owed", "zh": "要求；強烈要求", "word": "demands"}, "B": {"pos": "v.", "en": "proves or shows something to be true; sets something up", "zh": "確立；證實；建立", "word": "establishes"}, "C": {"pos": "v.", "en": "feels unsure whether something is true", "zh": "懷疑；不相信", "word": "doubts"}, "D": {"pos": "v.", "en": "forms an opinion or guess without having firm evidence", "zh": "推測；揣測", "word": "speculates"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: speculates about future habitats", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Although the economist lacks complete employment data, he _______ that remote work will continue reshaping smaller cities for many years.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Although the economist lacks complete employment data, he _______ that remote work will continue reshaping smaller cities for many years.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。雖然這位經濟學家缺乏完整的就業資料，他 _______ 遠距工作在未來許多年將持續重塑較小的城市。", "opts": {"A": "doubts", "B": "conjectures", "C": "establishes", "D": "demands"}, "optsZh": {"A": "doubts（懷疑）", "B": "conjectures（推測）", "C": "establishes（確立）", "D": "demands（要求）"}, "answer": "B", "expl": "Conjectures means speculates.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "feels unsure whether something is true", "zh": "懷疑；不相信", "word": "doubts"}, "B": {"pos": "v.", "en": "forms an opinion based on incomplete information", "zh": "推測；臆測", "word": "conjectures"}, "C": {"pos": "v.", "en": "proves or shows something to be true; sets something up", "zh": "確立；證實；建立", "word": "establishes"}, "D": {"pos": "v.", "en": "asks for something firmly, as if it is owed", "zh": "要求；強烈要求", "word": "demands"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: speculates about future habitats", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The historian cautiously _______ that the unsigned diary may have belonged to a traveling nurse, but she notes that the evidence remains incomplete.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The historian cautiously _______ that the unsigned diary may have belonged to a traveling nurse, but she notes that the evidence remains incomplete.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這位歷史學家謹慎地 _______ 這本未署名的日記可能屬於一位巡迴護士，但她也指出證據仍不完整。", "opts": {"A": "establishes", "B": "demands", "C": "surmises", "D": "doubts"}, "optsZh": {"A": "establishes（確立）", "B": "demands（要求）", "C": "surmises（猜測、推斷）", "D": "doubts（懷疑）"}, "answer": "C", "expl": "Surmises means speculates.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "proves or shows something to be true; sets something up", "zh": "確立；證實；建立", "word": "establishes"}, "B": {"pos": "v.", "en": "asks for something firmly, as if it is owed", "zh": "要求；強烈要求", "word": "demands"}, "C": {"pos": "v.", "en": "supposes something is true without strong evidence", "zh": "猜測；推斷", "word": "surmises"}, "D": {"pos": "v.", "en": "feels unsure whether something is true", "zh": "懷疑；不相信", "word": "doubts"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: speculates about future habitats", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Without claiming certainty, the astronomer _______ that the planet&#x27;s unusual orbit may result from a distant companion star.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Without claiming certainty, the astronomer _______ that the planet's unusual orbit may result from a distant companion star.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。這位天文學家不敢斷言，但 _______ 這顆行星不尋常的軌道可能是由一顆遙遠的伴星造成的。", "opts": {"A": "doubts", "B": "establishes", "C": "demands", "D": "theorizes"}, "optsZh": {"A": "doubts（懷疑）", "B": "establishes（確立）", "C": "demands（要求）", "D": "theorizes（提出理論）"}, "answer": "D", "expl": "Theorizes means speculates.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "feels unsure whether something is true", "zh": "懷疑；不相信", "word": "doubts"}, "B": {"pos": "v.", "en": "proves or shows something to be true; sets something up", "zh": "確立；證實；建立", "word": "establishes"}, "C": {"pos": "v.", "en": "asks for something firmly, as if it is owed", "zh": "要求；強烈要求", "word": "demands"}, "D": {"pos": "v.", "en": "forms a theory or idea about why something happens", "zh": "提出理論；推論", "word": "theorizes"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: speculates about future habitats", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The biologist _______ that some deep-sea organisms communicate through chemical signals, though direct <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a> is still limited.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The biologist _______ that some deep-sea organisms communicate through chemical signals, though direct observation is still limited.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這位生物學家 _______ 有些深海生物透過化學訊號溝通，雖然直接觀察仍然有限。", "opts": {"A": "hypothesizes", "B": "establishes", "C": "demands", "D": "doubts"}, "optsZh": {"A": "hypothesizes（提出假設）", "B": "establishes（確立）", "C": "demands（要求）", "D": "doubts（懷疑）"}, "answer": "A", "expl": "Hypothesizes means speculates.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "proposes an explanation that can be tested", "zh": "提出假設；假定", "word": "hypothesizes"}, "B": {"pos": "v.", "en": "proves or shows something to be true; sets something up", "zh": "確立；證實；建立", "word": "establishes"}, "C": {"pos": "v.", "en": "asks for something firmly, as if it is owed", "zh": "要求；強烈要求", "word": "demands"}, "D": {"pos": "v.", "en": "feels unsure whether something is true", "zh": "懷疑；不相信", "word": "doubts"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: synchronization with host plant", "vocab": true, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=parasitic\" target=\"_blank\" rel=\"noopener\" data-w=\"parasitic\" data-pos=\"adj.\" data-en=\"living on or in another organism and taking food from it\" data-zh=\"寄生的\">parasitic<\/a> dodder plant increases its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reproductive\" target=\"_blank\" rel=\"noopener\" data-w=\"reproductive\" data-pos=\"adj.\" data-en=\"relating to producing young\" data-zh=\"繁殖的\">reproductive<\/a> success by flowering at the same time as the host plant it has latched onto. In 2020, Jianqiang Wu and his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that the tiny dodder achieves this _______ with its host by absorbing and utilizing a protein the host produces when it is about to flower.", "bodyPlain": "The parasitic dodder plant increases its reproductive success by flowering at the same time as the host plant it has latched onto. In 2020, Jianqiang Wu and his colleagues determined that the tiny dodder achieves this _______ with its host by absorbing and utilizing a protein the host produces when it is about to flower.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "寄生植物菟絲子藉由與它所攀附的宿主植物同時開花，來提高自己的繁殖成功率。2020 年，Jianqiang Wu 和他的同事確定，這種小小的菟絲子是藉由吸收並利用宿主即將開花時所產生的一種蛋白質，來達成與宿主的這種 _______。", "opts": {"A": "synchronization", "B": "hibernation", "C": "prediction", "D": "moderation"}, "optsZh": {"A": "synchronization（同步）", "B": "hibernation（冬眠）", "C": "prediction（預測）", "D": "moderation（節制、適度）"}, "answer": "A", "expl": "The dodder flowers 'at the same time as' its host, so what it achieves with the host is synchronization.", "explZh": "菟絲子與宿主「同時」開花，所以它與宿主達成的是同步（synchronization）。", "defs": {"A": {"pos": "n.", "en": "the act of making things happen at the same time", "zh": "同步；同時發生", "word": "synchronization"}, "B": {"pos": "n.", "en": "the state of an animal spending the winter in a deep sleep", "zh": "冬眠", "word": "hibernation"}, "C": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "D": {"pos": "n.", "en": "the quality of avoiding extremes", "zh": "節制；適度", "word": "moderation"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: synchronization with host plant", "vocab": true, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambrid
