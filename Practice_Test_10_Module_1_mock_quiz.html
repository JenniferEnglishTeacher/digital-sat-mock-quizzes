e-traditional/direct/?q=establish\" target=\"_blank\" rel=\"noopener\" data-w=\"establish\" data-pos=\"v.\" data-en=\"to create or set up something\" data-zh=\"建立\">established<\/a> in the poem’s opening lines (matla), _______ thematically and logically autonomous, resulting in a poem with “a stringently formal disunity.”", "bodyPlain": "The ghazal, a poetic form originating in seventh-century Arabic poetry, has an intricate structure. The twentieth-century Kashmiri American poet Agha Shahid Ali explains that each one of a ghazal’s couplets, while adhering to the patterns of rhyme (qafia) and refrain (radif) established in the poem’s opening lines (matla), _______ thematically and logically autonomous, resulting in a poem with “a stringently formal disunity.”", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "Ghazal（加扎勒）是一種起源於七世紀阿拉伯詩歌的詩體，結構精巧複雜。二十世紀的喀什米爾裔美國詩人 Agha Shahid Ali 解釋說，加扎勒的每一聯對句，雖然都遵循詩的開頭幾行（matla）所建立的押韻（qafia）和疊句（radif）模式，但在主題和邏輯上 _______ 各自獨立的，因而形成一首具有「嚴格形式上的不統一」的詩。", "opts": {"A": "is", "B": "were", "C": "have been", "D": "are"}, "optsZh": {"A": "is（單數動詞，與主詞 each one 一致：正確）", "B": "were（複數過去式 → 主詞 each one 為單數，且時態不符：錯誤）", "C": "have been（複數現在完成式 → 主詞 each one 為單數：錯誤）", "D": "are（複數動詞 → 主詞 each one 為單數，不一致：錯誤）"}, "answer": "A", "expl": "The subject is the singular 'each one,' and the sentence is in the present tense, so the singular present verb 'is' is required.", "explZh": "主詞是單數的 each one，且句子是現在式，所以要用單數現在式動詞 is。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Grammar: singular each one is", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。2022 年，研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在高酸性的水中存活。", "opts": {"A": "publishing", "B": "published", "C": "to publish", "D": "having published"}, "optsZh": {"A": "publishing（現在分詞 → 句子缺少主要動詞：錯誤）", "B": "published（過去式動詞，作句子的主要動詞：正確）", "C": "to publish（不定詞 → 句子缺少主要動詞：錯誤）", "D": "having published（完成式分詞 → 句子缺少主要動詞：錯誤）"}, "answer": "B", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Grammar: singular each one is", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。這個古董音樂盒看起來只是裝飾品，但轉動把手時，______ 內部的針會撥動細小的金屬齒片，奏出旋律。", "opts": {"A": "device--", "B": "device,", "C": "device", "D": "device:"}, "optsZh": {"A": "device--（破折號 → 不當隔開主詞與動詞：錯誤）", "B": "device,（逗號 → 不當隔開主詞與動詞：錯誤）", "C": "device（不加標點：名詞直接接動詞 strike）", "D": "device:（冒號 → 前面不是完整句子，且隔開主詞與動詞：錯誤）"}, "answer": "C", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Grammar: singular each one is", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。袖珍計算機剛出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "it", "B": "that", "C": "this", "D": "them"}, "optsZh": {"A": "it（它 → 單數代名詞，與複數 devices 不一致：錯誤）", "B": "that（那個 → 單數代名詞，與複數 devices 不一致：錯誤）", "C": "this（這個 → 單數代名詞，與複數 devices 不一致：錯誤）", "D": "them（它們，複數受格代名詞，指 devices：正確）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Grammar: singular each one is", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。Isabel Allende 的小說《The House of the Spirits》（精靈之屋）是一部以 Trueba _______ 為中心的家族史詩，常常是讀者接觸拉丁美洲文學中魔幻寫實主義的入門作品。", "opts": {"A": "family", "B": "family and", "C": "family,", "D": "family, and"}, "optsZh": {"A": "family（不加逗號 → 同位語 a family saga… 沒有結束，主詞與動詞未正確分隔）", "B": "family and（加 and → 造成句子結構錯誤：錯誤）", "C": "family,（逗號：結束同位語 a family saga…，再接動詞 introduces）", "D": "family, and（逗號＋and → 句子缺少主要動詞的主詞：錯誤）"}, "answer": "A", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Grammar: singular each one is", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使本文符合標準英文的用法？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這艘擱淺的研究船花了三天才 _______ 它的船身卡在兩層冰棚之間。", "opts": {"A": "free, in part because,", "B": "free. In part because", "C": "free, in part because:", "D": "free in part because"}, "optsZh": {"A": "free, in part because,（because 後加逗號 → 不當隔開連接詞與子句：錯誤）", "B": "free. In part because（句號 → 後面的 because 子句成為不完整句）", "C": "free, in part because:（because 後加冒號：錯誤）", "D": "free in part because（不加標點，because 子句直接修飾 free）"}, "answer": "B", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transition: for example introduces adaptation", "vocab": false, "body": "Organisms have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evolve\" target=\"_blank\" rel=\"noopener\" data-w=\"evolve\" data-pos=\"v.\" data-en=\"to change gradually over a long time\" data-zh=\"演化；逐步發展\">evolved<\/a> a number of surprising adaptations to ensure their survival in adverse <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state that something is in; a requirement\" data-zh=\"狀況；條件\">conditions<\/a>. Tadpole shrimp (Triops longicaudatus) <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=embryo\" target=\"_blank\" rel=\"noopener\" data-w=\"embryo\" data-pos=\"n.\" data-en=\"an animal or plant in the earliest stage of development\" data-zh=\"胚胎\">embryos<\/a>, ______ can pause development for over ten years during extended periods of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=drought\" target=\"_blank\" rel=\"noopener\" data-w=\"drought\" data-pos=\"n.\" data-en=\"a long period with little or no rain\" data-zh=\"乾旱\">drought<\/a>.", "bodyPlain": "Organisms have evolved a number of surprising adaptations to ensure their survival in adverse conditions. Tadpole shrimp (Triops longicaudatus) embryos, ______ can pause development for over ten years during extended periods of drought.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "生物已經演化出許多令人驚訝的適應能力，以確保自己在惡劣環境中生存。______ 蝌蚪蝦（Triops longicaudatus）的胚胎在長期乾旱期間可以暫停發育長達十年以上。", "opts": {"A": "in contrast,", "B": "for example,", "C": "meanwhile,", "D": "consequently,"}, "optsZh": {"A": "in contrast,（相反地：表對比）", "B": "for example,（例如：舉例）", "C": "meanwhile,（同時：表同時發生）", "D": "consequently,（因此：表結果）"}, "answer": "B", "expl": "Tadpole shrimp embryos pausing development during drought is an example of a surprising adaptation, so 'for example' fits.", "explZh": "蝌蚪蝦胚胎在乾旱時暫停發育，是「令人驚訝的適應能力」的一個例子，所以用 for example。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transition: for example introduces adaptation", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Many desert animals have adaptations that help them conserve water during dry seasons. _______ kangaroo rats produce highly concentrated urine, reducing the amount of water they lose.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Many desert animals have adaptations that help them conserve water during dry seasons. _______ kangaroo rats produce highly concentrated urine, reducing the amount of water they lose.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。許多沙漠動物具有幫助牠們在乾季保存水分的適應特徵。_______ 更格盧鼠會產生高度濃縮的尿液，減少水分的流失。", "opts": {"A": "For example,", "B": "Meanwhile,", "C": "Nevertheless,", "D": "Consequently,"}, "optsZh": {"A": "For example,（例如：舉例）", "B": "Meanwhile,（同時：表同時發生）", "C": "Nevertheless,（儘管如此：表讓步轉折）", "D": "Consequently,（因此：表結果）"}, "answer": "A", "expl": "For example introduces a specific adaptation.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transition: for example introduces adaptation", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Several architectural features helped ancient houses remain cool without modern air-conditioning. _______ thick walls absorbed heat during the day and released it slowly at night.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Several architectural features helped ancient houses remain cool without modern air-conditioning. _______ thick walls absorbed heat during the day and released it slowly at night.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。數種建築特色幫助古代房屋在沒有現代空調的情況下保持涼爽。_______ 厚實的牆壁在白天吸收熱量，並在夜間緩慢釋放。", "opts": {"A": "Meanwhile,", "B": "For example,", "C": "Consequently,", "D": "Nevertheless,"}, "optsZh": {"A": "Meanwhile,（同時：表同時發生）", "B": "For example,（例如：舉例）", "C": "Consequently,（因此：表結果）", "D": "Nevertheless,（儘管如此：表讓步轉折）"}, "answer": "B", "expl": "For example gives an illustration.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transition: for example introduces adaptation", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some insects survive cold winters by entering states of suspended development. _______ certain beetle larvae slow their metabolism until spring temperatures rise.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some insects survive cold winters by entering states of suspended development. _______ certain beetle larvae slow their metabolism until spring temperatures rise.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。有些昆蟲藉由進入暫停發育的狀態來度過寒冷的冬天。_______ 某些甲蟲幼蟲會減緩新陳代謝，直到春天氣溫回升。", "opts": {"A": "Meanwhile,", "B": "Consequently,", "C": "For example,", "D": "Nevertheless,"}, "optsZh": {"A": "Meanwhile,（同時：表同時發生）", "B": "Consequently,（因此：表結果）", "C": "For example,（例如：舉例）", "D": "Nevertheless,（儘管如此：表讓步轉折）"}, "answer": "C", "expl": "For example introduces a representative case.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transition: for example introduces adaptation", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Artists have long used ordinary materials to create surprising textures. _______ some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> painters mix sand into pigments before applying them to canvas.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Artists have long used ordinary materials to create surprising textures. _______ some contemporary painters mix sand into pigments before applying them to canvas.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。藝術家長久以來一直使用普通材料創造出令人驚喜的質感。_______ 一些當代畫家會先把沙子混入顏料，再塗到畫布上。", "opts": {"A": "Nevertheless,", "B": "Meanwhile,", "C": "Consequently,", "D": "For example,"}, "optsZh": {"A": "Nevertheless,（儘管如此：表讓步轉折）", "B": "Meanwhile,（同時：表同時發生）", "C": "Consequently,（因此：表結果）", "D": "For example,（例如：舉例）"}, "answer": "D", "expl": "For example gives a specific instance.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transition: for example introduces adaptation", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Several plant species can recover after wildfire. _______ some pines release seeds only after heat opens their cones.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Several plant species can recover after wildfire. _______ some pines release seeds only after heat opens their cones.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。有幾種植物能在野火後恢復。_______ 有些松樹只有在高溫使毬果打開後才會釋放種子。", "opts": {"A": "For example,", "B": "Consequently,", "C": "Nevertheless,", "D": "Meanwhile,"}, "optsZh": {"A": "For example,（例如：舉例）", "B": "Consequently,（因此：表結果）", "C": "Nevertheless,（儘管如此：表讓步轉折）", "D": "Meanwhile,（同時：表同時發生）"}, "answer": "A", "expl": "For example introduces an adaptation.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transition: previously marks earlier Oscar history", "vocab": false, "body": "When Chinese <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=director\" target=\"_blank\" rel=\"noopener\" data-w=\"director\" data-pos=\"n.\" data-en=\"the person who controls how a film or play is made\" data-zh=\"導演；主任\">director<\/a> Chloé Zhao <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accept\" target=\"_blank\" rel=\"noopener\" data-w=\"accept\" data-pos=\"v.\" data-en=\"to take something that is offered, such as an award\" data-zh=\"接受；領受\">accepted<\/a> the Oscar in 2021 for her film Nomadland, she made Academy Award <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=history\" target=\"_blank\" rel=\"noopener\" data-w=\"history\" data-pos=\"n.\" data-en=\"the study or record of past events\" data-zh=\"歷史\">history<\/a>. _______ only one other woman, Kathryn Bigelow of the United States, had been named best director at the Oscars, making Zhao the second woman and the first Asian woman to win the award.", "bodyPlain": "When Chinese director Chloé Zhao accepted the Oscar in 2021 for her film Nomadland, she made Academy Award history. _______ only one other woman, Kathryn Bigelow of the United States, had been named best director at the Oscars, making Zhao the second woman and the first Asian woman to win the award.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "華裔導演趙婷（Chloé Zhao）在 2021 年以電影《Nomadland》（游牧人生）獲得奧斯卡獎時，創下了奧斯卡的歷史紀錄。_______ 只有另一位女性——美國的 Kathryn Bigelow——曾在奧斯卡獲頒最佳導演，這使趙婷成為第二位獲得此獎的女性，也是第一位獲獎的亞洲女性。", "opts": {"A": "As a result,", "B": "Previously,", "C": "However,", "D": "Likewise,"}, "optsZh": {"A": "As a result,（因此：表結果）", "B": "Previously,（先前：指事件之前的情況）", "C": "However,（然而：表轉折）", "D": "Likewise,（同樣地：表相似）"}, "answer": "B", "expl": "The sentence describes what had happened before Zhao's win—only one other woman had won—so 'Previously' fits.", "explZh": "這句描述趙婷獲獎之前的情況——只有另一位女性得過此獎——所以用 Previously（先前）。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transition: previously marks earlier Oscar history", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. When Maria Ressa received the Nobel Peace Prize in 2021, she became the first journalist from the Philippines to receive the award. _______ no Filipino journalist had been named a Nobel laureate.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. When Maria Ressa received the Nobel Peace Prize in 2021, she became the first journalist from the Philippines to receive the award. _______ no Filipino journalist had been named a Nobel laureate.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。Maria Ressa 在 2021 年獲得諾貝爾和平獎時，成為第一位獲得此獎的菲律賓記者。_______ 從來沒有菲律賓記者成為諾貝爾獎得主。", "opts": {"A": "As a result,", "B": "Likewise,", "C": "However,", "D": "Previously,"}, "optsZh": {"A": "As a result,（因此：表結果）", "B": "Likewise,（同樣地：表相似）", "C": "However,（然而：表轉折）", "D": "Previously,（先前：指事件之前的情況）"}, "answer": "D", "expl": "Previously marks earlier history.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transition: previously marks earlier Oscar history", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The 1999 mission made history when Eileen Collins commanded a space shuttle. _______ women had served as shuttle pilots, but none had led a shuttle mission.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The 1999 mission made history when Eileen Collins commanded a space shuttle. _______ women had served as shuttle pilots, but none had led a shuttle mission.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。1999 年的任務創下歷史，因為 Eileen Collins 指揮了一架太空梭。_______ 曾有女性擔任太空梭駕駛員，但沒有人領導過太空梭任務。", "opts": {"A": "Likewise,", "B": "However,", "C": "Previously,", "D": "As a result,"}, "optsZh": {"A": "Likewise,（同樣地：表相似）", "B": "However,（然而：表轉折）", "C": "Previously,（先前：指事件之前的情況）", "D": "As a result,（因此：表結果）"}, "answer": "C", "expl": "Previously refers to the time before the event.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transition: previously marks earlier Oscar history", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The museum&#x27;s 2024 acquisition was unprecedented: it was the first time the institution purchased a work by the sculptor. _______ her pieces had entered the collection only through temporary loans.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The museum's 2024 acquisition was unprecedented: it was the first time the institution purchased a work by the sculptor. _______ her pieces had entered the collection only through temporary loans.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這座博物館 2024 年的收購是前所未有的：這是該館第一次購買這位雕塑家的作品。_______ 她的作品只透過短期借展進入館藏。", "opts": {"A": "Likewise,", "B": "Previously,", "C": "However,", "D": "As a result,"}, "optsZh": {"A": "Likewise,（同樣地：表相似）", "B": "Previously,（先前：指事件之前的情況）", "C": "However,（然而：表轉折）", "D": "As a result,（因此：表結果）"}, "answer": "B", "expl": "Previously contrasts earlier conditions with the new event.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transition: previously marks earlier Oscar history", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. When the court issued its decision, it changed a long-standing rule. _______ judges had treated the issue as a matter for local governments.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. When the court issued its decision, it changed a long-standing rule. _______ judges had treated the issue as a matter for local governments.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。法院發布判決時，改變了一項由來已久的規定。_______ 法官們一直把這個問題視為地方政府的事務。", "opts": {"A": "As a result,", "B": "Previously,", "C": "Likewise,", "D": "However,"}, "optsZh": {"A": "As a result,（因此：表結果）", "B": "Previously,（先前：指事件之前的情況）", "C": "Likewise,（同樣地：表相似）", "D": "However,（然而：表轉折）"}, "answer": "B", "expl": "Previously describes the former situation.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transition: previously marks earlier Oscar history", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The orchestra&#x27;s appointment of its new conductor marked a milestone. _______ all of its music directors had come from outside the region.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The orchestra's appointment of its new conductor marked a milestone. _______ all of its music directors had come from outside the region.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這個管弦樂團任命新指揮是一個里程碑。_______ 該團所有的音樂總監都來自外地。", "opts": {"A": "Previously,", "B": "As a result,", "C": "Likewise,", "D": "However,"}, "optsZh": {"A": "Previously,（先前：指事件之前的情況）", "B": "As a result,（因此：表結果）", "C": "Likewise,（同樣地：表相似）", "D": "However,（然而：表轉折）"}, "answer": "A", "expl": "Previously marks what had been true before.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transition: hence introduces conclusion", "vocab": false, "body": "If the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=formation\" target=\"_blank\" rel=\"noopener\" data-w=\"formation\" data-pos=\"n.\" data-en=\"the process by which something is formed\" data-zh=\"形成\">formation<\/a> of Earth’s mantle had been purely a product of core differentiation—whereby heavier elements sink toward the core and lighter elements rise—the upper mantle would be depleted of heavy siderophile elements. Siderophiles are much more abundant in the mantle than predicted in that model, however. _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extraterrestrial\" target=\"_blank\" rel=\"noopener\" data-w=\"extraterrestrial\" data-pos=\"adj.\" data-en=\"coming from or existing outside Earth\" data-zh=\"地球以外的；外星的\">extraterrestrial<\/a> material <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">containing<\/a> siderophiles, likely from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=asteroid\" target=\"_blank\" rel=\"noopener\" data-w=\"asteroid\" data-pos=\"n.\" data-en=\"a small rocky object that orbits the Sun\" data-zh=\"小行星\">asteroid<\/a> or comet impacts, almost certainly accreted to Earth following core differentiation.", "bodyPlain": "If the formation of Earth’s mantle had been purely a product of core differentiation—whereby heavier elements sink toward the core and lighter elements rise—the upper mantle would be depleted of heavy siderophile elements. Siderophiles are much more abundant in the mantle than predicted in that model, however. _______ extraterrestrial material containing siderophiles, likely from asteroid or comet impacts, almost certainly accreted to Earth following core differentiation.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "如果地函的形成純粹是核心分異作用的產物——也就是較重的元素沉向核心、較輕的元素上升——那麼上部地函中應該會缺乏重的親鐵元素。然而，地函中親鐵元素的含量比該模型所預測的多得多。_______ 含有親鐵元素的地外物質（很可能來自小行星或彗星的撞擊）幾乎可以確定是在核心分異之後才累積到地球上的。", "opts": {"A": "That said,", "B": "Hence,", "C": "For example,", "D": "Likewise,"}, "optsZh": {"A": "That said,（話雖如此：表讓步轉折）", "B": "Hence,（因此：引出結論）", "C": "For example,（例如：舉例）", "D": "Likewise,（同樣地：表相似）"}, "answer": "B", "expl": "Because siderophiles are more abundant than the core-differentiation model predicts, it follows that extraterrestrial material must have added them; 'Hence' introduces this conclusion.", "explZh": "因為親鐵元素比核心分異模型預測的多，由此推論必定有地外物質把它們帶來；Hence 引出這個結論。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transition: hence introduces conclusion", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The soil samples contained much more nickel than the local bedrock could have supplied. _______ material from meteorites or industrial fallout must have entered the site after the bedrock formed.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The soil samples contained much more nickel than the local bedrock could have supplied. _______ material from meteorites or industrial fallout must have entered the site after the bedrock formed.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。數年的野外觀察使先前對某一自然現象的解釋變得更加複雜，研究人員現在描述這個情況時，態度謹慎多於確定。他們的報告把初步測量結果與較舊的假設加以比較，並強調詮釋在多大程度上取決於在不同季節和地點蒐集到、不完整卻具啟發性的證據。土壤樣本中所含的鎳遠多於當地基岩所能提供的量。_______ 來自隕石或工業落塵的物質必定是在基岩形成之後才進入該地點的。", "opts": {"A": "That said,", "B": "For example,", "C": "Hence,", "D": "Likewise,"}, "optsZh": {"A": "That said,（話雖如此：表讓步轉折）", "B": "For example,（例如：舉例）", "C": "Hence,（因此：引出結論）", "D": "Likewise,（同樣地：表相似）"}, "answer": "C", "expl": "Hence introduces a conclusion.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transition: hence introduces conclusion", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The manuscript uses paper produced decades after the poet&#x27;s death. _______ the document cannot be the original draft scholars once believed it to be.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The manuscript uses paper produced decades after the poet's death. _______ the document cannot be the original draft scholars once believed it to be.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一間地區檔案館最近取得了一批信件、地圖和照片，改變了歷史學家對某項公共工程的理解。由於紀錄零散不全，學者們必須把多個來源中的零碎證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何長期被忽視。這份手稿所用的紙張是在這位詩人去世數十年後才製造的。_______ 這份文件不可能是學者們曾經以為的原始草稿。", "opts": {"A": "That said,", "B": "Likewise,", "C": "For example,", "D": "Hence,"}, "optsZh": {"A": "That said,（話雖如此：表讓步轉折）", "B": "Likewise,（同樣地：表相似）", "C": "For example,（例如：舉例）", "D": "Hence,（因此：引出結論）"}, "answer": "D", "expl": "Hence states the logical implication.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transition: hence introduces conclusion", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The lake&#x27;s deepest sediments contain pollen from crops not grown in the region until the nineteenth century. _______ the layer cannot date from the medieval period.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The lake's deepest sediments contain pollen from crops not grown in the region until the nineteenth century. _______ the layer cannot date from the medieval period.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品取材自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人的決定、材料、觀眾和機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品視為孤立的成就。這座湖最深處的沉積物中含有某些作物的花粉，而這些作物直到十九世紀才在該地區種植。_______ 這一層不可能是中世紀時期的。", "opts": {"A": "Likewise,", "B": "Hence,", "C": "That said,", "D": "For example,"}, "optsZh": {"A": "Likewise,（同樣地：表相似）", "B": "Hence,（因此：引出結論）", "C": "That said,（話雖如此：表讓步轉折）", "D": "For example,（例如：舉例）"}, "answer": "B", "expl": "Hence introduces the conclusion from evidence.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transition: hence introduces conclusion", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The alloy contains elements that were unavailable to local metalworkers at the time. _______ the ornament was likely imported rather than made in the village.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The alloy contains elements that were unavailable to local metalworkers at the time. _______ the ornament was likely imported rather than made in the village.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用權的幾種做法。報告把個別例子與更廣泛的模式連結起來，顯示政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其當不同社區對同一政策有不同體驗時更是如此。這種合金含有當時當地金屬工匠無法取得的元素。_______ 這件飾品很可能是進口的，而不是在村裡製作的。", "opts": {"A": "Hence,", "B": "That said,", "C": "For example,", "D": "Likewise,"}, "optsZh": {"A": "Hence,（因此：引出結論）", "B": "That said,（話雖如此：表讓步轉折）", "C": "For example,（例如：舉例）", "D": "Likewise,（同樣地：表相似）"}, "answer": "A", "expl": "Hence signals a conclusion.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transition: hence introduces conclusion", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The inscriptions share several spelling errors with a known printed edition. _______ they were probably copied from that edition rather than from an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> manuscript.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The inscriptions share several spelling errors with a known printed edition. _______ they were probably copied from that edition rather than from an independent manuscript.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項以最合乎邏輯的轉折語完成本文？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。在一項實驗室研究中，研究人員追蹤一個多階段的過程，發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比資料所支持的範圍更廣。這些銘文和一個已知的印刷版本有好幾處相同的拼字錯誤。_______ 它們很可能是從那個版本抄來的，而不是從一份獨立的手稿抄來的。", "opts": {"A": "Hence,", "B": "Likewise,", "C": "That said,", "D": "For example,"}, "optsZh": {"A": "Hence,（因此：引出結論）", "B": "Likewise,（同樣地：表相似）", "C": "That said,（話雖如此：表讓步轉折）", "D": "For example,（例如：舉例）"}, "answer": "A", "expl": "Hence introduces the inference.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: present Quanhucun cat study", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In 2013, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> studied cat bone <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragments<\/a> they had found in the ruins of Quanhucun, a Chinese farming village.<br>- The fragments were estimated to be 5,300 years old.<br>- A chemical analysis of the fragments revealed that the cats had consumed large amounts of grain.<br>- The grain <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumption\" target=\"_blank\" rel=\"noopener\" data-w=\"consumption\" data-pos=\"n.\" data-en=\"the amount of something that is used\" data-zh=\"使用量；消耗\">consumption<\/a> is evidence that the Quanhucun cats may have been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=domesticated\" target=\"_blank\" rel=\"noopener\" data-w=\"domesticated\" data-pos=\"adj.\" data-en=\"(of animals) tamed and kept by humans\" data-zh=\"馴化的；家養的\">domesticated<\/a>.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In 2013, archaeologists studied cat bone fragments they had found in the ruins of Quanhucun, a Chinese farming village.\n- The fragments were estimated to be 5,300 years old.\n- A chemical analysis of the fragments revealed that the cats had consumed large amounts of grain.\n- The grain consumption is evidence that the Quanhucun cats may have been domesticated.", "stem": "The student wants to present the Quanhucun study and its conclusions. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要介紹泉護村研究及其結論。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 2013 年，考古學家研究了他們在泉護村（Quanhucun，一個中國農村）遺址中發現的貓骨碎片。\n- 這些碎片估計有 5,300 年的歷史。\n- 對碎片進行的化學分析顯示，這些貓曾吃下大量穀物。\n- 食用穀物的現象證明泉護村的貓可能已經被馴化。", "opts": {"A": "As part of a 2013 study of cat domestication, a chemical analysis was conducted on cat bone fragments found in Quanhucun, China.", "B": "A 2013 analysis of cat bone fragments found in Quanhucun, China, suggests that cats there may have been domesticated 5,300 years ago.", "C": "In 2013, archaeologists studied what cats in Quanhucun, China, had eaten more than 5,000 years ago.", "D": "Cat bone fragments estimated to be 5,300 years old were found in Quanhucun,
