pected if plants were randomly distributed.", "generated": [{"id": "15.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A table shows that 68% of seedlings near shrubs survived, compared with 22% in open ground.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) Seedling survival was much higher near shrubs than in open ground.\nB) Shrubs were counted before seedlings.\nC) Some seedlings grew in open ground.\nD) The table includes two habitats.", "answer": "A", "explanation": "The comparison directly supports the claim."}, {"id": "15.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A useful interpretation of the data will do more than repeat one value from the table. It will identify the relevant relationship among values, such as which figure is highest, which category changes most, or which comparison fits the claim being made. A table lists known plays by three writers: Lee 12, Ortiz 9, and Khan 15. The text says many records are missing, so these numbers are minimums. Which completion uses the table effectively?\n\nWhich choice most effectively uses or describes data from the table?\n\nA) Ortiz definitely wrote exactly 9 plays.\nB) Lee wrote fewer plays than no other writer.\nC) Khan may have written more than 15 plays, and Lee more than 12.\nD) The table proves no records are missing.", "answer": "C", "explanation": "Minimums can be lower than the true totals."}, {"id": "15.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The evidence depends on careful attention to percentages, totals, rankings, and whether a number represents a minimum, maximum, average, or exact count. Some options may quote accurate figures while still drawing a conclusion that the table does not support. A table shows museum visits rose from 14,000 to 21,000 after free Friday evenings began.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) The museum is open on Fridays.\nB) Visits increased by 7,000 after the program began.\nC) Some visitors came on weekends.\nD) The table lists two years.", "answer": "B", "explanation": "The increase supports the program's effect."}, {"id": "15.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The direction of the evidence matters: higher versus lower, earlier versus later, more frequent versus less frequent, or total versus proportional. A table shows that four bird species nested more often in restored marshes than in unrestored marshes.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) Each species had more nests in restored marshes.\nB) The marshes were near a river.\nC) One species had only 6 nests total.\nD) The study counted birds in spring.", "answer": "A", "explanation": "All species show the same beneficial pattern."}, {"id": "15.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The table should be interpreted as part of the argument, not as an independent math exercise. The strongest completion uses the data to clarify the claim while avoiding comparisons that ignore a category, reverse a trend, or exaggerate the size of a difference. A table shows that students using spaced practice remembered 82% of words, while those cramming remembered 49%.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) Some words were difficult.\nB) Both groups studied vocabulary.\nC) The cramming group took the same test.\nD) The spaced-practice group remembered a larger share of words.", "answer": "D", "explanation": "The percentage comparison directly supports the claim."}]}, {"n": 16, "concept": "Command of Evidence: choose a finding that strengthens a scientific hypothesis.", "original": "In the mountains of Brazil, Barbacenia tomentosa and Barbacenia macrantha establish themselves on soilless, nutrient-poor patches of quartzite rock. Researchers found that the plants' roots grow directly into quartzite and have fine hairs that secrete malic and citric acids. The researchers hypothesize that the plants depend on dissolving underlying rock with these acids because doing so creates channels for continued growth and releases phosphates that provide phosphorus.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?\nA) Other species in the Velloziaceae family are found in terrains with more soil but have root structures similar to those of B. tomentosa and B. macrantha.\nB) Though B. tomentosa and B. macrantha both secrete citric and malic acids, each species produces the acids in different proportions.\nC) The roots of B. tomentosa and B. macrantha carve new entry points into rocks even when cracks in the surface are readily available.\nD) B. tomentosa and B. macrantha thrive even when transferred to the surfaces of rocks that do not contain phosphates.", "generated": [{"id": "16.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) The poet dislikes mirrors.\nB) The poem is mainly about farming.\nC) The river represents movement and reflection.\nD) The river is unsafe for travelers.", "answer": "C", "explanation": "Both metaphors point to travel and self-knowledge."}, {"id": "16.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) The diary was sold at auction in 1998.\nB) The diary's cover was made of expensive leather.\nC) The diary describes meals, wages, tools, and conversations in a textile mill.\nD) The writer sometimes misspelled common words.", "answer": "C", "explanation": "Details about daily routines support historical value."}, {"id": "16.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the relationship between the claim and the data, showing why the author's interpretation is more plausible than an alternative explanation. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) Some beetles are active at night.\nB) The beetle lives in several types of forest.\nC) The beetle's wings are shorter than its body.\nD) Birds avoid models painted the beetle's color after tasting one real beetle.", "answer": "D", "explanation": "Predators avoiding the color supports warning coloration."}, {"id": "16.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal relationship; the best support aligns with the claim's exact logic. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) rainfall records from the period are always inaccurate.\nB) irrigation may have helped the city support more people despite drier weather.\nC) the population must have moved away immediately.\nD) the city had no need for agriculture.", "answer": "B", "explanation": "Canals explain growth during declining rainfall."}, {"id": "16.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an observation to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) make the positive evaluation more persuasive.\nB) remove the need to watch the film.\nC) avoid forming any opinion about the film.\nD) prove that all viewers liked the film.", "answer": "A", "explanation": "Addressing objections strengthens the argument."}]}, {"n": 17, "concept": "Inferences: complete the text with the most logical conclusion.", "original": "Herbivorous sauropod dinosaurs could grow more than 100 feet long and weigh up to 80 tons, and some researchers have attributed the evolution of sauropods to such massive sizes to increased plant production resulting from high levels of atmospheric carbon dioxide during the Mesozoic era. However, there is no evidence of significant spikes in carbon dioxide levels coinciding with relevant periods in sauropod evolution, suggesting that _______\n\nWhich choice most logically completes the text?\nA) fluctuations in atmospheric carbon dioxide affected different sauropod lineages differently.\nB) the evolution of larger body sizes in sauropods did not depend on increased atmospheric carbon dioxide.\nC) atmospheric carbon dioxide was higher when the largest known sauropods lived than it was when the first sauropods appeared.\nD) sauropods probably would not have evolved to such immense sizes if atmospheric carbon dioxide had been even slightly higher.", "generated": [{"id": "17.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The final sentence must connect the evidence to the claim while avoiding a conclusion that goes beyond the information provided. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.\n\nWhich choice most logically completes the text?\n\nA) The river is unsafe for travelers.\nB) The poem is mainly about farming.\nC) The river represents movement and reflection.\nD) The poet dislikes mirrors.", "answer": "C", "explanation": "Both metaphors point to travel and self-knowledge."}, {"id": "17.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The details establish a narrow evidentiary path, and the final statement should stay within that path instead of making a broader or more dramatic claim. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?\n\nWhich choice most logically completes the text?\n\nA) The diary describes meals, wages, tools, and conversations in a textile mill.\nB) The diary was sold at auction in 1998.\nC) The writer sometimes misspelled common words.\nD) The diary's cover was made of expensive leather.", "answer": "A", "explanation": "Details about daily routines support historical value."}, {"id": "17.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A completion that ignores that shift would distort the argument, while a completion that follows it will show how the new evidence affects the earlier idea. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?\n\nWhich choice most logically completes the text?\n\nA) The beetle lives in several types of forest.\nB) Birds avoid models painted the beetle's color after tasting one real beetle.\nC) The beetle's wings are shorter than its body.\nD) Some beetles are active at night.", "answer": "B", "explanation": "Predators avoiding the color supports warning coloration."}, {"id": "17.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The final inference must account for each important detail, including any uncertainty, comparison, exception, or limitation introduced earlier. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______\n\nWhich choice most logically completes the text?\n\nA) the city had no need for agriculture.\nB) the population must have moved away immediately.\nC) rainfall records from the period are always inaccurate.\nD) irrigation may have helped the city support more people despite drier weather.", "answer": "D", "explanation": "Canals explain growth during declining rainfall."}, {"id": "17.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______\n\nWhich choice most logically completes the text?\n\nA) prove that all viewers liked the film.\nB) avoid forming any opinion about the film.\nC) make the positive evaluation more persuasive.\nD) remove the need to watch the film.", "answer": "C", "explanation": "Addressing objections strengthens the argument."}]}, {"n": 18, "concept": "Inferences: complete an argument about strengthening legal reasoning.", "original": "In documents called judicial opinions, judges explain the reasoning behind their legal rulings, and in those explanations they sometimes cite and discuss historical and contemporary philosophers. Legal scholar and philosopher Anita L. Allen argues that while judges are naturally inclined to mention philosophers whose views align with their own positions, the strongest judicial opinions consider and rebut potential objections; discussing philosophers whose views conflict with judges' views could therefore _______\n\nWhich choice most logically completes the text?\nA) allow judges to craft judicial opinions without needing to consult philosophical works.\nB) help judges improve the arguments they put forward in their judicial opinions.\nC) make judicial opinions more comprehensible to readers without legal or philosophical training.\nD) bring judicial opinions in line with views that are broadly held among philosophers.", "generated": [{"id": "18.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The final sentence must connect the evidence to the claim while avoiding a conclusion that goes beyond the information provided. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.\n\nWhich choice most logically completes the text?\n\nA) The poet dislikes mirrors.\nB) The river represents movement and reflection.\nC) The poem is mainly about farming.\nD) The river is unsafe for travelers.", "answer": "B", "explanation": "Both metaphors point to travel and self-knowledge."}, {"id": "18.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The details establish a narrow evidentiary path, and the final statement should stay within that path instead of making a broader or more dramatic claim. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?\n\nWhich choice most logically completes the text?\n\nA) The diary was sold at auction in 1998.\nB) The diary's cover was made of expensive leather.\nC) The writer sometimes misspelled common words.\nD) The diary describes meals, wages, tools, and conversations in a textile mill.", "answer": "D", "explanation": "Details about daily routines support historical value."}, {"id": "18.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A completion that ignores that shift would distort the argument, while a completion that follows it will show how the new evidence affects the earlier idea. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?\n\nWhich choice most logically completes the text?\n\nA) The beetle lives in several types of forest.\nB) Birds avoid models painted the beetle's color after tasting one real beetle.\nC) The beetle's wings are shorter than its body.\nD) Some beetles are active at night.", "answer": "B", "explanation": "Predators avoiding the color supports warning coloration."}, {"id": "18.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The final inference must account for each important detail, including any uncertainty, comparison, exception, or limitation introduced earlier. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______\n\nWhich choice most logically completes the text?\n\nA) irrigation may have helped the city support more people despite drier weather.\nB) rainfall records from the period are always inaccurate.\nC) the population must have moved away immediately.\nD) the city had no need for agriculture.", "answer": "A", "explanation": "Canals explain growth during declining rainfall."}, {"id": "18.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______\n\nWhich choice most logically completes the text?\n\nA) avoid forming any opinion about the film.\nB) remove the need to watch the film.\nC) make the positive evaluation more persuasive.\nD) prove that all viewers liked the film.", "answer": "C", "explanation": "Addressing objections strengthens the argument."}]}, {"n": 19, "concept": "Standard English: pronoun-antecedent agreement.", "original": "Public-awareness campaigns about the need to reduce single-use plastics can be successful, says researcher Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent reduction in plastic-bag use after cashiers were instructed to ask customers whether _______ wanted a bag.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) they\nB) one\nC) you\nD) it", "generated": [{"id": "19.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The researchers interviewed local artists after _______ completed the mural project.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) they\nB) one\nC) itself\nD) it", "answer": "A", "explanation": "Plural 'artists' requires plural 'they'."}, {"id": "19.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The museum guides asked visitors whether _______ wanted audio headsets.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) itself\nB) it\nC) one\nD) they", "answer": "D", "explanation": "Plural 'visitors' requires plural 'they'."}, {"id": "19.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The editors contacted the authors to see whether _______ approved the final proofs.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) you\nB) one\nC) they\nD) it", "answer": "C", "explanation": "Plural 'authors' requires plural 'they'."}, {"id": "19.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The coaches reminded players that _______ needed to submit permission forms by Friday.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) they\nB) itself\nC) it\nD) one", "answer": "A", "explanation": "Plural 'players' requires plural 'they'."}, {"id": "19.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The volunteers were asked whether _______ could return for the second cleanup day.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) itself\nB) they\nC) one\nD) it", "answer": "B", "explanation": "Plural 'volunteers' requires plural 'they'."}]}, {"n": 20, "concept": "Standard English: punctuation before a participial phrase.", "original": "In ancient Greece, an Epicurean was a follower of Epicurus, a philosopher whose beliefs revolved around the pursuit of pleasure. Epicurus defined pleasure as \"the absence of pain in the body and of trouble in the _______ that all life's virtues derived from this absence.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) soul,\" positing\nB) soul\": positing\nC) soul\"; positing\nD) soul.\" Positing", "generated": [{"id": "20.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The critic described the installation as \"a conversation between metal and light,\" _______ that its shadows changed throughout the day.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) ; noting\nB) . Noting\nC) noting\nD) : noting", "answer": "C", "explanation": "A participial phrase can follow the main clause after a comma."}, {"id": "20.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The biologist called the wetland \"a natural water filter,\" _______ that reeds and soil remove pollutants.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) explaining\nB) . Explaining\nC) : explaining\nD) ; explaining", "answer": "A", "explanation": "The participial phrase adds explanation to the main clause."}, {"id": "20.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The historian defined the archive as \"a record of ordinary lives,\" _______ that receipts and letters can reveal social change.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) ; arguing\nB) . Arguing\nC) arguing\nD) : arguing", "answer": "C", "explanation": "The -ing phrase modifies the preceding main clause."}, {"id": "20.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The engineer described the bridge as \"light but resilient,\" _______ that its triangular supports distribute weight efficiently.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) . Emphasizing\nB) : emphasizing\nC) ; emphasizing\nD) emphasizing", "answer": "D", "explanation": "A comma plus participial phrase is standard here."}, {"id": "20.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The novelist called memory \"a room with many doors,\" _______ that a single object can open several stories.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) . Suggesting\nB) suggesting\nC) : suggesting\nD) ; suggesting", "answer": "B", "explanation": "The participial phrase provides added explanation."}]}, {"n": 21, "concept": "Standard English: possessive determiner agreement.", "original": "British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper announcing the double helix structure of DNA, but it is misleading to say that Watson and Crick discovered the double helix. _______ findings were based on a famous X-ray image of DNA fibers, \"Photo 51,\" developed by X-ray crystallographer Rosalind Franklin and her graduate student Raymond Gosling.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) They're\nB) It's\nC) Their\nD) Its", "generated": [{"id": "21.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Architects Lina Bo Bardi and Gio Ponti are known for buildings that reflect _______ interest in modern forms and local materials.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) they're\nB) their\nC) it's\nD) its", "answer": "B", "explanation": "Two architects require plural possessive 'their'."}, {"id": "21.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. Researchers Maya Gupta and Daniel Lee published _______ findings in a climate journal.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) their\nB) they're\nC) it's\nD) its", "answer": "A", "explanation": "Two researchers require plural possessive 'their'."}, {"id": "21.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The poets Gabriela Mistral and Pablo Neruda both drew on _______ experiences of Chilean landscapes.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) they're\nB) its\nC) their\nD) it's", "answer": "C", "explanation": "The possessive must agree with two poets."}, {"id": "21.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The directors Ava DuVernay and Chloe Zhao are often praised for _______ visually distinctive storytelling.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) its\nB) they're\nC) it's\nD) their", "answer": "D", "explanation": "The possessive determiner for two people is 'their'."}, {"id": "21.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Biologists Watson and Crick built on others' evidence when developing _______ model of DNA.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) its\nB) it's\nC) they're\nD) their", "answer": "D", "explanation": "The plural possessive determiner is needed."}]}, {"n": 22, "concept": "Standard English: essential appositive and integrated quotation punctuation.", "original": "In 1937, Chinese American screen actor Anna May Wong, who had portrayed numerous villains and secondary characters but never a heroine, finally got a starring role in Paramount Pictures' Daughter of Shanghai, a film that _______ \"expanded the range of possibilities for Asian images on screen.\"\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) critic, Stina Chyn, claims\nB) critic, Stina Chyn, claims,\nC) critic Stina Chyn claims\nD) critic Stina Chyn, claims,", "generated": [{"id": "22.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The documentary, a film that _______ \"reframes the history of jazz,\" premiered at the festival.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) critic Elena Moss calls\nB) critic Elena Moss, calls,\nC) critic, Elena Moss, calls\nD) critic, Elena Moss calls,", "answer": "A", "explanation": "The critic's name is essential, and the quotation is integrated."}, {"id": "22.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The poem is one that _______ \"turns silence into music.\"\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) scholar, Rana Patel, says,\nB) scholar Rana Patel says\nC) scholar, Rana Patel, says\nD) scholar Rana Patel, says,", "answer": "B", "explanation": "No commas are needed around an essential name or before an integrated quote."}, {"id": "22.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The sculpture was an artwork that _______ \"invites viewers to move.\"\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) curator, Miles Chen, argues\nB) curator Miles Chen, argues,\nC) curator, Miles Chen argues,\nD) curator Miles Chen argues", "answer": "D", "explanation": "The title 'curator' and name form one essential identifier."}, {"id": "22.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The novel is a book that _______ \"blends realism with myth.\"\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) critic Talia Moore, claims,\nB) critic, Talia Moore claims,\nC) critic Talia Moore claims\nD) critic, Talia Moore, claims", "answer": "C", "explanation": "No comma is needed before an integrated quotation."}, {"id": "22.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The exhibition includes a painting that _______ \"captures the tempo of city life.\"\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) historian Omar Ruiz writes\nB) historian, Omar Ruiz writes,\nC) historian, Omar Ruiz, writes\nD) historian Omar Ruiz, writes,", "answer": "A", "explanation": "The proper noun is essential to identify the historian."}]}, {"n": 23, "concept": "Standard English: finite verb in a main clause.", "original": "In 1637, the price of tulips skyrocketed in Amsterdam, with single bulbs of rare varieties selling for up to the equivalent of $200,000 in today's US dollars. Some historians _______ that this \"tulip mania\" was the first historical instance of an asset bubble, which occurs when investors drive prices to highs not supported by actual demand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) claiming\nB) claim\nC) having claimed\nD) to claim", "generated": [{"id": "23.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Several archaeologists _______ that the marks on the stone were made by tools, not by erosion.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) arguing\nB) having argued\nC) argue\nD) to argue", "answer": "C", "explanation": "The subject needs a finite verb."}, {"id": "23.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. Some linguists _______ that the two dialects developed from a shared regional variety.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) having claimed\nB) claiming\nC) claim\nD) to claim", "answer": "C", "explanation": "The main clause requires the finite verb 'claim'."}, {"id": "23.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Many historians _______ that the treaty changed trade routes across the region.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to suggest\nB) having suggested\nC) suggesting\nD) suggest", "answer": "D", "explanation": "A finite verb completes the clause."}, {"id": "23.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. Several ecologists _______ that urban gardens can support native pollinators.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) having argued\nB) argue\nC) to argue\nD) arguing", "answer": "B", "explanation": "The main subject requires a finite verb."}, {"id": "23.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Some economists _______ that public transit access affects employment opportunities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) claim\nB) having claimed\nC) to claim\nD) claiming", "answer": "A", "explanation": "Only 'claim' functions as the main verb."}]}, {"n": 24, "concept": "Standard English: colon introducing an explanation.", "original": "Researchers studying magnetosensation have determined why some soil-dwelling roundworms in the Southern Hemisphere move in the opposite direction of Earth's magnetic field when searching for _______ in the Northern Hemisphere, the magnetic field points down, into the ground, but in the Southern Hemisphere, it points up, toward the surface and away from worms' food sources.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) food:\nB) food,\nC) food while\nD) food", "generated": [{"id": "24.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The team identified why the sensor failed during the storm: _______ had entered the casing and damaged the wires.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) water; while\nB) water,\nC) water\nD) water while", "answer": "C", "explanation": "The colon introduces the explanation."}, {"id": "24.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The composer gave one reason for revising the ending: _______ felt too abrupt after the slow third movement.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) the finale; while\nB) the finale while\nC) the finale,\nD) the finale", "answer": "D", "explanation": "A complete explanation follows the colon."}, {"id": "24.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Researchers now understand why the seedlings grew near the stones: _______ trapped moisture during dry afternoons.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) the rocks,\nB) the rocks\nC) the rocks while\nD) the rocks; while", "answer": "B", "explanation": "The colon correctly introduces a reason."}, {"id": "24.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The archive closed for a practical reason: _______ needed repairs after a roof leak.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) the reading room while\nB) the reading room; while\nC) the reading room,\nD) the reading room", "answer": "D", "explanation": "The words after the colon explain the reason."}, {"id": "24.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The birds avoided the field for one clear reason: _______ offered no cover from predators.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) the short grass\nB) the short grass,\nC) the short grass; while\nD) the short grass while", "answer": "A", "explanation": "A colon can introduce an explanatory clause."}]}, {"n": 25, "concept": "Standard English: reflexive pronoun agreement.", "original": "Scientists believe that, unlike most other species of barnacle, turtle barnacles (Chelonibia testudinari) can dissolve the cement-like secretions they use to attach _______ to a sea turtle shell, enabling the barnacles to move short distances across the shell's surface.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) it\nB) themselves\nC) them\nD) itself", "generated": [{"id": "25.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Some sea stars can pull _______ across rocks using hundreds of tiny tube feet.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) itself\nB) them\nC) themselves\nD) it", "answer": "C", "explanation": "Plural 'sea stars' requires plural reflexive 'themselves'."}, {"id": "25.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The young turtles buried _______ in the sand after hatching.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) itself\nB) themselves\nC) them\nD) it", "answer": "B", "explanation": "Plural 'turtles' requires 'themselves'."}, {"id": "25.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The barnacles attach _______ to the hull with a cement-like secretion.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) themselves\nB) it\nC) them\nD) itself", "answer": "A", "explanation": "Plural 'barnacles' requires a plural reflexive."}, {"id": "25.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The seedlings orient _______ toward the strongest source of light.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) it\nB) themselves\nC) them\nD) itself", "answer": "B", "explanation": "Plural 'seedlings' requires 'themselves'."}, {"id": "25.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The ants clean _______ after returning to the nest.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) it\nC) itself\nD) themselves", "answer": "D", "explanation": "Plural 'ants' requires plural reflexive 'themselves'."}]}, {"n": 26, "concept": "Standard English: subject-verb agreement with a gerund subject.", "original": "The classic children's board game Chutes and Ladders is a version of an ancient Nepalese game, Paramapada Sopanapata. In both games, players encounter \"good\" or \"bad\" spaces while traveling along a path; landing on one of the good spaces _______ a player to skip ahead and arrive closer to the end goal.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) allows\nB) are allowing\nC) have allowed\nD) allow", "generated": [{"id": "26.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Studying soil samples _______ researchers to reconstruct past climates.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) are allowing\nB) have allowed\nC) allows\nD) allow", "answer": "C", "explanation": "The gerund phrase is singular."}, {"id": "26.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. Listening to oral histories _______ students a fuller view of local events.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) have given\nB) are giving\nC) give\nD) gives", "answer": "D", "explanation": "A gerund phrase takes a singular verb."}, {"id": "26.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Mapping old trade routes _______ historians identify links between cities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) have helped\nB) helps\nC) help\nD) are helping", "answer": "B", "explanation": "'Mapping old trade routes' is singular."}, {"id": "26.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. Comparing the two poems _______ readers notice differences in tone.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) allows\nB) have allowed\nC) allow\nD) are allowing", "answer": "A", "explanation": "The subject is the singular gerund phrase."}, {"id": "26.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Planting native flowers _______ pollinators during the dry season.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) have supported\nB) support\nC) supports\nD) are supporting", "answer": "C", "explanation": "The gerund subject takes singular 'supports'."}]}, {"n": 27, "concept": "Standard English: punctuation for a contrast word and explanatory clause.", "original": "In 1943, in the midst of World War II, mathematics professor Grace Hopper was recruited by the US military to help the war effort by solving complex equations. Hopper's subsequent career would involve more than just _______ as a pioneering computer programmer, Hopper would help usher in the digital age.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) equations, though:\nB) equations, though,\nC) equations. Though,\nD) equations though", "generated": [{"id": "27.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The archive contains more than letters, _______ it also includes maps and sketches.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) however;\nB) however:\nC) however,\nD) however", "answer": "B", "explanation": "The contrast word is set off, and the colon introduces the explanation."}, {"id": "27.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The study measured more than rainfall, _______ it also tracked soil temperature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) though,\nB) though;\nC) though:\nD) though", "answer": "C", "explanation": "The colon introduces the explanation after 'though'."}, {"id": "27.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The festival features more than concerts, _______ it includes workshops and public lectures.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) however,\nB) however;\nC) however\nD) however:", "answer": "D", "explanation": "A colon can introduce the clarifying independent clause."}, {"id": "27.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The scientist's work involved more than observation, _______ she also designed new instruments.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) though:\nB) though\nC) though,\nD) though;", "answer": "A", "explanation": "This punctuation marks the contrast and explanation."}, {"id": "27.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The program teaches more than grammar, _______ it also builds students' confidence in speaking.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) however;\nB) however,\nC) however:\nD) however", "answer": "C", "explanation": "The colon introduces what the program also does."}]}, {"n": 28, "concept": "Standard English: place a modifier next to the noun it modifies.", "original": "In 1453, English King Henry VI became unfit to rule after falling gravely ill. As a result, Parliament appointed Richard, Third Duke of York, who had a strong claim to the English throne, to rule as Lord Protector. Upon recovering two years later, _______ forcing an angered Richard from the royal court and precipitating a series of battles later known as the Wars of the Roses.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) Henry resumed his reign,\nB) the reign of Henry resumed,\nC) Henry's reign resumed,\nD) it was Henry who resumed his reign,", "generated": [{"id": "28.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. After finishing the field survey, _______ compiled the observations into a report.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) the students\nB) the students' report\nC) the observations\nD) it was the students who", "answer": "A", "explanation": "The introductory phrase must modify the people who finished."}, {"id": "28.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. While walking through the archive, _______ noticed a mislabeled box of letters.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) it was the historian who\nB) the letters\nC) the box\nD) the historian", "answer": "D", "explanation": "The person walking must follow the modifier."}, {"id": "28.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. After winning the regional contest, _______ advanced to the national competition.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) it was the trophy that\nB) the debate team's trophy\nC) the competition\nD) the debate team", "answer": "D", "explanation": "The team, not the trophy or competition, won."}, {"id": "28.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. Upon opening the greenhouse door, _______ saw that the seedlings had doubled in height.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) the seedlings\nB) the botanist\nC) it was the botanist who\nD) the greenhouse door", "answer": "B", "explanation": "The botanist opened the door."}, {"id": "28.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. After revising the manuscript, _______ sent it to the journal.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) the journal\nB) it was the manuscript that\nC) the researchers\nD) the manuscript", "answer": "C", "explanation": "The people revising the manuscript must be named next."}]}, {"n": 29, "concept": "Transitions: use an example transition.", "original": "Although novels and poems are considered distinct literary forms, many authors have created hybrid works that incorporate elements of both. Bernardine Evaristo's The Emperor's Babe, _______ is a verse novel, a book-length narrative complete with characters and a plot but conveyed in short, crisp lines of poetry rather than prose.\n\nWhich choice completes the text with the most logical transition?\nA) by contrast,\nB) consequently,\nC) secondly,\nD) for example,", "generated": [{"id": "29.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The relationship between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. Many languages borrow words from neighboring cultures. English, _______, includes words from French, Hindi, and Arabic.\n\nWhich choice completes the text with the most logical transition?\n\nA) nevertheless,\nB) consequently,\nC) by contrast,\nD) for example,", "answer": "D", "explanation": "English is an example of the general claim."}, {"id": "29.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. Some mammals use tools. Sea otters, _______, crack shells with stones.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) instead,\nC) for example,\nD) therefore,", "answer": "C", "explanation": "Sea otters illustrate the claim."}, {"id": "29.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Several artists combine painting and performance. Tania Bruguera, _______, often creates works that involve audience participation.\n\nWhich choice completes the text with the most logical transition?\n\nA) for example,\nB) by contrast,\nC) consequently,\nD) nevertheless,", "answer": "A", "explanation": "The named artist is an example."}, {"id": "29.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The second sentence may illustrate a point, challenge an expectation, identify a result, or introduce a related development that follows from the previous claim. Many cities have converted old rail lines into parks. New York's High Line, _______, follows a former elevated railway.\n\nWhich choice completes the text with the most logical transition?\n\nA) instead,\nB) for example,\nC) similarly,\nD) consequently,", "answer": "B", "explanation": "The High Line exemplifies the trend."}, {"id": "29.5", "text": "In a laborator
