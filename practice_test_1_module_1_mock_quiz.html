4.4", "n": 24, "concept": "Standard English: colon introducing an explanation.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The archive closed for a practical reason: _______ needed repairs after a roof leak.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The archive closed for a practical reason: _______ needed repairs after a roof leak.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。檔案館因一個實際的原因關閉：_______ 在屋頂漏水後需要修繕。", "opts": {"A": "the reading room while", "B": "the reading room; while", "C": "the reading room,", "D": "the reading room"}, "optsZh": {"A": "the reading room while（閱覽室＋while：錯誤）", "B": "the reading room; while（閱覽室＋分號＋while：錯誤）", "C": "the reading room,（主詞名詞後多餘逗號：錯誤）", "D": "the reading room（閱覽室）"}, "answer": "D", "expl": "The words after the colon explain the reason.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: colon introducing an explanation.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The birds avoided the field for one clear reason: _______ offered no cover from predators.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The birds avoided the field for one clear reason: _______ offered no cover from predators.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。鳥類避開那片田地有一個明顯的原因：_______ 無法提供躲避掠食者的掩護。", "opts": {"A": "the short grass", "B": "the short grass,", "C": "the short grass; while", "D": "the short grass while"}, "optsZh": {"A": "the short grass（矮草）", "B": "the short grass,（主詞名詞後多餘逗號：錯誤）", "C": "the short grass; while（矮草＋分號＋while：錯誤）", "D": "the short grass while（矮草＋while：錯誤）"}, "answer": "A", "expl": "A colon can introduce an explanatory clause.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: reflexive pronoun agreement.", "vocab": false, "body": "Scientists believe that, unlike most other species of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=barnacle\" target=\"_blank\" rel=\"noopener\" data-w=\"barnacle\" data-pos=\"n.\" data-en=\"a small sea creature that sticks firmly to rocks, ships, or turtles\" data-zh=\"藤壺\">barnacle<\/a>, turtle barnacles (Chelonibia testudinari) can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dissolve\" target=\"_blank\" rel=\"noopener\" data-w=\"dissolve\" data-pos=\"v.\" data-en=\"to mix with a liquid and become part of it; to break down\" data-zh=\"溶解\">dissolve<\/a> the cement-like <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secretion\" target=\"_blank\" rel=\"noopener\" data-w=\"secretion\" data-pos=\"n.\" data-en=\"a substance produced and released by a living thing\" data-zh=\"分泌物\">secretions<\/a> they use to attach _______ to a sea turtle shell, enabling the barnacles to move short distances across the shell&#x27;s surface.", "bodyPlain": "Scientists believe that, unlike most other species of barnacle, turtle barnacles (Chelonibia testudinari) can dissolve the cement-like secretions they use to attach _______ to a sea turtle shell, enabling the barnacles to move short distances across the shell's surface.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "科學家認為，與大多數其他藤壺不同，海龜藤壺（Chelonibia testudinaria）能夠溶解它們用來將 _______ 附著在海龜殼上的水泥狀分泌物，使藤壺得以在龜殼表面短距離移動。", "opts": {"A": "it", "B": "themselves", "C": "them", "D": "itself"}, "optsZh": {"A": "it（它；單數代名詞）", "B": "themselves（他們自己；複數反身代名詞）", "C": "them（他們；複數受格）", "D": "itself（它自己；單數反身代名詞）"}, "answer": "B", "expl": "The barnacles (plural) attach themselves, so the plural reflexive pronoun 'themselves' is needed.", "explZh": "藤壺（複數）把自己附著上去，因此需要複數反身代名詞「themselves」。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: reflexive pronoun agreement.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Some sea stars can pull _______ across rocks using hundreds of tiny tube feet.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Some sea stars can pull _______ across rocks using hundreds of tiny tube feet.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。有些海星能利用數百隻微小的管足，把 _______ 拉過岩石。", "opts": {"A": "itself", "B": "them", "C": "themselves", "D": "it"}, "optsZh": {"A": "itself（它自己；單數反身代名詞）", "B": "them（他們；複數受格）", "C": "themselves（他們自己；複數反身代名詞）", "D": "it（它；單數代名詞）"}, "answer": "C", "expl": "Plural 'sea stars' requires plural reflexive 'themselves'.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: reflexive pronoun agreement.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. The young turtles buried _______ in the sand after hatching.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The young turtles buried _______ in the sand after hatching.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。小海龜孵化後把 _______ 埋進沙裡。", "opts": {"A": "itself", "B": "themselves", "C": "them", "D": "it"}, "optsZh": {"A": "itself（它自己；單數反身代名詞）", "B": "themselves（他們自己；複數反身代名詞）", "C": "them（他們；複數受格）", "D": "it（它；單數代名詞）"}, "answer": "B", "expl": "Plural 'turtles' requires 'themselves'.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: reflexive pronoun agreement.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The barnacles attach _______ to the hull with a cement-like secretion.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The barnacles attach _______ to the hull with a cement-like secretion.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。藤壺以水泥狀的分泌物把 _______ 附著在船身上。", "opts": {"A": "themselves", "B": "it", "C": "them", "D": "itself"}, "optsZh": {"A": "themselves（他們自己；複數反身代名詞）", "B": "it（它；單數代名詞）", "C": "them（他們；複數受格）", "D": "itself（它自己；單數反身代名詞）"}, "answer": "A", "expl": "Plural 'barnacles' requires a plural reflexive.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: reflexive pronoun agreement.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The seedlings orient _______ toward the strongest source of light.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The seedlings orient _______ toward the strongest source of light.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。幼苗將 _______ 朝向最強的光源。", "opts": {"A": "it", "B": "themselves", "C": "them", "D": "itself"}, "optsZh": {"A": "it（它；單數代名詞）", "B": "themselves（他們自己；複數反身代名詞）", "C": "them（他們；複數受格）", "D": "itself（它自己；單數反身代名詞）"}, "answer": "B", "expl": "Plural 'seedlings' requires 'themselves'.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: reflexive pronoun agreement.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The ants clean _______ after returning to the nest.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The ants clean _______ after returning to the nest.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。螞蟻回到巢穴後會清理 _______。", "opts": {"A": "them", "B": "it", "C": "itself", "D": "themselves"}, "optsZh": {"A": "them（他們；複數受格）", "B": "it（它；單數代名詞）", "C": "itself（它自己；單數反身代名詞）", "D": "themselves（他們自己；複數反身代名詞）"}, "answer": "D", "expl": "Plural 'ants' requires plural reflexive 'themselves'.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: subject-verb agreement with a gerund subject.", "vocab": false, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classic\" target=\"_blank\" rel=\"noopener\" data-w=\"classic\" data-pos=\"adj.\" data-en=\"well known and of lasting quality\" data-zh=\"經典的\">classic<\/a> children&#x27;s board game Chutes and Ladders is a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=version\" target=\"_blank\" rel=\"noopener\" data-w=\"version\" data-pos=\"n.\" data-en=\"a form of something that is slightly different from others\" data-zh=\"版本\">version<\/a> of an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Nepalese game, Paramapada Sopanapata. In both games, players <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encounter<\/a> &quot;good&quot; or &quot;bad&quot; spaces while traveling along a path; landing on one of the good spaces _______ a player to skip ahead and arrive closer to the end goal.", "bodyPlain": "The classic children's board game Chutes and Ladders is a version of an ancient Nepalese game, Paramapada Sopanapata. In both games, players encounter \"good\" or \"bad\" spaces while traveling along a path; landing on one of the good spaces _______ a player to skip ahead and arrive closer to the end goal.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "經典的兒童桌遊「滑梯與梯子」（Chutes and Ladders）是古代尼泊爾遊戲 Paramapada Sopanapata 的一種版本。在這兩種遊戲中，玩家沿著路徑前進時會遇到「好」或「壞」的格子；落在好格子上 _______ 玩家向前跳躍，更接近終點。", "opts": {"A": "allows", "B": "are allowing", "C": "have allowed", "D": "allow"}, "optsZh": {"A": "allows（第三人稱單數現在式）", "B": "are allowing（複數現在進行式）", "C": "have allowed（複數完成式）", "D": "allow（複數動詞原形）"}, "answer": "A", "expl": "The subject is the singular gerund phrase 'landing on one of the good spaces', so the singular verb 'allows' agrees with it.", "explZh": "主詞是單數的動名詞片語「landing on one of the good spaces」，因此搭配單數動詞「allows」。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: subject-verb agreement with a gerund subject.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Studying soil samples _______ researchers to reconstruct past climates.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Studying soil samples _______ researchers to reconstruct past climates.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。研究土壤樣本 _______ 研究人員重建過去的氣候。", "opts": {"A": "are allowing", "B": "have allowed", "C": "allows", "D": "allow"}, "optsZh": {"A": "are allowing（複數現在進行式）", "B": "have allowed（複數完成式）", "C": "allows（第三人稱單數現在式）", "D": "allow（複數動詞原形）"}, "answer": "C", "expl": "The gerund phrase is singular.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: subject-verb agreement with a gerund subject.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. Listening to oral histories _______ students a fuller view of local events.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. Listening to oral histories _______ students a fuller view of local events.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。聆聽口述歷史 _______ 學生對地方事件更完整的認識。", "opts": {"A": "have given", "B": "are giving", "C": "give", "D": "gives"}, "optsZh": {"A": "have given（複數完成式）", "B": "are giving（複數現在進行式）", "C": "give（複數動詞原形）", "D": "gives（第三人稱單數現在式）"}, "answer": "D", "expl": "A gerund phrase takes a singular verb.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: subject-verb agreement with a gerund subject.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Mapping old trade routes _______ historians identify links between cities.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Mapping old trade routes _______ historians identify links between cities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。繪製古代貿易路線 _______ 歷史學家找出城市之間的聯繫。", "opts": {"A": "have helped", "B": "helps", "C": "help", "D": "are helping"}, "optsZh": {"A": "have helped（複數完成式）", "B": "helps（第三人稱單數現在式）", "C": "help（複數動詞原形）", "D": "are helping（複數現在進行式）"}, "answer": "B", "expl": "'Mapping old trade routes' is singular.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: subject-verb agreement with a gerund subject.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Comparing the two poems _______ readers notice differences in tone.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. Comparing the two poems _______ readers notice differences in tone.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。比較這兩首詩 _______ 讀者注意到語氣上的差異。", "opts": {"A": "allows", "B": "have allowed", "C": "allow", "D": "are allowing"}, "optsZh": {"A": "allows（第三人稱單數現在式）", "B": "have allowed（複數完成式）", "C": "allow（複數動詞原形）", "D": "are allowing（複數現在進行式）"}, "answer": "A", "expl": "The subject is the singular gerund phrase.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: subject-verb agreement with a gerund subject.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Planting native flowers _______ pollinators during the dry season.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Planting native flowers _______ pollinators during the dry season.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。種植本土花卉 _______ 乾季期間的傳粉者。", "opts": {"A": "have supported", "B": "support", "C": "supports", "D": "are supporting"}, "optsZh": {"A": "have supported（複數完成式）", "B": "support（複數動詞原形）", "C": "supports（第三人稱單數現在式）", "D": "are supporting（複數現在進行式）"}, "answer": "C", "expl": "The gerund subject takes singular 'supports'.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Standard English: punctuation for a contrast word and explanatory clause.", "vocab": false, "body": "In 1943, in the midst of World War II, mathematics <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=professor\" target=\"_blank\" rel=\"noopener\" data-w=\"professor\" data-pos=\"n.\" data-en=\"a senior teacher at a university\" data-zh=\"教授\">professor<\/a> Grace Hopper was recruited by the US military to help the war effort by solving complex equations. Hopper&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=subsequent\" target=\"_blank\" rel=\"noopener\" data-w=\"subsequent\" data-pos=\"adj.\" data-en=\"happening after something else\" data-zh=\"隨後的\">subsequent<\/a> career would involve more than just _______ as a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pioneering\" target=\"_blank\" rel=\"noopener\" data-w=\"pioneering\" data-pos=\"adj.\" data-en=\"being the first to do or develop something new\" data-zh=\"開創性的\">pioneering<\/a> computer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=programmer\" target=\"_blank\" rel=\"noopener\" data-w=\"programmer\" data-pos=\"n.\" data-en=\"a person who writes computer programs\" data-zh=\"程式設計師\">programmer<\/a>, Hopper would help usher in the digital age.", "bodyPlain": "In 1943, in the midst of World War II, mathematics professor Grace Hopper was recruited by the US military to help the war effort by solving complex equations. Hopper's subsequent career would involve more than just _______ as a pioneering computer programmer, Hopper would help usher in the digital age.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "1943 年，二次世界大戰期間，數學教授 Grace Hopper 被美軍徵召，藉由解複雜方程式協助戰事。Hopper 之後的職業生涯所涉及的遠不止 _______ 作為一位開創性的電腦程式設計師，Hopper 將協助開啟數位時代。", "opts": {"A": "equations, though:", "B": "equations, though,", "C": "equations. Though,", "D": "equations though"}, "optsZh": {"A": "equations, though:（逗號＋冒號：正確）", "B": "equations, though,（逗號 → 造成逗號連接錯誤）", "C": "equations. Though,（句號後 Though 開頭 → 造成句子殘缺）", "D": "equations though（無標點：錯誤）"}, "answer": "A", "expl": "'…more than just equations, though' ends one independent clause; a colon then introduces the explanation. A comma alone would create a comma splice.", "explZh": "「…more than just equations, though」是一個完整子句；接著用冒號引出說明。只用逗號會造成逗號連接錯誤。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Standard English: punctuation for a contrast word and explanatory clause.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The archive contains more than letters, _______ it also includes maps and sketches.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The archive contains more than letters, _______ it also includes maps and sketches.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。這座檔案館收藏的不只是信件，_______ 它還包括地圖與素描。", "opts": {"A": "however;", "B": "however:", "C": "however,", "D": "however"}, "optsZh": {"A": "however;（分號後接的不是完整子句：錯誤）", "B": "however:（冒號：正確）", "C": "however,（逗號 → 造成逗號連接錯誤）", "D": "however（無標點：錯誤）"}, "answer": "B", "expl": "The contrast word is set off, and the colon introduces the explanation.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Standard English: punctuation for a contrast word and explanatory clause.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. The study measured more than rainfall, _______ it also tracked soil temperature.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The study measured more than rainfall, _______ it also tracked soil temperature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。這項研究測量的不只是降雨量，_______ 它也追蹤了土壤溫度。", "opts": {"A": "though,", "B": "though;", "C": "though:", "D": "though"}, "optsZh": {"A": "though,（逗號 → 造成逗號連接錯誤）", "B": "though;（分號後接的不是完整子句：錯誤）", "C": "though:（冒號：正確）", "D": "though（無標點：錯誤）"}, "answer": "C", "expl": "The colon introduces the explanation after 'though'.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Standard English: punctuation for a contrast word and explanatory clause.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The festival features more than concerts, _______ it includes workshops and public lectures.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The festival features more than concerts, _______ it includes workshops and public lectures.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。這個藝術節的內容不只是音樂會，_______ 它還包括工作坊與公開講座。", "opts": {"A": "however,", "B": "however;", "C": "however", "D": "however:"}, "optsZh": {"A": "however,（逗號 → 造成逗號連接錯誤）", "B": "however;（分號後接的不是完整子句：錯誤）", "C": "however（無標點：錯誤）", "D": "however:（冒號：正確）"}, "answer": "D", "expl": "A colon can introduce the clarifying independent clause.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Standard English: punctuation for a contrast word and explanatory clause.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The scientist&#x27;s work involved more than <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, _______ she also designed new instruments.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The scientist's work involved more than observation, _______ she also designed new instruments.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。這位科學家的工作不只是觀察，_______ 她還設計了新的儀器。", "opts": {"A": "though:", "B": "though", "C": "though,", "D": "though;"}, "optsZh": {"A": "though:（冒號：正確）", "B": "though（無標點：錯誤）", "C": "though,（逗號 → 造成逗號連接錯誤）", "D": "though;（分號後接的不是完整子句：錯誤）"}, "answer": "A", "expl": "This punctuation marks the contrast and explanation.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Standard English: punctuation for a contrast word and explanatory clause.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The program teaches more than grammar, _______ it also builds students&#x27; confidence in speaking.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The program teaches more than grammar, _______ it also builds students' confidence in speaking.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。這個課程教的不只是文法，_______ 它也建立學生說話的信心。", "opts": {"A": "however;", "B": "however,", "C": "however:", "D": "however"}, "optsZh": {"A": "however;（分號後接的不是完整子句：錯誤）", "B": "however,（逗號 → 造成逗號連接錯誤）", "C": "however:（冒號：正確）", "D": "however（無標點：錯誤）"}, "answer": "C", "expl": "The colon introduces what the program also does.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Standard English: place a modifier next to the noun it modifies.", "vocab": false, "body": "In 1453, English King Henry VI became unfit to rule after falling gravely ill. As a result, Parliament <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appoint\" target=\"_blank\" rel=\"noopener\" data-w=\"appoint\" data-pos=\"v.\" data-en=\"to choose someone officially for a job or position\" data-zh=\"任命\">appointed<\/a> Richard, Third Duke of York, who had a strong <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a> to the English throne, to rule as Lord Protector. Upon <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recover\" target=\"_blank\" rel=\"noopener\" data-w=\"recover\" data-pos=\"v.\" data-en=\"to return to a normal or healthy state\" data-zh=\"復原；康復\">recovering<\/a> two years later, _______ forcing an angered Richard from the royal court and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=precipitate\" target=\"_blank\" rel=\"noopener\" data-w=\"precipitate\" data-pos=\"v.\" data-en=\"to cause something to happen suddenly or sooner\" data-zh=\"引發；促成\">precipitating<\/a> a series of battles later known as the Wars of the Roses.", "bodyPlain": "In 1453, English King Henry VI became unfit to rule after falling gravely ill. As a result, Parliament appointed Richard, Third Duke of York, who had a strong claim to the English throne, to rule as Lord Protector. Upon recovering two years later, _______ forcing an angered Richard from the royal court and precipitating a series of battles later known as the Wars of the Roses.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "1453 年，英格蘭國王亨利六世在重病之後失去了統治能力。因此，國會任命對英格蘭王位擁有強大繼承權的約克公爵三世理查，擔任護國公進行統治。兩年後康復時，_______ 迫使憤怒的理查離開宮廷，並引發了後來被稱為「玫瑰戰爭」的一系列戰役。", "opts": {"A": "Henry resumed his reign,", "B": "the reign of Henry resumed,", "C": "Henry's reign resumed,", "D": "it was Henry who resumed his reign,"}, "optsZh": {"A": "Henry resumed his reign,（亨利恢復了他的統治，）", "B": "the reign of Henry resumed,（亨利的統治恢復了，）", "C": "Henry's reign resumed,（亨利的統治恢復了，）", "D": "it was Henry who resumed his reign,（是亨利恢復了統治，— 使修飾語懸空）"}, "answer": "A", "expl": "'Upon recovering two years later' must describe Henry himself, so 'Henry' must be the subject; the other choices create a dangling modifier.", "explZh": "「Upon recovering two years later」描述的是亨利本人，因此主詞必須是「Henry」；其他選項會造成修飾語懸空。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Standard English: place a modifier next to the noun it modifies.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. After finishing the field survey, _______ compiled the observations into a report.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. After finishing the field survey, _______ compiled the observations into a report.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。完成田野調查後，_______ 將觀察結果彙整成一份報告。", "opts": {"A": "the students", "B": "the students' report", "C": "the observations", "D": "it was the students who"}, "optsZh": {"A": "the students（那些學生）", "B": "the students' report（學生們的報告）", "C": "the observations（那些觀察結果）", "D": "it was the students who（是那些學生— 使修飾語懸空）"}, "answer": "A", "expl": "The introductory phrase must modify the people who finished.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Standard English: place a modifier next to the noun it modifies.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. While walking through the archive, _______ noticed a mislabeled box of letters.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. While walking through the archive, _______ noticed a mislabeled box of letters.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。走過檔案館時，_______ 注意到一箱標示錯誤的信件。", "opts": {"A": "it was the historian who", "B": "the letters", "C": "the box", "D": "the historian"}, "optsZh": {"A": "it was the historian who（是那位歷史學家— 使修飾語懸空）", "B": "the letters（那些信件）", "C": "the box（那個箱子）", "D": "the historian（那位歷史學家）"}, "answer": "D", "expl": "The person walking must follow the modifier.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Standard English: place a modifier next to the noun it modifies.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. After winning the regional contest, _______ advanced to the national competition.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. After winning the regional contest, _______ advanced to the national competition.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。贏得區域比賽後，_______ 晉級全國大賽。", "opts": {"A": "it was the trophy that", "B": "the debate team's trophy", "C": "the competition", "D": "the debate team"}, "optsZh": {"A": "it was the trophy that（是那座獎盃— 使修飾語懸空）", "B": "the debate team's trophy（辯論隊的獎盃）", "C": "the competition（那場比賽）", "D": "the debate team（辯論隊）"}, "answer": "D", "expl": "The team, not the trophy or competition, won.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Standard English: place a modifier next to the noun it modifies.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Upon opening the greenhouse door, _______ saw that the seedlings had doubled in height.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. Upon opening the greenhouse door, _______ saw that the seedlings had doubled in height.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。打開溫室的門時，_______ 看到幼苗的高度已經翻倍。", "opts": {"A": "the seedlings", "B": "the botanist", "C": "it was the botanist who", "D": "the greenhouse door"}, "optsZh": {"A": "the seedlings（幼苗）", "B": "the botanist（那位植物學家）", "C": "it was the botanist who（是那位植物學家— 使修飾語懸空）", "D": "the greenhouse door（溫室的門）"}, "answer": "B", "expl": "The botanist opened the door.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Standard English: place a modifier next to the noun it modifies.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. After revising the manuscript, _______ sent it to the journal.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. After revising the manuscript, _______ sent it to the journal.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。修改完手稿後，_______ 將它寄給期刊。", "opts": {"A": "the journal", "B": "it was the manuscript that", "C": "the researchers", "D": "the manuscript"}, "optsZh": {"A": "the journal（那份期刊）", "B": "it was the manuscript that（是那份手稿— 使修飾語懸空）", "C": "the researchers（研究人員）", "D": "the manuscript（那份手稿）"}, "answer": "C", "expl": "The people revising the manuscript must be named next.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: use an example transition.", "vocab": false, "body": "Although novels and poems are considered <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinct\" target=\"_blank\" rel=\"noopener\" data-w=\"distinct\" data-pos=\"adj.\" data-en=\"clearly different or separa
