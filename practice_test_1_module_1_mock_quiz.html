nts. This classroom debate _______ respectful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disagreement\" target=\"_blank\" rel=\"noopener\" data-w=\"disagreement\" data-pos=\"n.\" data-en=\"a situation in which people have different opinions\" data-zh=\"分歧；意見不合\">disagreement<\/a> because students challenge ideas without attacking one another.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. This classroom debate _______ respectful disagreement because students challenge ideas without attacking one another.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n這場課堂辯論 _______ 尊重的異議，因為學生們挑戰觀點卻不攻擊彼此。", "opts": {"A": "distorts", "B": "epitomizes", "C": "evades", "D": "precludes"}, "optsZh": {"A": "distorts（扭曲）", "B": "epitomizes（是…的典型、集中體現）", "C": "evades（逃避）", "D": "precludes（排除、防止）"}, "answer": "B", "expl": "Epitomizes means serves as a perfect example of the principle.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "changes the shape or meaning of something so it is no longer true or accurate", "zh": "扭曲；歪曲", "word": "distorts"}, "B": {"pos": "v.", "en": "is a perfect example of something", "zh": "是…的典型；集中體現", "word": "epitomizes"}, "C": {"pos": "v.", "en": "avoids something, especially cleverly or dishonestly", "zh": "逃避；迴避", "word": "evades"}, "D": {"pos": "v.", "en": "prevents something from happening", "zh": "排除；防止；使不可能", "word": "precludes"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: identify an example that demonstrates a model.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=apprenticeship\" target=\"_blank\" rel=\"noopener\" data-w=\"apprenticeship\" data-pos=\"n.\" data-en=\"a period of learning a skill by working with an expert\" data-zh=\"學徒制；學徒期\">apprenticeship<\/a> program _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiential\" target=\"_blank\" rel=\"noopener\" data-w=\"experiential\" data-pos=\"adj.\" data-en=\"based on experience or direct observation\" data-zh=\"體驗式的\">experiential<\/a> learning: trainees master skills by working beside experts.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The apprenticeship program _______ experiential learning: trainees master skills by working beside experts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n空格周圍的句子提供了關於時間長短、證據、範圍或態度的多項線索，因此所需的字詞必須符合整篇文章的邏輯。這項學徒計畫 _______ 體驗式學習：學員透過在專家身旁工作來精通技能。", "opts": {"A": "demonstrates", "B": "repudiates", "C": "minimizes", "D": "conceals"}, "optsZh": {"A": "demonstrates（展示、證明）", "B": "repudiates（否定、拒絕接受）", "C": "minimizes（將…減至最低、輕描淡寫）", "D": "conceals（隱藏）"}, "answer": "A", "expl": "The program demonstrates the learning model.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "shows clearly by giving proof or examples", "zh": "證明；展示；說明", "word": "demonstrates"}, "B": {"pos": "v.", "en": "refuses to accept something; rejects it as untrue or unjust", "zh": "否定；拒絕接受；駁斥", "word": "repudiates"}, "C": {"pos": "v.", "en": "reduces something to the smallest possible amount; makes something seem less important", "zh": "將…減至最低；輕描淡寫", "word": "minimizes"}, "D": {"pos": "v.", "en": "hides something or keeps it secret", "zh": "隱藏；掩蓋", "word": "conceals"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: identify an example that demonstrates a model.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The orchestra&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a> with local composers _______ cultural exchange.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The orchestra's collaboration with local composers _______ cultural exchange.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n管弦樂團與地方作曲家的合作 _______ 文化交流。", "opts": {"A": "undermines", "B": "typifies", "C": "misrepresents", "D": "postpones"}, "optsZh": {"A": "undermines（削弱、破壞）", "B": "typifies（是…的典型）", "C": "misrepresents（歪曲、錯誤呈現）", "D": "postpones（延後）"}, "answer": "B", "expl": "The collaboration is a typical instance of exchange.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "gradually weakens or damages something", "zh": "削弱；破壞", "word": "undermines"}, "B": {"pos": "v.", "en": "is a typical example of something", "zh": "是…的典型；代表", "word": "typifies"}, "C": {"pos": "v.", "en": "describes something falsely or inaccurately", "zh": "歪曲；錯誤呈現", "word": "misrepresents"}, "D": {"pos": "v.", "en": "delays something to a later time", "zh": "延後；推遲", "word": "postpones"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: name two actions happening at the same time.", "vocab": true, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=parasitic\" target=\"_blank\" rel=\"noopener\" data-w=\"parasitic\" data-pos=\"adj.\" data-en=\"living on or in another organism and taking food from it\" data-zh=\"寄生的\">parasitic<\/a> dodder plant increases its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reproductive\" target=\"_blank\" rel=\"noopener\" data-w=\"reproductive\" data-pos=\"adj.\" data-en=\"relating to producing young\" data-zh=\"繁殖的\">reproductive<\/a> success by flowering at the same time as the host plant it has latched onto. In 2020, Jianqiang Wu and his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that the tiny dodder achieves this _______ with its host by absorbing and utilizing a protein the host produces when it is about to flower.", "bodyPlain": "The parasitic dodder plant increases its reproductive success by flowering at the same time as the host plant it has latched onto. In 2020, Jianqiang Wu and his colleagues determined that the tiny dodder achieves this _______ with its host by absorbing and utilizing a protein the host produces when it is about to flower.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "寄生植物菟絲子透過與其攀附的宿主植物同時開花來提高繁殖成功率。2020 年，吳建強及其同事發現，微小的菟絲子是藉由吸收並利用宿主即將開花時所產生的一種蛋白質，來達成與宿主之間的這種 _______。", "opts": {"A": "synchronization", "B": "hibernation", "C": "prediction", "D": "moderation"}, "optsZh": {"A": "synchronization（同步）", "B": "hibernation（冬眠）", "C": "prediction（預測）", "D": "moderation（適度、節制）"}, "answer": "A", "expl": "The dodder flowers 'at the same time as' its host, so what it achieves is 'synchronization'.", "explZh": "菟絲子與宿主「同時」開花，所以它達成的是「synchronization」（同步）。", "defs": {"A": {"pos": "n.", "en": "the state of happening or operating at the same time or rate", "zh": "同步", "word": "synchronization"}, "B": {"pos": "n.", "en": "a deep sleep-like state some animals enter during winter", "zh": "冬眠", "word": "hibernation"}, "C": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "D": {"pos": "n.", "en": "the quality of avoiding extremes; being reasonable", "zh": "適度；節制", "word": "moderation"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: name two actions happening at the same time.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Fireflies in the grove flashed at the same moment, creating a striking _______ visible from the path.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Fireflies in the grove flashed at the same moment, creating a striking _______ visible from the path.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n樹林裡的螢火蟲在同一刻閃光，形成了從小徑上可見的驚人 _______。", "opts": {"A": "hibernation", "B": "divergence", "C": "simultaneity", "D": "depletion"}, "optsZh": {"A": "hibernation（冬眠）", "B": "divergence（分歧、差異）", "C": "simultaneity（同時性）", "D": "depletion（耗盡、枯竭）"}, "answer": "C", "expl": "Flashing at the same moment creates simultaneity.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a deep sleep-like state some animals enter during winter", "zh": "冬眠", "word": "hibernation"}, "B": {"pos": "n.", "en": "the state of becoming different or moving apart", "zh": "分歧；差異；分叉", "word": "divergence"}, "C": {"pos": "n.", "en": "the fact of happening at exactly the same time", "zh": "同時性；同時發生", "word": "simultaneity"}, "D": {"pos": "n.", "en": "a reduction in the amount of something until little is left", "zh": "耗盡；枯竭", "word": "depletion"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: name two actions happening at the same time.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The dancers achieved perfect _______ when their steps landed on the beat together.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The dancers achieved perfect _______ when their steps landed on the beat together.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n當舞者的舞步同時踩在節拍上時，他們達成了完美的 _______。", "opts": {"A": "alignment", "B": "moderation", "C": "prediction", "D": "seclusion"}, "optsZh": {"A": "alignment（對齊、一致）", "B": "moderation（適度、節制）", "C": "prediction（預測）", "D": "seclusion（隱居、隔絕）"}, "answer": "A", "expl": "Their movements matched in timing and placement.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "an arrangement in which things are in the correct position or in agreement with each other", "zh": "對齊；一致；協調", "word": "alignment"}, "B": {"pos": "n.", "en": "the quality of avoiding extremes; being reasonable", "zh": "適度；節制", "word": "moderation"}, "C": {"pos": "n.", "en": "a statement about what will happen in the future", "zh": "預測；預言", "word": "prediction"}, "D": {"pos": "n.", "en": "the state of being private and away from other people", "zh": "隱居；隔絕", "word": "seclusion"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: name two actions happening at the same time.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The app improves _______ between audio and video so that speakers&#x27; lips match the sound.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The app improves _______ between audio and video so that speakers' lips match the sound.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n這個應用程式改善了聲音與影像之間的 _______，使說話者的嘴型與聲音吻合。", "opts": {"A": "abbreviation", "B": "coordination", "C": "resistance", "D": "erosion"}, "optsZh": {"A": "abbreviation（縮寫、縮短）", "B": "coordination（協調、配合）", "C": "resistance（抵抗）", "D": "erosion（侵蝕）"}, "answer": "B", "expl": "Audio and video must be coordinated in time.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "a shortened form of a word or phrase", "zh": "縮寫；縮短", "word": "abbreviation"}, "B": {"pos": "n.", "en": "the act of making different things work together smoothly", "zh": "協調；配合", "word": "coordination"}, "C": {"pos": "n.", "en": "the act of fighting against or refusing to accept something", "zh": "抵抗；反抗", "word": "resistance"}, "D": {"pos": "n.", "en": "the gradual wearing away of something, such as rock or soil", "zh": "侵蝕；磨損", "word": "erosion"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: name two actions happening at the same time.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The sentence around the blank supplies several clues about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=duration\" target=\"_blank\" rel=\"noopener\" data-w=\"duration\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"持續時間\">duration<\/a>, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The two clocks lost their _______ after one battery weakened.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The two clocks lost their _______ after one battery weakened.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n空格周圍的句子提供了關於時間長短、證據、範圍或態度的多項線索，因此所需的字詞必須符合整篇文章的邏輯。其中一顆電池變弱後，兩個時鐘失去了彼此的 _______。", "opts": {"A": "isolation", "B": "substitution", "C": "permanence", "D": "concordance"}, "optsZh": {"A": "isolation（孤立、隔離）", "B": "substitution（替代）", "C": "permanence（永久性）", "D": "concordance（一致、和諧）"}, "answer": "D", "expl": "Concordance means agreement or harmony, here in timing.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the state of being separate or alone", "zh": "孤立；隔離", "word": "isolation"}, "B": {"pos": "n.", "en": "the act of using one thing in place of another", "zh": "替代；取代", "word": "substitution"}, "C": {"pos": "n.", "en": "the quality of lasting forever or for a very long time", "zh": "永久性；持久性", "word": "permanence"}, "D": {"pos": "n.", "en": "a state of agreement or harmony", "zh": "一致；和諧", "word": "concordance"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: name two actions happening at the same time.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Researchers noticed the whales&#x27; breaths rose and fell in _______ as they traveled together.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers noticed the whales' breaths rose and fell in _______ as they traveled together.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n研究人員注意到鯨魚一起游動時，牠們的呼吸起伏 _______。", "opts": {"A": "opposition", "B": "unison", "C": "moderation", "D": "conjecture"}, "optsZh": {"A": "opposition（對立、反對）", "B": "unison（一致、同步）", "C": "moderation（適度、節制）", "D": "conjecture（推測；名詞）"}, "answer": "B", "expl": "Actions occurring together happen in unison.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "strong disagreement or the state of being against something", "zh": "對立；反對", "word": "opposition"}, "B": {"pos": "n.", "en": "the state of doing something at the same time, together", "zh": "一致；同步；齊聲", "word": "unison"}, "C": {"pos": "n.", "en": "the quality of avoiding extremes; being reasonable", "zh": "適度；節制", "word": "moderation"}, "D": {"pos": "n.", "en": "a guess or opinion based on incomplete information", "zh": "推測；猜想", "word": "conjecture"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: choose a word that contrasts with complexity.", "vocab": true, "body": "Given that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> in binary star systems should make planetary <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=formation\" target=\"_blank\" rel=\"noopener\" data-w=\"formation\" data-pos=\"n.\" data-en=\"the process by which something is formed\" data-zh=\"形成\">formation<\/a> nearly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=impossible\" target=\"_blank\" rel=\"noopener\" data-w=\"impossible\" data-pos=\"adj.\" data-en=\"not able to happen or be done\" data-zh=\"不可能的\">impossible<\/a>, it&#x27;s not surprising that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=existence\" target=\"_blank\" rel=\"noopener\" data-w=\"existence\" data-pos=\"n.\" data-en=\"the state of being real or present\" data-zh=\"存在\">existence<\/a> of planets in such systems has lacked _______ explanation. Roman Rafikov and Kedron Silsbee shed light on the subject when they used modeling to determine a complex set of factors that could support planets&#x27; development.", "bodyPlain": "Given that the conditions in binary star systems should make planetary formation nearly impossible, it's not surprising that the existence of planets in such systems has lacked _______ explanation. Roman Rafikov and Kedron Silsbee shed light on the subject when they used modeling to determine a complex set of factors that could support planets' development.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "既然雙星系統中的條件理應使行星幾乎不可能形成，那麼此類系統中行星的存在一直缺乏 _______ 的解釋，也就不令人意外了。Roman Rafikov 與 Kedron Silsbee 利用建模找出一組可能支持行星發展的複雜因素，為這個主題帶來了新的理解。", "opts": {"A": "a discernible", "B": "a straightforward", "C": "an inconclusive", "D": "an unbiased"}, "optsZh": {"A": "a discernible（可辨識的、看得出來的）", "B": "a straightforward（直接明瞭的、簡單的）", "C": "an inconclusive（無定論的）", "D": "an unbiased（不偏頗的、公正的）"}, "answer": "B", "expl": "Planets in binary systems were thought nearly impossible, and the explanation turned out to be 'a complex set of factors'—so a simple, 'straightforward' explanation was lacking.", "explZh": "雙星系統中的行星被認為幾乎不可能存在，而解釋又是「一組複雜的因素」，因此缺乏的是「straightforward」（直接明瞭的）解釋。", "defs": {"A": {"w": "discernible", "pos": "adj.", "en": "able to be seen, noticed, or understood", "zh": "可辨識的；看得出來的", "word": "discernible"}, "B": {"w": "straightforward", "pos": "adj.", "en": "easy to understand or simple; not complicated", "zh": "直截了當的；簡單明瞭的", "word": "straightforward"}, "C": {"w": "inconclusive", "pos": "adj.", "en": "not leading to a definite result or conclusion", "zh": "無定論的；不確定的", "word": "inconclusive"}, "D": {"w": "unbiased", "pos": "adj.", "en": "fair and not influenced by personal opinions", "zh": "不偏頗的；公正的", "word": "unbiased"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: choose a word that contrasts with complexity.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The fossil record is fragmentary, so the species&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disappearance\" target=\"_blank\" rel=\"noopener\" data-w=\"disappearance\" data-pos=\"n.\" data-en=\"the fact of no longer existing or being seen\" data-zh=\"消失\">disappearance<\/a> has resisted a _______ explanation.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The fossil record is fragmentary, so the species' disappearance has resisted a _______ explanation.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n化石紀錄殘缺不全，因此這個物種的消失一直難有 _______ 的解釋。", "opts": {"A": "unambiguous", "B": "visible", "C": "redundant", "D": "biased"}, "optsZh": {"A": "unambiguous（明確的、不含糊的）", "B": "visible（可見的）", "C": "redundant（多餘的）", "D": "biased（有偏見的）"}, "answer": "A", "expl": "Fragmentary evidence prevents an unambiguous explanation.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "clear and having only one possible meaning", "zh": "明確的；不含糊的", "word": "unambiguous"}, "B": {"pos": "adj.", "en": "able to be seen", "zh": "可見的；看得見的", "word": "visible"}, "C": {"pos": "adj.", "en": "not needed because something else already does the job", "zh": "多餘的；冗贅的", "word": "redundant"}, "D": {"pos": "adj.", "en": "unfairly preferring one person, group, or idea over another", "zh": "有偏見的；偏頗的", "word": "biased"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: choose a word that contrasts with complexity.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Because the poem shifts speakers twice, its ending ce completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n這種疾病牽涉基因、飲食與氣候，因此研究人員警告不要尋求 _______ 的原因。", "opts": {"A": "decorative", "B": "singular", "C": "temporary", "D": "discernible"}, "optsZh": {"A": "decorative（裝飾性的）", "B": "singular（單一的）", "C": "temporary（暫時的）", "D": "discernible（可辨識的）"}, "answer": "B", "expl": "Multiple factors contrast with a single cause.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "intended to look attractive rather than to be useful", "zh": "裝飾性的", "word": "decorative"}, "B": {"pos": "adj.", "en": "being only one; single; unusual", "zh": "單一的；獨特的", "word": "singular"}, "C": {"pos": "adj.", "en": "lasting only for a short time", "zh": "暫時的；臨時的", "word": "temporary"}, "D": {"pos": "adj.", "en": "able to be seen, noticed, or understood", "zh": "可辨識的；看得出來的", "word": "discernible"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: choose a word that contrasts with complexity.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https 言）", "D": "recants（撤回、公開放棄先前的主張）"}, "answer": "A", "expl": "The text later calls Harjo's attitude a 'rejection'; 'repudiates' means rejects or refuses to accept.", "explZh": "文中後面稱 Harjo 的態度為「rejection」（拒絕），「repudiates」即「否定、拒絕接受」。", "defs": {"A": {"pos": "v.", "en": "refuses to accept something; rejects it as untrue or unjust", "zh": "否定；拒絕接受；駁斥", "word": "repudiates"}, "B": {"pos": "v.", "en": "announces something publicly and officially", "zh": "宣告；聲明", "word": "proclaims"}, "C": {"pos": "v.", "en": "says what will happen in the future", "zh": "預言；預示", "word": "foretells"}, "D": {"pos": "v.", "en": "publicly withdraws a belief or statement made earlier", "zh": "撤回；公開放棄先前的主張", "word": "recants"}}}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Words in Context: select a verb meaning reject.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The novelist _______ the idea that young readers need simplified themes, filling her books with moral complexity.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The novelist _______ the idea that young readers need simplified themes, filling her books with moral complexity.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n這位小說家 _______ 年輕讀者需要簡化主題的想法，在她的書中充滿道德的複雜性。", "opts": {"A": "foretells", "B": "proclaims", "C": "challenges", "D": "echoes"}, "optsZh": {"A": "foretells（預言）", "B": "proclaims（宣告）", "C": "challenges（挑戰、質疑）", "D": "echoes（呼應、重複）"}, "answer": "C", "expl": "The action calls the idea into question.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "says what will happen in the future", "zh": "預言；預示", "word": "foretells"}, "B": {"pos": "v.", "en": "announces something publicly and officially", "zh": "宣告；聲明", "word": "proclaims"}, "C": {"pos": "v.", "en": "questions whether something is true or right", "zh": "質疑；挑戰", "word": "challenges"}, "D": {"pos": "v.", "en": "repeats or reflects an idea or sound", "zh": "呼應；重複；迴響", "word": "echoes"}}}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Words in Context: select a verb meaning reject.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. By refusing to use imported materials, the architect _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=assumption\" target=\"_blank\" rel=\"noopener\" data-w=\"assumption\" data-pos=\"n.\" data-en=\"something accepted as true without proof\" data-zh=\"假設；假定\">assumption<\/a> that luxury requires foreign stone.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By refusing to use imported materials, the architect _______ the assumption that luxury requires foreign stone.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n藉由拒絕使用進口材料，這位建築師 _______ 奢華必須仰賴外國石材的假設。", "opts": {"A": "recants", "B": "rejects", "C": "predicts", "D": "duplicates"}, "optsZh": {"A": "recants（撤回、公開放棄先前的主張）", "B": "rejects（拒絕、否定）", "C": "predicts（預測）", "D": "duplicates（複製、重複）"}, "answer": "B", "expl": "Refusing the assumption means rejecting it.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "publicly withdraws a belief or statement made earlier", "zh": "撤回；公開放棄先前的主張", "word": "recants"}, "B": {"pos": "v.", "en": "refuses to accept or agree with something", "zh": "拒絕；否定", "word": "rejects"}, "C": {"pos": "v.", "en": "says that something will happen in the future", "zh": "預測；預言", "word": "predicts"}, "D": {"pos": "v.", "en": "makes an exact copy of something", "zh": "複製；重複", "word": "duplicates"}}}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Words in Context: select a verb meaning reject.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The director&#x27;s new film _______ the genre&#x27;s usual happy ending.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The director's new film _______ the genre's usual happy ending.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n這位導演的新電影 _______ 這類型電影慣有的快樂結局。", "opts": {"A": "imitates", "B": "subverts", "C": "confirms", "D": "announces"}, "optsZh": {"A": "imitates（模仿）", "B": "subverts（顛覆）", "C": "confirms（證實）", "D": "announces（宣布）"}, "answer": "B", "expl": "Subverts means undermines or overturns an expectation.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "copies the way someone or something behaves or looks", "zh": "模仿；仿效", "word": "imitates"}, "B": {"pos": "v.", "en": "undermines or overturns an established idea or system", "zh": "顛覆；破壞", "word": "subverts"}, "C": {"pos": "v.", "en": "shows that something is definitely true", "zh": "證實；確認", "word": "confirms"}, "D": {"pos": "v.", "en": "makes something known publicly or officially", "zh": "宣布；宣告", "word": "announces"}}}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Words in Context: select a verb meaning reject.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The sentence around the blank supplies several clues about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=duration\" target=\"_blank\" rel=\"noopener\" data-w=\"duration\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"持續時間\">duration<\/a>, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The study _______ the old belief that all deep-sea organisms depend directly on sunlight.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The study _______ the old belief that all deep-sea organisms depend directly on sunlight.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n空格周圍的句子提供了關於時間長短、證據、範圍或態度的多項線索，因此所需的字詞必須符合整篇文章的邏輯。這項研究 _______ 所有深海生物都直接依賴陽光的舊有觀念。", "opts": {"A": "foretells", "B": "preserves", "C": "proclaims", "D": "discredits"}, "optsZh": {"A": "foretells（預言）", "B": "preserves（保存、維護）", "C": "proclaims（宣告）", "D": "discredits（使不可信、推翻）"}, "answer": "D", "expl": "Evidence can discredit, or undermine the credibility of, an old belief.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "says what will happen in the future", "zh": "預言；預示", "word": "foretells"}, "B": {"pos": "v.", "en": "keeps something in its original state or protects it from harm", "zh": "保存；維護；保護", "word": "preserves"}, "C": {"pos": "v.", "en": "announces something publicly and officially", "zh": "宣告；聲明", "word": "proclaims"}, "D": {"pos": "v.", "en": "causes people to stop believing or trusting something", "zh": "使不可信；推翻；使名譽受損", "word": "discredits"}}}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Words in Context: select a verb meaning reject.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. With stark photographs rather than glamorous portraits, the exhibition _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=romanticize\" target=\"_blank\" rel=\"noopener\" data-w=\"romanticize\" data-pos=\"v.\" data-en=\"to describe something as better or more appealing than it really is\" data-zh=\"浪漫化；美化\">romanticized<\/a> views of mining towns.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. With stark photographs rather than glamorous portraits, the exhibition _______ romanticized views of mining towns.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這場展覽以寫實的照片取代光鮮的肖像，_______ 對礦業小鎮的浪漫化看法。", "opts": {"A": "counters", "B": "predicts", "C": "celebrates", "D": "recants"}, "optsZh": {"A": "counters（反駁、對抗）", "B": "predicts（預測）", "C": "celebrates（讚頌、慶祝）", "D": "recants（撤回、公開放棄先前的主張）"}, "answer": "A", "expl": "The exhibition works against idealized views.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "argues or acts against something to reduce its effect", "zh": "反駁；對抗；抵銷", "word": "counters"}, "B": {"pos": "v.", "en": "says that something will happen in the future", "zh": "預測；預言", "word": "predicts"}, "C": {"pos": "v.", "en": "praises or honors something; marks a special occasion", "zh": "讚頌；慶祝", "word": "celebrates"}, "D": {"pos": "v.", "en": "publicly withdraws a belief or statement made earlier", "zh": "撤回；公開放棄先前的主張", "word": "recants"}}}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Rhetorical Synthesis: identify the main purpose of an informational passage.", "vocab": false, "body": "In 2007, computer scientist Luis von Ahn was working on converting printed books into a digital format. He found that some words were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distorted\" target=\"_blank\" rel=\"noopener\" data-w=\"distorted\" data-pos=\"adj.\" data-en=\"changed in shape so as to look unnatural or unclear\" data-zh=\"扭曲的；變形的\">distorted<\/a> enough that digital scanners couldn&#x27;t <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognize<\/a> them, but most humans could easily read them. Based on that finding, von Ahn invented a simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=security\" target=\"_blank\" rel=\"noopener\" data-w=\"security\" data-pos=\"n.\" data-en=\"protection against danger or attack\" data-zh=\"安全；保全\">security<\/a> test to keep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=automated\" target=\"_blank\" rel=\"noopener\" data-w=\"automated\" data-pos=\"adj.\" data-en=\"operated by machines without human control\" data-zh=\"自動化的\">automated<\/a> &quot;bots&quot; out of websites. The first version of the reCAPTCHA test asked users to type one known word and one of the many words scanners couldn&#x27;t recognize. Correct answers proved the users were humans and added data to the book-digitizing project.", "bodyPlain": "In 2007, computer scientist Luis von Ahn was working on converting printed books into a digital format. He found that some words were distorted enough that digital scanners couldn't recognize them, but most humans could easily read them. Based on that finding, von Ahn invented a simple security test to keep automated \"bots\" out of websites. The first version of the reCAPTCHA test asked users to type one known word and one of the many words scanners couldn't recognize. Correct answers proved the users were humans and added data to the book-digitizing project.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "2007 年，電腦科學家 Luis von Ahn 正在進行將印刷書籍轉換為數位格式的工作。他發現有些字詞扭曲到數位掃描器無法辨識，但大多數人卻能輕易讀出。基於這項發現，von Ahn 發明了一種簡單的安全測試，用來阻擋自動化「機器人」進入網站。第一版的 reCAPTCHA 測試要求使用者輸入一個已知的字詞，以及一個掃描器無法辨識的眾多字詞之一。正確的答案證明使用者是人類，同時也為書籍數位化計畫增添了資料。", "opts": {"A": "To discuss von Ahn's invention of reCAPTCHA", "B": "To explain how digital scanners work", "C": "To call attention to von Ahn's book-digitizing project", "D": "To indicate how popular reCAPTCHA is"}, "optsZh": {"A": "討論 von Ahn 發明 reCAPTCHA", "B": "解釋數位掃描器如何運作", "C": "喚起對 von Ahn 書籍數位化計畫的注意", "D": "指出 reCAPTCHA 有多受歡迎"}, "answer": "A", "expl": "Every sentence builds toward how von Ahn invented reCAPTCHA; scanners, the book project, and popularity are only supporting details.", "explZh": "全文都在說明 von Ahn 如何發明 reCAPTCHA；掃描器、書籍計畫與受歡迎程度只是細節。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Rhetorical Synthesis: identify the main purpose of an informational passage.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader&#x27;s understanding of the person, artwork, place, or debate being described. In the 1990s, engineer Maya Chen noticed that bike couriers often knew city shortcuts missing from official maps. She built a mapping app that let couriers submit routes, and the city later used the data to improve bike lanes.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader's understanding of the person, artwork, place, or debate being described. In the 1990s, engineer Maya Chen noticed that bike couriers often knew city shortcuts missing from official maps. She built a mapping app that let couriers submit routes, and the city later used the data to improve bike lanes.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n這些例子並非隨機的事實；它們共同塑造讀者對所描述的人物、藝術品、地點或爭論的理解。1990 年代，工程師 Maya Chen 注意到單車快遞員常常知道官方地圖上沒有的城市捷徑。她開發了一個讓快遞員提交路線的地圖應用程式，市政府後來利用這些資料改善了自行車道。", "opts": {"A": "To explain how GPS satellites work", "B": "To describe how Chen's observation led to a mapping tool", "C": "To compare bike couriers with city planners", "D": "To argue that official maps are never useful"}, "optsZh": {"A": "解釋 GPS 衛星如何運作", "B": "描述 Chen 的觀察如何促成一項地圖工具", "C": "比較單車快遞員與城市規劃師", "D": "主張官方地圖從來沒有用處"}, "answer": "B", "expl": "The passage focuses on the origin and use of Chen's app.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Rhetorical Synthesis: identify the main purpose of an informational passage.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A short passage explains that painter Alma Thomas arranged bright blocks of color to suggest gardens, music, and space exploration, showing how abstract art can still refer to lived experience.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A short passage explains that painter Alma Thomas arranged bright blocks of color to suggest gardens, music, and space exploration, showing how abstract art can still refer to lived experience.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n每個句子都增添一層脈絡，最終的印象取決於這些細節如何結合。一段短文說明畫家 Alma Thomas 排列鮮豔的色塊來暗示花園、音樂與太空探索，展現抽象藝術仍能指向真實的生活經驗。", "opts": {"A": "To explain one artist's use of color and reference", "B": "To criticize abstract painting", "C": "To prove that all art should depict gardens", "D": "To list every painting Thomas made"}, "optsZh": {"A": "解釋一位藝術家對色彩與指涉的運用", "B": "批評抽象繪畫", "C": "證明所有藝術都應該描繪花園", "D": "列出 Thomas 所畫的每一幅畫"}, "answer": "A", "expl": "The text explains the function of color in one artist's work.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Rhetorical Synthesis: identify the main purpose of an informational passage.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A text describes how a chemist studying mussels developed a strong adhesive for wet surfaces after observing how mussels cling to rocks underwater.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the significance of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A text describes how a chemist studying mussels developed a strong adhesive for wet surfaces after observing how mussels cling to rocks underwater.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n最後一句並未轉向無關的主題；相反地，它釐清了前文的重要性。文章從描述轉向強調，為讀者提供足夠的脈絡，看出作者透過具體細節所要發展的更廣泛論點。一篇文章描述一位研究貽貝的化學家，在觀察貽貝如何在水下附著於岩石後，開發出一種適用於潮濕表面的強力黏著劑。", "opts": {"A": "To compare oceans around the world", "B": "To describe the diet of mussels", "C": "To show how a natural process inspired a technology", "D": "To argue that synthetic glue is harmful"}, "optsZh": {"A": "比較世界各地的海洋", "B": "描述貽貝的飲食", "C": "說明一個自然過程如何啟發了一項技術", "D": "主張合成膠水是有害的"}, "answer": "C", "expl": "The central idea is biomimicry.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Rhetorical Synthesis: identify the main purpose of an informational passage.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage recounts how a librarian used community interviews to rebuild a town&#x27;s lost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> after a flood.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage recounts how a librarian used community interviews to rebuild a town's lost archive after a flood.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n一段文章敘述一位圖書館員如何在洪水過後，利用社區訪談重建一個小鎮遺失的檔案。", "opts": {"A": "To explain why floods occur", "B": "To criticize oral interviews", "C": "To compare libraries and museums", "D": "To discuss a method of preserving local history"}, "optsZh": {"A": "解釋洪水為何發生", "B": "批評口述訪談", "C": "比較圖書館與博物館", "D": "討論一種保存地方歷史的方法"}, "answer": "D", "expl": "The passage centers on preservation through interviews.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Rhetorical Synthesis: identify the main purpose of an informational passage.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A text explains that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=choreographer\" target=\"_blank\" rel=\"noopener\" data-w=\"choreographer\" data-pos=\"n.\" data-en=\"a person who designs dance movements\" data-zh=\"編舞家\">choreographer<\/a> Rennie Harris combined street dance with concert-stage traditions, helping audiences view hip-hop as a major theatrical form.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A text explains that choreographer Rennie Harris combined street dance with concert-stage traditions, helping audiences view hip-hop as a major theatrical form.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n一篇文章說明舞蹈家 Rennie Harris 將街舞與音樂會舞台傳統結合，幫助觀眾將嘻哈視為一種重要的劇場藝術形式。", "opts": {"A": "To describe Harris's role in expanding the status of hip-hop dance", "B": "To prove that street dance is older than ballet", "C": "To explain why theaters are expensive", "D": "To list the rules of hip-hop choreography"}, "optsZh": {"A": "描述 Harris 在提升嘻哈舞蹈地位上所扮演的角色", "B": "證明街舞比芭蕾更古老", "C": "解釋劇院為何昂貴", "D": "列出嘻哈舞蹈編排的規則"}, "answer": "A", "expl": "The passage discusses Harris's artistic contribution.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Structure: describe the function of a sentence in a literary excerpt.", "vocab": false, "body": "The following text is from Edith Wharton&#x27;s 1905 novel The House of Mirth. Lily Bart and a companion are walking through a park.<br><br>Lily had no real intimacy with nature, but she had a passion for the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a> and could be keenly sensitive to a scene which was the fitting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a> of her own sensations. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscape<\/a> outspread below her seemed an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=enlargement\" target=\"_blank\" rel=\"noopener\" data-w=\"enlargement\" data-pos=\"n.\" data-en=\"the act of making something bigger; a bigger version\" data-zh=\"放大；擴大\">enlargement<\/a> of her present mood, and she found something of herself in its calmness, its breadth, its long free reaches. On the nearer slopes the sugar-maples wavered like pyres of light; lower down was a massing of grey orchards, and here and there the lingering green of an oak-grove.", "bodyPlain": "The following text is from Edith Wharton's 1905 novel The House of Mirth. Lily Bart and a companion are walking through a park.\n\nLily had no real intimacy with nature, but she had a passion for the appropriate and could be keenly sensitive to a scene which was the fitting background of her own sensations. The landscape outspread below her seemed an enlargement of her present mood, and she found something of herself in its calmness, its breadth, its long free reaches. On the nearer slopes the sugar-maples wavered like pyres of light; lower down was a massing of grey orchards, and here and there the lingering green of an oak-grove.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "以下文字出自 Edith Wharton 1905 年的小說《歡樂之家》（The House of Mirth）。Lily Bart 與一位同伴正走過一座公園。\nLily 與大自然並無真正的親密感，但她熱愛「合宜」之事，並能敏銳地感受那些恰好襯托她自身感受的景色。展開在她腳下的風景彷彿是她當下心境的放大，她在它的寧靜、遼闊與綿延自由的伸展中，找到了某種自己的影子。在較近的山坡上，糖楓像光的火堆般搖曳；再往下是一片灰色的果園，零星點綴著橡樹林尚未褪去的綠意。", "opts": {"A": "It creates a detailed image of the physical setting of the scene.", "B": "It establishes that a character is experiencing an internal conflict.", "C": "It makes an assertion that the next sentence then expands on.", "D": "It illustrates an idea that is introduced in the previous sentence."}, "optsZh": {"A": "它為場景的實體環境營造出細緻的畫面。", "B": "它確立了某個角色正經歷內心衝突。", "C": "它提出一個主張，接著由下一句加以延伸。", "D": "它舉例說明前一句所提出的想法。"}, "answer": "D", "expl": "The previous sentence says Lily is sensitive to scenes that fit her feelings; the underlined sentence illustrates this by showing the landscape as an 'enlargement of her present mood'.", "explZh": "前一句說 Lily 對襯托自身感受的景色很敏銳；畫線句以「風景彷彿是她心境的放大」來舉例說明這個想法。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Structure: describe the function of a sentence in a literary excerpt.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The surrounding sentences make the underlined portion part of a deliberate structure, not merely an extra piece of information inserted for background. A passage first states that a character is unusually attentive to sound. The next sentence says she can identify a train before it appears by listening to
