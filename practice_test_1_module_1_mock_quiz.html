y study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. Hybrid literary works mix genres. A verse novel, _______, tells a story through poetry.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) for example,\nC) by contrast,\nD) consequently,", "answer": "B", "explanation": "A verse novel is an example of a hybrid work."}]}, {"n": 30, "concept": "Transitions: signal contrast.", "original": "At two weeks old, the time their critical socialization period begins, wolves can smell but cannot yet see or hear. Domesticated dogs, _______ can see, hear, and smell by the end of two weeks. This relative lack of sensory input may help explain why wolves behave so differently around humans than dogs do: from a very young age, wolves are more wary and less exploratory.\n\nWhich choice completes the text with the most logical transition?\nA) in other words,\nB) for instance,\nC) by contrast,\nD) accordingly,", "generated": [{"id": "30.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The relationship between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. Desert nights can be cold. _______, desert afternoons may be intensely hot.\n\nWhich choice completes the text with the most logical transition?\n\nA) By contrast,\nB) In other words,\nC) Accordingly,\nD) For example,", "answer": "A", "explanation": "The sentence contrasts nights and afternoons."}, {"id": "30.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. The first fabric absorbed water quickly. _______, the second repelled water almost completely.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) For instance,\nC) Therefore,\nD) By contrast,", "answer": "D", "explanation": "The two fabrics behave oppositely."}, {"id": "30.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Young wolves are cautious around unfamiliar animals. _______, many young dogs approach them readily.\n\nWhich choice completes the text with the most logical transition?\n\nA) Accordingly,\nB) For example,\nC) By contrast,\nD) In other words,", "answer": "C", "explanation": "The dog behavior contrasts with wolf behavior."}, {"id": "30.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The second sentence may illustrate a point, challenge an expectation, identify a result, or introduce a related development that follows from the previous claim. The old bridge was narrow and steep. _______, the new bridge is wide and nearly level.\n\nWhich choice completes the text with the most logical transition?\n\nA) In other words,\nB) By contrast,\nC) Consequently,\nD) For instance,", "answer": "B", "explanation": "The new bridge differs from the old one."}, {"id": "30.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. The northern coast receives heavy rain. _______, the inland plateau is usually dry.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Similarly,\nC) In other words,\nD) By contrast,", "answer": "D", "explanation": "The two regions are contrasted."}]}, {"n": 31, "concept": "Transitions: signal an increasing trend.", "original": "Researchers Helena Mihaljevic-Brandt, Lucia Santamaria, and Marco Tullney report that while mathematicians may have traditionally worked alone, evidence points to a shift in the opposite direction. _______ mathematicians are choosing to collaborate with their peers - a trend illustrated by a rise in the number of mathematics publications credited to multiple authors.\n\nWhich choice completes the text with the most logical transition?\nA) Similarly,\nB) For this reason,\nC) Furthermore,\nD) Increasingly,", "generated": [{"id": "31.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The relationship between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. For decades, few journals accepted collaborative submissions in this field. _______, multi-author papers are becoming common.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) For this reason,\nC) Increasingly,\nD) Nevertheless,", "answer": "C", "explanation": "The transition signals a growing trend."}, {"id": "31.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. Historians once relied mainly on printed archives. _______, they are using digital databases to compare thousands of records.\n\nWhich choice completes the text with the most logical transition?\n\nA) By contrast,\nB) For example,\nC) In other words,\nD) Increasingly,", "answer": "D", "explanation": "The sentence describes a developing shift."}, {"id": "31.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Early climate models were run by small teams. _______, large international groups are sharing data and code.\n\nWhich choice completes the text with the most logical transition?\n\nA) Consequently,\nB) Similarly,\nC) Increasingly,\nD) For instance,", "answer": "C", "explanation": "The trend is toward more collaboration."}, {"id": "31.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The second sentence may illustrate a point, challenge an expectation, identify a result, or introduce a related development that follows from the previous claim. Museums traditionally displayed finished objects. _______, they are showing sketches and prototypes to reveal artists' processes.\n\nWhich choice completes the text with the most logical transition?\n\nA) Increasingly,\nB) However,\nC) In other words,\nD) Accordingly,", "answer": "A", "explanation": "The transition signals a recent growing practice."}, {"id": "31.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. Publishers once issued most textbooks only in print. _______, they offer interactive digital versions.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) Increasingly,\nC) For this reason,\nD) Secondly,", "answer": "B", "explanation": "The sentence marks an increasing change."}]}, {"n": 32, "concept": "Student Notes: synthesize a study and its findings.", "original": "While researching a topic, a student has taken notes about pterosaurs and a 2021 study by Anusuya Chinsamy-Turan. The notes say she analyzed pterosaur jawbone fragments from the Sahara Desert, used advanced microscope techniques, found few growth lines relative to fully grown pterosaurs, and concluded the bones belonged to juveniles.\n\nThe student wants to present the study and its findings. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) In 2021, Chinsamy-Turan studied pterosaur jawbones and was initially unsure if the bones belonged to juveniles or adults.\nB) Pterosaur jawbones located in the Sahara Desert were the focus of a 2021 study.\nC) In a 2021 study, Chinsamy-Turan used advanced microscope techniques to analyze the jawbones of pterosaurs, flying reptiles that existed millions of years ago.\nD) In a 2021 study, Chinsamy-Turan determined that pterosaur jawbones located in the Sahara Desert had few growth lines relative to the bones of fully grown pterosaurs and thus belonged to juveniles.", "generated": [{"id": "32.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student has gathered notes on a topic and now needs to use them for a specific writing purpose. The notes include extra details, so the response must select only the information that advances the stated goal and combine it accurately in one clear sentence. Notes: A 2022 study tracked bees in city gardens; researchers counted visits to native and nonnative flowers; bees visited native flowers twice as often; researchers recommended planting native species. Goal: present the study and its finding. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Some gardens include native plants.\nB) Researchers counted flowers in city gardens.\nC) A 2022 study found that city-garden bees visited native flowers twice as often as nonnative flowers.\nD) Bees are important pollinators.", "answer": "C", "explanation": "It states the study and the finding."}, {"id": "32.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A strong response synthesizes the relevant details rather than copying unrelated facts, and it keeps the emphasis aligned with the purpose named in the prompt. Notes: Dr. Elena Park studied lake sediment; she measured pollen layers; older layers had little pine pollen; newer layers had abundant pine pollen; she concluded the region became cooler and wetter. Goal: present the study and finding. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Lake sediment can contain pollen.\nB) Dr. Park studied lake sediment and concluded from pollen layers that the region became cooler and wetter.\nC) Dr. Park is a scientist.\nD) Pine pollen appeared in some layers.", "answer": "B", "explanation": "It includes both method and finding."}, {"id": "32.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some information may be accurate but irrelevant, while the useful details must be arranged so that the final sentence directly accomplishes the requested rhetorical goal. Notes: A historian analyzed shipping logs; the logs listed cargo, dates, and crew names; she found that small ports traded more widely than previously thought. Goal: present the research and finding. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) By analyzing shipping logs, the historian found that small ports traded more widely than scholars had believed.\nB) Shipping logs often list cargo.\nC) Small ports existed near large ports.\nD) The historian studied documents.", "answer": "A", "explanation": "It joins source, method, and conclusion."}, {"id": "32.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Several possible responses could be factually consistent with the notes, but only one uses the notes strategically. The sentence should emphasize the relationship, contrast, similarity, chronology, or achievement that the student has been asked to highlight. Notes: A 2021 study examined ceramic fragments; chemical tests showed traces of cacao; researchers concluded the cups were used for chocolate drinks. Goal: present the study and finding. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Ceramic fragments can be tested by scientists.\nB) The study happened in 2021.\nC) Cacao was used in some drinks.\nD) Chemical tests in a 2021 study showed cacao traces on ceramic fragments, leading researchers to conclude that the cups held chocolate drinks.", "answer": "D", "explanation": "It includes the evidence and conclusion."}, {"id": "32.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The response must remain concise and accurate while selecting the details that best serve the student's stated writing objective. Notes: Marine biologists tagged young sharks; tags recorded long-distance travel; the sharks returned to the same nursery each spring; researchers concluded the species has strong site fidelity. Goal: present the study and finding. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Marine biologists use tags to track sharks.\nB) The nursery was visited in spring.\nC) Young sharks swim long distances.\nD) After tagging young sharks, marine biologists found that the sharks returned to the same nursery each spring, showing strong site fidelity.", "answer": "D", "explanation": "It presents the study and its finding."}]}, {"n": 33, "concept": "Student Notes: compare two people's contributions.", "original": "While researching a topic, a student has taken notes about African American women in the Civil Rights Movement and the 1963 March on Washington. The notes say Anna Hedgeman helped organize the march and worked behind the scenes to make sure a woman was included in the lineup of speakers. Daisy Bates, a journalist and school desegregation advocate, was the sole woman to speak, delivering a brief but memorable address.\n\nThe student wants to compare the two women's contributions to the March on Washington. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Hedgeman and Bates contributed to the march in different ways; Bates, for example, delivered a brief but memorable address.\nB) Hedgeman worked in politics and helped organize the march, while Bates was a journalist and school desegregation advocate.\nC) Although Hedgeman worked behind the scenes to make sure a woman speaker was included, Bates was the sole woman to speak at the march.\nD) Many African American women, including Bates and Hedgeman, fought for civil rights, but only one spoke at the march.", "generated": [{"id": "33.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student has gathered notes on a topic and now needs to use them for a specific writing purpose. The notes include extra details, so the response must select only the information that advances the stated goal and combine it accurately in one clear sentence. Notes: Amara Singh recruited volunteers for a food drive; Mateo Ruiz designed posters and managed social media; both helped increase donations. Goal: compare their contributions. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The food drive collected donations.\nB) Singh contributed by recruiting volunteers, while Ruiz promoted the drive through posters and social media.\nC) Both Singh and Ruiz helped with a food drive.\nD) Ruiz designed posters.", "answer": "B", "explanation": "It compares the two roles directly."}, {"id": "33.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A strong response synthesizes the relevant details rather than copying unrelated facts, and it keeps the emphasis aligned with the purpose named in the prompt. Notes: Composer Tania Leon wrote orchestral works; conductor Marin Alsop premiered works by living composers; both expanded access to contemporary classical music. Goal: compare their contributions. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Leon contributed by composing new works, whereas Alsop contributed by bringing new works to audiences.\nB) Alsop is a conductor.\nC) Classical music includes orchestral works.\nD) Leon and Alsop both work in music.", "answer": "A", "explanation": "It compares distinct contributions."}, {"id": "33.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some information may be accurate but irrelevant, while the useful details must be arranged so that the final sentence directly accomplishes the requested rhetorical goal. Notes: Dr. Mei Lin designed the vaccine trial; nurse Ana Cruz coordinated patient follow-up; both were essential to the project. Goal: compare their contributions. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Patient follow-up was important.\nB) The vaccine trial involved many people.\nC) Lin shaped the study design, while Cruz managed follow-up with patients.\nD) Lin and Cruz both worked on a vaccine project.", "answer": "C", "explanation": "It identifies each person's contribution."}, {"id": "33.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Several possible responses could be factually consistent with the notes, but only one uses the notes strategically. The sentence should emphasize the relationship, contrast, similarity, chronology, or achievement that the student has been asked to highlight. Notes: Photographer Roy DeCarava took portraits of jazz musicians; writer Langston Hughes supplied poems for their joint book; the book combined image and text. Goal: compare their contributions. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Hughes was a writer.\nB) Jazz musicians appear in portraits.\nC) DeCarava and Hughes made a book together.\nD) DeCarava contributed photographs, whereas Hughes contributed poems to the collaborative book.", "answer": "D", "explanation": "It compares the contributions of both people."}, {"id": "33.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The response must remain concise and accurate while selecting the details that best serve the student's stated writing objective. Notes: Anna Hedgeman helped secure a woman speaker for the march; Daisy Bates delivered the speech; both influenced women's visibility at the event. Goal: compare their contributions. Which sentence best accomplishes the goal?\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Hedgeman worked behind the scenes to secure a woman speaker, while Bates contributed by speaking at the march.\nB) A woman speaker appeared at the event.\nC) Bates delivered a speech at the march.\nD) Hedgeman and Bates both supported civil rights.", "answer": "A", "explanation": "It directly compares behind-the-scenes organizing with public speaking."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
</body>
