 the rails hum. What is the function of the second sentence?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The surrounding sentences make the underlined portion part of a deliberate structure, not merely an extra piece of information inserted for background. A passage first states that a character is unusually attentive to sound. The next sentence says she can identify a train before it appears by listening to the rails hum. What is the function of the second sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n周圍的句子使畫線部分成為刻意安排的結構的一部分，而不只是插入作為背景的額外資訊。一段文章先指出某個角色對聲音異常敏銳。下一句說她能藉由聆聽鐵軌的嗡嗡聲，在火車出現之前就辨認出它。第二句的功能是什麼？", "opts": {"A": "It shifts the topic to train engineering.", "B": "It contradicts the first sentence.", "C": "It summarizes the whole plot.", "D": "It gives an example of the trait introduced in the first sentence."}, "optsZh": {"A": "它把主題轉到火車工程上。", "B": "它與第一句互相矛盾。", "C": "它總結整個情節。", "D": "它舉例說明第一句所提出的特質。"}, "answer": "D", "expl": "The second sentence illustrates the earlier claim.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Structure: describe the function of a sentence in a literary excerpt.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The underlined sentence therefore has to be interpreted through its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> to the sentences around it. A research summary states that a drug may reduce migraines. The next sentence explains that scientists compared weekly headache reports from 800 patients taking the drug with reports from a placebo group. What is the function of the second sentence?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The underlined sentence therefore has to be interpreted through its relationship to the sentences around it. A research summary states that a drug may reduce migraines. The next sentence explains that scientists compared weekly headache reports from 800 patients taking the drug with reports from a placebo group. What is the function of the second sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n因此，畫線句子必須透過它與周圍句子的關係來理解。一篇研究摘要指出某種藥物可能減少偏頭痛。下一句解釋科學家比較了 800 名服用該藥物的病患與安慰劑組的每週頭痛報告。第二句的功能是什麼？", "opts": {"A": "It describes part of the study's method.", "B": "It introduces an unrelated example.", "C": "It presents an opposing theory.", "D": "It states the final result."}, "optsZh": {"A": "它描述了研究方法的一部分。", "B": "它引入一個無關的例子。", "C": "它提出一個對立的理論。", "D": "它陳述最終結果。"}, "answer": "A", "expl": "Comparing groups is methodology.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Structure: describe the function of a sentence in a literary excerpt.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. It may introduce an example, qualify an earlier statement, identify a contrast, or prepare readers for the explanation that follows. A poem excerpt opens by saying the city wakes slowly. The next line describes shutters lifting, carts rattling, and bakers lighting ovens. What is the function of the second line?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. It may introduce an example, qualify an earlier statement, identify a contrast, or prepare readers for the explanation that follows. A poem excerpt opens by saying the city wakes slowly. The next line describes shutters lifting, carts rattling, and bakers lighting ovens. What is the function of the second line?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n它可能引入一個例子、限定先前的陳述、指出對比，或為接下來的說明做準備。一段詩的節選開頭說城市緩緩醒來。下一行描述百葉窗升起、推車咯咯作響、麵包師點燃烤爐。第二行的功能是什麼？", "opts": {"A": "It defines a technical term.", "B": "It provides images that develop the opening idea.", "C": "It explains the speaker's childhood.", "D": "It rejects the opening idea."}, "optsZh": {"A": "它定義了一個專業術語。", "B": "它提供發展開頭想法的意象。", "C": "它解釋了說話者的童年。", "D": "它否定開頭的想法。"}, "answer": "B", "expl": "The details expand the idea of the city waking.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Text Structure: describe the function of a sentence in a literary excerpt.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The function of that sentence becomes clear only when the whole paragraph is considered as a sequence. A paragraph claims that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculpture<\/a> invites movement around it. The following sentence notes that different shapes appear as viewers circle the work. What is the function of the following sentence?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The function of that sentence becomes clear only when the whole paragraph is considered as a sequence. A paragraph claims that a sculpture invites movement around it. The following sentence notes that different shapes appear as viewers circle the work. What is the function of the following sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n只有把整段視為一個連續的序列，那個句子的功能才會變得清楚。一段文字聲稱某件雕塑邀請觀者環繞它移動。接下來的句子指出，觀者繞著作品走時會看見不同的形狀。接下來這句的功能是什麼？", "opts": {"A": "It supports the claim with a concrete observation.", "B": "It offers a counterargument.", "C": "It introduces the sculptor's biography.", "D": "It changes the subject to painting."}, "optsZh": {"A": "它以具體的觀察支持該主張。", "B": "它提出一個反駁論點。", "C": "它引入雕塑家的生平。", "D": "它把主題轉到繪畫上。"}, "answer": "A", "expl": "The observation supports the claim.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Text Structure: describe the function of a sentence in a literary excerpt.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The underlined sentence occupies a turning point between the opening information and the conclusion, so its role depends on both what precedes it and what follows it. A science passage says the team&#x27;s conclusion was unexpected. The next sentence says previous models had predicted the opposite result. What is the function of the next sentence?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The underlined sentence occupies a turning point between the opening information and the conclusion, so its role depends on both what precedes it and what follows it. A science passage says the team's conclusion was unexpected. The next sentence says previous models had predicted the opposite result. What is the function of the next sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n畫線句子位於開頭資訊與結論之間的轉折點，因此它的作用取決於前文與後文。一篇科學文章說研究團隊的結論出乎意料。下一句說先前的模型預測了相反的結果。下一句的功能是什麼？", "opts": {"A": "It gives the study's sample size.", "B": "It provides a quotation from a participant.", "C": "It explains why the conclusion was surprising.", "D": "It lists materials used in the experiment."}, "optsZh": {"A": "它給出研究的樣本數。", "B": "它提供一位參與者的引言。", "C": "它解釋了為何結論令人意外。", "D": "它列出實驗中使用的材料。"}, "answer": "C", "expl": "The previous models make the result unexpected.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Text Structure: identify a methodology sentence in a research summary.", "vocab": false, "body": "A study by a team including finance <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=professor\" target=\"_blank\" rel=\"noopener\" data-w=\"professor\" data-pos=\"n.\" data-en=\"a senior teacher at a university\" data-zh=\"教授\">professor<\/a> Madhu Veeraraghavan suggests that exposure to sunshine during the workday can lead to overly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a> behavior. <u>Using data spanning from 1994 to 2010 for a set of US companies, the team compared over 29,000 annual <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=earnings\" target=\"_blank\" rel=\"noopener\" data-w=\"earnings\" data-pos=\"n.\" data-en=\"the profit a company makes; money earned\" data-zh=\"盈餘；收入\">earnings<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=forecast\" target=\"_blank\" rel=\"noopener\" data-w=\"forecast\" data-pos=\"n.\" data-en=\"a statement of what is expected to happen in the future\" data-zh=\"預測\">forecasts<\/a> to the actual earnings later reported by those companies.<\/u> The team found that the greater the exposure to sunshine at work in the two weeks before a manager submitted an earnings forecast, the more the manager&#x27;s forecast exceeded what the company actually earned that year.", "bodyPlain": "A study by a team including finance professor Madhu Veeraraghavan suggests that exposure to sunshine during the workday can lead to overly optimistic behavior. Using data spanning from 1994 to 2010 for a set of US companies, the team compared over 29,000 annual earnings forecasts to the actual earnings later reported by those companies. The team found that the greater the exposure to sunshine at work in the two weeks before a manager submitted an earnings forecast, the more the manager's forecast exceeded what the company actually earned that year.", "stem": "Which choice best states the function of the underlined sentence in the overall structure of the text?", "stemZh": "哪個選項最能說明畫線句子在文章整體結構中的功能？", "bodyZh": "一項由包括財務學教授 Madhu Veeraraghavan 在內的團隊所做的研究顯示，工作日曝露於陽光下可能導致過度樂觀的行為。研究團隊使用 1994 至 2010 年間一組美國公司的資料，將超過 29,000 份年度盈餘預測與這些公司之後實際公布的盈餘進行比較。團隊發現，經理人在提交盈餘預測前兩週在工作中曝露於陽光越多，其預測就越超過公司當年的實際盈餘。", "opts": {"A": "To summarize the results of the team's analysis", "B": "To present a specific example that illustrates the study's findings", "C": "To explain part of the methodology used in the team's study", "D": "To call out a challenge the team faced in conducting its analysis"}, "optsZh": {"A": "總結研究團隊的分析結果", "B": "提出一個說明研究發現的具體例子", "C": "解釋研究團隊所使用的部分研究方法", "D": "指出研究團隊在進行分析時面臨的一項挑戰"}, "answer": "C", "expl": "The underlined sentence describes what data the team used and how they compared forecasts to actual earnings—that is methodology, not results.", "explZh": "畫線句說明研究團隊使用了哪些資料、如何比較預測與實際盈餘──這是研究方法，而非結果。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Text Structure: identify a methodology sentence in a research summary.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The surrounding sentences make the underlined portion part of a deliberate structure, not merely an extra piece of information inserted for background. A passage first states that a character is unusually attentive to sound. The next sentence says she can identify a train before it appears by listening to the rails hum. What is the function of the second sentence?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The surrounding sentences make the underlined portion part of a deliberate structure, not merely an extra piece of information inserted for background. A passage first states that a character is unusually attentive to sound. The next sentence says she can identify a train before it appears by listening to the rails hum. What is the function of the second sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n周圍的句子使畫線部分成為刻意安排的結構的一部分，而不只是插入作為背景的額外資訊。一段文章先指出某個角色對聲音異常敏銳。下一句說她能藉由聆聽鐵軌的嗡嗡聲，在火車出現之前就辨認出它。第二句的功能是什麼？", "opts": {"A": "It gives an example of the trait introduced in the first sentence.", "B": "It summarizes the whole plot.", "C": "It contradicts the first sentence.", "D": "It shifts the topic to train engineering."}, "optsZh": {"A": "它舉例說明第一句所提出的特質。", "B": "它總結整個情節。", "C": "它與第一句互相矛盾。", "D": "它把主題轉到火車工程上。"}, "answer": "A", "expl": "The second sentence illustrates the earlier claim.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Text Structure: identify a methodology sentence in a research summary.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The underlined sentence therefore has to be interpreted through its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> to the sentences around it. A research summary states that a drug may reduce migraines. The next sentence explains that scientists compared weekly headache reports from 800 patients taking the drug with reports from a placebo group. What is the function of the second sentence?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The underlined sentence therefore has to be interpreted through its relationship to the sentences around it. A research summary states that a drug may reduce migraines. The next sentence explains that scientists compared weekly headache reports from 800 patients taking the drug with reports from a placebo group. What is the function of the second sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n因此，畫線句子必須透過它與周圍句子的關係來理解。一篇研究摘要指出某種藥物可能減少偏頭痛。下一句解釋科學家比較了 800 名服用該藥物的病患與安慰劑組的每週頭痛報告。第二句的功能是什麼？", "opts": {"A": "It introduces an unrelated example.", "B": "It describes part of the study's method.", "C": "It presents an opposing theory.", "D": "It states the final result."}, "optsZh": {"A": "它引入一個無關的例子。", "B": "它描述了研究方法的一部分。", "C": "它提出一個對立的理論。", "D": "它陳述最終結果。"}, "answer": "B", "expl": "Comparing groups is methodology.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Text Structure: identify a methodology sentence in a research summary.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. It may introduce an example, qualify an earlier statement, identify a contrast, or prepare readers for the explanation that follows. A poem excerpt opens by saying the city wakes slowly. The next line describes shutters lifting, carts rattling, and bakers lighting ovens. What is the function of the second line?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. It may introduce an example, qualify an earlier statement, identify a contrast, or prepare readers for the explanation that follows. A poem excerpt opens by saying the city wakes slowly. The next line describes shutters lifting, carts rattling, and bakers lighting ovens. What is the function of the second line?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n它可能引入一個例子、限定先前的陳述、指出對比，或為接下來的說明做準備。一段詩的節選開頭說城市緩緩醒來。下一行描述百葉窗升起、推車咯咯作響、麵包師點燃烤爐。第二行的功能是什麼？", "opts": {"A": "It rejects the opening idea.", "B": "It explains the speaker's childhood.", "C": "It defines a technical term.", "D": "It provides images that develop the opening idea."}, "optsZh": {"A": "它否定開頭的想法。", "B": "它解釋了說話者的童年。", "C": "它定義了一個專業術語。", "D": "它提供發展開頭想法的意象。"}, "answer": "D", "expl": "The details expand the idea of the city waking.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Text Structure: identify a methodology sentence in a research summary.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The function of that sentence becomes clear only when the whole paragraph is considered as a sequence. A paragraph claims that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculpture<\/a> invites movement around it. The following sentence notes that different shapes appear as viewers circle the work. What is the function of the following sentence?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The function of that sentence becomes clear only when the whole paragraph is considered as a sequence. A paragraph claims that a sculpture invites movement around it. The following sentence notes that different shapes appear as viewers circle the work. What is the function of the following sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n只有把整段視為一個連續的序列，那個句子的功能才會變得清楚。一段文字聲稱某件雕塑邀請觀者環繞它移動。接下來的句子指出，觀者繞著作品走時會看見不同的形狀。接下來這句的功能是什麼？", "opts": {"A": "It offers a counterargument.", "B": "It changes the subject to painting.", "C": "It introduces the sculptor's biography.", "D": "It supports the claim with a concrete observation."}, "optsZh": {"A": "它提出一個反駁論點。", "B": "它把主題轉到繪畫上。", "C": "它引入雕塑家的生平。", "D": "它以具體的觀察支持該主張。"}, "answer": "D", "expl": "The observation supports the claim.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Text Structure: identify a methodology sentence in a research summary.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The underlined sentence occupies a turning point between the opening information and the conclusion, so its role depends on both what precedes it and what follows it. A science passage says the team&#x27;s conclusion was unexpected. The next sentence says previous models had predicted the opposite result. What is the function of the next sentence?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The underlined sentence occupies a turning point between the opening information and the conclusion, so its role depends on both what precedes it and what follows it. A science passage says the team's conclusion was unexpected. The next sentence says previous models had predicted the opposite result. What is the function of the next sentence?", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫線句子在整篇文章中的功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n畫線句子位於開頭資訊與結論之間的轉折點，因此它的作用取決於前文與後文。一篇科學文章說研究團隊的結論出乎意料。下一句說先前的模型預測了相反的結果。下一句的功能是什麼？", "opts": {"A": "It provides a quotation from a participant.", "B": "It lists materials used in the experiment.", "C": "It explains why the conclusion was surprising.", "D": "It gives the study's sample size."}, "optsZh": {"A": "它提供一位參與者的引言。", "B": "它列出實驗中使用的材料。", "C": "它解釋了為何結論令人意外。", "D": "它給出研究的樣本數。"}, "answer": "C", "expl": "The previous models make the result unexpected.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Information and Ideas: locate a directly stated detail in a literary passage.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Edith Nesbit&#x27;s 1906 novel The Railway Children.<br><br>Mother did not spend all her time in paying dull visits to dull ladies, and sitting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dully\" target=\"_blank\" rel=\"noopener\" data-w=\"dully\" data-pos=\"adv.\" data-en=\"in a boring, uninterested way\" data-zh=\"無趣地\">dully<\/a> at home waiting for dull ladies to pay visits to her. She was almost always there, ready to play with the children, and read to them, and help them to do their home-lessons. Besides this she used to write stories for them while they were at school, and read them aloud after tea, and she always made up funny pieces of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=poetry\" target=\"_blank\" rel=\"noopener\" data-w=\"poetry\" data-pos=\"n.\" data-en=\"poems in general\" data-zh=\"詩\">poetry<\/a> for their birthdays and for other great <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=occasion\" target=\"_blank\" rel=\"noopener\" data-w=\"occasion\" data-pos=\"n.\" data-en=\"a special event or time\" data-zh=\"場合\">occasions<\/a>.<br><br>According to the text, what is true about Mother?", "bodyPlain": "The following text is adapted from Edith Nesbit's 1906 novel The Railway Children.\n\nMother did not spend all her time in paying dull visits to dull ladies, and sitting dully at home waiting for dull ladies to pay visits to her. She was almost always there, ready to play with the children, and read to them, and help them to do their home-lessons. Besides this she used to write stories for them while they were at school, and read them aloud after tea, and she always made up funny pieces of poetry for their birthdays and for other great occasions.\n\nAccording to the text, what is true about Mother?", "stem": "", "stemZh": "", "bodyZh": "以下文字改編自 Edith Nesbit 1906 年的小說《鐵路邊的孩子們》（The Railway Children）。\n母親並沒有把所有時間都花在對無趣的女士們進行無趣的拜訪，或無趣地坐在家裡等無趣的女士們來拜訪她。她幾乎總是在那裡，隨時準備和孩子們玩耍、唸書給他們聽，並幫助他們完成家庭作業。除此之外，她還會在孩子們上學時為他們寫故事，喝完下午茶後朗讀給他們聽，而且總是為他們的生日和其他重要場合編寫有趣的詩。\n根據本文，關於母親的敘述何者正確？", "opts": {"A": "She wishes that more ladies would visit her.", "B": "Birthdays are her favorite special occasion.", "C": "She creates stories and poems for her children.", "D": "Reading to her children is her favorite activity."}, "optsZh": {"A": "她希望有更多的女士來拜訪她。", "B": "生日是她最喜愛的特別場合。", "C": "她為孩子們創作故事與詩。", "D": "唸書給孩子聽是她最喜愛的活動。"}, "answer": "C", "expl": "The text directly states that Mother wrote stories for the children and made up poetry for their birthdays.", "explZh": "文中直接說母親為孩子們寫故事，並為他們的生日編寫詩。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Information and Ideas: locate a directly stated detail in a literary passage.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader&#x27;s understanding of the person, artwork, place, or debate being described. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader's understanding of the person, artwork, place, or debate being described. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n這些例子並非隨機的事實；它們共同塑造讀者對所描述的人物、藝術品、地點或爭論的理解。一段文章說一位詩人把河流既描寫成道路也描寫成鏡子，暗示旅行也能通往自我認識。", "opts": {"A": "The river represents movement and reflection.", "B": "The river is unsafe for travelers.", "C": "The poem is mainly about farming.", "D": "The poet dislikes mirrors."}, "optsZh": {"A": "這條河代表著移動與反思。", "B": "這條河對旅人來說不安全。", "C": "這首詩主要是關於農耕。", "D": "這位詩人不喜歡鏡子。"}, "answer": "A", "expl": "Both metaphors point to travel and self-knowledge.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Information and Ideas: locate a directly stated detail in a literary passage.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A student claims that a diary has historical value because it records ordinary workers&#x27; daily routines. Which finding best supports the claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n每個句子都增添一層脈絡，最終的印象取決於這些細節如何結合。一名學生主張一本日記具有歷史價值，因為它記錄了普通工人的日常作息。哪一項發現最能支持這個主張？", "opts": {"A": "The writer sometimes misspelled common words.", "B": "The diary describes meals, wages, tools, and conversations in a textile mill.", "C": "The diary's cover was made of expensive leather.", "D": "The diary was sold at auction in 1998."}, "optsZh": {"A": "作者有時會拼錯常見的單字。", "B": "這本日記描述了一間紡織廠裡的餐食、工資、工具與對話。", "C": "這本日記的封面是用昂貴的皮革製成的。", "D": "這本日記於 1998 年在拍賣會上售出。"}, "answer": "B", "expl": "Details about daily routines support historical value.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Information and Ideas: locate a directly stated detail in a literary passage.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A scientist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesizes\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesizes\" data-pos=\"v.\" data-en=\"suggests a possible explanation that has not yet been proven\" data-zh=\"提出假設\">hypothesizes<\/a> that a beetle&#x27;s bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the significance of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n最後一句並未轉向無關的主題；相反地，它釐清了前文的重要性。文章從描述轉向強調，為讀者提供足夠的脈絡，看出作者透過具體細節所要發展的更廣泛論點。一位科學家假設某種甲蟲鮮豔的顏色是在警告掠食者它的味道苦澀。哪一項發現最能直接支持這個假設？", "opts": {"A": "The beetle's wings are shorter than its body.", "B": "The beetle lives in several types of forest.", "C": "Some beetles are active at night.", "D": "Birds avoid models painted the beetle's color after tasting one real beetle."}, "optsZh": {"A": "這種甲蟲的翅比身體短。", "B": "這種甲蟲生活在好幾種類型的森林中。", "C": "有些甲蟲在夜間活動。", "D": "鳥類在嚐過一隻真的甲蟲後，會避開塗上該甲蟲顏色的模型。"}, "answer": "D", "expl": "Predators avoiding the color supports warning coloration.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Information and Ideas: locate a directly stated detail in a literary passage.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A text states that an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> city&#x27;s population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n一篇文章指出，一座古城的人口在降雨量減少的情況下仍快速成長。考古學家發現了同一時期新建的運河，這顯示 _______", "opts": {"A": "rainfall records from the period are always inaccurate.", "B": "the city had no need for agriculture.", "C": "irrigation may have helped the city support more people despite drier weather.", "D": "the population must have moved away immediately."}, "optsZh": {"A": "該時期的降雨紀錄總是不準確。", "B": "這座城市不需要農業。", "C": "灌溉可能幫助這座城市在較乾燥的氣候下養活更多的人口。", "D": "人口一定立刻遷走了。"}, "answer": "C", "expl": "Canals explain growth during declining rainfall.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Information and Ideas: locate a directly stated detail in a literary passage.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film&#x27;s weaknesses before defending it may _______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n一位評論家主張，優秀的評論會正面處理可能的反對意見，而非忽略它們。因此，一位在為電影辯護之前先討論其缺點的影評人，可能會 _______", "opts": {"A": "prove that all viewers liked the film.", "B": "avoid forming any opinion about the film.", "C": "make the positive evaluation more persuasive.", "D": "remove the need to watch the film."}, "optsZh": {"A": "證明所有觀眾都喜歡這部電影。", "B": "避免對這部電影形成任何意見。", "C": "使正面的評價更具說服力。", "D": "免除觀看這部電影的必要。"}, "answer": "C", "expl": "Addressing objections strengthens the argument.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Poetry: infer the main purpose of a poem excerpt.", "vocab": false, "body": "The following text is from Maggie Pogue Johnson&#x27;s 1910 poem &quot;Poet of Our Race.&quot; In this poem, the speaker is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=address\" target=\"_blank\" rel=\"noopener\" data-w=\"address\" data-pos=\"v./n.\" data-en=\"to deal with a problem; a formal speech\" data-zh=\"處理；演說\">addressing<\/a> Paul Laurence Dunbar, a Black author.<br><br>Thou, with stroke of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mighty\" target=\"_blank\" rel=\"noopener\" data-w=\"mighty\" data-pos=\"adj.\" data-en=\"very strong or powerful\" data-zh=\"強大的\">mighty<\/a> pen,<br>Hast told of joy and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mirth\" target=\"_blank\" rel=\"noopener\" data-w=\"mirth\" data-pos=\"n.\" data-en=\"laughter and happiness\" data-zh=\"歡樂\">mirth<\/a>,<br>And read the hearts and souls of men<br>As <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cradle\" target=\"_blank\" rel=\"noopener\" data-w=\"cradle\" data-pos=\"v.\" data-en=\"to hold gently, like a baby\" data-zh=\"搖籃般地哺育；輕抱\">cradled<\/a> from their birth.<br>The language of the flowers,<br>Thou hast read them all,<br>And e&#x27;en the little brook<br>Responded to thy call.", "bodyPlain": "The following text is from Maggie Pogue Johnson's 1910 poem \"Poet of Our Race.\" In this poem, the speaker is addressing Paul Laurence Dunbar, a Black author.\n\nThou, with stroke of mighty pen,\nHast told of joy and mirth,\nAnd read the hearts and souls of men\nAs cradled from their birth.\nThe language of the flowers,\nThou hast read them all,\nAnd e'en the little brook\nResponded to thy call.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "以下文字出自 Maggie Pogue Johnson 1910 年的詩〈我們民族的詩人〉（Poet of Our Race）。在這首詩中，說話者正對黑人作家 Paul Laurence Dunbar 說話。\n你，以強勁的筆鋒，\n訴說了歡樂與喜悅，\n並讀懂了人們的心靈與靈魂\n彷彿自他們出生起便被搖籃哺育。\n花朵的語言，\n你全都讀懂了，\n甚至那條小溪\n也回應了你的呼喚。", "opts": {"A": "To praise a certain writer for being especially perceptive regarding people and nature", "B": "To establish that a certain writer has read extensively about a variety of topics", "C": "To call attention to a certain writer's careful and elaborately detailed writing process", "D": "To recount fond memories of an afternoon spent in nature with a certain writer"}, "optsZh": {"A": "讚美某位作家對人與自然特別敏銳的洞察力", "B": "確立某位作家曾廣泛閱讀各種主題", "C": "喚起對某位作家細心且精雕細琢的寫作過程的注意", "D": "回憶與某位作家在大自然中度過一個下午的美好記憶"}, "answer": "A", "expl": "The speaker praises Dunbar for reading 'the hearts and souls of men' and 'the language of the flowers'—being perceptive about people and nature.", "explZh": "說話者讚美 Dunbar 能讀懂「人們的心靈與靈魂」和「花朵的語言」──即對人與自然的敏銳洞察。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Poetry: infer the main purpose of a poem excerpt.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader&#x27;s understanding of the person, artwork, place, or debate being described. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader's understanding of the person, artwork, place, or debate being described. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n這些例子並非隨機的事實；它們共同塑造讀者對所描述的人物、藝術品、地點或爭論的理解。一段文章說一位詩人把河流既描寫成道路也描寫成鏡子，暗示旅行也能通往自我認識。", "opts": {"A": "The poet dislikes mirrors.", "B": "The poem is mainly about farming.", "C": "The river represents movement and reflection.", "D": "The river is unsafe for travelers."}, "optsZh": {"A": "這位詩人不喜歡鏡子。", "B": "這首詩主要是關於農耕。", "C": "這條河代表著移動與反思。", "D": "這條河對旅人來說不安全。"}, "answer": "C", "expl": "Both metaphors point to travel and self-knowledge.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Poetry: infer the main purpose of a poem excerpt.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A student claims that a diary has historical value because it records ordinary workers&#x27; daily routines. Which finding best supports the claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n每個句子都增添一層脈絡，最終的印象取決於這些細節如何結合。一名學生主張一本日記具有歷史價值，因為它記錄了普通工人的日常作息。哪一項發現最能支持這個主張？", "opts": {"A": "The diary describes meals, wages, tools, and conversations in a textile mill.", "B": "The writer sometimes misspelled common words.", "C": "The diary was sold at auction in 1998.", "D": "The diary's cover was made of expensive leather."}, "optsZh": {"A": "這本日記描述了一間紡織廠裡的餐食、工資、工具與對話。", "B": "作者有時會拼錯常見的單字。", "C": "這本日記於 1998 年在拍賣會上售出。", "D": "這本日記的封面是用昂貴的皮革製成的。"}, "answer": "A", "expl": "Details about daily routines support historical value.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Poetry: infer the main purpose of a poem excerpt.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A scientist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesizes\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesizes\" data-pos=\"v.\" data-en=\"suggests a possible explanation that has not yet been proven\" data-zh=\"提出假設\">hypothesizes<\/a> that a beetle&#x27;s bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the significance of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n最後一句並未轉向無關的主題；相反地，它釐清了前文的重要性。文章從描述轉向強調，為讀者提供足夠的脈絡，看出作者透過具體細節所要發展的更廣泛論點。一位科學家假設某種甲蟲鮮豔的顏色是在警告掠食者它的味道苦澀。哪一項發現最能直接支持這個假設？", "opts": {"A": "Some beetles are active at night.", "B": "The beetle's wings are shorter than its body.", "C": "The beetle lives in several types of forest.", "D": "Birds avoid models painted the beetle's color after tasting one real beetle."}, "optsZh": {"A": "有些甲蟲在夜間活動。", "B": "這種甲蟲的翅比身體短。", "C": "這種甲蟲生活在好幾種類型的森林中。", "D": "鳥類在嚐過一隻真的甲蟲後，會避開塗上該甲蟲顏色的模型。"}, "answer": "D", "expl": "Predators avoiding the color supports warning coloration.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Poetry: infer the main purpose of a poem excerpt.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A text states that an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> city&#x27;s population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n一篇文章指出，一座古城的人口在降雨量減少的情況下仍快速成長。考古學家發現了同一時期新建的運河，這顯示 _______", "opts": {"A": "the population must have moved away immediately.", "B": "irrigation may have helped the city support more people despite drier weather.", "C": "the city had no need for agriculture.", "D": "rainfall records from the period are always inaccurate."}, "optsZh": {"A": "人口一定立刻遷走了。", "B": "灌溉可能幫助這座城市在較乾燥的氣候下養活更多的人口。", "C": "這座城市不需要農業。", "D": "該時期的降雨紀錄總是不準確。"}, "answer": "B", "expl": "Canals explain growth during declining rainfall.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Poetry: infer the main purpose of a poem excerpt.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film&#x27;s weaknesses before defending it may _______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n一位評論家主張，優秀的評論會正面處理可能的反對意見，而非忽略它們。因此，一位在為電影辯護之前先討論其缺點的影評人，可能會 _______", "opts": {"A": "make the positive evaluation more persuasive.", "B": "prove that all viewers liked the film.", "C": "remove the need to watch the film.", "D": "avoid forming any opinion about the film."}, "optsZh": {"A": "使正面的評價更具說服力。", "B": "證明所有觀眾都喜歡這部電影。", "C": "免除觀看這部電影的必要。", "D": "避免對這部電影形成任何意見。"}, "answer": "A", "expl": "Addressing objections strengthens the argument.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence: choose the quotation that best supports a claim.", "vocab": false, "body": "&quot;To You&quot; is an 1856 poem by Walt Whitman. In the poem, Whitman suggests that readers, whom he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=address\" target=\"_blank\" rel=\"noopener\" data-w=\"address\" data-pos=\"v./n.\" data-en=\"to deal with a problem; a formal speech\" data-zh=\"處理；演說\">addresses<\/a> directly, have not fully understood themselves, writing, _______<br><br>Which quotation from &quot;To You&quot; most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrates\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrates\" data-pos=\"v.\" data-en=\"shows or explains something clearly with examples\" data-zh=\"說明；例證；闡明\">illustrates<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claim<\/a>?", "bodyPlain": "\"To You\" is an 1856 poem by Walt Whitman. In the poem, Whitman suggests that readers, whom he addresses directly, have not fully understood themselves, writing, _______\n\nWhich quotation from \"To You\" most effectively illustrates the claim?", "stem": "", "stemZh": "", "bodyZh": "〈給你〉（To You）是 Walt Whitman 1856 年的一首詩。在這首詩中，Whitman 暗示他直接對其說話的讀者並未完全了解自己，他寫道：_______\n〈給你〉中的哪一段引文最能有效說明這個主張？", "opts": {"A": "\"You have not known what you are, you have slumber'd upon yourself / all your life, / Your eyelids have been the same as closed most of the time.\"", "B": "\"These immense meadows, these interminable rivers, you are immense / and interminable as they.\"", "C": "\"I should have made my way straight to you long ago, / I should have blabb'd nothing but you, I should have chanted nothing / but you.\"", "D": "\"I will leave all and come and make the hymns of you, / None has understood you, but I understand you.\""}, "optsZh": {"A": "「你不曾知道自己是什麼，你一生／都在自身之上沉睡，／你的眼皮大多時候如同閉著一般。」", "B": "「這些廣闊的草原，這些無盡的河流，你和它們一樣廣闊／而無盡。」", "C": "「我早該直接走向你，／我早該只談論你，我早該只歌頌／你。」", "D": "「我將拋下一切，前來為你譜寫讚歌，／沒有人了解你，但我了解你。」"}, "answer": "A", "expl": "Only choice A says readers 'have not known what you are' and have 'slumber'd upon yourself'—directly illustrating that they have not understood themselves.", "explZh": "只有選項 A 說讀者「不知道自己是什麼」、「在自身之上沉睡」，直接說明他們並未了解自己。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence: choose the quotation that best supports a claim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n有幾項事實與整體主題相關，但只有一項能直接強化所提出的確切論斷，包括對時期、方法、比較或原因所設的任何限制。一段文章說一位詩人把河流既描寫成道路也描寫成鏡子，暗示旅行也能通往自我認識。", "opts": {"A": "The poet dislikes mirrors.", "B": "The river is unsafe for travelers.", "C": "The poem is mainly about farming.", "D": "The river represents movement and reflection."}, "optsZh": {"A": "這位詩人不喜歡鏡子。", "B": "這條河對旅人來說不安全。", "C": "這首詩主要是關於農耕。", "D": "這條河代表著移動與反思。"}, "answer": "D", "expl": "Both metaphors point to travel and self-knowledge.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Command of Evidence: choose the quotation that best supports a claim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\"
