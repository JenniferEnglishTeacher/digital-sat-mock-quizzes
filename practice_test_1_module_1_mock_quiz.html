 href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers&#x27; daily routines. Which finding best supports the claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n聽起來令人印象深刻的證據並不足夠；有用的發現必須與主張中的具體推理清楚連結，並使該推理更具說服力。一名學生主張一本日記具有歷史價值，因為它記錄了普通工人的日常作息。哪一項發現最能支持這個主張？", "opts": {"A": "The diary was sold at auction in 1998.", "B": "The diary describes meals, wages, tools, and conversations in a textile mill.", "C": "The writer sometimes misspelled common words.", "D": "The diary's cover was made of expensive leather."}, "optsZh": {"A": "這本日記於 1998 年在拍賣會上售出。", "B": "這本日記描述了一間紡織廠裡的餐食、工資、工具與對話。", "C": "作者有時會拼錯常見的單字。", "D": "這本日記的封面是用昂貴的皮革製成的。"}, "answer": "B", "expl": "Details about daily routines support historical value.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Command of Evidence: choose the quotation that best supports a claim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the claim and the data, showing why the author&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is more plausible than an alternative explanation. A scientist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesizes\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesizes\" data-pos=\"v.\" data-en=\"suggests a possible explanation that has not yet been proven\" data-zh=\"提出假設\">hypothesizes<\/a> that a beetle&#x27;s bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the relationship between the claim and the data, showing why the author's interpretation is more plausible than an alternative explanation. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n有些細節準確地描述了主題，卻沒有觸及爭議的要點。最有力的證據是能縮小主張與資料之間關係的選項，說明為何作者的詮釋比另一種解釋更合理。一位科學家假設某種甲蟲鮮豔的顏色是在警告掠食者它的味道苦澀。哪一項發現最能直接支持這個假設？", "opts": {"A": "The beetle lives in several types of forest.", "B": "The beetle's wings are shorter than its body.", "C": "Some beetles are active at night.", "D": "Birds avoid models painted the beetle's color after tasting one real beetle."}, "optsZh": {"A": "這種甲蟲生活在好幾種類型的森林中。", "B": "這種甲蟲的翅比身體短。", "C": "有些甲蟲在夜間活動。", "D": "鳥類在嚐過一隻真的甲蟲後，會避開塗上該甲蟲顏色的模型。"}, "answer": "D", "expl": "Predators avoiding the color supports warning coloration.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Command of Evidence: choose the quotation that best supports a claim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a>; the best support aligns with the claim&#x27;s exact logic. A text states that an ancient city&#x27;s population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal relationship; the best support aligns with the claim's exact logic. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n一項事實可能是真的，卻仍無法支持主張──如果它涉及錯誤的對象、時間範圍、特徵或因果關係；最佳的支持會與主張的確切邏輯相符。一篇文章指出，一座古城的人口在降雨量減少的情況下仍快速成長。考古學家發現了同一時期新建的運河，這顯示 _______", "opts": {"A": "the city had no need for agriculture.", "B": "the population must have moved away immediately.", "C": "irrigation may have helped the city support more people despite drier weather.", "D": "rainfall records from the period are always inaccurate."}, "optsZh": {"A": "這座城市不需要農業。", "B": "人口一定立刻遷走了。", "C": "灌溉可能幫助這座城市在較乾燥的氣候下養活更多的人口。", "D": "該時期的降雨紀錄總是不準確。"}, "answer": "C", "expl": "Canals explain growth during declining rainfall.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Command of Evidence: choose the quotation that best supports a claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a> to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film&#x27;s weaknesses before defending it may _______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an observation to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個主張依賴一條將觀察與結論連結起來的推理鏈。支持的證據必須維持這條推理鏈，提供一個能使結論更可能成立的細節，同時不誇大現有資訊所能證明的範圍。一位評論家主張，優秀的評論會正面處理可能的反對意見，而非忽略它們。因此，一位在為電影辯護之前先討論其缺點的影評人，可能會 _______", "opts": {"A": "make the positive evaluation more persuasive.", "B": "prove that all viewers liked the film.", "C": "remove the need to watch the film.", "D": "avoid forming any opinion about the film."}, "optsZh": {"A": "使正面的評價更具說服力。", "B": "證明所有觀眾都喜歡這部電影。", "C": "免除觀看這部電影的必要。", "D": "避免對這部電影形成任何意見。"}, "answer": "A", "expl": "Addressing objections strengthens the argument.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Command of Evidence: choose a finding that supports a student's claim.", "vocab": false, "body": "Born in 1891 to a Quechua-speaking family in the Andes Mountains of Peru, Martin Chambi is today considered to be one of the most renowned figures of Latin American photography. In a paper for an art history class, a student claims that Chambi&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=considerable\" target=\"_blank\" rel=\"noopener\" data-w=\"considerable\" data-pos=\"adj.\" data-en=\"large in amount or importance\" data-zh=\"相當大的；可觀的\">considerable<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ethnographic\" target=\"_blank\" rel=\"noopener\" data-w=\"ethnographic\" data-pos=\"adj.\" data-en=\"relating to the scientific description of peoples and cultures\" data-zh=\"民族誌的\">ethnographic<\/a> value - in his work, Chambi was able to capture diverse elements of Peruvian society, representing his subjects with both dignity and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authenticity\" target=\"_blank\" rel=\"noopener\" data-w=\"authenticity\" data-pos=\"n.\" data-en=\"the quality of being real or genuine\" data-zh=\"真實性\">authenticity<\/a>.<br><br>Which finding, if true, would most directly support the student&#x27;s claim?", "bodyPlain": "Born in 1891 to a Quechua-speaking family in the Andes Mountains of Peru, Martin Chambi is today considered to be one of the most renowned figures of Latin American photography. In a paper for an art history class, a student claims that Chambi's photographs have considerable ethnographic value - in his work, Chambi was able to capture diverse elements of Peruvian society, representing his subjects with both dignity and authenticity.\n\nWhich finding, if true, would most directly support the student's claim?", "stem": "", "stemZh": "", "bodyZh": "Martin Chambi 於 1891 年出生在秘魯安地斯山區一個說克丘亞語的家庭，如今被視為拉丁美洲攝影最著名的人物之一。在一篇藝術史課的報告中，一名學生主張 Chambi 的照片具有相當高的民族誌價值──在他的作品中，Chambi 能夠捕捉秘魯社會的多元面貌，並以尊嚴與真實呈現他的拍攝對象。\n哪一項發現如果屬實，最能直接支持這名學生的主張？", "opts": {"A": "Chambi took many commissioned portraits of wealthy Peruvians, but he also produced hundreds of images carefully documenting the peoples, sites, and customs of Indigenous communities of the Andes.", "B": "Chambi's photographs demonstrate a high level of technical skill, as seen in his strategic use of illumination to create dramatic light and shadow contrasts.", "C": "During his lifetime, Chambi was known and celebrated both within and outside his native Peru, as his work was published in places like Argentina, Spain, and Mexico.", "D": "Some of the peoples and places Chambi photographed had long been popular subjects for Peruvian photographers."}, "optsZh": {"A": "Chambi 為富裕的秘魯人拍攝了許多委託肖像，但他也製作了數百張細心記錄安地斯山區原住民族群、地點與風俗的影像。", "B": "Chambi 的照片展現了高度的技術水準，從他巧妙運用光線營造戲劇性明暗對比可見一斑。", "C": "在他的一生中，Chambi 在秘魯國內外都享有盛名並受到推崇，因為他的作品在阿根廷、西班牙與墨西哥等地發表。", "D": "Chambi 所拍攝的某些民族與地點，長期以來一直是秘魯攝影師喜愛的主題。"}, "answer": "A", "expl": "Hundreds of images carefully documenting Indigenous peoples, sites, and customs directly support the claim that Chambi's work has ethnographic value and captures diverse elements of Peruvian society.", "explZh": "數百張細心記錄原住民族群、地點與風俗的照片，直接支持 Chambi 作品具有民族誌價值並捕捉秘魯社會多元面貌的主張。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Command of Evidence: choose a finding that supports a student's claim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n有幾項事實與整體主題相關，但只有一項能直接強化所提出的確切論斷，包括對時期、方法、比較或原因所設的任何限制。一段文章說一位詩人把河流既描寫成道路也描寫成鏡子，暗示旅行也能通往自我認識。", "opts": {"A": "The river is unsafe for travelers.", "B": "The poet dislikes mirrors.", "C": "The river represents movement and reflection.", "D": "The poem is mainly about farming."}, "optsZh": {"A": "這條河對旅人來說不安全。", "B": "這位詩人不喜歡鏡子。", "C": "這條河代表著移動與反思。", "D": "這首詩主要是關於農耕。"}, "answer": "C", "expl": "Both metaphors point to travel and self-knowledge.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Command of Evidence: choose a finding that supports a student's claim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers&#x27; daily routines. Which finding best supports the claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n聽起來令人印象深刻的證據並不足夠；有用的發現必須與主張中的具體推理清楚連結，並使該推理更具說服力。一名學生主張一本日記具有歷史價值，因為它記錄了普通工人的日常作息。哪一項發現最能支持這個主張？", "opts": {"A": "The diary's cover was made of expensive leather.", "B": "The diary was sold at auction in 1998.", "C": "The writer sometimes misspelled common words.", "D": "The diary describes meals, wages, tools, and conversations in a textile mill."}, "optsZh": {"A": "這本日記的封面是用昂貴的皮革製成的。", "B": "這本日記於 1998 年在拍賣會上售出。", "C": "作者有時會拼錯常見的單字。", "D": "這本日記描述了一間紡織廠裡的餐食、工資、工具與對話。"}, "answer": "D", "expl": "Details about daily routines support historical value.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Command of Evidence: choose a finding that supports a student's claim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the claim and the data, showing why the author&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is more plausible than an alternative explanation. A scientist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesizes\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesizes\" data-pos=\"v.\" data-en=\"suggests a possible explanation that has not yet been proven\" data-zh=\"提出假設\">hypothesizes<\/a> that a beetle&#x27;s bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the relationship between the claim and the data, showing why the author's interpretation is more plausible than an alternative explanation. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n有些細節準確地描述了主題，卻沒有觸及爭議的要點。最有力的證據是能縮小主張與資料之間關係的選項，說明為何作者的詮釋比另一種解釋更合理。一位科學家假設某種甲蟲鮮豔的顏色是在警告掠食者它的味道苦澀。哪一項發現最能直接支持這個假設？", "opts": {"A": "Birds avoid models painted the beetle's color after tasting one real beetle.", "B": "The beetle lives in several types of forest.", "C": "The beetle's wings are shorter than its body.", "D": "Some beetles are active at night."}, "optsZh": {"A": "鳥類在嚐過一隻真的甲蟲後，會避開塗上該甲蟲顏色的模型。", "B": "這種甲蟲生活在好幾種類型的森林中。", "C": "這種甲蟲的翅比身體短。", "D": "有些甲蟲在夜間活動。"}, "answer": "A", "expl": "Predators avoiding the color supports warning coloration.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Command of Evidence: choose a finding that supports a student's claim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a>; the best support aligns with the claim&#x27;s exact logic. A text states that an ancient city&#x27;s population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal relationship; the best support aligns with the claim's exact logic. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n一項事實可能是真的，卻仍無法支持主張──如果它涉及錯誤的對象、時間範圍、特徵或因果關係；最佳的支持會與主張的確切邏輯相符。一篇文章指出，一座古城的人口在降雨量減少的情況下仍快速成長。考古學家發現了同一時期新建的運河，這顯示 _______", "opts": {"A": "the population must have moved away immediately.", "B": "the city had no need for agriculture.", "C": "rainfall records from the period are always inaccurate.", "D": "irrigation may have helped the city support more people despite drier weather."}, "optsZh": {"A": "人口一定立刻遷走了。", "B": "這座城市不需要農業。", "C": "該時期的降雨紀錄總是不準確。", "D": "灌溉可能幫助這座城市在較乾燥的氣候下養活更多的人口。"}, "answer": "D", "expl": "Canals explain growth during declining rainfall.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Command of Evidence: choose a finding that supports a student's claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a> to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film&#x27;s weaknesses before defending it may _______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an observation to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個主張依賴一條將觀察與結論連結起來的推理鏈。支持的證據必須維持這條推理鏈，提供一個能使結論更可能成立的細節，同時不誇大現有資訊所能證明的範圍。一位評論家主張，優秀的評論會正面處理可能的反對意見，而非忽略它們。因此，一位在為電影辯護之前先討論其缺點的影評人，可能會 _______", "opts": {"A": "avoid forming any opinion about the film.", "B": "make the positive evaluation more persuasive.", "C": "prove that all viewers liked the film.", "D": "remove the need to watch the film."}, "optsZh": {"A": "避免對這部電影形成任何意見。", "B": "使正面的評價更具說服力。", "C": "證明所有觀眾都喜歡這部電影。", "D": "免除觀看這部電影的必要。"}, "answer": "B", "expl": "Addressing objections strengthens the argument.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Quantitative Evidence: use table data to complete an example.", "vocab": false, "body": "A table lists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=credit\" target=\"_blank\" rel=\"noopener\" data-w=\"credit\" data-pos=\"n.\" data-en=\"public recognition for work done, e.g., on a film\" data-zh=\"（作品的）署名；功勞\">credited<\/a> film <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=output\" target=\"_blank\" rel=\"noopener\" data-w=\"output\" data-pos=\"n.\" data-en=\"the amount of something produced\" data-zh=\"產出；產量\">output<\/a> for James Young Deer, Dark Cloud, Edwin Carewe, and Lillian St. Cyr. It shows, among other credits, Lillian St. Cyr with 66 actor credits and Edwin Carewe with 58 director credits. The text says many records from the era have been lost, so the counts should be taken as bare <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=minimum\" target=\"_blank\" rel=\"noopener\" data-w=\"minimum\" data-pos=\"n.\" data-en=\"the smallest possible amount\" data-zh=\"最低限度；最小值\">minimums<\/a> rather than totals; it&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> possible, for example, that _______", "bodyPlain": "A table lists credited film output for James Young Deer, Dark Cloud, Edwin Carewe, and Lillian St. Cyr. It shows, among other credits, Lillian St. Cyr with 66 actor credits and Edwin Carewe with 58 director credits. The text says many records from the era have been lost, so the counts should be taken as bare minimums rather than totals; it's entirely possible, for example, that _______", "stem": "Which choice most effectively uses data from the table to complete the example?", "stemZh": "哪個選項最能有效運用表格中的資料來補全這個例子？", "bodyZh": "一張表格列出了 James Young Deer、Dark Cloud、Edwin Carewe 與 Lillian St. Cyr 有紀錄的電影作品數量。表格顯示，其中 Lillian St. Cyr 有 66 項演員紀錄，Edwin Carewe 有 58 項導演紀錄。文章指出該時代的許多紀錄已經遺失，因此這些數字應視為最低下限而非總數；例如，完全有可能 _______", "opts": {"A": "Dark Cloud acted in significantly fewer films than did Lillian St. Cyr, who is credited with 66 performances.", "B": "Edwin Carewe's 47 credited acting roles includes only films made after 1934.", "C": "Lillian St. Cyr acted in far more than 66 films and Edwin Carewe directed more than 58.", "D": "James Young Deer actually directed 33 films and acted in only 10."}, "optsZh": {"A": "Dark Cloud 演出的電影明顯少於擁有 66 項演出紀錄的 Lillian St. Cyr。", "B": "Edwin Carewe 的 47 項演出紀錄只包括 1934 年以後拍攝的電影。", "C": "Lillian St. Cyr 演出的電影遠超過 66 部，Edwin Carewe 導演的電影也超過 58 部。", "D": "James Young Deer 實際上導演了 33 部電影，而只演出了 10 部。"}, "answer": "C", "expl": "Since the counts are 'bare minimums', the real numbers could be higher: St. Cyr may have acted in far more than 66 films and Carewe directed more than 58.", "explZh": "既然這些數字是「最低下限」，實際數字可能更高：St. Cyr 可能演出遠超過 66 部，Carewe 導演超過 58 部。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Quantitative Evidence: use table data to complete an example.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A table shows that 68% of seedlings near shrubs survived, compared with 22% in open ground.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A table shows that 68% of seedlings near shrubs survived, compared with 22% in open ground.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n一張表格顯示，灌木附近的幼苗有 68% 存活，而空地上的幼苗只有 22% 存活。", "opts": {"A": "Seedling survival was much higher near shrubs than in open ground.", "B": "The table includes two habitats.", "C": "Some seedlings grew in open ground.", "D": "Shrubs were counted before seedlings."}, "optsZh": {"A": "灌木附近幼苗的存活率遠高於空地上的幼苗。", "B": "表格包含兩種棲地。", "C": "有些幼苗生長在空地上。", "D": "灌木是在幼苗之前計數的。"}, "answer": "A", "expl": "The comparison directly supports the claim.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Quantitative Evidence: use table data to complete an example.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A useful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> of the data will do more than repeat one value from the table. It will identify the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among values, such as which figure is highest, which category changes most, or which comparison fits the claim being made. A table lists known plays by three writers: Lee 12, Ortiz 9, and Khan 15. The text says many records are missing, so these numbers are minimums. Which completion uses the table effectively?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A useful interpretation of the data will do more than repeat one value from the table. It will identify the relevant relationship among values, such as which figure is highest, which category changes most, or which comparison fits the claim being made. A table lists known plays by three writers: Lee 12, Ortiz 9, and Khan 15. The text says many records are missing, so these numbers are minimums. Which completion uses the table effectively?", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n對資料有用的詮釋不會只是重複表格中的某一個數值。它會指出數值之間相關的關係，例如哪個數字最高、哪個類別變化最大，或哪種比較符合所提出的主張。一張表格列出三位作家已知的劇作數量：Lee 12 部、Ortiz 9 部、Khan 15 部。文章指出許多紀錄已經遺失，因此這些數字是最低下限。哪個補全有效地運用了表格？", "opts": {"A": "The table proves no records are missing.", "B": "Khan may have written more than 15 plays, and Lee more than 12.", "C": "Ortiz definitely wrote exactly 9 plays.", "D": "Lee wrote fewer plays than no other writer."}, "optsZh": {"A": "表格證明沒有任何紀錄遺失。", "B": "Khan 寫的劇作可能超過 15 部，Lee 可能超過 12 部。", "C": "Ortiz 確定正好寫了 9 部劇作。", "D": "Lee 寫的劇作沒有比任何其他作家少。"}, "answer": "B", "expl": "Minimums can be lower than the true totals.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Quantitative Evidence: use table data to complete an example.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The evidence depends on careful attention to percentages, totals, rankings, and whether a number represents a minimum, maximum, average, or exact count. Some options may quote accurate figures while still drawing a conclusion that the table does not support. A table shows museum visits rose from 14,000 to 21,000 after free Friday evenings began.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The evidence depends on careful attention to percentages, totals, rankings, and whether a number represents a minimum, maximum, average, or exact count. Some options may quote accurate figures while still drawing a conclusion that the table does not support. A table shows museum visits rose from 14,000 to 21,000 after free Friday evenings began.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n證據取決於仔細留意百分比、總數、排名，以及某個數字代表的是最小值、最大值、平均值還是確切數目。有些選項可能引用了準確的數字，卻仍得出表格無法支持的結論。一張表格顯示，在開始免費週五夜間開放後，博物館參觀人次從 14,000 上升到 21,000。", "opts": {"A": "The museum is open on Fridays.", "B": "The table lists two years.", "C": "Some visitors came on weekends.", "D": "Visits increased by 7,000 after the program began."}, "optsZh": {"A": "博物館在星期五開放。", "B": "表格列出了兩個年份。", "C": "有些參觀者在週末前來。", "D": "計畫開始後，參觀人次增加了 7,000。"}, "answer": "D", "expl": "The increase supports the program's effect.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Quantitative Evidence: use table data to complete an example.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The direction of the evidence matters: higher versus lower, earlier versus later, more frequent versus less frequent, or total versus <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proportional\" target=\"_blank\" rel=\"noopener\" data-w=\"proportional\" data-pos=\"adj.\" data-en=\"corresponding in size or amount to something else\" data-zh=\"成比例的\">proportional<\/a>. A table shows that four bird species nested more often in restored marshes than in unrestored marshes.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The direction of the evidence matters: higher versus lower, earlier versus later, more frequent versus less frequent, or total versus proportional. A table shows that four bird species nested more often in restored marshes than in unrestored marshes.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n證據的方向很重要：較高或較低、較早或較晚、較頻繁或較不頻繁、總數或比例。一張表格顯示，四種鳥類在復育的沼澤築巢的頻率高於未復育的沼澤。", "opts": {"A": "The marshes were near a river.", "B": "Each species had more nests in restored marshes.", "C": "One species had only 6 nests total.", "D": "The study counted birds in spring."}, "optsZh": {"A": "這些沼澤靠近一條河。", "B": "每一種鳥類在復育沼澤中的巢都較多。", "C": "有一種鳥類總共只有 6 個巢。", "D": "這項研究在春天計數鳥類。"}, "answer": "B", "expl": "All species show the same beneficial pattern.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Quantitative Evidence: use table data to complete an example.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The table should be interpreted as part of the argument, not as an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> math exercise. The strongest completion uses the data to clarify the claim while avoiding comparisons that ignore a category, reverse a trend, or exaggerate the size of a difference. A table shows that students using spaced practice remembered 82% of words, while those cramming remembered 49%.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The table should be interpreted as part of the argument, not as an independent math exercise. The strongest completion uses the data to clarify the claim while avoiding comparisons that ignore a category, reverse a trend, or exaggerate the size of a difference. A table shows that students using spaced practice remembered 82% of words, while those cramming remembered 49%.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n表格應被視為論證的一部分來解讀，而不是獨立的數學練習。最有力的補全會利用資料來釐清主張，同時避免忽略某個類別、顛倒趨勢或誇大差異幅度的比較。一張表格顯示，採用間隔練習的學生記住了 82% 的單字，而臨時死記的學生只記住 49%。", "opts": {"A": "The cramming group took the same test.", "B": "Some words were difficult.", "C": "The spaced-practice group remembered a larger share of words.", "D": "Both groups studied vocabulary."}, "optsZh": {"A": "臨時死記的那一組參加了同樣的測驗。", "B": "有些單字很難。", "C": "間隔練習組記住了較高比例的單字。", "D": "兩組都學習了單字。"}, "answer": "C", "expl": "The percentage comparison directly supports the claim.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Quantitative Evidence: identify table data that support a claim.", "vocab": false, "body": "A table shows juvenile plants of five species found on bare ground and in patches of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a>. For each species, about 52% to 60% of juvenile plants were found in vegetation patches. Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculate\" target=\"_blank\" rel=\"noopener\" data-w=\"calculate\" data-pos=\"v.\" data-en=\"to find an answer using mathematics\" data-zh=\"計算\">calculated<\/a> that if plants were randomly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distribute\" target=\"_blank\" rel=\"noopener\" data-w=\"distribute\" data-pos=\"v.\" data-en=\"to spread or give out over an area or among people\" data-zh=\"分布；分配\">distributed<\/a>, only about 15% would be in patches of vegetation. They claim that plants of these species that grow close to other plants gain an advantage at an early <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=developmental\" target=\"_blank\" rel=\"noopener\" data-w=\"developmental\" data-pos=\"adj.\" data-en=\"relating to growth or development\" data-zh=\"發育的；發展的\">developmental<\/a> stage.", "bodyPlain": "A table shows juvenile plants of five species found on bare ground and in patches of vegetation. For each species, about 52% to 60% of juvenile plants were found in vegetation patches. Researchers calculated that if plants were randomly distributed, only about 15% would be in patches of vegetation. They claim that plants of these species that grow close to other plants gain an advantage at an early developmental stage.", "stem": "Which choice best describes data from the table that support the researchers' claim?", "stemZh": "哪個選項最能描述表格中支持研究人員主張的資料？", "bodyZh": "一張表格顯示五種植物的幼株出現在裸地與植被叢中的情況。就每一種植物而言，約有 52% 到 60% 的幼株出現在植被叢中。研究人員計算出，如果植物是隨機分布的，只會有大約 15% 出現在植被叢中。他們主張，這些物種中生長在其他植物附近的個體，在發育早期階段獲得了優勢。", "opts": {"A": "For all five species, less than 75% of juvenile plants were growing in patches of vegetation.", "B": "The species with the greatest number of juvenile plants growing in patches of vegetation was H. stoechas.", "C": "For T. libanitis and T. moroderi, the percentage of juvenile plants growing in patches of vegetation was less than what would be expected if plants were randomly distributed.", "D": "For each species, the percentage of juvenile plants growing in patches of vegetation was substantially higher than what would be expected if plants were randomly distributed."}, "optsZh": {"A": "就全部五種植物而言，生長在植被叢中的幼株都少於 75%。", "B": "在植被叢中生長的幼株數量最多的物種是 H. stoechas。", "C": "就 T. libanitis 與 T. moroderi 而言，生長在植被叢中的幼株比例低於植物隨機分布時的預期值。", "D": "就每一種植物而言，生長在植被叢中的幼株比例都遠高於植物隨機分布時的預期值。"}, "answer": "D", "expl": "52%–60% in vegetation patches is far above the 15% expected from random distribution, supporting the claim that growing near other plants is an advantage.", "explZh": "52%–60% 的幼株出現在植被叢中，遠高於隨機分布預期的 15%，支持了「靠近其他植物生長是一種優勢」的主張。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Quantitative Evidence: identify table data that support a claim.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A table shows that 68% of seedlings near shrubs survived, compared with 22% in open ground.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A table shows that 68% of seedlings near shrubs survived, compared with 22% in open ground.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n一張表格顯示，灌木附近的幼苗有 68% 存活，而空地上的幼苗只有 22% 存活。", "opts": {"A": "Seedling survival was much higher near shrubs than in open ground.", "B": "Shrubs were counted before seedlings.", "C": "Some seedlings grew in open ground.", "D": "The table includes two habitats."}, "optsZh": {"A": "灌木附近幼苗的存活率遠高於空地上的幼苗。", "B": "灌木是在幼苗之前計數的。", "C": "有些幼苗生長在空地上。", "D": "表格包含兩種棲地。"}, "answer": "A", "expl": "The comparison directly supports the claim.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Quantitative Evidence: identify table data that support a claim.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A useful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> of the data will do more than repeat one value from the table. It will identify the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among values, such as which figure is highest, which category changes most, or which comparison fits the claim being made. A table lists known plays by three writers: Lee 12, Ortiz 9, and Khan 15. The text says many records are missing, so these numbers are minimums. Which completion uses the table effectively?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A useful interpretation of the data will do more than repeat one value from the table. It will identify the relevant relationship among values, such as which figure is highest, which category changes most, or which comparison fits the claim being made. A table lists known plays by three writers: Lee 12, Ortiz 9, and Khan 15. The text says many records are missing, so these numbers are minimums. Which completion uses the table effectively?", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n對資料有用的詮釋不會只是重複表格中的某一個數值。它會指出數值之間相關的關係，例如哪個數字最高、哪個類別變化最大，或哪種比較符合所提出的主張。一張表格列出三位作家已知的劇作數量：Lee 12 部、Ortiz 9 部、Khan 15 部。文章指出許多紀錄已經遺失，因此這些數字是最低下限。哪個補全有效地運用了表格？", "opts": {"A": "Ortiz definitely wrote exactly 9 plays.", "B": "Lee wrote fewer plays than no other writer.", "C": "Khan may have written more than 15 plays, and Lee more than 12.", "D": "The table proves no records are missing."}, "optsZh": {"A": "Ortiz 確定正好寫了 9 部劇作。", "B": "Lee 寫的劇作沒有比任何其他作家少。", "C": "Khan 寫的劇作可能超過 15 部，Lee 可能超過 12 部。", "D": "表格證明沒有任何紀錄遺失。"}, "answer": "C", "expl": "Minimums can be lower than the true totals.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Quantitative Evidence: identify table data that support a claim.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The evidence depends on careful attention to percentages, totals, rankings, and whether a number represents a minimum, maximum, average, or exact count. Some options may quote accurate figures while still drawing a conclusion that the table does not support. A table shows museum visits rose from 14,000 to 21,000 after free Friday evenings began.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The evidence depends on careful attention to percentages, totals, rankings, and whether a number represents a minimum, maximum, average, or exact count. Some options may quote accurate figures while still drawing a conclusion that the table does not support. A table shows museum visits rose from 14,000 to 21,000 after free Friday evenings began.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n證據取決於仔細留意百分比、總數、排名，以及某個數字代表的是最小值、最大值、平均值還是確切數目。有些選項可能引用了準確的數字，卻仍得出表格無法支持的結論。一張表格顯示，在開始免費週五夜間開放後，博物館參觀人次從 14,000 上升到 21,000。", "opts": {"A": "The museum is open on Fridays.", "B": "Visits increased by 7,000 after the program began.", "C": "Some visitors came on weekends.", "D": "The table lists two years."}, "optsZh": {"A": "博物館在星期五開放。", "B": "計畫開始後，參觀人次增加了 7,000。", "C": "有些參觀者在週末前來。", "D": "表格列出了兩個年份。"}, "answer": "B", "expl": "The increase supports the program's effect.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Quantitative Evidence: identify table data that support a claim.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The direction of the evidence matters: higher versus lower, earlier versus later, more frequent versus less frequent, or total versus <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proportional\" target=\"_blank\" rel=\"noopener\" data-w=\"proportional\" data-pos=\"adj.\" data-en=\"corresponding in size or amount to something else\" data-zh=\"成比例的\">proportional<\/a>. A table shows that four bird species nested more often in restored marshes than in unrestored marshes.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The direction of the evidence matters: higher versus lower, earlier versus later, more frequent versus less frequent, or total versus proportional. A table shows that four bird species nested more often in restored marshes than in unrestored marshes.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n證據的方向很重要：較高或較低、較早或較晚、較頻繁或較不頻繁、總數或比例。一張表格顯示，四種鳥類在復育的沼澤築巢的頻率高於未復育的沼澤。", "opts": {"A": "Each species had more nests in restored marshes.", "B": "The marshes were near a river.", "C": "One species had only 6 nests total.", "D": "The study counted birds in spring."}, "optsZh": {"A": "每一種鳥類在復育沼澤中的巢都較多。", "B": "這些沼澤靠近一條河。", "C": "有一種鳥類總共只有 6 個巢。", "D": "這項研究在春天計數鳥類。"}, "answer": "A", "expl": "All species show the same beneficial pattern.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Quantitative Evidence: identify table data that support a claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The table should be interpreted as part of the argument, not as an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independent\" target=\"_blank\" rel=\"noopener\" data-w=\"independent\" data-pos=\"adj.\" data-en=\"not controlled by or depending on others\" data-zh=\"獨立的\">independent<\/a> math exercise. The strongest completion uses the data to clarify the claim while avoiding comparisons that ignore a category, reverse a trend, or exaggerate the size of a difference. A table shows that students using spaced practice remembered 82% of words, while those cramming remembered 49%.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The table should be interpreted as part of the argument, not as an independent math exercise. The strongest completion uses the data to clarify the claim while avoiding comparisons that ignore a category, reverse a trend, or exaggerate the size of a difference. A table shows that students using spaced practice remembered 82% of words, while those cramming remembered 49%.", "stem": "Which choice most effectively uses or describes data from the table?", "stemZh": "哪個選項最能有效運用或描述表格中的資料？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n表格應被視為論證的一部分來解讀，而不是獨立的數學練習。最有力的補全會利用資料來釐清主張，同時避免忽略某個類別、顛倒趨勢或誇大差異幅度的比較。一張表格顯示，採用間隔練習的學生記住了 82% 的單字，而臨時死記的學生只記住 49%。", "opts": {"A": "Some words were difficult.", "B": "Both groups studied vocabulary.", "C": "The cramming group took the same test.", "D": "The spaced-practice group remembered a larger share of words."}, "optsZh": {"A": "有些單字很難。", "B": "兩組都學習了單字。", "C": "臨時死記的那一組參加了同樣的測驗。", "D": "間隔練習組記住了較高比例的單字。"}, "answer": "D", "expl": "The percentage comparison directly supports the claim.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Command of Evidence: choose a finding that strengthens a scientific hypothesis.", "vocab": false, "body": "In the mountains of Brazil, Barbacenia tomentosa and Barbacenia macrantha establish themselves on soilless, nutrient-poor patches of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=quartzite\" target=\"_blank\" rel=\"noopener\" data-w=\"quartzite\" data-pos=\"n.\" data-en=\"a hard rock formed from sandstone\" data-zh=\"石英岩\">quartzite<\/a> rock. Researchers found that the plants&#x27; roots grow directly into quartzite and have fine hairs that secrete malic and citric acids. The researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that the plants depend on dissolving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=underlying\" target=\"_blank\" rel=\"noopener\" data-w=\"underlying\" data-pos=\"adj.\" data-en=\"lying beneath; forming the basis of something\" data-zh=\"底下的；根本的\">underlying<\/a> rock with these acids because doing so creates channels for continued growth and releases phosphates that provide phosphorus.<br><br>Which finding, if true, would most directly support the researchers&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a>?", "bodyPlain": "In the mountains of Brazil, Barbacenia tomentosa and Barbacenia macrantha establish themselves on soilless, nutrient-poor patches of quartzite rock. Researchers found that the plants' roots grow directly into quartzite and have fine hairs that secrete malic and citric acids. The researchers hypothesize that the plants depend on dissolving underlying rock with these acids because doing so creates channels for continued growth and releases phosphates that provide phosphorus.\n\nWhich finding, if true, would most directly support the researchers' hypothesis?", "stem": "", "stemZh": "", "bodyZh": "在巴西的山區，Barbacenia tomentosa 與 Barbacenia macrantha 在沒有土壤、養分貧瘠的石英岩塊上生長。研究人員發現這些植物的根直接長入石英岩中，並且有能分泌蘋果酸與檸檬酸的細根毛。研究人員假設，這些植物依賴以這些酸溶解底下的岩石，因為這樣做能為持續生長開闢通道，並釋放出提供磷的磷酸鹽。\n哪一項發現如果屬實，最能直接支持研究人員的假設？", "opts": {"A": "Other species in the Velloziaceae family are found in terrains with more soil but have root structures similar to those of B. tomentosa and B. macrantha.", "B": "Though B. tomentosa and B. macrantha both secrete citric and malic acids, each species produces the acids in different proportions.", "C": "The roots of B. tomentosa and B. macrantha carve new entry points into rocks even when cracks in the surface are readily available.", "D": "B. tomentosa and B. macrantha thrive even when transferred to the surfaces of rocks that do not contain phosphates."}, "optsZh": {"A": "Velloziaceae 科的其他物種出現在土壤較多的地形中，但其根部結構與 B. tomentosa 和 B. macrantha 相似。", "B": "雖然 B. tomentosa 與 B. macrantha 都分泌檸檬酸與蘋果酸，但兩個物種產生這些酸的比例不同。", "C": "即使岩石表面已有現成的裂縫，B. tomentosa 與 B. macrantha 的根仍會在岩石上鑿出新的入口。", "D": "即使被移植到不含磷酸鹽的岩石表面，B. tomentosa 與 B. macrantha 仍然生長茂盛。"}, "answer": "C", "expl": "If the roots carve new entry points even when cracks are available, the plants must depend on dissolving rock for growth—exactly the hypothesis.", "explZh": "如果即使有裂縫可用，根仍會鑿出新的入口，就表示植物確實依賴溶解岩石來生長──正是該假設。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Command of Evidence: choose a finding that strengthens a scientific hypothesis.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-
