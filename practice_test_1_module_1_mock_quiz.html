  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: choose a precise verb for an uncertain prediction.", "original": "Former astronaut Ellen Ochoa says that although she doesn't have a definite idea of when it might happen, she _______ that humans will someday need to be able to live in other environments than those found on Earth. This conjecture informs her interest in future research missions to the moon.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) demands\nB) speculates\nC) doubts\nD) establishes", "generated": [{"id": "1.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Marine ecologist Priya Nair cannot yet prove that the reef will recover, but she _______ that cooler currents may give the coral a brief reprieve.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) hypothesizes\nB) mandates\nC) refutes\nD) codifies", "answer": "A", "explanation": "The clue 'cannot yet prove' points to a tentative scientific claim."}, {"id": "1.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The historian admits that the missing letters leave gaps in the record, so she _______ that the alliance began earlier than scholars once believed.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) verifies\nB) conjectures\nC) nullifies\nD) commands", "answer": "B", "explanation": "Incomplete evidence calls for a verb meaning proposes as a possibility."}, {"id": "1.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Because the telescope data are preliminary, the astronomer merely _______ that the distant object may be a young galaxy.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) denounces\nB) posits\nC) enforces\nD) solidifies", "answer": "B", "explanation": "Preliminary data support a proposed explanation, not certainty."}, {"id": "1.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The engineer has no exact timeline, but she _______ that floating homes may become common in flood-prone cities.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) eradicates\nB) obligates\nC) dismisses\nD) surmises", "answer": "D", "explanation": "No exact timeline signals an informed but uncertain inference."}, {"id": "1.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Although the experiment has not been replicated, the team _______ that the protein may slow cellular aging.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) conceals\nB) forbids\nC) theorizes\nD) guarantees", "answer": "C", "explanation": "A tentative scientific possibility is best expressed by 'theorizes'."}]}, {"n": 2, "concept": "Words in Context: choose an adjective matching sustained effort.", "original": "Beginning in the 1950s, Navajo Nation legislator Annie Dodge Wauneka continuously worked to promote public health; this _______ effort involved traveling throughout the vast Navajo homeland and writing a medical dictionary for speakers of Dine bizaad, the Navajo language.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) impartial\nB) offhand\nC) persistent\nD) mandatory", "generated": [{"id": "2.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For twenty years, the archivist made weekly visits to rural libraries; this _______ effort preserved thousands of local newspapers.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) sustained\nB) erratic\nC) incidental\nD) impartial", "answer": "A", "explanation": "Weekly visits over twenty years show sustained effort."}, {"id": "2.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The mayor's _______ campaign to improve bus access continued through three administrations.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) offhand\nB) ambiguous\nC) ongoing\nD) mandatory", "answer": "C", "explanation": "The campaign continued across multiple administrations."}, {"id": "2.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Despite limited funding, the volunteers' _______ work kept the community clinic open.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unflagging\nB) inadvertent\nC) peripheral\nD) skeptical", "answer": "A", "explanation": "The contrast with limited funding emphasizes effort that did not weaken."}, {"id": "2.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The botanist's _______ monitoring of the seedlings allowed her to notice subtle changes across seasons.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) negligible\nB) detached\nC) arbitrary\nD) assiduous", "answer": "D", "explanation": "Assiduous means careful and persistent, matching the long-term monitoring."}, {"id": "2.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A _______ effort by local teachers eventually led to a bilingual reading program.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) haphazard\nB) concerted\nC) neutral\nD) temporary", "answer": "B", "explanation": "A concerted effort is coordinated and determined over time."}]}, {"n": 3, "concept": "Words in Context: identify an example that demonstrates a model.", "original": "Following the principles of community-based participatory research, tribal nations and research institutions are equal partners in health studies conducted on reservations. A collaboration between the Crow Tribe and Montana State University _______ this model: tribal citizens worked alongside scientists to design the methodology and continue to assist in data collection.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) circumvents\nB) eclipses\nC) fabricates\nD) exemplifies", "generated": [{"id": "3.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The museum's new policy _______ inclusive design: every label appears in large print, audio, and two languages.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) circumvents\nB) contradicts\nC) obscures\nD) embodies", "answer": "D", "explanation": "The policy concretely represents inclusive design."}, {"id": "3.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The river cleanup _______ civic cooperation, with students, shop owners, and city workers joining the same project.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) diminishes\nB) fabricates\nC) illustrates\nD) eclipses", "answer": "C", "explanation": "The project serves as an example of cooperation."}, {"id": "3.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. This classroom debate _______ respectful disagreement because students challenge ideas without attacking one another.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) distorts\nB) epitomizes\nC) evades\nD) precludes", "answer": "B", "explanation": "Epitomizes means serves as a perfect example of the principle."}, {"id": "3.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The apprenticeship program _______ experiential learning: trainees master skills by working beside experts.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) demonstrates\nB) repudiates\nC) minimizes\nD) conceals", "answer": "A", "explanation": "The program demonstrates the learning model."}, {"id": "3.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The orchestra's collaboration with local composers _______ cultural exchange.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) undermines\nB) typifies\nC) misrepresents\nD) postpones", "answer": "B", "explanation": "The collaboration is a typical instance of exchange."}]}, {"n": 4, "concept": "Words in Context: name two actions happening at the same time.", "original": "The parasitic dodder plant increases its reproductive success by flowering at the same time as the host plant it has latched onto. In 2020, Jianqiang Wu and his colleagues determined that the tiny dodder achieves this _______ with its host by absorbing and utilizing a protein the host produces when it is about to flower.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) synchronization\nB) hibernation\nC) prediction\nD) moderation", "generated": [{"id": "4.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Fireflies in the grove flashed at the same moment, creating a striking _______ visible from the path.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) hibernation\nB) divergence\nC) simultaneity\nD) depletion", "answer": "C", "explanation": "Flashing at the same moment creates simultaneity."}, {"id": "4.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The dancers achieved perfect _______ when their steps landed on the beat together.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) alignment\nB) moderation\nC) prediction\nD) seclusion", "answer": "A", "explanation": "Their movements matched in timing and placement."}, {"id": "4.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The app improves _______ between audio and video so that speakers' lips match the sound.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) abbreviation\nB) coordination\nC) resistance\nD) erosion", "answer": "B", "explanation": "Audio and video must be coordinated in time."}, {"id": "4.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The two clocks lost their _______ after one battery weakened.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) isolation\nB) substitution\nC) permanence\nD) concordance", "answer": "D", "explanation": "Concordance means agreement or harmony, here in timing."}, {"id": "4.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Researchers noticed the whales' breaths rose and fell in _______ as they traveled together.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) opposition\nB) unison\nC) moderation\nD) conjecture", "answer": "B", "explanation": "Actions occurring together happen in unison."}]}, {"n": 5, "concept": "Words in Context: choose a word that contrasts with complexity.", "original": "Given that the conditions in binary star systems should make planetary formation nearly impossible, it's not surprising that the existence of planets in such systems has lacked _______ explanation. Roman Rafikov and Kedron Silsbee shed light on the subject when they used modeling to determine a complex set of factors that could support planets' development.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) a discernible\nB) a straightforward\nC) an inconclusive\nD) an unbiased", "generated": [{"id": "5.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The fossil record is fragmentary, so the species' disappearance has resisted a _______ explanation.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) unambiguous\nB) visible\nC) redundant\nD) biased", "answer": "A", "explanation": "Fragmentary evidence prevents an unambiguous explanation."}, {"id": "5.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Because the poem shifts speakers twice, its ending does not have a _______ interpretation.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) mandatory\nB) durable\nC) partial\nD) clear-cut", "answer": "D", "explanation": "Complex structure makes a clear-cut reading unlikely."}, {"id": "5.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The disease involves genes, diet, and climate, so researchers warn against seeking a _______ cause.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) decorative\nB) singular\nC) temporary\nD) discernible", "answer": "B", "explanation": "Multiple factors contrast with a single cause."}, {"id": "5.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The legal dispute spans three countries, making a _______ resolution unlikely.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) seamless\nB) measurable\nC) synthetic\nD) impartial", "answer": "A", "explanation": "Complex jurisdiction makes a smooth, uncomplicated resolution unlikely."}, {"id": "5.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The painting combines myth, biography, and political satire, so critics rarely offer a _______ account of its meaning.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) detached\nB) mandatory\nC) unequivocal\nD) numerical", "answer": "C", "explanation": "Layered content resists one definite account."}]}, {"n": 6, "concept": "Words in Context: select a verb meaning reject.", "original": "Seminole/Muscogee director Sterlin Harjo _______ television's tendency to situate Native characters in the distant past: this rejection is evident in his series Reservation Dogs, which revolves around teenagers who dress in contemporary styles and whose dialogue is laced with current slang.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) repudiates\nB) proclaims\nC) foretells\nD) recants", "generated": [{"id": "6.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The novelist _______ the idea that young readers need simplified themes, filling her books with moral complexity.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) foretells\nB) proclaims\nC) challenges\nD) echoes", "answer": "C", "explanation": "The action calls the idea into question."}, {"id": "6.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. By refusing to use imported materials, the architect _______ the assumption that luxury requires foreign stone.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) recants\nB) rejects\nC) predicts\nD) duplicates", "answer": "B", "explanation": "Refusing the assumption means rejecting it."}, {"id": "6.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The director's new film _______ the genre's usual happy ending.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) imitates\nB) subverts\nC) confirms\nD) announces", "answer": "B", "explanation": "Subverts means undermines or overturns an expectation."}, {"id": "6.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The study _______ the old belief that all deep-sea organisms depend directly on sunlight.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) foretells\nB) preserves\nC) proclaims\nD) discredits", "answer": "D", "explanation": "Evidence can discredit, or undermine the credibility of, an old belief."}, {"id": "6.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. With stark photographs rather than glamorous portraits, the exhibition _______ romanticized views of mining towns.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) counters\nB) predicts\nC) celebrates\nD) recants", "answer": "A", "explanation": "The exhibition works against idealized views."}]}, {"n": 7, "concept": "Rhetorical Synthesis: identify the main purpose of an informational passage.", "original": "In 2007, computer scientist Luis von Ahn was working on converting printed books into a digital format. He found that some words were distorted enough that digital scanners couldn't recognize them, but most humans could easily read them. Based on that finding, von Ahn invented a simple security test to keep automated \"bots\" out of websites. The first version of the reCAPTCHA test asked users to type one known word and one of the many words scanners couldn't recognize. Correct answers proved the users were humans and added data to the book-digitizing project.\n\nWhich choice best states the main purpose of the text?\nA) To discuss von Ahn's invention of reCAPTCHA\nB) To explain how digital scanners work\nC) To call attention to von Ahn's book-digitizing project\nD) To indicate how popular reCAPTCHA is", "generated": [{"id": "7.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader's understanding of the person, artwork, place, or debate being described. In the 1990s, engineer Maya Chen noticed that bike couriers often knew city shortcuts missing from official maps. She built a mapping app that let couriers submit routes, and the city later used the data to improve bike lanes.\n\nWhich choice best states the main purpose of the text?\n\nA) To explain how GPS satellites work\nB) To describe how Chen's observation led to a mapping tool\nC) To compare bike couriers with city planners\nD) To argue that official maps are never useful", "answer": "B", "explanation": "The passage focuses on the origin and use of Chen's app."}, {"id": "7.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A short passage explains that painter Alma Thomas arranged bright blocks of color to suggest gardens, music, and space exploration, showing how abstract art can still refer to lived experience.\n\nWhich choice best states the main purpose of the text?\n\nA) To explain one artist's use of color and reference\nB) To criticize abstract painting\nC) To prove that all art should depict gardens\nD) To list every painting Thomas made", "answer": "A", "explanation": "The text explains the function of color in one artist's work."}, {"id": "7.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the significance of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A text describes how a chemist studying mussels developed a strong adhesive for wet surfaces after observing how mussels cling to rocks underwater.\n\nWhich choice best states the main purpose of the text?\n\nA) To compare oceans around the world\nB) To describe the diet of mussels\nC) To show how a natural process inspired a technology\nD) To argue that synthetic glue is harmful", "answer": "C", "explanation": "The central idea is biomimicry."}, {"id": "7.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage recounts how a librarian used community interviews to rebuild a town's lost archive after a flood.\n\nWhich choice best states the main purpose of the text?\n\nA) To explain why floods occur\nB) To criticize oral interviews\nC) To compare libraries and museums\nD) To discuss a method of preserving local history", "answer": "D", "explanation": "The passage centers on preservation through interviews."}, {"id": "7.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A text explains that choreographer Rennie Harris combined street dance with concert-stage traditions, helping audiences view hip-hop as a major theatrical form.\n\nWhich choice best states the main purpose of the text?\n\nA) To describe Harris's role in expanding the status of hip-hop dance\nB) To prove that street dance is older than ballet\nC) To explain why theaters are expensive\nD) To list the rules of hip-hop choreography", "answer": "A", "explanation": "The passage discusses Harris's artistic contribution."}]}, {"n": 8, "concept": "Text Structure: describe the function of a sentence in a literary excerpt.", "original": "The following text is from Edith Wharton's 1905 novel The House of Mirth. Lily Bart and a companion are walking through a park.\n\nLily had no real intimacy with nature, but she had a passion for the appropriate and could be keenly sensitive to a scene which was the fitting background of her own sensations. The landscape outspread below her seemed an enlargement of her present mood, and she found something of herself in its calmness, its breadth, its long free reaches. On the nearer slopes the sugar-maples wavered like pyres of light; lower down was a massing of grey orchards, and here and there the lingering green of an oak-grove.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\nA) It creates a detailed image of the physical setting of the scene.\nB) It establishes that a character is experiencing an internal conflict.\nC) It makes an assertion that the next sentence then expands on.\nD) It illustrates an idea that is introduced in the previous sentence.", "generated": [{"id": "8.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The surrounding sentences make the underlined portion part of a deliberate structure, not merely an extra piece of information inserted for background. A passage first states that a character is unusually attentive to sound. The next sentence says she can identify a train before it appears by listening to the rails hum. What is the function of the second sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It shifts the topic to train engineering.\nB) It contradicts the first sentence.\nC) It summarizes the whole plot.\nD) It gives an example of the trait introduced in the first sentence.", "answer": "D", "explanation": "The second sentence illustrates the earlier claim."}, {"id": "8.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The underlined sentence therefore has to be interpreted through its relationship to the sentences around it. A research summary states that a drug may reduce migraines. The next sentence explains that scientists compared weekly headache reports from 800 patients taking the drug with reports from a placebo group. What is the function of the second sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It describes part of the study's method.\nB) It introduces an unrelated example.\nC) It presents an opposing theory.\nD) It states the final result.", "answer": "A", "explanation": "Comparing groups is methodology."}, {"id": "8.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. It may introduce an example, qualify an earlier statement, identify a contrast, or prepare readers for the explanation that follows. A poem excerpt opens by saying the city wakes slowly. The next line describes shutters lifting, carts rattling, and bakers lighting ovens. What is the function of the second line?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It defines a technical term.\nB) It provides images that develop the opening idea.\nC) It explains the speaker's childhood.\nD) It rejects the opening idea.", "answer": "B", "explanation": "The details expand the idea of the city waking."}, {"id": "8.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The function of that sentence becomes clear only when the whole paragraph is considered as a sequence. A paragraph claims that a sculpture invites movement around it. The following sentence notes that different shapes appear as viewers circle the work. What is the function of the following sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It supports the claim with a concrete observation.\nB) It offers a counterargument.\nC) It introduces the sculptor's biography.\nD) It changes the subject to painting.", "answer": "A", "explanation": "The observation supports the claim."}, {"id": "8.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The underlined sentence occupies a turning point between the opening information and the conclusion, so its role depends on both what precedes it and what follows it. A science passage says the team's conclusion was unexpected. The next sentence says previous models had predicted the opposite result. What is the function of the next sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It gives the study's sample size.\nB) It provides a quotation from a participant.\nC) It explains why the conclusion was surprising.\nD) It lists materials used in the experiment.", "answer": "C", "explanation": "The previous models make the result unexpected."}]}, {"n": 9, "concept": "Text Structure: identify a methodology sentence in a research summary.", "original": "A study by a team including finance professor Madhu Veeraraghavan suggests that exposure to sunshine during the workday can lead to overly optimistic behavior. Using data spanning from 1994 to 2010 for a set of US companies, the team compared over 29,000 annual earnings forecasts to the actual earnings later reported by those companies. The team found that the greater the exposure to sunshine at work in the two weeks before a manager submitted an earnings forecast, the more the manager's forecast exceeded what the company actually earned that year.\n\nWhich choice best states the function of the underlined sentence in the overall structure of the text?\nA) To summarize the results of the team's analysis\nB) To present a specific example that illustrates the study's findings\nC) To explain part of the methodology used in the team's study\nD) To call out a challenge the team faced in conducting its analysis", "generated": [{"id": "9.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The surrounding sentences make the underlined portion part of a deliberate structure, not merely an extra piece of information inserted for background. A passage first states that a character is unusually attentive to sound. The next sentence says she can identify a train before it appears by listening to the rails hum. What is the function of the second sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It gives an example of the trait introduced in the first sentence.\nB) It summarizes the whole plot.\nC) It contradicts the first sentence.\nD) It shifts the topic to train engineering.", "answer": "A", "explanation": "The second sentence illustrates the earlier claim."}, {"id": "9.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The underlined sentence therefore has to be interpreted through its relationship to the sentences around it. A research summary states that a drug may reduce migraines. The next sentence explains that scientists compared weekly headache reports from 800 patients taking the drug with reports from a placebo group. What is the function of the second sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It introduces an unrelated example.\nB) It describes part of the study's method.\nC) It presents an opposing theory.\nD) It states the final result.", "answer": "B", "explanation": "Comparing groups is methodology."}, {"id": "9.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. It may introduce an example, qualify an earlier statement, identify a contrast, or prepare readers for the explanation that follows. A poem excerpt opens by saying the city wakes slowly. The next line describes shutters lifting, carts rattling, and bakers lighting ovens. What is the function of the second line?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It rejects the opening idea.\nB) It explains the speaker's childhood.\nC) It defines a technical term.\nD) It provides images that develop the opening idea.", "answer": "D", "explanation": "The details expand the idea of the city waking."}, {"id": "9.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The function of that sentence becomes clear only when the whole paragraph is considered as a sequence. A paragraph claims that a sculpture invites movement around it. The following sentence notes that different shapes appear as viewers circle the work. What is the function of the following sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It offers a counterargument.\nB) It changes the subject to painting.\nC) It introduces the sculptor's biography.\nD) It supports the claim with a concrete observation.", "answer": "D", "explanation": "The observation supports the claim."}, {"id": "9.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The underlined sentence occupies a turning point between the opening information and the conclusion, so its role depends on both what precedes it and what follows it. A science passage says the team's conclusion was unexpected. The next sentence says previous models had predicted the opposite result. What is the function of the next sentence?\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It provides a quotation from a participant.\nB) It lists materials used in the experiment.\nC) It explains why the conclusion was surprising.\nD) It gives the study's sample size.", "answer": "C", "explanation": "The previous models make the result unexpected."}]}, {"n": 10, "concept": "Information and Ideas: locate a directly stated detail in a literary passage.", "original": "The following text is adapted from Edith Nesbit's 1906 novel The Railway Children.\n\nMother did not spend all her time in paying dull visits to dull ladies, and sitting dully at home waiting for dull ladies to pay visits to her. She was almost always there, ready to play with the children, and read to them, and help them to do their home-lessons. Besides this she used to write stories for them while they were at school, and read them aloud after tea, and she always made up funny pieces of poetry for their birthdays and for other great occasions.\n\nAccording to the text, what is true about Mother?\nA) She wishes that more ladies would visit her.\nB) Birthdays are her favorite special occasion.\nC) She creates stories and poems for her children.\nD) Reading to her children is her favorite activity.", "generated": [{"id": "10.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader's understanding of the person, artwork, place, or debate being described. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.\n\nWhich choice best states the main purpose of the text?\n\nA) The river represents movement and reflection.\nB) The river is unsafe for travelers.\nC) The poem is mainly about farming.\nD) The poet dislikes mirrors.", "answer": "A", "explanation": "Both metaphors point to travel and self-knowledge."}, {"id": "10.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?\n\nWhich choice best states the main purpose of the text?\n\nA) The writer sometimes misspelled common words.\nB) The diary describes meals, wages, tools, and conversations in a textile mill.\nC) The diary's cover was made of expensive leather.\nD) The diary was sold at auction in 1998.", "answer": "B", "explanation": "Details about daily routines support historical value."}, {"id": "10.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the significance of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?\n\nWhich choice best states the main purpose of the text?\n\nA) The beetle's wings are shorter than its body.\nB) The beetle lives in several types of forest.\nC) Some beetles are active at night.\nD) Birds avoid models painted the beetle's color after tasting one real beetle.", "answer": "D", "explanation": "Predators avoiding the color supports warning coloration."}, {"id": "10.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______\n\nWhich choice best states the main purpose of the text?\n\nA) rainfall records from the period are always inaccurate.\nB) the city had no need for agriculture.\nC) irrigation may have helped the city support more people despite drier weather.\nD) the population must have moved away immediately.", "answer": "C", "explanation": "Canals explain growth during declining rainfall."}, {"id": "10.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______\n\nWhich choice best states the main purpose of the text?\n\nA) prove that all viewers liked the film.\nB) avoid forming any opinion about the film.\nC) make the positive evaluation more persuasive.\nD) remove the need to watch the film.", "answer": "C", "explanation": "Addressing objections strengthens the argument."}]}, {"n": 11, "concept": "Poetry: infer the main purpose of a poem excerpt.", "original": "The following text is from Maggie Pogue Johnson's 1910 poem \"Poet of Our Race.\" In this poem, the speaker is addressing Paul Laurence Dunbar, a Black author.\n\nThou, with stroke of mighty pen,\nHast told of joy and mirth,\nAnd read the hearts and souls of men\nAs cradled from their birth.\nThe language of the flowers,\nThou hast read them all,\nAnd e'en the little brook\nResponded to thy call.\n\nWhich choice best states the main purpose of the text?\nA) To praise a certain writer for being especially perceptive regarding people and nature\nB) To establish that a certain writer has read extensively about a variety of topics\nC) To call attention to a certain writer's careful and elaborately detailed writing process\nD) To recount fond memories of an afternoon spent in nature with a certain writer", "generated": [{"id": "11.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The examples are not random facts; they work together to shape the reader's understanding of the person, artwork, place, or debate being described. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.\n\nWhich choice best states the main purpose of the text?\n\nA) The poet dislikes mirrors.\nB) The poem is mainly about farming.\nC) The river represents movement and reflection.\nD) The river is unsafe for travelers.", "answer": "C", "explanation": "Both metaphors point to travel and self-knowledge."}, {"id": "11.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Each sentence adds a layer of context, and the final impression depends on how those details combine. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?\n\nWhich choice best states the main purpose of the text?\n\nA) The diary describes meals, wages, tools, and conversations in a textile mill.\nB) The writer sometimes misspelled common words.\nC) The diary was sold at auction in 1998.\nD) The diary's cover was made of expensive leather.", "answer": "A", "explanation": "Details about daily routines support historical value."}, {"id": "11.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The final sentence does not shift to an unrelated topic; instead, it clarifies the significance of what came before. The passage moves from description to emphasis, giving readers enough context to see which broader point the author is developing through the specific details. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?\n\nWhich choice best states the main purpose of the text?\n\nA) Some beetles are active at night.\nB) The beetle's wings are shorter than its body.\nC) The beetle lives in several types of forest.\nD) Birds avoid models painted the beetle's color after tasting one real beetle.", "answer": "D", "explanation": "Predators avoiding the color supports warning coloration."}, {"id": "11.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______\n\nWhich choice best states the main purpose of the text?\n\nA) the population must have moved away immediately.\nB) irrigation may have helped the city support more people despite drier weather.\nC) the city had no need for agriculture.\nD) rainfall records from the period are always inaccurate.", "answer": "B", "explanation": "Canals explain growth during declining rainfall."}, {"id": "11.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______\n\nWhich choice best states the main purpose of the text?\n\nA) make the positive evaluation more persuasive.\nB) prove that all viewers liked the film.\nC) remove the need to watch the film.\nD) avoid forming any opinion about the film.", "answer": "A", "explanation": "Addressing objections strengthens the argument."}]}, {"n": 12, "concept": "Command of Evidence: choose the quotation that best supports a claim.", "original": "\"To You\" is an 1856 poem by Walt Whitman. In the poem, Whitman suggests that readers, whom he addresses directly, have not fully understood themselves, writing, _______\n\nWhich quotation from \"To You\" most effectively illustrates the claim?\nA) \"You have not known what you are, you have slumber'd upon yourself / all your life, / Your eyelids have been the same as closed most of the time.\"\nB) \"These immense meadows, these interminable rivers, you are immense / and interminable as they.\"\nC) \"I should have made my way straight to you long ago, / I should have blabb'd nothing but you, I should have chanted nothing / but you.\"\nD) \"I will leave all and come and make the hymns of you, / None has understood you, but I understand you.\"", "generated": [{"id": "12.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) The poet dislikes mirrors.\nB) The river is unsafe for travelers.\nC) The poem is mainly about farming.\nD) The river represents movement and reflection.", "answer": "D", "explanation": "Both metaphors point to travel and self-knowledge."}, {"id": "12.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) The diary was sold at auction in 1998.\nB) The diary describes meals, wages, tools, and conversations in a textile mill.\nC) The writer sometimes misspelled common words.\nD) The diary's cover was made of expensive leather.", "answer": "B", "explanation": "Details about daily routines support historical value."}, {"id": "12.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the relationship between the claim and the data, showing why the author's interpretation is more plausible than an alternative explanation. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) The beetle lives in several types of forest.\nB) The beetle's wings are shorter than its body.\nC) Some beetles are active at night.\nD) Birds avoid models painted the beetle's color after tasting one real beetle.", "answer": "D", "explanation": "Predators avoiding the color supports warning coloration."}, {"id": "12.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal relationship; the best support aligns with the claim's exact logic. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) the city had no need for agriculture.\nB) the population must have moved away immediately.\nC) irrigation may have helped the city support more people despite drier weather.\nD) rainfall records from the period are always inaccurate.", "answer": "C", "explanation": "Canals explain growth during declining rainfall."}, {"id": "12.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an observation to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) make the positive evaluation more persuasive.\nB) prove that all viewers liked the film.\nC) remove the need to watch the film.\nD) avoid forming any opinion about the film.", "answer": "A", "explanation": "Addressing objections strengthens the argument."}]}, {"n": 13, "concept": "Command of Evidence: choose a finding that supports a student's claim.", "original": "Born in 1891 to a Quechua-speaking family in the Andes Mountains of Peru, Martin Chambi is today considered to be one of the most renowned figures of Latin American photography. In a paper for an art history class, a student claims that Chambi's photographs have considerable ethnographic value - in his work, Chambi was able to capture diverse elements of Peruvian society, representing his subjects with both dignity and authenticity.\n\nWhich finding, if true, would most directly support the student's claim?\nA) Chambi took many commissioned portraits of wealthy Peruvians, but he also produced hundreds of images carefully documenting the peoples, sites, and customs of Indigenous communities of the Andes.\nB) Chambi's photographs demonstrate a high level of technical skill, as seen in his strategic use of illumination to create dramatic light and shadow contrasts.\nC) During his lifetime, Chambi was known and celebrated both within and outside his native Peru, as his work was published in places like Argentina, Spain, and Mexico.\nD) Some of the peoples and places Chambi photographed had long been popular subjects for Peruvian photographers.", "generated": [{"id": "13.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) The river is unsafe for travelers.\nB) The poet dislikes mirrors.\nC) The river represents movement and reflection.\nD) The poem is mainly about farming.", "answer": "C", "explanation": "Both metaphors point to travel and self-knowledge."}, {"id": "13.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) The diary's cover was made of expensive leather.\nB) The diary was sold at auction in 1998.\nC) The writer sometimes misspelled common words.\nD) The diary describes meals, wages, tools, and conversations in a textile mill.", "answer": "D", "explanation": "Details about daily routines support historical value."}, {"id": "13.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the relationship between the claim and the data, showing why the author's interpretation is more plausible than an alternative explanation. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) Birds avoid models painted the beetle's color after tasting one real beetle.\nB) The beetle lives in several types of forest.\nC) The beetle's wings are shorter than its body.\nD) Some beetles are active at night.", "answer": "A", "explanation": "Predators avoiding the color supports warning coloration."}, {"id": "13.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal relationship; the best support aligns with the claim's exact logic. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) the population must have moved away immediately.\nB) the city had no need for agriculture.\nC) rainfall records from the period are always inaccurate.\nD) irrigation may have helped the city support more people despite drier weather.", "answer": "D", "explanation": "Canals explain growth during declining rainfall."}, {"id": "13.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an observation to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______\n\nWhich choice most directly supports the claim or hypothesis?\n\nA) avoid forming any opinion about the film.\nB) make the positive evaluation more persuasive.\nC) prove that all viewers liked the film.\nD) remove the need to watch the film.", "answer": "B", "explanation": "Addressing objections strengthens the argument."}]}, {"n": 14, "concept": "Quantitative Evidence: use table data to complete an example.", "original": "A table lists credited film output for James Young Deer, Dark Cloud, Edwin Carewe, and Lillian St. Cyr. It shows, among other credits, Lillian St. Cyr with 66 actor credits and Edwin Carewe with 58 director credits. The text says many records from the era have been lost, so the counts should be taken as bare minimums rather than totals; it's entirely possible, for example, that _______\n\nWhich choice most effectively uses data from the table to complete the example?\nA) Dark Cloud acted in significantly fewer films than did Lillian St. Cyr, who is credited with 66 performances.\nB) Edwin Carewe's 47 credited acting roles includes only films made after 1934.\nC) Lillian St. Cyr acted in far more than 66 films and Edwin Carewe directed more than 58.\nD) James Young Deer actually directed 33 films and acted in only 10.", "generated": [{"id": "14.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A table shows that 68% of seedlings near shrubs survived, compared with 22% in open ground.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) Seedling survival was much higher near shrubs than in open ground.\nB) The table includes two habitats.\nC) Some seedlings grew in open ground.\nD) Shrubs were counted before seedlings.", "answer": "A", "explanation": "The comparison directly supports the claim."}, {"id": "14.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A useful interpretation of the data will do more than repeat one value from the table. It will identify the relevant relationship among values, such as which figure is highest, which category changes most, or which comparison fits the claim being made. A table lists known plays by three writers: Lee 12, Ortiz 9, and Khan 15. The text says many records are missing, so these numbers are minimums. Which completion uses the table effectively?\n\nWhich choice most effectively uses or describes data from the table?\n\nA) The table proves no records are missing.\nB) Khan may have written more than 15 plays, and Lee more than 12.\nC) Ortiz definitely wrote exactly 9 plays.\nD) Lee wrote fewer plays than no other writer.", "answer": "B", "explanation": "Minimums can be lower than the true totals."}, {"id": "14.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The evidence depends on careful attention to percentages, totals, rankings, and whether a number represents a minimum, maximum, average, or exact count. Some options may quote accurate figures while still drawing a conclusion that the table does not support. A table shows museum visits rose from 14,000 to 21,000 after free Friday evenings began.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) The museum is open on Fridays.\nB) The table lists two years.\nC) Some visitors came on weekends.\nD) Visits increased by 7,000 after the program began.", "answer": "D", "explanation": "The increase supports the program's effect."}, {"id": "14.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The direction of the evidence matters: higher versus lower, earlier versus later, more frequent versus less frequent, or total versus proportional. A table shows that four bird species nested more often in restored marshes than in unrestored marshes.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) The marshes were near a river.\nB) Each species had more nests in restored marshes.\nC) One species had only 6 nests total.\nD) The study counted birds in spring.", "answer": "B", "explanation": "All species show the same beneficial pattern."}, {"id": "14.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The table should be interpreted as part of the argument, not as an independent math exercise. The strongest completion uses the data to clarify the claim while avoiding comparisons that ignore a category, reverse a trend, or exaggerate the size of a difference. A table shows that students using spaced practice remembered 82% of words, while those cramming remembered 49%.\n\nWhich choice most effectively uses or describes data from the table?\n\nA) The cramming group took the same test.\nB) Some words were difficult.\nC) The spaced-practice group remembered a larger share of words.\nD) Both groups studied vocabulary.", "answer": "C", "explanation": "The percentage comparison directly supports the claim."}]}, {"n": 15, "concept": "Quantitative Evidence: identify table data that support a claim.", "original": "A table shows juvenile plants of five species found on bare ground and in patches of vegetation. For each species, about 52% to 60% of juvenile plants were found in vegetation patches. Researchers calculated that if plants were randomly distributed, only about 15% would be in patches of vegetation. They claim that plants of these species that grow close to other plants gain an advantage at an early developmental stage.\n\nWhich choice best describes data from the table that support the researchers' claim?\nA) For all five species, less than 75% of juvenile plants were growing in patches of vegetation.\nB) The species with the greatest number of juvenile plants growing in patches of vegetation was H. stoechas.\nC) For T. libanitis and T. moroderi, the percentage of juvenile plants growing in patches of vegetation was less than what would be expected if plants were randomly distributed.\nD) For each species, the percentage of juvenile plants growing in patches of vegetation was substantially higher than what would be ex
