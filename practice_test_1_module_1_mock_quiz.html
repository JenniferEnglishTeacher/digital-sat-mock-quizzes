w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several facts are relevant to the general topic, but only one would directly strengthen the exact assertion being made, including any limits placed on time period, method, comparison, or cause. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n有幾項事實與整體主題相關，但只有一項能直接強化所提出的確切論斷，包括對時期、方法、比較或原因所設的任何限制。一段文章說一位詩人把河流既描寫成道路也描寫成鏡子，暗示旅行也能通往自我認識。", "opts": {"A": "The poet dislikes mirrors.", "B": "The poem is mainly about farming.", "C": "The river represents movement and reflection.", "D": "The river is unsafe for travelers."}, "optsZh": {"A": "這位詩人不喜歡鏡子。", "B": "這首詩主要是關於農耕。", "C": "這條河代表著移動與反思。", "D": "這條河對旅人來說不安全。"}, "answer": "C", "expl": "Both metaphors point to travel and self-knowledge.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Command of Evidence: choose a finding that strengthens a scientific hypothesis.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers&#x27; daily routines. Which finding best supports the claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Evidence that merely sounds impressive would not be enough; the useful finding must connect clearly to the specific reasoning in the claim and make that reasoning more convincing. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n聽起來令人印象深刻的證據並不足夠；有用的發現必須與主張中的具體推理清楚連結，並使該推理更具說服力。一名學生主張一本日記具有歷史價值，因為它記錄了普通工人的日常作息。哪一項發現最能支持這個主張？", "opts": {"A": "The diary was sold at auction in 1998.", "B": "The diary's cover was made of expensive leather.", "C": "The diary describes meals, wages, tools, and conversations in a textile mill.", "D": "The writer sometimes misspelled common words."}, "optsZh": {"A": "這本日記於 1998 年在拍賣會上售出。", "B": "這本日記的封面是用昂貴的皮革製成的。", "C": "這本日記描述了一間紡織廠裡的餐食、工資、工具與對話。", "D": "作者有時會拼錯常見的單字。"}, "answer": "C", "expl": "Details about daily routines support historical value.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Command of Evidence: choose a finding that strengthens a scientific hypothesis.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the claim and the data, showing why the author&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is more plausible than an alternative explanation. A scientist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesizes\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesizes\" data-pos=\"v.\" data-en=\"suggests a possible explanation that has not yet been proven\" data-zh=\"提出假設\">hypothesizes<\/a> that a beetle&#x27;s bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some details describe the topic accurately but do not address the point at issue. The strongest evidence is the option that narrows the relationship between the claim and the data, showing why the author's interpretation is more plausible than an alternative explanation. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n有些細節準確地描述了主題，卻沒有觸及爭議的要點。最有力的證據是能縮小主張與資料之間關係的選項，說明為何作者的詮釋比另一種解釋更合理。一位科學家假設某種甲蟲鮮豔的顏色是在警告掠食者它的味道苦澀。哪一項發現最能直接支持這個假設？", "opts": {"A": "Some beetles are active at night.", "B": "The beetle lives in several types of forest.", "C": "The beetle's wings are shorter than its body.", "D": "Birds avoid models painted the beetle's color after tasting one real beetle."}, "optsZh": {"A": "有些甲蟲在夜間活動。", "B": "這種甲蟲生活在好幾種類型的森林中。", "C": "這種甲蟲的翅比身體短。", "D": "鳥類在嚐過一隻真的甲蟲後，會避開塗上該甲蟲顏色的模型。"}, "answer": "D", "expl": "Predators avoiding the color supports warning coloration.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Command of Evidence: choose a finding that strengthens a scientific hypothesis.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a>; the best support aligns with the claim&#x27;s exact logic. A text states that an ancient city&#x27;s population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fact can be true and still fail to support the claim if it concerns the wrong population, time frame, feature, or causal relationship; the best support aligns with the claim's exact logic. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n一項事實可能是真的，卻仍無法支持主張──如果它涉及錯誤的對象、時間範圍、特徵或因果關係；最佳的支持會與主張的確切邏輯相符。一篇文章指出，一座古城的人口在降雨量減少的情況下仍快速成長。考古學家發現了同一時期新建的運河，這顯示 _______", "opts": {"A": "rainfall records from the period are always inaccurate.", "B": "irrigation may have helped the city support more people despite drier weather.", "C": "the population must have moved away immediately.", "D": "the city had no need for agriculture."}, "optsZh": {"A": "該時期的降雨紀錄總是不準確。", "B": "灌溉可能幫助這座城市在較乾燥的氣候下養活更多的人口。", "C": "人口一定立刻遷走了。", "D": "這座城市不需要農業。"}, "answer": "B", "expl": "Canals explain growth during declining rainfall.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Command of Evidence: choose a finding that strengthens a scientific hypothesis.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a> to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film&#x27;s weaknesses before defending it may _______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The claim depends on a chain of reasoning that links an observation to a conclusion. The supporting evidence must preserve that chain, supplying a detail that would make the conclusion more likely without overstating what the available information can prove. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______", "stem": "Which choice most directly supports the claim or hypothesis?", "stemZh": "哪個選項最能直接支持該主張或假設？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個主張依賴一條將觀察與結論連結起來的推理鏈。支持的證據必須維持這條推理鏈，提供一個能使結論更可能成立的細節，同時不誇大現有資訊所能證明的範圍。一位評論家主張，優秀的評論會正面處理可能的反對意見，而非忽略它們。因此，一位在為電影辯護之前先討論其缺點的影評人，可能會 _______", "opts": {"A": "make the positive evaluation more persuasive.", "B": "remove the need to watch the film.", "C": "avoid forming any opinion about the film.", "D": "prove that all viewers liked the film."}, "optsZh": {"A": "使正面的評價更具說服力。", "B": "免除觀看這部電影的必要。", "C": "避免對這部電影形成任何意見。", "D": "證明所有觀眾都喜歡這部電影。"}, "answer": "A", "expl": "Addressing objections strengthens the argument.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Inferences: complete the text with the most logical conclusion.", "vocab": false, "body": "Herbivorous sauropod dinosaurs could grow more than 100 feet long and weigh up to 80 tons, and some researchers have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributed<\/a> the evolution of sauropods to such massive sizes to increased plant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a> resulting from high levels of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=atmospheric\" target=\"_blank\" rel=\"noopener\" data-w=\"atmospheric\" data-pos=\"adj.\" data-en=\"relating to the air surrounding the Earth\" data-zh=\"大氣的\">atmospheric<\/a> carbon dioxide during the Mesozoic era. However, there is no evidence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> spikes in carbon dioxide levels coinciding with relevant periods in sauropod evolution, suggesting that _______", "bodyPlain": "Herbivorous sauropod dinosaurs could grow more than 100 feet long and weigh up to 80 tons, and some researchers have attributed the evolution of sauropods to such massive sizes to increased plant production resulting from high levels of atmospheric carbon dioxide during the Mesozoic era. However, there is no evidence of significant spikes in carbon dioxide levels coinciding with relevant periods in sauropod evolution, suggesting that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "草食性的蜥腳類恐龍可以長到超過 100 英尺長、重達 80 噸，一些研究人員將蜥腳類演化出如此巨大體型歸因於中生代大氣中高濃度二氧化碳所帶來的植物產量增加。然而，並沒有證據顯示二氧化碳濃度的顯著飆升與蜥腳類演化的相關時期相吻合，這顯示 _______", "opts": {"A": "fluctuations in atmospheric carbon dioxide affected different sauropod lineages differently.", "B": "the evolution of larger body sizes in sauropods did not depend on increased atmospheric carbon dioxide.", "C": "atmospheric carbon dioxide was higher when the largest known sauropods lived than it was when the first sauropods appeared.", "D": "sauropods probably would not have evolved to such immense sizes if atmospheric carbon dioxide had been even slightly higher."}, "optsZh": {"A": "大氣二氧化碳的波動對不同的蜥腳類譜系產生了不同的影響。", "B": "蜥腳類演化出較大的體型並不依賴大氣二氧化碳的增加。", "C": "已知最大的蜥腳類恐龍生存時的大氣二氧化碳濃度，高於最早的蜥腳類出現時的濃度。", "D": "如果大氣二氧化碳濃度再稍微高一點，蜥腳類恐龍可能就不會演化出如此巨大的體型。"}, "answer": "B", "expl": "No CO2 spikes coincide with sauropod growth, so the logical conclusion is that larger body size did not depend on increased CO2.", "explZh": "沒有二氧化碳飆升與蜥腳類變大的時期吻合，所以合理的結論是：體型變大並不依賴二氧化碳增加。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Inferences: complete the text with the most logical conclusion.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The final sentence must connect the evidence to the claim while avoiding a conclusion that goes beyond the information provided. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The final sentence must connect the evidence to the claim while avoiding a conclusion that goes beyond the information provided. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n最後一句必須將證據與主張連結起來，同時避免得出超出所提供資訊的結論。一段文章說一位詩人把河流既描寫成道路也描寫成鏡子，暗示旅行也能通往自我認識。", "opts": {"A": "The river is unsafe for travelers.", "B": "The poem is mainly about farming.", "C": "The river represents movement and reflection.", "D": "The poet dislikes mirrors."}, "optsZh": {"A": "這條河對旅人來說不安全。", "B": "這首詩主要是關於農耕。", "C": "這條河代表著移動與反思。", "D": "這位詩人不喜歡鏡子。"}, "answer": "C", "expl": "Both metaphors point to travel and self-knowledge.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Inferences: complete the text with the most logical conclusion.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The details establish a narrow evidentiary path, and the final statement should stay within that path instead of making a broader or more dramatic claim. A student claims that a diary has historical value because it records ordinary workers&#x27; daily routines. Which finding best supports the claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The details establish a narrow evidentiary path, and the final statement should stay within that path instead of making a broader or more dramatic claim. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n這些細節建立了一條狹窄的證據路徑，最後的陳述應留在這條路徑之內，而不是提出更廣泛或更戲劇性的主張。一名學生主張一本日記具有歷史價值，因為它記錄了普通工人的日常作息。哪一項發現最能支持這個主張？", "opts": {"A": "The diary describes meals, wages, tools, and conversations in a textile mill.", "B": "The diary was sold at auction in 1998.", "C": "The writer sometimes misspelled common words.", "D": "The diary's cover was made of expensive leather."}, "optsZh": {"A": "這本日記描述了一間紡織廠裡的餐食、工資、工具與對話。", "B": "這本日記於 1998 年在拍賣會上售出。", "C": "作者有時會拼錯常見的單字。", "D": "這本日記的封面是用昂貴的皮革製成的。"}, "answer": "A", "expl": "Details about daily routines support historical value.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Inferences: complete the text with the most logical conclusion.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A completion that ignores that shift would distort the argument, while a completion that follows it will show how the new evidence affects the earlier idea. A scientist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesizes\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesizes\" data-pos=\"v.\" data-en=\"suggests a possible explanation that has not yet been proven\" data-zh=\"提出假設\">hypothesizes<\/a> that a beetle&#x27;s bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A completion that ignores that shift would distort the argument, while a completion that follows it will show how the new evidence affects the earlier idea. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n忽略這個轉折的補全會扭曲論證，而順著轉折的補全則會顯示新證據如何影響先前的想法。一位科學家假設某種甲蟲鮮豔的顏色是在警告掠食者它的味道苦澀。哪一項發現最能直接支持這個假設？", "opts": {"A": "The beetle lives in several types of forest.", "B": "Birds avoid models painted the beetle's color after tasting one real beetle.", "C": "The beetle's wings are shorter than its body.", "D": "Some beetles are active at night."}, "optsZh": {"A": "這種甲蟲生活在好幾種類型的森林中。", "B": "鳥類在嚐過一隻真的甲蟲後，會避開塗上該甲蟲顏色的模型。", "C": "這種甲蟲的翅比身體短。", "D": "有些甲蟲在夜間活動。"}, "answer": "B", "expl": "Predators avoiding the color supports warning coloration.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Inferences: complete the text with the most logical conclusion.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The final inference must account for each important detail, including any <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertainty\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertainty\" data-pos=\"n.\" data-en=\"the state of not being sure\" data-zh=\"不確定性\">uncertainty<\/a>, comparison, exception, or limitation introduced earlier. A text states that an ancient city&#x27;s population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The final inference must account for each important detail, including any uncertainty, comparison, exception, or limitation introduced earlier. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n最後的推論必須顧及每一個重要細節，包括先前提出的任何不確定性、比較、例外或限制。一篇文章指出，一座古城的人口在降雨量減少的情況下仍快速成長。考古學家發現了同一時期新建的運河，這顯示 _______", "opts": {"A": "the city had no need for agriculture.", "B": "the population must have moved away immediately.", "C": "rainfall records from the period are always inaccurate.", "D": "irrigation may have helped the city support more people despite drier weather."}, "optsZh": {"A": "這座城市不需要農業。", "B": "人口一定立刻遷走了。", "C": "該時期的降雨紀錄總是不準確。", "D": "灌溉可能幫助這座城市在較乾燥的氣候下養活更多的人口。"}, "answer": "D", "expl": "Canals explain growth during declining rainfall.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Inferences: complete the text with the most logical conclusion.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film&#x27;s weaknesses before defending it may _______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n一位評論家主張，優秀的評論會正面處理可能的反對意見，而非忽略它們。因此，一位在為電影辯護之前先討論其缺點的影評人，可能會 _______", "opts": {"A": "prove that all viewers liked the film.", "B": "avoid forming any opinion about the film.", "C": "make the positive evaluation more persuasive.", "D": "remove the need to watch the film."}, "optsZh": {"A": "證明所有觀眾都喜歡這部電影。", "B": "避免對這部電影形成任何意見。", "C": "使正面的評價更具說服力。", "D": "免除觀看這部電影的必要。"}, "answer": "C", "expl": "Addressing objections strengthens the argument.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Inferences: complete an argument about strengthening legal reasoning.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=document\" target=\"_blank\" rel=\"noopener\" data-w=\"document\" data-pos=\"v.\" data-en=\"to record something in writing or pictures\" data-zh=\"記錄\">documents<\/a> called judicial opinions, judges explain the reasoning behind their legal rulings, and in those explanations they sometimes cite and discuss historical and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=philosopher\" target=\"_blank\" rel=\"noopener\" data-w=\"philosopher\" data-pos=\"n.\" data-en=\"a person who studies ideas about knowledge, truth, and life\" data-zh=\"哲學家\">philosophers<\/a>. Legal scholar and philosopher Anita L. Allen argues that while judges are naturally inclined to mention philosophers whose views align with their own positions, the strongest judicial opinions consider and rebut potential <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=objection\" target=\"_blank\" rel=\"noopener\" data-w=\"objection\" data-pos=\"n.\" data-en=\"a reason for disagreeing with something\" data-zh=\"反對意見\">objections<\/a>; discussing philosophers whose views conflict with judges&#x27; views could therefore _______", "bodyPlain": "In documents called judicial opinions, judges explain the reasoning behind their legal rulings, and in those explanations they sometimes cite and discuss historical and contemporary philosophers. Legal scholar and philosopher Anita L. Allen argues that while judges are naturally inclined to mention philosophers whose views align with their own positions, the strongest judicial opinions consider and rebut potential objections; discussing philosophers whose views conflict with judges' views could therefore _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在稱為司法意見書的文件中，法官解釋其法律裁決背後的推理，而在這些解釋中，他們有時會引用並討論古今的哲學家。法律學者兼哲學家 Anita L. Allen 主張，雖然法官自然傾向提及與自己立場相符的哲學家，但最有力的司法意見書會考量並駁斥可能的反對意見；因此，討論與法官觀點相衝突的哲學家可能 _______", "opts": {"A": "allow judges to craft judicial opinions without needing to consult philosophical works.", "B": "help judges improve the arguments they put forward in their judicial opinions.", "C": "make judicial opinions more comprehensible to readers without legal or philosophical training.", "D": "bring judicial opinions in line with views that are broadly held among philosophers."}, "optsZh": {"A": "讓法官無需參考哲學著作就能撰寫司法意見書。", "B": "幫助法官改進他們在司法意見書中提出的論證。", "C": "使司法意見書對沒有法律或哲學背景的讀者更容易理解。", "D": "使司法意見書與哲學家普遍持有的觀點一致。"}, "answer": "B", "expl": "Allen says the strongest opinions 'consider and rebut potential objections', so engaging opposing philosophers would help judges improve their arguments.", "explZh": "Allen 認為最有力的意見書會「考量並駁斥可能的反對意見」，因此討論持相反觀點的哲學家有助於法官改進論證。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Inferences: complete an argument about strengthening legal reasoning.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The final sentence must connect the evidence to the claim while avoiding a conclusion that goes beyond the information provided. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The final sentence must connect the evidence to the claim while avoiding a conclusion that goes beyond the information provided. A passage says that a poet describes the river as both a road and a mirror, suggesting that travel also leads to self-knowledge.", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n最後一句必須將證據與主張連結起來，同時避免得出超出所提供資訊的結論。一段文章說一位詩人把河流既描寫成道路也描寫成鏡子，暗示旅行也能通往自我認識。", "opts": {"A": "The poet dislikes mirrors.", "B": "The river represents movement and reflection.", "C": "The poem is mainly about farming.", "D": "The river is unsafe for travelers."}, "optsZh": {"A": "這位詩人不喜歡鏡子。", "B": "這條河代表著移動與反思。", "C": "這首詩主要是關於農耕。", "D": "這條河對旅人來說不安全。"}, "answer": "B", "expl": "Both metaphors point to travel and self-knowledge.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Inferences: complete an argument about strengthening legal reasoning.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The details establish a narrow evidentiary path, and the final statement should stay within that path instead of making a broader or more dramatic claim. A student claims that a diary has historical value because it records ordinary workers&#x27; daily routines. Which finding best supports the claim?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The details establish a narrow evidentiary path, and the final statement should stay within that path instead of making a broader or more dramatic claim. A student claims that a diary has historical value because it records ordinary workers' daily routines. Which finding best supports the claim?", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n這些細節建立了一條狹窄的證據路徑，最後的陳述應留在這條路徑之內，而不是提出更廣泛或更戲劇性的主張。一名學生主張一本日記具有歷史價值，因為它記錄了普通工人的日常作息。哪一項發現最能支持這個主張？", "opts": {"A": "The diary was sold at auction in 1998.", "B": "The diary's cover was made of expensive leather.", "C": "The writer sometimes misspelled common words.", "D": "The diary describes meals, wages, tools, and conversations in a textile mill."}, "optsZh": {"A": "這本日記於 1998 年在拍賣會上售出。", "B": "這本日記的封面是用昂貴的皮革製成的。", "C": "作者有時會拼錯常見的單字。", "D": "這本日記描述了一間紡織廠裡的餐食、工資、工具與對話。"}, "answer": "D", "expl": "Details about daily routines support historical value.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Inferences: complete an argument about strengthening legal reasoning.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A completion that ignores that shift would distort the argument, while a completion that follows it will show how the new evidence affects the earlier idea. A scientist <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesizes\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesizes\" data-pos=\"v.\" data-en=\"suggests a possible explanation that has not yet been proven\" data-zh=\"提出假設\">hypothesizes<\/a> that a beetle&#x27;s bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A completion that ignores that shift would distort the argument, while a completion that follows it will show how the new evidence affects the earlier idea. A scientist hypothesizes that a beetle's bright color warns predators that it tastes bitter. Which finding would most directly support the hypothesis?", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n忽略這個轉折的補全會扭曲論證，而順著轉折的補全則會顯示新證據如何影響先前的想法。一位科學家假設某種甲蟲鮮豔的顏色是在警告掠食者它的味道苦澀。哪一項發現最能直接支持這個假設？", "opts": {"A": "The beetle lives in several types of forest.", "B": "Birds avoid models painted the beetle's color after tasting one real beetle.", "C": "The beetle's wings are shorter than its body.", "D": "Some beetles are active at night."}, "optsZh": {"A": "這種甲蟲生活在好幾種類型的森林中。", "B": "鳥類在嚐過一隻真的甲蟲後，會避開塗上該甲蟲顏色的模型。", "C": "這種甲蟲的翅比身體短。", "D": "有些甲蟲在夜間活動。"}, "answer": "B", "expl": "Predators avoiding the color supports warning coloration.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Inferences: complete an argument about strengthening legal reasoning.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The final inference must account for each important detail, including any <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertainty\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertainty\" data-pos=\"n.\" data-en=\"the state of not being sure\" data-zh=\"不確定性\">uncertainty<\/a>, comparison, exception, or limitation introduced earlier. A text states that an ancient city&#x27;s population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The final inference must account for each important detail, including any uncertainty, comparison, exception, or limitation introduced earlier. A text states that an ancient city's population grew rapidly even though rainfall declined. Archaeologists found new canals from the same period, suggesting that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n最後的推論必須顧及每一個重要細節，包括先前提出的任何不確定性、比較、例外或限制。一篇文章指出，一座古城的人口在降雨量減少的情況下仍快速成長。考古學家發現了同一時期新建的運河，這顯示 _______", "opts": {"A": "irrigation may have helped the city support more people despite drier weather.", "B": "rainfall records from the period are always inaccurate.", "C": "the population must have moved away immediately.", "D": "the city had no need for agriculture."}, "optsZh": {"A": "灌溉可能幫助這座城市在較乾燥的氣候下養活更多的人口。", "B": "該時期的降雨紀錄總是不準確。", "C": "人口一定立刻遷走了。", "D": "這座城市不需要農業。"}, "answer": "A", "expl": "Canals explain growth during declining rainfall.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Inferences: complete an argument about strengthening legal reasoning.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film&#x27;s weaknesses before defending it may _______", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A critic argues that strong reviews address possible objections instead of ignoring them. Therefore, a reviewer who discusses a film's weaknesses before defending it may _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最能合乎邏輯地補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n一位評論家主張，優秀的評論會正面處理可能的反對意見，而非忽略它們。因此，一位在為電影辯護之前先討論其缺點的影評人，可能會 _______", "opts": {"A": "avoid forming any opinion about the film.", "B": "remove the need to watch the film.", "C": "make the positive evaluation more persuasive.", "D": "prove that all viewers liked the film."}, "optsZh": {"A": "避免對這部電影形成任何意見。", "B": "免除觀看這部電影的必要。", "C": "使正面的評價更具說服力。", "D": "證明所有觀眾都喜歡這部電影。"}, "answer": "C", "expl": "Addressing objections strengthens the argument.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English: pronoun-antecedent agreement.", "vocab": false, "body": "Public-awareness <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaigns<\/a> about the need to reduce <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=single-use\" target=\"_blank\" rel=\"noopener\" data-w=\"single-use\" data-pos=\"adj.\" data-en=\"designed to be used only once\" data-zh=\"一次性的\">single-use<\/a> plastics can be successful, says <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduction\" target=\"_blank\" rel=\"noopener\" data-w=\"reduction\" data-pos=\"n.\" data-en=\"the act of making something smaller or less\" data-zh=\"減少\">reduction<\/a> in plastic-bag use after cashiers were instructed to ask customers whether _______ wanted a bag.", "bodyPlain": "Public-awareness campaigns about the need to reduce single-use plastics can be successful, says researcher Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent reduction in plastic-bag use after cashiers were instructed to ask customers whether _______ wanted a bag.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "澳洲蒙納許大學的研究員 Kim Borg 表示，關於減少一次性塑膠的公眾宣導活動，在給予消費者選擇時可以成功：例如，日本在收銀員被指示詢問顧客 _______ 是否需要袋子之後，塑膠袋使用量減少了 40%。", "opts": {"A": "they", "B": "one", "C": "you", "D": "it"}, "optsZh": {"A": "they（他們；複數主格）", "B": "one（某人；泛指代名詞）", "C": "you（你；第二人稱）", "D": "it（它；單數代名詞）"}, "answer": "A", "expl": "The pronoun refers to the plural noun 'customers', so the plural 'they' is needed.", "explZh": "代名詞指的是複數名詞「customers」，因此需要複數的「they」。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English: pronoun-antecedent agreement.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The researchers interviewed local artists after _______ completed the mural project.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The researchers interviewed local artists after _______ completed the mural project.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。研究人員在 _______ 完成壁畫計畫後訪問了當地藝術家。", "opts": {"A": "they", "B": "one", "C": "itself", "D": "it"}, "optsZh": {"A": "they（他們；複數主格）", "B": "one（某人；泛指代名詞）", "C": "itself（它自己；單數反身代名詞）", "D": "it（它；單數代名詞）"}, "answer": "A", "expl": "Plural 'artists' requires plural 'they'.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English: pronoun-antecedent agreement.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. The museum guides asked visitors whether _______ wanted audio headsets.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The museum guides asked visitors whether _______ wanted audio headsets.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。博物館導覽員詢問參觀者 _______ 是否需要語音導覽耳機。", "opts": {"A": "itself", "B": "it", "C": "one", "D": "they"}, "optsZh": {"A": "itself（它自己；單數反身代名詞）", "B": "it（它；單數代名詞）", "C": "one（某人；泛指代名詞）", "D": "they（他們；複數主格）"}, "answer": "D", "expl": "Plural 'visitors' requires plural 'they'.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English: pronoun-antecedent agreement.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The editors contacted the authors to see whether _______ approved the final proofs.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The editors contacted the authors to see whether _______ approved the final proofs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。編輯們聯絡作者，以確認 _______ 是否核准最終校樣。", "opts": {"A": "you", "B": "one", "C": "they", "D": "it"}, "optsZh": {"A": "you（你；第二人稱）", "B": "one（某人；泛指代名詞）", "C": "they（他們；複數主格）", "D": "it（它；單數代名詞）"}, "answer": "C", "expl": "Plural 'authors' requires plural 'they'.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English: pronoun-antecedent agreement.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The coaches reminded players that _______ needed to submit permission forms by Friday.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The coaches reminded players that _______ needed to submit permission forms by Friday.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。教練提醒球員 _______ 必須在星期五前交出同意書。", "opts": {"A": "they", "B": "itself", "C": "it", "D": "one"}, "optsZh": {"A": "they（他們；複數主格）", "B": "itself（它自己；單數反身代名詞）", "C": "it（它；單數代名詞）", "D": "one（某人；泛指代名詞）"}, "answer": "A", "expl": "Plural 'players' requires plural 'they'.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English: pronoun-antecedent agreement.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The volunteers were asked whether _______ could return for the second cleanup day.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The volunteers were asked whether _______ could return for the second cleanup day.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。志工們被問到 _______ 是否能在第二個清理日回來。", "opts": {"A": "itself", "B": "they", "C": "one", "D": "it"}, "optsZh": {"A": "itself（它自己；單數反身代名詞）", "B": "they（他們；複數主格）", "C": "one（某人；泛指代名詞）", "D": "it（它；單數代名詞）"}, "answer": "B", "expl": "Plural 'volunteers' requires plural 'they'.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: punctuation before a participial phrase.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Greece, an Epicurean was a follower of Epicurus, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=philosopher\" target=\"_blank\" rel=\"noopener\" data-w=\"philosopher\" data-pos=\"n.\" data-en=\"a person who studies ideas about knowledge, truth, and life\" data-zh=\"哲學家\">philosopher<\/a> whose beliefs <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revolve\" target=\"_blank\" rel=\"noopener\" data-w=\"revolve\" data-pos=\"v.\" data-en=\"to have something as its main point or focus; to turn around\" data-zh=\"圍繞；旋轉\">revolved<\/a> around the pursuit of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pleasure\" target=\"_blank\" rel=\"noopener\" data-w=\"pleasure\" data-pos=\"n.\" data-en=\"a feeling of happiness or enjoyment\" data-zh=\"快樂\">pleasure<\/a>. Epicurus defined pleasure as &quot;the absence of pain in the body and of trouble in the _______ that all life&#x27;s virtues derived from this absence.", "bodyPlain": "In ancient Greece, an Epicurean was a follower of Epicurus, a philosopher whose beliefs revolved around the pursuit of pleasure. Epicurus defined pleasure as \"the absence of pain in the body and of trouble in the _______ that all life's virtues derived from this absence.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在古希臘，伊比鳩魯學派的信徒是哲學家伊比鳩魯的追隨者，其信念圍繞著對快樂的追求。伊比鳩魯將快樂定義為「身體無痛苦、靈魂無煩擾」_______ 人生所有的美德都源自這種「無」。", "opts": {"A": "soul,\" positing", "B": "soul\": positing", "C": "soul\"; positing", "D": "soul.\" Positing"}, "optsZh": {"A": "soul,\" positing（逗號在引號內＋分詞：正確）", "B": "soul\": positing（冒號在引號外＋分詞：錯誤）", "C": "soul\"; positing（分號後接分詞片語：錯誤）", "D": "soul.\" Positing（句號後 Positing 開頭 → 造成句子殘缺）"}, "answer": "A", "expl": "'Positing that…' is a participial phrase modifying the main clause; it is attached with a comma, which in American usage goes inside the closing quotation mark.", "explZh": "「positing that…」是修飾主要子句的分詞片語，用逗號連接；美式用法中逗號放在引號內。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: punctuation before a participial phrase.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The critic described the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a> as &quot;a conversation between metal and light,&quot; _______ that its shadows changed throughout the day.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The critic described the installation as \"a conversation between metal and light,\" _______ that its shadows changed throughout the day.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。評論家將這件裝置作品描述為「金屬與光之間的對話」，_______ 它的影子整天都在變化。", "opts": {"A": "; noting", "B": ". Noting", "C": "noting", "D": ": noting"}, "optsZh": {"A": "; noting（分號＋分詞）", "B": ". Noting（句號＋大寫分詞 → 造成句子殘缺）", "C": "noting（現在分詞，接在逗號後：正確）", "D": ": noting（冒號＋分詞）"}, "answer": "C", "expl": "A participial phrase can follow the main clause after a comma.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: punctuation before a participial phrase.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had
