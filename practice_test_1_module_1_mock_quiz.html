te\" data-zh=\"不同的；明顯的\">distinct<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> forms, many authors have created hybrid works that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporate<\/a> elements of both. Bernardine Evaristo&#x27;s The Emperor&#x27;s Babe, _______ is a verse novel, a book-length <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrative\" target=\"_blank\" rel=\"noopener\" data-w=\"narrative\" data-pos=\"n.\" data-en=\"a story or account of events\" data-zh=\"敘事；故事\">narrative<\/a> complete with characters and a plot but conveyed in short, crisp lines of poetry rather than prose.", "bodyPlain": "Although novels and poems are considered distinct literary forms, many authors have created hybrid works that incorporate elements of both. Bernardine Evaristo's The Emperor's Babe, _______ is a verse novel, a book-length narrative complete with characters and a plot but conveyed in short, crisp lines of poetry rather than prose.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "雖然小說與詩被視為不同的文學形式，許多作家卻創作出融合兩者元素的混合作品。Bernardine Evaristo 的《The Emperor's Babe》_______ 是一部詩體小說，一部具備人物與情節的長篇敘事，但以簡短明快的詩行而非散文來呈現。", "opts": {"A": "by contrast,", "B": "consequently,", "C": "secondly,", "D": "for example,"}, "optsZh": {"A": "by contrast,（相較之下）", "B": "consequently,（因此、結果）", "C": "secondly,（其次）", "D": "for example,（例如）"}, "answer": "D", "expl": "The verse novel is an example of the hybrid works just mentioned, so 'for example' is the logical transition.", "explZh": "詩體小說是前面提到的混合作品的一個例子，因此「for example」是合乎邏輯的轉折。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: use an example transition.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. Many languages borrow words from neighboring cultures. English, _______, includes words from French, Hindi, and Arabic.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The relationship between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. Many languages borrow words from neighboring cultures. English, _______, includes words from French, Hindi, and Arabic.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n句子之間的關係可能涉及舉例、對比、結果、延續或重點的轉移，而轉折詞必須明確表達這種關係。許多語言會從鄰近文化借用字詞。_______，英語包含來自法語、印地語與阿拉伯語的字詞。", "opts": {"A": "nevertheless,", "B": "consequently,", "C": "by contrast,", "D": "for example,"}, "optsZh": {"A": "nevertheless,（儘管如此）", "B": "consequently,（因此、結果）", "C": "by contrast,（相較之下）", "D": "for example,（例如）"}, "answer": "D", "expl": "English is an example of the general claim.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: use an example transition.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. Some mammals use tools. Sea otters, _______, crack shells with stones.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. Some mammals use tools. Sea otters, _______, crack shells with stones.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n空格後的句子必須與前一句連著讀，尤其當第二句縮小、限定或延伸了第一句時。有些哺乳動物會使用工具。_______，海獺會用石頭敲開貝殼。", "opts": {"A": "however,", "B": "instead,", "C": "for example,", "D": "therefore,"}, "optsZh": {"A": "however,（逗號 → 造成逗號連接錯誤）", "B": "instead,（反而、取而代之）", "C": "for example,（例如）", "D": "therefore,（因此）"}, "answer": "C", "expl": "Sea otters illustrate the claim.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: use an example transition.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Several artists combine painting and performance. Tania Bruguera, _______, often creates works that involve audience <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=participation\" target=\"_blank\" rel=\"noopener\" data-w=\"participation\" data-pos=\"n.\" data-en=\"the act of taking part in something\" data-zh=\"參與\">participation<\/a>.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Several artists combine painting and performance. Tania Bruguera, _______, often creates works that involve audience participation.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n有幾位藝術家結合了繪畫與表演。_______，Tania Bruguera 經常創作需要觀眾參與的作品。", "opts": {"A": "for example,", "B": "by contrast,", "C": "consequently,", "D": "nevertheless,"}, "optsZh": {"A": "for example,（例如）", "B": "by contrast,（相較之下）", "C": "consequently,（因此、結果）", "D": "nevertheless,（儘管如此）"}, "answer": "A", "expl": "The named artist is an example.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: use an example transition.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The second sentence may illustrate a point, challenge an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expectation\" target=\"_blank\" rel=\"noopener\" data-w=\"expectation\" data-pos=\"n.\" data-en=\"a belief that something will happen\" data-zh=\"預期；期望\">expectation<\/a>, identify a result, or introduce a related development that follows from the previous claim. Many cities have converted old rail lines into parks. New York&#x27;s High Line, _______, follows a former elevated railway.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The second sentence may illustrate a point, challenge an expectation, identify a result, or introduce a related development that follows from the previous claim. Many cities have converted old rail lines into parks. New York's High Line, _______, follows a former elevated railway.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n第二句可能是在說明一個論點、挑戰一種預期、指出一個結果，或引入一個由前一主張延伸而來的相關發展。許多城市已將舊鐵路線改建為公園。_______，紐約的高線公園（High Line）沿著一條昔日的高架鐵路而建。", "opts": {"A": "instead,", "B": "for example,", "C": "similarly,", "D": "consequently,"}, "optsZh": {"A": "instead,（反而、取而代之）", "B": "for example,（例如）", "C": "similarly,（同樣地）", "D": "consequently,（因此、結果）"}, "answer": "B", "expl": "The High Line exemplifies the trend.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: use an example transition.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. Hybrid literary works mix genres. A verse novel, _______, tells a story through poetry.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. Hybrid literary works mix genres. A verse novel, _______, tells a story through poetry.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n轉折詞應引導讀者走過這個轉變，而不誇大對比，也不暗示並不存在的因果關係。混合式文學作品會混合不同文類。_______，詩體小說透過詩來講述故事。", "opts": {"A": "however,", "B": "for example,", "C": "by contrast,", "D": "consequently,"}, "optsZh": {"A": "however,（逗號 → 造成逗號連接錯誤）", "B": "for example,（例如）", "C": "by contrast,（相較之下）", "D": "consequently,（因此、結果）"}, "answer": "B", "expl": "A verse novel is an example of a hybrid work.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transitions: signal contrast.", "vocab": false, "body": "At two weeks old, the time their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=critical\" target=\"_blank\" rel=\"noopener\" data-w=\"critical\" data-pos=\"adj.\" data-en=\"extremely important; or expressing disapproval\" data-zh=\"關鍵的；批判的\">critical<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=socialization\" target=\"_blank\" rel=\"noopener\" data-w=\"socialization\" data-pos=\"n.\" data-en=\"the process of learning to behave in a way accepted by a group\" data-zh=\"社會化\">socialization<\/a> period begins, wolves can smell but cannot yet see or hear. Domesticated dogs, _______ can see, hear, and smell by the end of two weeks. This relative lack of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sensory\" target=\"_blank\" rel=\"noopener\" data-w=\"sensory\" data-pos=\"adj.\" data-en=\"relating to the physical senses\" data-zh=\"感官的\">sensory<\/a> input may help explain why wolves behave so differently around humans than dogs do: from a very young age, wolves are more wary and less <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exploratory\" target=\"_blank\" rel=\"noopener\" data-w=\"exploratory\" data-pos=\"adj.\" data-en=\"done in order to discover or examine something\" data-zh=\"探索的\">exploratory<\/a>.", "bodyPlain": "At two weeks old, the time their critical socialization period begins, wolves can smell but cannot yet see or hear. Domesticated dogs, _______ can see, hear, and smell by the end of two weeks. This relative lack of sensory input may help explain why wolves behave so differently around humans than dogs do: from a very young age, wolves are more wary and less exploratory.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "在兩週大、也就是關鍵社會化期開始的時候，狼能聞到氣味，但還不能看或聽。家犬 _______ 在兩週結束前就能看、聽與聞。這種相對缺乏感官輸入的狀況，或許有助於解釋為何狼在人類身邊的行為與狗如此不同：從很小的時候起，狼就較為警覺、較少探索。", "opts": {"A": "in other words,", "B": "for instance,", "C": "by contrast,", "D": "accordingly,"}, "optsZh": {"A": "in other words,（換句話說）", "B": "for instance,（例如）", "C": "by contrast,（相較之下）", "D": "accordingly,（因此、據此）"}, "answer": "C", "expl": "Wolves cannot see or hear at two weeks, but dogs can—a contrast, so 'by contrast'.", "explZh": "狼在兩週大時不能看或聽，而狗可以──這是對比，因此用「by contrast」。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transitions: signal contrast.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. Desert nights can be cold. _______, desert afternoons may be intensely hot.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The relationship between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. Desert nights can be cold. _______, desert afternoons may be intensely hot.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n句子之間的關係可能涉及舉例、對比、結果、延續或重點的轉移，而轉折詞必須明確表達這種關係。沙漠的夜晚可能很冷。_______，沙漠的午後可能極為炎熱。", "opts": {"A": "By contrast,", "B": "In other words,", "C": "Accordingly,", "D": "For example,"}, "optsZh": {"A": "By contrast,（相較之下）", "B": "In other words,（換句話說）", "C": "Accordingly,（因此、據此）", "D": "For example,（例如）"}, "answer": "A", "expl": "The sentence contrasts nights and afternoons.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transitions: signal contrast.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. The first fabric absorbed water quickly. _______, the second repelled water almost completely.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. The first fabric absorbed water quickly. _______, the second repelled water almost completely.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n空格後的句子必須與前一句連著讀，尤其當第二句縮小、限定或延伸了第一句時。第一種布料迅速吸水。_______，第二種幾乎完全防水。", "opts": {"A": "Similarly,", "B": "For instance,", "C": "Therefore,", "D": "By contrast,"}, "optsZh": {"A": "Similarly,（同樣地）", "B": "For instance,（例如）", "C": "Therefore,（因此）", "D": "By contrast,（相較之下）"}, "answer": "D", "expl": "The two fabrics behave oppositely.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transitions: signal contrast.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Young wolves are cautious around unfamiliar animals. _______, many young dogs approach them readily.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Young wolves are cautious around unfamiliar animals. _______, many young dogs approach them readily.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n幼狼對不熟悉的動物十分警覺。_______，許多幼犬會輕易地主動接近它們。", "opts": {"A": "Accordingly,", "B": "For example,", "C": "By contrast,", "D": "In other words,"}, "optsZh": {"A": "Accordingly,（因此、據此）", "B": "For example,（例如）", "C": "By contrast,（相較之下）", "D": "In other words,（換句話說）"}, "answer": "C", "expl": "The dog behavior contrasts with wolf behavior.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transitions: signal contrast.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The second sentence may illustrate a point, challenge an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expectation\" target=\"_blank\" rel=\"noopener\" data-w=\"expectation\" data-pos=\"n.\" data-en=\"a belief that something will happen\" data-zh=\"預期；期望\">expectation<\/a>, identify a result, or introduce a related development that follows from the previous claim. The old bridge was narrow and steep. _______, the new bridge is wide and nearly level.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The second sentence may illustrate a point, challenge an expectation, identify a result, or introduce a related development that follows from the previous claim. The old bridge was narrow and steep. _______, the new bridge is wide and nearly level.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n第二句可能是在說明一個論點、挑戰一種預期、指出一個結果，或引入一個由前一主張延伸而來的相關發展。舊橋狹窄且陡峭。_______，新橋寬闊且幾乎平坦。", "opts": {"A": "In other words,", "B": "By contrast,", "C": "Consequently,", "D": "For instance,"}, "optsZh": {"A": "In other words,（換句話說）", "B": "By contrast,（相較之下）", "C": "Consequently,（因此、結果）", "D": "For instance,（例如）"}, "answer": "B", "expl": "The new bridge differs from the old one.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transitions: signal contrast.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. The northern coast receives heavy rain. _______, the inland plateau is usually dry.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. The northern coast receives heavy rain. _______, the inland plateau is usually dry.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n轉折詞應引導讀者走過這個轉變，而不誇大對比，也不暗示並不存在的因果關係。北部海岸雨量豐沛。_______，內陸高原通常乾燥。", "opts": {"A": "For this reason,", "B": "Similarly,", "C": "In other words,", "D": "By contrast,"}, "optsZh": {"A": "For this reason,（因為這個原因）", "B": "Similarly,（同樣地）", "C": "In other words,（換句話說）", "D": "By contrast,（相較之下）"}, "answer": "D", "expl": "The two regions are contrasted.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Transitions: signal an increasing trend.", "vocab": false, "body": "Researchers Helena Mihaljevic-Brandt, Lucia Santamaria, and Marco Tullney report that while <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematician\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematician\" data-pos=\"n.\" data-en=\"an expert in mathematics\" data-zh=\"數學家\">mathematicians<\/a> may have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> worked alone, evidence points to a shift in the opposite direction. _______ mathematicians are choosing to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaborate\" target=\"_blank\" rel=\"noopener\" data-w=\"collaborate\" data-pos=\"v.\" data-en=\"to work together with others on a project\" data-zh=\"合作\">collaborate<\/a> with their peers - a trend illustrated by a rise in the number of mathematics <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publication\" target=\"_blank\" rel=\"noopener\" data-w=\"publication\" data-pos=\"n.\" data-en=\"a book, magazine, or article that is printed; the act of publishing\" data-zh=\"出版品；發表\">publications<\/a> credited to multiple authors.", "bodyPlain": "Researchers Helena Mihaljevic-Brandt, Lucia Santamaria, and Marco Tullney report that while mathematicians may have traditionally worked alone, evidence points to a shift in the opposite direction. _______ mathematicians are choosing to collaborate with their peers - a trend illustrated by a rise in the number of mathematics publications credited to multiple authors.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "研究人員 Helena Mihaljevic-Brandt、Lucia Santamaria 與 Marco Tullney 指出，雖然數學家傳統上可能獨自工作，但證據顯示趨勢正朝相反方向轉變。_______ 數學家選擇與同行合作──這個趨勢由多位作者共同掛名的數學論文數量上升所顯示。", "opts": {"A": "Similarly,", "B": "For this reason,", "C": "Furthermore,", "D": "Increasingly,"}, "optsZh": {"A": "Similarly,（同樣地）", "B": "For this reason,（因為這個原因）", "C": "Furthermore,（此外）", "D": "Increasingly,（越來越多地）"}, "answer": "D", "expl": "The text describes a shift toward collaboration shown by a rise in multi-author papers; 'Increasingly' signals this growing trend.", "explZh": "文中描述一種趨向合作的轉變，以多作者論文增加為證；「Increasingly」表示這個漸增的趨勢。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Transitions: signal an increasing trend.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. For decades, few journals accepted collaborative submissions in this field. _______, multi-author papers are becoming common.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The relationship between the sentences may involve an example, contrast, consequence, continuation, or shift in emphasis, and the transition must make that relationship explicit. For decades, few journals accepted collaborative submissions in this field. _______, multi-author papers are becoming common.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n句子之間的關係可能涉及舉例、對比、結果、延續或重點的轉移，而轉折詞必須明確表達這種關係。數十年來，這個領域很少有期刊接受合作投稿。_______，多作者論文正變得普遍。", "opts": {"A": "Similarly,", "B": "For this reason,", "C": "Increasingly,", "D": "Nevertheless,"}, "optsZh": {"A": "Similarly,（同樣地）", "B": "For this reason,（因為這個原因）", "C": "Increasingly,（越來越多地）", "D": "Nevertheless,（儘管如此）"}, "answer": "C", "expl": "The transition signals a growing trend.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Transitions: signal an increasing trend.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. Historians once relied mainly on printed archives. _______, they are using digital databases to compare thousands of records.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The sentence after the blank must be read in relation to the sentence before it, especially when the second sentence narrows, qualifies, or extends the first. Historians once relied mainly on printed archives. _______, they are using digital databases to compare thousands of records.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n空格後的句子必須與前一句連著讀，尤其當第二句縮小、限定或延伸了第一句時。歷史學家過去主要依賴印刷檔案。_______，他們使用數位資料庫來比較數千份紀錄。", "opts": {"A": "By contrast,", "B": "For example,", "C": "In other words,", "D": "Increasingly,"}, "optsZh": {"A": "By contrast,（相較之下）", "B": "For example,（例如）", "C": "In other words,（換句話說）", "D": "Increasingly,（越來越多地）"}, "answer": "D", "expl": "The sentence describes a developing shift.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Transitions: signal an increasing trend.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Early climate models were run by small teams. _______, large international groups are sharing data and code.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Early climate models were run by small teams. _______, large international groups are sharing data and code.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n早期的氣候模型是由小團隊執行的。_______，大型國際團隊正在共享資料與程式碼。", "opts": {"A": "Consequently,", "B": "Similarly,", "C": "Increasingly,", "D": "For instance,"}, "optsZh": {"A": "Consequently,（因此、結果）", "B": "Similarly,（同樣地）", "C": "Increasingly,（越來越多地）", "D": "For instance,（例如）"}, "answer": "C", "expl": "The trend is toward more collaboration.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Transitions: signal an increasing trend.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The second sentence may illustrate a point, challenge an expectation, identify a result, or introduce a related development that follows from the previous claim. Museums <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> displayed finished objects. _______, they are showing sketches and prototypes to reveal artists&#x27; processes.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The second sentence may illustrate a point, challenge an expectation, identify a result, or introduce a related development that follows from the previous claim. Museums traditionally displayed finished objects. _______, they are showing sketches and prototypes to reveal artists' processes.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n第二句可能是在說明一個論點、挑戰一種預期、指出一個結果，或引入一個由前一主張延伸而來的相關發展。博物館傳統上展示完成的作品。_______，它們展出草圖與原型，以揭示藝術家的創作過程。", "opts": {"A": "Increasingly,", "B": "However,", "C": "In other words,", "D": "Accordingly,"}, "optsZh": {"A": "Increasingly,（越來越多地）", "B": "However,（然而）", "C": "In other words,（換句話說）", "D": "Accordingly,（因此、據此）"}, "answer": "A", "expl": "The transition signals a recent growing practice.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Transitions: signal an increasing trend.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. Publishers once issued most textbooks only in print. _______, they offer interactive digital versions.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The transition should guide the reader through that movement without exaggerating the contrast or implying a causal link that is not present. Publishers once issued most textbooks only in print. _______, they offer interactive digital versions.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n轉折詞應引導讀者走過這個轉變，而不誇大對比，也不暗示並不存在的因果關係。出版商過去大多只以紙本發行教科書。_______，他們提供互動式數位版本。", "opts": {"A": "Similarly,", "B": "Increasingly,", "C": "For this reason,", "D": "Secondly,"}, "optsZh": {"A": "Similarly,（同樣地）", "B": "Increasingly,（越來越多地）", "C": "For this reason,（因為這個原因）", "D": "Secondly,（其次）"}, "answer": "B", "expl": "The sentence marks an increasing change.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: synthesize a study and its findings.", "vocab": false, "body": "While researching a topic, a student has taken notes about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pterosaur\" target=\"_blank\" rel=\"noopener\" data-w=\"pterosaur\" data-pos=\"n.\" data-en=\"a flying reptile that lived in the time of dinosaurs\" data-zh=\"翼龍\">pterosaurs<\/a> and a 2021 study by Anusuya Chinsamy-Turan. The notes say she analyzed pterosaur jawbone fragments from the Sahara Desert, used advanced microscope techniques, found few growth lines relative to fully grown pterosaurs, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> the bones belonged to juveniles.<br><br>The student wants to present the study and its findings. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses relevant information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken notes about pterosaurs and a 2021 study by Anusuya Chinsamy-Turan. The notes say she analyzed pterosaur jawbone fragments from the Sahara Desert, used advanced microscope techniques, found few growth lines relative to fully grown pterosaurs, and concluded the bones belonged to juveniles.\n\nThe student wants to present the study and its findings. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "一名學生在研究某個主題時，針對翼龍以及 Anusuya Chinsamy-Turan 在 2021 年的一項研究做了筆記。筆記指出她分析了來自撒哈拉沙漠的翼龍顎骨碎片，使用了先進的顯微鏡技術，發現其生長線相較於成年翼龍較少，並得出這些骨頭屬於幼年個體的結論。\n學生想要介紹這項研究及其發現。哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "In 2021, Chinsamy-Turan studied pterosaur jawbones and was initially unsure if the bones belonged to juveniles or adults.", "B": "Pterosaur jawbones located in the Sahara Desert were the focus of a 2021 study.", "C": "In a 2021 study, Chinsamy-Turan used advanced microscope techniques to analyze the jawbones of pterosaurs, flying reptiles that existed millions of years ago.", "D": "In a 2021 study, Chinsamy-Turan determined that pterosaur jawbones located in the Sahara Desert had few growth lines relative to the bones of fully grown pterosaurs and thus belonged to juveniles."}, "optsZh": {"A": "2021 年，Chinsamy-Turan 研究了翼龍顎骨，起初不確定這些骨頭屬於幼年還是成年個體。", "B": "位於撒哈拉沙漠的翼龍顎骨是一項 2021 年研究的焦點。", "C": "在一項 2021 年的研究中，Chinsamy-Turan 使用先進的顯微鏡技術分析翼龍的顎骨，翼龍是數百萬年前存在的飛行爬行動物。", "D": "在一項 2021 年的研究中，Chinsamy-Turan 判定位於撒哈拉沙漠的翼龍顎骨相較於成年翼龍的骨頭生長線較少，因此屬於幼年個體。"}, "answer": "D", "expl": "Choice D presents both the study (2021, Chinsamy-Turan, Sahara jawbones) and its finding (few growth lines, so juveniles).", "explZh": "選項 D 同時呈現研究（2021 年、Chinsamy-Turan、撒哈拉顎骨）與發現（生長線少，因此是幼年個體）。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: synthesize a study and its findings.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student has gathered notes on a topic and now needs to use them for a specific writing purpose. The notes include extra details, so the response must select only the information that advances the stated goal and combine it accurately in one clear sentence. Notes: A 2022 study tracked bees in city gardens; researchers counted visits to native and nonnative flowers; bees visited native flowers twice as often; researchers recommended planting native species. Goal: present the study and its finding. Which sentence best accomplishes the goal?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student has gathered notes on a topic and now needs to use them for a specific writing purpose. The notes include extra details, so the response must select only the information that advances the stated goal and combine it accurately in one clear sentence. Notes: A 2022 study tracked bees in city gardens; researchers counted visits to native and nonnative flowers; bees visited native flowers twice as often; researchers recommended planting native species. Goal: present the study and its finding. Which sentence best accomplishes the goal?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n一名學生已針對某主題收集了筆記，現在需要為特定的寫作目的運用這些筆記。筆記包含額外的細節，因此回答必須只選取有助於達成既定目標的資訊，並將其準確地結合成一個清楚的句子。筆記：一項 2022 年的研究追蹤了城市花園中的蜜蜂；研究人員計算了蜜蜂造訪本土與非本土花卉的次數；蜜蜂造訪本土花卉的頻率是非本土花卉的兩倍；研究人員建議種植本土物種。目標：介紹這項研究及其發現。哪個句子最能達成這個目標？", "opts": {"A": "Some gardens include native plants.", "B": "Researchers counted flowers in city gardens.", "C": "A 2022 study found that city-garden bees visited native flowers twice as often as nonnative flowers.", "D": "Bees are important pollinators."}, "optsZh": {"A": "有些花園包含本土植物。", "B": "研究人員計算了城市花園中的花朵數量。", "C": "一項 2022 年的研究發現，城市花園中的蜜蜂造訪本土花卉的頻率是非本土花卉的兩倍。", "D": "蜜蜂是重要的傳粉者。"}, "answer": "C", "expl": "It states the study and the finding.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: synthesize a study and its findings.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. A strong response <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthesize\" target=\"_blank\" rel=\"noopener\" data-w=\"synthesize\" data-pos=\"v.\" data-en=\"to combine different ideas or things into a whole\" data-zh=\"綜合；合成\">synthesizes<\/a> the relevant details rather than copying unrelated facts, and it keeps the emphasis aligned with the purpose named in the prompt. Notes: Dr. Elena Park studied lake sediment; she measured pollen layers; older layers had little pine pollen; newer layers had abundant pine pollen; she concluded the region became cooler and wetter. Goal: present the study and finding. Which sentence best accomplishes the goal?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A strong response synthesizes the relevant details rather than copying unrelated facts, and it keeps the emphasis aligned with the purpose named in the prompt. Notes: Dr. Elena Park studied lake sediment; she measured pollen layers; older layers had little pine pollen; newer layers had abundant pine pollen; she concluded the region became cooler and wetter. Goal: present the study and finding. Which sentence best accomplishes the goal?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n有力的回答會綜合相關的細節，而不是照搬不相關的事實，並且使重點與題目所指明的目的保持一致。筆記：Elena Park 博士研究湖泊沉積物；她測量了花粉層；較老的層幾乎沒有松樹花粉；較新的層有大量松樹花粉；她得出該地區變得更冷、更濕的結論。目標：介紹這項研究與發現。哪個句子最能達成這個目標？", "opts": {"A": "Lake sediment can contain pollen.", "B": "Dr. Park studied lake sediment and concluded from pollen layers that the region became cooler and wetter.", "C": "Dr. Park is a scientist.", "D": "Pine pollen appeared in some layers."}, "optsZh": {"A": "湖泊沉積物可能含有花粉。", "B": "Park 博士研究湖泊沉積物，並從花粉層得出該地區變得更冷、更濕的結論。", "C": "Park 博士是一位科學家。", "D": "某些層中出現了松樹花粉。"}, "answer": "B", "expl": "It includes both method and finding.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: synthesize a study and its findings.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Some information may be accurate but irrelevant, while the useful details must be arranged so that the final sentence directly accomplishes the requested rhetorical goal. Notes: A historian analyzed shipping logs; the logs listed cargo, dates, and crew names; she found that small ports traded more widely than previously thought. Goal: present the research and finding. Which sentence best accomplishes the goal?", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Some information may be accurate but irrelevant, while the useful details must be arranged so that the final sentence directly accomplishes the requested rhetorical goal. Notes: A historian analyzed shipping logs; the logs listed cargo, dates, and crew names; she found that small ports traded more widely than previously thought. Goal: present the research and finding. Which sentence best accomplishes the goal?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n有些資訊可能準確卻不相關，而有用的細節必須加以安排，使最後的句子直接達成所要求的修辭目標。筆記：一位歷史學家分析了航運日誌；日誌列出了貨物、日期與船員姓名；她發現小型港口的貿易範圍比先前所認為的更廣。目標：介紹這項研究與發現。哪個句子最能達成這個目標？", "opts": {"A": "By analyzing shipping logs, the historian found that small ports traded more widely than scholars had believed.", "B": "Shipping logs often list cargo.", "C": "Small ports existed near large ports.", "D": "The historian studied documents."}, "optsZh": {"A": "藉由分析航運日誌，這位歷史學家發現小型港口的貿易範圍比學者過去所認為的更廣。", "B": "航運日誌通常會列出貨物。", "C": "大型港口附近存在著小型港口。", "D": "這位歷史學家研究了文件。"}, "answer": "A", "expl": "It joins source, method, and conclusion.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: synthesize a study and its findings.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Several possible responses could be factually consistent with the notes, but only one uses the notes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strategically\" target=\"_blank\" rel=\"noopener\" data-w=\"strategically\" data-pos=\"adv.\" data-en=\"in a way that is carefully planned to achieve a goal\" data-zh=\"策略性地\">strategically<\/a>. The sentence should emphasize the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a>, contrast, similarity, chronology, or achievement that the student has been asked to highlight. Notes: A 2021 study examined ceramic fragments; chemical tests showed traces of cacao; researchers concluded the cups were used for chocolate drinks. Goal: present the study and finding. Which sentence best accomplishes the goal?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Several possible responses could be factually consistent with the notes, but only one uses the notes strategically. The sentence should emphasize the relationship, contrast, similarity, chronology, or achievement that the student has been asked to highlight. Notes: A 2021 study examined ceramic fragments; chemical tests showed traces of cacao; researchers concluded the cups were used for chocolate drinks. Goal: present the study and finding. Which sentence best accomplishes the goal?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n有幾種可能的回答在事實上都與筆記一致，但只有一種能策略性地運用筆記。句子應強調學生被要求凸顯的關係、對比、相似、時間順序或成就。筆記：一項 2021 年的研究檢驗了陶瓷碎片；化學檢測顯示有可可的痕跡；研究人員得出這些杯子曾用於盛裝巧克力飲品的結論。目標：介紹這項研究與發現。哪個句子最能達成這個目標？", "opts": {"A": "Ceramic fragments can be tested by scientists.", "B": "The study happened in 2021.", "C": "Cacao was used in some drinks.", "D": "Chemical tests in a 2021 study showed cacao traces on ceramic fragments, leading researchers to conclude that the cups held chocolate drinks."}, "optsZh": {"A": "陶瓷碎片可以由科學家檢測。", "B": "這項研究發生在 2021 年。", "C": "可可曾用於某些飲品中。", "D": "一項 2021 年研究中的化學檢測顯示陶瓷碎片上有可可的痕跡，使研究人員得出這些杯子曾盛裝巧克力飲品的結論。"}, "answer": "D", "expl": "It includes the evidence and conclusion.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: synthesize a study and its findings.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The response must remain concise and accurate while selecting the details that best serve the student&#x27;s stated writing objective. Notes: Marine biologists tagged young sharks; tags recorded long-distance travel; the sharks returned to the same nursery each spring; researchers concluded the species has strong site fidelity. Goal: present the study and finding. Which sentence best accomplishes the goal?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The response must remain concise and accurate while selecting the details that best serve the student's stated writing objective. Notes: Marine biologists tagged young sharks; tags recorded long-distance travel; the sharks returned to the same nursery each spring; researchers concluded the species has strong site fidelity. Goal: present the study and finding. Which sentence best accomplishes the goal?", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n回答必須保持簡潔準確，同時選取最能達成學生既定寫作目標的細節。筆記：海洋生物學家為幼鯊裝上標籤；標籤記錄了長距離的移動；鯊魚每年春天都回到同一個育幼場；研究人員得出該物種具有強烈棲地忠誠性的結論。目標：介紹這項研究與發現。哪個句子最能達成這個目標？", "opts": {"A": "Marine biologists use tags to track sharks.", "B": "The nursery was visited in spring.", "C": "Young sharks swim long distances.", "D": "After tagging young sharks, marine biologists found that the sharks returned to the same nursery each spring, showing strong site fidelity."}, "optsZh": {"A": "海洋生物學家使用標籤追蹤鯊魚。", "B": "育幼場是在春天被造訪的。", "C": "幼鯊會游很長的距離。", "D": "在為幼鯊裝上標籤後，海洋生物學家發現這些鯊魚每年春天都回到同一個育幼場，顯示出強烈的棲地忠誠性。"}, "answer": "D", "expl": "It presents the study and its finding.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: compare two people's contributions.", "vocab": false, "body": "While researching a topic, a student has taken notes about African American women in the Civil Rights Movement and the 1963 March on Washington. The notes say Anna Hedgeman helped organize the march and worked behind the scenes to make sure a woman was included in the lineup of speakers. Daisy Bates, a journalist and school <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=desegregation\" target=\"_blank\" rel=\"noopener\" data-w=\"desegregation\" data-pos=\"n.\" data-en=\"the ending of the separation of people by race\" data-zh=\"廢除種族隔離\">desegregation<\/a> advocate, was the sole woman to speak, delivering a brief but memorable address.<br><br>The student wants to compare the two women&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contribution\" target=\"_blank\" rel=\"noopener\" data-w=\"contribution\" data-pos=\"n.\" data-en=\"something you give or do to help achieve something\" data-zh=\"貢獻\">contributions<\/a> to the March on Washington. Which choice most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> uses relevant information from the notes to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplish<\/a> this goal?", "bodyPlain": "While researching a topic, a student has taken notes about African American women in the Civil Rights Movement and the 1963 March on Washington. The notes say Anna Hedgeman helped organize the march and worked behind the scenes to make sure a woman was included in the lineup of speakers. Daisy Bates, a journalist and school desegregation advocate, was the sole woman to speak, delivering a brief but memorable address.\n\nThe student wants to compare the two women's contributions to the March on Washington. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stem": "", "stemZh": "", "bodyZh": "一名學生在研究某個主題時，針對民權運動中的非裔美國女性以及 1963 年的華盛頓大遊行做了筆記。筆記指出 Anna Hedgeman 協助籌辦這場遊行，並在幕後努力確保演講者名單中包含一位女性。記者兼學校廢除種族隔離倡議者 Daisy Bates 是唯一發言的女性，她發表了一場簡短卻令人難忘的演說。\n學生想要比較這兩位女性對華盛頓大遊行的貢獻。哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "opts": {"A": "Hedgeman and Bates contributed to the march in different ways; Bates, for example, delivered a brief but memorable address.", "B": "Hedgeman worked in politics and helped organize the march, while Bates was a journalist and school desegregation advocate.", "C": "Although Hedgeman worked behind the scenes to make sure a woman speaker was included, Bates was the sole woman to speak at the march.", "D": "Many African American women, including Bates and Hedgeman, fought for civil rights, but only one spoke at the march."}, "optsZh": {"A": "Hedgeman 與 Bates 以不同的方式對遊行做出貢獻；例如，Bates 發表了一場簡短卻令人難忘的演說。", "B": "Hedgeman 從事政治工作並協助籌辦遊行，而 Bates 則是一位記者兼學校廢除種族隔離的倡議者。", "C": "雖然 Hedgeman 在幕後努力確保有一位女性演講者，但 Bates 是遊行中唯一發言的女性。", "D": "許多非裔美國女性，包括 Bates 與 Hedgeman，都為民權奮鬥，但只有一人在遊行中發言。"}, "answer": "C", "expl": "Choice C compares the two women's roles at the march—Hedgeman behind the scenes, Bates as the sole woman speaker.", "explZh": "選項 C 比較了兩位女性在遊行中的角色──Hedgeman 在幕後，Bates 是唯一的女性演講者。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: compare two people's contributions.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evi
