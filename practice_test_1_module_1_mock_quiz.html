<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 1, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 1, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnDlDoc">⬇ Download wrong (Word 錯題講義)</button>
      <label class="scope">下載範圍 <select id="dlScope"><option value="session">本次作答 This attempt</option><option value="all">全部錯題本 All saved</option></select></label>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: choose a precise verb for an uncertain prediction.", "vocab": true, "body": "Former <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronaut\" target=\"_blank\" rel=\"noopener\" data-w=\"astronaut\" data-pos=\"n.\" data-en=\"a person trained to travel into space\" data-zh=\"太空人\">astronaut<\/a> Ellen Ochoa says that although she doesn&#x27;t have a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=definite\" target=\"_blank\" rel=\"noopener\" data-w=\"definite\" data-pos=\"adj.\" data-en=\"clear and certain; fixed\" data-zh=\"明確的；確定的\">definite<\/a> idea of when it might happen, she _______ that humans will someday need to be able to live in other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a> than those found on Earth. This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conjecture\" target=\"_blank\" rel=\"noopener\" data-w=\"conjecture\" data-pos=\"n.\" data-en=\"a guess or opinion based on incomplete information\" data-zh=\"推測；猜想\">conjecture<\/a> informs her interest in future research missions to the moon.", "bodyPlain": "Former astronaut Ellen Ochoa says that although she doesn't have a definite idea of when it might happen, she _______ that humans will someday need to be able to live in other environments than those found on Earth. This conjecture informs her interest in future research missions to the moon.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "前太空人 Ellen Ochoa 表示，雖然她不確定何時會發生，但她 _______ 人類終有一天必須能夠在地球以外的環境中生活。這個推測促使她對未來的月球研究任務產生興趣。", "opts": {"A": "demands", "B": "speculates", "C": "doubts", "D": "establishes"}, "optsZh": {"A": "demands（要求）", "B": "speculates（推測）", "C": "doubts（懷疑）", "D": "establishes（確立、證實）"}, "answer": "B", "expl": "Ochoa has no definite idea of when it will happen, and the next sentence calls it a 'conjecture'; 'speculates' means to form an opinion without firm evidence.", "explZh": "Ochoa 不確定何時會發生，下一句又稱之為「推測（conjecture）」，因此「speculates」（推測）最符合語意。", "defs": {"A": {"pos": "v.", "en": "asks for something forcefully, as if it is a right", "zh": "要求；強烈請求", "word": "demands"}, "B": {"pos": "v.", "en": "forms an opinion or guess without firm evidence", "zh": "推測；猜想", "word": "speculates"}, "C": {"pos": "v.", "en": "feels uncertain about something; does not believe", "zh": "懷疑；不相信", "word": "doubts"}, "D": {"pos": "v.", "en": "proves something to be true; sets something up firmly", "zh": "確立；證實；建立", "word": "establishes"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: choose a precise verb for an uncertain prediction.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Marine ecologist Priya Nair cannot yet prove that the reef will recover, but she _______ that cooler currents may give the coral a brief reprieve.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Marine ecologist Priya Nair cannot yet prove that the reef will recover, but she _______ that cooler currents may give the coral a brief reprieve.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n海洋生態學家 Priya Nair 尚無法證明珊瑚礁會復原，但她 _______ 較冷的洋流可能讓珊瑚獲得短暫的喘息。", "opts": {"A": "hypothesizes", "B": "mandates", "C": "refutes", "D": "codifies"}, "optsZh": {"A": "hypothesizes（提出假設）", "B": "mandates（強制規定）", "C": "refutes（駁斥、證明…錯誤）", "D": "codifies（編纂成法典、系統化）"}, "answer": "A", "expl": "The clue 'cannot yet prove' points to a tentative scientific claim.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "suggests a possible explanation that has not yet been proven", "zh": "提出假設", "word": "hypothesizes"}, "B": {"pos": "v.", "en": "officially orders or requires something", "zh": "強制規定；授權", "word": "mandates"}, "C": {"pos": "v.", "en": "proves that a statement or idea is wrong", "zh": "駁斥；證明…錯誤", "word": "refutes"}, "D": {"pos": "v.", "en": "arranges laws or rules into a formal system", "zh": "編纂成法典；使系統化", "word": "codifies"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: choose a precise verb for an uncertain prediction.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The historian admits that the missing letters leave gaps in the record, so she _______ that the alliance began earlier than scholars once believed.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The historian admits that the missing letters leave gaps in the record, so she _______ that the alliance began earlier than scholars once believed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n這位歷史學家承認遺失的信件使紀錄出現缺口，因此她 _______ 這個聯盟的形成時間比學者過去所認為的更早。", "opts": {"A": "verifies", "B": "conjectures", "C": "nullifies", "D": "commands"}, "optsZh": {"A": "verifies（證實）", "B": "conjectures（推測、猜想）", "C": "nullifies（使無效）", "D": "commands（命令）"}, "answer": "B", "expl": "Incomplete evidence calls for a verb meaning proposes as a possibility.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "checks or proves that something is true or accurate", "zh": "證實；核實", "word": "verifies"}, "B": {"pos": "v.", "en": "forms an opinion or guess without having full evidence", "zh": "推測；猜想", "word": "conjectures"}, "C": {"pos": "v.", "en": "makes something legally or officially have no effect", "zh": "使無效；取消", "word": "nullifies"}, "D": {"pos": "v.", "en": "gives an order; demands with authority", "zh": "命令；指揮", "word": "commands"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: choose a precise verb for an uncertain prediction.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Because the telescope data are preliminary, the astronomer merely _______ that the distant object may be a young galaxy.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Because the telescope data are preliminary, the astronomer merely _______ that the distant object may be a young galaxy.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n由於望遠鏡的資料只是初步結果，這位天文學家僅 _______ 那個遙遠的天體可能是一個年輕的星系。", "opts": {"A": "denounces", "B": "posits", "C": "enforces", "D": "solidifies"}, "optsZh": {"A": "denounces（公開譴責）", "B": "posits（提出、假定）", "C": "enforces（強制執行）", "D": "solidifies（鞏固、使固化）"}, "answer": "B", "expl": "Preliminary data support a proposed explanation, not certainty.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "publicly criticizes someone or something strongly", "zh": "公開譴責；抨擊", "word": "denounces"}, "B": {"pos": "v.", "en": "suggests something as a fact or basis for argument", "zh": "提出；假定", "word": "posits"}, "C": {"pos": "v.", "en": "makes people obey a law or rule", "zh": "強制執行；實施", "word": "enforces"}, "D": {"pos": "v.", "en": "makes something stronger, firmer, or more certain", "zh": "鞏固；使固化；確立", "word": "solidifies"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: choose a precise verb for an uncertain prediction.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The sentence around the blank supplies several clues about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=duration\" target=\"_blank\" rel=\"noopener\" data-w=\"duration\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"持續時間\">duration<\/a>, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The engineer has no exact timeline, but she _______ that floating homes may become common in flood-prone cities.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The sentence around the blank supplies several clues about duration, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The engineer has no exact timeline, but she _______ that floating homes may become common in flood-prone cities.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n空格周圍的句子提供了關於時間長短、證據、範圍或態度的多項線索，因此所需的字詞必須符合整篇文章的邏輯。這位工程師沒有確切的時間表，但她 _______ 漂浮式住宅可能會在易受洪患的城市變得普遍。", "opts": {"A": "eradicates", "B": "obligates", "C": "dismisses", "D": "surmises"}, "optsZh": {"A": "eradicates（根除、消滅）", "B": "obligates（使負有義務）", "C": "dismisses（駁斥、不予理會）", "D": "surmises（推測、猜想）"}, "answer": "D", "expl": "No exact timeline signals an informed but uncertain inference.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "destroys or gets rid of something completely", "zh": "根除；消滅", "word": "eradicates"}, "B": {"pos": "v.", "en": "makes someone legally or morally required to do something", "zh": "使負有義務；迫使", "word": "obligates"}, "C": {"pos": "v.", "en": "refuses to consider something seriously", "zh": "駁斥；不予理會", "word": "dismisses"}, "D": {"pos": "v.", "en": "guesses something is true without having proof", "zh": "推測；猜想", "word": "surmises"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: choose a precise verb for an uncertain prediction.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Although the experiment has not been replicated, the team _______ that the protein may slow cellular aging.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Although the experiment has not been replicated, the team _______ that the protein may slow cellular aging.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n雖然這項實驗尚未被重複驗證，研究團隊 _______ 這種蛋白質可能減緩細胞老化。", "opts": {"A": "conceals", "B": "forbids", "C": "theorizes", "D": "guarantees"}, "optsZh": {"A": "conceals（隱藏）", "B": "forbids（禁止）", "C": "theorizes（提出理論）", "D": "guarantees（保證）"}, "answer": "C", "expl": "A tentative scientific possibility is best expressed by 'theorizes'.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "hides something or keeps it secret", "zh": "隱藏；掩蓋", "word": "conceals"}, "B": {"pos": "v.", "en": "orders that something must not be done", "zh": "禁止", "word": "forbids"}, "C": {"pos": "v.", "en": "suggests a theory or explanation that has not been proven", "zh": "提出理論；推論", "word": "theorizes"}, "D": {"pos": "v.", "en": "promises that something will certainly happen or be true", "zh": "保證；擔保", "word": "guarantees"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: choose an adjective matching sustained effort.", "vocab": true, "body": "Beginning in the 1950s, Navajo Nation <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=legislator\" target=\"_blank\" rel=\"noopener\" data-w=\"legislator\" data-pos=\"n.\" data-en=\"a member of a group that makes laws\" data-zh=\"議員；立法者\">legislator<\/a> Annie Dodge Wauneka <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continuously\" target=\"_blank\" rel=\"noopener\" data-w=\"continuously\" data-pos=\"adv.\" data-en=\"without stopping or interruption\" data-zh=\"持續不斷地\">continuously<\/a> worked to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=promote\" target=\"_blank\" rel=\"noopener\" data-w=\"promote\" data-pos=\"v.\" data-en=\"to encourage or support something so that it develops\" data-zh=\"推動；促進\">promote<\/a> public health; this _______ effort involved traveling throughout the vast Navajo homeland and writing a medical dictionary for speakers of Dine bizaad, the Navajo language.", "bodyPlain": "Beginning in the 1950s, Navajo Nation legislator Annie Dodge Wauneka continuously worked to promote public health; this _______ effort involved traveling throughout the vast Navajo homeland and writing a medical dictionary for speakers of Dine bizaad, the Navajo language.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "自 1950 年代起，納瓦荷族議員 Annie Dodge Wauneka 持續不斷地推動公共衛生；這項 _______ 的努力包括走遍廣大的納瓦荷家園，並為使用納瓦荷語（Diné bizaad）的人編寫一本醫學字典。", "opts": {"A": "impartial", "B": "offhand", "C": "persistent", "D": "mandatory"}, "optsZh": {"A": "impartial（公正的、不偏袒的）", "B": "offhand（隨便的、漫不經心的）", "C": "persistent（堅持不懈的、持續的）", "D": "mandatory（強制的、義務的）"}, "answer": "C", "expl": "'Continuously worked' signals an effort that kept going over many years, which is what 'persistent' means.", "explZh": "「continuously worked」表示多年持續不斷的努力，與「persistent」（堅持不懈的）相符。", "defs": {"A": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}, "B": {"pos": "adj.", "en": "done without much thought or care; casual", "zh": "隨便的；漫不經心的", "word": "offhand"}, "C": {"pos": "adj.", "en": "continuing firmly despite difficulty; lasting a long time", "zh": "堅持不懈的；持續的", "word": "persistent"}, "D": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: choose an adjective matching sustained effort.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For twenty years, the archivist made weekly visits to rural libraries; this _______ effort preserved thousands of local newspapers.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For twenty years, the archivist made weekly visits to rural libraries; this _______ effort preserved thousands of local newspapers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n二十年來，這位檔案管理員每週造訪鄉村圖書館；這項 _______ 的努力保存了數千份地方報紙。", "opts": {"A": "sustained", "B": "erratic", "C": "incidental", "D": "impartial"}, "optsZh": {"A": "sustained（持續的）", "B": "erratic（不穩定的、無規律的）", "C": "incidental（附帶的、偶然的）", "D": "impartial（公正的、不偏袒的）"}, "answer": "A", "expl": "Weekly visits over twenty years show sustained effort.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "continuing for a long time without stopping", "zh": "持續的；持久的", "word": "sustained"}, "B": {"pos": "adj.", "en": "not regular or predictable; changing often", "zh": "不穩定的；無規律的", "word": "erratic"}, "C": {"pos": "adj.", "en": "happening as a minor part or result of something else; not essential", "zh": "附帶的；偶然的；次要的", "word": "incidental"}, "D": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: choose an adjective matching sustained effort.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The mayor&#x27;s _______ campaign to improve bus access continued through three <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=administration\" target=\"_blank\" rel=\"noopener\" data-w=\"administration\" data-pos=\"n.\" data-en=\"the government or management of a country or organization during a period\" data-zh=\"政府；行政當局\">administrations<\/a>.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The mayor's _______ campaign to improve bus access continued through three administrations.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n市長改善公車可及性的 _______ 行動歷經三任政府持續推行。", "opts": {"A": "offhand", "B": "ambiguous", "C": "ongoing", "D": "mandatory"}, "optsZh": {"A": "offhand（隨便的、漫不經心的）", "B": "ambiguous（模糊的、含糊不清的）", "C": "ongoing（持續進行的）", "D": "mandatory（強制的、義務的）"}, "answer": "C", "expl": "The campaign continued across multiple administrations.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "done without much thought or care; casual", "zh": "隨便的；漫不經心的", "word": "offhand"}, "B": {"pos": "adj.", "en": "having more than one possible meaning; unclear", "zh": "模糊的；含糊不清的", "word": "ambiguous"}, "C": {"pos": "adj.", "en": "continuing to exist or develop", "zh": "持續進行的；進行中的", "word": "ongoing"}, "D": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: choose an adjective matching sustained effort.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Despite limited funding, the volunteers&#x27; _______ work kept the community clinic open.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Despite limited funding, the volunteers' _______ work kept the community clinic open.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n儘管經費有限，志工們 _______ 的工作讓社區診所得以持續營運。", "opts": {"A": "unflagging", "B": "inadvertent", "C": "peripheral", "D": "skeptical"}, "optsZh": {"A": "unflagging（不懈的、不衰的）", "B": "inadvertent（無意的、不經意的）", "C": "peripheral（邊緣的、次要的）", "D": "skeptical（懷疑的）"}, "answer": "A", "expl": "The contrast with limited funding emphasizes effort that did not weaken.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "never becoming weaker or tired; tireless", "zh": "不懈的；不衰的；堅持不斷的", "word": "unflagging"}, "B": {"pos": "adj.", "en": "not intended; done by accident", "zh": "無意的；不經意的", "word": "inadvertent"}, "C": {"pos": "adj.", "en": "of minor importance; at the edge rather than the center", "zh": "邊緣的；次要的", "word": "peripheral"}, "D": {"pos": "adj.", "en": "doubting that something is true or useful", "zh": "懷疑的", "word": "skeptical"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: choose an adjective matching sustained effort.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The sentence around the blank supplies several clues about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=duration\" target=\"_blank\" rel=\"noopener\" data-w=\"duration\" data-pos=\"n.\" data-en=\"the length of time something lasts\" data-zh=\"持續時間\">duration<\/a>, evidence, scope, or attitude, so the needed word must fit the logic of the whole passage. The botanist&#x27;s _______ monitoring of the seedlings allowed her to notice ct\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A _______ effort by local teachers eventually led to a bilingual reading program.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A _______ effort by local teachers eventually led to a bilingual reading program.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n地方教師們 _______ 的努力最終促成了一項雙語閱讀計畫。", "opts": {"A": "haphazard", "B": "concerted", "C": "neutral", "D": "temporary"}, "optsZh": {"A": "haphazard（雜亂無章的、隨意的）", "B": "concerted（齊心協力的、協同的）", "C": "neutral（中立的）", "D": "temporary（暫時的）"}, "answer": "B", "expl": "A concerted effort is coordinated and determined over time.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "lacking order or planning; random", "zh": "雜亂無章的；隨意的", "word": "haphazard"}, "B": {"pos": "adj.", "en": "planned or done together by a group with great effort", "zh": "齊心協力的；協同一致的", "word": "concerted"}, "C": {"pos": "adj.", "en": "not supporting either side; not strong or noticeable", "zh": "中立的；中性的", "word": "neutral"}, "D": {"pos": "adj.", "en": "lasting only for a short time", "zh": "暫時的；臨時的", "word": "temporary"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: identify an example that demonstrates a model.", "vocab": true, "body": "Following the principles of community-based <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=participatory\" target=\"_blank\" rel=\"noopener\" data-w=\"participatory\" data-pos=\"adj.\" data-en=\"allowing people to take part\" data-zh=\"參與式的\">participatory<\/a> research, tribal nations and research <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutions<\/a> are equal partners in health studies conducted on reservations. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" targ
