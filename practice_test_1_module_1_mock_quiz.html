been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. The biologist called the wetland &quot;a natural water filter,&quot; _______ that reeds and soil remove pollutants.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The biologist called the wetland \"a natural water filter,\" _______ that reeds and soil remove pollutants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。生物學家稱這片濕地為「天然的濾水器」，_______ 蘆葦與土壤能去除污染物。", "opts": {"A": "explaining", "B": ". Explaining", "C": ": explaining", "D": "; explaining"}, "optsZh": {"A": "explaining（現在分詞，接在逗號後：正確）", "B": ". Explaining（句號＋大寫分詞 → 造成句子殘缺）", "C": ": explaining（冒號＋分詞）", "D": "; explaining（分號＋分詞）"}, "answer": "A", "expl": "The participial phrase adds explanation to the main clause.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: punctuation before a participial phrase.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The historian defined the archive as &quot;a record of ordinary lives,&quot; _______ that receipts and letters can reveal social change.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The historian defined the archive as \"a record of ordinary lives,\" _______ that receipts and letters can reveal social change.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。歷史學家將這座檔案館定義為「平凡生命的紀錄」，_______ 收據與信件能揭示社會變遷。", "opts": {"A": "; arguing", "B": ". Arguing", "C": "arguing", "D": ": arguing"}, "optsZh": {"A": "; arguing（分號＋分詞）", "B": ". Arguing（句號＋大寫分詞 → 造成句子殘缺）", "C": "arguing（現在分詞，非限定動詞）", "D": ": arguing（冒號＋分詞）"}, "answer": "C", "expl": "The -ing phrase modifies the preceding main clause.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: punctuation before a participial phrase.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The engineer described the bridge as &quot;light but resilient,&quot; _______ that its triangular supports <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distribute\" target=\"_blank\" rel=\"noopener\" data-w=\"distribute\" data-pos=\"v.\" data-en=\"to spread or give out over an area or among people\" data-zh=\"分布；分配\">distribute<\/a> weight efficiently.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The engineer described the bridge as \"light but resilient,\" _______ that its triangular supports distribute weight efficiently.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。工程師將這座橋描述為「輕盈卻堅韌」，_______ 它的三角形支撐能有效分散重量。", "opts": {"A": ". Emphasizing", "B": ": emphasizing", "C": "; emphasizing", "D": "emphasizing"}, "optsZh": {"A": ". Emphasizing（句號＋大寫分詞 → 造成句子殘缺）", "B": ": emphasizing（冒號＋分詞）", "C": "; emphasizing（分號＋分詞）", "D": "emphasizing（現在分詞，接在逗號後：正確）"}, "answer": "D", "expl": "A comma plus participial phrase is standard here.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: punctuation before a participial phrase.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The novelist called memory &quot;a room with many doors,&quot; _______ that a single object can open several stories.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The novelist called memory \"a room with many doors,\" _______ that a single object can open several stories.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。小說家稱記憶為「一間有許多門的房間」，_______ 單一物件可以開啟好幾個故事。", "opts": {"A": ". Suggesting", "B": "suggesting", "C": ": suggesting", "D": "; suggesting"}, "optsZh": {"A": ". Suggesting（句號＋大寫分詞 → 造成句子殘缺）", "B": "suggesting（現在分詞，接在逗號後：正確）", "C": ": suggesting（冒號＋分詞）", "D": "; suggesting（分號＋分詞）"}, "answer": "B", "expl": "The participial phrase provides added explanation.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: possessive determiner agreement.", "vocab": false, "body": "British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=announce\" target=\"_blank\" rel=\"noopener\" data-w=\"announce\" data-pos=\"v.\" data-en=\"to make something known publicly\" data-zh=\"宣布\">announcing<\/a> the double helix <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> of DNA, but it is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=misleading\" target=\"_blank\" rel=\"noopener\" data-w=\"misleading\" data-pos=\"adj.\" data-en=\"giving a wrong idea or impression\" data-zh=\"誤導的\">misleading<\/a> to say that Watson and Crick discovered the double helix. _______ findings were based on a famous X-ray image of DNA fibers, &quot;Photo 51,&quot; developed by X-ray <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=crystallographer\" target=\"_blank\" rel=\"noopener\" data-w=\"crystallographer\" data-pos=\"n.\" data-en=\"a scientist who studies the structure of crystals, often using X-rays\" data-zh=\"晶體學家\">crystallographer<\/a> Rosalind Franklin and her graduate student Raymond Gosling.", "bodyPlain": "British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper announcing the double helix structure of DNA, but it is misleading to say that Watson and Crick discovered the double helix. _______ findings were based on a famous X-ray image of DNA fibers, \"Photo 51,\" developed by X-ray crystallographer Rosalind Franklin and her graduate student Raymond Gosling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "英國科學家 James Watson 與 Francis Crick 部分因其 1953 年宣布 DNA 雙螺旋結構的論文而獲得諾貝爾獎，但說 Watson 與 Crick「發現」了雙螺旋是具有誤導性的。_______ 研究結果是基於一張著名的 DNA 纖維 X 光影像「Photo 51」，該影像由 X 光晶體學家 Rosalind Franklin 及其研究生 Raymond Gosling 所拍攝。", "opts": {"A": "They're", "B": "It's", "C": "Their", "D": "Its"}, "optsZh": {"A": "They're（= They are，他們是）", "B": "It's（= It is，它是）", "C": "Their（他們的，複數所有格）", "D": "Its（它的，單數所有格）"}, "answer": "C", "expl": "The blank needs a plural possessive determiner referring to Watson and Crick: 'Their findings'. 'They're' means 'they are'.", "explZh": "空格需要指 Watson 與 Crick 的複數所有格「Their」；「They're」是「they are」的縮寫。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: possessive determiner agreement.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Architects Lina Bo Bardi and Gio Ponti are known for buildings that reflect _______ interest in modern forms and local materials.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Architects Lina Bo Bardi and Gio Ponti are known for buildings that reflect _______ interest in modern forms and local materials.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。建築師 Lina Bo Bardi 與 Gio Ponti 以反映 _______ 對現代形式與在地材料之興趣的建築聞名。", "opts": {"A": "they're", "B": "their", "C": "it's", "D": "its"}, "optsZh": {"A": "they're（= they are，他們是）", "B": "their（他們的，複數所有格）", "C": "it's（= it is，它是）", "D": "its（它的，單數所有格）"}, "answer": "B", "expl": "Two architects require plural possessive 'their'.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English: possessive determiner agreement.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. Researchers Maya Gupta and Daniel Lee published _______ findings in a climate journal.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. Researchers Maya Gupta and Daniel Lee published _______ findings in a climate journal.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。研究人員 Maya Gupta 與 Daniel Lee 在一份氣候期刊上發表了 _______ 研究結果。", "opts": {"A": "their", "B": "they're", "C": "it's", "D": "its"}, "optsZh": {"A": "their（他們的，複數所有格）", "B": "they're（= they are，他們是）", "C": "it's（= it is，它是）", "D": "its（它的，單數所有格）"}, "answer": "A", "expl": "Two researchers require plural possessive 'their'.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English: possessive determiner agreement.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The poets Gabriela Mistral and Pablo Neruda both drew on _______ experiences of Chilean landscapes.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The poets Gabriela Mistral and Pablo Neruda both drew on _______ experiences of Chilean landscapes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。詩人 Gabriela Mistral 與 Pablo Neruda 都汲取了 _______ 對智利風景的體驗。", "opts": {"A": "they're", "B": "its", "C": "their", "D": "it's"}, "optsZh": {"A": "they're（= they are，他們是）", "B": "its（它的，單數所有格）", "C": "their（他們的，複數所有格）", "D": "it's（= it is，它是）"}, "answer": "C", "expl": "The possessive must agree with two poets.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English: possessive determiner agreement.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The directors Ava DuVernay and Chloe Zhao are often praised for _______ visually distinctive storytelling.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The directors Ava DuVernay and Chloe Zhao are often praised for _______ visually distinctive storytelling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。導演 Ava DuVernay 與 Chloé Zhao 常因 _______ 視覺上獨特的敘事而受到讚譽。", "opts": {"A": "its", "B": "they're", "C": "it's", "D": "their"}, "optsZh": {"A": "its（它的，單數所有格）", "B": "they're（= they are，他們是）", "C": "it's（= it is，它是）", "D": "their（他們的，複數所有格）"}, "answer": "D", "expl": "The possessive determiner for two people is 'their'.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English: possessive determiner agreement.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Biologists Watson and Crick built on others&#x27; evidence when developing _______ model of DNA.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Biologists Watson and Crick built on others' evidence when developing _______ model of DNA.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。生物學家 Watson 與 Crick 在建立 _______ DNA 模型時，是以其他人的證據為基礎。", "opts": {"A": "its", "B": "it's", "C": "they're", "D": "their"}, "optsZh": {"A": "its（它的，單數所有格）", "B": "it's（= it is，它是）", "C": "they're（= they are，他們是）", "D": "their（他們的，複數所有格）"}, "answer": "D", "expl": "The plural possessive determiner is needed.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English: essential appositive and integrated quotation punctuation.", "vocab": false, "body": "In 1937, Chinese American screen actor Anna May Wong, who had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portray\" target=\"_blank\" rel=\"noopener\" data-w=\"portray\" data-pos=\"v.\" data-en=\"to represent or describe someone or something in a particular way\" data-zh=\"描繪；呈現\">portrayed<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=numerous\" target=\"_blank\" rel=\"noopener\" data-w=\"numerous\" data-pos=\"adj.\" data-en=\"many\" data-zh=\"眾多的\">numerous<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=villain\" target=\"_blank\" rel=\"noopener\" data-w=\"villain\" data-pos=\"n.\" data-en=\"a bad character in a story or film\" data-zh=\"反派\">villains<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secondary\" target=\"_blank\" rel=\"noopener\" data-w=\"secondary\" data-pos=\"adj.\" data-en=\"less important than something else\" data-zh=\"次要的\">secondary<\/a> characters but never a heroine, finally got a starring role in Paramount Pictures&#x27; Daughter of Shanghai, a film that _______ &quot;expanded the range of possibilities for Asian images on screen.&quot;", "bodyPlain": "In 1937, Chinese American screen actor Anna May Wong, who had portrayed numerous villains and secondary characters but never a heroine, finally got a starring role in Paramount Pictures' Daughter of Shanghai, a film that _______ \"expanded the range of possibilities for Asian images on screen.\"", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "1937 年，曾演過無數反派與配角卻從未演過女主角的華裔美國電影演員黃柳霜（Anna May Wong），終於在派拉蒙影業的《上海女兒》（Daughter of Shanghai）中獲得主演角色，這部電影 _______「擴展了亞洲形象在銀幕上的可能範圍」。", "opts": {"A": "critic, Stina Chyn, claims", "B": "critic, Stina Chyn, claims,", "C": "critic Stina Chyn claims", "D": "critic Stina Chyn, claims,"}, "optsZh": {"A": "critic, Stina Chyn, claims（把必要的名字當成非必要同位語加逗號：錯誤）", "B": "critic, Stina Chyn, claims,（多餘逗號：錯誤）", "C": "critic Stina Chyn claims（無逗號：正確）", "D": "critic Stina Chyn, claims,（主詞與動詞之間加逗號：錯誤）"}, "answer": "C", "expl": "'Stina Chyn' is essential to identify which critic, so no commas set it off; and no comma should separate 'claims' from its quoted object.", "explZh": "「Stina Chyn」是辨認是哪位評論家的必要資訊，不加逗號；「claims」與其後的引述之間也不應有逗號。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English: essential appositive and integrated quotation punctuation.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The documentary, a film that _______ &quot;reframes the history of jazz,&quot; premiered at the festival.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The documentary, a film that _______ \"reframes the history of jazz,\" premiered at the festival.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。這部紀錄片──一部 _______「重新定義爵士樂歷史」的電影──在影展上首映。", "opts": {"A": "critic Elena Moss calls", "B": "critic Elena Moss, calls,", "C": "critic, Elena Moss, calls", "D": "critic, Elena Moss calls,"}, "optsZh": {"A": "critic Elena Moss calls（無逗號：正確）", "B": "critic Elena Moss, calls,（主詞與動詞之間加逗號：錯誤）", "C": "critic, Elena Moss, calls（把必要的名字當成非必要同位語加逗號：錯誤）", "D": "critic, Elena Moss calls,（逗號位置錯誤）"}, "answer": "A", "expl": "The critic's name is essential, and the quotation is integrated.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English: essential appositive and integrated quotation punctuation.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. The poem is one that _______ &quot;turns silence into music.&quot;", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The poem is one that _______ \"turns silence into music.\"", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。這首詩是一首 _______「將沉默化為音樂」的作品。", "opts": {"A": "scholar, Rana Patel, says,", "B": "scholar Rana Patel says", "C": "scholar, Rana Patel, says", "D": "scholar Rana Patel, says,"}, "optsZh": {"A": "scholar, Rana Patel, says,（多餘逗號：錯誤）", "B": "scholar Rana Patel says（無逗號：正確）", "C": "scholar, Rana Patel, says（把必要的名字當成非必要同位語加逗號：錯誤）", "D": "scholar Rana Patel, says,（主詞與動詞之間加逗號：錯誤）"}, "answer": "B", "expl": "No commas are needed around an essential name or before an integrated quote.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English: essential appositive and integrated quotation punctuation.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The sculpture was an artwork that _______ &quot;invites viewers to move.&quot;", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. The sculpture was an artwork that _______ \"invites viewers to move.\"", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。這件雕塑是一件 _______「邀請觀者移動」的藝術品。", "opts": {"A": "curator, Miles Chen, argues", "B": "curator Miles Chen, argues,", "C": "curator, Miles Chen argues,", "D": "curator Miles Chen argues"}, "optsZh": {"A": "curator, Miles Chen, argues（把必要的名字當成非必要同位語加逗號：錯誤）", "B": "curator Miles Chen, argues,（主詞與動詞之間加逗號：錯誤）", "C": "curator, Miles Chen argues,（逗號位置錯誤）", "D": "curator Miles Chen argues（無逗號：正確）"}, "answer": "D", "expl": "The title 'curator' and name form one essential identifier.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English: essential appositive and integrated quotation punctuation.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The novel is a book that _______ &quot;blends realism with myth.&quot;", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. The novel is a book that _______ \"blends realism with myth.\"", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。這部小說是一本 _______「融合寫實與神話」的書。", "opts": {"A": "critic Talia Moore, claims,", "B": "critic, Talia Moore claims,", "C": "critic Talia Moore claims", "D": "critic, Talia Moore, claims"}, "optsZh": {"A": "critic Talia Moore, claims,（主詞與動詞之間加逗號：錯誤）", "B": "critic, Talia Moore claims,（逗號位置錯誤）", "C": "critic Talia Moore claims（無逗號：正確）", "D": "critic, Talia Moore, claims（把必要的名字當成非必要同位語加逗號：錯誤）"}, "answer": "C", "expl": "No comma is needed before an integrated quotation.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English: essential appositive and integrated quotation punctuation.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The exhibition includes a painting that _______ &quot;captures the tempo of city life.&quot;", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. The exhibition includes a painting that _______ \"captures the tempo of city life.\"", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。展覽中包括一幅 _______「捕捉城市生活節奏」的畫作。", "opts": {"A": "historian Omar Ruiz writes", "B": "historian, Omar Ruiz writes,", "C": "historian, Omar Ruiz, writes", "D": "historian Omar Ruiz, writes,"}, "optsZh": {"A": "historian Omar Ruiz writes（無逗號：正確）", "B": "historian, Omar Ruiz writes,（逗號位置錯誤）", "C": "historian, Omar Ruiz, writes（把必要的名字當成非必要同位語加逗號：錯誤）", "D": "historian Omar Ruiz, writes,（主詞與動詞之間加逗號：錯誤）"}, "answer": "A", "expl": "The proper noun is essential to identify the historian.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English: finite verb in a main clause.", "vocab": false, "body": "In 1637, the price of tulips <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=skyrocket\" target=\"_blank\" rel=\"noopener\" data-w=\"skyrocket\" data-pos=\"v.\" data-en=\"to rise extremely quickly\" data-zh=\"飆升\">skyrocketed<\/a> in Amsterdam, with single bulbs of rare varieties selling for up to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equivalent\" target=\"_blank\" rel=\"noopener\" data-w=\"equivalent\" data-pos=\"n./adj.\" data-en=\"something equal in value or meaning; equal\" data-zh=\"等值物；相等的\">equivalent<\/a> of $200,000 in today&#x27;s US dollars. Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> _______ that this &quot;tulip mania&quot; was the first historical instance of an asset bubble, which occurs when investors drive prices to highs not supported by actual demand.", "bodyPlain": "In 1637, the price of tulips skyrocketed in Amsterdam, with single bulbs of rare varieties selling for up to the equivalent of $200,000 in today's US dollars. Some historians _______ that this \"tulip mania\" was the first historical instance of an asset bubble, which occurs when investors drive prices to highs not supported by actual demand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "1637 年，鬱金香的價格在阿姆斯特丹飆升，稀有品種的單一球根售價高達相當於今日 20 萬美元。一些歷史學家 _______ 這場「鬱金香狂熱」是歷史上第一次資產泡沫，資產泡沫發生於投資者將價格推升至實際需求無法支撐的高點時。", "opts": {"A": "claiming", "B": "claim", "C": "having claimed", "D": "to claim"}, "optsZh": {"A": "claiming（現在分詞，非限定動詞）", "B": "claim（複數現在式動詞）", "C": "having claimed（完成分詞，非限定動詞）", "D": "to claim（不定詞，非限定動詞）"}, "answer": "B", "expl": "The sentence needs a finite main verb for the subject 'Some historians'; only 'claim' works. The other forms leave the sentence without a main verb.", "explZh": "主詞「Some historians」需要一個限定動詞，只有「claim」可以；其他形式會讓句子沒有主要動詞。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English: finite verb in a main clause.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> _______ that the marks on the stone were made by tools, not by erosion.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. Several archaeologists _______ that the marks on the stone were made by tools, not by erosion.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。幾位考古學家 _______ 石頭上的痕跡是由工具造成的，而不是侵蝕。", "opts": {"A": "arguing", "B": "having argued", "C": "argue", "D": "to argue"}, "optsZh": {"A": "arguing（現在分詞，非限定動詞）", "B": "having argued（完成分詞，非限定動詞）", "C": "argue（複數現在式動詞）", "D": "to argue（不定詞，非限定動詞）"}, "answer": "C", "expl": "The subject needs a finite verb.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English: finite verb in a main clause.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. Some linguists _______ that the two dialects developed from a shared regional variety.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. Some linguists _______ that the two dialects developed from a shared regional variety.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。一些語言學家 _______ 這兩種方言是從一種共同的區域變體發展而來。", "opts": {"A": "having claimed", "B": "claiming", "C": "claim", "D": "to claim"}, "optsZh": {"A": "having claimed（完成分詞，非限定動詞）", "B": "claiming（現在分詞，非限定動詞）", "C": "claim（複數現在式動詞）", "D": "to claim（不定詞，非限定動詞）"}, "answer": "C", "expl": "The main clause requires the finite verb 'claim'.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English: finite verb in a main clause.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Many historians _______ that the treaty changed trade routes across the region.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Many historians _______ that the treaty changed trade routes across the region.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。許多歷史學家 _______ 這項條約改變了整個地區的貿易路線。", "opts": {"A": "to suggest", "B": "having suggested", "C": "suggesting", "D": "suggest"}, "optsZh": {"A": "to suggest（不定詞，非限定動詞）", "B": "having suggested（完成分詞，非限定動詞）", "C": "suggesting（現在分詞，接在逗號後：正確）", "D": "suggest（複數現在式動詞）"}, "answer": "D", "expl": "A finite verb completes the clause.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English: finite verb in a main clause.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. Several ecologists _______ that urban gardens can support native <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pollinator\" target=\"_blank\" rel=\"noopener\" data-w=\"pollinator\" data-pos=\"n.\" data-en=\"an animal, such as a bee, that carries pollen between plants\" data-zh=\"傳粉者\">pollinators<\/a>.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The completion must respect the role of each phrase in the sentence, including whether a word is functioning as a subject, verb, modifier, appositive, or part of a coordinate structure. Several ecologists _______ that urban gardens can support native pollinators.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生與共享空間可及性的幾種方法。報告將個別案例與更廣泛的模式連結起來，顯示政策選擇如何產生漸進、間接或難以立即衡量的效果，尤其當不同社區以不同方式經歷同一項政策時。\n補全必須尊重句中每個片語的角色，包括某個字是作為主詞、動詞、修飾語、同位語，還是對等結構的一部分。幾位生態學家 _______ 城市花園能夠支持本土的傳粉者。", "opts": {"A": "having argued", "B": "argue", "C": "to argue", "D": "arguing"}, "optsZh": {"A": "having argued（完成分詞，非限定動詞）", "B": "argue（複數現在式動詞）", "C": "to argue（不定詞，非限定動詞）", "D": "arguing（現在分詞，非限定動詞）"}, "answer": "B", "expl": "The main subject requires a finite verb.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English: finite verb in a main clause.", "vocab": false, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> correct and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rhetorically\" target=\"_blank\" rel=\"noopener\" data-w=\"rhetorically\" data-pos=\"adv.\" data-en=\"in terms of effective or persuasive language\" data-zh=\"在修辭上\">rhetorically<\/a> natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Some economists _______ that public transit access affects employment opportunities.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The sentence is part of a formal academic paragraph, so the completion must be both grammatically correct and rhetorically natural. The surrounding context determines whether punctuation, verb form, pronoun reference, or sentence boundary is the controlling issue. Some economists _______ that public transit access affects employment opportunities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個多階段的過程，發現結果取決於時機、環境以及多個變數的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的細微改變會影響主張的精確度，並可能使結論聽起來比資料所支持的更為廣泛。\n這個句子是正式學術段落的一部分，因此補全必須既符合語法，又在修辭上自然。前後文決定了標點、動詞形式、代名詞指涉或句子界線中哪一項才是關鍵問題。一些經濟學家 _______ 大眾運輸的可及性會影響就業機會。", "opts": {"A": "claim", "B": "having claimed", "C": "to claim", "D": "claiming"}, "optsZh": {"A": "claim（複數現在式動詞）", "B": "having claimed（完成分詞，非限定動詞）", "C": "to claim（不定詞，非限定動詞）", "D": "claiming（現在分詞，非限定動詞）"}, "answer": "A", "expl": "Only 'claim' functions as the main verb.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Standard English: colon introducing an explanation.", "vocab": false, "body": "Researchers studying magnetosensation have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> why some soil-dwelling <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=roundworm\" target=\"_blank\" rel=\"noopener\" data-w=\"roundworm\" data-pos=\"n.\" data-en=\"a small worm with a round body, often living in soil\" data-zh=\"圓蟲；線蟲\">roundworms<\/a> in the Southern Hemisphere move in the opposite direction of Earth&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=magnetic\" target=\"_blank\" rel=\"noopener\" data-w=\"magnetic\" data-pos=\"adj.\" data-en=\"relating to a magnet or magnetism\" data-zh=\"磁的\">magnetic<\/a> field when searching for _______ in the Northern Hemisphere, the magnetic field points down, into the ground, but in the Southern Hemisphere, it points up, toward the surface and away from worms&#x27; food sources.", "bodyPlain": "Researchers studying magnetosensation have determined why some soil-dwelling roundworms in the Southern Hemisphere move in the opposite direction of Earth's magnetic field when searching for _______ in the Northern Hemisphere, the magnetic field points down, into the ground, but in the Southern Hemisphere, it points up, toward the surface and away from worms' food sources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "研究磁感應的學者已經確定，為何南半球某些棲息於土壤中的圓蟲在尋找 _______ 時會朝與地球磁場相反的方向移動：在北半球，磁場向下指向地底，但在南半球，磁場向上指向地表，遠離蟲的食物來源。", "opts": {"A": "food:", "B": "food,", "C": "food while", "D": "food"}, "optsZh": {"A": "food:（冒號，引出解釋：正確）", "B": "food,（逗號 → 造成逗號連接錯誤）", "C": "food while（加 while 使語意不通）", "D": "food（無標點 → 造成兩個獨立子句直接相連：錯誤）"}, "answer": "A", "expl": "Two independent clauses: the second explains the first, so a colon is correct. A comma would create a comma splice; no punctuation would be a run-on.", "explZh": "兩個獨立子句，後者解釋前者，因此用冒號。逗號會造成逗號連接錯誤；不加標點則是連寫句。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Standard English: colon introducing an explanation.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The team identified why the sensor failed during the storm: _______ had entered the casing and damaged the wires.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Its grammar depends on the relationship between nearby nouns, verbs, modifiers, and punctuation, so the sentence must remain smooth while preserving the intended meaning. The team identified why the sensor failed during the storm: _______ had entered the casing and damaged the wires.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "多年的田野觀察使先前對某個自然現象的解釋變得複雜，研究人員現在以更多的謹慎而非確定來描述這個情況。他們的報告將初步測量結果與舊有假設進行比較，並強調詮釋在多大程度上依賴於跨不同季節與地點所收集的、不完整但具暗示性的證據。\n它的語法取決於鄰近的名詞、動詞、修飾語與標點符號之間的關係，因此句子必須在保留原意的同時保持通順。團隊找出了感測器在暴風中失靈的原因：_______ 進入了外殼並損壞了電線。", "opts": {"A": "water; while", "B": "water,", "C": "water", "D": "water while"}, "optsZh": {"A": "water; while（水＋分號＋while：錯誤）", "B": "water,（主詞名詞後多餘逗號：錯誤）", "C": "water（水）", "D": "water while（水＋while：錯誤）"}, "answer": "C", "expl": "The colon introduces the explanation.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Standard English: colon introducing an explanation.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The idea is already clear, but the sentence needs a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grammatically\" target=\"_blank\" rel=\"noopener\" data-w=\"grammatically\" data-pos=\"adv.\" data-en=\"according to the rules of grammar\" data-zh=\"在文法上\">grammatically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conventional\" target=\"_blank\" rel=\"noopener\" data-w=\"conventional\" data-pos=\"adj.\" data-en=\"following what is traditional or usual\" data-zh=\"傳統的；慣例的\">conventional<\/a> completion that fits the formal style of the surrounding passage. The composer gave one reason for revising the ending: _______ felt too abrupt after the slow third movement.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The idea is already clear, but the sentence needs a grammatically conventional completion that fits the formal style of the surrounding passage. The composer gave one reason for revising the ending: _______ felt too abrupt after the slow third movement.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共計畫的理解。由於紀錄零散，學者必須先將多個來源中的小片段證據連結起來，才能描述這項計畫的發展、塑造它的人物，以及它的重要性為何曾被忽略。\n意思已經很清楚，但句子需要一個符合語法慣例、並與前後文正式風格相符的補全。作曲家給出了修改結尾的一個理由：_______ 在緩慢的第三樂章之後顯得太突然。", "opts": {"A": "the finale; while", "B": "the finale while", "C": "the finale,", "D": "the finale"}, "optsZh": {"A": "the finale; while（終曲＋分號＋while：錯誤）", "B": "the finale while（終曲＋while：錯誤）", "C": "the finale,（主詞名詞後多餘逗號：錯誤）", "D": "the finale（終曲）"}, "answer": "D", "expl": "A complete explanation follows the colon.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Standard English: colon introducing an explanation.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Researchers now understand why the seedlings grew near the stones: _______ trapped moisture during dry afternoons.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The sentence should be completed in a way that maintains that structure without creating a fragment, comma splice, agreement error, or misplaced modifier. Researchers now understand why the seedlings grew near the stones: _______ trapped moisture during dry afternoons.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能補全文句，使其符合標準英語的慣例？", "bodyZh": "在一個社區藝術中心，一位策展人籌備了一場展覽，介紹作品汲取自科學觀察、地方歷史與合作的創作者。展覽說明解釋了個人決定、材料、觀眾與機構環境如何隨時間塑造每件作品的意義，而非將完成的作品視為孤立的成就。\n句子的補全方式應維持該結構，而不會造成句子殘缺、逗號連接錯誤、一致性錯誤或修飾語錯置。研究人員現在明白幼苗為何長在石頭附近：_______ 在乾燥的午後保留了水分。", "opts": {"A": "the rocks,", "B": "the rocks", "C": "the rocks while", "D": "the rocks; while"}, "optsZh": {"A": "the rocks,（主詞名詞後多餘逗號：錯誤）", "B": "the rocks（那些石頭）", "C": "the rocks while（石頭＋while：錯誤）", "D": "the rocks; while（石頭＋分號＋while：錯誤）"}, "answer": "B", "expl": "The colon correctly introduces a reason.", "explZh": ""}, {"id": "24.4", "label": "Mock 2
