 at your plans without even <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=listening\" target=\"_blank\" rel=\"noopener\">listening<\/a> to them. From now on, I will hear you out before I judge.&quot;", "bodyPlain": "The following text is adapted from a play.\n\"I have been unfair to you, Thomas,\" said his sister. \"I laughed at your plans without even listening to them. From now on, I will hear you out before I judge.\"", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "以下文字改編自一部劇本。\n「我對你不公平，Thomas，」他的姊姊說。「我連聽都沒聽就嘲笑你的計畫。從現在起，我會先聽你說完再下判斷。」", "opts": {"A": "The speaker describes her brother's plans in detail and then praises them.", "B": "The speaker admits a fault and then promises to behave differently.", "C": "The speaker asks a question and then answers it herself.", "D": "The speaker recalls a childhood memory and then explains its meaning."}, "optsZh": {"A": "說話者詳細描述弟弟的計畫，然後稱讚它們。", "B": "說話者承認自己的錯，然後承諾改變行為。", "C": "說話者提出一個問題，然後自己回答。", "D": "說話者回憶一段童年記憶，然後解釋它的意義。"}, "answer": "B", "expl": "The speaker first admits a fault and then promises to change.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Text Structure and Purpose: describe the overall structure of a literary passage.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a novel.<br>When I first met Mr. Harlow, I thought him cold and proud; he barely nodded when we were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduced<\/a>. Only <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=month\" target=\"_blank\" rel=\"noopener\" data-w=\"month\" data-pos=\"n.\" data-en=\"one of the twelve periods of time into which a year is divided\" data-zh=\"月\">months<\/a> later did I learn that he had been grieving the loss of his brother that very week.", "bodyPlain": "The following text is adapted from a novel.\nWhen I first met Mr. Harlow, I thought him cold and proud; he barely nodded when we were introduced. Only months later did I learn that he had been grieving the loss of his brother that very week.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "以下文字改編自一部小說。\n我第一次見到 Harlow 先生時，覺得他冷漠又驕傲；我們被介紹認識時，他幾乎只點了點頭。直到幾個月後，我才知道那一週他正為失去弟弟而哀傷。", "opts": {"A": "It describes a friendship and then explains why it ended.", "B": "It praises a character and then criticizes him.", "C": "It presents a mystery and then leaves it unsolved.", "D": "It describes a first impression and then reveals information showing it was mistaken."}, "optsZh": {"A": "它描述一段友誼，然後解釋這段友誼為何結束。", "B": "它讚美一個角色，然後批評他。", "C": "它提出一個謎團，然後沒有解開它。", "D": "它描述第一印象，然後揭示顯示這個印象是錯誤的資訊。"}, "answer": "D", "expl": "The narrator describes a first impression and then reveals it was wrong.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Structure and Purpose: describe the overall structure of an informational text.", "vocab": false, "body": "In order to combat the effects of human life on the planet’s climate, many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> and governmental <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establishment\" target=\"_blank\" rel=\"noopener\" data-w=\"establishment\" data-pos=\"n.\" data-en=\"a business such as a shop, hotel, or restaurant\" data-zh=\"營業場所；機構\">establishments<\/a> lay the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foundation\" target=\"_blank\" rel=\"noopener\" data-w=\"foundation\" data-pos=\"n.\" data-en=\"the basis or starting point on which something is built\" data-zh=\"基礎\">foundation<\/a> for forests in localities that previously did not have woodland areas, also known as afforestation. To begin the operation, potential sites are first surveyed in order to select regions with the best factors in terms of aspects such as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a>, amount of human activity, weather, and soil quality. Once a site has been selected, the land must then be developed for planting. After the land has been prepared, trees can be planted with different methods of seeding, depending on the site and soil present.", "bodyPlain": "In order to combat the effects of human life on the planet’s climate, many environmental and governmental establishments lay the foundation for forests in localities that previously did not have woodland areas, also known as afforestation. To begin the operation, potential sites are first surveyed in order to select regions with the best factors in terms of aspects such as vegetation, amount of human activity, weather, and soil quality. Once a site has been selected, the land must then be developed for planting. After the land has been prepared, trees can be planted with different methods of seeding, depending on the site and soil present.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "為了對抗人類活動對地球氣候的影響，許多環保與政府機構在以前沒有林地的地方建立森林基礎，這也稱為造林。為了開始這項工作，首先要勘查潛在地點，以挑選在植被、人類活動程度、天氣和土壤品質等方面條件最好的地區。選定地點後，接著必須整地以便種植。土地整備好之後，就可以依據地點與土壤狀況，用不同的播種方法種樹。", "opts": {"A": "It presents a solution to a widespread issue, then elaborates on why the issue should be solved.", "B": "It defines a strategy, then lists the reasons why the strategy is useful.", "C": "It examines an effective practice, then argues that the practice has negative consequences.", "D": "It introduces a process, then explains the steps taken in executing that process."}, "optsZh": {"A": "它提出一個普遍問題的解決方法，然後詳細說明為何應該解決這個問題。", "B": "它定義一種策略，然後列出這種策略有用的原因。", "C": "它檢視一種有效的做法，然後主張這種做法有負面後果。", "D": "它介紹一個過程，然後解釋執行這個過程所採取的步驟。"}, "answer": "D", "expl": "The text introduces afforestation and then explains its steps: surveying, preparing land, and planting.", "explZh": "本文介紹造林，然後說明其步驟：勘查、整地、種植。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Structure and Purpose: describe the overall structure of an informational text.", "vocab": false, "body": "Traditional Japanese washi paper is made through a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=careful\" target=\"_blank\" rel=\"noopener\">careful<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=process\" target=\"_blank\" rel=\"noopener\">process<\/a>. First, workers strip the inner bark from mulberry shrubs and soak it in water. Next, they boil and beat the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fiber\" target=\"_blank\" rel=\"noopener\" data-w=\"fiber\" data-pos=\"n.\" data-en=\"a thin thread-like strand\" data-zh=\"纖維\">fibers<\/a> until they become soft. Finally, the pulp is spread on screens and left to dry in the sun.", "bodyPlain": "Traditional Japanese washi paper is made through a careful process. First, workers strip the inner bark from mulberry shrubs and soak it in water. Next, they boil and beat the fibers until they become soft. Finally, the pulp is spread on screens and left to dry in the sun.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "傳統日本和紙是經過細心的流程製成的。首先，工人從構樹灌木上剝下內層樹皮並浸泡在水中。接著，他們把纖維煮過並捶打至柔軟。最後，把紙漿鋪在網篩上，放在陽光下曬乾。", "opts": {"A": "It presents a problem and then offers a solution.", "B": "It compares two types of paper and then chooses the better one.", "C": "It describes a tradition and then argues that it should end.", "D": "It introduces a process and then explains the steps involved."}, "optsZh": {"A": "它提出一個問題，然後提供解決方法。", "B": "它比較兩種紙，然後選出較好的一種。", "C": "它描述一項傳統，然後主張應該終止它。", "D": "它介紹一個過程，然後解釋其中的步驟。"}, "answer": "D", "expl": "The text names a process (making paper) and then explains its steps.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Structure and Purpose: describe the overall structure of an informational text.", "vocab": false, "body": "Rising ocean <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> are causing coral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reef\" target=\"_blank\" rel=\"noopener\" data-w=\"reef\" data-pos=\"n.\" data-en=\"a line of rock or coral near the surface of the sea\" data-zh=\"礁；珊瑚礁\">reefs<\/a> to lose the algae that give them color and food, a process called bleaching. To fight this, some scientists are breeding &quot;super corals&quot; that can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survive<\/a> in warmer water and planting them on damaged reefs.", "bodyPlain": "Rising ocean temperatures are causing coral reefs to lose the algae that give them color and food, a process called bleaching. To fight this, some scientists are breeding \"super corals\" that can survive in warmer water and planting them on damaged reefs.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "海洋溫度上升，導致珊瑚礁失去提供顏色與養分的藻類，這個過程稱為白化。為了對抗這種情況，一些科學家正在培育能在較溫暖海水中存活的「超級珊瑚」，並把它們種植在受損的珊瑚礁上。", "opts": {"A": "It explains a problem and then describes an effort to address it.", "B": "It describes a process and then lists its steps.", "C": "It presents a theory and then disproves it.", "D": "It compares two reefs and then explains their differences."}, "optsZh": {"A": "它解釋一個問題，然後描述解決這個問題的努力。", "B": "它描述一個過程，然後列出步驟。", "C": "它提出一個理論，然後推翻它。", "D": "它比較兩個珊瑚礁，然後解釋它們的差異。"}, "answer": "A", "expl": "It describes a problem (coral bleaching) and then a proposed solution.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Structure and Purpose: describe the overall structure of an informational text.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=palindrome\" target=\"_blank\" rel=\"noopener\">palindrome<\/a> is a word or phrase that reads the same <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=forward\" target=\"_blank\" rel=\"noopener\">forward<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=backward\" target=\"_blank\" rel=\"noopener\">backward<\/a>. Simple examples include &quot;level&quot; and &quot;radar,&quot; while longer ones include the famous sentence &quot;A man, a plan, a canal: Panama.&quot;", "bodyPlain": "A palindrome is a word or phrase that reads the same forward and backward. Simple examples include \"level\" and \"radar,\" while longer ones include the famous sentence \"A man, a plan, a canal: Panama.\"", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "回文是正著讀和倒著讀都一樣的字詞或片語。簡單的例子包括「level」和「radar」，較長的例子則有著名的句子「A man, a plan, a canal: Panama.」", "opts": {"A": "It tells the history of a word and then explains its spelling.", "B": "It defines a term and then provides examples of it.", "C": "It presents a rule and then lists exceptions.", "D": "It describes a problem and then offers a solution."}, "optsZh": {"A": "它講述一個字的歷史，然後解釋它的拼法。", "B": "它定義一個術語，然後提供例子。", "C": "它提出一條規則，然後列出例外。", "D": "它描述一個問題，然後提供解決方法。"}, "answer": "B", "expl": "It defines a term and then gives examples.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Text Structure and Purpose: describe the overall structure of an informational text.", "vocab": false, "body": "Many people believe that bulls are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=angered\" target=\"_blank\" rel=\"noopener\">angered<\/a> by the color red. In fact, bulls are partly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=color-blind\" target=\"_blank\" rel=\"noopener\">color-blind<\/a> and cannot see red <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=clear\" target=\"_blank\" rel=\"noopener\" data-w=\"clear\" data-pos=\"adj./v.\" data-en=\"easy to see or understand; (v.) to remove something blocking, e.g., to clear your throat\" data-zh=\"清楚的；清除、清（喉嚨）\">clearly<\/a>. Experiments show that they charge at a moving cloth of any color; it is the movement, not the color, that provokes them.", "bodyPlain": "Many people believe that bulls are angered by the color red. In fact, bulls are partly color-blind and cannot see red clearly. Experiments show that they charge at a moving cloth of any color; it is the movement, not the color, that provokes them.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "許多人相信公牛會被紅色激怒。事實上，公牛部分色盲，無法清楚看見紅色。實驗顯示，牠們會衝向任何顏色的移動布料；激怒牠們的是動作，而不是顏色。", "opts": {"A": "It lists the steps of a process.", "B": "It compares two animals and then explains their similarities.", "C": "It presents a common belief and then gives evidence that it is false.", "D": "It defines a scientific term and then gives examples."}, "optsZh": {"A": "它列出一個過程的步驟。", "B": "它比較兩種動物，然後解釋牠們的相似之處。", "C": "它提出一個常見的看法，然後提供證據證明它是錯的。", "D": "它定義一個科學術語，然後舉例。"}, "answer": "C", "expl": "It presents a common belief and then shows evidence against it.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Text Structure and Purpose: describe the overall structure of an informational text.", "vocab": false, "body": "Turning cacao beans into <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chocolate\" target=\"_blank\" rel=\"noopener\">chocolate<\/a> takes several stages. Farmers first ferment the beans for about a week to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">develop<\/a> flavor. The beans are then dried, roasted, and cracked open. Finally, the inner nibs are ground into a paste and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mixed\" target=\"_blank\" rel=\"noopener\" data-w=\"mixed\" data-pos=\"adj.\" data-en=\"including different or opposite kinds of feelings or things\" data-zh=\"混雜的；矛盾的\">mixed<\/a> with sugar.", "bodyPlain": "Turning cacao beans into chocolate takes several stages. Farmers first ferment the beans for about a week to develop flavor. The beans are then dried, roasted, and cracked open. Finally, the inner nibs are ground into a paste and mixed with sugar.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "把可可豆變成巧克力需要幾個階段。農民首先讓可可豆發酵約一週，以發展風味。接著把豆子乾燥、烘焙並敲開。最後，把裡面的可可碎粒磨成糊狀並與糖混合。", "opts": {"A": "It explains why chocolate is popular and then lists its health benefits.", "B": "It compares two kinds of chocolate and then recommends one.", "C": "It describes a problem in chocolate production and then offers a solution.", "D": "It introduces a process and then explains the steps taken to complete it."}, "optsZh": {"A": "它解釋巧克力為何受歡迎，然後列出它的健康益處。", "B": "它比較兩種巧克力，然後推薦其中一種。", "C": "它描述巧克力生產中的一個問題，然後提供解決方法。", "D": "它介紹一個過程，然後解釋完成這個過程所採取的步驟。"}, "answer": "D", "expl": "The text introduces the process of making chocolate and describes each step.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Cross-Text Connections: predict how the author of one text would respond to studies described in another.", "vocab": false, "body": "Text 1<br>A recent series of psychological studies that included subjects from different parts of the world looked at the effects that nostalgia, the feeling and experience of thinking about one’s own past, has on psychological well-being. The results of the studies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=demonstrate\" target=\"_blank\" rel=\"noopener\" data-w=\"demonstrate\" data-pos=\"v.\" data-en=\"to show clearly by giving proof or examples\" data-zh=\"證明；展現\">demonstrated<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between nostalgia and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authenticity\" target=\"_blank\" rel=\"noopener\" data-w=\"authenticity\" data-pos=\"n.\" data-en=\"the quality of being real or genuine\" data-zh=\"真實性\">authenticity<\/a>, one’s sense of being aligned with one’s true self. A greater sense of authenticity was found to correlate with greater <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> of all aspects of psychological well-being.<br>Text 2<br>While there has been some demonstration that nostalgia is associated with mental health benefits, it is important to remember that there are different types of nostalgia and that some can be highly destructive. A recent study performed by psychologists David B. Newman, Arthur A. Stone, and Norbert Schwarz found that conscious acts of extreme nostalgia have positive effects, while smaller and momentary, more unconscious nostalgic experiences can result in negative mental health effects, such as neuroticism.", "bodyPlain": "Text 1\nA recent series of psychological studies that included subjects from different parts of the world looked at the effects that nostalgia, the feeling and experience of thinking about one’s own past, has on psychological well-being. The results of the studies demonstrated a relationship between nostalgia and authenticity, one’s sense of being aligned with one’s true self. A greater sense of authenticity was found to correlate with greater measurements of all aspects of psychological well-being.\nText 2\nWhile there has been some demonstration that nostalgia is associated with mental health benefits, it is important to remember that there are different types of nostalgia and that some can be highly destructive. A recent study performed by psychologists David B. Newman, Arthur A. Stone, and Norbert Schwarz found that conscious acts of extreme nostalgia have positive effects, while smaller and momentary, more unconscious nostalgic experiences can result in negative mental health effects, such as neuroticism.", "stem": "Based on the texts, what would Newman, Stone, and Schwarz (Text 2) say about the results of the studies discussed in Text 1?", "stemZh": "根據這兩篇文章，Newman、Stone 與 Schwarz（Text 2）會如何評論 Text 1 中所討論研究的結果？", "bodyZh": "Text 1\n最近一系列包含來自世界各地受試者的心理學研究，探討了懷舊——回想自己過去的感受與經驗——對心理健康的影響。研究結果顯示，懷舊與真實感（一個人覺得與真實自我一致的感受）之間存在關聯。研究發現，越強的真實感與心理健康各方面越好的測量結果相關。\nText 2\n雖然已有一些證據顯示懷舊與心理健康益處相關，但重要的是要記得懷舊有不同類型，其中有些可能具有高度破壞性。心理學家 David B. Newman、Arthur A.Stone 與 Norbert Schwarz 最近的一項研究發現，有意識的強烈懷舊行為有正面影響，而較小、短暫、較無意識的懷舊經驗則可能導致負面的心理健康影響，例如神經質。", "opts": {"A": "They are completely consistent with the results of other studies on the subject.", "B": "They are from studies that fail to differentiate between different types of nostalgia and so provide an incomplete picture of nostalgia’s impact on mental health.", "C": "They provide empirical evidence for a hypothesis long untested but assumed to be true.", "D": "They suggest a possible new direction for future research but provide no definitive resolutions."}, "optsZh": {"A": "它們與這個主題的其他研究結果完全一致。", "B": "那些研究沒有區分不同類型的懷舊，因此對懷舊如何影響心理健康只呈現了不完整的面貌。", "C": "它們為一個長期未經檢驗但被認為正確的假設提供了實證。", "D": "它們指出未來研究可能的新方向，但沒有提供明確的結論。"}, "answer": "B", "expl": "Text 2 stresses that different types of nostalgia have different effects, so it would say Text 1's studies did not separate the types and give an incomplete picture. (The original key listed C.)", "explZh": "Text 2 強調不同類型的懷舊有不同影響，所以會認為 Text 1 的研究沒有區分類型，呈現的面貌不完整。（原答案列為 C，已修正為 B。）"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Cross-Text Connections: predict how the author of one text would respond to studies described in another.", "vocab": false, "body": "Text 1<br>A recent set of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=studies\" target=\"_blank\" rel=\"noopener\">studies<\/a> found that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=teenagers\" target=\"_blank\" rel=\"noopener\">teenagers<\/a> who spend more time on screens tend to report lower happiness. The researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that screen time harms young people&#x27;s well-being.<br>Text 2<br>Not all screen time is the same. A study by psychologists Amy Orben and Andrew Przybylski found that video calls with friends and creative activities, such as making music, were linked to better mood, while endless scrolling through social media was linked to worse mood.", "bodyPlain": "Text 1\nA recent set of studies found that teenagers who spend more time on screens tend to report lower happiness. The researchers concluded that screen time harms young people's well-being.\nText 2\nNot all screen time is the same. A study by psychologists Amy Orben and Andrew Przybylski found that video calls with friends and creative activities, such as making music, were linked to better mood, while endless scrolling through social media was linked to worse mood.", "stem": "Based on the texts, what would Orben and Przybylski (Text 2) most likely say about the studies discussed in Text 1?", "stemZh": "根據這兩篇文章，Orben 與 Przybylski（Text 2）最可能如何評論 Text 1 中討論的研究？", "bodyZh": "Text 1\n最近的一系列研究發現，花較多時間在螢幕上的青少年往往自述較不快樂。研究人員得出結論：螢幕時間會損害年輕人的身心健康。\nText 2\n並不是所有的螢幕時間都一樣。心理學家 Amy Orben 與 Andrew Przybylski 的一項研究發現，與朋友視訊和創作活動（例如做音樂）與較好的心情相關，而無止盡地滑社群媒體則與較差的心情相關。", "opts": {"A": "They confirm that all screen time is harmful.", "B": "They fail to distinguish between different kinds of screen time and so give an incomplete picture.", "C": "They prove that screens improve happiness.", "D": "They are identical to the studies in Text 2."}, "optsZh": {"A": "它們證實所有螢幕時間都是有害的。", "B": "它們沒有區分不同種類的螢幕時間，因此呈現的面貌不完整。", "C": "它們證明螢幕能提升快樂。", "D": "它們與 Text 2 中的研究完全相同。"}, "answer": "B", "expl": "Text 2 says screen time differs by type, so it would say Text 1's studies ignore those differences.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Cross-Text Connections: predict how the author of one text would respond to studies described in another.", "vocab": false, "body": "Text 1<br>Several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nutrition\" target=\"_blank\" rel=\"noopener\">nutrition<\/a> studies in the 1980s found that people who ate more fat were more likely to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">develop<\/a> heart disease. Based on these results, many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expert\" target=\"_blank\" rel=\"noopener\" data-w=\"expert\" data-pos=\"n.\" data-en=\"a person with special knowledge or skill\" data-zh=\"專家\">experts<\/a> advised everyone to eat less fat.<br>Text 2<br>Researcher Walter Willett has shown that the type of fat matters. Fats from olive oil, nuts, and fish appear to protect the heart, while trans fats found in some processed foods greatly increase risk.", "bodyPlain": "Text 1\nSeveral nutrition studies in the 1980s found that people who ate more fat were more likely to develop heart disease. Based on these results, many experts advised everyone to eat less fat.\nText 2\nResearcher Walter Willett has shown that the type of fat matters. Fats from olive oil, nuts, and fish appear to protect the heart, while trans fats found in some processed foods greatly increase risk.", "stem": "Based on the texts, how would Willett (Text 2) most likely respond to the studies discussed in Text 1?", "stemZh": "根據這兩篇文章，Willett（Text 2）最可能如何回應 Text 1 中討論的研究？", "bodyZh": "Text 1\n1980 年代的幾項營養研究發現，吃較多脂肪的人較可能罹患心臟病。根據這些結果，許多專家建議大家少吃脂肪。\nText 2\n研究人員 Walter Willett 證明了脂肪的種類很重要。來自橄欖油、堅果和魚類的脂肪似乎能保護心臟，而某些加工食品中的反式脂肪則會大幅增加風險。", "opts": {"A": "By agreeing that people should avoid all types of fat", "B": "By arguing that heart disease has no connection to diet", "C": "By suggesting that the studies overlooked important differences between types of fat", "D": "By claiming that the studies used too many participants"}, "optsZh": {"A": "同意人們應該避免所有種類的脂肪", "B": "主張心臟病與飲食無關", "C": "暗示這些研究忽略了不同種類脂肪之間的重要差異", "D": "宣稱這些研究使用了太多受試者"}, "answer": "C", "expl": "Text 2 shows some types of fat are healthy, so the Text 1 studies treat all fat as the same.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Cross-Text Connections: predict how the author of one text would respond to studies described in another.", "vocab": false, "body": "Text 1<br>A review of several studies found that students who did more homework earned higher test scores. The reviewers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that all students benefit from more homework.<br>Text 2<br>Education <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> Harris Cooper found that the link between homework and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievement<\/a> is strong for high school students but almost nonexistent for elementary school students.", "bodyPlain": "Text 1\nA review of several studies found that students who did more homework earned higher test scores. The reviewers concluded that all students benefit from more homework.\nText 2\nEducation researcher Harris Cooper found that the link between homework and achievement is strong for high school students but almost nonexistent for elementary school students.", "stem": "Based on the texts, how would Cooper (Text 2) most likely respond to the conclusion in Text 1?", "stemZh": "根據這兩篇文章，Cooper（Text 2）最可能如何回應 Text 1 的結論？", "bodyZh": "Text 1\n一份針對多項研究的回顧發現，寫較多作業的學生考試成績較高。回顧者得出結論：所有學生都能從更多作業中受益。\nText 2\n教育研究者 Harris Cooper 發現，作業與成就之間的關聯對高中生很強，但對小學生幾乎不存在。", "opts": {"A": "By noting that the benefit of homework depends on students' age", "B": "By agreeing that every student benefits equally from homework", "C": "By arguing that homework lowers test scores for all students", "D": "By suggesting that the studies in Text 1 measured sleep instead of homework"}, "optsZh": {"A": "指出作業的益處取決於學生的年齡", "B": "同意每個學生都能從作業中同等受益", "C": "主張作業會降低所有學生的考試成績", "D": "暗示 Text 1 中的研究測量的是睡眠而非作業"}, "answer": "A", "expl": "Text 2 shows homework helps only older students, so Text 1's conclusion is too broad.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Cross-Text Connections: predict how the author of one text would respond to studies described in another.", "vocab": false, "body": "Text 1<br>Many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=studies\" target=\"_blank\" rel=\"noopener\">studies<\/a> have linked stress to poor health, including heart <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disease\" target=\"_blank\" rel=\"noopener\">disease<\/a> and weakened immunity. Based on this research, health <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaigns<\/a> often urge people to avoid stress whenever possible.<br>Text 2<br>Psychologist Kelly McGonigal argues that stress is not always harmful. Short-term stress, such as the nervousness before a race, can improve focus and performance, while long-lasting stress with no relief is what damages health.", "bodyPlain": "Text 1\nMany studies have linked stress to poor health, including heart disease and weakened immunity. Based on this research, health campaigns often urge people to avoid stress whenever possible.\nText 2\nPsychologist Kelly McGonigal argues that stress is not always harmful. Short-term stress, such as the nervousness before a race, can improve focus and performance, while long-lasting stress with no relief is what damages health.", "stem": "Based on the texts, how would McGonigal (Text 2) most likely respond to the advice in Text 1?", "stemZh": "根據這兩篇文章，McGonigal（Text 2）最可能如何回應 Text 1 的建議？", "bodyZh": "Text 1\n許多研究把壓力與健康不佳連結起來，包括心臟病與免疫力下降。根據這些研究，健康宣導常敦促人們盡可能避免壓力。\nText 2\n心理學家 Kelly McGonigal 主張，壓力並不總是有害的。短期壓力，例如比賽前的緊張，能提升專注力與表現，而長期且無法紓解的壓力才會損害健康。", "opts": {"A": "By agreeing that all stress should be avoided", "B": "By claiming that stress has no effect on health", "C": "By arguing that only physical stress matters", "D": "By pointing out that the advice ignores differences between short-term and long-term stress"}, "optsZh": {"A": "同意應該避免所有壓力", "B": "宣稱壓力對健康沒有影響", "C": "主張只有身體上的壓力才重要", "D": "指出這項建議忽略了短期與長期壓力之間的差異"}, "answer": "D", "expl": "Text 2 separates two types of stress, so it would say Text 1's view is incomplete.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Cross-Text Connections: predict how the author of one text would respond to studies described in another.", "vocab": false, "body": "Text 1<br>Studies of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bilingual\" target=\"_blank\" rel=\"noopener\" data-w=\"bilingual\" data-pos=\"adj.\" data-en=\"using or able to speak two languages\" data-zh=\"雙語的\">bilingual<\/a> children have found that they perform better on tests of attention than children who speak one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a>. Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that learning a second language improves attention.<br>Text 2<br>Linguist Ellen Bialystok notes that the benefits appear mainly in children who use both languages every day. Children who learned a second language but rarely use it show little advantage.", "bodyPlain": "Text 1\nStudies of bilingual children have found that they perform better on tests of attention than children who speak one language. Researchers concluded that learning a second language improves attention.\nText 2\nLinguist Ellen Bialystok notes that the benefits appear mainly in children who use both languages every day. Children who learned a second language but rarely use it show little advantage.", "stem": "Based on the texts, how would Bialystok (Text 2) most likely respond to the conclusion in Text 1?", "stemZh": "根據這兩篇文章，Bialystok（Text 2）最可能如何回應 Text 1 的結論？", "bodyZh": "Text 1\n針對雙語兒童的研究發現，他們在注意力測驗中的表現比只說一種語言的兒童好。研究人員得出結論：學習第二語言能提升注意力。\nText 2\n語言學家 Ellen Bialystok 指出，這些益處主要出現在每天使用兩種語言的兒童身上。學過第二語言但很少使用的兒童，幾乎沒有表現出優勢。", "opts": {"A": "By arguing that bilingual children have worse attention than other children", "B": "By noting that the conclusion overlooks how often children actually use both languages", "C": "By agreeing that any exposure to a second language improves attention", "D": "By claiming that attention cannot be measured"}, "optsZh": {"A": "主張雙語兒童的注意力比其他兒童差", "B": "指出這個結論忽略了兒童實際使用兩種語言的頻率", "C": "同意任何接觸第二語言的經驗都能提升注意力", "D": "宣稱注意力無法被測量"}, "answer": "B", "expl": "Text 2 shows that bilingual benefits depend on how often both languages are used, which Text 1 ignores.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Command of Evidence (Quantitative): use data from a graph or table to support a researcher's conclusion.", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percentage\" target=\"_blank\" rel=\"noopener\" data-w=\"percentage\" data-pos=\"n.\" data-en=\"an amount expressed as a part of 100\" data-zh=\"百分比\">Percentage<\/a> of Participants Who Selected the High-Added-Sugar Fruit Drink, by Front-of-Package <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">Condition<\/a> (table recreated because the original graph is unavailable)<br>Packaging condition | Selected high-added-sugar drink (%)<br>Claim and imagery (control) | 45<br>No claim | 40<br>No imagery | 43<br>No claim or imagery | 37<br>Percentage of juice disclosed | 44<br>Warning | 30<br>Added sugar in teaspoons | 35<br>The packaging of many fruit drinks contains health-related claims and imagery that can sometimes be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=misleading\" target=\"_blank\" rel=\"noopener\" data-w=\"misleading\" data-pos=\"adj.\" data-en=\"giving a wrong idea or impression\" data-zh=\"誤導的\">misleading<\/a> to parents who purchase such drinks for their children. To assess the impact of the front of packaging on consumers’ purchasing decisions, nutrition researchers Aviva A. Musicus, Christina A. Roberto, and Alyssa J. Moran conducted a study wherein participants were shown fruit drinks with high amounts of sugar added with seven different conditions of packaging: with claim and imagery (control), no claim, no imagery, no claim or imagery, disclosure of percentage of juice, a warning, and disclosure of amount of added sugar in teaspoons.<br>At the end of the study, the researchers concluded that the presence of warnings and absence of claims and imagery may reduce <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=likelihood\" target=\"_blank\" rel=\"noopener\" data-w=\"likelihood\" data-pos=\"n.\" data-en=\"the chance that something will happen\" data-zh=\"可能性\">likelihood<\/a> of purchase, whereas disclosure of percentage of juice may have very little impact.", "bodyPlain": "Percentage of Participants Who Selected the High-Added-Sugar Fruit Drink, by Front-of-Package Condition (table recreated because the original graph is unavailable)\nPackaging condition | Selected high-added-sugar drink (%)\nClaim and imagery (control) | 45\nNo claim | 40\nNo imagery | 43\nNo claim or imagery | 37\nPercentage of juice disclosed | 44\nWarning | 30\nAdded sugar in teaspoons | 35\nThe packaging of many fruit drinks contains health-related claims and imagery that can sometimes be misleading to parents who purchase such drinks for their children. To assess the impact of the front of packaging on consumers’ purchasing decisions, nutrition researchers Aviva A. Musicus, Christina A. Roberto, and Alyssa J. Moran conducted a study wherein participants were shown fruit drinks with high amounts of sugar added with seven different conditions of packaging: with claim and imagery (control), no claim, no imagery, no claim or imagery, disclosure of percentage of juice, a warning, and disclosure of amount of added sugar in teaspoons.\nAt the end of the study, the researchers concluded that the presence of warnings and absence of claims and imagery may reduce likelihood of purchase, whereas disclosure of percentage of juice may have very little impact.", "stem": "Which choice most effectively uses data from the graph to support the researchers’ conclusion?", "stemZh": "哪一個選項最有效地運用圖表中的數據來支持研究人員的結論？", "bodyZh": "依包裝正面條件區分，選擇高添加糖果汁飲料的受試者百分比（因原圖無法取得而重建為表格）\n包裝條件 | 選擇高添加糖飲料的比例（%）\n有健康宣稱與圖像（對照組）| 45\n無健康宣稱 | 40\n無圖像 | 43\n無健康宣稱也無圖像 | 37\n標示果汁百分比 | 44\n警示標語 | 30\n以茶匙標示添加糖量 | 35\n許多果汁飲料的包裝上有健康相關的宣稱與圖像，有時可能誤導為孩子購買這類飲料的家長。為了評估包裝正面對消費者購買決定的影響，營養研究人員 Aviva A.Musicus、Christina A.Roberto 與 Alyssa J.Moran 進行了一項研究，讓受試者看高添加糖的果汁飲料在七種不同包裝條件下的樣子：有健康宣稱與圖像（對照組）、無健康宣稱、無圖像、無宣稱也無圖像、標示果汁百分比、警示標語，以及以茶匙標示添加糖量。\n研究最後，研究人員得出結論：出現警示標語、以及沒有健康宣稱與圖像，可能會降低購買的可能性，而標示果汁百分比的影響可能很小。", "opts": {"A": "The percentage of participants who selected the high-added sugar fruit drink was highest when a warning was placed on the front of the packaging.", "B": "The percentage of participants who selected the high-added sugar fruit drink when the percentage of juice was disclosed on the front of the packaging was comparable to the percentage who selected the drink in the control group.", "C": "The absence of the claim had the same impact as did the absence of imagery from the front of the packaging.", "D": "When the front of packaging disclosed the amount of added sugar in teaspoons, participants were more likely to select a low-added sugar fruit drink than a high-added sugar fruit drink."}, "optsZh": {"A": "包裝正面有警示標語時，選擇高添加糖果汁飲料的受試者百分比最高。", "B": "包裝正面標示果汁百分比時，選擇高添加糖果汁飲料的受試者百分比，與對照組的百分比相近。", "C": "沒有健康宣稱的影響與包裝正面沒有圖像的影響相同。", "D": "包裝正面以茶匙標示添加糖量時，受試者比較可能選擇低添加糖的果汁飲料，而非高添加糖的。"}, "answer": "B", "expl": "The conclusion says juice-percentage disclosure has little impact; B shows that its rate (44%) was close to the control (45%).", "explZh": "結論說標示果汁百分比影響很小；B 指出其比例（44%）與對照組（45%）相近，正好支持結論。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Command of Evidence (Quantitative): use data from a graph or table to support a researcher's conclusion.", "vocab": false, "body": "Percentage of Shoppers Choosing a Sugary Cereal Under Four Label Conditions<br>Label <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">condition<\/a> | Shoppers choosing the cereal (%)<br>No label (control) | 48<br>Calorie count label | 46<br>Warning label | 29<br>Cartoon mascot removed | 37<br>Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that warning labels and removing cartoon mascots may reduce <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=purchase\" target=\"_blank\" rel=\"noopener\" data-w=\"purchase\" data-pos=\"v.\" data-en=\"to buy something\" data-zh=\"購買\">purchases<\/a>, whereas calorie labels may have very little effect.", "bodyPlain": "Percentage of Shoppers Choosing a Sugary Cereal Under Four Label Conditions\nLabel condition | Shoppers choosing the cereal (%)\nNo label (control) | 48\nCalorie count label | 46\nWarning label | 29\nCartoon mascot removed | 37\nResearchers concluded that warning labels and removing cartoon mascots may reduce purchases, whereas calorie labels may have very little effect.", "stem": "Which choice most effectively uses data from the table to support the researchers' conclusion?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持研究人員的結論？", "bodyZh": "四種標示條件下選擇含糖穀片的購物者百分比\n標示條件 | 選擇該穀片的購物者（%）\n無標示（對照組）| 48\n熱量標示 | 46\n警示標示 | 29\n移除卡通吉祥物 | 37\n研究人員得出結論：警示標示與移除卡通吉祥物可能會減少購買，而熱量標示的影響可能很小。", "opts": {"A": "The percentage of shoppers choosing the cereal was highest when a warning label was shown.", "B": "The percentage of shoppers choosing the cereal with a calorie count label (46%) was close to the percentage in the control condition (48%).", "C": "Removing the cartoon mascot had the same effect as adding a warning label.", "D": "More shoppers chose the cereal with a warning label than with no label."}, "optsZh": {"A": "出現警示標示時，選擇該穀片的購物者百分比最高。", "B": "有熱量標示時選擇該穀片的購物者百分比（46%）與對照組（48%）相近。", "C": "移除卡通吉祥物的效果與加上警示標示相同。", "D": "選擇有警示標示之穀片的購物者比無標示的多。"}, "answer": "B", "expl": "The conclusion is that labels have little effect; B shows sales with labels were about the same as without.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Command of Evidence (Quantitative): use data from a graph or table to support a researcher's conclusion.", "vocab": false, "body": "Average Afternoon Surface Temperature of Two Playgrounds (°C)<br>Month | Shaded playground | Unshaded playground<br>June | 31 | 47<br>July | 33 | 51<br>August | 32 | 49<br>City planners <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that adding shade <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a> keeps playground <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surfaces<\/a> cooler.", "bodyPlain": "Average Afternoon Surface Temperature of Two Playgrounds (°C)\nMonth | Shaded playground | Unshaded playground\nJune | 31 | 47\nJuly | 33 | 51\nAugust | 32 | 49\nCity planners hypothesized that adding shade structures keeps playground surfaces cooler.", "stem": "Which choice most effectively uses data from the table to support the planners' hypothesis?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持規劃人員的假設？", "bodyZh": "兩座遊樂場下午的平均地面溫度（°C）\n月份 | 有遮蔭的遊樂場 | 無遮蔭的遊樂場\n6 月 | 31 | 47\n7 月 | 33 | 51\n8 月 | 32 | 49\n城市規劃人員提出假設：增設遮陽設施能讓遊樂場地面保持較涼爽。", "opts": {"A": "In July, the shaded playground averaged 33°C while the unshaded playground averaged 51°C.", "B": "The unshaded playground was coolest in June.", "C": "Both playgrounds were warmest in July.", "D": "The shaded playground was 47°C in June."}, "optsZh": {"A": "七月時，有遮蔭的遊樂場平均 33°C，而無遮蔭的遊樂場平均 51°C。", "B": "無遮蔭的遊樂場在六月最涼爽。", "C": "兩座遊樂場都在七月最熱。", "D": "有遮蔭的遊樂場在六月是 47°C。"}, "answer": "A", "expl": "The hypothesis is that shade lowers temperature; A shows the shaded playground was cooler.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Command of Evidence (Quantitative): use data from a graph or table to support a researcher's conclusion.", "vocab": false, "body": "Average <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reading\" target=\"_blank\" rel=\"noopener\">Reading<\/a> Scores Before and After a New Reading <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=program\" target=\"_blank\" rel=\"noopener\">Program<\/a><br>School | Before program | After program<br>North School | 62 | 78<br>South School | 58 | 75<br>East School | 65 | 80<br>Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that the new reading program raised students&#x27; reading scores.", "bodyPlain": "Average Reading Scores Before and After a New Reading Program\nSchool | Before program | After program\nNorth School | 62 | 78\nSouth School | 58 | 75\nEast School | 65 | 80\nResearchers concluded that the new reading program raised students' reading scores.", "stem": "Which choice most effectively uses data from the table to support the researchers' conclusion?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持研究人員的結論？", "bodyZh": "新閱讀計畫實施前後的平均閱讀分數\n學校 | 計畫前 | 計畫後\n北區學校 | 62 | 78\n南區學校 | 58 | 75\n東區學校 | 65 | 80\n研究人員得出結論：新的閱讀計畫提高了學生的閱讀分數。", "opts": {"A": "East School had the highest score before the program.", "B": "South School had the lowest score both before and after the program.", "C": "At all three schools, scores rose after the program, such as from 58 to 75 at South School.", "D": "North School and East School had similar scores before the program."}, "optsZh": {"A": "東區學校在計畫前分數最高。", "B": "南區學校在計畫前後的分數都是最低的。", "C": "三所學校在計畫實施後分數都提高了，例如南區學校從 58 分升到 75 分。", "D": "北區學校和東區學校在計畫前的分數相近。"}, "answer": "C", "expl": "The conclusion is that the new method improves results; C shows a large increase.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Command of Evidence (Quantitative): use data from a graph or table to support a researcher's conclusion.", "vocab": false, "body": "Average Commute Time Before and After a New Bridge Opened (<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=minutes\" target=\"_blank\" rel=\"noopener\">minutes<\/a>)<br>Route | Before bridge | After bridge<br>Route 1 | 52 | 31<br>Route 2 | 47 | 29<br>Route 3 | 40 | 38<br>Transportation <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=official\" target=\"_blank\" rel=\"noopener\" data-w=\"official\" data-pos=\"adj.\" data-en=\"approved by or coming from people in authority\" data-zh=\"正式的；官方的\">officials<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that the new bridge greatly shortened commutes on Routes 1 and 2 but had little effect on Route 3.", "bodyPlain": "Average Commute Time Before and After a New Bridge Opened (minutes)\nRoute | Before bridge | After bridge\nRoute 1 | 52 | 31\nRoute 2 | 47 | 29\nRoute 3 | 40 | 38\nTransportation officials concluded that the new bridge greatly shortened commutes on Routes 1 and 2 but had little effect on Route 3.", "stem": "Which choice most effectively uses data from the table to support the officials' conclusion?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持官員的結論？", "bodyZh": "新橋通車前後的平均通勤時間（分鐘）\n路線 | 通車前 | 通車後\n1 號路線 | 52 | 31\n2 號路線 | 47 | 29\n3 號路線 | 40 | 38\n交通官員得出結論：新橋大幅縮短了 1 號與 2 號路線的通勤時間，但對 3 號路線影響不大。", "opts": {"A": "Route 3 had the shortest commute before the bridge opened.", "B": "Route 1 had the longest commute after the bridge opened.", "C": "Commute times on all three routes increased after the bridge opened.", "D": "Commutes fell from 52 to 31 minutes on Route 1 and from 47 to 29 minutes on Route 2, but only from 40 to 38 minutes on Route 3."}, "optsZh": {"A": "新橋通車前，3 號路線的通勤時間最短。", "B": "新橋通車後，1 號路線的通勤時間最長。", "C": "新橋通車後，三條路線的通勤時間都增加了。", "D": "1 號路線的通勤時間從 52 分鐘降到 31 分鐘，2 號路線從 47 分鐘降到 29 分鐘，但 3 號路線只從 40 分鐘降到 38 分鐘。"}, "answer": "D", "expl": "The claim is that the bridge reduced travel time; D shows the decrease.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Command of Evidence (Quantitative): use data from a graph or table to support a researcher's conclusion.", "vocab": false, "body": "Average Number of Math <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=problems\" target=\"_blank\" rel=\"noopener\">Problems<\/a> Solved in 20 Minutes<br>Condition | Grade 7 | Grade 8<br>Silence | 18 | 21<br><a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">Background<\/a> music | 17 | 21<br>Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that background music had little effect on how many problems students solved.", "bodyPlain": "Average Number of Math Problems Solved in 20 Minutes\nCondition | Grade 7 | Grade 8\nSilence | 18 | 21\nBackground music | 17 | 21\nResearchers concluded that background music had little effect on how many problems students solved.", "stem": "Which choice most effectively uses data from the table to support the researchers' conclusion?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持研究人員的結論？", "bodyZh": "20 分鐘內解出的數學題平均數量\n條件 | 七年級 | 八年級\n安靜 | 18 | 21\n背景音樂 | 17 | 21\n研究人員得出結論：背景音樂對學生解出的題數影響不大。", "opts": {"A": "Grade 7 students solved 18 problems in silence and 17 with background music, and Grade 8 students solved 21 in both conditions.", "B": "Grade 8 students solved more problems than Grade 7 students.", "C": "Grade 7 students solved the fewest problems with background music.", "D": "No student solved more than 21 problems."}, "optsZh": {"A": "七年級學生在安靜時解出 18 題、有背景音樂時解出 17 題，而八年級學生在兩種條件下都解出 21 題。", "B": "八年級學生解出的題目比七年級學生多。", "C": "七年級學生在有背景音樂時解出的題目最少。", "D": "沒有學生解出超過 21 題。"}, "answer": "A", "expl": "The conclusion is that music did not affect focus; A shows similar scores in both conditions.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Command of Evidence (Textual): choose the quotation that best illustrates a character's warning or claim.", "vocab": false, "body": "“The Emerald Eyes” is an 1861 short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> by Gustavo Adolfo Bécquer, originally written in Spanish. In the story, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protagonist\" target=\"_blank\" rel=\"noopener\" data-w=\"protagonist\" data-pos=\"n.\" data-en=\"the main character in a story\" data-zh=\"主角\">protagonist<\/a>, Fernando, is continually drawn to a Poplar fountain in an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attempt\" target=\"_blank\" rel=\"noopener\" data-w=\"attempt\" data-pos=\"v.\" data-en=\"to try to do something\" data-zh=\"嘗試；企圖\">attempt<\/a> to learn the identity of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mysterious\" target=\"_blank\" rel=\"noopener\" data-w=\"mysterious\" data-pos=\"adj.\" data-en=\"hard to understand or explain\" data-zh=\"神秘的；難以解釋的\">mysterious<\/a> woman with emerald eyes. Fernando’s friend Iñigo is worried and tries to warn him to stay away from the fountain when he says, _______", "bodyPlain": "“The Emerald Eyes” is an 1861 short story by Gustavo Adolfo Bécquer, originally written in Spanish. In the story, the protagonist, Fernando, is continually drawn to a Poplar fountain in an attempt to learn the identity of a mysterious woman with emerald eyes. Fernando’s friend Iñigo is worried and tries to warn him to stay away from the fountain when he says, _______", "stem": "Which quotation from a translation of the “The Emerald Eyes” most effectively illustrates the claim?", "stemZh": "〈翡翠眼睛〉譯本中的哪一句引文最能有效說明這個主張？", "bodyZh": "〈翡翠眼睛〉是 Gustavo Adolfo Bécquer 於 1861 年以西班牙文寫成的短篇小說。故事中，主角 Fernando 不斷被一座白楊泉吸引，想查出一位有著翡翠色眼睛的神秘女子的身分。Fernando 的朋友 Iñigo 很擔心，試著警告他遠離泉水，他說：_______", "opts": {"A": "“Do you not see that [the stag] is going toward the fountain of the Poplars, and if he lives to reach it we must give him up for lost?”", "B": "“I exposed myself to death under his horse’s hoofs to hold him back.”", "C": "“You do not go to the mountains now preceded by the clamorous pack of hounds, nor does the blare of your horns awake the echoes.”", "D": "“I conjure you by that which you love most on earth not to return to the fountain of the Poplars.”"}, "optsZh": {"A": "「你沒看到那頭雄鹿正朝白楊泉跑去嗎？如果牠活著跑到那裡，我們就只好放棄牠了。」", "B": "「我冒著被他的馬蹄踩死的危險去攔住他。」", "C": "「你現在上山時，不再有喧鬧的獵犬群在前開路，你的號角聲也不再喚起回音。」", "D": "「我以你在世上最愛的一切懇求你，不要再回到白楊泉。」"}, "answer": "D", "expl": "Only D is a direct warning to Fernando not to return to the fountain.", "explZh": "只有 D 直接警告 Fernando 不要回到泉水邊。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Command of Evidence (Textual): choose the quotation that best illustrates a character's warning or claim.", "vocab": false, "body": "In Louisa May Alcott&#x27;s novel Little Women (1868), Meg <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=worries\" target=\"_blank\" rel=\"noopener\">worries<\/a> that her sister Jo is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=working\" target=\"_blank\" rel=\"noopener\">working<\/a> too hard at her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=writing\" target=\"_blank\" rel=\"noopener\">writing<\/a> and tries to warn her when she says, _______", "bodyPlain": "In Louisa May Alcott's novel Little Women (1868), Meg worries that her sister Jo is working too hard at her writing and tries to warn her when she says, _______", "stem": "Which quotation from Little Women most effectively illustrates the claim?", "stemZh": "《小婦人》中的哪一句引文最能有效說明這個主張？", "bodyZh": "在 Louisa May Alcott 的小說《小婦人》（1868）中，Meg 擔心妹妹 Jo 寫作太過勞累，試著警告她時說：_______", "opts": {"A": "\"Jo, your stories are getting better every week.\"", "B": "\"I wish I could write half as well as you.\"", "C": "\"The publisher will surely want your next story.\"", "D": "\"Please stop before you make yourself ill, Jo; no story is worth your health.\""}, "optsZh": {"A": "「Jo，你的故事每週都越寫越好。」", "B": "「真希望我能寫得有你一半好。」", "C": "「出版商一定會想要你的下一個故事。」", "D": "「Jo，拜託在你把自己累病之前停下來；沒有任何故事值得你賠上健康。」"}, "answer": "D", "expl": "Only D directly urges Jo to stop, which is a warning.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Command of Evidence (Textual): choose the quotation that best illustrates a character's warning or claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folktale\" target=\"_blank\" rel=\"noopener\">folktale<\/a>, a young <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=woodcutter\" target=\"_blank\" rel=\"noopener\">woodcutter<\/a> wants to enter the Dark Forest to find a magic flower. His friend Ilse is afraid for him and tries to warn him when she says, _______", "bodyPlain": "In a folktale, a young woodcutter wants to enter the Dark Forest to find a magic flower. His friend Ilse is afraid for him and tries to warn him when she says, _______", "stem": "Which quotation from the folktale most effectively illustrates the claim?", "stemZh": "這則民間故事中的哪一句引文最能有效說明這個主張？", "bodyZh": "在一則民間故事中，一位年輕的樵夫想進入黑暗森林尋找一朵魔法花。他的朋友 Ilse 替他擔心，試著警告他時說：_______", "opts": {"A": "\"The flower is said to glow like the moon.\"", "B": "\"Promise me you will not set foot in the Dark Forest; no one who enters it returns.\"", "C": "\"I once saw a deer near the edge of the forest.\"", "D": "\"Your axe is the sharpest in the village.\""}, "optsZh": {"A": "「據說那朵花會像月亮一樣發光。」", "B": "「答應我你不會踏進黑暗森林一步；進去的人沒有一個回來。」", "C": "「我曾在森林邊緣看到一隻鹿。」", "D": "「你的斧頭是村裡最鋒利的。」"}, "answer": "B", "expl": "B shows the character urging the friend not to go into the forest—a warning.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Command of Evidence (Textual): choose the quotation that best illustrates a character's warning or claim.", "vocab": false, "body": "In a short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a>&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=grandmother\" target=\"_blank\" rel=\"noopener\">grandmother<\/a> takes great pride in her garden, as shown when she says, _______", "bodyPlain": "In a short story, the narrator's grandmother takes great pride in her garden, as shown when she says, _______", "stem": "Which quotation from the story most effectively illustrates the claim?", "stemZh": "這篇故事中的哪一句引文最能有效說明這個主張？", "bodyZh": "在一篇短篇小說中，敘述者的祖母對她的花園非常自豪，這可以從她說的話看出來：_______", "opts": {"A": "\"No one in the county grows roses as fine as mine, and everyone who passes stops to admire them.\"", "B": "\"The rain has been heavy this week.\"", "C": "\"I bought these seeds at the market in town.\"", "D": "\"Gardening makes my back ache terribly.\""}, "optsZh": {"A": "「全郡沒有人種的玫瑰比我的更美，每個經過的人都會停下來欣賞。」", "B": "「這週雨下得很大。」", "C": "「這些種子是我在鎮上市場買的。」", "D": "「園藝讓我的背痛得要命。」"}, "answer": "A", "expl": "A expresses the character's pride in her garden, matching the claim.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Command of Evidence (Textual): choose the quotation that best illustrates a character's warning or claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=retelling\" target=\"_blank\" rel=\"noopener\" data-w=\"retelling\" data-pos=\"n.\" data-en=\"a new version of a story told before\" data-zh=\"重述；改寫\">retelling<\/a> of the Odyssey, Odysseus&#x27;s crew fears the Cyclops and tries to warn their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=captain\" target=\"_blank\" rel=\"noopener\" data-w=\"captain\" data-pos=\"n.\" data-en=\"the person in charge of a ship\" data-zh=\"船長\">captain<\/a> when one sailor says, _______", "bodyPlain": "In a retelling of the Odyssey, Odysseus's crew fears the Cyclops and tries to warn their captain when one sailor says, _______", "stem": "Which quotation from the retelling most effectively illustrates the claim?", "stemZh": "這部改寫版本中的哪一句引文最能有效說明這個主張？", "bodyZh": "在一部《奧德賽》的改寫版本中，奧德修斯的船員害怕獨眼巨人，其中一位水手試著警告船長時說：_______", "opts": {"A": "\"The island has fresh water and plenty of goats.\"", "B": "\"Our ship is the fastest on the sea.\"", "C": "\"Captain, do not shout your name to the giant; if he learns who you are, his anger will follow us forever.\"", "D": "\"I have never seen a cave so large.\""}, "optsZh": {"A": "「這座島上有淡水和很多山羊。」", "B": "「我們的船是海上最快的。」", "C": "「船長，別對巨人喊出你的名字；如果他知道你是誰，他的怒火會永遠追著我們。」", "D": "「我從沒見過這麼大的洞穴。」"}, "answer": "C", "expl": "C shows Odysseus's crew member urging him not to anger the Cyclops—a warning.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Command of Evidence (Textual): choose the quotation that best illustrates a character's warning or claim.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=children\" target=\"_blank\" rel=\"noopener\">children<\/a>&#x27;s novel, the main <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=character\" target=\"_blank\" rel=\"noopener\">character<\/a>, Tomás, is afraid of the dark, as shown when he says, _______", "bodyPlain": "In a children's novel, the main character, Tomás, is afraid of the dark, as shown when he says, _______", "stem": "Which quotation from the novel most effectively illustrates the claim?", "stemZh": "這本小說中的哪一句引文最能有效說明這個主張？", "bodyZh": "在一本兒童小說中，主角 Tomás 怕黑，這可以從他說的話看出來：_______", "opts": {"A": "\"Tomorrow I will go to the beach with my cousins.\"", "B": "\"My favorite food is my grandmother's soup.\"", "C": "\"The stars look beautiful tonight.\"", "D": "\"Please leave the hall light on; I can't sleep when the room is completely black.\""}, "optsZh": {"A": "「明天我要和表兄弟姊妹去海邊。」", "B": "「我最喜歡的食物是祖母煮的湯。」", "C": "「今晚的星星看起來很美。」", "D": "「請讓走廊的燈開著；房間全黑的時候我睡不著。」"}, "answer": "D", "expl": "D shows the character's fear of the dark, which is the claim.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence (Textual): choose the quotation from a critic that best supports a student's claim.", "vocab": false, "body": "Anthony Doerr won a Pulitzer Prize, among other literary awards, for his work in fiction novels, and his short stories have been anthologized in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collections<\/a> of American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>. In an essay about Doerr’s works, a student claims that Doerr uses children as his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protagonist\" target=\"_blank\" rel=\"noopener\" data-w=\"protagonist\" data-pos=\"n.\" data-en=\"the main character in a story\" data-zh=\"主角\">protagonists<\/a> in order to create a story from an unbiased and hopeful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspective<\/a> of humanity.", "bodyPlain": "Anthony Doerr won a Pulitzer Prize, among other literary awards, for his work in fiction novels, and his short stories have been anthologized in collections of American literature. In an essay about Doerr’s works, a student claims that Doerr uses children as his protagonists in order to create a story from an unbiased and hopeful perspective of humanity.", "stem": "Which quotation from a literary critic best supports the student’s claim?", "stemZh": "哪一句文學評論家的引文最能支持這名學生的主張？", "bodyZh": "Anthony Doerr 憑藉小說作品贏得了普立茲獎等文學獎項，他的短篇小說也被收錄在美國文學選集中。在一篇關於 Doerr 作品的文章中，一名學生主張 Doerr 以兒童作為主角，是為了從一個不帶偏見、對人性充滿希望的視角來敘述故事。", "opts": {"A": "“Doerr’s novels are influenced by the themes present in fables, thus presenting an ordeal through which the protagonist learns a lesson about life.”", "B": "“Doerr prefers to have the protagonist’s story told through the eyes of a child who seeks to learn more about the world.”", "C": "“Doerr’s novels often contain multiple story arcs or perspectives culminating in a universal truth.”", "D": "“Doerr’s protagonists are often children who see the world with an open mind and contribute towards the betterment of humanity.”"}, "optsZh": {"A": "「Doerr 的小說受到寓言主題的影響，呈現主角從一場磨難中學到人生教訓。」", "B": "「Doerr 偏好透過一個想更認識世界的孩子的眼睛來講述主角的故事。」", "C": "「Doerr 的小說常包含多條故事線或多重視角，最終匯聚成一個普世真理。」", "D": "「Doerr 的主角常是以開放心胸看待世界、並為人類的進步做出貢獻的孩子。」"}, "answer": "D", "expl": "The claim is that Doerr's child protagonists offer an unbiased, hopeful view of humanity; D mentions children with open minds who help humanity. (The original key listed B.)", "explZh": "主張是 Doerr 的兒童主角提供不帶偏見、充滿希望的人性觀點；D 提到心胸開放、為人類貢獻的孩子，最能支持。（原答案列為 B，已修正為 D。）"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence (Textual): choose the quotation from a critic that best supports a student's claim.", "vocab": false, "body": "A student <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that author E.B. White uses animal characters to show the value of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=kindness\" target=\"_blank\" rel=\"noopener\" data-w=\"kindness\" data-pos=\"n.\" data-en=\"the quality of being friendly, generous, and caring\" data-zh=\"善意；仁慈\">kindness<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=friendship\" target=\"_blank\" rel=\"noopener\" data-w=\"friendship\" data-pos=\"n.\" data-en=\"a relationship between friends\" data-zh=\"友誼\">friendship<\/a>.", "bodyPlain": "A student claims that author E.B. White uses animal characters to show the value of kindness and friendship.", "stem": "Which quotation from a literary critic best supports the student's claim?", "stemZh": "哪一句文學評論家的引文最能支持這名學生的主張？", "bodyZh": "一名學生主張，作家 E.B. White 用動物角色來展現善良與友誼的價值。", "opts": {"A": "\"White's books are set mainly on farms in New England.\"", "B": "\"White wrote for The New Yorker for many years.\"", "C": "\"White's animal characters, such as Charlotte the spider, teach readers that true friendship means caring for others without expecting anything in return.\"", "D": "\"White's stories are often read aloud in classrooms.\""}, "optsZh": {"A": "「White 的書大多以新英格蘭的農場為背景。」", "B": "「White 多年來為《紐約客》撰稿。」", "C": "「White 的動物角色，例如蜘蛛夏綠蒂，教導讀者真正的友誼是不求回報地關心他人。」", "D": "「White 的故事常在課堂上被朗讀。」"}, "answer": "C", "expl": "The claim is about using animals to show kindness; C states exactly that.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Command of Evidence (Textual): choose the quotation from a critic that best supports a student's claim.", "vocab": false, "body": "A student <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that poet Emily Dickinson uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> from nature to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=express\" target=\"_blank\" rel=\"noopener\" data-w=\"express\" data-pos=\"v.\" data-en=\"to show a feeling or opinion in words or actions\" data-zh=\"表達\">express<\/a> feelings of loneliness.", "bodyPlain": "A student claims that poet Emily Dickinson uses images from nature to express feelings of loneliness.", "stem": "Which quotation from a literary critic best supports the student's claim?", "stemZh": "哪一句文學評論家的引文最能支持這名學生的主張？", "bodyZh": "一名學生主張，詩人 Emily Dickinson 用大自然的意象來表達孤獨的感受。", "opts": {"A": "\"In Dickinson's poems, a single bird or a bare winter tree often stands for the speaker's sense of being alone.\"", "B": "\"Dickinson wrote nearly 1,800 poems during her life.\"", "C": "\"Dickinson rarely left her family home in Amherst.\"", "D": "\"Dickinson's poems use unusual dashes and capital letters.\""}, "optsZh": {"A": "「在 Dickinson 的詩中，一隻孤鳥或一棵光禿的冬樹常代表說話者孤單的感受。」", "B": "「Dickinson 一生寫了將近 1,800 首詩。」", "C": "「Dickinson 很少離開她在阿默斯特的家。」", "D": "「Dickinson 的詩使用不尋常的破折號和大寫字母。」"}, "answer": "A", "expl": "The claim is that the poet uses nature to express loneliness; A says exactly this.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Command of Evidence (Textual): choose the quotation from a critic that best supports a student's claim.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that author Rick Riordan <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=creates\" target=\"_blank\" rel=\"noopener\">creates<\/a> heroes who succeed by using their intelligence rather than their strength.", "bodyPlain": "A student claims that author Rick Riordan creates heroes who succeed by using their intelligence rather than their strength.", "stem": "Which quotation from a literary critic best supports the student's claim?", "stemZh": "哪一句文學評論家的引文最能支持這名學生的主張？", "bodyZh": "一名學生主張，作家 Rick Riordan 塑造的英雄是靠智慧而非力量獲勝。", "opts": {"A": "\"Riordan's novels are based on Greek mythology.\"", "B": "\"Riordan was a middle school teacher before becoming a full-time writer.\"", "C": "\"Riordan's books have sold millions of copies around the world.\"", "D": "\"Again and again, Riordan's young heroes escape danger by solving riddles and outthinking monsters rather than by overpowering them.\""}, "optsZh": {"A": "「Riordan 的小說以希臘神話為基礎。」", "B": "「Riordan 在成為全職作家之前是國中老師。」", "C": "「Riordan 的書在全世界賣出了數百萬本。」", "D": "「Riordan 的少年英雄一次又一次靠解開謎語、智取怪物而非以力量壓制它們來脫離險境。」"}, "answer": "D", "expl": "The claim is about heroes who solve problems with intelligence; D says this directly.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Command of Evidence (Textual): choose the quotation from a critic that best supports a student's claim.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that author Lois Lowry&#x27;s novels show <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=characters\" target=\"_blank\" rel=\"noopener\">characters<\/a> finding hope even in very difficult situations.", "bodyPlain": "A student claims that author Lois Lowry's novels show characters finding hope even in very difficult situations.", "stem": "Which quotation from a literary critic best supports the student's claim?", "stemZh": "哪一句文學評論家的引文最能支持這名學生的主張？", "bodyZh": "一名學生主張，作家 Lois Lowry 的小說呈現角色即使在非常艱難的處境中也能找到希望。", "opts": {"A": "\"Lowry has won the Newbery Medal twice.\"", "B": "\"Even in the darkest moments of Lowry's novels, her young characters hold on to small signs of hope that carry them forward.\"", "C": "\"Lowry's books are often taught in middle school.\"", "D": "\"Lowry began writing after raising four children.\""}, "optsZh": {"A": "「Lowry 兩度獲得紐伯瑞獎。」", "B": "「即使在 Lowry 小說最黑暗的時刻，她的年輕角色仍緊握著微小的希望跡象，支撐他們繼續前進。」", "C": "「Lowry 的書常在國中課堂中教授。」", "D": "「Lowry 在養大四個孩子之後才開始寫作。」"}, "answer": "B", "expl": "The claim is about hope in hard times; B directly supports it.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Command of Evidence (Textual): choose the quotation from a critic that best supports a student's claim.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=student\" target=\"_blank\" rel=\"noopener\">student<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that author Jason Reynolds presents the city itself as an important character that shapes the lives of his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protagonist\" target=\"_blank\" rel=\"noopener\" data-w=\"protagonist\" data-pos=\"n.\" data-en=\"the main character in a story\" data-zh=\"主角\">protagonists<\/a>.", "bodyPlain": "A student claims that author Jason Reynolds presents the city itself as an important character that shapes the lives of his protagonists.", "stem": "Which quotation from a literary critic best supports the student's claim?", "stemZh": "哪一句文學評論家的引文最能支持這名學生的主張？", "bodyZh": "一名學生主張，作家 Jason Reynolds 把城市本身呈現為一個塑造主角人生的重要角色。", "opts": {"A": "\"Reynolds writes in a style that often resembles poetry.\"", "B": "\"Reynolds has written more than a dozen books for young readers.\"", "C": "\"In Reynolds's novels, the neighborhood streets, corner stores, and elevators act almost like characters, shaping every choice his young protagonists make.\"", "D": "\"Reynolds grew up in Washington, D.C.\""}, "optsZh": {"A": "「Reynolds 的寫作風格常常像詩一樣。」", "B": "「Reynolds 已為年輕讀者寫了十幾本書。」", "C": "「在 Reynolds 的小說中，社區街道、街角商店和電梯幾乎就像角色一樣，影響著年輕主角做的每一個選擇。」", "D": "「Reynolds 在華盛頓特區長大。」"}, "answer": "C", "expl": "The claim is about the city as a character; C states this.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Command of Evidence (Quantitative): use table data to support a hypothesis that two conditions produce equal effects.", "vocab": false, "body": "Average Need Satisfaction and Mood Ratings (scale of 1 to 9) (table recreated because the original table is unavailable)<br>Condition | Need satisfaction (reflexive) | Mood (reflexive) | Need satisfaction (reflective) | Mood (reflective)<br>Excluded by human | 3.1 | 3.4 | 4.6 | 4.9<br>Excluded by computer | 3.2 | 3.5 | 5.3 | 5.6<br>Included by human | 6.8 | 6.9 | 6.9 | 7.0<br>Included by computer | 6.7 | 6.8 | 6.8 | 6.9<br>Social exclusion can have a detrimental impact on an individual’s mental and emotional state. Psychologists Melissa Jauch, Selma Carolin Rudert, and Rainer Greifeneder <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that individuals would <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equivalent\" target=\"_blank\" rel=\"noopener\" data-w=\"equivalent\" data-pos=\"n./adj.\" data-en=\"something equal in value or meaning; equal\" data-zh=\"等值物；相等的\">equivalent<\/a> effects of social exclusion regardless of whether the source of exclusion was human or computer. The researchers conducted a study in which subjects played a word riddle game. The subjects were grouped with other players who were computer-generated, though some subjects were told that they were playing with other humans. Throughout the game, the other players would either include the subjects or exclude them from participating. After the game, researchers measured the subjects’ need satisfaction (a psychological metric of the degree to which an individual’s basic needs are met) and mood on a scale of 1 to 9 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a> after the game (the reflexive stage) as well as after some time had passed (the reflective stage).", "bodyPlain": "Average Need Satisfaction and Mood Ratings (scale of 1 to 9) (table recreated because the original table is unavailable)\nCondition | Need satisfaction (reflexive) | Mood (reflexive) | Need satisfaction (reflective) | Mood (reflective)\nExcluded by human | 3.1 | 3.4 | 4.6 | 4.9\nExcluded by computer | 3.2 | 3.5 | 5.3 | 5.6\nIncluded by human | 6.8 | 6.9 | 6.9 | 7.0\nIncluded by computer | 6.7 | 6.8 | 6.8 | 6.9\nSocial exclusion can have a detrimental impact on an individual’s mental and emotional state. Psychologists Melissa Jauch, Selma Carolin Rudert, and Rainer Greifeneder hypothesized that individuals would experience equivalent effects of social exclusion regardless of whether the source of exclusion was human or computer. The researchers conducted a study in which subjects played a word riddle game. The subjects were grouped with o
