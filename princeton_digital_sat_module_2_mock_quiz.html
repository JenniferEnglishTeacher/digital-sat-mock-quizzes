ther players who were computer-generated, though some subjects were told that they were playing with other humans. Throughout the game, the other players would either include the subjects or exclude them from participating. After the game, researchers measured the subjects’ need satisfaction (a psychological metric of the degree to which an individual’s basic needs are met) and mood on a scale of 1 to 9 immediately after the game (the reflexive stage) as well as after some time had passed (the reflective stage).", "stem": "Which choice most effectively uses data from the table to support the researchers’ hypothesis?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持研究人員的假設？", "bodyZh": "平均需求滿足度與心情評分（1 到 9 分）（因原表無法取得而重建）\n條件 | 需求滿足度（反射階段）| 心情（反射階段）| 需求滿足度（反思階段）| 心情（反思階段）\n被人類排擠 | 3.1 | 3.4 | 4.6 | 4.9\n被電腦排擠 | 3.2 | 3.5 | 5.3 | 5.6\n被人類接納 | 6.8 | 6.9 | 6.9 | 7.0\n被電腦接納 | 6.7 | 6.8 | 6.8 | 6.9\n社會排擠可能對一個人的心理與情緒狀態造成不利影響。心理學家 Melissa Jauch、Selma Carolin Rudert 與 Rainer Greifeneder 提出假設：無論排擠來自人類還是電腦，個人受到的社會排擠影響都相同。研究人員進行了一項研究，讓受試者玩文字謎題遊戲。受試者被分組與電腦生成的其他玩家一起玩，但有些受試者被告知他們是在與其他真人玩。遊戲過程中，其他玩家會讓受試者參與，或把他們排除在外。遊戲結束後，研究人員在遊戲剛結束時（反射階段）以及一段時間之後（反思階段），以 1 到 9 分測量受試者的需求滿足度（衡量一個人基本需求被滿足程度的心理指標）與心情。", "opts": {"A": "At the reflexive stage, subjects’ ratings in both mood and need satisfaction when excluded by a human were comparable to the corresponding ratings when excluded by a computer.", "B": "Subjects reported higher mood and need satisfaction ratings when included than they did when excluded.", "C": "When included by a human or a computer, subjects exhibited lower need satisfaction at the reflective stage than they did at the reflexive stage.", "D": "Subjects experienced the highest mood rating when they believed they were socially included by a human."}, "optsZh": {"A": "在反射階段，受試者被人類排擠時的心情與需求滿足度評分，都與被電腦排擠時的相應評分相近。", "B": "受試者被接納時的心情與需求滿足度評分比被排擠時高。", "C": "被人類或電腦接納時，受試者在反思階段的需求滿足度比反射階段低。", "D": "受試者相信自己被人類接納時，心情評分最高。"}, "answer": "A", "expl": "The hypothesis is that exclusion by a human or a computer has equal effects; A shows nearly identical ratings for the two (3.1 vs. 3.2 and 3.4 vs. 3.5).", "explZh": "假設是被人類或電腦排擠的影響相同；A 顯示兩者評分幾乎一樣（3.1 對 3.2、3.4 對 3.5）。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Command of Evidence (Quantitative): use table data to support a hypothesis that two conditions produce equal effects.", "vocab": false, "body": "Average Trust Ratings (1 to 9) After Receiving Advice<br>Source of advice | Correct advice | Incorrect advice<br>Human <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expert\" target=\"_blank\" rel=\"noopener\" data-w=\"expert\" data-pos=\"n.\" data-en=\"a person with special knowledge or skill\" data-zh=\"專家\">expert<\/a> | 7.4 | 3.1<br>Robot | 7.3 | 3.0<br>Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that people would trust advice from a robot just as much as advice from a human expert.", "bodyPlain": "Average Trust Ratings (1 to 9) After Receiving Advice\nSource of advice | Correct advice | Incorrect advice\nHuman expert | 7.4 | 3.1\nRobot | 7.3 | 3.0\nResearchers hypothesized that people would trust advice from a robot just as much as advice from a human expert.", "stem": "Which choice most effectively uses data from the table to support the researchers' hypothesis?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持研究人員的假設？", "bodyZh": "接受建議後的平均信任評分（1 到 9 分）\n建議來源 | 正確建議 | 錯誤建議\n人類專家 | 7.4 | 3.1\n機器人 | 7.3 | 3.0\n研究人員提出假設：人們對機器人建議的信任程度，會和對人類專家建議的信任程度一樣。", "opts": {"A": "After correct advice, trust ratings were 7.4 for the human expert and 7.3 for the robot.", "B": "Trust ratings were higher after correct advice than after incorrect advice.", "C": "The lowest rating was given to the robot after incorrect advice.", "D": "The highest rating was given to the human expert after correct advice."}, "optsZh": {"A": "在正確建議後，人類專家的信任評分為 7.4，機器人為 7.3。", "B": "正確建議後的信任評分比錯誤建議後高。", "C": "機器人在給出錯誤建議後獲得最低評分。", "D": "人類專家在給出正確建議後獲得最高評分。"}, "answer": "A", "expl": "The hypothesis is that the effect is the same for robots and humans; A shows similar scores.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Command of Evidence (Quantitative): use table data to support a hypothesis that two conditions produce equal effects.", "vocab": false, "body": "Average Vocabulary Quiz Scores (out of 20)<br>Study method | Week 1 | Week 4<br>Paper <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flashcards\" target=\"_blank\" rel=\"noopener\">flashcards<\/a> | 14 | 17<br>App flashcards | 14 | 16<br>A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=teacher\" target=\"_blank\" rel=\"noopener\">teacher<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that students would learn vocabulary equally well with paper flashcards and app flashcards.", "bodyPlain": "Average Vocabulary Quiz Scores (out of 20)\nStudy method | Week 1 | Week 4\nPaper flashcards | 14 | 17\nApp flashcards | 14 | 16\nA teacher hypothesized that students would learn vocabulary equally well with paper flashcards and app flashcards.", "stem": "Which choice most effectively uses data from the table to support the teacher's hypothesis?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持老師的假設？", "bodyZh": "單字小考平均分數（滿分 20）\n學習方式 | 第 1 週 | 第 4 週\n紙本單字卡 | 14 | 17\nApp 單字卡 | 14 | 16\n一位老師提出假設：學生用紙本單字卡和 App 單字卡學單字的效果會一樣好。", "opts": {"A": "Scores rose for both groups between Week 1 and Week 4.", "B": "The highest score in the table was 17.", "C": "In Week 1, both the paper and the app groups averaged 14, and in Week 4 they averaged 17 and 16.", "D": "Students in the app group scored lower in Week 4 than in Week 1."}, "optsZh": {"A": "第 1 週到第 4 週之間，兩組的分數都提高了。", "B": "表格中的最高分是 17 分。", "C": "第 1 週紙本組和 App 組平均都是 14 分，第 4 週分別是 17 分和 16 分。", "D": "App 組學生第 4 週的分數比第 1 週低。"}, "answer": "C", "expl": "The hypothesis is equal learning; C shows nearly identical scores for both groups.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Command of Evidence (Quantitative): use table data to support a hypothesis that two conditions produce equal effects.", "vocab": false, "body": "Average Height of Tomato Plants (cm) After Six Weeks<br>Fertilizer | Sunny garden | Shady garden<br><a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organic\" target=\"_blank\" rel=\"noopener\" data-w=\"organic\" data-pos=\"adj.\" data-en=\"grown without artificial chemicals\" data-zh=\"有機的\">Organic<\/a> | 82 | 61<br><a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">Chemical<\/a> | 81 | 60<br>Gardeners <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that organic and chemical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fertilizer\" target=\"_blank\" rel=\"noopener\" data-w=\"fertilizer\" data-pos=\"n.\" data-en=\"a substance added to soil to help plants grow\" data-zh=\"肥料\">fertilizers<\/a> would produce equal plant growth.", "bodyPlain": "Average Height of Tomato Plants (cm) After Six Weeks\nFertilizer | Sunny garden | Shady garden\nOrganic | 82 | 61\nChemical | 81 | 60\nGardeners hypothesized that organic and chemical fertilizers would produce equal plant growth.", "stem": "Which choice most effectively uses data from the table to support the gardeners' hypothesis?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持園丁們的假設？", "bodyZh": "六週後番茄植株的平均高度（公分）\n肥料 | 向陽花園 | 背陰花園\n有機肥 | 82 | 61\n化學肥 | 81 | 60\n園丁們提出假設：有機肥和化學肥會讓植物長得一樣好。", "opts": {"A": "Plants grew taller in the sunny garden than in the shady garden.", "B": "In the sunny garden, plants averaged 82 cm with organic fertilizer and 81 cm with chemical fertilizer.", "C": "The shortest plants were in the shady garden.", "D": "Plants given chemical fertilizer in the shady garden were 60 cm tall."}, "optsZh": {"A": "向陽花園的植株比背陰花園的長得高。", "B": "在向陽花園中，用有機肥的植株平均 82 公分，用化學肥的平均 81 公分。", "C": "最矮的植株在背陰花園。", "D": "在背陰花園中使用化學肥的植株高 60 公分。"}, "answer": "B", "expl": "The hypothesis is that the two fertilizers work equally; B shows nearly identical heights.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Command of Evidence (Quantitative): use table data to support a hypothesis that two conditions produce equal effects.", "vocab": false, "body": "Average Student Satisfaction Ratings (1 to 10)<br>Class format | Beginning of term | End of term<br>In-person | 7.2 | 7.8<br>Online | 7.1 | 7.8<br>A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=university\" target=\"_blank\" rel=\"noopener\">university<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that students would be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equally\" target=\"_blank\" rel=\"noopener\">equally<\/a> satisfied with online and in-person classes.", "bodyPlain": "Average Student Satisfaction Ratings (1 to 10)\nClass format | Beginning of term | End of term\nIn-person | 7.2 | 7.8\nOnline | 7.1 | 7.8\nA university hypothesized that students would be equally satisfied with online and in-person classes.", "stem": "Which choice most effectively uses data from the table to support the hypothesis?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持這個假設？", "bodyZh": "學生平均滿意度評分（1 到 10 分）\n上課形式 | 學期初 | 學期末\n實體課 | 7.2 | 7.8\n線上課 | 7.1 | 7.8\n一所大學提出假設：學生對線上課和實體課的滿意度會相同。", "opts": {"A": "Satisfaction increased in both formats during the term.", "B": "The lowest rating was 7.1.", "C": "In-person classes had a slightly higher rating at the beginning of the term.", "D": "At the end of the term, in-person and online classes both received an average rating of 7.8."}, "optsZh": {"A": "兩種上課形式的滿意度在學期中都提高了。", "B": "最低評分是 7.1。", "C": "學期初時實體課的評分略高。", "D": "學期末時，實體課和線上課的平均評分都是 7.8。"}, "answer": "D", "expl": "The hypothesis is that online and in-person classes give equal satisfaction; D shows equal ratings.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Command of Evidence (Quantitative): use table data to support a hypothesis that two conditions produce equal effects.", "vocab": false, "body": "Average Stress Ratings (1 to 9) While Studying<br>Background noise | During study | 10 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=minutes\" target=\"_blank\" rel=\"noopener\">minutes<\/a> after<br>Traffic noise | 6.2 | 4.1<br><a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=construction\" target=\"_blank\" rel=\"noopener\" data-w=\"construction\" data-pos=\"n.\" data-en=\"the process of building something\" data-zh=\"建造；營建\">Construction<\/a> noise | 6.3 | 4.0<br>Psychologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that traffic noise and construction noise would cause equal levels of stress.", "bodyPlain": "Average Stress Ratings (1 to 9) While Studying\nBackground noise | During study | 10 minutes after\nTraffic noise | 6.2 | 4.1\nConstruction noise | 6.3 | 4.0\nPsychologists hypothesized that traffic noise and construction noise would cause equal levels of stress.", "stem": "Which choice most effectively uses data from the table to support the psychologists' hypothesis?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持心理學家的假設？", "bodyZh": "讀書時的平均壓力評分（1 到 9 分）\n背景噪音 | 讀書時 | 10 分鐘後\n交通噪音 | 6.2 | 4.1\n施工噪音 | 6.3 | 4.0\n心理學家提出假設：交通噪音和施工噪音會造成相同程度的壓力。", "opts": {"A": "During study, stress ratings were 6.2 for traffic noise and 6.3 for construction noise.", "B": "Stress ratings dropped 10 minutes after studying for both types of noise.", "C": "The lowest rating was 4.0.", "D": "Construction noise produced the highest stress rating in the table."}, "optsZh": {"A": "讀書時，交通噪音的壓力評分為 6.2，施工噪音為 6.3。", "B": "讀書結束 10 分鐘後，兩種噪音的壓力評分都下降了。", "C": "最低評分是 4.0。", "D": "施工噪音產生了表格中最高的壓力評分。"}, "answer": "A", "expl": "The hypothesis is equal stress from both noises; A shows similar stress ratings.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Command of Evidence (Textual): choose the finding that would most directly support a scientist's claim about a shared origin.", "vocab": false, "body": "It is commonly accepted that the Cretaceous–Paleogene <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extinction\" target=\"_blank\" rel=\"noopener\" data-w=\"extinction\" data-pos=\"n.\" data-en=\"the dying out of a whole species\" data-zh=\"滅絕\">extinction<\/a> event some 66 million years ago was caused by an asteroid impact, believed to correspond to an impact crater in Chicxulub, Mexico, that dates to the same time and is the second-largest impact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> on Earth. Geologist Uisdean Nicholson discovered an undersea impact crater while reviewing seismic survey data and conducted a study that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=demonstrate\" target=\"_blank\" rel=\"noopener\" data-w=\"demonstrate\" data-pos=\"v.\" data-en=\"to show clearly by giving proof or examples\" data-zh=\"證明；展現\">demonstrated<\/a> that this crater also formed around 66 million years ago. Nicholson claims that the rock whose impact caused the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=formation\" target=\"_blank\" rel=\"noopener\" data-w=\"formation\" data-pos=\"n.\" data-en=\"the process by which something is formed\" data-zh=\"形成\">formation<\/a> of the undersea crater could have broken off from a parent asteroid that also caused the Chicxulub impact.", "bodyPlain": "It is commonly accepted that the Cretaceous–Paleogene extinction event some 66 million years ago was caused by an asteroid impact, believed to correspond to an impact crater in Chicxulub, Mexico, that dates to the same time and is the second-largest impact structure on Earth. Geologist Uisdean Nicholson discovered an undersea impact crater while reviewing seismic survey data and conducted a study that demonstrated that this crater also formed around 66 million years ago. Nicholson claims that the rock whose impact caused the formation of the undersea crater could have broken off from a parent asteroid that also caused the Chicxulub impact.", "stem": "Which finding, if true, would most directly support Nicholson’s claim?", "stemZh": "下列哪一項發現若為真，最能直接支持 Nicholson 的主張？", "bodyZh": "一般公認，約六千六百萬年前的白堊紀—古近紀滅絕事件是由小行星撞擊造成的，被認為與墨西哥希克蘇魯伯一個年代相同、地球上第二大的撞擊坑相對應。地質學家 Uisdean Nicholson 在檢視地震勘測資料時發現了一個海底撞擊坑，並進行研究證明這個坑同樣形成於約六千六百萬年前。Nicholson 主張，造成海底撞擊坑的岩石，可能是從同樣造成希克蘇魯伯撞擊的母小行星上斷裂下來的。", "opts": {"A": "The undersea impact would have caused major earthquakes and tsunamis, leading to significant damage to the planet.", "B": "Some evidence points to a gradual Cretaceous–Paleogene extinction rather than a sudden one caused by an asteroid.", "C": "Many species of marine animals, in addition to land animals, went extinct during the Cretaceous–Paleogene extinction.", "D": "The undersea impact crater contains some of the same minerals not normally found on Earth that were also found at the Chicxulub impact site."}, "optsZh": {"A": "海底撞擊會引發大地震和海嘯，對地球造成重大破壞。", "B": "有些證據顯示白堊紀—古近紀滅絕是漸進的，而不是由小行星造成的突然滅絕。", "C": "在白堊紀—古近紀滅絕事件中，除了陸地動物，許多海洋動物物種也滅絕了。", "D": "海底撞擊坑含有一些地球上通常找不到、但也在希克蘇魯伯撞擊地點發現的相同礦物。"}, "answer": "D", "expl": "If both craters contain the same unusual, non-Earth minerals, the two impacting rocks likely came from the same parent asteroid.", "explZh": "若兩個撞擊坑都含有相同、地球上罕見的礦物，兩顆撞擊岩石很可能來自同一顆母小行星。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Command of Evidence (Textual): choose the finding that would most directly support a scientist's claim about a shared origin.", "vocab": false, "body": "Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=meteorite\" target=\"_blank\" rel=\"noopener\" data-w=\"meteorite\" data-pos=\"n.\" data-en=\"a piece of rock from space that has landed on Earth\" data-zh=\"隕石\">meteorites<\/a> were found 300 kilometers apart in the Sahara Desert. Geologist Amina Diallo <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that both rocks broke off from the same <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=asteroid\" target=\"_blank\" rel=\"noopener\" data-w=\"asteroid\" data-pos=\"n.\" data-en=\"a small rocky object that orbits the Sun\" data-zh=\"小行星\">asteroid<\/a>.", "bodyPlain": "Two meteorites were found 300 kilometers apart in the Sahara Desert. Geologist Amina Diallo claims that both rocks broke off from the same asteroid.", "stem": "Which finding, if true, would most directly support Diallo's claim?", "stemZh": "下列哪一項發現若為真，最能直接支持 Diallo 的主張？", "bodyZh": "在撒哈拉沙漠中相距 300 公里的地方發現了兩顆隕石。地質學家 Amina Diallo 主張，這兩塊岩石都是從同一顆小行星上斷裂下來的。", "opts": {"A": "Meteorites are found more easily in deserts than in forests.", "B": "Both meteorites are heavier than most rocks of their size.", "C": "The Sahara receives very little rain.", "D": "Both meteorites contain the same rare mix of minerals that has never been found in any other meteorite."}, "optsZh": {"A": "在沙漠中比在森林中更容易找到隕石。", "B": "兩顆隕石都比同樣大小的大多數岩石重。", "C": "撒哈拉沙漠的降雨非常少。", "D": "兩顆隕石都含有相同、從未在其他隕石中發現的罕見礦物組合。"}, "answer": "D", "expl": "If both meteorites share unusual chemistry, they likely came from the same parent body.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Command of Evidence (Textual): choose the finding that would most directly support a scientist's claim about a shared origin.", "vocab": false, "body": "Wild horses live on two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=islands\" target=\"_blank\" rel=\"noopener\">islands<\/a> off the coast of North Carolina. Biologist Ken Lee <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that both groups <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=descended\" target=\"_blank\" rel=\"noopener\">descended<\/a> from horses that escaped from the same Spanish shipwreck.", "bodyPlain": "Wild horses live on two islands off the coast of North Carolina. Biologist Ken Lee claims that both groups descended from horses that escaped from the same Spanish shipwreck.", "stem": "Which finding, if true, would most directly support Lee's claim?", "stemZh": "下列哪一項發現若為真，最能直接支持 Lee 的主張？", "bodyZh": "北卡羅來納州外海的兩座島上住著野馬。生物學家 Ken Lee 主張，這兩群馬都是從同一艘西班牙沉船逃出的馬的後代。", "opts": {"A": "The horses on both islands eat mostly marsh grass.", "B": "DNA tests show that horses on both islands share a rare genetic marker found in old Spanish horse breeds.", "C": "The islands are often hit by hurricanes.", "D": "Tourists like to photograph the horses on both islands."}, "optsZh": {"A": "兩座島上的馬主要吃沼澤草。", "B": "DNA 檢測顯示，兩座島上的馬都帶有一種在古老西班牙馬種中發現的罕見遺傳標記。", "C": "這些島嶼經常遭受颶風侵襲。", "D": "遊客喜歡拍攝兩座島上的馬。"}, "answer": "B", "expl": "Matching DNA directly shows the two populations came from the same source.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Command of Evidence (Textual): choose the finding that would most directly support a scientist's claim about a shared origin.", "vocab": false, "body": "Pottery <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragment\" target=\"_blank\" rel=\"noopener\" data-w=\"fragment\" data-pos=\"n.\" data-en=\"a small broken piece of something\" data-zh=\"碎片\">fragments<\/a> have been found at two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> villages 50 kilometers apart. Archaeologist Rosa Medina <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that all the pottery was made in a single workshop.", "bodyPlain": "Pottery fragments have been found at two ancient villages 50 kilometers apart. Archaeologist Rosa Medina claims that all the pottery was made in a single workshop.", "stem": "Which finding, if true, would most directly support Medina's claim?", "stemZh": "下列哪一項發現若為真，最能直接支持 Medina 的主張？", "bodyZh": "在相距 50 公里的兩個古代村落發現了陶器碎片。考古學家 Rosa Medina 主張，所有陶器都是在同一個工坊製作的。", "opts": {"A": "The clay in fragments from both villages has an identical chemical makeup that matches a single riverbank near one village.", "B": "Both villages were abandoned around the same time.", "C": "The fragments are mostly from cooking pots.", "D": "The villages were connected by a footpath."}, "optsZh": {"A": "兩個村落出土碎片中的黏土化學成分完全相同，並與其中一個村落附近的一處河岸相符。", "B": "兩個村落大約在同一時間被廢棄。", "C": "這些碎片大多來自烹飪用的陶罐。", "D": "這兩個村落由一條步道相連。"}, "answer": "A", "expl": "Identical clay chemistry means the pots were likely made in the same place.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Command of Evidence (Textual): choose the finding that would most directly support a scientist's claim about a shared origin.", "vocab": false, "body": "Ash layers from about 74,000 years ago have been found in both India and Malaysia. Volcanologist Theo Grant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that both layers came from the same <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eruption\" target=\"_blank\" rel=\"noopener\">eruption<\/a> of Mount Toba.", "bodyPlain": "Ash layers from about 74,000 years ago have been found in both India and Malaysia. Volcanologist Theo Grant claims that both layers came from the same eruption of Mount Toba.", "stem": "Which finding, if true, would most directly support Grant's claim?", "stemZh": "下列哪一項發現若為真，最能直接支持 Grant 的主張？", "bodyZh": "在印度和馬來西亞都發現了約七萬四千年前的火山灰層。火山學家 Theo Grant 主張，這兩層火山灰都來自多巴火山的同一次噴發。", "opts": {"A": "Mount Toba is located in Indonesia.", "B": "Ash layers are common in many parts of Asia.", "C": "The ash from India and Malaysia has the same distinctive chemical fingerprint as rock samples taken from Mount Toba.", "D": "The eruption of Mount Toba was very large."}, "optsZh": {"A": "多巴火山位於印尼。", "B": "火山灰層在亞洲許多地方都很常見。", "C": "來自印度和馬來西亞的火山灰，與從多巴火山採集的岩石樣本有相同的獨特化學特徵。", "D": "多巴火山的噴發規模非常大。"}, "answer": "C", "expl": "If both ash layers share the volcano's chemical fingerprint, they likely came from that one eruption.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Command of Evidence (Textual): choose the finding that would most directly support a scientist's claim about a shared origin.", "vocab": false, "body": "Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unsigned\" target=\"_blank\" rel=\"noopener\">unsigned<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=letters\" target=\"_blank\" rel=\"noopener\">letters<\/a> from the 1700s were found in different libraries. Historian Laila Haddad <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> both were written by the same person.", "bodyPlain": "Two unsigned letters from the 1700s were found in different libraries. Historian Laila Haddad claims both were written by the same person.", "stem": "Which finding, if true, would most directly support Haddad's claim?", "stemZh": "下列哪一項發現若為真，最能直接支持 Haddad 的主張？", "bodyZh": "在不同的圖書館中發現了兩封 1700 年代未署名的信。歷史學家 Laila Haddad 主張，兩封信是同一個人寫的。", "opts": {"A": "Both letters were written in English.", "B": "Many letters from the 1700s are unsigned.", "C": "Both libraries are in London.", "D": "Both letters contain the same unusual spelling mistakes and the same distinctive way of forming the letter \"g.\""}, "optsZh": {"A": "兩封信都是用英文寫的。", "B": "許多 1700 年代的信件都沒有署名。", "C": "兩間圖書館都在倫敦。", "D": "兩封信都有相同的不尋常拼字錯誤，以及相同的獨特字母「g」寫法。"}, "answer": "D", "expl": "Identical handwriting quirks in both letters directly support a single author.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Inferences: complete a text with the conclusion suggested by a correlation between two measurements.", "vocab": false, "body": "In a study of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neuronal\" target=\"_blank\" rel=\"noopener\">neuronal<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sleeping\" target=\"_blank\" rel=\"noopener\">sleeping<\/a> patterns, researchers tracked the electrical waves (using EEG) and blood flow patterns (using fMRI) in participants while they slept. Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesized<\/a> that a correlation between electrical wave activity and blood flow patterns could indicate which regions of the brain, if any, fell asleep or awoke first. Like with previous studies, the researchers found that the thalamus, a region located near the center of the brain, had decreased blood flow patterns in association with increased electrical sleep waves in the early minutes of sleep activity. This suggests that _______", "bodyPlain": "In a study of neuronal sleeping patterns, researchers tracked the electrical waves (using EEG) and blood flow patterns (using fMRI) in participants while they slept. Researchers hypothesized that a correlation between electrical wave activity and blood flow patterns could indicate which regions of the brain, if any, fell asleep or awoke first. Like with previous studies, the researchers found that the thalamus, a region located near the center of the brain, had decreased blood flow patterns in association with increased electrical sleep waves in the early minutes of sleep activity. This suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項關於神經元睡眠模式的研究中，研究人員在受試者睡覺時追蹤他們的腦電波（使用腦電圖）與血流模式（使用功能性磁振造影）。研究人員提出假設：腦電波活動與血流模式之間的關聯，可以顯示大腦哪些區域（如果有的話）最先入睡或最先醒來。與先前的研究一樣，研究人員發現位於大腦中央附近的視丘，在睡眠開始的最初幾分鐘內，血流減少並伴隨睡眠腦波增加。這顯示 _______", "opts": {"A": "the thalamus is one of the first brain regions to fall asleep.", "B": "increased blood flow patterns in association with decreased electrical sleep waves indicate a brain region that is asleep.", "C": "the thalamus is the last brain region to fall asleep.", "D": "humans may use only one hemisphere of the brain while asleep."}, "optsZh": {"A": "視丘是最先入睡的腦區之一。", "B": "血流增加並伴隨睡眠腦波減少，代表該腦區處於睡眠狀態。", "C": "視丘是最後入睡的腦區。", "D": "人類睡覺時可能只使用一側大腦半球。"}, "answer": "A", "expl": "The thalamus showed sleep signs in the earliest minutes of sleep, suggesting it is one of the first regions to fall asleep.", "explZh": "視丘在入睡最初幾分鐘就出現睡眠跡象，顯示它是最先入睡的腦區之一。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Inferences: complete a text with the conclusion suggested by a correlation between two measurements.", "vocab": false, "body": "Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recorded\" target=\"_blank\" rel=\"noopener\">recorded<\/a> brain <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activity\" target=\"_blank\" rel=\"noopener\">activity<\/a> in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> as they fell asleep. Like earlier studies, they found that slow sleep waves appeared in the hippocampus before they appeared in most other brain regions. This suggests that _______", "bodyPlain": "Researchers recorded brain activity in volunteers as they fell asleep. Like earlier studies, they found that slow sleep waves appeared in the hippocampus before they appeared in most other brain regions. This suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "研究人員在志願者入睡時記錄他們的腦部活動。與先前的研究一樣，他們發現慢速睡眠波在海馬迴出現的時間，比在大多數其他腦區更早。這顯示 _______", "opts": {"A": "the hippocampus is one of the first brain regions to fall asleep.", "B": "the hippocampus does not sleep at all.", "C": "all brain regions fall asleep at exactly the same time.", "D": "slow sleep waves indicate that a region is fully awake."}, "optsZh": {"A": "海馬迴是最先入睡的腦區之一。", "B": "海馬迴完全不睡覺。", "C": "所有腦區都在完全相同的時間入睡。", "D": "慢速睡眠波表示該區域完全清醒。"}, "answer": "A", "expl": "Brain activity linked to sleep appearing first in the hippocampus suggests it falls asleep early.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Inferences: complete a text with the conclusion suggested by a correlation between two measurements.", "vocab": false, "body": "Scientists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measured\" target=\"_blank\" rel=\"noopener\">measured<\/a> muscle <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activity\" target=\"_blank\" rel=\"noopener\">activity<\/a> in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=runners\" target=\"_blank\" rel=\"noopener\">runners<\/a> after a marathon. They found that muscle activity in the legs dropped sharply within minutes, while activity in the arms and back dropped more slowly. This suggests that _______", "bodyPlain": "Scientists measured muscle activity in runners after a marathon. They found that muscle activity in the legs dropped sharply within minutes, while activity in the arms and back dropped more slowly. This suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "科學家在跑者跑完馬拉松後測量他們的肌肉活動。他們發現腿部肌肉活動在幾分鐘內急遽下降，而手臂與背部的活動下降得較慢。這顯示 _______", "opts": {"A": "the arms relax before the legs after a marathon.", "B": "runners use only their legs during a marathon.", "C": "the leg muscles are among the first to relax after a marathon.", "D": "muscle activity increases after a marathon."}, "optsZh": {"A": "跑完馬拉松後手臂比腿先放鬆。", "B": "跑者跑馬拉松時只用腿。", "C": "腿部肌肉是跑完馬拉松後最先放鬆的部位之一。", "D": "跑完馬拉松後肌肉活動會增加。"}, "answer": "C", "expl": "Muscle activity dropping first in the legs suggests the legs relax first.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Inferences: complete a text with the conclusion suggested by a correlation between two measurements.", "vocab": false, "body": "Botanists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographed<\/a> maple trees every day in autumn. They found that leaves at the top of each tree turned red about a week before leaves on the lower <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=branches\" target=\"_blank\" rel=\"noopener\">branches<\/a>. This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suggests\" target=\"_blank\" rel=\"noopener\">suggests<\/a> that _______", "bodyPlain": "Botanists photographed maple trees every day in autumn. They found that leaves at the top of each tree turned red about a week before leaves on the lower branches. This suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "植物學家在秋天每天拍攝楓樹的照片。他們發現每棵樹頂端的葉子變紅的時間，比下方枝條的葉子早約一週。這顯示 _______", "opts": {"A": "lower branches change color first.", "B": "the top of the tree may respond to autumn conditions before the lower branches do.", "C": "maple trees do not change color in autumn.", "D": "all leaves change color on the same day."}, "optsZh": {"A": "下方枝條先變色。", "B": "樹頂可能比下方枝條更早對秋季環境產生反應。", "C": "楓樹在秋天不會變色。", "D": "所有葉子都在同一天變色。"}, "answer": "B", "expl": "Leaves that change color first at the top suggest the top of the tree responds first to cold.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Inferences: complete a text with the conclusion suggested by a correlation between two measurements.", "vocab": false, "body": "In a study of how people <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognize<\/a> faces, researchers found that blood flow increased in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visual\" target=\"_blank\" rel=\"noopener\" data-w=\"visual\" data-pos=\"n.\" data-en=\"an image or picture used to show or explain something\" data-zh=\"視覺效果；影像\">visual<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cortex\" target=\"_blank\" rel=\"noopener\" data-w=\"cortex\" data-pos=\"n.\" data-en=\"the outer layer of the brain\" data-zh=\"皮質；大腦皮層\">cortex<\/a> about 100 milliseconds before it increased in areas linked to memory. This suggests that _______", "bodyPlain": "In a study of how people recognize faces, researchers found that blood flow increased in the visual cortex about 100 milliseconds before it increased in areas linked to memory. This suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項關於人如何辨識臉孔的研究中，研究人員發現視覺皮質的血流增加，比與記憶相關之區域的血流增加早約 100 毫秒。這顯示 _______", "opts": {"A": "memory areas activate before the visual cortex.", "B": "the visual cortex is not involved in recognizing faces.", "C": "blood flow does not change during face recognition.", "D": "the visual cortex is activated before memory areas when people recognize faces."}, "optsZh": {"A": "記憶區比視覺皮質先活化。", "B": "視覺皮質不參與臉孔辨識。", "C": "辨識臉孔時血流不會改變。", "D": "人辨識臉孔時，視覺皮質比記憶區先活化。"}, "answer": "D", "expl": "Blood flow increasing first in the visual cortex suggests it activates first.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Inferences: complete a text with the conclusion suggested by a correlation between two measurements.", "vocab": false, "body": "Using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=satellite\" target=\"_blank\" rel=\"noopener\">satellite<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a>, scientists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tracked\" target=\"_blank\" rel=\"noopener\">tracked<\/a> a frozen lake each spring. They found that the ice near the shore melted about ten days before the ice in the center. This suggests that _______", "bodyPlain": "Using satellite images, scientists tracked a frozen lake each spring. They found that the ice near the shore melted about ten days before the ice in the center. This suggests that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "科學家每年春天利用衛星影像追蹤一座結冰的湖。他們發現靠近岸邊的冰比湖中央的冰早約十天融化。這顯示 _______", "opts": {"A": "the edges of the lake warm up before the center does.", "B": "the center of the lake melts first.", "C": "the lake never freezes completely.", "D": "satellites cannot measure ice."}, "optsZh": {"A": "湖的邊緣比中央先變暖。", "B": "湖中央先融化。", "C": "這座湖從未完全結冰。", "D": "衛星無法測量冰。"}, "answer": "A", "expl": "Ice melting first at the edges suggests the edges warm first.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Inferences: apply a stated principle to predict which of two cases has a lower limit.", "vocab": false, "body": "In order to avoid physical damage, a formula is used to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculate\" target=\"_blank\" rel=\"noopener\" data-w=\"calculate\" data-pos=\"v.\" data-en=\"to find an answer using mathematics\" data-zh=\"計算\">calculate<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=maximum\" target=\"_blank\" rel=\"noopener\" data-w=\"maximum\" data-pos=\"adj.\" data-en=\"the largest possible amount\" data-zh=\"最大的；最高的\">maximum<\/a> gross weight for a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercial<\/a> vehicle traveling over a bridge. The Federal Bridge Gross Weight Formula takes into account not only the weight of the vehicle but also its number of axles (shafts for wheels) and the spacing between axles, given that a shorter vehicle with its weight concentrated in a smaller area could cause more damage than could a longer vehicle of the same weight whose mass is more dispersed. This suggests that, when comparing a two-axle vehicle to a four-axle vehicle, _______", "bodyPlain": "In order to avoid physical damage, a formula is used to calculate the maximum gross weight for a commercial vehicle traveling over a bridge. The Federal Bridge Gross Weight Formula takes into account not only the weight of the vehicle but also its number of axles (shafts for wheels) and the spacing between axles, given that a shorter vehicle with its weight concentrated in a smaller area could cause more damage than could a longer vehicle of the same weight whose mass is more dispersed. This suggests that, when comparing a two-axle vehicle to a four-axle vehicle, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "為了避免實體損壞，會用一個公式來計算商用車輛通過橋梁時的最大總重。聯邦橋梁總重公式不僅考慮車輛的重量，也考慮車軸（裝車輪的軸）數量與車軸間距，因為重量集中在較小面積的較短車輛，可能比同樣重量、但質量分布較分散的較長車輛造成更大的損害。這顯示，比較兩軸車與四軸車時，_______", "opts": {"A": "the four-axle vehicle likely has a lower weight limit on a given bridge than does the two-axle vehicle.", "B": "the vehicles likely have the same weight limit on a given bridge.", "C": "the two-axle vehicle is unlikely to surpass the bridge’s weight limit, as it is smaller.", "D": "the two-axle vehicle likely has a lower weight limit on a given bridge than does the four-axle vehicle."}, "optsZh": {"A": "在同一座橋上，四軸車的重量限制可能比兩軸車低。", "B": "這兩輛車在同一座橋上的重量限制可能相同。", "C": "兩軸車因為較小，不太可能超過橋的重量限制。", "D": "在同一座橋上，兩軸車的重量限制可能比四軸車低。"}, "answer": "D", "expl": "A vehicle with fewer axles concentrates its weight and causes more damage, so the two-axle vehicle would get the lower weight limit.", "explZh": "車軸較少的車輛重量較集中，造成的損害較大，所以兩軸車的重量限制較低。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Inferences: apply a stated principle to predict which of two cases has a lower limit.", "vocab": false, "body": "Builders know that a long wooden plank <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spreads\" target=\"_blank\" rel=\"noopener\">spreads<\/a> weight across more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=supports\" target=\"_blank\" rel=\"noopener\">supports<\/a> than a short plank, so a short plank with the same load is more likely to bend or break. This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suggests\" target=\"_blank\" rel=\"noopener\">suggests<\/a> that, when comparing a 2-meter plank with a 4-meter plank resting on the same number of supports per meter, _______", "bodyPlain": "Builders know that a long wooden plank spreads weight across more supports than a short plank, so a short plank with the same load is more likely to bend or break. This suggests that, when comparing a 2-meter plank with a 4-meter plank resting on the same number of supports per meter, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "建築工人知道，長木板會把重量分散到比短木板更多的支撐點上，所以承受相同負重的短木板較容易彎曲或斷裂。這顯示，比較每公尺支撐點數相同的 2 公尺木板與 4 公尺木板時，_______", "opts": {"A": "the 4-meter plank likely has a lower weight limit.", "B": "both planks likely have the same weight limit.", "C": "the 2-meter plank cannot hold any weight.", "D": "the 2-meter plank likely has a lower weight limit than the 4-meter plank."}, "optsZh": {"A": "4 公尺木板的承重限制可能較低。", "B": "兩塊木板的承重限制可能相同。", "C": "2 公尺木板完全無法承重。", "D": "2 公尺木板的承重限制可能比 4 公尺木板低。"}, "answer": "D", "expl": "Shorter boards concentrate weight, so the shorter board should have the lower limit.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Inferences: apply a stated principle to predict which of two cases has a lower limit.", "vocab": false, "body": "On soft sand, a wide tire <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spreads\" target=\"_blank\" rel=\"noopener\">spreads<\/a> a bike&#x27;s weight over a larger area, while a narrow tire <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=concentrates\" target=\"_blank\" rel=\"noopener\">concentrates<\/a> it, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=causing\" target=\"_blank\" rel=\"noopener\">causing<\/a> the tire to sink. This suggests that, when comparing a bike with 5-centimeter tires to one with 10-centimeter tires on the same beach, _______", "bodyPlain": "On soft sand, a wide tire spreads a bike's weight over a larger area, while a narrow tire concentrates it, causing the tire to sink. This suggests that, when comparing a bike with 5-centimeter tires to one with 10-centimeter tires on the same beach, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在鬆軟的沙地上，寬輪胎會把腳踏車的重量分散到較大的面積，而窄輪胎則會使重量集中，導致輪胎下陷。這顯示，在同一片海灘上比較輪胎寬 5 公分的腳踏車與輪胎寬 10 公分的腳踏車時，_______", "opts": {"A": "the bike with 10-centimeter tires will sink deeper.", "B": "the bike with 5-centimeter tires will likely sink deeper.", "C": "both bikes will sink to the same depth.", "D": "neither bike can be ridden on sand."}, "optsZh": {"A": "輪胎寬 10 公分的腳踏車會陷得較深。", "B": "輪胎寬 5 公分的腳踏車可能會陷得較深。", "C": "兩輛腳踏車會陷到相同的深度。", "D": "兩輛腳踏車都不能在沙地上騎。"}, "answer": "B", "expl": "Narrow tires press harder on soft ground, so the narrow-tire bike should sink more.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Inferences: apply a stated principle to predict which of two cases has a lower limit.", "vocab": false, "body": "Snowshoes work by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spreading\" target=\"_blank\" rel=\"noopener\">spreading<\/a> a person&#x27;s weight across a wide <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> so that the person does not sink into deep snow. This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suggests\" target=\"_blank\" rel=\"noopener\">suggests<\/a> that, when comparing a hiker wearing snowshoes with a hiker of the same weight wearing ordinary boots, _______", "bodyPlain": "Snowshoes work by spreading a person's weight across a wide surface so that the person does not sink into deep snow. This suggests that, when comparing a hiker wearing snowshoes with a hiker of the same weight wearing ordinary boots, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "雪鞋的原理是把人的重量分散到寬大的表面上，讓人不會陷入深雪中。這顯示，比較穿雪鞋的健行者與同樣體重、穿普通靴子的健行者時，_______", "opts": {"A": "the hiker wearing snowshoes will sink deeper.", "B": "both hikers will sink to the same depth.", "C": "the hiker wearing ordinary boots will likely sink deeper.", "D": "neither hiker will be able to walk."}, "optsZh": {"A": "穿雪鞋的健行者會陷得較深。", "B": "兩位健行者會陷到相同的深度。", "C": "穿普通靴子的健行者可能會陷得較深。", "D": "兩位健行者都無法行走。"}, "answer": "C", "expl": "Snowshoes spread weight, so the person without snowshoes is more likely to sink.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Inferences: apply a stated principle to predict which of two cases has a lower limit.", "vocab": false, "body": "Pressure equals force <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=divided\" target=\"_blank\" rel=\"noopener\">divided<\/a> by area, so the same weight <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pressing\" target=\"_blank\" rel=\"noopener\">pressing<\/a> on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=smaller\" target=\"_blank\" rel=\"noopener\">smaller<\/a> area creates more pressure. This suggests that, when comparing a person wearing narrow high heels with a person of the same weight wearing flat sneakers, _______", "bodyPlain": "Pressure equals force divided by area, so the same weight pressing on a smaller area creates more pressure. This suggests that, when comparing a person wearing narrow high heels with a person of the same weight wearing flat sneakers, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "壓力等於力除以面積，所以同樣的重量壓在較小的面積上會產生較大的壓力。這顯示，比較穿細高跟鞋的人與同樣體重、穿平底運動鞋的人時，_______", "opts": {"A": "the high heels likely put more pressure on the floor.", "B": "the sneakers likely put more pressure on the floor.", "C": "both shoes put the same pressure on the floor.", "D": "the person's weight changes depending on the shoes."}, "optsZh": {"A": "高跟鞋可能對地板施加較大的壓力。", "B": "運動鞋可能對地板施加較大的壓力。", "C": "兩種鞋對地板施加的壓力相同。", "D": "人的體重會隨著鞋子而改變。"}, "answer": "A", "expl": "Smaller contact area means more pressure, so the high-heeled shoe presses harder on the floor.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Inferences: apply a stated principle to predict which of two cases has a lower limit.", "vocab": false, "body": "Highway rules limit how much weight each axle of a truck may carry, because weight <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=concentrated\" target=\"_blank\" rel=\"noopener\">concentrated<\/a> on fewer axles causes more damage to the road. This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suggests\" target=\"_blank\" rel=\"noopener\">suggests<\/a> that, when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=comparing\" target=\"_blank\" rel=\"noopener\">comparing<\/a> a three-axle truck with a six-axle truck, _______", "bodyPlain": "Highway rules limit how much weight each axle of a truck may carry, because weight concentrated on fewer axles causes more damage to the road. This suggests that, when comparing a three-axle truck with a six-axle truck, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "公路規則限制卡車每個車軸可承載的重量，因為重量集中在較少車軸上會對路面造成更大的損害。這顯示，比較三軸卡車與六軸卡車時，_______", "opts": {"A": "the six-axle truck likely has a lower total weight limit.", "B": "both trucks likely have the same total weight limit.", "C": "the three-axle truck can never use the highway.", "D": "the three-axle truck likely has a lower total weight limit than the six-axle truck."}, "optsZh": {"A": "六軸卡車的總重限制可能較低。", "B": "兩輛卡車的總重限制可能相同。", "C": "三軸卡車永遠不能使用公路。", "D": "三軸卡車的總重限制可能比六軸卡車低。"}, "answer": "D", "expl": "Trucks with fewer axles concentrate weight, so the three-axle truck has a lower limit.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Standard English Conventions: pronoun-antecedent agreement (plural \"they\" for \"students\").", "vocab": false, "body": "A recent study looked at whether students who took photos of PowerPoint slides during <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=lessons\" target=\"_blank\" rel=\"noopener\">lessons<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remembered\" target=\"_blank\" rel=\"noopener\">remembered<\/a> the content. When students took a photo of the slides, they were able to better remember the information on those slides compared to slides _______ did not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photograph<\/a>.", "bodyPlain": "A recent study looked at whether students who took photos of PowerPoint slides during lessons remembered the content. When students took a photo of the slides, they were able to better remember the information on those slides compared to slides _______ did not photograph.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "最近一項研究探討上課時拍下 PowerPoint 投影片的學生是否記得內容。學生拍下投影片時，比起 _______ 沒有拍的投影片，他們更能記住那些投影片上的資訊。", "opts": {"A": "they", "B": "one", "C": "it", "D": "we"}, "optsZh": {"A": "they（他們）", "B": "one（一個人）", "C": "it（它）", "D": "we（我們）"}, "answer": "A", "expl": "The pronoun refers to 'students' (plural), so 'they' is correct. (The original key listed B.)", "explZh": "代名詞指的是複數的 students，所以用 they。（原答案列為 B，已修正為 A。）"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Standard English Conventions: pronoun-antecedent agreement (plural \"they\" for \"students\").", "vocab": false, "body": "A study <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=examined\" target=\"_blank\" rel=\"noopener\">examined<\/a> whether <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> who wrote notes by hand <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remembered\" target=\"_blank\" rel=\"noopener\">remembered<\/a> more than those who typed. The volunteers remembered more of the lectures that _______ had written about by hand.", "bodyPlain": "A study examined whether volunteers who wrote notes by hand remembered more than those who typed. The volunteers remembered more of the lectures that _______ had written about by hand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一項研究探討用手寫筆記的志願者是否比打字的人記得更多。志願者對 _______ 用手寫筆記的講課內容記得比較多。", "opts": {"A": "it", "B": "one", "C": "they", "D": "we"}, "optsZh": {"A": "it（它）", "B": "one（一個人）", "C": "they（他們）", "D": "we（我們）"}, "answer": "C", "expl": "The antecedent \"the volunteers\" is plural, so \"they\" is correct.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Standard English Conventions: pronoun-antecedent agreement (plural \"they\" for \"students\").", "vocab": false, "body": "The museum began <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=offering\" target=\"_blank\" rel=\"noopener\">offering<\/a> free <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evening\" target=\"_blank\" rel=\"noopener\">evening<\/a> hours in 2019. Since then, the number of teenagers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visit\" target=\"_blank\" rel=\"noopener\" data-w=\"visit\" data-pos=\"n.\" data-en=\"an act of going to see a place or person\" data-zh=\"造訪；參觀\">visiting<\/a> _______ on weeknights has nearly doubled.", "bodyPlain": "The museum began offering free evening hours in 2019. Since then, the number of teenagers visiting _______ on weeknights has nearly doubled.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這間博物館從 2019 年開始提供免費夜間開放時段。從那時起，平日晚上造訪 _______ 的青少年人數幾乎增加了一倍。", "opts": {"A": "it", "B": "us", "C": "them", "D": "one"}, "optsZh": {"A": "it（它）", "B": "us（我們）", "C": "them（他們）", "D": "one（一個人）"}, "answer": "A", "expl": "The antecedent is \"the museum\" (singular), so \"it\" is correct.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Standard English Conventions: pronoun-antecedent agreement (plural \"they\" for \"students\").", "vocab": false, "body": "When researchers tested the new water filter in rural <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=villages\" target=\"_blank\" rel=\"noopener\">villages<\/a>, _______ found that it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=removed\" target=\"_blank\" rel=\"noopener\">removed<\/a> more than 99 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percent\" target=\"_blank\" rel=\"noopener\" data-w=\"percent\" data-pos=\"n.\" data-en=\"parts in every hundred (%)\" data-zh=\"百分比\">percent<\/a> of harmful bacteria.", "bodyPlain": "When researchers tested the new water filter in rural villages, _______ found that it removed more than 99 percent of harmful bacteria.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "研究人員在農村測試新的濾水器時，_______ 發現它能去除 99% 以上的有害細菌。", "opts": {"A": "it", "B": "they", "C": "one", "D": "we"}, "optsZh": {"A": "it（它）", "B": "they（他們）", "C": "one（一個人）", "D": "we（我們）"}, "answer": "B", "expl": "\"Researchers\" is plural, so \"they\" is correct.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Standard English Conventions: pronoun-antecedent agreement (plural \"they\" for \"students\").", "vocab": false, "body": "Arctic terns travel from the Arctic to the Antarctic every year. Over its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=lifetime\" target=\"_blank\" rel=\"noopener\">lifetime<\/a>, each tern may fly a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distance\" target=\"_blank\" rel=\"noopener\">distance<\/a> equal to three round trips to the Moon, using _______ strong, narrow wings to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=glide\" target=\"_blank\" rel=\"noopener\" data-w=\"glide\" data-pos=\"v.\" data-en=\"to move smoothly through the air without flapping wings\" data-zh=\"滑翔；滑行\">glide<\/a> over the ocean.", "bodyPlain": "Arctic terns travel from the Arctic to the Antarctic every year. Over its lifetime, each tern may fly a distance equal to three round trips to the Moon, using _______ strong, narrow wings to glide over the ocean.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "北極燕鷗每年從北極飛到南極。在一生中，每隻燕鷗飛行的距離可能相當於往返月球三趟，利用 _______ 強壯而狹長的翅膀在海面上滑翔。", "opts": {"A": "our", "B": "its", "C": "your", "D": "their"}, "optsZh": {"A": "our（我們的）", "B": "its（它的）", "C": "your（你的）", "D": "their（他們的）"}, "answer": "B", "expl": "\"Each bird\" is singular, so \"its\" agrees with it.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Standard English Conventions: pronoun-antecedent agreement (plural \"they\" for \"students\").", "vocab": false, "body": "A study of soccer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=players\" target=\"_blank\" rel=\"noopener\">players<\/a> found that the players made fewer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mistakes\" target=\"_blank\" rel=\"noopener\">mistakes<\/a> during <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=matches\" target=\"_blank\" rel=\"noopener\">matches<\/a> when _______ had slept at least eight hours the night before.", "bodyPlain": "A study of soccer players found that the players made fewer mistakes during matches when _______ had slept at least eight hours the night before.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一項針對足球員的研究發現，當 _______ 前一晚睡了至少八小時，球員在比賽中犯的錯誤較少。", "opts": {"A": "they", "B": "it", "C": "we", "D": "one"}, "optsZh": {"A": "they（他們）", "B": "it（它）", "C": "we（我們）", "D": "one（一個人）"}, "answer": "A", "expl": "\"The players\" is plural, so \"they\" is correct.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Standard English Conventions: punctuate a direct question with question word order and a question mark.", "vocab": false, "body": "Soft drinks have become very <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=popular\" target=\"_blank\" rel=\"noopener\" data-w=\"popular\" data-pos=\"adj.\" data-en=\"liked or enjoyed by many people\" data-zh=\"受歡迎的；流行的\">popular<\/a> in recent years, but <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consume\" target=\"_blank\" rel=\"noopener\" data-w=\"consume\" data-pos=\"v.\" data-en=\"to eat, drink, or use up something\" data-zh=\"吃；喝；消耗\">consuming<\/a> too many is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with many diseases and intellectual deterioration. Scientists wanted to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explore\" target=\"_blank\" rel=\"noopener\" data-w=\"explore\" data-pos=\"v.\" data-en=\"to examine or discuss a subject in detail\" data-zh=\"探索；探討\">explore<\/a> another question related to this topic: _______", "bodyPlain": "Soft drinks have become very popular in recent years, but consuming too many is associated with many diseases and intellectual deterioration. Scientists wanted to explore another question related to this topic: _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "近年來汽水變得非常受歡迎，但喝太多與許多疾病和智力退化有關。科學家想探討與這個主題相關的另一個問題：_______", "opts": {"A": "does the consumption of soft drinks cause changes in mammal behavior?", "B": "does the consumption of soft drinks cause changes in mammal behavior.", "C": "the consumption of soft drinks causes changes in mammal behavior?", "D": "the consumption of soft drinks causes changes in mammal behavior."}, "optsZh": {"A": "喝汽水會造成哺乳動物行為改變嗎？（倒裝語序＋問號）", "B": "喝汽水會造成哺乳動物行為改變嗎。（倒裝語序＋句號）", "C": "喝汽水會造成哺乳動物行為改變？（直述語序＋問號）", "D": "喝汽水會造成哺乳動物行為改變。（直述語序＋句號）"}, "answer": "A", "expl": "A direct question after a colon uses question word order ('does ... cause') and ends with a question mark.", "explZh": "冒號後的直接問句要用疑問句語序（does … cause），並以問號結尾。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Standard English Conventions: punctuate a direct question with question word order and a question mark.", "vocab": false, "body": "Astronomers have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discovered\" target=\"_blank\" rel=\"noopener\">discovered<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of planets outside our <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=solar\" target=\"_blank\" rel=\"noopener\" data-w=\"solar\" data-pos=\"adj.\" data-en=\"relating to the Sun\" data-zh=\"太陽的\">solar<\/a> system. Now they want to answer a bigger question: _______", "bodyPlain": "Astronomers have discovered thousands of planets outside our solar system. Now they want to answer a bigger question: _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "天文學家已在太陽系外發現了數千顆行星。現在他們想回答一個更大的問題：_______", "opts": {"A": "any of these planets supports life?", "B": "does any of these planets support life.", "C": "does any of these planets support life?", "D": "any of these planets supports life."}, "optsZh": {"A": "這些行星中有任何一顆能支持生命？（直述語序＋問號）", "B": "這些行星中有任何一顆能支持生命嗎。（倒裝語序＋句號）", "C": "這些行星中有任何一顆能支持生命嗎？（倒裝語序＋問號）", "D": "這些行星中有任何一顆能支持生命。（直述語序＋句號）"}, "answer": "C", "expl": "A direct question after a colon uses question word order and ends with a question mark.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Standard English Conventions: punctuate a direct question with question word order and a question mark.", "vocab": false, "body": "Scientists know that plants grow toward light. Botanist Monica Gagliano asked a more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surprising\" target=\"_blank\" rel=\"noopener\">surprising<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=question\" target=\"_blank\" rel=\"noopener\">question<\/a>: _______", "bodyPlain": "Scientists know that plants grow toward light. Botanist Monica Gagliano asked a more surprising question: _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "科學家知道植物會朝光生長。植物學家 Monica Gagliano 提出了一個更令人驚訝的問題：_______", "opts": {"A": "can plants also respond to the sound of running water?", "B": "can plants also respond to the sound of running water.", "C": "plants can also respond to the sound of running water?", "D": "plants can also respond to the sound of running water."}, "optsZh": {"A": "植物是否也能對流水聲有反應？（倒裝語序＋問號）", "B": "植物是否也能對流水聲有反應。（倒裝語序＋句號）", "C": "植物也能對流水聲有反應？（直述語序＋問號）", "D": "植物也能對流水聲有反應。（直述語序＋句號）"}, "answer": "A", "expl": "A direct question needs inverted word order (\"can plants...\") and a question mark.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Standard English Conventions: punctuate a direct question with question word order and a question mark.", "vocab": false, "body": "Many cities have added bike lanes in recent years. Urban <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=planners\" target=\"_blank\" rel=\"noopener\">planners<\/a> now want to know: _______", "bodyPlain": "Many cities have added bike lanes in recent years. Urban planners now want to know: _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "近年來許多城市增設了自行車道。都市規劃人員現在想知道：_______", "opts": {"A": "bike lanes actually reduce traffic accidents?", "B": "bike lanes actually reduce traffic accidents.", "C": "do bike lanes actually reduce traffic accidents?", "D": "do bike lanes actually reduce traffic accidents."}, "optsZh": {"A": "自行車道真的能減少交通事故？（直述語序＋問號）", "B": "自行車道真的能減少交通事故。（直述語序＋句號）", "C": "自行車道真的能減少交通事故嗎？（倒裝語序＋問號）", "D": "自行車道真的能減少交通事故嗎。（倒裝語序＋句號）"}, "answer": "C", "expl": "The question after the colon is direct, so it uses \"do\" + subject and a question mark.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Standard English Conventions: punctuate a direct question with question word order and a question mark.", "vocab": false, "body": "Glaciers in the Himalayas supply water to nearly two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=billion\" target=\"_blank\" rel=\"noopener\">billion<\/a> people. As <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a> rise, scientists face an urgent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=question\" target=\"_blank\" rel=\"noopener\">question<\/a>: _______", "bodyPlain": "Glaciers in the Himalayas supply water to nearly two billion people. As temperatures rise, scientists face an urgent question: _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "喜馬拉雅山的冰川為將近二十億人提供水源。隨著氣溫上升，科學家面臨一個緊迫的問題：_______", "opts": {"A": "will these glaciers still exist by the year 2100.", "B": "will these glaciers still exist by the year 2100?", "C": "these glaciers will still exist by the year 2100?", "D": "these glaciers will still exist by the year 2100."}, "optsZh": {"A": "這些冰川到 2100 年還會存在嗎。（倒裝語序＋句號）", "B": "這些冰川到 2100 年還會存在嗎？（倒裝語序＋問號）", "C": "這些冰川到 2100 年仍會存在？（直述語序＋問號）", "D": "這些冰川到 2100 年仍會存在。（直述語序＋句號）"}, "answer": "B", "expl": "Direct question: inverted order with \"will\" and a question mark.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Standard English Conventions: punctuate a direct question with question word order and a question mark.", "vocab": false, "body": "Octopuses can open jars and escape from tanks. Biologists are now <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explore\" target=\"_blank\" rel=\"noopener\" data-w=\"explore\" data-pos=\"v.\" data-en=\"to examine or discuss a subject in detail\" data-zh=\"探索；探討\">exploring<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fascinate\" target=\"_blank\" rel=\"noopener\" data-w=\"fascinate\" data-pos=\"v.\" data-en=\"to attract and hold someone&#x27;s strong interest\" data-zh=\"使著迷\">fascinating<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=question\" target=\"_blank\" rel=\"noopener\">question<\/a>: _______", "bodyPlain": "Octopuses can open jars and escape from tanks. Biologists are now exploring a fascinating question: _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "章魚能打開罐子並從水族箱逃脫。生物學家現在正在探索一個引人入勝的問題：_______", "opts": {"A": "do octopuses plan their actions in advance?", "B": "octopuses plan their actions in advance?", "C": "do octopuses plan their actions in advance.", "D": "octopuses plan their actions in advance."}, "optsZh": {"A": "章魚會事先計畫行動嗎？（倒裝語序＋問號）", "B": "章魚會事先計畫行動？（直述語序＋問號）", "C": "章魚會事先計畫行動嗎。（倒裝語序＋句號）", "D": "章魚會事先計畫行動。（直述語序＋句號）"}, "answer": "A", "expl": "A direct question requires question word order and a question mark.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English Conventions (Boundaries): join a main clause and a \"while\" subordinate clause with a comma.", "vocab": false, "body": "Heat islands are urban areas that, due to a high number of buildings and limited greenery, have a higher <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> compared to outlying areas. There are several strategies and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technologies<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=counteract\" target=\"_blank\" rel=\"noopener\" data-w=\"counteract\" data-pos=\"v.\" data-en=\"to reduce the effect of something by acting against it\" data-zh=\"抵消；對抗\">counteract<\/a> the higher temperatures of heat islands. For example, green roofs, which are rooftops covered in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a>, reduce the temperatures of _______ cool pavements, which are made with materials that reflect solar energy, can lower the temperatures above the pavement surface and the surrounding air.", "bodyPlain": "Heat islands are urban areas that, due to a high number of buildings and limited greenery, have a higher temperature compared to outlying areas. There are several strategies and technologies to counteract the higher temperatures of heat islands. For example, green roofs, which are rooftops covered in vegetation, reduce the temperatures of _______ cool pavements, which are made with materials that reflect solar energy, can lower the temperatures above the pavement surface and the surrounding air.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "熱島是指由於建築物多、綠地少，溫度比周邊地區高的都市區域。有幾種策略和技術可以對抗熱島的高溫。例如，綠屋頂（覆蓋植物的屋頂）能降低 _______ 而涼爽鋪面（以反射太陽能的材料製成）能降低鋪面上方與周圍空氣的溫度。", "opts": {"A": "roofs, while", "B": "roofs; while", "C": "roofs. While", "D": "roofs: while"}, "optsZh": {"A": "roofs, while（逗號）", "B": "roofs; while（分號）", "C": "roofs. While（句號）", "D": "roofs: while（冒號）"}, "answer": "A", "expl": "'While cool pavements ... can lower the temperatures' is a dependent clause, so it is joined to the main clause with a comma, not a semicolon or period. (The original key listed B.)", "explZh": "「while cool pavements … can lower the temperatures」是從屬子句，要用逗號與主要子句連接，不能用分號或句號。（原答案列為 B，已修正為 A。）"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English Conventions (Boundaries): join a main clause and a \"while\" subordinate clause with a comma.", "vocab": false, "body": "Two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strategies\" target=\"_blank\" rel=\"noopener\">strategies<\/a> help protect coral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reef\" target=\"_blank\" rel=\"noopener\" data-w=\"reef\" data-pos=\"n.\" data-en=\"a line of rock or coral near the surface of the sea\" data-zh=\"礁；珊瑚礁\">reefs<\/a>. Marine parks limit fishing in certain _______ coral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nursery\" target=\"_blank\" rel=\"noopener\" data-w=\"nursery\" data-pos=\"n.\" data-en=\"a place where young animals or plants are raised\" data-zh=\"育幼場；苗圃\">nurseries<\/a> grow young corals that can be replanted on damaged reefs.", "bodyPlain": "Two strategies help protect coral reefs. Marine parks limit fishing in certain _______ coral nurseries grow young corals that can be replanted on damaged reefs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "有兩種策略能幫助保護珊瑚礁。海洋公園限制某些 _______ 而珊瑚苗圃培育幼珊瑚，可移植到受損的珊瑚礁上。", "opts": {"A": "areas. While", "B": "areas, while", "C": "areas: while", "D": "areas; while"}, "optsZh": {"A": "areas. While（句號）", "B": "areas, while（逗號）", "C": "areas: while（冒號）", "D": "areas; while（分號）"}, "answer": "B", "expl": "\"While...\" is a dependent clause, so it is joined to the main clause with a comma, not a period or semicolon.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English Conventions (Boundaries): join a main clause and a \"while\" subordinate clause with a comma.", "vocab": false, "body": "Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=animals\" target=\"_blank\" rel=\"noopener\">animals<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survive<\/a> winter in different ways. Bears sleep for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=month\" target=\"_blank\" rel=\"noopener\" data-w=\"month\" data-pos=\"n.\" data-en=\"one of the twelve periods of time into which a year is divided\" data-zh=\"月\">months<\/a> in their _______ arctic foxes grow thick white fur and keep hunting in the snow.", "bodyPlain": "Some animals survive winter in different ways. Bears sleep for months in their _______ arctic foxes grow thick white fur and keep hunting in the snow.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "有些動物用不同的方式度過冬天。熊在 _______ 裡睡上好幾個月，而北極狐會長出厚厚的白毛，繼續在雪中狩獵。", "opts": {"A": "dens. While", "B": "dens: while", "C": "dens; while", "D": "dens, while"}, "optsZh": {"A": "dens. While（句號）", "B": "dens: while（冒號）", "C": "dens; while（分號）", "D": "dens, while（逗號）"}, "answer": "D", "expl": "A comma joins the independent clause to the \"while\" clause; a semicolon or period would create a fragment.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English Conventions (Boundaries): join a main clause and a \"while\" subordinate clause with a comma.", "vocab": false, "body": "Cities fight <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flooding\" target=\"_blank\" rel=\"noopener\">flooding<\/a> in two main ways. Some build high walls along their _______ others create parks and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=wetland\" target=\"_blank\" rel=\"noopener\" data-w=\"wetland\" data-pos=\"n.\" data-en=\"land that is often covered with water, such as a marsh\" data-zh=\"濕地\">wetlands<\/a> that soak up extra water.", "bodyPlain": "Cities fight flooding in two main ways. Some build high walls along their _______ others create parks and wetlands that soak up extra water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "城市主要以兩種方式對抗洪水。有些城市沿著 _______ 建造高牆，而其他城市則建造能吸收多餘雨水的公園與濕地。", "opts": {"A": "rivers. While", "B": "rivers: while", "C": "rivers, while", "D": "rivers; while"}, "optsZh": {"A": "rivers. While（句號）", "B": "rivers: while（冒號）", "C": "rivers, while（逗號）", "D": "rivers; while（分號）"}, "answer": "C", "expl": "The \"while\" clause depends on the main clause and is joined with a comma.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English Conventions (Boundaries): join a main clause and a \"while\" subordinate clause with a comma.", "vocab": false, "body": "The two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sisters\" target=\"_blank\" rel=\"noopener\">sisters<\/a> had very different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=career\" target=\"_blank\" rel=\"noopener\" data-w=\"career\" data-pos=\"n.\" data-en=\"the series of jobs a person has in their working life\" data-zh=\"職業生涯\">careers<\/a>. Serena Williams became famous for
