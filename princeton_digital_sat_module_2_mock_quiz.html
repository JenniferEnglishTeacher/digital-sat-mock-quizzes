 her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=powerful\" target=\"_blank\" rel=\"noopener\">powerful<\/a> _______ Venus Williams was known for her speed and long reach at the net.", "bodyPlain": "The two sisters had very different careers. Serena Williams became famous for her powerful _______ Venus Williams was known for her speed and long reach at the net.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這兩姊妹的職業生涯截然不同。Serena Williams 以強力的 _______ 聞名，而 Venus Williams 則以速度和在網前的長臂優勢著稱。", "opts": {"A": "serve, while", "B": "serve; while", "C": "serve. While", "D": "serve: while"}, "optsZh": {"A": "serve, while（逗號）", "B": "serve; while（分號）", "C": "serve. While（句號）", "D": "serve: while（冒號）"}, "answer": "A", "expl": "A comma correctly joins the main clause and the subordinate \"while\" clause.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English Conventions (Boundaries): join a main clause and a \"while\" subordinate clause with a comma.", "vocab": false, "body": "Ancient Egyptians and Mesopotamians both <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=writing\" target=\"_blank\" rel=\"noopener\">writing<\/a> systems. Egyptians wrote hieroglyphs on papyrus made from river _______ Mesopotamians pressed wedge-shaped marks into clay <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tablet\" target=\"_blank\" rel=\"noopener\" data-w=\"tablet\" data-pos=\"n.\" data-en=\"a flat piece of stone or clay with writing on it\" data-zh=\"碑；泥板\">tablets<\/a>.", "bodyPlain": "Ancient Egyptians and Mesopotamians both developed writing systems. Egyptians wrote hieroglyphs on papyrus made from river _______ Mesopotamians pressed wedge-shaped marks into clay tablets.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "古埃及人和美索不達米亞人都發展出了文字系統。埃及人把象形文字寫在用河邊 _______ 製成的莎草紙上，而美索不達米亞人則把楔形符號壓印在泥板上。", "opts": {"A": "reeds, while", "B": "reeds. While", "C": "reeds: while", "D": "reeds; while"}, "optsZh": {"A": "reeds, while（逗號）", "B": "reeds. While（句號）", "C": "reeds: while（冒號）", "D": "reeds; while（分號）"}, "answer": "A", "expl": "\"while\" begins a dependent clause, so it needs a comma, not a semicolon, period, or colon.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English Conventions: subject-verb agreement in a compound predicate with a singular subject.", "vocab": false, "body": "With a focus on public health, Abla Mehio Sibai is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=currently\" target=\"_blank\" rel=\"noopener\">currently<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=working\" target=\"_blank\" rel=\"noopener\">working<\/a> at a university in Lebanon. She primarily focuses on the process of aging, especially in the context of different demographics, and _______ to research on noncontagious <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illness\" target=\"_blank\" rel=\"noopener\" data-w=\"illness\" data-pos=\"n.\" data-en=\"a disease or period of sickness\" data-zh=\"疾病\">illnesses<\/a>.", "bodyPlain": "With a focus on public health, Abla Mehio Sibai is currently working at a university in Lebanon. She primarily focuses on the process of aging, especially in the context of different demographics, and _______ to research on noncontagious illnesses.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "Abla Mehio Sibai 專注於公共衛生，目前在黎巴嫩的一所大學任職。她主要研究老化過程，特別是在不同人口族群背景下的老化，並 _______ 非傳染性疾病的研究。", "opts": {"A": "contribute", "B": "contributes", "C": "are contributing", "D": "have contributed"}, "optsZh": {"A": "貢獻（原形）", "B": "貢獻（第三人稱單數）", "C": "正在貢獻（現在進行式，複數）", "D": "已經貢獻（現在完成式，複數）"}, "answer": "B", "expl": "The subject 'She' is singular and the sentence is in present tense, parallel with 'focuses,' so 'contributes' is correct.", "explZh": "主詞 She 是單數，且句子是現在式並與 focuses 平行，所以用 contributes。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English Conventions: subject-verb agreement in a compound predicate with a singular subject.", "vocab": false, "body": "Dr. Lin Tan teaches marine biology at a university in Singapore. She mainly researches coral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reef\" target=\"_blank\" rel=\"noopener\" data-w=\"reef\" data-pos=\"n.\" data-en=\"a line of rock or coral near the surface of the sea\" data-zh=\"礁；珊瑚礁\">reefs<\/a>, especially how they <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recover\" target=\"_blank\" rel=\"noopener\" data-w=\"recover\" data-pos=\"v.\" data-en=\"to return to a normal or healthy state\" data-zh=\"復原；康復\">recover<\/a> after storms, and _______ young scientists in diving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something\" data-zh=\"技巧；方法\">techniques<\/a>.", "bodyPlain": "Dr. Lin Tan teaches marine biology at a university in Singapore. She mainly researches coral reefs, especially how they recover after storms, and _______ young scientists in diving techniques.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "Lin Tan 博士在新加坡一所大學教授海洋生物學。她主要研究珊瑚礁，特別是珊瑚礁在暴風後如何復原，並 _______ 年輕科學家潛水技術。", "opts": {"A": "have trained", "B": "trains", "C": "are training", "D": "train"}, "optsZh": {"A": "已經訓練（現在完成式，複數）", "B": "訓練（第三人稱單數）", "C": "正在訓練（現在進行式，複數）", "D": "訓練（原形）"}, "answer": "B", "expl": "The singular subject \"Dr. Tan\" needs the singular verb \"studies,\" matching \"teaches.\"", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English Conventions: subject-verb agreement in a compound predicate with a singular subject.", "vocab": false, "body": "The new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=science\" target=\"_blank\" rel=\"noopener\">science<\/a> museum in Taipei <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=focuses\" target=\"_blank\" rel=\"noopener\">focuses<\/a> on space <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exploration\" target=\"_blank\" rel=\"noopener\">exploration<\/a> and _______ hands-on activities for children every weekend.", "bodyPlain": "The new science museum in Taipei focuses on space exploration and _______ hands-on activities for children every weekend.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "台北新的科學博物館以太空探索為主題，並在每個週末 _______ 兒童動手做的活動。", "opts": {"A": "offer", "B": "offers", "C": "are offering", "D": "have offered"}, "optsZh": {"A": "提供（原形）", "B": "提供（第三人稱單數）", "C": "正在提供（現在進行式，複數）", "D": "已經提供（現在完成式，複數）"}, "answer": "B", "expl": "\"The museum\" is singular and the sentence is in present tense, so \"offers\" fits.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English Conventions: subject-verb agreement in a compound predicate with a singular subject.", "vocab": false, "body": "The author lives in a small <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=village\" target=\"_blank\" rel=\"noopener\">village<\/a> in Kenya and _______ novels about the lives of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=farmers\" target=\"_blank\" rel=\"noopener\">farmers<\/a> in her region.", "bodyPlain": "The author lives in a small village in Kenya and _______ novels about the lives of farmers in her region.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這位作家住在肯亞的一個小村莊，並 _______ 關於她所在地區農民生活的小說。", "opts": {"A": "are writing", "B": "have written", "C": "writes", "D": "write"}, "optsZh": {"A": "正在寫（現在進行式，複數）", "B": "已經寫了（現在完成式，複數）", "C": "寫（第三人稱單數）", "D": "寫（原形）"}, "answer": "C", "expl": "The singular subject \"the author\" takes \"writes,\" parallel with \"lives.\"", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English Conventions: subject-verb agreement in a compound predicate with a singular subject.", "vocab": false, "body": "Designed by students in Seoul, the robot scans each piece of trash and _______ it into the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=correct\" target=\"_blank\" rel=\"noopener\">correct<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recycling\" target=\"_blank\" rel=\"noopener\">recycling<\/a> bin.", "bodyPlain": "Designed by students in Seoul, the robot scans each piece of trash and _______ it into the correct recycling bin.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個由首爾學生設計的機器人會掃描每一件垃圾，並把它 _______ 到正確的回收桶。", "opts": {"A": "have sorted", "B": "sorts", "C": "sort", "D": "are sorting"}, "optsZh": {"A": "已經分類（現在完成式，複數）", "B": "分類（第三人稱單數）", "C": "分類（原形）", "D": "正在分類（現在進行式，複數）"}, "answer": "B", "expl": "\"The robot\" is singular, so its second verb must also be singular: \"sorts.\"", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English Conventions: subject-verb agreement in a compound predicate with a singular subject.", "vocab": false, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organization\" target=\"_blank\" rel=\"noopener\" data-w=\"organization\" data-pos=\"n.\" data-en=\"a group of people working together for a shared purpose\" data-zh=\"組織；機構\">organization<\/a> trains <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> to teach adults how to read and _______ free books to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=families\" target=\"_blank\" rel=\"noopener\">families<\/a> in need.", "bodyPlain": "The organization trains volunteers to teach adults how to read and _______ free books to families in need.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這個組織培訓志工教成人識字，並 _______ 免費書籍給有需要的家庭。", "opts": {"A": "provides", "B": "provide", "C": "are providing", "D": "have provided"}, "optsZh": {"A": "提供（第三人稱單數）", "B": "提供（原形）", "C": "正在提供（現在進行式，複數）", "D": "已經提供（現在完成式，複數）"}, "answer": "A", "expl": "The singular subject \"the organization\" takes singular \"provides,\" parallel with \"trains.\"", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English Conventions (Boundaries): use a comma before a nonessential appositive that ends a sentence.", "vocab": false, "body": "Bribery is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognized<\/a> as a problem in India by local and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=international\" target=\"_blank\" rel=\"noopener\" data-w=\"international\" data-pos=\"adj.\" data-en=\"involving more than one country\" data-zh=\"國際的\">international<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organization\" target=\"_blank\" rel=\"noopener\" data-w=\"organization\" data-pos=\"n.\" data-en=\"a group of people working together for a shared purpose\" data-zh=\"組織；機構\">organizations<\/a>. In response to this problem, 5th Pillar, a non-governmental organization, printed a zero-rupee _______ imitation banknote that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resemble\" target=\"_blank\" rel=\"noopener\" data-w=\"resemble\" data-pos=\"v.\" data-en=\"to look like or be similar to\" data-zh=\"相似；像\">resembles<\/a> real money and is covered in anti-corruption slogans.", "bodyPlain": "Bribery is recognized as a problem in India by local and international organizations. In response to this problem, 5th Pillar, a non-governmental organization, printed a zero-rupee _______ imitation banknote that resembles real money and is covered in anti-corruption slogans.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "賄賂在印度被當地與國際組織認定為一個問題。為了回應這個問題，非政府組織「第五支柱」印製了一種零盧比 _______ 一種外觀像真鈔、印滿反貪腐標語的仿製紙鈔。", "opts": {"A": "note. An", "B": "note, an", "C": "note an", "D": "note; an"}, "optsZh": {"A": "note. An（句號）", "B": "note, an（逗號）", "C": "note an（無標點）", "D": "note; an（分號）"}, "answer": "B", "expl": "'An imitation banknote ...' is an appositive that renames the zero-rupee note, so it is set off with a comma.", "explZh": "「an imitation banknote …」是同位語，重新說明零盧比紙鈔，要用逗號隔開。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English Conventions (Boundaries): use a comma before a nonessential appositive that ends a sentence.", "vocab": false, "body": "To <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encourage\" target=\"_blank\" rel=\"noopener\">encourage<\/a> people to talk with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strangers\" target=\"_blank\" rel=\"noopener\">strangers<\/a>, artists in Copenhagen built the Happy _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circular\" target=\"_blank\" rel=\"noopener\" data-w=\"circular\" data-pos=\"adj.\" data-en=\"shaped like a circle\" data-zh=\"圓形的\">circular<\/a> seat that forces everyone to face one another.", "bodyPlain": "To encourage people to talk with strangers, artists in Copenhagen built the Happy _______ circular seat that forces everyone to face one another.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "為了鼓勵人們和陌生人交談，哥本哈根的藝術家建造了 Happy _______ 一張讓每個人都必須面對面的圓形座椅。", "opts": {"A": "Bench; a", "B": "Bench, a", "C": "Bench a", "D": "Bench. A"}, "optsZh": {"A": "Bench; a（分號）", "B": "Bench, a（逗號）", "C": "Bench a（無標點）", "D": "Bench. A（句號）"}, "answer": "B", "expl": "A comma sets off the appositive \"a sculpture...\" that describes the bench.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English Conventions (Boundaries): use a comma before a nonessential appositive that ends a sentence.", "vocab": false, "body": "To help <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=farmers\" target=\"_blank\" rel=\"noopener\">farmers<\/a> plan their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=harvests\" target=\"_blank\" rel=\"noopener\">harvests<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=engineers\" target=\"_blank\" rel=\"noopener\">engineers<\/a> in Kenya created FarmDrive, a mobile _______ app that gives small farmers access to loans based on their crop records.", "bodyPlain": "To help farmers plan their harvests, engineers in Kenya created FarmDrive, a mobile _______ app that gives small farmers access to loans based on their crop records.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "為了幫助農民規劃收成，肯亞的工程師創造了 FarmDrive，一種行動 _______ 一個讓小農能根據作物紀錄取得貸款的應用程式。", "opts": {"A": "service. An", "B": "service; an", "C": "service, an", "D": "service an"}, "optsZh": {"A": "service. An（句號）", "B": "service; an（分號）", "C": "service, an（逗號）", "D": "service an（無標點）"}, "answer": "C", "expl": "A comma introduces the appositive phrase describing the app.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English Conventions (Boundaries): use a comma before a nonessential appositive that ends a sentence.", "vocab": false, "body": "To clean <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plastic\" target=\"_blank\" rel=\"noopener\">plastic<\/a> from the ocean, the Dutch <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nonprofit\" target=\"_blank\" rel=\"noopener\">nonprofit<\/a> The Ocean Cleanup designed the _______ floating <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=barrier\" target=\"_blank\" rel=\"noopener\" data-w=\"barrier\" data-pos=\"n.\" data-en=\"something that blocks movement or access\" data-zh=\"屏障；障礙\">barrier<\/a> that collects trash as currents push it along.", "bodyPlain": "To clean plastic from the ocean, the Dutch nonprofit The Ocean Cleanup designed the _______ floating barrier that collects trash as currents push it along.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "為了清除海洋中的塑膠，荷蘭非營利組織 The Ocean Cleanup 設計了 _______ 一道在洋流推動下收集垃圾的漂浮屏障。", "opts": {"A": "Interceptor, a", "B": "Interceptor a", "C": "Interceptor; a", "D": "Interceptor. A"}, "optsZh": {"A": "Interceptor, a（逗號）", "B": "Interceptor a（無標點）", "C": "Interceptor; a（分號）", "D": "Interceptor. A（句號）"}, "answer": "A", "expl": "The appositive \"a robot...\" renames the noun before it and is set off with a comma.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English Conventions (Boundaries): use a comma before a nonessential appositive that ends a sentence.", "vocab": false, "body": "To honor the women who built ships during World War II, the city of Richmond, California, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=created\" target=\"_blank\" rel=\"noopener\">created<\/a> the Rosie the Riveter _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=walkway\" target=\"_blank\" rel=\"noopener\">walkway<\/a> shaped like the hull of a ship.", "bodyPlain": "To honor the women who built ships during World War II, the city of Richmond, California, created the Rosie the Riveter _______ walkway shaped like the hull of a ship.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "為了紀念二戰期間建造船艦的女性，加州里奇蒙市建造了鉚釘女工 Rosie _______ 一條形狀像船體的步道。", "opts": {"A": "Memorial. A", "B": "Memorial; a", "C": "Memorial a", "D": "Memorial, a"}, "optsZh": {"A": "Memorial. A（句號）", "B": "Memorial; a（分號）", "C": "Memorial a（無標點）", "D": "Memorial, a（逗號）"}, "answer": "D", "expl": "A comma before the appositive \"a sculpture...\" is correct; a semicolon or period would create a fragment.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English Conventions (Boundaries): use a comma before a nonessential appositive that ends a sentence.", "vocab": false, "body": "To bring books to remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=villages\" target=\"_blank\" rel=\"noopener\">villages<\/a> in Colombia, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=teacher\" target=\"_blank\" rel=\"noopener\">teacher<\/a> Luis Soriano <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=created\" target=\"_blank\" rel=\"noopener\">created<\/a> the _______ traveling library carried on the backs of two donkeys.", "bodyPlain": "To bring books to remote villages in Colombia, teacher Luis Soriano created the _______ traveling library carried on the backs of two donkeys.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "為了把書送到哥倫比亞偏遠的村莊，老師 Luis Soriano 創立了 _______ 一座由兩頭驢子背著的流動圖書館。", "opts": {"A": "Biblioburro. A", "B": "Biblioburro a", "C": "Biblioburro; a", "D": "Biblioburro, a"}, "optsZh": {"A": "Biblioburro. A（句號）", "B": "Biblioburro a（無標點）", "C": "Biblioburro; a（分號）", "D": "Biblioburro, a（逗號）"}, "answer": "D", "expl": "The appositive describing the library is set off by a comma.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English Conventions: maintain parallel verb tense in a compound predicate (past tense).", "vocab": false, "body": "Scientists wanted to learn how verbal statements can alter someone’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visual\" target=\"_blank\" rel=\"noopener\" data-w=\"visual\" data-pos=\"n.\" data-en=\"an image or picture used to show or explain something\" data-zh=\"視覺效果；影像\">visual<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> of a situation. Participants were shown an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">image<\/a> of 100 colored dots alongside a written hint and asked to identify the dominant color. When the hint <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accurate\" target=\"_blank\" rel=\"noopener\" data-w=\"accurate\" data-pos=\"adj.\" data-en=\"correct and exact, without mistakes\" data-zh=\"準確的\">accurately<\/a> identified the dominant color, participants self-identified as more confident and _______ quicker response times.", "bodyPlain": "Scientists wanted to learn how verbal statements can alter someone’s visual interpretation of a situation. Participants were shown an image of 100 colored dots alongside a written hint and asked to identify the dominant color. When the hint accurately identified the dominant color, participants self-identified as more confident and _______ quicker response times.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "科學家想了解口頭陳述如何改變一個人對情境的視覺詮釋。受試者看一張有 100 個彩色圓點的圖片，旁邊附有書面提示，並被要求辨識主要顏色。當提示正確指出主要顏色時，受試者自評較有信心，而且 _______ 較快的反應時間。", "opts": {"A": "exhibit", "B": "exhibits", "C": "exhibiting", "D": "exhibited"}, "optsZh": {"A": "表現出（原形）", "B": "表現出（第三人稱單數）", "C": "表現出（-ing 形式）", "D": "表現出（過去式）"}, "answer": "D", "expl": "'Self-identified' is past tense, so the parallel verb must be past tense 'exhibited.'", "explZh": "self-identified 是過去式，所以平行的動詞也要用過去式 exhibited。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English Conventions: maintain parallel verb tense in a compound predicate (past tense).", "vocab": false, "body": "In a study on color and mood, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=participants\" target=\"_blank\" rel=\"noopener\">participants<\/a> looked at rooms <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painted\" target=\"_blank\" rel=\"noopener\">painted<\/a> in different colors. In blue rooms, participants <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reported\" target=\"_blank\" rel=\"noopener\">reported<\/a> feeling calmer and _______ lower heart rates.", "bodyPlain": "In a study on color and mood, participants looked at rooms painted in different colors. In blue rooms, participants reported feeling calmer and _______ lower heart rates.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在一項關於顏色與情緒的研究中，受試者觀看漆成不同顏色的房間。在藍色房間中，受試者表示感覺較平靜，而且 _______ 較低的心跳速率。", "opts": {"A": "showing", "B": "show", "C": "showed", "D": "shows"}, "optsZh": {"A": "顯示（-ing 形式）", "B": "顯示（原形）", "C": "顯示（過去式）", "D": "顯示（第三人稱單數）"}, "answer": "C", "expl": "The first verb \"reported\" is past tense, so the parallel verb must be \"showed.\"", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English Conventions: maintain parallel verb tense in a compound predicate (past tense).", "vocab": false, "body": "When students <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=listened\" target=\"_blank\" rel=\"noopener\">listened<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classic\" target=\"_blank\" rel=\"noopener\" data-w=\"classic\" data-pos=\"adj.\" data-en=\"well known and of lasting quality\" data-zh=\"經典的\">classical<\/a> music during the test, they solved more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=problems\" target=\"_blank\" rel=\"noopener\">problems<\/a> correctly and _______ the test faster.", "bodyPlain": "When students listened to classical music during the test, they solved more problems correctly and _______ the test faster.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "學生在考試時聽古典音樂，答對的題目較多，而且 _______ 考試較快。", "opts": {"A": "finished", "B": "finishing", "C": "finishes", "D": "finish"}, "optsZh": {"A": "完成（過去式）", "B": "完成（-ing 形式）", "C": "完成（第三人稱單數）", "D": "完成（原形）"}, "answer": "A", "expl": "The verbs must be parallel in the past tense: \"solved... and finished.\"", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English Conventions: maintain parallel verb tense in a compound predicate (past tense).", "vocab": false, "body": "In the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a>, tomato plants given extra <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calcium\" target=\"_blank\" rel=\"noopener\">calcium<\/a> grew taller and _______ more fruit than plants without it.", "bodyPlain": "In the experiment, tomato plants given extra calcium grew taller and _______ more fruit than plants without it.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在實驗中，額外補充鈣的番茄植株長得較高，而且比沒有補充鈣的植株 _______ 更多果實。", "opts": {"A": "produce", "B": "produces", "C": "producing", "D": "produced"}, "optsZh": {"A": "結出（原形）", "B": "結出（第三人稱單數）", "C": "結出（-ing 形式）", "D": "結出（過去式）"}, "answer": "D", "expl": "\"Grew\" is past tense, so the second verb must be \"produced.\"", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English Conventions: maintain parallel verb tense in a compound predicate (past tense).", "vocab": false, "body": "During the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=camping\" target=\"_blank\" rel=\"noopener\">camping<\/a> study, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=families\" target=\"_blank\" rel=\"noopener\">families<\/a> without phones slept more deeply and _______ up <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=feeling\" target=\"_blank\" rel=\"noopener\">feeling<\/a> more rested.", "bodyPlain": "During the camping study, families without phones slept more deeply and _______ up feeling more rested.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在露營研究期間，沒有手機的家庭睡得較沉，而且 _______ 時覺得休息得更好。", "opts": {"A": "wake", "B": "wakes", "C": "woke", "D": "waking"}, "optsZh": {"A": "醒來（原形）", "B": "醒來（第三人稱單數）", "C": "醒來（過去式）", "D": "醒來（-ing 形式）"}, "answer": "C", "expl": "Past tense \"slept\" requires the parallel past tense \"woke.\"", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English Conventions: maintain parallel verb tense in a compound predicate (past tense).", "vocab": false, "body": "When the store moved fruit to the front <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entrance\" target=\"_blank\" rel=\"noopener\">entrance<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=shoppers\" target=\"_blank\" rel=\"noopener\">shoppers<\/a> chose <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=healthier\" target=\"_blank\" rel=\"noopener\">healthier<\/a> snacks and _______ less money on candy.", "bodyPlain": "When the store moved fruit to the front entrance, shoppers chose healthier snacks and _______ less money on candy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "當商店把水果移到前門入口時，購物者選擇了較健康的零食，而且在糖果上 _______ 的錢較少。", "opts": {"A": "spent", "B": "spending", "C": "spend", "D": "spends"}, "optsZh": {"A": "花費（過去式）", "B": "花費（-ing 形式）", "C": "花費（原形）", "D": "花費（第三人稱單數）"}, "answer": "A", "expl": "The compound predicate needs matching past tense verbs: \"chose... and spent.\"", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English Conventions (Boundaries): use a colon to introduce an explanation or example after a complete clause.", "vocab": false, "body": "Quantum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=computers\" target=\"_blank\" rel=\"noopener\">computers<\/a> rely on entangled building blocks to perform computational <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculation\" target=\"_blank\" rel=\"noopener\" data-w=\"calculation\" data-pos=\"n.\" data-en=\"the process of working out an amount using numbers\" data-zh=\"計算\">calculations<\/a>. Scientists are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attempt\" target=\"_blank\" rel=\"noopener\" data-w=\"attempt\" data-pos=\"v.\" data-en=\"to try to do something\" data-zh=\"嘗試；企圖\">attempting<\/a> to find a new source for these building _______ photons, or small quanta of light, emitted by an atom.", "bodyPlain": "Quantum computers rely on entangled building blocks to perform computational calculations. Scientists are attempting to find a new source for these building _______ photons, or small quanta of light, emitted by an atom.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "量子電腦依賴糾纏的基本單元來執行運算。科學家正試圖為這些基本 _______ 找到新的來源：由原子發射的光子，也就是微小的光量子。", "opts": {"A": "blocks, such as:", "B": "blocks", "C": "blocks,", "D": "blocks:"}, "optsZh": {"A": "blocks, such as:（逗號＋such as＋冒號）", "B": "blocks（無標點）", "C": "blocks,（逗號）", "D": "blocks:（冒號）"}, "answer": "D", "expl": "The complete clause before the blank introduces the specific source (photons), so a colon is correct.", "explZh": "空格前是完整子句，後面說明具體的來源（光子），所以用冒號。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English Conventions (Boundaries): use a colon to introduce an explanation or example after a complete clause.", "vocab": false, "body": "Solar panels need a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=material\" target=\"_blank\" rel=\"noopener\">material<\/a> that turns <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sunlight\" target=\"_blank\" rel=\"noopener\">sunlight<\/a> into <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electricity\" target=\"_blank\" rel=\"noopener\" data-w=\"electricity\" data-pos=\"n.\" data-en=\"a form of energy used for light, heat, and power\" data-zh=\"電；電力\">electricity<\/a>. Most panels today rely on one main _______ silicon, a common element found in sand.", "bodyPlain": "Solar panels need a material that turns sunlight into electricity. Most panels today rely on one main _______ silicon, a common element found in sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "太陽能板需要一種能把陽光轉換為電力的材料。現今大多數太陽能板依賴一種主要 _______ 矽，一種存在於沙子中的常見元素。", "opts": {"A": "material", "B": "material, such as:", "C": "material:", "D": "material,"}, "optsZh": {"A": "material（無標點）", "B": "material, such as:（逗號＋such as＋冒號）", "C": "material:（冒號）", "D": "material,（逗號）"}, "answer": "C", "expl": "A complete clause before the blank introduces the specific example, so a colon fits.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English Conventions (Boundaries): use a colon to introduce an explanation or example after a complete clause.", "vocab": false, "body": "Mapping the ocean floor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=requires\" target=\"_blank\" rel=\"noopener\">requires<\/a> a special tool. Most modern surveys use one main _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sonar\" target=\"_blank\" rel=\"noopener\" data-w=\"sonar\" data-pos=\"n.\" data-en=\"a system that uses sound waves to find objects underwater\" data-zh=\"聲納\">sonar<\/a>, which sends sound waves to the seabed and measures the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=echo\" target=\"_blank\" rel=\"noopener\" data-w=\"echo\" data-pos=\"v.\" data-en=\"to repeat or be similar to something earlier\" data-zh=\"呼應；重複\">echoes<\/a>.", "bodyPlain": "Mapping the ocean floor requires a special tool. Most modern surveys use one main _______ sonar, which sends sound waves to the seabed and measures the echoes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "繪製海底地圖需要一種特殊工具。大多數現代調查使用一種主要 _______ 聲納，它向海床發送聲波並測量回音。", "opts": {"A": "instrument,", "B": "instrument, such as:", "C": "instrument", "D": "instrument:"}, "optsZh": {"A": "instrument,（逗號）", "B": "instrument, such as:（逗號＋such as＋冒號）", "C": "instrument（無標點）", "D": "instrument:（冒號）"}, "answer": "D", "expl": "A colon introduces the specific item after a complete independent clause.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English Conventions (Boundaries): use a colon to introduce an explanation or example after a complete clause.", "vocab": false, "body": "Bakers in Naples say that great pizza <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=depends\" target=\"_blank\" rel=\"noopener\">depends<\/a> on one key _______ dough that rises slowly for at least a full day.", "bodyPlain": "Bakers in Naples say that great pizza depends on one key _______ dough that rises slowly for at least a full day.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "拿坡里的麵包師傅說，好披薩取決於一種關鍵 _______ 至少慢慢發酵一整天的麵團。", "opts": {"A": "ingredient", "B": "ingredient:", "C": "ingredient,", "D": "ingredient, such as:"}, "optsZh": {"A": "ingredient（無標點）", "B": "ingredient:（冒號）", "C": "ingredient,（逗號）", "D": "ingredient, such as:（逗號＋such as＋冒號）"}, "answer": "B", "expl": "The clause is complete; the colon introduces what the ingredient is.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English Conventions (Boundaries): use a colon to introduce an explanation or example after a complete clause.", "vocab": false, "body": "Many Olympic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=swimmers\" target=\"_blank\" rel=\"noopener\">swimmers<\/a> share one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surprising\" target=\"_blank\" rel=\"noopener\">surprising<\/a> _______ they <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=practice\" target=\"_blank\" rel=\"noopener\">practice<\/a> holding their breath for several minutes while sitting still.", "bodyPlain": "Many Olympic swimmers share one surprising _______ they practice holding their breath for several minutes while sitting still.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "許多奧運游泳選手都有一個令人驚訝的共同 _______ 他們會練習靜坐閉氣好幾分鐘。", "opts": {"A": "habit", "B": "habit,", "C": "habit, such as:", "D": "habit:"}, "optsZh": {"A": "habit（無標點）", "B": "habit,（逗號）", "C": "habit, such as:（逗號＋such as＋冒號）", "D": "habit:（冒號）"}, "answer": "D", "expl": "A colon follows an independent clause to introduce the specific explanation.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English Conventions (Boundaries): use a colon to introduce an explanation or example after a complete clause.", "vocab": false, "body": "Scientists are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developing<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=batteries\" target=\"_blank\" rel=\"noopener\">batteries<\/a> for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electric\" target=\"_blank\" rel=\"noopener\">electric<\/a> cars that rely on a new energy _______ sodium, which is far more common and cheaper than lithium.", "bodyPlain": "Scientists are developing batteries for electric cars that rely on a new energy _______ sodium, which is far more common and cheaper than lithium.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "科學家正在為電動車開發依賴一種新能源 _______ 的電池：鈉，它比鋰常見得多也便宜得多。", "opts": {"A": "source, such as:", "B": "source,", "C": "source", "D": "source:"}, "optsZh": {"A": "source, such as:（逗號＋such as＋冒號）", "B": "source,（逗號）", "C": "source（無標點）", "D": "source:（冒號）"}, "answer": "D", "expl": "After a complete clause, the colon introduces the specific source of energy.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Transitions: choose a transition that shows the passage of time.", "vocab": false, "body": "Suzan Shown Harjo <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=initially\" target=\"_blank\" rel=\"noopener\" data-w=\"initially\" data-pos=\"adv.\" data-en=\"at first; at the beginning\" data-zh=\"起初；最初\">initially<\/a> worked to write poems and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> news shows <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocating<\/a> for equal rights for Native Americans. _______ she moved to Washington, D.C., and served as Congressional Liaison for Indian Affairs for President Jimmy Carter while continuing to produce powerful pieces.", "bodyPlain": "Suzan Shown Harjo initially worked to write poems and produce news shows advocating for equal rights for Native Americans. _______ she moved to Washington, D.C., and served as Congressional Liaison for Indian Affairs for President Jimmy Carter while continuing to produce powerful pieces.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "Suzan Shown Harjo 起初從事寫詩和製作倡導美洲原住民平等權利的新聞節目。_______ 她搬到華盛頓特區，擔任卡特總統的印第安事務國會聯絡人，同時持續創作有力的作品。", "opts": {"A": "As a rule,", "B": "Despite this,", "C": "Conversely,", "D": "After some time,"}, "optsZh": {"A": "通常，", "B": "儘管如此，", "C": "相反地，", "D": "過了一段時間，"}, "answer": "D", "expl": "Her move to Washington came later in her career, so 'After some time' shows the passage of time.", "explZh": "她搬到華盛頓是職涯後期的事，所以用 After some time 表示時間推移。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Transitions: choose a transition that shows the passage of time.", "vocab": false, "body": "Wangari Maathai first worked as a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=professor\" target=\"_blank\" rel=\"noopener\" data-w=\"professor\" data-pos=\"n.\" data-en=\"a senior teacher at a university\" data-zh=\"教授\">professor<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=veterinary\" target=\"_blank\" rel=\"noopener\">veterinary<\/a> anatomy in Nairobi. _______ she founded the Green Belt Movement, which went on to plant millions of trees across Kenya.", "bodyPlain": "Wangari Maathai first worked as a researcher and professor of veterinary anatomy in Nairobi. _______ she founded the Green Belt Movement, which went on to plant millions of trees across Kenya.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "Wangari Maathai 最初在奈洛比擔任獸醫解剖學的研究員與教授。_______ 她創立了綠帶運動，後來在肯亞各地種植了數百萬棵樹。", "opts": {"A": "Conversely,", "B": "Despite this,", "C": "As a rule,", "D": "After some time,"}, "optsZh": {"A": "相反地，", "B": "儘管如此，", "C": "通常，", "D": "過了一段時間，"}, "answer": "D", "expl": "Her move to a new job happened later in time, so \"After some time\" fits.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Transitions: choose a transition that shows the passage of time.", "vocab": false, "body": "Bessie Coleman first worked as a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manicurist\" target=\"_blank\" rel=\"noopener\">manicurist<\/a> in Chicago while saving money for flight <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=lessons\" target=\"_blank\" rel=\"noopener\">lessons<\/a>. _______ she became the first African American woman to earn an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=international\" target=\"_blank\" rel=\"noopener\" data-w=\"international\" data-pos=\"adj.\" data-en=\"involving more than one country\" data-zh=\"國際的\">international<\/a> pilot&#x27;s license.", "bodyPlain": "Bessie Coleman first worked as a manicurist in Chicago while saving money for flight lessons. _______ she became the first African American woman to earn an international pilot's license.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "Bessie Coleman 最初在芝加哥當美甲師，同時存錢上飛行課。_______ 她成為第一位取得國際飛行執照的非裔美國女性。", "opts": {"A": "In contrast,", "B": "For example,", "C": "Later,", "D": "Similarly,"}, "optsZh": {"A": "相反地，", "B": "例如，", "C": "後來，", "D": "同樣地，"}, "answer": "C", "expl": "The second event happened later, so \"Later\" fits.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Transitions: choose a transition that shows the passage of time.", "vocab": false, "body": "Satoshi Tajiri spent his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=childhood\" target=\"_blank\" rel=\"noopener\">childhood<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collecting\" target=\"_blank\" rel=\"noopener\">collecting<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=insects\" target=\"_blank\" rel=\"noopener\">insects<\/a> in the fields near his home in Japan. _______ he turned his love of collecting into a video game: Pokémon.", "bodyPlain": "Satoshi Tajiri spent his childhood collecting insects in the fields near his home in Japan. _______ he turned his love of collecting into a video game: Pokémon.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "田尻智童年時在日本家附近的田野收集昆蟲。_______ 他把對收集的熱愛變成了一款電玩遊戲：寶可夢。", "opts": {"A": "Years later,", "B": "Likewise,", "C": "On the contrary,", "D": "For instance,"}, "optsZh": {"A": "多年後，", "B": "同樣地，", "C": "正好相反，", "D": "舉例來說，"}, "answer": "A", "expl": "The second sentence describes what happened next in time.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Transitions: choose a transition that shows the passage of time.", "vocab": false, "body": "Ruth Bader Ginsburg began her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=career\" target=\"_blank\" rel=\"noopener\" data-w=\"career\" data-pos=\"n.\" data-en=\"the series of jobs a person has in their working life\" data-zh=\"職業生涯\">career<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=teaching\" target=\"_blank\" rel=\"noopener\">teaching<\/a> law at Rutgers University. _______ she was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appoint\" target=\"_blank\" rel=\"noopener\" data-w=\"appoint\" data-pos=\"v.\" data-en=\"to choose someone officially for a job or position\" data-zh=\"任命\">appointed<\/a> to the US Supreme Court, where she served for 27 years.", "bodyPlain": "Ruth Bader Ginsburg began her career teaching law at Rutgers University. _______ she was appointed to the US Supreme Court, where she served for 27 years.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "Ruth Bader Ginsburg 的職業生涯始於在羅格斯大學教授法律。_______ 她被任命為美國最高法院大法官，任職長達 27 年。", "opts": {"A": "Therefore,", "B": "Eventually,", "C": "In other words,", "D": "Similarly,"}, "optsZh": {"A": "因此，", "B": "最終，", "C": "換句話說，", "D": "同樣地，"}, "answer": "B", "expl": "The text moves forward in time to what happened afterward.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Transitions: choose a transition that shows the passage of time.", "vocab": false, "body": "Jackie Chan <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trained\" target=\"_blank\" rel=\"noopener\">trained<\/a> in Peking opera as a child, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=learning\" target=\"_blank\" rel=\"noopener\">learning<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=acrobatics\" target=\"_blank\" rel=\"noopener\">acrobatics<\/a> and martial arts. _______ he began working as a stuntman in Hong Kong films.", "bodyPlain": "Jackie Chan trained in Peking opera as a child, learning acrobatics and martial arts. _______ he began working as a stuntman in Hong Kong films.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "成龍小時候學習京劇，練習雜技和武術。_______ 他開始在香港電影中擔任特技演員。", "opts": {"A": "In contrast,", "B": "As a young adult,", "C": "For example,", "D": "Instead,"}, "optsZh": {"A": "相反地，", "B": "成年後，", "C": "例如，", "D": "取而代之，"}, "answer": "B", "expl": "The second sentence describes a later step in his career.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Transitions: choose a transition that points to a future development.", "vocab": false, "body": "Scientists studied how electrical stimulation to the brain affected honeybees’ ability to steer while flying. They were able to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> the parameters for honeybee flight and develop strategies to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manipulate\" target=\"_blank\" rel=\"noopener\" data-w=\"manipulate\" data-pos=\"v.\" data-en=\"to control or change something skillfully\" data-zh=\"操控；操縱\">manipulate<\/a> it. _______ scientists hope to use a similar <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something\" data-zh=\"技巧；方法\">technique<\/a> to control the flight of miniature drones that will perform a variety of tasks for the military and other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industry\" target=\"_blank\" rel=\"noopener\" data-w=\"industry\" data-pos=\"n.\" data-en=\"the businesses that make a particular product\" data-zh=\"產業；工業\">industries<\/a>.", "bodyPlain": "Scientists studied how electrical stimulation to the brain affected honeybees’ ability to steer while flying. They were able to determine the parameters for honeybee flight and develop strategies to manipulate it. _______ scientists hope to use a similar technique to control the flight of miniature drones that will perform a variety of tasks for the military and other industries.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "科學家研究了對大腦的電刺激如何影響蜜蜂飛行時的轉向能力。他們得以確定蜜蜂飛行的參數，並發展出操控牠的策略。_______ 科學家希望用類似的技術控制微型無人機的飛行，讓它們為軍事與其他產業執行各種任務。", "opts": {"A": "In contrast,", "B": "Eventually,", "C": "On one hand,", "D": "Specifically,"}, "optsZh": {"A": "相反地，", "B": "最終，", "C": "一方面，", "D": "具體來說，"}, "answer": "B", "expl": "Controlling drones is a future goal that follows the current research, so 'Eventually' fits. (The original key listed D.)", "explZh": "控制無人機是目前研究之後的未來目標，所以用 Eventually。（原答案列為 D，已修正為 B。）"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Transitions: choose a transition that points to a future development.", "vocab": false, "body": "Engineers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=studied\" target=\"_blank\" rel=\"noopener\">studied<\/a> how geckos stick to walls using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=millions\" target=\"_blank\" rel=\"noopener\">millions<\/a> of tiny hairs on their feet. They were able to copy the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> in a lab. _______ engineers hope to use similar materials to build robots that can climb buildings.", "bodyPlain": "Engineers studied how geckos stick to walls using millions of tiny hairs on their feet. They were able to copy the structure in a lab. _______ engineers hope to use similar materials to build robots that can climb buildings.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "工程師研究壁虎如何利用腳上數百萬根細毛黏在牆上。他們得以在實驗室中複製這種結構。_______ 工程師希望用類似的材料打造能攀爬建築物的機器人。", "opts": {"A": "Specifically,", "B": "Eventually,", "C": "On one hand,", "D": "In contrast,"}, "optsZh": {"A": "具體來說，", "B": "最終，", "C": "一方面，", "D": "相反地，"}, "answer": "B", "expl": "Using the technique on drones is a hoped-for future step, so \"Eventually\" fits.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Transitions: choose a transition that points to a future development.", "vocab": false, "body": "Researchers grew new heart tissue from stem cells in mice and found that it helped <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=damaged\" target=\"_blank\" rel=\"noopener\">damaged<\/a> hearts <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recover\" target=\"_blank\" rel=\"noopener\" data-w=\"recover\" data-pos=\"v.\" data-en=\"to return to a normal or healthy state\" data-zh=\"復原；康復\">recover<\/a>. _______ they hope to use the same method to treat people after heart <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attacks\" target=\"_blank\" rel=\"noopener\">attacks<\/a>.", "bodyPlain": "Researchers grew new heart tissue from stem cells in mice and found that it helped damaged hearts recover. _______ they hope to use the same method to treat people after heart attacks.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "研究人員用幹細胞在小鼠身上培育出新的心臟組織，並發現它能幫助受損的心臟復原。_______ 他們希望用同樣的方法治療心臟病發作後的病人。", "opts": {"A": "For example,", "B": "Someday,", "C": "Similarly,", "D": "In other words,"}, "optsZh": {"A": "例如，", "B": "有朝一日，", "C": "同樣地，", "D": "換句話說，"}, "answer": "B", "expl": "The hope to use the method on people is a future development.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Transitions: choose a transition that points to a future development.", "vocab": false, "body": "Scientists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bacteria-based\" target=\"_blank\" rel=\"noopener\">bacteria-based<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=concrete\" target=\"_blank\" rel=\"noopener\">concrete<\/a> that seals its own cracks in the lab. _______ they hope it will be used to build bridges that repair themselves.", "bodyPlain": "Scientists developed a bacteria-based concrete that seals its own cracks in the lab. _______ they hope it will be used to build bridges that repair themselves.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "科學家在實驗室中開發出一種以細菌為基礎、能自行封住裂縫的混凝土。_______ 他們希望它能用來建造能自我修復的橋梁。", "opts": {"A": "Meanwhile,", "B": "For instance,", "C": "Eventually,", "D": "Instead,"}, "optsZh": {"A": "與此同時，", "B": "舉例來說，", "C": "最終，", "D": "取而代之，"}, "answer": "C", "expl": "Applying the lab result to cities is a future goal: \"Eventually.\"", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Transitions: choose a transition that points to a future development.", "vocab": false, "body": "Botanists bred a type of rice that grows well in salty water. _______ they hope <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=farmers\" target=\"_blank\" rel=\"noopener\">farmers<\/a> in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coastal\" target=\"_blank\" rel=\"noopener\">coastal<\/a> areas <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=affected\" target=\"_blank\" rel=\"noopener\">affected<\/a> by rising seas will be able to plant it.", "bodyPlain": "Botanists bred a type of rice that grows well in salty water. _______ they hope farmers in coastal areas affected by rising seas will be able to plant it.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "植物學家培育出一種能在鹹水中生長良好的稻米。_______ 他們希望受海平面上升影響的沿海地區農民能種植它。", "opts": {"A": "In the future,", "B": "In contrast,", "C": "Similarly,", "D": "For example,"}, "optsZh": {"A": "未來，", "B": "相反地，", "C": "同樣地，", "D": "例如，"}, "answer": "A", "expl": "Planting the rice on coastal farms is a hoped-for future step.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Transitions: choose a transition that points to a future development.", "vocab": false, "body": "Scientists have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=learned\" target=\"_blank\" rel=\"noopener\">learned<\/a> how to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> spider silk using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=genetically\" target=\"_blank\" rel=\"noopener\">genetically<\/a> modified bacteria. _______ they hope to use the strong, light material to make artificial tendons for patients.", "bodyPlain": "Scientists have learned how to produce spider silk using genetically modified bacteria. _______ they hope to use the strong, light material to make artificial tendons for patients.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "科學家已經學會利用基因改造細菌生產蜘蛛絲。_______ 他們希望用這種堅韌又輕盈的材料為病人製作人工肌腱。", "opts": {"A": "Eventually,", "B": "Specifically,", "C": "On the contrary,", "D": "Likewise,"}, "optsZh": {"A": "最終，", "B": "具體來說，", "C": "正好相反，", "D": "同樣地，"}, "answer": "A", "expl": "Using spider silk in medicine is a future hope following current research.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Transitions: choose a transition that introduces a logical conclusion.", "vocab": false, "body": "In order to study an abrupt increase in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=global\" target=\"_blank\" rel=\"noopener\" data-w=\"global\" data-pos=\"adj.\" data-en=\"relating to the whole world\" data-zh=\"全球的；世界的\">global<\/a> mean lower stratosphere <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>, scientists used a time-specific analysis of wildfires in Australia. They <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that the wildfires are the source of this abrupt increase in temperature. _______ reducing the number of wildfires in Australia may help return the temperature to a normal value.", "bodyPlain": "In order to study an abrupt increase in global mean lower stratosphere temperatures, scientists used a time-specific analysis of wildfires in Australia. They determined that the wildfires are the source of this abrupt increase in temperature. _______ reducing the number of wildfires in Australia may help return the temperature to a normal value.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "為了研究全球平均平流層下層溫度的突然升高，科學家針對澳洲野火進行了特定時間的分析。他們確定野火是這次溫度突然升高的來源。_______ 減少澳洲的野火數量可能有助於讓溫度恢復正常。", "opts": {"A": "On the other hand,", "B": "Meanwhile,", "C": "Instead,", "D": "Therefore,"}, "optsZh": {"A": "另一方面，", "B": "與此同時，", "C": "取而代之，", "D": "因此，"}, "answer": "D", "expl": "Since wildfires caused the temperature rise, reducing wildfires should help: a logical conclusion, 'Therefore.'", "explZh": "既然野火造成升溫，減少野火應該有幫助，是合理的結論，所以用 Therefore。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Transitions: choose a transition that introduces a logical conclusion.", "vocab": false, "body": "Researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=studied\" target=\"_blank\" rel=\"noopener\">studied<\/a> air pollution in a large city and found that car exhaust <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produced<\/a> most of the harmful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=particle\" target=\"_blank\" rel=\"noopener\" data-w=\"particle\" data-pos=\"n.\" data-en=\"an extremely small piece of matter\" data-zh=\"粒子；微粒\">particles<\/a>. _______ reducing the number of cars in the city center may greatly improve air quality.", "bodyPlain": "Researchers studied air pollution in a large city and found that car exhaust produced most of the harmful particles. _______ reducing the number of cars in the city center may greatly improve air quality.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "研究人員研究一座大城市的空氣污染，發現汽車廢氣產生了大部分有害微粒。_______ 減少市中心的汽車數量可能會大幅改善空氣品質。", "opts": {"A": "Therefore,", "B": "On the other hand,", "C": "Instead,", "D": "Meanwhile,"}, "optsZh": {"A": "因此，", "B": "另一方面，", "C": "取而代之，", "D": "與此同時，"}, "answer": "A", "expl": "Since cars cause most of the pollution, reducing traffic should help: a conclusion.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Transitions: choose a transition that introduces a logical conclusion.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hospital\" target=\"_blank\" rel=\"noopener\">hospital<\/a> study found that nurses made the most errors at the end of long, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=twelve-hour\" target=\"_blank\" rel=\"noopener\">twelve-hour<\/a> night shifts. _______ shorter shifts may help reduce <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=medical\" target=\"_blank\" rel=\"noopener\" data-w=\"medical\" data-pos=\"adj.\" data-en=\"relating to medicine or health care\" data-zh=\"醫學的；醫療的\">medical<\/a> errors.", "bodyPlain": "A hospital study found that nurses made the most errors at the end of long, twelve-hour night shifts. _______ shorter shifts may help reduce medical errors.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "一項醫院研究發現，護理師在十二小時的漫長夜班結束時犯的錯誤最多。_______ 縮短班表可能有助於減少醫療錯誤。", "opts": {"A": "In contrast,", "B": "Thus,", "C": "For example,", "D": "Meanwhile,"}, "optsZh": {"A": "相反地，", "B": "因此，", "C": "例如，", "D": "與此同時，"}, "answer": "B", "expl": "If lack of sleep causes the errors, more sleep should reduce them: a conclusion.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Transitions: choose a transition that introduces a logical conclusion.", "vocab": false, "body": "Ecologists found that an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invasive\" target=\"_blank\" rel=\"noopener\">invasive<\/a> vine was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=blocking\" target=\"_blank\" rel=\"noopener\">blocking<\/a> sunlight and killing young trees in the forest. _______ removing the vine could allow the forest to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recover\" target=\"_blank\" rel=\"noopener\" data-w=\"recover\" data-pos=\"v.\" data-en=\"to return to a normal or healthy state\" data-zh=\"復原；康復\">recover<\/a>.", "bodyPlain": "Ecologists found that an invasive vine was blocking sunlight and killing young trees in the forest. _______ removing the vine could allow the forest to recover.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "生態學家發現一種外來入侵藤蔓遮蔽了陽光，殺死森林中的幼樹。_______ 移除這種藤蔓可能讓森林得以恢復。", "opts": {"A": "However,", "B": "Instead,", "C": "Consequently,", "D": "Similarly,"}, "optsZh": {"A": "然而，", "B": "取而代之，", "C": "因此，", "D": "同樣地，"}, "answer": "C", "expl": "The cause is the invasive plant, so removing it should help: \"Consequently.\"", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Transitions: choose a transition that introduces a logical conclusion.", "vocab": false, "body": "Scientists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fertilizer\" target=\"_blank\" rel=\"noopener\" data-w=\"fertilizer\" data-pos=\"n.\" data-en=\"a substance added to soil to help plants grow\" data-zh=\"肥料\">fertilizer<\/a> washing off nearby farms was causing harmful algae <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bloom\" target=\"_blank\" rel=\"noopener\" data-w=\"bloom\" data-pos=\"v.\" data-en=\"to produce flowers\" data-zh=\"開花\">blooms<\/a> in the lake. _______ reducing fertilizer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=runoff\" target=\"_blank\" rel=\"noopener\" data-w=\"runoff\" data-pos=\"n.\" data-en=\"rainwater that flows over the ground into streams or drains\" data-zh=\"逕流\">runoff<\/a> may help keep the lake healthy.", "bodyPlain": "Scientists determined that fertilizer washing off nearby farms was causing harmful algae blooms in the lake. _______ reducing fertilizer runoff may help keep the lake healthy.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "科學家確定從附近農場沖刷下來的肥料造成了湖中有害的藻華。_______ 減少肥料逕流可能有助於保持湖泊健康。", "opts": {"A": "Meanwhile,", "B": "In addition,", "C": "Therefore,", "D": "For instance,"}, "optsZh": {"A": "與此同時，", "B": "此外，", "C": "因此，", "D": "舉例來說，"}, "answer": "C", "expl": "If fertilizer runoff causes algae blooms, reducing runoff should help: a conclusion.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Transitions: choose a transition that introduces a logical conclusion.", "vocab": false, "body": "Researchers found that loud <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=construction\" target=\"_blank\" rel=\"noopener\" data-w=\"construction\" data-pos=\"n.\" data-en=\"the process of building something\" data-zh=\"建造；營建\">construction<\/a> noise was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=causing\" target=\"_blank\" rel=\"noopener\">causing<\/a> high stress levels among students in nearby schools. _______ building sound <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=barrier\" target=\"_blank\" rel=\"noopener\" data-w=\"barrier\" data-pos=\"n.\" data-en=\"something that blocks movement or access\" data-zh=\"屏障；障礙\">barriers<\/a> around construction sites may help students concentrate.", "bodyPlain": "Researchers found that loud construction noise was causing high stress levels among students in nearby schools. _______ building sound barriers around construction sites may help students concentrate.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "研究人員發現，嘈雜的施工噪音導致附近學校學生壓力升高。_______ 在工地周圍建造隔音牆可能有助於學生專心。", "opts": {"A": "In contrast,", "B": "On the other hand,", "C": "Thus,", "D": "Similarly,"}, "optsZh": {"A": "相反地，", "B": "另一方面，", "C": "因此，", "D": "同樣地，"}, "answer": "C", "expl": "Since noise causes the stress, quieter areas should reduce it: a conclusion.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: choose a transition that signals a contrast between two things.", "vocab": false, "body": "Ed Yost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=designed\" target=\"_blank\" rel=\"noopener\">designed<\/a> the first modern hot air balloon with an in-flight heating system after working with General Mills on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a>’s research balloons. The first piloted hot air balloon was designed in France, but it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=heated\" target=\"_blank\" rel=\"noopener\" data-w=\"heated\" data-pos=\"adj.\" data-en=\"(of a discussion) full of strong feeling or anger\" data-zh=\"激烈的\">heated<\/a> the air on the ground and came with a large risk of explosion. _______ Yost’s balloon design involved heating the fuel in the air and was much safer.", "bodyPlain": "Ed Yost designed the first modern hot air balloon with an in-flight heating system after working with General Mills on the company’s research balloons. The first piloted hot air balloon was designed in France, but it heated the air on the ground and came with a large risk of explosion. _______ Yost’s balloon design involved heating the fuel in the air and was much safer.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "Ed Yost 在與通用磨坊公司合作研究氣球之後，設計出第一個配備飛行中加熱系統的現代熱氣球。第一個載人熱氣球是在法國設計的，但它是在地面上加熱空氣，而且有很大的爆炸風險。_______ Yost 的熱氣球設計是在空中加熱燃料，安全得多。", "opts": {"A": "Ultimately,", "B": "On the other hand,", "C": "Otherwise,", "D": "Despite this fact,"}, "optsZh": {"A": "最終，", "B": "另一方面，", "C": "否則，", "D": "儘管有這個事實，"}, "answer": "B", "expl": "The French balloon was dangerous, while Yost's was much safer, so the sentence draws a contrast: 'On the other hand.' (The original key listed A.)", "explZh": "法國熱氣球很危險，而 Yost 的熱氣球安全得多，兩者形成對比，所以用 On the other hand。（原答案列為 A，已修正為 B。）"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: choose a transition that signals a contrast between two things.", "vocab": false, "body": "Early miners used <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=open-flame\" target=\"_blank\" rel=\"noopener\">open-flame<\/a> lamps that could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ignite\" target=\"_blank\" rel=\"noopener\" data-w=\"ignite\" data-pos=\"v.\" data-en=\"to start burning; to set on fire\" data-zh=\"點燃；著火\">ignite<\/a> underground gases and cause explosions. _______ the safety lamp <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invent\" target=\"_blank\" rel=\"noopener\" data-w=\"invent\" data-pos=\"v.\" data-en=\"to create something that did not exist before\" data-zh=\"發明\">invented<\/a> by Humphry Davy in 1815 surrounded the flame with wire mesh and greatly reduced this danger.", "bodyPlain": "Early miners used open-flame lamps that could ignite underground gases and cause explosions. _______ the safety lamp invented by Humphry Davy in 1815 surrounded the flame with wire mesh and greatly reduced this danger.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "早期礦工使用明火燈，可能點燃地下氣體而引發爆炸。_______ Humphry Davy 於 1815 年發明的安全燈用金屬網包住火焰，大幅降低了這種危險。", "opts": {"A": "Otherwise,", "B": "By contrast,", "C": "Ultimately,", "D": "Despite this fact,"}, "optsZh": {"A": "否則，", "B": "相比之下，", "C": "最終，", "D": "儘管有這個事實，"}, "answer": "B", "expl": "The older lamp was dangerous; the new one was safe: a contrast.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: choose a transition that signals a contrast between two things.", "vocab": false, "body": "Paper maps must be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=updated\" target=\"_blank\" rel=\"noopener\">updated<\/a> by hand and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=quickly\" target=\"_blank\" rel=\"noopener\">quickly<\/a> become <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=outdated\" target=\"_blank\" rel=\"noopener\">outdated<\/a>. _______ GPS navigation apps update automatically and show changes in traffic in real time.", "bodyPlain": "Paper maps must be updated by hand and quickly become outdated. _______ GPS navigation apps update automatically and show changes in traffic in real time.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "紙本地圖必須用手更新，很快就會過時。_______ GPS 導航應用程式會自動更新，並即時顯示交通變化。", "opts": {"A": "Otherwise,", "B": "Ultimately,", "C": "For instance,", "D": "On the other hand,"}, "optsZh": {"A": "否則，", "B": "最終，", "C": "舉例來說，", "D": "另一方面，"}, "answer": "D", "expl": "Paper maps vs. GPS: the text contrasts them.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: choose a transition that signals a contrast between two things.", "vocab": false, "body": "Coal-burning power plants release large amounts of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=carbon\" target=\"_blank\" rel=\"noopener\" data-w=\"carbon\" data-pos=\"n.\" data-en=\"a chemical element found in all living things\" data-zh=\"碳\">carbon<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dioxide\" target=\"_blank\" rel=\"noopener\" data-w=\"dioxide\" data-pos=\"n.\" data-en=\"a compound with two oxygen atoms (e.g., carbon dioxide)\" data-zh=\"二氧化物\">dioxide<\/a> into the air. _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geothermal\" target=\"_blank\" rel=\"noopener\" data-w=\"geothermal\" data-pos=\"adj.\" data-en=\"relating to the heat inside the Earth\" data-zh=\"地熱的\">geothermal<\/a> plants use heat from underground and release almost no greenhouse gases.", "bodyPlain": "Coal-burning power plants release large amounts of carbon dioxide into the air. _______ geothermal plants use heat from underground and release almost no greenhouse gases.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "燃煤發電廠會向空氣中排放大量二氧化碳。_______ 地熱發電廠利用地底的熱能，幾乎不排放溫室氣體。", "opts": {"A": "In contrast,", "B": "For example,", "C": "Similarly,", "D": "As a result,"}, "optsZh": {"A": "相反地，", "B": "例如，", "C": "同樣地，", "D": "因此，"}, "answer": "A", "expl": "Older fuels polluted heavily; the new one is clean—a contrast.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: choose a transition that signals a contrast between two things.", "vocab": false, "body": "Early <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=bicycles\" target=\"_blank\" rel=\"noopener\">bicycles<\/a> called &quot;<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=penny-farthings\" target=\"_blank\" rel=\"noopener\">penny-farthings<\/a>&quot; had a huge front wheel and were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=difficult\" target=\"_blank\" rel=\"noopener\">difficult<\/a> and dangerous to ride. _______ the &quot;safety bicycle&quot; of the 1880s had two equal-sized wheels and a chain, making it easy for almost anyone to ride.", "bodyPlain": "Early bicycles called \"penny-farthings\" had a huge front wheel and were difficult and dangerous to ride. _______ the \"safety bicycle\" of the 1880s had two eq
