<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Princeton Digital SAT Mock Test - Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Princeton Digital SAT Mock Test - Module 2</h1>
    <p class="subtitle">27 original questions (now interactive) + mock variations = 162 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>

      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>

  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: choose a phrasal verb meaning \"worked together on\" for scientists pooling efforts.", "vocab": true, "body": "During World War II, hundreds of scientists, including many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prominent\" target=\"_blank\" rel=\"noopener\" data-w=\"prominent\" data-pos=\"adj.\" data-en=\"important and easy to notice\" data-zh=\"突出的；顯著的\">prominent<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=physicist\" target=\"_blank\" rel=\"noopener\" data-w=\"physicist\" data-pos=\"n.\" data-en=\"a scientist who studies physics\" data-zh=\"物理學家\">physicists<\/a> such as Robert Oppenheimer, _______ the Manhattan Project, pooling their efforts and expertise in order to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">develop<\/a> the first bombs that successfully exploited the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tremendous\" target=\"_blank\" rel=\"noopener\" data-w=\"tremendous\" data-pos=\"adj.\" data-en=\"very great in amount or degree\" data-zh=\"極大的；巨大的\">tremendous<\/a> power of nuclear energy.", "bodyPlain": "During World War II, hundreds of scientists, including many prominent physicists such as Robert Oppenheimer, _______ the Manhattan Project, pooling their efforts and expertise in order to develop the first bombs that successfully exploited the tremendous power of nuclear energy.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "第二次世界大戰期間，包括 Robert Oppenheimer 等許多傑出物理學家在內的數百名科學家 _______ 曼哈頓計畫，集結彼此的努力與專業，研發出首批成功利用核能巨大威力的炸彈。", "opts": {"A": "collaborated on", "B": "invested with", "C": "plotted against", "D": "learned from"}, "optsZh": {"A": "在……上合作", "B": "被授予（權力）", "C": "密謀反對", "D": "向……學習"}, "answer": "A", "expl": "The scientists pooled their efforts and expertise, which means they worked together, or collaborated on, the project. (The original key listed D.)", "explZh": "科學家集結彼此的努力與專業，代表他們在這個計畫上合作（collaborated on）。（原答案列為 D，已修正為 A。）", "defs": {"A": {"pos": "phr.", "en": "to work together on something", "zh": "在……上合作", "w": "collaborate on", "word": "collaborate on"}, "B": {"pos": "phr.", "en": "to give official power or authority to", "zh": "授予（權力）", "w": "invest with", "word": "invest with"}, "C": {"pos": "phr.", "en": "to secretly plan to harm someone", "zh": "密謀反對", "w": "plot against", "word": "plot against"}, "D": {"pos": "phr.", "en": "to gain knowledge or skill by studying something", "zh": "向……學習", "w": "learn from", "word": "learn from"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: choose a phrasal verb meaning \"worked together on\" for scientists pooling efforts.", "vocab": true, "body": "Engineers from fifteen <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">countries<\/a> _______ the International Space Station, sharing designs and building <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=separate\" target=\"_blank\" rel=\"noopener\" data-w=\"separate\" data-pos=\"v.\" data-en=\"to divide or move things apart\" data-zh=\"分開；分離\">separate<\/a> modules that were later <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=connect\" target=\"_blank\" rel=\"noopener\" data-w=\"connect\" data-pos=\"v.\" data-en=\"to join or link two things together\" data-zh=\"連接\">connected<\/a> in orbit.", "bodyPlain": "Engineers from fifteen countries _______ the International Space Station, sharing designs and building separate modules that were later connected in orbit.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "來自十五個國家的工程師 _______ 國際太空站，分享設計並建造各個獨立艙段，之後在軌道上組接起來。", "opts": {"A": "collaborated on", "B": "invested with", "C": "plotted against", "D": "learned from"}, "optsZh": {"A": "在……上合作", "B": "被授予（權力）", "C": "密謀反對", "D": "向……學習"}, "answer": "A", "expl": "Engineers from several countries pooling their skills worked together, so \"collaborated on\" fits.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "to work together on something", "zh": "在……上合作", "w": "collaborate on", "word": "collaborate on"}, "B": {"pos": "phr.", "en": "to give official power or authority to", "zh": "授予（權力）", "w": "invest with", "word": "invest with"}, "C": {"pos": "phr.", "en": "to secretly plan to harm someone", "zh": "密謀反對", "w": "plot against", "word": "plot against"}, "D": {"pos": "phr.", "en": "to gain knowledge or skill by studying something", "zh": "向……學習", "w": "learn from", "word": "learn from"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: choose a phrasal verb meaning \"worked together on\" for scientists pooling efforts.", "vocab": true, "body": "As a young <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painter\" target=\"_blank\" rel=\"noopener\">painter<\/a>, Vincent van Gogh copied dozens of works by Jean-François Millet, carefully studying how the older artist painted farmers in the fields. Van Gogh <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=clear\" target=\"_blank\" rel=\"noopener\" data-w=\"clear\" data-pos=\"adj./v.\" data-en=\"easy to see or understand; (v.) to remove something blocking, e.g., to clear your throat\" data-zh=\"清楚的；清除、清（喉嚨）\">clearly<\/a> _______ Millet&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">paintings<\/a>, and similar scenes appear throughout his later work.", "bodyPlain": "As a young painter, Vincent van Gogh copied dozens of works by Jean-François Millet, carefully studying how the older artist painted farmers in the fields. Van Gogh clearly _______ Millet's paintings, and similar scenes appear throughout his later work.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "年輕時的畫家梵谷臨摹了數十幅 Jean-François Millet 的作品，仔細研究這位前輩如何描繪田野中的農民。梵谷顯然 _______ Millet 的畫作，類似的場景遍布在他後來的作品中。", "opts": {"A": "collaborated on", "B": "invested with", "C": "plotted against", "D": "learned from"}, "optsZh": {"A": "在……上合作", "B": "被授予（權力）", "C": "密謀反對", "D": "向……學習"}, "answer": "D", "expl": "Studying the old master's paintings to improve shows the young artist \"learned from\" them.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "to work together on something", "zh": "在……上合作", "w": "collaborate on", "word": "collaborate on"}, "B": {"pos": "phr.", "en": "to give official power or authority to", "zh": "授予（權力）", "w": "invest with", "word": "invest with"}, "C": {"pos": "phr.", "en": "to secretly plan to harm someone", "zh": "密謀反對", "w": "plot against", "word": "plot against"}, "D": {"pos": "phr.", "en": "to gain knowledge or skill by studying something", "zh": "向……學習", "w": "learn from", "word": "learn from"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: choose a phrasal verb meaning \"worked together on\" for scientists pooling efforts.", "vocab": true, "body": "Historians believe that several Roman <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=senators\" target=\"_blank\" rel=\"noopener\">senators<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secretly\" target=\"_blank\" rel=\"noopener\">secretly<\/a> _______ Julius Caesar for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=month\" target=\"_blank\" rel=\"noopener\" data-w=\"month\" data-pos=\"n.\" data-en=\"one of the twelve periods of time into which a year is divided\" data-zh=\"月\">months<\/a>, meeting in private homes to plan the attack that took place on March 15, 44 BCE.", "bodyPlain": "Historians believe that several Roman senators secretly _______ Julius Caesar for months, meeting in private homes to plan the attack that took place on March 15, 44 BCE.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "歷史學家認為，幾位羅馬元老院議員數月來秘密地 _______ 凱撒，在私人住宅中聚會，策劃了西元前 44 年 3 月 15 日的那場襲擊。", "opts": {"A": "collaborated on", "B": "invested with", "C": "plotted against", "D": "learned from"}, "optsZh": {"A": "在……上合作", "B": "被授予（權力）", "C": "密謀反對", "D": "向……學習"}, "answer": "C", "expl": "Secretly planning to overthrow the emperor means they \"plotted against\" him.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "to work together on something", "zh": "在……上合作", "w": "collaborate on", "word": "collaborate on"}, "B": {"pos": "phr.", "en": "to give official power or authority to", "zh": "授予（權力）", "w": "invest with", "word": "invest with"}, "C": {"pos": "phr.", "en": "to secretly plan to harm someone", "zh": "密謀反對", "w": "plot against", "word": "plot against"}, "D": {"pos": "phr.", "en": "to gain knowledge or skill by studying something", "zh": "向……學習", "w": "learn from", "word": "learn from"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: choose a phrasal verb meaning \"worked together on\" for scientists pooling efforts.", "vocab": true, "body": "When she became the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">country<\/a>&#x27;s first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> chief justice, Beverley McLachlin was _______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> to lead Canada&#x27;s highest court and shape its decisions for nearly two decades.", "bodyPlain": "When she became the country's first female chief justice, Beverley McLachlin was _______ the authority to lead Canada's highest court and shape its decisions for nearly two decades.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "當 Beverley McLachlin 成為該國第一位女性首席大法官時，她 _______ 領導加拿大最高法院的權力，並在將近二十年間影響其判決。", "opts": {"A": "collaborated on", "B": "invested with", "C": "plotted against", "D": "learned from"}, "optsZh": {"A": "在……上合作", "B": "被授予（權力）", "C": "密謀反對", "D": "向……學習"}, "answer": "B", "expl": "Being given official power or authority is being \"invested with\" it.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "to work together on something", "zh": "在……上合作", "w": "collaborate on", "word": "collaborate on"}, "B": {"pos": "phr.", "en": "to give official power or authority to", "zh": "授予（權力）", "w": "invest with", "word": "invest with"}, "C": {"pos": "phr.", "en": "to secretly plan to harm someone", "zh": "密謀反對", "w": "plot against", "word": "plot against"}, "D": {"pos": "phr.", "en": "to gain knowledge or skill by studying something", "zh": "向……學習", "w": "learn from", "word": "learn from"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: choose a phrasal verb meaning \"worked together on\" for scientists pooling efforts.", "vocab": true, "body": "Authors Neil Gaiman and Terry Pratchett _______ the novel Good Omens, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mailing\" target=\"_blank\" rel=\"noopener\">mailing<\/a> floppy disks back and forth and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calling\" target=\"_blank\" rel=\"noopener\">calling<\/a> each other almost every day to plan the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>.", "bodyPlain": "Authors Neil Gaiman and Terry Pratchett _______ the novel Good Omens, mailing floppy disks back and forth and calling each other almost every day to plan the story.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "作家 Neil Gaiman 和 Terry Pratchett _______ 小說《好預兆》，他們互寄磁碟片，幾乎每天打電話討論故事情節。", "opts": {"A": "collaborated on", "B": "invested with", "C": "plotted against", "D": "learned from"}, "optsZh": {"A": "在……上合作", "B": "被授予（權力）", "C": "密謀反對", "D": "向……學習"}, "answer": "A", "expl": "Two authors writing a book together \"collaborated on\" it.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "to work together on something", "zh": "在……上合作", "w": "collaborate on", "word": "collaborate on"}, "B": {"pos": "phr.", "en": "to give official power or authority to", "zh": "授予（權力）", "w": "invest with", "word": "invest with"}, "C": {"pos": "phr.", "en": "to secretly plan to harm someone", "zh": "密謀反對", "w": "plot against", "word": "plot against"}, "D": {"pos": "phr.", "en": "to gain knowledge or skill by studying something", "zh": "向……學習", "w": "learn from", "word": "learn from"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: choose a noun meaning \"method\" for a farming practice.", "vocab": true, "body": "Advising farmers on how to prevent the disruption of soil due to plowing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expert\" target=\"_blank\" rel=\"noopener\" data-w=\"expert\" data-pos=\"n.\" data-en=\"a person with special knowledge or skill\" data-zh=\"專家\">experts<\/a> in agriculture have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recommend\" target=\"_blank\" rel=\"noopener\" data-w=\"recommend\" data-pos=\"v.\" data-en=\"to suggest something as good or suitable\" data-zh=\"推薦；建議\">recommended<\/a> the method of no-till farming. This _______ allows for soil to remain settled while seeds are planted, unlike <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> practices in which the soil is disturbed in order for new crops to be grown, thus making sowing easier to manage. Through no-till farming, agriculturalists are able to grow new batches with very little labor or equipment required.", "bodyPlain": "Advising farmers on how to prevent the disruption of soil due to plowing, experts in agriculture have recommended the method of no-till farming. This _______ allows for soil to remain settled while seeds are planted, unlike traditional practices in which the soil is disturbed in order for new crops to be grown, thus making sowing easier to manage. Through no-till farming, agriculturalists are able to grow new batches with very little labor or equipment required.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "為了指導農民如何避免因犁田而擾動土壤，農業專家推薦了免耕農法。這種 _______ 讓土壤在播種時保持穩定，不像傳統做法需要翻動土壤才能種植新作物，因此讓播種更容易管理。透過免耕農法，農業工作者只需很少的人力或設備就能種植新一批作物。", "opts": {"A": "intention", "B": "agenda", "C": "distraction", "D": "technique"}, "optsZh": {"A": "意圖；打算", "B": "議程", "C": "使人分心的事物", "D": "技巧；方法"}, "answer": "D", "expl": "No-till farming is described as a method, so 'technique' (a way of doing something) fits. (The original key listed A.)", "explZh": "免耕農法被描述為一種方法，所以用 technique（技巧、方法）。（原答案列為 A，已修正為 D。）", "defs": {"A": {"pos": "n.", "en": "something you plan to do", "zh": "意圖；打算", "word": "intention"}, "B": {"pos": "n.", "en": "a list of things to be discussed at a meeting", "zh": "議程", "word": "agenda"}, "C": {"pos": "n.", "en": "something that takes your attention away", "zh": "使人分心的事物", "word": "distraction"}, "D": {"pos": "n.", "en": "a particular way of doing something", "zh": "技巧；方法", "word": "technique"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: choose a noun meaning \"method\" for a farming practice.", "vocab": true, "body": "Maple syrup <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=producers\" target=\"_blank\" rel=\"noopener\">producers<\/a> use a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=careful\" target=\"_blank\" rel=\"noopener\">careful<\/a> _______ to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collect\" target=\"_blank\" rel=\"noopener\">collect<\/a> sap: they drill a small hole in the tree, insert a spout, and let the sap drip slowly into a bucket without harming the tree.", "bodyPlain": "Maple syrup producers use a careful _______ to collect sap: they drill a small hole in the tree, insert a spout, and let the sap drip slowly into a bucket without harming the tree.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "楓糖漿生產者使用一種細心的 _______ 來收集樹液：他們在樹上鑽一個小洞、插入導管，讓樹液慢慢滴進桶子裡，而不會傷害樹木。", "opts": {"A": "intention", "B": "agenda", "C": "distraction", "D": "technique"}, "optsZh": {"A": "意圖；打算", "B": "議程", "C": "使人分心的事物", "D": "技巧；方法"}, "answer": "D", "expl": "A specific way of doing something—tapping the tree—is a \"technique.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "something you plan to do", "zh": "意圖；打算", "word": "intention"}, "B": {"pos": "n.", "en": "a list of things to be discussed at a meeting", "zh": "議程", "word": "agenda"}, "C": {"pos": "n.", "en": "something that takes your attention away", "zh": "使人分心的事物", "word": "distraction"}, "D": {"pos": "n.", "en": "a particular way of doing something", "zh": "技巧；方法", "word": "technique"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: choose a noun meaning \"method\" for a farming practice.", "vocab": true, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=announce\" target=\"_blank\" rel=\"noopener\" data-w=\"announce\" data-pos=\"v.\" data-en=\"to make something known publicly\" data-zh=\"宣布\">announced<\/a> its _______ to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=replace\" target=\"_blank\" rel=\"noopener\">replace<\/a> all of its delivery trucks with electric vehicles by 2030, though it has not yet said how it will pay for the change.", "bodyPlain": "The company announced its _______ to replace all of its delivery trucks with electric vehicles by 2030, though it has not yet said how it will pay for the change.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這家公司宣布了它 _______ 在 2030 年前把所有送貨卡車換成電動車，但尚未說明要如何支付這項改變的費用。", "opts": {"A": "intention", "B": "agenda", "C": "distraction", "D": "technique"}, "optsZh": {"A": "意圖；打算", "B": "議程", "C": "使人分心的事物", "D": "技巧；方法"}, "answer": "A", "expl": "What the company plans to do is its \"intention.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "something you plan to do", "zh": "意圖；打算", "word": "intention"}, "B": {"pos": "n.", "en": "a list of things to be discussed at a meeting", "zh": "議程", "word": "agenda"}, "C": {"pos": "n.", "en": "something that takes your attention away", "zh": "使人分心的事物", "word": "distraction"}, "D": {"pos": "n.", "en": "a particular way of doing something", "zh": "技巧；方法", "word": "technique"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: choose a noun meaning \"method\" for a farming practice.", "vocab": true, "body": "The first item on the city <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=council\" target=\"_blank\" rel=\"noopener\">council<\/a>&#x27;s _______ for Tuesday&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=meeting\" target=\"_blank\" rel=\"noopener\">meeting<\/a> is the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=proposal\" target=\"_blank\" rel=\"noopener\">proposal<\/a> to build a new public library; budget questions will be discussed afterward.", "bodyPlain": "The first item on the city council's _______ for Tuesday's meeting is the proposal to build a new public library; budget questions will be discussed afterward.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "市議會週二會議 _______ 上的第一項是興建新公共圖書館的提案；預算問題將在之後討論。", "opts": {"A": "intention", "B": "agenda", "C": "distraction", "D": "technique"}, "optsZh": {"A": "意圖；打算", "B": "議程", "C": "使人分心的事物", "D": "技巧；方法"}, "answer": "B", "expl": "A list of topics to discuss at a meeting is an \"agenda.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "something you plan to do", "zh": "意圖；打算", "word": "intention"}, "B": {"pos": "n.", "en": "a list of things to be discussed at a meeting", "zh": "議程", "word": "agenda"}, "C": {"pos": "n.", "en": "something that takes your attention away", "zh": "使人分心的事物", "word": "distraction"}, "D": {"pos": "n.", "en": "a particular way of doing something", "zh": "技巧；方法", "word": "technique"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: choose a noun meaning \"method\" for a farming practice.", "vocab": true, "body": "Researchers found that a phone simply <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sitting\" target=\"_blank\" rel=\"noopener\">sitting<\/a> on a desk can be a _______: students whose phones were in view scored lower on memory tests than students whose phones were in another room.", "bodyPlain": "Researchers found that a phone simply sitting on a desk can be a _______: students whose phones were in view scored lower on memory tests than students whose phones were in another room.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "研究人員發現，光是放在桌上的手機就可能是一種 _______：手機在視線範圍內的學生，記憶測驗的得分比手機放在另一個房間的學生低。", "opts": {"A": "intention", "B": "agenda", "C": "distraction", "D": "technique"}, "optsZh": {"A": "意圖；打算", "B": "議程", "C": "使人分心的事物", "D": "技巧；方法"}, "answer": "C", "expl": "Something that pulls attention away from studying is a \"distraction.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "something you plan to do", "zh": "意圖；打算", "word": "intention"}, "B": {"pos": "n.", "en": "a list of things to be discussed at a meeting", "zh": "議程", "word": "agenda"}, "C": {"pos": "n.", "en": "something that takes your attention away", "zh": "使人分心的事物", "word": "distraction"}, "D": {"pos": "n.", "en": "a particular way of doing something", "zh": "技巧；方法", "word": "technique"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: choose a noun meaning \"method\" for a farming practice.", "vocab": true, "body": "Japanese <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=swordsmiths\" target=\"_blank\" rel=\"noopener\">swordsmiths<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=develop\" target=\"_blank\" rel=\"noopener\" data-w=\"develop\" data-pos=\"v.\" data-en=\"to create or produce something new over time\" data-zh=\"開發；發展\">developed<\/a> a _______ of folding and hammering steel many times, which removed impurities and made their blades both strong and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flexible\" target=\"_blank\" rel=\"noopener\" data-w=\"flexible\" data-pos=\"adj.\" data-en=\"able to bend easily\" data-zh=\"可彎曲的；有彈性的\">flexible<\/a>.", "bodyPlain": "Japanese swordsmiths developed a _______ of folding and hammering steel many times, which removed impurities and made their blades both strong and flexible.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "日本刀匠發展出一種多次摺疊並鍛打鋼材的 _______，能去除雜質，讓刀刃既堅固又有彈性。", "opts": {"A": "intention", "B": "agenda", "C": "distraction", "D": "technique"}, "optsZh": {"A": "意圖；打算", "B": "議程", "C": "使人分心的事物", "D": "技巧；方法"}, "answer": "D", "expl": "The method of folding steel many times is a \"technique.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "something you plan to do", "zh": "意圖；打算", "word": "intention"}, "B": {"pos": "n.", "en": "a list of things to be discussed at a meeting", "zh": "議程", "word": "agenda"}, "C": {"pos": "n.", "en": "something that takes your attention away", "zh": "使人分心的事物", "word": "distraction"}, "D": {"pos": "n.", "en": "a particular way of doing something", "zh": "技巧；方法", "word": "technique"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: choose a noun meaning \"the act of passing information along\" for animal communication.", "vocab": true, "body": "Ethologists and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=beekeepers\" target=\"_blank\" rel=\"noopener\">beekeepers<\/a> use the phrase “waggle dance” to describe the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=movement\" target=\"_blank\" rel=\"noopener\">movement<\/a> a bee makes in order to communicate with other bees in the colony about the location of resources. This silent _______ of information among the bees allows them to pass on knowledge of how close or far away a source is and what direction it is in. The source being broadcasted can be a site for possible nesting or an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opportunity\" target=\"_blank\" rel=\"noopener\" data-w=\"opportunity\" data-pos=\"n.\" data-en=\"a chance to do something\" data-zh=\"機會\">opportunity<\/a> for sustenance.", "bodyPlain": "Ethologists and beekeepers use the phrase “waggle dance” to describe the movement a bee makes in order to communicate with other bees in the colony about the location of resources. This silent _______ of information among the bees allows them to pass on knowledge of how close or far away a source is and what direction it is in. The source being broadcasted can be a site for possible nesting or an opportunity for sustenance.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "動物行為學家與養蜂人用「搖擺舞」來描述蜜蜂為了告訴蜂群其他蜜蜂資源位置所做的動作。這種蜜蜂之間無聲的資訊 _______，讓牠們能傳遞食物來源有多遠、在哪個方向的知識。被傳達的地點可能是可築巢的地方，也可能是覓食的機會。", "opts": {"A": "transmission", "B": "confidence", "C": "prolongation", "D": "devastation"}, "optsZh": {"A": "傳遞；傳播", "B": "信心；自信", "C": "延長", "D": "嚴重破壞；浩劫"}, "answer": "A", "expl": "The dance passes information from bee to bee, which is a transmission of information. (The original key listed B.)", "explZh": "搖擺舞把資訊從一隻蜜蜂傳給另一隻，是資訊的傳遞（transmission）。（原答案列為 B，已修正為 A。）", "defs": {"A": {"pos": "n.", "en": "the act of passing something from one to another", "zh": "傳遞；傳播", "word": "transmission"}, "B": {"pos": "n.", "en": "a feeling of being sure of yourself", "zh": "信心；自信", "word": "confidence"}, "C": {"pos": "n.", "en": "the act of making something last longer", "zh": "延長", "word": "prolongation"}, "D": {"pos": "n.", "en": "great damage or destruction", "zh": "嚴重破壞；浩劫", "word": "devastation"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: choose a noun meaning \"the act of passing information along\" for animal communication.", "vocab": true, "body": "Humpback whales sing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complex\" target=\"_blank\" rel=\"noopener\">complex<\/a> songs that can travel <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hundreds\" target=\"_blank\" rel=\"noopener\">hundreds<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=kilometers\" target=\"_blank\" rel=\"noopener\">kilometers<\/a> underwater. Scientists believe this long-distance _______ of sound helps whales locate one another across the open ocean.", "bodyPlain": "Humpback whales sing complex songs that can travel hundreds of kilometers underwater. Scientists believe this long-distance _______ of sound helps whales locate one another across the open ocean.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "座頭鯨會唱出能在水中傳播數百公里的複雜歌曲。科學家認為這種長距離的聲音 _______ 能幫助鯨魚在廣闊海洋中找到彼此。", "opts": {"A": "transmission", "B": "confidence", "C": "prolongation", "D": "devastation"}, "optsZh": {"A": "傳遞；傳播", "B": "信心；自信", "C": "延長", "D": "嚴重破壞；浩劫"}, "answer": "A", "expl": "Whales sending songs to others over long distances is the \"transmission\" of sound.", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the act of passing something from one to another", "zh": "傳遞；傳播", "word": "transmission"}, "B": {"pos": "n.", "en": "a feeling of being sure of yourself", "zh": "信心；自信", "word": "confidence"}, "C": {"pos": "n.", "en": "the act of making something last longer", "zh": "延長", "word": "prolongation"}, "D": {"pos": "n.", "en": "great damage or destruction", "zh": "嚴重破壞；浩劫", "word": "devastation"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: choose a noun meaning \"the act of passing information along\" for animal communication.", "vocab": true, "body": "After <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=winning\" target=\"_blank\" rel=\"noopener\">winning<\/a> her first three <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=competitions\" target=\"_blank\" rel=\"noopener\">competitions<\/a>, the young <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pianist\" target=\"_blank\" rel=\"noopener\">pianist<\/a> performed with new _______, playing the most difficult passages without hesitation.", "bodyPlain": "After winning her first three competitions, the young pianist performed with new _______, playing the most difficult passages without hesitation.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "在贏得前三場比賽後，這位年輕鋼琴家帶著新的 _______ 演奏，毫不猶豫地彈奏最困難的段落。", "opts": {"A": "transmission", "B": "confidence", "C": "prolongation", "D": "devastation"}, "optsZh": {"A": "傳遞；傳播", "B": "信心；自信", "C": "延長", "D": "嚴重破壞；浩劫"}, "answer": "B", "expl": "After many successful performances, she felt sure of herself: \"confidence.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the act of passing something from one to another", "zh": "傳遞；傳播", "word": "transmission"}, "B": {"pos": "n.", "en": "a feeling of being sure of yourself", "zh": "信心；自信", "word": "confidence"}, "C": {"pos": "n.", "en": "the act of making something last longer", "zh": "延長", "word": "prolongation"}, "D": {"pos": "n.", "en": "great damage or destruction", "zh": "嚴重破壞；浩劫", "word": "devastation"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: choose a noun meaning \"the act of passing information along\" for animal communication.", "vocab": true, "body": "Warmer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=autumns\" target=\"_blank\" rel=\"noopener\">autumns<\/a> in Canada have led to the _______ of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=growing\" target=\"_blank\" rel=\"noopener\">growing<\/a> season, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=allowing\" target=\"_blank\" rel=\"noopener\">allowing<\/a> some farmers to harvest their crops up to two weeks later than they did in the 1980s.", "bodyPlain": "Warmer autumns in Canada have led to the _______ of the growing season, allowing some farmers to harvest their crops up to two weeks later than they did in the 1980s.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "加拿大較溫暖的秋季造成了生長季的 _______，讓一些農民收成的時間比 1980 年代晚了多達兩週。", "opts": {"A": "transmission", "B": "confidence", "C": "prolongation", "D": "devastation"}, "optsZh": {"A": "傳遞；傳播", "B": "信心；自信", "C": "延長", "D": "嚴重破壞；浩劫"}, "answer": "C", "expl": "Making the season last longer is its \"prolongation.\"", "explZh": "", "defs": {"A": {"pos": "n.", "en": "the act of passing something from one to another", "zh": "傳遞；傳播", "word": "transmission"}, "B": {"pos": "n.", "en": "a feeling of being sure of yourself", "zh": "信心；自信", "word": "confidence"}, "C": {"pos": "n.", "en": "the act of making something last longer", "zh": "延長", "word": "prolongation"}, "D": {"pos": "n.", "en": "great damage or destruction", "zh": "嚴重破壞；浩劫", "word": "devastation"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: choose a noun meaning \"the act of passing information along\" for animal communication.", "vocab": true, "body": "When Hurricane Maria struck Puerto Rico in 2017, the _______ was enormous: the storm destroyed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=thousand\" target=\"_blank\" rel=\"noopener\" data-w=\"thousand\" data-pos=\"n.\" data-en=\"the number 1,000\" data-zh=\"千\">thousands<\/a> of homes and left most of the island without <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electricity\" target=\"_blank\" rel=\"noopener\" data-w=\"electricity\" data-pos=\"n.\" data-en=\"a form of energy used for light, heat, and power\" data-zh=\"電；電力\">electricity<\/a> for <a class=\"dict\" href=\"https://dictionary.ca n others.\"", "vocab": true, "body": "Chronic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hepatitis\" target=\"_blank\" rel=\"noopener\">hepatitis<\/a> B (CHB) can _______ affect Asian Americans and Pacific Islanders (AAPIs), who are not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=affected\" target=\"_blank\" rel=\"noopener\">affected<\/a> by most other major hepatitis <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strain\" target=\"_blank\" rel=\"noopener\" data-w=\"strain\" data-pos=\"n.\" data-en=\"force that stretches or pressures a material\" data-zh=\"應變；拉力\">strains<\/a>. While everyone should be screened for hepatitis viruses, AAPIs are strongly encouraged to get tested and treated for chronic hepatitis B.", "bodyPlain": "Chronic hepatitis B (CHB) can _______ affect Asian Americans and Pacific Islanders (AAPIs), who are not affected by most other major hepatitis strains. While everyone should be screened for hepatitis viruses, AAPIs are strongly encouraged to get tested and treated for chronic hepatitis B.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "慢性 B 型肝炎（CHB）可能 _______ 影響亞裔美國人與太平洋島民（AAPI），而他們較不受其他主要肝炎病毒株影響。雖然每個人都應該接受肝炎病毒篩檢，但特別強烈建議 AAPI 接受慢性 B 型肝炎的檢測與治療。", "opts": {"A": "disproportionately", "B": "exclusively", "C": "essentially", "D": "initially"}, "optsZh": {"A": "不成比例地；過度地", "B": "唯一地；專門地", "C": "本質上；基本上", "D": "起初；最初"}, "answer": "A", "expl": "AAPIs are affected far more than others and are strongly urged to get tested, so CHB affects them disproportionately. (The original key listed D.)", "explZh": "AAPI 受影響的程度遠高於其他族群，並被強烈建議接受檢測，所以 CHB 不成比例地（disproportionately）影響他們。（原答案列為 D，已修正為 A。）", "defs": {"A": {"pos": "adv.", "en": "to a much greater degree than others", "zh": "不成比例地；過度地", "word" ss=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cycle\" target=\"_blank\" rel=\"noopener\" data-w=\"cycle\" data-pos=\"n.\" data-en=\"a series of events that repeat in the same order\" data-zh=\"循環；週期\">cycle<\/a>.", "bodyPlain": "To help students understand how blood moves through the body, the textbook uses colorful diagrams to _______ each stage of the heart's pumping cycle.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "為了幫助學生了解血液如何在體內流動，課本用彩色圖解來 _______ 心臟搏動週期的每個階段。", "opts": {"A": "trivialize", "B": "illustrate", "C": "dismiss", "D": "promote"}, "optsZh": {"A": "輕視；使顯得微不足道", "B": "說明；以圖解釋", "C": "駁斥；不予理會", "D": "推廣；促進"}, "answer": "B", "expl": "Using drawings to show how the heart works is to \"illustrate\" it.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something seem less important than it is", "zh": "輕視；使顯得微不足道", "word": "trivialize"}, "B": {"pos": "v.", "en": "to explain or show with pictures or examples", "zh": "說明；以圖解釋", "word": "illustrate"}, "C": {"pos": "v.", "en": "to reject an idea as not worth considering", "zh": "駁斥；不予理會", "word": "dismiss"}, "D": {"pos": "v.", "en": "to encourage or support something", "zh": "推廣；促進", "word": "promote"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: choose a verb meaning \"reject as not worth considering.\"", "vocab": true, "body": "The city <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=launched\" target=\"_blank\" rel=\"noopener\">launched<\/a> a summer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaign<\/a> to _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reading\" target=\"_blank\" rel=\"noopener\">reading<\/a> among children, offering free books and prizes to students who read at least ten books.", "bodyPlain": "The city launched a summer campaign to _______ reading among children, offering free books and prizes to students who read at least ten books.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "市政府推出一項暑期活動來 _______ 兒童閱讀，提供免費書籍，並獎勵讀完至少十本書的學生。", "opts": {"A": "trivialize", "B": "illustrate", "C": "dismiss", "D": "promote"}, "optsZh": {"A": "輕視；使顯得微不足道", "B": "說明；以圖解釋", "C": "駁斥；不予理會", "D": "推廣；促進"}, "answer": "D", "expl": "A campaign that encourages people to read is meant to \"promote\" reading.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something seem less important than it is", "zh": "輕視；使顯得微不足道", "word": "trivialize"}, "B": {"pos": "v.", "en": "to explain or show with pictures or examples", "zh": "說明；以圖解釋", "word": "illustrate"}, "C": {"pos": "v.", "en": "to reject an idea as not worth considering", "zh": "駁斥；不予理會", "word": "dismiss"}, "D": {"pos": "v.", "en": "to encourage or support something", "zh": "推廣；促進", "word": "promote"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: choose a verb meaning \"reject as not worth considering.\"", "vocab": true, "body": "Doctors warn that people should not _______ sleep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=problems\" target=\"_blank\" rel=\"noopener\">problems<\/a> by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=treating\" target=\"_blank\" rel=\"noopener\">treating<\/a> them as a minor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=annoyance\" target=\"_blank\" rel=\"noopener\">annoyance<\/a>; long-term sleep loss is linked to heart disease and memory problems.", "bodyPlain": "Doctors warn that people should not _______ sleep problems by treating them as a minor annoyance; long-term sleep loss is linked to heart disease and memory problems.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "醫師警告，人們不應該把睡眠問題當成小困擾而 _______ 它；長期睡眠不足與心臟病和記憶問題有關。", "opts": {"A": "trivialize", "B": "illustrate", "C": "dismiss", "D": "promote"}, "optsZh": {"A": "輕視；使顯得微不足道", "B": "說明；以圖解釋", "C": "駁斥；不予理會", "D": "推廣；促進"}, "answer": "A", "expl": "Treating a serious problem as unimportant is to \"trivialize\" it.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something seem less important than it is", "zh": "輕視；使顯得微不足道", "word": "trivialize"}, "B": {"pos": "v.", "en": "to explain or show with pictures or examples", "zh": "說明；以圖解釋", "word": "illustrate"}, "C": {"pos": "v.", "en": "to reject an idea as not worth considering", "zh": "駁斥；不予理會", "word": "dismiss"}, "D": {"pos": "v.", "en": "to encourage or support something", "zh": "推廣；促進", "word": "promote"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: choose a verb meaning \"reject as not worth considering.\"", "vocab": true, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=popular\" target=\"_blank\" rel=\"noopener\" data-w=\"popular\" data-pos=\"adj.\" data-en=\"liked or enjoyed by many people\" data-zh=\"受歡迎的；流行的\">popular<\/a> story claims that Marie Antoinette said &quot;Let them eat cake,&quot; but most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> _______ the tale as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fiction\" target=\"_blank\" rel=\"noopener\" data-w=\"fiction\" data-pos=\"n.\" data-en=\"stories about imaginary people and events\" data-zh=\"小說；虛構作品\">fiction<\/a>, noting that the phrase appeared in print before she ever <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=arrive\" target=\"_blank\" rel=\"noopener\" data-w=\"arrive\" data-pos=\"v.\" data-en=\"to reach a place at the end of a journey\" data-zh=\"抵達；到達\">arrived<\/a> in France.", "bodyPlain": "A popular story claims that Marie Antoinette said \"Let them eat cake,\" but most historians _______ the tale as fiction, noting that the phrase appeared in print before she ever arrived in France.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "一個流行的故事說瑪麗·安東尼曾說過「讓他們吃蛋糕吧」，但大多數歷史學家 _______ 這個故事是虛構的，並指出這句話在她來到法國之前就已出現在出版物中。", "opts": {"A": "trivialize", "B": "illustrate", "C": "dismiss", "D": "promote"}, "optsZh": {"A": "輕視；使顯得微不足道", "B": "說明；以圖解釋", "C": "駁斥；不予理會", "D": "推廣；促進"}, "answer": "C", "expl": "Historians reject the story as false: they \"dismiss\" it.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something seem less important than it is", "zh": "輕視；使顯得微不足道", "word": "trivialize"}, "B": {"pos": "v.", "en": "to explain or show with pictures or examples", "zh": "說明；以圖解釋", "word": "illustrate"}, "C": {"pos": "v.", "en": "to reject an idea as not worth considering", "zh": "駁斥；不予理會", "word": "dismiss"}, "D": {"pos": "v.", "en": "to encourage or support something", "zh": "推廣；促進", "word": "promote"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Words in Context: identify the meaning of a phrase (\"bring out\") as used in a literary text.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Honoré de Balzac’s 1829 novel The Chouans. Marie, an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=aristocrat\" target=\"_blank\" rel=\"noopener\">aristocrat<\/a>, is tidying a room and speaking to Francine, her maid.<br>She began to arrange the silk and muslin curtains which draped the window, making them intercept the light and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> in the room a voluptuous chiaroscuro.<br>“Francine,” she said, “take away those knick-knacks on the mantelpiece; leave only the clock and the two Dresden vases. I’ll fill those vases myself with the flowers Corentin brought me. Take out the chairs, I want only this sofa and a fauteuil. Then sweep the carpet, so as to bring out the colors, and put wax candles in the sconces and on the mantel.”", "bodyPlain": "The following text is adapted from Honoré de Balzac’s 1829 novel The Chouans. Marie, an aristocrat, is tidying a room and speaking to Francine, her maid.\nShe began to arrange the silk and muslin curtains which draped the window, making them intercept the light and produce in the room a voluptuous chiaroscuro.\n“Francine,” she said, “take away those knick-knacks on the mantelpiece; leave only the clock and the two Dresden vases. I’ll fill those vases myself with the flowers Corentin brought me. Take out the chairs, I want only this sofa and a fauteuil. Then sweep the carpet, so as to bring out the colors, and put wax candles in the sconces and on the mantel.”", "stem": "As used in the text, what does the phrase “bring out” most nearly mean?", "stemZh": "根據文中的用法，片語「bring out」的意思最接近什麼？", "bodyZh": "以下文字改編自巴爾札克 1829 年的小說《舒昂黨人》。貴族女子 Marie 正在整理房間，並對她的女僕 Francine 說話。\n她開始整理掛在窗前的絲綢與薄紗窗簾，讓它們擋住光線，在房間裡營造出一種撩人的明暗對比。\n「Francine，」她說，「把壁爐架上那些小擺飾拿走；只留下時鐘和那兩個德勒斯登花瓶。我會親自用 Corentin 送我的花把花瓶插滿。把椅子拿出去，我只要這張沙發和一張扶手椅。然後把地毯掃一掃，好讓顏色 bring out，再把蠟燭插在壁燈座和壁爐架上。」", "opts": {"A": "Distribute", "B": "Transport", "C": "Introduce", "D": "Emphasize"}, "optsZh": {"A": "分發；分配", "B": "運送", "C": "引進；介紹", "D": "強調；突顯"}, "answer": "D", "expl": "Sweeping the carpet makes its colors more noticeable, so 'bring out' means emphasize. (The original key listed A.)", "explZh": "掃地毯會讓地毯的顏色更明顯，所以 bring out 意為強調、突顯（emphasize）。（原答案列為 A，已修正為 D。）", "defs": {"A": {"pos": "v.", "en": "to give out to many people", "zh": "分發；分配", "w": "distribute", "word": "distribute"}, "B": {"pos": "v.", "en": "to carry from one place to another", "zh": "運送", "w": "transport", "word": "transport"}, "C": {"pos": "v.", "en": "to bring in something new", "zh": "引進；介紹", "w": "introduce", "word": "introduce"}, "D": {"pos": "v.", "en": "to make something more noticeable or important", "zh": "強調；突顯", "w": "emphasize", "word": "emphasize"}}}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Words in Context: identify the meaning of a phrase (\"bring out\") as used in a literary text.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>.<br>The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gallery\" target=\"_blank\" rel=\"noopener\" data-w=\"gallery\" data-pos=\"n.\" data-en=\"a room or building where art is shown\" data-zh=\"展覽廳；美術館\">gallery<\/a> owner moved the lamp closer to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">painting<\/a>. &quot;There,&quot; she said. &quot;This light will bring out the gold in the sunset and the deep blue of the sea.&quot;", "bodyPlain": "The following text is adapted from a short story.\nThe gallery owner moved the lamp closer to the painting. \"There,\" she said. \"This light will bring out the gold in the sunset and the deep blue of the sea.\"", "stem": "As used in the text, what does the phrase \"bring out\" most nearly mean?", "stemZh": "根據文中的用法，片語「bring out」的意思最接近什麼？", "bodyZh": "以下文字改編自一篇短篇小說。\n畫廊老闆把燈移近那幅畫。「好了，」她說。「這盞燈會 bring out 夕陽中的金色和大海的深藍。」", "opts": {"A": "Distribute", "B": "Transport", "C": "Introduce", "D": "Emphasize"}, "optsZh": {"A": "分發；分配", "B": "運送", "C": "引進；介紹", "D": "強調；突顯"}, "answer": "D", "expl": "Lighting placed to make the colors stand out \"brings out\" (emphasizes) them.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to give out to many people", "zh": "分發；分配", "w": "distribute", "word": "distribute"}, "B": {"pos": "v.", "en": "to carry from one place to another", "zh": "運送", "w": "transport", "word": "transport"}, "C": {"pos": "v.", "en": "to bring in something new", "zh": "引進；介紹", "w": "introduce", "word": "introduce"}, "D": {"pos": "v.", "en": "to make something more noticeable or important", "zh": "強調；突顯", "w": "emphasize", "word": "emphasize"}}}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Words in Context: identify the meaning of a phrase (\"bring out\") as used in a literary text.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a novel.<br>At <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exactly\" target=\"_blank\" rel=\"noopener\">exactly<\/a> eight o&#x27;clock, the cook rang the bell. &quot;Bring out the soup first,&quot; she told the young waiter, &quot;and carry the plates <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=carefully\" target=\"_blank\" rel=\"noopener\">carefully<\/a>—the bowls are very full.&quot;", "bodyPlain": "The following text is adapted from a novel.\nAt exactly eight o'clock, the cook rang the bell. \"Bring out the soup first,\" she told the young waiter, \"and carry the plates carefully—the bowls are very full.\"", "stem": "As used in the text, what does the phrase \"bring out\" most nearly mean?", "stemZh": "根據文中的用法，片語「bring out」的意思最接近什麼？", "bodyZh": "以下文字改編自一部小說。\n八點整，廚師搖了鈴。「先把湯 bring out，」她對年輕的服務生說，「端盤子要小心——碗裝得很滿。」", "opts": {"A": "Emphasize", "B": "Transport", "C": "Reveal", "D": "Encourage"}, "optsZh": {"A": "強調；突顯", "B": "運送", "C": "揭示；顯露", "D": "鼓勵"}, "answer": "B", "expl": "Carrying the dishes from the kitchen means \"transport.\"", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something more noticeable or important", "zh": "強調；突顯", "w": "emphasize", "word": "emphasize"}, "B": {"pos": "v.", "en": "to carry from one place to another", "zh": "運送", "w": "transport", "word": "transport"}, "C": {"pos": "v.", "en": "to show something that was hidden", "zh": "揭示；顯露", "w": "reveal", "word": "reveal"}, "D": {"pos": "v.", "en": "to give support or confidence", "zh": "鼓勵", "w": "encourage", "word": "encourage"}}}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Words in Context: identify the meaning of a phrase (\"bring out\") as used in a literary text.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=memoir\" target=\"_blank\" rel=\"noopener\" data-w=\"memoir\" data-pos=\"n.\" data-en=\"a written account of one&#x27;s own life and experiences\" data-zh=\"回憶錄\">memoir<\/a>.<br>Mr. Okafor saw that Daniel was shy but loved to draw. He asked Daniel to design the class poster, hoping the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=project\" target=\"_blank\" rel=\"noopener\">project<\/a> would bring out the quiet boy&#x27;s hidden talent.", "bodyPlain": "The following text is adapted from a memoir.\nMr. Okafor saw that Daniel was shy but loved to draw. He asked Daniel to design the class poster, hoping the project would bring out the quiet boy's hidden talent.", "stem": "As used in the text, what does the phrase \"bring out\" most nearly mean?", "stemZh": "根據文中的用法，片語「bring out」的意思最接近什麼？", "bodyZh": "以下文字改編自一本回憶錄。\nOkafor 老師發現 Daniel 很害羞，但很喜歡畫畫。他請 Daniel 設計班級海報，希望這項任務能 bring out 這個安靜男孩隱藏的才華。", "opts": {"A": "Carry away", "B": "Publish", "C": "Reveal", "D": "Remove"}, "optsZh": {"A": "帶走", "B": "出版；發布", "C": "揭示；顯露", "D": "移除"}, "answer": "C", "expl": "A teacher helping a shy student show his talent \"brings out\" (reveals) it.", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "to take something to another place", "zh": "帶走", "w": "carry away", "word": "carry away"}, "B": {"pos": "v.", "en": "to make something available to the public", "zh": "出版；發布", "w": "publish", "word": "publish"}, "C": {"pos": "v.", "en": "to show something that was hidden", "zh": "揭示；顯露", "w": "reveal", "word": "reveal"}, "D": {"pos": "v.", "en": "to take away", "zh": "移除", "w": "remove", "word": "remove"}}}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Words in Context: identify the meaning of a phrase (\"bring out\") as used in a literary text.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a news <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>.<br>The small <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">company<\/a> plans to bring out a new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=version\" target=\"_blank\" rel=\"noopener\" data-w=\"version\" data-pos=\"n.\" data-en=\"a form of something that is slightly different from others\" data-zh=\"版本\">version<\/a> of its solar-powered lamp next spring, with a brighter bulb and a battery that lasts twice as long.", "bodyPlain": "The following text is adapted from a news story.\nThe small company plans to bring out a new version of its solar-powered lamp next spring, with a brighter bulb and a battery that lasts twice as long.", "stem": "As used in the text, what does the phrase \"bring out\" most nearly mean?", "stemZh": "根據文中的用法，片語「bring out」的意思最接近什麼？", "bodyZh": "以下文字改編自一則新聞報導。\n這家小公司計畫明年春天 bring out 新版的太陽能燈，燈泡更亮，電池續航力也加倍。", "opts": {"A": "Release", "B": "Emphasize", "C": "Carry", "D": "Reveal"}, "optsZh": {"A": "推出；發行", "B": "強調；突顯", "C": "搬運", "D": "揭示；顯露"}, "answer": "A", "expl": "A company releasing a new phone \"brings out\" (publishes/releases) a product.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make a new product available", "zh": "推出；發行", "w": "release", "word": "release"}, "B": {"pos": "v.", "en": "to make something more noticeable or important", "zh": "強調；突顯", "w": "emphasize", "word": "emphasize"}, "C": {"pos": "v.", "en": "to move something from one place to another", "zh": "搬運；攜帶", "w": "carry", "word": "carry"}, "D": {"pos": "v.", "en": "to show something that was hidden", "zh": "揭示；顯露", "w": "reveal", "word": "reveal"}}}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Words in Context: identify the meaning of a phrase (\"bring out\") as used in a literary text.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cookbook\" target=\"_blank\" rel=\"noopener\">cookbook<\/a>.<br>&quot;Add a pinch of salt to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=caramel\" target=\"_blank\" rel=\"noopener\">caramel<\/a>,&quot; the chef advised. &quot;It may seem strange, but the salt will bring out the sweetness of the sugar and make the flavor richer.&quot;", "bodyPlain": "The following text is adapted from a cookbook.\n\"Add a pinch of salt to the caramel,\" the chef advised. \"It may seem strange, but the salt will bring out the sweetness of the sugar and make the flavor richer.\"", "stem": "As used in the text, what does the phrase \"bring out\" most nearly mean?", "stemZh": "根據文中的用法，片語「bring out」的意思最接近什麼？", "bodyZh": "以下文字改編自一本食譜。\n「在焦糖裡加一小撮鹽，」主廚建議。「這看起來可能很奇怪，但鹽會 bring out 糖的甜味，讓風味更濃郁。」", "opts": {"A": "Remove", "B": "Transport", "C": "Publish", "D": "Emphasize"}, "optsZh": {"A": "移除", "B": "運送", "C": "出版；發布", "D": "強調；突顯"}, "answer": "D", "expl": "Adding a pinch of salt makes the sweetness more noticeable: it \"emphasizes\" it.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to take away", "zh": "移除", "w": "remove", "word": "remove"}, "B": {"pos": "v.", "en": "to carry from one place to another", "zh": "運送", "w": "transport", "word": "transport"}, "C": {"pos": "v.", "en": "to make something available to the public", "zh": "出版；發布", "w": "publish", "word": "publish"}, "D": {"pos": "v.", "en": "to make something more noticeable or important", "zh": "強調；突顯", "w": "emphasize", "word": "emphasize"}}}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Text Structure and Purpose: describe the overall structure of a literary passage.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Jane Austen’s 1811 novel Sense and Sensibility. Elinor Dashwood is in her cottage speaking with her Uncle Edward and her younger sister Marianne.<br>“I have frequently detected myself in such kind of mistakes,” said Elinor, “in a total misapprehension of character in some point or other: fancying people so much more gay or grave, or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingenious\" target=\"_blank\" rel=\"noopener\" data-w=\"ingenious\" data-pos=\"adj.\" data-en=\"clever, original, and well designed\" data-zh=\"巧妙的；獨創的\">ingenious<\/a> or stupid than they really are, and I can hardly tell why or in what the deception <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=originate\" target=\"_blank\" rel=\"noopener\" data-w=\"originate\" data-pos=\"v.\" data-en=\"to come from a particular place\" data-zh=\"起源；發源\">originated<\/a>. Sometimes one is guided by what they say of themselves, and very frequently by what other people say of them, without giving oneself time to deliberate and judge.”", "bodyPlain": "The following text is adapted from Jane Austen’s 1811 novel Sense and Sensibility. Elinor Dashwood is in her cottage speaking with her Uncle Edward and her younger sister Marianne.\n“I have frequently detected myself in such kind of mistakes,” said Elinor, “in a total misapprehension of character in some point or other: fancying people so much more gay or grave, or ingenious or stupid than they really are, and I can hardly tell why or in what the deception originated. Sometimes one is guided by what they say of themselves, and very frequently by what other people say of them, without giving oneself time to deliberate and judge.”", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "以下文字改編自珍·奧斯汀 1811 年的小說《理性與感性》。Elinor Dashwood 在她的小屋裡，正和 Edward 舅舅以及妹妹 Marianne 說話。\n「我常發現自己犯這類錯誤，」Elinor 說，「在某些方面完全誤判一個人的性格：把人想像得比實際上更開朗或更嚴肅、更聰明或更愚笨，而我幾乎說不出為什麼，也不知道這種誤會從何而來。有時候人會被別人對自己的描述所引導，更常是被其他人對他們的評論所左右，而沒有給自己時間仔細思考和判斷。」", "opts": {"A": "The speaker describes how someone can be deceived by the impressions of others and then promises to be more careful in the future.", "B": "The speaker relates her misgivings of the character of another individual and then rationalizes her mistaken perception.", "C": "The speaker considers the duplicity of human nature and then issues a warning about the misconceptions of personal opinion.", "D": "The speaker describes a type of error and then reveals the sources of information that lead to such errors."}, "optsZh": {"A": "說話者描述一個人如何被他人的印象所欺騙，然後承諾將來會更謹慎。", "B": "說話者講述她對另一個人性格的疑慮，然後為自己錯誤的看法找理由。", "C": "說話者思考人性的雙面性，然後警告個人看法中的誤解。", "D": "說話者描述一種錯誤，然後揭示導致這種錯誤的資訊來源。"}, "answer": "D", "expl": "Elinor first describes a type of mistake (misjudging character) and then explains where such errors come from (what people say of themselves and others). (The original key listed B.)", "explZh": "Elinor 先描述一種錯誤（誤判性格），再說明這類錯誤的來源（人們對自己和他人的說法）。（原答案列為 B，已修正為 D。）"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Text Structure and Purpose: describe the overall structure of a literary passage.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a novel.<br>&quot;I often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=misjudge\" target=\"_blank\" rel=\"noopener\">misjudge<\/a> how long a task will take,&quot; said Clara. &quot;I <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=imagine\" target=\"_blank\" rel=\"noopener\">imagine<\/a> I can finish a letter in an hour, and it takes the whole afternoon. I think the trouble comes from remembering only my best days, and from listening to friends who always seem to work faster than I do.&quot;", "bodyPlain": "The following text is adapted from a novel.\n\"I often misjudge how long a task will take,\" said Clara. \"I imagine I can finish a letter in an hour, and it takes the whole afternoon. I think the trouble comes from remembering only my best days, and from listening to friends who always seem to work faster than I do.\"", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "以下文字改編自一部小說。\n「我常常誤判一件事要花多久時間，」Clara 說。「我以為一小時就能寫完一封信，結果卻花了一整個下午。我想問題出在我只記得自己狀況最好的日子，還有我總是聽那些似乎做事比我快的朋友說話。」", "opts": {"A": "The speaker describes a talent and then explains how she developed it.", "B": "The speaker criticizes her friends and then apologizes to them.", "C": "The speaker recalls a happy day and then compares it to an unhappy one.", "D": "The speaker describes a type of error and then identifies what causes it."}, "optsZh": {"A": "說話者描述一項才能，然後解釋她如何培養它。", "B": "說話者批評她的朋友，然後向他們道歉。", "C": "說話者回憶快樂的一天，然後與不快樂的一天比較。", "D": "說話者描述一種錯誤，然後指出造成錯誤的原因。"}, "answer": "D", "expl": "The speaker describes a mistake and then explains where such mistakes come from.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Text Structure and Purpose: describe the overall structure of a literary passage.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a short <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a>.<br>The storm <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=arrive\" target=\"_blank\" rel=\"noopener\" data-w=\"arrive\" data-pos=\"v.\" data-en=\"to reach a place at the end of a journey\" data-zh=\"抵達；到達\">arrived<\/a> just after noon. The sky turned green, rain fell sideways, and the old oak in the yard lost two of its largest branches. By evening, Mara had given up on her journey to the city and decided to wait another week.", "bodyPlain": "The following text is adapted from a short story.\nThe storm arrived just after noon. The sky turned green, rain fell sideways, and the old oak in the yard lost two of its largest branches. By evening, Mara had given up on her journey to the city and decided to wait another week.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "以下文字改編自一篇短篇小說。\n暴風雨在中午剛過就來了。天空變成綠色，雨斜斜地打下來，院子裡的老橡樹斷了兩根最大的樹枝。到了傍晚，Mara 放棄了進城的旅程，決定再等一個星期。", "opts": {"A": "It describes a natural event and then reveals how the event affected a character's plans.", "B": "It presents a character's wish and then explains why it came true.", "C": "It compares two storms and then explains which was worse.", "D": "It describes a city and then explains why a character dislikes it."}, "optsZh": {"A": "它描述一個自然事件，然後揭示這個事件如何影響某個角色的計畫。", "B": "它呈現一個角色的願望，然後解釋願望為何實現。", "C": "它比較兩場暴風雨，然後解釋哪一場比較嚴重。", "D": "它描述一座城市，然後解釋某個角色為什麼不喜歡它。"}, "answer": "A", "expl": "The speaker first describes the storm and then explains how it changed her plans.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Text Structure and Purpose: describe the overall structure of a literary passage.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from an essay.<br>I have always believed that small <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=kindness\" target=\"_blank\" rel=\"noopener\" data-w=\"kindness\" data-pos=\"n.\" data-en=\"the quality of being friendly, generous, and caring\" data-zh=\"善意；仁慈\">kindnesses<\/a> matter most. My neighbor once shoveled my <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sidewalk\" target=\"_blank\" rel=\"noopener\" data-w=\"sidewalk\" data-pos=\"n.\" data-en=\"a paved path for walking beside a street\" data-zh=\"人行道\">sidewalk<\/a> without being asked. A stranger once paid for my bus fare when I had forgotten my wallet. Such moments stayed with me far longer than any grand gesture.", "bodyPlain": "The following text is adapted from an essay.\nI have always believed that small kindnesses matter most. My neighbor once shoveled my sidewalk without being asked. A stranger once paid for my bus fare when I had forgotten my wallet. Such moments stayed with me far longer than any grand gesture.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪一個選項最能描述本文的整體結構？", "bodyZh": "以下文字改編自一篇散文。\n我一直相信，微小的善意最重要。我的鄰居曾經在沒人要求的情況下幫我鏟人行道上的雪。有一位陌生人曾在我忘了帶錢包時幫我付了公車錢。這樣的時刻在我心中停留的時間，遠比任何偉大的舉動都長久。", "opts": {"A": "It tells a story and then questions whether it really happened.", "B": "It describes a problem and then proposes a solution.", "C": "It states a belief and then gives examples that support it.", "D": "It presents two opinions and then rejects both."}, "optsZh": {"A": "它講一個故事，然後質疑它是否真的發生過。", "B": "它描述一個問題，然後提出解決方法。", "C": "它陳述一個信念，然後舉出支持它的例子。", "D": "它提出兩種意見，然後兩者都否定。"}, "answer": "C", "expl": "The narrator gives an opinion and then supports it with examples.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Text Structure and Purpose: describe the overall structure of a literary passage.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a play.<br>&quot;I have been unfair to you, Thomas,&quot; said his sister. &quot;I <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laughed\" target=\"_blank\" rel=\"noopener\">laughed<\/a>
