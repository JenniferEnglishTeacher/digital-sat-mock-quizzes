in 1910 as part of his mineral sampling work.", "B": "Ortega collected many mineral samples.", "C": "Cerro Azul and Valle Seco are different sites.", "D": "Quartz was collected from Valle Seco."}, "optsZh": {"A": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。", "B": "Ortega 採集了許多礦物樣本。", "C": "Cerro Azul 和 Valle Seco 是不同的地點。", "D": "石英是在 Valle Seco 採集的。"}, "answer": "A", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: similarity between Shaun Tan books", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Bright Bay sample.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Fucus alba was collected from Stone Harbor.", "B": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "C": "Lee cataloged more than one algae species.", "D": "Both samples were collected in 1980."}, "optsZh": {"A": "Fucus alba 是在 Stone Harbor 採集的。", "B": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。", "C": "Lee 編目記錄了不只一種藻類。", "D": "兩份樣本都是在 1980 年採集的。"}, "answer": "B", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: similarity between Shaun Tan books", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "B": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "C": "Species M came from Lake Plain.", "D": "Singh collected beetles in multiple locations."}, "optsZh": {"A": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "B": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。", "C": "Species M 來自 Lake Plain。", "D": "Singh 在多個地點採集了甲蟲。"}, "answer": "B", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: similarity between Shaun Tan books", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Cloud Peak and Green Valley were both collection sites.", "B": "Ramos collected Fern Y the following year.", "C": "Ramos collected approximately 700 specimens.", "D": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948."}, "optsZh": {"A": "Cloud Peak 和 Green Valley 都是採集地點。", "B": "Ramos 在隔年採集了 Fern Y。", "C": "Ramos 採集了大約 700 件標本。", "D": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。"}, "answer": "D", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: difference in word origins", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>• Started in 1925, the Scripps National Spelling Bee is a US-based spelling competition.<br>• The words used in the competition have diverse linguistic origins.<br>• In 2008, Sameer Mishra won by correctly spelling the word “guerdon.”<br>• “Guerdon” <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=derive\" target=\"_blank\" rel=\"noopener\" data-w=\"derive\" data-pos=\"v.\" data-en=\"to get or develop something from a source\" data-zh=\"取得；推導出\">derives<\/a> from the Anglo-French word “guerdun.”<br>• In 2009, Kavya Shivashankar won by correctly spelling the word “Laodicean.”<br>• “Laodicean” derives from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Greek word “Laodíkeia.”<br><br>The student wants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a difference in the origins of the two words.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n• Started in 1925, the Scripps National Spelling Bee is a US-based spelling competition.\n• The words used in the competition have diverse linguistic origins.\n• In 2008, Sameer Mishra won by correctly spelling the word “guerdon.”\n• “Guerdon” derives from the Anglo-French word “guerdun.”\n• In 2009, Kavya Shivashankar won by correctly spelling the word “Laodicean.”\n• “Laodicean” derives from the ancient Greek word “Laodíkeia.”\n\nThe student wants to emphasize a difference in the origins of the two words.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n• 創辦於 1925 年的 Scripps 全國拼字比賽是一項在美國舉辦的拼字競賽。\n• 比賽中使用的單字具有多樣的語言來源。\n• 2008 年，Sameer Mishra 因正確拼出「guerdon」這個字而獲勝。\n• 「Guerdon」源自盎格魯-法語單字「guerdun」。\n• 2009 年，Kavya Shivashankar 因正確拼出「Laodicean」這個字而獲勝。\n• 「Laodicean」源自古希臘語單字「Laodíkeia」。\n這位學生想要強調這兩個單字在來源上的差異。", "opts": {"A": "“Guerdon,” the final word of the 2008 Scripps National Spelling Bee, is of Anglo-French origin, while the following year’s final word, “Laodicean,” derives from ancient Greek.", "B": "In 2008, Sameer Mishra won the Scripps National Spelling Bee by correctly spelling the word “guerdon”; however, the following year, Kavya Shivashankar won based on spelling the word “Laodicean.”", "C": "Kavya Shivashankar won the 2009 Scripps National Spelling Bee by correctly spelling “Laodicean,” which derives from the ancient Greek word “Laodíkeia.”", "D": "The Scripps National Spelling Bee uses words from diverse linguistic origins, such as “guerdon” and “Laodicean.”"}, "optsZh": {"A": "「Guerdon」是 2008 年 Scripps 全國拼字比賽的決勝字，源自盎格魯-法語；而隔年的決勝字「Laodicean」則源自古希臘語。", "B": "2008 年，Sameer Mishra 因正確拼出「guerdon」而贏得 Scripps 全國拼字比賽；然而隔年，Kavya Shivashankar 則以拼出「Laodicean」獲勝。", "C": "Kavya Shivashankar 因正確拼出源自古希臘語單字「Laodíkeia」的「Laodicean」，贏得 2009 年 Scripps 全國拼字比賽。", "D": "Scripps 全國拼字比賽使用來自多種語言來源的單字，例如「guerdon」和「Laodicean」。"}, "answer": "A", "expl": "This choice contrasts the origins of the words: “guerdon” is Anglo-French, while “Laodicean” is from ancient Greek.", "explZh": "這個選項對比了兩個字的來源：guerdon 源自盎格魯-法語，而 Laodicean 源自古希臘語。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: difference in word origins", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Mount Kuro sample.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Fern A and Moss B were collected in different years.", "B": "Mori also collected Moss B from River Nami.", "C": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "D": "Aya Mori collected hundreds of plant samples."}, "optsZh": {"A": "Fern A 和 Moss B 是在不同年份採集的。", "B": "Mori 也在 River Nami 採集了 Moss B。", "C": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "D": "Aya Mori 採集了數百件植物樣本。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: difference in word origins", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" r ally appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "Singh collected beetles in multiple locations.", "B": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "C": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "D": "Species M came from Lake Plain."}, "optsZh": {"A": "Singh 在多個地點採集了甲蟲。", "B": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。", "C": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "D": "Species M 來自 Lake Plain。"}, "answer": "B", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: difference in word origins", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right fo ifies documents by release risk.", "B": "Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.", "C": "Budget drafts are one kind of government document.", "D": "Sealed documents could cause major harm if released."}, "optsZh": {"A": "檔案室依公開風險為文件分類。", "B": "由於例行預算草案外洩可能造成輕微但不嚴重的損害，因此被歸類為「限制級」（Restricted）。", "C": "預算草案是政府文件的一種。", "D": "「密封級」文件一旦公開可能造成重大損害。"}, "answer": "B", "expl": "The answer applies the classification rule.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: similarity between two huge paintings", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/? ": "由於稀釋過的清潔劑可能刺激皮膚但不會造成嚴重傷害，因此被標示為「注意級」（Caution）。"}, "answer": "D", "expl": "The answer uses the correct category.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: similarity between two huge paintings", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Notes: A library classifies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。筆記：某間圖書館依脆弱程度為手稿分級；需要小心處理的物品列為「監控」（Monitored）；讀者不可接觸的物品列為「限閱」（Restricted）；大多數十九世紀的小冊子需要小心處理，但仍可由讀者翻閱；目標是為這些小冊子分級。", "opts": {"A": "Nineteenth-century pamphlets are historical documents.", "B": "The library classifies manuscripts by fragility.", "C": "Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers.", "D": "Restricted manuscripts cannot be handled by readers."}, "optsZh": {"A": "十九世紀的小冊子屬於歷史文件。", "B": "該圖書館依脆弱程度為手稿分類。", "C": "大多數十九世紀的小冊子被歸類為「監管」級，因為它們需要小心處理，但讀者仍可接觸使用。", "D": "「限制級」手稿讀者不得接觸。"}, "answer": "C", "expl": "The answer applies the definitions.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: similarity between two huge paintings", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=widespread\" target=\"_blank\" rel=\"noopener\" data-w=\"widespread\" data-pos=\"adj.\" data-en=\"existing or happening in many places or among many people\" data-zh=\"普遍的；廣泛的\">widespread<\/a> damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。筆記：某個機構依預期影響為暴風雨分級；預期造成局部干擾的暴風雨列為「注意報」（Advisory）；預期造成大範圍損害的暴風雨列為「緊急」（Emergency）；某場沿海暴風雨預期會造成局部干擾，但不會造成大範圍損害；目標是為這場暴風雨分級。", "opts": {"A": "The agency classifies storms by expected impact.", "B": "Coastal storms can affect travel.", "C": "Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.", "D": "Emergency storms cause widespread damage."}, "optsZh": {"A": "該機構依預期衝擊程度為風暴分類。", "B": "沿海風暴可能影響交通。", "C": "由於預計會造成局部干擾但不會造成大範圍損害，這場沿海風暴被歸類為「警示級」（Advisory）。", "D": "「緊急級」風暴會造成大範圍損害。"}, "answer": "C", "expl": "The answer identifies the category.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: similarity between two huge paintings", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。筆記：某間博物館依安全風險為借展品分級；可能因一般搬運而受損的物件列為「監督」（Supervised）；可能因短暫暴露而嚴重受損的物件列為「限制」（Restricted）；大多數陶瓷複製品可能因一般搬運而受損，但不會因短暫暴露而嚴重受損；目標是為這些複製品分級。", "opts": {"A": "Most ceramic replicas are classified as Supervised because ordinary handling could damage them.", "B": "Museum loans are classified by security risk.", "C": "Ceramic replicas may be used in educational displays.", "D": "Restricted objects could be seriously damaged by brief exposure."}, "optsZh": {"A": "大多數陶瓷複製品被歸類為「監督級」（Supervised），因為一般的搬動就可能損壞它們。", "B": "博物館借展品依安全風險分類。", "C": "陶瓷複製品可用於教育展示。", "D": "「限制級」物件短暫曝露就可能嚴重受損。"}, "answer": "A", "expl": "The answer applies the classification.", "explZh": ""}];
    const SLUG = 'dsat_t10m2';
    const SOURCE = 'Digital SAT Practice Test 10, Module 2';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
      if (q.id.startsWith('o')) { const t = art.nextElementSibling; if (t && t.classList.contains('mocktoggle')) { t.classList.add('ready'); t.querySelector('.mockhint').textContent = ok ? '✓ 答對了！可練習模擬題，或直接做下一題。Try the mocks or go on.' : '建議展開模擬題加強練習 · Recommended: practise the mock questions.'; } }
      const wrong = loadWrong();
      if (!ok) {
        const prev = wrong[q.id] || { count: 0 };
        wrong[q.id] = { picked, ts: Date.now(), count: (prev.count || 0) + 1 };
        saveWrong(wrong);
        const h = art.querySelector('h3');
        if (!h.querySelector('.badge.wrong')) h.insertAdjacentHTML('beforeend', `<span class="badge wrong">✗ saved to 錯題本</span>`);
      } else if (wrong[q.id]) {
        delete wrong[q.id]; saveWrong(wrong);
        art.querySelector('h3').insertAdjacentHTML('beforeend', `<span class="badge mastered">✓ mastered – removed from 錯題本</span>`);
      }
      updateCount();
    });

    // ---- wrong list panel / downloads ----
    function wrongList() {
      const w = loadWrong();
      return DATA.filter(q => w[q.id]).map(q => ({ q, meta: w[q.id] }));
    }
    function plain(q) {
      const opts = ['A','B','C','D'].map(L => `${L}) ${q.opts[L] || ''}`).join('\n');
      return `${q.bodyPlain}\n\n${q.stem || ''}\n${opts}`.trim();
    }
    function renderPanel() {
      const list = wrongList();
      const p = document.getElementById('wrongPanel');
      if (!list.length) { p.innerHTML = '<p class="empty">錯題本是空的。答錯的題目會自動記錄在這裡（儲存在此裝置）。<br>No wrong questions yet — they are saved automatically on this device.</p>'; return; }
      p.innerHTML = `<table><thead><tr><th>#</th><th>Item</th><th>Concept</th><th>Your answer</th><th>Correct</th><th>Times wrong</th><th>Last</th></tr></thead><tbody>
        ${list.map(({q, meta}, i) => `<tr><td>${i+1}</td><td><a href="#item-${esc(q.id)}">${esc(q.label)}</a></td><td>${esc(q.concept)}</td><td>${esc(meta.picked)}</td><td>${esc(q.answer)}</td><td>${meta.count || 1}</td><td>${new Date(meta.ts).toLocaleDateString()}</td></tr>`).join('')}
      </tbody></table>`;
    }
    function download(name, text, type) {
      const blob = new Blob(['﻿' + text], { type }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    document.getElementById('btnWrong').onclick = () => { renderPanel(); document.getElementById('wrongPanel').classList.toggle('show'); };
    document.getElementById('btnRetest').onclick = e => { retest = !retest; e.target.classList.toggle('active', retest); e.target.textContent = retest ? 'Show all questions 顯示全部' : 'Retest wrong only 重測錯題'; render(); };
    document.getElementById('btnClear').onclick = () => { if (confirm('Clear the saved wrong-question list? 確定清除錯題本？')) { saveWrong({}); renderPanel(); render(); } };
    document.getElementById('resetQuiz').onclick = render;
    document.getElementById('btnDlTxt').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const d = new Date().toISOString().slice(0,10);
      let out = `${SOURCE} — Wrong Questions 錯題本 (${list.length})  exported ${d}\n${'='.repeat(70)}\n\n`;
      list.forEach(({q, meta}, i) => {
        out += `${i+1}. ${q.label}  [${q.concept}]\nSource: ${SOURCE}\n\n${plain(q)}\n\nYour answer: ${meta.picked}   Correct answer: ${q.answer}\nExplanation: ${q.expl}${q.explZh ? '\n解析: ' + q.explZh : ''}\n\n--- 中文翻譯 ---\n${q.bodyZh}\n${q.stemZh}\n${['A','B','C','D'].map(L => `${L}) ${q.optsZh[L] || ''}`).join('\n')}\n\n${'-'.repeat(70)}\n\n`;
      });
      download(`${SLUG}_wrong_questions_${d}.txt`, out, 'text/plain;charset=utf-8');
    };
    document.getElementById('btnDlCsv').onclick = () => {
      const list = wrongList(); if (!list.length) { alert('錯題本是空的 No wrong questions saved.'); return; }
      const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['#','Item','Source','Concept','Question','A','B','C','D','Your answer','Correct answer','Explanation','中文翻譯','A 中','B 中','C 中','D 中','Times wrong']];
      list.forEach(({q, meta}, i) => rows.push([i+1, q.label, SOURCE, q.concept, q.bodyPlain + '\n' + (q.stem||''), q.opts.A, q.opts.B, q.opts.C, q.opts.D, meta.picked, q.answer, q.expl + (q.explZh ? ' / ' + q.explZh : ''), q.bodyZh + '\n' + q.stemZh, q.optsZh.A, q.optsZh.B, q.optsZh.C, q.optsZh.D, meta.count || 1]));
      download(`${SLUG}_wrong_questions_${new Date().toISOString().slice(0,10)}.csv`, rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
    };
    // ---- hover definitions for dictionary-linked words ----
    const tip = document.getElementById('tip'); let tipTimer = null, tipFor = null;
    function showTip(a) {
      if (!a.dataset.en) return;
      tipFor = a; clearTimeout(tipTimer);
      tip.innerHTML = `<span class="tw" title="click to hear">🔊 ${esc(a.dataset.w)}<small>${esc(a.dataset.pos)}</small></span><span class="ten">${esc(a.dataset.en)}</span><span class="tzh">${esc(a.dataset.zh)}</span><a class="tlink" href="${a.href}" target="_blank" rel="noopener">Cambridge 英漢字典 — more usage & examples →</a>`;
      tip.classList.add('show');
      const r = a.getBoundingClientRect(); const tw = tip.offsetWidth;
      let left = window.scrollX + r.left; if (left + tw > window.scrollX + document.documentElement.clientWidth - 8) left = window.scrollX + document.documentElement.clientWidth - tw - 8;
      tip.style.left = left + 'px'; tip.style.top = (window.scrollY + r.bottom + 6) + 'px';
    }
    function hideTipSoon() { clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.classList.remove('show'); tipFor = null; }, 250); }
    document.addEventListener('mouseover', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); else if (e.target.closest('#tip')) clearTimeout(tipTimer); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a.dict') || e.target.closest('#tip')) hideTipSoon(); });
    document.addEventListener('focusin', e => { const a = e.target.closest('a.dict'); if (a) showTip(a); });
    // touch / tap: first tap shows the card (with the Cambridge link inside), second tap opens Cambridge
    document.addEventListener('click', e => {
      const a = e.target.closest('a.dict');
      if (a && a.dataset.en && window.matchMedia('(hover: none)').matches && tipFor !== a) { e.preventDefault(); showTip(a); return; }
      if (e.target.closest('#tip .tw')) { speak(tipFor ? tipFor.dataset.w : ''); return; }
      if (!a && !e.target.closest('#tip')) { tip.classList.remove('show'); tipFor = null; }
    });
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    render();
    if (location.hash.startsWith('#item-')) revealItem(location.hash.slice(1));
  </script>
<script src="https://jenniferenglishteacher.github.io/SAT-learning-and-quiz-combined-sources/assets/sat-word-links.js?v=20261118a" defer></script>
