rect/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Command of Evidence: LNH not supported", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Some songs use a meter also found in older European poetry.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "C": "有數個國家的學者研究這項傳統。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Command of Evidence: LNH not supported", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is best supported?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program took place in a community.", "C": "Both towns had some volunteers.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "這個計畫在一個社區中進行。", "C": "兩個城鎮都有一些志工。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Logical Completion: Merneith important government role", "vocab": false, "body": "Archaeologist Christiana Kohler and her team excavated the Egyptian tomb of Queen Merneith, the wife of a First Dynasty pharaoh. Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> claim that she also ruled Egypt on her own and was actually the first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=female\" target=\"_blank\" rel=\"noopener\" data-w=\"female\" data-pos=\"adj.\" data-en=\"belonging to the sex that can give birth; women or girls\" data-zh=\"女性的\">female<\/a> pharaoh. The team found a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tablet\" target=\"_blank\" rel=\"noopener\" data-w=\"tablet\" data-pos=\"n.\" data-en=\"a flat piece of stone or clay with writing on it\" data-zh=\"碑；泥板\">tablet<\/a> in Merneith’s tomb with writing suggesting that she was in charge of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">country<\/a>’s treasury and other central offices. Whether Merneith was a pharaoh or not, this discovery supports the idea that Merneith likely _______", "bodyPlain": "Archaeologist Christiana Kohler and her team excavated the Egyptian tomb of Queen Merneith, the wife of a First Dynasty pharaoh. Some scholars claim that she also ruled Egypt on her own and was actually the first female pharaoh. The team found a tablet in Merneith’s tomb with writing suggesting that she was in charge of the country’s treasury and other central offices. Whether Merneith was a pharaoh or not, this discovery supports the idea that Merneith likely _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "考古學家 Christiana Kohler 和她的團隊發掘了 Merneith 王后的埃及陵墓，她是第一王朝一位法老的妻子。有些學者聲稱她也曾獨自統治埃及，其實是第一位女法老。研究團隊在 Merneith 的陵墓中發現了一塊碑板，上面的文字顯示她曾掌管國庫和其他中央機關。無論 Merneith 是否為法老，這項發現都支持 Merneith 很可能 _______ 的看法。", "opts": {"A": "had an important role in Egypt’s government.", "B": "lived after rather than before the First Dynasty of Egypt.", "C": "traveled beyond Egypt’s borders often.", "D": "created a new form of writing in Egypt."}, "optsZh": {"A": "在埃及政府中擔任重要的角色。", "B": "生活在埃及第一王朝之後而非之前。", "C": "經常前往埃及境外旅行。", "D": "在埃及創造了一種新的文字。"}, "answer": "A", "expl": "The tablet suggests she was in charge of the treasury and other central offices, so—pharaoh or not—she likely had an important role in Egypt’s government.", "explZh": "碑板顯示她掌管國庫和其他中央機關，所以無論她是不是法老，她很可能在埃及政府中扮演重要角色。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Logical Completion: Merneith important government role", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼之前數千年，就已經與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "the plant probably reached the islands without human assistance.", "B": "human traders must have transported the seeds recently.", "C": "the island populations were domesticated before mainland populations.", "D": "all island plants descended from a single cultivated variety."}, "optsZh": {"A": "這種植物很可能是在沒有人類協助的情況下到達這些島嶼的。", "B": "人類商人必定是在最近才運送了這些種子。", "C": "島上族群比本土族群更早被馴化。", "D": "所有島嶼植物都源自單一的栽培品種。"}, "answer": "A", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Logical Completion: Merneith important government role", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。有一種甲蟲同時分布在大陸海岸與一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到這座島之前很久，就已經與海岸族群分開，因此研究團隊推論 ______", "opts": {"A": "the beetles were likely introduced by natural dispersal rather than by humans.", "B": "the beetles were domesticated by island communities.", "C": "the island beetles must be younger than the coastal beetles.", "D": "humans carried the beetles to the island during early trade voyages."}, "optsZh": {"A": "這些甲蟲很可能是透過自然擴散而非人類引進的。", "B": "這些甲蟲是被島上的社群馴化的。", "C": "島上的甲蟲必定比沿海的甲蟲年輕。", "D": "人類在早期的貿易航行中把這些甲蟲帶到了島上。"}, "answer": "A", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Logical Completion: Merneith important government role", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島的，但對相關口述傳統的比較顯示，這首歌的核心詞句在遷徙發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "the migration must have begun earlier than any other human movement.", "B": "the song was probably not introduced to the archipelago by that migration.", "C": "all versions of the song are identical.", "D": "the song could not have changed after the migration."}, "optsZh": {"A": "這次遷徙必定比其他任何人類遷移都更早開始。", "B": "這首歌很可能不是藉由那次遷徙傳入這個群島的。", "C": "這首歌的所有版本都完全相同。", "D": "這首歌在遷徙之後不可能有所改變。"}, "answer": "B", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Logical Completion: Merneith important government role", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。研究一座偏遠島嶼上某種作物的植物學家發現，該島的品種早在人類定居此島之前數萬年，就已經與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "mainland farmers acquired the crop from island communities.", "B": "the island variety must be genetically identical to wild mainland plants.", "C": "the crop was first domesticated on the island.", "D": "human settlement probably did not account for the plant's original arrival on the island."}, "optsZh": {"A": "本土農民是從島上的社群取得這種作物的。", "B": "島上的品種必定與本土的野生植物在基因上完全相同。", "C": "這種作物最初是在島上被馴化的。", "D": "人類定居很可能不是這種植物最初來到該島的原因。"}, "answer": "D", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Logical Completion: Merneith important government role", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。研究人員原本以為，一種淡水螺是在人們開始在一連串湖泊間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已經彼此分離。因此，研究人員得出結論：______", "opts": {"A": "boats probably explain every modern snail population.", "B": "the lakes did not contain snails until boating began.", "C": "the snails likely spread through an earlier nonhuman mechanism.", "D": "human activity made the populations genetically identical."}, "optsZh": {"A": "船隻很可能可以解釋每一個現代蝸牛族群的存在。", "B": "在開始划船活動之前，這些湖泊中沒有蝸牛。", "C": "這些蝸牛很可能是透過更早的非人為機制擴散的。", "D": "人類活動使這些族群在基因上完全相同。"}, "answer": "C", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: capuchin task confound", "vocab": false, "body": "In a study of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cognitive\" target=\"_blank\" rel=\"noopener\" data-w=\"cognitive\" data-pos=\"adj.\" data-en=\"related to thinking, learning, and understanding\" data-zh=\"認知的\">cognitive<\/a> abilities of white-faced capuchin monkeys (Cebus imitator), researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neglect\" target=\"_blank\" rel=\"noopener\" data-w=\"neglect\" data-pos=\"v.\" data-en=\"to fail to do or pay attention to something\" data-zh=\"忽略；疏忽\">neglected<\/a> to control for the physical difficulty of the tasks they used to evaluate the monkeys. The cognitive abilities of monkeys given problems requiring little <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dexterity\" target=\"_blank\" rel=\"noopener\" data-w=\"dexterity\" data-pos=\"n.\" data-en=\"skill in using the hands\" data-zh=\"靈巧；手巧\">dexterity<\/a>, such as sliding a panel to retrieve food, were judged by the same criteria as were those of monkeys given physically demanding problems, such as unscrewing a bottle and inserting a straw. The results of the study, therefore, _______", "bodyPlain": "In a study of the cognitive abilities of white-faced capuchin monkeys (Cebus imitator), researchers neglected to control for the physical difficulty of the tasks they used to evaluate the monkeys. The cognitive abilities of monkeys given problems requiring little dexterity, such as sliding a panel to retrieve food, were judged by the same criteria as were those of monkeys given physically demanding problems, such as unscrewing a bottle and inserting a straw. The results of the study, therefore, _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一項關於白臉卷尾猴（Cebus imitator）認知能力的研究中，研究人員忽略了控制他們用來評估猴子的任務在身體操作上的難度。被給予幾乎不需要靈巧度之問題（例如滑動面板以取得食物）的猴子，其認知能力與被給予需要大量體力操作之問題（例如轉開瓶蓋並插入吸管）的猴子，是以相同的標準來評判的。因此，這項研究的結果 _______", "opts": {"A": "could suggest that there are differences in cognitive ability among the monkeys even though such differences may not actually exist.", "B": "are useful for identifying tasks that the monkeys lack the cognitive capacity to perform but not for identifying tasks that the monkeys can perform.", "C": "should not be taken as indicative of the cognitive abilities of any monkey species other than C. imitator.", "D": "reveal more about the monkeys’ cognitive abilities when solving artificial problems than when solving problems encountered in the wild."}, "optsZh": {"A": "可能會顯示猴子之間存在認知能力上的差異，即使這種差異實際上可能並不存在。", "B": "有助於找出猴子缺乏認知能力去完成的任務，卻無助於找出猴子能夠完成的任務。", "C": "不應被視為能代表 C. imitator 以外任何猴類物種的認知能力。", "D": "比起解決在野外遇到的問題，更能揭示猴子解決人為設計問題時的認知能力。"}, "answer": "A", "expl": "Because physical difficulty was not controlled, monkeys given harder tasks might appear less intelligent, so the results could suggest cognitive differences that do not actually exist.", "explZh": "由於研究沒有控制任務的身體難度，拿到較難任務的猴子可能看起來比較不聰明，因此結果可能顯示出實際上並不存在的認知差異。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: capuchin task confound", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼之前數千年，就已經與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "the plant probably reached the islands without human assistance.", "B": "all island plants descended from a single cultivated variety.", "C": "human traders must have transported the seeds recently.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "這種植物很可能是在沒有人類協助的情況下到達這些島嶼的。", "B": "所有島嶼植物都源自單一的栽培品種。", "C": "人類商人必定是在最近才運送了這些種子。", "D": "島上族群比本土族群更早被馴化。"}, "answer": "A", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: capuchin task confound", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。有一種甲蟲同時分布在大陸海岸與一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到這座島之前很久，就已經與海岸族群分開，因此研究團隊推論 ______", "opts": {"A": "the beetles were domesticated by island communities.", "B": "the beetles were likely introduced by natural dispersal rather than by humans.", "C": "the island beetles must be younger than the coastal beetles.", "D": "humans carried the beetles to the island during early trade voyages."}, "optsZh": {"A": "這些甲蟲是被島上的社群馴化的。", "B": "這些甲蟲很可能是透過自然擴散而非人類引進的。", "C": "島上的甲蟲必定比沿海的甲蟲年輕。", "D": "人類在早期的貿易航行中把這些甲蟲帶到了島上。"}, "answer": "B", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: capuchin task confound", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島的，但對相關口述傳統的比較顯示，這首歌的核心詞句在遷徙發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "all versions of the song are identical.", "B": "the migration must have begun earlier than any other human movement.", "C": "the song was probably not introduced to the archipelago by that migration.", "D": "the song could not have changed after the migration."}, "optsZh": {"A": "這首歌的所有版本都完全相同。", "B": "這次遷徙必定比其他任何人類遷移都更早開始。", "C": "這首歌很可能不是藉由那次遷徙傳入這個群島的。", "D": "這首歌在遷徙之後不可能有所改變。"}, "answer": "C", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: capuchin task confound", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。研究一座偏遠島嶼上某種作物的植物學家發現，該島的品種早在人類定居此島之前數萬年，就已經與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "the crop was first domesticated on the island.", "B": "the island variety must be genetically identical to wild mainland plants.", "C": "mainland farmers acquired the crop from island communities.", "D": "human settlement probably did not account for the plant's original arrival on the island."}, "optsZh": {"A": "這種作物最初是在島上被馴化的。", "B": "島上的品種必定與本土的野生植物在基因上完全相同。", "C": "本土農民是從島上的社群取得這種作物的。", "D": "人類定居很可能不是這種植物最初來到該島的原因。"}, "answer": "D", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: capuchin task confound", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。研究人員原本以為，一種淡水螺是在人們開始在一連串湖泊間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已經彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "human activity made the populations genetically identical.", "C": "the snails likely spread through an earlier nonhuman mechanism.", "D": "boats probably explain every modern snail population."}, "optsZh": {"A": "在開始划船活動之前，這些湖泊中沒有蝸牛。", "B": "人類活動使這些族群在基因上完全相同。", "C": "這些蝸牛很可能是透過更早的非人為機制擴散的。", "D": "船隻很可能可以解釋每一個現代蝸牛族群的存在。"}, "answer": "C", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Grammar: plural pronoun they", "vocab": false, "body": "Public-awareness <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=campaign\" target=\"_blank\" rel=\"noopener\" data-w=\"campaign\" data-pos=\"n.\" data-en=\"a planned series of activities to achieve a goal\" data-zh=\"宣導活動；運動\">campaigns<\/a> about the need to reduce <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=single-use\" target=\"_blank\" rel=\"noopener\" data-w=\"single-use\" data-pos=\"adj.\" data-en=\"designed to be used only once\" data-zh=\"一次性的\">single-use<\/a> plastics can be successful, says <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reduction\" target=\"_blank\" rel=\"noopener\" data-w=\"reduction\" data-pos=\"n.\" data-en=\"the act of making something smaller or less\" data-zh=\"減少\">reduction<\/a> in plastic-bag use after cashiers were instructed to ask customers whether _______ wanted a bag.", "bodyPlain": "Public-awareness campaigns about the need to reduce single-use plastics can be successful, says researcher Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent reduction in plastic-bag use after cashiers were instructed to ask customers whether _______ wanted a bag.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "澳洲蒙納許大學的研究員 Kim Borg 表示，關於減少一次性塑膠的公眾宣導活動，在給予消費者選擇時可以成功：例如，日本在收銀員被指示詢問顧客 _______ 是否需要袋子之後，塑膠袋使用量減少了 40%。", "opts": {"A": "they", "B": "one", "C": "you", "D": "it"}, "optsZh": {"A": "they（他們，複數主格代名詞，指 customers：正確）", "B": "one（泛指的「一個人」→ 與先行詞 customers 不一致：錯誤）", "C": "you（你，第二人稱 → 與先行詞 customers 不一致：錯誤）", "D": "it（它，單數代名詞 → 與複數先行詞不一致：錯誤）"}, "answer": "A", "expl": "The pronoun refers to the plural noun “customers,” so the plural pronoun “they” is needed.", "explZh": "代名詞指的是複數名詞 customers，所以需要複數代名詞 they。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Grammar: plural pronoun they", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "published", "B": "publishing", "C": "having published", "D": "to publish"}, "optsZh": {"A": "published（簡單過去式：主要動詞，正確）", "B": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）", "C": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "D": "to publish（不定詞 → 句子缺少主要動詞，錯誤）"}, "answer": "A", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Grammar: plural pronoun they", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主 ted by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device--", "B": "device", "C": "device,", "D": "device:"}, "optsZh": {"A": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "B": "device（裝置；設備）", "C": "device,（逗號 → 不當隔開主詞與動詞，錯誤）", "D": "device:（冒號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "B", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Grammar: indirect question order", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "that", "B": "this", "C": "it", "D": "them"}, "optsZh": {"A": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "C": "it（它，單數代名詞 → 與複數先行詞不一致：錯誤）", "D": "them（他們，複數受格代名詞，指 devices：正確）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Grammar: indirect question order", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduces<\/a> readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family", "B": "family, and", "C": "family and", "D": "family,"}, "optsZh": {"A": "family（無標點）", "B": "family, and（逗號＋and）", "C": "family and（無標點＋and）", "D": "family,（逗號，結束以 a family saga 開頭的同位語）"}, "answer": "A", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Grammar: indirect question order", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free, in part because:", "B": "free. In part because", "C": "free in part because", "D": "free, in part because,"}, "optsZh": {"A": "free, in part because:（逗號＋in part because＋冒號）", "B": "free. In part because（句號，以 In part because 另起一句）", "C": "free in part because（無標點，直接接原因子句）", "D": "free, in part because,（逗號＋in part because＋逗號）"}, "answer": "B", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Grammar: present-tense reach", "vocab": false, "body": "Atoms in a synchrotron, a type of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circular\" target=\"_blank\" rel=\"noopener\" data-w=\"circular\" data-pos=\"adj.\" data-en=\"shaped like a circle\" data-zh=\"圓形的\">circular<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=particle\" target=\"_blank\" rel=\"noopener\" data-w=\"particle\" data-pos=\"n.\" data-en=\"an extremely small piece of matter\" data-zh=\"粒子；微粒\">particle<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accelerator\" target=\"_blank\" rel=\"noopener\" data-w=\"accelerator\" data-pos=\"n.\" data-en=\"a machine that makes particles move very fast\" data-zh=\"加速器\">accelerator<\/a>, travel faster and faster until they _______ a desired energy level, at which point they are diverted to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collide\" target=\"_blank\" rel=\"noopener\" data-w=\"collide\" data-pos=\"v.\" data-en=\"to hit something while moving\" data-zh=\"碰撞\">collide<\/a> with a target, smashing the atoms.", "bodyPlain": "Atoms in a synchrotron, a type of circular particle accelerator, travel faster and faster until they _______ a desired energy level, at which point they are diverted to collide with a target, smashing the atoms.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "同步加速器是一種環形粒子加速器，原子在其中越跑越快，直到 _______ 所需的能量等級，這時它們就會被轉向去撞擊靶材，使原子碎裂。", "opts": {"A": "will reach", "B": "reach", "C": "had reached", "D": "are reaching"}, "optsZh": {"A": "will reach（未來式 → 不適合描述一般性的科學過程：錯誤）", "B": "reach（現在簡單式，描述一般性的科學過程：正確）", "C": "had reached（過去完成式 → 與現在式敘述不一致：錯誤）", "D": "are reaching（現在進行式 → 不適合描述一般性的科學過程：錯誤）"}, "answer": "B", "expl": "The text describes a general, repeated process in the simple present (travel, are diverted), so the present-tense “reach” is correct.", "explZh": "本文以現在簡單式（travel、are diverted）描述一個一般性的反覆過程，所以要用現在式 reach。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Grammar: present-tense reach", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "having published"
