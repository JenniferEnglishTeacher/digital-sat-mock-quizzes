assage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The table includes more than one year.", "C": "Both towns had some volunteers.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這個計畫在一個社區中進行。", "B": "這張表格包含不只一個年份。", "C": "兩個城鎮都有一些志工。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Quantitative Evidence: seafloor shells harder to obtain", "vocab": false, "body": "Table: Number and Origin of Clamshell Tools Found at Different Levels Below the Surface in Neanderthal Cave (beach shells / seafloor shells).<br>2–3 meters: 7 from the beach, 0 from the seafloor.<br>3–4 meters: 99 from the beach, 33 from the seafloor.<br>4–5 meters: 2 from the beach, 0 from the seafloor.<br>5–6 meters: 18 from the beach, 7 from the seafloor.<br>6–7 meters: 1 from the beach, 0 from the seafloor.<br><br>Studying tools unearthed at a cave site on the western coast of Italy, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> Paola Villa and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that prehistoric Neanderthal groups fashioned them from shells of clams that they harvested from the seafloor while wading or diving or that washed up on the beach. Clamshells become thin and eroded as they wash up on the beach, while those on the seafloor are smooth and sturdy, so the research team suspects that Neanderthals prized the tools made with seafloor shells. However, the team also <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that those tools were likely more challenging to obtain, noting that _______", "bodyPlain": "Table: Number and Origin of Clamshell Tools Found at Different Levels Below the Surface in Neanderthal Cave (beach shells / seafloor shells).\n2–3 meters: 7 from the beach, 0 from the seafloor.\n3–4 meters: 99 from the beach, 33 from the seafloor.\n4–5 meters: 2 from the beach, 0 from the seafloor.\n5–6 meters: 18 from the beach, 7 from the seafloor.\n6–7 meters: 1 from the beach, 0 from the seafloor.\n\nStudying tools unearthed at a cave site on the western coast of Italy, archaeologist Paola Villa and colleagues have determined that prehistoric Neanderthal groups fashioned them from shells of clams that they harvested from the seafloor while wading or diving or that washed up on the beach. Clamshells become thin and eroded as they wash up on the beach, while those on the seafloor are smooth and sturdy, so the research team suspects that Neanderthals prized the tools made with seafloor shells. However, the team also concluded that those tools were likely more challenging to obtain, noting that _______", "stem": "Which choice most effectively uses data from the table to support the research team’s conclusion?", "stemZh": "哪一個選項最有效地運用表格中的數據來支持研究團隊的結論？", "bodyZh": "表格：在尼安德塔人洞穴中不同地表下深度發現的蛤殼工具數量與來源（海灘貝殼／海床貝殼）。\n2–3 公尺：海灘 7 件，海床 0 件。\n3–4 公尺：海灘 99 件，海床 33 件。\n4–5 公尺：海灘 2 件，海床 0 件。\n5–6 公尺：海灘 18 件，海床 7 件。\n6–7 公尺：海灘 1 件，海床 0 件。\n考古學家 Paola Villa 與同事研究在義大利西海岸一處洞穴遺址出土的工具後判定，史前尼安德塔人群體是用蛤殼來製作這些工具的，而這些蛤殼有的是他們涉水或潛水時從海床採集的，有的則是被沖上海灘的。蛤殼被沖上海灘時會變得又薄又受侵蝕，而海床上的蛤殼則光滑而堅固，因此研究團隊推測尼安德塔人特別珍視用海床貝殼製成的工具。然而，研究團隊也推斷，那些工具可能比較難取得，並指出 _______", "opts": {"A": "at each depth below the surface in the cave, the difference in the numbers of tools of each type suggests that shells were easier to collect from the beach than to harvest from the seafloor.", "B": "the highest number of tools were at a depth of 3–4 meters below the surface, which suggests that the Neanderthal population at the site was highest during the related period of time.", "C": "at each depth below the surface in the cave, the difference in the numbers of tools of each type suggests that Neanderthals preferred to use clamshells from the beach because of their durability.", "D": "the higher number of tools at depths of 5–6 meters below the surface in the cave than at depths of 4–5 meters below the surface suggests that the size of clam populations changed over time."}, "optsZh": {"A": "在洞穴地表下的每個深度，兩種工具數量的差異都顯示，從海灘收集貝殼比從海床採集貝殼更容易。", "B": "工具數量最多的位置在地表下 3–4 公尺處，顯示該遺址的尼安德塔人口在相對應的時期最多。", "C": "在洞穴地表下的每個深度，兩種工具數量的差異都顯示，尼安德塔人因為海灘蛤殼較耐用而偏好使用它們。", "D": "地表下 5–6 公尺處的工具數量比 4–5 公尺處多，顯示蛤蜊族群的規模隨時間改變。"}, "answer": "A", "expl": "At every depth, fewer tools were made from seafloor shells than from beach shells (e.g., 33 vs. 99 at 3–4 m, 0 vs. 7 at 2–3 m), suggesting seafloor shells were harder to obtain.", "explZh": "在每個深度，用海床貝殼製成的工具都比海灘貝殼少（例如 3–4 公尺處 33 比 99、2–3 公尺處 0 比 7），顯示海床貝殼比較難取得。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Quantitative Evidence: seafloor shells harder to obtain", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrate<\/a> that claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "C": "「這位領導人在上任的第一個月簽署了數項法令。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Quantitative Evidence: seafloor shells harder to obtain", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The southern region was included in the survey.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "有些農民種植蔬菜，而另一些則種植穀物。", "B": "南部地區有被納入調查。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Quantitative Evidence: seafloor shells harder to obtain", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "One rocky planet has a thin atmosphere.", "C": "Some stars contain hydrogen and helium.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "有些恆星含有氫和氦。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Quantitative Evidence: seafloor shells harder to obtain", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Some songs use a meter also found in older European poetry.", "C": "Many performers learned songs from relatives.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有數個國家的學者研究這項傳統。", "B": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "C": "許多表演者是向親戚學習歌曲的。", "D": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Quantitative Evidence: seafloor shells harder to obtain", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is best supported?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The table includes more than one year.", "C": "Both towns had some volunteers.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這個計畫在一個社區中進行。", "B": "這張表格包含不只一個年份。", "C": "兩個城鎮都有一些志工。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Quantitative Evidence: spray coating improves efficiency", "vocab": false, "body": "Perovskite solar cells convert light into <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electricity\" target=\"_blank\" rel=\"noopener\" data-w=\"electricity\" data-pos=\"n.\" data-en=\"a form of energy used for light, heat, and power\" data-zh=\"電；電力\">electricity<\/a> more efficiently than earlier kinds of solar cells, and manufacturing advances have recently made them <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercially<\/a> attractive. One limitation of the cells, however, has to do with their electron transport layer (ETL), through which absorbed electrons must pass. Often the ETL is applied through a process called spin coating, but such ETLs are fairly inefficient at converting input power to output power. André Taylor and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> tested a novel spray coating method for applying the ETL. The team produced ETLs of various thicknesses and concluded that spray coating holds promise for improving the power conversion efficiency of ETLs in perovskite solar cells.<br>[Graph: Power Conversion Efficiency of Lowest and Highest Performing Spin-coated and Spray-coated Electron Transport Layers. The graph is not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reproduce\" target=\"_blank\" rel=\"noopener\" data-w=\"reproduce\" data-pos=\"v.\" data-en=\"to make a copy of something\" data-zh=\"複製；再製\">reproduced<\/a> in this text version.]", "bodyPlain": "Perovskite solar cells convert light into electricity more efficiently than earlier kinds of solar cells, and manufacturing advances have recently made them commercially attractive. One limitation of the cells, however, has to do with their electron transport layer (ETL), through which absorbed electrons must pass. Often the ETL is applied through a process called spin coating, but such ETLs are fairly inefficient at converting input power to output power. André Taylor and colleagues tested a novel spray coating method for applying the ETL. The team produced ETLs of various thicknesses and concluded that spray coating holds promise for improving the power conversion efficiency of ETLs in perovskite solar cells.\n[Graph: Power Conversion Efficiency of Lowest and Highest Performing Spin-coated and Spray-coated Electron Transport Layers. The graph is not reproduced in this text version.]", "stem": "Which choice best describes data from the graph that support Taylor and colleagues’ conclusion?", "stemZh": "哪一個選項最能描述圖表中支持 Taylor 和同事結論的數據？", "bodyZh": "鈣鈦礦太陽能電池將光轉換為電的效率比早期的太陽能電池更高，而製造技術的進步最近也讓它們具有商業吸引力。然而，這種電池的一個限制與它的電子傳輸層（ETL）有關，被吸收的電子必須通過這一層。ETL 通常是以一種稱為旋轉塗佈的製程施加，但這樣的 ETL 將輸入功率轉換為輸出功率的效率相當低。André Taylor 和同事測試了一種施加 ETL 的新型噴霧塗佈方法。研究團隊製作了不同厚度的 ETL，並得出結論：噴霧塗佈有望提升鈣鈦礦太陽能電池中 ETL 的功率轉換效率。\n［圖表：旋轉塗佈與噴霧塗佈電子傳輸層中表現最差與最佳者的功率轉換效率。本文字版未附此圖表。］", "opts": {"A": "Both the ETL applied through spin coating and the ETL applied through spray coating showed a power conversion efficiency greater than 10% at their lowest performing thickness.", "B": "The lowest performing ETL applied through spray coating had a higher power conversion efficiency than the highest performing ETL applied through spin coating.", "C": "The highest performing ETL applied through spray coating showed a power conversion efficiency of approximately 13%, while the highest performing ETL applied through spin coating showed a power conversion efficiency of approximately 11%.", "D": "There was a substantial difference in power conversion efficiency between the lowest and highest performing ETLs applied through spray coating."}, "optsZh": {"A": "以旋轉塗佈施加的 ETL 與以噴霧塗佈施加的 ETL，在其表現最差的厚度下，功率轉換效率都高於 10%。", "B": "以噴霧塗佈施加、表現最差的 ETL，其功率轉換效率仍高於以旋轉塗佈施加、表現最好的 ETL。", "C": "以噴霧塗佈施加、表現最好的 ETL，功率轉換效率約為 13%；而以旋轉塗佈施加、表現最好的 ETL，功率轉換效率約為 11%。", "D": "以噴霧塗佈施加的 ETL 中，表現最差與表現最好者之間的功率轉換效率有明顯差異。"}, "answer": "B", "expl": "If even the worst spray-coated ETL beats the best spin-coated ETL, spray coating clearly promises higher efficiency than spin coating. (The graph is not reproduced in this text version.)", "explZh": "如果連表現最差的噴霧塗佈 ETL 都勝過表現最好的旋轉塗佈 ETL，就清楚顯示噴霧塗佈比旋轉塗佈更有望提升效率。（本文字版未附圖表。）"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Quantitative Evidence: spray coating improves efficiency", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrate<\/a> that claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這個政府從一開始就面臨經濟上的挑戰。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "A", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Quantitative Evidence: spray coating improves efficiency", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "南部地區有被納入調查。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Quantitative Evidence: spray coating improves efficiency", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Some stars contain hydrogen and helium.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "研究恆星所用的方法需要望遠鏡。", "B": "有些恆星含有氫和氦。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "有一顆岩質行星擁有稀薄的大氣層。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Quantitative Evidence: spray coating improves efficiency", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "B": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "C": "有數個國家的學者研究這項傳統。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Quantitative Evidence: spray coating improves efficiency", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is best supported?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "Both towns had some volunteers.", "C": "The table includes more than one year.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這個計畫在一個社區中進行。", "B": "兩個城鎮都有一些志工。", "C": "這張表格包含不只一個年份。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Quantitative Evidence: different transition rates by country", "vocab": false, "body": "Table: <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=employment\" target=\"_blank\" rel=\"noopener\" data-w=\"employment\" data-pos=\"n.\" data-en=\"work for which people are paid; the state of having a job\" data-zh=\"就業；雇用\">Employment<\/a> by Sector in France and the United States, 1800–2012 (% of total employment; agriculture / manufacturing / services).<br>1800: France 64 / 22 / 14; US 68 / 18 / 13.<br>1900: France 43 / 29 / 28; US 41 / 28 / 31.<br>1950: France 32 / 33 / 35; US 14 / 33 / 53.<br>2012: France 3 / 21 / 76; US 2 / 18 / 80.<br><br>Over the past two hundred years, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=percentage\" target=\"_blank\" rel=\"noopener\" data-w=\"percentage\" data-pos=\"n.\" data-en=\"an amount expressed as a part of 100\" data-zh=\"百分比\">percentage<\/a> of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> employed in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=agricultural\" target=\"_blank\" rel=\"noopener\" data-w=\"agricultural\" data-pos=\"adj.\" data-en=\"relating to farming\" data-zh=\"農業的\">agricultural<\/a> sector has declined in both France and the United States, while employment in the service sector (which includes jobs in retail, consulting, real estate, etc.) has risen. However, this transition happened at very different rates in the two countries. This can be seen most clearly by comparing the employment by sector in both countries in _______", "bodyPlain": "Table: Employment by Sector in France and the United States, 1800–2012 (% of total employment; agriculture / manufacturing / services).\n1800: France 64 / 22 / 14; US 68 / 18 / 13.\n1900: France 43 / 29 / 28; US 41 / 28 / 31.\n1950: France 32 / 33 / 35; US 14 / 33 / 53.\n2012: France 3 / 21 / 76; US 2 / 18 / 80.\n\nOver the past two hundred years, the percentage of the population employed in the agricultural sector has declined in both France and the United States, while employment in the service sector (which includes jobs in retail, consulting, real estate, etc.) has risen. However, this transition happened at very different rates in the two countries. This can be seen most clearly by comparing the employment by sector in both countries in _______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "stemZh": "哪個選項最能有效運用表格中的資料來完成這個敘述？", "bodyZh": "表格：1800–2012 年法國與美國各產業的就業比例（占總就業人口的百分比；農業／製造業／服務業）。\n1800 年：法國 64 / 22 / 14；美國 68 / 18 / 13。\n1900 年：法國 43 / 29 / 28；美國 41 / 28 / 31。\n1950 年：法國 32 / 33 / 35；美國 14 / 33 / 53。\n2012 年：法國 3 / 21 / 76；美國 2 / 18 / 80。\n在過去兩百年間，法國和美國從事農業的人口比例都已下降，而服務業（包括零售、顧問、房地產等工作）的就業比例則上升了。然而，這種轉變在兩國發生的速度截然不同。比較兩國在 _______ 的各產業就業情形，就能最清楚地看出這一點。", "opts": {"A": "1900 with the employment by sector in 1950.", "B": "1800 with the employment by sector in 2012.", "C": "1900 with the employment by sector in 2012.", "D": "1800 with the employment by sector in 1900."}, "optsZh": {"A": "1900 年的各產業就業情形與 1950 年的各產業就業情形。", "B": "1800 年的各產業就業情形與 2012 年的各產業就業情形。", "C": "1900 年的各產業就業情形與 2012 年的各產業就業情形。", "D": "1800 年的各產業就業情形與 1900 年的各產業就業情形。"}, "answer": "A", "expl": "In 1900 the two countries had similar figures (agriculture 43 vs. 41), but by 1950 they differed sharply (32 vs. 14; services 35 vs. 53), showing the transition happened at different rates.", "explZh": "1900 年兩國的數字很接近（農業 43 比 41），但到了 1950 年就差異很大（農業 32 比 14；服務業 35 比 53），顯示兩國轉變的速度不同。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Quantitative Evidence: different transition rates by country", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrate<\/a> that claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在上任的第一個月簽署了數項法令。」", "C": "「這個政府從一開始就面臨經濟上的挑戰。」", "D": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Quantitative Evidence: different transition rates by country", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "The southern region was included in the survey.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "C": "南部地區有被納入調查。", "D": "有些農民種植蔬菜，而另一些則種植穀物。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Quantitative Evidence: different transition rates by country", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "One rocky planet has a thin atmosphere.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Quantitative Evidence: different transition rates by country", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Some songs use a meter also found in older European poetry.", "C": "The tradition is studied by scholars in several countries.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "C": "有數個國家的學者研究這項傳統。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Quantitative Evidence: different transition rates by country", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is best supported?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The table includes more than one year.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這個計畫在一個社區中進行。", "B": "這張表格包含不只一個年份。", "C": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。", "D": "兩個城鎮都有一些志工。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Command of Evidence: LNH not supported", "vocab": false, "body": "The linguistic niche <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a> (LNH) posits that the exotericity of languages (how <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prevalent\" target=\"_blank\" rel=\"noopener\" data-w=\"prevalent\" data-pos=\"adj.\" data-en=\"common or widespread\" data-zh=\"普遍的；盛行的\">prevalent<\/a> non-native speakers are) and grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complexity\" target=\"_blank\" rel=\"noopener\" data-w=\"complexity\" data-pos=\"n.\" data-en=\"the state of having many connected parts; being complicated\" data-zh=\"複雜性\">complexity<\/a> are inversely related, which the LNH ascribes to attrition of complex grammatical rules as more non-native speakers adopt the language but fail to acquire those rules. Focusing on two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=characteristic\" target=\"_blank\" rel=\"noopener\" data-w=\"characteristic\" data-pos=\"n.\" data-en=\"a typical quality or feature\" data-zh=\"特徵；特性\">characteristics<\/a> that are positive indices of grammatical complexity, fusion (when new phonemes arise from the merger of previously distinct ones) and informativity (languages’ capacity for meaningful variation), Olena Shcherbakova and colleagues conducted a quantitative analysis for more than 1,300 languages and claim the outcome is inconsistent with the LNH.", "bodyPlain": "The linguistic niche hypothesis (LNH) posits that the exotericity of languages (how prevalent non-native speakers are) and grammatical complexity are inversely related, which the LNH ascribes to attrition of complex grammatical rules as more non-native speakers adopt the language but fail to acquire those rules. Focusing on two characteristics that are positive indices of grammatical complexity, fusion (when new phonemes arise from the merger of previously distinct ones) and informativity (languages’ capacity for meaningful variation), Olena Shcherbakova and colleagues conducted a quantitative analysis for more than 1,300 languages and claim the outcome is inconsistent with the LNH.", "stem": "Which finding, if true, would most directly support Shcherbakova and colleagues’ claim?", "stemZh": "哪一項發現若為真，最能直接支持 Shcherbakova 和同事的主張？", "bodyZh": "語言生態位假說（LNH）主張，語言的外向性（非母語使用者的普遍程度）與文法複雜度呈反比關係；LNH 將此歸因於：當越來越多非母語使用者採用這種語言卻沒能學會那些複雜的文法規則時，這些規則就逐漸消失。Olena Shcherbakova 和同事針對文法複雜度的兩個正向指標——融合（先前不同的音素合併而產生新音素）與資訊量（語言產生有意義變化的能力）——對超過 1,300 種語言進行了量化分析，並宣稱結果與 LNH 不一致。", "opts": {"A": "Shcherbakova and colleagues’ analysis showed a slightly negative correlation between grammatical complexity and fusion and between grammatical complexity and informativity.", "B": "Shcherbakova and colleagues’ analysis showed a slightly negative correlation between grammatical complexity and exotericity.", "C": "Shcherbakova and colleagues’ analysis showed a slightly positive correlation between grammatical complexity and fusion.", "D": "Shcherbakova and colleagues’ analysis showed a slightly positive correlation between fusion and exotericity and between informativity and exotericity."}, "optsZh": {"A": "Shcherbakova 和同事的分析顯示，文法複雜度與融合之間、以及文法複雜度與資訊量之間都呈輕微負相關。", "B": "Shcherbakova 和同事的分析顯示，文法複雜度與外向性之間呈輕微負相關。", "C": "Shcherbakova 和同事的分析顯示，文法複雜度與融合之間呈輕微正相關。", "D": "Shcherbakova 和同事的分析顯示，融合與外向性之間、以及資訊量與外向性之間都呈輕微正相關。"}, "answer": "D", "expl": "The LNH predicts that complexity falls as exotericity rises; a positive correlation between exotericity and fusion and informativity (indices of complexity) contradicts it.", "explZh": "LNH 預測外向性越高，文法複雜度越低；若外向性與融合、資訊量（複雜度指標）呈正相關，就與 LNH 相矛盾。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Command of Evidence: LNH not supported", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrate<\/a> that claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟上的挑戰。」", "B": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Command of Evidence: LNH not supported", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "The graph contains information about three regions.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "這張圖表包含三個地區的資訊。", "C": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "D": "有些農民種植蔬菜，而另一些則種植穀物。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Command of Evidence: LNH not supported", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/di
