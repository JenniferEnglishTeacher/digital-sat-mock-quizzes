t, and academic tone. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To describe a completed celebration from beginning to end", "B": "To explain why the family dislikes visitors", "C": "To depict preparations that reveal anticipation within a family", "D": "To contrast rural and urban customs"}, "optsZh": {"A": "從頭到尾描述一場已經結束的慶祝活動", "B": "解釋為什麼這家人不喜歡訪客", "C": "描繪顯露出一家人期待之情的準備工作", "D": "對比鄉村與都市的風俗"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Main Purpose: Higgins's mother wants him to leave", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；而是凸顯了上課前那些安靜的例行儀式。", "opts": {"A": "To recount a student's entire academic career", "B": "To evaluate the quality of a school's curriculum", "C": "To describe the moments before a significant daily activity begins", "D": "To argue that early classes should be canceled"}, "optsZh": {"A": "敘述一名學生完整的求學經歷", "B": "評估一所學校課程的品質", "C": "描述一項重要的日常活動開始前的時刻", "D": "主張應取消早上的課"}, "answer": "C", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Main Purpose: Higgins's mother wants him to leave", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To establish a reflective mood before a character acts", "B": "To compare two different seasons", "C": "To give instructions for maintaining a garden", "D": "To reveal the full contents of a letter"}, "optsZh": {"A": "在角色採取行動之前營造一種沉思的氛圍", "B": "比較兩個不同的季節", "C": "提供照顧花園的指示", "D": "揭露一封信的完整內容"}, "answer": "A", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Poetry Function: waves as relentless force", "vocab": false, "body": "The following text is from Charlotte Forten Grimké’s 1888 poem “At Newport.”<br><br>Oh, deep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=delight\" target=\"_blank\" rel=\"noopener\" data-w=\"delight\" data-pos=\"n.\" data-en=\"great pleasure or happiness\" data-zh=\"欣喜；愉快\">delight<\/a> to watch the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gladsome\" target=\"_blank\" rel=\"noopener\" data-w=\"gladsome\" data-pos=\"adj.\" data-en=\"(literary) cheerful and joyful\" data-zh=\"歡欣的；令人愉快的\">gladsome<\/a> waves<br>Exultant leap upon the rugged rocks;<br><u>Ever <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=repulse\" target=\"_blank\" rel=\"noopener\" data-w=\"repulse\" data-pos=\"v.\" data-en=\"to drive back or force away an attack or something moving forward\" data-zh=\"擊退；逐退\">repulsed<\/a>, yet ever rushing on—<br>Filled with a life that will not know defeat;<\/u><br>To see the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=glorious\" target=\"_blank\" rel=\"noopener\" data-w=\"glorious\" data-pos=\"adj.\" data-en=\"very beautiful or impressive; deserving great praise\" data-zh=\"燦爛的；輝煌的\">glorious<\/a> hues of sky and sea.<br>The distant snowy sails, glide spirit like,<br>Into an unknown world, to feel the sweet<br>Enchantment of the sea thrill all the soul,<br>Clearing the clouded brain, making the heart<br>Leap joyous as it own bright, singing waves!", "bodyPlain": "The following text is from Charlotte Forten Grimké’s 1888 poem “At Newport.”\n\nOh, deep delight to watch the gladsome waves\nExultant leap upon the rugged rocks;\nEver repulsed, yet ever rushing on—\nFilled with a life that will not know defeat;\nTo see the glorious hues of sky and sea.\nThe distant snowy sails, glide spirit like,\nInto an unknown world, to feel the sweet\nEnchantment of the sea thrill all the soul,\nClearing the clouded brain, making the heart\nLeap joyous as it own bright, singing waves!", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "以下文字出自 Charlotte Forten Grimké 1888 年的詩〈在新港〉（At Newport）。\n哦，看著那歡欣的浪潮，真是深深的喜悅\n狂喜地躍上崎嶇的岩石；\n一再被擊退，卻又一再向前衝——\n充滿一股不知失敗為何物的生命力；\n看見天空與大海燦爛的色彩。\n遠方雪白的船帆，如幽靈般滑行，\n駛入一個未知的世界，去感受那甜美的\n大海的魔力震撼整個靈魂，\n使混沌的頭腦清明，使心\n像它自己明亮、歌唱的浪潮般歡欣跳躍！", "opts": {"A": "It portrays the surroundings as an imposing and intimidating scene.", "B": "It characterizes the sea’s waves as a relentless and enduring force.", "C": "It conveys the speaker’s ambivalence about the natural world.", "D": "It draws a contrast between the sea’s waves and the speaker’s thoughts."}, "optsZh": {"A": "它把周遭環境描繪成一個雄偉而令人畏懼的景象。", "B": "它把海浪描繪成一股不懈且持久的力量。", "C": "它傳達說話者對大自然的矛盾心情。", "D": "它在海浪與說話者的思緒之間形成對比。"}, "answer": "B", "expl": "The underlined lines say the waves are “ever repulsed, yet ever rushing on” and “will not know defeat,” portraying them as a relentless, enduring force.", "explZh": "畫底線的詩句說海浪「一再被擊退，卻又一再向前衝」、「不知失敗為何物」，把海浪描繪成一股不懈且持久的力量。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Poetry Function: waves as relentless force", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍然所知甚少。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It offers evidence that radar is always reliable.", "B": "It identifies the uncertainty that motivated the study.", "C": "It describes how other researchers criticized the work.", "D": "It states the study's final conclusion."}, "optsZh": {"A": "它提供證據證明雷達永遠可靠。", "B": "它指出促成這項研究的不確定之處。", "C": "它描述其他研究者如何批評這項研究。", "D": "它陳述這項研究的最終結論。"}, "answer": "B", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Poetry Function: waves as relentless force", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。一段考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著，這段文章討論一個研究團隊，他們在陶器中尋找化學特徵，卻只得出暫時性的結論。", "opts": {"A": "It contradicts the claim made in the first sentence.", "B": "It defines the problem the later investigation attempts to address.", "C": "It summarizes the team's strongest result.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它反駁了第一句提出的主張。", "B": "它界定了後續研究試圖解決的問題。", "C": "它概述該團隊最有力的研究結果。", "D": "它把討論從考古學轉移開來。"}, "answer": "B", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Poetry Function: waves as relentless force", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mechanism\" target=\"_blank\" rel=\"noopener\" data-w=\"mechanism\" data-pos=\"n.\" data-en=\"a set of moving parts in a machine that perform a function\" data-zh=\"機械裝置；機制\">mechanism<\/a> allows this survival. The rest of the text describes an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> that eliminated one possible mechanism.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It lists the materials used in the experiment.", "B": "It proves that drought has no effect on plants.", "C": "It gives a historical overview of plant classification.", "D": "It introduces a gap in knowledge that the experiment examines."}, "optsZh": {"A": "它列出實驗中使用的材料。", "B": "它證明乾旱對植物沒有任何影響。", "C": "它概述植物分類的歷史。", "D": "它引出實驗所要探究的知識空白。"}, "answer": "D", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Poetry Function: waves as relentless force", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting that good things will happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一篇文學分析開頭指出，某部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含好幾個象徵禁錮的意象。這段的其餘部分解釋了那些意象如何使先前的解讀變得複雜。", "opts": {"A": "It provides biographical information about the novelist.", "B": "It introduces an unrelated theme.", "C": "It raises a difficulty with a common interpretation.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它提供這位小說家的生平資料。", "B": "它引入一個不相關的主題。", "C": "它指出一種常見詮釋的問題。", "D": "它概述這部小說的出版歷史。"}, "answer": "C", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Poetry Function: waves as relentless force", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical structure. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unpredictable\" target=\"_blank\" rel=\"noopener\" data-w=\"unpredictable\" data-pos=\"adj.\" data-en=\"impossible to know in advance\" data-zh=\"無法預測的\">unpredictable<\/a>. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一篇科技文章首先說，自主水下載具可以繪製海床地圖。下一句解釋，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師正在為這些條件測試一套新的導航系統。", "opts": {"A": "It explains the limitation that the new system is meant to address.", "B": "It announces that the technology is already flawless.", "C": "It compares underwater vehicles with aircraft.", "D": "It gives a personal anecdote about engineers."}, "optsZh": {"A": "它說明新系統要解決的限制。", "B": "它宣稱這項技術已經完美無缺。", "C": "它比較水下載具與飛機。", "D": "它講述一則關於工程師的個人軼事。"}, "answer": "A", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Main Idea: impractical apartment may improve well-being", "vocab": false, "body": "Believing that living in an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=impractical\" target=\"_blank\" rel=\"noopener\" data-w=\"impractical\" data-pos=\"adj.\" data-en=\"not sensible or useful in real situations\" data-zh=\"不實用的\">impractical<\/a> space can heighten <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> and even improve health, conceptual artists Madeline Gins and Shusaku Arakawa designed an apartment building in Japan to be more fanciful than functional. A kitchen counter is chest-high on one side and knee-high on the other; a ceiling has a door to nowhere. The effect is disorienting but <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invigorate\" target=\"_blank\" rel=\"noopener\" data-w=\"invigorate\" data-pos=\"v.\" data-en=\"to give energy and strength to\" data-zh=\"使振奮；使有活力\">invigorating<\/a>: after four years there, filmmaker Nobu Yamaoka reported <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> health benefits.", "bodyPlain": "Believing that living in an impractical space can heighten awareness and even improve health, conceptual artists Madeline Gins and Shusaku Arakawa designed an apartment building in Japan to be more fanciful than functional. A kitchen counter is chest-high on one side and knee-high on the other; a ceiling has a door to nowhere. The effect is disorienting but invigorating: after four years there, filmmaker Nobu Yamaoka reported significant health benefits.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "觀念藝術家 Madeline Gins 與荒川修作（Shusaku Arakawa）相信，住在不實用的空間裡能提高感知力，甚至改善健康，因此他們在日本設計了一棟重奇想、輕實用的公寓大樓。廚房流理台一邊高及胸口、另一邊只到膝蓋；天花板上有一扇通往無處的門。這種效果令人迷失方向卻又使人振奮：在那裡住了四年後，電影製作人山岡信貴（Nobu Yamaoka）表示健康有顯著改善。", "opts": {"A": "Although inhabiting a home surrounded by fanciful features such as those designed by Gins and Arakawa can be rejuvenating, it is unsustainable.", "B": "Designing disorienting spaces like those in the Gins and Arakawa building is the most effective way to create a physically stimulating environment.", "C": "As a filmmaker, Yamaoka has long supported the designs of conceptual artists such as Gins and Arakawa.", "D": "Although impractical, the design of the apartment building by Gins and Arakawa may improve the well-being of the building’s residents."}, "optsZh": {"A": "雖然住在像 Gins 與荒川所設計那樣充滿奇想的家中能使人恢復活力，但這是無法長久持續的。", "B": "設計像 Gins 與荒川大樓中那種令人迷失方向的空間，是打造能刺激身體的環境最有效的方式。", "C": "身為電影製作人，山岡長期支持 Gins 與荒川等觀念藝術家的設計。", "D": "雖然不實用，但 Gins 和 Arakawa 設計的這棟公寓大樓可能會改善住戶的身心健康。"}, "answer": "D", "expl": "The text says the building is impractical (“more fanciful than functional”) yet invigorating, with a resident reporting health benefits, so it may improve residents’ well-being.", "explZh": "本文指出這棟大樓並不實用（「奇幻多於實用」），卻令人精神振奮，還有住戶表示健康獲益，所以它可能改善住戶的身心健康。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Main Idea: impractical apartment may improve well-being", "vocab": false, "body": "Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single ral choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher ha 文的主旨？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To describe a completed celebration from beginning to end", "B": "To contrast rural and urban customs", "C": "To depict preparations that reveal anticipation within a family", "D": "To explain why the family dislikes visitors"}, "optsZh": {"A": "從頭到尾描述一場已經結束的慶祝活動", "B": "對比鄉村與都市的風俗", "C": "描繪顯露出一家人期待之情的準備工作", "D": "解釋為什麼這家人不喜歡訪客"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Main Idea: impractical apartment may improve well-being", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses forma es there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To establish a reflective mood before a character acts", "C": "To reveal the full contents of a letter", "D": "To compare two different seasons"}, "optsZh": {"A": "提供照顧花園的指示", "B": "在角色採取行動之前營造一種沉思的氛圍", "C": "揭露一封信的完整內容", "D": "比較兩個不同的季節"}, "answer": "B", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Character Inference: crowd appears disunited", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Lewis Carroll’s 1889 satirical novel Sylvie and Bruno. A crowd has gathered outside a room belonging to the Warden, an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=official\" target=\"_blank\" rel=\"noopener\" data-w=\"official\" data-pos=\"adj.\" data-en=\"approved by or coming from people in authority\" data-zh=\"正式的；官方的\">official<\/a> who reports to the Lord Chancellor.<br><br>One man, who was more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=excited\" target=\"_blank\" rel=\"noopener\" data-w=\"excited\" data-pos=\"adj.\" data-en=\"feeling very happy and eager about something\" data-zh=\"興奮的\">excited<\/a> than the rest, flung his hat high into the air, and shouted (as well as I could make out) “Who roar for the Sub-Warden?” Everybody roared, but whether it was for the Sub-Warden, or not, did not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=clear\" target=\"_blank\" rel=\"noopener\" data-w=\"clear\" data-pos=\"adj./v.\" data-en=\"easy to see or understand; (v.) to remove something blocking, e.g., to clear your throat\" data-zh=\"清楚的；清除、清（喉嚨）\">clearly<\/a> appear: some were shouting “Bread!” and some “Taxes!”, but no one seemed to know what it was they really wanted.<br>All this I saw from the open window of the Warden’s breakfast-saloon, looking across the shoulder of the Lord Chancellor.<br>“What can it all mean?” he kept repeating to himself. “I never heard such shouting before—and at this time of the morning, too! And with such unanimity!”", "bodyPlain": "The following text is adapted from Lewis Carroll’s 1889 satirical novel Sylvie and Bruno. A crowd has gathered outside a room belonging to the Warden, an official who reports to the Lord Chancellor.\n\nOne man, who was more excited than the rest, flung his hat high into the air, and shouted (as well as I could make out) “Who roar for the Sub-Warden?” Everybody roared, but whether it was for the Sub-Warden, or not, did not clearly appear: some were shouting “Bread!” and some “Taxes!”, but no one seemed to know what it was they really wanted.\nAll this I saw from the open window of the Warden’s breakfast-saloon, looking across the shoulder of the Lord Chancellor.\n“What can it all mean?” he kept repeating to himself. “I never heard such shouting before—and at this time of the morning, too! And with such unanimity!”", "stem": "Based on the text, how does the Lord Chancellor respond to the crowd?", "stemZh": "根據本文，大法官對群眾的反應如何？", "bodyZh": "以下文字改寫自 Lewis Carroll 1889 年的諷刺小說《Sylvie and Bruno》。一群人聚集在典獄長（Warden）的房間外；典獄長是一位向大法官（Lord Chancellor）負責的官員。\n其中一個男人比其他人更激動，他把帽子高高拋向空中，並大喊（就我所能聽清楚的）「誰為副典獄長歡呼？」所有人都吼叫起來，但到底是不是為了副典獄長而吼叫，並不清楚：有些人喊著「麵包！」，有些人喊著「稅！」，但似乎沒有人知道他們真正想要的是什麼。\n這一切都是我從典獄長早餐廳敞開的窗戶，越過大法官的肩膀看到的。\n「這到底是什麼意思？」他不斷地自言自語。「我從來沒聽過這樣的喊叫聲——而且還是在一大早！而且還這麼齊心一致！」", "opts": {"A": "He asks about the meaning of the crowd’s shouting, even though he claims to know what the crowd wants.", "B": "He indicates a desire to speak to the crowd, even though the crowd has asked to speak to the Sub-Warden.", "C": "He expresses sympathy for the crowd’s demands, even though the crowd’s shouting annoys him.", "D": "He describes the crowd as being united, even though the crowd clearly appears otherwise."}, "optsZh": {"A": "他詢問群眾喊叫的意思，儘管他聲稱知道群眾想要什麼。", "B": "他表示想要對群眾講話，即使群眾要求的是和 Sub-Warden 說話。", "C": "他對群眾的要求表示同情，儘管群眾的喊叫讓他感到厭煩。", "D": "他把群眾描述為團結一致，即使群眾顯然並非如此。"}, "answer": "D", "expl": "The crowd shouts different things and no one knows what they want, yet the Lord Chancellor exclaims “with such unanimity!”—he calls the crowd united though it clearly is not.", "explZh": "群眾喊著各種不同的口號，沒有人知道他們要什麼，但大法官卻驚呼「如此齊心一致！」——他把明顯不團結的群眾形容為團結一致。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Character Inference: crowd appears disunited", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrate<\/a> that claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "B": "「這位領導人在上任的第一個月簽署了數項法令。」", "C": "「這個政府從一開始就面臨經濟上的挑戰。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "A", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Character Inference: crowd appears disunited", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "The graph contains information about three regions.", "C": "The southern region was included in the survey.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "這張圖表包含三個地區的資訊。", "C": "南部地區有被納入調查。", "D": "有些農民種植蔬菜，而另一些則種植穀物。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Character Inference: crowd appears disunited", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "The method used to study stars requires a telescope.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "有一顆岩質行星擁有稀薄的大氣層。", "B": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "C": "研究恆星所用的方法需要望遠鏡。", "D": "有些恆星含有氫和氦。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Character Inference: crowd appears disunited", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Some songs use a meter also found in older European poetry.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "有數個國家的學者研究這項傳統。", "B": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "C": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "D": "許多表演者是向親戚學習歌曲的。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Character Inference: crowd appears disunited", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is best supported?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "Both towns had some volunteers.", "C": "The table includes more than one year.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這個計畫在一個社區中進行。", "B": "兩個城鎮都有一些志工。", "C": "這張表格包含不只一個年份。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Quantitative Evidence: highest wild land mammal biomass", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=global\" target=\"_blank\" rel=\"noopener\" data-w=\"global\" data-pos=\"adj.\" data-en=\"relating to the whole world\" data-zh=\"全球的；世界的\">Global<\/a> biomass is the total mass of living material, such as animals and plants, on Earth. A team of scientists estimated the global biomass, by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>, of various wild land mammals. The team found that the species with the highest global biomass is the _______<br>[Graph: Top Four Species of Wild Land Mammals by Global Biomass. The graph is not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reproduce\" target=\"_blank\" rel=\"noopener\" data-w=\"reproduce\" data-pos=\"v.\" data-en=\"to make a copy of something\" data-zh=\"複製；再製\">reproduced<\/a> in this text <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=version\" target=\"_blank\" rel=\"noopener\" data-w=\"version\" data-pos=\"n.\" data-en=\"a form of something that is slightly different from others\" data-zh=\"版本\">version<\/a>.]", "bodyPlain": "Global biomass is the total mass of living material, such as animals and plants, on Earth. A team of scientists estimated the global biomass, by species, of various wild land mammals. The team found that the species with the highest global biomass is the _______\n[Graph: Top Four Species of Wild Land Mammals by Global Biomass. The graph is not reproduced in this text version.]", "stem": "Which choice most effectively uses data from the graph to complete the sentence?", "stemZh": "哪一個選項最有效地運用圖表中的數據來完成這個句子？", "bodyZh": "全球生物量是指地球上動物和植物等所有生物物質的總質量。一組科學家依物種估計了各種野生陸地哺乳動物的全球生物量。研究團隊發現，全球生物量最高的物種是 _______\n［圖表：依全球生物量排名前四的野生陸地哺乳動物物種。本文字版未附此圖表。］", "opts": {"A": "wild boar.", "B": "eastern gray kangaroo.", "C": "African bush elephant.", "D": "white-tailed deer."}, "optsZh": {"A": "野豬。", "B": "東部灰袋鼠。", "C": "非洲草原象。", "D": "白尾鹿。"}, "answer": "D", "expl": "In the graph, the white-tailed deer has the tallest bar, so it is the species with the highest global biomass. (The graph is not reproduced in this text version.)", "explZh": "圖表中白尾鹿的長條最高，所以它是全球生物量最高的物種。（本文字版未附圖表。）"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Quantitative Evidence: highest wild land mammal biomass", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrate<\/a> that claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這個政府從一開始就面臨經濟上的挑戰。」", "C": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Quantitative Evidence: highest wild land mammal biomass", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The graph contains information about three regions.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "有些農民種植蔬菜，而另一些則種植穀物。", "C": "這張圖表包含三個地區的資訊。", "D": "南部地區有被納入調查。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Quantitative Evidence: highest wild land mammal biomass", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserves<\/a> the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "One rocky planet has a thin atmosphere.", "C": "Some stars contain hydrogen and helium.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "有些恆星含有氫和氦。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Quantitative Evidence: highest wild land mammal biomass", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "The tradition is studied by scholars in several countries.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "許多表演者是向親戚學習歌曲的。", "B": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "C": "有數個國家的學者研究這項傳統。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Quantitative Evidence: highest wild land mammal biomass", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is best supported?", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the p
