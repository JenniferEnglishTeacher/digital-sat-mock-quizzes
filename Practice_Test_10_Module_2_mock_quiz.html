arifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device:", "B": "device,", "C": "device--", "D": "device"}, "optsZh": {"A": "device:（冒號 → 不當隔開主詞與動詞，錯誤）", "B": "device,（逗號 → 不當隔開主詞與動詞，錯誤）", "C": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "D": "device（裝置；設備）"}, "answer": "D", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Grammar: present-tense reach", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "that", "B": "this", "C": "it", "D": "them"}, "optsZh": {"A": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "C": "it（它，單數代名詞 → 與複數先行詞不一致：錯誤）", "D": "them（他們，複數受格代名詞，指 devices：正確）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Grammar: present-tense reach", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduces<\/a> readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family, and", "B": "family", "C": "family,", "D": "family and"}, "optsZh": {"A": "family, and（逗號＋and）", "B": "family（無標點）", "C": "family,（逗號，結束以 a family saga 開頭的同位語）", "D": "family and（無標點＋and）"}, "answer": "B", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Grammar: present-tense reach", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free. In part because", "B": "free, in part because:", "C": "free, in part because,", "D": "free in part because"}, "optsZh": {"A": "free. In part because（句號，以 In part because 另起一句）", "B": "free, in part because:（逗號＋in part because＋冒號）", "C": "free, in part because,（逗號＋in part because＋逗號）", "D": "free in part because（無標點，直接接原因子句）"}, "answer": "A", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Grammar: present-tense passive is considered", "vocab": false, "body": "In his 1963 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> Exposition of Music—Electronic Television, Korean American artist Nam June Paik showed how television images could be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manipulate\" target=\"_blank\" rel=\"noopener\" data-w=\"manipulate\" data-pos=\"v.\" data-en=\"to control or change something skillfully\" data-zh=\"操控；操縱\">manipulated<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=express\" target=\"_blank\" rel=\"noopener\" data-w=\"express\" data-pos=\"v.\" data-en=\"to show a feeling or opinion in words or actions\" data-zh=\"表達\">express<\/a> an artist’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspective<\/a>. Today, Paik _______ considered the first video artist.", "bodyPlain": "In his 1963 exhibition Exposition of Music—Electronic Television, Korean American artist Nam June Paik showed how television images could be manipulated to express an artist’s perspective. Today, Paik _______ considered the first video artist.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在 1963 年的展覽《音樂的展示——電子電視》中，韓裔美國藝術家 Nam June Paik 展示了如何操控電視影像來表達藝術家的觀點。如今，Paik _______ 被視為第一位錄像藝術家。", "opts": {"A": "will be", "B": "had been", "C": "was", "D": "is"}, "optsZh": {"A": "will be（未來式 → 與 Today 不符：錯誤）", "B": "had been（過去完成式 → 與 Today 不符：錯誤）", "C": "was（過去式 → 與 Today 不符：錯誤）", "D": "is（單數現在式 be 動詞：主詞單數且敘述現在的事實，正確）"}, "answer": "D", "expl": "“Today” signals the present, and the singular subject Paik needs the singular present “is” (is considered).", "explZh": "Today 表示現在，單數主詞 Paik 需要單數現在式 is（is considered）。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Grammar: present-tense passive is considered", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct a tructure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device:", "B": "device", "C": "device,", "D": "device--"}, "optsZh": {"A": "device:（冒號 → 不當隔開主詞與動詞，錯誤）", "B": "device（裝置；設備）", "C": "device,（逗號 → 不當隔開主詞與動詞，錯誤）", "D": "device--（破折號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "B", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Grammar: present-tense passive is considered", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "that", "B": "it", "C": "this", "D": "them"}, "optsZh": {"A": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "it（它，單數代名詞 → 與複數先行詞不一致：錯誤）", "C": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "D": "them（他們，複數受格代名詞，指 devices：正確）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Grammar: present-tense passive is considered", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduces<\/a> readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family", "B": "family, and", "C": "family,", "D": "family and"}, "optsZh": {"A": "family（無標點）", "B": "family, and（逗號＋and）", "C": "family,（逗號，結束以 a family saga 開頭的同位語）", "D": "family and（無標點＋and）"}, "answer": "A", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Grammar: present-tense passive is considered", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free, in part because,", "B": "free in part because", "C": "free, in part because:", "D": "free. In part because"}, "optsZh": {"A": "free, in part because,（逗號＋in part because＋逗號）", "B": "free in part because（無標點，直接接原因子句）", "C": "free, in part because:（逗號＋in part because＋冒號）", "D": "free. In part because（句號，以 In part because 另起一句）"}, "answer": "D", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Grammar: singular document outlines", "vocab": false, "body": "Former First Lady of the United States Eleanor Roosevelt and Indian <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activist\" target=\"_blank\" rel=\"noopener\" data-w=\"activist\" data-pos=\"n.\" data-en=\"a person who works for social or political change\" data-zh=\"社運人士；運動者\">activist<\/a> and educator Hansa Mehta were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrumental<\/a> in drafting the United Nations’ Universal Declaration of Human Rights, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=document\" target=\"_blank\" rel=\"noopener\" data-w=\"document\" data-pos=\"v.\" data-en=\"to record something in writing or pictures\" data-zh=\"記錄\">document<\/a> that _______ the basic freedoms to which all people are entitled.", "bodyPlain": "Former First Lady of the United States Eleanor Roosevelt and Indian activist and educator Hansa Mehta were instrumental in drafting the United Nations’ Universal Declaration of Human Rights, a document that _______ the basic freedoms to which all people are entitled.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "美國前第一夫人 Eleanor Roosevelt 和印度社運人士暨教育家 Hansa Mehta 在起草聯合國《世界人權宣言》時扮演了關鍵角色，這份文件 _______ 了所有人都應享有的基本自由。", "opts": {"A": "have outlined", "B": "were outlining", "C": "outlines", "D": "outline"}, "optsZh": {"A": "have outlined（複數動詞 → 與單數先行詞 a document 不一致：錯誤）", "B": "were outlining（複數過去進行式 → 與單數先行詞不一致，時態也不當：錯誤）", "C": "outlines（單數現在式，與單數先行詞 a document 一致：正確）", "D": "outline（複數動詞 → 與單數先行詞 a document 不一致：錯誤）"}, "answer": "C", "expl": "The relative clause “that ______” refers to the singular noun “a document,” and the document still outlines freedoms today, so singular present “outlines” is correct.", "explZh": "關係子句「that ______」指的是單數名詞 a document，而且這份文件至今仍列出這些自由，所以要用單數現在式 outlines。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Grammar: singular document outlines", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "publishing", "B": "published", "C": "to publish", "D": "having published"}, "optsZh": {"A": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）", "B": "published（簡單過去式：主要動詞，正確）", "C": "to publish（不定詞 → 句子缺少主要動詞，錯誤）", "D": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）"}, "answer": "B", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Grammar: singular document outlines", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device--", "B": "device:", "C": "device,", "D": "device"}, "optsZh": {"A": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "B": "device:（冒號 → 不當隔開主詞與動詞，錯誤）", "C": "device,（逗號 → 不當隔開主詞與動詞，錯誤）", "D": "device（裝置；設備）"}, "answer": "D", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Grammar: singular document outlines", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "that", "B": "them", "C": "this", "D": "it"}, "optsZh": {"A": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "them（他們，複數受格代名詞，指 devices：正確）", "C": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "D": "it（它，單數代名詞 → 與複數先行詞不一致：錯誤）"}, "answer": "B", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Grammar: singular document outlines", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduces<\/a> readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family,", "B": "family and", "C": "family", "D": "family, and"}, "optsZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family and（無標點＋and）", "C": "family（無標點）", "D": "family, and（逗號＋and）"}, "answer": "C", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Grammar: singular document outlines", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free. In part because", "B": "free, in part because:", "C": "free in part because", "D": "free, in part because,"}, "optsZh": {"A": "free. In part because（句號，以 In part because 另起一句）", "B": "free, in part because:（逗號＋in part because＋冒號）", "C": "free in part because（無標點，直接接原因子句）", "D": "free, in part because,（逗號＋in part because＋逗號）"}, "answer": "A", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Grammar: colon after threefold", "vocab": false, "body": "In February 1919, following the end of the First World War, women from ten <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">countries<\/a> around the world convened the Inter-Allied Women’s Conference in Paris. The conference’s goals were _______ ensure women’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=participation\" target=\"_blank\" rel=\"noopener\" data-w=\"participation\" data-pos=\"n.\" data-en=\"the act of taking part in something\" data-zh=\"參與\">participation<\/a> in the proceedings of the Paris Peace Conference, to secure the right of women to serve in the League of Nations, and to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocate<\/a> for human rights.", "bodyPlain": "In February 1919, following the end of the First World War, women from ten countries around the world convened the Inter-Allied Women’s Conference in Paris. The conference’s goals were _______ ensure women’s participation in the proceedings of the Paris Peace Conference, to secure the right of women to serve in the League of Nations, and to advocate for human rights.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "1919 年 2 月，第一次世界大戰結束後，來自世界各地十個國家的女性在巴黎召開了協約國婦女會議。這場會議的目標 _______ 確保女性參與巴黎和會的議程、爭取女性在國際聯盟任職的權利，以及倡導人權。", "opts": {"A": "threefold: to", "B": "threefold. To", "C": "threefold to", "D": "threefold; to"}, "optsZh": {"A": "threefold: to（冒號，引出後面列舉的三項目標：正確）", "B": "threefold. To（句號 → 後面的「To ensure…」成為不完整的句子片段：錯誤）", "C": "threefold to（無標點 → 無法引出後面列舉的三項目標：錯誤）", "D": "threefold; to（分號 → 後面不是獨立子句，不能用分號：錯誤）"}, "answer": "A", "expl": "“The conference’s goals were threefold” is a complete clause, and a colon correctly introduces the list of three goals that follows.", "explZh": "「The conference’s goals were threefold」是完整的子句，用冒號引出後面列舉的三項目標是正確的。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Grammar: colon after threefold", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "publishing", "B": "published", "C": "having published", "D": "to publish"}, "optsZh": {"A": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）", "B": "published（簡單過去式：主要動詞，正確）", "C": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "D": "to publish（不定詞 → 句子缺少主要動詞，錯誤）"}, "answer": "B", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Grammar: colon after threefold", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device", "B": "device:", "C": "device--", "D": "device,"}, "optsZh": {"A": "device（裝置；設備）", "B": "device:（冒號 → 不當隔開主詞與動詞，錯誤）", "C": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "D": "device,（逗號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "A", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Grammar: colon after threefold", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "this", "B": "it", "C": "that", "D": "them"}, "optsZh": {"A": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "it（它，單數代名詞 → 與複數先行詞不一致：錯誤）", "C": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "D": "them（他們，複數受格代名詞，指 devices：正確）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Grammar: colon after threefold", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduces<\/a> readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family and", "B": "family, and", "C": "family,", "D": "family"}, "optsZh": {"A": "family and（無標點＋and）", "B": "family, and（逗號＋and）", "C": "family,（逗號，結束以 a family saga 開頭的同位語）", "D": "family（無標點）"}, "answer": "D", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Grammar: colon after threefold", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. Although the topic may be unfamiliar, the correct answer is fully supported by the local context and can be found by tracing the author's reasoning. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。雖然主題可能令人陌生，但正確答案完全能由上下文支持，只要追蹤作者的推理就能找到。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free, in part because,", "B": "free in part because", "C": "free. In part because", "D": "free, in part because:"}, "optsZh": {"A": "free, in part because,（逗號＋in part because＋逗號）", "B": "free in part because（無標點，直接接原因子句）", "C": "free. In part because（句號，以 In part because 另起一句）", "D": "free, in part because:（逗號＋in part because＋冒號）"}, "answer": "C", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Grammar: singular compound subject is credited", "vocab": false, "body": "Mathematician Grigori Perelman, sometimes in conjunction with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematician\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematician\" data-pos=\"n.\" data-en=\"an expert in mathematics\" data-zh=\"數學家\">mathematicians<\/a> Richard S. Hamilton and Shing-Tung Yau, _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=credit\" target=\"_blank\" rel=\"noopener\" data-w=\"credit\" data-pos=\"n.\" data-en=\"public recognition for work done, e.g., on a film\" data-zh=\"（作品的）署名；功勞\">credited<\/a> with proving the Poincaré <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conjecture\" target=\"_blank\" rel=\"noopener\" data-w=\"conjecture\" data-pos=\"n.\" data-en=\"a guess or opinion based on incomplete information\" data-zh=\"推測\">conjecture<\/a>. Having built on Hamilton’s previous work to solve the proof, Perelman has insisted that Hamilton receive credit. Yau later found and closed gaps in Perelman’s proof, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=persuade\" target=\"_blank\" rel=\"noopener\" data-w=\"persuade\" data-pos=\"v.\" data-en=\"to make someone agree or believe by giving reasons\" data-zh=\"說服\">persuading<\/a> some mathematicians that he deserves credit as well.", "bodyPlain": "Mathematician Grigori Perelman, sometimes in conjunction with mathematicians Richard S. Hamilton and Shing-Tung Yau, _______ credited with proving the Poincaré conjecture. Having built on Hamilton’s previous work to solve the proof, Perelman has insisted that Hamilton receive credit. Yau later found and closed gaps in Perelman’s proof, persuading some mathematicians that he deserves credit as well.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "數學家 Grigori Perelman（有時連同數學家 Richard S. Hamilton 和 Shing-Tung Yau）_______ 被認為證明了龐加萊猜想。Perelman 是在 Hamilton 先前研究的基礎上完成這項證明的，因此他堅持 Hamilton 也應獲得功勞。Yau 後來找出並補足了 Perelman 證明中的漏洞，讓一些數學家相信他也應該獲得功勞。", "opts": {"A": "are", "B": "have been", "C": "are being", "D": "is"}, "optsZh": {"A": "are（複數現在式 be 動詞 → 與單數主詞不一致：錯誤）", "B": "have been（複數現在完成式 → 與單數主詞不一致：錯誤）", "C": "are being（複數現在進行式被動 → 與單數主詞 Perelman 不一致：錯誤）", "D": "is（單數現在式 be 動詞：主詞單數且敘述現在的事實，正確）"}, "answer": "D", "expl": "The subject is the singular “Grigori Perelman”; the phrase “sometimes in conjunction with…” is an interrupter and does not make the subject plural, so “is” is correct.", "explZh": "主詞是單數的 Grigori Perelman；「sometimes in conjunction with…」只是插入語，不會讓主詞變成複數，所以用 is。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Grammar: singular compound subject is credited", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The passage is written in the compact style of the digital SAT, so the answer depends on the exact <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The passage is written in the compact style of the digital SAT, so the answer depends on the exact relationship between the evidence and the blank rather than on a single familiar keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這篇文章採用數位 SAT 精簡的寫作風格，因此答案取決於證據與空格之間的確切關係，而不是某個熟悉的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "published", "B": "having published", "C": "to publish", "D": "publishing"}, "optsZh": {"A": "published（簡單過去式：主要動詞，正確）", "B": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "C": "to publish（不定詞 → 句子缺少主要動詞，錯誤）", "D": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）"}, "answer": "A", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Grammar: singular compound subject is credited", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. A teacher has asked students to read the whole passage before choosing an answer because several distractors are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=plausible\" target=\"_blank\" rel=\"noopener\" data-w=\"plausible\" data-pos=\"adj.\" data-en=\"seeming reasonable or likely to be true\" data-zh=\"合理的；可信的\">plausible<\/a> until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. A teacher has asked students to read the whole passage before choosing an answer because several distractors are plausible until the final sentence clarifies the logic. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。一位老師要求學生在選擇答案前先讀完整篇文章，因為在最後一句釐清邏輯之前，好幾個干擾選項看起來都說得通。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device:", "B": "device--", "C": "device", "D": "device,"}, "optsZh": {"A": "device:（冒號 → 不當隔開主詞與動詞，錯誤）", "B": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "C": "device（裝置；設備）", "D": "device,（逗號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "C", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Grammar: singular compound subject is credited", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. This item is intended for advanced EFL students working at the B2-C1 level; the vocabulary and syntax require attention to nuance, contrast, and academic tone. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。這個題目是為程度在 B2–C1 的進階 EFL 學生設計的；其中的字彙與句法需要注意細微差異、對比和學術語氣。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "this", "B": "that", "C": "it", "D": "them"}, "optsZh": {"A": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "C": "it（它，單數代名詞 → 與複數先行詞不一致：錯誤）", "D": "them（他們，複數受格代名詞，指 devices：正確）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Grammar: singular compound subject is credited", "vocab": false, "body": "Students should use the surrounding evidence to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduces<\/a> readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "Students should use the surrounding evidence to decide which option best fits the author's precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically appropriate, but only one preserves the passage's exact claim, contrast, or grammatical structure. The writer uses formal informational prose and expects the reader to infer meaning from context, including contrast words, examples, and qualifying phrases. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "學生應該利用上下文的證據來判斷哪個選項最符合作者的精確意思；正確答案是由整篇文章的邏輯所支持，而不只是由主題決定。好幾個選項聽起來都像學術用語，但只有一個能保留文章確切的主張、對比或文法結構。作者使用正式的說明性文字，並期待讀者從上下文推斷意思，包括對比詞、例子和限定語句。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family,", "B": "family", "C": "family and", "D": "family, and"}, "optsZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family（無標點）", "C": "family and（無標點＋and）", "D": "family, and（逗號＋and）"}, "answer": "B", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Grammar: singular compound subject is credited", "vocab": false, "body": "Students should use the surrounding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> to decide which option best fits the author&#x27;s precise meaning; the correct answer is supported by the logic of the whole passage, not by the topic alone. Several choices may sound academically <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a>, but only one preserves the passage&#x27;s exact claim, contrast, or grammatical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Although the topic may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a>, the correct answer is fully supported by the local context and can be found by tracing the author&#x27;s reasoning. The stranded research vessel took three d
