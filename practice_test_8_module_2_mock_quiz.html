<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 8, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 8, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: attractive to viewers", "vocab": true, "body": "Art <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> have noted that some colors seem to be more _______ viewers than others. For example, people tend to find <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">paintings<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=feature\" target=\"_blank\" rel=\"noopener\" data-w=\"feature\" data-pos=\"v.\" data-en=\"to include something as an important part\" data-zh=\"以…為特色；包含\">featuring<\/a> blues and greens more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appealing\" target=\"_blank\" rel=\"noopener\" data-w=\"appealing\" data-pos=\"adj.\" data-en=\"attractive or interesting\" data-zh=\"吸引人的；有魅力的\">appealing<\/a> than paintings featuring yellows and oranges.", "bodyPlain": "Art scholars have noted that some colors seem to be more _______ viewers than others. For example, people tend to find paintings featuring blues and greens more appealing than paintings featuring yellows and oranges.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "藝術學者注意到，某些顏色似乎比其他顏色更 _______ 觀眾。例如，人們往往覺得以藍色和綠色為主的畫作，比以黃色和橘色為主的畫作更吸引人。", "opts": {"A": "confusing for", "B": "attractive to", "C": "corrected by", "D": "similar to"}, "optsZh": {"A": "confusing for（使…困惑的）", "B": "attractive to（吸引…的、對…有吸引力的）", "C": "corrected by（被…修正的）", "D": "similar to（與……相似）"}, "answer": "B", "expl": "The example says people find blue and green paintings 'more appealing,' so some colors are more attractive to viewers than others.", "explZh": "例子指出人們覺得藍綠色畫作「更吸引人」，因此某些顏色比其他顏色更能吸引（attractive to）觀眾。", "defs": {"A": {"w": "confusing", "pos": "phr.", "en": "difficult for someone to understand", "zh": "使…困惑的", "word": "confusing"}, "B": {"w": "attractive", "pos": "phr.", "en": "pleasing to someone and making them want to look or come closer", "zh": "吸引…的；對…有吸引力的", "word": "attractive"}, "C": {"w": "corrected", "pos": "phr.", "en": "made right or fixed by someone or something", "zh": "被…修正的", "word": "corrected"}, "D": {"w": "similar", "pos": "phr.", "en": "almost the same as something", "zh": "類似於", "word": "similar"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: attractive to viewers", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Curators have observed that paintings with deep ultramarine backgrounds are often more _______ museum visitors than otherwise similar works dominated by harsh yellows.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Curators have observed that paintings with deep ultramarine backgrounds are often more _______ museum visitors than otherwise similar works dominated by harsh yellows.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。策展人觀察到，以深群青色為背景的畫作，往往比其他以刺眼黃色為主、條件相似的作品更 _______ 博物館參觀者。", "opts": {"A": "confusing for", "B": "appealing to", "C": "corrected by", "D": "similar to"}, "optsZh": {"A": "confusing for（使…困惑的）", "B": "appealing to（吸引…的、對…有吸引力的）", "C": "corrected by（被…修正的）", "D": "similar to（與……相似）"}, "answer": "B", "expl": "Appealing to means attractive to.", "explZh": "", "defs": {"A": {"w": "confusing", "pos": "phr.", "en": "difficult for someone to understand", "zh": "使…困惑的", "word": "confusing"}, "B": {"w": "appealing", "pos": "phr.", "en": "attractive or interesting to someone", "zh": "吸引…的；對…有吸引力的", "word": "appealing"}, "C": {"w": "corrected", "pos": "phr.", "en": "made right or fixed by someone or something", "zh": "被…修正的", "word": "corrected"}, "D": {"w": "similar", "pos": "phr.", "en": "almost the same as something", "zh": "類似於", "word": "similar"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: attractive to viewers", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The fabric samples dyed with indigo proved especially _______ buyers, who lingered over them longer than over the orange and brown samples.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The fabric samples dyed with indigo proved especially _______ buyers, who lingered over them longer than over the orange and brown samples.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。以靛藍染色的布料樣本特別 _______ 買家，他們在這些樣本前停留的時間比在橘色和棕色樣本前更久。", "opts": {"A": "copied by", "B": "distant from", "C": "resistant to", "D": "attractive to"}, "optsZh": {"A": "copied by（被……抄襲、模仿）", "B": "distant from（與……疏遠；遠離……）", "C": "resistant to（抗拒…的、對…有抵抗力的）", "D": "attractive to（吸引…的、對…有吸引力的）"}, "answer": "D", "expl": "Attractive to means pleasing or appealing.", "explZh": "", "defs": {"A": {"pos": "v. phr.", "en": "reproduced or imitated by someone", "zh": "被……抄襲、模仿", "word": "copied by"}, "B": {"pos": "adj. phr.", "en": "far away from; not closely connected to", "zh": "遠離……；與……疏遠", "word": "distant from"}, "C": {"w": "resistant", "pos": "phr.", "en": "not affected or harmed by something; opposing something", "zh": "抵抗…的；對…有抵抗力的", "word": "resistant"}, "D": {"w": "attractive", "pos": "phr.", "en": "pleasing to someone and making them want to look or come closer", "zh": "吸引…的；對…有吸引力的", "word": "attractive"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: attractive to viewers", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Designers found that the softer interface colors were more _______ users, who rated the blue-gray version as calmer and easier to read.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Designers found that the softer interface colors were more _______ users, who rated the blue-gray version as calmer and easier to read.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。設計師發現，較柔和的介面顏色更 _______ 使用者，使用者評價藍灰色版本較為平靜、也更容易閱讀。", "opts": {"A": "corrected by", "B": "obscure to", "C": "inviting to", "D": "similar to"}, "optsZh": {"A": "corrected by（被…修正的）", "B": "obscure to（使…難以理解的、模糊的）", "C": "inviting to（吸引…的、誘人的）", "D": "similar to（與……相似）"}, "answer": "C", "expl": "Inviting to means attractive to.", "explZh": "", "defs": {"A": {"w": "corrected", "pos": "phr.", "en": "made right or fixed by someone or something", "zh": "被…修正的", "word": "corrected"}, "B": {"w": "obscure", "pos": "phr.", "en": "unclear or hard for someone to understand", "zh": "使…難以理解的；對…而言模糊的", "word": "obscure"}, "C": {"w": "inviting", "pos": "phr.", "en": "attractive and welcoming to someone", "zh": "吸引…的；誘人的", "word": "inviting"}, "D": {"w": "similar", "pos": "phr.", "en": "almost the same as something", "zh": "類似於", "word": "similar"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: attractive to viewers", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The landscape <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> printed in cool green tones were _______ viewers, drawing longer attention than the warmer-toned versions.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The landscape photographs printed in cool green tones were _______ viewers, drawing longer attention than the warmer-toned versions.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。以冷綠色調印製的風景照片 _______ 觀眾，比暖色調版本吸引更長時間的注意。", "opts": {"A": "pleasing to", "B": "similar to", "C": "confusing for", "D": "corrected by"}, "optsZh": {"A": "pleasing to（令…愉悅的）", "B": "similar to（與……相似）", "C": "confusing for（使…困惑的）", "D": "corrected by（被…修正的）"}, "answer": "A", "expl": "Pleasing to means attractive to.", "explZh": "", "defs": {"A": {"w": "pleasing", "pos": "phr.", "en": "giving someone pleasure or satisfaction", "zh": "令…愉悅的", "word": "pleasing"}, "B": {"w": "similar", "pos": "phr.", "en": "almost the same as something", "zh": "類似於", "word": "similar"}, "C": {"w": "confusing", "pos": "phr.", "en": "difficult for someone to understand", "zh": "使…困惑的", "word": "confusing"}, "D": {"w": "corrected", "pos": "phr.", "en": "made right or fixed by someone or something", "zh": "被…修正的", "word": "corrected"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: attractive to viewers", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The restaurant&#x27;s quiet lighting and pale wood interior made the space more _______ customers seeking a relaxed meal.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The restaurant's quiet lighting and pale wood interior made the space more _______ customers seeking a relaxed meal.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這家餐廳柔和的燈光與淺色木質裝潢，讓空間對想輕鬆用餐的顧客更 _______。", "opts": {"A": "hidden from", "B": "similar to", "C": "inaccurate for", "D": "enticing to"}, "optsZh": {"A": "hidden from（對……隱藏）", "B": "similar to（與……相似）", "C": "inaccurate for（對…不準確的）", "D": "enticing to（吸引…的、誘人的）"}, "answer": "D", "expl": "Enticing to means attractive to.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "kept out of sight of", "zh": "對……隱藏", "word": "hidden from"}, "B": {"w": "similar", "pos": "phr.", "en": "almost the same as something", "zh": "類似於", "word": "similar"}, "C": {"w": "inaccurate", "pos": "phr.", "en": "not correct or exact for a purpose or person", "zh": "對…不準確的", "word": "inaccurate"}, "D": {"w": "enticing", "pos": "phr.", "en": "attractive in a way that tempts someone", "zh": "吸引…的；誘人的", "word": "enticing"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: preventable biodiversity loss", "vocab": true, "body": "Researchers and conservationists stress that biodiversity loss due to invasive species is _______. For example, people can take simple steps such as washing their footwear after travel to avoid <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introducing<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=potentially\" target=\"_blank\" rel=\"noopener\" data-w=\"potentially\" data-pos=\"adv.\" data-en=\"possibly, in the future\" data-zh=\"可能地；潛在地\">potentially<\/a> invasive <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organism\" target=\"_blank\" rel=\"noopener\" data-w=\"organism\" data-pos=\"n.\" data-en=\"a living thing\" data-zh=\"生物\">organisms<\/a> into new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environments<\/a>.", "bodyPlain": "Researchers and conservationists stress that biodiversity loss due to invasive species is _______. For example, people can take simple steps such as washing their footwear after travel to avoid introducing potentially invasive organisms into new environments.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員與保育人士強調，由入侵物種造成的生物多樣性喪失是 _______ 的。例如，人們可以採取一些簡單的步驟，像是旅行後清洗鞋子，以避免把可能具入侵性的生物帶進新的環境。", "opts": {"A": "preventable", "B": "undeniable", "C": "common", "D": "concerning"}, "optsZh": {"A": "preventable（可預防的）", "B": "undeniable（不可否認的）", "C": "common（常見的；普通的）", "D": "concerning（令人擔憂的）"}, "answer": "A", "expl": "The example shows that simple steps like washing footwear can stop invasive species from spreading, so the loss is preventable.", "explZh": "例子說明像清洗鞋子這樣的簡單步驟就能阻止入侵物種擴散，因此這種損失是可預防的（preventable）。", "defs": {"A": {"pos": "adj.", "en": "able to be stopped before it happens", "zh": "可預防的", "word": "preventable"}, "B": {"pos": "adj.", "en": "impossible to doubt or question", "zh": "不可否認的", "word": "undeniable"}, "C": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}, "D": {"pos": "adj.", "en": "causing worry", "zh": "令人擔憂的", "word": "concerning"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: preventable biodiversity loss", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The spread of the pest is not inevitable; because travelers can clean equipment before entering forests, such ecological damage is partly _______.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The spread of the pest is not inevitable; because travelers can clean equipment before entering forests, such ecological damage is partly _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這種害蟲的擴散並非無可避免；由於旅客可以在進入森林前清潔裝備，這類生態破壞在某種程度上是 _______ 的。", "opts": {"A": "undeniable", "B": "concerning", "C": "common", "D": "avoidable"}, "optsZh": {"A": "undeniable（不可否認的）", "B": "concerning（令人擔憂的）", "C": "common（常見的；普通的）", "D": "avoidable（可避免的）"}, "answer": "D", "expl": "Avoidable means preventable.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "impossible to doubt or question", "zh": "不可否認的", "word": "undeniable"}, "B": {"pos": "adj.", "en": "causing worry", "zh": "令人擔憂的", "word": "concerning"}, "C": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}, "D": {"pos": "adj.", "en": "able to be prevented from happening", "zh": "可避免的", "word": "avoidable"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: preventable biodiversity loss", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Public-health <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=official\" target=\"_blank\" rel=\"noopener\" data-w=\"official\" data-pos=\"adj.\" data-en=\"approved by or coming from people in authority\" data-zh=\"正式的；官方的\">officials<\/a> stress that many infections are _______ when people have access to vaccines, clean water, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accurate\" target=\"_blank\" rel=\"noopener\" data-w=\"accurate\" data-pos=\"adj.\" data-en=\"correct and exact, without mistakes\" data-zh=\"準確的\">accurate<\/a> information.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Public-health officials stress that many infections are _______ when people have access to vaccines, clean water, and accurate information.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。公共衛生官員強調，當人們能取得疫苗、乾淨的水和正確資訊時，許多感染是 _______ 的。", "opts": {"A": "inevitable", "B": "preventable", "C": "controversial", "D": "ordinary"}, "optsZh": {"A": "inevitable（不可避免的）", "B": "preventable（可預防的）", "C": "controversial（有爭議的）", "D": "ordinary（普通的；平凡的）"}, "answer": "B", "expl": "Preventable means able to be stopped.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "certain to happen and impossible to prevent", "zh": "不可避免的；必然的", "word": "inevitable"}, "B": {"pos": "adj.", "en": "able to be stopped before it happens", "zh": "可預防的", "word": "preventable"}, "C": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}, "D": {"pos": "adj.", "en": "normal; not special", "zh": "普通的；平常的", "word": "ordinary"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: preventable biodiversity loss", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Because seeds can be inspected before shipment, the accidental introduction of invasive weeds is often _______.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Because seeds can be inspected before shipment, the accidental introduction of invasive weeds is often _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。由於種子在運送前可以接受檢查，意外引入入侵性雜草的情況往往是 _______ 的。", "opts": {"A": "avertable", "B": "symbolic", "C": "common", "D": "undeniable"}, "optsZh": {"A": "avertable（可避免的、可防止的）", "B": "symbolic（象徵性的）", "C": "common（常見的；普通的）", "D": "undeniable（不可否認的）"}, "answer": "A", "expl": "Avertable means capable of being prevented.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to be prevented or turned away", "zh": "可避免的；可防止的", "word": "avertable"}, "B": {"pos": "adj.", "en": "serving as a symbol; representing something else", "zh": "象徵性的；象徵的", "word": "symbolic"}, "C": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}, "D": {"pos": "adj.", "en": "impossible to doubt or question", "zh": "不可否認的", "word": "undeniable"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: preventable biodiversity loss", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The accident was tragic but _______: a simple guardrail would have kept vehicles from entering the closed lane.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The accident was tragic but _______: a simple guardrail would have kept vehicles from entering the closed lane.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這起事故很悲慘，但卻是 _______ 的：一道簡單的護欄就能阻止車輛駛入封閉車道。", "opts": {"A": "temporary", "B": "foreseeable and avoidable", "C": "undeniable", "D": "common"}, "optsZh": {"A": "temporary（暫時的）", "B": "foreseeable and avoidable（可預見且可避免的）", "C": "undeniable（不可否認的）", "D": "common（常見的；普通的）"}, "answer": "B", "expl": "Foreseeable and avoidable means preventable.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "lasting for only a limited time", "zh": "暫時的；臨時的", "word": "temporary"}, "B": {"w": "foreseeable", "pos": "phr.", "en": "able to be expected in advance and therefore prevented", "zh": "可預見且可避免的", "word": "foreseeable"}, "C": {"pos": "adj.", "en": "impossible to doubt or question", "zh": "不可否認的", "word": "undeniable"}, "D": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: preventable biodiversity loss", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The museum argues that fading in the textiles is _______ if galleries control light levels and rotate fragile works.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The museum argues that fading in the textiles is _______ if galleries control light levels and rotate fragile works.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。博物館主張，只要展廳控制光線強度並輪換展出脆弱的作品，紡織品的褪色是 _______ 的。", "opts": {"A": "common", "B": "concerning", "C": "controllable", "D": "irreversible"}, "optsZh": {"A": "common（常見的；普通的）", "B": "concerning（令人擔憂的）", "C": "controllable（可控制的）", "D": "irreversible（不可逆的）"}, "answer": "C", "expl": "Controllable means able to be prevented or limited.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "happening often or found in many places", "zh": "常見的；普遍的", "word": "common"}, "B": {"pos": "adj.", "en": "causing worry", "zh": "令人擔憂的", "word": "concerning"}, "C": {"pos": "adj.", "en": "able to be managed or limited", "zh": "可控制的", "word": "controllable"}, "D": {"pos": "adj.", "en": "impossible to change back to a previous state", "zh": "不可逆的；無法挽回的", "word": "irreversible"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: inadequate mechanical recycling", "vocab": true, "body": "The process of mechanically recycling plastics is often considered ______ because of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> impact and the loss of material quality that often occurs. But chemist Takunda Chazovachii has helped develop a cleaner process of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> recycling that converts superabsorbent polymers from diapers into a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=desirable\" target=\"_blank\" rel=\"noopener\" data-w=\"desirable\" data-pos=\"adj.\" data-en=\"worth having or wanting\" data-zh=\"令人嚮往的；理想的\">desirable<\/a> reusable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adhesive\" target=\"_blank\" rel=\"noopener\" data-w=\"adhesive\" data-pos=\"n.\" data-en=\"a substance used to stick things together\" data-zh=\"黏著劑\">adhesive<\/a>.", "bodyPlain": "The process of mechanically recycling plastics is often considered ______ because of the environmental impact and the loss of material quality that often occurs. But chemist Takunda Chazovachii has helped develop a cleaner process of chemical recycling that converts superabsorbent polymers from diapers into a desirable reusable adhesive.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "以機械方式回收塑膠的流程常被認為是 ______ 的，因為它對環境有影響，而且經常造成材料品質下降。但化學家 Takunda Chazovachii 協助開發出一種更乾淨的化學回收製程，能把尿布中的高吸水性聚合物轉化為理想的可重複使用黏著劑。", "opts": {"A": "resilient", "B": "inadequate", "C": "dynamic", "D": "satisfactory"}, "optsZh": {"A": "resilient（有韌性的、能迅速恢復的）", "B": "inadequate（不充分的、不夠好的）", "C": "dynamic（充滿活力的、動態的）", "D": "satisfactory（令人滿意的）"}, "answer": "B", "expl": "Mechanical recycling harms the environment and lowers material quality, and the text then presents a 'cleaner' alternative, so mechanical recycling is considered inadequate.", "explZh": "機械回收會影響環境並降低材料品質，文中接著提出「更乾淨」的替代方法，因此機械回收被認為是不夠好的（inadequate）。", "defs": {"A": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "B": {"pos": "adj.", "en": "not good enough or not enough for a purpose", "zh": "不充分的；不夠好的", "word": "inadequate"}, "C": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}, "D": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: inadequate mechanical recycling", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The old purification method was judged _______ because it removed some contaminants but required large amounts of energy and left a chemical residue.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The old purification method was judged _______ because it removed some contaminants but required large amounts of energy and left a chemical residue.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。舊的淨水方法被評為 _______，因為它雖然去除了部分污染物，卻需要大量能源，而且會留下化學殘留物。", "opts": {"A": "dynamic", "B": "satisfactory", "C": "resilient", "D": "insufficient"}, "optsZh": {"A": "dynamic（充滿活力的、動態的）", "B": "satisfactory（令人滿意的）", "C": "resilient（有韌性的、能迅速恢復的）", "D": "insufficient（不足的）"}, "answer": "D", "expl": "Insufficient means inadequate.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}, "B": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}, "C": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "D": {"pos": "adj.", "en": "not enough for a particular purpose", "zh": "不足的；不夠的", "word": "insufficient"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: inadequate mechanical recycling", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translation<\/a> was _______; although readable, it omitted key legal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinction\" target=\"_blank\" rel=\"noopener\" data-w=\"distinction\" data-pos=\"n.\" data-en=\"a clear difference between things\" data-zh=\"區別；差異\">distinctions<\/a> needed by the researchers.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The first translation was _______; although readable, it omitted key legal distinctions needed by the researchers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。第一版譯文 _______；雖然讀得懂，卻遺漏了研究人員所需的關鍵法律區別。", "opts": {"A": "dynamic", "B": "desirable", "C": "inadequate", "D": "resilient"}, "optsZh": {"A": "dynamic（充滿活力的、動態的）", "B": "desirable（令人嚮往的、理想的）", "C": "inadequate（不充分的、不夠好的）", "D": "resilient（有韌性的、能迅速恢復的）"}, "answer": "C", "expl": "Inadequate means not good enough.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}, "B": {"pos": "adj.", "en": "worth having or wanting", "zh": "令人嚮往的；理想的", "word": "desirable"}, "C": {"pos": "adj.", "en": "not good enough or not enough for a purpose", "zh": "不充分的；不夠好的", "word": "inadequate"}, "D": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: inadequate mechanical recycling", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The drainage system proved _______ after heavy storms repeatedly overwhelmed the channels and flooded nearby streets.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The drainage system proved _______ after heavy storms repeatedly overwhelmed the channels and flooded nearby streets.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。在豪雨一再淹沒溝渠、使附近街道積水之後，這套排水系統被證明是 _______ 的。", "opts": {"A": "resilient", "B": "satisfactory", "C": "desirable", "D": "deficient"}, "optsZh": {"A": "resilient（有韌性的、能迅速恢復的）", "B": "satisfactory（令人滿意的）", "C": "desirable（令人嚮往的、理想的）", "D": "deficient（不足的、有缺陷的）"}, "answer": "D", "expl": "Deficient means inadequate.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "B": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}, "C": {"pos": "adj.", "en": "worth having or wanting", "zh": "令人嚮往的；理想的", "word": "desirable"}, "D": {"pos": "adj.", "en": "not having enough of something; not good enough", "zh": "不足的；有缺陷的", "word": "deficient"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: inadequate mechanical recycling", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The initial archive catalog was _______ for scholars because it listed titles but not authors, dates, or locations.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The initial archive catalog was _______ for scholars because it listed titles but not authors, dates, or locations.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。最初的檔案目錄對學者而言 _______，因為它只列出標題，沒有列出作者、日期或地點。", "opts": {"A": "incomplete", "B": "dynamic", "C": "resilient", "D": "satisfactory"}, "optsZh": {"A": "incomplete（不完整的）", "B": "dynamic（充滿活力的、動態的）", "C": "resilient（有韌性的、能迅速恢復的）", "D": "satisfactory（令人滿意的）"}, "answer": "A", "expl": "Incomplete captures inadequate.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "missing some parts; not finished", "zh": "不完整的；未完成的", "word": "incomplete"}, "B": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}, "C": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "D": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: inadequate mechanical recycling", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The trial design was _______: it included too few participants to support the broad conclusions the authors wished to draw.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The trial design was _______: it included too few participants to support the broad conclusions the authors wished to draw.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這項試驗設計 _______：參與者太少，不足以支持作者想提出的廣泛結論。", "opts": {"A": "resilient", "B": "flawed", "C": "satisfactory", "D": "dynamic"}, "optsZh": {"A": "resilient（有韌性的、能迅速恢復的）", "B": "flawed（有缺陷的）", "C": "satisfactory（令人滿意的）", "D": "dynamic（充滿活力的、動態的）"}, "answer": "B", "expl": "Flawed means inadequate in this context.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to recover quickly from difficulty or damage", "zh": "有韌性的；能迅速恢復的", "word": "resilient"}, "B": {"pos": "adj.", "en": "having a fault or weakness", "zh": "有缺陷的；有瑕疵的", "word": "flawed"}, "C": {"pos": "adj.", "en": "good enough for a particular need", "zh": "令人滿意的；符合要求的", "word": "satisfactory"}, "D": {"pos": "adj.", "en": "full of energy, activity, or change", "zh": "充滿活力的；動態的", "word": "dynamic"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: intricate web of relations", "vocab": true, "body": "In the Indigenous <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intercropping\" target=\"_blank\" rel=\"noopener\" data-w=\"intercropping\" data-pos=\"n.\" data-en=\"growing two or more crops together in the same field\" data-zh=\"間作；混作\">intercropping<\/a> system known as the Three Sisters, maize, squash, and beans form an _______ web of relations: maize provides the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> on which the bean vines grow; the squash vines cover the soil, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discourage\" target=\"_blank\" rel=\"noopener\" data-w=\"discourage\" data-pos=\"v.\" data-en=\"to make something less likely to happen\" data-zh=\"抑制；使不易發生\">discouraging<\/a> competition from weeds; and the beans aid their two “sisters” by enriching the soil with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essential<\/a> nitrogen.", "bodyPlain": "In the Indigenous intercropping system known as the Three Sisters, maize, squash, and beans form an _______ web of relations: maize provides the structure on which the bean vines grow; the squash vines cover the soil, discouraging competition from weeds; and the beans aid their two “sisters” by enriching the soil with essential nitrogen.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在名為「三姊妹」（Three Sisters）的原住民間作系統中，玉米、南瓜和豆類形成了一張 _______ 的關係網：玉米提供豆藤攀爬生長的支架；南瓜藤覆蓋土壤，抑制雜草的競爭；而豆類則以必需的氮肥沃土壤，幫助它的兩位「姊妹」。", "opts": {"A": "indecipherable", "B": "ornamental", "C": "obscure", "D": "intricate"}, "optsZh": {"A": "indecipherable（無法辨認的、難以解讀的）", "B": "ornamental（裝飾用的）", "C": "obscure（模糊的；鮮為人知的；使隱晦）", "D": "intricate（錯綜複雜的、精細的）"}, "answer": "D", "expl": "The colon introduces a detailed description of how each plant helps the others, showing a complex, intricate web of relations.", "explZh": "冒號後詳細說明每種植物如何互相幫助，呈現出一張錯綜複雜（intricate）的關係網。", "defs": {"A": {"pos": "adj.", "en": "impossible to read or understand", "zh": "無法辨認的；難以解讀的", "word": "indecipherable"}, "B": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}, "C": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "D": {"pos": "adj.", "en": "having many small parts connected in complex and detailed ways", "zh": "錯綜複雜的；精細的", "word": "intricate"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: intricate web of relations", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The wetland is an _______ system of channels, roots, fish, insects, and birds, each element shaping the conditions for the others.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The wetland is an _______ system of channels, roots, fish, insects, and birds, each element shaping the conditions for the others.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這片濕地是一個由水道、根系、魚類、昆蟲和鳥類組成的 _______ 系統，每個元素都影響著其他元素的生存條件。", "opts": {"A": "ornamental", "B": "interdependent", "C": "obscure", "D": "indecipherable"}, "optsZh": {"A": "ornamental（裝飾用的）", "B": "interdependent（相互依存的）", "C": "obscure（模糊的；鮮為人知的；使隱晦）", "D": "indecipherable（無法辨認的、難以解讀的）"}, "answer": "B", "expl": "Interdependent fits a complex web of relations.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}, "B": {"pos": "adj.", "en": "depending on each other", "zh": "相互依存的", "word": "interdependent"}, "C": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "D": {"pos": "adj.", "en": "impossible to read or understand", "zh": "無法辨認的；難以解讀的", "word": "indecipherable"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: intricate web of relations", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The treaty created an _______ network of obligations among ports, insurers, and shipping <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">companies<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The treaty created an _______ network of obligations among ports, insurers, and shipping companies.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這項條約在港口、保險公司與航運公司之間建立了一個 _______ 的義務網絡。", "opts": {"A": "ornamental", "B": "indecipherable", "C": "intricate", "D": "obscure"}, "optsZh": {"A": "ornamental（裝飾用的）", "B": "indecipherable（無法辨認的、難以解讀的）", "C": "intricate（錯綜複雜的、精細的）", "D": "obscure（模糊的；鮮為人知的；使隱晦）"}, "answer": "C", "expl": "Intricate means complex and detailed.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}, "B": {"pos": "adj.", "en": "impossible to read or understand", "zh": "無法辨認的；難以解讀的", "word": "indecipherable"}, "C": {"pos": "adj.", "en": "having many small parts connected in complex and detailed ways", "zh": "錯綜複雜的；精細的", "word": "intricate"}, "D": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: intricate web of relations", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through
