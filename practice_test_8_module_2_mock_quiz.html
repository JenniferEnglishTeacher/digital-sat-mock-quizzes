  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: attractive to viewers", "original": "Art scholars have noted that some colors seem to be\nmore _______ viewers than others. For example,\npeople tend to find paintings featuring blues and\ngreens more appealing than paintings featuring\nyellows and oranges.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) confusing for\nB) attractive to\nC) corrected by\nD) similar to", "generated": [{"id": "1.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Curators have observed that paintings with deep ultramarine backgrounds are often more _______ museum visitors than otherwise similar works dominated by harsh yellows.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) confusing for\nB) appealing to\nC) corrected by\nD) similar to", "answer": "B", "explanation": "Appealing to means attractive to."}, {"id": "1.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The fabric samples dyed with indigo proved especially _______ buyers, who lingered over them longer than over the orange and brown samples.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) copied by\nB) distant from\nC) resistant to\nD) attractive to", "answer": "D", "explanation": "Attractive to means pleasing or appealing."}, {"id": "1.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Designers found that the softer interface colors were more _______ users, who rated the blue-gray version as calmer and easier to read.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) corrected by\nB) obscure to\nC) inviting to\nD) similar to", "answer": "C", "explanation": "Inviting to means attractive to."}, {"id": "1.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The landscape photographs printed in cool green tones were _______ viewers, drawing longer attention than the warmer-toned versions.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) pleasing to\nB) similar to\nC) confusing for\nD) corrected by", "answer": "A", "explanation": "Pleasing to means attractive to."}, {"id": "1.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The restaurant's quiet lighting and pale wood interior made the space more _______ customers seeking a relaxed meal.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) hidden from\nB) similar to\nC) inaccurate for\nD) enticing to", "answer": "D", "explanation": "Enticing to means attractive to."}]}, {"n": 2, "concept": "Words in Context: preventable biodiversity loss", "original": "Researchers and conservationists stress that\nbiodiversity loss due to invasive species is _______.\nFor example, people can take simple steps such as\nwashing their footwear after travel to avoid\nintroducing potentially invasive organisms into new\nenvironments.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) preventable\nB) undeniable\nC) common\nD) concerning", "generated": [{"id": "2.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The spread of the pest is not inevitable; because travelers can clean equipment before entering forests, such ecological damage is partly _______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) undeniable\nB) concerning\nC) common\nD) avoidable", "answer": "D", "explanation": "Avoidable means preventable."}, {"id": "2.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Public-health officials stress that many infections are _______ when people have access to vaccines, clean water, and accurate information.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) inevitable\nB) preventable\nC) controversial\nD) ordinary", "answer": "B", "explanation": "Preventable means able to be stopped."}, {"id": "2.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Because seeds can be inspected before shipment, the accidental introduction of invasive weeds is often _______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) avertable\nB) symbolic\nC) common\nD) undeniable", "answer": "A", "explanation": "Avertable means capable of being prevented."}, {"id": "2.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The accident was tragic but _______: a simple guardrail would have kept vehicles from entering the closed lane.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) temporary\nB) foreseeable and avoidable\nC) undeniable\nD) common", "answer": "B", "explanation": "Foreseeable and avoidable means preventable."}, {"id": "2.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The museum argues that fading in the textiles is _______ if galleries control light levels and rotate fragile works.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) common\nB) concerning\nC) controllable\nD) irreversible", "answer": "C", "explanation": "Controllable means able to be prevented or limited."}]}, {"n": 3, "concept": "Words in Context: inadequate mechanical recycling", "original": "The process of mechanically recycling plastics\nis often considered ______ because of the\nenvironmental impact and the loss of material\nquality that often occurs. But chemist Takunda\nChazovachii has helped develop a cleaner process of\nchemical recycling that converts superabsorbent\npolymers from diapers into a desirable reusable\nadhesive.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) resilient\nB) inadequate\nC) dynamic\nD) satisfactory", "generated": [{"id": "3.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The old purification method was judged _______ because it removed some contaminants but required large amounts of energy and left a chemical residue.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) dynamic\nB) satisfactory\nC) resilient\nD) insufficient", "answer": "D", "explanation": "Insufficient means inadequate."}, {"id": "3.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The first translation was _______; although readable, it omitted key legal distinctions needed by the researchers.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) dynamic\nB) desirable\nC) inadequate\nD) resilient", "answer": "C", "explanation": "Inadequate means not good enough."}, {"id": "3.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The drainage system proved _______ after heavy storms repeatedly overwhelmed the channels and flooded nearby streets.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) resilient\nB) satisfactory\nC) desirable\nD) deficient", "answer": "D", "explanation": "Deficient means inadequate."}, {"id": "3.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The initial archive catalog was _______ for scholars because it listed titles but not authors, dates, or locations.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) incomplete\nB) dynamic\nC) resilient\nD) satisfactory", "answer": "A", "explanation": "Incomplete captures inadequate."}, {"id": "3.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The trial design was _______: it included too few participants to support the broad conclusions the authors wished to draw.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) resilient\nB) flawed\nC) satisfactory\nD) dynamic", "answer": "B", "explanation": "Flawed means inadequate in this context."}]}, {"n": 4, "concept": "Words in Context: intricate web of relations", "original": "In the Indigenous intercropping system known as the\nThree Sisters, maize, squash, and beans form an\n_______ web of relations: maize provides the\nstructure on which the bean vines grow; the squash\nvines cover the soil, discouraging competition from\nweeds; and the beans aid their two “sisters” by\nenriching the soil with essential nitrogen.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) indecipherable\nB) ornamental\nC) obscure\nD) intricate", "generated": [{"id": "4.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The wetland is an _______ system of channels, roots, fish, insects, and birds, each element shaping the conditions for the others.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) ornamental\nB) interdependent\nC) obscure\nD) indecipherable", "answer": "B", "explanation": "Interdependent fits a complex web of relations."}, {"id": "4.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The treaty created an _______ network of obligations among ports, insurers, and shipping companies.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) ornamental\nB) indecipherable\nC) intricate\nD) obscure", "answer": "C", "explanation": "Intricate means complex and detailed."}, {"id": "4.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The novel's plot is _______: three family histories, two political crises, and several hidden letters gradually connect.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) complex\nB) obscure\nC) indecipherable\nD) ornamental", "answer": "A", "explanation": "Complex means intricate."}, {"id": "4.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The craft tradition depends on an _______ sequence of dyeing, drying, folding, and stitching that apprentices study for years.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) obscure\nB) elaborate\nC) ornamental\nD) indecipherable", "answer": "B", "explanation": "Elaborate means intricate."}, {"id": "4.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The coral reef supports a(n) _______ set of relationships among algae, fish, invertebrates, and ocean currents.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) obscure\nB) illegible\nC) ornamental\nD) intricate", "answer": "D", "explanation": "Intricate means made of many connected parts."}]}, {"n": 5, "concept": "Words in Context: latent versus active function", "original": "Within baleen whale species, some individuals\ndevelop an accessory spleen—a seemingly\nfunctionless formation of splenetic tissue outside\nthe normal spleen. Given the formation’s greater\nprevalence among whales known to make deeper\ndives, some researchers hypothesize that its role isn’t\n______; rather, the accessory spleen may actively\nsupport diving mechanisms.\nWhich choice completes the text with the most\nlogical and precise word or phrase?\nA) replicable\nB) predetermined\nC) operative\nD) latent", "generated": [{"id": "5.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Researchers once assumed the structure was _______ because no immediate purpose was visible, but new imaging suggests it helps regulate pressure.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) dormant\nB) replicable\nC) operative\nD) predetermined", "answer": "A", "explanation": "Dormant means inactive or latent."}, {"id": "5.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The enzyme was thought to be _______ under normal conditions; later experiments showed that it quietly initiates a repair process.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) predetermined\nB) replicable\nC) latent\nD) operative", "answer": "C", "explanation": "Latent means present but not active or apparent."}, {"id": "5.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The behavior looked _______ until field observations showed that it helped the animals conserve heat during cold nights.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) predetermined\nB) inactive\nC) operative\nD) replicable", "answer": "B", "explanation": "Inactive captures latent/functionless."}, {"id": "5.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The extra bone was long dismissed as _______; new evidence indicates that it anchors a small but important muscle.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) replicable\nB) predetermined\nC) vestigial\nD) operative", "answer": "C", "explanation": "Vestigial means a leftover with little function."}, {"id": "5.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The pigment appeared _______ in adult insects, but chemical tests revealed that it helps block ultraviolet light.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) predetermined\nB) replicable\nC) operative\nD) functionless", "answer": "D", "explanation": "Functionless matches the supposed latent role."}]}, {"n": 6, "concept": "Main Purpose: invention of reCAPTCHA", "original": "In 2007, computer scientist Luis von Ahn was\nworking on converting printed books into a digital\nformat. He found that some words were distorted\nenough that digital scanners couldn’t recognize\nthem, but most humans could easily read them.\nBased on that finding, von Ahn invented a simple\nsecurity test to keep automated “bots” out of\nwebsites. The first version of the reCAPTCHA test\nasked users to type one known word and one of the\nmany words scanners couldn’t recognize. Correct\nanswers proved the users were humans and added\ndata to the book-digitizing project.\nWhich choice best states the main purpose of the\ntext?\nA) To discuss von Ahn’s invention of reCAPTCHA\nB) To explain how digital scanners work\nC) To call attention to von Ahn’s book-digitizing\nproject\nD) To indicate how popular reCAPTCHA is", "generated": [{"id": "6.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To summarize a conflict between two relatives\nB) To explain why music has lost its importance\nC) To argue that the characters should leave the house\nD) To portray a setting and mood as characters prepare for an arrival", "answer": "D", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "6.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To present an atmosphere of departure and possibility\nB) To compare several forms of transportation\nC) To criticize sailors for taking unnecessary risks\nD) To list the technical features of a harbor", "answer": "A", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "6.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To contrast rural and urban customs\nB) To describe a completed celebration from beginning to end\nC) To depict preparations that reveal anticipation within a family\nD) To explain why the family dislikes visitors", "answer": "C", "explanation": "The details focus on preparation and anticipation."}, {"id": "6.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To describe the moments before a significant daily activity begins\nB) To evaluate the quality of a school's curriculum\nC) To argue that early classes should be canceled\nD) To recount a student's entire academic career", "answer": "A", "explanation": "The purpose is to depict a scene before an event."}, {"id": "6.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To compare two different seasons\nB) To establish a reflective mood before a character acts\nC) To reveal the full contents of a letter\nD) To give instructions for maintaining a garden", "answer": "B", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 7, "concept": "Poetry Structure: extended personification of night", "original": "The following text is adapted from Gwendolyn\nBennett’s 1926 poem “Street Lamps in Early Spring.”\nNight wears a garment\nAll velvet soft, all violet blue...\nAnd over her face she draws a veil\nAs shimmering fine as floating dew...\nAnd here and there\nIn the black of her hair\nThe subtle hands of Night\nMove slowly with their gem-starred light.\nWhich choice best describes the overall structure of\nthe text?\nA) It presents alternating descriptions of night in a\nrural area and in a city.\nB) It sketches an image of nightfall, then an image\nof sunrise.\nC) It makes an extended comparison of night to a\nhuman being.\nD) It portrays how night changes from one season\nof the year to the next.", "generated": [{"id": "7.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the overall structure of the text?\n\nA) It states the study's final conclusion.\nB) It identifies the uncertainty that motivated the study.\nC) It describes how other researchers criticized the work.\nD) It offers evidence that radar is always reliable.", "answer": "B", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "7.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the overall structure of the text?\n\nA) It shifts the discussion away from archaeology.\nB) It summarizes the team's strongest result.\nC) It defines the problem the later investigation attempts to address.\nD) It contradicts the claim made in the first sentence.", "answer": "C", "explanation": "The sentence frames the central research question."}, {"id": "7.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the overall structure of the text?\n\nA) It proves that drought has no effect on plants.\nB) It lists the materials used in the experiment.\nC) It introduces a gap in knowledge that the experiment examines.\nD) It gives a historical overview of plant classification.", "answer": "C", "explanation": "The sentence identifies an unresolved issue."}, {"id": "7.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the overall structure of the text?\n\nA) It introduces an unrelated theme.\nB) It provides biographical information about the novelist.\nC) It summarizes the novel's publication history.\nD) It raises a difficulty with a common interpretation.", "answer": "D", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "7.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the overall structure of the text?\n\nA) It explains the limitation that the new system is meant to address.\nB) It announces that the technology is already flawless.\nC) It gives a personal anecdote about engineers.\nD) It compares underwater vehicles with aircraft.", "answer": "A", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 8, "concept": "Main Purpose: Tom's assurance about private play", "original": "The following text is adapted from Jane Austen’s\n1814 novel Mansfield Park. The speaker, Tom, is\nconsidering staging a play at home with a group of\nhis friends and family.\nWe mean nothing but a little amusement\namong ourselves, just to vary the scene, and\nexercise our powers in something new. We want\nno audience, no publicity. We may be trusted, I\nthink, in choosing some play most perfectly\nunexceptionable; and I can conceive no greater\nharm or danger to any of us in conversing in the\nelegant written language of some respectable\nauthor than in chattering in words of our own.\nWhich choice best states the main purpose of the\ntext?\nA) To offer Tom’s assurance that the play will be\ninoffensive and involve only a small number of\npeople\nB) To clarify that the play will not be performed in\nthe manner Tom had originally intended\nC) To elaborate on the idea that the people around\nTom lack the skills to successfully stage a play\nD) To assert that Tom believes the group\nperforming the play will be able to successfully\npromote it", "generated": [{"id": "8.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To portray a setting and mood as characters prepare for an arrival\nB) To explain why music has lost its importance\nC) To argue that the characters should leave the house\nD) To summarize a conflict between two relatives", "answer": "A", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "8.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To list the technical features of a harbor\nB) To criticize sailors for taking unnecessary risks\nC) To compare several forms of transportation\nD) To present an atmosphere of departure and possibility", "answer": "D", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "8.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To explain why the family dislikes visitors\nB) To describe a completed celebration from beginning to end\nC) To contrast rural and urban customs\nD) To depict preparations that reveal anticipation within a family", "answer": "D", "explanation": "The details focus on preparation and anticipation."}, {"id": "8.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To evaluate the quality of a school's curriculum\nB) To recount a student's entire academic career\nC) To describe the moments before a significant daily activity begins\nD) To argue that early classes should be canceled", "answer": "C", "explanation": "The purpose is to depict a scene before an event."}, {"id": "8.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To give instructions for maintaining a garden\nB) To establish a reflective mood before a character acts\nC) To compare two different seasons\nD) To reveal the full contents of a letter", "answer": "B", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 9, "concept": "Paired Text: competition misconception", "original": "Text 1\nEcologists have long wondered how thousands of\nmicroscopic phytoplankton species can live together\nnear ocean surfaces competing for the same\nresources. According to conventional wisdom, one\nspecies should emerge after outcompeting the rest.\nSo why do so many species remain? Ecologists’ many\nefforts to explain this phenomenon still haven’t\nuncovered a satisfactory explanation.\nText 2\nEcologist Michael Behrenfeld and colleagues have\nconnected phytoplankton’s diversity to their\nmicroscopic size. Because these organisms are so\ntiny, they are spaced relatively far apart from each\nother in ocean water and, moreover, experience that\nwater as a relatively dense substance. This in turn\nmakes it hard for them to move around and interact\nwith one another. Therefore, says Behrenfeld’s team,\ndirect competition among phytoplankton probably\nhappens much less than previously thought.\nBased on the texts, how would Behrenfeld and\ncolleagues (Text 2) most likely respond to the\n“conventional wisdom” discussed in Text 1?\nA) By arguing that it is based on a misconception\nabout phytoplankton species competing with\none another\nB) By asserting that it fails to recognize that routine\nreplenishment of ocean nutrients prevents\ncompetition between phytoplankton species\nC) By suggesting that their own findings help clarify\nhow phytoplankton species are able to compete\nwith larger organisms\nD) By recommending that more ecologists focus\ntheir research on how competition among\nphytoplankton species is increased with water\ndensity", "generated": [{"id": "9.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nBased on the texts, which choice best describes how the author of Text 2 would respond to the view in Text 1?\n\nA) It states the study's final conclusion.\nB) It describes how other researchers criticized the work.\nC) It offers evidence that radar is always reliable.\nD) It identifies the uncertainty that motivated the study.", "answer": "D", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "9.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nBased on the texts, which choice best describes how the author of Text 2 would respond to the view in Text 1?\n\nA) It shifts the discussion away from archaeology.\nB) It contradicts the claim made in the first sentence.\nC) It defines the problem the later investigation attempts to address.\nD) It summarizes the team's strongest result.", "answer": "C", "explanation": "The sentence frames the central research question."}, {"id": "9.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nBased on the texts, which choice best describes how the author of Text 2 would respond to the view in Text 1?\n\nA) It lists the materials used in the experiment.\nB) It proves that drought has no effect on plants.\nC) It introduces a gap in knowledge that the experiment examines.\nD) It gives a historical overview of plant classification.", "answer": "C", "explanation": "The sentence identifies an unresolved issue."}, {"id": "9.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nBased on the texts, which choice best describes how the author of Text 2 would respond to the view in Text 1?\n\nA) It raises a difficulty with a common interpretation.\nB) It provides biographical information about the novelist.\nC) It summarizes the novel's publication history.\nD) It introduces an unrelated theme.", "answer": "A", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "9.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nBased on the texts, which choice best describes how the author of Text 2 would respond to the view in Text 1?\n\nA) It compares underwater vehicles with aircraft.\nB) It explains the limitation that the new system is meant to address.\nC) It gives a personal anecdote about engineers.\nD) It announces that the technology is already flawless.", "answer": "B", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 10, "concept": "Reading Detail: car games", "original": "The following text is adapted from Sylvia Acevedo’s\n2018 memoir Path to the Stars: My Journey from Girl\nScout to Rocket Scientist. The narrator is traveling by\ncar with her family to Mexico City. Mario and Laura\nare her brother and sister.\nMario and I played games to see how many\ndifferent license plates we could spot, and Laura\nliked to look for children in the back seats of the\ncars we passed. We were used to the forty-five-\nminute drive to El Paso and familiar with the\nsix-hour ride to Chihuahua, but I wondered\nwhat the long journey to Mexico City would be\nlike.\n©2018 by Sylvia Acevedo\nAccording to the text, what did the narrator and\nMario do while riding in the car?\nA) They read books.\nB) They sang songs.\nC) They went to sleep.\nD) They played games.", "generated": [{"id": "10.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice is best supported by the text?\n\nA) She shows unusual maturity and self-command.\nB) She is admired mainly for her wealth.\nC) She lacks affection for her family.\nD) She refuses to give advice to others.", "answer": "A", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "10.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice is best supported by the text?\n\nA) The narrator thinks patience is useless.\nB) The grandmother avoids family matters entirely.\nC) The family ignores the grandmother's opinions.\nD) The grandmother's influence is quiet but substantial.", "answer": "D", "explanation": "The family respects her careful judgment."}, {"id": "10.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice is best supported by the text?\n\nA) The coworkers are more accurate than the clerk.\nB) The clerk intentionally creates errors.\nC) The business fails because of excessive caution.\nD) The clerk's carefulness is valuable despite being inconvenient.", "answer": "D", "explanation": "The passage praises his precision."}, {"id": "10.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice is best supported by the text?\n\nA) The leader makes decisions without hearing others.\nB) The leader is unable to reach conclusions.\nC) The leader values inclusive deliberation.\nD) The leader dislikes public meetings.", "answer": "C", "explanation": "The evidence shows patience and inclusion."}, {"id": "10.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice is best supported by the text?\n\nA) She rejects all imaginative thinking.\nB) She combines intellectual openness with rigorous standards.\nC) She avoids working with students.\nD) She publishes claims before testing them.", "answer": "B", "explanation": "The contrast shows openness and rigor."}]}, {"n": 11, "concept": "Reading Detail: Wagner's volume", "original": "In the 1700s and 1800s, European composers\nexperimented with volume in their musical works.\nThey did so by increasing the number of musicians\nplaying in the orchestra. For example, in some of his\noperas, German composer Richard Wagner added\nmore horns, trombones, and tubas to the orchestra.\nWith more instruments playing at the same time, the\norchestra could play extremely loudly at key\nmoments in his operas.\nAccording to the text, how did Richard Wagner\nachieve moments of extremely high volume in his\noperas?\nA) By moving the performances of his operas from\noutdoor stages to indoor ones\nB) By increasing the number of musicians playing\nhorns, trombones, and tubas in the orchestra\nC) By building a concert hall whose shape would\ncause sounds to echo\nD) By insisting that the singers undergo special\ntraining to sing for extended periods of time", "generated": [{"id": "11.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice is best supported by the text?\n\nA) She refuses to give advice to others.\nB) She is admired mainly for her wealth.\nC) She shows unusual maturity and self-command.\nD) She lacks affection for her family.", "answer": "C", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "11.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice is best supported by the text?\n\nA) The grandmother's influence is quiet but substantial.\nB) The grandmother avoids family matters entirely.\nC) The family ignores the grandmother's opinions.\nD) The narrator thinks patience is useless.", "answer": "A", "explanation": "The family respects her careful judgment."}, {"id": "11.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice is best supported by the text?\n\nA) The clerk intentionally creates errors.\nB) The clerk's carefulness is valuable despite being inconvenient.\nC) The business fails because of excessive caution.\nD) The coworkers are more accurate than the clerk.", "answer": "B", "explanation": "The passage praises his precision."}, {"id": "11.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice is best supported by the text?\n\nA) The leader makes decisions without hearing others.\nB) The leader values inclusive deliberation.\nC) The leader is unable to reach conclusions.\nD) The leader dislikes public meetings.", "answer": "B", "explanation": "The evidence shows patience and inclusion."}, {"id": "11.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice is best supported by the text?\n\nA) She rejects all imaginative thinking.\nB) She publishes claims before testing them.\nC) She avoids working with students.\nD) She combines intellectual openness with rigorous standards.", "answer": "D", "explanation": "The contrast shows openness and rigor."}]}, {"n": 12, "concept": "Inference: difrasismo understood by cultural context", "original": "Poetry in Classical Nahuatl, the language of the Aztec\nEmpire, relies on difrasismo, or a parallel noun\nconstruction that conventionally operates as a single\nmetaphor. For example, the common difrasismo in\ncuauhtli in ocelotl (literally, “the eagle, the jaguar”)\nsignifies “warrior.” The device’s function is both\nformal—providing structure to lines of verse—and\nritual: semantic relations among the two nouns and\nthe concept they signify can be tenuous, as in the\nprevious example, such that difrasismos are often\nonly intelligible according to the conceptual\nassociations observed in Aztec ceremonial culture.\nWhich statement about the difrasismo in cuauhtli in\nocelotl is most strongly supported by the text?\nA) Its metaphorical significance derives from the\nsemantic equivalence of the two nouns\nconstituting the difrasismo.\nB) Its unintelligibility may cause its formal function\nwithin a line of verse to go unnoticed by\npresent-day readers.\nC) Its apparent obscurity can be resolved when\nconsidered in the proper cultural context.\nD) Its frequency in Classical Nahuatl poetry\nconfirms its intelligibility to the Aztec audience.", "generated": [{"id": "12.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice is best supported by the text?\n\nA) She lacks affection for her family.\nB) She refuses to give advice to others.\nC) She shows unusual maturity and self-command.\nD) She is admired mainly for her wealth.", "answer": "C", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "12.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice is best supported by the text?\n\nA) The family ignores the grandmother's opinions.\nB) The grandmother's influence is quiet but substantial.\nC) The narrator thinks patience is useless.\nD) The grandmother avoids family matters entirely.", "answer": "B", "explanation": "The family respects her careful judgment."}, {"id": "12.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice is best supported by the text?\n\nA) The business fails because of excessive caution.\nB) The coworkers are more accurate than the clerk.\nC) The clerk intentionally creates errors.\nD) The clerk's carefulness is valuable despite being inconvenient.", "answer": "D", "explanation": "The passage praises his precision."}, {"id": "12.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice is best supported by the text?\n\nA) The leader values inclusive deliberation.\nB) The leader is unable to reach conclusions.\nC) The leader makes decisions without hearing others.\nD) The leader dislikes public meetings.", "answer": "A", "explanation": "The evidence shows patience and inclusion."}, {"id": "12.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice is best supported by the text?\n\nA) She combines intellectual openness with rigorous standards.\nB) She rejects all imaginative thinking.\nC) She avoids working with students.\nD) She publishes claims before testing them.", "answer": "A", "explanation": "The contrast shows openness and rigor."}]}, {"n": 13, "concept": "Main Idea: invisible hand promoted later", "original": "Eighteenth-century economist Adam Smith is famed\nfor his metaphor of the invisible hand, which he\nputatively used to illustrate a robust model of how\nindividuals produce aggregate benefits by pursuing\ntheir own economic interests. Note “putatively”: as\nGavin Kennedy has shown, Smith deploys this\nmetaphor only once in his economic writings—to\nmake a narrow point about the then-dominant\neconomic theory of mercantilism—and it was largely\nignored until some twentieth-century economists\neager to secure an intellectual pedigree for their views\nelevated it to a fully-fledged paradigm.\nWhich choice best states the main idea of the text?\nA) Although Smith is famed for his metaphor of the\ninvisible hand, the metaphor was largely ignored\nuntil economists in the twentieth century came\nto realize that the metaphor was a robust model\nthat anticipated their own views.\nB) Some twentieth-century economists gave Smith’s\nmetaphor of the invisible hand a significance it\ndoes not have in Smith’s work, but it is\nnevertheless a useful model of how individuals\nproduce aggregate benefits by pursuing their\nown economic interests.\nC) Smith’s metaphor of the invisible hand has been\ninterpreted as a model of how individuals acting\nin their own interest produce aggregate benefits,\nbut it was intended as a subtle critique of the\neconomic theory of mercantilism.\nD) The reputation of Smith’s metaphor of the\ninvisible hand is not due to the importance of the\nmetaphor in Smith’s work but rather to the\npromotion of the metaphor by some later\neconomists for their own ends.", "generated": [{"id": "13.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To portray a setting and mood as characters prepare for an arrival\nB) To explain why music has lost its importance\nC) To argue that the characters should leave the house\nD) To summarize a conflict between two relatives", "answer": "A", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "13.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To compare several forms of transportation\nB) To list the technical features of a harbor\nC) To present an atmosphere of departure and possibility\nD) To criticize sailors for taking unnecessary risks", "answer": "C", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "13.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To contrast rural and urban customs\nB) To describe a completed celebration from beginning to end\nC) To explain why the family dislikes visitors\nD) To depict preparations that reveal anticipation within a family", "answer": "D", "explanation": "The details focus on preparation and anticipation."}, {"id": "13.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To evaluate the quality of a school's curriculum\nB) To describe the moments before a significant daily activity begins\nC) To recount a student's entire academic career\nD) To argue that early classes should be canceled", "answer": "B", "explanation": "The purpose is to depict a scene before an event."}, {"id": "13.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main purpose or main idea of the text?\n\nA) To establish a reflective mood before a character acts\nB) To reveal the full contents of a letter\nC) To give instructions for maintaining a garden\nD) To compare two different seasons", "answer": "A", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 14, "concept": "Quantitative Evidence: similar information despite slower speech", "original": "Approximate Rates of Speech and\nInformation Conveyed for Five Languages\nRate of speech Rate of information\n(syllables conveyed (bits\nLanguage per second) per second)\nSerbian 7.2 39.1\nSpanish 7.7 42.0\nVietnamese 5.3 42.5\nThai 4.7 33.8\nHungarian 5.9 34.6\nA group of researchers working in Europe, Asia, and\nOceania conducted a study to determine how quickly\ndifferent Eurasian languages are typically spoken\n(in syllables per second) and how much information\nthey can effectively convey (in bits per second). They\nfound that, although languages vary widely in the\nspeed at which they are spoken, the amount of\ninformation languages can effectively convey tends\nThus, they claim that two\nlanguages with very different spoken rates can\nnonetheless convey the same amount of information\nin a given amount of time.\nWhich choice best describes data from the table that\nsupport the researchers’ claim?\nA) Among the five languages in the table, Thai and\nHungarian have the lowest rates of speech and\nthe lowest rates of information conveyed.\nB) Vietnamese conveys information at\napproximately the same rate as Spanish despite\nbeing spoken at a slower rate.\nC) Among the five languages in the table, the\nlanguage that is spoken the fastest is also the\nlanguage that conveys information the fastest.\nD) Serbian and Spanish are spoken at approximately\nthe same rate, but Serbian conveys information\nfaster than Spanish does.", "generated": [{"id": "14.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The administration faced economic challenges from the beginning.'", "answer": "B", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "14.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The southern region was included in the survey.\nB) Some farmers grew vegetables, while others grew grain.\nC) The graph contains information about three regions.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "14.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) The method used to study stars requires a telescope.\nC) One rocky planet has a thin atmosphere.\nD) Some stars contain hydrogen and helium.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "14.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Many performers learned song
