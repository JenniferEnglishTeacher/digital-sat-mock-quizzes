s from relatives.\nB) The tradition is studied by scholars in several countries.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) Some songs use a meter also found in older European poetry.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "14.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The table includes more than one year.\nB) The program took place in a community.\nC) Both towns had some volunteers.\nD) The program was associated with a clear increase in trained volunteers compared with the town without the program.", "answer": "D", "explanation": "The comparison supports the program's effect."}]}, {"n": 15, "concept": "Quantitative Evidence: methodology affects bite-force estimates", "original": "Estimates of Tyrannosaurid Bite Force\nA\nStudy Year Estimation method\nCost et al. 2019 muscular and skeletal modeling\nGignac and Erickson 2017 tooth-bone interaction analysis\nMeers 2002 body-mass scaling\nBates and Falkingham 2012 muscular and skeletal modeling\nThe largest tyrannosaurids—the family of carnivorous dinos\nthat includes Tarbosaurus, Albertosaurus, and, most famousl\nTyrannosaurus rex—are thought to have had the strongest bi\nland animals in Earth’s history. Determining the bite force o\nanimals can be difficult, however, and paleontologists Paul B\nEmily Rayfield have suggested that an estimate of dinosaur b\nmay be significantly influenced by the methodology used in g\nthat estimate.\nWhich choice best describes data from the table that support\nand Rayfield’s suggestion?\nA) The study by Meers used body-mass scaling and produc\nlowest estimated maximum bite force, while the study by\nused muscular and skeletal modeling and produced the h\nestimated maximum.\nB) In their study, Gignac and Erickson used tooth-bone int\nanalysis to produce an estimated bite force range with a\nof 8,000 newtons and a maximum of 34,000 newtons.\nC) The bite force estimates produced by Bates and Falkingh\nCost et al. were similar to each other, while the estimates\nby Meers and by Gignac and Erickson each differed subs\nfrom any other estimate.\nD) The estimated maximum bite force produced by Cost et\nexceeded the estimated maximum produced by Bates an\nFalkingham, even though both groups of researchers use\nsame method to generate their estimates.", "generated": [{"id": "15.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven recor gram began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Both towns had some volunteers.\nB) The table includes more than one year.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) The program took place in a community.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 16, "concept": "Command of Evidence: awe increases altruism", "original": "Psychologists Dacher Keltner and Jonathan Haidt\nhave argued that experiencing awe—a sensation of\nreverence and wonder typically brought on by\nperceiving something grand or powerful—can enable\nus to feel more connected to others and thereby\ninspire us to act more altruistically. Keltner, along\nwith Paul K. Piff, Pia Dietze, and colleagues, claims\nto have found evidence for this effect in a recent\nstudy where participants were asked to either gaze up\nat exceptionally tall trees in a nearby grove (reported\nto be a universally awe-inspiring experience) or stare\nat the exterior of a nearby, nondescript building.\nAfter one minute, an experimenter deliberately\nspilled a box of pens nearby.\nWhich finding from the researchers’ study, if true,\nwould most strongly support their claim?\nA) Participants who had been looking at the trees\nhelped the experimenter pick up significantly\nmore pens than did participants who had been\nlooking at the building.\nB) Participants who helped the experimenter pick\nup the pens used a greater number of positive\nwords to describe the trees and the building in a\npostexperiment survey than did participants who\ndid not help the experimenter.\nC) Participants who did not help the experimenter\npick up the pens were significantly more likely to\nreport having experienced a feeling of awe,\nregardless of whether they looked at the building\nor the trees.\nD) Participants who had been looking at the\nbuilding were significantly more likely to notice\nthat the experimenter had dropped the pens than\nwere participants who had been looking at the\ntrees.", "generated": [{"id": "16.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "16.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) The southern region was included in the survey.\nB) The graph contains information about three regions.\nC) Some farmers grew vegetables, while others grew grain.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "16.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) One rocky planet has a thin atmosphere.\nB) Some stars contain hydrogen and helium.\nC) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nD) The method used to study stars requires a telescope.", "answer": "C", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "16.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Many performers learned songs from relatives.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) The tradition is studied by scholars in several countries.\nD) Some songs use a meter also found in older European poetry.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "16.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, quotation, or study?\n\nA) Both towns had some volunteers.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The table includes more than one year.\nD) The program took place in a community.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 17, "concept": "Logical Completion: sweet potato introduced without humans", "original": "The domestic sweet potato (Ipomoea batatas)\ndescends from a wild plant native to South America.\nIt also populates the Polynesian Islands, where\nevidence confirms that Native Hawaiians and other\nIndigenous peoples were cultivating the plant\ncenturies before seafaring first occurred over the\nthousands of miles of ocean separating them from\nSouth America. To explain how the sweet potato\nwas first introduced in Polynesia, botanist Pablo\nMuñoz-Rodríguez and colleagues analyzed the DNA\nof numerous varieties of the plant, concluding that\nPolynesian varieties diverged from South American\nones over 100,000 years ago. Given that Polynesia\nwas peopled only in the last three thousand years, the\nteam concluded that ______\nWhich choice most logically completes the text?\nA) the cultivation of the sweet potato in Polynesia\nlikely predates its cultivation in South America.\nB) Polynesian peoples likely acquired the sweet\npotato from South American peoples only within\nthe last three thousand years.\nC) human activity likely played no role in the\nintroduction of the sweet potato in Polynesia.\nD) Polynesian sweet potato varieties likely descend\nfrom a single South American variety that was\ndomesticated, not wild.", "generated": [{"id": "17.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the plant probably reached the islands without human assistance.\nB) human traders must have transported the seeds recently.\nC) the island populations were domesticated before mainland populations.\nD) all island plants descended from a single cultivated variety.", "answer": "A", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "17.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the beetles were domesticated by island communities.\nB) the beetles were likely introduced by natural dispersal rather than by humans.\nC) the island beetles must be younger than the coastal beetles.\nD) humans carried the beetles to the island during early trade voyages.", "answer": "B", "explanation": "The timing rules out human introduction."}, {"id": "17.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) all versions of the song are identical.\nB) the song was probably not introduced to the archipelago by that migration.\nC) the migration must have begun earlier than any other human movement.\nD) the song could not have changed after the migration.", "answer": "B", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "17.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) the island variety must be genetically identical to wild mainland plants.\nB) mainland farmers acquired the crop from island communities.\nC) human settlement probably did not account for the plant's original arrival on the island.\nD) the crop was first domesticated on the island.", "answer": "C", "explanation": "The plant's arrival predates human settlement."}, {"id": "17.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) boats probably explain every modern snail population.\nB) the lakes did not contain snails until boating began.\nC) human activity made the populations genetically identical.\nD) the snails likely spread through an earlier nonhuman mechanism.", "answer": "D", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 18, "concept": "Logical Completion: sea star as mostly head region", "original": "The morphological novelty of echinoderms—marine\ninvertebrates with radial symmetry, usually starlike,\naround a central point—impedes comparisons with\nmost other animals, in which bilateral symmetry on\nan anterior-posterior (head to tail) axis through a\ntrunk is typical. Particularly puzzling are sea stars,\nthought to have evolved a headless layout from a\nknown bilateral origin. Applying genomic knowledge\nof Saccoglossus kowalevskii acorn worms (close\nrelatives of sea stars, and thus expected to have\nsimilar markers for corresponding anatomical\nregions) to the body patterning genes of Patiria\nminiata sea stars, Laurent Formery et al. observed\nactivity only in anterior genes across P. miniata’s\nentire body and some posterior genes limited to the\nedges, suggesting that _______\nWhich choice most logically completes the text?\nA) despite the greater prevalence of anterior genes\nin sea stars’ genetic makeup, posterior genes\nactive at the body’s perimeter are primarily\nresponsible for the starlike layout that\ndistinguishes sea stars’ radial symmetry from\nthat of other echinoderms.\nB) contrary to the belief that they evolved from\nearly ancestors with the bilateral form typical of\nmany other animals, sea stars instead originated\nwith an atypical body layout that was neither\nbilaterally nor radially symmetrical.\nC) although the two species are closely related, there\nis only minimal correspondence in the genetic\nmarkers for head, tail, and trunk region\ndevelopment in P. miniata sea stars and\nS. kowalevskii acorn worms.\nD) rather than undergoing changes resulting in the\neventual elimination of a head region in their\nradial body plan, as previously assumed, sea\nstars’ morphology evolved to completely lack a\ntrunk and consist primarily of a head region.", "generated": [{"id": "18.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the island populations were domesticated before mainland populations.\nB) human traders must have transported the seeds recently.\nC) the plant probably reached the islands without human assistance.\nD) all island plants descended from a single cultivated variety.", "answer": "C", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "18.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the island beetles must be younger than the coastal beetles.\nB) the beetles were domesticated by island communities.\nC) humans carried the beetles to the island during early trade voyages.\nD) the beetles were likely introduced by natural dispersal rather than by humans.", "answer": "D", "explanation": "The timing rules out human introduction."}, {"id": "18.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the song was probably not introduced to the archipelago by that migration.\nB) the migration must have begun earlier than any other human movement.\nC) the song could not have changed after the migration.\nD) all versions of the song are identical.", "answer": "A", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "18.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) the crop was first domesticated on the island.\nB) mainland farmers acquired the crop from island communities.\nC) human settlement probably did not account for the plant's original arrival on the island.\nD) the island variety must be genetically identical to wild mainland plants.", "answer": "C", "explanation": "The plant's arrival predates human settlement."}, {"id": "18.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) boats probably explain every modern snail population.\nB) the snails likely spread through an earlier nonhuman mechanism.\nC) the lakes did not contain snails until boating began.\nD) human activity made the populations genetically identical.", "answer": "B", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 19, "concept": "Grammar: plural subject embryos enter", "original": "To survive when water is scarce, embryos\ninside African turquoise killifish eggs ______ a\ndormant state known as diapause. In this state,\nembryonic development is paused for as long as two\nyears—longer than the life span of an adult killifish.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) enter\nB) to enter\nC) having entered\nD) entering", "generated": [{"id": "19.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) publishing\nC) having published\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "19.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device--\nB) device\nC) device:\nD) device,", "answer": "B", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "19.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, so ree, in part because,", "answer": "B", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 20, "concept": "Grammar: past perfect by later endpoint", "original": "Formed in 1967 to foster political and economic\nstability within the Asia-Pacific region, the\nAssociation of Southeast Asian Nations was\noriginally made up of five members: Thailand, the\nPhilippines, Singapore, Malaysia, and Indonesia. By\nthe end of the 1990s, the organization ______ its\ninitial membership.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) has doubled\nB) had doubled\nC) doubles\nD) will double", "generated": [{"id": "20.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) published\nC) publishing\nD) having published", "answer": "B", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "20.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles
