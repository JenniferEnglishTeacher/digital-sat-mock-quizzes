"B": "這位領導人無法做出結論。", "C": "這位領導人不聽取他人意見就做決定。", "D": "這位領導人不喜歡公開會議。"}, "answer": "A", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Inference: difrasismo understood by cultural context", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice is best supported by the text?", "stemZh": "哪個選項最能得到文本的支持？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，然而在每一項測量都經過檢查之前，她絕不會發表任何主張。", "opts": {"A": "She combines intellectual openness with rigorous standards.", "B": "She rejects all imaginative thinking.", "C": "She avoids working with students.", "D": "She publishes claims before testing them."}, "optsZh": {"A": "她兼具開放的求知態度與嚴格的標準。", "B": "她排斥一切富有想像力的思考。", "C": "她避免與學生共事。", "D": "她在驗證主張之前就將其發表。"}, "answer": "A", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Main Idea: invisible hand promoted later", "vocab": false, "body": "Eighteenth-century economist Adam Smith is famed for his metaphor of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invisible\" target=\"_blank\" rel=\"noopener\" data-w=\"invisible\" data-pos=\"adj.\" data-en=\"impossible to see\" data-zh=\"看不見的；無形的\">invisible<\/a> hand, which he putatively used to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrate<\/a> a robust model of how individuals produce aggregate benefits by pursuing their own <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=economic\" target=\"_blank\" rel=\"noopener\" data-w=\"economic\" data-pos=\"adj.\" data-en=\"related to money, trade, and industry\" data-zh=\"經濟的\">economic<\/a> interests. Note “putatively”: as Gavin Kennedy has shown, Smith deploys this metaphor only once in his economic writings—to make a narrow point about the then-dominant economic theory of mercantilism—and it was largely ignored until some twentieth-century economists eager to secure an intellectual pedigree for their views <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elevated\" target=\"_blank\" rel=\"noopener\" data-w=\"elevated\" data-pos=\"adj.\" data-en=\"raised above the ground or above the normal level\" data-zh=\"高架的；升高的\">elevated<\/a> it to a fully-fledged paradigm.", "bodyPlain": "Eighteenth-century economist Adam Smith is famed for his metaphor of the invisible hand, which he putatively used to illustrate a robust model of how individuals produce aggregate benefits by pursuing their own economic interests. Note “putatively”: as Gavin Kennedy has shown, Smith deploys this metaphor only once in his economic writings—to make a narrow point about the then-dominant economic theory of mercantilism—and it was largely ignored until some twentieth-century economists eager to secure an intellectual pedigree for their views elevated it to a fully-fledged paradigm.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明本文的主旨？", "bodyZh": "十八世紀經濟學家 Adam Smith 以他「看不見的手」的隱喻而聞名；據稱他用這個隱喻來闡明一個完善的模型，說明個人如何藉由追求自身經濟利益而產生整體利益。請注意「據稱」這個詞：正如 Gavin Kennedy 所指出的，Smith 在他的經濟著作中只用過這個隱喻一次——為了針對當時主流的重商主義經濟理論提出一個狹隘的論點——而且這個隱喻長期遭到忽視，直到一些二十世紀的經濟學家為了替自己的觀點找到學術淵源，才將它提升為一個完整的典範。", "opts": {"A": "Although Smith is famed for his metaphor of the invisible hand, the metaphor was largely ignored until economists in the twentieth century came to realize that the metaphor was a robust model that anticipated their own views.", "B": "Some twentieth-century economists gave Smith’s metaphor of the invisible hand a significance it does not have in Smith’s work, but it is nevertheless a useful model of how individuals produce aggregate benefits by pursuing their own economic interests.", "C": "Smith’s metaphor of the invisible hand has been interpreted as a model of how individuals acting in their own interest produce aggregate benefits, but it was intended as a subtle critique of the economic theory of mercantilism.", "D": "The reputation of Smith’s metaphor of the invisible hand is not due to the importance of the metaphor in Smith’s work but rather to the promotion of the metaphor by some later economists for their own ends."}, "optsZh": {"A": "雖然 Smith 以「看不見的手」的隱喻而聞名，但這個隱喻長期遭到忽視，直到二十世紀的經濟學家才體認到它是一個預見了他們自身觀點的完善模型。", "B": "一些二十世紀的經濟學家賦予 Smith 的「看不見的手」隱喻一種它在 Smith 著作中並不具有的重要性，但它仍然是一個有用的模型，說明個人如何藉由追求自身經濟利益而產生整體利益。", "C": "Smith 的「看不見的手」隱喻被解讀為一個說明個人追求自身利益如何產生整體利益的模型，但它原本是對重商主義經濟理論的委婉批評。", "D": "Smith 的「看不見的手」隱喻之所以享有盛名，並不是因為它在 Smith 著作中的重要性，而是因為後來一些經濟學家為了自身目的而推廣它。"}, "answer": "D", "expl": "Smith used the metaphor only once for a narrow point; its fame came from later economists who promoted it to support their own views.", "explZh": "Smith 只用過這個隱喻一次、而且只為了一個狹隘的論點；它的名聲來自後來的經濟學家為了支持自己的觀點而推廣它。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Main Idea: invisible hand promoted later", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園裡帶著花回來。敘述細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To explain why music has lost its importance", "C": "To argue that the characters should leave the house", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "在角色們為某人的到來做準備時，描繪場景與氣氛", "B": "解釋為什麼音樂已失去其重要性", "C": "主張角色們應該離開這棟房子", "D": "概述兩位親戚之間的衝突"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Main Idea: invisible hand promoted later", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To list the technical features of a harbor", "C": "To present an atmosphere of departure and possibility", "D": "To criticize sailors for taking unnecessary risks"}, "optsZh": {"A": "比較幾種交通方式", "B": "列出一座港口的技術特點", "C": "呈現一種啟程與充滿可能性的氛圍", "D": "批評水手們冒不必要的風險"}, "answer": "C", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Main Idea: invisible hand promoted later", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To contrast rural and urban customs", "B": "To describe a completed celebration from beginning to end", "C": "To explain why the family dislikes visitors", "D": "To depict preparations that reveal anticipation within a family"}, "optsZh": {"A": "對比鄉村與都市的風俗", "B": "從頭到尾描述一場已經結束的慶祝活動", "C": "解釋為什麼這家人不喜歡訪客", "D": "描繪顯露出一家人期待之情的準備工作"}, "answer": "D", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Main Idea: invisible hand promoted later", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；而是凸顯了上課前那些安靜的例行儀式。", "opts": {"A": "To evaluate the quality of a school's curriculum", "B": "To describe the moments before a significant daily activity begins", "C": "To recount a student's entire academic career", "D": "To argue that early classes should be canceled"}, "optsZh": {"A": "評估一所學校課程的品質", "B": "描述一項重要的日常活動開始前的時刻", "C": "敘述一名學生完整的求學經歷", "D": "主張應取消早上的課"}, "answer": "B", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Main Idea: invisible hand promoted later", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To establish a reflective mood before a character acts", "B": "To reveal the full contents of a letter", "C": "To give instructions for maintaining a garden", "D": "To compare two different seasons"}, "optsZh": {"A": "在角色採取行動之前營造一種沉思的氛圍", "B": "揭露一封信的完整內容", "C": "提供照顧花園的指示", "D": "比較兩個不同的季節"}, "answer": "A", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Quantitative Evidence: similar information despite slower speech", "vocab": false, "body": "Approximate Rates of Speech and Information Conveyed for Five <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">Languages<\/a> (table) — rate of speech (syllables per second) / rate of information conveyed (bits per second): Serbian: 7.2 / 39.1; Spanish: 7.7 / 42.0; Vietnamese: 5.3 / 42.5; Thai: 4.7 / 33.8; Hungarian: 5.9 / 34.6.<br><br>A group of researchers working in Europe, Asia, and Oceania conducted a study to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> how quickly different Eurasian languages are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=typically\" target=\"_blank\" rel=\"noopener\" data-w=\"typically\" data-pos=\"adv.\" data-en=\"usually; in most cases\" data-zh=\"通常；一般而言\">typically<\/a> spoken (in syllables per second) and how much information they can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectively\" target=\"_blank\" rel=\"noopener\" data-w=\"effectively\" data-pos=\"adv.\" data-en=\"in a way that produces the intended result\" data-zh=\"有效地\">effectively<\/a> convey (in bits per second). They found that, although languages vary widely in the speed at which they are spoken, the amount of information languages can effectively convey tends to vary much less. Thus, they claim that two languages with very different spoken rates can nonetheless convey the same amount of information in a given amount of time.", "bodyPlain": "Approximate Rates of Speech and Information Conveyed for Five Languages (table) — rate of speech (syllables per second) / rate of information conveyed (bits per second): Serbian: 7.2 / 39.1; Spanish: 7.7 / 42.0; Vietnamese: 5.3 / 42.5; Thai: 4.7 / 33.8; Hungarian: 5.9 / 34.6.\n\nA group of researchers working in Europe, Asia, and Oceania conducted a study to determine how quickly different Eurasian languages are typically spoken (in syllables per second) and how much information they can effectively convey (in bits per second). They found that, although languages vary widely in the speed at which they are spoken, the amount of information languages can effectively convey tends to vary much less. Thus, they claim that two languages with very different spoken rates can nonetheless convey the same amount of information in a given amount of time.", "stem": "Which choice best describes data from the table that support the researchers’ claim?", "stemZh": "下列哪一項對表格資料的描述最能支持研究人員的主張？", "bodyZh": "五種語言的大約說話速度與資訊傳達量（表格）——說話速度（每秒音節數）／資訊傳達速度（每秒位元數）：塞爾維亞語：7.2 / 39.1；西班牙語：7.7 / 42.0；越南語：5.3 / 42.5；泰語：4.7 / 33.8；匈牙利語：5.9 / 34.6。\n一群在歐洲、亞洲與大洋洲工作的研究人員進行了一項研究，以確定不同的歐亞語言通常的說話速度（每秒音節數），以及它們能有效傳達多少資訊（每秒位元數）。他們發現，雖然各語言的說話速度差異很大，但各語言能有效傳達的資訊量差異往往小得多。因此，他們主張兩種說話速度差異很大的語言，仍能在一定的時間內傳達相同的資訊量。", "opts": {"A": "Among the five languages in the table, Thai and Hungarian have the lowest rates of speech and the lowest rates of information conveyed.", "B": "Vietnamese conveys information at approximately the same rate as Spanish despite being spoken at a slower rate.", "C": "Among the five languages in the table, the language that is spoken the fastest is also the language that conveys information the fastest.", "D": "Serbian and Spanish are spoken at approximately the same rate, but Serbian conveys information faster than Spanish does."}, "optsZh": {"A": "在表格中的五種語言裡，泰語和匈牙利語的說話速度最慢，傳達資訊的速度也最慢。", "B": "越南語雖然說話速度較慢，但傳達資訊的速度與西班牙語大致相同。", "C": "在表格中的五種語言裡，說話速度最快的語言，也是傳達資訊最快的語言。", "D": "塞爾維亞語和西班牙語的說話速度大致相同，但塞爾維亞語傳達資訊的速度比西班牙語快。"}, "answer": "B", "expl": "Vietnamese (5.3 syllables/sec) is spoken much more slowly than Spanish (7.7) yet conveys about the same information (42.5 vs. 42.0 bits/sec).", "explZh": "越南語（每秒 5.3 音節）說得比西班牙語（7.7）慢很多，但傳達的資訊量卻差不多（每秒 42.5 對 42.0 位元）。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Quantitative Evidence: similar information despite slower speech", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人在上任的第一個月簽署了數項法令。」", "B": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這個政府從一開始就面臨經濟上的挑戰。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Quantitative Evidence: similar information despite slower speech", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The graph contains information about three regions.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "有些農民種植蔬菜，而另一些則種植穀物。", "C": "這張圖表包含三個地區的資訊。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Quantitative Evidence: similar information despite slower speech", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "B": "研究恆星所用的方法需要望遠鏡。", "C": "有一顆岩質行星擁有稀薄的大氣層。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Quantitative Evidence: similar information despite slower speech", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "The tradition is studied by scholars in several countries.", "C": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "許多表演者是向親戚學習歌曲的。", "B": "有數個國家的學者研究這項傳統。", "C": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "D": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。"}, "answer": "C", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Quantitative Evidence: similar information despite slower speech", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program took place in a community.", "C": "Both towns had some volunteers.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "這張表格包含不只一個年份。", "B": "這個計畫在一個社區中進行。", "C": "兩個城鎮都有一些志工。", "D": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Quantitative Evidence: methodology affects bite-force estimates", "vocab": false, "body": "Estimates of Tyrannosaurid Bite Force (table) — study, year, estimation method, approximate bite force (newtons): Cost et al., 2019, muscular and skeletal modeling, 35,000–63,000; Gignac and Erickson, 2017, tooth-bone <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> analysis, 8,000–34,000; Meers, 2002, body-mass scaling, 183,000–235,000; Bates and Falkingham, 2012, muscular and skeletal modeling, 35,000–57,000.<br><br>The largest tyrannosaurids—the family of carnivorous dinosaurs that includes Tarbosaurus, Albertosaurus, and, most famously, Tyrannosaurus rex—are thought to have had the strongest bites of any land animals in Earth’s history. Determining the bite force of extinct animals can be difficult, however, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=paleontologist\" target=\"_blank\" rel=\"noopener\" data-w=\"paleontologist\" data-pos=\"n.\" data-en=\"a scientist who studies fossils and ancient life\" data-zh=\"古生物學家\">paleontologists<\/a> Paul Barrett and Emily Rayfield have suggested that an estimate of dinosaur bite force may be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a> influenced by the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=methodology\" target=\"_blank\" rel=\"noopener\" data-w=\"methodology\" data-pos=\"n.\" data-en=\"the system of methods used in a study\" data-zh=\"研究方法\">methodology<\/a> used in generating that estimate.", "bodyPlain": "Estimates of Tyrannosaurid Bite Force (table) — study, year, estimation method, approximate bite force (newtons): Cost et al., 2019, muscular and skeletal modeling, 35,000–63,000; Gignac and Erickson, 2017, tooth-bone interaction analysis, 8,000–34,000; Meers, 2002, body-mass scaling, 183,000–235,000; Bates and Falkingham, 2012, muscular and skeletal modeling, 35,000–57,000.\n\nThe largest tyrannosaurids—the family of carnivorous dinosaurs that includes Tarbosaurus, Albertosaurus, and, most famously, Tyrannosaurus rex—are thought to have had the strongest bites of any land animals in Earth’s history. Determining the bite force of extinct animals can be difficult, however, and paleontologists Paul Barrett and Emily Rayfield have suggested that an estimate of dinosaur bite force may be significantly influenced by the methodology used in generating that estimate.", "stem": "Which choice best describes data from the table that support Barrett and Rayfield’s suggestion?", "stemZh": "下列哪一項對表格資料的描述最能支持 Barrett 和 Rayfield 的看法？", "bodyZh": "暴龍科咬合力估計值（表格）——研究、年份、估計方法、大約咬合力（牛頓）：Cost 等人，2019 年，肌肉與骨骼建模，35,000–63,000；Gignac 與 Erickson，2017 年，牙齒與骨骼交互作用分析，8,000–34,000；Meers，2002 年，體重比例推算，183,000–235,000；Bates 與 Falkingham，2012 年，肌肉與骨骼建模，35,000–57,000。\n最大型的暴龍科恐龍——這個肉食性恐龍家族包括特暴龍（Tarbosaurus）、艾伯塔龍（Albertosaurus），以及最著名的霸王龍（Tyrannosaurus rex）——被認為擁有地球史上所有陸生動物中最強的咬合力。然而，要判定已滅絕動物的咬合力可能很困難，古生物學家 Paul Barrett 和 Emily Rayfield 曾指出，恐龍咬合力的估計值可能會受到產生該估計值所用方法的顯著影響。", "opts": {"A": "The study by Meers used body-mass scaling and produced the lowest estimated maximum bite force, while the study by Cost et al. used muscular and skeletal modeling and produced the highest estimated maximum.", "B": "In their study, Gignac and Erickson used tooth-bone interaction analysis to produce an estimated bite force range with a minimum of 8,000 newtons and a maximum of 34,000 newtons.", "C": "The bite force estimates produced by Bates and Falkingham and by Cost et al. were similar to each other, while the estimates produced by Meers and by Gignac and Erickson each differed substantially from any other estimate.", "D": "The estimated maximum bite force produced by Cost et al. exceeded the estimated maximum produced by Bates and Falkingham, even though both groups of researchers used the same method to generate their estimates."}, "optsZh": {"A": "Meers 的研究使用體重比例推算法，得出最低的估計最大咬合力；而 Cost 等人的研究使用肌肉與骨骼模型，得出最高的估計最大值。", "B": "在研究中，Gignac 與 Erickson 使用齒骨交互作用分析，得出估計咬合力範圍，最小值為 8,000 牛頓，最大值為 34,000 牛頓。", "C": "Bates 與 Falkingham 以及 Cost 等人所得出的咬合力估計值彼此相近，而 Meers 以及 Gignac 與 Erickson 的估計值則各自與其他估計值有顯著差異。", "D": "Cost 等人估計的最大咬合力超過 Bates 與 Falkingham 的估計最大值，儘管兩組研究人員使用相同的方法得出估計值。"}, "answer": "C", "expl": "The two studies using the same method (Bates and Falkingham; Cost et al.) got similar estimates, while studies using different methods got very different ones—showing method influences the estimate.", "explZh": "使用相同方法的兩項研究（Bates 與 Falkingham、Cost 等人）得到相近的估計值，而使用不同方法的研究結果差異很大——顯示方法會影響估計結果。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Quantitative Evidence: methodology affects bite-force estimates", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人在上任的第一個月簽署了數項法令。」", "B": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這個政府從一開始就面臨經濟上的挑戰。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Quantitative Evidence: methodology affects bite-force estimates", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "The southern region was included in the survey.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。", "B": "南部地區有被納入調查。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Quantitative Evidence: methodology affects bite-force estimates", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "One rocky planet has a thin atmosphere.", "C": "Some stars contain hydrogen and helium.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "研究恆星所用的方法需要望遠鏡。", "B": "有一顆岩質行星擁有稀薄的大氣層。", "C": "有些恆星含有氫和氦。", "D": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Quantitative Evidence: methodology affects bite-force estimates", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "Some songs use a meter also found in older European poetry.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "許多表演者是向親戚學習歌曲的。", "B": "有數首民謠包含當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "C": "有些歌曲使用了在較古老的歐洲詩歌中也能見到的格律。", "D": "有數個國家的學者研究這項傳統。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Quantitative Evidence: methodology affects bite-force estimates", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The table includes more than one year.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "The program took place in a community."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這張表格包含不只一個年份。", "C": "與沒有該計畫的城鎮相比，這個計畫與受訓志工人數的明顯增加有關。", "D": "這個計畫在一個社區中進行。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Command of Evidence: awe increases altruism", "vocab": false, "body": "Psychologists Dacher Keltner and Jonathan Haidt have argued that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experiencing<\/a> awe—a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sensation\" target=\"_blank\" rel=\"noopener\" data-w=\"sensation\" data-pos=\"n.\" data-en=\"a physical feeling; a strong feeling\" data-zh=\"感覺；知覺\">sensation<\/a> of reverence and wonder typically brought on by perceiving something grand or powerful—can enable us to feel more connected to others and thereby inspire us to act more altruistically. Keltner, along with Paul K. Piff, Pia Dietze, and colleagues, claims to have found evidence for this effect in a recent study where participants were asked to either gaze up at exceptionally tall trees in a nearby grove (reported to be a universally awe-inspiring experience) or stare at the exterior of a nearby, nondescript building. After one minute, an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experimenter<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> spilled a box of pens nearby.", "bodyPlain": "Psychologists Dacher Keltner and Jonathan Haidt have argued that experiencing awe—a sensation of reverence and wonder typically brought on by perceiving something grand or powerful—can enable us to feel more connected to others and thereby inspire us to act more altruistically. Keltner, along with Paul K. Piff, Pia Dietze, and colleagues, claims to have found evidence for this effect in a recent study where participants were asked to either gaze up at exceptionally tall trees in a nearby grove (reported to be a universally awe-inspiring experience) or stare at the exterior of a nearby, nondescript building. After one minute, an experimenter deliberately spilled a box of pens nearby.", "stem": "Which finding from the researchers’ study, if true, would most strongly support their claim?", "stemZh": "如果屬實，研究人員研究中的哪一項發現最能支持他們的主張？", "bodyZh": "心理學家 Dacher Keltner 和 Jonathan Haidt 主張，體驗敬畏感——一種通常因感知到宏偉或強大事物而產生的崇敬與驚奇之感——能讓我們感覺與他人更緊密相連，進而激勵我們表現得更加利他。Keltner 與 Paul K.Piff、Pia Dietze 及其同事聲稱，他們在最近一項研究中找到了這種效應的證據；在該研究中，受試者被要求仰望附近樹林中異常高大的樹木（據報導這是一種普遍令人敬畏的體驗），或是盯著附近一棟平凡無奇的建築物外觀。一分鐘後，一名實驗人員故意在附近打翻一盒筆。", "opts": {"A": "Participants who had been looking at the trees helped the experimenter pick up significantly more pens than did participants who had been looking at the building.", "B": "Participants who helped the experimenter pick up the pens used a greater number of positive words to describe the trees and the building in a postexperiment survey than did participants who did not help the experimenter.", "C": "Participants who did not help the experimenter pick up the pens were significantly more likely to report having experienced a feeling of awe, regardless of whether they looked at the building or the trees.", "D": "Participants who had been looking at the building were significantly more likely to notice that the experimenter had dropped the pens than were participants who had been looking at the trees."}, "optsZh": {"A": "看著樹木的參與者幫實驗人員撿起的筆，明顯多於看著建築物的參與者。", "B": "在實驗後的調查中，幫實驗人員撿筆的參與者比沒有幫忙的參與者使用了更多正面詞語來描述樹木與建築物。", "C": "沒有幫實驗人員撿起筆的參與者，無論他們看的是建築物還是樹木，都明顯更可能表示曾感受到敬畏之情。", "D": "看著建築物的參與者，比看著樹木的參與者明顯更可能注意到實驗人員掉了筆。"}, "answer": "A", "expl": "If people who felt awe (looking at the trees) helped pick up more pens, that shows awe made them act more altruistically.", "explZh": "如果感受到敬畏（看大樹）的參與者撿起更多筆，就表示敬畏感使他們表現得更利他。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Command of Evidence: awe increases altruism", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人在國家誕生過程中的象徵性角色，比他短暫而成敗參半的執政紀錄更為重要。」", "B": "「這個政府從一開始就面臨經濟上的挑戰。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在上任的第一個月簽署了數項法令。」"}, "answer": "A", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Command of Evidence: awe increases altruism", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "The southern region was included in the survey.", "B": "The graph contains information about three regions.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "南部地區有被納入調查。", "B": "這張圖表包含三個地區的資訊。", "C": "有些農民種植蔬菜，而另一些則種植穀物。", "D": "女性在南部蔬菜種植者中占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Command of Evidence: awe increases altruism", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "One rocky planet has a thin atmosphere.", "B": "Some stars contain hydrogen and helium.", "C": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有一顆岩質行星擁有稀薄的大氣層。", "B": "有些恆星含有氫和氦。", "C": "有數顆岩質行星被發現所含的鐵比例明顯高於它們所環繞的恆星。", "D": "研究恆星所用的方法需要望遠鏡。"}, "answer": "C", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Command of Evidence: awe increases altruism", "vocab": false, "
