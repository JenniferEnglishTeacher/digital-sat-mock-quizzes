iterature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family, and\nC) family\nD) family,", "answer": "C", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "20.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free in part because\nC) free, in part because,\nD) free, in part because:", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 21, "concept": "Grammar: sentence boundary before Such", "original": "After the United Kingdom began rolling out taxes\nequivalent to a few cents on single-use plastic grocery\nbags in 2011, plastic-bag consumption decreased by\nup to ninety _______ taxes are subject to what\neconomists call the “rebound effect”: as the change\nbecame normalized, plastic-bag use started to creep\nback up.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) percent, such\nB) percent and such\nC) percent. Such\nD) percent such", "generated": [{"id": "21.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) having published\nB) publishing\nC) to publish\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "21.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device--\nB) device,\nC) device\nD) device:", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "21.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) that\nB) them\nC) this\nD) it", "answer": "B", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "21.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family\nB) family and\nC) family, and\nD) family,", "answer": "A", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "21.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free in part because\nB) free, in part because,\nC) free. In part because\nD) free, in part because:", "answer": "C", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 22, "concept": "Grammar: infinitive of purpose", "original": "In 1966, Emmett Ashford became the first African\nAmerican to umpire a Major League Baseball game.\nHis energetic gestures announcing when a player had\nstruck out and his habit of barreling after a hit ball to\nsee if it would land out of _______ transform the\ntraditionally solemn umpire role into a dynamic one.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) bounds helped\nB) bounds, helping\nC) bounds that helped\nD) bounds to help", "generated": [{"id": "22.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) having published\nB) to publish\nC) publishing\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "22.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device--\nB) device:\nC) device\nD) device,", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "22.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) this\nC) it\nD) that", "answer": "A", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "22.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family, and\nB) family\nC) family and\nD) family,", "answer": "B", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "22.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free, in part because:\nC) free, in part because,\nD) free in part because", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 23, "concept": "Grammar: infinitive after Springs", "original": "The forty-seven geothermal springs of Arkansas’ Hot\nSprings National Park are sourced via a process\nknown as natural groundwater recharge, in which\nrainwater percolates downward through the\nearth—in this case, the porous rocks of the hills\naround Hot ______ collect in a subterranean basin.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) Springs to\nB) Springs: to\nC) Springs—to\nD) Springs, to", "generated": [{"id": "23.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) publishing\nC) published\nD) having published", "answer": "C", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "23.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device--\nB) device:\nC) device,\nD) device", "answer": "D", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "23.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) it\nB) them\nC) that\nD) this", "answer": "B", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "23.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family,\nC) family, and\nD) family", "answer": "D", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "23.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free in part because\nC) free, in part because,\nD) free, in part because:", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 24, "concept": "Grammar: colon before explanation", "original": "Over twenty years ago, in a landmark experiment in\nthe psychology of choice, professor Sheena Iyengar\nset up a jam-tasting booth at a grocery store. The\nnumber of jams available for tasting ______ some\nshoppers had twenty-four different options, others\nonly six. Interestingly, the shoppers with fewer jams\nto choose from purchased more jam.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) varied:\nB) varied,\nC) varied, while\nD) varied while", "generated": [{"id": "24.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) publishing\nB) to publish\nC) having published\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "24.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device:\nB) device\nC) device,\nD) device--", "answer": "B", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "24.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) them\nB) that\nC) it\nD) this", "answer": "A", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "24.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family, and\nC) family\nD) family,", "answer": "C", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "24.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free, in part because,\nC) free. In part because\nD) free in part because", "answer": "C", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 25, "concept": "Grammar: list punctuation with semicolon", "original": "Nigerian author Buchi Emecheta’s celebrated literary\noeuvre includes The Joys of Motherhood, a novel\nabout the changing roles of women in 1950s ______\na television play about the private struggles of a\nnewlywed couple in Nigeria; and Head Above Water,\nher autobiography.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) Lagos, A Kind of Marriage,\nB) Lagos; A Kind of Marriage,\nC) Lagos, A Kind of Marriage:\nD) Lagos; A Kind of Marriage", "generated": [{"id": "25.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) publishing\nB) having published\nC) to publish\nD) published", "answer": "D", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "25.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device:\nB) device\nC) device,\nD) device--", "answer": "B", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "25.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) this\nB) it\nC) them\nD) that", "answer": "C", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "25.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family\nB) family, and\nC) family,\nD) family and", "answer": "A", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "25.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free. In part because\nB) free in part because\nC) free, in part because:\nD) free, in part because,", "answer": "A", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 26, "concept": "Grammar: comma before though clause", "original": "Jetties—long, narrow structures that extend from a\nlandmass into the water—are often constructed to\nprotect coastlines from erosion. Jetties can\nsometimes have the opposite _______ obstructing\nthe natural flow of sand along the shore can lead to\nincreased erosion in some areas.\nWhich choice completes the text so that it conforms\nto the conventions of Standard English?\nA) effect, though;\nB) effect, though\nC) effect; though\nD) effect, though,", "generated": [{"id": "26.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) published\nC) publishing\nD) having published", "answer": "B", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "26.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device,\nB) device--\nC) device\nD) device:", "answer": "C", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "26.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) that\nB) them\nC) it\nD) this", "answer": "B", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "26.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family\nB) family and\nC) family, and\nD) family,", "answer": "A", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "26.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free in part because\nB) free, in part because:\nC) free, in part because,\nD) free. In part because", "answer": "D", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 27, "concept": "Transition: in fact adds audio-recording evidence", "original": "The Alaska Native Language Archive (ANLA) is\nknown for its impressive audio collection. _______\nthe ANLA has more than 5,000 audio recordings of\nNative Alaskan languages dating as far back as 1943.\nWhich choice completes the text with the most\nlogical transition?\nA) In fact,\nB) After,\nC) Regardless,\nD) Instead,", "generated": [{"id": "27.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The archive is famous for its maps. _______ it contains more than twelve thousand hand-drawn maps dating from the eighteenth century.\n\nWhich choice completes the text with the most logical transition?\n\nA) In fact,\nB) Instead,\nC) After,\nD) Regardless,", "answer": "A", "explanation": "In fact adds confirming detail."}, {"id": "27.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The collection is unusually rich in oral histories. _______ more than half its holdings consist of recorded interviews.\n\nWhich choice completes the text with the most logical transition?\n\nA) After,\nB) Regardless,\nC) Instead,\nD) In fact,", "answer": "D", "explanation": "In fact strengthens the previous claim."}, {"id": "27.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The sanctuary is known for bird diversity. _______ researchers have documented over three hundred species there.\n\nWhich choice completes the text with the most logical transition?\n\nA) Instead,\nB) After,\nC) In fact,\nD) Regardless,", "answer": "C", "explanation": "In fact adds evidence."}, {"id": "27.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The museum's textile holdings are extensive. _______ they include examples from every decade of the twentieth century.\n\nWhich choice completes the text with the most logical transition?\n\nA) After,\nB) Regardless,\nC) Instead,\nD) In fact,", "answer": "D", "explanation": "In fact supplies support."}, {"id": "27.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The lab is recognized for its climate records. _______ it maintains one of the longest continuous temperature datasets in the region.\n\nWhich choice completes the text with the most logical transition?\n\nA) Regardless,\nB) In fact,\nC) Instead,\nD) After,", "answer": "B", "explanation": "In fact introduces evidence."}]}, {"n": 28, "concept": "Transition: currently modern research aid", "original": "Etched into Peru’s Nazca Desert are line drawings so\nlarge that they can only be fully seen from high\nabove. Archaeologists have known of the lines since\nthe 1920s, when a researcher spotted some from a\nnearby foothill, and they have been studying the\nmarkings ever since. ______ archaeologists’ efforts\nare aided by drones that capture high-resolution\naerial photographs of the lines.\nWhich choice completes the text with the most\nlogical transition?\nA) Currently,\nB) In comparison,\nC) Still,\nD) However,", "generated": [{"id": "28.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Researchers once had to inspect the cliff paintings from the ground. _______ drones allow them to photograph the figures from above in far greater detail.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Still,\nC) In comparison,\nD) Currently,", "answer": "D", "explanation": "Currently marks the present method."}, {"id": "28.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The manuscript was first studied only under visible light. _______ multispectral imaging reveals erased annotations that earlier scholars could not see.\n\nWhich choice completes the text with the most logical transition?\n\nA) Currently,\nB) Still,\nC) In comparison,\nD) However,", "answer": "A", "explanation": "Currently introduces the modern practice."}, {"id": "28.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Early surveys relied on hand-drawn maps. _______ satellite images help archaeologists identify buried walls before excavation begins.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Still,\nC) Currently,\nD) In comparison,", "answer": "C", "explanation": "Currently marks a present-day development."}, {"id": "28.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The reef was once monitored only by divers. _______ autonomous sensors record temperature and acidity every hour.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Currently,\nC) In comparison,\nD) Still,", "answer": "B", "explanation": "Currently signals the present method."}, {"id": "28.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The sound archive was originally cataloged on paper cards. _______ a searchable database links each recording to performer, date, and location.\n\nWhich choice completes the text with the most logical transition?\n\nA) Currently,\nB) However,\nC) In comparison,\nD) Still,", "answer": "A", "explanation": "Currently introduces present-day tools."}]}, {"n": 29, "concept": "Transition: by contrast dogs differ from wolves", "original": "At two weeks old, the time their critical socialization\nperiod begins, wolves can smell but cannot yet see or\nhear. Domesticated dogs, _______ can see, hear, and\nsmell by the end of two weeks. This relative lack of\nsensory input may help explain why wolves behave\nso differently around humans than dogs do: from a\nvery young age, wolves are more wary and less\nexploratory.\nWhich choice completes the text with the most\nlogical transition?\nA) in other words,\nB) for instance,\nC) by contrast,\nD) accordingly,", "generated": [{"id": "29.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The two species hatch at similar sizes. _______ adult wolves remain far more wary of unfamiliar humans than adult dogs do.\n\nWhich choice completes the text with the most logical transition?\n\nA) By contrast,\nB) Accordingly,\nC) In other words,\nD) For instance,", "answer": "A", "explanation": "By contrast marks a difference."}, {"id": "29.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. At two weeks, the first group could already respond to sound. _______ the second group had not yet developed reliable hearing.\n\nWhich choice completes the text with the most logical transition?\n\nA) Accordingly,\nB) by contrast,\nC) For example,\nD) In other words,", "answer": "B", "explanation": "By contrast introduces the opposing condition."}, {"id": "29.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The northern population migrates hundreds of kilometers each spring. _______ the southern population usually remains in the same valley year-round.\n\nWhich choice completes the text with the most logical transition?\n\nA) For instance,\nB) Accordingly,\nC) In other words,\nD) By contrast,", "answer": "D", "explanation": "By contrast signals difference."}, {"id": "29.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The early photographs show crowded urban streets. _______ the later photographs focus on quiet interiors and empty rooms.\n\nWhich choice completes the text with the most logical transition?\n\nA) In other words,\nB) For instance,\nC) Accordingly,\nD) By contrast,", "answer": "D", "explanation": "By contrast compares unlike cases."}, {"id": "29.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The older version of the program required users to enter data manually. _______ the newer version imports the same data automatically.\n\nWhich choice completes the text with the most logical transition?\n\nA) For instance,\nB) In other words,\nC) By contrast,\nD) Accordingly,", "answer": "C", "explanation": "By contrast indicates the difference."}]}, {"n": 30, "concept": "Transition: on the contrary corrects illusion", "original": "Upon first approaching artist Kurt Wenner’s Dies\nIrae, a colorful scene painted on the surface of a\ncobblestone street in Mantua, Italy, one might\nassume a deep hole filled with life-sized, classically\nstyled sculptures had opened up in the street.\n_______ by expertly applying the principles of\nperspective, Wenner created merely the illusion of\ndepth.\nWhich choice completes the text with the most\nlogical transition?\nA) Additionally,\nB) On the contrary,\nC) As a result,\nD) Next,", "generated": [{"id": "30.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. At first glance, the painted hallway seems to extend far beyond the wall. _______ the apparent depth is only an illusion produced by perspective.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) Next,\nC) Additionally,\nD) On the contrary,", "answer": "D", "explanation": "On the contrary corrects a mistaken impression."}, {"id": "30.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The sculpture appears to be made of folded paper. _______ it is carved from a single block of marble.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) As a result,\nC) Additionally,\nD) Next,", "answer": "A", "explanation": "On the contrary reverses the assumption."}, {"id": "30.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The room seems lit by sunlight from a hidden window. _______ the glow comes from lamps concealed behind the ceiling panels.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) Additionally,\nC) On the contrary,\nD) Next,", "answer": "C", "explanation": "On the contrary introduces the correction."}, {"id": "30.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Visitors may assume the pool is several meters deep. _______ its mirrored bottom creates the impression of depth.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) Additionally,\nC) Next,\nD) As a result,", "answer": "A", "explanation": "On the contrary corrects the assumption."}, {"id": "30.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The photograph appears to show a stormy sky. _______ the image was made in a studio using smoke and painted glass.\n\nWhich choice completes the text with the most logical transition?\n\nA) As a result,\nB) On the contrary,\nC) Next,\nD) Additionally,", "answer": "B", "explanation": "On the contrary signals correction."}]}, {"n": 31, "concept": "Transition: as such states implication", "original": "Economist Elinor Ostrom’s studies of communities\naround the world have empirically demonstrated that\ncommon pool resources, such as grazing lands, can\nbe sustainably managed by the people who use them\n(rather than through private entities or centralized\ngovernments). _______ Ostrom’s work is a\nrepudiation of the “tragedy of the commons,” the\nview that individuals will inevitably overexploit a\nfinite shared resource if given unfettered access to it.\nWhich choice completes the text with the most\nlogical transition?\nA) By contrast,\nB) For example,\nC) That said,\nD) As such,", "generated": [{"id": "31.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The study shows that residents can manage shared wells without privatization or strict central control. _______ it challenges the idea that shared resources must inevitably be depleted.\n\nWhich choice completes the text with the most logical transition?\n\nA) By contrast,\nB) As such,\nC) For example,\nD) That said,", "answer": "B", "explanation": "As such introduces the implication."}, {"id": "31.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The evidence indicates that the policy reduced emissions while preserving output. _______ it is often cited as a successful compromise.\n\nWhich choice completes the text with the most logical transition?\n\nA) For example,\nB) That said,\nC) as such,\nD) By contrast,", "answer": "C", "explanation": "As such states a consequence or implication."}, {"id": "31.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The experiment demonstrated that the coating blocks heat transfer. _______ the material may be useful in energy-efficient construction.\n\nWhich choice completes the text with the most logical transition?\n\nA) By contrast,\nB) For example,\nC) As such,\nD) That said,", "answer": "C", "explanation": "As such draws the conclusion."}, {"id": "31.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The archive contains letters from both sides of the dispute. _______ it offers a fuller record than sources that preserve only official statements.\n\nWhich choice completes the text with the most logical transition?\n\nA) That said,\nB) By contrast,\nC) For example,\nD) As such,", "answer": "D", "explanation": "As such introduces the result."}, {"id": "31.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The model explains both the timing and the location of the eruptions. _______ it gives geologists a stronger basis for future risk assessments.\n\nWhich choice completes the text with the most logical transition?\n\nA) As such,\nB) For example,\nC) That said,\nD) By contrast,", "answer": "A", "explanation": "As such marks implication."}]}, {"n": 32, "concept": "Student Notes: advantage of infilling", "original": "While researching a topic, a student has taken the\nfollowing notes:\n• Some sandstone arches in Utah’s Arches National\nPark have been defaced by tourists’ carvings.\n• Park rangers can smooth away some carvings\nusing power grinders.\n• For deep carvings, power grinding is not always\nfeasible because it can greatly alter or damage the\nrock.\n• Park rangers can use an infilling technique, which\ninvolves filling in carvings with ground sandstone\nand a bonding agent.\n• This technique is minimally invasive.\nThe student wants to explain an advantage of the\ninfilling technique. Which choice most effectively\nuses relevant information from the notes to\naccomplish this goal?\nA) To remove carvings from sandstone arches in\nUtah’s Arches National Park, power grinding is\nnot always feasible.\nB) Filling in carvings with ground sandstone and a\nbonding agent is less invasive than smoothing\nthem away with a power grinder, which can\ngreatly alter or damage the sandstone arches.\nC) Park rangers can use a power grinding technique\nto smooth away carvings or fill them in with\nground sandstone and a bonding agent.\nD) As methods for removing carvings from\nsandstone, power grinding and infilling differ in\ntheir level of invasiveness.", "generated": [{"id": "32.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Aya Mori collected hundreds of plant samples.\nB) Fern A and Moss B were collected in different years.\nC) Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.\nD) Mori also collected Moss B from River Nami.", "answer": "C", "explanation": "The answer emphasizes the target sample."}, {"id": "32.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.\nB) Cerro Azul and Valle Seco are different sites.\nC) Ortega collected many mineral samples.\nD) Quartz was collected from Valle Seco.", "answer": "A", "explanation": "The answer focuses on the target sample."}, {"id": "32.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Both samples were collected in 1980.\nB) Lee cataloged more than one algae species.\nC) Fucus alba was collected from Stone Harbor.\nD) Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "answer": "D", "explanation": "The answer emphasizes the selected sample."}, {"id": "32.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.\nB) Singh collected beetles in multiple locations.\nC) Species M came from Lake Plain.\nD) The Cedar Ridge and Lake Plain specimens were collected in different years.", "answer": "A", "explanation": "The answer centers the target specimen."}, {"id": "32.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Cloud Peak and Green Valley were both collection sites.\nB) Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.\nC) Ramos collected Fern Y the following year.\nD) Ramos collected approximately 700 specimens.", "answer": "B", "explanation": "The answer emphasizes the target sample."}]}, {"n": 33, "concept": "Student Notes: misconception in naming", "original": "While researching a topic, a student has taken the\nfollowing notes:\n• Las sergas de Esplandián was a novel popular in\nsixteenth-century Spain.\n• The novel featured a fictional island inhabited\nsolely by Black women and known as California.\n• That same century, Spanish explorers learned of\nan “island” off the west coast of Mexico.\n• They called it California after the island in the\nnovel.\n• The “island” was actually the peninsula now\nknown as Baja California (“Lower California”),\nwhich lies to the south of the US state of\nCalifornia.\nThe student wants to emphasize the role a\nmisconception played in the naming of a place.\nWhich choice most effectively uses relevant\ninformation from the notes to accomplish this goal?\nA) The novel Las sergas de Esplandián featured a\nfictional island known as California.\nB) To the south of the US state of California lies\nBaja California (“Lower California”), originally\ncalled California after a fictional place.\nC) In the sixteenth century, Spanish explorers\nlearned of a peninsula off the west coast of\nMexico and called it California.\nD) Thinking it was an island, Spanish explorers\ncalled a peninsula California after an island in a\npopular novel.", "generated": [{"id": "33.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.\nB) The records office classifies documents by release risk.\nC) Sealed documents could cause major harm if released.\nD) Budget drafts are one kind of government document.", "answer": "A", "explanation": "The answer applies the classification rule."}, {"id": "33.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The lab uses hazard categories for materials.\nB) Danger materials can cause severe injury.\nC) Diluted cleaner is handled in a lab.\nD) Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution.", "answer": "D", "explanation": "The answer uses the correct category."}, {"id": "33.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Nineteenth-century pamphlets are historical documents.\nB) Restricted manuscripts cannot be handled by readers.\nC) Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers.\nD) The library classifies manuscripts by fragility.", "answer": "C", "explanation": "The answer applies the definitions."}, {"id": "33.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.\nB) Emergency storms cause widespread damage.\nC) Coastal storms can affect travel.\nD) The agency classifies storms by expected impact.", "answer": "A", "explanation": "The answer identifies the category."}, {"id": "33.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Museum loans are classified by security risk.\nB) Most ceramic replicas are classified as Supervised because ordinary handling could damage them.\nC) Restricted objects could be seriously damaged by brief exposure.\nD) Ceramic replicas may be used in educational displays.", "answer": "B", "explanation": "The answer applies the classification."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
