 repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The novel&#x27;s plot is _______: three family histories, two political crises, and several hidden letters gradually connect.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The novel's plot is _______: three family histories, two political crises, and several hidden letters gradually connect.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這部小說的情節 _______：三段家族歷史、兩場政治危機和幾封隱藏的信件逐漸串連起來。", "opts": {"A": "complex", "B": "obscure", "C": "indecipherable", "D": "ornamental"}, "optsZh": {"A": "complex（複雜的）", "B": "obscure（模糊的；鮮為人知的；使隱晦）", "C": "indecipherable（無法辨認的、難以解讀的）", "D": "ornamental（裝飾用的）"}, "answer": "A", "expl": "Complex means intricate.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having many parts; complicated", "zh": "複雜的", "word": "complex"}, "B": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "C": {"pos": "adj.", "en": "impossible to read or understand", "zh": "無法辨認的；難以解讀的", "word": "indecipherable"}, "D": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: intricate web of relations", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The craft tradition depends on an _______ sequence of dyeing, drying, folding, and stitching that apprentices study for years.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The craft tradition depends on an _______ sequence of dyeing, drying, folding, and stitching that apprentices study for years.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這項工藝傳統依賴一套 _______ 的染色、晾乾、摺疊和縫製程序，學徒要花好幾年學習。", "opts": {"A": "obscure", "B": "elaborate", "C": "ornamental", "D": "indecipherable"}, "optsZh": {"A": "obscure（模糊的；鮮為人知的；使隱晦）", "B": "elaborate（精心製作的、複雜精細的）", "C": "ornamental（裝飾用的）", "D": "indecipherable（無法辨認的、難以解讀的）"}, "answer": "B", "expl": "Elaborate means intricate.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "B": {"pos": "adj.", "en": "having many carefully arranged parts or details", "zh": "精心製作的；複雜精細的", "word": "elaborate"}, "C": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}, "D": {"pos": "adj.", "en": "impossible to read or understand", "zh": "無法辨認的；難以解讀的", "word": "indecipherable"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: intricate web of relations", "vocab": true, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The coral reef supports a(n) _______ set of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationships<\/a> among algae, fish, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invertebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"invertebrate\" data-pos=\"n.\" data-en=\"an animal without a backbone\" data-zh=\"無脊椎動物\">invertebrates<\/a>, and ocean currents.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The coral reef supports a(n) _______ set of relationships among algae, fish, invertebrates, and ocean currents.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。珊瑚礁支撐著藻類、魚類、無脊椎動物與洋流之間一組 _______ 的關係。", "opts": {"A": "obscure", "B": "illegible", "C": "ornamental", "D": "intricate"}, "optsZh": {"A": "obscure（模糊的；鮮為人知的；使隱晦）", "B": "illegible（字跡難以辨認的）", "C": "ornamental（裝飾用的）", "D": "intricate（錯綜複雜的、精細的）"}, "answer": "D", "expl": "Intricate means made of many connected parts.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not well known; or difficult to understand", "zh": "晦澀的；鮮為人知的", "word": "obscure"}, "B": {"pos": "adj.", "en": "impossible or very hard to read", "zh": "字跡難以辨認的", "word": "illegible"}, "C": {"pos": "adj.", "en": "used for decoration rather than function", "zh": "裝飾用的", "word": "ornamental"}, "D": {"pos": "adj.", "en": "having many small parts connected in complex and detailed ways", "zh": "錯綜複雜的；精細的", "word": "intricate"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: latent versus active function", "vocab": true, "body": "Within baleen whale species, some individuals develop an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accessory\" target=\"_blank\" rel=\"noopener\" data-w=\"accessory\" data-pos=\"adj.\" data-en=\"extra; added to the main thing\" data-zh=\"附屬的；輔助的\">accessory<\/a> spleen—a seemingly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=functionless\" target=\"_blank\" rel=\"noopener\" data-w=\"functionless\" data-pos=\"adj.\" data-en=\"having no use or purpose\" data-zh=\"無功能的；沒有作用的\">functionless<\/a> formation of splenetic tissue outside the normal spleen. Given the formation’s greater <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prevalence\" target=\"_blank\" rel=\"noopener\" data-w=\"prevalence\" data-pos=\"n.\" data-en=\"how common something is\" data-zh=\"普遍程度；盛行率\">prevalence<\/a> among whales known to make deeper dives, some researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that its role isn’t ______; rather, the accessory spleen may actively support diving mechanisms.", "bodyPlain": "Within baleen whale species, some individuals develop an accessory spleen—a seemingly functionless formation of splenetic tissue outside the normal spleen. Given the formation’s greater prevalence among whales known to make deeper dives, some researchers hypothesize that its role isn’t ______; rather, the accessory spleen may actively support diving mechanisms.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "在鬚鯨物種中，有些個體會長出副脾——一種位於正常脾臟之外、看似沒有功能的脾組織。由於這種構造在潛得較深的鯨魚中較為常見，一些研究人員推測它的作用並非 ______；相反地，副脾可能會主動支援潛水機制。", "opts": {"A": "replicable", "B": "predetermined", "C": "operative", "D": "latent"}, "optsZh": {"A": "replicable（可重複驗證的）", "B": "predetermined（預先決定的）", "C": "operative（運作中的、有效的）", "D": "latent（潛在的、潛伏的）"}, "answer": "D", "expl": "'Rather' signals a contrast with 'actively support,' so the blank must mean inactive or hidden: latent.", "explZh": "rather 表示與「主動支援」形成對比，因此空格要填「潛伏的、不活躍的」意思：latent。", "defs": {"A": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}, "B": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}, "C": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}, "D": {"pos": "adj.", "en": "present but not yet visible, active, or developed", "zh": "潛在的；潛伏的", "word": "latent"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: latent versus active function", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Researchers once assumed the structure was _______ because no immediate purpose was visible, but new imaging suggests it helps regulate pressure.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Researchers once assumed the structure was _______ because no immediate purpose was visible, but new imaging suggests it helps regulate pressure.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。研究人員曾認為這個構造是 _______ 的，因為看不出任何直接用途，但新的影像顯示它有助於調節壓力。", "opts": {"A": "dormant", "B": "replicable", "C": "operative", "D": "predetermined"}, "optsZh": {"A": "dormant（休眠的；潛伏的）", "B": "replicable（可重複驗證的）", "C": "operative（運作中的、有效的）", "D": "predetermined（預先決定的）"}, "answer": "A", "expl": "Dormant means inactive or latent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not active now but able to become active later", "zh": "休眠的；蟄伏的", "word": "dormant"}, "B": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}, "C": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}, "D": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: latent versus active function", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The enzyme was thought to be _______ under normal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>; later <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiments<\/a> showed that it quietly initiates a repair process.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The enzyme was thought to be _______ under normal conditions; later experiments showed that it quietly initiates a repair process.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這種酵素曾被認為在正常情況下是 _______ 的；後來的實驗顯示，它會悄悄啟動一個修復過程。", "opts": {"A": "predetermined", "B": "replicable", "C": "latent", "D": "operative"}, "optsZh": {"A": "predetermined（預先決定的）", "B": "replicable（可重複驗證的）", "C": "latent（潛在的、潛伏的）", "D": "operative（運作中的、有效的）"}, "answer": "C", "expl": "Latent means present but not active or apparent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}, "B": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}, "C": {"pos": "adj.", "en": "present but not yet visible, active, or developed", "zh": "潛在的；潛伏的", "word": "latent"}, "D": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: latent versus active function", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The behavior looked _______ until field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> showed that it helped the animals conserve heat during cold nights.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The behavior looked _______ until field observations showed that it helped the animals conserve heat during cold nights.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這種行為看起來 _______，直到野外觀察顯示，它能幫助這些動物在寒冷的夜晚保存熱量。", "opts": {"A": "predetermined", "B": "inactive", "C": "operative", "D": "replicable"}, "optsZh": {"A": "predetermined（預先決定的）", "B": "inactive（不活躍的、靜止的）", "C": "operative（運作中的、有效的）", "D": "replicable（可重複驗證的）"}, "answer": "B", "expl": "Inactive captures latent/functionless.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}, "B": {"pos": "adj.", "en": "not doing anything; not working or functioning", "zh": "不活躍的；無作用的；靜止的", "word": "inactive"}, "C": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}, "D": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: latent versus active function", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The extra bone was long dismissed as _______; new evidence indicates that it anchors a small but important muscle.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The extra bone was long dismissed as _______; new evidence indicates that it anchors a small but important muscle.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這塊多出來的骨頭長期被視為 _______ 而不受重視；新證據顯示它固定著一條雖小卻重要的肌肉。", "opts": {"A": "replicable", "B": "predetermined", "C": "vestigial", "D": "operative"}, "optsZh": {"A": "replicable（可重複驗證的）", "B": "predetermined（預先決定的）", "C": "vestigial（殘存的、退化的）", "D": "operative（運作中的、有效的）"}, "answer": "C", "expl": "Vestigial means a leftover with little function.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}, "B": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}, "C": {"pos": "adj.", "en": "remaining from an earlier stage but no longer having a useful function", "zh": "退化的；殘留的；無功能的", "word": "vestigial"}, "D": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: latent versus active function", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The pigment appeared _______ in adult insects, but chemical tests revealed that it helps block ultraviolet light.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The pigment appeared _______ in adult insects, but chemical tests revealed that it helps block ultraviolet light.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且精確的字詞補全文句？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這種色素在成蟲身上看似 _______，但化學測試顯示它有助於阻擋紫外線。", "opts": {"A": "predetermined", "B": "replicable", "C": "operative", "D": "functionless"}, "optsZh": {"A": "predetermined（預先決定的）", "B": "replicable（可重複驗證的）", "C": "operative（運作中的、有效的）", "D": "functionless（無功能的）"}, "answer": "D", "expl": "Functionless matches the supposed latent role.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "decided or fixed in advance", "zh": "預先決定的；預定的", "word": "predetermined"}, "B": {"pos": "adj.", "en": "able to be repeated with the same results", "zh": "可重複的；可複製的", "word": "replicable"}, "C": {"pos": "adj.", "en": "working, functioning, or having an effect", "zh": "運作中的；有效的；起作用的", "word": "operative"}, "D": {"pos": "adj.", "en": "having no use or purpose", "zh": "無功能的；沒有作用的", "word": "functionless"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Main Purpose: invention of reCAPTCHA", "vocab": false, "body": "In 2007, computer scientist Luis von Ahn was working on converting printed books into a digital format. He found that some words were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distorted\" target=\"_blank\" rel=\"noopener\" data-w=\"distorted\" data-pos=\"adj.\" data-en=\"changed in shape so as to look unnatural or unclear\" data-zh=\"扭曲的；變形的\">distorted<\/a> enough that digital scanners couldn’t <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognize<\/a> them, but most humans could easily read them. Based on that finding, von Ahn invented a simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=security\" target=\"_blank\" rel=\"noopener\" data-w=\"security\" data-pos=\"n.\" data-en=\"protection against danger or attack\" data-zh=\"安全；保全\">security<\/a> test to keep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=automated\" target=\"_blank\" rel=\"noopener\" data-w=\"automated\" data-pos=\"adj.\" data-en=\"operated by machines without human control\" data-zh=\"自動化的\">automated<\/a> “bots” out of websites. The first version of the reCAPTCHA test asked users to type one known word and one of the many words scanners couldn’t recognize. Correct answers proved the users were humans and added data to the book-digitizing project.", "bodyPlain": "In 2007, computer scientist Luis von Ahn was working on converting printed books into a digital format. He found that some words were distorted enough that digital scanners couldn’t recognize them, but most humans could easily read them. Based on that finding, von Ahn invented a simple security test to keep automated “bots” out of websites. The first version of the reCAPTCHA test asked users to type one known word and one of the many words scanners couldn’t recognize. Correct answers proved the users were humans and added data to the book-digitizing project.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "2007 年，電腦科學家 Luis von Ahn 正在進行將印刷書籍轉換為數位格式的工作。他發現有些字扭曲到數位掃描器無法辨識，但大多數人卻能輕鬆讀出來。根據這項發現，von Ahn 發明了一種簡單的安全測試，用來阻擋自動化的「機器人程式」進入網站。第一版 reCAPTCHA 測試要求使用者輸入一個已知的字，以及一個掃描器無法辨識的眾多字詞之一。正確的答案證明使用者是人類，同時也為書籍數位化計畫增添了資料。", "opts": {"A": "To discuss von Ahn’s invention of reCAPTCHA", "B": "To explain how digital scanners work", "C": "To call attention to von Ahn’s book-digitizing project", "D": "To indicate how popular reCAPTCHA is"}, "optsZh": {"A": "討論 von Ahn 發明 reCAPTCHA 的經過", "B": "解釋數位掃描器如何運作", "C": "提醒人們注意 von Ahn 的書籍數位化計畫", "D": "指出 reCAPTCHA 有多受歡迎"}, "answer": "A", "expl": "The whole text explains how von Ahn came up with and designed the first reCAPTCHA test.", "explZh": "全文說明 von Ahn 如何想出並設計第一版 reCAPTCHA 測試。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Main Purpose: invention of reCAPTCHA", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園裡帶著花回來。敘述細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To summarize a conflict between two relatives", "B": "To explain why music has lost its importance", "C": "To argue that the characters should leave the house", "D": "To portray a setting and mood as characters prepare for an arrival"}, "optsZh": {"A": "概述兩位親戚之間的衝突", "B": "解釋為什麼音樂已失去其重要性", "C": "主張角色們應該離開這棟房子", "D": "在角色們為某人的到來做準備時，描繪場景與氣氛"}, "answer": "D", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Main Purpose: invention of reCAPTCHA", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To present an atmosphere of departure and possibility", "B": "To compare several forms of transportation", "C": "To criticize sailors for taking unnecessary risks", "D": "To list the technical features of a harbor"}, "optsZh": {"A": "呈現一種啟程與充滿可能性的氛圍", "B": "比較幾種交通方式", "C": "批評水手們冒不必要的風險", "D": "列出一座港口的技術特點"}, "answer": "A", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Main Purpose: invention of reCAPTCHA", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To contrast rural and urban customs", "B": "To describe a completed celebration from beginning to end", "C": "To depict preparations that reveal anticipation within a family", "D": "To explain why the family dislikes visitors"}, "optsZh": {"A": "對比鄉村與都市的風俗", "B": "從頭到尾描述一場已經結束的慶祝活動", "C": "描繪顯露出一家人期待之情的準備工作", "D": "解釋為什麼這家人不喜歡訪客"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Main Purpose: invention of reCAPTCHA", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；而是凸顯了上課前那些安靜的例行儀式。", "opts": {"A": "To describe the moments before a significant daily activity begins", "B": "To evaluate the quality of a school's curriculum", "C": "To argue that early classes should be canceled", "D": "To recount a student's entire academic career"}, "optsZh": {"A": "描述一項重要的日常活動開始前的時刻", "B": "評估一所學校課程的品質", "C": "主張應取消早上的課", "D": "敘述一名學生完整的求學經歷"}, "answer": "A", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Main Purpose: invention of reCAPTCHA", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To compare two different seasons", "B": "To establish a reflective mood before a character acts", "C": "To reveal the full contents of a letter", "D": "To give instructions for maintaining a garden"}, "optsZh": {"A": "比較兩個不同的季節", "B": "在角色採取行動之前營造一種沉思的氛圍", "C": "揭露一封信的完整內容", "D": "提供照顧花園的指示"}, "answer": "B", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Poetry Structure: extended personification of night", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Gwendolyn Bennett’s 1926 poem “Street Lamps in Early Spring.”<br><br>Night wears a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=garment\" target=\"_blank\" rel=\"noopener\" data-w=\"garment\" data-pos=\"n.\" data-en=\"a piece of clothing\" data-zh=\"衣服；服裝\">garment<\/a><br>All <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=velvet\" target=\"_blank\" rel=\"noopener\" data-w=\"velvet\" data-pos=\"n.\" data-en=\"a soft cloth with a thick smooth surface\" data-zh=\"絲絨；天鵝絨\">velvet<\/a> soft, all violet blue...<br>And over her face she draws a veil<br>As <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=shimmer\" target=\"_blank\" rel=\"noopener\" data-w=\"shimmer\" data-pos=\"v.\" data-en=\"to shine with a soft, unsteady light\" data-zh=\"閃爍；發出微光\">shimmering<\/a> fine as floating dew...<br>And here and there<br>In the black of her hair<br>The subtle hands of Night<br>Move slowly with their gem-starred light.", "bodyPlain": "The following text is adapted from Gwendolyn Bennett’s 1926 poem “Street Lamps in Early Spring.”\n\nNight wears a garment\nAll velvet soft, all violet blue...\nAnd over her face she draws a veil\nAs shimmering fine as floating dew...\nAnd here and there\nIn the black of her hair\nThe subtle hands of Night\nMove slowly with their gem-starred light.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "以下文字改編自 Gwendolyn Bennett 1926 年的詩作〈Street Lamps in Early Spring〉（早春的街燈）。\n夜穿上一件衣裳\n全然如絲絨般柔軟，全然是紫羅蘭般的藍……\n她在臉上拉起一層面紗\n細緻閃爍，宛如飄浮的露珠……\n而在這裡、在那裡\n在她烏黑的髮間\n夜那雙細膩的手\n帶著綴滿寶石星辰的光，緩緩移動。", "opts": {"A": "It presents alternating descriptions of night in a rural area and in a city.", "B": "It sketches an image of nightfall, then an image of sunrise.", "C": "It makes an extended comparison of night to a human being.", "D": "It portrays how night changes from one season of the year to the next."}, "optsZh": {"A": "它交替描寫鄉村地區與城市中的夜晚。", "B": "它先勾勒夜幕降臨的景象，再描繪日出的景象。", "C": "它把夜晚延伸比喻成一個人。", "D": "它描寫夜晚如何從一年中的某個季節變化到下一個季節。"}, "answer": "C", "expl": "Throughout the poem, Night wears a garment, draws a veil over her face, and has hair and hands—an extended comparison of night to a person.", "explZh": "整首詩中，「夜」穿著衣裳、在臉上罩上面紗，還有頭髮和雙手——把夜持續比喻成一個人。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Poetry Structure: extended personification of night", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍然所知甚少。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It states the study's final conclusion.", "B": "It identifies the uncertainty that motivated the study.", "C": "It describes how other researchers criticized the work.", "D": "It offers evidence that radar is always reliable."}, "optsZh": {"A": "它陳述這項研究的最終結論。", "B": "它指出促成這項研究的不確定之處。", "C": "它描述其他研究者如何批評這項研究。", "D": "它提供證據證明雷達永遠可靠。"}, "answer": "B", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Poetry Structure: extended personification of night", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一段考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著，這段文章討論一個研究團隊，他們在陶器中尋找化學特徵，卻只得出暫時性的結論。", "opts": {"A": "It shifts the discussion away from archaeology.", "B": "It summarizes the team's strongest result.", "C": "It defines the problem the later investigation attempts to address.", "D": "It contradicts the claim made in the first sentence."}, "optsZh": {"A": "它把討論從考古學轉移開來。", "B": "它概述該團隊最有力的研究結果。", "C": "它界定了後續研究試圖解決的問題。", "D": "它反駁了第一句提出的主張。"}, "answer": "C", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Poetry Structure: extended personification of night", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It proves that drought has no effect on plants.", "B": "It lists the materials used in the experiment.", "C": "It introduces a gap in knowledge that the experiment examines.", "D": "It gives a historical overview of plant classification."}, "optsZh": {"A": "它證明乾旱對植物沒有任何影響。", "B": "它列出實驗中使用的材料。", "C": "它引出實驗所要探究的知識空白。", "D": "它概述植物分類的歷史。"}, "answer": "C", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Poetry Structure: extended personification of night", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一篇文學分析開頭指出，某部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含好幾個象徵禁錮的意象。這段的其餘部分解釋了那些意象如何使先前的解讀變得複雜。", "opts": {"A": "It introduces an unrelated theme.", "B": "It provides biographical information about the novelist.", "C": "It summarizes the novel's publication history.", "D": "It raises a difficulty with a common interpretation."}, "optsZh": {"A": "它引入一個不相關的主題。", "B": "它提供這位小說家的生平資料。", "C": "它概述這部小說的出版歷史。", "D": "它指出一種常見詮釋的問題。"}, "answer": "D", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Poetry Structure: extended personification of night", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述本文的整體結構？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一篇科技文章首先說，自主水下載具可以繪製海床地圖。下一句解釋，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師正在為這些條件測試一套新的導航系統。", "opts": {"A": "It explains the limitation that the new system is meant to address.", "B": "It announces that the technology is already flawless.", "C": "It gives a personal anecdote about engineers.", "D": "It compares underwater vehicles with aircraft."}, "optsZh": {"A": "它說明新系統要解決的限制。", "B": "它宣稱這項技術已經完美無缺。", "C": "它講述一則關於工程師的個人軼事。", "D": "它比較水下載具與飛機。"}, "answer": "A", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Main Purpose: Tom's assurance about private play", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Jane Austen’s 1814 novel Mansfield Park. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=speaker\" target=\"_blank\" rel=\"noopener\" data-w=\"speaker\" data-pos=\"n.\" data-en=\"the voice that talks in a poem; a person who speaks\" data-zh=\"說話者；（詩中的）敘述者\">speaker<\/a>, Tom, is considering staging a play at home with a group of his friends and family.<br><br>We mean nothing but a little amusement among ourselves, just to vary the scene, and exercise our powers in something new. We want no <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, no publicity. We may be trusted, I think, in choosing some play most perfectly unexceptionable; and I can conceive no greater harm or danger to any of us in conversing in the elegant written <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a> of some respectable author than in chattering in words of our own.", "bodyPlain": "The following text is adapted from Jane Austen’s 1814 novel Mansfield Park. The speaker, Tom, is considering staging a play at home with a group of his friends and family.\n\nWe mean nothing but a little amusement among ourselves, just to vary the scene, and exercise our powers in something new. We want no audience, no publicity. We may be trusted, I think, in choosing some play most perfectly unexceptionable; and I can conceive no greater harm or danger to any of us in conversing in the elegant written language of some respectable author than in chattering in words of our own.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明本文的主要目的？", "bodyZh": "以下文字改編自 Jane Austen 1814 年的小說《Mansfield Park》（曼斯菲爾德莊園）。說話者 Tom 正在考慮和一群朋友及家人在家中演出一齣戲。\n我們只不過是想在自己人之間找點小樂子，換換氣氛，並在新的事物上發揮一下我們的才能。我們不要觀眾，也不要張揚。我想，在挑選一齣完全無可挑剔的劇本這件事上，我們是值得信任的；而且我實在想不出，以某位可敬作家優雅的書面語言交談，會比用我們自己的話閒聊，對我們任何人造成更大的傷害或危險。", "opts": {"A": "To offer Tom’s assurance that the play will be inoffensive and involve only a small number of people", "B": "To clarify that the play will not be performed in the manner Tom had originally intended", "C": "To elaborate on the idea that the people around Tom lack the skills to successfully stage a play", "D": "To assert that Tom believes the group performing the play will be able to successfully promote it"}, "optsZh": {"A": "表達 Tom 的保證：這齣戲不會冒犯任何人，而且只會有少數人參與", "B": "澄清這齣戲將不會以 Tom 原本打算的方式演出", "C": "進一步闡述 Tom 身邊的人缺乏成功上演一齣戲的能力", "D": "斷言 Tom 相信演出這齣戲的團體能成功地宣傳它"}, "answer": "A", "expl": "Tom says they want 'no audience, no publicity' and will choose a 'perfectly unexceptionable' play, assuring others it will be harmless and private.", "explZh": "Tom 說他們「不要觀眾、不要宣傳」，並會挑選一齣「無可挑剔」的戲，保證這齣戲無害且只在小圈子進行。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Main Purpose: Tom's assurance about private play", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園裡帶著花回來。敘述細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To explain why music has lost its importance", "C": "To argue that the characters should leave the house", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "在角色們為某人的到來做準備時，描繪場景與氣氛", "B": "解釋為什麼音樂已失去其重要性", "C": "主張角色們應該離開這棟房子", "D": "概述兩位親戚之間的衝突"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Main Purpose: Tom's assurance about private play", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose or main idea of the text?", "stemZh": "下列哪一項最能說明本文的主要目的或主旨？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To list the technical features of a harbor", "B": "To criticize sailors for taking unnecessary risks", "C": "To compare several forms of transportation", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "列出一座港口的技術特點", "B": "批評水手們冒不必要的風險", "C": "比較幾種交通方式", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Main Purpose: Tom's assurance about private play", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and th
