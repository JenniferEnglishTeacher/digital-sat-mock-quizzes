, stood for, or symbolized by", "zh": "由……代表；以……表現", "word": "represented by"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: handmade from natural materials", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The lutes displayed in the gallery were _______ walnut and goatskin by artisans who follow a centuries-old <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=apprenticeship\" target=\"_blank\" rel=\"noopener\" data-w=\"apprenticeship\" data-pos=\"n.\" data-en=\"a period of learning a skill by working with an expert\" data-zh=\"學徒制；學徒期\">apprenticeship<\/a> tradition.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The lutes displayed in the gallery were _______ walnut and goatskin by artisans who follow a centuries-old apprenticeship tradition.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。畫廊中展示的魯特琴是由遵循數百年學徒傳統的工匠 _______ 胡桃木和山羊皮。", "opts": {"A": "fashioned from", "B": "represented by", "C": "collected with", "D": "indicated by"}, "optsZh": {"A": "fashioned from（用…製成）", "B": "represented by（由…代表）", "C": "collected with（和…一起收集）", "D": "indicated by（由…指出）"}, "answer": "A", "expl": "Fashioned from means handmade from.", "explZh": "", "defs": {"A": {"pos": "adj. phr.", "en": "made or shaped out of a particular material", "zh": "用……製成的", "word": "fashioned from"}, "B": {"pos": "v. phr.", "en": "shown, stood for, or symbolized by", "zh": "由……代表；以……表現", "word": "represented by"}, "C": {"pos": "v. phr.", "en": "gathered together along with", "zh": "與……一起收集", "word": "collected with"}, "D": {"pos": "v. phr.", "en": "shown or pointed out by", "zh": "由……顯示；由……指出", "word": "indicated by"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: handmade from natural materials", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The quilts were _______ salvaged cotton and silk, each piece stitched by members of the cooperative rather than by machine.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The quilts were _______ salvaged cotton and silk, each piece stitched by members of the cooperative rather than by machine.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這些拼布被是 _______ 回收的棉布和絲綢，每一塊都由合作社的成員而非機器縫製。", "opts": {"A": "represented by", "B": "assembled from", "C": "indicated by", "D": "collected with"}, "optsZh": {"A": "represented by（由…代表）", "B": "assembled from（由…組裝而成）", "C": "indicated by（由…指出）", "D": "collected with（和…一起收集）"}, "answer": "B", "expl": "Assembled from means handmade from.", "explZh": "", "defs": {"A": {"pos": "v. phr.", "en": "shown, stood for, or symbolized by", "zh": "由……代表；以……表現", "word": "represented by"}, "B": {"pos": "adj. phr.", "en": "put together out of separate parts or materials", "zh": "由……組裝而成的", "word": "assembled from"}, "C": {"pos": "v. phr.", "en": "shown or pointed out by", "zh": "由……顯示；由……指出", "word": "indicated by"}, "D": {"pos": "v. phr.", "en": "gathered together along with", "zh": "與……一起收集", "word": "collected with"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: handmade from natural materials", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The sculptor&#x27;s small figures are _______ clay gathered near the riverbank and fired in outdoor kilns.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The sculptor's small figures are _______ clay gathered near the riverbank and fired in outdoor kilns.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位雕塑家的小雕像是 _______ 在河岸附近採集的黏土，並在戶外窯中燒製。", "opts": {"A": "indicated by", "B": "collected with", "C": "represented by", "D": "formed from"}, "optsZh": {"A": "indicated by（由…指出）", "B": "collected with（和…一起收集）", "C": "represented by（由…代表）", "D": "formed from（由…形成）"}, "answer": "D", "expl": "Formed from means handmade from.", "explZh": "", "defs": {"A": {"pos": "v. phr.", "en": "shown or pointed out by", "zh": "由……顯示；由……指出", "word": "indicated by"}, "B": {"pos": "v. phr.", "en": "gathered together along with", "zh": "與……一起收集", "word": "collected with"}, "C": {"pos": "v. phr.", "en": "shown, stood for, or symbolized by", "zh": "由……代表；以……表現", "word": "represented by"}, "D": {"pos": "adj. phr.", "en": "made or shaped out of a particular material", "zh": "由……形成的", "word": "formed from"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: persistent public-health effort", "vocab": true, "body": "Beginning in the 1950s, Navajo Nation <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=legislator\" target=\"_blank\" rel=\"noopener\" data-w=\"legislator\" data-pos=\"n.\" data-en=\"a member of a group that makes laws\" data-zh=\"議員；立法者\">legislator<\/a> Annie Dodge Wauneka <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continuously\" target=\"_blank\" rel=\"noopener\" data-w=\"continuously\" data-pos=\"adv.\" data-en=\"without stopping or interruption\" data-zh=\"持續不斷地\">continuously<\/a> worked to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=promote\" target=\"_blank\" rel=\"noopener\" data-w=\"promote\" data-pos=\"v.\" data-en=\"to encourage or support something so that it develops\" data-zh=\"推動；促進\">promote<\/a> public health; this _______ effort involved traveling throughout the vast Navajo homeland and writing a medical dictionary for speakers of Diné bizaad, the Navajo <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a>.", "bodyPlain": "Beginning in the 1950s, Navajo Nation legislator Annie Dodge Wauneka continuously worked to promote public health; this _______ effort involved traveling throughout the vast Navajo homeland and writing a medical dictionary for speakers of Diné bizaad, the Navajo language.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "從 1950 年代開始，Navajo Nation（納瓦荷族）的立法者 Annie Dodge Wauneka 持續不斷地推動公共衛生；這項 _______ 的努力包括走遍廣大的納瓦荷家園，並為說 Diné bizaad（納瓦荷語）的人編寫一部醫學辭典。", "opts": {"A": "impartial", "B": "offhand", "C": "persistent", "D": "mandatory"}, "optsZh": {"A": "impartial（公正的、不偏袒的）", "B": "offhand（隨便的、漫不經心的）", "C": "persistent（堅持不懈的、持續的）", "D": "mandatory（強制的、義務的）"}, "answer": "C", "expl": "Wauneka 'continuously worked' for decades, traveling widely and writing a dictionary, so her effort was persistent.", "explZh": "Wauneka 數十年來「持續不斷地」努力，走遍各地並編寫辭典，所以她的努力是堅持不懈的（persistent）。", "defs": {"A": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}, "B": {"pos": "adj.", "en": "done without much thought or care; casual", "zh": "隨便的；漫不經心的", "word": "offhand"}, "C": {"pos": "adj.", "en": "continuing firmly despite difficulty; lasting a long time", "zh": "堅持不懈的；持續的", "word": "persistent"}, "D": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: persistent public-health effort", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The organizer&#x27;s _______ campaign for safer clinics lasted for decades and included public lectures, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translations<\/a> of medical terms, and visits to remote towns.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The organizer's _______ campaign for safer clinics lasted for decades and included public lectures, translations of medical terms, and visits to remote towns.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位組織者爭取更安全診所的 _______ 運動持續了數十年，包括公開演講、醫學術語翻譯以及造訪偏遠城鎮。", "opts": {"A": "impartial", "B": "casual", "C": "mandatory", "D": "sustained"}, "optsZh": {"A": "impartial（公正的、不偏袒的）", "B": "casual（隨意的、漫不經心的）", "C": "mandatory（強制的、義務的）", "D": "sustained（持續的）"}, "answer": "D", "expl": "Sustained means persistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}, "B": {"pos": "adj.", "en": "relaxed and informal; not planned or required", "zh": "隨意的；非正式的；不經意的", "word": "casual"}, "C": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}, "D": {"pos": "adj.", "en": "continuing for a long time without stopping", "zh": "持續的；持久的", "word": "sustained"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: persistent public-health effort", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Although the reformer faced repeated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resistance\" target=\"_blank\" rel=\"noopener\" data-w=\"resistance\" data-pos=\"n.\" data-en=\"a force that slows or opposes movement\" data-zh=\"阻力；抵抗\">resistance<\/a>, her _______ advocacy eventually <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=persuade\" target=\"_blank\" rel=\"noopener\" data-w=\"persuade\" data-pos=\"v.\" data-en=\"to make someone agree or believe by giving reasons\" data-zh=\"說服\">persuaded<\/a> several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=district\" target=\"_blank\" rel=\"noopener\" data-w=\"district\" data-pos=\"n.\" data-en=\"an area of a country or city\" data-zh=\"選區；地區\">districts<\/a> to expand vaccination services.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Although the reformer faced repeated resistance, her _______ advocacy eventually persuaded several districts to expand vaccination services.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。雖然這位改革者一再遭遇抵制，她 _______ 的倡議最終說服了幾個地區擴大疫苗接種服務。", "opts": {"A": "casual", "B": "persistent", "C": "mandatory", "D": "impartial"}, "optsZh": {"A": "casual（隨意的、漫不經心的）", "B": "persistent（堅持不懈的、持續的）", "C": "mandatory（強制的、義務的）", "D": "impartial（公正的、不偏袒的）"}, "answer": "B", "expl": "Persistent means continuous and determined.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "relaxed and informal; not planned or required", "zh": "隨意的；非正式的；不經意的", "word": "casual"}, "B": {"pos": "adj.", "en": "continuing firmly despite difficulty; lasting a long time", "zh": "堅持不懈的；持續的", "word": "persistent"}, "C": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}, "D": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: persistent public-health effort", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The group&#x27;s _______ effort to document <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=endangered\" target=\"_blank\" rel=\"noopener\" data-w=\"endangered\" data-pos=\"adj.\" data-en=\"at risk of disappearing completely\" data-zh=\"瀕臨絕種的\">endangered<\/a> plants involved returning to the same mountain valleys every spring for twenty years.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The group's _______ effort to document endangered plants involved returning to the same mountain valleys every spring for twenty years.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這個團體記錄瀕危植物的 _______ 努力，包括二十年來每年春天都回到相同的山谷。", "opts": {"A": "casual", "B": "mandatory", "C": "tenacious", "D": "impartial"}, "optsZh": {"A": "casual（隨意的、漫不經心的）", "B": "mandatory（強制的、義務的）", "C": "tenacious（堅持不懈的；頑強的）", "D": "impartial（公正的、不偏袒的）"}, "answer": "C", "expl": "Tenacious means persistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "relaxed and informal; not planned or required", "zh": "隨意的；非正式的；不經意的", "word": "casual"}, "B": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}, "C": {"pos": "adj.", "en": "holding firmly to a goal and not giving up easily", "zh": "堅持不懈的；頑強的", "word": "tenacious"}, "D": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: persistent public-health effort", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The journalist&#x27;s _______ investigation continued even after officials refused interviews and archives <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temporarily\" target=\"_blank\" rel=\"noopener\" data-w=\"temporarily\" data-pos=\"adv.\" data-en=\"for a limited time only\" data-zh=\"暫時地\">temporarily<\/a> closed.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The journalist's _______ investigation continued even after officials refused interviews and archives temporarily closed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。即使官員拒絕受訪、檔案館暫時關閉，這位記者 _______ 的調查仍繼續進行。", "opts": {"A": "unrelenting", "B": "casual", "C": "impartial", "D": "mandatory"}, "optsZh": {"A": "unrelenting（不懈的；不鬆懈的）", "B": "casual（隨意的、漫不經心的）", "C": "impartial（公正的、不偏袒的）", "D": "mandatory（強制的、義務的）"}, "answer": "A", "expl": "Unrelenting means persistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "continuing without becoming weaker or stopping", "zh": "不懈的；不鬆懈的", "word": "unrelenting"}, "B": {"pos": "adj.", "en": "relaxed and informal; not planned or required", "zh": "隨意的；非正式的；不經意的", "word": "casual"}, "C": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}, "D": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: persistent public-health effort", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The nurse&#x27;s _______ work to improve prenatal care required both clinical expertise and repeated travel across isolated communities.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The nurse's _______ work to improve prenatal care required both clinical expertise and repeated travel across isolated communities.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位護理師改善產前照護的 _______ 工作，既需要臨床專業，也需要一再往返於偏遠社區之間。", "opts": {"A": "impartial", "B": "casual", "C": "steadfast", "D": "mandatory"}, "optsZh": {"A": "impartial（公正的、不偏袒的）", "B": "casual（隨意的、漫不經心的）", "C": "steadfast（堅定不移的）", "D": "mandatory（強制的、義務的）"}, "answer": "C", "expl": "Steadfast means persistent.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not favoring one side over another; fair", "zh": "公正的；不偏袒的", "word": "impartial"}, "B": {"pos": "adj.", "en": "relaxed and informal; not planned or required", "zh": "隨意的；非正式的；不經意的", "word": "casual"}, "C": {"pos": "adj.", "en": "firm and steady in purpose; not changing", "zh": "堅定不移的", "word": "steadfast"}, "D": {"pos": "adj.", "en": "required by law or rule; compulsory", "zh": "強制的；義務的", "word": "mandatory"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Text Function: oral history benefit", "vocab": false, "body": "Oral histories—whether they consist of interviews or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> of songs and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">stories<\/a>—can offer researchers a rich view of people’s everyday <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experiences<\/a>. For her book about coal mining communities in Kentucky during the twentieth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=century\" target=\"_blank\" rel=\"noopener\" data-w=\"century\" data-pos=\"n.\" data-en=\"a period of 100 years\" data-zh=\"世紀\">century<\/a>, Karida Brown therefore relied in part on interviews with coal miners and their families. <u>By doing so, she gained valuable insights into her subjects’ day-to-day lives.<\/u>", "bodyPlain": "Oral histories—whether they consist of interviews or recordings of songs and stories—can offer researchers a rich view of people’s everyday experiences. For her book about coal mining communities in Kentucky during the twentieth century, Karida Brown therefore relied in part on interviews with coal miners and their families. By doing so, she gained valuable insights into her subjects’ day-to-day lives.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "口述歷史——無論是訪談，還是歌曲與故事的錄音——都能讓研究者豐富地看見人們的日常經驗。因此，Karida Brown 在撰寫一本關於二十世紀肯塔基州煤礦社區的書時，有一部分仰賴對礦工及其家人的訪談。藉由這麼做，她對研究對象的日常生活獲得了寶貴的洞見。", "opts": {"A": "It provides a little-known geographical fact about Kentucky.", "B": "It argues that Karida Brown is an expert on United States politics.", "C": "It presents a major historical event that took place in the twentieth century.", "D": "It describes how Karida Brown benefited from incorporating oral history in her book."}, "optsZh": {"A": "它提供一個關於肯塔基州、鮮為人知的地理事實。", "B": "它主張 Karida Brown 是美國政治的專家。", "C": "它介紹一件發生在二十世紀的重大歷史事件。", "D": "它說明 Karida Brown 如何因為在書中納入口述歷史而獲益。"}, "answer": "D", "expl": "The underlined sentence says that by relying on interviews, Brown gained valuable insights into her subjects' daily lives—how she benefited from using oral history.", "explZh": "畫底線的句子說明 Brown 藉由訪談，對研究對象的日常生活獲得了寶貴洞見——也就是她如何因運用口述歷史而獲益。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Text Function: oral history benefit", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍然所知甚少。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It identifies the uncertainty that motivated the study.", "B": "It offers evidence that radar is always reliable.", "C": "It describes how other researchers criticized the work.", "D": "It states the study's final conclusion."}, "optsZh": {"A": "它指出促成這項研究的不確定之處。", "B": "它提供證據證明雷達永遠可靠。", "C": "它描述其他研究人員如何批評這項研究。", "D": "它陳述這項研究的最終結論。"}, "answer": "A", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Text Function: oral history benefit", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一段考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著，這段文章討論一個研究團隊，他們在陶器中尋找化學特徵，卻只得出暫時性的結論。", "opts": {"A": "It shifts the discussion away from archaeology.", "B": "It summarizes the team's strongest result.", "C": "It contradicts the claim made in the first sentence.", "D": "It defines the problem the later investigation attempts to address."}, "optsZh": {"A": "它把討論的焦點從考古學轉移開。", "B": "它概述這個團隊最有力的研究結果。", "C": "它反駁了第一句中的主張。", "D": "它界定了後續研究試圖處理的問題。"}, "answer": "D", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Text Function: oral history benefit", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It gives a historical overview of plant classification.", "B": "It introduces a gap in knowledge that the experiment examines.", "C": "It proves that drought has no effect on plants.", "D": "It lists the materials used in the experiment."}, "optsZh": {"A": "它概述了植物分類的歷史。", "B": "它引出實驗所要探究的知識缺口。", "C": "它證明乾旱對植物毫無影響。", "D": "它列出實驗中使用的材料。"}, "answer": "B", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Text Function: oral history benefit", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一篇文學分析開頭指出，某部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含好幾個象徵禁錮的意象。這段的其餘部分解釋了那些意象如何使先前的解讀變得複雜。", "opts": {"A": "It introduces an unrelated theme.", "B": "It summarizes the novel's publication history.", "C": "It raises a difficulty with a common interpretation.", "D": "It provides biographical information about the novelist."}, "optsZh": {"A": "它引入一個無關的主題。", "B": "它概述這部小說的出版歷史。", "C": "它提出一種常見詮釋所面臨的難題。", "D": "它提供這位小說家的生平資料。"}, "answer": "C", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Text Function: oral history benefit", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unpredictable\" target=\"_blank\" rel=\"noopener\" data-w=\"unpredictable\" data-pos=\"adj.\" data-en=\"impossible to know in advance\" data-zh=\"無法預測的\">unpredictable<\/a>. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一篇科技文章首先說，自主水下載具可以繪製海床地圖。下一句解釋，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師正在為這些條件測試一套新的導航系統。", "opts": {"A": "It compares underwater vehicles with aircraft.", "B": "It explains the limitation that the new system is meant to address.", "C": "It announces that the technology is already flawless.", "D": "It gives a personal anecdote about engineers."}, "optsZh": {"A": "它比較了水下載具與飛機。", "B": "它說明了新系統想要解決的限制。", "C": "它宣稱這項技術已經完美無缺。", "D": "它講述一則關於工程師的個人軼事。"}, "answer": "B", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Poetry Main Purpose: encourage child to embrace life", "vocab": false, "body": "The following text is from Georgia Douglas Johnson’s 1922 poem “Benediction.”<br><br>Go forth, my son,<br>Winged by my heart’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=desire\" target=\"_blank\" rel=\"noopener\" data-w=\"desire\" data-pos=\"n.\" data-en=\"a strong wish or want\" data-zh=\"渴望；願望\">desire<\/a>!<br>Great reaches, yet unknown,<br>Await<br>For your <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=possession\" target=\"_blank\" rel=\"noopener\" data-w=\"possession\" data-pos=\"n.\" data-en=\"the state of owning or having something\" data-zh=\"擁有；所有物\">possession<\/a>.<br>I may not, if I would,<br>Retrace the way with you,<br>My <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pilgrimage\" target=\"_blank\" rel=\"noopener\" data-w=\"pilgrimage\" data-pos=\"n.\" data-en=\"a long journey to a special or holy place\" data-zh=\"朝聖之旅\">pilgrimage<\/a> is through,<br>But life is calling you!", "bodyPlain": "The following text is from Georgia Douglas Johnson’s 1922 poem “Benediction.”\n\nGo forth, my son,\nWinged by my heart’s desire!\nGreat reaches, yet unknown,\nAwait\nFor your possession.\nI may not, if I would,\nRetrace the way with you,\nMy pilgrimage is through,\nBut life is calling you!", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主要目的？", "bodyZh": "以下文字出自 Georgia Douglas Johnson 1922 年的詩作〈Benediction〉（祝福）。\n去吧，我的兒子，\n乘著我內心的渴望為翼！\n遼闊的疆域，尚未為人所知，\n正等待著\n由你去擁有。\n即使我願意，我也不能\n與你一同重走這條路，\n我的朝聖之旅已經結束，\n但生命正在呼喚你！", "opts": {"A": "To express hope that a child will have the same accomplishments as his parent did", "B": "To suggest that raising a child involves many struggles", "C": "To warn a child that he will face many challenges throughout his life", "D": "To encourage a child to embrace the experiences life will offer"}, "optsZh": {"A": "表達希望孩子能擁有與其父母相同的成就", "B": "暗示養育孩子涉及許多艱辛", "C": "警告孩子他一生中將面臨許多挑戰", "D": "鼓勵一個孩子擁抱人生將帶給他的種種經歷"}, "answer": "D", "expl": "The speaker urges 'Go forth, my son' and says 'life is calling you,' encouraging the child to embrace the unknown experiences awaiting him.", "explZh": "說話者催促「去吧，我的兒子」，並說「生命正在召喚你」，鼓勵孩子去擁抱等待著他的未知經驗。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Poetry Main Purpose: encourage child to embrace life", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主要目的？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園裡帶著花回來。敘述細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To summarize a conflict between two relatives", "C": "To argue that the characters should leave the house", "D": "To explain why music has lost its importance"}, "optsZh": {"A": "在角色們準備迎接某人到來時，描繪場景與氣氛", "B": "概述兩位親戚之間的衝突", "C": "主張角色們應該離開這棟房子", "D": "解釋為什麼音樂已失去其重要性"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Poetry Main Purpose: encourage child to embrace life", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasizes<\/a> mist, movement, and the speaker&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=awareness\" target=\"_blank\" rel=\"noopener\" data-w=\"awareness\" data-pos=\"n.\" data-en=\"knowledge or understanding of a situation\" data-zh=\"意識；認知\">awareness<\/a> that the travelers are entering uncertain but promising <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主要目的？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To criticize sailors for taking unnecessary risks", "B": "To compare several forms of transportation", "C": "To list the technical features of a harbor", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "批評水手冒不必要的風險", "B": "比較幾種不同的交通方式", "C": "列出一座港口的技術特點", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Poetry Main Purpose: encourage child to embrace life", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主要目的？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To contrast rural and urban customs", "C": "To depict preparations that reveal anticipation within a family", "D": "To describe a completed celebration from beginning to end"}, "optsZh": {"A": "解釋為什麼這家人不喜歡訪客", "B": "對比鄉村與都市的風俗", "C": "描寫能顯露一家人期待之情的準備工作", "D": "從頭到尾描述一場已經結束的慶祝活動"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Poetry Main Purpose: encourage child to embrace life", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主要目的？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；而是凸顯了上課前那些安靜的例行儀式。", "opts": {"A": "To describe the moments before a significant daily activity begins", "B": "To evaluate the quality of a school's curriculum", "C": "To argue that early classes should be canceled", "D": "To recount a student's entire academic career"}, "optsZh": {"A": "描述一項重要的日常活動開始前的片刻", "B": "評估一所學校課程的品質", "C": "主張應該取消早上的課", "D": "敘述一名學生的整個求學歷程"}, "answer": "A", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Poetry Main Purpose: encourage child to embrace life", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主要目的？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To reveal the full contents of a letter", "B": "To establish a reflective mood before a character acts", "C": "To compare two different seasons", "D": "To give instructions for maintaining a garden"}, "optsZh": {"A": "揭露一封信的完整內容", "B": "在角色採取行動之前營造一種沉思的氛圍", "C": "比較兩個不同的季節", "D": "提供照料花園的說明"}, "answer": "B", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Function: setting illustrates mood", "vocab": false, "body": "The following text is from Edith Wharton’s 1905 novel The House of Mirth. Lily Bart and a companion are walking through a park.<br><br>Lily had no real intimacy with nature, but she had a passion for the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a> and could be keenly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sensitive\" target=\"_blank\" rel=\"noopener\" data-w=\"sensitive\" data-pos=\"adj.\" data-en=\"delicate; easily affected\" data-zh=\"敏感的；細緻的\">sensitive<\/a> to a scene which was the fitting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a> of her own sensations. <u>The landscape outspread below her seemed an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=enlargement\" target=\"_blank\" rel=\"noopener\" data-w=\"enlargement\" data-pos=\"n.\" data-en=\"the act of making something bigger; a bigger version\" data-zh=\"放大；擴大\">enlargement<\/a> of her present mood, and she found something of herself in its calmness, its breadth, its long free reaches.<\/u> On the nearer slopes the sugar-maples wavered like pyres of light; lower down was a massing of grey orchards, and here and there the lingering green of an oak-grove.", "bodyPlain": "The following text is from Edith Wharton’s 1905 novel The House of Mirth. Lily Bart and a companion are walking through a park.\n\nLily had no real intimacy with nature, but she had a passion for the appropriate and could be keenly sensitive to a scene which was the fitting background of her own sensations. The landscape outspread below her seemed an enlargement of her present mood, and she found something of herself in its calmness, its breadth, its long free reaches. On the nearer slopes the sugar-maples wavered like pyres of light; lower down was a massing of grey orchards, and here and there the lingering green of an oak-grove.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "以下文字出自 Edith Wharton 1905 年的小說《The House of Mirth》（歡樂之家）。Lily Bart 與一位同伴正走過一座公園。\nLily 與大自然並無真正的親密感，但她熱愛「合宜」之事，並能敏銳地感受那些恰好襯托她自身感受的景色。展開在她腳下的風景彷彿是她當下心境的放大，她在它的寧靜、遼闊與綿延自由的伸展中，找到了某種自己的影子。在較近的山坡上，糖楓像光的火堆般搖曳；再往下是一片灰色的果園，零星點綴著橡樹林尚未褪去的綠意。", "opts": {"A": "It creates a detailed image of the physical setting of the scene.", "B": "It establishes that a character is experiencing an internal conflict.", "C": "It makes an assertion that the next sentence then expands on.", "D": "It illustrates an idea that is introduced in the previous sentence."}, "optsZh": {"A": "它為場景的實體環境營造出細緻的畫面。", "B": "它確立了某個角色正經歷內心衝突。", "C": "它提出一個主張，接著由下一句加以延伸。", "D": "它舉例說明前一句所提出的想法。"}, "answer": "D", "expl": "The previous sentence says Lily is sensitive to scenery that fits her feelings; the underlined sentence shows this, as the landscape seems an 'enlargement of her present mood.'", "explZh": "前一句說 Lily 對符合自己感受的景色很敏感；畫底線的句子以「風景彷彿是她當下心情的放大」具體說明了這個想法。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Function: setting illustrates mood", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍然所知甚少。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It identifies the uncertainty that motivated the study.", "B": "It states the study's final conclusion.", "C": "It offers evidence that radar is always reliable.", "D": "It describes how other researchers criticized the work."}, "optsZh": {"A": "它指出促成這項研究的不確定之處。", "B": "它陳述這項研究的最終結論。", "C": "它提供證據證明雷達永遠可靠。", "D": "它描述其他研究人員如何批評這項研究。"}, "answer": "A", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Function: setting illustrates mood", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一段考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著，這段文章討論一個研究團隊，他們在陶器中尋找化學特徵，卻只得出暫時性的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It shifts the discussion away from archaeology.", "C": "It contradicts the claim made in the first sentence.", "D": "It summarizes the team's strongest result."}, "optsZh": {"A": "它界定了後續研究試圖處理的問題。", "B": "它把討論的焦點從考古學轉移開。", "C": "它反駁了第一句中的主張。", "D": "它概述這個團隊最有力的研究結果。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Function: setting illustrates mood", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about
