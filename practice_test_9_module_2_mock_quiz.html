=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Many performers learned songs from relatives.", "C": "The tradition is studied by scholars in several countries.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有些歌曲使用的韻律也出現在較古老的歐洲詩歌中。", "B": "許多表演者是向親戚學習歌曲的。", "C": "有好幾個國家的學者在研究這項傳統。", "D": "有幾首民謠包含了當地的歷史事件，以及不同族群持續接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Command of Evidence: support cultural-interaction folklore origin", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, table, graph, quotation, or study?", "stemZh": "哪一個選項最有效地運用文本、表格、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The table includes more than one year.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這項計畫在一個社區中進行。", "B": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "C": "這張表格包含不只一年的資料。", "D": "兩個城鎮都有一些志工。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: face-like attraction not only social adaptation", "vocab": false, "body": "Among social animals that care for their young, such as chickens, macaque monkeys, and humans, newborns appear to show an innate attraction to faces and face-like <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stimuli\" target=\"_blank\" rel=\"noopener\" data-w=\"stimuli\" data-pos=\"n.\" data-en=\"plural of stimulus; things that cause reactions\" data-zh=\"刺激物（複數）\">stimuli<\/a>. Elisabetta Versace and her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> used an image of three black dots arranged in the shape of eyes and a nose or mouth to test whether this trait also occurs in Testudo tortoises, which live alone and do not engage in parental care. They found that tortoise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hatchling\" target=\"_blank\" rel=\"noopener\" data-w=\"hatchling\" data-pos=\"n.\" data-en=\"a young animal that has just come out of its egg\" data-zh=\"剛孵化的幼體\">hatchlings<\/a> showed a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> preference for the image, suggesting that ______", "bodyPlain": "Among social animals that care for their young, such as chickens, macaque monkeys, and humans, newborns appear to show an innate attraction to faces and face-like stimuli. Elisabetta Versace and her colleagues used an image of three black dots arranged in the shape of eyes and a nose or mouth to test whether this trait also occurs in Testudo tortoises, which live alone and do not engage in parental care. They found that tortoise hatchlings showed a significant preference for the image, suggesting that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在會照顧幼崽的群居動物中，例如雞、獼猴和人類，新生兒似乎對臉孔與類似臉孔的刺激表現出與生俱來的吸引力。Elisabetta Versace 與同事使用一張由三個黑點排列成眼睛與鼻子或嘴巴形狀的圖像，來測試這種特徵是否也出現在 Testudo 屬陸龜身上；這種陸龜獨居生活，且不會照顧後代。他們發現剛孵化的陸龜對這張圖像表現出顯著的偏好，這顯示 ______", "opts": {"A": "face-like stimuli are likely perceived as harmless by newborns of social species that practice parental care but as threatening by newborns of solitary species without parental care.", "B": "researchers should not assume that an innate attraction to face-like stimuli is necessarily an adaptation related to social interaction or parental care.", "C": "researchers can assume that the attraction to face-like stimuli that is seen in social species that practice parental care is learned rather than innate.", "D": "newly hatched Testudo tortoises show a stronger preference for face-like stimuli than adult Testudo tortoises do."}, "optsZh": {"A": "類似臉孔的刺激很可能被有親代照顧的群居物種新生兒視為無害，卻被沒有親代照顧的獨居物種新生兒視為威脅。", "B": "研究人員不應假定，對類似臉孔刺激的先天吸引必然是一種與社會互動或親代照顧相關的適應。", "C": "研究人員可以假定，在有親代照顧的群居物種身上所見到對類似臉孔刺激的吸引，是後天習得而非與生俱來的。", "D": "剛孵化的 Testudo 陸龜比成年的 Testudo 陸龜更強烈地偏好類似臉孔的刺激。"}, "answer": "B", "expl": "Tortoises are solitary and give no parental care, yet their hatchlings still prefer face-like images, so the attraction may not be an adaptation for social life or parental care.", "explZh": "陸龜獨居且不照顧幼體，但牠們的幼龜仍偏好類似臉的圖像，所以這種吸引力未必是為了社交或親代照顧而產生的適應。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: face-like attraction not only social adaptation", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼之前數千年，就已經與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "all island plants descended from a single cultivated variety.", "B": "the plant probably reached the islands without human assistance.", "C": "human traders must have transported the seeds recently.", "D": "the island populations were domesticated before mainland populations."}, "optsZh": {"A": "所有島嶼植物都源自單一的栽培品種。", "B": "這種植物很可能是在沒有人類協助的情況下到達這些島嶼的。", "C": "人類商人必定是在最近才運送了這些種子。", "D": "島上族群比本土族群更早被馴化。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: face-like attraction not only social adaptation", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。有一種甲蟲同時分布在大陸海岸與一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到這座島之前很久，就已經與海岸族群分開，因此研究團隊推論 ______", "opts": {"A": "the beetles were domesticated by island communities.", "B": "humans carried the beetles to the island during early trade voyages.", "C": "the island beetles must be younger than the coastal beetles.", "D": "the beetles were likely introduced by natural dispersal rather than by humans."}, "optsZh": {"A": "這些甲蟲是被島上的社群馴化的。", "B": "人類在早期的貿易航行中把這些甲蟲帶到了島上。", "C": "島上的甲蟲必定比沿海的甲蟲年輕。", "D": "這些甲蟲很可能是透過自然擴散而非人類引進的。"}, "answer": "D", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: face-like attraction not only social adaptation", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島的，但對相關口述傳統的比較顯示，這首歌的核心詞句在遷徙發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "the song was probably not introduced to the archipelago by that migration.", "B": "all versions of the song are identical.", "C": "the song could not have changed after the migration.", "D": "the migration must have begun earlier than any other human movement."}, "optsZh": {"A": "這首歌很可能不是藉由那次遷徙傳入這個群島的。", "B": "這首歌的所有版本都完全相同。", "C": "這首歌在遷徙之後不可能有所改變。", "D": "這次遷徙必定比其他任何人類遷移都更早開始。"}, "answer": "A", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: face-like attraction not only social adaptation", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。研究一座偏遠島嶼上某種作物的植物學家發現，該島的品種早在人類定居此島之前數萬年，就已經與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "the crop was first domesticated on the island.", "B": "mainland farmers acquired the crop from island communities.", "C": "human settlement probably did not account for the plant's original arrival on the island.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "這種作物最初是在島上被馴化的。", "B": "本土農民是從島上的社群取得這種作物的。", "C": "人類定居很可能不是這種植物最初來到該島的原因。", "D": "島上的品種必定與本土的野生植物在基因上完全相同。"}, "answer": "C", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: face-like attraction not only social adaptation", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。研究人員原本以為，一種淡水螺是在人們開始在一連串湖泊間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已經彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "the snails likely spread through an earlier nonhuman mechanism.", "C": "boats probably explain every modern snail population.", "D": "human activity made the populations genetically identical."}, "optsZh": {"A": "在開始划船活動之前，這些湖泊中沒有蝸牛。", "B": "這些蝸牛很可能是透過更早的非人為機制擴散的。", "C": "船隻很可能可以解釋每一個現代蝸牛族群的存在。", "D": "人類活動使這些族群在基因上完全相同。"}, "answer": "B", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: aptamer specificity in pear juice", "vocab": false, "body": "Aptamers—<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthetic\" target=\"_blank\" rel=\"noopener\" data-w=\"synthetic\" data-pos=\"adj.\" data-en=\"made artificially, not natural\" data-zh=\"合成的；人造的\">synthetic<\/a> DNA or RNA <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molecule\" target=\"_blank\" rel=\"noopener\" data-w=\"molecule\" data-pos=\"n.\" data-en=\"the smallest unit of a substance, made of atoms\" data-zh=\"分子\">molecules<\/a> that bind to target molecules—can be used to test for foodborne bacterial pathogens, though their specificity (the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=probability\" target=\"_blank\" rel=\"noopener\" data-w=\"probability\" data-pos=\"n.\" data-en=\"how likely it is that something will happen\" data-zh=\"機率；可能性\">probability<\/a> of returning a negative result in the absence of the focal pathogen) in real-world foods has been unclear. Sandeep Somvanshi et al. fabricated test paper <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporating<\/a> aptamers targeting strain O157:H7 of the bacteria Escherichia coli; the paper shifts from pink to purple as the aptamers bind to target molecules. Somvanshi et al. tested the paper in store-bought pear juice they treated with E. coli O157:H7, other strains of E. coli, or other bacteria species. Following exposure, the paper from the O157:H7 test was purple while papers from the other tests were pink, suggesting that _______", "bodyPlain": "Aptamers—synthetic DNA or RNA molecules that bind to target molecules—can be used to test for foodborne bacterial pathogens, though their specificity (the probability of returning a negative result in the absence of the focal pathogen) in real-world foods has been unclear. Sandeep Somvanshi et al. fabricated test paper incorporating aptamers targeting strain O157:H7 of the bacteria Escherichia coli; the paper shifts from pink to purple as the aptamers bind to target molecules. Somvanshi et al. tested the paper in store-bought pear juice they treated with E. coli O157:H7, other strains of E. coli, or other bacteria species. Following exposure, the paper from the O157:H7 test was purple while papers from the other tests were pink, suggesting that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "適體（aptamer）——能與目標分子結合的人工合成 DNA 或 RNA 分子——可用來檢測食源性致病細菌，但它們在真實食品中的特異性（在目標病原體不存在時回報陰性結果的機率）一直不明確。Sandeep Somvanshi 等人製作了含有適體的試紙，這些適體鎖定大腸桿菌（Escherichia coli）的 O157:H7 菌株；當適體與目標分子結合時，試紙會從粉紅色變成紫色。Somvanshi 等人在市售梨汁中測試這種試紙，他們在梨汁中分別加入 E. coli O157:H7、其他 E. coli 菌株或其他細菌物種。接觸之後，O157:H7 測試的試紙呈紫色，而其他測試的試紙則呈粉紅色，這顯示 _______", "opts": {"A": "aptamer-based tests in real-world foods are more likely to show a high degree of specificity if the focal pathogen is E. coli O157:H7 than if the focal pathogen is another strain of E. coli or another species.", "B": "uncertainty about the specificity of aptamer-based tests for pathogens in real-world foods may be due to the similarity between E. coli O157:H7 and other E. coli strains.", "C": "the specificity of the tests in a real-world food was unaffected by the aptamers’ tendency to bind to different strains of E. coli.", "D": "the aptamers successfully bound to E. coli O157:H7 and the tests displayed a high degree of specificity in a real-world food."}, "optsZh": {"A": "在真實食品中，若目標病原體是 E. coli O157:H7，以適體為基礎的檢測比目標病原體是其他 E. coli 菌株或其他物種時，更可能表現出高度特異性。", "B": "以適體為基礎的檢測在真實食品中檢測病原體的特異性之所以不確定，可能是因為 E. coli O157:H7 和其他 E. coli 菌株很相似。", "C": "這些檢測在真實食品中的特異性，並未受到適體會與不同 E. coli 菌株結合的傾向所影響。", "D": "適體成功地與 E. coli O157:H7 結合，而且這些檢測在真實食品中展現出高度特異性。"}, "answer": "D", "expl": "The paper turned purple only for O157:H7 and stayed pink for other bacteria in real pear juice, showing the aptamers bound their target and the test was highly specific.", "explZh": "在真實的梨汁中，試紙只有遇到 O157:H7 才變紫，遇到其他細菌則維持粉紅色，顯示適體成功與目標結合，而且檢測具有高度特異性。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: aptamer specificity in pear juice", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群早在人類抵達任何一座島嶼之前數千年，就已經與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "the island populations were domesticated before mainland populations.", "B": "the plant probably reached the islands without human assistance.", "C": "all island plants descended from a single cultivated variety.", "D": "human traders must have transported the seeds recently."}, "optsZh": {"A": "島上族群比本土族群更早被馴化。", "B": "這種植物很可能是在沒有人類協助的情況下到達這些島嶼的。", "C": "所有島嶼植物都源自單一的栽培品種。", "D": "人類商人必定是在最近才運送了這些種子。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: aptamer specificity in pear juice", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。有一種甲蟲同時分布在大陸海岸與一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到這座島之前很久，就已經與海岸族群分開，因此研究團隊推論 ______", "opts": {"A": "humans carried the beetles to the island during early trade voyages.", "B": "the island beetles must be younger than the coastal beetles.", "C": "the beetles were likely introduced by natural dispersal rather than by humans.", "D": "the beetles were domesticated by island communities."}, "optsZh": {"A": "人類在早期的貿易航行中把這些甲蟲帶到了島上。", "B": "島上的甲蟲必定比沿海的甲蟲年輕。", "C": "這些甲蟲很可能是透過自然擴散而非人類引進的。", "D": "這些甲蟲是被島上的社群馴化的。"}, "answer": "C", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: aptamer specificity in pear juice", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。語言學家曾經提出，一首儀式歌曲是透過近期的遷徙傳入某個群島的，但對相關口述傳統的比較顯示，這首歌的核心詞句在遷徙發生之前就已經形成。因此，語言學家得出結論：______", "opts": {"A": "the song could not have changed after the migration.", "B": "the song was probably not introduced to the archipelago by that migration.", "C": "the migration must have begun earlier than any other human movement.", "D": "all versions of the song are identical."}, "optsZh": {"A": "這首歌在遷徙之後不可能有所改變。", "B": "這首歌很可能不是藉由那次遷徙傳入這個群島的。", "C": "這次遷徙必定比其他任何人類遷移都更早開始。", "D": "這首歌的所有版本都完全相同。"}, "answer": "B", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: aptamer specificity in pear juice", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。研究一座偏遠島嶼上某種作物的植物學家發現，該島的品種早在人類定居此島之前數萬年，就已經與其大陸近親分化。這項證據使他們主張 ______", "opts": {"A": "human settlement probably did not account for the plant's original arrival on the island.", "B": "mainland farmers acquired the crop from island communities.", "C": "the crop was first domesticated on the island.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "人類定居很可能不是這種植物最初來到該島的原因。", "B": "本土農民是從島上的社群取得這種作物的。", "C": "這種作物最初是在島上被馴化的。", "D": "島上的品種必定與本土的野生植物在基因上完全相同。"}, "answer": "A", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: aptamer specificity in pear juice", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪個選項最合乎邏輯地完成這段文字？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。研究人員原本以為，一種淡水螺是在人們開始在一連串湖泊間移動船隻時，才抵達這些湖泊的。然而，基因資料顯示，這些湖泊族群早在划船活動開始之前很久，就已經彼此分離。因此，研究人員得出結論：______", "opts": {"A": "boats probably explain every modern snail population.", "B": "human activity made the populations genetically identical.", "C": "the lakes did not contain snails until boating began.", "D": "the snails likely spread through an earlier nonhuman mechanism."}, "optsZh": {"A": "船隻很可能可以解釋每一個現代蝸牛族群的存在。", "B": "人類活動使這些族群在基因上完全相同。", "C": "在開始划船活動之前，這些湖泊中沒有蝸牛。", "D": "這些蝸牛很可能是透過更早的非人為機制擴散的。"}, "answer": "D", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Grammar: possessive plural antecedent their", "vocab": false, "body": "British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=announce\" target=\"_blank\" rel=\"noopener\" data-w=\"announce\" data-pos=\"v.\" data-en=\"to make something known publicly\" data-zh=\"宣布\">announcing<\/a> the double helix <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> of DNA, but it is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=misleading\" target=\"_blank\" rel=\"noopener\" data-w=\"misleading\" data-pos=\"adj.\" data-en=\"giving a wrong idea or impression\" data-zh=\"誤導的\">misleading<\/a> to say that Watson and Crick discovered the double helix. _______ findings were based on a famous X-ray image of DNA fibers, “Photo 51,” developed by X-ray <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=crystallographer\" target=\"_blank\" rel=\"noopener\" data-w=\"crystallographer\" data-pos=\"n.\" data-en=\"a scientist who studies the structure of crystals, often using X-rays\" data-zh=\"晶體學家\">crystallographer<\/a> Rosalind Franklin and her graduate student Raymond Gosling.", "bodyPlain": "British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper announcing the double helix structure of DNA, but it is misleading to say that Watson and Crick discovered the double helix. _______ findings were based on a famous X-ray image of DNA fibers, “Photo 51,” developed by X-ray crystallographer Rosalind Franklin and her graduate student Raymond Gosling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "英國科學家 James Watson 和 Francis Crick 獲得諾貝爾獎，部分原因是他們 1953 年發表、宣布 DNA 雙螺旋結構的論文，但說 Watson 和 Crick 發現了雙螺旋是會誤導人的。_______ 發現是根據一張著名的 DNA 纖維 X 光影像「Photo 51」（51 號照片），這張影像是由 X 光晶體學家 Rosalind Franklin 和她的研究生 Raymond Gosling 所拍攝沖洗出來的。", "opts": {"A": "They’re", "B": "It’s", "C": "Their", "D": "Its"}, "optsZh": {"A": "They’re（they are 的縮寫 → 不是所有格：錯誤）", "B": "It’s（it is 的縮寫 → 不是所有格，且單數不符合 Watson and Crick：錯誤）", "C": "Their（他們的，複數所有格）", "D": "Its（它的，單數所有格）"}, "answer": "C", "expl": "The blank needs a plural possessive referring to Watson and Crick: 'Their findings.'", "explZh": "空格需要指涉 Watson and Crick 的複數所有格：Their findings（他們的發現）。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Grammar: possessive plural antecedent their", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "to publish", "B": "having published", "C": "published", "D": "publishing"}, "optsZh": {"A": "to publish（不定詞 → 句子缺少主要動詞，錯誤）", "B": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "C": "published（簡單過去式：主要動詞，正確）", "D": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）"}, "answer": "C", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Grammar: possessive plural antecedent their", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device", "B": "device:", "C": "device--", "D": "device,"}, "optsZh": {"A": "device（裝置；設備）", "B": "device:（冒號 → 不當隔開主詞與動詞，錯誤）", "C": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "D": "device,（逗號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "A", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Grammar: possessive plural antecedent their", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "that", "B": "this", "C": "them", "D": "it"}, "optsZh": {"A": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "C": "them（他們；複數受格）", "D": "it（它；單數代名詞）"}, "answer": "C", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Grammar: possessive plural antecedent their", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family,", "B": "family and", "C": "family, and", "D": "family"}, "optsZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family and（無標點＋and）", "C": "family, and（逗號＋and）", "D": "family（無標點）"}, "answer": "D", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Grammar: possessive plural antecedent their", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這艘擱淺的研究船花了三天才 _______ 它的船身已卡在兩片冰層之間。", "opts": {"A": "free, in part because,", "B": "free. In part because", "C": "free in part because", "D": "free, in part because:"}, "optsZh": {"A": "free, in part because,（逗號＋in part because＋逗號）", "B": "free. In part because（句號，以 In part because 另起一句）", "C": "free in part because（無標點，直接接原因子句）", "D": "free, in part because:（逗號＋in part because＋冒號）"}, "answer": "B", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Grammar: infinitive of purpose", "vocab": false, "body": "In the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> novel The Surrender Tree, Cuban American author Margarita Engle uses <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=poetry\" target=\"_blank\" rel=\"noopener\" data-w=\"poetry\" data-pos=\"n.\" data-en=\"poems in general\" data-zh=\"詩\">poetry<\/a> rather than <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prose\" target=\"_blank\" rel=\"noopener\" data-w=\"prose\" data-pos=\"n.\" data-en=\"ordinary written language, not poetry\" data-zh=\"散文；白話文\">prose<\/a> _______ the true <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">story<\/a> of Cuban folk hero Rosa La Bayamesa.", "bodyPlain": "In the historical novel The Surrender Tree, Cuban American author Margarita Engle uses poetry rather than prose _______ the true story of Cuban folk hero Rosa La Bayamesa.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在歷史小說《The Surrender Tree》（投降樹）中，古巴裔美國作家 Margarita Engle 使用詩而非散文 _______ 古巴民間英雄 Rosa La Bayamesa 的真實故事。", "opts": {"A": "tells", "B": "told", "C": "is telling", "D": "to tell"}, "optsZh": {"A": "tells（限定動詞 → 句中已有主要動詞 uses，無法再接：錯誤）", "B": "told（過去式／過去分詞 → 無法表達目的，結構不通：錯誤）", "C": "is telling（限定動詞 → 句中已有主要動詞 uses，無法再接：錯誤）", "D": "to tell（不定詞表目的：用詩來「講述」故事：正確）"}, "answer": "D", "expl": "The sentence already has a main verb ('uses'); the infinitive 'to tell' expresses the purpose of using poetry.", "explZh": "句子已經有主要動詞 uses；不定詞 to tell 表示使用詩的目的。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Grammar: infinitive of purpose", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。2022 年，這個研究團隊 ______ 一篇論文，描述一種新發現的酵素，這種酵素能幫助某些細菌在強酸性的水中生存。", "opts": {"A": "having published", "B": "publishing", "C": "to publish", "D": "published"}, "optsZh": {"A": "having published（完成式分詞 → 句子缺少主要動詞，錯誤）", "B": "publishing（現在分詞 → 句子缺少主要動詞，錯誤）", "C": "to publish（不定詞 → 句子缺少主要動詞，錯誤）", "D": "published（簡單過去式：主要動詞，正確）"}, "answer": "D", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Grammar: infinitive of purpose", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來只是裝飾品，但轉動它的把手時，______ 內部的針腳會撥動細小的金屬簧片，奏出旋律。", "opts": {"A": "device", "B": "device--", "C": "device:", "D": "device,"}, "optsZh": {"A": "device（裝置；設備）", "B": "device--（破折號 → 不當隔開主詞與動詞，錯誤）", "C": "device:（冒號 → 不當隔開主詞與動詞，錯誤）", "D": "device,（逗號 → 不當隔開主詞與動詞，錯誤）"}, "answer": "A", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Grammar: infinitive of purpose", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=calculator\" target=\"_blank\" rel=\"noopener\" data-w=\"calculator\" data-pos=\"n.\" data-en=\"a machine used to do mathematical operations\" data-zh=\"計算機\">calculators<\/a> first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當袖珍計算機最初出現在教室裡時，有些老師拒絕使用這些裝置，因為他們認為 ______ 會使學生無法專心學習算術。", "opts": {"A": "this", "B": "that", "C": "them", "D": "it"}, "optsZh": {"A": "this（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "B": "that（單數指示代名詞 → 指涉複數 devices 時數不一致，錯誤）", "C": "them（他們；複數受格）", "D": "it（它；單數代名詞）"}, "answer": "C", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Grammar: infinitive of purpose", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常引領讀者認識拉丁美洲文學中的魔幻寫實主義。", "opts": {"A": "family and", "B": "family,", "C": "family, and", "D": "family"}, "optsZh": {"A": "family and（無標點＋and）", "B": "family,（逗號，結束以 a family saga 開頭的同位語）", "C": "family, and（逗號＋and）", "D": "family（無標點）"}, "answer": "D", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Grammar: infinitive of purpose", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data
