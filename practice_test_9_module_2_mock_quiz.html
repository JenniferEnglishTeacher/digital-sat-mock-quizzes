the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It lists the materials used in the experiment.", "B": "It gives a historical overview of plant classification.", "C": "It proves that drought has no effect on plants.", "D": "It introduces a gap in knowledge that the experiment examines."}, "optsZh": {"A": "它列出實驗中使用的材料。", "B": "它概述了植物分類的歷史。", "C": "它證明乾旱對植物毫無影響。", "D": "它引出實驗所要探究的知識缺口。"}, "answer": "D", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Text Function: setting illustrates mood", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一篇文學分析開頭指出，某部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含好幾個象徵禁錮的意象。這段的其餘部分解釋了那些意象如何使先前的解讀變得複雜。", "opts": {"A": "It provides biographical information about the novelist.", "B": "It raises a difficulty with a common interpretation.", "C": "It introduces an unrelated theme.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它提供這位小說家的生平資料。", "B": "它提出一種常見詮釋所面臨的難題。", "C": "它引入一個無關的主題。", "D": "它概述這部小說的出版歷史。"}, "answer": "B", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Text Function: setting illustrates mood", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unpredictable\" target=\"_blank\" rel=\"noopener\" data-w=\"unpredictable\" data-pos=\"adj.\" data-en=\"impossible to know in advance\" data-zh=\"無法預測的\">unpredictable<\/a>. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一篇科技文章首先說，自主水下載具可以繪製海床地圖。下一句解釋，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師正在為這些條件測試一套新的導航系統。", "opts": {"A": "It gives a personal anecdote about engineers.", "B": "It compares underwater vehicles with aircraft.", "C": "It explains the limitation that the new system is meant to address.", "D": "It announces that the technology is already flawless."}, "optsZh": {"A": "它講述一則關於工程師的個人軼事。", "B": "它比較了水下載具與飛機。", "C": "它說明了新系統想要解決的限制。", "D": "它宣稱這項技術已經完美無缺。"}, "answer": "C", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Text Function: mammoth range hypothesis", "vocab": false, "body": "<u>Individual elephants and Arctic herbivores such as caribou tend to have fixed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geographic\" target=\"_blank\" rel=\"noopener\" data-w=\"geographic\" data-pos=\"adj.\" data-en=\"relating to the physical features or location of places\" data-zh=\"地理的\">geographic<\/a> ranges throughout their lifetimes, which had prompted some researchers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=speculate\" target=\"_blank\" rel=\"noopener\" data-w=\"speculate\" data-pos=\"v.\" data-en=\"to guess about something without having all the facts\" data-zh=\"推測；臆測\">speculate<\/a> that the Arctic woolly mammoth, an extinct elephantid, might have exhibited similar behavior.<\/u> Mammoth tusks grew in sequential layers, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporating<\/a> ingested minerals and organics, and so each ivory stratum reflects the ratio of strontium isotopes (87Sr/86Sr) in the local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>; thus, the sequence of strata shows where the animal roamed during life. Recent analysis of the strontium ratios in the strata of one Arctic woolly mammoth tusk in relation to the geographic distribution of strontium ratios in the environment shows the animal’s range begin to expand as it reached sexual maturity, only to contract again in its final 1.5 years.", "bodyPlain": "Individual elephants and Arctic herbivores such as caribou tend to have fixed geographic ranges throughout their lifetimes, which had prompted some researchers to speculate that the Arctic woolly mammoth, an extinct elephantid, might have exhibited similar behavior. Mammoth tusks grew in sequential layers, incorporating ingested minerals and organics, and so each ivory stratum reflects the ratio of strontium isotopes (87Sr/86Sr) in the local environment; thus, the sequence of strata shows where the animal roamed during life. Recent analysis of the strontium ratios in the strata of one Arctic woolly mammoth tusk in relation to the geographic distribution of strontium ratios in the environment shows the animal’s range begin to expand as it reached sexual maturity, only to contract again in its final 1.5 years.", "stem": "Which choice best describes the function of the underlined statement in the text as a whole?", "stemZh": "下列哪一個選項最能說明畫底線的敘述在全文中的作用？", "bodyZh": "個別的大象與北極草食動物（例如馴鹿）往往終其一生都有固定的地理活動範圍，這曾促使一些研究者推測，北極長毛象——一種已滅絕的象科動物——可能也有類似的行為。長毛象的象牙是一層層依序生長的，會納入攝取的礦物質與有機物，因此每一層象牙都反映出當地環境中鍶同位素的比例（87Sr/86Sr）；因此，這些層次的順序顯示出這隻動物生前曾在哪裡活動。最近一項研究分析了一根北極長毛象象牙各層的鍶比例，並與環境中鍶比例的地理分布對照，結果顯示這隻動物的活動範圍在牠達到性成熟時開始擴大，卻在牠生命最後 1.5 年又縮小。", "opts": {"A": "It discusses a characteristic shared by certain animals in order to explain why researchers raised a possibility that turned out not to be supported by data described later in the text.", "B": "It illustrates a pattern of behavior among certain animals in order to present a theory about exceptions to that pattern that is weakened by a finding described later in the text.", "C": "It describes a similarity in the behavior of certain animals in order to show why a method described later in the text did not reveal whether another animal also showed that behavior.", "D": "It introduces a trait shared by certain animals in order to contextualize a hypothesis about the origin of that trait that is advanced later in the text."}, "optsZh": {"A": "它討論某些動物共有的一項特徵，以說明為什麼研究者會提出一種可能性，而這種可能性後來並未得到文中稍後所述資料的支持。", "B": "它說明某些動物的一種行為模式，以提出一個關於該模式例外情況的理論，而這個理論被文中稍後所述的一項發現削弱。", "C": "它描述某些動物在行為上的相似之處，以說明為什麼文中稍後描述的一種方法無法揭示另一種動物是否也有這種行為。", "D": "它介紹某些動物共有的一項特徵，為文中稍後提出的、關於該特徵起源的假說提供背景。"}, "answer": "A", "expl": "The underlined statement says elephants and caribou have fixed ranges, explaining why researchers guessed mammoths did too; the tusk data later show the mammoth's range expanded and contracted, so the idea wasn't supported.", "explZh": "畫底線的敘述說大象和馴鹿有固定的活動範圍，說明研究者為何推測長毛象也是如此；但後文的象牙資料顯示長毛象的範圍會擴大再縮小，因此這個推測未獲支持。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Text Function: mammoth range hypothesis", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍然所知甚少。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It states the study's final conclusion.", "B": "It offers evidence that radar is always reliable.", "C": "It describes how other researchers criticized the work.", "D": "It identifies the uncertainty that motivated the study."}, "optsZh": {"A": "它陳述這項研究的最終結論。", "B": "它提供證據證明雷達永遠可靠。", "C": "它描述其他研究人員如何批評這項研究。", "D": "它指出促成這項研究的不確定之處。"}, "answer": "D", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Text Function: mammoth range hypothesis", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。一段考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著，這段文章討論一個研究團隊，他們在陶器中尋找化學特徵，卻只得出暫時性的結論。", "opts": {"A": "It shifts the discussion away from archaeology.", "B": "It contradicts the claim made in the first sentence.", "C": "It defines the problem the later investigation attempts to address.", "D": "It summarizes the team's strongest result."}, "optsZh": {"A": "它把討論的焦點從考古學轉移開。", "B": "它反駁了第一句中的主張。", "C": "它界定了後續研究試圖處理的問題。", "D": "它概述這個團隊最有力的研究結果。"}, "answer": "C", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Text Function: mammoth range hypothesis", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiment<\/a> that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It lists the materials used in the experiment.", "B": "It introduces a gap in knowledge that the experiment examines.", "C": "It gives a historical overview of plant classification.", "D": "It proves that drought has no effect on plants."}, "optsZh": {"A": "它列出實驗中使用的材料。", "B": "它引出實驗所要探究的知識缺口。", "C": "它概述了植物分類的歷史。", "D": "它證明乾旱對植物毫無影響。"}, "answer": "B", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Text Function: mammoth range hypothesis", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一篇文學分析開頭指出，某部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含好幾個象徵禁錮的意象。這段的其餘部分解釋了那些意象如何使先前的解讀變得複雜。", "opts": {"A": "It introduces an unrelated theme.", "B": "It provides biographical information about the novelist.", "C": "It raises a difficulty with a common interpretation.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它引入一個無關的主題。", "B": "它提供這位小說家的生平資料。", "C": "它提出一種常見詮釋所面臨的難題。", "D": "它概述這部小說的出版歷史。"}, "answer": "C", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Text Function: mammoth range hypothesis", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unpredictable\" target=\"_blank\" rel=\"noopener\" data-w=\"unpredictable\" data-pos=\"adj.\" data-en=\"impossible to know in advance\" data-zh=\"無法預測的\">unpredictable<\/a>. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪個選項最能描述畫底線部分在全文中的功能？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。一篇科技文章首先說，自主水下載具可以繪製海床地圖。下一句解釋，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師正在為這些條件測試一套新的導航系統。", "opts": {"A": "It explains the limitation that the new system is meant to address.", "B": "It announces that the technology is already flawless.", "C": "It compares underwater vehicles with aircraft.", "D": "It gives a personal anecdote about engineers."}, "optsZh": {"A": "它說明了新系統想要解決的限制。", "B": "它宣稱這項技術已經完美無缺。", "C": "它比較了水下載具與飛機。", "D": "它講述一則關於工程師的個人軼事。"}, "answer": "A", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Reading Detail: Gloria Richardson led Cambridge movement", "vocab": false, "body": "In the 1960s, Gloria Richardson led a movement to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=promote\" target=\"_blank\" rel=\"noopener\" data-w=\"promote\" data-pos=\"v.\" data-en=\"to encourage or support something so that it develops\" data-zh=\"推動；促進\">promote<\/a> racial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=equality\" target=\"_blank\" rel=\"noopener\" data-w=\"equality\" data-pos=\"n.\" data-en=\"the state of having the same rights and status\" data-zh=\"平等\">equality<\/a>. Her involvement in this effort was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> by her daughter, Donna Richardson. In 1961, Donna joined <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protest\" target=\"_blank\" rel=\"noopener\" data-w=\"protest\" data-pos=\"n.\" data-en=\"a strong statement or action showing disagreement\" data-zh=\"抗議\">protests<\/a> organized by the Student Nonviolent Coordinating Committee in Cambridge, Maryland. Following her daughter, Gloria joined these protests too. Gloria soon became the cochair of the Cambridge Nonviolent Action Committee. She was also the leader of what became known as the Cambridge movement.", "bodyPlain": "In the 1960s, Gloria Richardson led a movement to promote racial equality. Her involvement in this effort was inspired by her daughter, Donna Richardson. In 1961, Donna joined protests organized by the Student Nonviolent Coordinating Committee in Cambridge, Maryland. Following her daughter, Gloria joined these protests too. Gloria soon became the cochair of the Cambridge Nonviolent Action Committee. She was also the leader of what became known as the Cambridge movement.", "stem": "According to the text, what did Gloria Richardson lead?", "stemZh": "根據本文，Gloria Richardson 領導了什麼？", "bodyZh": "1960 年代，Gloria Richardson 領導了一場促進種族平等的運動。她投入這項運動，是受到她的女兒 Donna Richardson 的啟發。1961 年，Donna 參加了由學生非暴力協調委員會（Student Nonviolent Coordinating Committee）在馬里蘭州 Cambridge 舉辦的抗議活動。Gloria 隨著女兒的腳步，也加入了這些抗議活動。Gloria 很快就成為 Cambridge 非暴力行動委員會（Cambridge Nonviolent Action Committee）的共同主席。她也是後來被稱為「Cambridge 運動」的領導者。", "opts": {"A": "The Cambridge movement", "B": "Her daughter Donna’s high school", "C": "Protests to support environmental protections", "D": "A new business in Cambridge, Maryland"}, "optsZh": {"A": "Cambridge 運動", "B": "她女兒 Donna 就讀的高中", "C": "支持環境保護的抗議活動", "D": "馬里蘭州 Cambridge 的一家新企業"}, "answer": "A", "expl": "The text states that Gloria Richardson 'was also the leader of what became known as the Cambridge movement.'", "explZh": "本文明確指出 Gloria Richardson「也是後來被稱為 Cambridge 運動的領導者」。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Reading Detail: Gloria Richardson led Cambridge movement", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，卻經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調，她的關愛是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She shows unusual maturity and self-command.", "B": "She lacks affection for her family.", "C": "She refuses to give advice to others.", "D": "She is admired mainly for her wealth."}, "optsZh": {"A": "她展現出不尋常的成熟與自制力。", "B": "她對家人缺乏感情。", "C": "她拒絕給別人建議。", "D": "她受人敬佩主要是因為她的財富。"}, "answer": "A", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Reading Detail: Gloria Richardson led Cambridge movement", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子注意到，她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強迫。", "opts": {"A": "The grandmother's influence is quiet but substantial.", "B": "The family ignores the grandmother's opinions.", "C": "The grandmother avoids family matters entirely.", "D": "The narrator thinks patience is useless."}, "optsZh": {"A": "祖母的影響力低調但深遠。", "B": "這家人忽視祖母的意見。", "C": "祖母完全不過問家中事務。", "D": "敘述者認為耐心毫無用處。"}, "answer": "A", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Reading Detail: Gloria Richardson led Cambridge movement", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一則故事描寫一位職員，他會注意到帳簿中別人已經核准過的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk intentionally creates errors.", "C": "The clerk's carefulness is valuable despite being inconvenient.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這家店因過度謹慎而經營失敗。", "B": "這位職員故意製造錯誤。", "C": "這位職員的細心雖然造成不便，卻很有價值。", "D": "同事們比這位職員更精確。"}, "answer": "C", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Reading Detail: Gloria Richardson led Cambridge movement", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段文字敘述，一位村莊領袖在做決定之前會聆聽每一位發言者，即使答案似乎顯而易見。敘述者暗示，這個習慣讓會議進行得較慢，卻能避免那些原本可能覺得自己被忽視的人心生怨恨。", "opts": {"A": "The leader dislikes public meetings.", "B": "The leader makes decisions without hearing others.", "C": "The leader is unable to reach conclusions.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人不喜歡公開會議。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人無法做出結論。", "D": "這位領導人重視兼容並蓄的審議討論。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Reading Detail: Gloria Richardson led Cambridge movement", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，然而在每一項測量都經過檢查之前，她絕不會發表任何主張。", "opts": {"A": "She publishes claims before testing them.", "B": "She combines intellectual openness with rigorous standards.", "C": "She rejects all imaginative thinking.", "D": "She avoids working with students."}, "optsZh": {"A": "她在驗證主張之前就將其發表。", "B": "她兼具開放的求知態度與嚴謹的標準。", "C": "她排斥一切富有想像力的思考。", "D": "她避免與學生共事。"}, "answer": "B", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Reading Detail: Elinor mature judgment", "vocab": false, "body": "The following text is from Jane Austen’s 1811 novel Sense and Sensibility. Elinor lives with her younger sisters and her mother, Mrs. Dashwood.<br><br>Elinor, this eldest daughter, whose advice was so <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=effectual\" target=\"_blank\" rel=\"noopener\" data-w=\"effectual\" data-pos=\"adj.\" data-en=\"producing the intended result\" data-zh=\"有效的\">effectual<\/a>, possessed a strength of understanding, and coolness of judgment, which qualified her, though only nineteen, to be the counsellor of her mother, and enabled her frequently to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=counteract\" target=\"_blank\" rel=\"noopener\" data-w=\"counteract\" data-pos=\"v.\" data-en=\"to reduce the effect of something by acting against it\" data-zh=\"抵消；對抗\">counteract<\/a>, to the advantage of them all, that eagerness of mind in Mrs. Dashwood which must generally have led to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=imprudence\" target=\"_blank\" rel=\"noopener\" data-w=\"imprudence\" data-pos=\"n.\" data-en=\"lack of care or good judgment\" data-zh=\"輕率；不謹慎\">imprudence<\/a>. She had an excellent heart;—her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=disposition\" target=\"_blank\" rel=\"noopener\" data-w=\"disposition\" data-pos=\"n.\" data-en=\"a person&#x27;s usual character or mood\" data-zh=\"性情；性格\">disposition<\/a> was affectionate, and her feelings were strong; but she knew how to govern them: it was a knowledge which her mother had yet to learn; and which one of her sisters had resolved never to be taught.", "bodyPlain": "The following text is from Jane Austen’s 1811 novel Sense and Sensibility. Elinor lives with her younger sisters and her mother, Mrs. Dashwood.\n\nElinor, this eldest daughter, whose advice was so effectual, possessed a strength of understanding, and coolness of judgment, which qualified her, though only nineteen, to be the counsellor of her mother, and enabled her frequently to counteract, to the advantage of them all, that eagerness of mind in Mrs. Dashwood which must generally have led to imprudence. She had an excellent heart;—her disposition was affectionate, and her feelings were strong; but she knew how to govern them: it was a knowledge which her mother had yet to learn; and which one of her sisters had resolved never to be taught.", "stem": "According to the text, what is true about Elinor?", "stemZh": "根據本文，關於 Elinor 何者為真？", "bodyZh": "以下文字出自 Jane Austen 1811 年的小說《Sense and Sensibility》（理性與感性）。Elinor 和她的妹妹們以及她的母親 Mrs.Dashwood 住在一起。\nElinor 是家中的長女，她的建議十分有效；她擁有強大的理解力和冷靜的判斷力，這使她雖然年僅十九歲，卻足以成為母親的顧問，並經常能為了全家人的利益，抵消 Mrs. Dashwood 那種通常必然會導致輕率行事的急切心思。她有一顆極好的心；——她性情溫柔深情，感情強烈；但她懂得如何駕馭這些感情：這是她母親尚未學會的本事，也是她的一個妹妹下定決心永遠不要學的本事。", "opts": {"A": "Elinor often argues with her mother but fails to change her mind.", "B": "Elinor can be overly sensitive with regard to family matters.", "C": "Elinor thinks her mother is a bad role model.", "D": "Elinor is remarkably mature for her age."}, "optsZh": {"A": "Elinor 經常和母親爭論，卻無法改變母親的想法。", "B": "Elinor 在家庭事務上可能過於敏感。", "C": "Elinor 認為她的母親是個壞榜樣。", "D": "以她的年紀而言，Elinor 非常成熟。"}, "answer": "D", "expl": "Though 'only nineteen,' Elinor has strong understanding and cool judgment and counsels her mother, so she is remarkably mature for her age.", "explZh": "Elinor 雖然「只有十九歲」，卻有很強的理解力與冷靜的判斷力，還能當母親的顧問，所以她以她的年紀而言相當成熟。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Reading Detail: Elinor mature judgment", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，卻經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調，她的關愛是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She shows unusual maturity and self-command.", "B": "She refuses to give advice to others.", "C": "She lacks affection for her family.", "D": "She is admired mainly for her wealth."}, "optsZh": {"A": "她展現出不尋常的成熟與自制力。", "B": "她拒絕給別人建議。", "C": "她對家人缺乏感情。", "D": "她受人敬佩主要是因為她的財富。"}, "answer": "A", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Reading Detail: Elinor mature judgment", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子注意到，她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強迫。", "opts": {"A": "The grandmother's influence is quiet but substantial.", "B": "The family ignores the grandmother's opinions.", "C": "The grandmother avoids family matters entirely.", "D": "The narrator thinks patience is useless."}, "optsZh": {"A": "祖母的影響力低調但深遠。", "B": "這家人忽視祖母的意見。", "C": "祖母完全不過問家中事務。", "D": "敘述者認為耐心毫無用處。"}, "answer": "A", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Reading Detail: Elinor mature judgment", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一則故事描寫一位職員，他會注意到帳簿中別人已經核准過的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The coworkers are more accurate than the clerk.", "B": "The business fails because of excessive caution.", "C": "The clerk's carefulness is valuable despite being inconvenient.", "D": "The clerk intentionally creates errors."}, "optsZh": {"A": "同事們比這位職員更精確。", "B": "這家店因過度謹慎而經營失敗。", "C": "這位職員的細心雖然造成不便，卻很有價值。", "D": "這位職員故意製造錯誤。"}, "answer": "C", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Reading Detail: Elinor mature judgment", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。一段文字敘述，一位村莊領袖在做決定之前會聆聽每一位發言者，即使答案似乎顯而易見。敘述者暗示，這個習慣讓會議進行得較慢，卻能避免那些原本可能覺得自己被忽視的人心生怨恨。", "opts": {"A": "The leader makes decisions without hearing others.", "B": "The leader values inclusive deliberation.", "C": "The leader dislikes public meetings.", "D": "The leader is unable to reach conclusions."}, "optsZh": {"A": "這位領導人不聽取他人意見就做決定。", "B": "這位領導人重視兼容並蓄的審議討論。", "C": "這位領導人不喜歡公開會議。", "D": "這位領導人無法做出結論。"}, "answer": "B", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Reading Detail: Elinor mature judgment", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，然而在每一項測量都經過檢查之前，她絕不會發表任何主張。", "opts": {"A": "She publishes claims before testing them.", "B": "She avoids working with students.", "C": "She rejects all imaginative thinking.", "D": "She combines intellectual openness with rigorous standards."}, "optsZh": {"A": "她在驗證主張之前就將其發表。", "B": "她避免與學生共事。", "C": "她排斥一切富有想像力的思考。", "D": "她兼具開放的求知態度與嚴謹的標準。"}, "answer": "D", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Main Idea: Vibration Cooking's influence", "vocab": false, "body": "Culinary anthropologist Vertamae Smart-Grosvenor may be known for her decades of work in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> public television and radio, but her book Vibration Cooking: or, the Travel Notes of a Geechee Girl is likely her most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=influential\" target=\"_blank\" rel=\"noopener\" data-w=\"influential\" data-pos=\"adj.\" data-en=\"having a strong effect on people or events\" data-zh=\"有影響力的\">influential<\/a> project. The 1970 book, whose title refers to Smart-Grosvenor’s roots in the Low Country of South Carolina, was unusual for its time. It combined <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=memoir\" target=\"_blank\" rel=\"noopener\" data-w=\"memoir\" data-pos=\"n.\" data-en=\"a written account of one&#x27;s own life and experiences\" data-zh=\"回憶錄\">memoir<\/a>, recipes, travel writing, and social commentary and challenged notions about conventions of food and cooking. Long admired by many, the book and its author have shaped <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> approaches to writing about cuisine.", "bodyPlain": "Culinary anthropologist Vertamae Smart-Grosvenor may be known for her decades of work in national public television and radio, but her book Vibration Cooking: or, the Travel Notes of a Geechee Girl is likely her most influential project. The 1970 book, whose title refers to Smart-Grosvenor’s roots in the Low Country of South Carolina, was unusual for its time. It combined memoir, recipes, travel writing, and social commentary and challenged notions about conventions of food and cooking. Long admired by many, the book and its author have shaped contemporary approaches to writing about cuisine.", "stem": "Which choice best describes the main idea of the text?", "stemZh": "下列哪一個選項最能說明本文的主旨？", "bodyZh": "飲食人類學家 Vertamae Smart-Grosvenor 或許因她數十年來在全國性公共電視與廣播的工作而為人所知，但她的著作《Vibration Cooking: or, the Travel Notes of a Geechee Girl》（隨感烹飪：一個 Geechee 女孩的旅行筆記）很可能才是她最具影響力的作品。這本 1970 年出版的書，書名指的是 Smart-Grosvenor 在南卡羅來納州低地地區（Low Country）的根源，在當時相當與眾不同。它結合了回憶錄、食譜、旅行寫作與社會評論，並挑戰了人們對飲食與烹飪慣例的觀念。這本書和它的作者長久以來受到許多人推崇，也形塑了當代書寫飲食的方式。", "opts": {"A": "Smart-Grosvenor’s unconventional book Vibration Cooking: or, the Travel Notes of a Geechee Girl is an important contribution to food writing.", "B": "Smart-Grosvenor held many different positions over her life, including reporter and food writer.", "C": "Smart-Grosvenor’s groundbreaking book Vibration Cooking: or, the Travel Notes of a Geechee Girl didn’t receive the praise it deserved when it was first published in 1970.", "D": "Smart-Grosvenor was a talented chef whose work inspired many people to start cooking for themselves."}, "optsZh": {"A": "Smart-Grosvenor 不落俗套的著作《Vibration Cooking: or, the Travel Notes of a Geechee Girl》是對飲食寫作的重要貢獻。", "B": "Smart-Grosvenor 一生中擔任過許多不同職位，包括記者和美食作家。", "C": "Smart-Grosvenor 開創性的著作《Vibration Cooking: or, the Travel Notes of a Geechee Girl》在 1970 年首次出版時，並未獲得它應得的讚譽。", "D": "Smart-Grosvenor 是一位才華洋溢的廚師，她的作品激勵許多人開始自己下廚。"}, "answer": "A", "expl": "The text calls the book unusual for its time, her most influential project, and says it shaped contemporary food writing—an important contribution.", "explZh": "本文說這本書在當時與眾不同、是她最具影響力的作品，並形塑了當代的飲食寫作——是一項重要貢獻。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Main Idea: Vibration Cooking's influence", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，卻經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調，她的關愛是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She refuses to give advice to others.", "B": "She lacks affection for her family.", "C": "She shows unusual maturity and self-command.", "D": "She is admired mainly for her wealth."}, "optsZh": {"A": "她拒絕給別人建議。", "B": "她對家人缺乏感情。", "C": "她展現出不尋常的成熟與自制力。", "D": "她受人敬佩主要是因為她的財富。"}, "answer": "C", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Main Idea: Vibration Cooking's influence", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子注意到，她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強迫。", "opts": {"A": "The grandmother's influence is quiet but substantial.", "B": "The narrator thinks patience is useless.", "C": "The grandmother avoids family matters entirely.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "祖母的影響力低調但深遠。", "B": "敘述者認為耐心毫無用處。", "C": "祖母完全不過問家中事務。", "D": "這家人忽視祖母的意見。"}, "answer": "A", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Main Idea: Vibration Cooking's influence", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice is best supported by the text or table?", "stemZh": "下列哪一項最能得到本文或表格的支持？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一則故事描寫一位職員，他會注意到帳簿中別人已經核准過的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk's carefulness is valuable despite being inconvenient.", "C": "The clerk intentionally creates errors.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這家店因過度謹慎而經營失敗。", "B": "這位職員的細心雖然造成不便，卻很有價值。", "C": "這位職員故意製造錯誤。", "D": "同事們比這位職員更精確。"}, "answer": "B", "expl": "The passage praises his precision.", "explZh": "
