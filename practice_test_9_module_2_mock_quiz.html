<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 9, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 9, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnDlDoc">⬇ Download wrong (Word 錯題講義)</button>
      <label class="scope">下載範圍 <select id="dlScope"><option value="session">本次作答 This attempt</option><option value="all">全部錯題本 All saved</option></select></label>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: completing means finishing", "vocab": true, "body": "The following text is from Anita Desai’s 2011 novella Translator Translated. While working on her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translation<\/a> of a novel written in Odia (a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a> of India) into English, the narrator looks out her window at night to clear her mind.<br><br>I tried to distract myself with these sights of the ordinary world, but in my mind it was the lines I had been translating and the lines that I had been writing that remained in the forefront. I longed for sleep to obliterate them but it eluded me. Perhaps everything would be normal again once I had sent off the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a>, I thought, and looked forward to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=completing\" target=\"_blank\" rel=\"noopener\" data-w=\"completing\" data-pos=\"v.\" data-en=\"finishing something so that it is whole or done\" data-zh=\"完成\">completing<\/a> the work.", "bodyPlain": "The following text is from Anita Desai’s 2011 novella Translator Translated. While working on her translation of a novel written in Odia (a language of India) into English, the narrator looks out her window at night to clear her mind.\n\nI tried to distract myself with these sights of the ordinary world, but in my mind it was the lines I had been translating and the lines that I had been writing that remained in the forefront. I longed for sleep to obliterate them but it eluded me. Perhaps everything would be normal again once I had sent off the manuscript, I thought, and looked forward to completing the work.", "stem": "As used in the text, what does the word “completing” most nearly mean?", "stemZh": "根據文中用法，「completing」這個字最接近什麼意思？", "bodyZh": "以下文字出自 Anita Desai 2011 年的中篇小說《Translator Translated》（譯者被譯）。敘述者在把一部以奧里亞語（Odia，印度的一種語言）寫成的小說翻譯成英文時，夜裡望向窗外，想讓腦袋清醒一下。\n我試著用這些平凡世界的景象讓自己分心，但在我腦海中，始終占據最前方的，是我一直在翻譯的字句和我一直在寫的字句。我渴望睡眠能將它們抹去，但睡意卻遲遲不來。我想，也許等我把手稿寄出去之後，一切就會恢復正常，於是我期待著 completing（完成）這份工作。", "opts": {"A": "Destroying", "B": "Finishing", "C": "Advertising", "D": "Rejecting"}, "optsZh": {"A": "Destroying（摧毀）", "B": "Finishing（完成）", "C": "Advertising（宣傳；打廣告）", "D": "Rejecting（拒絕）"}, "answer": "B", "expl": "The narrator looks forward to the moment when she has sent off the manuscript, so 'completing' the work means finishing it.", "explZh": "敘述者期待把手稿寄出的那一刻，所以 completing 這份工作就是把它完成（finishing）。", "defs": {"A": {"pos": "v.", "en": "damaging something so badly that it no longer exists or works", "zh": "摧毀；毀壞", "word": "Destroying"}, "B": {"pos": "v.", "en": "bringing something to an end by doing the last part of it", "zh": "完成；結束", "word": "Finishing"}, "C": {"pos": "v.", "en": "telling the public about something to make people want it", "zh": "宣傳；為…打廣告", "word": "Advertising"}, "D": {"pos": "v.", "en": "refusing to accept or use something", "zh": "拒絕；否決", "word": "Rejecting"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: completing means finishing", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. After months of revising the annotated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translation<\/a>, the editor felt uneasy about _______ the manuscript before checking the footnotes one final time.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. After months of revising the annotated translation, the editor felt uneasy about _______ the manuscript before checking the footnotes one final time.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。在花了好幾個月修訂這份附註譯本之後，這位編輯對於在最後一次檢查註腳之前就 _______ 手稿感到不安。", "opts": {"A": "finishing", "B": "misplacing", "C": "advertising", "D": "rejecting"}, "optsZh": {"A": "finishing（完成）", "B": "misplacing（放錯地方；弄丟）", "C": "advertising（宣傳；打廣告）", "D": "rejecting（拒絕）"}, "answer": "A", "expl": "Finishing means completing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "bringing something to an end by doing the last part of it", "zh": "完成；結束", "word": "finishing"}, "B": {"pos": "v.", "en": "putting something somewhere and then being unable to find it", "zh": "放錯地方；弄丟", "word": "misplacing"}, "C": {"pos": "v.", "en": "telling the public about something to make people want it", "zh": "宣傳；為…打廣告", "word": "advertising"}, "D": {"pos": "v.", "en": "refusing to accept or use something", "zh": "拒絕；否決", "word": "rejecting"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: completing means finishing", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The research team delayed _______ the report until the statistical appendix had been checked by two outside reviewers.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The research team delayed _______ the report until the statistical appendix had been checked by two outside reviewers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。研究團隊延後 _______ 這份報告，直到統計附錄經過兩位外部審查人檢查為止。", "opts": {"A": "circulating", "B": "destroying", "C": "completing", "D": "shortening"}, "optsZh": {"A": "circulating（傳閱；散布）", "B": "destroying（摧毀）", "C": "completing（完成）", "D": "shortening（縮短）"}, "answer": "C", "expl": "Completing means finishing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "passing something around so that many people see it", "zh": "傳閱；散布", "word": "circulating"}, "B": {"pos": "v.", "en": "damaging something so badly that it no longer exists or works", "zh": "摧毀；毀壞", "word": "destroying"}, "C": {"pos": "v.", "en": "finishing something so that it is whole or done", "zh": "完成", "word": "completing"}, "D": {"pos": "v.", "en": "making something shorter", "zh": "縮短；刪減", "word": "shortening"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: completing means finishing", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Although the mural already covered the entire wall, the artist insisted that _______ it required adding the small gold figures described in her original sketch.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Although the mural already covered the entire wall, the artist insisted that _______ it required adding the small gold figures described in her original sketch.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。雖然這幅壁畫已經覆蓋了整面牆，藝術家仍堅持要 _______ 它，還需要加上她原始草圖中描繪的那些金色小人像。", "opts": {"A": "publicizing", "B": "erasing", "C": "rejecting", "D": "finalizing"}, "optsZh": {"A": "publicizing（宣傳；公開）", "B": "erasing（抹去；刪除）", "C": "rejecting（拒絕）", "D": "finalizing（定稿；最後完成）"}, "answer": "D", "expl": "Finalizing means completing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "making something widely known to the public", "zh": "宣傳；公開", "word": "publicizing"}, "B": {"pos": "v.", "en": "removing something completely so it can no longer be seen", "zh": "抹去；擦除", "word": "erasing"}, "C": {"pos": "v.", "en": "refusing to accept or use something", "zh": "拒絕；否決", "word": "rejecting"}, "D": {"pos": "v.", "en": "putting the last details on something so it is complete and settled", "zh": "定稿；最後完成", "word": "finalizing"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: completing means finishing", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The committee praised the novelist for _______ the trilogy without simplifying the moral questions that had shaped the first two books.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The committee praised the novelist for _______ the trilogy without simplifying the moral questions that had shaped the first two books.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。委員會讚揚這位小說家 _______ 這部三部曲時，並沒有把塑造前兩本書的道德問題簡化。", "opts": {"A": "advertising", "B": "concluding", "C": "misplacing", "D": "criticizing"}, "optsZh": {"A": "advertising（宣傳；打廣告）", "B": "concluding（完成；結束）", "C": "misplacing（放錯地方；弄丟）", "D": "criticizing（批評）"}, "answer": "B", "expl": "Concluding means completing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "telling the public about something to make people want it", "zh": "宣傳；為…打廣告", "word": "advertising"}, "B": {"pos": "v.", "en": "bringing something to an end", "zh": "結束；完成", "word": "concluding"}, "C": {"pos": "v.", "en": "putting something somewhere and then being unable to find it", "zh": "放錯地方；弄丟", "word": "misplacing"}, "D": {"pos": "v.", "en": "saying what is wrong with someone or something", "zh": "批評", "word": "criticizing"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: completing means finishing", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The architect postponed _______ the renovation until the restored windows matched the archival drawings exactly.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The architect postponed _______ the renovation until the restored windows matched the archival drawings exactly.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位建築師延後 _______ 整修工程，直到修復後的窗戶與檔案圖稿完全吻合為止。", "opts": {"A": "finishing", "B": "advertising", "C": "discarding", "D": "misreading"}, "optsZh": {"A": "finishing（完成）", "B": "advertising（宣傳；打廣告）", "C": "discarding（丟棄）", "D": "misreading（誤讀）"}, "answer": "A", "expl": "Finishing means completing.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "bringing something to an end by doing the last part of it", "zh": "完成；結束", "word": "finishing"}, "B": {"pos": "v.", "en": "telling the public about something to make people want it", "zh": "宣傳；為…打廣告", "word": "advertising"}, "C": {"pos": "v.", "en": "throwing something away because it is not wanted", "zh": "丟棄", "word": "discarding"}, "D": {"pos": "v.", "en": "reading or understanding something incorrectly", "zh": "誤讀；誤解", "word": "misreading"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: provide food for young", "vocab": true, "body": "Predatory animals <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=differ\" target=\"_blank\" rel=\"noopener\" data-w=\"differ\" data-pos=\"v.\" data-en=\"to be not the same as something else\" data-zh=\"不同；相異\">differ<\/a> widely in how they _______ food for their young. Some leave dead prey nearby for their young to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consume\" target=\"_blank\" rel=\"noopener\" data-w=\"consume\" data-pos=\"v.\" data-en=\"to eat, drink, or use up something\" data-zh=\"吃；喝；消耗\">consume<\/a>, some bring live prey to their young, and some feed their young <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=directly\" target=\"_blank\" rel=\"noopener\" data-w=\"directly\" data-pos=\"adv.\" data-en=\"without anything or anyone in between\" data-zh=\"直接地\">directly<\/a> from their own mouths.", "bodyPlain": "Predatory animals differ widely in how they _______ food for their young. Some leave dead prey nearby for their young to consume, some bring live prey to their young, and some feed their young directly from their own mouths.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "掠食性動物在如何為幼崽 _______ 食物這件事上差異很大。有些把死去的獵物留在附近讓幼崽食用，有些把活的獵物帶給幼崽，還有些則直接從自己口中餵食幼崽。", "opts": {"A": "avoid", "B": "guess", "C": "provide", "D": "describe"}, "optsZh": {"A": "avoid（避免）", "B": "guess（猜測）", "C": "provide（提供）", "D": "describe（描述）"}, "answer": "C", "expl": "The next sentence lists ways animals get food to their young (leaving prey, bringing prey, feeding directly), so they differ in how they provide food.", "explZh": "下一句列出動物把食物交給幼崽的各種方式（留下獵物、帶回獵物、直接餵食），所以牠們的差異在於如何提供（provide）食物。", "defs": {"A": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "B": {"pos": "v.", "en": "to give an answer without being sure it is correct", "zh": "猜測", "word": "guess"}, "C": {"pos": "v.", "en": "to give someone something that they need", "zh": "提供；供給", "word": "provide"}, "D": {"pos": "v.", "en": "to say what something is like", "zh": "描述", "word": "describe"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: provide food for young", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Many shorebirds _______ their chicks with tiny insects gathered from mudflats, while some seabirds instead carry fish back from distant feeding grounds.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Many shorebirds _______ their chicks with tiny insects gathered from mudflats, while some seabirds instead carry fish back from distant feeding grounds.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。許多濱鳥用從泥灘上收集來的小昆蟲 _______ 雛鳥，而有些海鳥則從遙遠的覓食地帶魚回來。", "opts": {"A": "supply", "B": "estimate", "C": "avoid", "D": "describe"}, "optsZh": {"A": "supply（供應；提供）", "B": "estimate（估計）", "C": "avoid（避免）", "D": "describe（描述）"}, "answer": "A", "expl": "Supply means provide.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to give someone something they need or want, often regularly", "zh": "供應；提供", "word": "supply"}, "B": {"pos": "v.", "en": "to guess an amount or value based on information", "zh": "估計", "word": "estimate"}, "C": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "D": {"pos": "v.", "en": "to say what something is like", "zh": "描述", "word": "describe"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: provide food for young", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In the aquarium, adult fish often _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nutrient\" target=\"_blank\" rel=\"noopener\" data-w=\"nutrient\" data-pos=\"n.\" data-en=\"a substance that living things need to grow\" data-zh=\"養分\">nutrients<\/a> for newly hatched fry by stirring microscopic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organism\" target=\"_blank\" rel=\"noopener\" data-w=\"organism\" data-pos=\"n.\" data-en=\"a living thing\" data-zh=\"生物\">organisms<\/a> into the water column.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In the aquarium, adult fish often _______ nutrients for newly hatched fry by stirring microscopic organisms into the water column.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。在水族箱中，成魚常常把微小的生物攪進水體中，為剛孵化的魚苗 _______ 養分。", "opts": {"A": "predict", "B": "provide", "C": "avoid", "D": "imitate"}, "optsZh": {"A": "predict（預測）", "B": "provide（提供）", "C": "avoid（避免）", "D": "imitate（模仿）"}, "answer": "B", "expl": "Provide means supply.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to say what will happen in the future", "zh": "預測", "word": "predict"}, "B": {"pos": "v.", "en": "to give someone something that they need", "zh": "提供；供給", "word": "provide"}, "C": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "D": {"pos": "v.", "en": "to copy the way something is done", "zh": "模仿", "word": "imitate"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: provide food for young", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Unlike reptiles that abandon their eggs, several amphibian species _______ nourishment to their young by depositing unfertilized eggs for them to eat.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Unlike reptiles that abandon their eggs, several amphibian species _______ nourishment to their young by depositing unfertilized eggs for them to eat.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。不像那些棄卵不顧的爬蟲類，有幾種兩棲類會產下未受精的卵讓幼體食用，藉此 _______ 營養給下一代。", "opts": {"A": "imitate", "B": "describe", "C": "avoid", "D": "furnish"}, "optsZh": {"A": "imitate（模仿）", "B": "describe（描述）", "C": "avoid（避免）", "D": "furnish（提供；供應）"}, "answer": "D", "expl": "Furnish means provide.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to copy the way something is done", "zh": "模仿", "word": "imitate"}, "B": {"pos": "v.", "en": "to say what something is like", "zh": "描述", "word": "describe"}, "C": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "D": {"pos": "v.", "en": "to supply or provide something that is needed", "zh": "提供；供應", "word": "furnish"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: provide food for young", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The biologist noted that owl parents do not merely guard the nest; they also _______ food for the nestlings throughout the night.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The biologist noted that owl parents do not merely guard the nest; they also _______ food for the nestlings throughout the night.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這位生物學家指出，貓頭鷹父母不只是守護巢穴；牠們整夜還會為雛鳥 _______ 食物。", "opts": {"A": "describe", "B": "predict", "C": "avoid", "D": "procure"}, "optsZh": {"A": "describe（描述）", "B": "predict（預測）", "C": "avoid（避免）", "D": "procure（取得；獲取）"}, "answer": "D", "expl": "Procure means provide or obtain.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to say what something is like", "zh": "描述", "word": "describe"}, "B": {"pos": "v.", "en": "to say what will happen in the future", "zh": "預測", "word": "predict"}, "C": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "D": {"pos": "v.", "en": "to get or obtain something, often with effort", "zh": "取得；獲得", "word": "procure"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: provide food for young", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Some mammals _______ their offspring with partly digested food during the first weeks after birth, when the young cannot yet hunt <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Some mammals _______ their offspring with partly digested food during the first weeks after birth, when the young cannot yet hunt independently.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。有些哺乳動物在幼崽出生後的頭幾週，會用部分消化過的食物 _______ 牠們，因為這時幼崽還無法獨立狩獵。", "opts": {"A": "avoid", "B": "describe", "C": "provision", "D": "predict"}, "optsZh": {"A": "avoid（避免）", "B": "describe（描述）", "C": "provision（供給…食物或必需品）", "D": "predict（預測）"}, "answer": "C", "expl": "Provision means provide with supplies.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to keep away from or stop something from happening", "zh": "避免；避開", "word": "avoid"}, "B": {"pos": "v.", "en": "to say what something is like", "zh": "描述", "word": "describe"}, "C": {"pos": "v.", "en": "to supply someone with food or other necessary things", "zh": "供給（食物或必需品）", "word": "provision"}, "D": {"pos": "v.", "en": "to say what will happen in the future", "zh": "預測", "word": "predict"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: enthusiasm for two passions", "vocab": true, "body": "Nigerian American author Teju Cole’s ______ his two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=passion\" target=\"_blank\" rel=\"noopener\" data-w=\"passion\" data-pos=\"n.\" data-en=\"a very strong interest in or love for something\" data-zh=\"熱情；熱愛\">passions<\/a>—photography and the written word—culminates in his 2017 book, Blind Spot, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evocatively\" target=\"_blank\" rel=\"noopener\" data-w=\"evocatively\" data-pos=\"adv.\" data-en=\"in a way that brings strong images or feelings to mind\" data-zh=\"富有感染力地；引人聯想地\">evocatively<\/a> combines his original <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> from ok less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The photographer&#x27;s _______ urban light and spare prose eventually produced a book in which each image is paired with a reflective paragraph.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The photographer's _______ urban light and spare prose eventually produced a book in which each image is paired with a reflective paragraph.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位攝影師對都市光線與簡練散文的 _______，最後造就了一本每張影像都搭配一段省思文字的書。", "opts": {"A": "indifference to", "B": "fascination with", "C": "anxiety about", "D": "distance from"}, "optsZh": {"A": "indifference to（對…漠不關心）", "B": "fascination with（對…的著迷）", "C": "anxiety about（對…感到焦慮）", "D": "distance from（與…的距離、疏遠）"}, "answer": "B", "expl": "Fascination with means enthusiasm for.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a lack of interest in or concern about something", "zh": "對……漠不關心", "word": "indifference to"}, "B": {"pos": "n. phr.", "en": "a very strong interest in something", "zh": "對……的著迷", "word": "fascination with"}, "C": {"pos": "n. phr.", "en": "a feeling of worry or nervousness about something", "zh": "對……的焦慮", "word": "anxiety about"}, "D": {"pos": "n. phr.", "en": "emotional separation or lack of closeness to something", "zh": "與……的疏離", "word": "distance from"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: enthusiasm for two passions", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=composer\" target=\"_blank\" rel=\"noopener\" data-w=\"composer\" data-pos=\"n.\" data-en=\"a person who writes music\" data-zh=\"作曲家\">composer<\/a>&#x27;s _______ folk rhythm and electronic sound led her to create works that combine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> percussion with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthesize\" target=\"_blank\" rel=\"noopener\" data-w=\"synthesize\" data-pos=\"v.\" data-en=\"to combine different ideas or things into a whole\" data-zh=\"綜合；合成\">synthesized<\/a> tones.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The composer's _______ folk rhythm and electronic sound led her to create works that combine traditional percussion with synthesized tones.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。這位作曲家對民俗節奏與電子聲響的 _______，促使她創作出結合傳統打擊樂與合成音色的作品。", "opts": {"A": "confusion over", "B": "avoidance of", "C": "enthusiasm for", "D": "resistance to"}, "optsZh": {"A": "confusion over（對…的困惑）", "B": "avoidance of（對…的迴避）", "C": "enthusiasm for（對…的熱情）", "D": "resistance to（對…的抗拒）"}, "answer": "C", "expl": "Enthusiasm for means passionate interest in.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a feeling of not understanding something clearly", "zh": "對……的困惑", "word": "confusion over"}, "B": {"pos": "n. phr.", "en": "the act of staying away from something on purpose", "zh": "對……的迴避", "word": "avoidance of"}, "C": {"pos": "n. phr.", "en": "strong interest in and excitement about something", "zh": "對……的熱忱", "word": "enthusiasm for"}, "D": {"pos": "n. phr.", "en": "refusal to accept or be affected by something", "zh": "對……的抗拒", "word": "resistance to"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: enthusiasm for two passions", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The historian&#x27;s _______ archival research and public <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=storytelling\" target=\"_blank\" rel=\"noopener\" data-w=\"storytelling\" data-pos=\"n.\" data-en=\"the activity of telling stories\" data-zh=\"說故事\">storytelling<\/a> is evident in a podcast that turns newly discovered letters into vivid narratives.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The historian's _______ archival research and public storytelling is evident in a podcast that turns newly discovered letters into vivid narratives.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗而逐步發展。博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這位歷史學家對檔案研究與公共敘事的 _______，在一個把新發現的信件轉化為生動故事的 podcast 中表露無遺。", "opts": {"A": "distrust of", "B": "indifference to", "C": "zeal for", "D": "separation from"}, "optsZh": {"A": "distrust of（對…的不信任）", "B": "indifference to（對…漠不關心）", "C": "zeal for（對…的熱忱）", "D": "separation from（與…分離）"}, "answer": "C", "expl": "Zeal for means enthusiasm for.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a feeling that someone or something cannot be trusted", "zh": "對……的不信任", "word": "distrust of"}, "B": {"pos": "n. phr.", "en": "a lack of interest in or concern about something", "zh": "對……漠不關心", "word": "indifference to"}, "C": {"pos": "n. phr.", "en": "great energy and eagerness for a cause or activity", "zh": "對……的熱忱", "word": "zeal for"}, "D": {"pos": "n. phr.", "en": "the state of being apart from something", "zh": "與……的分離", "word": "separation from"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: enthusiasm for two passions", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The novelist&#x27;s _______ folklore and climate science culminated in a speculative novel that treats ecological change as both mythic and measurable.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The novelist's _______ folklore and climate science culminated in a speculative novel that treats ecological change as both mythic and measurable.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "這項研究指出，當交通、住房、經費與公眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。這位小說家對民間傳說與氣候科學的 _______，最終成就了一部把生態變遷同時視為神話與可測量現象的推想小說。", "opts": {"A": "passion for", "B": "avoidance of", "C": "confusion over", "D": "indifference to"}, "optsZh": {"A": "passion for（對…的熱愛）", "B": "avoidance of（對…的迴避）", "C": "confusion over（對…的困惑）", "D": "indifference to（對…漠不關心）"}, "answer": "A", "expl": "Passion for means enthusiasm for.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a very strong liking for or love of something", "zh": "對……的熱愛", "word": "passion for"}, "B": {"pos": "n. phr.", "en": "the act of staying away from something on purpose", "zh": "對……的迴避", "word": "avoidance of"}, "C": {"pos": "n. phr.", "en": "a feeling of not understanding something clearly", "zh": "對……的困惑", "word": "confusion over"}, "D": {"pos": "n. phr.", "en": "a lack of interest in or concern about something", "zh": "對……漠不關心", "word": "indifference to"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: enthusiasm for two passions", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The curator&#x27;s _______ textile design and social history shaped an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> that explains fabric patterns as records of migration and trade.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The curator's _______ textile design and social history shaped an exhibition that explains fabric patterns as records of migration and trade.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究人員在稍加改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。這位策展人對紡織設計與社會史的 _______，形塑了一場把布料圖案詮釋為遷徙與貿易紀錄的展覽。", "opts": {"A": "confusion over", "B": "distance from", "C": "resistance to", "D": "ardor for"}, "optsZh": {"A": "confusion over（對…的困惑）", "B": "distance from（與…的距離、疏遠）", "C": "resistance to（對…的抗拒）", "D": "ardor for（對…的熱忱）"}, "answer": "D", "expl": "Ardor for means enthusiasm for.", "explZh": "", "defs": {"A": {"pos": "n. phr.", "en": "a feeling of not understanding something clearly", "zh": "對……的困惑", "word": "confusion over"}, "B": {"pos": "n. phr.", "en": "emotional separation or lack of closeness to something", "zh": "與……的疏離", "word": "distance from"}, "C": {"pos": "n. phr.", "en": "refusal to accept or be affected by something", "zh": "對……的抗拒", "word": "resistance to"}, "D": {"pos": "n. phr.", "en": "strong, eager feeling of enthusiasm for something", "zh": "對……的熱情", "word": "ardor for"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: handmade from natural materials", "vocab": true, "body": "Artist Marilyn Dingle’s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricate\" target=\"_blank\" rel=\"noopener\" data-w=\"intricate\" data-pos=\"adj.\" data-en=\"having many small parts or details arranged in a complicated way\" data-zh=\"錯綜複雜的；精細的\">intricate<\/a>, coiled baskets are _______ sweetgrass and palmetto palm. Following a Gullah <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technique\" target=\"_blank\" rel=\"noopener\" data-w=\"technique\" data-pos=\"n.\" data-en=\"a particular way of doing something that needs skill\" data-zh=\"技巧；手法\">technique<\/a> that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=originate\" target=\"_blank\" rel=\"noopener\" data-w=\"originate\" data-pos=\"v.\" data-en=\"to come from a particular place\" data-zh=\"起源；發源\">originated<\/a> in West Africa, Dingle skillfully winds a thin palm frond around a bunch of sweetgrass with the help of a “sewing bone” to create the basket’s signature look that no factory can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reproduce\" target=\"_blank\" rel=\"noopener\" data-w=\"reproduce\" data-pos=\"v.\" data-en=\"to make a copy of something\" data-zh=\"複製；再製\">reproduce<\/a>.", "bodyPlain": "Artist Marilyn Dingle’s intricate, coiled baskets are _______ sweetgrass and palmetto palm. Following a Gullah technique that originated in West Africa, Dingle skillfully winds a thin palm frond around a bunch of sweetgrass with the help of a “sewing bone” to create the basket’s signature look that no factory can reproduce.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "藝術家 Marilyn Dingle 精巧的盤繞籃子是 _______ 甜草（sweetgrass）和矮棕櫚（palmetto palm）。Dingle 依循一種起源於西非的 Gullah 技法，借助一根「縫骨」（sewing bone），熟練地把細長的棕櫚葉纏繞在一束甜草上，創造出籃子那種工廠無法複製的招牌樣貌。", "opts": {"A": "indicated by", "B": "handmade from", "C": "represented by", "D": "collected with"}, "optsZh": {"A": "indicated by（由…指出）", "B": "handmade from（用…手工製成）", "C": "represented by（由…代表）", "D": "collected with（和…一起收集）"}, "answer": "B", "expl": "Dingle 'skillfully winds' the materials by hand to create a look 'no factory can reproduce,' so the baskets are handmade from sweetgrass and palmetto palm.", "explZh": "Dingle 用手「熟練地纏繞」這些材料，做出「工廠無法複製」的樣貌，所以這些籃子是用甜草和矮棕櫚手工製成的（handmade from）。", "defs": {"A": {"pos": "v. phr.", "en": "shown or pointed out by", "zh": "由……顯示；由……指出", "word": "indicated by"}, "B": {"pos": "adj. phr.", "en": "made by hand, not by machine, using a particular material", "zh": "用……手工製成的", "word": "handmade from"}, "C": {"pos": "v. phr.", "en": "shown, stood for, or symbolized by", "zh": "由……代表；以……表現", "word": "represented by"}, "D": {"pos": "v. phr.", "en": "gathered together along with", "zh": "與……一起收集", "word": "collected with"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: handmade from natural materials", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The conservator explained that the ceremonial mask was not factory-produced but _______ cedar, pigments, and fiber according to a regional technique.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The conservator explained that the ceremonial mask was not factory-produced but _______ cedar, pigments, and fiber according to a regional technique.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。這位文物修復師解釋，這個儀式面具並非工廠生產，而是依照一種地方技法 _______ 雪松木、顏料和纖維。", "opts": {"A": "indicated by", "B": "collected with", "C": "represented by", "D": "crafted from"}, "optsZh": {"A": "indicated by（由…指出）", "B": "collected with（和…一起收集）", "C": "represented by（由…代表）", "D": "crafted from（以…精心製作而成）"}, "answer": "D", "expl": "Crafted from means handmade from.", "explZh": "", "defs": {"A": {"pos": "v. phr.", "en": "shown or pointed out by", "zh": "由……顯示；由……指出", "word": "indicated by"}, "B": {"pos": "v. phr.", "en": "gathered together along with", "zh": "與……一起收集", "word": "collected with"}, "C": {"pos": "v. phr.", "en": "shown, stood for, or symbolized by", "zh": "由……代表；以……表現", "word": "represented by"}, "D": {"pos": "adj. phr.", "en": "made skillfully by hand out of a particular material", "zh": "用……精心製作的", "word": "crafted from"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: handmade from natural materials", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> label notes that the baskets are _______ river cane and dyed grasses, materials that local artists prepare before weaving.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition label notes that the baskets are _______ river cane and dyed grasses, materials that local artists prepare before weaving.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "檔案中後來的註記顯示，在計畫以最終形式公開之前，編輯與合作者曾修改過其中幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。展覽說明牌指出，這些籃子是 _______ 河竹和染色的草，這些材料由當地藝術家在編織前預先處理。", "opts": {"A": "collected with", "B": "indicated by", "C": "handmade from", "D": "represented by"}, "optsZh": {"A": "collected with（和…一起收集）", "B": "indicated by（由…指出）", "C": "handmade from（用…手工製成）", "D": "represented by（由…代表）"}, "answer": "C", "expl": "Handmade from identifies the materials used.", "explZh": "", "defs": {"A": {"pos": "v. phr.", "en": "gathered together along with", "zh": "與……一起收集", "word": "collected with"}, "B": {"pos": "v. phr.", "en": "shown or pointed out by", "zh": "由……顯示；由……指出", "word": "indicated by"}, "C": {"pos": "adj. phr.", "en": "made by hand, not by machine, using a particular material", "zh": "用……手工製成的", "word": "handmade from"}, "D": {"pos": "v. phr.", "en": "shown
