al moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Lee cataloged more than one algae species.", "B": "Both samples were collected in 1980.", "C": "Fucus alba was collected from Stone Harbor.", "D": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980."}, "optsZh": {"A": "Lee 編目記錄了不只一種藻類。", "B": "兩份樣本都是在 1980 年採集的。", "C": "Fucus alba 是在 Stone Harbor 採集的。", "D": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。"}, "answer": "D", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Student Notes: compare tunnel lengths", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "B": "Species M came from Lake Plain.", "C": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "D": "Singh collected beetles in multiple locations."}, "optsZh": {"A": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "B": "Species M 來自 Lake Plain。", "C": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。", "D": "Singh 在多個地點採集了甲蟲。"}, "answer": "C", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Student Notes: compare tunnel lengths", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "B": "Ramos collected Fern Y the following year.", "C": "Cloud Peak and Green Valley were both collection sites.", "D": "Ramos collected approximately 700 specimens."}, "optsZh": {"A": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "B": "Ramos 在隔年採集了 Fern Y。", "C": "Cloud Peak 和 Green Valley 都是採集地點。", "D": "Ramos 採集了大約 700 件標本。"}, "answer": "A", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Student Notes: emphasize fossil significance", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Pinnipeds, which include seals, sea lions, and walruses, live in and around water.<br>- Pinnipeds are descended not from sea animals but from four-legged, land-dwelling carnivores.<br>- Canadian paleobiologist Natalia Rybczynski recently found a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fossil\" target=\"_blank\" rel=\"noopener\" data-w=\"fossil\" data-pos=\"n.\" data-en=\"the remains of a prehistoric plant or animal preserved in rock\" data-zh=\"化石\">fossil<\/a> with four legs, webbed toes, and the skull and teeth of a seal.<br>- Rybczynski refers to her rare find as a “<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transition\" target=\"_blank\" rel=\"noopener\" data-w=\"transition\" data-pos=\"n.\" data-en=\"a change from one state or topic to another\" data-zh=\"轉折；過渡\">transitional<\/a> fossil.”<br>- The fossil <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illustrate\" target=\"_blank\" rel=\"noopener\" data-w=\"illustrate\" data-pos=\"v.\" data-en=\"to show or explain something clearly with examples\" data-zh=\"說明；例證\">illustrates<\/a> an early stage in the evolution of pinnipeds from their land-dwelling ancestors.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Pinnipeds, which include seals, sea lions, and walruses, live in and around water.\n- Pinnipeds are descended not from sea animals but from four-legged, land-dwelling carnivores.\n- Canadian paleobiologist Natalia Rybczynski recently found a fossil with four legs, webbed toes, and the skull and teeth of a seal.\n- Rybczynski refers to her rare find as a “transitional fossil.”\n- The fossil illustrates an early stage in the evolution of pinnipeds from their land-dwelling ancestors.", "stem": "The student wants to emphasize the fossil’s significance. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要強調這塊化石的重要性。下列哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n- 鰭足類動物包括海豹、海獅和海象，生活在水中及水域周邊。\n- 鰭足類並非由海洋動物演化而來，而是源自四足的陸生肉食動物。\n- 加拿大古生物學家 Natalia Rybczynski 最近發現了一塊化石，它有四條腿、有蹼的腳趾，以及海豹的頭骨和牙齒。\n- Rybczynski 把她這項罕見的發現稱為「過渡化石」。\n- 這塊化石說明了鰭足類從其陸生祖先演化而來的早期階段。", "opts": {"A": "Canadian paleobiologist Natalia Rybczynski’s fossil has the skull and teeth of a seal, which, like sea lions and walruses, is a pinniped.", "B": "Pinnipeds are descended from four-legged, land-dwelling carnivores; a fossil that resembles both was recently found.", "C": "Having four legs but the skull and teeth of a seal, the rare fossil illustrates an early stage in the evolution of pinnipeds from their land-dwelling ancestors.", "D": "A “transitional fossil” was recently found by paleobiologist Natalia Rybczynski."}, "optsZh": {"A": "加拿大古生物學家 Natalia Rybczynski 發現的化石有海豹的頭骨和牙齒，而海豹和海獅、海象一樣，都屬於鰭足類。", "B": "鰭足類源自四足的陸生肉食動物；最近發現了一塊與兩者都相似的化石。", "C": "這塊罕見的化石有四條腿，卻有海豹的頭骨和牙齒，它說明了鰭足類從其陸生祖先演化而來的早期階段。", "D": "古生物學家 Natalia Rybczynski 最近發現了一塊「過渡化石」。"}, "answer": "C", "expl": "C explains why the fossil matters: it combines land-animal and seal features and illustrates an early stage of pinniped evolution.", "explZh": "C 說明這塊化石為何重要：它兼具陸生動物與海豹的特徵，呈現鰭足類演化的早期階段。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Student Notes: emphasize fossil significance", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Aya Mori collected hundreds of plant samples.", "B": "Fern A and Moss B were collected in different years.", "C": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "D": "Mori also collected Moss B from River Nami."}, "optsZh": {"A": "Aya Mori 採集了數百件植物樣本。", "B": "Fern A 和 Moss B 是在不同年份採集的。", "C": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "D": "Mori 也在 River Nami 採集了 Moss B。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Student Notes: emphasize fossil significance", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cerro Azul sample.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：地質學家 Luis Ortega 採集了許多礦物標本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的標本。", "opts": {"A": "Quartz was collected from Valle Seco.", "B": "Cerro Azul and Valle Seco are different sites.", "C": "Ortega collected many mineral samples.", "D": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work."}, "optsZh": {"A": "石英是在 Valle Seco 採集的。", "B": "Cerro Azul 和 Valle Seco 是不同的地點。", "C": "Ortega 採集了許多礦物樣本。", "D": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。"}, "answer": "D", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Student Notes: emphasize fossil significance", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Lee cataloged more than one algae species.", "B": "Fucus alba was collected from Stone Harbor.", "C": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "D": "Both samples were collected in 1980."}, "optsZh": {"A": "Lee 編目記錄了不只一種藻類。", "B": "Fucus alba 是在 Stone Harbor 採集的。", "C": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。", "D": "兩份樣本都是在 1980 年採集的。"}, "answer": "C", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Student Notes: emphasize fossil significance", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975.", "B": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "C": "Singh collected beetles in multiple locations.", "D": "Species M came from Lake Plain."}, "optsZh": {"A": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。", "B": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "C": "Singh 在多個地點採集了甲蟲。", "D": "Species M 來自 Lake Plain。"}, "answer": "A", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Student Notes: emphasize fossil significance", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Ramos collected approximately 700 specimens.", "B": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "C": "Cloud Peak and Green Valley were both collection sites.", "D": "Ramos collected Fern Y the following year."}, "optsZh": {"A": "Ramos 採集了大約 700 件標本。", "B": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "C": "Cloud Peak 和 Green Valley 都是採集地點。", "D": "Ramos 在隔年採集了 Fern Y。"}, "answer": "B", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: contrast emissivity values", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Physicist Muluneh Abebe was working on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=garment\" target=\"_blank\" rel=\"noopener\" data-w=\"garment\" data-pos=\"n.\" data-en=\"a piece of clothing\" data-zh=\"衣服；服裝\">garment<\/a> suited for both warm and cold <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.<br>- He <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=analyze\" target=\"_blank\" rel=\"noopener\" data-w=\"analyze\" data-pos=\"v.\" data-en=\"to examine something carefully in order to understand it\" data-zh=\"分析\">analyzed<\/a> the emissivity, or ability to emit heat, of the materials he planned to use.<br>- Abebe found that reflective metal fibers emitted almost no heat and had an emissivity of 0.02.<br>- He found that silicon carbide fibers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=absorb\" target=\"_blank\" rel=\"noopener\" data-w=\"absorb\" data-pos=\"v.\" data-en=\"to take in a substance\" data-zh=\"吸收\">absorbed<\/a> large amounts of heat and had an emissivity of 0.74.<br>- The amount of heat a material absorbs is equal to the amount of heat it emits.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Physicist Muluneh Abebe was working on a garment suited for both warm and cold conditions.\n- He analyzed the emissivity, or ability to emit heat, of the materials he planned to use.\n- Abebe found that reflective metal fibers emitted almost no heat and had an emissivity of 0.02.\n- He found that silicon carbide fibers absorbed large amounts of heat and had an emissivity of 0.74.\n- The amount of heat a material absorbs is equal to the amount of heat it emits.", "stem": "The student wants to contrast the emissivity of reflective metal fibers with that of silicon carbide fibers. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要對比反光金屬纖維與碳化矽纖維的放射率。下列哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n- 物理學家 Muluneh Abebe 當時正在研發一種同時適合溫暖與寒冷環境的衣物。\n- 他分析了他打算使用的材料的放射率，也就是散發熱的能力。\n- Abebe 發現反光金屬纖維幾乎不散發熱，放射率為 0.02。\n- 他發現碳化矽纖維吸收大量的熱，放射率為 0.74。\n- 一種材料吸收的熱量等於它散發的熱量。", "opts": {"A": "The ability of reflective metal fibers and silicon carbide fibers to emit heat was determined by an analysis of each material’s emissivity.", "B": "The amount of heat a material absorbs is equal to the amount it emits, as evidenced in Abebe’s analyses.", "C": "Though the reflective metal fibers and silicon carbide fibers had different rates of emissivity, Abebe planned to use both in a garment.", "D": "Whereas the reflective metal fibers had an emissivity of just 0.02, the silicon carbide fibers absorbed large amounts of heat, resulting in an emissivity of 0.74."}, "optsZh": {"A": "反光金屬纖維和碳化矽纖維散發熱的能力，是透過分析每種材料的放射率來確定的。", "B": "從 Abebe 的分析可以看出，一種材料吸收的熱量等於它散發的熱量。", "C": "雖然反光金屬纖維和碳化矽纖維的放射率不同，Abebe 仍打算在一件衣物中同時使用兩者。", "D": "反光金屬纖維的放射率只有 0.02，而碳化矽纖維吸收大量的熱，因此放射率達到 0.74。"}, "answer": "D", "expl": "D directly contrasts the two emissivity values (0.02 vs. 0.74) with 'Whereas.'", "explZh": "D 用 Whereas 直接對比兩種放射率數值（0.02 與 0.74）。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: contrast emissivity values", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Botanist Aya Mori collected 600 plant samples; she collected Fern A from Mount Kuro in 1932; she collected Moss B from River Nami in 1933; the goal is to emphasize the Mount Kuro sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：植物學家 Aya Mori 採集了 600 份植物標本；她於 1932 年在 Mount Kuro 採集了蕨類 A；她於 1933 年在 River Nami 採集了苔蘚 B；目標是強調 Mount Kuro 的標本。", "opts": {"A": "Fern A and Moss B were collected in different years.", "B": "Mori also collected Moss B from River Nami.", "C": "Among Mori's samples was Fern A, which she collected from Mount Kuro in 1932.", "D": "Aya Mori collected hundreds of plant samples."}, "optsZh": {"A": "Fern A 和 Moss B 是在不同年份採集的。", "B": "Mori 也在 River Nami 採集了 Moss B。", "C": "在 Mori 的樣本中有 Fern A，那是她於 1932 年在 Mount Kuro 採集的。", "D": "Aya Mori 採集了數百件植物樣本。"}, "answer": "C", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: contrast emissivity values", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cerro Azul sample.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Geologist Luis Ortega collected many mineral samples; he collected basalt from Cerro Azul in 1910; he collected quartz from Valle Seco in 1911; the goal is to emphasize the Cerro Azul sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：地質學家 Luis Ortega 採集了許多礦物標本；他於 1910 年在 Cerro Azul 採集了玄武岩；他於 1911 年在 Valle Seco 採集了石英；目標是強調 Cerro Azul 的標本。", "opts": {"A": "Cerro Azul and Valle Seco are different sites.", "B": "Ortega collected basalt from Cerro Azul in 1910 as part of his mineral sampling work.", "C": "Quartz was collected from Valle Seco.", "D": "Ortega collected many mineral samples."}, "optsZh": {"A": "Cerro Azul 和 Valle Seco 是不同的地點。", "B": "Ortega 於 1910 年在 Cerro Azul 採集了玄武岩，作為他礦物採樣工作的一部分。", "C": "石英是在 Valle Seco 採集的。", "D": "Ortega 採集了許多礦物樣本。"}, "answer": "B", "expl": "The answer focuses on the target sample.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: contrast emissivity values", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Marine biologist Hana Lee cataloged algae; she collected Ulva marina from Bright Bay in May 1980; she collected Fucus alba from Stone Harbor in June 1980; the goal is to emphasize the Bright Bay sample.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：海洋生物學家 Hana Lee 為藻類編目；她於 1980 年 5 月在 Bright Bay 採集了 Ulva marina；她於 1980 年 6 月在 Stone Harbor 採集了 Fucus alba；目標是強調 Bright Bay 的標本。", "opts": {"A": "Among Lee's algae samples was Ulva marina, which she collected from Bright Bay in May 1980.", "B": "Fucus alba was collected from Stone Harbor.", "C": "Both samples were collected in 1980.", "D": "Lee cataloged more than one algae species."}, "optsZh": {"A": "在 Lee 的藻類樣本中有 Ulva marina，那是她於 1980 年 5 月在 Bright Bay 採集的。", "B": "Fucus alba 是在 Stone Harbor 採集的。", "C": "兩份樣本都是在 1980 年採集的。", "D": "Lee 編目記錄了不只一種藻類。"}, "answer": "A", "expl": "The answer emphasizes the selected sample.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: contrast emissivity values", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cedar Ridge specimen.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Entomologist Ravi Singh collected beetles; he collected Species L from Cedar Ridge in 1975; he collected Species M from Lake Plain in 1976; the goal is to emphasize the Cedar Ridge specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：昆蟲學家 Ravi Singh 採集甲蟲；他於 1975 年在 Cedar Ridge 採集了 L 物種；他於 1976 年在 Lake Plain 採集了 M 物種；目標是強調 Cedar Ridge 的標本。", "opts": {"A": "The Cedar Ridge and Lake Plain specimens were collected in different years.", "B": "Species M came from Lake Plain.", "C": "Singh collected beetles in multiple locations.", "D": "One specimen Singh collected was Species L, a beetle from Cedar Ridge in 1975."}, "optsZh": {"A": "Cedar Ridge 和 Lake Plain 的標本是在不同年份採集的。", "B": "Species M 來自 Lake Plain。", "C": "Singh 在多個地點採集了甲蟲。", "D": "Singh 採集的標本之一是 Species L，一種 1975 年於 Cedar Ridge 採得的甲蟲。"}, "answer": "D", "expl": "The answer centers the target specimen.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: contrast emissivity values", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the Cloud Peak specimen.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Botanist Celia Ramos collected approximately 700 specimens; she collected Orchid X from Cloud Peak in 1948; she collected Fern Y from Green Valley in 1949; the goal is to emphasize the Cloud Peak specimen.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：植物學家 Celia Ramos 採集了大約 700 份標本；她於 1948 年在 Cloud Peak 採集了蘭花 X；她於 1949 年在 Green Valley 採集了蕨類 Y；目標是強調 Cloud Peak 的標本。", "opts": {"A": "Among Ramos's many specimens was Orchid X, which she collected from Cloud Peak in 1948.", "B": "Ramos collected Fern Y the following year.", "C": "Ramos collected approximately 700 specimens.", "D": "Cloud Peak and Green Valley were both collection sites."}, "optsZh": {"A": "在 Ramos 眾多的標本中有 Orchid X，那是她於 1948 年在 Cloud Peak 採集的。", "B": "Ramos 在隔年採集了 Fern Y。", "C": "Ramos 採集了大約 700 件標本。", "D": "Cloud Peak 和 Green Valley 都是採集地點。"}, "answer": "A", "expl": "The answer emphasizes the target sample.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: explain interactive format advantage", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In 2020, theater students at Radford and Virginia Tech chose an interactive, online format to present a play about woman <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=suffrage\" target=\"_blank\" rel=\"noopener\" data-w=\"suffrage\" data-pos=\"n.\" data-en=\"the right to vote in elections\" data-zh=\"投票權；選舉權\">suffrage<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=activist\" target=\"_blank\" rel=\"noopener\" data-w=\"activist\" data-pos=\"n.\" data-en=\"a person who works for social or political change\" data-zh=\"社運人士；運動者\">activists<\/a>.<br>- Their “Women and the Vote” website featured an interactive digital drawing of a Victorian-style house.<br>- Audiences were asked to focus on a room of their choice and select from that room an artifact related to the suffrage movement.<br>- One click took them to video clips, songs, artwork, and texts <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with the artifact.<br>- The play was popular with audiences because the format allowed them to control the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a>.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In 2020, theater students at Radford and Virginia Tech chose an interactive, online format to present a play about woman suffrage activists.\n- Their “Women and the Vote” website featured an interactive digital drawing of a Victorian-style house.\n- Audiences were asked to focus on a room of their choice and select from that room an artifact related to the suffrage movement.\n- One click took them to video clips, songs, artwork, and texts associated with the artifact.\n- The play was popular with audiences because the format allowed them to control the experience.", "stem": "The student wants to explain an advantage of the “Women and the Vote” format. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要說明「Women and the Vote」這種形式的一項優點。下列哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n- 2020 年，Radford 大學和維吉尼亞理工大學（Virginia Tech）的戲劇系學生選擇以互動式線上形式，呈現一齣關於婦女參政運動人士的戲劇。\n- 他們的「Women and the Vote」（女性與選票）網站以一幅維多利亞式房屋的互動數位圖畫為特色。\n- 觀眾被要求專注於自己選擇的一個房間，並從那個房間挑選一件與婦女參政運動相關的文物。\n- 點擊一下就會連到與該文物相關的影片片段、歌曲、藝術作品和文字。\n- 這齣戲很受觀眾歡迎，因為這種形式讓他們能掌控自己的體驗。", "opts": {"A": "“Women and the Vote” featured a drawing of a Victorian-style house with several rooms, each containing suffrage artifacts.", "B": "To access video clips, songs, artwork, and texts, audiences had to first click on an artifact.", "C": "The “Women and the Vote” format appealed to audiences because it allowed them to control the experience.", "D": "Using an interactive format, theater students at Radford and Virginia Tech created “Women and the Vote,” a play about woman suffrage activists."}, "optsZh": {"A": "「Women and the Vote」以一幅維多利亞式房屋的圖畫為特色，房屋有好幾個房間，每個房間都放著與婦女參政相關的文物。", "B": "要觀看影片片段、歌曲、藝術作品和文字，觀眾必須先點擊一件文物。", "C": "「Women and the Vote」的形式之所以吸引觀眾，是因為它讓觀眾能掌控自己的體驗。", "D": "Radford 大學和維吉尼亞理工大學的戲劇系學生運用互動形式，創作了「Women and the Vote」，一齣關於婦女參政運動人士的戲劇。"}, "answer": "C", "expl": "An advantage of the format is that it let audiences control the experience, which made it popular; C states this.", "explZh": "這種形式的優點是讓觀眾能掌控體驗，因而受歡迎；C 正好說明了這一點。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: explain interactive format advantage", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：某個檔案室依風險為文件分級；公開後可能造成輕微傷害的文件列為「限閱」（Restricted）；公開後可能造成重大傷害的文件列為「封存」（Sealed）；例行的預算草案可能造成輕微但非重大的傷害；目標是為這些草案分級。", "opts": {"A": "Budget drafts are one kind of government document.", "B": "The records office classifies documents by release risk.", "C": "Sealed documents could cause major harm if released.", "D": "Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted."}, "optsZh": {"A": "預算草案是政府文件的一種。", "B": "檔案室依公開風險為文件分類。", "C": "「密封級」文件一旦公開可能造成重大損害。", "D": "由於例行預算草案外洩可能造成輕微但不嚴重的損害，因此被歸類為「限制級」（Restricted）。"}, "answer": "D", "expl": "The answer applies the classification rule.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: explain interactive format advantage", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classify<\/a> diluted cleaner.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：某間實驗室依危險程度標示材料；可能刺激皮膚的材料標示為「小心」（Caution）；可能造成嚴重傷害的材料標示為「危險」（Danger）；稀釋過的清潔劑可能刺激皮膚，但不會造成嚴重傷害；目標是為稀釋清潔劑分類。", "opts": {"A": "The lab uses hazard categories for materials.", "B": "Danger materials can cause severe injury.", "C": "Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution.", "D": "Diluted cleaner is handled in a lab."}, "optsZh": {"A": "該實驗室對材料採用危險等級分類。", "B": "「危險級」材料可能造成嚴重傷害。", "C": "由於稀釋過的清潔劑可能刺激皮膚但不會造成嚴重傷害，因此被標示為「注意級」（Caution）。", "D": "稀釋過的清潔劑在實驗室中處理。"}, "answer": "C", "expl": "The answer uses the correct category.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: explain interactive format advantage", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A library classifies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：某間圖書館依脆弱程度為手稿分級；需要小心處理的物品列為「監控」（Monitored）；讀者不可接觸的物品列為「限閱」（Restricted）；大多數十九世紀的小冊子需要小心處理，但仍可由讀者翻閱；目標是為這些小冊子分級。", "opts": {"A": "Most nineteenth-century pamphlets are classified as Monitored because they need careful handling but can still be handled by readers.", "B": "Nineteenth-century pamphlets are historical documents.", "C": "Restricted manuscripts cannot be handled by readers.", "D": "The library classifies manuscripts by fragility."}, "optsZh": {"A": "大多數十九世紀的小冊子被歸類為「監管」級，因為它們需要小心處理，但讀者仍可接觸使用。", "B": "十九世紀的小冊子屬於歷史文件。", "C": "「限制級」手稿讀者不得接觸。", "D": "該圖書館依脆弱程度為手稿分類。"}, "answer": "A", "expl": "The answer applies the definitions.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: explain interactive format advantage", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=widespread\" target=\"_blank\" rel=\"noopener\" data-w=\"widespread\" data-pos=\"adj.\" data-en=\"existing or happening in many places or among many people\" data-zh=\"普遍的；廣泛的\">widespread<\/a> damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: An agency classifies storms by expected impact; storms expected to cause local disruption are Advisory; storms expected to cause widespread damage are Emergency; a coastal storm is expected to cause local disruption but not widespread damage; the goal is to classify the storm.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的模式，研究人員選擇謹慎的措辭，並區分哪些是資料直接顯示的，哪些只是資料所暗示的。筆記：某個機構依預期影響為暴風雨分級；預期造成局部干擾的暴風雨列為「注意報」（Advisory）；預期造成大範圍損害的暴風雨列為「緊急」（Emergency）；某場沿海暴風雨預期會造成局部干擾，但不會造成大範圍損害；目標是為這場暴風雨分級。", "opts": {"A": "Coastal storms can affect travel.", "B": "Expected to cause local disruption but not widespread damage, the coastal storm is classified as Advisory.", "C": "Emergency storms cause widespread damage.", "D": "The agency classifies storms by expected impact."}, "optsZh": {"A": "沿海風暴可能影響交通。", "B": "由於預計會造成局部干擾但不會造成大範圍損害，這場沿海風暴被歸類為「警示級」（Advisory）。", "C": "「緊急級」風暴會造成大範圍損害。", "D": "該機構依預期衝擊程度為風暴分類。"}, "answer": "B", "expl": "The answer identifies the category.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: explain interactive format advantage", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: A museum <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A museum classifies loans by security risk; objects that could be damaged by ordinary handling are Supervised; objects that could be seriously damaged by brief exposure are Restricted; most ceramic replicas could be damaged by ordinary handling but not seriously damaged by brief exposure; the goal is to classify the replicas.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一項戲劇性的發現。研究人員先說明方法、對照組以及證據的侷限，然後才提出一個必須兼具精確與節制的結論。筆記：某間博物館依安全風險為借展品分級；可能因一般搬運而受損的物件列為「監督」（Supervised）；可能因短暫暴露而嚴重受損的物件列為「限制」（Restricted）；大多數陶瓷複製品可能因一般搬運而受損，但不會因短暫暴露而嚴重受損；目標是為這些複製品分級。", "opts": {"A": "Restricted objects could be seriously damaged by brief exposure.", "B": "Museum loans are classified by security risk.", "C": "Most ceramic replicas are classified as Supervised because ordinary handling could damage them.", "D": "Ceramic replicas may be used in educational displays."}, "optsZh": {"A": "「限制級」物件短暫曝露就可能嚴重受損。", "B": "博物館借展品依安全風險分類。", "C": "大多數陶瓷複製品被歸類為「監督級」（Supervised），因為一般的搬動就可能損壞它們。", "D": "陶瓷複製品可用於教育展示。"}, "answer": "C", "expl": "The answer applies the classification.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: present study and methodology", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Ducklings expend up to 62.8% less energy when swimming in a line behind their mother than when swimming alone.<br>- The physics behind this energy savings hasn’t always been well understood.<br>- Naval architect Zhiming Yuan used computer simulations to study the effect of the mother duck’s wake.<br>- The study <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> that ducklings are pushed in a forward direction by the wake’s waves.<br>- Yuan <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> this push reduces the effect of wave drag on the ducklings by 158%.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Ducklings expend up to 62.8% less energy when swimming in a line behind their mother than when swimming alone.\n- The physics behind this energy savings hasn’t always been well understood.\n- Naval architect Zhiming Yuan used computer simulations to study the effect of the mother duck’s wake.\n- The study revealed that ducklings are pushed in a forward direction by the wake’s waves.\n- Yuan determined this push reduces the effect of wave drag on the ducklings by 158%.", "stem": "The student wants to present the study and its methodology. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要介紹這項研究及其研究方法。下列哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n- 小鴨在母鴨後方排成一列游泳時，比單獨游泳少耗費多達 62.8% 的能量。\n- 這種節省能量背後的物理原理一直以來並未被充分理解。\n- 造船工程師 Zhiming Yuan 使用電腦模擬來研究母鴨尾流的影響。\n- 研究顯示，小鴨會被尾流的波浪往前推。\n- Yuan 確定這股推力使小鴨所受的波浪阻力影響減少了 158%。", "opts": {"A": "A study revealed that ducklings, which expend up to 62.8% less energy when swimming in a line behind their mother, also experience 158% less drag.", "B": "Seeking to understand how ducklings swimming in a line behind their mother save energy, Zhiming Yuan used computer simulations to study the effect of the mother duck’s wake.", "C": "Zhiming Yuan studied the physics behind the fact that by being pushed in a forward direction by waves, ducklings save energy.", "D": "Naval architect Zhiming Yuan discovered that ducklings are pushed in a forward direction by the waves of their mother’s wake, reducing the effect of drag by 158%."}, "optsZh": {"A": "一項研究顯示，小鴨排成一列跟在母鴨後面游泳時消耗的能量少達 62.8%，而且受到的阻力也少了 158%。", "B": "為了了解小鴨在母鴨後方排成一列游泳時如何節省能量，Zhiming Yuan 使用電腦模擬來研究母鴨尾流的影響。", "C": "Zhiming Yuan 研究了「小鴨被波浪往前推因而節省能量」這個事實背後的物理原理。", "D": "造船工程師 Zhiming Yuan 發現，小鴨會被母鴨尾流的波浪往前推，使阻力的影響減少了 158%。"}, "answer": "B", "expl": "B presents both the study's aim (how ducklings save energy) and its methodology (computer simulations of the mother's wake).", "explZh": "B 同時呈現研究的目的（小鴨如何節省能量）以及研究方法（用電腦模擬母鴨的尾流）。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: present study and methodology", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A records office classifies documents by risk; documents whose release could cause minor harm are Restricted; documents whose release could cause major harm are Sealed; routine budget drafts could cause minor but not major harm; the goal is to classify the drafts.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一個研究團隊在新證據使先前的解釋變得複雜之後，重新檢視了一個大家熟悉的說法。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步收斂到一個主張，而這個主張的措辭取決於各細節之間的精確關係，而非單一孤立的關鍵字。筆記：某個檔案室依風險為文件分級；公開後可能造成輕微傷害的文件列為「限閱」（Restricted）；公開後可能造成重大傷害的文件列為「封存」（Sealed）；例行的預算草案可能造成輕微但非重大的傷害；目標是為這些草案分級。", "opts": {"A": "Budget drafts are one kind of government document.", "B": "Because their release could cause minor but not major harm, routine budget drafts are classified as Restricted.", "C": "Sealed documents could cause major harm if released.", "D": "The records office classifies documents by release risk."}, "optsZh": {"A": "預算草案是政府文件的一種。", "B": "由於例行預算草案外洩可能造成輕微但不嚴重的損害，因此被歸類為「限制級」（Restricted）。", "C": "「密封級」文件一旦公開可能造成重大損害。", "D": "檔案室依公開風險為文件分類。"}, "answer": "B", "expl": "The answer applies the classification rule.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: present study and methodology", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scholar\" target=\"_blank\" rel=\"noopener\" data-w=\"scholar\" data-pos=\"n.\" data-en=\"a person who studies a subject in great detail\" data-zh=\"學者\">scholars<\/a> examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classify<\/a> diluted cleaner.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lab labels materials by hazard; materials that can irritate skin are Caution; materials that can cause severe injury are Danger; diluted cleaner can irritate skin but cannot cause severe injury; the goal is to classify diluted cleaner.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並沒有推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也使一個原本簡單的詮釋顯得不夠充分。筆記：某間實驗室依危險程度標示材料；可能刺激皮膚的材料標示為「小心」（Caution）；可能造成嚴重傷害的材料標示為「危險」（Danger）；稀釋過的清潔劑可能刺激皮膚，但不會造成嚴重傷害；目標是為稀釋清潔劑分類。", "opts": {"A": "Since it can irritate skin but cannot cause severe injury, diluted cleaner is labeled Caution.", "B": "Diluted cleaner is handled in a lab.", "C": "The lab uses hazard categories for materials.", "D": "Danger materials can cause severe injury."}, "optsZh": {"A": "由於稀釋過的清潔劑可能刺激皮膚但不會造成嚴重傷害，因此被標示為「注意級」（Caution）。", "B": "稀釋過的清潔劑在實驗室中處理。", "C": "該實驗室對材料採用危險等級分類。", "D": "「危險級」材料可能造成嚴重傷害。"}, "answer": "A", "expl": "The answer uses the correct category.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: present study and methodology", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A library classifies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A library classifies manuscripts by fragility; items that need careful handling are Monitored; items that cannot be handled by readers are Restricted; most nineteenth-century pamphlets need careful handling but can still be handled; the goal is to classify the pamphlets.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽圖錄會把一位藝術家、一件物品或一場表演，放在塑造它的社會與技術條件中加以介紹。圖錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：某間圖書館依脆弱程度為手稿分級；需要小心處理的物品列為「監控」（Monitored）；讀者不可接觸的物品列為「限閱」（Restricted）；大多數十九世紀的小冊子需要小心處理，但仍可由讀者翻閱；目標是為這些小冊子分級。", "opts": {"A": "Restricted manuscripts cannot be handled by readers.", "B": "The library classifies manuscripts by fragility.", "C": "Nineteenth-century pamphlets are historical documents.", "D": "Most nineteenth-century pamphlets are classified as Monitored because they need careful han
