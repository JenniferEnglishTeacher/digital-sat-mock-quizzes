 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Both towns had some volunteers.\nB) The program took place in a community.\nC) The table includes more than one year.\nD) The program was associated with a clear increase in trained volunteers compared with the town without the program.", "answer": "D", "explanation": "The comparison supports the program's effect."}]}, {"n": 15, "concept": "Command of Evidence: quotation showing regret.", "original": "King Lear is a circa 1606 play by William Shakespeare. In the play, the character of King Lear attempts to test his three daughters' devotion to him. He later expresses regret for his actions.\n\nWhich choice most effectively uses a quotation from King Lear to illustrate the claim?\nA) says of himself, \"I am a man / more sinned against than sinning.\"\nB) says during a growing storm, \"This tempest will not give me leave to ponder / On things would hurt me more.\"\nC) says to himself while striking his head, \"Beat at this gate that let thy folly in / And thy dear judgement out!\"\nD) says of himself, \"I will do such things- / What they are yet, I know not; but they shall be / The terrors of the earth!\"", "generated": [{"id": "15.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The leader's speeches are preserved in several archives.'\nB) 'The leader signed several decrees during his first month in office.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The administration faced economic challenges from the beginning.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "15.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nB) Some farmers grew vegetables, while others grew grain.\nC) The southern region was included in the survey.\nD) The graph contains information about three regions.", "answer": "A", "explanation": "The answer uses a specific contrast in the data."}, {"id": "15.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Some stars contain hydrogen and helium.\nB) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nC) One rocky planet has a thin atmosphere.\nD) The method used to study stars requires a telescope.", "answer": "B", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "15.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Some songs use a meter also found in older European poetry.\nC) Many performers learned songs from relatives.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "15.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The program took place in a community.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) Both towns had some volunteers.\nD) The table includes more than one year.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 16, "concept": "Logical Completion: history plays may be less engaging.", "original": "Many of William Shakespeare's tragedies address broad themes that still appeal to today's audiences. For instance, Romeo and Juliet, which is set in the Italy of Shakespeare's time, tackles the themes of parents versus children and love versus hate, and the play continues to be read and produced widely around the world. But understanding Shakespeare's so-called history plays can require a knowledge of several centuries of English history. Consequently, _______\n\nWhich choice most logically completes the text?\nA) many theatergoers and readers today are likely to find Shakespeare's history plays less engaging than the tragedies.\nB) some of Shakespeare's tragedies are more relevant to today's audiences than twentieth-century plays.\nC) Romeo and Juliet is the most thematically accessible of all Shakespeare's tragedies.\nD) experts in English history tend to prefer Shakespeare's history plays to his other works.", "generated": [{"id": "16.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______\n\nWhich choice most logically completes the text?\n\nA) making it harder for officials to identify neighborhoods where rent increases are unusually severe.\nB) preventing tenants from discussing rent changes with one another.\nC) encouraging landlords to repair apartments before raising rents.\nD) reducing tenants' interest in renewing leases.", "answer": "A", "explanation": "The concern is that confidentiality prevents outside evaluation."}, {"id": "16.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______\n\nWhich choice most logically completes the text?\n\nA) require hospitals to publish every patient's medical history.\nB) reduce the number of diseases that hospitals are able to study.\nC) make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.\nD) prevent companies from profiting from successful drugs.", "answer": "C", "explanation": "The issue is the inability of outside observers to evaluate fairness."}, {"id": "16.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______\n\nWhich choice most logically completes the text?\n\nA) force museums to return every object in their collections.\nB) obscure whether communities actually have meaningful influence over display decisions.\nC) prevent curators from learning about the objects' cultural meanings.\nD) discourage museums from preserving fragile objects.", "answer": "B", "explanation": "Sealed agreements make accountability difficult."}, {"id": "16.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______\n\nWhich choice most logically completes the text?\n\nA) reduce villages' knowledge of marine species.\nB) make it impossible for independent observers to judge whether compensation is equitable.\nC) increase the number of fish caught by local crews.\nD) stop companies from conducting ecological research.", "answer": "B", "explanation": "Private contracts prevent independent assessment of equity."}, {"id": "16.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______\n\nWhich choice most logically completes the text?\n\nA) increase the cost of recording equipment.\nB) require speakers to learn programming skills.\nC) discourage researchers from documenting endangered languages.\nD) prevent outsiders from verifying whether speakers are paid fairly.", "answer": "D", "explanation": "The concern is lack of transparent verification."}]}, {"n": 17, "concept": "Logical Completion: migration supported by genetic evidence.", "original": "Ancestral Puebloans, the civilization from which present-day Pueblo tribes descended, emerged as early as 1500 B.C.E. in an area of what is now the southwestern United States and dispersed suddenly in the late 1200s C.E., abandoning established villages with systems for farming crops and turkeys. Recent analysis comparing turkey remains at Mesa Verde, one such village in southern Colorado, to samples from modern turkey populations in the Rio Grande Valley of north central New Mexico determined that the latter birds descended in part from turkeys cultivated at Mesa Verde, with shared genetic markers appearing only after 1280. Thus, researchers concluded that _______\n\nWhich choice most logically completes the text?\nA) conditions of the terrains in the Rio Grande Valley and Mesa Verde had greater similarities in the past than they do today.\nB) some Ancestral Puebloans migrated to the Rio Grande Valley in the late 1200s and carried farming practices with them.\nC) Indigenous peoples living in the Rio Grande Valley primarily planted crops and did not cultivate turkeys before 1280.\nD) the Ancestral Puebloans of Mesa Verde likely adopted the farming practices of Indigenous peoples living in other regions.", "generated": [{"id": "17.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the plant probably reached the islands without human assistance.\nB) the island populations were domesticated before mainland populations.\nC) human traders must have transported the seeds recently.\nD) all island plants descended from a single cultivated variety.", "answer": "A", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "17.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the beetles were likely introduced by natural dispersal rather than by humans.\nB) the beetles were domesticated by island communities.\nC) humans carried the beetles to the island during early trade voyages.\nD) the island beetles must be younger than the coastal beetles.", "answer": "A", "explanation": "The timing rules out human introduction."}, {"id": "17.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the migration must have begun earlier than any other human movement.\nB) the song could not have changed after the migration.\nC) all versions of the song are identical.\nD) the song was probably not introduced to the archipelago by that migration.", "answer": "D", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "17.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) the crop was first domesticated on the island.\nB) mainland farmers acquired the crop from island communities.\nC) human settlement probably did not account for the plant's original arrival on the island.\nD) the island variety must be genetically identical to wild mainland plants.", "answer": "C", "explanation": "The plant's arrival predates human settlement."}, {"id": "17.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the lakes did not contain snails until boating began.\nB) the snails likely spread through an earlier nonhuman mechanism.\nC) human activity made the populations genetically identical.\nD) boats probably explain every modern snail population.", "answer": "B", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 18, "concept": "Logical Completion: control group difficulty.", "original": "One challenge when researching whether holding elected office changes a person's behavior is the problem of ensuring that the experiment has an appropriate control group. To reveal the effect of holding office, researchers must compare people who hold elected office with people who do not hold office but who are otherwise similar to the office-holders. Since researchers are unable to control which politicians win elections, they therefore _______\n\nWhich choice most logically completes the text?\nA) struggle to find valid data about the behavior of politicians who do not currently hold office.\nB) can only conduct valid studies with people who have previously held office rather than people who presently hold office.\nC) should select a control group of people who differ from office holders in several significant ways.\nD) will find it difficult to identify a group of people who can function as an appropriate control group for their studies.", "generated": [{"id": "18.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______\n\nWhich choice most logically completes the text?\n\nA) making it harder for officials to identify neighborhoods where rent increases are unusually severe.\nB) preventing tenants from discussing rent changes with one another.\nC) encouraging landlords to repair apartments before raising rents.\nD) reducing tenants' interest in renewing leases.", "answer": "A", "explanation": "The concern is that confidentiality prevents outside evaluation."}, {"id": "18.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______\n\nWhich choice most logically completes the text?\n\nA) require hospitals to publish every patient's medical history.\nB) reduce the number of diseases that hospitals are able to study.\nC) prevent companies from profiting from successful drugs.\nD) make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.", "answer": "D", "explanation": "The issue is the inability of outside observers to evaluate fairness."}, {"id": "18.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______\n\nWhich choice most logically completes the text?\n\nA) force museums to return every object in their collections.\nB) discourage museums from preserving fragile objects.\nC) obscure whether communities actually have meaningful influence over display decisions.\nD) prevent curators from learning about the objects' cultural meanings.", "answer": "C", "explanation": "Sealed agreements make accountability difficult."}, {"id": "18.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______\n\nWhich choice most logically completes the text?\n\nA) reduce villages' knowledge of marine
