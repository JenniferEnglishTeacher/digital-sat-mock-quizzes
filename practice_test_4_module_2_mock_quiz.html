不然。", "C": "南部地區有被納入調查。", "D": "有些農民種植蔬菜，而其他農民種植穀物。"}, "answer": "B", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Command of Evidence: quotation illustrating contrast.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "B": "研究恆星的方法需要用到望遠鏡。", "C": "有一顆岩石行星的大氣層很稀薄。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Command of Evidence: quotation illustrating contrast.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "The tradition is studied by scholars in several countries.", "C": "Some songs use a meter also found in older European poetry.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "許多表演者從親戚那裡學會歌曲。", "B": "好幾個國家的學者都在研究這項傳統。", "C": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。", "D": "有數首民謠包含了當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Command of Evidence: quotation illustrating contrast.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The program took place in a community.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這張表格包含不只一年的資料。", "B": "與沒有實施計畫的城鎮相比，這個計畫與受過訓練的志工明顯增加有關。", "C": "這個計畫在一個社區中實施。", "D": "兩個城鎮都有一些志工。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o13", "label": "Original Q13", "n": 13, "concept": "Quantitative Evidence: graph data showing specific uncertainty differs from general.", "vocab": false, "body": "<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=economic\" target=\"_blank\" rel=\"noopener\" data-w=\"economic\" data-pos=\"adj.\" data-en=\"related to money, trade, and industry\" data-zh=\"經濟的\">Economic<\/a> Policy <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncertainty\" target=\"_blank\" rel=\"noopener\" data-w=\"uncertainty\" data-pos=\"n.\" data-en=\"the state of not being sure\" data-zh=\"不確定性\">Uncertainty<\/a> in the United Kingdom, 2005-2010<br><br>High levels of public uncertainty about which economic policies a country will adopt can make planning difficult for businesses, but measures of such uncertainty have not tended to be very <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detailed<\/a>. Recently, however, economist Sandile Hlatshwayo <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=analyze\" target=\"_blank\" rel=\"noopener\" data-w=\"analyze\" data-pos=\"v.\" data-en=\"to examine something carefully in order to understand it\" data-zh=\"分析\">analyzed<\/a> trends in news reports to derive measures not only for general economic policy uncertainty but also for uncertainty related to specific areas of economic policy, like tax or trade policy. One revelation of her work is that a general measure may not fully reflect uncertainty about specific areas of policy, as in the case of the United Kingdom, where general economic policy uncertainty _______", "bodyPlain": "Economic Policy Uncertainty in the United Kingdom, 2005-2010\n\nHigh levels of public uncertainty about which economic policies a country will adopt can make planning difficult for businesses, but measures of such uncertainty have not tended to be very detailed. Recently, however, economist Sandile Hlatshwayo analyzed trends in news reports to derive measures not only for general economic policy uncertainty but also for uncertainty related to specific areas of economic policy, like tax or trade policy. One revelation of her work is that a general measure may not fully reflect uncertainty about specific areas of policy, as in the case of the United Kingdom, where general economic policy uncertainty _______", "stem": "Which choice most effectively uses data from the graph to illustrate the claim?", "stemZh": "下列哪一個選項最有效地運用圖表中的數據來說明這項主張？", "bodyZh": "英國的經濟政策不確定性，2005–2010 年\n大眾對國家將採取哪些經濟政策的高度不確定，可能使企業難以規劃，但對這種不確定性的衡量往往不夠詳細。然而，經濟學家 Sandile Hlatshwayo 最近分析了新聞報導的趨勢，不僅得出了整體經濟政策不確定性的衡量指標，也得出了與特定經濟政策領域（如稅務或貿易政策）相關的不確定性指標。她的研究揭示的一點是，整體的衡量指標可能無法完全反映對特定政策領域的不確定性，就像英國的情況一樣，英國的整體經濟政策不確定性 _______", "opts": {"A": "aligned closely with uncertainty about tax and public spending policy in 2005 but differed from uncertainty about tax and public spending policy by a large amount in 2009.", "B": "was substantially lower than uncertainty about tax and public spending policy each year from 2005 to 2010.", "C": "reached its highest level between 2005 and 2010 in the same year that uncertainty about trade policy and tax and public spending policy reached their lowest levels.", "D": "was substantially lower than uncertainty about trade policy in 2005 and substantially higher than uncertainty about trade policy in 2010."}, "optsZh": {"A": "在 2005 年與對稅收及公共支出政策的不確定性非常接近，但在 2009 年與對稅收及公共支出政策的不確定性差距很大。", "B": "每年從 2005 年到 2010 年都大幅低於對稅收與公共支出政策的不確定性。", "C": "在 2005 至 2010 年間達到最高點的那一年，正是對貿易政策以及對稅收與公共支出政策的不確定性降到最低的同一年。", "D": "在 2005 年大幅低於對貿易政策的不確定性，而在 2010 年則大幅高於對貿易政策的不確定性。"}, "answer": "A", "expl": "Showing that general uncertainty matched tax-policy uncertainty in one year but differed greatly in another best illustrates that a general measure may not fully reflect a specific area.", "explZh": "說明一般經濟政策不確定性某一年與稅收政策不確定性一致，另一年卻差距很大，最能說明一般指標不一定能完全反映特定領域的不確定性。"}, {"id": "13.1", "label": "Mock 13.1", "n": 13, "concept": "Quantitative Evidence: graph data showing specific uncertainty differs from general.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人在建國過程中的象徵性角色，比他短暫且表現參差的執政紀錄更重要。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "13.2", "label": "Mock 13.2", "n": 13, "concept": "Quantitative Evidence: graph data showing specific uncertainty differs from general.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to help show that something is true; to back an idea\" data-zh=\"支持；佐證\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持關於各地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The southern region was included in the survey.", "D": "Women formed a majority of southern vegetable growers but not of northern or central grain growers."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "有些農民種植蔬菜，而其他農民種植穀物。", "C": "南部地區有被納入調查。", "D": "在南部的蔬菜種植者中女性占多數，但在北部或中部的穀物種植者中則不然。"}, "answer": "D", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "13.3", "label": "Mock 13.3", "n": 13, "concept": "Quantitative Evidence: graph data showing specific uncertainty differs from general.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "B": "研究恆星的方法需要用到望遠鏡。", "C": "有一顆岩石行星的大氣層很稀薄。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "13.4", "label": "Mock 13.4", "n": 13, "concept": "Quantitative Evidence: graph data showing specific uncertainty differs from general.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "Some songs use a meter also found in older European poetry.", "D": "Many performers learned songs from relatives."}, "optsZh": {"A": "好幾個國家的學者都在研究這項傳統。", "B": "有數首民謠包含了當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "C": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。", "D": "許多表演者從親戚那裡學會歌曲。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "13.5", "label": "Mock 13.5", "n": 13, "concept": "Quantitative Evidence: graph data showing specific uncertainty differs from general.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "Both towns had some volunteers.", "C": "The program took place in a community.", "D": "The table includes more than one year."}, "optsZh": {"A": "與沒有實施計畫的城鎮相比，這個計畫與受過訓練的志工明顯增加有關。", "B": "兩個城鎮都有一些志工。", "C": "這個計畫在一個社區中實施。", "D": "這張表格包含不只一年的資料。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Command of Evidence: support hypothesis about informative formats.", "vocab": false, "body": "Linguist Deborah Tannen has cautioned against framing contentious issues in terms of two highly competitive <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspectives<\/a>, such as pro versus con. According to Tannen, this debate-driven approach can strip issues of their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complexity\" target=\"_blank\" rel=\"noopener\" data-w=\"complexity\" data-pos=\"n.\" data-en=\"the state of having many connected parts; being complicated\" data-zh=\"複雜性\">complexity<\/a> and, when used in front of an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, can be less informative than the presentation of multiple perspectives in a noncompetitive format. To test Tannen&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a>, students conducted a study in which they showed participants one of three different versions of local news commentary about the same issue. Each version featured a debate between two commentators with opposing views, a panel of three commentators with various views, or a single commentator.", "bodyPlain": "Linguist Deborah Tannen has cautioned against framing contentious issues in terms of two highly competitive perspectives, such as pro versus con. According to Tannen, this debate-driven approach can strip issues of their complexity and, when used in front of an audience, can be less informative than the presentation of multiple perspectives in a noncompetitive format. To test Tannen's hypothesis, students conducted a study in which they showed participants one of three different versions of local news commentary about the same issue. Each version featured a debate between two commentators with opposing views, a panel of three commentators with various views, or a single commentator.", "stem": "Which finding from the students' study, if true, would most strongly support Tannen's hypothesis?", "stemZh": "如果下列學生研究中的哪一項發現屬實，最能支持 Tannen 的假說？", "bodyZh": "語言學家 Deborah Tannen 告誡人們，不要用兩個高度對立競爭的觀點（例如正方與反方）來框架具爭議性的議題。根據 Tannen 的說法，這種以辯論為主的方式可能會剝奪議題的複雜性，而且在觀眾面前使用時，可能比以非競爭的形式呈現多元觀點更缺乏資訊性。為了驗證 Tannen 的假設，學生們進行了一項研究，讓參與者觀看關於同一議題的三種不同版本地方新聞評論中的其中一種。每個版本分別呈現兩位持相反觀點的評論員之間的辯論、由三位觀點各異的評論員組成的座談，或是單一一位評論員。", "opts": {"A": "On average, participants perceived commentators in the debate as more knowledgeable about the issue than commentators in the panel.", "B": "On average, participants perceived commentators in the panel as more knowledgeable about the issue than the single commentator.", "C": "On average, participants who watched the panel correctly answered more questions about the issue than those who watched the debate or the single commentator did.", "D": "On average, participants who watched the single commentator correctly answered more questions about the issue than those who watched the debate did."}, "optsZh": {"A": "平均而言，參與者認為辯論中的評論員比小組討論中的評論員對該議題更有見識。", "B": "平均而言，參與者認為小組討論中的評論員比單一評論員對該議題更有見識。", "C": "平均而言，觀看小組討論的參與者答對與該議題相關問題的數量，多於觀看辯論或單一評論員的參與者。", "D": "平均而言，觀看單一評論員的參與者答對與該議題相關問題的數量，多於觀看辯論的參與者。"}, "answer": "C", "expl": "Tannen claims multiple perspectives in a noncompetitive format are more informative than a debate; participants who watched the panel answering more questions correctly supports this.", "explZh": "Tannen 認為以非競爭形式呈現多元觀點比辯論更具資訊性；觀看小組討論（多元觀點）的受試者答對較多題目，正好支持此假設。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Command of Evidence: support hypothesis about informative formats.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟挑戰。」", "B": "「這位領導人在上任第一個月內簽署了數項法令。」", "C": "「這位領導人在建國過程中的象徵性角色，比他短暫且表現參差的執政紀錄更重要。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Command of Evidence: support hypothesis about informative formats.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to help show that something is true; to back an idea\" data-zh=\"支持；佐證\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持關於各地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "The graph contains information about three regions.", "C": "Some farmers grew vegetables, while others grew grain.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "在南部的蔬菜種植者中女性占多數，但在北部或中部的穀物種植者中則不然。", "B": "這張圖表包含三個地區的資訊。", "C": "有些農民種植蔬菜，而其他農民種植穀物。", "D": "南部地區有被納入調查。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Command of Evidence: support hypothesis about informative formats.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "研究恆星的方法需要用到望遠鏡。", "C": "有一顆岩石行星的大氣層很稀薄。", "D": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。"}, "answer": "D", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Command of Evidence: support hypothesis about informative formats.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Many performers learned songs from relatives.", "B": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "C": "The tradition is studied by scholars in several countries.", "D": "Some songs use a meter also found in older European poetry."}, "optsZh": {"A": "許多表演者從親戚那裡學會歌曲。", "B": "有數首民謠包含了當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "C": "好幾個國家的學者都在研究這項傳統。", "D": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。"}, "answer": "B", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Command of Evidence: support hypothesis about informative formats.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "Both towns had some volunteers.", "B": "The program took place in a community.", "C": "The table includes more than one year.", "D": "The program was associated with a clear increase in trained volunteers compared with the town without the program."}, "optsZh": {"A": "兩個城鎮都有一些志工。", "B": "這個計畫在一個社區中實施。", "C": "這張表格包含不只一年的資料。", "D": "與沒有實施計畫的城鎮相比，這個計畫與受過訓練的志工明顯增加有關。"}, "answer": "D", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Command of Evidence: quotation showing regret.", "vocab": false, "body": "King Lear is a circa 1606 play by William Shakespeare. In the play, the character of King Lear <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attempt\" target=\"_blank\" rel=\"noopener\" data-w=\"attempt\" data-pos=\"v.\" data-en=\"to try to do something\" data-zh=\"嘗試；企圖\">attempts<\/a> to test his three daughters&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=devotion\" target=\"_blank\" rel=\"noopener\" data-w=\"devotion\" data-pos=\"n.\" data-en=\"great love, loyalty, or commitment\" data-zh=\"忠誠；摯愛\">devotion<\/a> to him. He later <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=express\" target=\"_blank\" rel=\"noopener\" data-w=\"express\" data-pos=\"v.\" data-en=\"to show a feeling or opinion in words or actions\" data-zh=\"表達\">expresses<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=regret\" target=\"_blank\" rel=\"noopener\" data-w=\"regret\" data-pos=\"n.\" data-en=\"a feeling of sadness about something you did\" data-zh=\"懊悔；遺憾\">regret<\/a> for his actions.", "bodyPlain": "King Lear is a circa 1606 play by William Shakespeare. In the play, the character of King Lear attempts to test his three daughters' devotion to him. He later expresses regret for his actions.", "stem": "Which choice most effectively uses a quotation from King Lear to illustrate the claim?", "stemZh": "下列哪一個選項最有效地引用《李爾王》（King Lear）中的句子來說明這項主張？", "bodyZh": "《King Lear》是 William Shakespeare 約於 1606 年創作的劇本。在劇中，King Lear 這個角色試圖考驗他三個女兒對他的忠誠。他後來對自己的行為表示懊悔。", "opts": {"A": "says of himself, \"I am a man / more sinned against than sinning.\"", "B": "says during a growing storm, \"This tempest will not give me leave to ponder / On things would hurt me more.\"", "C": "says to himself while striking his head, \"Beat at this gate that let thy folly in / And thy dear judgement out!\"", "D": "says of himself, \"I will do such things- / What they are yet, I know not; but they shall be / The terrors of the earth!\""}, "optsZh": {"A": "這樣形容自己：「我是一個／受人之害多於害人的人。」", "B": "在暴風雨漸強時說：「這場暴風雨不容我去細想／那些會更傷我心的事。」", "C": "一邊捶打自己的頭一邊自言自語：「敲打這道門吧，它放進了你的愚蠢，／卻放走了你寶貴的判斷力！」", "D": "這樣形容自己：「我要做出這樣的事——／是什麼我還不知道，但它們將成為／令世間恐懼之事！」"}, "answer": "C", "expl": "Lear strikes his head and blames the 'gate' (his mind) for letting in 'folly' and letting out 'judgement,' expressing regret for his foolish actions.", "explZh": "李爾王捶打自己的頭，責怪自己讓「愚蠢」進來、讓「判斷力」溜走，表達對自己愚行的懊悔。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Command of Evidence: quotation showing regret.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在上任第一個月內簽署了數項法令。」", "C": "「這位領導人在建國過程中的象徵性角色，比他短暫且表現參差的執政紀錄更重要。」", "D": "「這個政府從一開始就面臨經濟挑戰。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Command of Evidence: quotation showing regret.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to help show that something is true; to back an idea\" data-zh=\"支持；佐證\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持關於各地區作物模式的主張？", "opts": {"A": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "The southern region was included in the survey.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "在南部的蔬菜種植者中女性占多數，但在北部或中部的穀物種植者中則不然。", "B": "有些農民種植蔬菜，而其他農民種植穀物。", "C": "南部地區有被納入調查。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "A", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Command of Evidence: quotation showing regret.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "One rocky planet has a thin atmosphere.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "C": "有一顆岩石行星的大氣層很稀薄。", "D": "研究恆星的方法需要用到望遠鏡。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Command of Evidence: quotation showing regret.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Some songs use a meter also found in older European poetry.", "C": "Many performers learned songs from relatives.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "好幾個國家的學者都在研究這項傳統。", "B": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。", "C": "許多表演者從親戚那裡學會歌曲。", "D": "有數首民謠包含了當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Command of Evidence: quotation showing regret.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program took place in a community.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "Both towns had some volunteers.", "D": "The table includes more than one year."}, "optsZh": {"A": "這個計畫在一個社區中實施。", "B": "與沒有實施計畫的城鎮相比，這個計畫與受過訓練的志工明顯增加有關。", "C": "兩個城鎮都有一些志工。", "D": "這張表格包含不只一年的資料。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Logical Completion: history plays may be less engaging.", "vocab": false, "body": "Many of William Shakespeare&#x27;s tragedies <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=address\" target=\"_blank\" rel=\"noopener\" data-w=\"address\" data-pos=\"v.\" data-en=\"to deal with or try to solve a problem\" data-zh=\"處理；解決（問題）\">address<\/a> broad themes that still appeal to today&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audiences<\/a>. For instance, Romeo and Juliet, which is set in the Italy of Shakespeare&#x27;s time, tackles the themes of parents versus children and love versus hate, and the play continues to be read and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produced\" target=\"_blank\" rel=\"noopener\" data-w=\"produced\" data-pos=\"v.\" data-en=\"made or created something\" data-zh=\"製造；產生\">produced<\/a> widely around the world. But understanding Shakespeare&#x27;s so-called history plays can require a knowledge of several centuries of English history. Consequently, _______", "bodyPlain": "Many of William Shakespeare's tragedies address broad themes that still appeal to today's audiences. For instance, Romeo and Juliet, which is set in the Italy of Shakespeare's time, tackles the themes of parents versus children and love versus hate, and the play continues to be read and produced widely around the world. But understanding Shakespeare's so-called history plays can require a knowledge of several centuries of English history. Consequently, _______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "William Shakespeare 的許多悲劇探討廣泛的主題，至今仍能吸引觀眾。例如，以 Shakespeare 時代的義大利為背景的《Romeo and Juliet》，探討了父母與子女、愛與恨的對立主題，這部劇至今仍在世界各地被廣泛閱讀與演出。但要理解 Shakespeare 所謂的歷史劇，可能需要了解數個世紀的英國歷史。因此，_______", "opts": {"A": "many theatergoers and readers today are likely to find Shakespeare's history plays less engaging than the tragedies.", "B": "some of Shakespeare's tragedies are more relevant to today's audiences than twentieth-century plays.", "C": "Romeo and Juliet is the most thematically accessible of all Shakespeare's tragedies.", "D": "experts in English history tend to prefer Shakespeare's history plays to his other works."}, "optsZh": {"A": "今天的許多觀眾和讀者可能會覺得莎士比亞的歷史劇不如悲劇引人入勝。", "B": "莎士比亞的某些悲劇比 20 世紀的戲劇更貼近現今觀眾。", "C": "《羅密歐與茱麗葉》是莎士比亞所有悲劇中主題最容易理解的一部。", "D": "英國史專家往往偏好莎士比亞的歷史劇勝過他的其他作品。"}, "answer": "A", "expl": "Because the history plays require knowledge of English history, many modern audiences would likely find them less engaging than the tragedies with broad themes.", "explZh": "歷史劇需要了解數百年的英國歷史，因此現代觀眾和讀者很可能覺得它們不如主題普遍的悲劇那麼吸引人。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Logical Completion: history plays may be less engaging.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一項城市政策要求房東向房客揭露租金調漲資訊，但允許這些通知不提供給公部門機關。住房權益倡議者警告，這項政策可能會產生意想不到的效果，即 ______", "opts": {"A": "making it harder for officials to identify neighborhoods where rent increases are unusually severe.", "B": "preventing tenants from discussing rent changes with one another.", "C": "encouraging landlords to repair apartments before raising rents.", "D": "reducing tenants' interest in renewing leases."}, "optsZh": {"A": "使官員更難找出租金漲幅異常嚴重的社區。", "B": "阻止房客彼此討論租金變動。", "C": "鼓勵房東在調漲租金前先修繕公寓。", "D": "降低房客續租的意願。"}, "answer": "A", "expl": "The concern is that confidentiality prevents outside evaluation.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Logical Completion: history plays may be less engaging.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocates<\/a> argue that the rule could ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一項補助計畫鼓勵製藥公司與公立醫院合作，但允許這些公司對每份研究協議的條款保密。病患權益倡議者認為，這項規定可能會 ______", "opts": {"A": "require hospitals to publish every patient's medical history.", "B": "reduce the number of diseases that hospitals are able to study.", "C": "make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.", "D": "prevent companies from profiting from successful drugs."}, "optsZh": {"A":
