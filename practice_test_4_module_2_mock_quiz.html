  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: predicted future growth.", "original": "The fashion resale market, in which consumers purchase secondhand clothing from stores and online sellers, generated nearly $30 billion globally in 2019. Expecting to see continued growth, some analysts _______ that revenues will more than double by 2028.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) produced\nB) denied\nC) worried\nD) predicted", "generated": [{"id": "1.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. After reviewing sales records and demographic changes, analysts ______ that demand for electric bicycles would continue rising in dense urban areas over the next decade.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) worried\nB) predicted\nC) produced\nD) denied", "answer": "B", "explanation": "Predicted means forecasted."}, {"id": "1.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The research group ______ that coastal flooding would become more frequent if sea levels continued to rise, a conclusion supported by several climate models.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) questioned\nB) repaired\nC) projected\nD) imitated", "answer": "C", "explanation": "Projected means predicted from evidence."}, {"id": "1.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Based on early enrollment numbers, university officials ______ that the new data-science program would need additional instructors by its second year.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) ignored\nB) collected\nC) minimized\nD) forecast", "answer": "D", "explanation": "Forecast means predict."}, {"id": "1.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Economists ______ a gradual recovery in tourism revenue after travel restrictions were lifted, though they warned that the pace would vary by region.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) anticipated\nB) replaced\nC) produced\nD) denied", "answer": "A", "explanation": "Anticipated means expected or predicted."}, {"id": "1.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineers ______ that the bridge would require major repairs within fifteen years if traffic volume kept increasing at the current rate.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) worried\nB) estimated\nC) created\nD) illustrated", "answer": "B", "explanation": "Estimated means made a reasoned prediction."}]}, {"n": 2, "concept": "Words in Context: overcome a problem.", "original": "Artificially delivering biomolecules to plant cells is an important component of protecting plants from pathogens, but it is difficult to transmit biomolecules through the layers of the plant cell wall. Markita del Carpio Landry and her colleagues have shown that it may be possible to _______ this problem by transmitting molecules through carbon nanotubes, which can cross cell walls.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) conceptualize\nB) neglect\nC) illustrate\nD) overcome", "generated": [{"id": "2.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The membrane blocks many useful compounds from entering the cell, but the team's new carrier molecule may help researchers ______ that barrier.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) neglect\nB) illustrate\nC) overcome\nD) conceptualize", "answer": "C", "explanation": "Overcome means successfully deal with a problem."}, {"id": "2.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The first design failed in windy conditions, so the engineers added flexible joints to ______ the stability problem without increasing the tower's weight.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) describe\nB) neglect\nC) imitate\nD) resolve", "answer": "D", "explanation": "Resolve means solve."}, {"id": "2.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Because the database contained inconsistent spellings of names, the historians developed a matching algorithm to ______ the obstacle before analyzing migration patterns.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) illustrate\nB) surmount\nC) define\nD) ignore", "answer": "B", "explanation": "Surmount means overcome."}, {"id": "2.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The vaccine had to remain cold during transport, but researchers found that a powdered formula could ______ this limitation by staying stable at room temperature.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) circumvent\nB) worsen\nC) neglect\nD) document", "answer": "A", "explanation": "Circumvent means find a way around a difficulty."}, {"id": "2.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeological site was partly underwater, so the team used floating platforms to ______ the challenge of excavating fragile objects in shifting mud.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) address\nB) conceptualize\nC) deny\nD) replicate", "answer": "A", "explanation": "Address means deal with a problem."}]}, {"n": 3, "concept": "Words in Context: inspecting invisible phenomena.", "original": "Particle physicists like Ayana Holloway Arce and Aida El-Khadra spend much of their time _______ what is invisible to the naked eye: using sophisticated technology, they closely examine the behavior of subatomic particles, the smallest detectable parts of matter.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) selecting\nB) inspecting\nC) creating\nD) deciding", "generated": [{"id": "3.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Conservators spent months ______ the barely visible underdrawing beneath the painting's surface, using infrared cameras to study lines hidden below layers of pigment.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) creating\nB) selecting\nC) deciding\nD) inspecting", "answer": "D", "explanation": "Inspecting means examining closely."}, {"id": "3.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The physician was ______ the scan for minute changes in tissue density that might indicate an early stage of disease.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) inventing\nB) postponing\nC) examining\nD) choosing", "answer": "C", "explanation": "Examining means inspecting carefully."}, {"id": "3.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers are ______ faint signals from distant galaxies, separating them from background noise with instruments more sensitive than the human eye.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) selecting\nB) creating\nC) denying\nD) analyzing", "answer": "D", "explanation": "Analyzing means examining in detail."}, {"id": "3.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The materials scientist spent the afternoon ______ microscopic cracks in the alloy to determine why the component had failed under pressure.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) deciding\nB) scrutinizing\nC) selecting\nD) creating", "answer": "B", "explanation": "Scrutinizing means examining very carefully."}, {"id": "3.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Using a high-resolution scanner, the archivist began ______ erased writing on the manuscript page, hoping to recover a text hidden for centuries.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) detecting\nB) choosing\nC) reviewing\nD) creating", "answer": "A", "explanation": "Detecting means discovering or identifying something hard to see."}]}, {"n": 4, "concept": "Words in Context: comparable to.", "original": "Anthropologist Kristian J. Carlson and colleagues examined the fossilized clavicle and shoulder bones of a 3.6-million-year-old early hominin known as \"Little Foot.\" They found that these bones were _______ the clavicle and shoulder bones of modern apes that are frequent climbers, such as gorillas and chimpanzees, suggesting that Little Foot had adapted to life in the trees.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) surpassed by\nB) comparable to\nC) independent of\nD) obtained from", "generated": [{"id": "4.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The newly discovered footprints are ______ those of known early hominins, suggesting that the individuals who made them may have walked in a similar way.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) comparable to\nB) obtained from\nC) surpassed by\nD) independent of", "answer": "A", "explanation": "Comparable to means similar enough to compare."}, {"id": "4.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Chemical traces in the pottery were ______ residues found in vessels used for fermenting grain, so the archaeologists proposed that the jars once held beer.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) separate from\nB) borrowed from\nC) superior to\nD) similar to", "answer": "D", "explanation": "Similar to means comparable to."}, {"id": "4.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The storm's wind speeds were ______ those recorded during the region's most destructive hurricanes, although the storm caused less flooding.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) surpassed by\nB) consistent with\nC) unrelated to\nD) obtained from", "answer": "B", "explanation": "Consistent with means comparable or in agreement."}, {"id": "4.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The bone structure of the fossil bird is ______ that of modern diving birds, indicating that the ancient species may also have pursued prey underwater.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) independent of\nB) derived from\nC) analogous to\nD) inferior to", "answer": "C", "explanation": "Analogous to means similar in relevant ways."}, {"id": "4.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The fabric's strength was ______ that of lightweight steel, an unexpected result for a material made from plant fibers.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) equivalent to\nB) weaker than\nC) obtained from\nD) unrelated to", "answer": "A", "explanation": "Equivalent to means equal or comparable."}]}, {"n": 5, "concept": "Words in Context: not atypical.", "original": "Rydra Wong, the protagonist of Samuel R. Delany's 1966 novel Babel-17, is a poet, an occupation which, in Delany's work, is not _______: nearly a dozen of the characters that populate his novels are poets or writers.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) infallible\nB) atypical\nC) lucrative\nD) tedious", "generated": [{"id": "5.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In the novelist's work, unreliable narrators are not ______; several of her best-known books are told by characters whose accounts contradict the evidence around them.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) infallible\nB) lucrative\nC) tedious\nD) atypical", "answer": "D", "explanation": "Atypical means unusual."}, {"id": "5.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. References to astronomy are hardly ______ in the poet's later collections; images of eclipses, planets, and star charts appear throughout them.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) infallible\nB) tedious\nC) unusual\nD) profitable", "answer": "C", "explanation": "Unusual means atypical."}, {"id": "5.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The use of recycled materials is not ______ in the designer's furniture: chairs, tables, and lamps across multiple collections incorporate reclaimed wood and metal.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) tedious\nB) lucrative\nC) rare\nD) infallible", "answer": "C", "explanation": "Rare means uncommon or atypical."}, {"id": "5.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Musicians appear so frequently in the filmmaker's movies that such characters can no longer be considered ______ within her body of work.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) profitable\nB) exceptional\nC) tedious\nD) infallible", "answer": "B", "explanation": "Exceptional can mean unusual."}, {"id": "5.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Although the painting's format may seem surprising at first, triptychs are not ______ in the artist's career; she returned to the three-panel structure repeatedly.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) uncommon\nB) lucrative\nC) infallible\nD) tedious", "answer": "A", "explanation": "Uncommon means atypical."}]}, {"n": 6, "concept": "Words in Context: created new images.", "original": "For a 2020 exhibition, photographer and neurobiologist Okunola Jeyifous _______ a series of new images based on a series of alphabet posters from the 1970s known as the \"Black ABCs,\" which featured Black children from Chicago. Jeyifous photographed the now-adult models and layered the photos over magnified images of the models' cells, resulting in what he called \"micro and macro portraiture.\"\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) validated\nB) created\nC) challenged\nD) restored", "generated": [{"id": "6.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. For the museum's new installation, the artist ______ a set of portraits by combining recent photographs with fragments of letters written by the subjects' grandparents.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) validated\nB) restored\nC) created\nD) challenged", "answer": "C", "explanation": "Created means made."}, {"id": "6.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The composer ______ a suite of short pieces based on folk melodies she recorded during fieldwork in mountain villages.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) denied\nB) restored\nC) validated\nD) produced", "answer": "D", "explanation": "Produced means created."}, {"id": "6.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Using satellite imagery and archival maps, the designer ______ a series of layered prints showing how the coastline had shifted over a century.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) assembled\nB) validated\nC) challenged\nD) restored", "answer": "A", "explanation": "Assembled means put together or created from parts."}, {"id": "6.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The choreographer ______ a new performance from interviews with nurses, combining spoken testimony with repeated movements that suggested exhaustion and care.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) validated\nB) restored\nC) challenged\nD) devised", "answer": "D", "explanation": "Devised means created or planned."}, {"id": "6.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The illustrator ______ new images for the edition, replacing the earlier black-and-white drawings with full-color scenes.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) restored\nB) generated\nC) validated\nD) challenged", "answer": "B", "explanation": "Generated means produced or created."}]}, {"n": 7, "concept": "Words in Context: proponent or advocate.", "original": "In addition to being an accomplished psychologist himself, Francis Cecil Sumner was a _______ increasing the opportunity for Black students to study psychology, helping to found the psychology department at Howard University, a historically Black university, in 1930.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) proponent of\nB) supplement to\nC) beneficiary of\nD) distraction for", "generated": [{"id": "7.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The journalist was a ______ press freedom, arguing that democratic societies depend on reporters' ability to investigate powerful institutions without intimidation.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) supplement to\nB) beneficiary of\nC) proponent of\nD) distraction for", "answer": "C", "explanation": "A proponent is a supporter or advocate."}, {"id": "7.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The mayor became an ______ expanded public transit, repeatedly calling for bus routes that would connect workers to jobs outside the city center.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) distraction from\nB) obstacle to\nC) advocate for\nD) beneficiary of", "answer": "C", "explanation": "An advocate is a supporter."}, {"id": "7.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Throughout her career, the physician was a ______ vaccination campaigns in rural areas, helping establish clinics where few medical services had existed.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) supplement to\nB) beneficiary of\nC) critic of\nD) champion of", "answer": "D", "explanation": "Champion means strong supporter."}, {"id": "7.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The historian was a ______ preserving community archives, insisting that local letters and photographs were essential evidence of everyday life.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) beneficiary of\nB) supporter of\nC) distraction from\nD) critic of", "answer": "B", "explanation": "Supporter means proponent."}, {"id": "7.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. As a lawyer, she became a prominent ______ tenants' rights, representing families facing eviction and lobbying for stronger housing protections.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) defender of\nB) supplement to\nC) distraction for\nD) beneficiary of", "answer": "A", "explanation": "Defender means advocate or supporter."}]}, {"n": 8, "concept": "Words in Context: buttress a claim or right.", "original": "Whether the reign of a French monarch such as Hugh Capet or Henry I was historically consequential or relatively uneventful, its trajectory was shaped by questions of legitimacy and therefore cannot be understood without a corollary understanding of the factors that allowed the monarch to _______ his right to hold the throne.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) reciprocate\nB) annotate\nC) buttress\nD) disengage", "generated": [{"id": "8.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The king commissioned elaborate genealogies to ______ his claim to the throne, linking his family to rulers who had governed the region centuries earlier.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) buttress\nB) reciprocate\nC) disengage\nD) annotate", "answer": "A", "explanation": "Buttress means support or strengthen."}, {"id": "8.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The researcher used newly discovered letters to ______ her argument that the expedition had scientific as well as commercial goals.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) reciprocate\nB) annotate\nC) support\nD) withdraw", "answer": "C", "explanation": "Support means strengthen a claim."}, {"id": "8.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. To ______ the proposal, the committee included cost estimates, survey results, and examples of similar programs in nearby districts.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) disengage\nB) imitate\nC) neglect\nD) reinforce", "answer": "D", "explanation": "Reinforce means strengthen."}, {"id": "8.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The lawyer introduced financial records to ______ the witness's account of where the money had gone.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) dismiss\nB) substantiate\nC) annotate\nD) reciprocate", "answer": "B", "explanation": "Substantiate means support with evidence."}, {"id": "8.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The scientist gathered additional temperature data to ______ the conclusion that the glacier was retreating faster than expected.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) reciprocate\nB) bolster\nC) annotate\nD) disengage", "answer": "B", "explanation": "Bolster means support or strengthen."}]}, {"n": 9, "concept": "Text Function: detail about behavior.", "original": "Some bird species don't raise their own chicks. Instead, adult females lay their eggs in other nests, next to another bird species' own eggs. Female cuckoos have been seen quickly laying eggs in the nests of other bird species when those birds are out looking for food. After the eggs hatch, the noncuckoo parents will typically raise the cuckoo chicks as if they were their own offspring, even if the cuckoos look very different from the other chicks.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\nA) It introduces a physical feature of female cuckoos that is described later in the text.\nB) It describes the appearance of the cuckoo nests mentioned earlier in the text.\nC) It offers a detail about how female cuckoos carry out the behavior discussed in the text.\nD) It explains how other birds react to the female cuckoo behavior discussed in the text.", "generated": [{"id": "9.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It identifies the uncertainty that motivated the study.\nB) It describes how other researchers criticized the work.\nC) It offers evidence that radar is always reliable.\nD) It states the study's final conclusion.", "answer": "A", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "9.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It defines the problem the later investigation attempts to address.\nB) It shifts the discussion away from archaeology.\nC) It summarizes the team's strongest result.\nD) It contradicts the claim made in the first sentence.", "answer": "A", "explanation": "The sentence frames the central research question."}, {"id": "9.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It gives a historical overview of plant classification.\nB) It proves that drought has no effect on plants.\nC) It lists the materials used in the experiment.\nD) It introduces a gap in knowledge that the experiment examines.", "answer": "D", "explanation": "The sentence identifies an unresolved issue."}, {"id": "9.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It provides biographical information about the novelist.\nB) It raises a difficulty with a common interpretation.\nC) It summarizes the novel's publication history.\nD) It introduces an unrelated theme.", "answer": "B", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "9.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It announces that the technology is already flawless.\nB) It gives a personal anecdote about engineers.\nC) It explains the limitation that the new system is meant to address.\nD) It compares underwater vehicles with aircraft.", "answer": "C", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 10, "concept": "Reading Detail: how surprise was measured.", "original": "Cats can judge unseen people's positions in space by the sound of their voices and thus react with surprise when the same person calls to them from two different locations in a short span of time. Saho Takagi and colleagues reached this conclusion by measuring cats' levels of surprise based on their ear and head movements while the cats heard recordings of their owners' voices from two speakers spaced far apart. Cats exhibited a low level of surprise when owners' voices were played twice from the same speaker, but they showed a high level of surprise when the voice was played once each from the two different speakers.\n\nAccording to the text, how did the researchers determine the level of surprise displayed by the cats in the study?\nA) They watched how each cat moved its ears and head.\nB) They examined how each cat reacted to the voice of a stranger.\nC) They studied how each cat physically interacted with its owner.\nD) They tracked how each cat moved around the room.", "generated": [{"id": "10.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nAccording to the text, which choice is best supported?\n\nA) She is admired mainly for her wealth.\nB) She shows unusual maturity and self-command.\nC) She lacks affection for her family.\nD) She refuses to give advice to others.", "answer": "B", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "10.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nAccording to the text, which choice is best supported?\n\nA) The narrator thinks patience is useless.\nB) The family ignores the grandmother's opinions.\nC) The grandmother's influence is quiet but substantial.\nD) The grandmother avoids family matters entirely.", "answer": "C", "explanation": "The family respects her careful judgment."}, {"id": "10.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nAccording to the text, which choice is best supported?\n\nA) The business fails because of excessive caution.\nB) The clerk intentionally creates errors.\nC) The coworkers are more accurate than the clerk.\nD) The clerk's carefulness is valuable despite being inconvenient.", "answer": "D", "explanation": "The passage praises his precision."}, {"id": "10.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nAccording to the text, which choice is best supported?\n\nA) The leader values inclusive deliberation.\nB) The leader dislikes public meetings.\nC) The leader is unable to reach conclusions.\nD) The leader makes decisions without hearing others.", "answer": "A", "explanation": "The evidence shows patience and inclusion."}, {"id": "10.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nAccording to the text, which choice is best supported?\n\nA) She publishes claims before testing them.\nB) She avoids working with students.\nC) She rejects all imaginative thinking.\nD) She combines intellectual openness with rigorous standards.", "answer": "D", "explanation": "The contrast shows openness and rigor."}]}, {"n": 11, "concept": "Command of Evidence: weaken a hypothesis.", "original": "A student performs an experiment testing her hypothesis that a slightly acidic soil environment is more beneficial for the growth of the plant Brassica rapa parachinensis (a vegetable commonly known as choy sum) than a neutral soil environment. She plants sixteen seeds of choy sum in a mixture of equal amounts of coffee grounds (which are highly acidic) and potting soil and another sixteen seeds in potting soil without coffee grounds as the control for the experiment. The two groups of seeds were exposed to the same growing conditions and monitored for three weeks.\n\nWhich finding, if true, would most directly weaken the student's hypothesis?\nA) The choy sum planted in the soil without coffee grounds were significantly taller at the end of the experiment than the choy sum planted in the mixture of soil and coffee grounds.\nB) The choy sum grown in the soil without coffee grounds weighed significantly less at the end of the experiment than the choy sum grown in the mixture of soil and coffee grounds.\nC) The choy sum seeds planted in the soil without coffee grounds sprouted significantly later in the experiment than did the seeds planted in the mixture of soil and coffee grounds.\nD) Significantly fewer of the choy sum seeds planted in the soil without coffee grounds sprouted plants than did the seeds planted in the mixture of soil and coffee grounds.", "generated": [{"id": "11.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "answer": "D", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "11.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The graph contains information about three regions.\nB) Some farmers grew vegetables, while others grew grain.\nC) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nD) The southern region was included in the survey.", "answer": "C", "explanation": "The answer uses a specific contrast in the data."}, {"id": "11.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) The method used to study stars requires a telescope.\nC) One rocky planet has a thin atmosphere.\nD) Some stars contain hydrogen and helium.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "11.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) The tradition is studied by scholars in several countries.\nC) Many performers learned songs from relatives.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "11.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The table includes more than one year.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The program took place in a community.\nD) Both towns had some volunteers.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 12, "concept": "Command of Evidence: quotation illustrating contrast.", "original": "\"The Young Girl\" is a 1920 short story by Katherine Mansfield. In the story, the narrator takes an unnamed seventeen-year-old girl and her younger brother out for a meal. In describing the teenager, Mansfield frequently contrasts the character's pleasant appearance with her unpleasant attitude.\n\nWhich quotation from \"The Young Girl\" most effectively illustrates the claim?\nA) \"I heard her murmur, 'I can't bear flowers on a table.' They had evidently been giving her intense pain, for she positively closed her eyes as I moved them away.\"\nB) \"While we waited she took out a little, gold powder-box with a mirror in the lid, shook the poor little puff as though she loathed it, and dabbed her lovely nose.\"\nC) \"I saw, after that, she couldn't stand this place a moment longer, and, indeed, she jumped up and turned away while I went through the vulgar act of paying for the tea.\"\nD) \"She didn't even take her gloves off. She lowered her eyes and drummed on the table. When a faint violin sounded she winced and bit her lip again. Silence.\"", "generated": [{"id": "12.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader signed several decrees during his first month in office.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "12.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The graph contains information about three regions.\nB) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nC) The southern region was included in the survey.\nD) Some farmers grew vegetables, while others grew grain.", "answer": "B", "explanation": "The answer uses a specific contrast in the data."}, {"id": "12.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) The method used to study stars requires a telescope.\nC) One rocky planet has a thin atmosphere.\nD) Some stars contain hydrogen and helium.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "12.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Many performers learned songs from relatives.\nB) The tradition is studied by scholars in several countries.\nC) Some songs use a meter also found in older European poetry.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "12.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The table includes more than one year.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The program took place in a community.\nD) Both towns had some volunteers.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 13, "concept": "Quantitative Evidence: graph data showing specific uncertainty differs from general.", "original": "Economic Policy Uncertainty in the United Kingdom, 2005-2010\n\nHigh levels of public uncertainty about which economic policies a country will adopt can make planning difficult for businesses, but measures of such uncertainty have not tended to be very detailed. Recently, however, economist Sandile Hlatshwayo analyzed trends in news reports to derive measures not only for general economic policy uncertainty but also for uncertainty related to specific areas of economic policy, like tax or trade policy. One revelation of her work is that a general measure may not fully reflect uncertainty about specific areas of policy, as in the case of the United Kingdom, where general economic policy uncertainty _______\n\nWhich choice most effectively uses data from the graph to illustrate the claim?\nA) aligned closely with uncertainty about tax and public spending policy in 2005 but differed from uncertainty about tax and public spending policy by a large amount in 2009.\nB) was substantially lower than uncertainty about tax and public spending policy each year from 2005 to 2010.\nC) reached its highest level between 2005 and 2010 in the same year that uncertainty about trade policy and tax and public spending policy reached their lowest levels.\nD) was substantially lower than uncertainty about trade policy in 2005 and substantially higher than uncertainty about trade policy in 2010.", "generated": [{"id": "13.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "13.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The graph contains information about three regions.\nB) Some farmers grew vegetables, while others grew grain.\nC) The southern region was included in the survey.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "13.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) The method used to study stars requires a telescope.\nC) One rocky planet has a thin atmosphere.\nD) Some stars contain hydrogen and helium.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "13.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) Some songs use a meter also found in older European poetry.\nD) Many performers learned songs from relatives.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "13.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) Both towns had some volunteers.\nC) The program took place in a community.\nD) The table includes more than one year.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 14, "concept": "Command of Evidence: support hypothesis about informative formats.", "original": "Linguist Deborah Tannen has cautioned against framing contentious issues in terms of two highly competitive perspectives, such as pro versus con. According to Tannen, this debate-driven approach can strip issues of their complexity and, when used in front of an audience, can be less informative than the presentation of multiple perspectives in a noncompetitive format. To test Tannen's hypothesis, students conducted a study in which they showed participants one of three different versions of local news commentary about the same issue. Each version featured a debate between two commentators with opposing views, a panel of three commentators with various views, or a single commentator.\n\nWhich finding from the students' study, if true, would most strongly support Tannen's hypothesis?\nA) On average, participants perceived commentators in the debate as more knowledgeable about the issue than commentators in the panel.\nB) On average, participants perceived commentators in the panel as more knowledgeable about the issue than the single commentator.\nC) On average, participants who watched the panel correctly answered more questions about the issue than those who watched the debate or the single commentator did.\nD) On average, participants who watched the single commentator correctly answered more questions about the issue than those who watched the debate did.", "generated": [{"id": "14.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader signed several decrees during his first month in office.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "14.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nB) The graph contains information about three regions.\nC) Some farmers grew vegetables, while others grew grain.\nD) The southern region was included in the survey.", "answer": "A", "explanation": "The answer uses a specific contrast in the data."}, {"id": "14.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Some stars contain hydrogen and helium.\nB) The method used to study stars requires a telescope.\nC) One rocky planet has a thin atmosphere.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "14.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Many performers learned songs from relatives.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) The tradition is studied by scholars in several countries.\nD) Some songs use a meter also found in older European poetry.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "14.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to
