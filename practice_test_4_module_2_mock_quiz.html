r performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The storm&#x27;s wind speeds were ______ those recorded during the region&#x27;s most destructive hurricanes, although the storm caused less flooding.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The storm's wind speeds were ______ those recorded during the region's most destructive hurricanes, although the storm caused less flooding.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。這場暴風的風速 ______ 該地區最具破壞性的颶風期間所記錄到的風速，不過這場暴風造成的淹水較少。", "opts": {"A": "surpassed by", "B": "consistent with", "C": "unrelated to", "D": "obtained from"}, "optsZh": {"A": "surpassed by（被……超越）", "B": "consistent with（與……一致）", "C": "unrelated to（與……無關）", "D": "obtained from（從……取得）"}, "answer": "B", "expl": "Consistent with means comparable or in agreement.", "explZh": "", "defs": {"A": {"w": "surpassed", "pos": "phr.", "en": "done better than or exceeded by", "zh": "被……超越", "word": "surpassed"}, "B": {"w": "consistent", "pos": "phr.", "en": "in agreement with; matching", "zh": "與……一致", "word": "consistent"}, "C": {"w": "unrelated", "pos": "phr.", "en": "not connected to something", "zh": "與……無關的", "word": "unrelated"}, "D": {"w": "obtained", "pos": "phr.", "en": "gotten or acquired from a source", "zh": "從……取得", "word": "obtained"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: comparable to.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The bone structure of the fossil bird is ______ that of modern diving birds, indicating that the ancient species may also have pursued prey underwater.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The bone structure of the fossil bird is ______ that of modern diving birds, indicating that the ancient species may also have pursued prey underwater.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這種鳥類化石的骨骼結構 ______ 現代潛水鳥類的骨骼結構，顯示這個古老物種可能也會在水下追捕獵物。", "opts": {"A": "independent of", "B": "derived from", "C": "analogous to", "D": "inferior to"}, "optsZh": {"A": "independent of（獨立於……；與……無關）", "B": "derived from（源自；衍生自）", "C": "analogous to（類似於；可比擬的）", "D": "inferior to（不如；劣於）"}, "answer": "C", "expl": "Analogous to means similar in relevant ways.", "explZh": "", "defs": {"A": {"w": "independent", "pos": "phr.", "en": "not controlled by or connected to something", "zh": "獨立於；不受……影響", "word": "independent"}, "B": {"w": "derived", "pos": "phr.", "en": "coming from or developed from a source", "zh": "源自；衍生自", "word": "derived"}, "C": {"w": "analogous", "pos": "phr.", "en": "similar to something in some way, so the two can be compared", "zh": "類似於；可類比於", "word": "analogous"}, "D": {"w": "inferior", "pos": "phr.", "en": "not as good as something else", "zh": "次於；不如", "word": "inferior"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: comparable to.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The fabric&#x27;s strength was ______ that of lightweight steel, an unexpected result for a material made from plant fibers.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The fabric's strength was ______ that of lightweight steel, an unexpected result for a material made from plant fibers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。這種布料的強度 ______ 輕質鋼材的強度，對一種以植物纖維製成的材料來說，這是個出乎意料的結果。", "opts": {"A": "equivalent to", "B": "weaker than", "C": "obtained from", "D": "unrelated to"}, "optsZh": {"A": "equivalent to（等同於；相當於）", "B": "weaker than（比……弱）", "C": "obtained from（從……取得）", "D": "unrelated to（與……無關）"}, "answer": "A", "expl": "Equivalent to means equal or comparable.", "explZh": "", "defs": {"A": {"w": "equivalent", "pos": "phr.", "en": "equal in value, amount, or meaning", "zh": "等同於；相當於", "word": "equivalent"}, "B": {"w": "weaker", "pos": "phr.", "en": "less strong than something else", "zh": "比……弱", "word": "weaker"}, "C": {"w": "obtained", "pos": "phr.", "en": "gotten or acquired from a source", "zh": "從……取得", "word": "obtained"}, "D": {"w": "unrelated", "pos": "phr.", "en": "not connected to something", "zh": "與……無關的", "word": "unrelated"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: not atypical.", "vocab": true, "body": "Rydra Wong, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protagonist\" target=\"_blank\" rel=\"noopener\" data-w=\"protagonist\" data-pos=\"n.\" data-en=\"the main character in a story\" data-zh=\"主角\">protagonist<\/a> of Samuel R. Delany&#x27;s 1966 novel Babel-17, is a poet, an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=occupation\" target=\"_blank\" rel=\"noopener\" data-w=\"occupation\" data-pos=\"n.\" data-en=\"a job or profession\" data-zh=\"職業\">occupation<\/a> which, in Delany&#x27;s work, is not _______: nearly a dozen of the characters that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=populate\" target=\"_blank\" rel=\"noopener\" data-w=\"populate\" data-pos=\"v.\" data-en=\"to fill a place or story with people or characters\" data-zh=\"居住於；使充滿（人物）\">populate<\/a> his novels are poets or writers.", "bodyPlain": "Rydra Wong, the protagonist of Samuel R. Delany's 1966 novel Babel-17, is a poet, an occupation which, in Delany's work, is not _______: nearly a dozen of the characters that populate his novels are poets or writers.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "Rydra Wong 是 Samuel R.Delany 1966 年小說《Babel-17》的主角，她是一位詩人；在 Delany 的作品中，這種職業並非 _______：他小說中有將近十幾個角色是詩人或作家。", "opts": {"A": "infallible", "B": "atypical", "C": "lucrative", "D": "tedious"}, "optsZh": {"A": "infallible（絕不會錯的）", "B": "atypical（非典型的；不尋常的）", "C": "lucrative（賺錢的；有利可圖的）", "D": "tedious（冗長乏味的）"}, "answer": "B", "expl": "Nearly a dozen of Delany's characters are poets or writers, so being a poet is not 'atypical' (unusual) in his work.", "explZh": "Delany 小說中將近十幾個角色都是詩人或作家，所以詩人這個職業在他的作品中並不「atypical」（不尋常的）。", "defs": {"A": {"pos": "adj.", "en": "never wrong or never failing", "zh": "絕不出錯的", "word": "infallible"}, "B": {"pos": "adj.", "en": "not usual or typical; different from what is normal", "zh": "非典型的；不尋常的", "word": "atypical"}, "C": {"pos": "adj.", "en": "producing a lot of money; profitable", "zh": "有利可圖的；賺錢的", "word": "lucrative"}, "D": {"pos": "adj.", "en": "boring because it is long or repetitive", "zh": "冗長乏味的", "word": "tedious"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: not atypical.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In the novelist&#x27;s work, unreliable narrators are not ______; several of her best-known books are told by characters whose accounts contradict the evidence around them.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In the novelist's work, unreliable narrators are not ______; several of her best-known books are told by characters whose accounts contradict the evidence around them.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。在這位小說家的作品中，不可靠的敘事者並非 ______；她幾部最知名的作品都是由敘述與周遭證據相矛盾的角色來講述的。", "opts": {"A": "infallible", "B": "lucrative", "C": "tedious", "D": "atypical"}, "optsZh": {"A": "infallible（絕不會錯的）", "B": "lucrative（賺錢的；有利可圖的）", "C": "tedious（冗長乏味的）", "D": "atypical（非典型的；不尋常的）"}, "answer": "D", "expl": "Atypical means unusual.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "never wrong or never failing", "zh": "絕不出錯的", "word": "infallible"}, "B": {"pos": "adj.", "en": "producing a lot of money; profitable", "zh": "有利可圖的；賺錢的", "word": "lucrative"}, "C": {"pos": "adj.", "en": "boring because it is long or repetitive", "zh": "冗長乏味的", "word": "tedious"}, "D": {"pos": "adj.", "en": "not usual or typical; different from what is normal", "zh": "非典型的；不尋常的", "word": "atypical"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: not atypical.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. References to astronomy are hardly ______ in the poet&#x27;s later <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collections<\/a>; images of eclipses, planets, and star charts appear throughout them.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. References to astronomy are hardly ______ in the poet's later collections; images of eclipses, planets, and star charts appear throughout them.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。在這位詩人後期的詩集中，與天文學有關的典故幾乎稱不上 ______；日食、行星與星圖的意象貫穿其中。", "opts": {"A": "infallible", "B": "tedious", "C": "unusual", "D": "profitable"}, "optsZh": {"A": "infallible（絕不會錯的）", "B": "tedious（冗長乏味的）", "C": "unusual（不尋常的）", "D": "profitable（有利可圖的）"}, "answer": "C", "expl": "Unusual means atypical.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "never wrong or never failing", "zh": "絕不出錯的", "word": "infallible"}, "B": {"pos": "adj.", "en": "boring because it is long or repetitive", "zh": "冗長乏味的", "word": "tedious"}, "C": {"pos": "adj.", "en": "different from what is normal or expected", "zh": "不尋常的", "word": "unusual"}, "D": {"pos": "adj.", "en": "making money or a benefit", "zh": "有利潤的；有益的", "word": "profitable"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: not atypical.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The use of recycled materials is not ______ in the designer&#x27;s furniture: chairs, tables, and lamps across multiple collections <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporate<\/a> reclaimed wood and metal.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The use of recycled materials is not ______ in the designer's furniture: chairs, tables, and lamps across multiple collections incorporate reclaimed wood and metal.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。在這位設計師的家具中，使用回收材料並非 ______：在多個系列中，椅子、桌子與燈具都採用了回收的木材與金屬。", "opts": {"A": "tedious", "B": "lucrative", "C": "rare", "D": "infallible"}, "optsZh": {"A": "tedious（冗長乏味的）", "B": "lucrative（賺錢的；有利可圖的）", "C": "rare（罕見的）", "D": "infallible（絕不會錯的）"}, "answer": "C", "expl": "Rare means uncommon or atypical.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "boring because it is long or repetitive", "zh": "冗長乏味的", "word": "tedious"}, "B": {"pos": "adj.", "en": "producing a lot of money; profitable", "zh": "有利可圖的；賺錢的", "word": "lucrative"}, "C": {"pos": "adj.", "en": "not happening or found very often", "zh": "罕見的；稀少的", "word": "rare"}, "D": {"pos": "adj.", "en": "never wrong or never failing", "zh": "絕不出錯的", "word": "infallible"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: not atypical.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Musicians appear so frequently in the filmmaker&#x27;s movies that such characters can no longer be considered ______ within her body of work.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Musicians appear so frequently in the filmmaker's movies that such characters can no longer be considered ______ within her body of work.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。音樂家在這位電影導演的作品中出現得如此頻繁，以至於這類角色在她的作品中已不能被視為 ______。", "opts": {"A": "profitable", "B": "exceptional", "C": "tedious", "D": "infallible"}, "optsZh": {"A": "profitable（有利可圖的）", "B": "exceptional（例外的；罕見的）", "C": "tedious（冗長乏味的）", "D": "infallible（絕不會錯的）"}, "answer": "B", "expl": "Exceptional can mean unusual.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "making money or a benefit", "zh": "有利潤的；有益的", "word": "profitable"}, "B": {"pos": "adj.", "en": "very unusual; much better or different than normal", "zh": "例外的；非凡的", "word": "exceptional"}, "C": {"pos": "adj.", "en": "boring because it is long or repetitive", "zh": "冗長乏味的", "word": "tedious"}, "D": {"pos": "adj.", "en": "never wrong or never failing", "zh": "絕不出錯的", "word": "infallible"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: not atypical.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Although the painting&#x27;s format may seem surprising at first, triptychs are not ______ in the artist&#x27;s career; she returned to the three-panel structure repeatedly.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Although the painting's format may seem surprising at first, triptychs are not ______ in the artist's career; she returned to the three-panel structure repeatedly.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。雖然這幅畫的形式乍看之下可能令人意外，但三聯畫在這位藝術家的創作生涯中並非 ______；她一再回到這種三片式的結構。", "opts": {"A": "uncommon", "B": "lucrative", "C": "infallible", "D": "tedious"}, "optsZh": {"A": "uncommon（不常見的）", "B": "lucrative（賺錢的；有利可圖的）", "C": "infallible（絕不會錯的）", "D": "tedious（冗長乏味的）"}, "answer": "A", "expl": "Uncommon means atypical.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not happening or seen often", "zh": "不常見的", "word": "uncommon"}, "B": {"pos": "adj.", "en": "producing a lot of money; profitable", "zh": "有利可圖的；賺錢的", "word": "lucrative"}, "C": {"pos": "adj.", "en": "never wrong or never failing", "zh": "絕不出錯的", "word": "infallible"}, "D": {"pos": "adj.", "en": "boring because it is long or repetitive", "zh": "冗長乏味的", "word": "tedious"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Words in Context: created new images.", "vocab": true, "body": "For a 2020 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographer<\/a> and neurobiologist Okunola Jeyifous _______ a series of new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">images<\/a> based on a series of alphabet posters from the 1970s known as the &quot;Black ABCs,&quot; which featured Black children from Chicago. Jeyifous photographed the now-adult models and layered the photos over magnified images of the models&#x27; cells, resulting in what he called &quot;micro and macro <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portraiture\" target=\"_blank\" rel=\"noopener\" data-w=\"portraiture\" data-pos=\"n.\" data-en=\"the art of making portraits\" data-zh=\"肖像畫藝術\">portraiture<\/a>.&quot;", "bodyPlain": "For a 2020 exhibition, photographer and neurobiologist Okunola Jeyifous _______ a series of new images based on a series of alphabet posters from the 1970s known as the \"Black ABCs,\" which featured Black children from Chicago. Jeyifous photographed the now-adult models and layered the photos over magnified images of the models' cells, resulting in what he called \"micro and macro portraiture.\"", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "為了 2020 年的一場展覽，攝影師兼神經生物學家 Okunola Jeyifous _______ 了一系列新影像，其靈感來自 1970 年代一套名為「Black ABCs」的字母海報，海報中呈現的是來自芝加哥的黑人孩童。Jeyifous 拍攝了這些如今已成年的模特兒，並將照片疊加在放大的模特兒細胞影像上，形成他所謂的「微觀與宏觀肖像」。", "opts": {"A": "validated", "B": "created", "C": "challenged", "D": "restored"}, "optsZh": {"A": "validated（證實；確認）", "B": "created（創造；製作）", "C": "challenged（質疑；挑戰）", "D": "restored（修復；恢復）"}, "answer": "B", "expl": "Jeyifous photographed the models and layered images to make new portraits, so he 'created' a series of new images.", "explZh": "Jeyifous 拍攝模特兒並疊合影像製作出新作品，所以是「created」（創作）了一系列新影像。", "defs": {"A": {"pos": "v.", "en": "proved that something is true or correct", "zh": "證實；驗證", "word": "validated"}, "B": {"pos": "v.", "en": "made something new", "zh": "創造；製作", "word": "created"}, "C": {"pos": "v.", "en": "questioned whether something is true or right", "zh": "質疑；挑戰", "word": "challenged"}, "D": {"pos": "v.", "en": "brought back to an earlier good condition", "zh": "修復；恢復", "word": "restored"}}}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Words in Context: created new images.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. For the museum&#x27;s new <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a>, the artist ______ a set of portraits by combining recent photographs with fragments of letters written by the subjects&#x27; grandparents.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. For the museum's new installation, the artist ______ a set of portraits by combining recent photographs with fragments of letters written by the subjects' grandparents.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。為了博物館的新裝置作品，這位藝術家結合近期的照片與受拍攝者祖父母所寫信件的片段，______ 了一組肖像。", "opts": {"A": "validated", "B": "restored", "C": "created", "D": "challenged"}, "optsZh": {"A": "validated（證實；確認）", "B": "restored（修復；恢復）", "C": "created（創造；製作）", "D": "challenged（質疑；挑戰）"}, "answer": "C", "expl": "Created means made.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "proved that something is true or correct", "zh": "證實；驗證", "word": "validated"}, "B": {"pos": "v.", "en": "brought back to an earlier good condition", "zh": "修復；恢復", "word": "restored"}, "C": {"pos": "v.", "en": "made something new", "zh": "創造；製作", "word": "created"}, "D": {"pos": "v.", "en": "questioned whether something is true or right", "zh": "質疑；挑戰", "word": "challenged"}}}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Words in Context: created new images.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The composer ______ a suite of short pieces based on folk melodies she recorded during fieldwork in mountain villages.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The composer ______ a suite of short pieces based on folk melodies she recorded during fieldwork in mountain villages.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這位作曲家根據她在山村進行田野調查時錄下的民謠旋律，______ 了一組短篇樂曲。", "opts": {"A": "denied", "B": "restored", "C": "validated", "D": "produced"}, "optsZh": {"A": "denied（否認；拒絕）", "B": "restored（修復；恢復）", "C": "validated（證實；確認）", "D": "produced（生產；製作）"}, "answer": "D", "expl": "Produced means created.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "said that something is not true; refused to accept", "zh": "否認；拒絕", "word": "denied"}, "B": {"pos": "v.", "en": "brought back to an earlier good condition", "zh": "修復；恢復", "word": "restored"}, "C": {"pos": "v.", "en": "proved that something is true or correct", "zh": "證實；驗證", "word": "validated"}, "D": {"pos": "v.", "en": "made or created something", "zh": "製造；產生", "word": "produced"}}}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Words in Context: created new images.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Using satellite imagery and archival maps, the designer ______ a series of layered prints showing how the coastline had shifted over a century.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Using satellite imagery and archival maps, the designer ______ a series of layered prints showing how the coastline had shifted over a century.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。這位設計師運用衛星影像與歷史地圖，______ 了一系列層疊的版畫，呈現海岸線在一個世紀間如何變遷。", "opts": {"A": "assembled", "B": "validated", "C": "challenged", "D": "restored"}, "optsZh": {"A": "assembled（組裝；拼組成）", "B": "validated（證實；確認）", "C": "challenged（質疑；挑戰）", "D": "restored（修復；恢復）"}, "answer": "A", "expl": "Assembled means put together or created from parts.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "gathered together or put the parts of something together", "zh": "聚集；組裝", "word": "assembled"}, "B": {"pos": "v.", "en": "proved that something is true or correct", "zh": "證實；驗證", "word": "validated"}, "C": {"pos": "v.", "en": "questioned whether something is true or right", "zh": "質疑；挑戰", "word": "challenged"}, "D": {"pos": "v.", "en": "brought back to an earlier good condition", "zh": "修復；恢復", "word": "restored"}}}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Words in Context: created new images.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=choreographer\" target=\"_blank\" rel=\"noopener\" data-w=\"choreographer\" data-pos=\"n.\" data-en=\"a person who designs dance movements\" data-zh=\"編舞家\">choreographer<\/a> ______ a new performance from interviews with nurses, combining spoken testimony with repeated movements that suggested exhaustion and care.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The choreographer ______ a new performance from interviews with nurses, combining spoken testimony with repeated movements that suggested exhaustion and care.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這位編舞家從對護理師的訪談中 ______ 了一支新作品，將口述證詞與暗示疲憊和照護的重複動作結合在一起。", "opts": {"A": "validated", "B": "restored", "C": "challenged", "D": "devised"}, "optsZh": {"A": "validated（證實；確認）", "B": "restored（修復；恢復）", "C": "challenged（質疑；挑戰）", "D": "devised（設計；想出）"}, "answer": "D", "expl": "Devised means created or planned.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "proved that something is true or correct", "zh": "證實；驗證", "word": "validated"}, "B": {"pos": "v.", "en": "brought back to an earlier good condition", "zh": "修復；恢復", "word": "restored"}, "C": {"pos": "v.", "en": "questioned whether something is true or right", "zh": "質疑；挑戰", "word": "challenged"}, "D": {"pos": "v.", "en": "planned or invented a new method or system", "zh": "設計；發明", "word": "devised"}}}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Words in Context: created new images.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The illustrator ______ new images for the edition, replacing the earlier black-and-white drawings with full-color scenes.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The illustrator ______ new images for the edition, replacing the earlier black-and-white drawings with full-color scenes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。這位插畫家為這個版本 ______ 了新的圖像，以全彩場景取代先前的黑白線畫。", "opts": {"A": "restored", "B": "generated", "C": "validated", "D": "challenged"}, "optsZh": {"A": "restored（修復；恢復）", "B": "generated（產生；製作出）", "C": "validated（證實；確認）", "D": "challenged（質疑；挑戰）"}, "answer": "B", "expl": "Generated means produced or created.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "brought back to an earlier good condition", "zh": "修復；恢復", "word": "restored"}, "B": {"pos": "v.", "en": "produced or created", "zh": "產生；生成", "word": "generated"}, "C": {"pos": "v.", "en": "proved that something is true or correct", "zh": "證實；驗證", "word": "validated"}, "D": {"pos": "v.", "en": "questioned whether something is true or right", "zh": "質疑；挑戰", "word": "challenged"}}}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Words in Context: proponent or advocate.", "vocab": true, "body": "In addition to being an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accomplish\" target=\"_blank\" rel=\"noopener\" data-w=\"accomplish\" data-pos=\"v.\" data-en=\"to succeed in doing or finishing something\" data-zh=\"完成；達成\">accomplished<\/a> psychologist himself, Francis Cecil Sumner was a _______ increasing the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=opportunity\" target=\"_blank\" rel=\"noopener\" data-w=\"opportunity\" data-pos=\"n.\" data-en=\"a chance to do something\" data-zh=\"機會\">opportunity<\/a> for Black students to study <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=psychology\" target=\"_blank\" rel=\"noopener\" data-w=\"psychology\" data-pos=\"n.\" data-en=\"the scientific study of the mind and behavior\" data-zh=\"心理學\">psychology<\/a>, helping to found the psychology <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=department\" target=\"_blank\" rel=\"noopener\" data-w=\"department\" data-pos=\"n.\" data-en=\"a section of a large organization\" data-zh=\"部門\">department<\/a> at Howard University, a historically Black university, in 1930.", "bodyPlain": "In addition to being an accomplished psychologist himself, Francis Cecil Sumner was a _______ increasing the opportunity for Black students to study psychology, helping to found the psychology department at Howard University, a historically Black university, in 1930.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "Francis Cecil Sumner 本身不僅是一位傑出的心理學家，也是 _______ 增加黑人學生學習心理學機會的人；他在 1930 年協助創立了 Howard University（一所歷史悠久的黑人大學）的心理學系。", "opts": {"A": "proponent of", "B": "supplement to", "C": "beneficiary of", "D": "distraction for"}, "optsZh": {"A": "proponent of（……的支持者；擁護者）", "B": "supplement to（……的補充）", "C": "beneficiary of（……的受益者）", "D": "distraction for（對……的干擾）"}, "answer": "A", "expl": "Sumner helped found a psychology department for Black students, showing he was a supporter, or 'proponent of,' increasing their opportunities.", "explZh": "Sumner 協助在 Howard 大學創立心理學系，顯示他是增加黑人學生學習機會的「proponent of」（支持者、倡導者）。", "defs": {"A": {"w": "proponent", "pos": "phr.", "en": "a person who supports an idea or plan", "zh": "支持者；擁護者", "word": "proponent"}, "B": {"w": "supplement", "pos": "phr.", "en": "something added to complete or improve something", "zh": "……的補充", "word": "supplement"}, "C": {"w": "beneficiary", "pos": "phr.", "en": "a person or thing that receives help or an advantage from something", "zh": "受益者", "word": "beneficiary"}, "D": {"w": "distraction", "pos": "phr.", "en": "something that takes attention away (used incorrectly here with \"for\")", "zh": "使人分心的事物", "word": "distraction"}}}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Words in Context: proponent or advocate.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The journalist was a ______ press freedom, arguing that democratic societies depend on reporters&#x27; ability to investigate powerful <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutions<\/a> without intimidation.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The journalist was a ______ press freedom, arguing that democratic societies depend on reporters' ability to investigate powerful institutions without intimidation.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位記者是新聞自由的 ______，主張民主社會仰賴記者能在不受恐嚇的情況下調查有權勢的機構。", "opts": {"A": "supplement to", "B": "beneficiary of", "C": "proponent of", "D": "distraction for"}, "optsZh": {"A": "supplement to（……的補充）", "B": "beneficiary of（……的受益者）", "C": "proponent of（……的支持者；擁護者）", "D": "distraction for（對……的干擾）"}, "answer": "C", "expl": "A proponent is a supporter or advocate.", "explZh": "", "defs": {"A": {"w": "supplement", "pos": "phr.", "en": "something added to complete or improve something", "zh": "……的補充", "word": "supplement"}, "B": {"w": "beneficiary", "pos": "phr.", "en": "a person or thing that receives help or an advantage from something", "zh": "受益者", "word": "beneficiary"}, "C": {"w": "proponent", "pos": "phr.", "en": "a person who supports an idea or plan", "zh": "支持者；擁護者", "word": "proponent"}, "D": {"w": "distraction", "pos": "phr.", "en": "something that takes attention away (used incorrectly here with \"for\")", "zh": "使人分心的事物", "word": "distraction"}}}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Words in Context: proponent or advocate.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The mayor became an ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expand\" target=\"_blank\" rel=\"noopener\" data-w=\"expand\" data-pos=\"v.\" data-en=\"to become or make larger\" data-zh=\"擴展\">expanded<\/a> public transit, repeatedly calling for bus routes that would connect workers to jobs outside the city center.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The mayor became an ______ expanded public transit, repeatedly calling for bus routes that would connect workers to jobs outside the city center.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這位市長成為擴大大眾運輸的 ______，一再呼籲開設能將勞工連接到市中心以外工作地點的公車路線。", "opts": {"A": "distraction from", "B": "obstacle to", "C": "advocate for", "D": "beneficiary of"}, "optsZh": {"A": "distraction from（使人分心而離開……的事物）", "B": "obstacle to（……的障礙）", "C": "advocate for（擁護；提倡）", "D": "beneficiary of（……的受益者）"}, "answer": "C", "expl": "An advocate is a supporter.", "explZh": "", "defs": {"A": {"w": "distraction", "pos": "phr.", "en": "something that takes your attention away from something else", "zh": "使人從……分心的事物", "word": "distraction"}, "B": {"w": "obstacle", "pos": "phr.", "en": "something that blocks progress", "zh": "……的障礙", "word": "obstacle"}, "C": {"w": "advocate", "pos": "phr.", "en": "a person who publicly supports an idea or cause", "zh": "擁護者；倡導者", "word": "advocate"}, "D": {"w": "beneficiary", "pos": "phr.", "en": "a person or thing that receives help or an advantage from something", "zh": "受益者", "word": "beneficiary"}}}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Words in Context: proponent or advocate.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Throughout her career, the physician was a ______ vaccination campaigns in rural areas, helping establish clinics where few medical services had existed.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Throughout her career, the physician was a ______ vaccination campaigns in rural areas, helping establish clinics where few medical services had existed.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。在她的整個職業生涯中，這位醫師一直是鄉村地區疫苗接種計畫的 ______，協助在幾乎沒有醫療服務的地方設立診所。", "opts": {"A": "supplement to", "B": "beneficiary of", "C": "critic of", "D": "champion of"}, "optsZh": {"A": "supplement to（……的補充）", "B": "beneficiary of（……的受益者）", "C": "critic of（……的批評者）", "D": "champion of（……的擁護者；倡導者）"}, "answer": "D", "expl": "Champion means strong supporter.", "explZh": "", "defs": {"A": {"w": "supplement", "pos": "phr.", "en": "something added to complete or improve something", "zh": "……的補充", "word": "supplement"}, "B": {"w": "beneficiary", "pos": "phr.", "en": "a person or thing that receives help or an advantage from something", "zh": "受益者", "word": "beneficiary"}, "C": {"w": "critic", "pos": "phr.", "en": "a person who disapproves of or criticizes something", "zh": "批評者", "word": "critic"}, "D": {"w": "champion", "pos": "phr.", "en": "a person who strongly supports and fights for a cause", "zh": "擁護者；捍衛者", "word": "champion"}}}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Words in Context: proponent or advocate.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The historian was a ______ preserving community archives, insisting that local letters and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> were essential evidence of everyday life.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The historian was a ______ preserving community archives, insisting that local letters and photographs were essential evidence of everyday life.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這位歷史學家是保存社區檔案的 ______，堅持認為地方上的信件與照片是日常生活的重要證據。", "opts": {"A": "beneficiary of", "B": "supporter of", "C": "distraction from", "D": "critic of"}, "optsZh": {"A": "beneficiary of（……的受益者）", "B": "supporter of（……的支持者）", "C": "distraction from（使人分心而離開……的事物）", "D": "critic of（……的批評者）"}, "answer": "B", "expl": "Supporter means proponent.", "explZh": "", "defs": {"A": {"w": "beneficiary", "pos": "phr.", "en": "a person or thing that receives help or an advantage from something", "zh": "受益者", "word": "beneficiary"}, "B": {"w": "supporter", "pos": "phr.", "en": "a person who agrees with and helps an idea or group", "zh": "支持者", "word": "supporter"}, "C": {"w": "distraction", "pos": "phr.", "en": "something that takes your attention away from something else", "zh": "使人從……分心的事物", "word": "distraction"}, "D": {"w": "critic", "pos": "phr.", "en": "a person who disapproves of or criticizes something", "zh": "批評者", "word": "critic"}}}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Words in Context: proponent or advocate.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. As a lawyer, she became a prominent ______ tenants&#x27; rights, representing families facing eviction and lobbying for stronger housing protections.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. As a lawyer, she became a prominent ______ tenants' rights, representing families facing eviction and lobbying for stronger housing protections.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。身為律師，她成為租屋者權益的知名 ______，代表面臨驅逐的家庭出庭，並遊說爭取更有力的住房保障。", "opts": {"A": "defender of", "B": "supplement to", "C": "distraction for", "D": "beneficiary of"}, "optsZh": {"A": "defender of（……的捍衛者）", "B": "supplement to（……的補充）", "C": "distraction for（對……的干擾）", "D": "beneficiary of（……的受益者）"}, "answer": "A", "expl": "Defender means advocate or supporter.", "explZh": "", "defs": {"A": {"w": "defender", "pos": "phr.", "en": "a person who protects or argues in support of something", "zh": "捍衛者；辯護者", "word": "defender"}, "B": {"w": "supplement", "pos": "phr.", "en": "something added to complete or improve something", "zh": "……的補充", "word": "supplement"}, "C": {"w": "distraction", "pos": "phr.", "en": "something that takes attention away (used incorrectly here with \"for\")", "zh": "使人分心的事物", "word": "distraction"}, "D": {"w": "beneficiary", "pos": "phr.", "en": "a person or thing that receives help or an advantage from something", "zh": "受益者", "word": "beneficiary"}}}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Words in Context: buttress a claim or right.", "vocab": true, "body": "Whether the reign of a French monarch such as Hugh Capet or Henry I was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historically<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consequential\" target=\"_blank\" rel=\"noopener\" data-w=\"consequential\" data-pos=\"adj.\" data-en=\"important; having significant results\" data-zh=\"重大的；影響深遠的\">consequential<\/a> or relatively <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uneventful\" target=\"_blank\" rel=\"noopener\" data-w=\"uneventful\" data-pos=\"adj.\" data-en=\"without important or interesting happenings\" data-zh=\"平淡無奇的\">uneventful<\/a>, its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trajectory\" target=\"_blank\" rel=\"noopener\" data-w=\"trajectory\" data-pos=\"n.\" data-en=\"the path or course of development over time\" data-zh=\"軌跡；發展歷程\">trajectory<\/a> was shaped by questions of legitimacy and therefore cannot be understood without a corollary understanding of the factors that allowed the monarch to _______ his right to hold the throne.", "bodyPlain": "Whether the reign of a French monarch such as Hugh Capet or Henry I was historically consequential or relatively uneventful, its trajectory was shaped by questions of legitimacy and therefore cannot be understood without a corollary understanding of the factors that allowed the monarch to _______ his right to hold the throne.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "無論像 Hugh Capet 或 Henry I 這樣的法國君主，其統治在歷史上是影響深遠還是相對平淡，其發展軌跡都受到正統性問題的影響，因此若不同時了解讓君主得以 _______ 其王位繼承權的因素，就無法理解這段統治。", "opts": {"A": "reciprocate", "B": "annotate", "C": "buttress", "D": "disengage"}, "optsZh": {"A": "reciprocate（回報；互換）", "B": "annotate（註解；加註）", "C": "buttress（支撐；鞏固）", "D": "disengage（脫離；解開）"}, "answer": "C", "expl": "A monarch's reign depended on legitimacy, so the relevant factors are those that let him support or strengthen ('buttress') his right to the throne.", "explZh": "君主的統治取決於正當性，所以關鍵在於哪些因素讓他能「buttress」（支撐、鞏固）自己的王位繼承權。", "defs": {"A": {"pos": "v.", "en": "to do or feel the same thing in return", "zh": "回報；互惠", "word": "reciprocate"}, "B": {"pos": "v.", "en": "to add notes or comments to a text or picture", "zh": "註解；加註", "word": "annotate"}, "C": {"pos": "v.", "en": "to support or strengthen an argument or claim", "zh": "支持；鞏固（論點、主張）", "word": "buttress"}, "D": {"pos": "v.", "en": "to separate from or stop being involved in something", "zh": "脫離；退出", "word": "disengage"}}}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Words in Context: buttress a claim or right.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The king commissioned elaborate genealogies to ______ his claim to the throne, linking his family to rulers who had governed the region centuries earlier.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The king commissioned elaborate genealogies to ______ his claim to the throne, linking his family to rulers who had governed the region centuries earlier.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。國王委託編纂精細的家譜來 ______ 他對王位的主張，將他的家族與數百年前統治該地區的君主連結起來。", "opts": {"A": "buttress", "B": "reciprocate", "C": "disengage", "D": "annotate"}, "optsZh": {"A": "buttress（支撐；鞏固）", "B": "reciprocate（回報；互換）", "C": "disengage（脫離；解開）", "D": "annotate（註解；加註）"}, "answer": "A", "expl": "Buttress means support or strengthen.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to support or strengthen an argument or claim", "zh": "支持；鞏固（論點、主張）", "word": "buttress"}, "B": {"pos": "v.", "en": "to do or feel the same thing in return", "zh": "回報；互惠", "word": "reciprocate"}, "C": {"pos": "v.", "en": "to separate from or stop being involved in something", "zh": "脫離；退出", "word": "disengage"}, "D": {"pos": "v.", "en": "to add notes or comments to a text or picture", "zh": "註解；加註", "word": "annotate"}}}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Words in Context: buttress a claim or right.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> used newly discovered letters to ______ her argument that the expedition had scientific as well as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercial<\/a> g
