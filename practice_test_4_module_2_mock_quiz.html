<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 4, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .scope { font-weight:700; font-size:.9rem; color:var(--muted); }
    .toolbar .scope select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:white; color:var(--ink); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 4, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>

  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>

    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: predicted future growth.", "vocab": true, "body": "The fashion resale market, in which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consumer\" target=\"_blank\" rel=\"noopener\" data-w=\"consumer\" data-pos=\"n.\" data-en=\"a person who buys goods or services\" data-zh=\"消費者\">consumers<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=purchase\" target=\"_blank\" rel=\"noopener\" data-w=\"purchase\" data-pos=\"v.\" data-en=\"to buy something\" data-zh=\"購買\">purchase<\/a> secondhand clothing from stores and online sellers, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generated\" target=\"_blank\" rel=\"noopener\" data-w=\"generated\" data-pos=\"v.\" data-en=\"produced or created\" data-zh=\"產生；生成\">generated<\/a> nearly $30 billion globally in 2019. Expecting to see continued growth, some analysts _______ that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revenue\" target=\"_blank\" rel=\"noopener\" data-w=\"revenue\" data-pos=\"n.\" data-en=\"income, especially of a business\" data-zh=\"收入；營收\">revenues<\/a> will more than double by 2028.", "bodyPlain": "The fashion resale market, in which consumers purchase secondhand clothing from stores and online sellers, generated nearly $30 billion globally in 2019. Expecting to see continued growth, some analysts _______ that revenues will more than double by 2028.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "二手時尚轉售市場（消費者從商店與網路賣家購買二手衣物）在 2019 年於全球創造了將近 300 億美元的營收。由於預期成長將持續，一些分析師 _______ 營收到 2028 年將增加超過一倍。", "opts": {"A": "produced", "B": "denied", "C": "worried", "D": "predicted"}, "optsZh": {"A": "produced（生產；製作）", "B": "denied（否認；拒絕）", "C": "worried（擔心）", "D": "predicted（預測）"}, "answer": "D", "expl": "Analysts expecting continued growth would forecast, or 'predict,' that revenues will more than double.", "explZh": "分析師預期市場會持續成長，因此是「predicted」（預測）營收將增加一倍以上。", "defs": {"A": {"pos": "v.", "en": "made or created something", "zh": "製造；產生", "word": "produced"}, "B": {"pos": "v.", "en": "said that something is not true; refused to accept", "zh": "否認；拒絕", "word": "denied"}, "C": {"pos": "v.", "en": "felt anxious or troubled", "zh": "擔心", "word": "worried"}, "D": {"pos": "v.", "en": "said what would happen in the future", "zh": "預測", "word": "predicted"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: predicted future growth.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. After reviewing sales records and demographic changes, analysts ______ that demand for electric bicycles would continue rising in dense urban areas over the next decade.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. After reviewing sales records and demographic changes, analysts ______ that demand for electric bicycles would continue rising in dense urban areas over the next decade.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。在檢視銷售紀錄與人口結構變化之後，分析師 ______ 未來十年，人口密集的都市地區對電動自行車的需求將持續上升。", "opts": {"A": "worried", "B": "predicted", "C": "produced", "D": "denied"}, "optsZh": {"A": "worried（擔心）", "B": "predicted（預測）", "C": "produced（生產；製作）", "D": "denied（否認；拒絕）"}, "answer": "B", "expl": "Predicted means forecasted.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "felt anxious or troubled", "zh": "擔心", "word": "worried"}, "B": {"pos": "v.", "en": "said what would happen in the future", "zh": "預測", "word": "predicted"}, "C": {"pos": "v.", "en": "made or created something", "zh": "製造；產生", "word": "produced"}, "D": {"pos": "v.", "en": "said that something is not true; refused to accept", "zh": "否認；拒絕", "word": "denied"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: predicted future growth.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The research group ______ that coastal flooding would become more frequent if sea levels continued to rise, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to help show that something is true; to back an idea\" data-zh=\"支持；佐證\">supported<\/a> by several climate models.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The research group ______ that coastal flooding would become more frequent if sea levels continued to rise, a conclusion supported by several climate models.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。研究小組 ______ 如果海平面持續上升，沿海洪水將會更加頻繁，這個結論得到了數個氣候模型的支持。", "opts": {"A": "questioned", "B": "repaired", "C": "projected", "D": "imitated"}, "optsZh": {"A": "questioned（質疑）", "B": "repaired（修理）", "C": "projected（預估；推測）", "D": "imitated（模仿）"}, "answer": "C", "expl": "Projected means predicted from evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "expressed doubt about something", "zh": "質疑", "word": "questioned"}, "B": {"pos": "v.", "en": "fixed something that was broken", "zh": "修理；修復", "word": "repaired"}, "C": {"pos": "v.", "en": "estimated what a future amount or result will be", "zh": "預估；推算", "word": "projected"}, "D": {"pos": "v.", "en": "copied the way someone or something does things", "zh": "模仿", "word": "imitated"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: predicted future growth.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Based on early enrollment numbers, university officials ______ that the new data-science program would need additional instructors by its second year.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Based on early enrollment numbers, university officials ______ that the new data-science program would need additional instructors by its second year.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。根據初期的招生人數，大學主管 ______ 新的資料科學學程到了第二年將需要增聘講師。", "opts": {"A": "ignored", "B": "collected", "C": "minimized", "D": "forecast"}, "optsZh": {"A": "ignored（忽視）", "B": "collected（收集；採集）", "C": "minimized（將……減到最少；淡化）", "D": "forecast（預測）"}, "answer": "D", "expl": "Forecast means predict.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "paid no attention to something", "zh": "忽視", "word": "ignored"}, "B": {"pos": "v.", "en": "gathered things together; obtained", "zh": "收集；採集", "word": "collected"}, "C": {"pos": "v.", "en": "made something as small as possible, or treated it as unimportant", "zh": "使減到最少；淡化", "word": "minimized"}, "D": {"pos": "v.", "en": "to predict what will happen in the future", "zh": "預測", "word": "forecast"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: predicted future growth.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Economists ______ a gradual recovery in tourism revenue after travel restrictions were lifted, though they warned that the pace would vary by region.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Economists ______ a gradual recovery in tourism revenue after travel restrictions were lifted, though they warned that the pace would vary by region.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。經濟學家 ______ 旅遊限制解除後，觀光收入將逐步回升，但他們也提醒，回升速度將因地區而異。", "opts": {"A": "anticipated", "B": "replaced", "C": "produced", "D": "denied"}, "optsZh": {"A": "anticipated（預期；預料）", "B": "replaced（取代）", "C": "produced（生產；製作）", "D": "denied（否認；拒絕）"}, "answer": "A", "expl": "Anticipated means expected or predicted.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "expected or predicted that something would happen", "zh": "預期；預料", "word": "anticipated"}, "B": {"pos": "v.", "en": "put something new in the place of something else", "zh": "取代；更換", "word": "replaced"}, "C": {"pos": "v.", "en": "made or created something", "zh": "製造；產生", "word": "produced"}, "D": {"pos": "v.", "en": "said that something is not true; refused to accept", "zh": "否認；拒絕", "word": "denied"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: predicted future growth.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The engineers ______ that the bridge would require major repairs within fifteen years if traffic volume kept increasing at the current rate.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The engineers ______ that the bridge would require major repairs within fifteen years if traffic volume kept increasing at the current rate.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。工程師們 ______ 如果交通量持續以目前的速度增加，這座橋將在十五年內需要大規模修繕。", "opts": {"A": "worried", "B": "estimated", "C": "created", "D": "illustrated"}, "optsZh": {"A": "worried（擔心）", "B": "estimated（估計）", "C": "created（創造；製作）", "D": "illustrated（說明；描繪）"}, "answer": "B", "expl": "Estimated means made a reasoned prediction.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "felt anxious or troubled", "zh": "擔心", "word": "worried"}, "B": {"pos": "v.", "en": "guessed an amount or value based on information", "zh": "估計", "word": "estimated"}, "C": {"pos": "v.", "en": "made something new", "zh": "創造；製作", "word": "created"}, "D": {"pos": "v.", "en": "explained with examples or drew pictures for", "zh": "說明；繪製插圖", "word": "illustrated"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: overcome a problem.", "vocab": true, "body": "Artificially <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliver\" target=\"_blank\" rel=\"noopener\" data-w=\"deliver\" data-pos=\"v.\" data-en=\"to give a speech; to take something to a place\" data-zh=\"發表（演說）；遞送\">delivering<\/a> biomolecules to plant cells is an important component of protecting plants from pathogens, but it is difficult to transmit biomolecules through the layers of the plant cell wall. Markita del Carpio Landry and her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> have shown that it may be possible to _______ this problem by transmitting <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=molecule\" target=\"_blank\" rel=\"noopener\" data-w=\"molecule\" data-pos=\"n.\" data-en=\"the smallest unit of a substance, made of atoms\" data-zh=\"分子\">molecules<\/a> through carbon nanotubes, which can cross cell walls.", "bodyPlain": "Artificially delivering biomolecules to plant cells is an important component of protecting plants from pathogens, but it is difficult to transmit biomolecules through the layers of the plant cell wall. Markita del Carpio Landry and her colleagues have shown that it may be possible to _______ this problem by transmitting molecules through carbon nanotubes, which can cross cell walls.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "以人工方式將生物分子送入植物細胞，是保護植物免受病原體侵害的重要環節，但生物分子很難穿透植物細胞壁的層層構造。Markita del Carpio Landry 與她的同事已證明，透過能穿越細胞壁的奈米碳管來傳送分子，或許有可能 _______ 這個問題。", "opts": {"A": "conceptualize", "B": "neglect", "C": "illustrate", "D": "overcome"}, "optsZh": {"A": "conceptualize（使概念化；構想）", "B": "neglect（忽略；疏忽）", "C": "illustrate（說明；描繪）", "D": "overcome（克服）"}, "answer": "D", "expl": "Carbon nanotubes that cross cell walls offer a way to deal successfully with, or 'overcome,' the difficulty of getting molecules through the wall.", "explZh": "碳奈米管能穿過細胞壁，正好可以「overcome」（克服）分子難以穿透細胞壁的問題。", "defs": {"A": {"pos": "v.", "en": "to form an idea of something in your mind", "zh": "構想；使概念化", "word": "conceptualize"}, "B": {"pos": "v.", "en": "to fail to give enough care or attention to something", "zh": "忽略；疏於照顧", "word": "neglect"}, "C": {"pos": "v.", "en": "to explain or show something with examples or pictures", "zh": "說明；圖解", "word": "illustrate"}, "D": {"pos": "v.", "en": "to succeed in dealing with a problem or difficulty", "zh": "克服", "word": "overcome"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: overcome a problem.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The membrane blocks many useful compounds from entering the cell, but the team&#x27;s new carrier molecule may help researchers ______ that barrier.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The membrane blocks many useful compounds from entering the cell, but the team's new carrier molecule may help researchers ______ that barrier.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。細胞膜會阻擋許多有用的化合物進入細胞，但該團隊新研發的載體分子或許能幫助研究人員 ______ 這道屏障。", "opts": {"A": "neglect", "B": "illustrate", "C": "overcome", "D": "conceptualize"}, "optsZh": {"A": "neglect（忽略；疏忽）", "B": "illustrate（說明；描繪）", "C": "overcome（克服）", "D": "conceptualize（使概念化；構想）"}, "answer": "C", "expl": "Overcome means successfully deal with a problem.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to fail to give enough care or attention to something", "zh": "忽略；疏於照顧", "word": "neglect"}, "B": {"pos": "v.", "en": "to explain or show something with examples or pictures", "zh": "說明；圖解", "word": "illustrate"}, "C": {"pos": "v.", "en": "to succeed in dealing with a problem or difficulty", "zh": "克服", "word": "overcome"}, "D": {"pos": "v.", "en": "to form an idea of something in your mind", "zh": "構想；使概念化", "word": "conceptualize"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: overcome a problem.", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The first design failed in windy <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>, so the engineers added <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flexible\" target=\"_blank\" rel=\"noopener\" data-w=\"flexible\" data-pos=\"adj.\" data-en=\"able to bend easily\" data-zh=\"可彎曲的；有彈性的\">flexible<\/a> joints to ______ the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stability\" target=\"_blank\" rel=\"noopener\" data-w=\"stability\" data-pos=\"n.\" data-en=\"the state of being steady and not changing suddenly\" data-zh=\"穩定\">stability<\/a> problem without increasing the tower&#x27;s weight.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The first design failed in windy conditions, so the engineers added flexible joints to ______ the stability problem without increasing the tower's weight.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。第一版設計在強風條件下失敗了，因此工程師加裝了可彎曲的接頭，在不增加塔身重量的情況下 ______ 穩定性的問題。", "opts": {"A": "describe", "B": "neglect", "C": "imitate", "D": "resolve"}, "optsZh": {"A": "describe（描述）", "B": "neglect（忽略；疏忽）", "C": "imitate（模仿）", "D": "resolve（解決）"}, "answer": "D", "expl": "Resolve means solve.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to say what something is like", "zh": "描述", "word": "describe"}, "B": {"pos": "v.", "en": "to fail to give enough care or attention to something", "zh": "忽略；疏於照顧", "word": "neglect"}, "C": {"pos": "v.", "en": "to copy the way someone or something does things", "zh": "模仿", "word": "imitate"}, "D": {"pos": "v.", "en": "to find a solution to a problem", "zh": "解決", "word": "resolve"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: overcome a problem.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Because the database contained inconsistent spellings of names, the historians developed a matching algorithm to ______ the obstacle before analyzing migration patterns.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Because the database contained inconsistent spellings of names, the historians developed a matching algorithm to ______ the obstacle before analyzing migration patterns.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。由於資料庫中的人名拼寫不一致，歷史學家在分析遷徙模式之前，先開發了一套比對演算法來 ______ 這個障礙。", "opts": {"A": "illustrate", "B": "surmount", "C": "define", "D": "ignore"}, "optsZh": {"A": "illustrate（說明；描繪）", "B": "surmount（克服；越過）", "C": "define（定義；界定）", "D": "ignore（忽視）"}, "answer": "B", "expl": "Surmount means overcome.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to explain or show something with examples or pictures", "zh": "說明；圖解", "word": "illustrate"}, "B": {"pos": "v.", "en": "to deal successfully with a difficulty", "zh": "克服；越過", "word": "surmount"}, "C": {"pos": "v.", "en": "to explain the exact meaning of something", "zh": "定義；界定", "word": "define"}, "D": {"pos": "v.", "en": "to pay no attention to something", "zh": "忽視", "word": "ignore"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: overcome a problem.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The vaccine had to remain cold during transport, but researchers found that a powdered formula could ______ this limitation by staying stable at room <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The vaccine had to remain cold during transport, but researchers found that a powdered formula could ______ this limitation by staying stable at room temperature.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這種疫苗在運送過程中必須保持低溫，但研究人員發現，粉末配方能在室溫下保持穩定，因而可以 ______ 這項限制。", "opts": {"A": "circumvent", "B": "worsen", "C": "neglect", "D": "document"}, "optsZh": {"A": "circumvent（規避；繞過）", "B": "worsen（使惡化）", "C": "neglect（忽略；疏忽）", "D": "document（記錄）"}, "answer": "A", "expl": "Circumvent means find a way around a difficulty.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to find a way around a problem or rule", "zh": "規避；繞過", "word": "circumvent"}, "B": {"pos": "v.", "en": "to become or make something worse", "zh": "惡化；使變糟", "word": "worsen"}, "C": {"pos": "v.", "en": "to fail to give enough care or attention to something", "zh": "忽略；疏於照顧", "word": "neglect"}, "D": {"pos": "v.", "en": "to record information in writing, photos, etc.", "zh": "記錄", "word": "document"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: overcome a problem.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeological\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeological\" data-pos=\"adj.\" data-en=\"relating to the study of ancient remains\" data-zh=\"考古的\">archaeological<\/a> site was partly underwater, so the team used floating platforms to ______ the challenge of excavating fragile objects in shifting mud.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeological site was partly underwater, so the team used floating platforms to ______ the challenge of excavating fragile objects in shifting mud.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。這個考古遺址有一部分位於水下，因此團隊使用浮動平台來 ______ 在流動的泥沙中挖掘脆弱文物的挑戰。", "opts": {"A": "address", "B": "conceptualize", "C": "deny", "D": "replicate"}, "optsZh": {"A": "address（處理；應對）", "B": "conceptualize（使概念化；構想）", "C": "deny（否認）", "D": "replicate（複製；重現）"}, "answer": "A", "expl": "Address means deal with a problem.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to deal with or try to solve a problem", "zh": "處理；解決（問題）", "word": "address"}, "B": {"pos": "v.", "en": "to form an idea of something in your mind", "zh": "構想；使概念化", "word": "conceptualize"}, "C": {"pos": "v.", "en": "to say that something is not true", "zh": "否認", "word": "deny"}, "D": {"pos": "v.", "en": "to copy or repeat something exactly, such as an experiment", "zh": "複製；重現", "word": "replicate"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: inspecting invisible phenomena.", "vocab": true, "body": "Particle <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=physicist\" target=\"_blank\" rel=\"noopener\" data-w=\"physicist\" data-pos=\"n.\" data-en=\"a scientist who studies physics\" data-zh=\"物理學家\">physicists<\/a> like Ayana Holloway Arce and Aida El-Khadra spend much of their time _______ what is invisible to the naked eye: using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sophisticated\" target=\"_blank\" rel=\"noopener\" data-w=\"sophisticated\" data-pos=\"adj.\" data-en=\"advanced and complex\" data-zh=\"精密的；複雜的\">sophisticated<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a>, they closely examine the behavior of subatomic particles, the smallest <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detectable\" target=\"_blank\" rel=\"noopener\" data-w=\"detectable\" data-pos=\"adj.\" data-en=\"able to be noticed or measured\" data-zh=\"可偵測的\">detectable<\/a> parts of matter.", "bodyPlain": "Particle physicists like Ayana Holloway Arce and Aida El-Khadra spend much of their time _______ what is invisible to the naked eye: using sophisticated technology, they closely examine the behavior of subatomic particles, the smallest detectable parts of matter.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "像 Ayana Holloway Arce 與 Aida El-Khadra 這樣的粒子物理學家，花了大量時間 _______ 肉眼看不見的事物：他們運用精密的科技，仔細檢視次原子粒子——也就是物質中可偵測到的最小組成部分——的行為。", "opts": {"A": "selecting", "B": "inspecting", "C": "creating", "D": "deciding"}, "optsZh": {"A": "selecting（選擇）", "B": "inspecting（檢查；審視）", "C": "creating（創造；製造）", "D": "deciding（決定）"}, "answer": "B", "expl": "The colon explains that the physicists 'closely examine' subatomic particles, so they spend their time 'inspecting' the invisible.", "explZh": "冒號後說明物理學家「仔細檢查」次原子粒子，所以他們花時間「inspecting」（檢視、檢查）肉眼看不見的東西。", "defs": {"A": {"pos": "v.", "en": "carefully choosing something", "zh": "挑選", "word": "selecting"}, "B": {"pos": "v.", "en": "looking at something closely to check it", "zh": "檢查；檢視", "word": "inspecting"}, "C": {"pos": "v.", "en": "making something new", "zh": "創造；製作", "word": "creating"}, "D": {"pos": "v.", "en": "making a choice after thinking", "zh": "決定", "word": "deciding"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: inspecting invisible phenomena.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Conservators spent months ______ the barely visible underdrawing beneath the painting&#x27;s surface, using infrared cameras to study lines hidden below layers of pigment.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Conservators spent months ______ the barely visible underdrawing beneath the painting's surface, using infrared cameras to study lines hidden below layers of pigment.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。文物修復師花了數個月 ______ 畫作表面下幾乎看不見的底稿，用紅外線相機研究隱藏在顏料層底下的線條。", "opts": {"A": "creating", "B": "selecting", "C": "deciding", "D": "inspecting"}, "optsZh": {"A": "creating（創造；製造）", "B": "selecting（選擇）", "C": "deciding（決定）", "D": "inspecting（檢查；審視）"}, "answer": "D", "expl": "Inspecting means examining closely.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "making something new", "zh": "創造；製作", "word": "creating"}, "B": {"pos": "v.", "en": "carefully choosing something", "zh": "挑選", "word": "selecting"}, "C": {"pos": "v.", "en": "making a choice after thinking", "zh": "決定", "word": "deciding"}, "D": {"pos": "v.", "en": "looking at something closely to check it", "zh": "檢查；檢視", "word": "inspecting"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: inspecting invisible phenomena.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The physician was ______ the scan for minute changes in tissue density that might indicate an early stage of disease.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The physician was ______ the scan for minute changes in tissue density that might indicate an early stage of disease.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。醫師正在 ______ 掃描影像，尋找可能顯示疾病早期階段的組織密度細微變化。", "opts": {"A": "inventing", "B": "postponing", "C": "examining", "D": "choosing"}, "optsZh": {"A": "inventing（發明）", "B": "postponing（延後）", "C": "examining（檢查；研究）", "D": "choosing（選擇）"}, "answer": "C", "expl": "Examining means inspecting carefully.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "creating something that did not exist before", "zh": "發明", "word": "inventing"}, "B": {"pos": "v.", "en": "delaying something until a later time", "zh": "延後；推遲", "word": "postponing"}, "C": {"pos": "v.", "en": "looking at something carefully", "zh": "檢查；仔細觀察", "word": "examining"}, "D": {"pos": "v.", "en": "picking one thing from several possibilities", "zh": "選擇", "word": "choosing"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: inspecting invisible phenomena.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers are ______ faint signals from distant galaxies, separating them from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a> noise with instruments more sensitive than the human eye.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers are ______ faint signals from distant galaxies, separating them from background noise with instruments more sensitive than the human eye.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。天文學家正在 ______ 來自遙遠星系的微弱訊號，並使用比人眼更靈敏的儀器將它們與背景雜訊區分開來。", "opts": {"A": "selecting", "B": "creating", "C": "denying", "D": "analyzing"}, "optsZh": {"A": "selecting（選擇）", "B": "creating（創造；製造）", "C": "denying（否認）", "D": "analyzing（分析）"}, "answer": "D", "expl": "Analyzing means examining in detail.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "carefully choosing something", "zh": "挑選", "word": "selecting"}, "B": {"pos": "v.", "en": "making something new", "zh": "創造；製作", "word": "creating"}, "C": {"pos": "v.", "en": "saying that something is not true", "zh": "否認", "word": "denying"}, "D": {"pos": "v.", "en": "examining something carefully to understand it", "zh": "分析", "word": "analyzing"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: inspecting invisible phenomena.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The materials scientist spent the afternoon ______ microscopic cracks in the alloy to determine why the component had failed under pressure.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The materials scientist spent the afternoon ______ microscopic cracks in the alloy to determine why the component had failed under pressure.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這位材料科學家花了一下午 ______ 合金中的微小裂縫，以找出這個零件為何在壓力下失效。", "opts": {"A": "deciding", "B": "scrutinizing", "C": "selecting", "D": "creating"}, "optsZh": {"A": "deciding（決定）", "B": "scrutinizing（仔細檢查；審視）", "C": "selecting（選擇）", "D": "creating（創造；製造）"}, "answer": "B", "expl": "Scrutinizing means examining very carefully.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "making a choice after thinking", "zh": "決定", "word": "deciding"}, "B": {"pos": "v.", "en": "examining something very carefully and in detail", "zh": "仔細審查；詳細檢視", "word": "scrutinizing"}, "C": {"pos": "v.", "en": "carefully choosing something", "zh": "挑選", "word": "selecting"}, "D": {"pos": "v.", "en": "making something new", "zh": "創造；製作", "word": "creating"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: inspecting invisible phenomena.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Using a high-resolution scanner, the archivist began ______ erased writing on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> page, hoping to recover a text hidden for centuries.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Using a high-resolution scanner, the archivist began ______ erased writing on the manuscript page, hoping to recover a text hidden for centuries.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。這位檔案管理員使用高解析度掃描器，開始 ______ 手稿頁面上被擦除的字跡，希望找回一段隱藏了數百年的文字。", "opts": {"A": "detecting", "B": "choosing", "C": "reviewing", "D": "creating"}, "optsZh": {"A": "detecting（偵測；察覺）", "B": "choosing（選擇）", "C": "reviewing（檢閱；複查）", "D": "creating（創造；製造）"}, "answer": "A", "expl": "Detecting means discovering or identifying something hard to see.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "noticing or discovering something that is hard to see", "zh": "偵測；察覺", "word": "detecting"}, "B": {"pos": "v.", "en": "picking one thing from several possibilities", "zh": "選擇", "word": "choosing"}, "C": {"pos": "v.", "en": "looking at or studying something again", "zh": "審查；複習", "word": "reviewing"}, "D": {"pos": "v.", "en": "making something new", "zh": "創造；製作", "word": "creating"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: comparable to.", "vocab": true, "body": "Anthropologist Kristian J. Carlson and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> examined the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fossilized\" target=\"_blank\" rel=\"noopener\" data-w=\"fossilized\" data-pos=\"adj.\" data-en=\"preserved as a fossil in rock\" data-zh=\"化石化的\">fossilized<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=clavicle\" target=\"_blank\" rel=\"noopener\" data-w=\"clavicle\" data-pos=\"n.\" data-en=\"the collarbone\" data-zh=\"鎖骨\">clavicle<\/a> and shoulder bones of a 3.6-million-year-old early <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hominin\" target=\"_blank\" rel=\"noopener\" data-w=\"hominin\" data-pos=\"n.\" data-en=\"a member of the group that includes humans and their extinct ancestors\" data-zh=\"人族（人類及其已滅絕祖先）\">hominin<\/a> known as &quot;Little Foot.&quot; They found that these bones were _______ the clavicle and shoulder bones of modern apes that are frequent climbers, such as gorillas and chimpanzees, suggesting that Little Foot had adapted to life in the trees.", "bodyPlain": "Anthropologist Kristian J. Carlson and colleagues examined the fossilized clavicle and shoulder bones of a 3.6-million-year-old early hominin known as \"Little Foot.\" They found that these bones were _______ the clavicle and shoulder bones of modern apes that are frequent climbers, such as gorillas and chimpanzees, suggesting that Little Foot had adapted to life in the trees.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "人類學家 Kristian J.Carlson 與同事檢視了一具距今 360 萬年、名為「Little Foot」的早期人族化石的鎖骨與肩骨。他們發現這些骨骼 _______ 經常攀爬的現代猿類（如大猩猩與黑猩猩）的鎖骨與肩骨，顯示 Little Foot 已適應樹上的生活。", "opts": {"A": "surpassed by", "B": "comparable to", "C": "independent of", "D": "obtained from"}, "optsZh": {"A": "surpassed by（被……超越）", "B": "comparable to（可與……相比的；相當於）", "C": "independent of（獨立於……；與……無關）", "D": "obtained from（從……取得）"}, "answer": "B", "expl": "The bones' similarity to those of climbing apes suggests Little Foot climbed trees, so the bones were 'comparable to' (similar to) the apes' bones.", "explZh": "化石骨骼與常攀爬的猿類骨骼相似，才能推論 Little Foot 適應樹上生活，所以是「comparable to」（相似、可相比的）。", "defs": {"A": {"w": "surpassed", "pos": "phr.", "en": "done better than or exceeded by", "zh": "被……超越", "word": "surpassed"}, "B": {"w": "comparable", "pos": "phr.", "en": "similar enough in size, amount, or quality to be compared", "zh": "與……相當；可與……相比", "word": "comparable"}, "C": {"w": "independent", "pos": "phr.", "en": "not controlled by or connected to something", "zh": "獨立於；不受……影響", "word": "independent"}, "D": {"w": "obtained", "pos": "phr.", "en": "gotten or acquired from a source", "zh": "從……取得", "word": "obtained"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: comparable to.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The newly discovered footprints are ______ those of known early hominins, suggesting that the individuals who made them may have walked in a similar way.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The newly discovered footprints are ______ those of known early hominins, suggesting that the individuals who made them may have walked in a similar way.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。新發現的足跡 ______ 已知早期人族的足跡，顯示留下這些足跡的個體可能以類似的方式行走。", "opts": {"A": "comparable to", "B": "obtained from", "C": "surpassed by", "D": "independent of"}, "optsZh": {"A": "comparable to（可與……相比的；相當於）", "B": "obtained from（從……取得）", "C": "surpassed by（被……超越）", "D": "independent of（獨立於……；與……無關）"}, "answer": "A", "expl": "Comparable to means similar enough to compare.", "explZh": "", "defs": {"A": {"w": "comparable", "pos": "phr.", "en": "similar enough in size, amount, or quality to be compared", "zh": "與……相當；可與……相比", "word": "comparable"}, "B": {"w": "obtained", "pos": "phr.", "en": "gotten or acquired from a source", "zh": "從……取得", "word": "obtained"}, "C": {"w": "surpassed", "pos": "phr.", "en": "done better than or exceeded by", "zh": "被……超越", "word": "surpassed"}, "D": {"w": "independent", "pos": "phr.", "en": "not controlled by or connected to something", "zh": "獨立於；不受……影響", "word": "independent"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: comparable to.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Chemical traces in the pottery were ______ residues found in vessels used for fermenting grain, so the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> proposed that the jars once held beer.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Chemical traces in the pottery were ______ residues found in vessels used for fermenting grain, so the archaeologists proposed that the jars once held beer.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。陶器中的化學殘留物 ______ 用來發酵穀物的容器中所發現的殘留物，因此考古學家推測這些陶罐曾經裝過啤酒。", "opts": {"A": "separate from", "B": "borrowed from", "C": "superior to", "D": "similar to"}, "optsZh": {"A": "separate from（與……分開的）", "B": "borrowed from（借自；源自）", "C": "superior to（優於）", "D": "similar to（與……相似）"}, "answer": "D", "expl": "Similar to means comparable to.", "explZh": "", "defs": {"A": {"w": "separate", "pos": "phr.", "en": "not joined or connected to something", "zh": "與……分開的", "word": "separate"}, "B": {"w": "borrowed", "pos": "phr.", "en": "taken from another source and used", "zh": "借自；取自", "word": "borrowed"}, "C": {"w": "superior", "pos": "phr.", "en": "better than something else", "zh": "優於", "word": "superior"}, "D": {"w": "similar", "pos": "phr.", "en": "almost the same as something", "zh": "類似於", "word": "similar"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: comparable to.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, o
