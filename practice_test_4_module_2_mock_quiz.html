ding and the resulting pollution of nearby waterways has been achieved.", "D": "both street flooding and the resulting pollution of nearby waterways have been mitigated by bioswales."}, "optsZh": {"A": "街道淹水與附近水道污染的減輕已由生物滯留溝達成。（主詞為 mitigation，不是執行 reducing 的一方 → 懸垂修飾語：錯誤）", "B": "生物滯留溝已減輕了街道淹水以及由此造成的附近水道污染。（主詞 bioswales 正是執行 reducing 的一方：正確）", "C": "生物滯留溝對街道淹水與附近水道污染的減輕已經達成。（主詞為 mitigation，不是執行 reducing 的一方 → 懸垂修飾語：錯誤）", "D": "街道淹水以及由此造成的附近水道污染都已被生物滯留溝減輕。（主詞為淹水與污染，不是執行 reducing 的生物滯留溝 → 懸垂修飾語：錯誤）"}, "answer": "B", "expl": "The introductory phrase 'By reducing the runoff...' must modify the thing that did the reducing—the bioswales—so 'the bioswales' must be the subject right after the comma.", "explZh": "句首修飾語「By reducing the runoff...」的邏輯主詞必須是執行「減少逕流」的 bioswales，所以逗號後主詞應為 the bioswales。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "stories of the immigrant families", "B": "story's of the immigrant families", "C": "stories' of the immigrant family's", "D": "story's of the immigrant families'"}, "optsZh": {"A": "stories of the immigrant families（複數名詞，不需所有格：正確）", "B": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）", "C": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）", "D": "story's of the immigrant families'（不當使用所有格撇號：錯誤）"}, "answer": "A", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of:", "B": "of", "C": "of,", "D": "of-"}, "optsZh": {"A": "of:（介系詞後不可接冒號：錯誤）", "B": "of（介系詞後直接接受詞，不需標點：正確）", "C": "of,（介系詞與受詞之間不可加逗號：錯誤）", "D": "of-（介系詞與受詞之間不可加破折號：錯誤）"}, "answer": "B", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization, that", "B": "organization", "C": "organization that", "D": "organization,"}, "optsZh": {"A": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）", "B": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）", "C": "organization that（that 引導限定性關係子句：正確）", "D": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）"}, "answer": "C", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": ", (15N)", "B": "(15N)", "C": "(15N),", "D": ", (15N),"}, "optsZh": {"A": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）", "B": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）", "C": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）", "D": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）"}, "answer": "C", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls so with", "B": "walls, with", "C": "walls with", "D": "walls. With"}, "optsZh": {"A": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）", "B": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "C": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "D": "walls. With（句號分開兩個獨立子句：正確）"}, "answer": "D", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: colon introducing explanation.", "vocab": false, "body": "A study published by Rice University <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=geoscientist\" target=\"_blank\" rel=\"noopener\" data-w=\"geoscientist\" data-pos=\"n.\" data-en=\"a scientist who studies the Earth\" data-zh=\"地球科學家\">geoscientist<\/a> Ming Tang in 2019 offers a new explanation for the origin of Earth&#x27;s _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a> called arcs, towering ridges that form when a dense <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=oceanic\" target=\"_blank\" rel=\"noopener\" data-w=\"oceanic\" data-pos=\"adj.\" data-en=\"relating to the ocean\" data-zh=\"海洋的\">oceanic<\/a> plate subducts under a less dense <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> plate, melts in the mantle below, and then rises and bursts through the continental crust above.", "bodyPlain": "A study published by Rice University geoscientist Ming Tang in 2019 offers a new explanation for the origin of Earth's _______ structures called arcs, towering ridges that form when a dense oceanic plate subducts under a less dense continental plate, melts in the mantle below, and then rises and bursts through the continental crust above.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "萊斯大學地球科學家 Ming Tang 於 2019 年發表的一項研究，為地球上 _______ 被稱為「島弧」的構造的起源提出了新的解釋；島弧是高聳的山脊，形成於密度較高的海洋板塊隱沒到密度較低的大陸板塊之下、在下方地函中熔融，接著上升並衝破上方大陸地殼之時。", "opts": {"A": "continents geological", "B": "continents: geological", "C": "continents; geological", "D": "continents. Geological"}, "optsZh": {"A": "continents geological（缺少標點 → 名詞直接相連，句意不通：錯誤）", "B": "continents: geological（冒號，引出 structures 的具體說明：正確）", "C": "continents; geological（分號後須接獨立子句，此處只是名詞片語：錯誤）", "D": "continents. Geological（句號 → 後面只是名詞片語，造成不完整句：錯誤）"}, "answer": "B", "expl": "The phrase after the blank explains what the 'new explanation for the origin of Earth's continents' is about; a colon correctly introduces this explanation after a complete clause.", "explZh": "空格前是完整句子，後面的「geological structures called arcs...」用來說明大陸起源的新解釋，冒號正適合引出解釋。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: colon introducing explanation.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "story's of the immigrant families'", "B": "story's of the immigrant families", "C": "stories of the immigrant families", "D": "stories' of the immigrant family's"}, "optsZh": {"A": "story's of the immigrant families'（不當使用所有格撇號：錯誤）", "B": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）", "C": "stories of the immigrant families（複數名詞，不需所有格：正確）", "D": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）"}, "answer": "C", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: colon introducing explanation.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of,", "B": "of", "C": "of-", "D": "of:"}, "optsZh": {"A": "of,（介系詞與受詞之間不可加逗號：錯誤）", "B": "of（介系詞後直接接受詞，不需標點：正確）", "C": "of-（介系詞與受詞之間不可加破折號：錯誤）", "D": "of:（介系詞後不可接冒號：錯誤）"}, "answer": "B", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: colon introducing explanation.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization that", "B": "organization", "C": "organization, that", "D": "organization,"}, "optsZh": {"A": "organization that（that 引導限定性關係子句：正確）", "B": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）", "C": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）", "D": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）"}, "answer": "A", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: colon introducing explanation.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": "(15N)", "B": ", (15N)", "C": "(15N),", "D": ", (15N),"}, "optsZh": {"A": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）", "B": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）", "C": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）", "D": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）"}, "answer": "C", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: colon introducing explanation.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls, with", "B": "walls so with", "C": "walls with", "D": "walls. With"}, "optsZh": {"A": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "B": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）", "C": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "D": "walls. With（句號分開兩個獨立子句：正確）"}, "answer": "D", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: afterward in response to prior event.", "vocab": false, "body": "During a 2021 launch, Rocket Labs&#x27; Electron rocket experienced an unexpected failure: its second-stage booster shut down suddenly after <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ignition\" target=\"_blank\" rel=\"noopener\" data-w=\"ignition\" data-pos=\"n.\" data-en=\"the act of starting to burn or fire an engine\" data-zh=\"點火\">ignition<\/a>. _______ instead of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=downplay\" target=\"_blank\" rel=\"noopener\" data-w=\"downplay\" data-pos=\"v.\" data-en=\"to make something seem less important than it is\" data-zh=\"淡化；輕描淡寫\">downplaying<\/a> the incident, Rocket Labs&#x27; CEO publicly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=acknowledge\" target=\"_blank\" rel=\"noopener\" data-w=\"acknowledge\" data-pos=\"v.\" data-en=\"to accept or admit that something is true\" data-zh=\"承認\">acknowledged<\/a> what happened and apologized for the loss of the rocket&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=payload\" target=\"_blank\" rel=\"noopener\" data-w=\"payload\" data-pos=\"n.\" data-en=\"the cargo carried by a rocket or aircraft\" data-zh=\"酬載；有效載荷\">payload<\/a>, which had consisted of two satellites.", "bodyPlain": "During a 2021 launch, Rocket Labs' Electron rocket experienced an unexpected failure: its second-stage booster shut down suddenly after ignition. _______ instead of downplaying the incident, Rocket Labs' CEO publicly acknowledged what happened and apologized for the loss of the rocket's payload, which had consisted of two satellites.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在 2021 年的一次發射中，Rocket Labs 的 Electron 火箭發生了意外故障：其第二節推進器在點火後突然關閉。_______ Rocket Labs 的執行長並未淡化這起事件，而是公開承認所發生的事，並為火箭酬載（兩顆衛星）的損失道歉。", "opts": {"A": "Afterward,", "B": "Additionally,", "C": "Indeed,", "D": "Similarly,"}, "optsZh": {"A": "Afterward,（之後：表時間先後，引出事件發生後的回應：正確）", "B": "Additionally,（此外：表補充，不符合前後的時間先後關係：錯誤）", "C": "Indeed,（確實：表強調或加強前文，不符合文意：錯誤）", "D": "Similarly,（同樣地：表相似，前後並非類似情況：錯誤）"}, "answer": "A", "expl": "The CEO's public acknowledgment happened after the failure, so 'Afterward' correctly shows the time sequence.", "explZh": "執行長公開承認並道歉發生在發射失敗之後，所以用「Afterward」（之後）表示時間順序。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: afterward in response to prior event.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The spacecraft lost contact with mission control during its descent. ______ the agency released a detailed explanation of the failure and outlined changes for the next attempt.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The spacecraft lost contact with mission control during its descent. ______ the agency released a detailed explanation of the failure and outlined changes for the next attempt.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。太空船在下降過程中與任務控制中心失去聯繫。______ 該機構公布了關於這次失敗的詳細說明，並概述了下一次嘗試將做的改變。", "opts": {"A": "Additionally,", "B": "Similarly,", "C": "Afterward,", "D": "Indeed,"}, "optsZh": {"A": "Additionally,（此外：表補充，不符合前後的時間先後關係：錯誤）", "B": "Similarly,（同樣地：表相似，前後並非類似情況：錯誤）", "C": "Afterward,（之後：表時間先後，引出事件發生後的回應：正確）", "D": "Indeed,（確實：表強調或加強前文，不符合文意：錯誤）"}, "answer": "C", "expl": "Afterward indicates what happened after the event.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: afterward in response to prior event.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The bridge <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspection\" target=\"_blank\" rel=\"noopener\" data-w=\"inspection\" data-pos=\"n.\" data-en=\"a careful look at something\" data-zh=\"檢查；細看\">inspection<\/a> revealed unexpected cracks in two support beams. ______ city engineers closed one lane and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=announce\" target=\"_blank\" rel=\"noopener\" data-w=\"announce\" data-pos=\"v.\" data-en=\"to make something known publicly\" data-zh=\"宣布\">announced<\/a> emergency repairs.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The bridge inspection revealed unexpected cracks in two support beams. ______ city engineers closed one lane and announced emergency repairs.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。橋梁檢查發現兩根支撐梁出現意料之外的裂縫。______ 市政工程師封閉了一個車道，並宣布進行緊急修繕。", "opts": {"A": "Subsequently,", "B": "Moreover,", "C": "Likewise,", "D": "For example,"}, "optsZh": {"A": "Subsequently,（隨後：表時間先後：正確）", "B": "Moreover,（此外；而且：表補充，不符合時間先後關係：錯誤）", "C": "Likewise,（同樣地：表相似，前後並非類似情況：錯誤）", "D": "For example,（例如：表舉例，後文並非前文的例子：錯誤）"}, "answer": "A", "expl": "Subsequently means afterward.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: afterward in response to prior event.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The museum discovered that several labels contained incorrect dates. ______ the curators replaced the labels and published a note explaining the corrections.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The museum discovered that several labels contained incorrect dates. ______ the curators replaced the labels and published a note explaining the corrections.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。博物館發現有幾個標籤上的日期有誤。______ 策展人更換了這些標籤，並發布一則說明更正內容的公告。", "opts": {"A": "Indeed,", "B": "Later,", "C": "Additionally,", "D": "Similarly,"}, "optsZh": {"A": "Indeed,（確實：表強調或加強前文，不符合文意：錯誤）", "B": "Later,（後來：表時間先後：正確）", "C": "Additionally,（此外：表補充，不符合前後的時間先後關係：錯誤）", "D": "Similarly,（同樣地：表相似，前後並非類似情況：錯誤）"}, "answer": "B", "expl": "Later introduces the response that followed.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: afterward in response to prior event.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The trial showed that the drug caused serious side effects in a small group of patients. ______ the company paused enrollment and notified regulators.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The trial showed that the drug caused serious side effects in a small group of patients. ______ the company paused enrollment and notified regulators.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。試驗顯示，這種藥物在一小群病患身上造成了嚴重的副作用。______ 公司暫停招募受試者，並通知了主管機關。", "opts": {"A": "Additionally,", "B": "Afterward,", "C": "For instance,", "D": "Similarly,"}, "optsZh": {"A": "Additionally,（此外：表補充，不符合前後的時間先後關係：錯誤）", "B": "Afterward,（之後：表時間先後，引出事件發生後的回應：正確）", "C": "For instance,（例如：表舉例，後文並非前文的例子：錯誤）", "D": "Similarly,（同樣地：表相似，前後並非類似情況：錯誤）"}, "answer": "B", "expl": "Afterward marks the next action in time.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transitions: afterward in response to prior event.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The orchestra&#x27;s outdoor concert was interrupted by a sudden storm. ______ the conductor apologized to ticket holders and announced a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=replacement\" target=\"_blank\" rel=\"noopener\" data-w=\"replacement\" data-pos=\"n.\" data-en=\"a thing that takes the place of another\" data-zh=\"替代品\">replacement<\/a> performance.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The orchestra's outdoor concert was interrupted by a sudden storm. ______ the conductor apologized to ticket holders and announced a replacement performance.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。管弦樂團的戶外音樂會因一場突如其來的暴風雨而中斷。______ 指揮向持票觀眾致歉，並宣布將補辦一場演出。", "opts": {"A": "Moreover,", "B": "Similarly,", "C": "Indeed,", "D": "Afterward,"}, "optsZh": {"A": "Moreover,（此外；而且：表補充，不符合時間先後關係：錯誤）", "B": "Similarly,（同樣地：表相似，前後並非類似情況：錯誤）", "C": "Indeed,（確實：表強調或加強前文，不符合文意：錯誤）", "D": "Afterward,（之後：表時間先後，引出事件發生後的回應：正確）"}, "answer": "D", "expl": "Afterward introduces what happened following the storm.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: alternative method.", "vocab": false, "body": "When soil becomes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contaminate\" target=\"_blank\" rel=\"noopener\" data-w=\"contaminate\" data-pos=\"v.\" data-en=\"to make something dirty or poisonous\" data-zh=\"汙染\">contaminated<\/a> by toxic metals, it can be removed from the ground and disposed of in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landfill\" target=\"_blank\" rel=\"noopener\" data-w=\"landfill\" data-pos=\"n.\" data-en=\"a place where waste is buried\" data-zh=\"垃圾掩埋場\">landfill<\/a>. _______ contaminated soil can be detoxified via phytoremediation: plants that can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=withstand\" target=\"_blank\" rel=\"noopener\" data-w=\"withstand\" data-pos=\"v.\" data-en=\"to resist or survive something\" data-zh=\"承受；抵擋\">withstand<\/a> high concentrations of metals absorb the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pollutant\" target=\"_blank\" rel=\"noopener\" data-w=\"pollutant\" data-pos=\"n.\" data-en=\"a substance that pollutes\" data-zh=\"汙染物\">pollutants<\/a> and store them in their shoots, which are then cut off and safely disposed of, preserving the health of the plants.", "bodyPlain": "When soil becomes contaminated by toxic metals, it can be removed from the ground and disposed of in a landfill. _______ contaminated soil can be detoxified via phytoremediation: plants that can withstand high concentrations of metals absorb the pollutants and store them in their shoots, which are then cut off and safely disposed of, preserving the health of the plants.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "當土壤受到有毒金屬污染時，可以將它從地面移除，並棄置於掩埋場。_______ 受污染的土壤也可以透過植物修復法來解毒：能承受高濃度金屬的植物會吸收污染物，並將其儲存在嫩枝中，之後再把嫩枝剪下並安全處置，同時保持植物的健康。", "opts": {"A": "Alternatively,", "B": "Specifically,", "C": "For example,", "D": "As a result,"}, "optsZh": {"A": "Alternatively,（或者；另一種方式：表替代方法：正確）", "B": "Specifically,（具體來說：表進一步細說前文，不符合文意：錯誤）", "C": "For example,（例如：表舉例，後文並非前文的例子：錯誤）", "D": "As a result,（因此：表因果，前後並非因果關係：錯誤）"}, "answer": "A", "expl": "Phytoremediation is a different option from removing soil to a landfill, so 'Alternatively' correctly introduces another method.", "explZh": "植物修復法是將土壤移至掩埋場以外的另一種方法，所以用「Alternatively」（或者；另一種方式）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: alternative method.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Damaged manuscripts can sometimes be stored without further treatment in climate-controlled cases. ______ conservators may repair torn pages with thin Japanese paper and reversible adhesives.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Damaged manuscripts can sometimes be stored without further treatment in climate-controlled cases. ______ conservators may repair torn pages with thin Japanese paper and reversible adhesives.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。受損的手稿有時可以存放在溫濕度控制的展示櫃中，不做進一步處理。______ 修復師可以用薄的日本紙與可逆的黏著劑修補破損的書頁。", "opts": {"A": "Specifically,", "B": "For example,", "C": "As a result,", "D": "Alternatively,"}, "optsZh": {"A": "Specifically,（具體來說：表進一步細說前文，不符合文意：錯誤）", "B": "For example,（例如：表舉例，後文並非前文的例子：錯誤）", "C": "As a result,（因此：表因果，前後並非因果關係：錯誤）", "D": "Alternatively,（或者；另一種方式：表替代方法：正確）"}, "answer": "D", "expl": "Alternatively presents another possible method.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: alternative method.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A city can reduce traffic by widening major roads. ______ it can invest in buses and trains so fewer residents need to drive.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A city can reduce traffic by widening major roads. ______ it can invest in buses and trains so fewer residents need to drive.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。城市可以藉由拓寬主要道路來減少交通壅塞。______ 它可以投資公車與火車，讓需要開車的居民減少。", "opts": {"A": "For example,", "B": "Alternatively,", "C": "Therefore,", "D": "Specifically,"}, "optsZh": {"A": "For example,（例如：表舉例，後文並非前文的例子：錯誤）", "B": "Alternatively,（或者；另一種方式：表替代方法：正確）", "C": "Therefore,（因此：表因果結論，前後並非因果關係：錯誤）", "D": "Specifically,（具體來說：表進一步細說前文，不符合文意：錯誤）"}, "answer": "B", "expl": "Alternatively introduces a different solution.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: alternative method.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Old wells may be sealed and abandoned. ______ they can be restored with modern pumps when communities need additional water sources.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Old wells may be sealed and abandoned. ______ they can be restored with modern pumps when communities need additional water sources.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。舊水井可以被封閉並廢棄。______ 當社區需要額外的水源時，也可以用現代化的抽水機加以修復。", "opts": {"A": "Similarly,", "B": "As a result,", "C": "Instead,", "D": "For instance,"}, "optsZh": {"A": "Similarly,（同樣地：表相似，前後並非類似情況：錯誤）", "B": "As a result,（因此：表因果，前後並非因果關係：錯誤）", "C": "Instead,（反而；改為：表替代做法：正確）", "D": "For instance,（例如：表舉例，後文並非前文的例子：錯誤）"}, "answer": "C", "expl": "Instead presents an alternative action.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: alternative method.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Invasive plants can be removed by hand. ______ land managers can introduce grazing animals that eat the plants before they spread seeds.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Invasive plants can be removed by hand. ______ land managers can introduce grazing animals that eat the plants before they spread seeds.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。入侵植物可以用人工拔除。______ 土地管理人員可以引進會在這些植物散播種子前就把它們吃掉的放牧動物。", "opts": {"A": "Indeed,", "B": "Alternatively,", "C": "Consequently,", "D": "Specifically,"}, "optsZh": {"A": "Indeed,（確實：表強調或加強前文，不符合文意：錯誤）", "B": "Alternatively,（或者；另一種方式：表替代方法：正確）", "C": "Consequently,（因此：表因果，前後並非因果關係：錯誤）", "D": "Specifically,（具體來說：表進一步細說前文，不符合文意：錯誤）"}, "answer": "B", "expl": "Alternatively introduces another method.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: alternative method.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers can analyze pollen grains under a microscope. ______ they can study <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> DNA preserved in the same sediment layers.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers can analyze pollen grains under a microscope. ______ they can study environmental DNA preserved in the same sediment layers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "下列哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。研究人員可以在顯微鏡下分析花粉粒。______ 他們也可以研究保存在相同沉積層中的環境 DNA。", "opts": {"A": "Alternatively,", "B": "As a result,", "C": "For example,", "D": "Indeed,"}, "optsZh": {"A": "Alternatively,（或者；另一種方式：表替代方法：正確）", "B": "As a result,（因此：表因果，前後並非因果關係：錯誤）", "C": "For example,（例如：表舉例，後文並非前文的例子：錯誤）", "D": "Indeed,（確實：表強調或加強前文，不符合文意：錯誤）"}, "answer": "A", "expl": "Alternatively presents a second approach.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Student Notes: explain an advantage.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The calendar used by most of the world (the Gregorian calendar) has 365 days.<br>- Because 365 days can&#x27;t be divided evenly by 7 (the number of days in a week), calendar dates fall on a different day of the week each year.<br>- The Hanke-Henry <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=permanent\" target=\"_blank\" rel=\"noopener\" data-w=\"permanent\" data-pos=\"adj.\" data-en=\"lasting forever or for a very long time\" data-zh=\"永久的\">permanent<\/a> calendar, developed as an alternative to the Gregorian calendar, has 364 days.<br>- Because 364 can be divided evenly by 7, calendar dates fall on the same day of the week each year, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to help show that something is true; to back an idea\" data-zh=\"支持；佐證\">supports<\/a> more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predictable\" target=\"_blank\" rel=\"noopener\" data-w=\"predictable\" data-pos=\"adj.\" data-en=\"able to be known in advance\" data-zh=\"可預測的\">predictable<\/a> scheduling.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The calendar used by most of the world (the Gregorian calendar) has 365 days.\n- Because 365 days can't be divided evenly by 7 (the number of days in a week), calendar dates fall on a different day of the week each year.\n- The Hanke-Henry permanent calendar, developed as an alternative to the Gregorian calendar, has 364 days.\n- Because 364 can be divided evenly by 7, calendar dates fall on the same day of the week each year, which supports more predictable scheduling.", "stem": "The student wants to explain an advantage of the Hanke-Henry calendar. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要說明 Hanke-Henry 曆的一項優點。下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 世界上大多數地區使用的曆法（公曆）有 365 天。\n- 由於 365 天無法被 7（一週的天數）整除，每年同一個日期會落在星期中不同的一天。\n- 作為公曆替代方案而設計的 Hanke-Henry 永久曆有 364 天。\n- 由於 364 可以被 7 整除，每年同一個日期都會落在星期中的同一天，這有助於更可預測的時間安排。", "opts": {"A": "The Gregorian calendar has 365 days, which is one day longer than the Hanke-Henry permanent calendar.", "B": "Adopting the Hanke-Henry permanent calendar would help solve a problem with the Gregorian calendar.", "C": "Designed so calendar dates would occur on the same day of the week each year, the Hanke-Henry calendar supports more predictable scheduling than does the Gregorian calendar.", "D": "The Hanke-Henry permanent calendar was developed as an alternative to the Gregorian calendar, which is currently the most-used calendar in the world."}, "optsZh": {"A": "格里曆有 365 天，比 Hanke-Henry 永久曆多一天。", "B": "採用 Hanke-Henry 永久曆有助於解決格里曆（現行公曆）的一個問題。", "C": "Hanke-Henry 曆的設計使每年同一日期都落在一週中的同一天，因此比格里曆更能讓排程具可預測性。", "D": "Hanke-Henry 永久曆是作為格里曆的替代方案而開發的；格里曆是目前全世界使用最廣泛的曆法。"}, "answer": "C", "expl": "This choice states the advantage directly: dates on the same weekday each year allow more predictable scheduling than the Gregorian calendar.", "explZh": "此選項直接說明優點：日期每年都落在同一天，讓排程比格里曆更容易預測。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Student Notes: explain an advantage.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A proposed work calendar has 364 days; 364 divides evenly by 7; each date would fall on the same weekday every year; the current calendar shifts weekdays from year to year; the goal is to explain an advantage.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A proposed work calendar has 364 days; 364 divides evenly by 7; each date would fall on the same weekday every year; the current calendar shifts weekdays from year to year; the goal is to explain an advantage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。筆記：一份提議的工作曆有 364 天；364 可被 7 整除；每個日期每年都會落在同一個星期幾；目前的曆法每年星期幾會變動；目標是說明一項優點。", "opts": {"A": "Many countries use calendars to organize work and school.", "B": "The proposed calendar was designed as an alternative to the current system.", "C": "The current calendar contains more days than the proposed calendar.", "D": "Because its 364 days divide evenly by 7, the proposed calendar would make dates fall on the same weekday each year, making scheduling more predictable."}, "optsZh": {"A": "許多國家使用曆法來安排工作和上課。", "B": "提議中的曆法是設計來作為現行制度的替代方案。", "C": "現行曆法的天數比提議中的曆法多。", "D": "由於提議中曆法的 364 天可以被 7 整除，每年同一日期都會落在同一個星期幾，使排程更容易預測。"}, "answer": "D", "expl": "The answer explains the advantage.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Student Notes: explain an advantage.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\
