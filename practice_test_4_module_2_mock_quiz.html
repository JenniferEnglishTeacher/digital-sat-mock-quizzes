isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": "(15N),", "B": ", (15N),", "C": ", (15N)", "D": "(15N)"}, "optsZh": {"A": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）", "B": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）", "C": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）", "D": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）"}, "answer": "A", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English: preposition after themes.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls, with", "B": "walls with", "C": "walls so with", "D": "walls. With"}, "optsZh": {"A": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "B": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "C": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）", "D": "walls. With（句號分開兩個獨立子句：正確）"}, "answer": "D", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: restrictive relative clause.", "vocab": false, "body": "Both Sona Charaipotra, an Indian American, and Dhonielle Clayton, an African American, grew up <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=frustrated\" target=\"_blank\" rel=\"noopener\" data-w=\"frustrated\" data-pos=\"adj.\" data-en=\"annoyed because you cannot change or achieve something\" data-zh=\"沮喪的；受挫的\">frustrated<\/a> by the lack of diverse characters in books for young people. In 2011, these two writers joined forces to found CAKE Literary, a book packaging _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in the creation and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=promotion\" target=\"_blank\" rel=\"noopener\" data-w=\"promotion\" data-pos=\"n.\" data-en=\"activities that help make something known or popular\" data-zh=\"推廣；宣傳\">promotion<\/a> of stories told from diverse <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=perspective\" target=\"_blank\" rel=\"noopener\" data-w=\"perspective\" data-pos=\"n.\" data-en=\"a particular way of seeing or thinking about something\" data-zh=\"觀點；視角\">perspectives<\/a> for children and young adults.", "bodyPlain": "Both Sona Charaipotra, an Indian American, and Dhonielle Clayton, an African American, grew up frustrated by the lack of diverse characters in books for young people. In 2011, these two writers joined forces to found CAKE Literary, a book packaging _______ specializes in the creation and promotion of stories told from diverse perspectives for children and young adults.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "印度裔美國人 Sona Charaipotra 與非裔美國人 Dhonielle Clayton 從小都對青少年讀物中缺乏多元角色感到不滿。2011 年，這兩位作家攜手創立了 CAKE Literary，這是一家圖書企劃製作 _______ 專門為兒童與青少年創作並推廣從多元觀點講述的故事。", "opts": {"A": "company,", "B": "company that", "C": "company", "D": "company, that"}, "optsZh": {"A": "company,（逗號後接動詞 specializes → 缺少主詞，句子結構錯誤：錯誤）", "B": "company that（that 引導限定性關係子句，修飾 company：正確）", "C": "company（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）", "D": "company, that（限定性關係子句 that 前不可加逗號：錯誤）"}, "answer": "B", "expl": "'That specializes...' is a restrictive relative clause identifying the company; it needs 'that' (a subject for 'specializes') and no comma.", "explZh": "「that specializes...」是限定關係子句，用來說明是哪種公司；需要 that 作為 specializes 的主詞，且前面不加逗號。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: restrictive relative clause.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "story's of the immigrant families'", "B": "stories' of the immigrant family's", "C": "story's of the immigrant families", "D": "stories of the immigrant families"}, "optsZh": {"A": "story's of the immigrant families'（不當使用所有格撇號：錯誤）", "B": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）", "C": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）", "D": "stories of the immigrant families（複數名詞，不需所有格：正確）"}, "answer": "D", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English: restrictive relative clause.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of", "B": "of,", "C": "of-", "D": "of:"}, "optsZh": {"A": "of（介系詞後直接接受詞，不需標點：正確）", "B": "of,（介系詞與受詞之間不可加逗號：錯誤）", "C": "of-（介系詞與受詞之間不可加破折號：錯誤）", "D": "of:（介系詞後不可接冒號：錯誤）"}, "answer": "A", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English: restrictive relative clause.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization,", "B": "organization that", "C": "organization", "D": "organization, that"}, "optsZh": {"A": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）", "B": "organization that（that 引導限定性關係子句：正確）", "C": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）", "D": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）"}, "answer": "B", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English: restrictive relative clause.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": ", (15N)", "B": "(15N)", "C": ", (15N),", "D": "(15N),"}, "optsZh": {"A": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）", "B": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）", "C": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）", "D": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）"}, "answer": "D", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English: restrictive relative clause.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls with", "B": "walls, with", "C": "walls. With", "D": "walls so with"}, "optsZh": {"A": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "B": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "C": "walls. With（句號分開兩個獨立子句：正確）", "D": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）"}, "answer": "C", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English: isotope parenthetical punctuation.", "vocab": false, "body": "A study led by scientist Rebecca Kirby at the University of Wisconsin-Madison found that black bears that eat human food before <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hibernation\" target=\"_blank\" rel=\"noopener\" data-w=\"hibernation\" data-pos=\"n.\" data-en=\"a deep sleep some animals go into during winter\" data-zh=\"冬眠\">hibernation<\/a> have increased levels of a rare carbon <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=isotope\" target=\"_blank\" rel=\"noopener\" data-w=\"isotope\" data-pos=\"n.\" data-en=\"a form of an element with a different number of neutrons\" data-zh=\"同位素\">isotope<\/a>, _______ due to the higher 13C levels in corn and cane sugar. Bears with these <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elevated\" target=\"_blank\" rel=\"noopener\" data-w=\"elevated\" data-pos=\"adj.\" data-en=\"raised above the ground or above the normal level\" data-zh=\"高架的；升高的\">elevated<\/a> levels were also found to have much shorter hibernation periods on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=average\" target=\"_blank\" rel=\"noopener\" data-w=\"average\" data-pos=\"adj./n.\" data-en=\"the usual or typical amount; the result of adding numbers and dividing\" data-zh=\"平均的；平均數\">average<\/a>.", "bodyPlain": "A study led by scientist Rebecca Kirby at the University of Wisconsin-Madison found that black bears that eat human food before hibernation have increased levels of a rare carbon isotope, _______ due to the higher 13C levels in corn and cane sugar. Bears with these elevated levels were also found to have much shorter hibernation periods on average.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "由威斯康辛大學麥迪遜分校科學家 Rebecca Kirby 主導的一項研究發現，在冬眠前吃人類食物的黑熊，體內一種稀有碳同位素的含量會增加，_______ 原因在於玉米與蔗糖中的 13C 含量較高。研究也發現，這些含量較高的熊，平均冬眠期短了許多。", "opts": {"A": "carbon-13, (13C)", "B": "carbon-13 (13C)", "C": "carbon-13, (13C),", "D": "carbon-13 (13C),"}, "optsZh": {"A": "carbon-13, (13C)（逗號不當地把名稱與括號縮寫拆開，且缺少結束逗號：錯誤）", "B": "carbon-13 (13C)（同位語後缺少結束逗號：錯誤）", "C": "carbon-13, (13C),（逗號不當地把名稱與括號縮寫拆開：錯誤）", "D": "carbon-13 (13C),（同位語前後皆以逗號隔開：正確）"}, "answer": "D", "expl": "'(13C)' is a parenthetical inside the appositive phrase begun with a comma, so the phrase must be closed with a comma after the parentheses.", "explZh": "carbon-13 (13C) 是以逗號引出的同位語，括號緊跟名詞不加逗號，同位語結束後須再用逗號關閉。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English: isotope parenthetical punctuation.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "story's of the immigrant families", "B": "stories of the immigrant families", "C": "stories' of the immigrant family's", "D": "story's of the immigrant families'"}, "optsZh": {"A": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）", "B": "stories of the immigrant families（複數名詞，不需所有格：正確）", "C": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）", "D": "story's of the immigrant families'（不當使用所有格撇號：錯誤）"}, "answer": "B", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English: isotope parenthetical punctuation.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of:", "B": "of-", "C": "of,", "D": "of"}, "optsZh": {"A": "of:（介系詞後不可接冒號：錯誤）", "B": "of-（介系詞與受詞之間不可加破折號：錯誤）", "C": "of,（介系詞與受詞之間不可加逗號：錯誤）", "D": "of（介系詞後直接接受詞，不需標點：正確）"}, "answer": "D", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English: isotope parenthetical punctuation.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization,", "B": "organization, that", "C": "organization that", "D": "organization"}, "optsZh": {"A": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）", "B": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）", "C": "organization that（that 引導限定性關係子句：正確）", "D": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）"}, "answer": "C", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English: isotope parenthetical punctuation.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": "(15N),", "B": "(15N)", "C": ", (15N),", "D": ", (15N)"}, "optsZh": {"A": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）", "B": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）", "C": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）", "D": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）"}, "answer": "A", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English: isotope parenthetical punctuation.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls, with", "B": "walls with", "C": "walls. With", "D": "walls so with"}, "optsZh": {"A": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "B": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "C": "walls. With（句號分開兩個獨立子句：正確）", "D": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）"}, "answer": "C", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English: sentence boundary before with phrase.", "vocab": false, "body": "In 2010, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> Noel Hidalgo Tan was visiting the twelfth-century temple of Angkor Wat in Cambodia when he noticed markings of red paint on the temple _______ the help of digital <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">imaging<\/a> techniques, he discovered the markings to be part of an elaborate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mural\" target=\"_blank\" rel=\"noopener\" data-w=\"mural\" data-pos=\"n.\" data-en=\"a large painting done directly on a wall\" data-zh=\"壁畫\">mural<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contain\" target=\"_blank\" rel=\"noopener\" data-w=\"contain\" data-pos=\"v.\" data-en=\"to have or hold something inside\" data-zh=\"包含；容納\">containing<\/a> over 200 paintings.", "bodyPlain": "In 2010, archaeologist Noel Hidalgo Tan was visiting the twelfth-century temple of Angkor Wat in Cambodia when he noticed markings of red paint on the temple _______ the help of digital imaging techniques, he discovered the markings to be part of an elaborate mural containing over 200 paintings.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "2010 年，考古學家 Noel Hidalgo Tan 造訪柬埔寨建於十二世紀的吳哥窟時，注意到寺廟 _______ 上有紅色顏料的痕跡，在數位影像技術的協助下，他發現這些痕跡是一幅包含兩百多幅圖畫的精緻壁畫的一部分。", "opts": {"A": "walls, with", "B": "walls with", "C": "walls so with", "D": "walls. With"}, "optsZh": {"A": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "B": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "C": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）", "D": "walls. With（句號分開兩個獨立子句：正確）"}, "answer": "D", "expl": "'He noticed markings... on the temple walls' and 'With the help..., he discovered...' are two independent clauses, so a period is needed between them.", "explZh": "「he noticed markings… on the temple walls」與「With the help…, he discovered…」是兩個獨立子句，需要用句號分開。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English: sentence boundary before with phrase.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "story's of the immigrant families'", "B": "stories of the immigrant families", "C": "stories' of the immigrant family's", "D": "story's of the immigrant families"}, "optsZh": {"A": "story's of the immigrant families'（不當使用所有格撇號：錯誤）", "B": "stories of the immigrant families（複數名詞，不需所有格：正確）", "C": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）", "D": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）"}, "answer": "B", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English: sentence boundary before with phrase.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of-", "B": "of,", "C": "of", "D": "of:"}, "optsZh": {"A": "of-（介系詞與受詞之間不可加破折號：錯誤）", "B": "of,（介系詞與受詞之間不可加逗號：錯誤）", "C": "of（介系詞後直接接受詞，不需標點：正確）", "D": "of:（介系詞後不可接冒號：錯誤）"}, "answer": "C", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English: sentence boundary before with phrase.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization, that", "B": "organization", "C": "organization,", "D": "organization that"}, "optsZh": {"A": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）", "B": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）", "C": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）", "D": "organization that（that 引導限定性關係子句：正確）"}, "answer": "D", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English: sentence boundary before with phrase.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": ", (15N),", "B": "(15N)", "C": "(15N),", "D": ", (15N)"}, "optsZh": {"A": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）", "B": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）", "C": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）", "D": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）"}, "answer": "C", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English: sentence boundary before with phrase.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls. With", "B": "walls so with", "C": "walls, with", "D": "walls with"}, "optsZh": {"A": "walls. With（句號分開兩個獨立子句：正確）", "B": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）", "C": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "D": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）"}, "answer": "A", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Standard English: participial phrase.", "vocab": false, "body": "Working from an earlier discovery of Charpentier&#x27;s, chemists Emmanuelle Charpentier and Jennifer Doudna-winners of the 2020 Nobel Prize in Chemistry-re-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=created\" target=\"_blank\" rel=\"noopener\" data-w=\"created\" data-pos=\"v.\" data-en=\"made something new\" data-zh=\"創造；製作\">created<\/a> and then reprogrammed the so-called &quot;genetic scissors&quot; of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of DNA-cleaving bacteria _______ a tool that is revolutionizing the field of gene <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a>.", "bodyPlain": "Working from an earlier discovery of Charpentier's, chemists Emmanuelle Charpentier and Jennifer Doudna-winners of the 2020 Nobel Prize in Chemistry-re-created and then reprogrammed the so-called \"genetic scissors\" of a species of DNA-cleaving bacteria _______ a tool that is revolutionizing the field of gene technology.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "化學家 Emmanuelle Charpentier 與 Jennifer Doudna（2020 年諾貝爾化學獎得主）以 Charpentier 先前的一項發現為基礎，重新創造並重新編程了一種能切割 DNA 的細菌所具有的所謂「基因剪刀」_______ 一種正在徹底改變基因技術領域的工具。", "opts": {"A": "to forge", "B": "forging", "C": "forged", "D": "and forging"}, "optsZh": {"A": "to forge（不定詞，表目的「以打造出」：正確）", "B": "forging（現在分詞 → 無法清楚表達「為了打造」的目的：錯誤）", "C": "forged（過去式 → 與前面的動詞並列不合邏輯，且未表達目的：錯誤）", "D": "and forging（以 and 連接分詞 → 結構不平行、語意不通：錯誤）"}, "answer": "A", "expl": "The infinitive 'to forge' expresses the purpose of re-creating and reprogramming the genetic scissors: to make a revolutionary tool.", "explZh": "不定詞「to forge」表示重建並重新編程「基因剪刀」的目的——打造一項革命性的工具。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Standard English: participial phrase.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "stories' of the immigrant family's", "B": "stories of the immigrant families", "C": "story's of the immigrant families", "D": "story's of the immigrant families'"}, "optsZh": {"A": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）", "B": "stories of the immigrant families（複數名詞，不需所有格：正確）", "C": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）", "D": "story's of the immigrant families'（不當使用所有格撇號：錯誤）"}, "answer": "B", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Standard English: participial phrase.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of,", "B": "of:", "C": "of", "D": "of-"}, "optsZh": {"A": "of,（介系詞與受詞之間不可加逗號：錯誤）", "B": "of:（介系詞後不可接冒號：錯誤）", "C": "of（介系詞後直接接受詞，不需標點：正確）", "D": "of-（介系詞與受詞之間不可加破折號：錯誤）"}, "answer": "C", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Standard English: participial phrase.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization that", "B": "organization", "C": "organization, that", "D": "organization,"}, "optsZh": {"A": "organization that（that 引導限定性關係子句：正確）", "B": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）", "C": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）", "D": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）"}, "answer": "A", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Standard English: participial phrase.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": "(15N),", "B": ", (15N)", "C": "(15N)", "D": ", (15N),"}, "optsZh": {"A": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）", "B": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）", "C": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）", "D": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）"}, "answer": "A", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: participial phrase.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls, with", "B": "walls with", "C": "walls so with", "D": "walls. With"}, "optsZh": {"A": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "B": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "C": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）", "D": "walls. With（句號分開兩個獨立子句：正確）"}, "answer": "D", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: logical subject after introductory modifier.", "vocab": false, "body": "In 2016, engineer Vanessa Galvez oversaw the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a> of 164 bioswales, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetated\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetated\" data-pos=\"adj.\" data-en=\"covered with plants\" data-zh=\"長滿植物的\">vegetated<\/a> channels designed to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=absorb\" target=\"_blank\" rel=\"noopener\" data-w=\"absorb\" data-pos=\"v.\" data-en=\"to take in a substance\" data-zh=\"吸收\">absorb<\/a> and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=divert\" target=\"_blank\" rel=\"noopener\" data-w=\"divert\" data-pos=\"v.\" data-en=\"to change the direction of something\" data-zh=\"使轉向；轉移\">divert<\/a> stormwater, along the streets of Queens, New York. By reducing the runoff flowing into city sewers, _______", "bodyPlain": "In 2016, engineer Vanessa Galvez oversaw the installation of 164 bioswales, vegetated channels designed to absorb and divert stormwater, along the streets of Queens, New York. By reducing the runoff flowing into city sewers, _______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "2016 年，工程師 Vanessa Galvez 監督在紐約皇后區的街道沿線設置了 164 條生態草溝——一種用來吸收並導引雨水的植栽溝渠。藉由減少流入城市下水道的逕流，_______", "opts": {"A": "the mitigation of both street flooding and the resulting pollution of nearby waterways has been achieved by bioswales.", "B": "the bioswales have mitigated both street flooding and the resulting pollution of nearby waterways.", "C": "the bioswales' mitigation of both street floo
