ns of Standard English?\n\nA) organization that\nB) organization\nC) organization, that\nD) organization,", "answer": "A", "explanation": "A restrictive relative clause beginning with 'that' identifies the organization."}, {"id": "24.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) (15N),\nB) , (15N)\nC) (15N)\nD) , (15N),", "answer": "A", "explanation": "The parenthetical isotope notation is followed by a comma before the participial phrase."}, {"id": "24.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) walls, with\nB) walls with\nC) walls so with\nD) walls. With", "answer": "D", "explanation": "A period correctly separates two complete sentences."}]}, {"n": 25, "concept": "Standard English: logical subject after introductory modifier.", "original": "In 2016, engineer Vanessa Galvez oversaw the installation of 164 bioswales, vegetated channels designed to absorb and divert stormwater, along the streets of Queens, New York. By reducing the runoff flowing into city sewers, _______\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) the mitigation of both street flooding and the resulting pollution of nearby waterways has been achieved by bioswales.\nB) the bioswales have mitigated both street flooding and the resulting pollution of nearby waterways.\nC) the bioswales' mitigation of both street flooding and the resulting pollution of nearby waterways has been achieved.\nD) both street flooding and the resulting pollution of nearby waterways have been mitigated by bioswales.", "generated": [{"id": "25.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) stories of the immigrant families\nB) story's of the immigrant families\nC) stories' of the immigrant family's\nD) story's of the immigrant families'", "answer": "A", "explanation": "The plural noun 'stories' is needed; no possessive is required."}, {"id": "25.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) of:\nB) of\nC) of,\nD) of-", "answer": "B", "explanation": "The preposition 'of' should not be followed by punctuation here."}, {"id": "25.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) organization, that\nB) organization\nC) organization that\nD) organization,", "answer": "C", "explanation": "A restrictive relative clause beginning with 'that' identifies the organization."}, {"id": "25.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) , (15N)\nB) (15N)\nC) (15N),\nD) , (15N),", "answer": "C", "explanation": "The parenthetical isotope notation is followed by a comma before the participial phrase."}, {"id": "25.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) walls so with\nB) walls, with\nC) walls with\nD) walls. With", "answer": "D", "explanation": "A period correctly separates two complete sentences."}]}, {"n": 26, "concept": "Standard English: colon introducing explanation.", "original": "A study published by Rice University geoscientist Ming Tang in 2019 offers a new explanation for the origin of Earth's _______ structures called arcs, towering ridges that form when a dense oceanic plate subducts under a less dense continental plate, melts in the mantle below, and then rises and bursts through the continental crust above.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) continents geological\nB) continents: geological\nC) continents; geological\nD) continents. Geological", "generated": [{"id": "26.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) story's of the immigrant families'\nB) story's of the immigrant families\nC) stories of the immigrant families\nD) stories' of the immigrant family's", "answer": "C", "explanation": "The plural noun 'stories' is needed; no possessive is required."}, {"id": "26.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) of,\nB) of\nC) of-\nD) of:", "answer": "B", "explanation": "The preposition 'of' should not be followed by punctuation here."}, {"id": "26.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) organization that\nB) organization\nC) organization, that\nD) organization,", "answer": "A", "explanation": "A restrictive relative clause beginning with 'that' identifies the organization."}, {"id": "26.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) (15N)\nB) , (15N)\nC) (15N),\nD) , (15N),", "answer": "C", "explanation": "The parenthetical isotope notation is followed by a comma before the participial phrase."}, {"id": "26.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) walls, with\nB) walls so with\nC) walls with\nD) walls. With", "answer": "D", "explanation": "A period correctly separates two complete sentences."}]}, {"n": 27, "concept": "Transitions: afterward in response to prior event.", "original": "During a 2021 launch, Rocket Labs' Electron rocket experienced an unexpected failure: its second-stage booster shut down suddenly after ignition. _______ instead of downplaying the incident, Rocket Labs' CEO publicly acknowledged what happened and apologized for the loss of the rocket's payload, which had consisted of two satellites.\n\nWhich choice completes the text with the most logical transition?\nA) Afterward,\nB) Additionally,\nC) Indeed,\nD) Similarly,", "generated": [{"id": "27.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The spacecraft lost contact with mission control during its descent. ______ the agency released a detailed explanation of the failure and outlined changes for the next attempt.\n\nWhich choice completes the text with the most logical transition?\n\nA) Additionally,\nB) Similarly,\nC) Afterward,\nD) Indeed,", "answer": "C", "explanation": "Afterward indicates what happened after the event."}, {"id": "27.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The bridge inspection revealed unexpected cracks in two support beams. ______ city engineers closed one lane and announced emergency repairs.\n\nWhich choice completes the text with the most logical transition?\n\nA) Subsequently,\nB) Moreover,\nC) Likewise,\nD) For example,", "answer": "A", "explanation": "Subsequently means afterward."}, {"id": "27.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The museum discovered that several labels contained incorrect dates. ______ the curators replaced the labels and published a note explaining the corrections.\n\nWhich choice completes the text with the most logical transition?\n\nA) Indeed,\nB) Later,\nC) Additionally,\nD) Similarly,", "answer": "B", "explanation": "Later introduces the response that followed."}, {"id": "27.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The trial showed that the drug caused serious side effects in a small group of patients. ______ the company paused enrollment and notified regulators.\n\nWhich choice completes the text with the most logical transition?\n\nA) Additionally,\nB) Afterward,\nC) For instance,\nD) Similarly,", "answer": "B", "explanation": "Afterward marks the next action in time."}, {"id": "27.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The orchestra's outdoor concert was interrupted by a sudden storm. ______ the conductor apologized to ticket holders and announced a replacement performance.\n\nWhich choice completes the text with the most logical transition?\n\nA) Moreover,\nB) Similarly,\nC) Indeed,\nD) Afterward,", "answer": "D", "explanation": "Afterward introduces what happened following the storm."}]}, {"n": 28, "concept": "Transitions: alternative method.", "original": "When soil becomes contaminated by toxic metals, it can be removed from the ground and disposed of in a landfill. _______ contaminated soil can be detoxified via phytoremediation: plants that can withstand high concentrations of metals absorb the pollutants and store them in their shoots, which are then cut off and safely disposed of, preserving the health of the plants.\n\nWhich choice completes the text with the most logical transition?\nA) Alternatively,\nB) Specifically,\nC) For example,\nD) As a result,", "generated": [{"id": "28.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Damaged manuscripts can sometimes be stored without further treatment in climate-controlled cases. ______ conservators may repair torn pages with thin Japanese paper and reversible adhesives.\n\nWhich choice completes the text with the most logical transition?\n\nA) Specifically,\nB) For example,\nC) As a result,\nD) Alternatively,", "answer": "D", "explanation": "Alternatively presents another possible method."}, {"id": "28.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A city can reduce traffic by widening major roads. ______ it can invest in buses and trains so fewer residents need to drive.\n\nWhich choice completes the text with the most logical transition?\n\nA) For example,\nB) Alternatively,\nC) Therefore,\nD) Specifically,", "answer": "B", "explanation": "Alternatively introduces a different solution."}, {"id": "28.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Old wells may be sealed and abandoned. ______ they can be restored with modern pumps when communities need additional water sources.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) As a result,\nC) Instead,\nD) For instance,", "answer": "C", "explanation": "Instead presents an alternative action."}, {"id": "28.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Invasive plants can be removed by hand. ______ land managers can introduce grazing animals that eat the plants before they spread seeds.\n\nWhich choice completes the text with the most logical transition?\n\nA) Indeed,\nB) Alternatively,\nC) Consequently,\nD) Specifically,", "answer": "B", "explanation": "Alternatively introduces another method."}, {"id": "28.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers can analyze pollen grains under a microscope. ______ they can study environmental DNA preserved in the same sediment layers.\n\nWhich choice completes the text with the most logical transition?\n\nA) Alternatively,\nB) As a result,\nC) For example,\nD) Indeed,", "answer": "A", "explanation": "Alternatively presents a second approach."}]}, {"n": 29, "concept": "Student Notes: explain an advantage.", "original": "While researching a topic, a student has taken the following notes:\n- The calendar used by most of the world (the Gregorian calendar) has 365 days.\n- Because 365 days can't be divided evenly by 7 (the number of days in a week), calendar dates fall on a different day of the week each year.\n- The Hanke-Henry permanent calendar, developed as an alternative to the Gregorian calendar, has 364 days.\n- Because 364 can be divided evenly by 7, calendar dates fall on the same day of the week each year, which supports more predictable scheduling.\n\nThe student wants to explain an advantage of the Hanke-Henry calendar. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) The Gregorian calendar has 365 days, which is one day longer than the Hanke-Henry permanent calendar.\nB) Adopting the Hanke-Henry permanent calendar would help solve a problem with the Gregorian calendar.\nC) Designed so calendar dates would occur on the same day of the week each year, the Hanke-Henry calendar supports more predictable scheduling than does the Gregorian calendar.\nD) The Hanke-Henry permanent calendar was developed as an alternative to the Gregorian calendar, which is currently the most-used calendar in the world.", "generated": [{"id": "29.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A proposed work calendar has 364 days; 364 divides evenly by 7; each date would fall on the same weekday every year; the current calendar shifts weekdays from year to year; the goal is to explain an advantage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Many countries use calendars to organize work and school.\nB) The proposed calendar was designed as an alternative to the current system.\nC) The current calendar contains more days than the proposed calendar.\nD) Because its 364 days divide evenly by 7, the proposed calendar would make dates fall on the same weekday each year, making scheduling more predictable.", "answer": "D", "explanation": "The answer explains the advantage."}, {"id": "29.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A school timetable has 40-minute periods; the new timetable has five equal periods per day; equal periods simplify room assignments; the old timetable has uneven period lengths; the goal is to explain an advantage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The new timetable's five equal periods would simplify room assignments, unlike the old timetable with uneven period lengths.\nB) The old timetable uses several period lengths.\nC) The new timetable has 40-minute periods.\nD) Schools use timetables to organize classes.", "answer": "A", "explanation": "The answer states the advantage clearly."}, {"id": "29.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A transit pass can be used on buses, trains, and ferries; separate tickets are currently required; one pass would reduce confusion for riders; the goal is to explain an advantage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Separate tickets are currently required for several forms of transit.\nB) Because one pass could be used on buses, trains, and ferries, it would reduce confusion for riders.\nC) A transit pass can be purchased by commuters.\nD) Ferries are part of the regional transit system.", "answer": "B", "explanation": "The answer explains the advantage."}, {"id": "29.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A library app sends due-date reminders; overdue books currently result in fines; reminders help patrons return books on time; the goal is to explain an advantage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Overdue books may result in fines.\nB) Libraries lend books to patrons.\nC) By reminding patrons of due dates, the app can help them return books on time and avoid fines.\nD) The library app sends electronic reminders.", "answer": "C", "explanation": "The answer explains the benefit."}, {"id": "29.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A reusable container program replaces disposable lunch boxes; reusable containers reduce daily waste; students return the containers after lunch; the goal is to explain an advantage.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Students eat lunch at school.\nB) By replacing disposable lunch boxes with containers that students return after lunch, the program can reduce daily waste.\nC) Disposable lunch boxes are used only once.\nD) The program requires students to return containers.", "answer": "B", "explanation": "The answer explains the advantage."}]}, {"n": 30, "concept": "Student Notes: present theory to unfamiliar audience.", "original": "While researching a topic, a student has taken the following notes:\n- The Haudenosaunee Confederacy is a nearly 1,000-year-old alliance of six Native nations in the northeastern US.\n- The members are bound by a centuries-old agreement known as the Great Law of Peace.\n- Historian Bruce Johansen is one of several scholars who believe that the principles of the Great Law of Peace influenced the US Constitution.\n- This theory is called the influence theory.\n- Johansen cites the fact that Benjamin Franklin and Thomas Jefferson both studied the Haudenosaunee Confederacy.\n\nThe student wants to present the influence theory to an audience unfamiliar with the Haudenosaunee Confederacy. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Historian Bruce Johansen believes that the Great Law of Peace was very influential.\nB) The influence theory is supported by the fact that Benjamin Franklin and Thomas Jefferson both studied the Haudenosaunee Confederacy.\nC) The influence theory holds that the principles of the Great Law of Peace, a centuries-old agreement binding six Native nations in the northeastern US, influenced the US Constitution.\nD) Native people, including the members of the Haudenosaunee Confederacy, influenced the founding of the US in many different ways.", "generated": [{"id": "30.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The River Council is a 700-year-old alliance of five towns; the towns are bound by the Water Charter; historian Mei Alvarez argues that the Water Charter influenced later regional law; the audience is unfamiliar with the alliance; the goal is to present the theory.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Many alliances influenced regional government.\nB) The theory holds that the Water Charter, a centuries-old agreement binding five towns in the River Council, influenced later regional law.\nC) Mei Alvarez believes that the Water Charter was influential.\nD) The theory is supported by the fact that later lawmakers studied the River Council.", "answer": "B", "explanation": "The answer gives necessary context and states the theory."}, {"id": "30.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The Mountain League united seven villages; its Pact of Roads governed shared trade routes; scholar Ilya Chen argues that the pact shaped the first provincial constitution; the audience is unfamiliar with the league; the goal is to present the theory.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The Mountain League lasted for centuries.\nB) According to Ilya Chen, the Pact of Roads of the Mountain League, an alliance of seven villages, shaped the first provincial constitution.\nC) Trade routes connected many mountain villages.\nD) The Pact of Roads was important.", "answer": "B", "explanation": "The answer introduces the group and theory."}, {"id": "30.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The Coastal Assembly linked four island communities; its Council Code described shared decision-making; some scholars argue that the code influenced the republic's senate; the audience is unfamiliar with the assembly; the goal is to present the theory.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Island communities often formed alliances.\nB) The republic's senate had many influences.\nC) The Council Code described shared decision-making.\nD) The Coastal Assembly linked four island communities through a Council Code that some scholars believe influenced the republic's senate.", "answer": "D", "explanation": "The answer gives context and presents the theory."}, {"id": "30.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The Forest Compact joined six clans; its Peace Articles required collective deliberation; historian Sara Nordin argues that the Peace Articles influenced later parliamentary rules; the audience is unfamiliar with the compact; the goal is to present the theory.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Historian Sara Nordin argues that the Peace Articles of the Forest Compact, a six-clan alliance, influenced later parliamentary rules.\nB) Parliamentary rules changed over time.\nC) The Forest Compact joined six clans.\nD) Sara Nordin is a historian.", "answer": "A", "explanation": "The answer presents the theory with context."}, {"id": "30.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The Lakes Confederation is an old alliance of three communities; its Charter of Oars created rules for shared waterways; scholar Dana Morel argues that these rules influenced modern water law; the audience is unfamiliar with the confederation; the goal is to present the theory.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Modern water law concerns rivers and lakes.\nB) Dana Morel studies old alliances.\nC) The Lakes Confederation was an alliance of three communities whose Charter of Oars, according to Dana Morel, influenced modern water law.\nD) The Charter of Oars created rules.", "answer": "C", "explanation": "The answer explains the group and theory."}]}, {"n": 31, "concept": "Student Notes: emphasize relative heat.", "original": "While researching a topic, a student has taken the following notes:\n- In 1999, astronomer Todd Henry studied the differences in surface temperature between the Sun and nearby stars.\n- His team mapped all stars within 10 parsecs of the Sun.\n- The surface temperature of the Sun is around 9,800°F, which classifies it as a G star.\n- 327 of the 357 stars in the study were classified as K or M stars, with surface temperatures under 8,900°F (cooler than the Sun).\n- 11 of the 357 stars in the study were classified as A or F stars, with surface temperatures greater than 10,300°F (hotter than the Sun).\n\nThe student wants to emphasize how hot the Sun is relative to nearby stars. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) At around 9,800°F, which classifies it as a G star, the Sun is hotter than most but not all of the stars within 10 parsecs of it.\nB) Astronomer Todd Henry determined that the Sun, at around 9,800°F, is a G star, and several other stars within a 10-parsec range are A or F stars.\nC) Of the 357 stars within ten parsecs of the Sun, 327 are classified as K or M stars, with surface temperatures under 8,900°F.\nD) While most of the stars within 10 parsecs of the Sun are classified as K, M, A, or F stars, the Sun is classified as a G star due to its surface temperature of 9,800°F.", "generated": [{"id": "31.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Astronomers measured 400 nearby stars; Star A has a surface temperature of 10,000°F; 360 stars are cooler than 9,200°F; 20 stars are hotter than 10,500°F; the goal is to emphasize how hot Star A is relative to nearby stars.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Astronomers measured 400 nearby stars.\nB) At 10,000°F, Star A is hotter than most, though not all, of the nearby stars measured.\nC) Star temperatures can be used to classify stars.\nD) Some nearby stars are hotter than Star A.", "answer": "B", "explanation": "The answer states the relative comparison."}, {"id": "31.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lake's summer temperature is 72°F; 18 of 20 nearby lakes are cooler; 2 nearby lakes are warmer; the goal is to emphasize how warm the lake is relative to others.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The lake is 72°F in summer.\nB) Two nearby lakes are warmer.\nC) Because 18 of 20 nearby lakes are cooler, the lake is warmer than most but not all nearby lakes.\nD) Nearby lakes vary in temperature.", "answer": "C", "explanation": "The answer emphasizes the relative warmth."}, {"id": "31.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A marathon runner's time was 2:12; 80 of 90 runners finished more slowly; 5 finished faster; the goal is to emphasize how fast the runner was relative to competitors.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The race included 90 runners.\nB) Many runners compete in marathons.\nC) Five runners finished faster.\nD) The runner finished in 2:12, faster than most but not all of the competitors.", "answer": "D", "explanation": "The answer gives the relative ranking."}, {"id": "31.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A mountain is 4,100 meters high; 30 of 35 mountains in the range are lower; 4 are higher; the goal is to emphasize its height relative to nearby mountains.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) At 4,100 meters, the mountain is higher than most but not all mountains in the range.\nB) Four mountains in the range are higher.\nC) The mountain is in a range with 35 mountains.\nD) Several mountains are over 4,000 meters high.", "answer": "A", "explanation": "The answer emphasizes relative height."}, {"id": "31.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A city's median income is $54,000; 45 of 50 nearby cities have lower median incomes; 5 have higher median incomes; the goal is to emphasize relative income.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Five nearby cities have higher median incomes.\nB) Median income is one way to compare cities.\nC) With a median income of $54,000, the city has a higher median income than most nearby cities, though five are higher.\nD) Nearby cities have different median incomes.", "answer": "C", "explanation": "The answer directly makes the comparison."}]}, {"n": 32, "concept": "Student Notes: introduce a book to familiar audience.", "original": "While researching a topic, a student has taken the following notes:\n- The Atlantic Monthly magazine was first published in 1857.\n- The magazine focused on politics, art, and literature.\n- In 2019, historian Cathryn Halverson published the book Faraway Women and the \"Atlantic Monthly.\"\n- Its subject is female authors whose autobiographies appeared in the magazine in the early 1900s.\n- One of the authors discussed is Juanita Harrison.\n\nThe student wants to introduce Cathryn Halverson's book to an audience already familiar with the Atlantic Monthly. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Cathryn Halverson's Faraway Women and the \"Atlantic Monthly\" discusses female authors whose autobiographies appeared in the magazine in the early 1900s.\nB) A magazine called the Atlantic Monthly, referred to in Cathryn Halverson's book title, was first published in 1857.\nC) Faraway Women and the \"Atlantic Monthly\" features contributors to the Atlantic Monthly, first published in 1857 as a magazine focusing on politics, art, and literature.\nD) An author discussed by Cathryn Halverson is Juanita Harrison, whose autobiography appeared in the Atlantic Monthly in the early 1900s.", "generated": [{"id": "32.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A journal began in 1890; readers already know the journal; Dr. Lin published a book in 2021 about immigrant poets whose essays appeared in the journal; one poet is Marta Silva; the goal is to introduce the book to a familiar audience.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The journal published politics, art, and literature.\nB) The journal began in 1890.\nC) Marta Silva was an immigrant poet.\nD) Dr. Lin's 2021 book examines immigrant poets whose essays appeared in the journal in the early twentieth century.", "answer": "D", "explanation": "The answer omits unnecessary background for a familiar audience."}, {"id": "32.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The Harbor Review is familiar to the audience; historian Joel Kim wrote a book about women photographers whose travel writing appeared in the magazine; the book was published in 2020; the goal is to introduce the book.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Travel writing can appear in magazines.\nB) Joel Kim's 2020 book focuses on women photographers whose travel writing appeared in the Harbor Review.\nC) The Harbor Review was first published many years ago.\nD) The Harbor Review is a magazine.", "answer": "B", "explanation": "The answer introduces the book directly."}, {"id": "32.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The audience knows the museum; curator Ana Ruiz published a catalog about textile artists whose work was shown there in the 1970s; one artist is Laila Noor; the goal is to introduce the catalog.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Ana Ruiz's catalog discusses textile artists whose work appeared at the museum in the 1970s.\nB) The museum is familiar to the audience.\nC) Textile art was exhibited in many places.\nD) Laila Noor is mentioned in the catalog.", "answer": "A", "explanation": "The answer focuses on the catalog subject."}, {"id": "32.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Readers know the newspaper City Ledger; a historian wrote a book about labor organizers whose columns appeared in the newspaper; the book was published in 2018; the goal is to introduce the book.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The newspaper printed columns.\nB) The City Ledger was a newspaper.\nC) The 2018 book examines labor organizers whose columns appeared in the City Ledger.\nD) A historian published a book in 2018.", "answer": "C", "explanation": "The answer introduces the book to people already familiar with the paper."}, {"id": "32.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The audience knows the radio program Night Forum; scholar Dana Bell wrote a book about scientists interviewed on the program in the 1950s; the goal is to introduce the book.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Night Forum was a radio program.\nB) Scientists can be interviewed on radio.\nC) The 1950s were important for broadcasting.\nD) Dana Bell's book discusses scientists who were interviewed on Night Forum in the 1950s.", "answer": "D", "explanation": "The answer introduces the book without redundant background."}]}, {"n": 33, "concept": "Student Notes: emphasize a similarity.", "original": "While researching a topic, a student has taken the following notes:\n- The magnificent frigatebird is a species of seabird that feeds mainly on fish, tuna, squid, and other small sea animals.\n- It is unusual among seabirds in that it doesn't dive into the water for prey.\n- One way it acquires food is by using its hook-tipped bill to snatch prey from the surface of the water.\n- Another way it acquires food is by taking it from weaker birds by force.\n- This behavior is known as kleptoparasitism.\n\nThe student wants to emphasize a similarity between the two ways a magnificent frigatebird acquires food. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) A magnificent frigatebird never dives into the water, instead using its hook-tipped bill to snatch prey from the surface.\nB) Neither of a magnificent frigatebird's two ways of acquiring food requires the bird to dive into the water.\nC) Of the magnificent frigatebird's two ways of acquiring food, only one is known as kleptoparasitism.\nD) In addition to snatching prey from the water with its hook-tipped bill, a magnificent frigatebird takes food from other birds by force.", "generated": [{"id": "33.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A seabird catches fish from the water's surface; it also steals fish from other birds; it does not dive underwater in either case; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The bird feeds mainly on small sea animals.\nB) Only one method involves stealing from other birds.\nC) Neither method requires the bird to dive underwater.\nD) The bird can catch fish in more than one way.", "answer": "C", "explanation": "The answer states the shared feature."}, {"id": "33.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A desert fox eats insects it digs from sand; it also eats fruit that has fallen from shrubs; both methods require foraging at night; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Both ways the desert fox gets food involve nighttime foraging.\nB) The fox digs insects from sand.\nC) Fruit can fall from shrubs.\nD) The fox eats insects and fruit.", "answer": "A", "explanation": "The answer emphasizes the similarity."}, {"id": "33.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A heron catches fish in shallow water; it also catches frogs near reeds; both methods involve standing still before striking quickly; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Shallow water contains fish.\nB) Reeds grow near water.\nC) Both feeding methods involve standing still before a quick strike.\nD) Herons eat fish and frogs.", "answer": "C", "explanation": "The answer states the shared behavior."}, {"id": "33.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A monkey cracks nuts with stones; it also opens shellfish with stones; both methods involve using tools to access protected food; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Only one method involves nuts.\nB) Both food-gathering methods involve using tools to open protected food.\nC) Stones can be used as tools.\nD) The monkey eats nuts and shellfish.", "answer": "B", "explanation": "The answer emphasizes the shared tool use."}, {"id": "33.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A gull skims insects from a lake surface; it also snatches floating scraps near fishing boats; neither method requires diving; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The gull sometimes feeds near boats.\nB) Some gulls eat insects.\nC) Fishing boats can leave scraps.\nD) Neither way of acquiring food requires the gull to dive below the surface.", "answer": "D", "explanation": "The answer states the shared feature."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
</body>
</html>
