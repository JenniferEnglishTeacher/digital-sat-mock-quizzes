"要求醫院公布每位病患的病歷。", "B": "減少醫院能夠研究的疾病數量。", "C": "使人難以判斷醫院因病患資料被使用而獲得的補償是否公平。", "D": "阻止公司從成功的藥物中獲利。"}, "answer": "C", "expl": "The issue is the inability of outside observers to evaluate fairness.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Logical Completion: history plays may be less engaging.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。新的檔案法要求博物館在展出文化物件之前先諮詢後裔社群，但允許博物館將諮詢協議密封不公開。一些社群領袖擔心這項條款可能會 ______", "opts": {"A": "force museums to return every object in their collections.", "B": "obscure whether communities actually have meaningful influence over display decisions.", "C": "prevent curators from learning about the objects' cultural meanings.", "D": "discourage museums from preserving fragile objects."}, "optsZh": {"A": "迫使博物館歸還館藏中的每一件物品。", "B": "使人無法看清社區是否對展示決策真正具有實質影響力。", "C": "使策展人無法了解這些物品的文化意義。", "D": "阻止博物館保存易損的物品。"}, "answer": "B", "expl": "Sealed agreements make accountability difficult.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Logical Completion: history plays may be less engaging.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一項漁業條約要求企業在使用傳統生態知識時，須對沿海村莊給予補償，但該條約允許付款合約保持不公開。批評者認為，這項保密規定可能會 ______", "opts": {"A": "reduce villages' knowledge of marine species.", "B": "make it impossible for independent observers to judge whether compensation is equitable.", "C": "increase the number of fish caught by local crews.", "D": "stop companies from conducting ecological research."}, "optsZh": {"A": "減少村民對海洋物種的了解。", "B": "使獨立觀察者無法判斷補償是否公平。", "C": "增加當地船員捕獲的魚量。", "D": "阻止公司進行生態研究。"}, "answer": "B", "expl": "Private contracts prevent independent assessment of equity.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Logical Completion: history plays may be less engaging.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A university policy requires <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> companies to compensate Indigenous language speakers when their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一項大學政策要求科技公司在使用原住民語言使用者的錄音來訓練語音辨識系統時，須給予他們補償，但允許合約保密。倡議者警告，這項政策可能會 ______", "opts": {"A": "increase the cost of recording equipment.", "B": "require speakers to learn programming skills.", "C": "discourage researchers from documenting endangered languages.", "D": "prevent outsiders from verifying whether speakers are paid fairly."}, "optsZh": {"A": "提高錄音設備的成本。", "B": "要求說話者學習程式設計技能。", "C": "使研究人員不願記錄瀕危語言。", "D": "使外界無法核實說話者是否獲得公平報酬。"}, "answer": "D", "expl": "The concern is lack of transparent verification.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: migration supported by genetic evidence.", "vocab": false, "body": "Ancestral Puebloans, the civilization from which present-day Pueblo tribes descended, emerged as early as 1500 B.C.E. in an area of what is now the southwestern United States and dispersed suddenly in the late 1200s C.E., abandoning <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establish\" target=\"_blank\" rel=\"noopener\" data-w=\"establish\" data-pos=\"v.\" data-en=\"to create or set up something\" data-zh=\"建立\">established<\/a> villages with systems for farming crops and turkeys. Recent analysis comparing turkey remains at Mesa Verde, one such village in southern Colorado, to samples from modern turkey <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> in the Rio Grande Valley of north central New Mexico <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that the latter birds descended in part from turkeys cultivated at Mesa Verde, with shared genetic markers appearing only after 1280. Thus, researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that _______", "bodyPlain": "Ancestral Puebloans, the civilization from which present-day Pueblo tribes descended, emerged as early as 1500 B.C.E. in an area of what is now the southwestern United States and dispersed suddenly in the late 1200s C.E., abandoning established villages with systems for farming crops and turkeys. Recent analysis comparing turkey remains at Mesa Verde, one such village in southern Colorado, to samples from modern turkey populations in the Rio Grande Valley of north central New Mexico determined that the latter birds descended in part from turkeys cultivated at Mesa Verde, with shared genetic markers appearing only after 1280. Thus, researchers concluded that _______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "古普韋布洛人（Ancestral Puebloans）是現今普韋布洛部落的祖先文明，早在西元前 1500 年就出現於現今美國西南部的一個地區，並在西元 1200 年代末突然散居各地，捨棄了已建立、具備種植作物與飼養火雞系統的村落。近期一項分析將科羅拉多州南部這類村落之一 Mesa Verde 的火雞遺骸，與新墨西哥州中北部 Rio Grande Valley 現代火雞族群的樣本進行比較，確定後者部分源自 Mesa Verde 飼養的火雞，而且共有的遺傳標記只在 1280 年之後才出現。因此，研究人員得出結論：_______", "opts": {"A": "conditions of the terrains in the Rio Grande Valley and Mesa Verde had greater similarities in the past than they do today.", "B": "some Ancestral Puebloans migrated to the Rio Grande Valley in the late 1200s and carried farming practices with them.", "C": "Indigenous peoples living in the Rio Grande Valley primarily planted crops and did not cultivate turkeys before 1280.", "D": "the Ancestral Puebloans of Mesa Verde likely adopted the farming practices of Indigenous peoples living in other regions."}, "optsZh": {"A": "Rio Grande 河谷與 Mesa Verde 的地形條件在過去比現在更為相似。", "B": "有些 Ancestral Puebloans（古普韋布洛人）在 1200 年代後期遷移到 Rio Grande 河谷，並把他們的耕作方式帶了過去。", "C": "居住在 Rio Grande 河谷的原住民在 1280 年以前主要種植作物，並未飼養火雞。", "D": "Mesa Verde 的 Ancestral Puebloans 很可能採用了其他地區原住民的耕作方式。"}, "answer": "B", "expl": "Rio Grande turkeys descend partly from Mesa Verde turkeys, with shared markers appearing only after 1280, so Puebloans likely migrated there in the late 1200s bringing turkey farming.", "explZh": "Rio Grande 河谷的火雞部分源自 Mesa Verde 的火雞，且共同的基因標記在 1280 年後才出現，可推論部分祖先普韋布洛人在 1200 年代末遷徙過去並帶來農牧方法。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: migration supported by genetic evidence.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。某種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任何一座島嶼的數千年前就已與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "the plant probably reached the islands without human assistance.", "B": "the island populations were domesticated before mainland populations.", "C": "human traders must have transported the seeds recently.", "D": "all island plants descended from a single cultivated variety."}, "optsZh": {"A": "這種植物大概是在沒有人類協助的情況下抵達這些島嶼的。", "B": "島上族群比大陸族群更早被馴化。", "C": "人類商人一定是在最近才運送了這些種子。", "D": "所有島上的植物都源自同一個栽培品種。"}, "answer": "A", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: migration supported by genetic evidence.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。某種甲蟲同時出現在大陸海岸與一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前就已與海岸族群分離，因此研究團隊推論 ______", "opts": {"A": "the beetles were likely introduced by natural dispersal rather than by humans.", "B": "the beetles were domesticated by island communities.", "C": "humans carried the beetles to the island during early trade voyages.", "D": "the island beetles must be younger than the coastal beetles."}, "optsZh": {"A": "這些甲蟲很可能是經由自然擴散而非人類引進的。", "B": "這些甲蟲是被島嶼社群馴化的。", "C": "人類在早期的貿易航行中把甲蟲帶到了島上。", "D": "島上的甲蟲一定比沿海的甲蟲年輕。"}, "answer": "A", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: migration supported by genetic evidence.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。語言學家曾經提出，某首儀式歌曲是透過近期的遷徙傳到一個群島，但比較相關的口述傳統後發現，這首歌的核心詞句在遷徙發生之前就已形成。因此，語言學家得出結論：______", "opts": {"A": "the migration must have begun earlier than any other human movement.", "B": "the song could not have changed after the migration.", "C": "all versions of the song are identical.", "D": "the song was probably not introduced to the archipelago by that migration."}, "optsZh": {"A": "這次遷徙一定比任何其他人類遷移都早開始。", "B": "這首歌在遷徙之後不可能有所改變。", "C": "這首歌的所有版本都完全相同。", "D": "這首歌大概不是經由那次遷徙傳入該群島的。"}, "answer": "D", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: migration supported by genetic evidence.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。研究某座偏遠島嶼上一種作物的植物學家發現，島上的品種在人類定居該島的數萬年前，就已與大陸上的近親分化。這項證據使他們主張 ______", "opts": {"A": "the crop was first domesticated on the island.", "B": "mainland farmers acquired the crop from island communities.", "C": "human settlement probably did not account for the plant's original arrival on the island.", "D": "the island variety must be genetically identical to wild mainland plants."}, "optsZh": {"A": "這種作物最早是在島上被馴化的。", "B": "大陸上的農民從島嶼社群取得了這種作物。", "C": "人類定居大概不是這種植物最初抵達該島的原因。", "D": "島上的品種在基因上一定與野生的大陸植物完全相同。"}, "answer": "C", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: migration supported by genetic evidence.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。研究人員原本認為，某種淡水螺是在人們開始在一連串湖泊之間移動船隻時才抵達那些湖泊的。然而，基因資料顯示，各湖泊的族群早在划船活動開始之前就已彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the lakes did not contain snails until boating began.", "B": "the snails likely spread through an earlier nonhuman mechanism.", "C": "human activity made the populations genetically identical.", "D": "boats probably explain every modern snail population."}, "optsZh": {"A": "在開始划船活動之前，這些湖裡沒有蝸牛。", "B": "這些蝸牛很可能是透過更早的非人為途徑擴散的。", "C": "人類活動使各族群在基因上完全相同。", "D": "船隻大概能解釋現今所有的蝸牛族群。"}, "answer": "B", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Logical Completion: control group difficulty.", "vocab": false, "body": "One challenge when researching whether holding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elected\" target=\"_blank\" rel=\"noopener\" data-w=\"elected\" data-pos=\"adj.\" data-en=\"chosen by voting\" data-zh=\"經選舉產生的\">elected<\/a> office changes a person&#x27;s behavior is the problem of ensuring that the experiment has an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=appropriate\" target=\"_blank\" rel=\"noopener\" data-w=\"appropriate\" data-pos=\"adj.\" data-en=\"suitable or right for a particular situation\" data-zh=\"合宜的；適當的\">appropriate<\/a> control group. To <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveal<\/a> the effect of holding office, researchers must compare people who hold elected office with people who do not hold office but who are otherwise similar to the office-holders. Since researchers are unable to control which politicians win elections, they therefore _______", "bodyPlain": "One challenge when researching whether holding elected office changes a person's behavior is the problem of ensuring that the experiment has an appropriate control group. To reveal the effect of holding office, researchers must compare people who hold elected office with people who do not hold office but who are otherwise similar to the office-holders. Since researchers are unable to control which politicians win elections, they therefore _______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "研究擔任民選公職是否會改變一個人的行為時，其中一項挑戰是確保實驗有適當的對照組。為了揭示擔任公職的影響，研究人員必須將擔任民選公職的人，與沒有擔任公職但其他方面與公職人員相似的人進行比較。由於研究人員無法控制哪些政治人物會贏得選舉，因此他們 _______", "opts": {"A": "struggle to find valid data about the behavior of politicians who do not currently hold office.", "B": "can only conduct valid studies with people who have previously held office rather than people who presently hold office.", "C": "should select a control group of people who differ from office holders in several significant ways.", "D": "will find it difficult to identify a group of people who can function as an appropriate control group for their studies."}, "optsZh": {"A": "難以找到關於目前未擔任公職的政治人物行為的有效數據。", "B": "只能用曾經擔任公職的人、而非現任公職人員來進行有效的研究。", "C": "應該選擇在幾個重要方面與公職人員不同的人作為對照組。", "D": "會很難找到一群人來作為他們研究的適當對照組。"}, "answer": "D", "expl": "Since researchers can't control who wins office, it is hard to find people otherwise similar to office-holders, i.e., an appropriate control group.", "explZh": "研究人員無法控制誰當選，因此很難找到與當選者其他條件都相似的人，也就是難以找到適當的對照組。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Logical Completion: control group difficulty.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一項城市政策要求房東向房客揭露租金調漲資訊，但允許這些通知不提供給公部門機關。住房權益倡議者警告，這項政策可能會產生意想不到的效果，即 ______", "opts": {"A": "making it harder for officials to identify neighborhoods where rent increases are unusually severe.", "B": "preventing tenants from discussing rent changes with one another.", "C": "encouraging landlords to repair apartments before raising rents.", "D": "reducing tenants' interest in renewing leases."}, "optsZh": {"A": "使官員更難找出租金漲幅異常嚴重的社區。", "B": "阻止房客彼此討論租金變動。", "C": "鼓勵房東在調漲租金前先修繕公寓。", "D": "降低房客續租的意願。"}, "answer": "A", "expl": "The concern is that confidentiality prevents outside evaluation.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Logical Completion: control group difficulty.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=advocate\" target=\"_blank\" rel=\"noopener\" data-w=\"advocate\" data-pos=\"n.\" data-en=\"a person who publicly supports a cause\" data-zh=\"倡議者；擁護者\">advocates<\/a> argue that the rule could ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一項補助計畫鼓勵製藥公司與公立醫院合作，但允許這些公司對每份研究協議的條款保密。病患權益倡議者認為，這項規定可能會 ______", "opts": {"A": "require hospitals to publish every patient's medical history.", "B": "reduce the number of diseases that hospitals are able to study.", "C": "prevent companies from profiting from successful drugs.", "D": "make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data."}, "optsZh": {"A": "要求醫院公布每位病患的病歷。", "B": "減少醫院能夠研究的疾病數量。", "C": "阻止公司從成功的藥物中獲利。", "D": "使人難以判斷醫院因病患資料被使用而獲得的補償是否公平。"}, "answer": "D", "expl": "The issue is the inability of outside observers to evaluate fairness.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Logical Completion: control group difficulty.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。新的檔案法要求博物館在展出文化物件之前先諮詢後裔社群，但允許博物館將諮詢協議密封不公開。一些社群領袖擔心這項條款可能會 ______", "opts": {"A": "force museums to return every object in their collections.", "B": "discourage museums from preserving fragile objects.", "C": "obscure whether communities actually have meaningful influence over display decisions.", "D": "prevent curators from learning about the objects' cultural meanings."}, "optsZh": {"A": "迫使博物館歸還館藏中的每一件物品。", "B": "阻止博物館保存易損的物品。", "C": "使人無法看清社區是否對展示決策真正具有實質影響力。", "D": "使策展人無法了解這些物品的文化意義。"}, "answer": "C", "expl": "Sealed agreements make accountability difficult.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Logical Completion: control group difficulty.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一項漁業條約要求企業在使用傳統生態知識時，須對沿海村莊給予補償，但該條約允許付款合約保持不公開。批評者認為，這項保密規定可能會 ______", "opts": {"A": "reduce villages' knowledge of marine species.", "B": "increase the number of fish caught by local crews.", "C": "stop companies from conducting ecological research.", "D": "make it impossible for independent observers to judge whether compensation is equitable."}, "optsZh": {"A": "減少村民對海洋物種的了解。", "B": "增加當地船員捕獲的魚量。", "C": "阻止公司進行生態研究。", "D": "使獨立觀察者無法判斷補償是否公平。"}, "answer": "D", "expl": "Private contracts prevent independent assessment of equity.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Logical Completion: control group difficulty.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A university policy requires <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> companies to compensate Indigenous language speakers when their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______", "stem": "Which choice most logically completes the text?", "stemZh": "下列哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一項大學政策要求科技公司在使用原住民語言使用者的錄音來訓練語音辨識系統時，須給予他們補償，但允許合約保密。倡議者警告，這項政策可能會 ______", "opts": {"A": "require speakers to learn programming skills.", "B": "prevent outsiders from verifying whether speakers are paid fairly.", "C": "increase the cost of recording equipment.", "D": "discourage researchers from documenting endangered languages."}, "optsZh": {"A": "要求說話者學習程式設計技能。", "B": "使外界無法核實說話者是否獲得公平報酬。", "C": "提高錄音設備的成本。", "D": "使研究人員不願記錄瀕危語言。"}, "answer": "B", "expl": "The concern is lack of transparent verification.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English: plural noun, no possessive.", "vocab": false, "body": "In his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=groundbreaking\" target=\"_blank\" rel=\"noopener\" data-w=\"groundbreaking\" data-pos=\"adj.\" data-en=\"new and very important; pioneering\" data-zh=\"開創性的\">groundbreaking<\/a> book Bengali Harlem and the Lost Histories of South Asian America, Vivek Bald uses newspaper articles, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=census\" target=\"_blank\" rel=\"noopener\" data-w=\"census\" data-pos=\"n.\" data-en=\"an official count of a population\" data-zh=\"人口普查\">census<\/a> records, ships&#x27; logs, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=memoir\" target=\"_blank\" rel=\"noopener\" data-w=\"memoir\" data-pos=\"n.\" data-en=\"a written account of one&#x27;s own life and experiences\" data-zh=\"回憶錄\">memoirs<\/a> to tell the _______ who made New York City their home in the early twentieth century.", "bodyPlain": "In his groundbreaking book Bengali Harlem and the Lost Histories of South Asian America, Vivek Bald uses newspaper articles, census records, ships' logs, and memoirs to tell the _______ who made New York City their home in the early twentieth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "在他開創性的著作《Bengali Harlem and the Lost Histories of South Asian America》中，Vivek Bald 運用報紙文章、人口普查紀錄、船舶航海日誌與回憶錄，講述了二十世紀初以紐約市為家的 _______。", "opts": {"A": "story's of the South Asian immigrants", "B": "story's of the South Asian immigrants'", "C": "stories of the South Asian immigrants", "D": "stories' of the South Asian immigrant's"}, "optsZh": {"A": "story's of the South Asian immigrants（story's 是所有格，不是複數：錯誤）", "B": "story's of the South Asian immigrants'（不當使用所有格撇號：錯誤）", "C": "stories of the South Asian immigrants（複數名詞 stories，無所有格；immigrants 為複數：正確）", "D": "stories' of the South Asian immigrant's（不當使用所有格撇號：錯誤）"}, "answer": "C", "expl": "'Stories' is a plain plural noun (no possession), and 'immigrants' is also a plain plural object of 'of,' so neither needs an apostrophe.", "explZh": "「stories」是單純的複數名詞，不表所有；「immigrants」是介系詞 of 的受詞，也只是複數，都不需要撇號。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English: plural noun, no possessive.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "stories of the immigrant families", "B": "story's of the immigrant families", "C": "stories' of the immigrant family's", "D": "story's of the immigrant families'"}, "optsZh": {"A": "stories of the immigrant families（複數名詞，不需所有格：正確）", "B": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）", "C": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）", "D": "story's of the immigrant families'（不當使用所有格撇號：錯誤）"}, "answer": "A", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English: plural noun, no possessive.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of:", "B": "of", "C": "of-", "D": "of,"}, "optsZh": {"A": "of:（介系詞後不可接冒號：錯誤）", "B": "of（介系詞後直接接受詞，不需標點：正確）", "C": "of-（介系詞與受詞之間不可加破折號：錯誤）", "D": "of,（介系詞與受詞之間不可加逗號：錯誤）"}, "answer": "B", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English: plural noun, no possessive.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization,", "B": "organization, that", "C": "organization that", "D": "organization"}, "optsZh": {"A": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）", "B": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）", "C": "organization that（that 引導限定性關係子句：正確）", "D": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）"}, "answer": "C", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English: plural noun, no possessive.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。這些樣本含有異常高量的同位素氮-15 ______ 顯示這些動物曾吃過海洋植物。", "opts": {"A": "(15N),", "B": ", (15N),", "C": "(15N)", "D": ", (15N)"}, "optsZh": {"A": "(15N),（同位語前已有逗號，後面再補上逗號將其完整隔開：正確）", "B": ", (15N),（逗號不當地把名稱和括號縮寫拆開：錯誤）", "C": "(15N)（前後都沒有逗號 → 同位語未用逗號隔開：錯誤）", "D": ", (15N)（逗號把名稱和括號縮寫拆開，且同位語後缺少結束逗號：錯誤）"}, "answer": "A", "expl": "The parenthetical isotope notation is followed by a comma before the participial phrase.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English: plural noun, no possessive.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologist noticed faint marks on the cave ______ ultraviolet photography revealed that the marks were part of a larger painting.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。考古學家注意到洞穴 ______ 上有模糊的痕跡，紫外線攝影顯示這些痕跡是一幅更大壁畫的一部分。", "opts": {"A": "walls with", "B": "walls so with", "C": "walls, with", "D": "walls. With"}, "optsZh": {"A": "walls with（缺少標點 → 兩個獨立子句連寫的連寫句：錯誤）", "B": "walls so with（so 連接詞不合邏輯，造成句子結構錯誤：錯誤）", "C": "walls, with（只用逗號連接兩個獨立子句 → 逗號連接錯誤：錯誤）", "D": "walls. With（句號分開兩個獨立子句：正確）"}, "answer": "D", "expl": "A period correctly separates two complete sentences.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: preposition after themes.", "vocab": false, "body": "In her two major series &quot;Memory Test&quot; and &quot;Autobiography,&quot; painter Howardena Pindell <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explore\" target=\"_blank\" rel=\"noopener\" data-w=\"explore\" data-pos=\"v.\" data-en=\"to examine or discuss a subject in detail\" data-zh=\"探索；探討\">explored<\/a> themes _______ healing, self-discovery, and memory by cutting and sewing back together pieces of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=canvas\" target=\"_blank\" rel=\"noopener\" data-w=\"canvas\" data-pos=\"n.\" data-en=\"strong cloth used for painting on\" data-zh=\"畫布\">canvas<\/a> and inserting personal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=artifact\" target=\"_blank\" rel=\"noopener\" data-w=\"artifact\" data-pos=\"n.\" data-en=\"an object made by people long ago\" data-zh=\"文物；人工製品\">artifacts<\/a>, such as postcards, into some of the paintings.", "bodyPlain": "In her two major series \"Memory Test\" and \"Autobiography,\" painter Howardena Pindell explored themes _______ healing, self-discovery, and memory by cutting and sewing back together pieces of canvas and inserting personal artifacts, such as postcards, into some of the paintings.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "在她的兩個主要系列「Memory Test」與「Autobiography」中，畫家 Howardena Pindell 透過剪開再縫合畫布碎片，並在部分畫作中放入明信片等個人物品，探討 _______ 療癒、自我探索與記憶的主題。", "opts": {"A": "of", "B": "of,", "C": "of-", "D": "of:"}, "optsZh": {"A": "of（介系詞後直接接受詞，不需標點：正確）", "B": "of,（介系詞與受詞之間不可加逗號：錯誤）", "C": "of-（介系詞與受詞之間不可加破折號：錯誤）", "D": "of:（介系詞後不可接冒號：錯誤）"}, "answer": "A", "expl": "'Themes of healing, self-discovery, and memory' needs no punctuation between the preposition 'of' and its objects.", "explZh": "「themes of healing, self-discovery, and memory」中，介系詞 of 與其受詞之間不應加任何標點。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: preposition after themes.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian used letters, maps, and diaries to tell the ______ who established businesses in the port city during the nineteenth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。這位歷史學家運用信件、地圖與日記，講述了十九世紀在這座港口城市創業的 ______。", "opts": {"A": "stories of the immigrant families", "B": "story's of the immigrant families", "C": "story's of the immigrant families'", "D": "stories' of the immigrant family's"}, "optsZh": {"A": "stories of the immigrant families（複數名詞，不需所有格：正確）", "B": "story's of the immigrant families（story's 是所有格，不是複數：錯誤）", "C": "story's of the immigrant families'（不當使用所有格撇號：錯誤）", "D": "stories' of the immigrant family's（不當使用所有格撇號：錯誤）"}, "answer": "A", "expl": "The plural noun 'stories' is needed; no possessive is required.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: preposition after themes.", "vocab": false, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> explores themes ______ exile, memory, and repair through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> made from broken <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> objects.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The exhibition explores themes ______ exile, memory, and repair through sculptures made from broken household objects.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這場展覽透過以破損家用物品製成的雕塑，探討 ______ 流亡、記憶與修復的主題。", "opts": {"A": "of:", "B": "of,", "C": "of", "D": "of-"}, "optsZh": {"A": "of:（介系詞後不可接冒號：錯誤）", "B": "of,（介系詞與受詞之間不可加逗號：錯誤）", "C": "of（介系詞後直接接受詞，不需標點：正確）", "D": "of-（介系詞與受詞之間不可加破折號：錯誤）"}, "answer": "C", "expl": "The preposition 'of' should not be followed by punctuation here.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: preposition after themes.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The founders established a nonprofit research ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specializes<\/a> in translating medical information for multilingual communities.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The founders established a nonprofit research ______ specializes in translating medical information for multilingual communities.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "下列哪一個選項能使文本符合標準英語的慣用規則？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。創辦人成立了一個非營利研究 ______ 專門為多語社群翻譯醫療資訊。", "opts": {"A": "organization, that", "B": "organization that", "C": "organization", "D": "organization,"}, "optsZh": {"A": "organization, that（限定性關係子句 that 前不可加逗號：錯誤）", "B": "organization that（that 引導限定性關係子句：正確）", "C": "organization（無關係代名詞 → 兩個子句直接相接，句子結構錯誤：錯誤）", "D": "organization,（逗號後接動詞 → 缺少主詞，句子結構錯誤：錯誤）"}, "answer": "B", "expl": "A restrictive relative clause beginning with 'that' identifies the organization.", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English: preposition after themes.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The samples contained an unusually high level of the isotope nitrogen-15 ______ suggesting that the animals had eaten marine plants.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The samples contained an unusually high level of the
