"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A school timetable has 40-minute periods; the new timetable has five equal periods per day; equal periods <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=simplify\" target=\"_blank\" rel=\"noopener\" data-w=\"simplify\" data-pos=\"v.\" data-en=\"to make something easier to understand\" data-zh=\"簡化\">simplify<\/a> room assignments; the old timetable has uneven period lengths; the goal is to explain an advantage.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A school timetable has 40-minute periods; the new timetable has five equal periods per day; equal periods simplify room assignments; the old timetable has uneven period lengths; the goal is to explain an advantage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。筆記：一份學校課表的每節課為 40 分鐘；新課表每天有五節等長的課；等長的節次可簡化教室分配；舊課表的每節長度不一；目標是說明一項優點。", "opts": {"A": "The new timetable's five equal periods would simplify room assignments, unlike the old timetable with uneven period lengths.", "B": "The old timetable uses several period lengths.", "C": "The new timetable has 40-minute periods.", "D": "Schools use timetables to organize classes."}, "optsZh": {"A": "新課表的五節等長課堂可以簡化教室分配，不像舊課表的節次長度參差不齊。", "B": "舊課表採用數種不同的節次長度。", "C": "新課表每節課 40 分鐘。", "D": "學校使用課表來安排課程。"}, "answer": "A", "expl": "The answer states the advantage clearly.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Student Notes: explain an advantage.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A transit pass can be used on buses, trains, and ferries; separate tickets are currently required; one pass would reduce confusion for riders; the goal is to explain an advantage.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A transit pass can be used on buses, trains, and ferries; separate tickets are currently required; one pass would reduce confusion for riders; the goal is to explain an advantage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。筆記：一張交通票卡可用於公車、火車與渡輪；目前需要分別購票；一張票卡可減少乘客的困擾；目標是說明一項優點。", "opts": {"A": "Separate tickets are currently required for several forms of transit.", "B": "Because one pass could be used on buses, trains, and ferries, it would reduce confusion for riders.", "C": "A transit pass can be purchased by commuters.", "D": "Ferries are part of the regional transit system."}, "optsZh": {"A": "目前搭乘數種交通工具需要分別購票。", "B": "因為一張票卡可以搭乘公車、火車和渡輪，所以能減少乘客的困惑。", "C": "通勤者可以購買交通月票。", "D": "渡輪是區域大眾運輸系統的一部分。"}, "answer": "B", "expl": "The answer explains the advantage.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Student Notes: explain an advantage.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: A library app sends due-date reminders; overdue books currently result in fines; reminders help patrons return books on time; the goal is to explain an advantage.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A library app sends due-date reminders; overdue books currently result in fines; reminders help patrons return books on time; the goal is to explain an advantage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：一個圖書館應用程式會發送到期日提醒；目前逾期還書會被罰款；提醒能幫助讀者準時還書；目標是說明一項優點。", "opts": {"A": "Overdue books may result in fines.", "B": "Libraries lend books to patrons.", "C": "By reminding patrons of due dates, the app can help them return books on time and avoid fines.", "D": "The library app sends electronic reminders."}, "optsZh": {"A": "逾期未還的書可能會被罰款。", "B": "圖書館把書借給讀者。", "C": "藉由提醒讀者到期日，這個應用程式可以幫助他們準時還書並避免罰款。", "D": "圖書館的應用程式會發送電子提醒。"}, "answer": "C", "expl": "The answer explains the benefit.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Student Notes: explain an advantage.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: A reusable container program replaces disposable lunch boxes; reusable containers reduce daily waste; students return the containers after lunch; the goal is to explain an advantage.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A reusable container program replaces disposable lunch boxes; reusable containers reduce daily waste; students return the containers after lunch; the goal is to explain an advantage.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。筆記：一項可重複使用餐盒計畫取代了拋棄式午餐盒；可重複使用的餐盒能減少每日的垃圾；學生在午餐後歸還餐盒；目標是說明一項優點。", "opts": {"A": "Students eat lunch at school.", "B": "By replacing disposable lunch boxes with containers that students return after lunch, the program can reduce daily waste.", "C": "Disposable lunch boxes are used only once.", "D": "The program requires students to return containers."}, "optsZh": {"A": "學生在學校吃午餐。", "B": "藉由以學生午餐後歸還的餐盒取代拋棄式午餐盒，這個計畫可以減少每天產生的垃圾。", "C": "拋棄式午餐盒只使用一次。", "D": "這個計畫要求學生歸還餐盒。"}, "answer": "B", "expl": "The answer explains the advantage.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Student Notes: present theory to unfamiliar audience.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Haudenosaunee Confederacy is a nearly 1,000-year-old <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=alliance\" target=\"_blank\" rel=\"noopener\" data-w=\"alliance\" data-pos=\"n.\" data-en=\"an agreement between groups or countries to work together\" data-zh=\"聯盟\">alliance<\/a> of six Native nations in the northeastern US.<br>- The members are bound by a centuries-old agreement known as the Great Law of Peace.<br>- Historian Bruce Johansen is one of several scholars who believe that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=principle\" target=\"_blank\" rel=\"noopener\" data-w=\"principle\" data-pos=\"n.\" data-en=\"a basic rule or belief that guides behavior\" data-zh=\"原則\">principles<\/a> of the Great Law of Peace influenced the US Constitution.<br>- This theory is called the influence theory.<br>- Johansen cites the fact that Benjamin Franklin and Thomas Jefferson both studied the Haudenosaunee Confederacy.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Haudenosaunee Confederacy is a nearly 1,000-year-old alliance of six Native nations in the northeastern US.\n- The members are bound by a centuries-old agreement known as the Great Law of Peace.\n- Historian Bruce Johansen is one of several scholars who believe that the principles of the Great Law of Peace influenced the US Constitution.\n- This theory is called the influence theory.\n- Johansen cites the fact that Benjamin Franklin and Thomas Jefferson both studied the Haudenosaunee Confederacy.", "stem": "The student wants to present the influence theory to an audience unfamiliar with the Haudenosaunee Confederacy. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要向不熟悉豪德諾索尼聯盟的讀者介紹「影響理論」。下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- Haudenosaunee 聯盟是美國東北部六個原住民族組成、歷史將近 1,000 年的聯盟。\n- 成員們受一項有數百年歷史、稱為《Great Law of Peace》（和平大法）的協議所約束。\n- 歷史學家 Bruce Johansen 是認為《Great Law of Peace》的原則影響了美國憲法的幾位學者之一。\n- 這個理論被稱為「影響理論」。\n- Johansen 引用 Benjamin Franklin 與 Thomas Jefferson 都曾研究過 Haudenosaunee 聯盟這項事實。", "opts": {"A": "Historian Bruce Johansen believes that the Great Law of Peace was very influential.", "B": "The influence theory is supported by the fact that Benjamin Franklin and Thomas Jefferson both studied the Haudenosaunee Confederacy.", "C": "The influence theory holds that the principles of the Great Law of Peace, a centuries-old agreement binding six Native nations in the northeastern US, influenced the US Constitution.", "D": "Native people, including the members of the Haudenosaunee Confederacy, influenced the founding of the US in many different ways."}, "optsZh": {"A": "歷史學家 Bruce Johansen 認為《和平大法》（Great Law of Peace）非常有影響力。", "B": "Benjamin Franklin 和 Thomas Jefferson 都研究過豪德諾索尼聯盟，這一事實支持了「影響理論」。", "C": "「影響理論」認為，《和平大法》——一項有數百年歷史、約束美國東北部六個原住民族的協議——其原則影響了美國憲法。", "D": "包括 Haudenosaunee Confederacy（豪德諾索尼聯盟）成員在內的原住民，以許多不同方式影響了美國的建國。"}, "answer": "C", "expl": "It explains the influence theory and briefly describes the Great Law of Peace for readers who don't know the Haudenosaunee Confederacy.", "explZh": "此選項說明影響理論，並為不熟悉 Haudenosaunee 聯盟的讀者簡要介紹「和平大法」是什麼。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Student Notes: present theory to unfamiliar audience.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: The River Council is a 700-year-old alliance of five towns; the towns are bound by the Water Charter; historian Mei Alvarez argues that the Water Charter influenced later regional law; the audience is unfamiliar with the alliance; the goal is to present the theory.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The River Council is a 700-year-old alliance of five towns; the towns are bound by the Water Charter; historian Mei Alvarez argues that the Water Charter influenced later regional law; the audience is unfamiliar with the alliance; the goal is to present the theory.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。筆記：River Council 是由五個城鎮組成、有 700 年歷史的聯盟；這些城鎮受《Water Charter》約束；歷史學家 Mei Alvarez 主張《Water Charter》影響了後來的地區法律；讀者不熟悉這個聯盟；目標是介紹這個理論。", "opts": {"A": "Many alliances influenced regional government.", "B": "The theory holds that the Water Charter, a centuries-old agreement binding five towns in the River Council, influenced later regional law.", "C": "Mei Alvarez believes that the Water Charter was influential.", "D": "The theory is supported by the fact that later lawmakers studied the River Council."}, "optsZh": {"A": "許多聯盟影響了地區政府。", "B": "該理論認為，《水憲章》——一項有數百年歷史、約束 River Council（河川議會）五個城鎮的協議——影響了後來的地區法律。", "C": "Mei Alvarez 認為《水憲章》（Water Charter）具有影響力。", "D": "後來的立法者研究過 River Council（河川議會）這一事實支持了這個理論。"}, "answer": "B", "expl": "The answer gives necessary context and states the theory.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Student Notes: present theory to unfamiliar audience.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: The Mountain League united seven villages; its Pact of Roads governed shared trade routes; scholar Ilya Chen argues that the pact shaped the first provincial constitution; the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a> is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> with the league; the goal is to present the theory.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The Mountain League united seven villages; its Pact of Roads governed shared trade routes; scholar Ilya Chen argues that the pact shaped the first provincial constitution; the audience is unfamiliar with the league; the goal is to present the theory.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。筆記：Mountain League 聯合了七個村落；其《Pact of Roads》規範共用的貿易路線；學者 Ilya Chen 主張該協約形塑了第一部省級憲法；讀者不熟悉這個聯盟；目標是介紹這個理論。", "opts": {"A": "The Mountain League lasted for centuries.", "B": "According to Ilya Chen, the Pact of Roads of the Mountain League, an alliance of seven villages, shaped the first provincial constitution.", "C": "Trade routes connected many mountain villages.", "D": "The Pact of Roads was important."}, "optsZh": {"A": "Mountain League（山地聯盟）延續了好幾個世紀。", "B": "根據 Ilya Chen 的說法，由七個村莊組成的聯盟 Mountain League（山地聯盟）所訂定的《道路公約》影響了第一部省憲法。", "C": "貿易路線連接了許多山村。", "D": "《道路公約》（Pact of Roads）很重要。"}, "answer": "B", "expl": "The answer introduces the group and theory.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Student Notes: present theory to unfamiliar audience.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: The Coastal Assembly linked four island communities; its Council Code described shared decision-making; some scholars argue that the code influenced the republic&#x27;s senate; the audience is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> with the assembly; the goal is to present the theory.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The Coastal Assembly linked four island communities; its Council Code described shared decision-making; some scholars argue that the code influenced the republic's senate; the audience is unfamiliar with the assembly; the goal is to present the theory.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。筆記：Coastal Assembly 連結了四個島嶼社群；其《Council Code》描述了共同決策的方式；一些學者主張該法典影響了共和國的參議院；讀者不熟悉這個議會；目標是介紹這個理論。", "opts": {"A": "Island communities often formed alliances.", "B": "The republic's senate had many influences.", "C": "The Council Code described shared decision-making.", "D": "The Coastal Assembly linked four island communities through a Council Code that some scholars believe influenced the republic's senate."}, "optsZh": {"A": "島嶼社群經常結成聯盟。", "B": "這個共和國的元老院受到許多影響。", "C": "《議會法典》（Council Code）描述了共同決策的方式。", "D": "Coastal Assembly（沿海議會）透過《議會法典》連結了四個島嶼社群，一些學者認為這部法典影響了該共和國的元老院。"}, "answer": "D", "expl": "The answer gives context and presents the theory.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Student Notes: present theory to unfamiliar audience.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: The Forest Compact joined six clans; its Peace Articles required <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collective\" target=\"_blank\" rel=\"noopener\" data-w=\"collective\" data-pos=\"n.\" data-en=\"a group of people who work together\" data-zh=\"團體；集體\">collective<\/a> deliberation; historian Sara Nordin argues that the Peace Articles influenced later parliamentary rules; the audience is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> with the compact; the goal is to present the theory.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: The Forest Compact joined six clans; its Peace Articles required collective deliberation; historian Sara Nordin argues that the Peace Articles influenced later parliamentary rules; the audience is unfamiliar with the compact; the goal is to present the theory.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：Forest Compact 結合了六個氏族；其《Peace Articles》要求集體審議；歷史學家 Sara Nordin 主張《Peace Articles》影響了後來的議會規則；讀者不熟悉這個盟約；目標是介紹這個理論。", "opts": {"A": "Historian Sara Nordin argues that the Peace Articles of the Forest Compact, a six-clan alliance, influenced later parliamentary rules.", "B": "Parliamentary rules changed over time.", "C": "The Forest Compact joined six clans.", "D": "Sara Nordin is a historian."}, "optsZh": {"A": "歷史學家 Sara Nordin 主張，由六個氏族組成的聯盟《森林盟約》（Forest Compact）中的《和平條款》影響了後來的議會規則。", "B": "議會規則隨著時間而改變。", "C": "《森林盟約》（Forest Compact）聯合了六個氏族。", "D": "Sara Nordin 是一位歷史學家。"}, "answer": "A", "expl": "The answer presents the theory with context.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Student Notes: present theory to unfamiliar audience.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: The Lakes Confederation is an old alliance of three communities; its Charter of Oars created rules for shared waterways; scholar Dana Morel argues that these rules influenced modern water law; the audience is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> with the confederation; the goal is to present the theory.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The Lakes Confederation is an old alliance of three communities; its Charter of Oars created rules for shared waterways; scholar Dana Morel argues that these rules influenced modern water law; the audience is unfamiliar with the confederation; the goal is to present the theory.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。筆記：Lakes Confederation 是由三個社群組成的古老聯盟；其《Charter of Oars》為共用水道制定了規則；學者 Dana Morel 主張這些規則影響了現代水法；讀者不熟悉這個邦聯；目標是介紹這個理論。", "opts": {"A": "Modern water law concerns rivers and lakes.", "B": "Dana Morel studies old alliances.", "C": "The Lakes Confederation was an alliance of three communities whose Charter of Oars, according to Dana Morel, influenced modern water law.", "D": "The Charter of Oars created rules."}, "optsZh": {"A": "現代水法涉及河流與湖泊。", "B": "Dana Morel 研究古代的聯盟。", "C": "Lakes Confederation（湖泊聯邦）是由三個社群組成的聯盟；根據 Dana Morel 的說法，其《船槳憲章》影響了現代水法。", "D": "《船槳憲章》（Charter of Oars）制定了規則。"}, "answer": "C", "expl": "The answer explains the group and theory.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: emphasize relative heat.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- In 1999, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronomer\" target=\"_blank\" rel=\"noopener\" data-w=\"astronomer\" data-pos=\"n.\" data-en=\"a scientist who studies stars and planets\" data-zh=\"天文學家\">astronomer<\/a> Todd Henry studied the differences in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> between the Sun and nearby stars.<br>- His team mapped all stars within 10 parsecs of the Sun.<br>- The surface temperature of the Sun is around 9,800°F, which <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> it as a G star.<br>- 327 of the 357 stars in the study were classified as K or M stars, with surface temperatures under 8,900°F (cooler than the Sun).<br>- 11 of the 357 stars in the study were classified as A or F stars, with surface temperatures greater than 10,300°F (hotter than the Sun).", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In 1999, astronomer Todd Henry studied the differences in surface temperature between the Sun and nearby stars.\n- His team mapped all stars within 10 parsecs of the Sun.\n- The surface temperature of the Sun is around 9,800°F, which classifies it as a G star.\n- 327 of the 357 stars in the study were classified as K or M stars, with surface temperatures under 8,900°F (cooler than the Sun).\n- 11 of the 357 stars in the study were classified as A or F stars, with surface temperatures greater than 10,300°F (hotter than the Sun).", "stem": "The student wants to emphasize how hot the Sun is relative to nearby stars. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要強調太陽相對於鄰近恆星有多熱。下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 1999 年，天文學家 Todd Henry 研究了太陽與鄰近恆星之間表面溫度的差異。\n- 他的團隊繪製了距離太陽 10 秒差距以內所有恆星的分布圖。\n- 太陽的表面溫度約為華氏 9,800 度，因此被歸類為 G 型星。\n- 研究中的 357 顆恆星中，有 327 顆被歸類為 K 型或 M 型星，表面溫度低於華氏 8,900 度（比太陽低溫）。\n- 研究中的 357 顆恆星中，有 11 顆被歸類為 A 型或 F 型星，表面溫度高於華氏 10,300 度（比太陽高溫）。", "opts": {"A": "At around 9,800°F, which classifies it as a G star, the Sun is hotter than most but not all of the stars within 10 parsecs of it.", "B": "Astronomer Todd Henry determined that the Sun, at around 9,800°F, is a G star, and several other stars within a 10-parsec range are A or F stars.", "C": "Of the 357 stars within ten parsecs of the Sun, 327 are classified as K or M stars, with surface temperatures under 8,900°F.", "D": "While most of the stars within 10 parsecs of the Sun are classified as K, M, A, or F stars, the Sun is classified as a G star due to its surface temperature of 9,800°F."}, "optsZh": {"A": "太陽的溫度約為 9,800°F，因而被歸類為 G 型恆星，它比距離它 10 秒差距內的大多數（但並非全部）恆星都熱。", "B": "天文學家 Todd Henry 判定，表面溫度約 9,800°F 的太陽屬於 G 型恆星，而 10 秒差距範圍內的其他幾顆恆星屬於 A 型或 F 型恆星。", "C": "在距離太陽 10 秒差距內的 357 顆恆星中，有 327 顆被歸類為 K 型或 M 型恆星，表面溫度低於 8,900°F。", "D": "雖然距離太陽 10 秒差距內的恆星大多被歸類為 K、M、A 或 F 型，但太陽因其 9,800°F 的表面溫度而被歸類為 G 型恆星。"}, "answer": "A", "expl": "It states the Sun's temperature and says it is hotter than most but not all nearby stars, emphasizing its relative heat.", "explZh": "此選項列出太陽溫度，並指出它比附近大多數（但非全部）恆星更熱，強調其相對熱度。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: emphasize relative heat.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Astronomers measured 400 nearby stars; Star A has a surface <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> of 10,000°F; 360 stars are cooler than 9,200°F; 20 stars are hotter than 10,500°F; the goal is to emphasize how hot Star A is relative to nearby stars.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Astronomers measured 400 nearby stars; Star A has a surface temperature of 10,000°F; 360 stars are cooler than 9,200°F; 20 stars are hotter than 10,500°F; the goal is to emphasize how hot Star A is relative to nearby stars.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。筆記：天文學家測量了 400 顆鄰近恆星；Star A 的表面溫度為華氏 10,000 度；360 顆恆星低於華氏 9,200 度；20 顆恆星高於華氏 10,500 度；目標是強調 Star A 相對於鄰近恆星有多熱。", "opts": {"A": "Astronomers measured 400 nearby stars.", "B": "At 10,000°F, Star A is hotter than most, though not all, of the nearby stars measured.", "C": "Star temperatures can be used to classify stars.", "D": "Some nearby stars are hotter than Star A."}, "optsZh": {"A": "天文學家測量了 400 顆鄰近的恆星。", "B": "Star A 的溫度為 10,000°F，比大多數（但並非全部）測量到的鄰近恆星還熱。", "C": "恆星溫度可以用來為恆星分類。", "D": "有些鄰近的恆星比 Star A 更熱。"}, "answer": "B", "expl": "The answer states the relative comparison.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: emphasize relative heat.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A lake&#x27;s summer <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> is 72°F; 18 of 20 nearby lakes are cooler; 2 nearby lakes are warmer; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> how warm the lake is relative to others.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A lake's summer temperature is 72°F; 18 of 20 nearby lakes are cooler; 2 nearby lakes are warmer; the goal is to emphasize how warm the lake is relative to others.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。筆記：某座湖的夏季水溫為華氏 72 度；附近 20 座湖中有 18 座較冷；2 座附近的湖較暖；目標是強調這座湖相對於其他湖有多溫暖。", "opts": {"A": "The lake is 72°F in summer.", "B": "Two nearby lakes are warmer.", "C": "Because 18 of 20 nearby lakes are cooler, the lake is warmer than most but not all nearby lakes.", "D": "Nearby lakes vary in temperature."}, "optsZh": {"A": "這座湖在夏天的水溫是 72°F。", "B": "鄰近有兩座湖比較溫暖。", "C": "由於附近 20 座湖中有 18 座較涼，這座湖比大多數（但並非全部）的鄰近湖泊溫暖。", "D": "鄰近的湖泊溫度各不相同。"}, "answer": "C", "expl": "The answer emphasizes the relative warmth.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: emphasize relative heat.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: A marathon runner&#x27;s time was 2:12; 80 of 90 runners finished more slowly; 5 finished faster; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> how fast the runner was relative to competitors.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: A marathon runner's time was 2:12; 80 of 90 runners finished more slowly; 5 finished faster; the goal is to emphasize how fast the runner was relative to competitors.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。筆記：一位馬拉松跑者的成績是 2 小時 12 分；90 名跑者中有 80 名較慢完賽；5 名較快完賽；目標是強調這位跑者相對於其他參賽者有多快。", "opts": {"A": "The race included 90 runners.", "B": "Many runners compete in marathons.", "C": "Five runners finished faster.", "D": "The runner finished in 2:12, faster than most but not all of the competitors."}, "optsZh": {"A": "這場比賽有 90 位跑者參加。", "B": "許多跑者參加馬拉松比賽。", "C": "有五位跑者跑得更快。", "D": "這位跑者以 2 小時 12 分完賽，比大多數（但並非全部）的參賽者都快。"}, "answer": "D", "expl": "The answer gives the relative ranking.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: emphasize relative heat.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: A mountain is 4,100 meters high; 30 of 35 mountains in the range are lower; 4 are higher; the goal is to emphasize its height relative to nearby mountains.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A mountain is 4,100 meters high; 30 of 35 mountains in the range are lower; 4 are higher; the goal is to emphasize its height relative to nearby mountains.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：某座山高 4,100 公尺；山脈中 35 座山有 30 座較低；4 座較高；目標是強調它相對於鄰近山峰的高度。", "opts": {"A": "At 4,100 meters, the mountain is higher than most but not all mountains in the range.", "B": "Four mountains in the range are higher.", "C": "The mountain is in a range with 35 mountains.", "D": "Several mountains are over 4,000 meters high."}, "optsZh": {"A": "這座山高 4,100 公尺，比山脈中大多數（但並非全部）的山都高。", "B": "山脈中有四座山比它更高。", "C": "這座山位於一個有 35 座山的山脈中。", "D": "有好幾座山高度超過 4,000 公尺。"}, "answer": "A", "expl": "The answer emphasizes relative height.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: emphasize relative heat.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: A city&#x27;s median income is $54,000; 45 of 50 nearby cities have lower median incomes; 5 have higher median incomes; the goal is to emphasize relative income.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: A city's median income is $54,000; 45 of 50 nearby cities have lower median incomes; 5 have higher median incomes; the goal is to emphasize relative income.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。筆記：某城市的家戶所得中位數為 54,000 美元；附近 50 個城市中有 45 個的所得中位數較低；5 個較高；目標是強調其相對所得。", "opts": {"A": "Five nearby cities have higher median incomes.", "B": "Median income is one way to compare cities.", "C": "With a median income of $54,000, the city has a higher median income than most nearby cities, though five are higher.", "D": "Nearby cities have different median incomes."}, "optsZh": {"A": "附近有五座城市的家庭所得中位數較高。", "B": "所得中位數是比較城市的一種方式。", "C": "這座城市的所得中位數為 54,000 美元，高於大多數鄰近城市，不過有五座城市更高。", "D": "鄰近的城市有不同的所得中位數。"}, "answer": "C", "expl": "The answer directly makes the comparison.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: introduce a book to familiar audience.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- The Atlantic Monthly magazine was first published in 1857.<br>- The magazine focused on politics, art, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.<br>- In 2019, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Cathryn Halverson published the book Faraway Women and the &quot;Atlantic Monthly.&quot;<br>- Its subject is female authors whose <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=autobiography\" target=\"_blank\" rel=\"noopener\" data-w=\"autobiography\" data-pos=\"n.\" data-en=\"a book about a person&#x27;s life written by that person\" data-zh=\"自傳\">autobiographies<\/a> appeared in the magazine in the early 1900s.<br>- One of the authors discussed is Juanita Harrison.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The Atlantic Monthly magazine was first published in 1857.\n- The magazine focused on politics, art, and literature.\n- In 2019, historian Cathryn Halverson published the book Faraway Women and the \"Atlantic Monthly.\"\n- Its subject is female authors whose autobiographies appeared in the magazine in the early 1900s.\n- One of the authors discussed is Juanita Harrison.", "stem": "The student wants to introduce Cathryn Halverson's book to an audience already familiar with the Atlantic Monthly. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要向已經熟悉《Atlantic Monthly》的讀者介紹 Cathryn Halverson 的書。下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 《Atlantic Monthly》雜誌於 1857 年首次出版。\n- 這本雜誌著重於政治、藝術與文學。\n- 2019 年，歷史學家 Cathryn Halverson 出版了《Faraway Women and the \"Atlantic Monthly\"》一書。\n- 這本書的主題是 1900 年代初期自傳曾刊登在該雜誌上的女性作家。\n- 書中討論的作家之一是 Juanita Harrison。", "opts": {"A": "Cathryn Halverson's Faraway Women and the \"Atlantic Monthly\" discusses female authors whose autobiographies appeared in the magazine in the early 1900s.", "B": "A magazine called the Atlantic Monthly, referred to in Cathryn Halverson's book title, was first published in 1857.", "C": "Faraway Women and the \"Atlantic Monthly\" features contributors to the Atlantic Monthly, first published in 1857 as a magazine focusing on politics, art, and literature.", "D": "An author discussed by Cathryn Halverson is Juanita Harrison, whose autobiography appeared in the Atlantic Monthly in the early 1900s."}, "optsZh": {"A": "Cathryn Halverson 的《Faraway Women and the 〈Atlantic Monthly〉》討論了 1900 年代初在該雜誌發表自傳的女性作家。", "B": "Cathryn Halverson 書名中提到的雜誌《Atlantic Monthly》，於 1857 年首次出版。", "C": "《Faraway Women and the 〈Atlantic Monthly〉》介紹了《Atlantic Monthly》的撰稿人；該雜誌於 1857 年創刊，是一本專注於政治、藝術與文學的雜誌。", "D": "Cathryn Halverson 討論的作者之一是 Juanita Harrison，她的自傳於 1900 年代初刊登在《Atlantic Monthly》上。"}, "answer": "A", "expl": "For readers already familiar with the magazine, it introduces the book and its subject without explaining the Atlantic Monthly.", "explZh": "讀者已熟悉這本雜誌，因此只需介紹這本書與其主題，不必再解釋 Atlantic Monthly。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: introduce a book to familiar audience.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A journal began in 1890; readers already know the journal; Dr. Lin published a book in 2021 about immigrant poets whose essays appeared in the journal; one poet is Marta Silva; the goal is to introduce the book to a familiar audience.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A journal began in 1890; readers already know the journal; Dr. Lin published a book in 2021 about immigrant poets whose essays appeared in the journal; one poet is Marta Silva; the goal is to introduce the book to a familiar audience.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。筆記：某期刊創刊於 1890 年；讀者已經熟悉這份期刊；Dr. Lin 在 2021 年出版了一本書，內容關於散文曾刊登在該期刊上的移民詩人；其中一位詩人是 Marta Silva；目標是向熟悉的讀者介紹這本書。", "opts": {"A": "The journal published politics, art, and literature.", "B": "The journal began in 1890.", "C": "Marta Silva was an immigrant poet.", "D": "Dr. Lin's 2021 book examines immigrant poets whose essays appeared in the journal in the early twentieth century."}, "optsZh": {"A": "這份期刊刊登政治、藝術與文學方面的內容。", "B": "這份期刊創刊於 1890 年。", "C": "Marta Silva 是一位移民詩人。", "D": "林博士 2021 年的著作探討了 20 世紀初曾在該期刊發表散文的移民詩人。"}, "answer": "D", "expl": "The answer omits unnecessary background for a familiar audience.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: introduce a book to familiar audience.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: The Harbor Review is familiar to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Joel Kim wrote a book about women photographers whose travel writing appeared in the magazine; the book was published in 2020; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduce<\/a> the book.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The Harbor Review is familiar to the audience; historian Joel Kim wrote a book about women photographers whose travel writing appeared in the magazine; the book was published in 2020; the goal is to introduce the book.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。筆記：讀者熟悉《Harbor Review》；歷史學家 Joel Kim 寫了一本書，內容關於旅遊寫作曾刊登在該雜誌上的女性攝影師；這本書於 2020 年出版；目標是介紹這本書。", "opts": {"A": "Travel writing can appear in magazines.", "B": "Joel Kim's 2020 book focuses on women photographers whose travel writing appeared in the Harbor Review.", "C": "The Harbor Review was first published many years ago.", "D": "The Harbor Review is a magazine."}, "optsZh": {"A": "旅遊文章可能會刊登在雜誌上。", "B": "Joel Kim 2020 年的著作聚焦於曾在《Harbor Review》發表旅遊文章的女性攝影師。", "C": "《Harbor Review》在多年前首次出版。", "D": "《Harbor Review》是一本雜誌。"}, "answer": "B", "expl": "The answer introduces the book directly.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: introduce a book to familiar audience.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: The audience knows the museum; curator Ana Ruiz published a catalog about textile artists whose work was shown there in the 1970s; one artist is Laila Noor; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduce<\/a> the catalog.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The audience knows the museum; curator Ana Ruiz published a catalog about textile artists whose work was shown there in the 1970s; one artist is Laila Noor; the goal is to introduce the catalog.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。筆記：讀者熟悉這座博物館；策展人 Ana Ruiz 出版了一本目錄，內容關於 1970 年代曾在該館展出作品的織品藝術家；其中一位藝術家是 Laila Noor；目標是介紹這本目錄。", "opts": {"A": "Ana Ruiz's catalog discusses textile artists whose work appeared at the museum in the 1970s.", "B": "The museum is familiar to the audience.", "C": "Textile art was exhibited in many places.", "D": "Laila Noor is mentioned in the catalog."}, "optsZh": {"A": "Ana Ruiz 的展覽目錄討論了 1970 年代作品曾在該博物館展出的紡織藝術家。", "B": "觀眾對這間博物館很熟悉。", "C": "紡織藝術曾在許多地方展出。", "D": "目錄中提到了 Laila Noor。"}, "answer": "A", "expl": "The answer focuses on the catalog subject.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: introduce a book to familiar audience.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Readers know the newspaper City Ledger; a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> wrote a book about labor organizers whose columns appeared in the newspaper; the book was published in 2018; the goal is to introduce the book.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Readers know the newspaper City Ledger; a historian wrote a book about labor organizers whose columns appeared in the newspaper; the book was published in 2018; the goal is to introduce the book.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：讀者熟悉《City Ledger》這份報紙；一位歷史學家寫了一本書，內容關於專欄曾刊登在該報上的勞工運動組織者；這本書於 2018 年出版；目標是介紹這本書。", "opts": {"A": "The newspaper printed columns.", "B": "The City Ledger was a newspaper.", "C": "The 2018 book examines labor organizers whose columns appeared in the City Ledger.", "D": "A historian published a book in 2018."}, "optsZh": {"A": "這份報紙刊登專欄。", "B": "《City Ledger》是一份報紙。", "C": "這本 2018 年的書探討了曾在《City Ledger》發表專欄的勞工運動組織者。", "D": "一位歷史學家在 2018 年出版了一本書。"}, "answer": "C", "expl": "The answer introduces the book to people already familiar with the paper.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: introduce a book to familiar audience.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: The audience knows the radio program Night Forum; scholar Dana Bell wrote a book about scientists interviewed on the program in the 1950s; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduce<\/a> the book.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The audience knows the radio program Night Forum; scholar Dana Bell wrote a book about scientists interviewed on the program in the 1950s; the goal is to introduce the book.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。筆記：讀者熟悉《Night Forum》這個廣播節目；學者 Dana Bell 寫了一本書，內容關於 1950 年代曾在該節目中受訪的科學家；目標是介紹這本書。", "opts": {"A": "Night Forum was a radio program.", "B": "Scientists can be interviewed on radio.", "C": "The 1950s were important for broadcasting.", "D": "Dana Bell's book discusses scientists who were interviewed on Night Forum in the 1950s."}, "optsZh": {"A": "《Night Forum》是一個廣播節目。", "B": "科學家可以接受廣播節目訪問。", "C": "1950 年代對廣播業很重要。", "D": "Dana Bell 的書討論了 1950 年代曾在《Night Forum》節目中接受訪問的科學家。"}, "answer": "D", "expl": "The answer introduces the book without redundant background.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The magnificent frigatebird is a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of seabird that feeds mainly on fish, tuna, squid, and other small sea animals.<br>- It is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unusual\" target=\"_blank\" rel=\"noopener\" data-w=\"unusual\" data-pos=\"adj.\" data-en=\"different from what is normal or expected\" data-zh=\"不尋常的\">unusual<\/a> among seabirds in that it doesn&#x27;t dive into the water for prey.<br>- One way it acquires food is by using its hook-tipped bill to snatch prey from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> of the water.<br>- Another way it acquires food is by taking it from weaker birds by force.<br>- This behavior is known as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=kleptoparasitism\" target=\"_blank\" rel=\"noopener\" data-w=\"kleptoparasitism\" data-pos=\"n.\" data-en=\"stealing food that another animal has caught\" data-zh=\"竊食寄生（搶奪他者獵物的行為）\">kleptoparasitism<\/a>.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The magnificent frigatebird is a species of seabird that feeds mainly on fish, tuna, squid, and other small sea animals.\n- It is unusual among seabirds in that it doesn't dive into the water for prey.\n- One way it acquires food is by using its hook-tipped bill to snatch prey from the surface of the water.\n- Another way it acquires food is by taking it from weaker birds by force.\n- This behavior is known as kleptoparasitism.", "stem": "The student wants to emphasize a similarity between the two ways a magnificent frigatebird acquires food. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這位學生想要強調軍艦鳥兩種覓食方式之間的相似之處。下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一名學生做了以下筆記：\n- 華麗軍艦鳥是一種海鳥，主要以魚、鮪魚、魷魚及其他小型海洋動物為食。\n- 牠在海鳥中很特別，因為牠不會潛入水中捕食獵物。\n- 牠取得食物的方式之一，是用末端呈鉤狀的鳥喙從水面攫取獵物。\n- 牠取得食物的另一種方式，是用武力從較弱的鳥類那裡搶奪食物。\n- 這種行為被稱為「盜食寄生」。", "opts": {"A": "A magnificent frigatebird never dives into the water, instead using its hook-tipped bill to snatch prey from the surface.", "B": "Neither of a magnificent frigatebird's two ways of acquiring food requires the bird to dive into the water.", "C": "Of the magnificent frigatebird's two ways of acquiring food, only one is known as kleptoparasitism.", "D": "In addition to snatching prey from the water with its hook-tipped bill, a magnificent frigatebird takes food from other birds by force."}, "optsZh": {"A": "軍艦鳥從不潛入水中，而是用前端帶鉤的喙從水面上叼取獵物。", "B": "軍艦鳥的兩種覓食方式都不需要潛入水中。", "C": "在軍艦鳥的兩種覓食方式中，只有一種被稱為「偷竊寄生」（kleptoparasitism）。", "D": "軍艦鳥除了用前端帶鉤的喙從水面叼取獵物之外，還會用武力搶奪其他鳥類的食物。"}, "answer": "B", "expl": "It emphasizes what the two methods share: neither requires diving into the water.", "explZh": "此選項強調兩種覓食方式的共同點：都不需要潛入水中。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A seabird catches fish from the water&#x27;s surface; it also steals fish from other birds; it does not dive underwater in either case; the goal is to emphasize a similarity.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A seabird catches fish from the water's surface; it also steals fish from other birds; it does not dive underwater in either case; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "下列哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。筆記：某種海鳥從水面捕魚；牠也會從其他鳥類那裡偷魚；這兩種情況牠都不會潛入水下；目標是強調一項相似之處。", "opts": {"A": "The bird feeds mainly on small sea animals.", "B": "Only one method involves stealing from other birds.", "C": "Neither method requires the bird to dive underwater.", "D": "The bird can catch fish in more than one way."}, "optsZh": {"A": "這種鳥主要以小型海洋動物為食。", "B": "只有一種方式涉及搶奪其他鳥類的食物。", "C": "兩種方式都不需要這種鳥潛入水中。", "D": "這種鳥能以不只一種方式捕魚。"}, "answer": "C", "expl": "The answer states the shared feature.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: emphasize a similarity.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: A desert fox eats insects it digs from sand; it also eats fruit that has fallen from shrubs; both methods require foraging at night; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a similarity.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: A desert fox eats in
