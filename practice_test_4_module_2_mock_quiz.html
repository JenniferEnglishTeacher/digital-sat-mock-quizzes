oals.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The researcher used newly discovered letters to ______ her argument that the expedition had scientific as well as commercial goals.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在這個計畫形成最終公開版本之前，編輯與合作者已修改過其中幾項主張。在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。這位研究人員利用新發現的信件來 ______ 她的論點：這次探險除了商業目的之外，也有科學目的。", "opts": {"A": "reciprocate", "B": "annotate", "C": "support", "D": "withdraw"}, "optsZh": {"A": "reciprocate（回報；互換）", "B": "annotate（註解；加註）", "C": "support（支持）", "D": "withdraw（撤回；退出）"}, "answer": "C", "expl": "Support means strengthen a claim.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to do or feel the same thing in return", "zh": "回報；互惠", "word": "reciprocate"}, "B": {"pos": "v.", "en": "to add notes or comments to a text or picture", "zh": "註解；加註", "word": "annotate"}, "C": {"pos": "v.", "en": "to help show that something is true; to back an idea", "zh": "支持；佐證", "word": "support"}, "D": {"pos": "v.", "en": "to take back or remove; to pull out of something", "zh": "撤回；退出", "word": "withdraw"}}}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Words in Context: buttress a claim or right.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. To ______ the proposal, the committee included cost estimates, survey results, and examples of similar programs in nearby districts.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. To ______ the proposal, the committee included cost estimates, survey results, and examples of similar programs in nearby districts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。為了 ______ 這項提案，委員會納入了成本估算、調查結果，以及鄰近學區類似計畫的實例。", "opts": {"A": "disengage", "B": "imitate", "C": "neglect", "D": "reinforce"}, "optsZh": {"A": "disengage（脫離；解開）", "B": "imitate（模仿）", "C": "neglect（忽略；疏忽）", "D": "reinforce（強化；加強）"}, "answer": "D", "expl": "Reinforce means strengthen.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to separate from or stop being involved in something", "zh": "脫離；退出", "word": "disengage"}, "B": {"pos": "v.", "en": "to copy the way someone or something does things", "zh": "模仿", "word": "imitate"}, "C": {"pos": "v.", "en": "to fail to give enough care or attention to something", "zh": "忽略；疏於照顧", "word": "neglect"}, "D": {"pos": "v.", "en": "to make an idea, claim, or structure stronger", "zh": "強化；加強", "word": "reinforce"}}}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Words in Context: buttress a claim or right.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The lawyer introduced financial records to ______ the witness&#x27;s account of where the money had gone.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The lawyer introduced financial records to ______ the witness's account of where the money had gone.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。律師提出財務紀錄來 ______ 證人對於這筆錢去向的陳述。", "opts": {"A": "dismiss", "B": "substantiate", "C": "annotate", "D": "reciprocate"}, "optsZh": {"A": "dismiss（不予理會；駁斥）", "B": "substantiate（證實；提供證據支持）", "C": "annotate（註解；加註）", "D": "reciprocate（回報；互換）"}, "answer": "B", "expl": "Substantiate means support with evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to decide something is not important or worth considering", "zh": "不予理會；否定", "word": "dismiss"}, "B": {"pos": "v.", "en": "to provide evidence to prove that something is true", "zh": "證實", "word": "substantiate"}, "C": {"pos": "v.", "en": "to add notes or comments to a text or picture", "zh": "註解；加註", "word": "annotate"}, "D": {"pos": "v.", "en": "to do or feel the same thing in return", "zh": "回報；互惠", "word": "reciprocate"}}}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Words in Context: buttress a claim or right.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The scientist gathered additional <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperature<\/a> data to ______ the conclusion that the glacier was retreating faster than expected.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The scientist gathered additional temperature data to ______ the conclusion that the glacier was retreating faster than expected.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "下列哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在略微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。這位科學家蒐集了額外的溫度資料，以 ______ 冰河退縮速度比預期更快的結論。", "opts": {"A": "reciprocate", "B": "bolster", "C": "annotate", "D": "disengage"}, "optsZh": {"A": "reciprocate（回報；互換）", "B": "bolster（支持；加強）", "C": "annotate（註解；加註）", "D": "disengage（脫離；解開）"}, "answer": "B", "expl": "Bolster means support or strengthen.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to do or feel the same thing in return", "zh": "回報；互惠", "word": "reciprocate"}, "B": {"pos": "v.", "en": "to support or strengthen something, such as a claim", "zh": "支持；加強", "word": "bolster"}, "C": {"pos": "v.", "en": "to add notes or comments to a text or picture", "zh": "註解；加註", "word": "annotate"}, "D": {"pos": "v.", "en": "to separate from or stop being involved in something", "zh": "脫離；退出", "word": "disengage"}}}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Text Function: detail about behavior.", "vocab": false, "body": "Some bird <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> don&#x27;t raise their own chicks. Instead, adult females lay their eggs in other nests, next to another bird species&#x27; own eggs. <u>Female cuckoos have been seen quickly laying eggs in the nests of other bird species when those birds are out looking for food.<\/u> After the eggs hatch, the noncuckoo parents will <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=typically\" target=\"_blank\" rel=\"noopener\" data-w=\"typically\" data-pos=\"adv.\" data-en=\"usually; in most cases\" data-zh=\"通常；一般而言\">typically<\/a> raise the cuckoo chicks as if they were their own <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=offspring\" target=\"_blank\" rel=\"noopener\" data-w=\"offspring\" data-pos=\"n.\" data-en=\"an animal&#x27;s or person&#x27;s young\" data-zh=\"後代；子女\">offspring<\/a>, even if the cuckoos look very different from the other chicks.", "bodyPlain": "Some bird species don't raise their own chicks. Instead, adult females lay their eggs in other nests, next to another bird species' own eggs. Female cuckoos have been seen quickly laying eggs in the nests of other bird species when those birds are out looking for food. After the eggs hatch, the noncuckoo parents will typically raise the cuckoo chicks as if they were their own offspring, even if the cuckoos look very different from the other chicks.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "下列哪一項最能描述畫底線的句子在全文中的功能？", "bodyZh": "有些鳥類不會自己養育雛鳥。相反地，成年雌鳥會把蛋產在別的鳥巢裡，放在另一種鳥自己的蛋旁邊。有人觀察到，雌杜鵑會趁其他鳥類外出覓食時，迅速把蛋產在牠們的巢中。蛋孵化後，非杜鵑的親鳥通常會把杜鵑雛鳥當作自己的後代來養育，即使杜鵑雛鳥的外表與其他雛鳥差異很大。", "opts": {"A": "It introduces a physical feature of female cuckoos that is described later in the text.", "B": "It describes the appearance of the cuckoo nests mentioned earlier in the text.", "C": "It offers a detail about how female cuckoos carry out the behavior discussed in the text.", "D": "It explains how other birds react to the female cuckoo behavior discussed in the text."}, "optsZh": {"A": "它介紹雌杜鵑的一項身體特徵，該特徵在文中稍後有所描述。", "B": "它描述了文中前面提到的杜鵑巢的外觀。", "C": "它提供一個細節，說明雌杜鵑如何進行文中所討論的行為。", "D": "它說明其他鳥類對文中所討論的雌杜鵑行為有何反應。"}, "answer": "C", "expl": "After the text says some birds lay eggs in other species' nests, the underlined sentence gives a specific detail about how female cuckoos do this: quickly, while the other birds are away looking for food.", "explZh": "前文提到有些鳥會把蛋下在別種鳥的巢中；畫線句具體說明雌杜鵑如何做到這件事——趁其他鳥外出覓食時迅速產卵。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Text Function: detail about behavior.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "下列哪一項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一篇科學文章首先說明，彗星每次接近太陽時，其表面都會發生變化。第二句指出，由於對彗星內部結構仍了解不足，研究人員無法準確預測這些變化。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It identifies the uncertainty that motivated the study.", "B": "It describes how other researchers criticized the work.", "C": "It offers evidence that radar is always reliable.", "D": "It states the study's final conclusion."}, "optsZh": {"A": "它指出促成這項研究的不確定之處。", "B": "它描述其他研究人員如何批評這項研究。", "C": "它提供證據證明雷達永遠可靠。", "D": "它陳述這項研究的最終結論。"}, "answer": "A", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Text Function: detail about behavior.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "下列哪一項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一篇考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著文章討論一個團隊，他們在陶器中尋找化學特徵，但只得出初步的結論。", "opts": {"A": "It defines the problem the later investigation attempts to address.", "B": "It shifts the discussion away from archaeology.", "C": "It summarizes the team's strongest result.", "D": "It contradicts the claim made in the first sentence."}, "optsZh": {"A": "它界定了後續研究試圖處理的問題。", "B": "它把討論的焦點從考古學轉移開。", "C": "它概述這個團隊最有力的研究結果。", "D": "它反駁了第一句中的主張。"}, "answer": "A", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Text Function: detail about behavior.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "下列哪一項最能描述畫底線的句子在全文中的功能？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It gives a historical overview of plant classification.", "B": "It proves that drought has no effect on plants.", "C": "It lists the materials used in the experiment.", "D": "It introduces a gap in knowledge that the experiment examines."}, "optsZh": {"A": "它概述了植物分類的歷史。", "B": "它證明乾旱對植物毫無影響。", "C": "它列出實驗中使用的材料。", "D": "它引出實驗所要探究的知識缺口。"}, "answer": "D", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Text Function: detail about behavior.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "下列哪一項最能描述畫底線的句子在全文中的功能？", "bodyZh": "一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一篇文學分析開頭指出，一部小說的結局常被形容為樂觀的。第二句指出，這種詮釋很難站得住腳，因為最後一章包含了好幾個關於禁錮的意象。段落其餘部分說明這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It provides biographical information about the novelist.", "B": "It raises a difficulty with a common interpretation.", "C": "It summarizes the novel's publication history.", "D": "It introduces an unrelated theme."}, "optsZh": {"A": "它提供這位小說家的生平資料。", "B": "它提出一種常見詮釋所面臨的難題。", "C": "它概述這部小說的出版歷史。", "D": "它引入一個無關的主題。"}, "answer": "B", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Text Function: detail about behavior.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "下列哪一項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一篇科技文章首先說，自主水下載具可以繪製海床地圖。下一句解釋，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師針對這些狀況測試一套新的導航系統。", "opts": {"A": "It announces that the technology is already flawless.", "B": "It gives a personal anecdote about engineers.", "C": "It explains the limitation that the new system is meant to address.", "D": "It compares underwater vehicles with aircraft."}, "optsZh": {"A": "它宣稱這項技術已經完美無缺。", "B": "它講述一則關於工程師的個人軼事。", "C": "它說明了新系統想要解決的限制。", "D": "它將水下載具與飛機作比較。"}, "answer": "C", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Reading Detail: how surprise was measured.", "vocab": false, "body": "Cats can judge unseen people&#x27;s positions in space by the sound of their voices and thus react with surprise when the same person calls to them from two different locations in a short span of time. Saho Takagi and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> reached this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> by measuring cats&#x27; levels of surprise based on their ear and head movements while the cats heard <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recording\" target=\"_blank\" rel=\"noopener\" data-w=\"recording\" data-pos=\"n.\" data-en=\"sound or images stored so they can be played again\" data-zh=\"錄音；錄影\">recordings<\/a> of their owners&#x27; voices from two speakers spaced far apart. Cats exhibited a low level of surprise when owners&#x27; voices were played twice from the same speaker, but they showed a high level of surprise when the voice was played once each from the two different speakers.", "bodyPlain": "Cats can judge unseen people's positions in space by the sound of their voices and thus react with surprise when the same person calls to them from two different locations in a short span of time. Saho Takagi and colleagues reached this conclusion by measuring cats' levels of surprise based on their ear and head movements while the cats heard recordings of their owners' voices from two speakers spaced far apart. Cats exhibited a low level of surprise when owners' voices were played twice from the same speaker, but they showed a high level of surprise when the voice was played once each from the two different speakers.", "stem": "According to the text, how did the researchers determine the level of surprise displayed by the cats in the study?", "stemZh": "根據本文，研究人員如何判定研究中的貓所表現出的驚訝程度？", "bodyZh": "貓能憑著看不見的人說話的聲音判斷其在空間中的位置，因此當同一個人在短時間內從兩個不同的位置呼喚牠們時，牠們會表現出驚訝。Saho Takagi 與同事得出這個結論的方法是：讓貓聽從兩個相隔很遠的喇叭播放的飼主聲音錄音，同時根據貓的耳朵與頭部動作來測量牠們的驚訝程度。當飼主的聲音從同一個喇叭播放兩次時，貓表現出的驚訝程度很低；但當聲音分別從兩個不同的喇叭各播放一次時，牠們則表現出高度的驚訝。", "opts": {"A": "They watched how each cat moved its ears and head.", "B": "They examined how each cat reacted to the voice of a stranger.", "C": "They studied how each cat physically interacted with its owner.", "D": "They tracked how each cat moved around the room."}, "optsZh": {"A": "他們觀察每隻貓如何轉動耳朵和頭部。", "B": "他們觀察每隻貓對陌生人聲音的反應。", "C": "他們研究每隻貓如何與主人進行肢體互動。", "D": "他們追蹤每隻貓在房間裡的移動情形。"}, "answer": "A", "expl": "The text says the researchers measured surprise 'based on their ear and head movements.'", "explZh": "文中明確指出研究人員是根據貓「耳朵與頭部的動作」來測量牠們的驚訝程度。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Reading Detail: how surprise was measured.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，下列哪一項最有根據？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，她經常為年長的親戚提供建議，因為在別人衝動行事時，她總能保持冷靜。敘事者強調她的關愛是真誠的，但在需要判斷力時，她也能克制自己的情緒。", "opts": {"A": "She is admired mainly for her wealth.", "B": "She shows unusual maturity and self-command.", "C": "She lacks affection for her family.", "D": "She refuses to give advice to others."}, "optsZh": {"A": "她受人欽佩主要是因為她的財富。", "B": "她展現出不尋常的成熟與自制。", "C": "她對家人缺乏感情。", "D": "她拒絕給別人建議。"}, "answer": "B", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Reading Detail: how surprise was measured.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from patience rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，下列哪一項最有根據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子觀察到，她的祖母在家庭爭執中很少開口，但當她終於提出建議時，屋裡的每個人都會接受。敘事者解釋，祖母的權威來自耐心，而非強迫。", "opts": {"A": "The narrator thinks patience is useless.", "B": "The family ignores the grandmother's opinions.", "C": "The grandmother's influence is quiet but substantial.", "D": "The grandmother avoids family matters entirely."}, "optsZh": {"A": "敘述者認為耐心毫無用處。", "B": "家人忽視祖母的意見。", "C": "祖母的影響雖然低調，卻相當重大。", "D": "祖母完全不過問家中的事。"}, "answer": "C", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Reading Detail: how surprise was measured.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，下列哪一項最有根據？", "bodyZh": "博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。一則故事描寫一位職員，他會注意到其他人已經核准的帳簿中的細微錯誤。雖然同事有時覺得他的謹慎令人厭煩，但敘事者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk intentionally creates errors.", "C": "The coworkers are more accurate than the clerk.", "D": "The clerk's carefulness is valuable despite being inconvenient."}, "optsZh": {"A": "這家企業因過度謹慎而失敗。", "B": "這位職員故意製造錯誤。", "C": "同事們比這位職員更精確。", "D": "這位職員的細心雖然造成不便，卻很有價值。"}, "answer": "D", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Reading Detail: how surprise was measured.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，下列哪一項最有根據？", "bodyZh": "一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一篇文章敘述一位村長在做決定前會傾聽每一位發言者的意見，即使答案看似顯而易見。敘事者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader values inclusive deliberation.", "B": "The leader dislikes public meetings.", "C": "The leader is unable to reach conclusions.", "D": "The leader makes decisions without hearing others."}, "optsZh": {"A": "這位領導人重視兼容並蓄的審議。", "B": "這位領導人不喜歡公開會議。", "C": "這位領導人無法做出結論。", "D": "這位領導人不聽取他人意見就做決定。"}, "answer": "A", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Reading Detail: how surprise was measured.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，下列哪一項最有根據？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。在一段節錄中，一位科學家被描述為對學生很慷慨，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，但在每一項測量都經過核對之前，她不會發表任何主張。", "opts": {"A": "She publishes claims before testing them.", "B": "She avoids working with students.", "C": "She rejects all imaginative thinking.", "D": "She combines intellectual openness with rigorous standards."}, "optsZh": {"A": "她在檢驗之前就發表論點。", "B": "她避免和學生合作。", "C": "她排斥一切富有想像力的思考。", "D": "她兼具開放的思想與嚴謹的標準。"}, "answer": "D", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Command of Evidence: weaken a hypothesis.", "vocab": false, "body": "A student performs an experiment testing her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesis\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesis\" data-pos=\"n.\" data-en=\"an idea suggested as an explanation that has not yet been proven\" data-zh=\"假設\">hypothesis<\/a> that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=slightly\" target=\"_blank\" rel=\"noopener\" data-w=\"slightly\" data-pos=\"adv.\" data-en=\"a little\" data-zh=\"稍微；略微\">slightly<\/a> acidic soil <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a> is more beneficial for the growth of the plant Brassica rapa parachinensis (a vegetable commonly known as choy sum) than a neutral soil environment. She plants sixteen seeds of choy sum in a mixture of equal amounts of coffee grounds (which are highly acidic) and potting soil and another sixteen seeds in potting soil without coffee grounds as the control for the experiment. The two groups of seeds were exposed to the same growing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> and monitored for three weeks.", "bodyPlain": "A student performs an experiment testing her hypothesis that a slightly acidic soil environment is more beneficial for the growth of the plant Brassica rapa parachinensis (a vegetable commonly known as choy sum) than a neutral soil environment. She plants sixteen seeds of choy sum in a mixture of equal amounts of coffee grounds (which are highly acidic) and potting soil and another sixteen seeds in potting soil without coffee grounds as the control for the experiment. The two groups of seeds were exposed to the same growing conditions and monitored for three weeks.", "stem": "Which finding, if true, would most directly weaken the student's hypothesis?", "stemZh": "如果下列哪一項發現屬實，最能直接削弱這位學生的假說？", "bodyZh": "一名學生進行實驗，以驗證她的假設：比起中性土壤環境，微酸性的土壤環境更有利於 Brassica rapa parachinensis（一種俗稱菜心的蔬菜）的生長。她將十六顆菜心種子種在等量咖啡渣（酸性很高）與盆栽土的混合物中，另外十六顆種子則種在不含咖啡渣的盆栽土中，作為實驗的對照組。兩組種子處於相同的生長條件下，並被觀察了三週。", "opts": {"A": "The choy sum planted in the soil without coffee grounds were significantly taller at the end of the experiment than the choy sum planted in the mixture of soil and coffee grounds.", "B": "The choy sum grown in the soil without coffee grounds weighed significantly less at the end of the experiment than the choy sum grown in the mixture of soil and coffee grounds.", "C": "The choy sum seeds planted in the soil without coffee grounds sprouted significantly later in the experiment than did the seeds planted in the mixture of soil and coffee grounds.", "D": "Significantly fewer of the choy sum seeds planted in the soil without coffee grounds sprouted plants than did the seeds planted in the mixture of soil and coffee grounds."}, "optsZh": {"A": "在實驗結束時，種在不含咖啡渣土壤中的菜心，明顯比種在土壤與咖啡渣混合物中的菜心更高。", "B": "在實驗結束時，種在不含咖啡渣土壤中的菜心，重量明顯低於種在土壤與咖啡渣混合物中的菜心。", "C": "種在不含咖啡渣土壤中的菜心種子，發芽時間明顯晚於種在土壤與咖啡渣混合物中的種子。", "D": "種在不含咖啡渣土壤中的菜心種子，發芽長成植株的數量明顯少於種在土壤與咖啡渣混合物中的種子。"}, "answer": "A", "expl": "If plants in neutral soil (no coffee grounds) grew significantly taller, the acidic soil was not more beneficial, which weakens the hypothesis.", "explZh": "若種在中性土壤（無咖啡渣）的菜心長得明顯較高，代表酸性土壤並沒有比較有利，因此削弱了學生的假設。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Command of Evidence: weaken a hypothesis.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這個政府從一開始就面臨經濟挑戰。」", "D": "「這位領導人在建國過程中的象徵性角色，比他短暫且表現參差的執政紀錄更重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Command of Evidence: weaken a hypothesis.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to help show that something is true; to back an idea\" data-zh=\"支持；佐證\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持關於各地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Some farmers grew vegetables, while others grew grain.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "有些農民種植蔬菜，而其他農民種植穀物。", "C": "在南部的蔬菜種植者中女性占多數，但在北部或中部的穀物種植者中則不然。", "D": "南部地區有被納入調查。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Command of Evidence: weaken a hypothesis.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了草圖、錄音與說明標籤，這些展示了作品如何透過反覆實驗逐步發展而成。博物館目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中加以介紹。目錄不只是列出作品名稱，而是把材料、觀眾、歷史時刻與目的連結起來，讓讀者能理解為何某種描述或結論是合理的。天文學家主張，岩石行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "The method used to study stars requires a telescope.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究發現，有數顆岩石行星所含的鐵比例遠高於它們所環繞的恆星。", "B": "研究恆星的方法需要用到望遠鏡。", "C": "有一顆岩石行星的大氣層很稀薄。", "D": "有些恆星含有氫和氦。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Command of Evidence: weaken a hypothesis.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "該研究指出，當交通、住房、經費與民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了數個社區的成果，這些社區在不同的地方條件下採取了類似的措施。由於證據中既有廣泛的模式也有例外，研究人員選擇謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠的國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "The tradition is studied by scholars in several countries.", "C": "Many performers learned songs from relatives.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有些歌曲使用的韻律也見於較古老的歐洲詩歌。", "B": "好幾個國家的學者都在研究這項傳統。", "C": "許多表演者從親戚那裡學會歌曲。", "D": "有數首民謠包含了當地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Command of Evidence: weaken a hypothesis.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一項科學調查中，結果取決於一連串的觀察，而不是單一戲劇性的發現。研究人員先描述方法、對照組以及證據的侷限，再提出一個必須兼具精確與節制的結論。一張表格顯示，某個社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫、條件相當的城鎮中，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "The program took place in a community.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這張表格包含不只一年的資料。", "B": "與沒有實施計畫的城鎮相比，這個計畫與受過訓練的志工明顯增加有關。", "C": "這個計畫在一個社區中實施。", "D": "兩個城鎮都有一些志工。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Command of Evidence: quotation illustrating contrast.", "vocab": false, "body": "&quot;The Young Girl&quot; is a 1920 short story by Katherine Mansfield. In the story, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> takes an unnamed seventeen-year-old girl and her younger brother out for a meal. In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=describe\" target=\"_blank\" rel=\"noopener\" data-w=\"describe\" data-pos=\"v.\" data-en=\"to say what something is like\" data-zh=\"描述\">describing<\/a> the teenager, Mansfield frequently <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contrast\" target=\"_blank\" rel=\"noopener\" data-w=\"contrast\" data-pos=\"v.\" data-en=\"to compare in order to show differences\" data-zh=\"對比；對照\">contrasts<\/a> the character&#x27;s pleasant appearance with her unpleasant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attitude\" target=\"_blank\" rel=\"noopener\" data-w=\"attitude\" data-pos=\"n.\" data-en=\"a way of thinking or feeling about something\" data-zh=\"態度\">attitude<\/a>.", "bodyPlain": "\"The Young Girl\" is a 1920 short story by Katherine Mansfield. In the story, the narrator takes an unnamed seventeen-year-old girl and her younger brother out for a meal. In describing the teenager, Mansfield frequently contrasts the character's pleasant appearance with her unpleasant attitude.", "stem": "Which quotation from \"The Young Girl\" most effectively illustrates the claim?", "stemZh": "下列哪一句出自〈The Young Girl〉的引文最能有效說明這項主張？", "bodyZh": "〈The Young Girl〉是 Katherine Mansfield 於 1920 年發表的短篇小說。在故事中，敘事者帶一位沒有名字的十七歲女孩和她的弟弟出去吃飯。在描寫這名少女時，Mansfield 經常將這個角色討喜的外表與她令人不快的態度加以對比。", "opts": {"A": "\"I heard her murmur, 'I can't bear flowers on a table.' They had evidently been giving her intense pain, for she positively closed her eyes as I moved them away.\"", "B": "\"While we waited she took out a little, gold powder-box with a mirror in the lid, shook the poor little puff as though she loathed it, and dabbed her lovely nose.\"", "C": "\"I saw, after that, she couldn't stand this place a moment longer, and, indeed, she jumped up and turned away while I went through the vulgar act of paying for the tea.\"", "D": "\"She didn't even take her gloves off. She lowered her eyes and drummed on the table. When a faint violin sounded she winced and bit her lip again. Silence.\""}, "optsZh": {"A": "「我聽到她低聲說：『我受不了桌上擺花。』那些花顯然一直讓她非常痛苦，因為我把花移開時，她竟然閉上了眼睛。」", "B": "「我們等待的時候，她拿出一個蓋子上嵌著鏡子的金色小粉盒，像是厭惡那可憐的小粉撲似地抖了抖它，然後輕拍她漂亮的鼻子。」", "C": "「我看得出來，在那之後她在這裡一刻也待不下去了；確實，在我進行付茶錢這種俗氣的動作時，她跳了起來並轉身走開。」", "D": "「她甚至沒有脫下手套。她垂下眼睛，用手指敲著桌面。當微弱的小提琴聲響起時，她皺了一下眉，又咬了咬嘴唇。一片沉默。」"}, "answer": "B", "expl": "The girl 'dabbed her lovely nose' (pleasant appearance) while shaking the puff 'as though she loathed it' (unpleasant attitude), showing the contrast.", "explZh": "「lovely nose」呈現她美好的外表，而「彷彿厭惡似地」甩粉撲則顯示她不悅的態度，正好呈現外表與態度的對比。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Command of Evidence: quotation illustrating contrast.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式是否在不同地點都成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得沒那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個大家熟悉的解釋。他們的報告描述了相關背景，比較了數種可能的詮釋，並逐步收斂到一個主張；這個主張的措辭取決於各細節之間的精確關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地視為國家的象徵，而不是務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟挑戰。」", "B": "「這位領導人在上任第一個月內簽署了數項法令。」", "C": "「這位領導人在建國過程中的象徵性角色，比他短暫且表現參差的執政紀錄更重要。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Command of Evidence: quotation illustrating contrast.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to help show that something is true; to back an idea\" data-zh=\"支持；佐證\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "下列哪一個選項最有效地運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館中，學者們檢視了書信、田野筆記與早期草稿，這些資料揭示了一個計畫如何隨時間演變。這些資料並未推翻這個計畫的基本歷史，但釐清了幾位參與者的角色，也使一種先前過於簡單的詮釋顯得不夠充分。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，她們占穀物種植者的比例不到 35%。哪一個敘述最能運用圖表來支持關於各地區作物模式的主張？", "opts": {"A": "The graph contains information about three regions.", "B": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "C": "The southern region was included in the survey.", "D": "Some farmers grew vegetables, while others grew grain."}, "optsZh": {"A": "這張圖表包含三個地區的資訊。", "B": "在南部的蔬菜種植者中女性占多數，但在北部或中部的穀物種植者中則
