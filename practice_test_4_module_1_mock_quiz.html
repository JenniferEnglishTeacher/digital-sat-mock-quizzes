e gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A literary analysis begins by noting that a novel&#x27;s ending has often been described as optimistic. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。一篇文學分析開頭指出，某部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含好幾個象徵禁錮的意象。這段的其餘部分解釋了那些意象如何使先前的解讀變得複雜。", "opts": {"A": "It raises a difficulty with a common interpretation.", "B": "It introduces an unrelated theme.", "C": "It provides biographical information about the novelist.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它提出一種常見詮釋所面臨的難題。", "B": "它引入一個無關的主題。", "C": "它提供這位小說家的生平資料。", "D": "它概述這部小說的出版歷史。"}, "answer": "A", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Text Structure: function of a generalization.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n一篇科技文章首先說，自主水下載具可以繪製海床地圖。下一句解釋，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師正在為這些條件測試一套新的導航系統。", "opts": {"A": "It gives a personal anecdote about engineers.", "B": "It compares underwater vehicles with aircraft.", "C": "It announces that the technology is already flawless.", "D": "It explains the limitation that the new system is meant to address."}, "optsZh": {"A": "它講述一則關於工程師的個人軼事。", "B": "它比較了水下載具與飛機。", "C": "它宣稱這項技術已經完美無缺。", "D": "它說明了新系統想要解決的限制。"}, "answer": "D", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Paired Texts: challenge linear progression.", "vocab": false, "body": "Text 1<br>Conventional wisdom long held that human social systems evolved in stages, beginning with hunter-gatherers forming small bands of members with roughly equal status. The shift to agriculture about 12,000 years ago sparked <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> growth that led to the emergence of groups with hierarchical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structures<\/a>: associations of clans first, then chiefdoms, and finally, bureaucratic states.<br><br>Text 2<br>In a 2021 book, anthropologist David Graeber and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> David Wengrow maintain that humans have always been socially flexible, alternately forming systems based on hierarchy and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collective\" target=\"_blank\" rel=\"noopener\" data-w=\"collective\" data-pos=\"n.\" data-en=\"a group of people who work together\" data-zh=\"團體；集體\">collective<\/a> ones with decentralized leadership. The authors point to evidence that as far back as 50,000 years ago some hunter-gatherers adjusted their social structures seasonally, at times dispersing in small groups but also assembling into communities that included esteemed individuals.", "bodyPlain": "Text 1\nConventional wisdom long held that human social systems evolved in stages, beginning with hunter-gatherers forming small bands of members with roughly equal status. The shift to agriculture about 12,000 years ago sparked population growth that led to the emergence of groups with hierarchical structures: associations of clans first, then chiefdoms, and finally, bureaucratic states.\n\nText 2\nIn a 2021 book, anthropologist David Graeber and archaeologist David Wengrow maintain that humans have always been socially flexible, alternately forming systems based on hierarchy and collective ones with decentralized leadership. The authors point to evidence that as far back as 50,000 years ago some hunter-gatherers adjusted their social structures seasonally, at times dispersing in small groups but also assembling into communities that included esteemed individuals.", "stem": "Based on the texts, how would Graeber and Wengrow (Text 2) most likely respond to the \"conventional wisdom\" presented in Text 1?", "stemZh": "根據這兩段文字，Graeber 和 Wengrow（Text 2）最可能如何回應 Text 1 中提出的「傳統觀點」？", "bodyZh": "文本 1\n長久以來的普遍看法認為，人類社會體系是分階段演化的，起初是狩獵採集者組成成員地位大致平等的小型群隊。大約一萬兩千年前轉向農業，引發了人口成長，進而導致具有階層結構的群體出現：先是氏族聯盟，接著是酋邦，最後是官僚國家。\n文本 2\n在一本 2021 年的著作中，人類學家 David Graeber 與考古學家 David Wengrow 主張，人類一向具有社會彈性，會交替形成以階層為基礎的體系，以及領導權分散的集體體系。兩位作者指出有證據顯示，早在五萬年前，就有一些狩獵採集者會隨季節調整他們的社會結構，有時分散成小團體，但也會聚集成包含受敬重人物的社群。", "opts": {"A": "By conceding the importance of hierarchical systems but asserting the greater significance of decentralized collective societies", "B": "By disputing the idea that developments in social structures have followed a linear progression through distinct stages", "C": "By acknowledging that hierarchical roles likely weren't a part of social systems before the rise of agriculture", "D": "By challenging the assumption that groupings of hunter-gatherers were among the earliest forms of social structure"}, "optsZh": {"A": "藉由承認階級體系的重要性，但主張去中心化的集體社會更為重要", "B": "藉由質疑「社會結構的發展是依循明確階段的線性進程」這個觀點", "C": "藉由承認在農業興起之前，社會體系中很可能沒有階級角色", "D": "藉由挑戰「狩獵採集者群體是最早的社會結構形式之一」這個假設"}, "answer": "B", "expl": "Graeber and Wengrow say humans have always alternated between social systems, which disputes Text 1's view of a step-by-step progression through stages.", "explZh": "Graeber 與 Wengrow 認為人類一直在不同社會體制間來回轉換，這反駁了 Text 1「社會依序分階段演進」的觀點。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Paired Texts: challenge linear progression.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這兩段文字，哪個回應最有根據？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。一位學生主張，某位歷史學家把一位革命領袖更多地視為國家象徵，而非務實的政策制定者。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's speeches are preserved in several archives.'", "B": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "C": "'The administration faced economic challenges from the beginning.'", "D": "'The leader signed several decrees during his first month in office.'"}, "optsZh": {"A": "「這位領導人的演說保存在數個檔案館中。」", "B": "「這位領導人在國家誕生中的象徵性角色，比他短暫且表現不一的執政紀錄更為重要。」", "C": "「這個政府從一開始就面臨經濟挑戰。」", "D": "「這位領導人在上任第一個月內簽署了數項法令。」"}, "answer": "B", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Paired Texts: challenge linear progression.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這兩段文字，哪個回應最有根據？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。一張圖表顯示，在南部地區，女性農民占蔬菜種植者的 64%，但在北部與中部地區，女性只占穀物種植者的不到 35%。哪一個敘述最能運用這張圖表來支持關於地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The graph contains information about three regions.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The southern region was included in the survey."}, "optsZh": {"A": "有些農民種植蔬菜，而其他農民種植穀物。", "B": "這張圖表包含三個地區的資訊。", "C": "在南部的蔬菜種植者中女性占多數，但在北部或中部的穀物種植者中則不然。", "D": "南部地區被納入了調查範圍。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Paired Texts: challenge linear progression.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這兩段文字，哪個回應最有根據？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展現出創作者在發表完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。天文學家主張，岩質行星所含的鐵從不會多於它們的宿主恆星。哪一項發現最能直接削弱這個主張？", "opts": {"A": "The method used to study stars requires a telescope.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "One rocky planet has a thin atmosphere.", "D": "Some stars contain hydrogen and helium."}, "optsZh": {"A": "研究恆星所用的方法需要望遠鏡。", "B": "研究發現，有數顆岩質行星所含鐵的比例明顯高於它們所環繞的恆星。", "C": "有一顆岩質行星的大氣層很稀薄。", "D": "有些恆星含有氫和氦。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Paired Texts: challenge linear progression.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A folklorist argues that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這兩段文字，哪個回應最有根據？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是原封不動地從遙遠的國家引進。哪一項發現最能支持這個論點？", "opts": {"A": "The tradition is studied by scholars in several countries.", "B": "Some songs use a meter also found in older European poetry.", "C": "Many performers learned songs from relatives.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有好幾個國家的學者在研究這項傳統。", "B": "有些歌曲使用的韻律也出現在較古老的歐洲詩歌中。", "C": "許多表演者是向親戚學習歌曲的。", "D": "有幾首民謠包含了當地的歷史事件，以及不同族群持續接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Paired Texts: challenge linear progression.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這兩段文字，哪個回應最有根據？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n一張表格顯示，某項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有這項計畫的類似城鎮，人數則維持在 20 人左右。哪一個結論最有根據？", "opts": {"A": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "B": "The program took place in a community.", "C": "The table includes more than one year.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "與沒有實施這項計畫的城鎮相比，這項計畫與受訓志工人數的明顯增加有關。", "B": "這項計畫在一個社區中進行。", "C": "這張表格包含不只一年的資料。", "D": "兩個城鎮都有一些志工。"}, "answer": "A", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Reading Detail: character satisfaction.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Frances Hodgson Burnett&#x27;s 1911 novel The Secret Garden. Mary, a young girl, recently found an overgrown hidden garden.<br><br>Mary was an odd, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> little person, and now she had something interesting to be determined about, she was very much <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=absorb\" target=\"_blank\" rel=\"noopener\" data-w=\"absorb\" data-pos=\"v.\" data-en=\"to take in a substance or information\" data-zh=\"吸收\">absorbed<\/a>, indeed. She worked and dug and pulled up weeds steadily, only becoming more pleased with her work every hour instead of tiring of it. It seemed to her like a fascinating sort of play.", "bodyPlain": "The following text is adapted from Frances Hodgson Burnett's 1911 novel The Secret Garden. Mary, a young girl, recently found an overgrown hidden garden.\n\nMary was an odd, determined little person, and now she had something interesting to be determined about, she was very much absorbed, indeed. She worked and dug and pulled up weeds steadily, only becoming more pleased with her work every hour instead of tiring of it. It seemed to her like a fascinating sort of play.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明這段文字的主旨？", "bodyZh": "以下文字改寫自 Frances Hodgson Burnett 1911 年的小說《The Secret Garden》。Mary 是一個小女孩，她最近發現了一座雜草叢生的祕密花園。\nMary 是個古怪又意志堅定的小傢伙，而現在她有了一件值得下定決心去做的有趣事情，她確實非常投入。她不停地工作、挖土、拔雜草，每過一個小時，她對自己的工作只是越來越滿意，而不是感到厭倦。對她來說，這就像一種迷人的遊戲。", "opts": {"A": "Mary hides in the garden to avoid doing her chores.", "B": "Mary is getting bored with pulling up so many weeds in the garden.", "C": "Mary is clearing out the garden to create a space to play.", "D": "Mary feels very satisfied when she's taking care of the garden."}, "optsZh": {"A": "Mary 躲在花園裡逃避做家事。", "B": "Mary 對在花園裡拔那麼多雜草感到越來越厭煩。", "C": "Mary 正在清理花園，以騰出一塊玩耍的空間。", "D": "Mary 在照顧花園時感到非常滿足。"}, "answer": "D", "expl": "Mary becomes 'more pleased with her work every hour' and finds it 'a fascinating sort of play,' so she feels satisfied caring for the garden.", "explZh": "Mary「每過一小時就對自己的工作更滿意」，覺得這像「一種迷人的遊戲」，可見照顧花園讓她很滿足。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Reading Detail: character satisfaction.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，卻經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調，她的關愛是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She refuses to give advice to others.", "B": "She lacks affection for her family.", "C": "She is admired mainly for her wealth.", "D": "She shows unusual maturity and self-command."}, "optsZh": {"A": "她拒絕給別人建議。", "B": "她對家人缺乏感情。", "C": "她受人敬佩主要是因為她的財富。", "D": "她展現出不尋常的成熟與自制力。"}, "answer": "D", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Reading Detail: character satisfaction.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在一本回憶錄中，一個孩子注意到，她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強迫。", "opts": {"A": "The family ignores the grandmother's opinions.", "B": "The grandmother's influence is quiet but substantial.", "C": "The grandmother avoids family matters entirely.", "D": "The narrator thinks patience is useless."}, "optsZh": {"A": "這家人忽視祖母的意見。", "B": "祖母的影響力低調但深遠。", "C": "祖母完全不過問家中事務。", "D": "敘述者認為耐心毫無用處。"}, "answer": "B", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Reading Detail: character satisfaction.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。一則故事描寫一位職員，他會注意到帳簿中別人已經核准過的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk's carefulness is valuable despite being inconvenient.", "C": "The clerk intentionally creates errors.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這家店因過度謹慎而經營失敗。", "B": "這位職員的細心雖然造成不便，卻很有價值。", "C": "這位職員故意製造錯誤。", "D": "同事們比這位職員更精確。"}, "answer": "B", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Reading Detail: character satisfaction.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measure\" target=\"_blank\" rel=\"noopener\" data-w=\"measure\" data-pos=\"v.\" data-en=\"to find the size, amount, or degree of something\" data-zh=\"測量\">measure<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。一段文字敘述，一位村莊領袖在做決定之前會聆聽每一位發言者，即使答案似乎顯而易見。敘述者暗示，這個習慣讓會議進行得較慢，卻能避免那些原本可能覺得自己被忽視的人心生怨恨。", "opts": {"A": "The leader is unable to reach conclusions.", "B": "The leader dislikes public meetings.", "C": "The leader values inclusive deliberation.", "D": "The leader makes decisions without hearing others."}, "optsZh": {"A": "這位領導人無法做出結論。", "B": "這位領導人不喜歡公開會議。", "C": "這位領導人重視兼容並蓄的審議討論。", "D": "這位領導人不聽取他人意見就做決定。"}, "answer": "C", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Reading Detail: character satisfaction.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，然而在每一項測量都經過檢查之前，她絕不會發表任何主張。", "opts": {"A": "She combines intellectual openness with rigorous standards.", "B": "She rejects all imaginative thinking.", "C": "She publishes claims before testing them.", "D": "She avoids working with students."}, "optsZh": {"A": "她兼具開放的求知態度與嚴謹的標準。", "B": "她排斥一切富有想像力的思考。", "C": "她在驗證主張之前就將其發表。", "D": "她避免與學生共事。"}, "answer": "A", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Poetry inference: analogy for nourishment.", "vocab": false, "body": "The following text is from Ezra Pound&#x27;s 1909 poem &quot;Hymn III,&quot; based on the work of Marcantonio Flaminio.<br><br>As a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragile\" target=\"_blank\" rel=\"noopener\" data-w=\"fragile\" data-pos=\"adj.\" data-en=\"easily broken or damaged\" data-zh=\"脆弱的\">fragile<\/a> and lovely flower unfolds its gleaming <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foliage\" target=\"_blank\" rel=\"noopener\" data-w=\"foliage\" data-pos=\"n.\" data-en=\"the leaves of a plant\" data-zh=\"葉子；枝葉\">foliage<\/a> on the breast of the fostering earth, if the dew and the rain draw it forth;<br>So doth my tender mind <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=flourish\" target=\"_blank\" rel=\"noopener\" data-w=\"flourish\" data-pos=\"v.\" data-en=\"to grow or develop successfully\" data-zh=\"蓬勃發展；興盛\">flourish<\/a>, if it be fed with the sweet dew of the fostering spirit,<br>Lacking this, it beginneth straightway to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=languish\" target=\"_blank\" rel=\"noopener\" data-w=\"languish\" data-pos=\"v.\" data-en=\"to become weak or fail to grow\" data-zh=\"衰弱；凋萎\">languish<\/a>, even as a floweret born upon dry earth, if the dew and the rain tend it not.", "bodyPlain": "The following text is from Ezra Pound's 1909 poem \"Hymn III,\" based on the work of Marcantonio Flaminio.\n\nAs a fragile and lovely flower unfolds its gleaming foliage on the breast of the fostering earth, if the dew and the rain draw it forth;\nSo doth my tender mind flourish, if it be fed with the sweet dew of the fostering spirit,\nLacking this, it beginneth straightway to languish, even as a floweret born upon dry earth, if the dew and the rain tend it not.", "stem": "Based on the text, in what way is the human mind like a flower?", "stemZh": "根據這段文字，人類的心靈在哪方面像一朵花？", "bodyZh": "以下文字出自 Ezra Pound 1909 年根據 Marcantonio Flaminio 作品所寫的詩作〈Hymn III〉。\n如同一朵柔弱而可愛的花，若有露水與雨水引它生長，便在滋養它的大地胸懷上舒展閃亮的葉子；\n我柔嫩的心靈也是如此茁壯，若它得到滋養之靈甘甜露水的餵養，\n缺少了這些，它便立刻開始枯萎，正如一朵生在乾土上的小花，若無露水與雨水照料它。", "opts": {"A": "It becomes increasingly vigorous with the passage of time.", "B": "It draws strength from changes in the weather.", "C": "It requires proper nourishment in order to thrive.", "D": "It perseveres despite challenging circumstances."}, "optsZh": {"A": "它隨著時間推移變得越來越有活力。", "B": "它從天氣的變化中汲取力量。", "C": "它需要適當的養分才能茁壯成長。", "D": "它在艱困的環境中仍堅持不懈。"}, "answer": "C", "expl": "Like a flower that needs dew and rain, the mind flourishes only if 'fed' by the fostering spirit and languishes without it—it needs proper nourishment.", "explZh": "花需要露水與雨水，心靈也需要滋養的精神「餵養」才能茁壯，缺少了就會枯萎，所以兩者都需要適當的滋養。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Poetry inference: analogy for nourishment.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪個選項最能有效運用文字、表格、圖表或研究中的證據？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，卻經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調，她的關愛是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She lacks affection for her family.", "B": "She shows unusual maturity and self-command.", "C": "She is admired mainly for her wealth.", "D": "She refuses to give advice to others."}, "optsZh": {"A": "她對家人缺乏感情。", "B": "她展現出不尋常的成熟與自制力。", "C": "她受人敬佩主要是因為她的財富。", "D": "她拒絕給別人建議。"}, "answer": "B", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Poetry inference: analogy for nourishment.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪個選項最能有效運用文字、表格、圖表或研究中的證據？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在一本回憶錄中，一個孩子注意到，她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強迫。", "opts": {"A": "The grandmother's influence is quiet but substantial.", "B": "The family ignores the grandmother's opinions.", "C": "The narrator thinks patience is useless.", "D": "The grandmother avoids family matters entirely."}, "optsZh": {"A": "祖母的影響力低調但深遠。", "B": "這家人忽視祖母的意見。", "C": "敘述者認為耐心毫無用處。", "D": "祖母完全不過問家中事務。"}, "answer": "A", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Poetry inference: analogy for nourishment.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪個選項最能有效運用文字、表格、圖表或研究中的證據？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。一則故事描寫一位職員，他會注意到帳簿中別人已經核准過的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The business fails because of excessive caution.", "B": "The clerk intentionally creates errors.", "C": "The coworkers are more accurate than the clerk.", "D": "The clerk's carefulness is valuable despite being inconvenient."}, "optsZh": {"A": "這家店因過度謹慎而經營失敗。", "B": "這位職員故意製造錯誤。", "C": "同事們比這位職員更精確。", "D": "這位職員的細心雖然造成不便，卻很有價值。"}, "answer": "D", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Poetry inference: analogy for nourishment.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measure\" target=\"_blank\" rel=\"noopener\" data-w=\"measure\" data-pos=\"v.\" data-en=\"to find the size, amount, or degree of something\" data-zh=\"測量\">measure<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪個選項最能有效運用文字、表格、圖表或研究中的證據？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。一段文字敘述，一位村莊領袖在做決定之前會聆聽每一位發言者，即使答案似乎顯而易見。敘述者暗示，這個習慣讓會議進行得較慢，卻能避免那些原本可能覺得自己被忽視的人心生怨恨。", "opts": {"A": "The leader values inclusive deliberation.", "B": "The leader makes decisions without hearing others.", "C": "The leader is unable to reach conclusions.", "D": "The leader dislikes public meetings."}, "optsZh": {"A": "這位領導人重視兼容並蓄的審議討論。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人無法做出結論。", "D": "這位領導人不喜歡公開會議。"}, "answer": "A", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Poetry inference: analogy for nourishment.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "Which choice most effectively uses evidence from the text, table, graph, or study?", "stemZh": "哪個選項最能有效運用文字、表格、圖表或研究中的證據？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n在一段節選中，一位科學家被描述為對學生慷慨大方，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，然而在每一項測量都經過檢查之前，她絕不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She publishes claims before testing them.", "C": "She combines intellectual openness with rigorous standards.", "D": "She avoids working with students."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她在驗證主張之前就將其發表。", "C": "她兼具開放的求知態度與嚴謹的標準。", "D": "她避免與學生共事。"}, "answer": "C", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Reading Detail: character preference.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Jack London&#x27;s 1903 novel The Call of the Wild. Buck is a sled dog living with John Thornton in Yukon, Canada.<br><br>Thornton alone held [Buck]. The rest of mankind was as nothing. Chance travellers might praise or pet him; but he was cold under it all, and from a too <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=demonstrative\" target=\"_blank\" rel=\"noopener\" data-w=\"demonstrative\" data-pos=\"adj.\" data-en=\"showing feelings openly\" data-zh=\"情感外露的\">demonstrative<\/a> man he would get up and walk away. When Thornton&#x27;s partners, Hans and Pete, arrived on the long-expected raft, Buck refused to notice them till he learned they were close to Thornton; after that he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tolerate\" target=\"_blank\" rel=\"noopener\" data-w=\"tolerate\" data-pos=\"v.\" data-en=\"to accept something unpleasant without complaint\" data-zh=\"容忍\">tolerated<\/a> them in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=passive\" target=\"_blank\" rel=\"noopener\" data-w=\"passive\" data-pos=\"adj.\" data-en=\"accepting without active response\" data-zh=\"被動的；消極的\">passive<\/a> sort of way, accepting favors from them as though he favored them by accepting.", "bodyPlain": "The following text is adapted from Jack London's 1903 novel The Call of the Wild. Buck is a sled dog living with John Thornton in Yukon, Canada.\n\nThornton alone held [Buck]. The rest of mankind was as nothing. Chance travellers might praise or pet him; but he was cold under it all, and from a too demonstrative man he would get up and walk away. When Thornton's partners, Hans and Pete, arrived on the long-expected raft, Buck refused to notice them till he learned they were close to Thornton; after that he tolerated them in a passive sort of way, accepting favors from them as though he favored them by accepting.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪個選項最能說明這段文字的主旨？", "bodyZh": "以下文字改寫自 Jack London 1903 年的小說《The Call of the Wild》。Buck 是一隻雪橇犬，和 John Thornton 一起住在加拿大的育空地區。\n只有 Thornton 能留住（Buck）。其他人類對牠來說都不算什麼。偶然路過的旅人也許會稱讚或撫摸牠；但牠對這一切都很冷淡，而遇到過於熱情的人，牠就會起身走開。當 Thornton 的夥伴 Hans 和 Pete 搭著期待已久的木筏抵達時，Buck 起初不理會他們，直到牠得知他們和 Thornton 很親近；從那之後，牠以一種消極的方式容忍他們，接受他們的好意時，彷彿是牠接受了才算是給他們面子。", "opts": {"A": "Buck has become less social since he began living with Thornton.", "B": "Buck mistrusts humans and does his best to avoid them.", "C": "Buck has been especially well liked by most of Thornton's friends.", "D": "Buck holds Thornton in higher regard than any other person."}, "optsZh": {"A": "Buck 自從開始和 Thornton 一起生活後，變得比較不合群。", "B": "Buck 不信任人類，並盡力避開他們。", "C": "Buck 特別受到 Thornton 大多數朋友的喜愛。", "D": "Buck 對 Thornton 的敬重高於其他任何人。"}, "answer": "D", "expl": "'Thornton alone held [Buck]. The rest of mankind was as nothing'—Buck values Thornton above everyone else.", "explZh": "「只有 Thornton 能留住 Buck，其他人對牠而言什麼都不是」——Buck 看重 Thornton 勝過任何人。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Reading Detail: character preference.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。一部十九世紀的小說描寫一位年僅十八歲的年輕女子，卻經常為年長的親戚出主意，因為在別人衝動行事時，她總能保持冷靜。敘述者強調，她的關愛是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She refuses to give advice to others.", "B": "She shows unusual maturity and self-command.", "C": "She lacks affection for her family.", "D": "She is admired mainly for her wealth."}, "optsZh": {"A": "她拒絕給別人建議。", "B": "她展現出不尋常的成熟與自制力。", "C": "她對家人缺乏感情。", "D": "她受人敬佩主要是因為她的財富。"}, "answer": "B", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Reading Detail: character preference.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother&#x27;s authority comes from patience rather than force.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在一本回憶錄中，一個孩子注意到，她的祖母在家庭爭執時很少開口，但當她終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而非強迫。", "opts": {"A": "The narrator thinks patience is useless.", "B": "The family ignores the grandmother's opinions.", "C": "The grandmother avoids family matters entirely.", "D": "The grandmother's influence is quiet but substantial."}, "optsZh": {"A": "敘述者認為耐心毫無用處。", "B": "這家人忽視祖母的意見。", "C": "祖母完全不過問家中事務。", "D": "祖母的影響力低調但深遠。"}, "answer": "D", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "12.3", "label": "Mock 12.3", "n": 12, "concept": "Reading Detail: character preference.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。一則故事描寫一位職員，他會注意到帳簿中別人已經核准過的微小錯誤。雖然他的同事有時覺得他的謹慎令人厭煩，但敘述者說，這家公司正是因為他的精確才得以生存。", "opts": {"A": "The business fails because of excessive caution.", "B": "The coworkers are more accurate than the clerk.", "C": "The clerk intentionally creates errors.", "D": "The clerk's carefulness is valuable despite being inconvenient."}, "optsZh": {"A": "這家店因過度謹慎而經營失敗。", "B": "同事們比這位職員更精確。", "C": "這位職員故意製造錯誤。", "D": "這位職員的細心雖然造成不便，卻很有價值。"}, "answer": "D", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Reading Detail: character preference.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measure\" target=\"_blank\" rel=\"noopener\" data-w=\"measure\" data-pos=\"v.\" data-en=\"to find the size, amount, or degree of something\" data-zh=\"測量\">measure<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "Which choice best states the main id
