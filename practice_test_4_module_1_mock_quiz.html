nteraction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The poet foregrounded his bilingual upbringing. He published essays about <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translation\" target=\"_blank\" rel=\"noopener\" data-w=\"translation\" data-pos=\"n.\" data-en=\"text changed from one language into another\" data-zh=\"翻譯；譯本\">translation<\/a>. ______ he moved between Spanish and English within many of his poems.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The poet foregrounded his bilingual upbringing. He published essays about translation. ______ he moved between Spanish and English within many of his poems.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位詩人突顯了他的雙語成長背景。他發表了關於翻譯的散文。______ 他在許多詩作中於西班牙文與英文之間來回切換。", "opts": {"A": "Consequently,", "B": "By contrast,", "C": "Regardless,", "D": "In addition,"}, "optsZh": {"A": "Consequently,（因此：表因果結果）", "B": "By contrast,（相較之下：表對比）", "C": "Regardless,（無論如何：表不受前述影響）", "D": "In addition,（此外：表補充另一個例子，正確）"}, "answer": "D", "expl": "In addition introduces another example.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Transitions: result or inference.", "vocab": false, "body": "In 2019, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> Patricia Jurado Gonzalez and food <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Nawal Nasrallah prepared a stew from a 4,000-year-old recipe found on a Mesopotamian clay tablet. When they tasted the dish, known as pasrutum (&quot;unwinding&quot;), they found that it had a mild taste and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspire\" target=\"_blank\" rel=\"noopener\" data-w=\"inspire\" data-pos=\"v.\" data-en=\"to give someone the idea or desire to do something\" data-zh=\"啟發\">inspired<\/a> a sense of calm. _______ the researchers, knowing that dishes were sometimes named after their intended effects, theorized that the dish&#x27;s name, &quot;unwinding,&quot; referred to its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=function\" target=\"_blank\" rel=\"noopener\" data-w=\"function\" data-pos=\"n.\" data-en=\"the purpose or role of something\" data-zh=\"功能；作用\">function<\/a>: to help ancient diners relax.", "bodyPlain": "In 2019, researcher Patricia Jurado Gonzalez and food historian Nawal Nasrallah prepared a stew from a 4,000-year-old recipe found on a Mesopotamian clay tablet. When they tasted the dish, known as pasrutum (\"unwinding\"), they found that it had a mild taste and inspired a sense of calm. _______ the researchers, knowing that dishes were sometimes named after their intended effects, theorized that the dish's name, \"unwinding,\" referred to its function: to help ancient diners relax.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "2019 年，研究人員 Patricia Jurado Gonzalez 與飲食史學家 Nawal Nasrallah 依照一塊美索不達米亞泥板上一份有四千年歷史的食譜，做出了一道燉菜。當她們品嚐這道名為 pasrutum（意為「放鬆」）的菜餚時，發現它味道溫和，並令人產生平靜的感覺。_______ 研究人員知道菜餚有時會以其預期效果來命名，於是推論這道菜的名稱「放鬆」指的是它的功能：幫助古代用餐者放鬆。", "opts": {"A": "Therefore,", "B": "Alternately,", "C": "Nevertheless,", "D": "Likewise,"}, "optsZh": {"A": "Therefore,（因此：表結果或推論）", "B": "Alternately,（輪流地；交替地：不表結果或推論）", "C": "Nevertheless,（儘管如此：表讓步轉折）", "D": "Likewise,（同樣地：表類比或相似）"}, "answer": "A", "expl": "Based on the calming taste, the researchers concluded the name referred to the dish's function—an inference, so 'Therefore.'", "explZh": "根據這道菜令人放鬆的味道，研究者推論菜名指的是它的功能，這是推論結果，所以用「Therefore」（因此）。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Transitions: result or inference.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The tea was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> served before sleep, and modern chemical analysis found compounds associated with relaxation. ______ researchers proposed that its name, &#x27;night rest,&#x27; referred to its intended calming effect.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The tea was traditionally served before sleep, and modern chemical analysis found compounds associated with relaxation. ______ researchers proposed that its name, 'night rest,' referred to its intended calming effect.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。這種茶傳統上在睡前飲用，而現代化學分析發現了與放鬆相關的化合物。______ 研究人員提出，它的名稱「夜間安歇」指的是它預期的鎮靜效果。", "opts": {"A": "Nevertheless,", "B": "Likewise,", "C": "Therefore,", "D": "Alternately,"}, "optsZh": {"A": "Nevertheless,（儘管如此：表讓步轉折）", "B": "Likewise,（同樣地：表類比或相似）", "C": "Therefore,（因此：表結果或推論）", "D": "Alternately,（輪流地；交替地：不表結果或推論）"}, "answer": "C", "expl": "Therefore introduces the inference.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Transitions: result or inference.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. The instrument produced a low, steady tone that listeners described as soothing. ______ the team suggested that ancient performers may have used it during healing ceremonies.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The instrument produced a low, steady tone that listeners described as soothing. ______ the team suggested that ancient performers may have used it during healing ceremonies.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。這種樂器發出低沉而穩定的音調，聽眾形容它令人感到舒緩。______ 研究團隊認為，古代的演奏者可能在療癒儀式中使用它。", "opts": {"A": "However,", "B": "Consequently,", "C": "Instead,", "D": "Similarly,"}, "optsZh": {"A": "However,（然而：表轉折）", "B": "Consequently,（因此：表因果結果）", "C": "Instead,（反而；取而代之：表替代）", "D": "Similarly,（同樣地：表類比或相似）"}, "answer": "B", "expl": "Consequently signals a conclusion from evidence.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Transitions: result or inference.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The plant&#x27;s leaves close when touched, and early farmers called it &#x27;the shy herb.&#x27; ______ botanists suspect that the name refers to this visible movement.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The plant's leaves close when touched, and early farmers called it 'the shy herb.' ______ botanists suspect that the name refers to this visible movement.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這種植物的葉子被觸碰時會合起來，早期的農民稱它為「害羞的草」。______ 植物學家推測，這個名稱指的就是這種肉眼可見的動作。", "opts": {"A": "Likewise,", "B": "Nevertheless,", "C": "Alternatively,", "D": "For this reason,"}, "optsZh": {"A": "Likewise,（同樣地：表類比或相似）", "B": "Nevertheless,（儘管如此：表讓步轉折）", "C": "Alternatively,（或者：表另一種選擇）", "D": "For this reason,（因為這個原因：表結果或推論，正確）"}, "answer": "D", "expl": "For this reason links evidence to inference.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Transitions: result or inference.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The bread contained honey and aromatic seeds, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingredient\" target=\"_blank\" rel=\"noopener\" data-w=\"ingredient\" data-pos=\"n.\" data-en=\"one of the foods used to make a dish\" data-zh=\"成分；原料\">ingredients<\/a> associated with festival foods. ______ food historians argued that it was probably prepared for celebrations.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The bread contained honey and aromatic seeds, ingredients associated with festival foods. ______ food historians argued that it was probably prepared for celebrations.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。這種麵包含有蜂蜜和芳香的種子，而這些都是與節慶食物有關的食材。______ 飲食史學家主張，它很可能是為慶典準備的。", "opts": {"A": "Therefore,", "B": "Similarly,", "C": "Regardless,", "D": "In contrast,"}, "optsZh": {"A": "Therefore,（因此：表結果或推論）", "B": "Similarly,（同樣地：表類比或相似）", "C": "Regardless,（無論如何：表不受前述影響）", "D": "In contrast,（相反地：表對比）"}, "answer": "A", "expl": "Therefore presents the conclusion.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Transitions: result or inference.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The bowl&#x27;s interior showed traces of blue pigment, and blue dyes were often used in mourning rituals. ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> proposed that the bowl had a funerary purpose.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The bowl's interior showed traces of blue pigment, and blue dyes were often used in mourning rituals. ______ archaeologists proposed that the bowl had a funerary purpose.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這個碗的內側有藍色顏料的痕跡，而藍色染料常用於哀悼儀式。______ 考古學家提出，這個碗具有喪葬用途。", "opts": {"A": "Likewise,", "B": "Nevertheless,", "C": "Alternatively,", "D": "As a result,"}, "optsZh": {"A": "Likewise,（同樣地：表類比或相似）", "B": "Nevertheless,（儘管如此：表讓步轉折）", "C": "Alternatively,（或者：表另一種選擇）", "D": "As a result,（因此；結果：表結果）"}, "answer": "D", "expl": "As a result connects evidence to a conclusion.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: emphasize a difference.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Chemical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=leavening\" target=\"_blank\" rel=\"noopener\" data-w=\"leavening\" data-pos=\"adj.\" data-en=\"making dough or batter rise\" data-zh=\"發酵的；膨鬆的\">leavening<\/a> agents cause carbon dioxide to be released within a liquid batter, making the batter rise as it bakes.<br>- Baking soda and baking powder are chemical leavening agents.<br>- Baking soda is pure sodium bicarbonate.<br>- To produce carbon dioxide, baking soda needs to be mixed with liquid and an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=acidic\" target=\"_blank\" rel=\"noopener\" data-w=\"acidic\" data-pos=\"adj.\" data-en=\"containing acid\" data-zh=\"酸性的\">acidic<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingredient\" target=\"_blank\" rel=\"noopener\" data-w=\"ingredient\" data-pos=\"n.\" data-en=\"one of the foods used to make a dish\" data-zh=\"成分；原料\">ingredient<\/a> such as honey.<br>- Baking powder is a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mixture\" target=\"_blank\" rel=\"noopener\" data-w=\"mixture\" data-pos=\"n.\" data-en=\"a combination of different things\" data-zh=\"混合物\">mixture<\/a> of sodium bicarbonate and an acid.<br>- To produce carbon dioxide, baking powder needs to be mixed with liquid but not with an acidic ingredient.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Chemical leavening agents cause carbon dioxide to be released within a liquid batter, making the batter rise as it bakes.\n- Baking soda and baking powder are chemical leavening agents.\n- Baking soda is pure sodium bicarbonate.\n- To produce carbon dioxide, baking soda needs to be mixed with liquid and an acidic ingredient such as honey.\n- Baking powder is a mixture of sodium bicarbonate and an acid.\n- To produce carbon dioxide, baking powder needs to be mixed with liquid but not with an acidic ingredient.", "stem": "The student wants to emphasize a difference between baking soda and baking powder. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調小蘇打和泡打粉之間的一項差異。哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n－ 化學膨鬆劑會使二氧化碳在液態麵糊中釋放出來，讓麵糊在烘烤時膨脹。\n－ 小蘇打和泡打粉都是化學膨鬆劑。\n－ 小蘇打是純的碳酸氫鈉。\n－ 要產生二氧化碳，小蘇打需要與液體及蜂蜜之類的酸性食材混合。\n－ 泡打粉是碳酸氫鈉與一種酸的混合物。\n－ 要產生二氧化碳，泡打粉需要與液體混合，但不需要酸性食材。", "opts": {"A": "To make batters rise, bakers use chemical leavening agents such as baking soda and baking powder.", "B": "Baking soda and baking powder are chemical leavening agents that, when mixed with other ingredients, cause carbon dioxide to be released within a batter.", "C": "Baking soda is pure sodium bicarbonate, and honey is a type of acidic ingredient.", "D": "To produce carbon dioxide within a liquid batter, baking soda needs to be mixed with an acidic ingredient, whereas baking powder does not."}, "optsZh": {"A": "為了讓麵糊膨脹，烘焙師會使用小蘇打和泡打粉等化學膨鬆劑。", "B": "小蘇打和泡打粉都是化學膨鬆劑，與其他材料混合後，會使麵糊中釋放出二氧化碳。", "C": "小蘇打是純碳酸氫鈉，而蜂蜜是一種酸性食材。", "D": "要在液態麵糊中產生二氧化碳，小蘇打需要與酸性食材混合，而泡打粉則不需要。"}, "answer": "D", "expl": "Only this choice contrasts the two agents: baking soda needs an acidic ingredient, whereas baking powder does not.", "explZh": "只有這個選項以 whereas 對比兩者：小蘇打需要加酸性成分，泡打粉則不需要。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: emphasize a difference.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Both yeast and baking powder make dough rise; yeast is a living organism; yeast produces carbon dioxide slowly as it consumes sugars; baking powder is a chemical mixture; baking powder releases carbon dioxide quickly when moistened and heated; the goal is to emphasize a difference.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Both yeast and baking powder make dough rise; yeast is a living organism; yeast produces carbon dioxide slowly as it consumes sugars; baking powder is a chemical mixture; baking powder releases carbon dioxide quickly when moistened and heated; the goal is to emphasize a difference.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。筆記：酵母和泡打粉都能讓麵團膨脹；酵母是一種活的生物；酵母在消耗糖分時會緩慢產生二氧化碳；泡打粉是一種化學混合物；泡打粉在受潮和加熱時會迅速釋放二氧化碳；目標是強調兩者的差異。", "opts": {"A": "Yeast and baking powder affect the texture of baked goods.", "B": "Yeast and baking powder can both make dough rise.", "C": "Yeast produces carbon dioxide slowly as it consumes sugars, whereas baking powder releases carbon dioxide quickly when moistened and heated.", "D": "Baking powder is a chemical mixture used in many recipes."}, "optsZh": {"A": "酵母和泡打粉會影響烘焙食品的口感。", "B": "酵母和泡打粉都能使麵團膨脹。", "C": "酵母在消耗糖分時會緩慢產生二氧化碳，而泡打粉在受潮和加熱時會迅速釋放二氧化碳。", "D": "泡打粉是一種用於許多食譜的化學混合物。"}, "answer": "C", "expl": "The answer directly contrasts the two leavening agents.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: emphasize a difference.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. Notes: Solar panels and wind turbines both produce electricity without burning fuel; solar panels generate electricity from sunlight; wind turbines generate electricity from moving air; the goal is to emphasize a difference.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Solar panels and wind turbines both produce electricity without burning fuel; solar panels generate electricity from sunlight; wind turbines generate electricity from moving air; the goal is to emphasize a difference.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。筆記：太陽能板和風力發電機都能在不燃燒燃料的情況下發電；太陽能板利用陽光發電；風力發電機利用流動的空氣發電；目標是強調兩者的差異。", "opts": {"A": "Solar panels and wind turbines can reduce reliance on fossil fuels.", "B": "Solar panels and wind turbines both produce electricity.", "C": "Solar panels generate electricity from sunlight, whereas wind turbines generate electricity from moving air.", "D": "Many communities use both solar panels and wind turbines."}, "optsZh": {"A": "太陽能板和風力發電機可以減少對化石燃料的依賴。", "B": "太陽能板和風力發電機都能發電。", "C": "太陽能板利用陽光發電，而風力發電機利用流動的空氣發電。", "D": "許多社區同時使用太陽能板和風力發電機。"}, "answer": "C", "expl": "The answer highlights the different energy sources.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: emphasize a difference.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: Frogs and salamanders are amphibians; most adult frogs lack tails; adult salamanders usually have tails; frogs often move by jumping; salamanders usually move by walking or swimming; the goal is to emphasize a difference.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Frogs and salamanders are amphibians; most adult frogs lack tails; adult salamanders usually have tails; frogs often move by jumping; salamanders usually move by walking or swimming; the goal is to emphasize a difference.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。筆記：青蛙和蠑螈都是兩棲動物；大多數成年青蛙沒有尾巴；成年蠑螈通常有尾巴；青蛙常以跳躍方式移動；蠑螈通常以爬行或游泳方式移動；目標是強調兩者的差異。", "opts": {"A": "Frogs and salamanders are both amphibians.", "B": "Amphibians can live in wet environments.", "C": "Some frogs and salamanders lay eggs in water.", "D": "Most adult frogs lack tails and often jump, whereas adult salamanders usually have tails and typically walk or swim."}, "optsZh": {"A": "青蛙和蠑螈都是兩棲動物。", "B": "兩棲動物可以生活在潮濕的環境中。", "C": "有些青蛙和蠑螈在水中產卵。", "D": "大多數成年青蛙沒有尾巴且經常跳躍，而成年蠑螈通常有尾巴，一般以行走或游泳的方式移動。"}, "answer": "D", "expl": "The answer contrasts physical and movement differences.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: emphasize a difference.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Oil paint and watercolor are painting media; oil paint dries slowly and can be layered thickly; watercolor dries quickly and is usually translucent; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> a difference.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Oil paint and watercolor are painting media; oil paint dries slowly and can be layered thickly; watercolor dries quickly and is usually translucent; the goal is to emphasize a difference.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。筆記：油畫顏料和水彩都是繪畫媒材；油畫顏料乾得慢，可以厚厚地層層堆疊；水彩乾得快，通常是半透明的；目標是強調兩者的差異。", "opts": {"A": "Oil paint dries slowly and can be layered thickly, whereas watercolor dries quickly and is usually translucent.", "B": "Oil paint and watercolor are both painting media.", "C": "Oil paint and watercolor have been used by many artists.", "D": "Paintings can be made with many different materials."}, "optsZh": {"A": "油畫顏料乾得慢，可以厚厚地層層堆疊，而水彩乾得快，通常是半透明的。", "B": "油畫顏料和水彩都是繪畫媒材。", "C": "油畫顏料和水彩已被許多藝術家使用。", "D": "繪畫可以用許多不同的材料製作。"}, "answer": "A", "expl": "The answer emphasizes the contrast between the media.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: emphasize a difference.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Comets and asteroids orbit the Sun; comets contain ice that can form tails near the Sun; asteroids are mostly rocky or metallic; the goal is to emphasize a difference.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Comets and asteroids orbit the Sun; comets contain ice that can form tails near the Sun; asteroids are mostly rocky or metallic; the goal is to emphasize a difference.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n筆記：彗星和小行星都繞著太陽運行；彗星含有冰，在靠近太陽時會形成彗尾；小行星大多是岩質或金屬質的；目標是強調兩者的差異。", "opts": {"A": "Asteroids can be found in the asteroid belt.", "B": "Although comets and asteroids both orbit the Sun, comets contain ice that can form tails, whereas asteroids are mostly rocky or metallic.", "C": "Both comets and asteroids are objects in the solar system.", "D": "Comets sometimes become visible from Earth."}, "optsZh": {"A": "在小行星帶中可以找到小行星。", "B": "雖然彗星和小行星都繞著太陽運行，但彗星含有能形成彗尾的冰，而小行星則主要由岩石或金屬構成。", "C": "彗星和小行星都是太陽系中的天體。", "D": "彗星有時會從地球上變得可見。"}, "answer": "B", "expl": "The answer directly states the difference.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: describe an artwork to an unfamiliar audience.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Soo Sunny Park is a Korean American artist who uses light as her primary <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=medium\" target=\"_blank\" rel=\"noopener\" data-w=\"medium\" data-pos=\"n.\" data-en=\"a material or method used to create art\" data-zh=\"媒材；媒介\">medium<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expression\" target=\"_blank\" rel=\"noopener\" data-w=\"expression\" data-pos=\"n.\" data-en=\"the showing of feelings or ideas\" data-zh=\"表達\">expression<\/a>.<br>- She created her work Unwoven Light in 2013.<br>- Unwoven Light featured a chain-link fence fitted with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=iridescent\" target=\"_blank\" rel=\"noopener\" data-w=\"iridescent\" data-pos=\"adj.\" data-en=\"showing changing rainbow colors\" data-zh=\"彩虹色的；閃光的\">iridescent<\/a> plexiglass tiles.<br>- When light passed through the fence, colorful prisms formed.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Soo Sunny Park is a Korean American artist who uses light as her primary medium of expression.\n- She created her work Unwoven Light in 2013.\n- Unwoven Light featured a chain-link fence fitted with iridescent plexiglass tiles.\n- When light passed through the fence, colorful prisms formed.", "stem": "The student wants to describe Unwoven Light to an audience unfamiliar with Soo Sunny Park. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向不熟悉 Soo Sunny Park 的讀者介紹 Unwoven Light。哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n－ Soo Sunny Park 是一位韓裔美國藝術家，以光作為她主要的表現媒材。\n－ 她在 2013 年創作了作品《Unwoven Light》。\n－ 《Unwoven Light》以一道裝有虹彩壓克力板的鐵絲網圍籬為特色。\n－ 當光線穿過圍籬時，就形成了繽紛的稜鏡光彩。", "opts": {"A": "Park's 2013 installation Unwoven Light, which included a chain-link fence and iridescent tiles made from plexiglass, featured light as its primary medium of expression.", "B": "Korean American light artist Soo Sunny Park created Unwoven Light in 2013.", "C": "The chain-link fence in Soo Sunny Park's Unwoven Light was fitted with tiles made from iridescent plexiglass.", "D": "In Unwoven Light, a 2013 work by Korean American artist Soo Sunny Park, light formed colorful prisms as it passed through a fence Park had fitted with iridescent tiles."}, "optsZh": {"A": "Park 2013 年的裝置作品 Unwoven Light 包含一道鐵絲網圍欄和以壓克力製成的虹彩瓷磚，並以光作為主要的表現媒材。", "B": "韓裔美籍光藝術家 Soo Sunny Park 於 2013 年創作了 Unwoven Light。", "C": "Soo Sunny Park 的 Unwoven Light 中，鐵絲網圍欄上裝設了以虹彩壓克力製成的瓷磚。", "D": "在韓裔美籍藝術家 Soo Sunny Park 2013 年的作品 Unwoven Light 中，光線穿過 Park 裝上虹彩瓷磚的圍欄時，形成了繽紛的稜鏡光影。"}, "answer": "D", "expl": "For an unfamiliar audience, this choice introduces Park (a Korean American artist) and describes what the work does.", "explZh": "對不認識 Park 的讀者，這個選項介紹了她的身分（韓裔美籍藝術家），並具體描述作品的效果。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: describe an artwork to an unfamiliar audience.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> measurements with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Artist Lila Chen created Glass Orchard in 2020; the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a> used suspended glass disks; moving spotlights passed through the disks; colored circles appeared on the gallery walls; the audience is unfamiliar with Chen; the goal is to describe the work.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Artist Lila Chen created Glass Orchard in 2020; the installation used suspended glass disks; moving spotlights passed through the disks; colored circles appeared on the gallery walls; the audience is unfamiliar with Chen; the goal is to describe the work.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。筆記：藝術家 Lila Chen 在 2020 年創作了《Glass Orchard》；這件裝置作品使用了懸吊的玻璃圓片；移動的聚光燈穿過這些圓片；彩色的圓形出現在展廳牆面上；讀者不熟悉 Chen；目標是描述這件作品。", "opts": {"A": "In Glass Orchard, a 2020 installation by artist Lila Chen, moving light passed through suspended glass disks and cast colored circles on the gallery walls.", "B": "Lila Chen is an artist who created Glass Orchard in 2020.", "C": "Glass Orchard included suspended glass disks and moving spotlights.", "D": "The glass disks in Glass Orchard were suspended from the ceiling."}, "optsZh": {"A": "在藝術家 Lila Chen 2020 年的裝置作品 Glass Orchard 中，移動的光線穿過懸掛的玻璃圓盤，在展廳牆上投射出彩色的光圈。", "B": "Lila Chen 是一位藝術家，於 2020 年創作了 Glass Orchard。", "C": "Glass Orchard 包含懸掛的玻璃圓盤和移動的聚光燈。", "D": "Glass Orchard 中的玻璃圓盤懸掛在天花板上。"}, "answer": "A", "expl": "The answer names the artist and describes the work clearly for an unfamiliar audience.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: describe an artwork to an unfamiliar audience.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. Notes: Sculptor Mateo Ruiz made Tidal Loom in 2018; the work consisted of woven copper strips; small motors moved the strips slowly; the motion resembled waves; the audience is unfamiliar with Ruiz; the goal is to describe the work.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Sculptor Mateo Ruiz made Tidal Loom in 2018; the work consisted of woven copper strips; small motors moved the strips slowly; the motion resembled waves; the audience is unfamiliar with Ruiz; the goal is to describe the work.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。筆記：雕塑家 Mateo Ruiz 在 2018 年創作了《Tidal Loom》；這件作品由編織的銅條構成；小型馬達緩慢地帶動銅條；這種動態類似波浪；讀者不熟悉 Ruiz；目標是描述這件作品。", "opts": {"A": "Waves can be suggested through motion in sculpture.", "B": "Tidal Loom, a 2018 work by sculptor Mateo Ruiz, used slowly moving woven copper strips to create an effect resembling waves.", "C": "Tidal Loom included motors and copper strips.", "D": "Mateo Ruiz created Tidal Loom in 2018."}, "optsZh": {"A": "雕塑可以透過動態來表現波浪。", "B": "雕塑家 Mateo Ruiz 2018 年的作品 Tidal Loom 利用緩慢移動的編織銅條，創造出類似波浪的效果。", "C": "Tidal Loom 包含馬達和銅條。", "D": "Mateo Ruiz 於 2018 年創作了 Tidal Loom。"}, "answer": "B", "expl": "The answer gives enough context and describes the artwork.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: describe an artwork to an unfamiliar audience.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Notes: Photographer Amara Singh created Night Garden; the series shows city parks after rain; reflected streetlights make the paths appear luminous; the audience is unfamiliar with Singh; the goal is to describe the work.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Photographer Amara Singh created Night Garden; the series shows city parks after rain; reflected streetlights make the paths appear luminous; the audience is unfamiliar with Singh; the goal is to describe the work.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。筆記：攝影師 Amara Singh 創作了《Night Garden》；這個系列呈現雨後的城市公園；反射的路燈光使小徑看起來閃閃發亮；讀者不熟悉 Singh；目標是描述這件作品。", "opts": {"A": "Streetlights can reflect on wet surfaces.", "B": "In Night Garden, photographer Amara Singh depicts rain-soaked city parks whose paths glow with reflected streetlights.", "C": "Amara Singh is a photographer who made a series called Night Garden.", "D": "Night Garden shows parks at night."}, "optsZh": {"A": "街燈的光可以映在潮濕的表面上。", "B": "在 Night Garden 中，攝影師 Amara Singh 描繪了被雨水浸濕的城市公園，園中小徑映著街燈的反光而閃閃發亮。", "C": "Amara Singh 是一位攝影師，創作了名為 Night Garden 的系列作品。", "D": "Night Garden 呈現夜晚的公園。"}, "answer": "B", "expl": "The answer describes the work and identifies the artist.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: describe an artwork to an unfamiliar audience.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Artist Ren Ito created Paper Current in 2016; the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installation<\/a> used folded paper boats; fans moved the boats across shallow water; the audience is unfamiliar with Ito; the goal is to describe the work.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Artist Ren Ito created Paper Current in 2016; the installation used folded paper boats; fans moved the boats across shallow water; the audience is unfamiliar with Ito; the goal is to describe the work.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。筆記：藝術家 Ren Ito 在 2016 年創作了《Paper Current》；這件裝置作品使用了摺紙船；風扇推動紙船橫越淺水；讀者不熟悉 Ito；目標是描述這件作品。", "opts": {"A": "The installation used fans and folded paper boats.", "B": "Ren Ito made Paper Current in 2016.", "C": "Paper Current, a 2016 installation by artist Ren Ito, featured folded paper boats pushed by fans across shallow water.", "D": "Paper boats can float on shallow water."}, "optsZh": {"A": "這件裝置作品使用了風扇和摺紙船。", "B": "Ren Ito 於 2016 年創作了 Paper Current。", "C": "Paper Current 是藝術家 Ren Ito 於 2016 年創作的裝置作品，以風扇推動摺紙船在淺水上漂行。", "D": "紙船可以漂浮在淺水上。"}, "answer": "C", "expl": "The answer presents a clear description for new readers.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: describe an artwork to an unfamiliar audience.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Maya Brooks created Echo Wall; it used ceramic tiles and recorded voices; when visitors approached, the tiles vibrated softly; the audience is unfamiliar with Brooks; the goal is to describe the work.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Maya Brooks created Echo Wall; it used ceramic tiles and recorded voices; when visitors approached, the tiles vibrated softly; the audience is unfamiliar with Brooks; the goal is to describe the work.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n筆記：Maya Brooks 創作了《Echo Wall》；它使用了陶瓷磚與錄製的人聲；當參觀者靠近時，磁磚會輕輕振動；讀者不熟悉 Brooks；目標是描述這件作品。", "opts": {"A": "Maya Brooks works with sound and ceramics.", "B": "The tiles in Echo Wall vibrated.", "C": "Visitors could approach Echo Wall.", "D": "Echo Wall, by artist Maya Brooks, combined ceramic tiles and recorded voices so that the tiles vibrated softly when visitors approached."}, "optsZh": {"A": "Maya Brooks 以聲音和陶瓷進行創作。", "B": "Echo Wall 中的瓷磚會振動。", "C": "參觀者可以走近 Echo Wall。", "D": "藝術家 Maya Brooks 的 Echo Wall 結合了陶瓷磚與錄製的人聲，當參觀者走近時，瓷磚會輕輕振動。"}, "answer": "D", "expl": "The answer gives a complete description of the work.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: present research to an unfamiliar audience.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Cambodia&#x27;s Angkor Wat was built in the 1100s to honor the Hindu god Vishnu.<br>- It has been a Buddhist temple since the sixteenth century.<br>- Decorrelation stretch analysis is a novel digital <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=image\" target=\"_blank\" rel=\"noopener\" data-w=\"image\" data-pos=\"n.\" data-en=\"a picture; a picture formed in the mind by words\" data-zh=\"圖像；意象\">imaging<\/a> technique that enhances the contrast between colors in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photograph<\/a>.<br>- Archaeologist Noel Hidalgo Tan applied decorrelation stretch analysis to photographs he had taken of Angkor Wat&#x27;s plaster walls.<br>- Tan&#x27;s analysis <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> hundreds of images unknown to researchers.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Cambodia's Angkor Wat was built in the 1100s to honor the Hindu god Vishnu.\n- It has been a Buddhist temple since the sixteenth century.\n- Decorrelation stretch analysis is a novel digital imaging technique that enhances the contrast between colors in a photograph.\n- Archaeologist Noel Hidalgo Tan applied decorrelation stretch analysis to photographs he had taken of Angkor Wat's plaster walls.\n- Tan's analysis revealed hundreds of images unknown to researchers.", "stem": "The student wants to present Tan's research to an audience unfamiliar with Angkor Wat. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想向不熟悉 Angkor Wat 的讀者介紹 Tan 的研究。哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在研究某個主題時，一位學生做了以下筆記：\n－ 柬埔寨的吳哥窟（Angkor Wat）建於 1100 年代，用以供奉印度教神祇毗濕奴。\n－ 自十六世紀以來，它一直是一座佛教寺廟。\n－ 去相關延展分析是一種新穎的數位影像技術，能增強照片中各顏色之間的對比。\n－ 考古學家 Noel Hidalgo Tan 將去相關延展分析應用於他所拍攝的吳哥窟灰泥牆面照片。\n－ Tan 的分析揭露了數百幅研究人員先前不知道的圖像。", "opts": {"A": "Tan photographed Angkor Wat's plaster walls and then applied decorrelation stretch analysis to the photographs.", "B": "Decorrelation stretch analysis is a novel digital imaging technique that Tan used to enhance the contrast between colors in a photograph.", "C": "Using a novel digital imaging technique, Tan revealed hundreds of images hidden on the walls of Angkor Wat, a Cambodian temple.", "D": "Built to honor a Hindu god before becoming a Buddhist temple, Cambodia's Angkor Wat concealed hundreds of images on its plaster walls."}, "optsZh": {"A": "Tan 拍攝了 Angkor Wat 的灰泥牆面，接著對這些照片進行去相關拉伸分析。", "B": "去相關拉伸分析是一種新穎的數位影像技術，Tan 用它來增強照片中各顏色之間的對比。", "C": "Tan 利用一種新穎的數位影像技術，揭示了柬埔寨寺廟 Angkor Wat 牆面上隱藏的數百幅圖像。", "D": "Cambodia 的 Angkor Wat 最初是為了供奉一位印度教神祇而建，後來才成為佛教寺廟，它的灰泥牆面上隱藏著數百幅圖像。"}, "answer": "C", "expl": "This choice explains what Angkor Wat is (a Cambodian temple) and summarizes Tan's method and finding.", "explZh": "這個選項說明 Angkor Wat 是什麼（柬埔寨的寺廟），並概述 Tan 的方法與發現。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: present research to an unfamiliar audience.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Historian Lina Ortega studied murals in an abandoned train station; she used infrared photography, a technique that can reveal covered paint layers; the station is in Valparaiso, Chile; Ortega discovered earlier sketches beneath the visible murals; the audience is unfamiliar with the station; the goal is to present the research.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Historian Lina Ortega studied murals in an abandoned train station; she used infrared photography, a technique that can reveal covered paint layers; the station is in Valparaiso, Chile; Ortega discovered earlier sketches beneath the visible murals; the audience is unfamiliar with the station; the goal is to present the research.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。筆記：歷史學家 Lina Ortega 研究了一座廢棄火車站裡的壁畫；她使用紅外線攝影，這是一種能揭露被覆蓋顏料層的技術；這座車站位於智利的 Valparaiso；Ortega 在可見的壁畫下方發現了較早的草圖；讀者不熟悉這座車站；目標是介紹這項研究。", "opts": {"A": "Infrared photography can reveal covered paint layers.", "B": "Using infrared photography, historian Lina Ortega discovered earlier sketches beneath murals in an abandoned train station in Valparaiso, Chile.", "C": "Ortega photographed the station walls and used infrared photography.", "D": "Valparaiso is a city in Chile with an abandoned train station."}, "optsZh": {"A": "紅外線攝影可以揭示被覆蓋的顏料層。", "B": "歷史學家 Lina Ortega 利用紅外線攝影，在 Chile 的 Valparaiso 一座廢棄火車站的壁畫底下發現了較早的素描。", "C": "Ortega 拍攝了車站的牆面，並使用了紅外線攝影。", "D": "Valparaiso 是 Chile 的一座城市，那裡有一座廢棄的火車站。"}, "answer": "B", "expl": "The answer introduces the place, method, researcher, and finding.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: present research to an unfamiliar audience.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. Notes: Archaeologist Devin Rao studied a temple in southern India; the temple was built in the ninth century; Rao used 3D laser scanning; the scan revealed faint inscriptions on interior columns; the audience is unfamiliar with the temple; the goal is to present the research.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Archaeologist Devin Rao studied a temple in southern India; the temple was built in the ninth century; Rao used 3D laser scanning; the scan revealed faint inscriptions on interior columns; the audience is unfamiliar with the temple; the goal is to present the research.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。筆記：考古學家 Devin Rao 研究了印度南部的一座寺廟；這座寺廟建於九世紀；Rao 使用了 3D 雷射掃描；掃描揭露了內部柱子上模糊的銘文；讀者不熟悉這座寺廟；目標是介紹這項研究。", "opts": {"A": "3D laser scanning can record surfaces in detail.", "B": "The temple was built in the ninth century.", "C": "Interior columns sometimes contain inscriptions.", "D": "Rao used 3D laser scanning to study a ninth-century temple in southern India and revealed faint inscriptions on its interior columns."}, "optsZh": {"A": "3D 雷射掃描可以詳細記錄物體表面。", "B": "這座神廟建於九世紀。", "C": "內部的柱子有時刻有銘文。", "D": "Rao 利用 3D 雷射掃描研究印度南部一座九世紀的神廟，揭示了其內部柱子上模糊的銘文。"}, "answer": "D", "expl": "The answer presents the site, method, and result.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: present research to an unfamiliar audience.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Marine <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> Sofia Mensah examined a shipwreck off Ghana&#x27;s coast; she used photogrammetry, a digital method that combines many photographs into a 3D model; the model revealed cargo spaces hidden under collapsed beams; the audience is unfamiliar with the shipwreck; the goal is to present the research.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Marine archaeologist Sofia Mensah examined a shipwreck off Ghana's coast; she used photogrammetry, a digital method that combines many photographs into a 3D model; the model revealed cargo spaces hidden under collapsed beams; the audience is unfamiliar with the shipwreck; the goal is to present the research.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。筆記：海洋考古學家 Sofia Mensah 考察了迦納外海的一艘沉船；她使用了攝影測量，這是一種將許多照片結合成 3D 模型的數位方法；這個模型揭露了被倒塌橫梁遮蓋的貨艙空間；讀者不熟悉這艘沉船；目標是介紹這項研究。", "opts": {"A": "Collapsed beams can hide parts of a shipwreck.", "B": "Mensah studied a shipwreck.", "C": "Photogrammetry combines many photographs into a 3D model.", "D": "Using photogrammetry, marine archaeologist Sofia Mensah created a 3D model of a shipwreck off Ghana's coast and identified cargo spaces hidden under collapsed beams."}, "optsZh": {"A": "倒塌的橫梁可能遮住沉船的某些部分。", "B": "Mensah 研究了一艘沉船。", "C": "攝影測量法把許多照片組合成 3D 模型。", "D": "海洋考古學家 Sofia Mensah 利用攝影測量法建立了 Ghana 外海一艘沉船的 3D 模型，並找出藏在倒塌橫梁下的貨艙空間。"}, "answer": "D", "expl": "The answer gives context, method, and discovery.", "explZh": ""}, {"id": "33.4", "label": "Mock 33.4", "n": 33, "concept": "Student Notes: present research to an unfamiliar audience.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Notes: Art historian Priya Nair studied a palace ceiling in Rajasthan; she used ultraviolet imaging; the imaging revealed floral designs covered by later paint; the audience is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=unfamiliar\" target=\"_blank\" rel=\"noopener\" data-w=\"unfamiliar\" data-pos=\"adj.\" data-en=\"not known or recognized\" data-zh=\"不熟悉的；陌生的\">unfamiliar<\/a> with the palace; the goal is to present the research.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Art historian Priya Nair studied a palace ceiling in Rajasthan; she used ultraviolet imaging; the imaging revealed floral designs covered by later paint; the audience is unfamiliar with the palace; the goal is to present the research.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。筆記：藝術史學家 Priya Nair 研究了拉賈斯坦邦一座宮殿的天花板；她使用了紫外線影像技術；影像揭露了被後來的油漆覆蓋的花卉圖案；讀者不熟悉這座宮殿；目標是介紹這項研究。", "opts": {"A": "Art historian Priya Nair used ultraviolet imaging to reveal floral designs hidden beneath later paint on a palace ceiling in Rajasthan.", "B": "Ultraviolet imaging can be used by art historians.", "C": "Later paint covered floral designs on the ceiling.", "D": "The palace ceiling is located in Rajasthan."}, "optsZh": {"A": "藝術史學者 Priya Nair 利用紫外線成像技術，揭示了 Rajasthan 一座宮殿天花板上被後來的油漆覆蓋的花卉圖案。", "B": "藝術史學者可以使用紫外線成像技術。", "C": "後來的油漆覆蓋了天花板上的花卉圖案。", "D": "這座宮殿的天花板位於 Rajasthan。"}, "answer": "A", "expl": "The answer presents the research in a complete sentence.", "explZh": ""}, {"id": "33.5", "label": "Mock 33.5", "n": 33, "concept": "Student Notes: present research to an unfamiliar audience.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. Notes: Geographer Omar Bell studied old maps of New Orleans; he used digital overlay software; the software aligned maps from different centuries; Bell identified streets that had disappeared after floods; the audience is unfamiliar with the maps; the goal is to present the research.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents
