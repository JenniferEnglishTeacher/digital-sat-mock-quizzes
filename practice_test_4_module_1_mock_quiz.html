project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The southern region was included in the survey.\nB) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nC) Some farmers grew vegetables, while others grew grain.\nD) The graph contains information about three regions.", "answer": "B", "explanation": "The answer uses a specific contrast in the data."}, {"id": "14.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) One rocky planet has a thin atmosphere.\nC) The method used to study stars requires a telescope.\nD) Some stars contain hydrogen and helium.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "14.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Many performers learned songs from relatives.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) The tradition is studied by scholars in several countries.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "14.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The program took place in a community.\nB) Both towns had some volunteers.\nC) The table includes more than one year.\nD) The program was associated with a clear increase in trained volunteers compared with the town without the program.", "answer": "D", "explanation": "The comparison supports the program's effect."}]}, {"n": 15, "concept": "Quantitative Evidence: table comparison.", "original": "Ablation Rates for Three Elements in Cosmic Dust, by Dust Source\nIron: SPC 20%, AST 28%, HTC 90%, OCC 98%.\nPotassium: SPC 44%, AST 74%, HTC 97%, OCC 100%.\nSodium: SPC 45%, AST 75%, HTC 99%, OCC 100%.\n\nEarth's atmosphere is bombarded by cosmic dust originating from several sources: short-period comets (SPCs), particles from the asteroid belt (ASTs), Halley-type comets (HTCs), and Oort cloud comets (OCCs). Some of the dust's material vaporizes in the atmosphere in a process called ablation, and the faster the particles move, the higher the rate of ablation. Astrophysicist Juan Diego Carrillo-Sanchez led a team that calculated average ablation rates for elements in the dust and showed that material in slower-moving SPC or AST dust has a lower rate than the same material in faster-moving HTC or OCC dust. For example, whereas the average ablation rate for iron from AST dust is 28%, the average rate for _______\n\nWhich choice most effectively uses data from the table to complete the example?\nA) iron from SPC dust is 20%.\nB) sodium from OCC dust is 100%.\nC) iron from HTC dust is 90%.\nD) sodium from AST dust is 75%.", "generated": [{"id": "15.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The administration faced economic challenges from the beginning.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "15.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The southern region was included in the survey.\nB) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nC) The graph contains information about three regions.\nD) Some farmers grew vegetables, while others grew grain.", "answer": "B", "explanation": "The answer uses a specific contrast in the data."}, {"id": "15.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The method used to study stars requires a telescope.\nB) One rocky planet has a thin atmosphere.\nC) Some stars contain hydrogen and helium.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "15.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Many performers learned songs from relatives.\nB) Some songs use a meter also found in older European poetry.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) The tradition is studied by scholars in several countries.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "15.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) The table includes more than one year.\nC) The program took place in a community.\nD) Both towns had some volunteers.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 16, "concept": "Command of Evidence: quotation illustrating a claim.", "original": "Art collectives, like the United States- and Vietnam-based collective The Propeller Group or Cuba's Los Carpinteros, are groups of artists who agree to work together: perhaps for stylistic reasons, or to advance certain shared political ideals, or to help mitigate the costs of supplies and studio space. Regardless of the reasons, art collectives usually involve some collaboration among the artists. Based on a recent series of interviews with various art collectives, an arts journalist claims that this can be difficult for artists who are often used to having sole control over their work.\n\nWhich quotation from the interviews best illustrates the journalist's claim?\nA) \"The first collective I joined included many amazingly talented artists, and we enjoyed each other's company, but because we had a hard time sharing credit and responsibility for our work, the collective didn't last.\"\nB) \"We work together, but that doesn't mean that individual projects are equally the work of all of us. Many of our projects are primarily the responsibility of whoever originally proposed the work to the group.\"\nC) \"Having worked as a member of a collective for several years, it's sometimes hard to recall what it was like to work alone without the collective's support. But that support encourages my individual expression rather than limits it.\"\nD) \"Sometimes an artist from outside the collective will choose to collaborate with us on a project, but all of those projects fit within the larger themes of the work the collective does on its own.\"", "generated": [{"id": "16.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader signed several decrees during his first month in office.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "16.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and y, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Many performers learned songs from relatives.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) Some songs use a meter also found in older European poetry.\nD) The tradition is studied by scholars in several countries.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "16.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Both towns had some volunteers.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The table includes more than one year.\nD) The program took place in a community.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 17, "concept": "Quantitative Evidence: surprising nonhost result.", "original": "Effects of Mycorrhizal Fungi on 3 Plant Species\nCorn: mycorrhizal host yes; average mass in soil with fungi 15.1 g; average mass in soil treated to kill fungi 3.8 g.\nMarigold: mycorrhizal host yes; average mass in soil with fungi 10.2 g; average mass in soil treated to kill fungi 2.4 g.\nBroccoli: mycorrhizal host no; average mass in soil with fungi 7.5 g; average mass in soil treated to kill fungi 7.0 g.\n\nMycorrhizal fungi in soil benefits many plants, substantially increasing the mass of some. A student conducted an experiment to illustrate this effect. The student chose three plant species for the experiment, including two that are mycorrhizal hosts and one nonmycorrhizal species. The student then grew several plants from each species both in soil containing mycorrhizal fungi and in soil that had been treated to kill mycorrhizal and other fungi. After several weeks, the student measured the plants' average mass and was surprised to discover that _______\n\nWhich choice most effectively uses data from the table to complete the statement?\nA) broccoli grown in soil containing mycorrhizal fungi had a slightly higher average mass than broccoli grown in soil that had been treated to kill fungi.\nB) corn grown in soil containing mycorrhizal fungi had a higher average mass than broccoli grown in soil containing mycorrhizal fungi.\nC) marigolds grown in soil containing mycorrhizal fungi had a much higher average mass than marigolds grown in soil that had been treated to kill fungi.\nD) corn had the highest average mass of all three species grown in soil that had been treated to kill fungi, while marigolds had the lowest.", "generated": [{"id": "17.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "17.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The graph contains information about three regions.\nB) Some farmers grew vegetables, while others grew grain.\nC) The southern region was included in the survey.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "17.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The method used to study stars requires a telescope.\nB) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nC) Some stars contain hydrogen and helium.\nD) One rocky planet has a thin atmosphere.", "answer": "B", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "17.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Some songs use a meter also found in older European poetry.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) Many performers learned songs from relatives.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "17.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The program took place in a community.\nB) The table includes more than one year.\nC) Both towns had some volunteers.\nD) The program was associated with a clear increase in trained volunteers compared with the town without the program.", "answer": "D", "explanation": "The comparison supports the program's effect."}]}, {"n": 18, "concept": "Logical Completion: evidence is not conclusive.", "original": "Several artworks found among the ruins of the ancient Roman city of Pompeii depict a female figure fishing with a cupid nearby. Some scholars have asserted that the figure is the goddess Venus, since she is known to have been linked with cupids in Roman culture, but University of Leicester archaeologist Carla Brain suggests that cupids may have also been associated with fishing generally. The fact that a cupid is shown near the female figure, therefore, _______\n\nWhich choice most logically completes the text?\nA) is not conclusive evidence that the figure is Venus.\nB) suggests that Venus was often depicted fishing.\nC) eliminates the possibility that the figure is Venus.\nD) would be difficult to account for if the figure is not Venus.", "generated": [{"id": "18.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A city policy requires landlords to disclose rent increases to tenants but allows those notices to remain unavailable to public agencies. Housing advocates warn that the policy may have the unintended effect of ______\n\nWhich choice most logically completes the text?\n\nA) encouraging landlords to repair apartments before raising rents.\nB) preventing tenants from discussing rent changes with one another.\nC) making it harder for officials to identify neighborhoods where rent increases are unusually severe.\nD) reducing tenants' interest in renewing leases.", "answer": "C", "explanation": "The concern is that confidentiality prevents outside evaluation."}, {"id": "18.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A grant program encourages pharmaceutical firms to partner with public hospitals but permits the firms to keep the terms of each research agreement confidential. Patient advocates argue that the rule could ______\n\nWhich choice most logically completes the text?\n\nA) make it difficult to determine whether hospitals are receiving fair compensation for the use of patient data.\nB) reduce the number of diseases that hospitals are able to study.\nC) require hospitals to publish every patient's medical history.\nD) prevent companies from profiting from successful drugs.", "answer": "A", "explanation": "The issue is the inability of outside observers to evaluate fairness."}, {"id": "18.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The new archive law requires museums to consult descendant communities before displaying cultural objects, but it allows museums to keep consultation agreements sealed. Some community leaders worry that this provision may ______\n\nWhich choice most logically completes the text?\n\nA) prevent curators from learning about the objects' cultural meanings.\nB) force museums to return every object in their collections.\nC) obscure whether communities actually have meaningful influence over display decisions.\nD) discourage museums from preserving fragile objects.", "answer": "C", "explanation": "Sealed agreements make accountability difficult."}, {"id": "18.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A fishing treaty requires corporations to compensate coastal villages for using traditional ecological knowledge, yet the treaty allows payment contracts to remain private. Critics argue that this privacy rule could ______\n\nWhich choice most logically completes the text?\n\nA) increase the number of fish caught by local crews.\nB) reduce villages' knowledge of marine species.\nC) stop companies from conducting ecological research.\nD) make it impossible for independent observers to judge whether compensation is equitable.", "answer": "D", "explanation": "Private contracts prevent independent assessment of equity."}, {"id": "18.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A university policy requires technology companies to compensate Indigenous language speakers when their recordings are used to train speech-recognition systems, but it permits the contracts to be confidential. Advocates warn that the policy may ______\n\nWhich choice most logically completes the text?\n\nA) discourage researchers from documenting endangered languages.\nB) prevent outsiders from verifying whether speakers are paid fairly.\nC) require speakers to learn programming skills.\nD) increase the cost of recording equipment.", "answer": "B", "explanation": "The concern is lack of transparent verification."}]}, {"n": 19, "concept": "Standard English: possessive plural noun phrase.", "original": "Literary agents estimate that more than half of all nonfiction books credited to a celebrity or other public figure are in fact written by ghostwriters, professional authors who are paid to write other _______ but whose names never appear on book covers.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) people's stories\nB) peoples story's\nC) peoples stories\nD) people's story's", "generated": [{"id": "19.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples story's\nB) people's story's\nC) people's stories\nD) peoples stories", "answer": "C", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "19.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) would shelter\nB) shelters\nC) sheltered\nD) had sheltered", "answer": "B", "explanation": "Simple present fits a general biological fact."}, {"id": "19.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively. During\nB) triumphed--decisively--during\nC) triumphed--decisively during\nD) triumphed--decisively, during", "answer": "A", "explanation": "A new sentence is needed before the time phrase."}, {"id": "19.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) have been\nB) are\nC) is\nD) were", "answer": "D", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "19.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype,\nB) prototype later,\nC) prototype;\nD) prototype, later,", "answer": "C", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 20, "concept": "Standard English: present tense for general truth.", "original": "Like other amphibians, the wood frog (Rana sylvatica) is unable to generate its own heat, so during periods of subfreezing temperatures, it _______ by producing large amounts of glucose, a sugar that helps prevent damaging ice from forming inside its cells.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) had survived\nB) survived\nC) would survive\nD) survives", "generated": [{"id": "20.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples story's\nB) people's story's\nC) people's stories\nD) peoples stories", "answer": "C", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "20.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard er multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype,\nB) prototype later,\nC) prototype;\nD) prototype, later,", "answer": "C", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 21, "concept": "Standard English: sentence boundary after interruption.", "original": "After a spate of illnesses as a child, Wilma Rudolph was told she might never walk again. Defying all odds, Rudolph didn't just walk, she _______ the 1960 Summer Olympics in Rome, she won both the 100- and 200-meter dashes and clinched first place for her team in the 4 x 100-meter relay, becoming the first US woman to win three gold medals in a single Olympics.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) ran--fast--during\nB) ran--fast during\nC) ran--fast, during\nD) ran--fast. During", "generated": [{"id": "21.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) peoples story's\nB) people's story's\nC) people's stories\nD) peoples stories", "answer": "C", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "21.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) would shelter\nB) shelters\nC) had sheltered\nD) sheltered", "answer": "B", "explanation": "Simple present fits a general biological fact."}, {"id": "21.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively, during\nB) triumphed--decisively--during\nC) triumphed--decisively. During\nD) triumphed--decisively during", "answer": "C", "explanation": "A new sentence is needed before the time phrase."}, {"id": "21.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is\nB) are\nC) have been\nD) were", "answer": "D", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "21.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype;\nB) prototype, later,\nC) prototype,\nD) prototype later,", "answer": "A", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 22, "concept": "Standard English: subject-verb agreement.", "original": "In many of her landscape paintings from the 1970s and 1980s, Lebanese American artist Etel Adnan worked to capture the essence of California's fog-shrouded Mount Tamalpais region through abstraction, using splotches of color to represent the area's neral biological fact."}, {"id": "22.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively during\nB) triumphed--decisively--during\nC) triumphed--decisively, during\nD) triumphed--decisively. During", "answer": "D", "explanation": "A new sentence is needed before the time phrase."}, {"id": "22.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) are\nC) is\nD) have been", "answer": "A", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "22.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype;\nB) prototype,\nC) prototype, later,\nD) prototype later,", "answer": "A", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 23, "concept": "Standard English: semicolon between independent clauses.", "original": "Seneca sculptor Marie Watt's blanket art comes in a range of shapes and sizes. In 2004, Watt sewed strips of blankets together to craft a 10-by-13-inch _______ in 2014, she arranged folded blankets into two large stacks and then cast them in bronze, creating two curving 18-foot-tall blue-bronze pillars.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) sampler later,\nB) sampler;\nC) sampler,\nD) sampler, later,", "generated": [{"id": "23.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) people's story's\nB) peoples story's\nC) people's stories\nD) peoples stories", "answer": "C", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "23.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) would shelter\nB) had sheltered\nC) sheltered\nD) shelters", "answer": "D", "explanation": "Simple present fits a general biological fact."}, {"id": "23.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively--during\nB) triumphed--decisively. During\nC) triumphed--decisively during\nD) triumphed--decisively, during", "answer": "B", "explanation": "A new sentence is needed before the time phrase."}, {"id": "23.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving tr ian synthesized the alkaloid physostigmine, which\nC) Julian's 1935 synthesis of the alkaloid physostigmine\nD) the alkaloid physostigmine was synthesized by Julian in 1935 and", "generated": [{"id": "24.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) people's story's\nB) peoples story's\nC) people's stories\nD) peoples stories", "answer": "C", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "24.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) had sheltered\nB) shelters\nC) would shelter\nD) sheltered", "answer": "B", "explanation": "Simple present fits a general biological fact."}, {"id": "24.3", "text": "At a community arts center, a cura
