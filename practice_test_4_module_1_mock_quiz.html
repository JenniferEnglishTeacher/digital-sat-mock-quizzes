answer": "D", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "25.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) had sheltered\nB) would shelter\nC) shelters\nD) sheltered", "answer": "C", "explanation": "Simple present fits a general biological fact."}, {"id": "25.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively, during\nB) triumphed--decisively. During\nC) triumphed--decisively during\nD) triumphed--decisively--during", "answer": "B", "explanation": "A new sentence is needed before the time phrase."}, {"id": "25.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) have been\nC) are\nD) is", "answer": "A", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "25.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype;\nB) prototype,\nC) prototype, later,\nD) prototype later,", "answer": "A", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 26, "concept": "Standard English: semicolon plus however.", "original": "Sociologist Alton Okinaka sits on the review board tasked with adding new sites to the Hawaii Register of Historic Places, which includes Piilanihale Heiau and the Opaekaa Road Bridge. Okinaka doesn't make such decisions _______ all historical designations must be approved by a group of nine other experts from the fields of architecture, archaeology, history, and Hawaiian culture.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) single-handedly, however;\nB) single-handedly; however,\nC) single-handedly, however,\nD) single-handedly however", "generated": [{"id": "26.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) people's stories\nB) people's story's\nC) peoples stories\nD) peoples story's", "answer": "A", "explanation": "The plural possessive phrase is 'people's stories.'"}, {"id": "26.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) would shelter\nB) shelters\nC) had sheltered\nD) sheltered", "answer": "B", "explanation": "Simple present fits a general biological fact."}, {"id": "26.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) triumphed--decisively during\nB) triumphed--decisively, during\nC) triumphed--decisively. During\nD) triumphed--decisively--during", "answer": "C", "explanation": "A new sentence is needed before the time phrase."}, {"id": "26.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) were\nB) are\nC) have been\nD) is", "answer": "A", "explanation": "The plural compound subject requires 'were' in past tense."}, {"id": "26.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) prototype later,\nB) prototype, later,\nC) prototype,\nD) prototype;", "answer": "D", "explanation": "A semicolon correctly joins two related independent clauses."}]}, {"n": 27, "concept": "Transitions: final outcome after long effort.", "original": "In 1968, US Congressman John Conyers introduced a bill to establish a national holiday in honor of Dr. Martin Luther King Jr. The bill didn't make it to a vote, but Conyers was determined. He teamed up with Shirley Chisholm, the first Black woman to be elected to Congress, and they resubmitted the bill every session for the next fifteen years. _______ in 1983, the bill passed.\n\nWhich choice completes the text with the most logical transition?\nA) Instead,\nB) Likewise,\nC) Finally,\nD) Additionally,", "generated": [{"id": "27.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The proposal was rejected twice and then revised after years of public advocacy. ______ in 2024, the city council approved the measure unanimously.\n\nWhich choice completes the text with the most logical transition?\n\nA) Finally,\nB) Instead,\nC) Likewise,\nD) Additionally,", "answer": "A", "explanation": "Finally marks the eventual outcome after a long process."}, {"id": "27.2", "text": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The research team spent a decade testing unsuccessful materials. ______ they identified a compound that remained stable at high temperatures.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) Instead,\nC) However,\nD) Eventually,", "answer": "D", "explanation": "Eventually signals the final result after many attempts."}, {"id": "27.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. For months the orchestra could not find a permanent rehearsal space. ______ a community college offered the musicians use of its auditorium.\n\nWhich choice completes the text with the most logical transition?\n\nA) At last,\nB) For example,\nC) Nevertheless,\nD) Meanwhile,", "answer": "A", "explanation": "At last marks a long-awaited outcome."}, {"id": "27.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The bill failed in committee several times, but supporters kept reintroducing it. ______ after years of debate, it became law.\n\nWhich choice completes the text with the most logical transition?\n\nA) Instead,\nB) Likewise,\nC) Finally,\nD) Additionally,", "answer": "C", "explanation": "Finally introduces the eventual success."}, {"id": "27.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The restoration effort faced funding delays, storms, and shortages of skilled workers. ______ the lighthouse reopened to visitors after twelve years.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) Ultimately,\nC) In contrast,\nD) Consequently,", "answer": "B", "explanation": "Ultimately marks the final result."}]}, {"n": 28, "concept": "Transitions: contrast with prior belief.", "original": "Geoscientists have long considered Hawaii's Mauna Loa volcano to be Earth's largest shield volcano by volume, measuring approximately 74,000 cubic kilometers. _______ according to a 2020 study by local geoscientist Michael Garcia, Hawaii's Puhahonu shield volcano is significantly larger, boasting a volume of about 148,000 cubic kilometers.\n\nWhich choice completes the text with the most logical transition?\nA) Secondly,\nB) Consequently,\nC) Moreover,\nD) However,", "generated": [{"id": "28.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For many years, scholars attributed the anonymous poem to a minor court writer. ______ newly discovered letters suggest that it was written by the queen herself.\n\nWhich choice completes the text with the most logical transition?\n\nA) Secondly,\nB) Consequently,\nC) Moreover,\nD) However,", "answer": "D", "explanation": "However contrasts the new evidence with the earlier view."}, {"id": "28.2", "text": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The island was long described as geologically inactive. ______ recent measurements show that magma is still moving beneath its western ridge.\n\nWhich choice completes the text with the most logical transition?\n\nA) Nevertheless,\nB) For instance,\nC) Therefore,\nD) Additionally,", "answer": "A", "explanation": "Nevertheless introduces contrary evidence."}, {"id": "28.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Doctors once considered the condition untreatable. ______ a new therapy has significantly improved symptoms in many patients.\n\nWhich choice completes the text with the most logical transition?\n\nA) Furthermore,\nB) By contrast,\nC) Similarly,\nD) As a result,", "answer": "B", "explanation": "By contrast signals a departure from the old belief."}, {"id": "28.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The manuscript was assumed to be a copy produced centuries after the original. ______ chemical analysis of the ink dates it to the author's lifetime.\n\nWhich choice completes the text with the most logical transition?\n\nA) Consequently,\nB) Likewise,\nC) However,\nD) Secondly,", "answer": "C", "explanation": "However introduces contradictory evidence."}, {"id": "28.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Astronomers had classified the object as an ordinary comet. ______ later observations revealed unusual emissions that required a different explanation.\n\nWhich choice completes the text with the most logical transition?\n\nA) Moreover,\nB) However,\nC) Instead,\nD) Therefore,", "answer": "B", "explanation": "However marks the contrast."}]}, {"n": 29, "concept": "Transitions: additional example.", "original": "Samuel Coleridge-Taylor was a prominent classical music composer from England who toured the US three times in the early 1900s. The child of a West African father and an English mother, Coleridge-Taylor emphasized his mixed-race ancestry. For example, he referred to himself as Anglo-African. _______ he incorporated the sounds of traditional African music into his classical music compositions.\n\nWhich choice completes the text with the most logical transition?\nA) In addition,\nB) Actually,\nC) However,\nD) Regardless,", "generated": [{"id": "29.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The novelist often explored her Caribbean heritage in interviews. For example, she discussed family stories from Barbados. ______ she set several early novels in island communities shaped by migration.\n\nWhich choice completes the text with the most logical transition?\n\nA) Regardless,\nB) In addition,\nC) Actually,\nD) However,", "answer": "B", "explanation": "In addition adds another example."}, {"id": "29.2", "text": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The painter emphasized his Indigenous ancestry in public lectures. ______ he incorporated traditional weaving patterns into the backgrounds of several portraits.\n\nWhich choice completes the text with the most logical transition?\n\nA) On the contrary,\nB) Instead,\nC) Moreover,\nD) Nevertheless,", "answer": "C", "explanation": "Moreover adds related evidence."}, {"id": "29.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The composer celebrated regional folk traditions. For instance, she quoted mountain ballads in one symphony. ______ she used local dance rhythms in her chamber music.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Likewise,\nC) Actually,\nD) Regardless,", "answer": "B", "explanation": "Likewise adds a similar example."}, {"id": "29.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The architect highlighted her connection to coastal communities. She named one project after a fishing village. ______ she designed the building's roofline to resemble boat sails.\n\nWhich choice completes the text with the most logical transition?\n\nA) Additionally,\nB) Rather,\nC) However,\nD) Nevertheless,", "answer": "A", "explanation": "Additionally adds another supporting example."}, {"id": "29.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The poet foregrounded his bilingual upbringing. He published essays about translation. ______ he moved between Spanish and English within many of his poems.\n\nWhich choice completes the text with the most logical transition?\n\nA) Consequently,\nB) By contrast,\nC) Regardless,\nD) In addition,", "answer": "D", "explanation": "In addition introduces another example."}]}, {"n": 30, "concept": "Transitions: result or inference.", "original": "In 2019, researcher Patricia Jurado Gonzalez and food historian Nawal Nasrallah prepared a stew from a 4,000-year-old recipe found on a Mesopotamian clay tablet. When they tasted the dish, known as pasrutum (\"unwinding\"), they found that it had a mild taste and inspired a sense of calm. _______ the researchers, knowing that dishes were sometimes named after their intended effects, theorized that the dish's name, \"unwinding,\" referred to its function: to help ancient diners relax.\n\nWhich choice completes the text with the most logical transition?\nA) Therefore,\nB) Alternately,\nC) Nevertheless,\nD) Likewise,", "generated": [{"id": "30.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The tea was traditionally served before sleep, and modern chemical analysis found compounds associated with relaxation. ______ researchers proposed that its name, 'night rest,' referred to its intended calming effect.\n\nWhich choice completes the text with the most logical transition?\n\nA) Nevertheless,\nB) Likewise,\nC) Therefore,\nD) Alternately,", "answer": "C", "explanation": "Therefore introduces the inference."}, {"id": "30.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The instrument produced a low, steady tone that listeners described as soothing. ______ the team suggested that ancient performers may have used it during healing ceremonies.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) Consequently,\nC) Instead,\nD) Similarly,", "answer": "B", "explanation": "Consequently signals a conclusion from evidence."}, {"id": "30.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The plant's leaves close when touched, and early farmers called it 'the shy herb.' ______ botanists suspect that the name refers to this visible movement.\n\nWhich choice completes the text with the most logical transition?\n\nA) Likewise,\nB) Nevertheless,\nC) Alternatively,\nD) For this reason,", "answer": "D", "explanation": "For this reason links evidence to inference."}, {"id": "30.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The bread contained honey and aromatic seeds, ingredients associated with festival foods. ______ food historians argued that it was probably prepared for celebrations.\n\nWhich choice completes the text with the most logical transition?\n\nA) Therefore,\nB) Similarly,\nC) Regardless,\nD) In contrast,", "answer": "A", "explanation": "Therefore presents the conclusion."}, {"id": "30.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The bowl's interior showed traces of blue pigment, and blue dyes were often used in mourning rituals. ______ archaeologists proposed that the bowl had a funerary purpose.\n\nWhich choice completes the text with the most logical transition?\n\nA) Likewise,\nB) Nevertheless,\nC) Alternatively,\nD) As a result,", "answer": "D", "explanation": "As a result connects evidence to a conclusion."}]}, {"n": 31, "concept": "Student Notes: emphasize a difference.", "original": "While researching a topic, a student has taken the following notes:\n- Chemical leavening agents cause carbon dioxide to be released within a liquid batter, making the batter rise as it bakes.\n- Baking soda and baking powder are chemical leavening agents.\n- Baking soda is pure sodium bicarbonate.\n- To produce carbon dioxide, baking soda needs to be mixed with liquid and an acidic ingredient such as honey.\n- Baking powder is a mixture of sodium bicarbonate and an acid.\n- To produce carbon dioxide, baking powder needs to be mixed with liquid but not with an acidic ingredient.\n\nThe student wants to emphasize a difference between baking soda and baking powder. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) To make batters rise, bakers use chemical leavening agents such as baking soda and baking powder.\nB) Baking soda and baking powder are chemical leavening agents that, when mixed with other ingredients, cause carbon dioxide to be released within a batter.\nC) Baking soda is pure sodium bicarbonate, and honey is a type of acidic ingredient.\nD) To produce carbon dioxide within a liquid batter, baking soda needs to be mixed with an acidic ingredient, whereas baking powder does not.", "generated": [{"id": "31.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Both yeast and baking powder make dough rise; yeast is a living organism; yeast produces carbon dioxide slowly as it consumes sugars; baking powder is a chemical mixture; baking powder releases carbon dioxide quickly when moistened and heated; the goal is to emphasize a difference.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Yeast and baking powder affect the texture of baked goods.\nB) Yeast and baking powder can both make dough rise.\nC) Yeast produces carbon dioxide slowly as it consumes sugars, whereas baking powder releases carbon dioxide quickly when moistened and heated.\nD) Baking powder is a chemical mixture used in many recipes.", "answer": "C", "explanation": "The answer directly contrasts the two leavening agents."}, {"id": "31.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Solar panels and wind turbines both produce electricity without burning fuel; solar panels generate electricity from sunlight; wind turbines generate electricity from moving air; the goal is to emphasize a difference.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Solar panels and wind turbines can reduce reliance on fossil fuels.\nB) Solar panels and wind turbines both produce electricity.\nC) Solar panels generate electricity from sunlight, whereas wind turbines generate electricity from moving air.\nD) Many communities use both solar panels and wind turbines.", "answer": "C", "explanation": "The answer highlights the different energy sources."}, {"id": "31.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Frogs and salamanders are amphibians; most adult frogs lack tails; adult salamanders usually have tails; frogs often move by jumping; salamanders usually move by walking or swimming; the goal is to emphasize a difference.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Frogs and salamanders are both amphibians.\nB) Amphibians can live in wet environments.\nC) Some frogs and salamanders lay eggs in water.\nD) Most adult frogs lack tails and often jump, whereas adult salamanders usually have tails and typically walk or swim.", "answer": "D", "explanation": "The answer contrasts physical and movement differences."}, {"id": "31.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Oil paint and watercolor are painting media; oil paint dries slowly and can be layered thickly; watercolor dries quickly and is usually translucent; the goal is to emphasize a difference.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Oil paint dries slowly and can be layered thickly, whereas watercolor dries quickly and is usually translucent.\nB) Oil paint and watercolor are both painting media.\nC) Oil paint and watercolor have been used by many artists.\nD) Paintings can be made with many different materials.", "answer": "A", "explanation": "The answer emphasizes the contrast between the media."}, {"id": "31.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Comets and asteroids orbit the Sun; comets contain ice that can form tails near the Sun; asteroids are mostly rocky or metallic; the goal is to emphasize a difference.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Asteroids can be found in the asteroid belt.\nB) Although comets and asteroids both orbit the Sun, comets contain ice that can form tails, whereas asteroids are mostly rocky or metallic.\nC) Both comets and asteroids are objects in the solar system.\nD) Comets sometimes become visible from Earth.", "answer": "B", "explanation": "The answer directly states the difference."}]}, {"n": 32, "concept": "Student Notes: describe an artwork to an unfamiliar audience.", "original": "While researching a topic, a student has taken the following notes:\n- Soo Sunny Park is a Korean American artist who uses light as her primary medium of expression.\n- She created her work Unwoven Light in 2013.\n- Unwoven Light featured a chain-link fence fitted with iridescent plexiglass tiles.\n- When light passed through the fence, colorful prisms formed.\n\nThe student wants to describe Unwoven Light to an audience unfamiliar with Soo Sunny Park. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Park's 2013 installation Unwoven Light, which included a chain-link fence and iridescent tiles made from plexiglass, featured light as its primary medium of expression.\nB) Korean American light artist Soo Sunny Park created Unwoven Light in 2013.\nC) The chain-link fence in Soo Sunny Park's Unwoven Light was fitted with tiles made from iridescent plexiglass.\nD) In Unwoven Light, a 2013 work by Korean American artist Soo Sunny Park, light formed colorful prisms as it passed through a fence Park had fitted with iridescent tiles.", "generated": [{"id": "32.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Artist Lila Chen created Glass Orchard in 2020; the installation used suspended glass disks; moving spotlights passed through the disks; colored circles appeared on the gallery walls; the audience is unfamiliar with Chen; the goal is to describe the work.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) In Glass Orchard, a 2020 installation by artist Lila Chen, moving light passed through suspended glass disks and cast colored circles on the gallery walls.\nB) Lila Chen is an artist who created Glass Orchard in 2020.\nC) Glass Orchard included suspended glass disks and moving spotlights.\nD) The glass disks in Glass Orchard were suspended from the ceiling.", "answer": "A", "explanation": "The answer names the artist and describes the work clearly for an unfamiliar audience."}, {"id": "32.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Sculptor Mateo Ruiz made Tidal Loom in 2018; the work consisted of woven copper strips; small motors moved the strips slowly; the motion resembled waves; the audience is unfamiliar with Ruiz; the goal is to describe the work.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Waves can be suggested through motion in sculpture.\nB) Tidal Loom, a 2018 work by sculptor Mateo Ruiz, used slowly moving woven copper strips to create an effect resembling waves.\nC) Tidal Loom included motors and copper strips.\nD) Mateo Ruiz created Tidal Loom in 2018.", "answer": "B", "explanation": "The answer gives enough context and describes the artwork."}, {"id": "32.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Photographer Amara Singh created Night Garden; the series shows city parks after rain; reflected streetlights make the paths appear luminous; the audience is unfamiliar with Singh; the goal is to describe the work.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Streetlights can reflect on wet surfaces.\nB) In Night Garden, photographer Amara Singh depicts rain-soaked city parks whose paths glow with reflected streetlights.\nC) Amara Singh is a photographer who made a series called Night Garden.\nD) Night Garden shows parks at night.", "answer": "B", "explanation": "The answer describes the work and identifies the artist."}, {"id": "32.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Artist Ren Ito created Paper Current in 2016; the installation used folded paper boats; fans moved the boats across shallow water; the audience is unfamiliar with Ito; the goal is to describe the work.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The installation used fans and folded paper boats.\nB) Ren Ito made Paper Current in 2016.\nC) Paper Current, a 2016 installation by artist Ren Ito, featured folded paper boats pushed by fans across shallow water.\nD) Paper boats can float on shallow water.", "answer": "C", "explanation": "The answer presents a clear description for new readers."}, {"id": "32.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Maya Brooks created Echo Wall; it used ceramic tiles and recorded voices; when visitors approached, the tiles vibrated softly; the audience is unfamiliar with Brooks; the goal is to describe the work.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Maya Brooks works with sound and ceramics.\nB) The tiles in Echo Wall vibrated.\nC) Visitors could approach Echo Wall.\nD) Echo Wall, by artist Maya Brooks, combined ceramic tiles and recorded voices so that the tiles vibrated softly when visitors approached.", "answer": "D", "explanation": "The answer gives a complete description of the work."}]}, {"n": 33, "concept": "Student Notes: present research to an unfamiliar audience.", "original": "While researching a topic, a student has taken the following notes:\n- Cambodia's Angkor Wat was built in the 1100s to honor the Hindu god Vishnu.\n- It has been a Buddhist temple since the sixteenth century.\n- Decorrelation stretch analysis is a novel digital imaging technique that enhances the contrast between colors in a photograph.\n- Archaeologist Noel Hidalgo Tan applied decorrelation stretch analysis to photographs he had taken of Angkor Wat's plaster walls.\n- Tan's analysis revealed hundreds of images unknown to researchers.\n\nThe student wants to present Tan's research to an audience unfamiliar with Angkor Wat. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) Tan photographed Angkor Wat's plaster walls and then applied decorrelation stretch analysis to the photographs.\nB) Decorrelation stretch analysis is a novel digital imaging technique that Tan used to enhance the contrast between colors in a photograph.\nC) Using a novel digital imaging technique, Tan revealed hundreds of images hidden on the walls of Angkor Wat, a Cambodian temple.\nD) Built to honor a Hindu god before becoming a Buddhist temple, Cambodia's Angkor Wat concealed hundreds of images on its plaster walls.", "generated": [{"id": "33.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Notes: Historian Lina Ortega studied murals in an abandoned train station; she used infrared photography, a technique that can reveal covered paint layers; the station is in Valparaiso, Chile; Ortega discovered earlier sketches beneath the visible murals; the audience is unfamiliar with the station; the goal is to present the research.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Infrared photography can reveal covered paint layers.\nB) Using infrared photography, historian Lina Ortega discovered earlier sketches beneath murals in an abandoned train station in Valparaiso, Chile.\nC) Ortega photographed the station walls and used infrared photography.\nD) Valparaiso is a city in Chile with an abandoned train station.", "answer": "B", "explanation": "The answer introduces the place, method, researcher, and finding."}, {"id": "33.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Notes: Archaeologist Devin Rao studied a temple in southern India; the temple was built in the ninth century; Rao used 3D laser scanning; the scan revealed faint inscriptions on interior columns; the audience is unfamiliar with the temple; the goal is to present the research.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) 3D laser scanning can record surfaces in detail.\nB) The temple was built in the ninth century.\nC) Interior columns sometimes contain inscriptions.\nD) Rao used 3D laser scanning to study a ninth-century temple in southern India and revealed faint inscriptions on its interior columns.", "answer": "D", "explanation": "The answer presents the site, method, and result."}, {"id": "33.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Notes: Marine archaeologist Sofia Mensah examined a shipwreck off Ghana's coast; she used photogrammetry, a digital method that combines many photographs into a 3D model; the model revealed cargo spaces hidden under collapsed beams; the audience is unfamiliar with the shipwreck; the goal is to present the research.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Collapsed beams can hide parts of a shipwreck.\nB) Mensah studied a shipwreck.\nC) Photogrammetry combines many photographs into a 3D model.\nD) Using photogrammetry, marine archaeologist Sofia Mensah created a 3D model of a shipwreck off Ghana's coast and identified cargo spaces hidden under collapsed beams.", "answer": "D", "explanation": "The answer gives context, method, and discovery."}, {"id": "33.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Notes: Art historian Priya Nair studied a palace ceiling in Rajasthan; she used ultraviolet imaging; the imaging revealed floral designs covered by later paint; the audience is unfamiliar with the palace; the goal is to present the research.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Art historian Priya Nair used ultraviolet imaging to reveal floral designs hidden beneath later paint on a palace ceiling in Rajasthan.\nB) Ultraviolet imaging can be used by art historians.\nC) Later paint covered floral designs on the ceiling.\nD) The palace ceiling is located in Rajasthan.", "answer": "A", "explanation": "The answer presents the research in a complete sentence."}, {"id": "33.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Notes: Geographer Omar Bell studied old maps of New Orleans; he used digital overlay software; the software aligned maps from different centuries; Bell identified streets that had disappeared after floods; the audience is unfamiliar with the maps; the goal is to present the research.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Old maps can show streets from different centuries.\nB) Digital overlay software aligns maps.\nC) By using digital overlay software to align old maps of New Orleans, geographer Omar Bell identified streets that disappeared after floods.\nD) New Orleans has experienced floods.", "answer": "C", "explanation": "The answer states method, subject, and finding."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
</body>
