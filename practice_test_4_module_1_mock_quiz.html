措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她發表了一個能運作數小時的全尺寸版本。", "opts": {"A": "prototype,", "B": "prototype later,", "C": "prototype;", "D": "prototype, later,"}, "optsZh": {"A": "prototype,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "prototype later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "C": "prototype;（分號連接兩個獨立子句：正確）", "D": "prototype, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "C", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Standard English: sentence boundary after interruption.", "vocab": false, "body": "After a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spate\" target=\"_blank\" rel=\"noopener\" data-w=\"spate\" data-pos=\"n.\" data-en=\"a large number of things happening in a short time\" data-zh=\"一連串\">spate<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=illness\" target=\"_blank\" rel=\"noopener\" data-w=\"illness\" data-pos=\"n.\" data-en=\"a disease or period of sickness\" data-zh=\"疾病\">illnesses<\/a> as a child, Wilma Rudolph was told she might never walk again. Defying all odds, Rudolph didn&#x27;t just walk, she _______ the 1960 Summer Olympics in Rome, she won both the 100- and 200-meter dashes and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=clinch\" target=\"_blank\" rel=\"noopener\" data-w=\"clinch\" data-pos=\"v.\" data-en=\"to win or settle something finally\" data-zh=\"贏得；確定\">clinched<\/a> first place for her team in the 4 x 100-meter <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relay\" target=\"_blank\" rel=\"noopener\" data-w=\"relay\" data-pos=\"n.\" data-en=\"a race in which team members take turns running\" data-zh=\"接力賽\">relay<\/a>, becoming the first US woman to win three gold medals in a single Olympics.", "bodyPlain": "After a spate of illnesses as a child, Wilma Rudolph was told she might never walk again. Defying all odds, Rudolph didn't just walk, she _______ the 1960 Summer Olympics in Rome, she won both the 100- and 200-meter dashes and clinched first place for her team in the 4 x 100-meter relay, becoming the first US woman to win three gold medals in a single Olympics.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "Wilma Rudolph 小時候接連生了幾場病，曾被告知她可能再也無法走路。Rudolph 克服萬難，不只是能走路，她 _______ 了 1960 年羅馬夏季奧運，她贏得了 100 公尺和 200 公尺短跑，並帶領她的隊伍拿下 4 x 100 公尺接力的冠軍，成為第一位在單屆奧運中贏得三面金牌的美國女性。", "opts": {"A": "ran--fast--during", "B": "ran--fast during", "C": "ran--fast, during", "D": "ran--fast. During"}, "optsZh": {"A": "ran--fast--during（破折號 → 兩個獨立子句連接不當：錯誤）", "B": "ran--fast during（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "C": "ran--fast, during（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "ran--fast. During（句號分隔兩個獨立句子：正確）"}, "answer": "D", "expl": "'Rudolph didn't just walk, she ran--fast' is complete; a period is needed before the new sentence 'During the 1960 Summer Olympics..., she won...'", "explZh": "「Rudolph didn't just walk, she ran--fast」已完整，後面「During the 1960 Summer Olympics..., she won...」是新的句子，必須用句號分開。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Standard English: sentence boundary after interruption.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。幾本掛名為知名運動員的回憶錄，其實是由合作者所寫，他們把其他 ______ 塑造成精煉的敘事，自己卻始終不具名。", "opts": {"A": "peoples story's", "B": "people's story's", "C": "people's stories", "D": "peoples stories"}, "optsZh": {"A": "peoples story's（所有格標錯位置：錯誤）", "B": "people's story's（story's 為所有格 → 後面沒有被擁有的名詞：錯誤）", "C": "people's stories（people 的所有格＋複數名詞 stories：正確）", "D": "peoples stories（缺少所有格撇號：錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Standard English: sentence boundary after interruption.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "would shelter", "B": "shelters", "C": "had sheltered", "D": "sheltered"}, "optsZh": {"A": "would shelter（條件語氣 → 不能表達普遍事實：錯誤）", "B": "shelters（一般現在式，單數，表普遍事實：正確）", "C": "had sheltered（過去完成式 → 不能表達普遍事實：錯誤）", "D": "sheltered（一般過去式 → 不能表達普遍事實：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Standard English: sentence boundary after interruption.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively, during", "B": "triumphed--decisively--during", "C": "triumphed--decisively. During", "D": "triumphed--decisively during"}, "optsZh": {"A": "triumphed--decisively, during（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "triumphed--decisively--during（破折號 → 兩個獨立子句連接不當：錯誤）", "C": "triumphed--decisively. During（句號分隔兩個獨立句子：正確）", "D": "triumphed--decisively during（無標點 → 兩個獨立子句直接相連：連寫句錯誤）"}, "answer": "C", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Standard English: sentence boundary after interruption.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "is", "B": "are", "C": "have been", "D": "were"}, "optsZh": {"A": "is（單數動詞 → 與複數主詞不一致：錯誤）", "B": "are（複數現在式 → 時態與敘述的過去事件不一致：錯誤）", "C": "have been（現在完成式 → 時態與敘述的過去事件不一致：錯誤）", "D": "were（be 動詞複數過去式，主詞須為複數）"}, "answer": "D", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Standard English: sentence boundary after interruption.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她發表了一個能運作數小時的全尺寸版本。", "opts": {"A": "prototype;", "B": "prototype, later,", "C": "prototype,", "D": "prototype later,"}, "optsZh": {"A": "prototype;（分號連接兩個獨立子句：正確）", "B": "prototype, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "prototype,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prototype later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）"}, "answer": "A", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Standard English: subject-verb agreement.", "vocab": false, "body": "In many of her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscape<\/a> paintings from the 1970s and 1980s, Lebanese American artist Etel Adnan worked to capture the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essence\" target=\"_blank\" rel=\"noopener\" data-w=\"essence\" data-pos=\"n.\" data-en=\"the most important quality of something\" data-zh=\"本質；精髓\">essence<\/a> of California&#x27;s fog-shrouded Mount Tamalpais region through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=abstraction\" target=\"_blank\" rel=\"noopener\" data-w=\"abstraction\" data-pos=\"n.\" data-en=\"art that uses shapes and colors rather than realistic images\" data-zh=\"抽象（藝術）\">abstraction<\/a>, using splotches of color to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=represent\" target=\"_blank\" rel=\"noopener\" data-w=\"represent\" data-pos=\"v.\" data-en=\"to show or stand for something\" data-zh=\"代表；呈現\">represent<\/a> the area&#x27;s features. Interestingly, the triangle representing the mountain itself _______ among the few defined figures in her paintings.", "bodyPlain": "In many of her landscape paintings from the 1970s and 1980s, Lebanese American artist Etel Adnan worked to capture the essence of California's fog-shrouded Mount Tamalpais region through abstraction, using splotches of color to represent the area's features. Interestingly, the triangle representing the mountain itself _______ among the few defined figures in her paintings.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在她 1970 和 1980 年代的許多風景畫中，黎巴嫩裔美國藝術家 Etel Adnan 努力透過抽象手法捕捉加州雲霧籠罩的 Mount Tamalpais 地區的精髓，以色塊來表現該地區的特徵。有趣的是，代表那座山本身的三角形 _______ 她畫作中少數幾個輪廓分明的形體之一。", "opts": {"A": "are", "B": "have been", "C": "were", "D": "is"}, "optsZh": {"A": "are（複數現在式 → 時態與敘述的過去事件不一致：錯誤）", "B": "have been（現在完成式 → 時態與敘述的過去事件不一致：錯誤）", "C": "were（be 動詞複數過去式，主詞須為複數）", "D": "is（單數動詞 → 與複數主詞不一致：錯誤）"}, "answer": "D", "expl": "The subject is the singular 'the triangle,' and the text describes the paintings in the present, so 'is' is correct.", "explZh": "主詞是單數的「the triangle」（representing... 只是修飾語），所以用單數「is」。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Standard English: subject-verb agreement.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。幾本掛名為知名運動員的回憶錄，其實是由合作者所寫，他們把其他 ______ 塑造成精煉的敘事，自己卻始終不具名。", "opts": {"A": "peoples stories", "B": "people's story's", "C": "people's stories", "D": "peoples story's"}, "optsZh": {"A": "peoples stories（缺少所有格撇號：錯誤）", "B": "people's story's（story's 為所有格 → 後面沒有被擁有的名詞：錯誤）", "C": "people's stories（people 的所有格＋複數名詞 stories：正確）", "D": "peoples story's（所有格標錯位置：錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Standard English: subject-verb agreement.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "sheltered", "B": "shelters", "C": "would shelter", "D": "had sheltered"}, "optsZh": {"A": "sheltered（一般過去式 → 不能表達普遍事實：錯誤）", "B": "shelters（一般現在式，單數，表普遍事實：正確）", "C": "would shelter（條件語氣 → 不能表達普遍事實：錯誤）", "D": "had sheltered（過去完成式 → 不能表達普遍事實：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Standard English: subject-verb agreement.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively during", "B": "triumphed--decisively--during", "C": "triumphed--decisively, during", "D": "triumphed--decisively. During"}, "optsZh": {"A": "triumphed--decisively during（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "B": "triumphed--decisively--during（破折號 → 兩個獨立子句連接不當：錯誤）", "C": "triumphed--decisively, during（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "triumphed--decisively. During（句號分隔兩個獨立句子：正確）"}, "answer": "D", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Standard English: subject-verb agreement.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "are", "C": "is", "D": "have been"}, "optsZh": {"A": "were（be 動詞複數過去式，主詞須為複數）", "B": "are（複數現在式 → 時態與敘述的過去事件不一致：錯誤）", "C": "is（單數動詞 → 與複數主詞不一致：錯誤）", "D": "have been（現在完成式 → 時態與敘述的過去事件不一致：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Standard English: subject-verb agreement.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她發表了一個能運作數小時的全尺寸版本。", "opts": {"A": "prototype;", "B": "prototype,", "C": "prototype, later,", "D": "prototype later,"}, "optsZh": {"A": "prototype;（分號連接兩個獨立子句：正確）", "B": "prototype,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "prototype, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prototype later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）"}, "answer": "A", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Standard English: semicolon between independent clauses.", "vocab": false, "body": "Seneca <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculptor\" target=\"_blank\" rel=\"noopener\" data-w=\"sculptor\" data-pos=\"n.\" data-en=\"an artist who makes sculptures\" data-zh=\"雕塑家\">sculptor<\/a> Marie Watt&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=blanket\" target=\"_blank\" rel=\"noopener\" data-w=\"blanket\" data-pos=\"n.\" data-en=\"a large cover made of cloth, used for warmth\" data-zh=\"毯子\">blanket<\/a> art comes in a range of shapes and sizes. In 2004, Watt sewed strips of blankets together to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=craft\" target=\"_blank\" rel=\"noopener\" data-w=\"craft\" data-pos=\"v.\" data-en=\"to make something skillfully by hand\" data-zh=\"精心製作\">craft<\/a> a 10-by-13-inch _______ in 2014, she arranged folded blankets into two large stacks and then cast them in bronze, creating two curving 18-foot-tall blue-bronze <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pillar\" target=\"_blank\" rel=\"noopener\" data-w=\"pillar\" data-pos=\"n.\" data-en=\"a tall vertical support or column\" data-zh=\"柱子\">pillars<\/a>.", "bodyPlain": "Seneca sculptor Marie Watt's blanket art comes in a range of shapes and sizes. In 2004, Watt sewed strips of blankets together to craft a 10-by-13-inch _______ in 2014, she arranged folded blankets into two large stacks and then cast them in bronze, creating two curving 18-foot-tall blue-bronze pillars.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "Seneca 族雕塑家 Marie Watt 的毛毯藝術有各種形狀與尺寸。2004 年，Watt 把毛毯布條縫在一起，製作出一件 10 乘 13 英寸的 _______ 在 2014 年，她把折疊的毛毯排成兩大疊，再以青銅鑄造，創作出兩根彎曲、18 英尺高的藍色青銅柱。", "opts": {"A": "sampler later,", "B": "sampler;", "C": "sampler,", "D": "sampler, later,"}, "optsZh": {"A": "sampler later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "B": "sampler;（分號連接兩個獨立子句：正確）", "C": "sampler,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "sampler, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "B", "expl": "Two independent clauses ('Watt sewed... sampler' and 'in 2014, she arranged...') must be joined with a semicolon.", "explZh": "兩個獨立子句（Watt sewed... sampler 與 in 2014, she arranged...）之間要用分號連接。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Standard English: semicolon between independent clauses.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。幾本掛名為知名運動員的回憶錄，其實是由合作者所寫，他們把其他 ______ 塑造成精煉的敘事，自己卻始終不具名。", "opts": {"A": "people's story's", "B": "peoples story's", "C": "people's stories", "D": "peoples stories"}, "optsZh": {"A": "people's story's（story's 為所有格 → 後面沒有被擁有的名詞：錯誤）", "B": "peoples story's（所有格標錯位置：錯誤）", "C": "people's stories（people 的所有格＋複數名詞 stories：正確）", "D": "peoples stories（缺少所有格撇號：錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Standard English: semicolon between independent clauses.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "would shelter", "B": "had sheltered", "C": "sheltered", "D": "shelters"}, "optsZh": {"A": "would shelter（條件語氣 → 不能表達普遍事實：錯誤）", "B": "had sheltered（過去完成式 → 不能表達普遍事實：錯誤）", "C": "sheltered（一般過去式 → 不能表達普遍事實：錯誤）", "D": "shelters（一般現在式，單數，表普遍事實：正確）"}, "answer": "D", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Standard English: semicolon between independent clauses.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively--during", "B": "triumphed--decisively. During", "C": "triumphed--decisively during", "D": "triumphed--decisively, during"}, "optsZh": {"A": "triumphed--decisively--during（破折號 → 兩個獨立子句連接不當：錯誤）", "B": "triumphed--decisively. During（句號分隔兩個獨立句子：正確）", "C": "triumphed--decisively during（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "D": "triumphed--decisively, during（只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "B", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Standard English: semicolon between independent clauses.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "have been", "C": "are", "D": "is"}, "optsZh": {"A": "were（be 動詞複數過去式，主詞須為複數）", "B": "have been（現在完成式 → 時態與敘述的過去事件不一致：錯誤）", "C": "are（複數現在式 → 時態與敘述的過去事件不一致：錯誤）", "D": "is（單數動詞 → 與複數主詞不一致：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Standard English: semicolon between independent clauses.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她發表了一個能運作數小時的全尺寸版本。", "opts": {"A": "prototype;", "B": "prototype later,", "C": "prototype,", "D": "prototype, later,"}, "optsZh": {"A": "prototype;（分號連接兩個獨立子句：正確）", "B": "prototype later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "C": "prototype,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prototype, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）"}, "answer": "A", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Standard English: logical subject after participial phrase.", "vocab": false, "body": "African American Percy Julian was a scientist and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entrepreneur\" target=\"_blank\" rel=\"noopener\" data-w=\"entrepreneur\" data-pos=\"n.\" data-en=\"a person who starts a business\" data-zh=\"企業家；創業者\">entrepreneur<\/a> whose work helped people around the world to see. Named in 1999 as one of the greatest <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a> by a US chemist in the past hundred years, _______ led to the first mass-produced <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=treatment\" target=\"_blank\" rel=\"noopener\" data-w=\"treatment\" data-pos=\"n.\" data-en=\"medical care for an illness\" data-zh=\"治療\">treatment<\/a> for glaucoma.", "bodyPlain": "African American Percy Julian was a scientist and entrepreneur whose work helped people around the world to see. Named in 1999 as one of the greatest achievements by a US chemist in the past hundred years, _______ led to the first mass-produced treatment for glaucoma.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "非裔美國人 Percy Julian 是一位科學家兼企業家，他的研究幫助了世界各地的人看得見。在 1999 年被評選為過去一百年來美國化學家最偉大的成就之一，_______ 促成了第一種大量生產的青光眼療法。", "opts": {"A": "Julian synthesized the alkaloid physostigmine in 1935; it", "B": "in 1935 Julian synthesized the alkaloid physostigmine, which", "C": "Julian's 1935 synthesis of the alkaloid physostigmine", "D": "the alkaloid physostigmine was synthesized by Julian in 1935 and"}, "optsZh": {"A": "Julian synthesized the alkaloid physostigmine in 1935; it（主詞為 Julian，與句首分詞片語的邏輯主詞不符 → 懸垂修飾語：錯誤）", "B": "in 1935 Julian synthesized the alkaloid physostigmine, which（主詞為 Julian，與句首分詞片語的邏輯主詞不符 → 懸垂修飾語：錯誤）", "C": "Julian's 1935 synthesis of the alkaloid physostigmine（主詞為「Julian 的合成成果」，正是被評為偉大成就的事物，與分詞片語邏輯一致：正確）", "D": "the alkaloid physostigmine was synthesized by Julian in 1935 and（主詞為生物鹼本身，不是被評為偉大成就的事物 → 修飾語邏輯錯誤：錯誤）"}, "answer": "C", "expl": "The thing 'named in 1999 as one of the greatest achievements' is the synthesis, so it must immediately follow the modifier.", "explZh": "「1999 年被評為最偉大成就之一」的是那項「合成」，所以它必須緊接在修飾語之後當主詞。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Standard English: logical subject after participial phrase.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。幾本掛名為知名運動員的回憶錄，其實是由合作者所寫，他們把其他 ______ 塑造成精煉的敘事，自己卻始終不具名。", "opts": {"A": "people's story's", "B": "peoples story's", "C": "people's stories", "D": "peoples stories"}, "optsZh": {"A": "people's story's（story's 為所有格 → 後面沒有被擁有的名詞：錯誤）", "B": "peoples story's（所有格標錯位置：錯誤）", "C": "people's stories（people 的所有格＋複數名詞 stories：正確）", "D": "peoples stories（缺少所有格撇號：錯誤）"}, "answer": "C", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Standard English: logical subject after participial phrase.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "had sheltered", "B": "shelters", "C": "would shelter", "D": "sheltered"}, "optsZh": {"A": "had sheltered（過去完成式 → 不能表達普遍事實：錯誤）", "B": "shelters（一般現在式，單數，表普遍事實：正確）", "C": "would shelter（條件語氣 → 不能表達普遍事實：錯誤）", "D": "sheltered（一般過去式 → 不能表達普遍事實：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Standard English: logical subject after participial phrase.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively, during", "B": "triumphed--decisively--during", "C": "triumphed--decisively during", "D": "triumphed--decisively. During"}, "optsZh": {"A": "triumphed--decisively, during（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "triumphed--decisively--during（破折號 → 兩個獨立子句連接不當：錯誤）", "C": "triumphed--decisively during（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "D": "triumphed--decisively. During（句號分隔兩個獨立句子：正確）"}, "answer": "D", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Standard English: logical subject after participial phrase.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "is", "C": "are", "D": "have been"}, "optsZh": {"A": "were（be 動詞複數過去式，主詞須為複數）", "B": "is（單數動詞 → 與複數主詞不一致：錯誤）", "C": "are（複數現在式 → 時態與敘述的過去事件不一致：錯誤）", "D": "have been（現在完成式 → 時態與敘述的過去事件不一致：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: logical subject after participial phrase.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她發表了一個能運作數小時的全尺寸版本。", "opts": {"A": "prototype,", "B": "prototype, later,", "C": "prototype later,", "D": "prototype;"}, "optsZh": {"A": "prototype,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "prototype, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "prototype later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "D": "prototype;（分號連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: semicolon in parallel list.", "vocab": false, "body": "The Arctic-Alpine Botanic Garden in Norway and the Jardim Botanico of Rio de Janeiro in Brazil are two of many <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanical\" target=\"_blank\" rel=\"noopener\" data-w=\"botanical\" data-pos=\"adj.\" data-en=\"related to plants\" data-zh=\"植物的\">botanical<\/a> gardens around the world dedicated to growing diverse plant _______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foster\" target=\"_blank\" rel=\"noopener\" data-w=\"foster\" data-pos=\"v.\" data-en=\"to help something grow or develop\" data-zh=\"培養；滋養\">fostering<\/a> scientific research; and educating the public about plant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a>.", "bodyPlain": "The Arctic-Alpine Botanic Garden in Norway and the Jardim Botanico of Rio de Janeiro in Brazil are two of many botanical gardens around the world dedicated to growing diverse plant _______ fostering scientific research; and educating the public about plant conservation.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "挪威的 Arctic-Alpine Botanic Garden 與巴西的 Jardim Botanico of Rio de Janeiro，是世界上眾多致力於栽培多樣植物 _______ 促進科學研究；以及教育大眾植物保育的植物園中的兩座。", "opts": {"A": "species, both native and nonnative,", "B": "species, both native and nonnative;", "C": "species; both native and nonnative,", "D": "species both native and nonnative,"}, "optsZh": {"A": "species, both native and nonnative,（列舉中其他項目以分號分隔，此處用逗號 → 不一致：錯誤）", "B": "species, both native and nonnative;（逗號隔開補充說明，分號分隔列舉項目：正確）", "C": "species; both native and nonnative,（分號位置錯誤，切斷名詞與其補充說明：錯誤）", "D": "species both native and nonnative,（缺少逗號，且列舉項目之間應用分號：錯誤）"}, "answer": "B", "expl": "The list items contain commas, so they are separated by semicolons: growing diverse plant species, both native and nonnative; fostering research; and educating the public.", "explZh": "清單項目內含逗號，所以項目之間用分號分隔：growing... species, both native and nonnative; fostering...; and educating...。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: semicolon in parallel list.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。幾本掛名為知名運動員的回憶錄，其實是由合作者所寫，他們把其他 ______ 塑造成精煉的敘事，自己卻始終不具名。", "opts": {"A": "peoples story's", "B": "people's story's", "C": "peoples stories", "D": "people's stories"}, "optsZh": {"A": "peoples story's（所有格標錯位置：錯誤）", "B": "people's story's（story's 為所有格 → 後面沒有被擁有的名詞：錯誤）", "C": "peoples stories（缺少所有格撇號：錯誤）", "D": "people's stories（people 的所有格＋複數名詞 stories：正確）"}, "answer": "D", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: semicolon in parallel list.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"no
