  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: collect or gather a sample.", "original": "The spacecraft OSIRIS-REx briefly made contact with the asteroid 101955 Bennu in 2020. NASA scientist Daniella DellaGiustina reports that despite facing the unexpected obstacle of a surface mostly covered in boulders, OSIRIS-REx successfully _______ a sample of the surface, gathering pieces of it to bring back to Earth.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) attached\nB) collected\nC) followed\nD) replaced", "generated": [{"id": "1.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Despite rough seas and a malfunctioning winch, the research vessel successfully ______ sediment cores from the ocean floor, preserving layers of mud that contained evidence of past climate shifts.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) attached\nB) followed\nC) collected\nD) replaced", "answer": "C", "explanation": "Collected means gathered or obtained."}, {"id": "1.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The archive's staff ______ oral histories from longtime residents before the neighborhood was redeveloped, recording interviews that later helped historians reconstruct local cultural life.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) compiled\nB) discarded\nC) imitated\nD) postponed", "answer": "A", "explanation": "Compiled means gathered into a collection."}, {"id": "1.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the cave entrance was narrow and unstable, the team safely ______ mineral samples from the newly exposed chamber and transported them to the laboratory for analysis.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) replicated\nB) retrieved\nC) overlooked\nD) attached", "answer": "B", "explanation": "Retrieved means obtained or brought back."}, {"id": "1.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The probe's arm failed on its first attempt, but on the second attempt it ______ a small amount of dust from the comet's surface and sealed it inside a return capsule.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) disturbed\nB) followed\nC) gathered\nD) inspected", "answer": "C", "explanation": "Gathered means collected."}, {"id": "1.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. During the field season, the botanists ______ seeds from several rare grasses so that the plants could be grown later in a conservation greenhouse.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) predicted\nB) attached\nC) replaced\nD) harvested", "answer": "D", "explanation": "Harvested means collected, especially from plants."}]}, {"n": 2, "concept": "Words in Context: reflect or accurately show.", "original": "Research conducted by planetary scientist Katarina Miljkovic suggests that the Moon's surface may not accurately _______ early impact events. When the Moon was still forming, its surface was softer, and asteroid or meteoroid impacts would have left less of an impression; thus, evidence of early impacts may no longer be present.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) reflect\nB) receive\nC) evaluate\nD) mimic", "generated": [{"id": "2.1", "text": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The surviving tax records may not accurately ______ the town's eighteenth-century economy, since many informal exchanges between neighbors were never recorded by officials.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) reflect\nB) mimic\nC) receive\nD) evaluate", "answer": "A", "explanation": "Reflect means accurately represent or show."}, {"id": "2.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Because the survey was conducted only in urban neighborhoods, its results do not fully ______ the experiences of families living in remote agricultural communities.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) represent\nB) absorb\nC) imitate\nD) judge", "answer": "A", "explanation": "Represent means stand for or accurately show."}, {"id": "2.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The museum's early photographs ______ the building before its later renovations, making them valuable evidence of the architect's original design.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) replace\nB) distort\nC) document\nD) mimic", "answer": "C", "explanation": "Document means record or show evidence of."}, {"id": "2.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Tree rings from the valley may not reliably ______ past rainfall patterns because irrigation canals built nearby changed how much water reached the trees' roots.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) receive\nB) measure\nC) preserve\nD) indicate", "answer": "D", "explanation": "Indicate means show or point to."}, {"id": "2.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The fossil record in this region only partially ______ the diversity of ancient insects, since delicate wings and bodies rarely survived the process of fossilization.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) receives\nB) captures\nC) evaluates\nD) imitates", "answer": "B", "explanation": "Captures means records or represents."}]}, {"n": 3, "concept": "Words in Context: recognizable or easy to observe.", "original": "Handedness, a preferential use of either the right or left hand, typically is easy to observe in humans. Because this trait is present but less _______ in many other animals, animal-behavior researchers often employ tasks specially designed to reveal individual animals' preferences for a certain hand or paw.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) recognizable\nB) intriguing\nC) significant\nD) useful", "generated": [{"id": "3.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Although stress responses are obvious in some laboratory animals, they are less ______ in many wild species, so researchers use indirect measures such as hormone levels and feeding behavior.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) intriguing\nB) useful\nC) significant\nD) recognizable", "answer": "D", "explanation": "Recognizable means easy to identify or observe."}, {"id": "3.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The early stages of the disease are often not ______ during routine examinations, which is why physicians may rely on blood tests rather than visible symptoms alone.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) useful\nB) flexible\nC) valuable\nD) apparent", "answer": "D", "explanation": "Apparent means clearly visible or noticeable."}, {"id": "3.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Because the chemical reaction produces no dramatic color change, the process is difficult for students to observe unless the teacher uses an indicator that makes it more ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) complex\nB) efficient\nC) visible\nD) controversial", "answer": "C", "explanation": "Visible means able to be seen."}, {"id": "3.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The influence of the older melody is ______ in the composer's later work: several phrases reappear almost unchanged in the final movement.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) detectable\nB) ordinary\nC) useful\nD) irrelevant", "answer": "A", "explanation": "Detectable means able to be noticed or discovered."}, {"id": "3.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In young trees, the difference between the two species is barely ______, but mature trees can be distinguished by the shape and texture of their bark.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) significant\nB) perceptible\nC) productive\nD) intriguing", "answer": "B", "explanation": "Perceptible means noticeable."}]}, {"n": 4, "concept": "Words in Context: not unimportant.", "original": "It is by no means _______ to recognize the influence of Dutch painter Hieronymus Bosch on Ali Banisadr's paintings; indeed, Banisadr himself cites Bosch as an inspiration. However, some scholars have suggested that the ancient Mesopotamian poem Epic of Gilgamesh may have had a far greater impact on Banisadr's work.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) substantial\nB) satisfying\nC) unimportant\nD) appropriate", "generated": [{"id": "4.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The historian argues that the poet's early essays are by no means ______; although rarely discussed, they reveal the political commitments that later shaped her major works.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) satisfying\nB) unimportant\nC) appropriate\nD) substantial", "answer": "B", "explanation": "Unimportant is negated by 'by no means,' so the sentence means the essays matter."}, {"id": "4.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The critic notes that the architect's brief apprenticeship was not ______ to her later development, since it introduced her to materials she used throughout her career.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) appropriate\nB) satisfying\nC) substantial\nD) irrelevant", "answer": "D", "explanation": "Not irrelevant means relevant or important."}, {"id": "4.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the mural occupies a narrow hallway, its placement is hardly ______: every visitor must pass it before entering the main gallery.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) decorative\nB) satisfying\nC) minor\nD) instructive", "answer": "C", "explanation": "Hardly minor means important or noticeable."}, {"id": "4.4", "text": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The committee concluded that the missing footnotes were not ______, because they affected how readers could evaluate the report's central claims.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) trivial\nB) useful\nC) substantial\nD) appropriate", "answer": "A", "explanation": "Not trivial means important."}, {"id": "4.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The scientist's correction may seem small, but it is by no means ______; changing the measurement alters the interpretation of the entire experiment.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) satisfying\nB) appropriate\nC) insignificant\nD) substantial", "answer": "C", "explanation": "By no means insignificant means significant."}]}, {"n": 5, "concept": "Literary purpose: conflicted feelings.", "original": "The following text is adapted from Susan Glaspell's 1912 short story \"Out There.\" An elderly shop owner is looking at a picture that he recently acquired and hopes to sell.\n\nIt did seem that the picture failed to fit in with the rest of the shop. A persuasive young fellow who claimed he was closing out his stock let the old man have it for what he called a song. It was only a little out-of-the-way store which subsisted chiefly on the framing of pictures. The old man looked around at his views of the city, his pictures of cats and dogs, his flaming bits of landscape. \"Don't belong in here,\" he fumed. And yet the old man was secretly proud of his acquisition. There was a hidden dignity in his scowling as he shuffled about pondering the least ridiculous place for the picture.\n\nWhich choice best states the main purpose of the text?\nA) To reveal the shop owner's conflicted feelings about the new picture\nB) To convey the shop owner's resentment of the person he got the new picture from\nC) To describe the items that the shop owner most highly prizes\nD) To explain differences between the new picture and other pictures in the shop", "generated": [{"id": "5.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To argue that the characters should leave the house\nB) To portray a setting and mood as characters prepare for an arrival\nC) To summarize a conflict between two relatives\nD) To explain why music has lost its importance", "answer": "B", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "5.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To compare several forms of transportation\nB) To present an atmosphere of departure and possibility\nC) To list the technical features of a harbor\nD) To criticize sailors for taking unnecessary risks", "answer": "B", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "5.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To depict preparations that reveal anticipation within a family\nB) To explain why the family dislikes visitors\nC) To contrast rural and urban customs\nD) To describe a completed celebration from beginning to end", "answer": "A", "explanation": "The details focus on preparation and anticipation."}, {"id": "5.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To evaluate the quality of a school's curriculum\nB) To argue that early classes should be canceled\nC) To recount a student's entire academic career\nD) To describe the moments before a significant daily activity begins", "answer": "D", "explanation": "The purpose is to depict a scene before an event."}, {"id": "5.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) To give instructions for maintaining a garden\nB) To reveal the full contents of a letter\nC) To establish a reflective mood before a character acts\nD) To compare two different seasons", "answer": "C", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 6, "concept": "Poetry structure: description followed by interpretation question.", "original": "The following text is from the 1923 poem \"Black Finger\" by Angelina Weld Grimke, a Black American writer. A cypress is a type of evergreen tree.\n\nI have just seen a most beautiful thing,\nSlim and still,\nAgainst a gold, gold sky,\nA straight black cypress,\nSensitive,\nExquisite,\nA black finger\nPointing upwards.\nWhy, beautiful still finger, are you black?\nAnd why are you pointing upwards?\n\nWhich choice best describes the overall structure of the text?\nA) The speaker assesses a natural phenomenon, then questions the accuracy of her assessment.\nB) The speaker describes a distinctive sight in nature, then ponders what meaning to attribute to that sight.\nC) The speaker presents an outdoor scene, then considers a human behavior occurring within that scene.\nD) The speaker examines her surroundings, then speculates about their influence on her emotional state.", "generated": [{"id": "6.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best describes the structure or function of the text?\n\nA) To portray a setting and mood as characters prepare for an arrival\nB) To argue that the characters should leave the house\nC) To explain why music has lost its importance\nD) To summarize a conflict between two relatives", "answer": "A", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "6.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best describes the structure or function of the text?\n\nA) To criticize sailors for taking unnecessary risks\nB) To compare several forms of transportation\nC) To list the technical features of a harbor\nD) To present an atmosphere of departure and possibility", "answer": "D", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "6.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best describes the structure or function of the text?\n\nA) To explain why the family dislikes visitors\nB) To describe a completed celebration from beginning to end\nC) To depict preparations that reveal anticipation within a family\nD) To contrast rural and urban customs", "answer": "C", "explanation": "The details focus on preparation and anticipation."}, {"id": "6.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best describes the structure or function of the text?\n\nA) To evaluate the quality of a school's curriculum\nB) To describe the moments before a significant daily activity begins\nC) To argue that early classes should be canceled\nD) To recount a student's entire academic career", "answer": "B", "explanation": "The purpose is to depict a scene before an event."}, {"id": "6.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best describes the structure or function of the text?\n\nA) To compare two different seasons\nB) To establish a reflective mood before a character acts\nC) To reveal the full contents of a letter\nD) To give instructions for maintaining a garden", "answer": "B", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 7, "concept": "Poetry structure: answer criticism, then announce ambition.", "original": "The following text is from Walt Whitman's 1860 poem \"Calamus 24.\"\n\nI HEAR it is charged against me that I seek to destroy institutions;\nBut really I am neither for nor against institutions\n(What indeed have I in common with them?--Or what with the destruction of them?),\nOnly I will establish in the Mannahatta [Manhattan] and in every city of These States, inland and seaboard,\nAnd in the fields and woods, and above every keel [ship] little or large, that dents the water,\nWithout edifices, or rules, or trustees, or any argument,\nThe institution of the dear love of comrades.\n\nWhich choice best describes the overall structure of the text?\nA) The speaker questions an increasingly prevalent attitude, then summarizes his worldview.\nB) The speaker regrets his isolation from others, then predicts a profound change in society.\nC) The speaker concedes his personal shortcomings, then boasts of his many achievements.\nD) The speaker addresses a criticism leveled against him, then announces a grand ambition of his.", "generated": [{"id": "7.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.\n\nWhich choice best describes the structure or function of the text?\n\nA) To portray a setting and mood as characters prepare for an arrival\nB) To summarize a conflict between two relatives\nC) To argue that the characters should leave the house\nD) To explain why music has lost its importance", "answer": "A", "explanation": "The passage primarily establishes scene and expectation."}, {"id": "7.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.\n\nWhich choice best describes the structure or function of the text?\n\nA) To compare several forms of transportation\nB) To present an atmosphere of departure and possibility\nC) To criticize sailors for taking unnecessary risks\nD) To list the technical features of a harbor", "answer": "B", "explanation": "The central purpose is atmospheric rather than argumentative."}, {"id": "7.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.\n\nWhich choice best describes the structure or function of the text?\n\nA) To contrast rural and urban customs\nB) To explain why the family dislikes visitors\nC) To depict preparations that reveal anticipation within a family\nD) To describe a completed celebration from beginning to end", "answer": "C", "explanation": "The details focus on preparation and anticipation."}, {"id": "7.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.\n\nWhich choice best describes the structure or function of the text?\n\nA) To recount a student's entire academic career\nB) To argue that early classes should be canceled\nC) To evaluate the quality of a school's curriculum\nD) To describe the moments before a significant daily activity begins", "answer": "D", "explanation": "The purpose is to depict a scene before an event."}, {"id": "7.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.\n\nWhich choice best describes the structure or function of the text?\n\nA) To compare two different seasons\nB) To give instructions for maintaining a garden\nC) To reveal the full contents of a letter\nD) To establish a reflective mood before a character acts", "answer": "D", "explanation": "The setting prepares a mood of reflection and expectation."}]}, {"n": 8, "concept": "Text Structure: function of a generalization.", "original": "The mimosa tree evolved in East Asia, where the beetle Bruchidius terrenus preys on its seeds. In 1785, mimosa trees were introduced to North America, far from any B. terrenus. But evolutionary links between predators and their prey can persist across centuries and continents. Around 2001, B. terrenus was introduced in southeastern North America near where botanist Shu-Mei Chang and colleagues had been monitoring mimosa trees. Within a year, 93 percent of the trees had been attacked by the beetles.\n\nWhich choice best describes the function of the third sentence in the overall structure of the text?\nA) It states the hypothesis that Chang and colleagues had set out to investigate using mimosa trees and B. terrenus.\nB) It presents a generalization that is exemplified by the discussion of the mimosa trees and B. terrenus.\nC) It offers an alternative explanation for the findings of Chang and colleagues.\nD) It provides context that clarifies why the species mentioned spread to new locations.", "generated": [{"id": "8.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the structure or function of the text?\n\nA) It describes how other researchers criticized the work.\nB) It states the study's final conclusion.\nC) It identifies the uncertainty that motivated the study.\nD) It offers evidence that radar is always reliable.", "answer": "C", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "8.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the structure or function of the text?\n\nA) It shifts the discussion away from archaeology.\nB) It defines the problem the later investigation attempts to address.\nC) It contradicts the claim made in the first sentence.\nD) It summarizes the team's strongest result.", "answer": "B", "explanation": "The sentence frames the central research question."}, {"id": "8.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the structure or function of the text?\n\nA) It introduces a gap in knowledge that the experiment examines.\nB) It gives a historical overview of plant classification.\nC) It lists the materials used in the experiment.\nD) It proves that drought has no effect on plants.", "answer": "A", "explanation": "The sentence identifies an unresolved issue."}, {"id": "8.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the structure or function of the text?\n\nA) It raises a difficulty with a common interpretation.\nB) It introduces an unrelated theme.\nC) It provides biographical information about the novelist.\nD) It summarizes the novel's publication history.", "answer": "A", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "8.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the structure or function of the text?\n\nA) It gives a personal anecdote about engineers.\nB) It compares underwater vehicles with aircraft.\nC) It announces that the technology is already flawless.\nD) It explains the limitation that the new system is meant to address.", "answer": "D", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 9, "concept": "Paired Texts: challenge linear progression.", "original": "Text 1\nConventional wisdom long held that human social systems evolved in stages, beginning with hunter-gatherers forming small bands of members with roughly equal status. The shift to agriculture about 12,000 years ago sparked population growth that led to the emergence of groups with hierarchical structures: associations of clans first, then chiefdoms, and finally, bureaucratic states.\n\nText 2\nIn a 2021 book, anthropologist David Graeber and archaeologist David Wengrow maintain that humans have always been socially flexible, alternately forming systems based on hierarchy and collective ones with decentralized leadership. The authors point to evidence that as far back as 50,000 years ago some hunter-gatherers adjusted their social structures seasonally, at times dispersing in small groups but also assembling into communities that included esteemed individuals.\n\nBased on the texts, how would Graeber and Wengrow (Text 2) most likely respond to the \"conventional wisdom\" presented in Text 1?\nA) By conceding the importance of hierarchical systems but asserting the greater significance of decentralized collective societies\nB) By disputing the idea that developments in social structures have followed a linear progression through distinct stages\nC) By acknowledging that hierarchical roles likely weren't a part of social systems before the rise of agriculture\nD) By challenging the assumption that groupings of hunter-gatherers were among the earliest forms of social structure", "generated": [{"id": "9.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nBased on the texts, which response is best supported?\n\nA) 'The leader's speeches are preserved in several archives.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The administration faced economic challenges from the beginning.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "B", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "9.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nBased on the texts, which response is best supported?\n\nA) Some farmers grew vegetables, while others grew grain.\nB) The graph contains information about three regions.\nC) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nD) The southern region was included in the survey.", "answer": "C", "explanation": "The answer uses a specific contrast in the data."}, {"id": "9.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nBased on the texts, which response is best supported?\n\nA) The method used to study stars requires a telescope.\nB) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nC) One rocky planet has a thin atmosphere.\nD) Some stars contain hydrogen and helium.", "answer": "B", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "9.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nBased on the texts, which response is best supported?\n\nA) The tradition is studied by scholars in several countries.\nB) Some songs use a meter also found in older European poetry.\nC) Many performers learned songs from relatives.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "9.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nBased on the texts, which response is best supported?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) The program took place in a community.\nC) The table includes more than one year.\nD) Both towns had some volunteers.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 10, "concept": "Reading Detail: character satisfaction.", "original": "The following text is adapted from Frances Hodgson Burnett's 1911 novel The Secret Garden. Mary, a young girl, recently found an overgrown hidden garden.\n\nMary was an odd, determined little person, and now she had something interesting to be determined about, she was very much absorbed, indeed. She worked and dug and pulled up weeds steadily, only becoming more pleased with her work every hour instead of tiring of it. It seemed to her like a fascinating sort of play.\n\nWhich choice best states the main idea of the text?\nA) Mary hides in the garden to avoid doing her chores.\nB) Mary is getting bored with pulling up so many weeds in the garden.\nC) Mary is clearing out the garden to create a space to play.\nD) Mary feels very satisfied when she's taking care of the garden.", "generated": [{"id": "10.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) She refuses to give advice to others.\nB) She lacks affection for her family.\nC) She is admired mainly for her wealth.\nD) She shows unusual maturity and self-command.", "answer": "D", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "10.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) The family ignores the grandmother's opinions.\nB) The grandmother's influence is quiet but substantial.\nC) The grandmother avoids family matters entirely.\nD) The narrator thinks patience is useless.", "answer": "B", "explanation": "The family respects her careful judgment."}, {"id": "10.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) The business fails because of excessive caution.\nB) The clerk's carefulness is valuable despite being inconvenient.\nC) The clerk intentionally creates errors.\nD) The coworkers are more accurate than the clerk.", "answer": "B", "explanation": "The passage praises his precision."}, {"id": "10.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) The leader is unable to reach conclusions.\nB) The leader dislikes public meetings.\nC) The leader values inclusive deliberation.\nD) The leader makes decisions without hearing others.", "answer": "C", "explanation": "The evidence shows patience and inclusion."}, {"id": "10.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) She combines intellectual openness with rigorous standards.\nB) She rejects all imaginative thinking.\nC) She publishes claims before testing them.\nD) She avoids working with students.", "answer": "A", "explanation": "The contrast shows openness and rigor."}]}, {"n": 11, "concept": "Poetry inference: analogy for nourishment.", "original": "The following text is from Ezra Pound's 1909 poem \"Hymn III,\" based on the work of Marcantonio Flaminio.\n\nAs a fragile and lovely flower unfolds its gleaming foliage on the breast of the fostering earth, if the dew and the rain draw it forth;\nSo doth my tender mind flourish, if it be fed with the sweet dew of the fostering spirit,\nLacking this, it beginneth straightway to languish, even as a floweret born upon dry earth, if the dew and the rain tend it not.\n\nBased on the text, in what way is the human mind like a flower?\nA) It becomes increasingly vigorous with the passage of time.\nB) It draws strength from changes in the weather.\nC) It requires proper nourishment in order to thrive.\nD) It perseveres despite challenging circumstances.", "generated": [{"id": "11.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) She lacks affection for her family.\nB) She shows unusual maturity and self-command.\nC) She is admired mainly for her wealth.\nD) She refuses to give advice to others.", "answer": "B", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "11.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The grandmother's influence is quiet but substantial.\nB) The family ignores the grandmother's opinions.\nC) The narrator thinks patience is useless.\nD) The grandmother avoids family matters entirely.", "answer": "A", "explanation": "The family respects her careful judgment."}, {"id": "11.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The business fails because of excessive caution.\nB) The clerk intentionally creates errors.\nC) The coworkers are more accurate than the clerk.\nD) The clerk's carefulness is valuable despite being inconvenient.", "answer": "D", "explanation": "The passage praises his precision."}, {"id": "11.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The leader values inclusive deliberation.\nB) The leader makes decisions without hearing others.\nC) The leader is unable to reach conclusions.\nD) The leader dislikes public meetings.", "answer": "A", "explanation": "The evidence shows patience and inclusion."}, {"id": "11.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) She rejects all imaginative thinking.\nB) She publishes claims before testing them.\nC) She combines intellectual openness with rigorous standards.\nD) She avoids working with students.", "answer": "C", "explanation": "The contrast shows openness and rigor."}]}, {"n": 12, "concept": "Reading Detail: character preference.", "original": "The following text is adapted from Jack London's 1903 novel The Call of the Wild. Buck is a sled dog living with John Thornton in Yukon, Canada.\n\nThornton alone held [Buck]. The rest of mankind was as nothing. Chance travellers might praise or pet him; but he was cold under it all, and from a too demonstrative man he would get up and walk away. When Thornton's partners, Hans and Pete, arrived on the long-expected raft, Buck refused to notice them till he learned they were close to Thornton; after that he tolerated them in a passive sort of way, accepting favors from them as though he favored them by accepting.\n\nWhich choice best states the main idea of the text?\nA) Buck has become less social since he began living with Thornton.\nB) Buck mistrusts humans and does his best to avoid them.\nC) Buck has been especially well liked by most of Thornton's friends.\nD) Buck holds Thornton in higher regard than any other person.", "generated": [{"id": "12.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) She refuses to give advice to others.\nB) She shows unusual maturity and self-command.\nC) She lacks affection for her family.\nD) She is admired mainly for her wealth.", "answer": "B", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "12.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) The narrator thinks patience is useless.\nB) The family ignores the grandmother's opinions.\nC) The grandmother avoids family matters entirely.\nD) The grandmother's influence is quiet but substantial.", "answer": "D", "explanation": "The family respects her careful judgment."}, {"id": "12.3", "text": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) The business fails because of excessive caution.\nB) The coworkers are more accurate than the clerk.\nC) The clerk intentionally creates errors.\nD) The clerk's carefulness is valuable despite being inconvenient.", "answer": "D", "explanation": "The passage praises his precision."}, {"id": "12.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) The leader is unable to reach conclusions.\nB) The leader makes decisions without hearing others.\nC) The leader values inclusive deliberation.\nD) The leader dislikes public meetings.", "answer": "C", "explanation": "The evidence shows patience and inclusion."}, {"id": "12.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nWhich choice best states the main idea or main purpose of the text?\n\nA) She combines intellectual openness with rigorous standards.\nB) She publishes claims before testing them.\nC) She rejects all imaginative thinking.\nD) She avoids working with students.", "answer": "A", "explanation": "The contrast shows openness and rigor."}]}, {"n": 13, "concept": "Quantitative Evidence: complete graph statement.", "original": "US States with the Greatest Number of Organic Farms in 2016\n\nOrganic farming is a method of growing food that tries to reduce environmental harm by using natural forms of pest control and avoiding fertilizers made with synthetic materials. Organic farms are still a small fraction of the total farms in the United States, but they have been becoming more popular. According to the US Department of Agriculture, in 2016 California had between 2,600 and 2,800 organic farms and _______\n\nWhich choice most effectively uses data from the graph to complete the text?\nA) Washington had between 600 and 800 organic farms.\nB) New York had fewer than 800 organic farms.\nC) Wisconsin and Iowa each had between 1,200 and 1,400 organic farms.\nD) Pennsylvania had more than 1,200 organic farms.", "generated": [{"id": "13.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader signed several decrees during his first month in office.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "13.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The graph contains information about three regions.\nB) Some farmers grew vegetables, while others grew grain.\nC) The southern region was included in the survey.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "13.3", "text": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The method used to study stars requires a telescope.\nB) One rocky planet has a thin atmosphere.\nC) Some stars contain hydrogen and helium.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "13.4", "text": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Many performers learned songs from relatives.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) Some songs use a meter also found in older European poetry.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "13.5", "text": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) Both towns had some volunteers.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The program took place in a community.\nD) The table includes more than one year.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 14, "concept": "Command of Evidence: support biological divergence hypothesis.", "original": "Biologist Valentina Gomez-Bahamon and her team have investigated two subspecies of the fork-tailed flycatcher bird that live in the same region in Colombia, but one subspecies migrates south for part of the year, and the other doesn't. The researchers found that, due to slight differences in feather shape, the feathers of migratory forked-tailed flycatcher males make a sound during flight that is higher pitched than that made by the feathers of nonmigratory males. The researchers hypothesize that fork-tailed flycatcher females are attracted to the specific sound made by the males of their own subspecies, and that over time the females' preference will drive further genetic and anatomical divergence between the subspecies.\n\nWhich finding, if true, would most directly support Gomez-Bahamon and her team's hypothesis?\nA) The feathers located on the wings of the migratory fork-tailed flycatchers have a narrower shape than those of the nonmigratory birds, which allows them to fly long distances.\nB) Over several generations, the sound made by the feathers of migratory male fork-tailed flycatchers grows progressively higher pitched relative to that made by the feathers of nonmigratory males.\nC) Fork-tailed flycatchers communicate different messages to each other depending on whether their feathers create high-pitched or low-pitched sounds.\nD) The breeding habits of the migratory and nonmigratory fork-tailed flycatchers remained generally the same over several generations.", "generated": [{"id": "14.1", "text": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, table, graph, or study?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The leader signed several decrees during his first month in office.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "B", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "14.2", "text": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the
