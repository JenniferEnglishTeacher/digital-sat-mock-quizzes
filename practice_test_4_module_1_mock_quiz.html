"word": "minor"}, "D": {"pos": "adj.", "en": "giving useful information or lessons", "zh": "有教育意義的；有啟發性的", "word": "instructive"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: not unimportant.", "vocab": true, "body": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The committee <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that the missing footnotes were not ______, because they affected how readers could evaluate the report&#x27;s central claims.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The committee concluded that the missing footnotes were not ______, because they affected how readers could evaluate the report's central claims.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。委員會的結論是，那些遺漏的註腳並非 ______，因為它們影響了讀者評估這份報告核心主張的方式。", "opts": {"A": "trivial", "B": "useful", "C": "substantial", "D": "appropriate"}, "optsZh": {"A": "trivial（瑣碎的、微不足道的）", "B": "useful（有用的）", "C": "substantial（大量的、重要的）", "D": "appropriate（適當的、合適的）"}, "answer": "A", "expl": "Not trivial means important.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "not important or serious", "zh": "瑣碎的；微不足道的", "word": "trivial"}, "B": {"pos": "adj.", "en": "helpful for doing something", "zh": "有用的", "word": "useful"}, "C": {"pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；重大的", "word": "substantial"}, "D": {"pos": "adj.", "en": "suitable or right for a particular situation", "zh": "適當的；恰當的", "word": "appropriate"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: not unimportant.", "vocab": true, "body": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The scientist&#x27;s correction may seem small, but it is by no means ______; changing the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> alters the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> of the entire experiment.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The scientist's correction may seem small, but it is by no means ______; changing the measurement alters the interpretation of the entire experiment.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位科學家的修正看似微小，但絕非 ______；改變這項測量會改變對整個實驗的詮釋。", "opts": {"A": "satisfying", "B": "appropriate", "C": "insignificant", "D": "substantial"}, "optsZh": {"A": "satisfying（令人滿意的）", "B": "appropriate（適當的、合適的）", "C": "insignificant（無關緊要的、微不足道的）", "D": "substantial（大量的、重要的）"}, "answer": "C", "expl": "By no means insignificant means significant.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "giving a feeling of pleasure or contentment", "zh": "令人滿意的", "word": "satisfying"}, "B": {"pos": "adj.", "en": "suitable or right for a particular situation", "zh": "適當的；恰當的", "word": "appropriate"}, "C": {"pos": "adj.", "en": "too small or unimportant to matter", "zh": "微不足道的", "word": "insignificant"}, "D": {"pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；重大的", "word": "substantial"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Literary purpose: conflicted feelings.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Susan Glaspell&#x27;s 1912 short story &quot;Out There.&quot; An elderly shop owner is looking at a picture that he recently acquired and hopes to sell.<br><br>It did seem that the picture failed to fit in with the rest of the shop. A persuasive young fellow who <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claimed<\/a> he was closing out his stock let the old man have it for what he called a song. It was only a little out-of-the-way store which subsisted chiefly on the framing of pictures. The old man looked around at his views of the city, his pictures of cats and dogs, his flaming bits of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscape<\/a>. &quot;Don&#x27;t belong in here,&quot; he fumed. And yet the old man was secretly proud of his acquisition. There was a hidden <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=dignity\" target=\"_blank\" rel=\"noopener\" data-w=\"dignity\" data-pos=\"n.\" data-en=\"the quality of being worthy of respect\" data-zh=\"尊嚴\">dignity<\/a> in his scowling as he shuffled about pondering the least ridiculous place for the picture.", "bodyPlain": "The following text is adapted from Susan Glaspell's 1912 short story \"Out There.\" An elderly shop owner is looking at a picture that he recently acquired and hopes to sell.\n\nIt did seem that the picture failed to fit in with the rest of the shop. A persuasive young fellow who claimed he was closing out his stock let the old man have it for what he called a song. It was only a little out-of-the-way store which subsisted chiefly on the framing of pictures. The old man looked around at his views of the city, his pictures of cats and dogs, his flaming bits of landscape. \"Don't belong in here,\" he fumed. And yet the old man was secretly proud of his acquisition. There was a hidden dignity in his scowling as he shuffled about pondering the least ridiculous place for the picture.", "stem": "Which choice best states the main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主要目的？", "bodyZh": "以下文字改寫自 Susan Glaspell 1912 年的短篇小說〈Out There〉。一位年長的店主正看著一幅他最近購得、希望能賣出的畫。\n這幅畫看起來確實和店裡其他的東西格格不入。一個能言善道的年輕人自稱正在出清存貨，以他所謂的「白菜價」把畫讓給了老人。這只是一家偏僻的小店，主要靠替畫作裝框維生。老人環顧著他那些城市風景畫、貓狗圖畫，以及色彩濃烈的風景小品。「不屬於這裡，」他氣呼呼地說。然而，老人私底下卻為他購得的這件東西感到自豪。當他拖著腳步走來走去、思索著要把這幅畫放在哪裡才最不突兀時，他緊皺的眉頭裡藏著一股尊嚴。", "opts": {"A": "To reveal the shop owner's conflicted feelings about the new picture", "B": "To convey the shop owner's resentment of the person he got the new picture from", "C": "To describe the items that the shop owner most highly prizes", "D": "To explain differences between the new picture and other pictures in the shop"}, "optsZh": {"A": "揭示店主對這幅新畫的矛盾心情", "B": "傳達店主對於賣給他這幅新畫的人的怨恨", "C": "描述店主最珍視的物品", "D": "說明這幅新畫與店裡其他畫作的差異"}, "answer": "A", "expl": "The old man complains the picture 'don't belong in here,' yet he is 'secretly proud' of it—conflicting feelings.", "explZh": "老人抱怨這幅畫「不屬於這裡」，卻又「暗自得意」，顯示他對新畫的情感是矛盾的。"}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Literary purpose: conflicted feelings.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園裡帶著花回來。敘述細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To argue that the characters should leave the house", "B": "To portray a setting and mood as characters prepare for an arrival", "C": "To summarize a conflict between two relatives", "D": "To explain why music has lost its importance"}, "optsZh": {"A": "主張角色們應該離開這棟房子", "B": "在角色們準備迎接某人到來時，描繪場景與氣氛", "C": "概述兩位親戚之間的衝突", "D": "解釋為什麼音樂已失去其重要性"}, "answer": "B", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Literary purpose: conflicted feelings.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To present an atmosphere of departure and possibility", "C": "To list the technical features of a harbor", "D": "To criticize sailors for taking unnecessary risks"}, "optsZh": {"A": "比較幾種不同的交通方式", "B": "呈現一種啟程與充滿可能性的氛圍", "C": "列出一座港口的技術特點", "D": "批評水手冒不必要的風險"}, "answer": "B", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Literary purpose: conflicted feelings.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To depict preparations that reveal anticipation within a family", "B": "To explain why the family dislikes visitors", "C": "To contrast rural and urban customs", "D": "To describe a completed celebration from beginning to end"}, "optsZh": {"A": "描寫能顯露一家人期待之情的準備工作", "B": "解釋為什麼這家人不喜歡訪客", "C": "對比鄉村與都市的風俗", "D": "從頭到尾描述一場已經結束的慶祝活動"}, "answer": "A", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Literary purpose: conflicted feelings.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；而是凸顯了上課前那些安靜的例行儀式。", "opts": {"A": "To evaluate the quality of a school's curriculum", "B": "To argue that early classes should be canceled", "C": "To recount a student's entire academic career", "D": "To describe the moments before a significant daily activity begins"}, "optsZh": {"A": "評估一所學校課程的品質", "B": "主張應該取消早上的課", "C": "敘述一名學生的整個求學歷程", "D": "描述一項重要的日常活動開始前的片刻"}, "answer": "D", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Literary purpose: conflicted feelings.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best states the main idea or main purpose of the text?", "stemZh": "哪個選項最能說明這段文字的主旨或主要目的？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To give instructions for maintaining a garden", "B": "To reveal the full contents of a letter", "C": "To establish a reflective mood before a character acts", "D": "To compare two different seasons"}, "optsZh": {"A": "提供照料花園的說明", "B": "揭露一封信的完整內容", "C": "在角色採取行動之前營造一種沉思的氛圍", "D": "比較兩個不同的季節"}, "answer": "C", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Poetry structure: description followed by interpretation question.", "vocab": false, "body": "The following text is from the 1923 poem &quot;Black Finger&quot; by Angelina Weld Grimke, a Black American writer. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cypress\" target=\"_blank\" rel=\"noopener\" data-w=\"cypress\" data-pos=\"n.\" data-en=\"a type of evergreen tree\" data-zh=\"柏樹\">cypress<\/a> is a type of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evergreen\" target=\"_blank\" rel=\"noopener\" data-w=\"evergreen\" data-pos=\"adj.\" data-en=\"having leaves all year round\" data-zh=\"常綠的\">evergreen<\/a> tree.<br><br>I have just seen a most beautiful thing,<br>Slim and still,<br>Against a gold, gold sky,<br>A straight black cypress,<br>Sensitive,<br>Exquisite,<br>A black finger<br>Pointing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=upward\" target=\"_blank\" rel=\"noopener\" data-w=\"upward\" data-pos=\"adv.\" data-en=\"toward a higher place\" data-zh=\"向上地\">upwards<\/a>.<br>Why, beautiful still finger, are you black?<br>And why are you pointing upwards?", "bodyPlain": "The following text is from the 1923 poem \"Black Finger\" by Angelina Weld Grimke, a Black American writer. A cypress is a type of evergreen tree.\n\nI have just seen a most beautiful thing,\nSlim and still,\nAgainst a gold, gold sky,\nA straight black cypress,\nSensitive,\nExquisite,\nA black finger\nPointing upwards.\nWhy, beautiful still finger, are you black?\nAnd why are you pointing upwards?", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述這段文字的整體結構？", "bodyZh": "以下文字出自黑人美國作家 Angelina Weld Grimke 1923 年的詩作〈Black Finger〉。柏樹是一種常綠樹。\n我剛剛看見一樣最美麗的事物，\n纖細而靜止，\n映著金色、金色的天空，\n一棵挺直的黑色柏樹，\n敏感，\n精緻，\n一根黑色的手指\n指向天空。\n美麗而靜止的手指啊，你為何是黑色的？\n又為何指向天空？", "opts": {"A": "The speaker assesses a natural phenomenon, then questions the accuracy of her assessment.", "B": "The speaker describes a distinctive sight in nature, then ponders what meaning to attribute to that sight.", "C": "The speaker presents an outdoor scene, then considers a human behavior occurring within that scene.", "D": "The speaker examines her surroundings, then speculates about their influence on her emotional state."}, "optsZh": {"A": "說話者評估了一個自然現象，接著質疑自己評估的準確性。", "B": "說話者描述了大自然中一個獨特的景象，接著思索該賦予這個景象什麼意義。", "C": "說話者呈現一幅戶外景象，接著思考在這個景象中發生的一種人類行為。", "D": "說話者審視她周遭的環境，接著推測環境對她情緒狀態的影響。"}, "answer": "B", "expl": "The speaker first describes the striking black cypress against a gold sky, then asks why it is black and why it points upward—pondering its meaning.", "explZh": "詩人先描寫金色天空下一株挺立的黑色柏樹，接著問它為何是黑色、為何指向天空，思索這景象的意義。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Poetry structure: description followed by interpretation question.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園裡帶著花回來。敘述細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To argue that the characters should leave the house", "C": "To explain why music has lost its importance", "D": "To summarize a conflict between two relatives"}, "optsZh": {"A": "在角色們準備迎接某人到來時，描繪場景與氣氛", "B": "主張角色們應該離開這棟房子", "C": "解釋為什麼音樂已失去其重要性", "D": "概述兩位親戚之間的衝突"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Poetry structure: description followed by interpretation question.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To criticize sailors for taking unnecessary risks", "B": "To compare several forms of transportation", "C": "To list the technical features of a harbor", "D": "To present an atmosphere of departure and possibility"}, "optsZh": {"A": "批評水手冒不必要的風險", "B": "比較幾種不同的交通方式", "C": "列出一座港口的技術特點", "D": "呈現一種啟程與充滿可能性的氛圍"}, "answer": "D", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Poetry structure: description followed by interpretation question.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To explain why the family dislikes visitors", "B": "To describe a completed celebration from beginning to end", "C": "To depict preparations that reveal anticipation within a family", "D": "To contrast rural and urban customs"}, "optsZh": {"A": "解釋為什麼這家人不喜歡訪客", "B": "從頭到尾描述一場已經結束的慶祝活動", "C": "描寫能顯露一家人期待之情的準備工作", "D": "對比鄉村與都市的風俗"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Poetry structure: description followed by interpretation question.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；而是凸顯了上課前那些安靜的例行儀式。", "opts": {"A": "To evaluate the quality of a school's curriculum", "B": "To describe the moments before a significant daily activity begins", "C": "To argue that early classes should be canceled", "D": "To recount a student's entire academic career"}, "optsZh": {"A": "評估一所學校課程的品質", "B": "描述一項重要的日常活動開始前的片刻", "C": "主張應該取消早上的課", "D": "敘述一名學生的整個求學歷程"}, "answer": "B", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Poetry structure: description followed by interpretation question.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To compare two different seasons", "B": "To establish a reflective mood before a character acts", "C": "To reveal the full contents of a letter", "D": "To give instructions for maintaining a garden"}, "optsZh": {"A": "比較兩個不同的季節", "B": "在角色採取行動之前營造一種沉思的氛圍", "C": "揭露一封信的完整內容", "D": "提供照料花園的說明"}, "answer": "B", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Poetry structure: answer criticism, then announce ambition.", "vocab": false, "body": "The following text is from Walt Whitman&#x27;s 1860 poem &quot;Calamus 24.&quot;<br><br>I HEAR it is charged against me that I seek to destroy <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutions<\/a>;<br>But really I am neither for nor against institutions<br>(What indeed have I in common with them?--Or what with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=destruction\" target=\"_blank\" rel=\"noopener\" data-w=\"destruction\" data-pos=\"n.\" data-en=\"the act of destroying something\" data-zh=\"毀滅；破壞\">destruction<\/a> of them?),<br>Only I will <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establish\" target=\"_blank\" rel=\"noopener\" data-w=\"establish\" data-pos=\"v.\" data-en=\"to create or set up something\" data-zh=\"建立\">establish<\/a> in the Mannahatta [Manhattan] and in every city of These States, inland and seaboard,<br>And in the fields and woods, and above every keel [ship] little or large, that dents the water,<br>Without edifices, or rules, or trustees, or any argument,<br>The institution of the dear love of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=comrade\" target=\"_blank\" rel=\"noopener\" data-w=\"comrade\" data-pos=\"n.\" data-en=\"a close friend or companion\" data-zh=\"同伴；同志\">comrades<\/a>.", "bodyPlain": "The following text is from Walt Whitman's 1860 poem \"Calamus 24.\"\n\nI HEAR it is charged against me that I seek to destroy institutions;\nBut really I am neither for nor against institutions\n(What indeed have I in common with them?--Or what with the destruction of them?),\nOnly I will establish in the Mannahatta [Manhattan] and in every city of These States, inland and seaboard,\nAnd in the fields and woods, and above every keel [ship] little or large, that dents the water,\nWithout edifices, or rules, or trustees, or any argument,\nThe institution of the dear love of comrades.", "stem": "Which choice best describes the overall structure of the text?", "stemZh": "哪個選項最能描述這段文字的整體結構？", "bodyZh": "以下文字出自 Walt Whitman 1860 年的詩作〈Calamus 24〉。\n我聽說有人指控我企圖摧毀各種體制；\n但其實我既不支持也不反對體制\n（我和它們究竟有什麼共同之處？——或和摧毀它們又有什麼關係？），\n我只要在 Mannahatta（曼哈頓）以及這些州的每座城市，無論內陸或沿海，\n還有在田野與森林中，在每一艘劃破水面的大大小小的龍骨（船）之上，\n不靠建築、不靠規章、不靠受託人，也不靠任何辯論，\n建立起同志之間親愛之情的體制。", "opts": {"A": "The speaker questions an increasingly prevalent attitude, then summarizes his worldview.", "B": "The speaker regrets his isolation from others, then predicts a profound change in society.", "C": "The speaker concedes his personal shortcomings, then boasts of his many achievements.", "D": "The speaker addresses a criticism leveled against him, then announces a grand ambition of his."}, "optsZh": {"A": "說話者質疑一種日益普遍的態度，接著總結自己的世界觀。", "B": "說話者為自己與他人隔絕感到遺憾，接著預言社會將發生深刻的變化。", "C": "說話者承認自己的缺點，接著誇耀自己的許多成就。", "D": "說話者回應了一項針對他的批評，接著宣告自己的一個宏大抱負。"}, "answer": "D", "expl": "The speaker responds to the charge that he seeks to destroy institutions, then announces he will establish 'the institution of the dear love of comrades' everywhere.", "explZh": "詩人先回應「他想摧毀體制」的指控，接著宣告要在各地建立「同志間深厚情誼的體制」這個宏大抱負。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Poetry structure: answer criticism, then announce ambition.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. In a short story excerpt, an elderly musician waits beside an open window while a younger relative returns from the garden with flowers. The narration lingers on the evening light, the prepared room, and the small signs that a long-anticipated visitor is about to arrive.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。在一段短篇小說節選中，一位年長的音樂家在敞開的窗邊等待，而一位年輕的親戚正從花園裡帶著花回來。敘述細細描寫傍晚的光線、準備妥當的房間，以及那些顯示一位期盼已久的訪客即將到來的細微跡象。", "opts": {"A": "To portray a setting and mood as characters prepare for an arrival", "B": "To summarize a conflict between two relatives", "C": "To argue that the characters should leave the house", "D": "To explain why music has lost its importance"}, "optsZh": {"A": "在角色們準備迎接某人到來時，描繪場景與氣氛", "B": "概述兩位親戚之間的衝突", "C": "主張角色們應該離開這棟房子", "D": "解釋為什麼音樂已失去其重要性"}, "answer": "A", "expl": "The passage primarily establishes scene and expectation.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Poetry structure: answer criticism, then announce ambition.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker&#x27;s awareness that the travelers are entering uncertain but promising conditions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. A poem describes a speaker standing at the edge of a harbor as ships depart at dawn. Rather than narrating a completed journey, the poem emphasizes mist, movement, and the speaker's awareness that the travelers are entering uncertain but promising conditions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。一首詩描寫說話者站在港口邊，看著船隻在黎明時分啟航。這首詩並不敘述一段已完成的旅程，而是強調霧氣、動態，以及說話者意識到旅人們正進入不確定卻充滿希望的處境。", "opts": {"A": "To compare several forms of transportation", "B": "To present an atmosphere of departure and possibility", "C": "To criticize sailors for taking unnecessary risks", "D": "To list the technical features of a harbor"}, "optsZh": {"A": "比較幾種不同的交通方式", "B": "呈現一種啟程與充滿可能性的氛圍", "C": "批評水手冒不必要的風險", "D": "列出一座港口的技術特點"}, "answer": "B", "expl": "The central purpose is atmospheric rather than argumentative.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Poetry structure: answer criticism, then announce ambition.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A novel excerpt shows a crowded kitchen before a festival meal. The narrator notes the polished bowls, the careful arrangement of chairs, and the way family members pause whenever footsteps sound outside, waiting for a guest who has not visited for many years.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。一段小說節選呈現節慶大餐前擁擠的廚房。敘述者留意到擦得發亮的碗、精心排列的椅子，以及每當外面傳來腳步聲時家人便停下動作的樣子——他們在等待一位已經多年未曾來訪的客人。", "opts": {"A": "To contrast rural and urban customs", "B": "To explain why the family dislikes visitors", "C": "To depict preparations that reveal anticipation within a family", "D": "To describe a completed celebration from beginning to end"}, "optsZh": {"A": "對比鄉村與都市的風俗", "B": "解釋為什麼這家人不喜歡訪客", "C": "描寫能顯露一家人期待之情的準備工作", "D": "從頭到尾描述一場已經結束的慶祝活動"}, "answer": "C", "expl": "The details focus on preparation and anticipation.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Poetry structure: answer criticism, then announce ambition.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlights<\/a> the quiet rituals that precede it.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. A passage from a memoir describes a teacher unlocking a classroom before sunrise, straightening notebooks, and listening as students gather in the hallway. The text does not yet present the lesson itself; instead, it highlights the quiet rituals that precede it.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。一段回憶錄描述一位老師在日出前打開教室的門鎖、把筆記本擺整齊，並聆聽學生們在走廊上聚集的聲音。這段文字還沒有呈現課程本身；而是凸顯了上課前那些安靜的例行儀式。", "opts": {"A": "To recount a student's entire academic career", "B": "To argue that early classes should be canceled", "C": "To evaluate the quality of a school's curriculum", "D": "To describe the moments before a significant daily activity begins"}, "optsZh": {"A": "敘述一名學生的整個求學歷程", "B": "主張應該取消早上的課", "C": "評估一所學校課程的品質", "D": "描述一項重要的日常活動開始前的片刻"}, "answer": "D", "expl": "The purpose is to depict a scene before an event.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Poetry structure: answer criticism, then announce ambition.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. A literary passage presents a garden after rain: wet paths, bright leaves, and a bench set beneath a tree. A character pauses there with a letter in hand, and the description makes the setting feel calm but expectant.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n一段文學作品呈現雨後的花園：濕漉漉的小徑、鮮亮的葉子，以及樹下的一張長椅。一個角色手裡拿著一封信在那裡停下腳步，而這段描寫讓這個場景顯得平靜卻又充滿期待。", "opts": {"A": "To compare two different seasons", "B": "To give instructions for maintaining a garden", "C": "To reveal the full contents of a letter", "D": "To establish a reflective mood before a character acts"}, "optsZh": {"A": "比較兩個不同的季節", "B": "提供照料花園的說明", "C": "揭露一封信的完整內容", "D": "在角色採取行動之前營造一種沉思的氛圍"}, "answer": "D", "expl": "The setting prepares a mood of reflection and expectation.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Text Structure: function of a generalization.", "vocab": false, "body": "The mimosa tree evolved in East Asia, where the beetle Bruchidius terrenus preys on its seeds. In 1785, mimosa trees were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduced<\/a> to North America, far from any B. terrenus. But evolutionary links between <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a> and their prey can persist across centuries and continents. Around 2001, B. terrenus was introduced in southeastern North America near where <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=botanist\" target=\"_blank\" rel=\"noopener\" data-w=\"botanist\" data-pos=\"n.\" data-en=\"a scientist who studies plants\" data-zh=\"植物學家\">botanist<\/a> Shu-Mei Chang and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> had been monitoring mimosa trees. Within a year, 93 percent of the trees had been attacked by the beetles.", "bodyPlain": "The mimosa tree evolved in East Asia, where the beetle Bruchidius terrenus preys on its seeds. In 1785, mimosa trees were introduced to North America, far from any B. terrenus. But evolutionary links between predators and their prey can persist across centuries and continents. Around 2001, B. terrenus was introduced in southeastern North America near where botanist Shu-Mei Chang and colleagues had been monitoring mimosa trees. Within a year, 93 percent of the trees had been attacked by the beetles.", "stem": "Which choice best describes the function of the third sentence in the overall structure of the text?", "stemZh": "哪個選項最能描述第三句在全文整體結構中的功能？", "bodyZh": "合歡樹演化於東亞，在那裡甲蟲 Bruchidius terrenus 以它的種子為食。1785 年，合歡樹被引進北美洲，遠離任何 B. terrenus。但掠食者與獵物之間的演化關聯，可以跨越數個世紀和大陸而持續存在。大約在 2001 年，B. terrenus 被引進北美洲東南部，就在植物學家 Shu-Mei Chang 和同事一直在監測合歡樹的地點附近。不到一年，就有 93% 的樹遭到這些甲蟲侵襲。", "opts": {"A": "It states the hypothesis that Chang and colleagues had set out to investigate using mimosa trees and B. terrenus.", "B": "It presents a generalization that is exemplified by the discussion of the mimosa trees and B. terrenus.", "C": "It offers an alternative explanation for the findings of Chang and colleagues.", "D": "It provides context that clarifies why the species mentioned spread to new locations."}, "optsZh": {"A": "它說明 Chang 與同事原本打算用含羞草樹與 B. terrenus 來驗證的假設。", "B": "它提出一個概括性的論點，並以含羞草樹與 B. terrenus 的討論作為例證。", "C": "它為 Chang 與同事的研究結果提出另一種解釋。", "D": "它提供背景資訊，說明文中提到的物種為何會擴散到新的地點。"}, "answer": "B", "expl": "The third sentence states a general idea (predator–prey links can persist across centuries and continents), and the beetle attacking the mimosa trees is an example of it.", "explZh": "第三句提出一個概括性的說法（掠食者與獵物的演化關聯可跨越數百年與各大洲而持續），後文甲蟲攻擊合歡樹就是例證。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Text Structure: function of a generalization.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。一篇科學文章首先說明，彗星每次靠近太陽時，其表面都會發生變化。第二句指出，研究人員無法準確預測這些變化，因為人們對彗星的內部結構仍然所知甚少。最後一句描述一項研究，該研究測試雷達能否解決這個問題，卻發現訊號無法穿透得夠深。", "opts": {"A": "It describes how other researchers criticized the work.", "B": "It states the study's final conclusion.", "C": "It identifies the uncertainty that motivated the study.", "D": "It offers evidence that radar is always reliable."}, "optsZh": {"A": "它描述其他研究人員如何批評這項研究。", "B": "它陳述這項研究的最終結論。", "C": "它指出促成這項研究的不確定之處。", "D": "它提供證據證明雷達永遠可靠。"}, "answer": "C", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Text Structure: function of a generalization.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。一段考古學文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句解釋，這種交流所使用的路線至今仍不得而知，因為附近的道路幾乎沒有留下任何實體痕跡。接著，這段文章討論一個研究團隊，他們在陶器中尋找化學特徵，卻只得出暫時性的結論。", "opts": {"A": "It shifts the discussion away from archaeology.", "B": "It defines the problem the later investigation attempts to address.", "C": "It contradicts the claim made in the first sentence.", "D": "It summarizes the team's strongest result."}, "optsZh": {"A": "它把討論的焦點從考古學轉移開。", "B": "它界定了後續研究試圖處理的問題。", "C": "它反駁了第一句中的主張。", "D": "它概述這個團隊最有力的研究結果。"}, "answer": "B", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Text Structure: function of a generalization.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the structure or function of the text?", "stemZh": "哪個選項最能描述這段文字的結構或功能？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。一篇生物學文章指出，某種植物能夠在長期乾旱中存活。下一句解釋，科學家仍不確定是哪一種細胞機制讓這種植物得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It introduces a gap in knowledge that the experiment examines.", "B": "It gives a historical overview of plant classification.", "C": "It lists the materials used in the experiment.", "D": "It proves that drought has no effect on plants."}, "optsZh": {"A": "它引出實驗所要探究的知識缺口。", "B": "它概述了植物分類的歷史。", "C": "它列出實驗中使用的材料。", "D": "它證明乾旱對植物毫無影響。"}, "answer": "A", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Text Structure: function of a generalization.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that ar
