<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 4, Module 1</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 4, Module 1</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: collect or gather a sample.", "vocab": true, "body": "The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=spacecraft\" target=\"_blank\" rel=\"noopener\" data-w=\"spacecraft\" data-pos=\"n.\" data-en=\"a vehicle that travels in space\" data-zh=\"太空船\">spacecraft<\/a> OSIRIS-REx briefly made contact with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=asteroid\" target=\"_blank\" rel=\"noopener\" data-w=\"asteroid\" data-pos=\"n.\" data-en=\"a small rocky object that orbits the Sun\" data-zh=\"小行星\">asteroid<\/a> 101955 Bennu in 2020. NASA scientist Daniella DellaGiustina reports that despite facing the unexpected <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=obstacle\" target=\"_blank\" rel=\"noopener\" data-w=\"obstacle\" data-pos=\"n.\" data-en=\"something that blocks the way\" data-zh=\"障礙\">obstacle<\/a> of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> mostly covered in boulders, OSIRIS-REx successfully _______ a sample of the surface, gathering pieces of it to bring back to Earth.", "bodyPlain": "The spacecraft OSIRIS-REx briefly made contact with the asteroid 101955 Bennu in 2020. NASA scientist Daniella DellaGiustina reports that despite facing the unexpected obstacle of a surface mostly covered in boulders, OSIRIS-REx successfully _______ a sample of the surface, gathering pieces of it to bring back to Earth.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "太空船 OSIRIS-REx 在 2020 年曾短暫接觸小行星 101955 Bennu。NASA 科學家 Daniella DellaGiustina 報告指出，儘管面臨表面大多覆蓋著巨石這個意料之外的障礙，OSIRIS-REx 仍成功 _______ 了一份表面樣本，蒐集其碎片以帶回地球。", "opts": {"A": "attached", "B": "collected", "C": "followed", "D": "replaced"}, "optsZh": {"A": "attached（附加、連接）", "B": "collected（收集、採集）", "C": "followed（跟隨、遵循）", "D": "replaced（取代）"}, "answer": "B", "expl": "The spacecraft gathered pieces of the surface to bring back, so it 'collected' a sample.", "explZh": "太空船「收集碎片帶回地球」，所以是「collected」（採集）了樣本。", "defs": {"A": {"pos": "v.", "en": "fastened or joined one thing to another", "zh": "附上；連接", "word": "attached"}, "B": {"pos": "v.", "en": "gathered things together; obtained a sample", "zh": "收集；採集", "word": "collected"}, "C": {"pos": "v.", "en": "came after; went behind; acted according to", "zh": "跟隨；遵循", "word": "followed"}, "D": {"pos": "v.", "en": "put something new in place of something else", "zh": "取代；替換", "word": "replaced"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: collect or gather a sample.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Despite rough seas and a malfunctioning winch, the research vessel successfully ______ sediment cores from the ocean floor, preserving layers of mud that contained evidence of past climate shifts.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Despite rough seas and a malfunctioning winch, the research vessel successfully ______ sediment cores from the ocean floor, preserving layers of mud that contained evidence of past climate shifts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。儘管海況惡劣、絞盤又故障，這艘研究船仍成功從海底 ______ 沉積物岩芯，保存了含有過去氣候變遷證據的泥層。", "opts": {"A": "attached", "B": "followed", "C": "collected", "D": "replaced"}, "optsZh": {"A": "attached（附加、連接）", "B": "followed（跟隨、遵循）", "C": "collected（收集、採集）", "D": "replaced（取代）"}, "answer": "C", "expl": "Collected means gathered or obtained.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "fastened or joined one thing to another", "zh": "附上；連接", "word": "attached"}, "B": {"pos": "v.", "en": "came after; went behind; acted according to", "zh": "跟隨；遵循", "word": "followed"}, "C": {"pos": "v.", "en": "gathered things together; obtained a sample", "zh": "收集；採集", "word": "collected"}, "D": {"pos": "v.", "en": "put something new in place of something else", "zh": "取代；替換", "word": "replaced"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: collect or gather a sample.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The archive&#x27;s staff ______ oral histories from longtime residents before the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> was redeveloped, recording interviews that later helped historians reconstruct local cultural life.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The archive's staff ______ oral histories from longtime residents before the neighborhood was redeveloped, recording interviews that later helped historians reconstruct local cultural life.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在這個街區被重新開發之前，檔案館的工作人員向長期居民 ______ 了口述歷史，所錄下的訪談後來幫助歷史學家重建了當地的文化生活。", "opts": {"A": "compiled", "B": "discarded", "C": "imitated", "D": "postponed"}, "optsZh": {"A": "compiled（彙編、收集整理）", "B": "discarded（丟棄）", "C": "imitated（模仿）", "D": "postponed（延後、延期）"}, "answer": "A", "expl": "Compiled means gathered into a collection.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "gathered information together into a list or record", "zh": "彙編；整理", "word": "compiled"}, "B": {"pos": "v.", "en": "threw something away as no longer useful", "zh": "丟棄；捨棄", "word": "discarded"}, "C": {"pos": "v.", "en": "copied the way something was done", "zh": "模仿", "word": "imitated"}, "D": {"pos": "v.", "en": "delayed something to a later time", "zh": "延後；推遲", "word": "postponed"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: collect or gather a sample.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Although the cave entrance was narrow and unstable, the team safely ______ mineral samples from the newly exposed chamber and transported them to the laboratory for analysis.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the cave entrance was narrow and unstable, the team safely ______ mineral samples from the newly exposed chamber and transported them to the laboratory for analysis.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。雖然洞穴入口狹窄又不穩固，團隊仍安全地從新暴露出來的洞室中 ______ 礦物樣本，並將它們運送到實驗室進行分析。", "opts": {"A": "replicated", "B": "retrieved", "C": "overlooked", "D": "attached"}, "optsZh": {"A": "replicated（複製、重現）", "B": "retrieved（取回、找回）", "C": "overlooked（忽略、忽視）", "D": "attached（附加、連接）"}, "answer": "B", "expl": "Retrieved means obtained or brought back.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "copied or repeated something exactly", "zh": "複製；重現", "word": "replicated"}, "B": {"pos": "v.", "en": "got something back or brought it back", "zh": "取回；取得", "word": "retrieved"}, "C": {"pos": "v.", "en": "failed to notice or consider something", "zh": "忽略；忽視", "word": "overlooked"}, "D": {"pos": "v.", "en": "fastened or joined one thing to another", "zh": "附上；連接", "word": "attached"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: collect or gather a sample.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measure\" target=\"_blank\" rel=\"noopener\" data-w=\"measure\" data-pos=\"v.\" data-en=\"to find the size, amount, or degree of something\" data-zh=\"測量\">measure<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The probe&#x27;s arm failed on its first attempt, but on the second attempt it ______ a small amount of dust from the comet&#x27;s surface and sealed it inside a return capsule.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The probe's arm failed on its first attempt, but on the second attempt it ______ a small amount of dust from the comet's surface and sealed it inside a return capsule.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。探測器的機械手臂第一次嘗試失敗了，但在第二次嘗試時，它從彗星表面 ______ 了少量塵埃，並將其密封在返回艙內。", "opts": {"A": "disturbed", "B": "followed", "C": "gathered", "D": "inspected"}, "optsZh": {"A": "disturbed（干擾、打擾）", "B": "followed（跟隨、遵循）", "C": "gathered（收集、採集）", "D": "inspected（檢查、查看）"}, "answer": "C", "expl": "Gathered means collected.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "interrupted or changed the normal state of something", "zh": "打擾；擾亂", "word": "disturbed"}, "B": {"pos": "v.", "en": "came after; went behind; acted according to", "zh": "跟隨；遵循", "word": "followed"}, "C": {"pos": "v.", "en": "collected things from different places", "zh": "收集；聚集", "word": "gathered"}, "D": {"pos": "v.", "en": "looked at something carefully to check it", "zh": "檢查；檢視", "word": "inspected"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: collect or gather a sample.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. During the field season, the botanists ______ seeds from several rare grasses so that the plants could be grown later in a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> greenhouse.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. During the field season, the botanists ______ seeds from several rare grasses so that the plants could be grown later in a conservation greenhouse.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n在野外調查季期間，植物學家從幾種稀有禾草上 ______ 種子，以便日後能在保育溫室中栽培這些植物。", "opts": {"A": "predicted", "B": "attached", "C": "replaced", "D": "harvested"}, "optsZh": {"A": "predicted（預測）", "B": "attached（附加、連接）", "C": "replaced（取代）", "D": "harvested（採收、收集）"}, "answer": "D", "expl": "Harvested means collected, especially from plants.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "said what would happen in the future", "zh": "預測", "word": "predicted"}, "B": {"pos": "v.", "en": "fastened or joined one thing to another", "zh": "附上；連接", "word": "attached"}, "C": {"pos": "v.", "en": "put something new in place of something else", "zh": "取代；替換", "word": "replaced"}, "D": {"pos": "v.", "en": "collected a crop or natural resource", "zh": "收穫；採收", "word": "harvested"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: reflect or accurately show.", "vocab": true, "body": "Research conducted by planetary scientist Katarina Miljkovic suggests that the Moon&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> may not <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accurate\" target=\"_blank\" rel=\"noopener\" data-w=\"accurate\" data-pos=\"adj.\" data-en=\"correct and exact, without mistakes\" data-zh=\"準確的\">accurately<\/a> _______ early impact events. When the Moon was still forming, its surface was softer, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=asteroid\" target=\"_blank\" rel=\"noopener\" data-w=\"asteroid\" data-pos=\"n.\" data-en=\"a small rocky object that orbits the Sun\" data-zh=\"小行星\">asteroid<\/a> or meteoroid impacts would have left less of an impression; thus, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of early impacts may no longer be present.", "bodyPlain": "Research conducted by planetary scientist Katarina Miljkovic suggests that the Moon's surface may not accurately _______ early impact events. When the Moon was still forming, its surface was softer, and asteroid or meteoroid impacts would have left less of an impression; thus, evidence of early impacts may no longer be present.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "行星科學家 Katarina Miljkovic 所進行的研究顯示，月球表面可能無法準確地 _______ 早期的撞擊事件。月球仍在形成時，它的表面較軟，小行星或流星體的撞擊留下的痕跡會比較淺；因此，早期撞擊的證據可能已經不復存在。", "opts": {"A": "reflect", "B": "receive", "C": "evaluate", "D": "mimic"}, "optsZh": {"A": "reflect（反映）", "B": "receive（接收、收到）", "C": "evaluate（評估）", "D": "mimic（模仿）"}, "answer": "A", "expl": "Because early impact evidence may no longer be present, the surface may not accurately 'reflect' (show) those events.", "explZh": "早期撞擊的證據可能已不復存在，所以月球表面可能無法準確「reflect」（反映、呈現）那些撞擊事件。", "defs": {"A": {"pos": "v.", "en": "to show or represent something accurately", "zh": "反映；呈現", "word": "reflect"}, "B": {"pos": "v.", "en": "to get or be given something", "zh": "接收；收到", "word": "receive"}, "C": {"pos": "v.", "en": "to judge the quality or value of something", "zh": "評估", "word": "evaluate"}, "D": {"pos": "v.", "en": "to copy the behavior or appearance of something", "zh": "模仿；模擬", "word": "mimic"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: reflect or accurately show.", "vocab": true, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The surviving tax records may not accurately ______ the town&#x27;s eighteenth-century economy, since many informal exchanges between neighbors were never recorded by officials.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The surviving tax records may not accurately ______ the town's eighteenth-century economy, since many informal exchanges between neighbors were never recorded by officials.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。現存的稅務紀錄可能無法準確地 ______ 這座城鎮十八世紀的經濟狀況，因為鄰居之間許多非正式的交易從未被官員記錄下來。", "opts": {"A": "reflect", "B": "mimic", "C": "receive", "D": "evaluate"}, "optsZh": {"A": "reflect（反映）", "B": "mimic（模仿）", "C": "receive（接收、收到）", "D": "evaluate（評估）"}, "answer": "A", "expl": "Reflect means accurately represent or show.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to show or represent something accurately", "zh": "反映；呈現", "word": "reflect"}, "B": {"pos": "v.", "en": "to copy the behavior or appearance of something", "zh": "模仿；模擬", "word": "mimic"}, "C": {"pos": "v.", "en": "to get or be given something", "zh": "接收；收到", "word": "receive"}, "D": {"pos": "v.", "en": "to judge the quality or value of something", "zh": "評估", "word": "evaluate"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: reflect or accurately show.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. Because the survey was conducted only in urban <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a>, its results do not fully ______ the experiences of families living in remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=agricultural\" target=\"_blank\" rel=\"noopener\" data-w=\"agricultural\" data-pos=\"adj.\" data-en=\"relating to farming\" data-zh=\"農業的\">agricultural<\/a> communities.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. Because the survey was conducted only in urban neighborhoods, its results do not fully ______ the experiences of families living in remote agricultural communities.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。由於這項調查只在都市街區進行，其結果無法完全 ______ 住在偏遠農業社區的家庭的經驗。", "opts": {"A": "represent", "B": "absorb", "C": "imitate", "D": "judge"}, "optsZh": {"A": "represent（呈現、代表）", "B": "absorb（吸收）", "C": "imitate（模仿）", "D": "judge（判斷、評斷）"}, "answer": "A", "expl": "Represent means stand for or accurately show.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to show or stand for something", "zh": "代表；呈現", "word": "represent"}, "B": {"pos": "v.", "en": "to take in a substance or information", "zh": "吸收", "word": "absorb"}, "C": {"pos": "v.", "en": "to copy the way something is done", "zh": "模仿", "word": "imitate"}, "D": {"pos": "v.", "en": "to form an opinion about something after thinking carefully", "zh": "判斷；評斷", "word": "judge"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: reflect or accurately show.", "vocab": true, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The museum&#x27;s early photographs ______ the building before its later renovations, making them valuable evidence of the architect&#x27;s original design.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The museum's early photographs ______ the building before its later renovations, making them valuable evidence of the architect's original design.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展現出創作者在發表完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。博物館早期的照片 ______ 了這棟建築在後來翻修之前的樣貌，使這些照片成為建築師原始設計的寶貴證據。", "opts": {"A": "replace", "B": "distort", "C": "document", "D": "mimic"}, "optsZh": {"A": "replace（取代）", "B": "distort（扭曲、曲解）", "C": "document（記錄、記載）", "D": "mimic（模仿）"}, "answer": "C", "expl": "Document means record or show evidence of.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to put something new in place of something else", "zh": "取代；替換", "word": "replace"}, "B": {"pos": "v.", "en": "to change something so it is no longer true or accurate", "zh": "扭曲；歪曲", "word": "distort"}, "C": {"pos": "v.", "en": "to record something in writing, photos, or other evidence", "zh": "記錄；以文件證明", "word": "document"}, "D": {"pos": "v.", "en": "to copy the behavior or appearance of something", "zh": "模仿；模擬", "word": "mimic"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: reflect or accurately show.", "vocab": true, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measure\" target=\"_blank\" rel=\"noopener\" data-w=\"measure\" data-pos=\"v.\" data-en=\"to find the size, amount, or degree of something\" data-zh=\"測量\">measure<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Tree rings from the valley may not reliably ______ past rainfall patterns because irrigation canals built nearby changed how much water reached the trees&#x27; roots.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Tree rings from the valley may not reliably ______ past rainfall patterns because irrigation canals built nearby changed how much water reached the trees' roots.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。這座山谷的樹木年輪可能無法可靠地 ______ 過去的降雨模式，因為附近修建的灌溉渠道改變了到達樹根的水量。", "opts": {"A": "receive", "B": "measure", "C": "preserve", "D": "indicate"}, "optsZh": {"A": "receive（接收、收到）", "B": "measure（測量、衡量）", "C": "preserve（保存、保留）", "D": "indicate（顯示、表明）"}, "answer": "D", "expl": "Indicate means show or point to.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to get or be given something", "zh": "接收；收到", "word": "receive"}, "B": {"pos": "v.", "en": "to find the size, amount, or degree of something", "zh": "測量", "word": "measure"}, "C": {"pos": "v.", "en": "to keep something in its original state", "zh": "保存；保留", "word": "preserve"}, "D": {"pos": "v.", "en": "to show or point out", "zh": "顯示；表明", "word": "indicate"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: reflect or accurately show.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The fossil record in this region only partially ______ the diversity of ancient insects, since delicate wings and bodies rarely survived the process of fossilization.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The fossil record in this region only partially ______ the diversity of ancient insects, since delicate wings and bodies rarely survived the process of fossilization.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這個地區的化石紀錄只能部分 ______ 古代昆蟲的多樣性，因為脆弱的翅膀與身體很少能在化石化的過程中保存下來。", "opts": {"A": "receives", "B": "captures", "C": "evaluates", "D": "imitates"}, "optsZh": {"A": "receives（接收、收到）", "B": "captures（捕捉、準確呈現）", "C": "evaluates（評估）", "D": "imitates（模仿）"}, "answer": "B", "expl": "Captures means records or represents.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "gets or is given something", "zh": "接收；收到", "word": "receives"}, "B": {"pos": "v.", "en": "represents or records something accurately", "zh": "捕捉；準確呈現", "word": "captures"}, "C": {"pos": "v.", "en": "judges the quality or value of something", "zh": "評估", "word": "evaluates"}, "D": {"pos": "v.", "en": "copies the way something is done", "zh": "模仿", "word": "imitates"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: recognizable or easy to observe.", "vocab": true, "body": "Handedness, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preferential\" target=\"_blank\" rel=\"noopener\" data-w=\"preferential\" data-pos=\"adj.\" data-en=\"showing a preference for one thing over another\" data-zh=\"偏好的；優先的\">preferential<\/a> use of either the right or left hand, typically is easy to observe in humans. Because this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trait\" target=\"_blank\" rel=\"noopener\" data-w=\"trait\" data-pos=\"n.\" data-en=\"a particular quality or characteristic\" data-zh=\"特徵；特質\">trait<\/a> is present but less _______ in many other animals, animal-behavior researchers often employ tasks specially designed to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveal<\/a> individual animals&#x27; preferences for a certain hand or paw.", "bodyPlain": "Handedness, a preferential use of either the right or left hand, typically is easy to observe in humans. Because this trait is present but less _______ in many other animals, animal-behavior researchers often employ tasks specially designed to reveal individual animals' preferences for a certain hand or paw.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "慣用手，也就是偏好使用右手或左手，在人類身上通常很容易觀察到。由於這種特徵在許多其他動物身上雖然存在、卻較不 _______，動物行為研究人員經常採用特別設計的任務，來揭示個別動物對某一隻手或爪的偏好。", "opts": {"A": "recognizable", "B": "intriguing", "C": "significant", "D": "useful"}, "optsZh": {"A": "recognizable（可辨認的、容易認出的）", "B": "intriguing（引人入勝的、有趣的）", "C": "significant（重要的、顯著的）", "D": "useful（有用的）"}, "answer": "A", "expl": "Handedness is easy to observe in humans but needs special tasks to reveal in animals, so it is less 'recognizable' in animals.", "explZh": "慣用手在人類身上很容易觀察，但在動物身上需要特別設計的任務才能看出，所以在動物身上較不「recognizable」（容易辨認的）。", "defs": {"A": {"pos": "adj.", "en": "easy to identify or notice", "zh": "可辨認的；容易認出的", "word": "recognizable"}, "B": {"pos": "adj.", "en": "very interesting because unusual or mysterious", "zh": "引人入勝的；耐人尋味的", "word": "intriguing"}, "C": {"pos": "adj.", "en": "important or large enough to notice", "zh": "重要的；顯著的", "word": "significant"}, "D": {"pos": "adj.", "en": "helpful for doing something", "zh": "有用的", "word": "useful"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: recognizable or easy to observe.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Although stress responses are obvious in some laboratory animals, they are less ______ in many wild species, so researchers use indirect measures such as hormone levels and feeding behavior.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Although stress responses are obvious in some laboratory animals, they are less ______ in many wild species, so researchers use indirect measures such as hormone levels and feeding behavior.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。雖然壓力反應在某些實驗室動物身上很明顯，但在許多野生物種身上卻較不 ______，因此研究人員會使用荷爾蒙濃度與進食行為等間接測量方式。", "opts": {"A": "intriguing", "B": "useful", "C": "significant", "D": "recognizable"}, "optsZh": {"A": "intriguing（引人入勝的、有趣的）", "B": "useful（有用的）", "C": "significant（重要的、顯著的）", "D": "recognizable（可辨認的、容易認出的）"}, "answer": "D", "expl": "Recognizable means easy to identify or observe.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "very interesting because unusual or mysterious", "zh": "引人入勝的；耐人尋味的", "word": "intriguing"}, "B": {"pos": "adj.", "en": "helpful for doing something", "zh": "有用的", "word": "useful"}, "C": {"pos": "adj.", "en": "important or large enough to notice", "zh": "重要的；顯著的", "word": "significant"}, "D": {"pos": "adj.", "en": "easy to identify or notice", "zh": "可辨認的；容易認出的", "word": "recognizable"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: recognizable or easy to observe.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. The early stages of the disease are often not ______ during routine examinations, which is why physicians may rely on blood tests rather than visible symptoms alone.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The early stages of the disease are often not ______ during routine examinations, which is why physicians may rely on blood tests rather than visible symptoms alone.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。這種疾病的早期階段在例行檢查中往往不 ______，這就是為什麼醫師可能會依賴血液檢查，而不是只看可見的症狀。", "opts": {"A": "useful", "B": "flexible", "C": "valuable", "D": "apparent"}, "optsZh": {"A": "useful（有用的）", "B": "flexible（有彈性的、靈活的）", "C": "valuable（有價值的）", "D": "apparent（明顯的、顯而易見的）"}, "answer": "D", "expl": "Apparent means clearly visible or noticeable.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "helpful for doing something", "zh": "有用的", "word": "useful"}, "B": {"pos": "adj.", "en": "able to change or bend easily", "zh": "靈活的；有彈性的", "word": "flexible"}, "C": {"pos": "adj.", "en": "very useful or important; worth a lot", "zh": "有價值的；寶貴的", "word": "valuable"}, "D": {"pos": "adj.", "en": "easy to see or understand", "zh": "明顯的；顯而易見的", "word": "apparent"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: recognizable or easy to observe.", "vocab": true, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Because the chemical reaction produces no dramatic color change, the process is difficult for students to observe unless the teacher uses an indicator that makes it more ______.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Because the chemical reaction produces no dramatic color change, the process is difficult for students to observe unless the teacher uses an indicator that makes it more ______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。由於這個化學反應不會產生明顯的顏色變化，除非老師使用指示劑讓它更 ______，否則學生很難觀察到這個過程。", "opts": {"A": "complex", "B": "efficient", "C": "visible", "D": "controversial"}, "optsZh": {"A": "complex（複雜的）", "B": "efficient（有效率的）", "C": "visible（看得見的、明顯的）", "D": "controversial（有爭議的）"}, "answer": "C", "expl": "Visible means able to be seen.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "having many connected parts; complicated", "zh": "複雜的", "word": "complex"}, "B": {"pos": "adj.", "en": "working well without wasting time or energy", "zh": "有效率的", "word": "efficient"}, "C": {"pos": "adj.", "en": "able to be seen", "zh": "看得見的；明顯的", "word": "visible"}, "D": {"pos": "adj.", "en": "causing much disagreement or argument", "zh": "有爭議的", "word": "controversial"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: recognizable or easy to observe.", "vocab": true, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The influence of the older melody is ______ in the composer&#x27;s later work: several phrases reappear almost unchanged in the final movement.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The influence of the older melody is ______ in the composer's later work: several phrases reappear almost unchanged in the final movement.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。較早那段旋律的影響在這位作曲家後期的作品中是 ______ 的：有好幾個樂句幾乎原封不動地重現在最後一個樂章中。", "opts": {"A": "detectable", "B": "ordinary", "C": "useful", "D": "irrelevant"}, "optsZh": {"A": "detectable（可察覺的、可偵測到的）", "B": "ordinary（普通的、平凡的）", "C": "useful（有用的）", "D": "irrelevant（不相關的、無關緊要的）"}, "answer": "A", "expl": "Detectable means able to be noticed or discovered.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "able to be noticed or discovered", "zh": "可察覺的；可偵測的", "word": "detectable"}, "B": {"pos": "adj.", "en": "normal and not special", "zh": "普通的；平常的", "word": "ordinary"}, "C": {"pos": "adj.", "en": "helpful for doing something", "zh": "有用的", "word": "useful"}, "D": {"pos": "adj.", "en": "not related to the matter being discussed", "zh": "無關的", "word": "irrelevant"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: recognizable or easy to observe.", "vocab": true, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. In young trees, the difference between the two species is barely ______, but mature trees can be distinguished by the shape and texture of their bark.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. In young trees, the difference between the two species is barely ______, but mature trees can be distinguished by the shape and texture of their bark.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n在幼樹階段，這兩個物種之間的差異幾乎無法 ______，但成熟的樹木可以從樹皮的形狀與質地加以區分。", "opts": {"A": "significant", "B": "perceptible", "C": "productive", "D": "intriguing"}, "optsZh": {"A": "significant（重要的、顯著的）", "B": "perceptible（可察覺的、看得出的）", "C": "productive（有成效的、多產的）", "D": "intriguing（引人入勝的、有趣的）"}, "answer": "B", "expl": "Perceptible means noticeable.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "important or large enough to notice", "zh": "重要的；顯著的", "word": "significant"}, "B": {"pos": "adj.", "en": "able to be noticed or felt", "zh": "可察覺的", "word": "perceptible"}, "C": {"pos": "adj.", "en": "producing a lot or achieving good results", "zh": "有成效的；多產的", "word": "productive"}, "D": {"pos": "adj.", "en": "very interesting because unusual or mysterious", "zh": "引人入勝的；耐人尋味的", "word": "intriguing"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: not unimportant.", "vocab": true, "body": "It is by no means _______ to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=recognize\" target=\"_blank\" rel=\"noopener\" data-w=\"recognize\" data-pos=\"v.\" data-en=\"to identify something seen before\" data-zh=\"辨認\">recognize<\/a> the influence of Dutch painter Hieronymus Bosch on Ali Banisadr&#x27;s paintings; indeed, Banisadr himself cites Bosch as an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inspiration\" target=\"_blank\" rel=\"noopener\" data-w=\"inspiration\" data-pos=\"n.\" data-en=\"something that gives you ideas or makes you want to create\" data-zh=\"靈感\">inspiration<\/a>. However, some scholars have suggested that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Mesopotamian poem Epic of Gilgamesh may have had a far greater impact on Banisadr&#x27;s work.", "bodyPlain": "It is by no means _______ to recognize the influence of Dutch painter Hieronymus Bosch on Ali Banisadr's paintings; indeed, Banisadr himself cites Bosch as an inspiration. However, some scholars have suggested that the ancient Mesopotamian poem Epic of Gilgamesh may have had a far greater impact on Banisadr's work.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "要辨認出荷蘭畫家 Hieronymus Bosch 對 Ali Banisadr 畫作的影響絕非 _______；事實上，Banisadr 本人就把 Bosch 列為他的靈感來源。然而，有些學者認為，古代美索不達米亞史詩《Epic of Gilgamesh》對 Banisadr 作品的影響可能遠大得多。", "opts": {"A": "substantial", "B": "satisfying", "C": "unimportant", "D": "appropriate"}, "optsZh": {"A": "substantial（大量的、重要的）", "B": "satisfying（令人滿意的）", "C": "unimportant（不重要的）", "D": "appropriate（適當的、合適的）"}, "answer": "C", "expl": "'By no means unimportant' means important; 'indeed' confirms that Bosch's influence matters because Banisadr cites him as an inspiration.", "explZh": "「by no means unimportant」意思是「絕非不重要」；後面的 indeed 補充 Banisadr 本人也說 Bosch 是他的靈感來源，可見其影響確實重要。", "defs": {"A": {"pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；重大的", "word": "substantial"}, "B": {"pos": "adj.", "en": "giving a feeling of pleasure or contentment", "zh": "令人滿意的", "word": "satisfying"}, "C": {"pos": "adj.", "en": "not important", "zh": "不重要的", "word": "unimportant"}, "D": {"pos": "adj.", "en": "suitable or right for a particular situation", "zh": "適當的；恰當的", "word": "appropriate"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: not unimportant.", "vocab": true, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The historian argues that the poet&#x27;s early essays are by no means ______; although rarely discussed, they reveal the political commitments that later shaped her major works.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The historian argues that the poet's early essays are by no means ______; although rarely discussed, they reveal the political commitments that later shaped her major works.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。這位歷史學家主張，這位詩人早期的散文絕非 ______；雖然很少被討論，它們卻揭示了後來塑造她主要作品的政治信念。", "opts": {"A": "satisfying", "B": "unimportant", "C": "appropriate", "D": "substantial"}, "optsZh": {"A": "satisfying（令人滿意的）", "B": "unimportant（不重要的）", "C": "appropriate（適當的、合適的）", "D": "substantial（大量的、重要的）"}, "answer": "B", "expl": "Unimportant is negated by 'by no means,' so the sentence means the essays matter.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "giving a feeling of pleasure or contentment", "zh": "令人滿意的", "word": "satisfying"}, "B": {"pos": "adj.", "en": "not important", "zh": "不重要的", "word": "unimportant"}, "C": {"pos": "adj.", "en": "suitable or right for a particular situation", "zh": "適當的；恰當的", "word": "appropriate"}, "D": {"pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；重大的", "word": "substantial"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: not unimportant.", "vocab": true, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The critic notes that the architect&#x27;s brief <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=apprenticeship\" target=\"_blank\" rel=\"noopener\" data-w=\"apprenticeship\" data-pos=\"n.\" data-en=\"a period of learning a skill by working with an expert\" data-zh=\"學徒制；學徒期\">apprenticeship<\/a> was not ______ to her later development, since it introduced her to materials she used throughout her career.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The critic notes that the architect's brief apprenticeship was not ______ to her later development, since it introduced her to materials she used throughout her career.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。這位評論家指出，這位建築師短暫的學徒經歷對她後來的發展並非 ______，因為這段經歷讓她接觸到她整個職業生涯都在使用的材料。", "opts": {"A": "appropriate", "B": "satisfying", "C": "substantial", "D": "irrelevant"}, "optsZh": {"A": "appropriate（適當的、合適的）", "B": "satisfying（令人滿意的）", "C": "substantial（大量的、重要的）", "D": "irrelevant（不相關的、無關緊要的）"}, "answer": "D", "expl": "Not irrelevant means relevant or important.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "suitable or right for a particular situation", "zh": "適當的；恰當的", "word": "appropriate"}, "B": {"pos": "adj.", "en": "giving a feeling of pleasure or contentment", "zh": "令人滿意的", "word": "satisfying"}, "C": {"pos": "adj.", "en": "large in amount, size, or importance", "zh": "大量的；重大的", "word": "substantial"}, "D": {"pos": "adj.", "en": "not related to the matter being discussed", "zh": "無關的", "word": "irrelevant"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: not unimportant.", "vocab": true, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Although the mural occupies a narrow hallway, its placement is hardly ______: every visitor must pass it before entering the main gallery.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Although the mural occupies a narrow hallway, its placement is hardly ______: every visitor must pass it before entering the main gallery.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪個選項能以最合乎邏輯且最精確的字詞完成這段文字？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展現出創作者在發表完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。雖然這幅壁畫位於一條狹窄的走廊，它的位置卻一點也不 ______：每位參觀者在進入主展廳之前都必須經過它。", "opts": {"A": "decorative", "B": "satisfying", "C": "minor", "D": "instructive"}, "optsZh": {"A": "decorative（裝飾性的）", "B": "satisfying（令人滿意的）", "C": "minor（次要的、不重要的）", "D": "instructive（有教育意義的、有啟發性的）"}, "answer": "C", "expl": "Hardly minor means important or noticeable.", "explZh": "", "defs": {"A": {"pos": "adj.", "en": "meant to look attractive rather than to be useful", "zh": "裝飾性的", "word": "decorative"}, "B": {"pos": "adj.", "en": "giving a feeling of pleasure or contentment", "zh": "令人滿意的", "word": "satisfying"}, "C": {"pos": "adj.", "en": "small and not very important", "zh": "次要的；輕微的",
