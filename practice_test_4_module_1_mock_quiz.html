opener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "had sheltered", "B": "would shelter", "C": "shelters", "D": "sheltered"}, "optsZh": {"A": "had sheltered（過去完成式 → 不能表達普遍事實：錯誤）", "B": "would shelter（條件語氣 → 不能表達普遍事實：錯誤）", "C": "shelters（一般現在式，單數，表普遍事實：正確）", "D": "sheltered（一般過去式 → 不能表達普遍事實：錯誤）"}, "answer": "C", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: semicolon in parallel list.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively, during", "B": "triumphed--decisively. During", "C": "triumphed--decisively during", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively, during（只用逗號連接兩個獨立子句：逗號連接錯誤）", "B": "triumphed--decisively. During（句號分隔兩個獨立句子：正確）", "C": "triumphed--decisively during（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "D": "triumphed--decisively--during（破折號 → 兩個獨立子句連接不當：錯誤）"}, "answer": "B", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: semicolon in parallel list.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "have been", "C": "are", "D": "is"}, "optsZh": {"A": "were（be 動詞複數過去式，主詞須為複數）", "B": "have been（現在完成式 → 時態與敘述的過去事件不一致：錯誤）", "C": "are（複數現在式 → 時態與敘述的過去事件不一致：錯誤）", "D": "is（單數動詞 → 與複數主詞不一致：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: semicolon in parallel list.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她發表了一個能運作數小時的全尺寸版本。", "opts": {"A": "prototype;", "B": "prototype,", "C": "prototype, later,", "D": "prototype later,"}, "optsZh": {"A": "prototype;（分號連接兩個獨立子句：正確）", "B": "prototype,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "prototype, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prototype later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）"}, "answer": "A", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Standard English: semicolon plus however.", "vocab": false, "body": "Sociologist Alton Okinaka sits on the review board tasked with adding new sites to the Hawaii Register of Historic Places, which includes Piilanihale Heiau and the Opaekaa Road Bridge. Okinaka doesn&#x27;t make such decisions _______ all <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=designation\" target=\"_blank\" rel=\"noopener\" data-w=\"designation\" data-pos=\"n.\" data-en=\"an official name or status\" data-zh=\"指定；認定\">designations<\/a> must be approved by a group of nine other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expert\" target=\"_blank\" rel=\"noopener\" data-w=\"expert\" data-pos=\"n.\" data-en=\"a person with special knowledge or skill\" data-zh=\"專家\">experts<\/a> from the fields of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=architecture\" target=\"_blank\" rel=\"noopener\" data-w=\"architecture\" data-pos=\"n.\" data-en=\"the design of buildings\" data-zh=\"建築\">architecture<\/a>, archaeology, history, and Hawaiian culture.", "bodyPlain": "Sociologist Alton Okinaka sits on the review board tasked with adding new sites to the Hawaii Register of Historic Places, which includes Piilanihale Heiau and the Opaekaa Road Bridge. Okinaka doesn't make such decisions _______ all historical designations must be approved by a group of nine other experts from the fields of architecture, archaeology, history, and Hawaiian culture.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "社會學家 Alton Okinaka 是審查委員會的成員，該委員會負責將新地點增列到 Hawaii Register of Historic Places（夏威夷史蹟名錄），名錄中包括 Piilanihale Heiau 和 Opaekaa Road Bridge。Okinaka 並不是 _______ 做出這些決定，所有的史蹟指定都必須經過另外九位來自建築、考古、歷史與夏威夷文化領域的專家所組成的小組核准。", "opts": {"A": "single-handedly, however;", "B": "single-handedly; however,", "C": "single-handedly, however,", "D": "single-handedly however"}, "optsZh": {"A": "single-handedly, however;（分號放在 however 之後 → 轉折詞歸屬錯誤：錯誤）", "B": "single-handedly; however,（分號連接兩個獨立子句，however 後加逗號：正確）", "C": "single-handedly, however,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "single-handedly however（無標點 → 兩個獨立子句直接相連：連寫句錯誤）"}, "answer": "B", "expl": "Two independent clauses are joined by a semicolon, and the conjunctive adverb 'however' is followed by a comma.", "explZh": "兩個獨立子句之間用分號，連接副詞 however 後面加逗號。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Standard English: semicolon plus however.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. Several memoirs credited to celebrity athletes are actually written by collaborators who shape other ______ into polished narratives while remaining unnamed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。幾本掛名為知名運動員的回憶錄，其實是由合作者所寫，他們把其他 ______ 塑造成精煉的敘事，自己卻始終不具名。", "opts": {"A": "people's stories", "B": "people's story's", "C": "peoples stories", "D": "peoples story's"}, "optsZh": {"A": "people's stories（people 的所有格＋複數名詞 stories：正確）", "B": "people's story's（story's 為所有格 → 後面沒有被擁有的名詞：錯誤）", "C": "peoples stories（缺少所有格撇號：錯誤）", "D": "peoples story's（所有格標錯位置：錯誤）"}, "answer": "A", "expl": "The plural possessive phrase is 'people's stories.'", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Standard English: semicolon plus however.", "vocab": false, "body": "A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "bodyPlain": "A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. During cold months, the desert lizard reduces its activity and ______ beneath flat stones, where temperatures remain more stable than on the exposed sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。在寒冷的月份，這種沙漠蜥蜴會減少活動，並 ______ 在扁平的石頭下方，那裡的溫度比暴露在外的沙地更穩定。", "opts": {"A": "would shelter", "B": "shelters", "C": "had sheltered", "D": "sheltered"}, "optsZh": {"A": "would shelter（條件語氣 → 不能表達普遍事實：錯誤）", "B": "shelters（一般現在式，單數，表普遍事實：正確）", "C": "had sheltered（過去完成式 → 不能表達普遍事實：錯誤）", "D": "sheltered（一般過去式 → 不能表達普遍事實：錯誤）"}, "answer": "B", "expl": "Simple present fits a general biological fact.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Standard English: semicolon plus however.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The violinist did not merely perform well, she ______ the final round of the competition, she received a standing ovation from all three judges.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這位小提琴家不只是表現出色，她 ______ 了比賽的決賽，她獲得了三位評審全體起立鼓掌。", "opts": {"A": "triumphed--decisively during", "B": "triumphed--decisively, during", "C": "triumphed--decisively. During", "D": "triumphed--decisively--during"}, "optsZh": {"A": "triumphed--decisively during（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "B": "triumphed--decisively, during（只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "triumphed--decisively. During（句號分隔兩個獨立句子：正確）", "D": "triumphed--decisively--during（破折號 → 兩個獨立子句連接不當：錯誤）"}, "answer": "C", "expl": "A new sentence is needed before the time phrase.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Standard English: semicolon plus however.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. Among the few objects recovered from the shipwreck ______ a brass compass, three ceramic bowls, and a leather-bound notebook.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。從沉船中打撈出的少數物品中 ______ 一個黃銅羅盤、三個陶碗和一本皮面筆記本。", "opts": {"A": "were", "B": "are", "C": "have been", "D": "is"}, "optsZh": {"A": "were（be 動詞複數過去式，主詞須為複數）", "B": "are（複數現在式 → 時態與敘述的過去事件不一致：錯誤）", "C": "have been（現在完成式 → 時態與敘述的過去事件不一致：錯誤）", "D": "is（單數動詞 → 與複數主詞不一致：錯誤）"}, "answer": "A", "expl": "The plural compound subject requires 'were' in past tense.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Standard English: semicolon plus however.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The engineer completed a small prototype in 2011 ______ in 2018, she unveiled a full-scale version that could operate for several hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪個選項能使文句符合標準英語的慣例？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這位工程師在 2011 年完成了一個小型原型 ______ 在 2018 年，她發表了一個能運作數小時的全尺寸版本。", "opts": {"A": "prototype later,", "B": "prototype, later,", "C": "prototype,", "D": "prototype;"}, "optsZh": {"A": "prototype later,（無標點 → 兩個獨立子句直接相連：連寫句錯誤）", "B": "prototype, later,（later 不是連接詞，只用逗號連接兩個獨立子句：逗號連接錯誤）", "C": "prototype,（只用逗號連接兩個獨立子句：逗號連接錯誤）", "D": "prototype;（分號連接兩個獨立子句：正確）"}, "answer": "D", "expl": "A semicolon correctly joins two related independent clauses.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: final outcome after long effort.", "vocab": false, "body": "In 1968, US Congressman John Conyers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduced<\/a> a bill to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=establish\" target=\"_blank\" rel=\"noopener\" data-w=\"establish\" data-pos=\"v.\" data-en=\"to create or set up something\" data-zh=\"建立\">establish<\/a> a national holiday in honor of Dr. Martin Luther King Jr. The bill didn&#x27;t make it to a vote, but Conyers was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a>. He teamed up with Shirley Chisholm, the first Black woman to be elected to Congress, and they resubmitted the bill every session for the next fifteen years. _______ in 1983, the bill passed.", "bodyPlain": "In 1968, US Congressman John Conyers introduced a bill to establish a national holiday in honor of Dr. Martin Luther King Jr. The bill didn't make it to a vote, but Conyers was determined. He teamed up with Shirley Chisholm, the first Black woman to be elected to Congress, and they resubmitted the bill every session for the next fifteen years. _______ in 1983, the bill passed.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "1968 年，美國國會議員 John Conyers 提出一項法案，要設立一個紀念 Martin Luther King Jr. 博士的國定假日。這項法案沒能付諸表決，但 Conyers 決心堅持下去。他與第一位當選國會議員的黑人女性 Shirley Chisholm 合作，在接下來的十五年裡，他們每個會期都重新提交這項法案。_______ 在 1983 年，這項法案通過了。", "opts": {"A": "Instead,", "B": "Likewise,", "C": "Finally,", "D": "Additionally,"}, "optsZh": {"A": "Instead,（反而；取而代之：表替代）", "B": "Likewise,（同樣地：表類比或相似）", "C": "Finally,（最後；終於：表長期努力後的最終結果，正確）", "D": "Additionally,（此外：表補充）"}, "answer": "C", "expl": "After fifteen years of resubmitting the bill, it passed in 1983—the end result of a long effort, so 'Finally.'", "explZh": "連續十五年重新提案後，法案終於在 1983 年通過，這是長期努力的最終結果，所以用「Finally」（終於）。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: final outcome after long effort.", "vocab": false, "body": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The proposal was rejected twice and then revised after years of public advocacy. ______ in 2024, the city council approved the measure unanimously.", "bodyPlain": "The researchers collected samples at weekly intervals and compared the records with archived descriptions from earlier surveys. Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The proposal was rejected twice and then revised after years of public advocacy. ______ in 2024, the city council approved the measure unanimously.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "研究人員每週採集一次樣本，並將這些紀錄與早期調查的存檔描述加以比較。數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。這項提案兩度遭到否決，經過多年的公眾倡議後又加以修改。______ 在 2024 年，市議會一致通過了這項措施。", "opts": {"A": "Finally,", "B": "Instead,", "C": "Likewise,", "D": "Additionally,"}, "optsZh": {"A": "Finally,（最後；終於：表長期努力後的最終結果，正確）", "B": "Instead,（反而；取而代之：表替代）", "C": "Likewise,（同樣地：表類比或相似）", "D": "Additionally,（此外：表補充）"}, "answer": "A", "expl": "Finally marks the eventual outcome after a long process.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: final outcome after long effort.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=overlooked\" target=\"_blank\" rel=\"noopener\" data-w=\"overlooked\" data-pos=\"v.\" data-en=\"failed to notice or consider something\" data-zh=\"忽略；忽視\">overlooked<\/a>. The research team spent a decade testing unsuccessful materials. ______ they identified a compound that remained stable at high temperatures.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The research team spent a decade testing unsuccessful materials. ______ they identified a compound that remained stable at high temperatures.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這些新編目的資料也顯示出後來的編輯、譯者與教師如何為原社群以外的讀者改編這項計畫。一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。這個研究團隊花了十年測試各種不成功的材料。______ 他們找到了一種在高溫下仍保持穩定的化合物。", "opts": {"A": "Similarly,", "B": "Instead,", "C": "However,", "D": "Eventually,"}, "optsZh": {"A": "Similarly,（同樣地：表類比或相似）", "B": "Instead,（反而；取而代之：表替代）", "C": "However,（然而：表轉折）", "D": "Eventually,（最後；終於：表長期過程後的最終結果，正確）"}, "answer": "D", "expl": "Eventually signals the final result after many attempts.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: final outcome after long effort.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. For months the orchestra could not find a permanent rehearsal space. ______ a community college offered the musicians use of its auditorium.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. For months the orchestra could not find a permanent rehearsal space. ______ a community college offered the musicians use of its auditorium.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展現出創作者在發表完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。好幾個月來，這個管弦樂團都找不到固定的排練場地。______ 一所社區大學讓這些音樂家使用它的禮堂。", "opts": {"A": "At last,", "B": "For example,", "C": "Nevertheless,", "D": "Meanwhile,"}, "optsZh": {"A": "At last,（終於：表長期努力後的最終結果，正確）", "B": "For example,（例如：表舉例）", "C": "Nevertheless,（儘管如此：表讓步轉折）", "D": "Meanwhile,（同時；在此期間：表同時發生）"}, "answer": "A", "expl": "At last marks a long-awaited outcome.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: final outcome after long effort.", "vocab": false, "body": "The report also notes that residents <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=respond\" target=\"_blank\" rel=\"noopener\" data-w=\"respond\" data-pos=\"v.\" data-en=\"to answer or react\" data-zh=\"回應\">responded<\/a> differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The bill failed in committee several times, but supporters kept reintroducing it. ______ after years of debate, it became law.", "bodyPlain": "The report also notes that residents responded differently depending on commuting patterns, local services, and access to reliable public information. A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The bill failed in committee several times, but supporters kept reintroducing it. ______ after years of debate, it became law.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "報告也指出，居民的反應會因通勤模式、在地服務，以及取得可靠公共資訊的管道而有所不同。一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。這項法案多次在委員會中遭到否決，但支持者持續重新提出。______ 經過多年辯論後，它成為了法律。", "opts": {"A": "Instead,", "B": "Likewise,", "C": "Finally,", "D": "Additionally,"}, "optsZh": {"A": "Instead,（反而；取而代之：表替代）", "B": "Likewise,（同樣地：表類比或相似）", "C": "Finally,（最後；終於：表長期努力後的最終結果，正確）", "D": "Additionally,（此外：表補充）"}, "answer": "C", "expl": "Finally introduces the eventual success.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transitions: final outcome after long effort.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> sound broader than the data support. The restoration effort faced funding delays, storms, and shortages of skilled workers. ______ the lighthouse reopened to visitors after twelve years.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. The restoration effort faced funding delays, storms, and shortages of skilled workers. ______ the lighthouse reopened to visitors after twelve years.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n這項修復工作面臨資金延誤、暴風雨以及熟練工人短缺等問題。______ 這座燈塔在十二年後重新對遊客開放。", "opts": {"A": "Similarly,", "B": "Ultimately,", "C": "In contrast,", "D": "Consequently,"}, "optsZh": {"A": "Similarly,（同樣地：表類比或相似）", "B": "Ultimately,（最終：表長期過程後的最後結果，正確）", "C": "In contrast,（相反地：表對比）", "D": "Consequently,（因此：表因果結果）"}, "answer": "B", "expl": "Ultimately marks the final result.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: contrast with prior belief.", "vocab": false, "body": "Geoscientists have long considered Hawaii&#x27;s Mauna Loa <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcano\" target=\"_blank\" rel=\"noopener\" data-w=\"volcano\" data-pos=\"n.\" data-en=\"a mountain that can erupt with lava\" data-zh=\"火山\">volcano<\/a> to be Earth&#x27;s largest shield volcano by volume, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measure\" target=\"_blank\" rel=\"noopener\" data-w=\"measure\" data-pos=\"v.\" data-en=\"to find the size, amount, or degree of something\" data-zh=\"測量\">measuring<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=approximately\" target=\"_blank\" rel=\"noopener\" data-w=\"approximately\" data-pos=\"adv.\" data-en=\"about; roughly\" data-zh=\"大約\">approximately<\/a> 74,000 cubic kilometers. _______ according to a 2020 study by local geoscientist Michael Garcia, Hawaii&#x27;s Puhahonu shield volcano is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"重要的；顯著的\">significantly<\/a> larger, boasting a volume of about 148,000 cubic kilometers.", "bodyPlain": "Geoscientists have long considered Hawaii's Mauna Loa volcano to be Earth's largest shield volcano by volume, measuring approximately 74,000 cubic kilometers. _______ according to a 2020 study by local geoscientist Michael Garcia, Hawaii's Puhahonu shield volcano is significantly larger, boasting a volume of about 148,000 cubic kilometers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "長久以來，地球科學家一直認為夏威夷的 Mauna Loa 火山是地球上體積最大的盾狀火山，體積約為 74,000 立方公里。_______ 根據當地地球科學家 Michael Garcia 在 2020 年的一項研究，夏威夷的 Puhahonu 盾狀火山明顯更大，體積約達 148,000 立方公里。", "opts": {"A": "Secondly,", "B": "Consequently,", "C": "Moreover,", "D": "However,"}, "optsZh": {"A": "Secondly,（第二：表列舉順序）", "B": "Consequently,（因此：表因果結果）", "C": "Moreover,（此外：表補充）", "D": "However,（然而：表轉折）"}, "answer": "D", "expl": "The 2020 study contradicts the long-held view that Mauna Loa is the largest, so 'However' fits.", "explZh": "2020 年的研究推翻了「Mauna Loa 最大」的長期看法，表轉折，所以用「However」（然而）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: contrast with prior belief.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. For many years, scholars attributed the anonymous poem to a minor court writer. ______ newly discovered letters suggest that it was written by the queen herself.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. For many years, scholars attributed the anonymous poem to a minor court writer. ______ newly discovered letters suggest that it was written by the queen herself.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。多年來，學者們一直認為這首匿名詩出自一位不知名的宮廷作家之手。______ 新發現的信件顯示，這首詩是由女王本人所寫。", "opts": {"A": "Secondly,", "B": "Consequently,", "C": "Moreover,", "D": "However,"}, "optsZh": {"A": "Secondly,（第二：表列舉順序）", "B": "Consequently,（因此：表因果結果）", "C": "Moreover,（此外：表補充）", "D": "However,（然而：表轉折）"}, "answer": "D", "expl": "However contrasts the new evidence with the earlier view.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: contrast with prior belief.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The island was long described as geologically inactive. ______ recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> show that magma is still moving beneath its western ridge.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The island was long described as geologically inactive. ______ recent measurements show that magma is still moving beneath its western ridge.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這些新編目的資料也顯示出後來的編輯、譯者與教師如何為原社群以外的讀者改編這項計畫。一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。這座島長久以來被描述為地質上不活躍。______ 最近的測量顯示，岩漿仍在它西側的山脊下方移動。", "opts": {"A": "Nevertheless,", "B": "For instance,", "C": "Therefore,", "D": "Additionally,"}, "optsZh": {"A": "Nevertheless,（儘管如此：表讓步轉折）", "B": "For instance,（例如：表舉例）", "C": "Therefore,（因此：表結果或推論）", "D": "Additionally,（此外：表補充）"}, "answer": "A", "expl": "Nevertheless introduces contrary evidence.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: contrast with prior belief.", "vocab": false, "body": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. Doctors once considered the condition untreatable. ______ a new therapy has significantly improved symptoms in many patients.", "bodyPlain": "Visitors encountered sketches, recordings, and reconstructed workspaces that showed how the creators revised their ideas before presenting the finished pieces. At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. Doctors once considered the condition untreatable. ______ a new therapy has significantly improved symptoms in many patients.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "參觀者看到了草圖、錄音和重建的工作空間，這些展現出創作者在發表完成作品之前如何修改他們的構想。在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。醫生們曾經認為這種病無法治療。______ 一種新療法已使許多病患的症狀大幅改善。", "opts": {"A": "Furthermore,", "B": "By contrast,", "C": "Similarly,", "D": "As a result,"}, "optsZh": {"A": "Furthermore,（此外：表補充）", "B": "By contrast,（相較之下：表對比）", "C": "Similarly,（同樣地：表類比或相似）", "D": "As a result,（因此；結果：表結果）"}, "answer": "B", "expl": "By contrast signals a departure from the old belief.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: contrast with prior belief.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> was assumed to be a copy produced centuries after the original. ______ chemical analysis of the ink dates it to the author&#x27;s lifetime.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The manuscript was assumed to be a copy produced centuries after the original. ______ chemical analysis of the ink dates it to the author's lifetime.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。這份手稿原本被認為是在原作之後數個世紀才製作的抄本。______ 對墨水的化學分析將它的年代定在作者在世的時期。", "opts": {"A": "Consequently,", "B": "Likewise,", "C": "However,", "D": "Secondly,"}, "optsZh": {"A": "Consequently,（因此：表因果結果）", "B": "Likewise,（同樣地：表類比或相似）", "C": "However,（然而：表轉折）", "D": "Secondly,（第二：表列舉順序）"}, "answer": "C", "expl": "However introduces contradictory evidence.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: contrast with prior belief.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Astronomers had classified the object as an ordinary comet. ______ later <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> revealed unusual emissions that required a different explanation.", "bodyPlain": "In a laboratory study, researchers tracked a process over multiple stages and found that the outcome depended on timing, environment, and the interaction of several variables. Their summary presents the evidence carefully because a small change in wording would alter the precision of the claim and might make the conclusion sound broader than the data support. Astronomers had classified the object as an ordinary comet. ______ later observations revealed unusual emissions that required a different explanation.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一項實驗室研究中，研究人員追蹤了一個歷經多個階段的過程，並發現結果取決於時機、環境以及數個變數之間的交互作用。他們的摘要謹慎地呈現證據，因為措辭上的一點小改變就會影響主張的精確度，並可能使結論聽起來比數據所支持的範圍更廣。\n天文學家原本把這個天體歸類為普通的彗星。______ 後來的觀測發現了不尋常的輻射，需要另一種解釋。", "opts": {"A": "Moreover,", "B": "However,", "C": "Instead,", "D": "Therefore,"}, "optsZh": {"A": "Moreover,（此外：表補充）", "B": "However,（然而：表轉折）", "C": "Instead,（反而；取而代之：表替代）", "D": "Therefore,（因此：表結果或推論）"}, "answer": "B", "expl": "However marks the contrast.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: additional example.", "vocab": false, "body": "Samuel Coleridge-Taylor was a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-<a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a>/direct/?q=prominent\" target=\"_blank\" rel=\"noopener\" data-w=\"prominent\" data-pos=\"adj.\" data-en=\"important and easy to notice\" data-zh=\"突出的；顯著的\">prominent<\/a> classical music composer from England who toured the US three times in the early 1900s. The child of a West African father and an English mother, Coleridge-Taylor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasized<\/a> his mixed-race ancestry. For example, he referred to himself as Anglo-African. _______ he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporated<\/a> the sounds of traditional African music into his classical music compositions.", "bodyPlain": "Samuel Coleridge-Taylor was a prominent classical music composer from England who toured the US three times in the early 1900s. The child of a West African father and an English mother, Coleridge-Taylor emphasized his mixed-race ancestry. For example, he referred to himself as Anglo-African. _______ he incorporated the sounds of traditional African music into his classical music compositions.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "Samuel Coleridge-Taylor 是一位來自英格蘭的著名古典音樂作曲家，曾在 1900 年代初期三度巡迴美國。Coleridge-Taylor 是西非父親與英國母親所生的孩子，他強調自己的混血血統。例如，他稱自己為「Anglo-African」（英裔非洲人）。_______ 他把傳統非洲音樂的聲音融入他的古典音樂作品中。", "opts": {"A": "In addition,", "B": "Actually,", "C": "However,", "D": "Regardless,"}, "optsZh": {"A": "In addition,（此外：表補充另一個例子，正確）", "B": "Actually,（事實上：表更正或強調）", "C": "However,（然而：表轉折）", "D": "Regardless,（無論如何：表不受前述影響）"}, "answer": "A", "expl": "Incorporating African music is another way he emphasized his ancestry, adding to the first example, so 'In addition.'", "explZh": "把非洲音樂融入作品是他強調自身血統的另一個例子，表補充，所以用「In addition」（此外）。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: additional example.", "vocab": false, "body": "Several years of field <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preliminary\" target=\"_blank\" rel=\"noopener\" data-w=\"preliminary\" data-pos=\"adj.\" data-en=\"happening before the main part; initial\" data-zh=\"初步的\">preliminary<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> with older assumptions and emphasizes how much the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> depends on incomplete but suggestive evidence gathered across different seasons and locations. The novelist often explored her Caribbean heritage in interviews. For example, she discussed family stories from Barbados. ______ she set several early novels in island communities shaped by migration.", "bodyPlain": "Several years of field observations have complicated an earlier explanation of a natural phenomenon, and researchers now describe the situation with more caution than certainty. Their report compares preliminary measurements with older assumptions and emphasizes how much the interpretation depends on incomplete but suggestive evidence gathered across different seasons and locations. The novelist often explored her Caribbean heritage in interviews. For example, she discussed family stories from Barbados. ______ she set several early novels in island communities shaped by migration.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "數年的野外觀察使先前對某一自然現象的解釋變得複雜，研究人員現在描述這個情況時，抱持的是審慎而非確定的態度。他們的報告將初步測量結果與較早的假設加以比較，並強調這種詮釋在很大程度上取決於在不同季節與地點蒐集到、雖不完整卻具啟發性的證據。這位小說家常在訪談中探討她的加勒比海血統與傳承。例如，她談到來自巴貝多的家族故事。______ 她把幾部早期小說的背景設定在受移民影響的島嶼社群中。", "opts": {"A": "Regardless,", "B": "In addition,", "C": "Actually,", "D": "However,"}, "optsZh": {"A": "Regardless,（無論如何：表不受前述影響）", "B": "In addition,（此外：表補充另一個例子，正確）", "C": "Actually,（事實上：表更正或強調）", "D": "However,（然而：表轉折）"}, "answer": "B", "expl": "In addition adds another example.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: additional example.", "vocab": false, "body": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> that changed how historians understand a public project. Because the records were <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fragmentary\" target=\"_blank\" rel=\"noopener\" data-w=\"fragmentary\" data-pos=\"adj.\" data-en=\"consisting of small, incomplete pieces\" data-zh=\"零碎的；不完整的\">fragmentary<\/a>, the scholars had to connect small pieces of evidence across several sources before describing the project&#x27;s development, the people who shaped it, and the reasons its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> had been overlooked. The painter emphasized his Indigenous ancestry in public lectures. ______ he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporated<\/a> traditional weaving patterns into the backgrounds of several portraits.", "bodyPlain": "The newly cataloged materials also showed how later editors, translators, and teachers adapted the project for audiences outside its original community. A regional archive recently acquired letters, maps, and photographs that changed how historians understand a public project. Because the records were fragmentary, the scholars had to connect small pieces of evidence across several sources before describing the project's development, the people who shaped it, and the reasons its significance had been overlooked. The painter emphasized his Indigenous ancestry in public lectures. ______ he incorporated traditional weaving patterns into the backgrounds of several portraits.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "這些新編目的資料也顯示出後來的編輯、譯者與教師如何為原社群以外的讀者改編這項計畫。一座地區檔案館最近取得了一批信件、地圖與照片，改變了歷史學家對一項公共工程的理解。由於這些紀錄殘缺不全，學者們必須先把散見於數個來源的零星證據串連起來，才能描述這項工程的發展、塑造它的人物，以及它的重要性為何一直被忽略。這位畫家在公開演講中強調他的原住民血統。______ 他把傳統的編織圖案融入了幾幅肖像畫的背景中。", "opts": {"A": "On the contrary,", "B": "Instead,", "C": "Moreover,", "D": "Nevertheless,"}, "optsZh": {"A": "On the contrary,（正好相反：表否定前述並提出相反說法）", "B": "Instead,（反而；取而代之：表替代）", "C": "Moreover,（此外：表補充）", "D": "Nevertheless,（儘管如此：表讓步轉折）"}, "answer": "C", "expl": "Moreover adds related evidence.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: additional example.", "vocab": false, "body": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observation<\/a>, local history, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collaboration\" target=\"_blank\" rel=\"noopener\" data-w=\"collaboration\" data-pos=\"n.\" data-en=\"the act of working together\" data-zh=\"合作\">collaboration<\/a>. The exhibition notes explain how individual decisions, materials, audiences, and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutional<\/a> settings shaped the meaning of each work over time rather than treating the finished objects as isolated <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=achievement\" target=\"_blank\" rel=\"noopener\" data-w=\"achievement\" data-pos=\"n.\" data-en=\"something done successfully with effort or skill\" data-zh=\"成就\">achievements<\/a>. The composer celebrated regional folk traditions. For instance, she quoted mountain ballads in one symphony. ______ she used local dance rhythms in her chamber music.", "bodyPlain": "At a community arts center, a curator prepared an exhibition about creators whose work drew on scientific observation, local history, and collaboration. The exhibition notes explain how individual decisions, materials, audiences, and institutional settings shaped the meaning of each work over time rather than treating the finished objects as isolated achievements. The composer celebrated regional folk traditions. For instance, she quoted mountain ballads in one symphony. ______ she used local dance rhythms in her chamber music.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "在一間社區藝術中心，一位策展人籌備了一場展覽，主題是那些作品取材自科學觀察、地方歷史與合作的創作者。展覽說明文字解釋了個人的抉擇、材料、觀眾與機構環境如何隨著時間塑造每件作品的意義，而不是把完成的作品當作孤立的成就來看待。這位作曲家頌揚地方的民俗傳統。例如，她在一首交響曲中引用了山區民謠。______ 她在她的室內樂中使用了當地的舞蹈節奏。", "opts": {"A": "However,", "B": "Likewise,", "C": "Actually,", "D": "Regardless,"}, "optsZh": {"A": "However,（然而：表轉折）", "B": "Likewise,（同樣地：表類比或相似）", "C": "Actually,（事實上：表更正或強調）", "D": "Regardless,（無論如何：表不受前述影響）"}, "answer": "B", "expl": "Likewise adds a similar example.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: additional example.", "vocab": false, "body": "A city planning report compares several approaches to improving <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immediately\" target=\"_blank\" rel=\"noopener\" data-w=\"immediately\" data-pos=\"adv.\" data-en=\"at once; without delay\" data-zh=\"立刻\">immediately<\/a>, especially when different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhoods<\/a> experience the same policy in different ways. The architect <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=highlight\" target=\"_blank\" rel=\"noopener\" data-w=\"highlight\" data-pos=\"v.\" data-en=\"to draw attention to something\" data-zh=\"突顯；強調\">highlighted<\/a> her connection to coastal communities. She named one project after a fishing village. ______ she designed the building&#x27;s roofline to resemble boat sails.", "bodyPlain": "A city planning report compares several approaches to improving transportation, public health, and access to shared spaces. The report links individual examples to broader patterns, showing how policy choices can produce effects that are gradual, indirect, or difficult to measure immediately, especially when different neighborhoods experience the same policy in different ways. The architect highlighted her connection to coastal communities. She named one project after a fishing village. ______ she designed the building's roofline to resemble boat sails.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪個選項能以最合乎邏輯的轉折詞完成這段文字？", "bodyZh": "一份城市規劃報告比較了改善交通、公共衛生以及共享空間使用機會的幾種方法。這份報告將個別案例與更廣泛的模式連結起來，說明政策選擇可能產生漸進、間接或難以立即衡量的影響，尤其是當不同街區以不同方式經歷同一項政策時。這位建築師強調她與沿海社群之間的連結。她以一個漁村為其中一項建案命名。______ 她把建築的屋頂線條設計得像船帆。", "opts": {"A": "Additionally,", "B": "Rather,", "C": "However,", "D": "Nevertheless,"}, "optsZh": {"A": "Additionally,（此外：表補充）", "B": "Rather,（反而；更確切地說：表修正或替代）", "C": "However,（然而：表轉折）", "D": "Nevertheless,（儘管如此：表讓步轉折）"}, "answer": "A", "expl": "Additionally adds another supporting example.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: additional example.", "vocab": false, "body": "In a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a> study, researchers tracked a process over multiple stages and found that the outcome depended on timing, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">i
