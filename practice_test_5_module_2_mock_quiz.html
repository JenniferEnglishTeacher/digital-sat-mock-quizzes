  <script>
    const DATA = [{"n": 1, "concept": "Words in Context: reaching across means stretching toward.", "original": "The following text is adapted from Elizabeth von Arnim's 1922 novel The Enchanted April. Mrs. Wilkins and her friend Rose are traveling in Italy.\n\n\"I'm going to have one of these gorgeous oranges,\" said Mrs. Wilkins, staying where she was and reaching across to a black bowl piled with them. \"Rose, how can you resist them. Look--have this one. Do have this beauty--\" And she held out a big one.\n\nAs used in the text, what does the phrase \"reaching across to\" most nearly mean?\nA) Joining with\nB) Gaining on\nC) Stretching toward\nD) Arriving at", "generated": [{"id": "1.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The archivist leaned over the display case and ______ the brittle map, careful not to touch the glass while checking a faded inscription near the edge.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) arrived at\nB) caught up to\nC) joined with\nD) stretched toward", "answer": "D", "explanation": "Stretched toward means reached across to."}, {"id": "1.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Unable to leave her seat during the ceremony, the researcher ______ the side table to retrieve the program that had slid just beyond her chair.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) overtook\nB) arrived beside\nC) reached toward\nD) collaborated with", "answer": "C", "explanation": "Reached toward means extended one's body or arm toward something."}, {"id": "1.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The child stayed on the blanket but ______ the basket of shells, extending one arm as far as possible to choose the largest one.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) extended toward\nB) approached\nC) united with\nD) arrived at", "answer": "A", "explanation": "Extended toward means stretched toward."}, {"id": "1.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. From the back row, the technician ______ the control panel to silence the alarm without stepping away from the microscope.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) visited\nB) reached over to\nC) joined\nD) gained on", "answer": "B", "explanation": "Reached over to means reached across toward something."}, {"id": "1.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The painter, unwilling to move the wet canvas, ______ the tray of brushes and selected the thinnest one for the final line.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) caught up with\nB) leaned toward\nC) combined with\nD) arrived near", "answer": "B", "explanation": "Leaned toward can mean reached or stretched in the direction of something."}]}, {"n": 2, "concept": "Words in Context: obtain information.", "original": "A team of paleontologists has found a rich fossil deposit near Gulgong, Australia. The fossils are so well preserved that the team has been able to _______ detailed information about the life forms that left them behind, such as color patterns and how they interacted with other species.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) occupy\nB) hoard\nC) reserve\nD) obtain", "generated": [{"id": "2.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The newly digitized ship logs allowed historians to ______ information about trade routes that had previously been available only in scattered handwritten records.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) occupy\nB) obtain\nC) reserve\nD) hoard", "answer": "B", "explanation": "Obtain means get or acquire."}, {"id": "2.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. By comparing pollen trapped in lake sediment, researchers were able to ______ evidence about the region's vegetation before large-scale farming began.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) hoard\nB) occupy\nC) reserve\nD) extract", "answer": "D", "explanation": "Extract means obtain from a source."}, {"id": "2.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The telescope's improved sensors helped astronomers ______ precise measurements of a planet whose atmosphere had been too faint to study with older equipment.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) stockpile\nB) derive\nC) withhold\nD) inhabit", "answer": "B", "explanation": "Derive means obtain from evidence or a source."}, {"id": "2.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Although the damaged tablets were difficult to read, the team managed to ______ useful details about the city's legal system from repeated phrases in the surviving text.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) occupy\nB) hoard\nC) acquire\nD) reserve", "answer": "C", "explanation": "Acquire means obtain."}, {"id": "2.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The researchers used interviews, satellite images, and tax records to ______ a fuller picture of how the coastline community had changed after the storm.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) gain\nB) conceal\nC) occupy\nD) reserve", "answer": "A", "explanation": "Gain means obtain."}]}, {"n": 3, "concept": "Words in Context: reduced information flow.", "original": "According to a team of neuroeconomists from the University of Zurich, ease of decision making may be linked to communication between two brain regions, the prefrontal cortex and the parietal cortex. Individuals tend to be more decisive if the information flow between the regions is intensified, whereas they make choices more slowly when information flow is _______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) reduced\nB) evaluated\nC) determined\nD) acquired", "generated": [{"id": "3.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The patients solved the puzzle more quickly when activity in the two regions increased, but their responses slowed when the signal between those regions was ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) reduced\nB) determined\nC) evaluated\nD) acquired", "answer": "A", "explanation": "Reduced means made smaller or less intense."}, {"id": "3.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Traffic moved freely while all lanes were open, but it slowed sharply when construction ______ the road's capacity during the morning commute.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) diminished\nB) measured\nC) expanded\nD) obtained", "answer": "A", "explanation": "Diminished means reduced."}, {"id": "3.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The plant grew well in bright light, whereas its growth rate declined when the light reaching the leaves was deliberately ______.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) classified\nB) collected\nC) measured\nD) decreased", "answer": "D", "explanation": "Decreased means reduced."}, {"id": "3.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The wireless connection remained stable at close range but became unreliable when thick walls ______ the strength of the signal.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) acquired\nB) weakened\nC) evaluated\nD) determined", "answer": "B", "explanation": "Weakened means reduced in strength."}, {"id": "3.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Participants struggled when background noise was loud, but their recall improved when the distracting sound was ______ during the task.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) measured\nB) acquired\nC) muted\nD) resolved", "answer": "C", "explanation": "Muted means reduced in volume or intensity."}]}, {"n": 4, "concept": "Words in Context: tenuous place in memory.", "original": "The War of 1812 has _______ place in historical memory in Britain, partly because it is overshadowed by the much larger concurrent conflict against Napoleonic France and partly because it essentially maintained the geopolitical status quo for Britain: the country neither gained nor lost significant territory or position as a result of its participation in the war.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) a tenuous\nB) an enduring\nC) a contentious\nD) a conspicuous", "generated": [{"id": "4.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The sculptor's early notebooks occupy ______ place in art history: they are occasionally cited by specialists but are mostly overshadowed by her later public murals.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a prominent\nB) an enduring\nC) a heated\nD) a marginal", "answer": "D", "explanation": "Marginal means slight or not central, like tenuous in context."}, {"id": "4.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Because few letters from the expedition survived and later accounts contradict one another, the event has ______ status in the museum's official narrative.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a conspicuous\nB) an uncertain\nC) a celebrated\nD) a secure", "answer": "B", "explanation": "Uncertain means weak or not firmly established."}, {"id": "4.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The treaty has ______ role in popular memory, largely because the war that followed it drew much more attention from historians and the public.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a lasting\nB) a celebrated\nC) a fragile\nD) a prominent", "answer": "C", "explanation": "Fragile means not secure or strong."}, {"id": "4.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Although the scientist contributed to an important discovery, her reputation has ______ foothold in most textbooks, which focus instead on the laboratory's director.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a slight\nB) an enduring\nC) a disputed\nD) a conspicuous", "answer": "A", "explanation": "Slight means limited or weak."}, {"id": "4.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The regional uprising has ______ presence in national history courses because it produced no major territorial change and was quickly eclipsed by a larger conflict.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) a limited\nB) a permanent\nC) a controversial\nD) a visible", "answer": "A", "explanation": "Limited means not strong or extensive."}]}, {"n": 5, "concept": "Words in Context: defend speculative claims.", "original": "Claims about the original significance of Minoan bull-leaping rituals--depicted in paintings and sculptures from the second millennium BCE--are difficult to successfully _______. We know so little about the people archaeologists call the Minoans that assertions about what bull-leaping meant to them will almost inevitably rely on significant speculation and guesswork.\n\nWhich choice completes the text with the most logical and precise word or phrase?\nA) imagine\nB) summarize\nC) defend\nD) adjust", "generated": [{"id": "5.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian's claim that the monument was used for royal ceremonies is difficult to ______ because no written records describe the site's original purpose.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) defend\nB) summarize\nC) adjust\nD) imagine", "answer": "A", "explanation": "Defend means support with evidence."}, {"id": "5.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The archaeologist could not fully ______ the theory that the vessel was ceremonial, since the same kind of vessel also appears in ordinary household contexts.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) imagine\nB) substantiate\nC) condense\nD) modify", "answer": "B", "explanation": "Substantiate means support with evidence."}, {"id": "5.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Without more reliable dating evidence, the researchers found it hard to ______ the assertion that the settlement was abandoned because of drought.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) revise\nB) summarize\nC) decorate\nD) justify", "answer": "D", "explanation": "Justify means defend or support."}, {"id": "5.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The proposed interpretation of the symbols is difficult to ______, since similar marks appear in both religious and commercial documents from the period.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) imagine\nB) adjust\nC) support\nD) summarize", "answer": "C", "explanation": "Support means defend with evidence."}, {"id": "5.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Because the oral histories were recorded centuries after the event, scholars are cautious about trying to ______ specific claims about what actually occurred.\n\nWhich choice completes the text with the most logical and precise word or phrase?\n\nA) shorten\nB) alter\nC) validate\nD) imagine", "answer": "C", "explanation": "Validate means show to be sound or defensible."}]}, {"n": 6, "concept": "Text Function: emphasize Harris's boasting.", "original": "The following text is adapted from Jerome K. Jerome's 1889 novel Three Men in a Boat (To Say Nothing of the Dog). The narrator is traveling by boat with Harris and another friend.\n\n[Harris] told us anecdotes of how he had gone across the [English] Channel when it was so rough that the passengers had to be tied into their [beds], and he and the captain were the only two living souls on board who were not ill. Sometimes it was he and the second mate who were not ill; but it was generally he and one other man. If not he and another man, then it was he by himself.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\nA) It indicates the reason for Harris's eagerness to resume traveling.\nB) It hints at Harris's feeling that during an earlier boat trip, others didn't include him in activities.\nC) It emphasizes that Harris always boasts about his own constitution when speaking of a previous boat trip.\nD) It reveals that although Harris claims to prefer solitary activities when traveling, he actually enjoys having company.", "generated": [{"id": "6.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It describes how other researchers criticized the work.\nB) It offers evidence that radar is always reliable.\nC) It identifies the uncertainty that motivated the study.\nD) It states the study's final conclusion.", "answer": "C", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "6.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It summarizes the team's strongest result.\nB) It contradicts the claim made in the first sentence.\nC) It shifts the discussion away from archaeology.\nD) It defines the problem the later investigation attempts to address.", "answer": "D", "explanation": "The sentence frames the central research question."}, {"id": "6.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It lists the materials used in the experiment.\nB) It introduces a gap in knowledge that the experiment examines.\nC) It gives a historical overview of plant classification.\nD) It proves that drought has no effect on plants.", "answer": "B", "explanation": "The sentence identifies an unresolved issue."}, {"id": "6.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It raises a difficulty with a common interpretation.\nB) It introduces an unrelated theme.\nC) It provides biographical information about the novelist.\nD) It summarizes the novel's publication history.", "answer": "A", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "6.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It gives a personal anecdote about engineers.\nB) It compares underwater vehicles with aircraft.\nC) It explains the limitation that the new system is meant to address.\nD) It announces that the technology is already flawless.", "answer": "C", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 7, "concept": "Text Function: discrepancy between studies and events.", "original": "Several studies have found negligible electoral consequences for governments that impose fiscal austerity measures, yet some European governments recently suffered electorally due to their austerity programs. Evelyne Huebscher and colleagues attribute this incongruity to governments' tendency--not followed in the recent European cases--to implement austerity programs strategically to avoid electoral costs (e.g., setting spending cuts to take effect only after the next election), which has obscured the inherent political risks of austerity measures in the election data scholars have examined.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\nA) It explains a discrepancy between what has been observed in study settings and what has been observed in real-world settings that the text goes on to assert is attributable to the studies not using real-world data.\nB) It identifies a conflict between research findings and recent events that the text goes on to suggest is a consequence of a complicating factor in the data used to generate those findings.\nC) It presents a long-standing divergence in research findings that the text goes on to say is due to different groups of researchers using data that derive from different electoral circumstances.\nD) It describes a recent exception to a general pattern in research findings that the text goes on to explain is a result of researchers underestimating the significance of inconsistencies in the data they've analyzed.", "generated": [{"id": "7.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It states the study's final conclusion.\nB) It identifies the uncertainty that motivated the study.\nC) It offers evidence that radar is always reliable.\nD) It describes how other researchers criticized the work.", "answer": "B", "explanation": "The sentence presents the problem researchers tried to address."}, {"id": "7.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It summarizes the team's strongest result.\nB) It contradicts the claim made in the first sentence.\nC) It defines the problem the later investigation attempts to address.\nD) It shifts the discussion away from archaeology.", "answer": "C", "explanation": "The sentence frames the central research question."}, {"id": "7.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It proves that drought has no effect on plants.\nB) It gives a historical overview of plant classification.\nC) It lists the materials used in the experiment.\nD) It introduces a gap in knowledge that the experiment examines.", "answer": "D", "explanation": "The sentence identifies an unresolved issue."}, {"id": "7.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It introduces an unrelated theme.\nB) It raises a difficulty with a common interpretation.\nC) It provides biographical information about the novelist.\nD) It summarizes the novel's publication history.", "answer": "B", "explanation": "The sentence challenges a prior view and sets up analysis."}, {"id": "7.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.\n\nWhich choice best describes the function of the underlined sentence in the text as a whole?\n\nA) It explains the limitation that the new system is meant to address.\nB) It compares underwater vehicles with aircraft.\nC) It gives a personal anecdote about engineers.\nD) It announces that the technology is already flawless.", "answer": "A", "explanation": "The sentence identifies the practical limitation motivating the work."}]}, {"n": 8, "concept": "Paired Texts: language role in graphic novels.", "original": "Text 1\nGraphic novels are increasingly popular in bookstores and libraries, but they shouldn't be classified as literature. By definition, literature tells a story or conveys meaning through language only; graphic novels tell stories through illustrations and use language only sparingly, in captions and dialogue. Graphic novels are experienced as series of images and not as language, making them more similar to film than to literature.\n\nText 2\nGraphic novels present their stories through both language and images. Without captions and dialogue, readers would be unable to understand what is depicted in the illustrations: the story results from the interaction of text and image. Moreover, Alison Bechdel's Fun Home and many other graphic novels feature text that is as beautifully written as the prose found in many standard novels. Therefore, graphic novels qualify as literary texts.\n\nBased on the texts, how would the author of Text 2 most likely respond to the overall argument presented in Text 1?\nA) By asserting that language plays a more important role in graphic novels than the author of Text 1 recognizes\nB) By acknowledging that the author of Text 1 has identified a flaw that is common to all graphic novels\nC) By suggesting that the story lines of certain graphic novels are more difficult to understand than the author of Text 1 claims\nD) By agreeing with the author of Text 1 that most graphic novels aren't as well crafted as most literary works are", "generated": [{"id": "8.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nBased on the texts, which response is best supported?\n\nA) 'The administration faced economic challenges from the beginning.'\nB) 'The leader signed several decrees during his first month in office.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "answer": "D", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "8.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nBased on the texts, which response is best supported?\n\nA) Some farmers grew vegetables, while others grew grain.\nB) The southern region was included in the survey.\nC) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nD) The graph contains information about three regions.", "answer": "C", "explanation": "The answer uses a specific contrast in the data."}, {"id": "8.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nBased on the texts, which response is best supported?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) Some stars contain hydrogen and helium.\nC) The method used to study stars requires a telescope.\nD) One rocky planet has a thin atmosphere.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "8.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nBased on the texts, which response is best supported?\n\nA) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nB) Some songs use a meter also found in older European poetry.\nC) Many performers learned songs from relatives.\nD) The tradition is studied by scholars in several countries.", "answer": "A", "explanation": "Recent blended features support cultural exchange."}, {"id": "8.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nBased on the texts, which response is best supported?\n\nA) The table includes more than one year.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) Both towns had some volunteers.\nD) The program took place in a community.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 9, "concept": "Reading Detail: observing street scene.", "original": "The following text is adapted from Ann Petry's 1946 novel The Street. Lutie lives in an apartment in Harlem, New York.\n\nThe glow from the sunset was making the street radiant. The street is nice in this light, [Lutie] thought. It was swarming with children who were playing ball and darting back and forth across the sidewalk in complicated games of tag. Girls were skipping double dutch rope, going tirelessly through the exact center of a pair of ropes, jumping first on one foot and then the other.\n\nWhich choice best describes what is happening in the text?\nA) Lutie is observing the appearance of the street at a particular time of day and the events occurring on it.\nB) Lutie is annoyed by the noise of children playing games on her street.\nC) Lutie is puzzled by the rules of certain children's games.\nD) Lutie is spending time alone in her apartment because she doesn't want to interact with her neighbors.", "generated": [{"id": "9.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nAccording to the text, which choice is best supported?\n\nA) She refuses to give advice to others.\nB) She lacks affection for her family.\nC) She is admired mainly for her wealth.\nD) She shows unusual maturity and self-command.", "answer": "D", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "9.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nAccording to the text, which choice is best supported?\n\nA) The grandmother avoids family matters entirely.\nB) The narrator thinks patience is useless.\nC) The grandmother's influence is quiet but substantial.\nD) The family ignores the grandmother's opinions.", "answer": "C", "explanation": "The family respects her careful judgment."}, {"id": "9.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nAccording to the text, which choice is best supported?\n\nA) The coworkers are more accurate than the clerk.\nB) The business fails because of excessive caution.\nC) The clerk's carefulness is valuable despite being inconvenient.\nD) The clerk intentionally creates errors.", "answer": "C", "explanation": "The passage praises his precision."}, {"id": "9.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nAccording to the text, which choice is best supported?\n\nA) The leader makes decisions without hearing others.\nB) The leader values inclusive deliberation.\nC) The leader is unable to reach conclusions.\nD) The leader dislikes public meetings.", "answer": "B", "explanation": "The evidence shows patience and inclusion."}, {"id": "9.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nAccording to the text, which choice is best supported?\n\nA) She combines intellectual openness with rigorous standards.\nB) She avoids working with students.\nC) She publishes claims before testing them.\nD) She rejects all imaginative thinking.", "answer": "A", "explanation": "The contrast shows openness and rigor."}]}, {"n": 10, "concept": "Reading Detail: skepticism about Bosco Verticale plant survival.", "original": "Since its completion in 2014, Bosco Verticale (Vertical Forest)--a pair of residential towers in Milan, Italy, covered by vegetation--has become a striking symbol of environmental sustainability in architecture. Stefano Boeri intended his design, which features balconies that are home to hundreds of trees, to serve as a model for promoting urban biodiversity. However, the concept has faced skepticism: critics note that although the trees used in Bosco Verticale were specifically cultivated for the project, it's too early to tell if they can thrive in this unusual setting.\n\nAccording to the text, why are some critics skeptical of the concept behind Bosco Verticale?\nA) Some essential aspects of Bosco Verticale's design are difficult to adapt to locations other than Milan.\nB) The plant life on Bosco Verticale ended up being less varied than Boeri had envisioned it would be.\nC) The construction of Bosco Verticale was no less environmentally damaging than the construction of more conventional buildings is.\nD) It is unclear whether Bosco Verticale can support the plant life included in its design.", "generated": [{"id": "10.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.\n\nAccording to the text, which choice is best supported?\n\nA) She lacks affection for her family.\nB) She shows unusual maturity and self-command.\nC) She is admired mainly for her wealth.\nD) She refuses to give advice to others.", "answer": "B", "explanation": "The text emphasizes judgment, calmness, and emotional control."}, {"id": "10.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.\n\nAccording to the text, which choice is best supported?\n\nA) The narrator thinks patience is useless.\nB) The grandmother's influence is quiet but substantial.\nC) The grandmother avoids family matters entirely.\nD) The family ignores the grandmother's opinions.", "answer": "B", "explanation": "The family respects her careful judgment."}, {"id": "10.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nAccording to the text, which choice is best supported?\n\nA) The clerk's carefulness is valuable despite being inconvenient.\nB) The clerk intentionally creates errors.\nC) The coworkers are more accurate than the clerk.\nD) The business fails because of excessive caution.", "answer": "A", "explanation": "The passage praises his precision."}, {"id": "10.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nAccording to the text, which choice is best supported?\n\nA) The leader is unable to reach conclusions.\nB) The leader makes decisions without hearing others.\nC) The leader dislikes public meetings.\nD) The leader values inclusive deliberation.", "answer": "D", "explanation": "The evidence shows patience and inclusion."}, {"id": "10.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nAccording to the text, which choice is best supported?\n\nA) She publishes claims before testing them.\nB) She avoids working with students.\nC) She combines intellectual openness with rigorous standards.\nD) She rejects all imaginative thinking.", "answer": "C", "explanation": "The contrast shows openness and rigor."}]}, {"n": 11, "concept": "Main Idea: Bakhtin says fabula and syuzhet are insufficient.", "original": "Many literary theorists distinguish between fabula, a narrative's content, and syuzhet, a narrative's arrangement and presentation of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative--he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by interactions between the artist, the work, and the audience.\n\nWhich choice best states the main idea of the text?\nA) Literary theorist Mikhail Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives.\nB) Literary theorist Mikhail Bakhtin claimed that meaning is not inherent in a narrative but is created when an audience encounters a narrative so that narratives are interpreted differently by different people.\nC) The storytelling methods used in The Godfather Part II may seem unusually complicated, but they can be easily understood when two concepts res the grandmother's opinions.", "answer": "C", "explanation": "The family respects her careful judgment."}, {"id": "11.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.\n\nAccording to the text, which choice is best supported?\n\nA) The clerk intentionally creates errors.\nB) The clerk's carefulness is valuable despite being inconvenient.\nC) The business fails because of excessive caution.\nD) The coworkers are more accurate than the clerk.", "answer": "B", "explanation": "The passage praises his precision."}, {"id": "11.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.\n\nAccording to the text, which choice is best supported?\n\nA) The leader values inclusive deliberation.\nB) The leader dislikes public meetings.\nC) The leader makes decisions without hearing others.\nD) The leader is unable to reach conclusions.", "answer": "A", "explanation": "The evidence shows patience and inclusion."}, {"id": "11.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.\n\nAccording to the text, which choice is best supported?\n\nA) She rejects all imaginative thinking.\nB) She publishes claims before testing them.\nC) She avoids working with students.\nD) She combines intellectual openness with rigorous standards.", "answer": "D", "explanation": "The contrast shows openness and rigor."}]}, {"n": 12, "concept": "Quantitative Evidence: medicine and health highest in 2019.", "original": "Total Science Research Submissions by Topic, 2016-2019\n\nA student is researching the trends in the topics submitted to a national science fair for high school students. The graph shows the number of submissions by topic that were made each year. Based on the data in the graph, the student claims that there were more medicine and health research topics submitted in 2019 than in any other year.\n\nWhich choice most effectively uses data from the graph to support the underlined claim?\nA) In 2016, the number of cellular and molecular biology topic submissions was the same as the number of animal science topic submissions.\nB) In 2019, there were more physics and space science topic submissions than there were medicine and health topic submissions.\nC) The lowest number of animal science topic submissions in a year was approximately 95 in 2016.\nD) The highest number of medicine and health topic submissions during the period shown is approximately 285 in 2019.", "generated": [{"id": "12.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's speeches are preserved in several archives.'\nC) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nD) 'The administration faced economic challenges from the beginning.'", "answer": "C", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "12.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nB) The graph contains information about three regions.\nC) The southern region was included in the survey.\nD) Some farmers grew vegetables, while others grew grain.", "answer": "A", "explanation": "The answer uses a specific contrast in the data."}, {"id": "12.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) One rocky planet has a thin atmosphere.\nB) The method used to study stars requires a telescope.\nC) Some stars contain hydrogen and helium.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "12.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Many performers learned songs from relatives.\nC) The tradition is studied by scholars in several countries.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "12.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Both towns had some volunteers.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The table includes more than one year.\nD) The program took place in a community.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 13, "concept": "Command of Evidence: support ecological harm assertion.", "original": "Fish whose DNA has been modified to include genetic material from other species are known as transgenic. Some transgenic fish have genes from jellyfish that result in fluorescence (that is, they glow in the dark). Although these fish were initially engineered for research purposes in the 1990s, they were sold as pets in the 2000s and can now be found in the wild in creeks in Brazil. A student in a biology seminar who is writing a paper on these fish asserts that their escape from Brazilian fish farms into the wild may have significant negative long-term ecological effects.\n\nWhich quotation from a researcher would best support the student's assertion?\nA) \"In one site in the wild where transgenic fish were observed, females outnumbered males, while in another the numbers of females and males were equivalent.\"\nB) \"Though some presence of transgenic fish in the wild has been recorded, there are insufficient studies of the impact of those fish on the ecosystems into which they are introduced.\"\nC) \"The ecosystems into which transgenic fish are known to have been introduced may represent a subset of the ecosystems into which the fish have actually been introduced.\"\nD) \"Through interbreeding, transgenic fish might introduce the trait of fluorescence into wild fish populations, making those populations more vulnerable to predators.\"", "generated": [{"id": "13.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The leader's speeches are preserved in several archives.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader signed several decrees during his first month in office.'\nD) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "answer": "D", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "13.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Women formed a majority of southern vegetable growers but not of northern or central grain growers.\nB) The southern region was included in the survey.\nC) Some farmers grew vegetables, while others grew grain.\nD) The graph contains information about three regions.", "answer": "A", "explanation": "The answer uses a specific contrast in the data."}, {"id": "13.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.\nB) Some stars contain hydrogen and helium.\nC) One rocky planet has a thin atmosphere.\nD) The method used to study stars requires a telescope.", "answer": "A", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "13.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Many performers learned songs from relatives.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) Some songs use a meter also found in older European poetry.\nD) The tradition is studied by scholars in several countries.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "13.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The program took place in a community.\nB) Both towns had some volunteers.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) The table includes more than one year.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 14, "concept": "Quantitative Evidence: nitrogen offsets moderate climate effects.", "original": "Modeled Radial Growth of Sugar Maple Trees\n\nInes Ibanez and colleagues studied a forest site in which some sugar maple trees receive periodic fertilization with nitrogen to mimic the broader trend of increasing anthropogenic nitrogen deposition in soil. Ibanez and colleagues modeled the radial growth of the trees with and without nitrogen fertilization under three different climate scenarios (the current climate, moderate change, and extreme change). Although they found that climate change would negatively affect growth, they concluded that anthropogenic nitrogen deposition could more than offset that effect provided that change is moderate rather than extreme.\n\nWhich choice best describes data from the graph that support Ibanez and colleagues' conclusion?\nA) Growth with nitrogen under the current climate exceeded growth with nitrogen under moderate change, but the latter exceeded growth without nitrogen under extreme change.\nB) Growth without nitrogen under the current climate exceeded growth without nitrogen under moderate change, but the latter exceeded growth with nitrogen under extreme change.\nC) Growth with nitrogen under moderate change exceeded growth without nitrogen under moderate change, but the latter exceeded growth without nitrogen under extreme change.\nD) Growth with nitrogen under moderate change exceeded growth without nitrogen under the current climate, but the latter exceeded growth with nitrogen under extreme change.", "generated": [{"id": "14.1", "text": "The team also checked whether the p
