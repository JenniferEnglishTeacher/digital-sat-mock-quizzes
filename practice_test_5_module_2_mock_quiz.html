ta-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Researchers found that memory is shaped not only by neurons but also by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that a claim is true or reasonable\" data-zh=\"支持；證實\">support<\/a> cells in the brain. ______ new studies of memory disorders often <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigate<\/a> those support cells.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Researchers found that memory is shaped not only by neurons but also by support cells in the brain. ______ new studies of memory disorders often investigate those support cells.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。研究人員發現，記憶不只受神經元影響，也受到大腦中支持細胞的影響。______ 新的記憶障礙研究常常會調查這些支持細胞。", "opts": {"A": "However,", "B": "For example,", "C": "Therefore,", "D": "In contrast,"}, "optsZh": {"A": "However,（然而：表轉折）", "B": "For example,（例如：舉例）", "C": "Therefore,（因此：表結果）", "D": "In contrast,（相反地：表對比）"}, "answer": "C", "expl": "Therefore introduces the consequence of the finding.", "explZh": ""}, {"id": "29.3", "label": "Mock 29.3", "n": 29, "concept": "Transitions: consequence of new understanding.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Climate models show that soil moisture can affect regional <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>. ______ some climate studies now include detailed soil data instead of focusing only on air patterns.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Climate models show that soil moisture can affect regional temperatures. ______ some climate studies now include detailed soil data instead of focusing only on air patterns.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。氣候模型顯示，土壤濕度會影響區域氣溫。______ 現在有些氣候研究會納入詳細的土壤資料，而不只聚焦於大氣型態。", "opts": {"A": "In other words,", "B": "For instance,", "C": "That said,", "D": "As a result,"}, "optsZh": {"A": "In other words,（換句話說：表重述）", "B": "For instance,（例如：舉例）", "C": "That said,（話雖如此：表讓步轉折）", "D": "As a result,（結果：表因果）"}, "answer": "D", "expl": "As a result introduces the outcome.", "explZh": ""}, {"id": "29.4", "label": "Mock 29.4", "n": 29, "concept": "Transitions: consequence of new understanding.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The team discovered that the drug interacts with enzymes produced by gut bacteria. ______ clinical trials of the drug now track patients&#x27; microbiomes.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The team discovered that the drug interacts with enzymes produced by gut bacteria. ______ clinical trials of the drug now track patients' microbiomes.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。研究團隊發現這種藥物會與腸道細菌產生的酶發生交互作用。______ 這種藥物的臨床試驗現在會追蹤病患的微生物群。", "opts": {"A": "By contrast,", "B": "Nevertheless,", "C": "For example,", "D": "Accordingly,"}, "optsZh": {"A": "By contrast,（相較之下：表對比）", "B": "Nevertheless,（儘管如此：表讓步轉折）", "C": "For example,（例如：舉例）", "D": "Accordingly,（因此、據此：表結果）"}, "answer": "D", "expl": "Accordingly links the discovery to the change in research approach.", "explZh": ""}, {"id": "29.5", "label": "Mock 29.5", "n": 29, "concept": "Transitions: consequence of new understanding.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Historians increasingly recognize that trade routes carried ideas as well as goods. ______ research on ancient cities now often examines merchant networks alongside political records.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Historians increasingly recognize that trade routes carried ideas as well as goods. ______ research on ancient cities now often examines merchant networks alongside political records.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。歷史學家越來越認識到，貿易路線不只運送貨物，也傳播思想。______ 現在對古代城市的研究常常把商人網絡和政治紀錄一起檢視。", "opts": {"A": "Consequently,", "B": "In other words,", "C": "For instance,", "D": "That said,"}, "optsZh": {"A": "Consequently,（因此：表結果）", "B": "In other words,（換句話說：表重述）", "C": "For instance,（例如：舉例）", "D": "That said,（話雖如此：表讓步轉折）"}, "answer": "A", "expl": "Consequently introduces the result.", "explZh": ""}, {"id": "o30", "label": "Original Q30", "n": 30, "concept": "Student Notes: specify publication date.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Iranian scholar Abu Rayhan al-Biruni studied Earth&#x27;s physical features.<br>- He <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=theorize\" target=\"_blank\" rel=\"noopener\" data-w=\"theorize\" data-pos=\"v.\" data-en=\"to form an idea that explains something\" data-zh=\"提出理論；推論\">theorized<\/a> that a large <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landmass\" target=\"_blank\" rel=\"noopener\" data-w=\"landmass\" data-pos=\"n.\" data-en=\"a large area of land, such as a continent\" data-zh=\"大陸；陸塊\">landmass<\/a> existed west of Europe and east of Asia.<br>- Al-Biruni published his landmass <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=theory\" target=\"_blank\" rel=\"noopener\" data-w=\"theory\" data-pos=\"n.\" data-en=\"a set of ideas meant to explain something\" data-zh=\"理論\">theory<\/a> in 1037 CE.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Iranian scholar Abu Rayhan al-Biruni studied Earth's physical features.\n- He theorized that a large landmass existed west of Europe and east of Asia.\n- Al-Biruni published his landmass theory in 1037 CE.", "stem": "The student wants to specify when al-Biruni published his landmass theory. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要具體說明 al-Biruni 發表他的大陸理論的時間。哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時做了以下筆記：\n- 伊朗學者 Abu Rayhan al-Biruni 研究地球的自然地理特徵。\n- 他提出理論，認為在歐洲以西、亞洲以東存在一塊大陸。\n- Al-Biruni 在西元 1037 年發表了他的大陸理論。", "opts": {"A": "In 1037 CE, al-Biruni published his theory that a large landmass existed west of Europe and east of Asia.", "B": "Al-Biruni, who studied Earth's physical features, published a theory about a large landmass.", "C": "Al-Biruni was an Iranian scholar who studied Earth's physical features.", "D": "An Iranian scholar who studied Earth's physical features, al-Biruni theorized that a large landmass existed west of Europe and east of Asia."}, "optsZh": {"A": "西元 1037 年，al-Biruni 發表了他的理論，認為在歐洲以西、亞洲以東存在一大塊陸地。", "B": "研究地球自然地理特徵的 Al-Biruni 發表了一個關於一大塊陸地的理論。", "C": "Al-Biruni 是一位研究地球自然地理特徵的伊朗學者。", "D": "al-Biruni 是一位研究地球自然地理特徵的伊朗學者，他提出理論，認為在歐洲以西、亞洲以東存在一大塊陸地。"}, "answer": "A", "expl": "Only choice A gives the date (1037 CE) when al-Biruni published his landmass theory.", "explZh": "只有 A 說出了 al-Biruni 發表大陸理論的時間（西元 1037 年）。"}, {"id": "30.1", "label": "Mock 30.1", "n": 30, "concept": "Student Notes: specify publication date.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Mathematician Leila Noor proposed a calendar reform in 1984; the reform divided the year into equal quarters; Noor published the proposal in 1984; the goal is to specify when the proposal was published.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Mathematician Leila Noor proposed a calendar reform in 1984; the reform divided the year into equal quarters; Noor published the proposal in 1984; the goal is to specify when the proposal was published.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。筆記：數學家 Leila Noor 在 1984 年提出曆法改革；這項改革把一年平均分為四季；Noor 在 1984 年發表了這項提案；目標是具體說明這項提案發表的時間。", "opts": {"A": "In 1984, Leila Noor published her proposal to divide the year into equal quarters.", "B": "Calendar reforms can change how dates are organized.", "C": "The proposal divided the year into equal quarters.", "D": "Leila Noor was a mathematician interested in calendars."}, "optsZh": {"A": "1984 年，Leila Noor 發表了她把一年平均分為四季的提案。", "B": "曆法改革可以改變日期的編排方式。", "C": "這項提案把一年平均分為四季。", "D": "Leila Noor 是一位對曆法感興趣的數學家。"}, "answer": "A", "expl": "The answer specifies the date.", "explZh": ""}, {"id": "30.2", "label": "Mock 30.2", "n": 30, "concept": "Student Notes: specify publication date.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Botanist Kenji Mori studied alpine mosses; he argued that one <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survived<\/a> the last ice age in coastal refuges; Mori published the refuge theory in 1976; the goal is to specify when Mori published the theory.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Botanist Kenji Mori studied alpine mosses; he argued that one species survived the last ice age in coastal refuges; Mori published the refuge theory in 1976; the goal is to specify when Mori published the theory.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：植物學家 Kenji Mori 研究高山苔蘚；他主張其中一個物種在沿海避難所度過了上一次冰河期；Mori 在 1976 年發表了這個避難所理論；目標是具體說明 Mori 發表此理論的時間。", "opts": {"A": "Mori's theory concerned the last ice age.", "B": "In 1976, Mori published his theory that one moss species survived the last ice age in coastal refuges.", "C": "A refuge is an area where a species can survive difficult conditions.", "D": "Kenji Mori studied alpine mosses in coastal regions."}, "optsZh": {"A": "Mori 的理論與上一次冰河期有關。", "B": "1976 年，Mori 發表了他的理論，認為有一種苔蘚在沿海避難所度過了上一次冰河期。", "C": "避難所是一個物種能在艱困條件下存活的區域。", "D": "Kenji Mori 研究沿海地區的高山苔蘚。"}, "answer": "B", "expl": "The answer gives the publication date.", "explZh": ""}, {"id": "30.3", "label": "Mock 30.3", "n": 30, "concept": "Student Notes: specify publication date.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Historian Amara Patel studied trade across the Sahara; she theorized that salt traders helped spread musical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a>; Patel published the theory in 2008; the goal is to specify when the theory was published.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Historian Amara Patel studied trade across the Sahara; she theorized that salt traders helped spread musical instruments; Patel published the theory in 2008; the goal is to specify when the theory was published.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：歷史學家 Amara Patel 研究橫越撒哈拉的貿易；她提出理論，認為鹽商幫助傳播了樂器；Patel 在 2008 年發表了這個理論；目標是具體說明這個理論發表的時間。", "opts": {"A": "The Sahara was crossed by many trade routes.", "B": "Patel published her theory about salt traders and musical instruments in 2008.", "C": "Salt traders may have helped spread musical instruments.", "D": "Patel studied trade across the Sahara."}, "optsZh": {"A": "撒哈拉沙漠有許多貿易路線穿越。", "B": "Patel 在 2008 年發表了她關於鹽商與樂器的理論。", "C": "鹽商可能幫助傳播了樂器。", "D": "Patel 研究橫越撒哈拉的貿易。"}, "answer": "B", "expl": "The answer specifies when the theory appeared.", "explZh": ""}, {"id": "30.4", "label": "Mock 30.4", "n": 30, "concept": "Student Notes: specify publication date.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: Engineer Sofia Bell designed a low-cost water pump; the pump used bicycle parts; Bell published the pump design in 2015; the goal is to specify when Bell published the design.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Engineer Sofia Bell designed a low-cost water pump; the pump used bicycle parts; Bell published the pump design in 2015; the goal is to specify when Bell published the design.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：工程師 Sofia Bell 設計了一種低成本的水泵；這個水泵使用腳踏車零件；Bell 在 2015 年發表了水泵設計；目標是具體說明 Bell 發表設計的時間。", "opts": {"A": "Sofia Bell was an engineer who designed a water pump.", "B": "The pump used bicycle parts to lower its cost.", "C": "Low-cost pumps can be useful in rural areas.", "D": "In 2015, Sofia Bell published her design for a water pump made with bicycle parts."}, "optsZh": {"A": "Sofia Bell 是一位設計水泵的工程師。", "B": "這個水泵使用腳踏車零件來降低成本。", "C": "低成本的水泵在鄉村地區可能很有用。", "D": "2015 年，Sofia Bell 發表了她用腳踏車零件製作水泵的設計。"}, "answer": "D", "expl": "The answer identifies the publication year.", "explZh": ""}, {"id": "30.5", "label": "Mock 30.5", "n": 30, "concept": "Student Notes: specify publication date.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: Geographer Omar Chen studied island <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> patterns; he theorized that sailors used seasonal winds to reach the islands; Chen published the theory in 1992; the goal is to specify when the theory was published.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Geographer Omar Chen studied island settlement patterns; he theorized that sailors used seasonal winds to reach the islands; Chen published the theory in 1992; the goal is to specify when the theory was published.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。筆記：地理學家 Omar Chen 研究島嶼的聚落模式；他提出理論，認為水手利用季風抵達這些島嶼；Chen 在 1992 年發表了這個理論；目標是具體說明這個理論發表的時間。", "opts": {"A": "The theory concerns how sailors reached the islands.", "B": "Seasonal winds can affect sailing routes.", "C": "In 1992, Omar Chen published his theory that sailors used seasonal winds to reach the islands.", "D": "Omar Chen studied settlement patterns on islands."}, "optsZh": {"A": "這個理論探討水手如何抵達這些島嶼。", "B": "季風會影響航行路線。", "C": "1992 年，Omar Chen 發表了他的理論，認為水手利用季風抵達這些島嶼。", "D": "Omar Chen 研究島嶼上的聚落模式。"}, "answer": "C", "expl": "The answer specifies the date.", "explZh": ""}, {"id": "o31", "label": "Original Q31", "n": 31, "concept": "Student Notes: emphasize mass of Sirius A.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=astronomy\" target=\"_blank\" rel=\"noopener\" data-w=\"astronomy\" data-pos=\"n.\" data-en=\"the scientific study of stars, planets, and space\" data-zh=\"天文學\">astronomy<\/a>, the mass of stars can be described in units called <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=solar\" target=\"_blank\" rel=\"noopener\" data-w=\"solar\" data-pos=\"adj.\" data-en=\"relating to the Sun\" data-zh=\"太陽的\">solar<\/a> masses.<br>- One solar mass is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=roughly\" target=\"_blank\" rel=\"noopener\" data-w=\"roughly\" data-pos=\"adv.\" data-en=\"approximately; not exactly\" data-zh=\"大約；粗略地\">roughly<\/a> equal to the mass of the Sun.<br>- The mass of the star Proxima Centauri is 0.122 solar masses.<br>- The mass of the star Sirius A is 2.063 solar masses.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- In astronomy, the mass of stars can be described in units called solar masses.\n- One solar mass is roughly equal to the mass of the Sun.\n- The mass of the star Proxima Centauri is 0.122 solar masses.\n- The mass of the star Sirius A is 2.063 solar masses.", "stem": "The student wants to emphasize the mass of Sirius A. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調天狼星 A 的質量。哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時做了以下筆記：\n- 在天文學中，恆星的質量可以用稱為「太陽質量」的單位來描述。\n- 一個太陽質量大約等於太陽的質量。\n- 恆星比鄰星（Proxima Centauri）的質量是 0.122 個太陽質量。\n- 恆星天狼星 A（Sirius A）的質量是 2.063 個太陽質量。", "opts": {"A": "The mass of stars, like Proxima Centauri, can be described in units called solar masses.", "B": "In astronomy, the mass of stars can be described in units called solar masses, and one solar mass is roughly equal to the mass of the Sun.", "C": "The Sun is more massive than Proxima Centauri, which has a mass of 0.122 solar masses.", "D": "With a mass of 2.063 solar masses, Sirius A is more massive than the Sun."}, "optsZh": {"A": "恆星（例如比鄰星）的質量可以用稱為太陽質量的單位來描述。", "B": "在天文學中，恆星的質量可以用稱為太陽質量的單位來描述，而一個太陽質量大約等於太陽的質量。", "C": "太陽比質量為 0.122 個太陽質量的比鄰星更重。", "D": "天狼星 A 的質量為 2.063 個太陽質量，比太陽重。"}, "answer": "D", "expl": "Choice D states Sirius A's mass (2.063 solar masses) and shows it is more massive than the Sun, emphasizing its mass.", "explZh": "D 說出天狼星 A 的質量（2.063 個太陽質量），並指出它比太陽重，強調了它的質量。"}, {"id": "31.1", "label": "Mock 31.1", "n": 31, "concept": "Student Notes: emphasize mass of Sirius A.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: The mass of Star Vega B is 1.74 solar masses; one solar mass is roughly equal to the mass of the Sun; the mass of Proxima D is 0.18 solar masses; the goal is to emphasize the mass of Vega B.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The mass of Star Vega B is 1.74 solar masses; one solar mass is roughly equal to the mass of the Sun; the mass of Proxima D is 0.18 solar masses; the goal is to emphasize the mass of Vega B.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。筆記：恆星 Vega B 的質量是 1.74 個太陽質量；一個太陽質量大約等於太陽的質量；Proxima D 的質量是 0.18 個太陽質量；目標是強調 Vega B 的質量。", "opts": {"A": "The mass of stars can be described in solar masses.", "B": "Proxima D has a mass of 0.18 solar masses.", "C": "One solar mass is roughly equal to the Sun's mass.", "D": "With a mass of 1.74 solar masses, Vega B is more massive than the Sun."}, "optsZh": {"A": "恆星的質量可以用太陽質量來描述。", "B": "Proxima D 的質量是 0.18 個太陽質量。", "C": "一個太陽質量大約等於太陽的質量。", "D": "Vega B 的質量為 1.74 個太陽質量，比太陽重。"}, "answer": "D", "expl": "The answer emphasizes the target star's mass.", "explZh": ""}, {"id": "31.2", "label": "Mock 31.2", "n": 31, "concept": "Student Notes: emphasize mass of Sirius A.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: The exoplanet Kepler-99b has a mass of 6.15 Earth masses; Earth mass is a unit based on Earth&#x27;s mass; Mars has 0.107 Earth masses; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> Kepler-99b&#x27;s mass.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The exoplanet Kepler-99b has a mass of 6.15 Earth masses; Earth mass is a unit based on Earth's mass; Mars has 0.107 Earth masses; the goal is to emphasize Kepler-99b's mass.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：系外行星 Kepler-99b 的質量是 6.15 個地球質量；地球質量是以地球質量為基礎的單位；火星有 0.107 個地球質量；目標是強調 Kepler-99b 的質量。", "opts": {"A": "Mars has a mass of 0.107 Earth masses.", "B": "Planets outside the solar system are called exoplanets.", "C": "At 6.15 Earth masses, Kepler-99b is far more massive than Earth.", "D": "Earth mass is a unit used to describe planets."}, "optsZh": {"A": "火星的質量是 0.107 個地球質量。", "B": "太陽系以外的行星稱為系外行星。", "C": "Kepler-99b 有 6.15 個地球質量，遠比地球重得多。", "D": "地球質量是用來描述行星的單位。"}, "answer": "C", "expl": "The answer emphasizes the mass directly.", "explZh": ""}, {"id": "31.3", "label": "Mock 31.3", "n": 31, "concept": "Student Notes: emphasize mass of Sirius A.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: The galaxy Cluster A contains 900 trillion solar masses; Cluster B contains 120 trillion solar masses; solar mass is used to describe astronomical mass; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> Cluster A&#x27;s mass.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The galaxy Cluster A contains 900 trillion solar masses; Cluster B contains 120 trillion solar masses; solar mass is used to describe astronomical mass; the goal is to emphasize Cluster A's mass.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：星系團 Cluster A 含有 900 兆個太陽質量；Cluster B 含有 120 兆個太陽質量；太陽質量用於描述天文質量；目標是強調 Cluster A 的質量。", "opts": {"A": "Cluster B contains 120 trillion solar masses.", "B": "A galaxy cluster contains many galaxies.", "C": "Astronomers use solar masses to describe very large objects.", "D": "With 900 trillion solar masses, Cluster A is much more massive than Cluster B."}, "optsZh": {"A": "Cluster B 含有 120 兆個太陽質量。", "B": "一個星系團包含許多星系。", "C": "天文學家用太陽質量來描述非常大的天體。", "D": "Cluster A 有 900 兆個太陽質量，比 Cluster B 重得多。"}, "answer": "D", "expl": "The answer emphasizes the target mass.", "explZh": ""}, {"id": "31.4", "label": "Mock 31.4", "n": 31, "concept": "Student Notes: emphasize mass of Sirius A.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: A neutron star has a mass of 1.8 solar masses; it is only about 20 kilometers wide; one solar mass equals roughly the mass of the Sun; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> the neutron star&#x27;s mass.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A neutron star has a mass of 1.8 solar masses; it is only about 20 kilometers wide; one solar mass equals roughly the mass of the Sun; the goal is to emphasize the neutron star's mass.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：一顆中子星的質量是 1.8 個太陽質量；它的寬度只有大約 20 公里；一個太陽質量大約等於太陽的質量；目標是強調這顆中子星的質量。", "opts": {"A": "The neutron star is only about 20 kilometers wide.", "B": "Despite being only about 20 kilometers wide, the neutron star has a mass of 1.8 solar masses.", "C": "Neutron stars are very compact astronomical objects.", "D": "Solar masses are used to describe star masses."}, "optsZh": {"A": "這顆中子星只有大約 20 公里寬。", "B": "這顆中子星雖然只有大約 20 公里寬，質量卻有 1.8 個太陽質量。", "C": "中子星是非常緻密的天體。", "D": "太陽質量用於描述恆星的質量。"}, "answer": "B", "expl": "The answer emphasizes the mass.", "explZh": ""}, {"id": "31.5", "label": "Mock 31.5", "n": 31, "concept": "Student Notes: emphasize mass of Sirius A.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: The star Deneb has a mass of about 19 solar masses; one solar mass is the Sun&#x27;s mass; the star Barnard&#x27;s Star has about 0.16 solar masses; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> Deneb&#x27;s mass.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The star Deneb has a mass of about 19 solar masses; one solar mass is the Sun's mass; the star Barnard's Star has about 0.16 solar masses; the goal is to emphasize Deneb's mass.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。筆記：恆星天津四（Deneb）的質量約為 19 個太陽質量；一個太陽質量就是太陽的質量；巴納德星（Barnard's Star）約有 0.16 個太陽質量；目標是強調天津四的質量。", "opts": {"A": "At about 19 solar masses, Deneb is vastly more massive than the Sun.", "B": "Barnard's Star has about 0.16 solar masses.", "C": "Astronomers compare stars using solar masses.", "D": "The Sun's mass defines one solar mass."}, "optsZh": {"A": "天津四約有 19 個太陽質量，遠比太陽重得多。", "B": "巴納德星約有 0.16 個太陽質量。", "C": "天文學家用太陽質量來比較恆星。", "D": "太陽的質量定義了一個太陽質量。"}, "answer": "A", "expl": "The answer emphasizes Deneb's mass.", "explZh": ""}, {"id": "o32", "label": "Original Q32", "n": 32, "concept": "Student Notes: contrast first- and second-class levers.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- A lever is a simple machine consisting of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rigid\" target=\"_blank\" rel=\"noopener\" data-w=\"rigid\" data-pos=\"adj.\" data-en=\"stiff and not able to bend\" data-zh=\"堅硬的；不易彎曲的\">rigid<\/a> beam and a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fulcrum\" target=\"_blank\" rel=\"noopener\" data-w=\"fulcrum\" data-pos=\"n.\" data-en=\"the point on which a lever turns or is supported\" data-zh=\"支點\">fulcrum<\/a>.<br>- The fulcrum is the point about which the beam pivots.<br>- The input force (effort) is the force applied to the lever.<br>- The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=output\" target=\"_blank\" rel=\"noopener\" data-w=\"output\" data-pos=\"n.\" data-en=\"the amount of something produced\" data-zh=\"產出；產量\">output<\/a> force (load) is the force that the lever exerts on another object.<br>- In first-class levers, the fulcrum is located between the effort and the load.<br>- In second-class levers, the load is located between the effort and the fulcrum.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- A lever is a simple machine consisting of a rigid beam and a fulcrum.\n- The fulcrum is the point about which the beam pivots.\n- The input force (effort) is the force applied to the lever.\n- The output force (load) is the force that the lever exerts on another object.\n- In first-class levers, the fulcrum is located between the effort and the load.\n- In second-class levers, the load is located between the effort and the fulcrum.", "stem": "The student wants to contrast first-class levers and second-class levers. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要對比第一類槓桿和第二類槓桿。哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時做了以下筆記：\n- 槓桿是一種由堅固的橫桿和支點組成的簡單機械。\n- 支點是橫桿繞著轉動的那一點。\n- 輸入力（施力）是施加在槓桿上的力。\n- 輸出力（負載）是槓桿對另一個物體施加的力。\n- 在第一類槓桿中，支點位於施力點與負載之間。\n- 在第二類槓桿中，負載位於施力點與支點之間。", "opts": {"A": "In levers, the effort is the force applied to the lever; the load, in contrast, is the force that the lever exerts on another object.", "B": "In first-class and second-class levers, the fulcrum and the load are in different locations.", "C": "First-class levers are simple machines consisting of a rigid beam and a fulcrum, but then again, the same is true of second-class levers.", "D": "In first-class levers, the fulcrum is located between the effort and the load, but in second-class levers, the load is located between the effort and the fulcrum."}, "optsZh": {"A": "在槓桿中，施力是施加在槓桿上的力；相對地，負載是槓桿對另一個物體施加的力。", "B": "在第一類和第二類槓桿中，支點和負載位於不同的位置。", "C": "第一類槓桿是由堅固橫桿與支點組成的簡單機械，不過話說回來，第二類槓桿也是如此。", "D": "在第一類槓桿中，支點位於施力點與負載之間，但在第二類槓桿中，負載位於施力點與支點之間。"}, "answer": "D", "expl": "Choice D contrasts the two lever types by stating where the fulcrum is in first-class levers and where the load is in second-class levers.", "explZh": "D 分別說明第一類槓桿支點的位置與第二類槓桿負載的位置，對比了這兩種槓桿。"}, {"id": "32.1", "label": "Mock 32.1", "n": 32, "concept": "Student Notes: contrast first- and second-class levers.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: A seesaw is a lever; in a first-class lever, the fulcrum is between effort and load; in a second-class lever, the load is between effort and fulcrum; the goal is to contrast the two lever types.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A seesaw is a lever; in a first-class lever, the fulcrum is between effort and load; in a second-class lever, the load is between effort and fulcrum; the goal is to contrast the two lever types.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。筆記：蹺蹺板是一種槓桿；在第一類槓桿中，支點位於施力與負載之間；在第二類槓桿中，負載位於施力與支點之間；目標是對比這兩種槓桿。", "opts": {"A": "The fulcrum is the point about which a lever turns.", "B": "A seesaw is one example of a lever.", "C": "First-class and second-class levers are both simple machines.", "D": "In first-class levers, the fulcrum is between effort and load, whereas in second-class levers, the load is between effort and fulcrum."}, "optsZh": {"A": "支點是槓桿繞著轉動的那一點。", "B": "蹺蹺板是槓桿的一個例子。", "C": "第一類和第二類槓桿都是簡單機械。", "D": "在第一類槓桿中，支點位於施力與負載之間；而在第二類槓桿中，負載位於施力與支點之間。"}, "answer": "D", "expl": "The answer directly contrasts the locations.", "explZh": ""}, {"id": "32.2", "label": "Mock 32.2", "n": 32, "concept": "Student Notes: contrast first- and second-class levers.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: Type A hinges have the pin between the two plates; Type B hinges have one plate between the pin and the other plate; both allow doors to rotate; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contrast\" target=\"_blank\" rel=\"noopener\" data-w=\"contrast\" data-pos=\"v.\" data-en=\"to compare in order to show differences\" data-zh=\"對比；對照\">contrast<\/a> Type A and Type B hinges.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Type A hinges have the pin between the two plates; Type B hinges have one plate between the pin and the other plate; both allow doors to rotate; the goal is to contrast Type A and Type B hinges.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：A 型鉸鏈的軸銷位於兩片板之間；B 型鉸鏈則是一片板位於軸銷和另一片板之間；兩者都能讓門轉動；目標是對比 A 型與 B 型鉸鏈。", "opts": {"A": "Type A hinges place the pin between the plates, while Type B hinges place one plate between the pin and the other plate.", "B": "Both hinge types include plates and a pin.", "C": "Hinges allow doors to rotate.", "D": "The pin is important in any hinge."}, "optsZh": {"A": "A 型鉸鏈把軸銷放在兩片板之間，而 B 型鉸鏈則把一片板放在軸銷和另一片板之間。", "B": "兩種鉸鏈都包含板片和軸銷。", "C": "鉸鏈讓門可以轉動。", "D": "軸銷在任何鉸鏈中都很重要。"}, "answer": "A", "expl": "The answer contrasts the two designs.", "explZh": ""}, {"id": "32.3", "label": "Mock 32.3", "n": 32, "concept": "Student Notes: contrast first- and second-class levers.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: In class-one pulleys, the wheel is fixed overhead; in class-two pulleys, the wheel moves with the load; both systems use rope tension; the goal is to contrast the pulley types.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: In class-one pulleys, the wheel is fixed overhead; in class-two pulleys, the wheel moves with the load; both systems use rope tension; the goal is to contrast the pulley types.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。筆記：在第一類滑輪中，輪子固定在上方；在第二類滑輪中，輪子隨負載移動；兩種系統都利用繩子的張力；目標是對比這兩種滑輪。", "opts": {"A": "A pulley system can reduce effort.", "B": "Class-one pulleys have a fixed wheel, whereas class-two pulleys have a wheel that moves with the load.", "C": "Loads can be lifted with several pulley designs.", "D": "Both pulley types use rope tension to move a load."}, "optsZh": {"A": "滑輪系統可以減少所需的施力。", "B": "第一類滑輪的輪子是固定的，而第二類滑輪的輪子則隨負載移動。", "C": "負載可以用好幾種滑輪設計來提起。", "D": "兩種滑輪都利用繩子的張力來移動負載。"}, "answer": "B", "expl": "The answer directly contrasts the types.", "explZh": ""}, {"id": "32.4", "label": "Mock 32.4", "n": 32, "concept": "Student Notes: contrast first- and second-class levers.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Notes: A first-order stream has no tributaries; a second-order stream forms when two first-order streams meet; both are part of river networks; the goal is to contrast the stream types.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A first-order stream has no tributaries; a second-order stream forms when two first-order streams meet; both are part of river networks; the goal is to contrast the stream types.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。筆記：一級河流沒有支流；兩條一級河流匯合時形成二級河流；兩者都是河川網絡的一部分；目標是對比這兩種河流。", "opts": {"A": "River networks may contain many streams.", "B": "Both first- and second-order streams occur in river networks.", "C": "Unlike a first-order stream, which has no tributaries, a second-order stream forms when two first-order streams meet.", "D": "Streams can be classified by order."}, "optsZh": {"A": "河川網絡可能包含許多河流。", "B": "一級河流和二級河流都存在於河川網絡中。", "C": "一級河流沒有支流；與之不同的是，二級河流是在兩條一級河流匯合時形成的。", "D": "河流可以依級數分類。"}, "answer": "C", "expl": "The answer contrasts first and second order.", "explZh": ""}, {"id": "32.5", "label": "Mock 32.5", "n": 32, "concept": "Student Notes: contrast first- and second-class levers.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Notes: In direct democracy, citizens vote on laws themselves; in representative democracy, citizens elect officials to vote on laws; both are democratic systems; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contrast\" target=\"_blank\" rel=\"noopener\" data-w=\"contrast\" data-pos=\"v.\" data-en=\"to compare in order to show differences\" data-zh=\"對比；對照\">contrast<\/a> the systems.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: In direct democracy, citizens vote on laws themselves; in representative democracy, citizens elect officials to vote on laws; both are democratic systems; the goal is to contrast the systems.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。筆記：在直接民主中，公民親自對法律投票；在代議民主中，公民選出官員來對法律投票；兩者都是民主制度；目標是對比這兩種制度。", "opts": {"A": "Both direct and representative democracy are democratic systems.", "B": "Elections are important in representative democracies.", "C": "In direct democracy, citizens vote on laws themselves, whereas in representative democracy, elected officials vote on laws.", "D": "Citizens participate in both systems."}, "optsZh": {"A": "直接民主和代議民主都是民主制度。", "B": "選舉在代議民主中很重要。", "C": "在直接民主中，公民親自對法律投票；而在代議民主中，則由選出的官員對法律投票。", "D": "公民在兩種制度中都有參與。"}, "answer": "C", "expl": "The answer contrasts the decision makers.", "explZh": ""}, {"id": "o33", "label": "Original Q33", "n": 33, "concept": "Student Notes: emphasize similarity between P and S waves.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Earthquakes start at a point called a &quot;focus&quot; and spread out from there as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=seismic\" target=\"_blank\" rel=\"noopener\" data-w=\"seismic\" data-pos=\"adj.\" data-en=\"relating to earthquakes\" data-zh=\"地震的\">seismic<\/a> waves.<br>- The two types of seismic waves that travel beneath Earth&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> are primary waves (P waves) and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secondary\" target=\"_blank\" rel=\"noopener\" data-w=\"secondary\" data-pos=\"adj.\" data-en=\"less important than something else\" data-zh=\"次要的\">secondary<\/a> waves (S waves).<br>- P waves travel more quickly beneath Earth&#x27;s surface than do S waves.<br>- P waves compress and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expand\" target=\"_blank\" rel=\"noopener\" data-w=\"expand\" data-pos=\"v.\" data-en=\"to become or make larger\" data-zh=\"擴展\">expand<\/a> the ground, causing it to move backward and forward.<br>- S waves cause the ground to move from side to side.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Earthquakes start at a point called a \"focus\" and spread out from there as seismic waves.\n- The two types of seismic waves that travel beneath Earth's surface are primary waves (P waves) and secondary waves (S waves).\n- P waves travel more quickly beneath Earth's surface than do S waves.\n- P waves compress and expand the ground, causing it to move backward and forward.\n- S waves cause the ground to move from side to side.", "stem": "The student wants to emphasize a similarity between P waves and S waves. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想要強調 P 波和 S 波之間的一個相似處。哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "一名學生在研究某個主題時做了以下筆記：\n- 地震從一個稱為「震源」的點開始，並以地震波的形式從那裡向外擴散。\n- 在地表下傳播的兩種地震波是初波（P 波）和次波（S 波）。\n- P 波在地表下的傳播速度比 S 波快。\n- P 波會壓縮和擴張地面，使地面前後移動。\n- S 波會使地面左右移動。", "opts": {"A": "P waves and S waves both travel beneath Earth's surface, causing the ground to move.", "B": "P waves travel away from an earthquake's starting point at a higher rate of speed than do S waves.", "C": "Spreading out from the focus of an earthquake, P waves move the ground backward and forward.", "D": "Although P waves and S waves start at the same point, they behave very differently."}, "optsZh": {"A": "P 波和 S 波都在地表下傳播，並使地面移動。", "B": "P 波從地震起始點向外傳播的速度比 S 波快。", "C": "P 波從地震的震源向外擴散，使地面前後移動。", "D": "雖然 P 波和 S 波從同一點開始，它們的行為卻非常不同。"}, "answer": "A", "expl": "Choice A states something both wave types share: they both travel beneath Earth's surface and make the ground move.", "explZh": "A 說出兩種波的共同點：它們都在地表下傳播，而且都會使地面移動。"}, {"id": "33.1", "label": "Mock 33.1", "n": 33, "concept": "Student Notes: emphasize similarity between P and S waves.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Notes: Sound waves and light waves both transfer energy; sound waves require a medium; light waves can travel through a vacuum; the goal is to emphasize a similarity.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Sound waves and light waves both transfer energy; sound waves require a medium; light waves can travel through a vacuum; the goal is to emphasize a similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。筆記：聲波和光波都能傳遞能量；聲波需要介質；光波可以在真空中傳播；目標是強調一個相似處。", "opts": {"A": "The two wave types differ in whether they need a medium.", "B": "Sound waves require air or another medium.", "C": "Light waves can travel through space.", "D": "Both sound waves and light waves transfer energy."}, "optsZh": {"A": "這兩種波的差別在於是否需要介質。", "B": "聲波需要空氣或其他介質。", "C": "光波可以在太空中傳播。", "D": "聲波和光波都能傳遞能量。"}, "answer": "D", "expl": "The answer states the shared feature.", "explZh": ""}, {"id": "33.2", "label": "Mock 33.2", "n": 33, "concept": "Student Notes: emphasize similarity between P and S waves.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Notes: P waves and S waves travel through Earth; both begin at an earthquake&#x27;s focus; P waves are faster; S waves move the ground side to side; the goal is to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasize<\/a> similarity.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: P waves and S waves travel through Earth; both begin at an earthquake's focus; P waves are faster; S waves move the ground side to side; the goal is to emphasize similarity.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "哪一個選項最能有效運用筆記中的相關資訊來達成這個目標？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。筆記：P 波和 S 波都在地球內部傳播；兩者都從地震的震源開始；P 波比較快；S 波使地面左右移動；目標是強調相似處。", "opts": {"A": "S waves move the ground side to side.", "B": "Earthquakes produce several kinds of seismic waves.", "C": "Both P waves and S waves begin at an earthquake's focus and travel through Earth.", "D": "P waves travel faster than S waves."}, "optsZh": {"A": "S 波使地面左右移動。", "B": "地震會產生好幾種地震波。", "C": "P 波和 S 波都從地震的震源開始，並在地球內部傳播。", "D": "P 波傳播得比 S 波快。"}, "answer": "C", "expl": "The answer emphasizes the similarity.", "explZh": ""}, {"id": "33.3", "label": "Mock 33.3", "n": 33, "concept": "Student Notes: emphasize similarity between P and S waves.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Notes: Xylem and phloem are plant tissues; xylem transports water; phloem transports sugars; both move materials through a plant; the goal is to emphasize similarity.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Xylem and phloem are plant tissues; xylem transports water; phloem transports sugars; both move materials through a plant; the goal is to emphasize s
