dyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最能有效運用文本、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而不是務實的政策制定者來看待。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "B": "'The administration faced economic challenges from the beginning.'", "C": "'The leader signed several decrees during his first month in office.'", "D": "'The leader's speeches are preserved in several archives.'"}, "optsZh": {"A": "「這位領導人在建國過程中的象徵性角色，比他政府短暫且起伏不定的施政紀錄更重要。」", "B": "「這個政府從一開始就面臨經濟挑戰。」", "C": "「這位領導人在上任第一個月內簽署了數項法令。」", "D": "「這位領導人的演說保存在數個檔案館中。」"}, "answer": "A", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Quantitative Evidence: irrigation output sensitive to baseline precipitation.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that a claim is true or reasonable\" data-zh=\"支持；證實\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最能有效運用文本、圖表、引文或研究中的證據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，女性農民在南部地區的蔬菜種植者中佔 64%，但在北部與中部地區的穀物種植者中佔不到 35%。哪一項陳述最能運用圖表來支持有關地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The southern region was included in the survey.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "有些農民種蔬菜，有些則種穀物。", "B": "南部地區有被納入調查。", "C": "女性在南部蔬菜種植者中佔多數，但在北部或中部的穀物種植者中則不然。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Quantitative Evidence: irrigation output sensitive to baseline precipitation.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最能有效運用文本、圖表、引文或研究中的證據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩石行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Some stars contain hydrogen and helium.", "B": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "C": "One rocky planet has a thin atmosphere.", "D": "The method used to study stars requires a telescope."}, "optsZh": {"A": "有些恆星含有氫和氦。", "B": "研究發現有好幾顆岩石行星所含的鐵，比例遠高於它們所環繞的恆星。", "C": "有一顆岩石行星的大氣層很稀薄。", "D": "研究恆星的方法需要用到望遠鏡。"}, "answer": "B", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Quantitative Evidence: irrigation output sensitive to baseline precipitation.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最能有效運用文本、圖表、引文或研究中的證據？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Some songs use a meter also found in older European poetry.", "B": "Many performers learned songs from relatives.", "C": "The tradition is studied by scholars in several countries.", "D": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact."}, "optsZh": {"A": "有些歌曲使用的格律也見於較古老的歐洲詩歌。", "B": "許多表演者是從親戚那裡學會歌曲的。", "C": "有好幾個國家的學者在研究這項傳統。", "D": "有幾首民謠包含了在地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。"}, "answer": "D", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Quantitative Evidence: irrigation output sensitive to baseline precipitation.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最能有效運用文本、圖表、引文或研究中的證據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program took place in a community.", "C": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "D": "Both towns had some volunteers."}, "optsZh": {"A": "這張表格包含不只一年的資料。", "B": "這項計畫在一個社區中進行。", "C": "與沒有該計畫的城鎮相比，這項計畫與受訓志工人數明顯增加有關。", "D": "兩個城鎮都有一些志工。"}, "answer": "C", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Logical Completion: dialect similarity from Scottish settlement.", "vocab": false, "body": "In dialects of English spoken in Scotland, the &quot;r&quot; sound is strongly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasize\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasize\" data-pos=\"v.\" data-en=\"to give special importance to something\" data-zh=\"強調\">emphasized<\/a> when it appears at the end of syllables (as in &quot;car&quot;) or before other consonant sounds (as in &quot;bird&quot;). English dialects of the Upland South, a region stretching from Oklahoma to western Virginia, place similar <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=emphasis\" target=\"_blank\" rel=\"noopener\" data-w=\"emphasis\" data-pos=\"n.\" data-en=\"special importance or attention given to something\" data-zh=\"強調；重點\">emphasis<\/a> on &quot;r&quot; at the ends of syllables and before other consonant sounds. Historical records show that the Upland South was colonized largely by people whose ancestors came from Scotland. Thus, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=linguist\" target=\"_blank\" rel=\"noopener\" data-w=\"linguist\" data-pos=\"n.\" data-en=\"a scientist who studies language\" data-zh=\"語言學家\">linguists<\/a> have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclude\" target=\"_blank\" rel=\"noopener\" data-w=\"conclude\" data-pos=\"v.\" data-en=\"to decide something after considering the evidence\" data-zh=\"得出結論\">concluded<\/a> that _______", "bodyPlain": "In dialects of English spoken in Scotland, the \"r\" sound is strongly emphasized when it appears at the end of syllables (as in \"car\") or before other consonant sounds (as in \"bird\"). English dialects of the Upland South, a region stretching from Oklahoma to western Virginia, place similar emphasis on \"r\" at the ends of syllables and before other consonant sounds. Historical records show that the Upland South was colonized largely by people whose ancestors came from Scotland. Thus, linguists have concluded that _______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在蘇格蘭使用的英語方言中，當「r」音出現在音節結尾（如 \"car\"）或其他子音之前（如 \"bird\"）時，會被強烈地發出來。上南方地區（從奧克拉荷馬州延伸到維吉尼亞州西部的區域）的英語方言，對音節結尾及其他子音前的「r」也有類似的強調。歷史紀錄顯示，上南方地區的殖民者大多是祖先來自蘇格蘭的人。因此，語言學家得出結論：_______", "opts": {"A": "the English dialects spoken in the Upland South acquired their emphasis on the \"r\" sound from dialects spoken in Scotland.", "B": "emphasis on the \"r\" sound will eventually spread from English dialects spoken in the Upland South to dialects spoken elsewhere.", "C": "the English dialects spoken in Scotland were influenced by dialects spoken in the Upland South.", "D": "people from Scotland abandoned their emphasis on the \"r\" sound after relocating to the Upland South."}, "optsZh": {"A": "上南方地區的英語方言對「r」音的強調是從蘇格蘭使用的方言而來的。", "B": "對「r」音的強調最終會從上南方地區的英語方言擴散到其他地方的方言。", "C": "蘇格蘭使用的英語方言受到了上南方地區方言的影響。", "D": "來自蘇格蘭的人在遷居上南方地區後，就不再強調「r」音。"}, "answer": "A", "expl": "Upland South dialects share Scottish dialects' emphasis on 'r,' and the region was settled largely by people of Scottish ancestry, so the feature most likely came from Scottish dialects.", "explZh": "上南方地區的方言和蘇格蘭方言一樣強調「r」音，而該地區的殖民者大多有蘇格蘭血統，所以這個特徵最可能來自蘇格蘭方言。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Logical Completion: dialect similarity from Scottish settlement.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一種海岸植物的種子出現在兩座相隔數百公里海洋的島嶼上。基因分析顯示，這些島嶼族群在人類抵達任何一座島嶼的數千年前，就已與大陸族群分化；因此，研究人員得出結論：______", "opts": {"A": "the island populations were domesticated before mainland populations.", "B": "the plant probably reached the islands without human assistance.", "C": "human traders must have transported the seeds recently.", "D": "all island plants descended from a single cultivated variety."}, "optsZh": {"A": "島上族群比大陸族群更早被馴化。", "B": "這種植物大概是在沒有人類協助的情況下抵達這些島嶼的。", "C": "人類商人一定是最近才運送了這些種子。", "D": "島上所有植物都源自同一個栽培品種。"}, "answer": "B", "expl": "The divergence predates human arrival, so human transport is unlikely.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Logical Completion: dialect similarity from Scottish settlement.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A species of beetle is found both on a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=continental\" target=\"_blank\" rel=\"noopener\" data-w=\"continental\" data-pos=\"adj.\" data-en=\"relating to a continent\" data-zh=\"大陸的\">continental<\/a> coast and on a remote <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volcanic\" target=\"_blank\" rel=\"noopener\" data-w=\"volcanic\" data-pos=\"adj.\" data-en=\"relating to or produced by volcanoes\" data-zh=\"火山的\">volcanic<\/a> island. DNA evidence suggests that the island beetles split from the coastal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> long before people first sailed to the island, so the team inferred that ______", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。有一種甲蟲同時分布在大陸海岸和一座偏遠的火山島上。DNA 證據顯示，島上的甲蟲早在人類首次航行到該島之前，就已從海岸族群分化出來，因此研究團隊推論：______", "opts": {"A": "the island beetles must be younger than the coastal beetles.", "B": "humans carried the beetles to the island during early trade voyages.", "C": "the beetles were likely introduced by natural dispersal rather than by humans.", "D": "the beetles were domesticated by island communities."}, "optsZh": {"A": "島上的甲蟲一定比海岸的甲蟲年輕。", "B": "人類在早期的貿易航行中把甲蟲帶到了島上。", "C": "這些甲蟲很可能是經由自然擴散而非人類引入的。", "D": "這些甲蟲是被島上社群馴化的。"}, "answer": "C", "expl": "The timing rules out human introduction.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Logical Completion: dialect similarity from Scottish settlement.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migration\" target=\"_blank\" rel=\"noopener\" data-w=\"migration\" data-pos=\"n.\" data-en=\"movement from one place to another\" data-zh=\"遷移；移動\">migration<\/a>, but a comparison of related oral traditions suggests that the song&#x27;s core phrases developed before the migration occurred. The linguists therefore concluded that ______", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。語言學家曾提出，一首儀式歌曲是透過近期的移民傳入某個群島的，但比較相關的口述傳統後發現，這首歌的核心詞句在移民發生之前就已形成。因此，語言學家得出結論：______", "opts": {"A": "the migration must have begun earlier than any other human movement.", "B": "all versions of the song are identical.", "C": "the song could not have changed after the migration.", "D": "the song was probably not introduced to the archipelago by that migration."}, "optsZh": {"A": "這次移民一定比其他任何人類遷徙都更早開始。", "B": "這首歌的所有版本都一模一樣。", "C": "這首歌在移民之後不可能有所改變。", "D": "這首歌大概不是由那次移民引進群島的。"}, "answer": "D", "expl": "If the tradition predates the migration, that migration did not introduce it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Logical Completion: dialect similarity from Scottish settlement.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。研究某偏遠島嶼上一種作物的植物學家發現，島上的品種在人類定居該島的數萬年前，就已與大陸上的近親分化。這項證據使他們主張：______", "opts": {"A": "the island variety must be genetically identical to wild mainland plants.", "B": "human settlement probably did not account for the plant's original arrival on the island.", "C": "the crop was first domesticated on the island.", "D": "mainland farmers acquired the crop from island communities."}, "optsZh": {"A": "島上的品種一定與大陸的野生植物基因完全相同。", "B": "人類定居大概不是這種植物最初抵達該島的原因。", "C": "這種作物最早是在島上被馴化的。", "D": "大陸的農民是從島上社群取得這種作物的。"}, "answer": "B", "expl": "The plant's arrival predates human settlement.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Logical Completion: dialect similarity from Scottish settlement.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">populations<\/a> separated from one another long before boating began. The researchers therefore concluded that ______", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。研究人員原本以為，一種淡水螺是在人們開始在一連串湖泊之間移動船隻時抵達那些湖泊的。然而，基因資料顯示，各湖泊的族群早在划船活動開始之前就已彼此分離。因此，研究人員得出結論：______", "opts": {"A": "the snails likely spread through an earlier nonhuman mechanism.", "B": "human activity made the populations genetically identical.", "C": "the lakes did not contain snails until boating began.", "D": "boats probably explain every modern snail population."}, "optsZh": {"A": "這些螺很可能是透過更早的非人為機制擴散的。", "B": "人類活動使這些族群在基因上完全相同。", "C": "在划船活動開始之前，這些湖泊裡沒有螺。", "D": "船隻大概能解釋每一個現代螺類族群的由來。"}, "answer": "A", "expl": "Earlier divergence points to a nonhuman mechanism.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Standard English: finite verb after time phrase.", "vocab": false, "body": "How did whales, once no bigger than seals, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evolve\" target=\"_blank\" rel=\"noopener\" data-w=\"evolve\" data-pos=\"v.\" data-en=\"to change gradually over a long time\" data-zh=\"演化；逐步發展\">evolve<\/a> to become the largest animals on Earth? Brazilian <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologist<\/a> Mariana Nery believes the answer might be found in whales&#x27; DNA. In January 2023, Nery and her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> _______ a study showing changes over time in four whale genes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associated<\/a> with body size.", "bodyPlain": "How did whales, once no bigger than seals, evolve to become the largest animals on Earth? Brazilian biologist Mariana Nery believes the answer might be found in whales' DNA. In January 2023, Nery and her colleagues _______ a study showing changes over time in four whale genes associated with body size.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "鯨魚曾經不比海豹大，牠們是如何演化成地球上最大的動物的？巴西生物學家 Mariana Nery 認為答案可能藏在鯨魚的 DNA 中。2023 年 1 月，Nery 和她的同事 _______ 一項研究，顯示與體型相關的四個鯨魚基因隨時間發生的變化。", "opts": {"A": "published", "B": "publishing", "C": "having published", "D": "to publish"}, "optsZh": {"A": "published（過去式限定動詞，作為主要動詞：正確）", "B": "publishing（現在分詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "C": "having published（完成式分詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "D": "to publish（不定詞，非限定動詞 → 句子缺少主要動詞：錯誤）"}, "answer": "A", "expl": "The subject 'Nery and her colleagues' needs a finite main verb, and 'In January 2023' calls for the simple past 'published.'", "explZh": "主詞 Nery and her colleagues 需要一個限定的主要動詞，而 In January 2023 表示過去時間，所以用簡單過去式 published。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Standard English: finite verb after time phrase.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。2022 年，該研究團隊 ______ 一篇論文，描述一種新發現的酶，能幫助某些細菌在高度酸性的水中存活。", "opts": {"A": "to publish", "B": "having published", "C": "published", "D": "publishing"}, "optsZh": {"A": "to publish（不定詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "B": "having published（完成式分詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "C": "published（過去式限定動詞，作為主要動詞：正確）", "D": "publishing（現在分詞，非限定動詞 → 句子缺少主要動詞：錯誤）"}, "answer": "C", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Standard English: finite verb after time phrase.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來是裝飾品，但轉動把手時，______ 內部的針會撞擊細小的金屬齒片，奏出旋律。", "opts": {"A": "device--", "B": "device:", "C": "device,", "D": "device"}, "optsZh": {"A": "device--（破折號 → 不當分隔主詞與動詞：錯誤）", "B": "device:（冒號 → 不當分隔主詞與動詞：錯誤）", "C": "device,（逗號 → 不當分隔主詞與動詞：錯誤）", "D": "device（無標點，介系詞 inside the 的受詞直接接動詞 strike：正確）"}, "answer": "D", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Standard English: finite verb after time phrase.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當口袋型計算機首次出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會干擾算術學習。", "opts": {"A": "that", "B": "them", "C": "this", "D": "it"}, "optsZh": {"A": "that（那個，單數代名詞 → 與複數名詞不一致：錯誤）", "B": "them（它們，複數代名詞，指代複數名詞：正確）", "C": "this（這個，單數代名詞 → 與複數名詞不一致：錯誤）", "D": "it（它，單數代名詞 → 與複數名詞不一致：錯誤）"}, "answer": "B", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Standard English: finite verb after time phrase.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常帶領讀者認識拉丁美洲文學中的魔幻寫實。", "opts": {"A": "family, and", "B": "family", "C": "family and", "D": "family,"}, "optsZh": {"A": "family, and（逗號＋and）", "B": "family（無標點）", "C": "family and（無標點＋and）", "D": "family,（逗號，結束以 a family saga 開頭的同位語）"}, "answer": "B", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Standard English: finite verb after time phrase.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free. In part because", "B": "free in part because", "C": "free, in part because:", "D": "free, in part because,"}, "optsZh": {"A": "free. In part because（句號，以 In part because 另起一句）", "B": "free in part because（無標點，直接接原因子句）", "C": "free, in part because:（逗號＋in part because＋冒號）", "D": "free, in part because,（逗號＋in part because＋逗號）"}, "answer": "A", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English: no punctuation after direct object.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=harpsichord\" target=\"_blank\" rel=\"noopener\" data-w=\"harpsichord\" data-pos=\"n.\" data-en=\"a keyboard instrument, like an early piano, whose strings are plucked\" data-zh=\"大鍵琴\">harpsichord<\/a> may look just like a piano, but the difference between the two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> is easy to hear. When a harpsichord&#x27;s keys are pressed, the strings inside the _______ are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pluck\" target=\"_blank\" rel=\"noopener\" data-w=\"pluck\" data-pos=\"v.\" data-en=\"to pull a string with your fingers or a small tool\" data-zh=\"撥（弦）\">plucked<\/a>, not struck.", "bodyPlain": "A harpsichord may look just like a piano, but the difference between the two instruments is easy to hear. When a harpsichord's keys are pressed, the strings inside the _______ are plucked, not struck.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "大鍵琴看起來可能和鋼琴一模一樣，但兩種樂器的差別很容易聽得出來。按下大鍵琴的琴鍵時，_______ 內部的琴弦是被撥動的，而不是被敲擊的。", "opts": {"A": "instrument:", "B": "instrument", "C": "instrument--", "D": "instrument,"}, "optsZh": {"A": "instrument:（冒號 → 不當分隔主詞與動詞：錯誤）", "B": "instrument（無標點，介系詞 inside the 的受詞直接接動詞 are plucked：正確）", "C": "instrument--（破折號 → 不當分隔主詞與動詞：錯誤）", "D": "instrument,（逗號 → 不當分隔主詞與動詞：錯誤）"}, "answer": "B", "expl": "'the strings inside the instrument' is the subject of 'are plucked,' so no punctuation should separate 'instrument' from the verb.", "explZh": "the strings inside the instrument 是 are plucked 的主詞，主詞與動詞之間不應有任何標點，所以 instrument 後面不加標點。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English: no punctuation after direct object.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。2022 年，該研究團隊 ______ 一篇論文，描述一種新發現的酶，能幫助某些細菌在高度酸性的水中存活。", "opts": {"A": "to publish", "B": "having published", "C": "published", "D": "publishing"}, "optsZh": {"A": "to publish（不定詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "B": "having published（完成式分詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "C": "published（過去式限定動詞，作為主要動詞：正確）", "D": "publishing（現在分詞，非限定動詞 → 句子缺少主要動詞：錯誤）"}, "answer": "C", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English: no punctuation after direct object.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來是裝飾品，但轉動把手時，______ 內部的針會撞擊細小的金屬齒片，奏出旋律。", "opts": {"A": "device--", "B": "device,", "C": "device:", "D": "device"}, "optsZh": {"A": "device--（破折號 → 不當分隔主詞與動詞：錯誤）", "B": "device,（逗號 → 不當分隔主詞與動詞：錯誤）", "C": "device:（冒號 → 不當分隔主詞與動詞：錯誤）", "D": "device（無標點，介系詞 inside the 的受詞直接接動詞 strike：正確）"}, "answer": "D", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English: no punctuation after direct object.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當口袋型計算機首次出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會干擾算術學習。", "opts": {"A": "them", "B": "this", "C": "that", "D": "it"}, "optsZh": {"A": "them（它們，複數代名詞，指代複數名詞：正確）", "B": "this（這個，單數代名詞 → 與複數名詞不一致：錯誤）", "C": "that（那個，單數代名詞 → 與複數名詞不一致：錯誤）", "D": "it（它，單數代名詞 → 與複數名詞不一致：錯誤）"}, "answer": "A", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English: no punctuation after direct object.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常帶領讀者認識拉丁美洲文學中的魔幻寫實。", "opts": {"A": "family,", "B": "family", "C": "family, and", "D": "family and"}, "optsZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family（無標點）", "C": "family, and（逗號＋and）", "D": "family and（無標點＋and）"}, "answer": "B", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English: no punctuation after direct object.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free. In part because", "B": "free, in part because:", "C": "free in part because", "D": "free, in part because,"}, "optsZh": {"A": "free. In part because（句號，以 In part because 另起一句）", "B": "free, in part because:（逗號＋in part because＋冒號）", "C": "free in part because（無標點，直接接原因子句）", "D": "free, in part because,（逗號＋in part because＋逗號）"}, "answer": "A", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English: pronoun reference to plural forks.", "vocab": false, "body": "When they were first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=introduce\" target=\"_blank\" rel=\"noopener\" data-w=\"introduce\" data-pos=\"v.\" data-en=\"to present something to people for the first time\" data-zh=\"介紹\">introduced<\/a> to western Europe from Byzantium in the eleventh century, table forks were met with much <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resistance\" target=\"_blank\" rel=\"noopener\" data-w=\"resistance\" data-pos=\"n.\" data-en=\"a force that slows or opposes movement\" data-zh=\"阻力；抵抗\">resistance<\/a>. The Bishop of Ostia, St. Peter Damian, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condemn\" target=\"_blank\" rel=\"noopener\" data-w=\"condemn\" data-pos=\"v.\" data-en=\"to say strongly that something is wrong\" data-zh=\"譴責\">condemned<\/a> the eating <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=utensil\" target=\"_blank\" rel=\"noopener\" data-w=\"utensil\" data-pos=\"n.\" data-en=\"a tool used in the kitchen or for eating\" data-zh=\"器具；餐具\">utensils<\/a> because he considered _______ dangerous and unnecessary luxury items.", "bodyPlain": "When they were first introduced to western Europe from Byzantium in the eleventh century, table forks were met with much resistance. The Bishop of Ostia, St. Peter Damian, condemned the eating utensils because he considered _______ dangerous and unnecessary luxury items.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "十一世紀餐叉首次從拜占庭傳入西歐時，遭到了很大的抗拒。Ostia 主教聖彼得·達米安（St. Peter Damian）譴責這種餐具，因為他認為 _______ 是危險且不必要的奢侈品。", "opts": {"A": "them", "B": "this", "C": "that", "D": "it"}, "optsZh": {"A": "them（它們，複數代名詞，指代複數名詞：正確）", "B": "this（這個，單數代名詞 → 與複數名詞不一致：錯誤）", "C": "that（那個，單數代名詞 → 與複數名詞不一致：錯誤）", "D": "it（它，單數代名詞 → 與複數名詞不一致：錯誤）"}, "answer": "A", "expl": "The pronoun refers to the plural 'eating utensils' (table forks), so the plural pronoun 'them' is needed.", "explZh": "代名詞指的是複數的 eating utensils（餐叉），所以要用複數代名詞 them。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English: pronoun reference to plural forks.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。2022 年，該研究團隊 ______ 一篇論文，描述一種新發現的酶，能幫助某些細菌在高度酸性的水中存活。", "opts": {"A": "having published", "B": "publishing", "C": "published", "D": "to publish"}, "optsZh": {"A": "having published（完成式分詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "B": "publishing（現在分詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "C": "published（過去式限定動詞，作為主要動詞：正確）", "D": "to publish（不定詞，非限定動詞 → 句子缺少主要動詞：錯誤）"}, "answer": "C", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English: pronoun reference to plural forks.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來是裝飾品，但轉動把手時，______ 內部的針會撞擊細小的金屬齒片，奏出旋律。", "opts": {"A": "device:", "B": "device", "C": "device--", "D": "device,"}, "optsZh": {"A": "device:（冒號 → 不當分隔主詞與動詞：錯誤）", "B": "device（無標點，介系詞 inside the 的受詞直接接動詞 strike：正確）", "C": "device--（破折號 → 不當分隔主詞與動詞：錯誤）", "D": "device,（逗號 → 不當分隔主詞與動詞：錯誤）"}, "answer": "B", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English: pronoun reference to plural forks.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encoun
