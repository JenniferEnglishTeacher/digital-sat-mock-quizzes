re the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Because few letters from the expedition survived and later accounts contradict one another, the event has ______ status in the museum's official narrative.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。由於探險隊留下的信件很少，後來的記述又彼此矛盾，這起事件在博物館的官方敘事中只有 ______ 地位。", "opts": {"A": "a conspicuous", "B": "an uncertain", "C": "a celebrated", "D": "a secure"}, "optsZh": {"A": "a conspicuous（顯眼的；引人注目的）", "B": "an uncertain（不確定的；不穩固的）", "C": "a celebrated（著名的；備受讚揚的）", "D": "a secure（穩固的；安穩的）"}, "answer": "B", "expl": "Uncertain means weak or not firmly established.", "explZh": "", "defs": {"A": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice; standing out", "zh": "顯眼的；引人注目的", "word": "conspicuous"}, "B": {"w": "uncertain", "pos": "adj.", "en": "not sure or fixed; not clearly known", "zh": "不確定的；不穩固的", "word": "uncertain"}, "C": {"w": "celebrated", "pos": "adj.", "en": "famous and praised by many people", "zh": "著名的；備受讚揚的", "word": "celebrated"}, "D": {"w": "secure", "pos": "adj.", "en": "firm and not likely to be lost", "zh": "穩固的；安穩的", "word": "secure"}}}, {"id": "4.3", "label": "Mock 4.3", "n": 4, "concept": "Words in Context: tenuous place in memory.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The treaty has ______ role in popular memory, largely because the war that followed it drew much more attention from historians and the public.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The treaty has ______ role in popular memory, largely because the war that followed it drew much more attention from historians and the public.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這項條約在大眾記憶中只扮演 ______ 角色，主要是因為隨後發生的戰爭吸引了歷史學家和大眾更多的注意。", "opts": {"A": "a lasting", "B": "a celebrated", "C": "a fragile", "D": "a prominent"}, "optsZh": {"A": "a lasting（持久的）", "B": "a celebrated（著名的；備受讚揚的）", "C": "a fragile（脆弱的；不穩固的）", "D": "a prominent（顯著的；重要的）"}, "answer": "C", "expl": "Fragile means not secure or strong.", "explZh": "", "defs": {"A": {"w": "lasting", "pos": "adj.", "en": "continuing for a long time", "zh": "持久的", "word": "lasting"}, "B": {"w": "celebrated", "pos": "adj.", "en": "famous and praised by many people", "zh": "著名的；備受讚揚的", "word": "celebrated"}, "C": {"w": "fragile", "pos": "adj.", "en": "weak and easily damaged or lost", "zh": "脆弱的；不穩固的", "word": "fragile"}, "D": {"w": "prominent", "pos": "adj.", "en": "important and well known; easy to see", "zh": "顯著的；重要的", "word": "prominent"}}}, {"id": "4.4", "label": "Mock 4.4", "n": 4, "concept": "Words in Context: tenuous place in memory.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Although the scientist contributed to an important discovery, her reputation has ______ foothold in most textbooks, which focus instead on the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=laboratory\" target=\"_blank\" rel=\"noopener\" data-w=\"laboratory\" data-pos=\"n.\" data-en=\"a room or building for scientific experiments\" data-zh=\"實驗室\">laboratory<\/a>&#x27;s director.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Although the scientist contributed to an important discovery, her reputation has ______ foothold in most textbooks, which focus instead on the laboratory's director.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。雖然這位科學家對一項重要發現有所貢獻，她的聲譽在大多數教科書中只有 ______ 立足點，因為教科書都把焦點放在實驗室主任身上。", "opts": {"A": "a slight", "B": "an enduring", "C": "a disputed", "D": "a conspicuous"}, "optsZh": {"A": "a slight（輕微的；微小的）", "B": "an enduring（持久的；長存的）", "C": "a disputed（有爭議的；受質疑的）", "D": "a conspicuous（顯眼的；引人注目的）"}, "answer": "A", "expl": "Slight means limited or weak.", "explZh": "", "defs": {"A": {"w": "slight", "pos": "adj.", "en": "small in degree; not much", "zh": "輕微的；微小的", "word": "slight"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的；長存的", "word": "enduring"}, "C": {"w": "disputed", "pos": "adj.", "en": "argued about; not agreed on", "zh": "有爭議的；受質疑的", "word": "disputed"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice; standing out", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: tenuous place in memory.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The regional uprising has ______ presence in national history courses because it produced no major territorial change and was quickly eclipsed by a larger conflict.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The regional uprising has ______ presence in national history courses because it produced no major territorial change and was quickly eclipsed by a larger conflict.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。這場地區性起義在國家歷史課程中只有 ______ 存在感，因為它沒有造成重大的領土變化，而且很快就被一場更大的衝突掩蓋。", "opts": {"A": "a limited", "B": "a permanent", "C": "a controversial", "D": "a visible"}, "optsZh": {"A": "a limited（有限的）", "B": "a permanent（永久的）", "C": "a controversial（有爭議的）", "D": "a visible（明顯的；看得見的）"}, "answer": "A", "expl": "Limited means not strong or extensive.", "explZh": "", "defs": {"A": {"w": "limited", "pos": "adj.", "en": "small in amount or importance; restricted", "zh": "有限的", "word": "limited"}, "B": {"w": "permanent", "pos": "adj.", "en": "lasting forever or for a very long time", "zh": "永久的", "word": "permanent"}, "C": {"w": "controversial", "pos": "adj.", "en": "causing public disagreement", "zh": "有爭議的", "word": "controversial"}, "D": {"w": "visible", "pos": "adj.", "en": "able to be seen or noticed", "zh": "明顯的；看得見的", "word": "visible"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Words in Context: defend speculative claims.", "vocab": true, "body": "Claims about the original <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significance\" target=\"_blank\" rel=\"noopener\" data-w=\"significance\" data-pos=\"n.\" data-en=\"importance or meaning\" data-zh=\"重要性；意義\">significance<\/a> of Minoan bull-leaping rituals--depicted in paintings and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> from the second millennium BCE--are difficult to successfully _______. We know so little about the people <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> call the Minoans that assertions about what bull-leaping meant to them will almost inevitably rely on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> speculation and guesswork.", "bodyPlain": "Claims about the original significance of Minoan bull-leaping rituals--depicted in paintings and sculptures from the second millennium BCE--are difficult to successfully _______. We know so little about the people archaeologists call the Minoans that assertions about what bull-leaping meant to them will almost inevitably rely on significant speculation and guesswork.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "關於米諾斯鬥牛跳躍儀式原本意義的主張——這些儀式描繪於西元前第二千紀的繪畫與雕塑中——很難成功地 _______。我們對考古學家所稱的米諾斯人所知甚少，因此任何關於鬥牛跳躍對他們有何意義的說法，幾乎無可避免地要倚賴大量的推測和猜想。", "opts": {"A": "imagine", "B": "summarize", "C": "defend", "D": "adjust"}, "optsZh": {"A": "imagine（想像）", "B": "summarize（總結；概述）", "C": "defend（為……辯護；捍衛）", "D": "adjust（調整）"}, "answer": "C", "expl": "Since so little is known about the Minoans, claims about bull-leaping rely on speculation and are hard to support with evidence—hard to 'defend.'", "explZh": "由於我們對米諾斯人所知甚少，有關鬥牛跳躍的主張只能倚賴推測，很難用證據支持，也就是很難「defend」（為其辯護）。", "defs": {"A": {"pos": "v.", "en": "to form a picture or idea in your mind", "zh": "想像", "word": "imagine"}, "B": {"pos": "v.", "en": "to give a short statement of the main points", "zh": "總結；概述", "word": "summarize"}, "C": {"pos": "v.", "en": "to support an idea or claim with arguments or evidence", "zh": "為……辯護；捍衛", "word": "defend"}, "D": {"pos": "v.", "en": "to change something slightly to make it fit or work better", "zh": "調整", "word": "adjust"}}}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Words in Context: defend speculative claims.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The historian&#x27;s claim that the monument was used for royal ceremonies is difficult to ______ because no written records describe the site&#x27;s original purpose.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The historian's claim that the monument was used for royal ceremonies is difficult to ______ because no written records describe the site's original purpose.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。這位歷史學家主張這座紀念建築曾用於皇家典禮，但這個主張很難 ______，因為沒有任何書面紀錄描述該遺址原本的用途。", "opts": {"A": "defend", "B": "summarize", "C": "adjust", "D": "imagine"}, "optsZh": {"A": "defend（為……辯護；捍衛）", "B": "summarize（總結；概述）", "C": "adjust（調整）", "D": "imagine（想像）"}, "answer": "A", "expl": "Defend means support with evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to support an idea or claim with arguments or evidence", "zh": "為……辯護；捍衛", "word": "defend"}, "B": {"pos": "v.", "en": "to give a short statement of the main points", "zh": "總結；概述", "word": "summarize"}, "C": {"pos": "v.", "en": "to change something slightly to make it fit or work better", "zh": "調整", "word": "adjust"}, "D": {"pos": "v.", "en": "to form a picture or idea in your mind", "zh": "想像", "word": "imagine"}}}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Words in Context: defend speculative claims.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologist<\/a> could not fully ______ the theory that the vessel was ceremonial, since the same kind of vessel also appears in ordinary <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=household\" target=\"_blank\" rel=\"noopener\" data-w=\"household\" data-pos=\"n.\" data-en=\"all the people who live together in one home\" data-zh=\"家庭；家戶\">household<\/a> contexts.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The archaeologist could not fully ______ the theory that the vessel was ceremonial, since the same kind of vessel also appears in ordinary household contexts.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這位考古學家無法完全 ______ 該容器是儀式用品的理論，因為同類容器也出現在一般家庭的情境中。", "opts": {"A": "imagine", "B": "substantiate", "C": "condense", "D": "modify"}, "optsZh": {"A": "imagine（想像）", "B": "substantiate（證實；以證據支持）", "C": "condense（濃縮；精簡）", "D": "modify（修改）"}, "answer": "B", "expl": "Substantiate means support with evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to form a picture or idea in your mind", "zh": "想像", "word": "imagine"}, "B": {"pos": "v.", "en": "to prove a claim with evidence", "zh": "證實；以證據支持", "word": "substantiate"}, "C": {"pos": "v.", "en": "to make something shorter or more compact", "zh": "濃縮；精簡", "word": "condense"}, "D": {"pos": "v.", "en": "to change something slightly", "zh": "修改", "word": "modify"}}}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Words in Context: defend speculative claims.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Without more reliable dating evidence, the researchers found it hard to ______ the assertion that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> was abandoned because of drought.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Without more reliable dating evidence, the researchers found it hard to ______ the assertion that the settlement was abandoned because of drought.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。在缺乏更可靠的定年證據下，研究人員發現很難 ______「該聚落是因乾旱而遭廢棄」的說法。", "opts": {"A": "revise", "B": "summarize", "C": "decorate", "D": "justify"}, "optsZh": {"A": "revise（修改；修訂）", "B": "summarize（總結；概述）", "C": "decorate（裝飾）", "D": "justify（證明……有理；為……辯護）"}, "answer": "D", "expl": "Justify means defend or support.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to change something to improve or correct it", "zh": "修改；修訂", "word": "revise"}, "B": {"pos": "v.", "en": "to give a short statement of the main points", "zh": "總結；概述", "word": "summarize"}, "C": {"pos": "v.", "en": "to make something look more attractive by adding things to it", "zh": "裝飾", "word": "decorate"}, "D": {"pos": "v.", "en": "to show that something is reasonable or right", "zh": "證明……有理；為……辯護", "word": "justify"}}}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Words in Context: defend speculative claims.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The proposed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> of the symbols is difficult to ______, since similar marks appear in both religious and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercial<\/a> documents from the period.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The proposed interpretation of the symbols is difficult to ______, since similar marks appear in both religious and commercial documents from the period.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。對這些符號提出的詮釋很難 ______，因為同一時期的宗教文件和商業文件中都出現了類似的記號。", "opts": {"A": "imagine", "B": "adjust", "C": "support", "D": "summarize"}, "optsZh": {"A": "imagine（想像）", "B": "adjust（調整）", "C": "support（支持；證實）", "D": "summarize（總結；概述）"}, "answer": "C", "expl": "Support means defend with evidence.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to form a picture or idea in your mind", "zh": "想像", "word": "imagine"}, "B": {"pos": "v.", "en": "to change something slightly to make it fit or work better", "zh": "調整", "word": "adjust"}, "C": {"pos": "v.", "en": "to show that a claim is true or reasonable", "zh": "支持；證實", "word": "support"}, "D": {"pos": "v.", "en": "to give a short statement of the main points", "zh": "總結；概述", "word": "summarize"}}}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Words in Context: defend speculative claims.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Because the oral histories were recorded centuries after the event, scholars are cautious about trying to ______ specific claims about what actually occurred.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Because the oral histories were recorded centuries after the event, scholars are cautious about trying to ______ specific claims about what actually occurred.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。由於這些口述歷史是在事件發生幾個世紀後才被記錄下來，學者們在試圖 ______ 關於實際發生經過的具體說法時都相當謹慎。", "opts": {"A": "shorten", "B": "alter", "C": "validate", "D": "imagine"}, "optsZh": {"A": "shorten（縮短）", "B": "alter（改變；修改）", "C": "validate（證實；確認……有效）", "D": "imagine（想像）"}, "answer": "C", "expl": "Validate means show to be sound or defensible.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to make something shorter", "zh": "縮短", "word": "shorten"}, "B": {"pos": "v.", "en": "to change something", "zh": "改變；修改", "word": "alter"}, "C": {"pos": "v.", "en": "to prove that something is true or correct", "zh": "證實；確認……有效", "word": "validate"}, "D": {"pos": "v.", "en": "to form a picture or idea in your mind", "zh": "想像", "word": "imagine"}}}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Text Function: emphasize Harris's boasting.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Jerome K. Jerome&#x27;s 1889 novel Three Men in a Boat (To Say Nothing of the Dog). The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> is traveling by boat with Harris and another friend.<br><br>[Harris] told us <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=anecdote\" target=\"_blank\" rel=\"noopener\" data-w=\"anecdote\" data-pos=\"n.\" data-en=\"a short, interesting story about a real event\" data-zh=\"軼事；趣聞\">anecdotes<\/a> of how he had gone across the [English] Channel when it was so rough that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=passenger\" target=\"_blank\" rel=\"noopener\" data-w=\"passenger\" data-pos=\"n.\" data-en=\"a person traveling in a vehicle, ship, or plane who is not driving it\" data-zh=\"乘客\">passengers<\/a> had to be tied into their [beds], and he and the captain were the only two living souls on board who were not ill. Sometimes it was he and the second mate who were not ill; but it was generally he and one other man. <u>If not he and another man, then it was he by himself.<\/u>", "bodyPlain": "The following text is adapted from Jerome K. Jerome's 1889 novel Three Men in a Boat (To Say Nothing of the Dog). The narrator is traveling by boat with Harris and another friend.\n\n[Harris] told us anecdotes of how he had gone across the [English] Channel when it was so rough that the passengers had to be tied into their [beds], and he and the captain were the only two living souls on board who were not ill. Sometimes it was he and the second mate who were not ill; but it was generally he and one other man. If not he and another man, then it was he by himself.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "以下文字改編自 Jerome K.Jerome 1889 年的小說《Three Men in a Boat (To Say Nothing of the Dog)》。敘述者正和 Harris 及另一位朋友一起乘船旅行。\n〔Harris〕跟我們講了一些軼事，說他曾經在〔英吉利〕海峽風浪極大時渡海，大到乘客都得被綁在〔床鋪〕上，而全船只有他和船長兩個活人沒有暈船。有時候沒暈船的是他和大副；但通常是他和另外某一個人。如果不是他和另一個人，那就是只有他自己。", "opts": {"A": "It indicates the reason for Harris's eagerness to resume traveling.", "B": "It hints at Harris's feeling that during an earlier boat trip, others didn't include him in activities.", "C": "It emphasizes that Harris always boasts about his own constitution when speaking of a previous boat trip.", "D": "It reveals that although Harris claims to prefer solitary activities when traveling, he actually enjoys having company."}, "optsZh": {"A": "它說明 Harris 渴望再次旅行的原因。", "B": "它暗示 Harris 覺得在之前的一次乘船旅行中，其他人沒有讓他參與活動。", "C": "它強調 Harris 在談到之前的乘船旅行時，總是吹噓自己的體質。", "D": "它揭示 Harris 雖然聲稱旅行時喜歡獨自活動，其實很喜歡有人作伴。"}, "answer": "C", "expl": "Whatever the version, Harris is always one of the few who were not ill; the final sentence completes this pattern, showing that he always boasts about his own strong constitution.", "explZh": "不管故事版本怎麼變，Harris 永遠是少數沒暈船的人之一；畫線的最後一句完成了這個模式，顯示他總是在吹噓自己的好體質。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Text Function: emphasize Harris's boasting.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一篇科學文章首先說明，彗星每次接近太陽時，其表面都會發生變化。第二句指出，由於人們對彗星的內部結構仍然了解不足，研究人員無法準確預測這些變化。最後一句描述了一項研究，該研究測試雷達能否解決這個問題，但發現訊號無法穿透得夠深。", "opts": {"A": "It describes how other researchers criticized the work.", "B": "It offers evidence that radar is always reliable.", "C": "It identifies the uncertainty that motivated the study.", "D": "It states the study's final conclusion."}, "optsZh": {"A": "它描述其他研究人員如何批評這項研究。", "B": "它提供證據說明雷達總是可靠的。", "C": "它指出促成這項研究的不確定之處。", "D": "它陳述了研究的最終結論。"}, "answer": "C", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Text Function: emphasize Harris's boasting.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一篇考古文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句說明，這種交流所使用的路線至今仍不清楚，因為附近的道路幾乎沒有留下任何實體痕跡。接著文章討論一個團隊在陶器中尋找化學特徵，但只得出初步的結論。", "opts": {"A": "It summarizes the team's strongest result.", "B": "It contradicts the claim made in the first sentence.", "C": "It shifts the discussion away from archaeology.", "D": "It defines the problem the later investigation attempts to address."}, "optsZh": {"A": "它總結研究團隊最有力的結果。", "B": "它反駁第一句提出的主張。", "C": "它把討論從考古學轉移開來。", "D": "它界定了後續研究試圖解決的問題。"}, "answer": "D", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Text Function: emphasize Harris's boasting.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eliminate\" target=\"_blank\" rel=\"noopener\" data-w=\"eliminate\" data-pos=\"v.\" data-en=\"to remove or get rid of something completely\" data-zh=\"消除；排除\">eliminated<\/a> one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一篇生物文章指出，某種植物能夠在長期乾旱中存活。下一句說明，科學家仍不確定是哪一種細胞機制讓它得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It lists the materials used in the experiment.", "B": "It introduces a gap in knowledge that the experiment examines.", "C": "It gives a historical overview of plant classification.", "D": "It proves that drought has no effect on plants."}, "optsZh": {"A": "它列出實驗中使用的材料。", "B": "它引出實驗所要探討的知識缺口。", "C": "它提供植物分類的歷史概述。", "D": "它證明乾旱對植物沒有影響。"}, "answer": "B", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Text Function: emphasize Harris's boasting.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一篇文學分析開頭指出，一部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含了好幾個象徵禁錮的意象。段落其餘部分說明這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It raises a difficulty with a common interpretation.", "B": "It introduces an unrelated theme.", "C": "It provides biographical information about the novelist.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它提出一個常見詮釋的難處。", "B": "它引入一個不相關的主題。", "C": "它提供有關這位小說家的生平資料。", "D": "它概述這部小說的出版歷史。"}, "answer": "A", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Text Function: emphasize Harris's boasting.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。一篇科技文章首先說，自主水下載具能夠繪製海床地圖。下一句說明，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師為這些環境測試一套新的導航系統。", "opts": {"A": "It gives a personal anecdote about engineers.", "B": "It compares underwater vehicles with aircraft.", "C": "It explains the limitation that the new system is meant to address.", "D": "It announces that the technology is already flawless."}, "optsZh": {"A": "它講述一則關於工程師的個人軼事。", "B": "它把水下載具和飛機做比較。", "C": "它說明新系統要解決的限制。", "D": "它宣稱這項技術已經完美無缺。"}, "answer": "C", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o7", "label": "Original Q7", "n": 7, "concept": "Text Function: discrepancy between studies and events.", "vocab": false, "body": "<u>Several studies have found negligible electoral consequences for governments that impose fiscal austerity measures, yet some European governments recently suffered electorally due to their austerity programs.<\/u> Evelyne Huebscher and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=colleague\" target=\"_blank\" rel=\"noopener\" data-w=\"colleague\" data-pos=\"n.\" data-en=\"a person you work with\" data-zh=\"同事\">colleagues<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attribute<\/a> this incongruity to governments&#x27; <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tendency\" target=\"_blank\" rel=\"noopener\" data-w=\"tendency\" data-pos=\"n.\" data-en=\"a likelihood to behave or happen in a particular way\" data-zh=\"傾向\">tendency<\/a>--not followed in the recent European cases--to implement austerity programs <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=strategically\" target=\"_blank\" rel=\"noopener\" data-w=\"strategically\" data-pos=\"adv.\" data-en=\"in a way that is carefully planned to achieve a goal\" data-zh=\"策略性地\">strategically<\/a> to avoid electoral costs (e.g., setting spending cuts to take effect only after the next election), which has obscured the inherent political risks of austerity measures in the election data scholars have examined.", "bodyPlain": "Several studies have found negligible electoral consequences for governments that impose fiscal austerity measures, yet some European governments recently suffered electorally due to their austerity programs. Evelyne Huebscher and colleagues attribute this incongruity to governments' tendency--not followed in the recent European cases--to implement austerity programs strategically to avoid electoral costs (e.g., setting spending cuts to take effect only after the next election), which has obscured the inherent political risks of austerity measures in the election data scholars have examined.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "多項研究發現，實施財政緊縮措施的政府在選舉上受到的影響微不足道；然而，最近有些歐洲政府卻因為緊縮計畫而在選舉中失利。Evelyne Huebscher 與同事將這種不一致歸因於政府的一種傾向——而最近的歐洲案例並未遵循這種做法——也就是策略性地實施緊縮計畫以避免選舉代價（例如，把削減支出的生效時間安排在下次選舉之後），這掩蓋了學者所檢視之選舉資料中緊縮措施固有的政治風險。", "opts": {"A": "It explains a discrepancy between what has been observed in study settings and what has been observed in real-world settings that the text goes on to assert is attributable to the studies not using real-world data.", "B": "It identifies a conflict between research findings and recent events that the text goes on to suggest is a consequence of a complicating factor in the data used to generate those findings.", "C": "It presents a long-standing divergence in research findings that the text goes on to say is due to different groups of researchers using data that derive from different electoral circumstances.", "D": "It describes a recent exception to a general pattern in research findings that the text goes on to explain is a result of researchers underestimating the significance of inconsistencies in the data they've analyzed."}, "optsZh": {"A": "它說明研究情境中的觀察與真實世界中的觀察之間的差異，本文接著主張這是因為研究沒有使用真實世界的資料。", "B": "它指出研究結果與近期事件之間的衝突，本文接著暗示這是用來產生那些研究結果的資料中有一個複雜因素所造成的。", "C": "它提出研究結果之間長期存在的分歧，本文接著說這是因為不同研究團隊使用了來自不同選舉情境的資料。", "D": "它描述研究結果普遍模式中的一個近期例外，本文接著解釋這是研究人員低估了所分析資料中不一致之處的重要性所致。"}, "answer": "B", "expl": "The underlined sentence sets up a conflict between study findings (negligible electoral costs) and recent events (governments suffering electorally), which the next sentence attributes to strategic timing that obscured risks in the data.", "explZh": "畫線句提出研究結果（選舉影響微不足道）與近期事件（政府在選舉中失利）之間的衝突；下一句則把它歸因於政府策略性安排時機，掩蓋了資料中的風險。"}, {"id": "7.1", "label": "Mock 7.1", "n": 7, "concept": "Text Function: discrepancy between studies and events.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A science text first explains that a comet&#x27;s surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet&#x27;s interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A science text first explains that a comet's surface changes whenever it passes close to the Sun. The second sentence notes that researchers cannot predict those changes well because the comet's interior structure remains poorly understood. The final sentence describes a study that tested whether radar could solve the problem but found that the signal did not penetrate deeply enough.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一篇科學文章首先說明，彗星每次接近太陽時，其表面都會發生變化。第二句指出，由於人們對彗星的內部結構仍然了解不足，研究人員無法準確預測這些變化。最後一句描述了一項研究，該研究測試雷達能否解決這個問題，但發現訊號無法穿透得夠深。", "opts": {"A": "It states the study's final conclusion.", "B": "It identifies the uncertainty that motivated the study.", "C": "It offers evidence that radar is always reliable.", "D": "It describes how other researchers criticized the work."}, "optsZh": {"A": "它陳述了研究的最終結論。", "B": "它指出促成這項研究的不確定之處。", "C": "它提供證據說明雷達總是可靠的。", "D": "它描述其他研究人員如何批評這項研究。"}, "answer": "B", "expl": "The sentence presents the problem researchers tried to address.", "explZh": ""}, {"id": "7.2", "label": "Mock 7.2", "n": 7, "concept": "Text Function: discrepancy between studies and events.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. An archaeology passage begins by saying that a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusions<\/a>.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. An archaeology passage begins by saying that a settlement clearly traded with distant regions. The next sentence explains that the route used for this exchange is still unknown because nearby roads have left almost no physical trace. The passage then discusses a team that looked for chemical signatures in pottery but reached only tentative conclusions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一篇考古文章開頭說，某個聚落顯然曾與遙遠的地區進行貿易。下一句說明，這種交流所使用的路線至今仍不清楚，因為附近的道路幾乎沒有留下任何實體痕跡。接著文章討論一個團隊在陶器中尋找化學特徵，但只得出初步的結論。", "opts": {"A": "It summarizes the team's strongest result.", "B": "It contradicts the claim made in the first sentence.", "C": "It defines the problem the later investigation attempts to address.", "D": "It shifts the discussion away from archaeology."}, "optsZh": {"A": "它總結研究團隊最有力的結果。", "B": "它反駁第一句提出的主張。", "C": "它界定了後續研究試圖解決的問題。", "D": "它把討論從考古學轉移開來。"}, "answer": "C", "expl": "The sentence frames the central research question.", "explZh": ""}, {"id": "7.3", "label": "Mock 7.3", "n": 7, "concept": "Text Function: discrepancy between studies and events.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eliminate\" target=\"_blank\" rel=\"noopener\" data-w=\"eliminate\" data-pos=\"v.\" data-en=\"to remove or get rid of something completely\" data-zh=\"消除；排除\">eliminated<\/a> one possible mechanism.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A biology text states that a plant species can survive long droughts. The following sentence explains that scientists remain uncertain about which cellular mechanism allows this survival. The rest of the text describes an experiment that eliminated one possible mechanism.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一篇生物文章指出，某種植物能夠在長期乾旱中存活。下一句說明，科學家仍不確定是哪一種細胞機制讓它得以存活。文章其餘部分描述了一項排除了其中一種可能機制的實驗。", "opts": {"A": "It proves that drought has no effect on plants.", "B": "It gives a historical overview of plant classification.", "C": "It lists the materials used in the experiment.", "D": "It introduces a gap in knowledge that the experiment examines."}, "optsZh": {"A": "它證明乾旱對植物沒有影響。", "B": "它提供植物分類的歷史概述。", "C": "它列出實驗中使用的材料。", "D": "它引出實驗所要探討的知識缺口。"}, "answer": "D", "expl": "The sentence identifies an unresolved issue.", "explZh": ""}, {"id": "7.4", "label": "Mock 7.4", "n": 7, "concept": "Text Function: discrepancy between studies and events.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel&#x27;s ending has often been described as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=optimistic\" target=\"_blank\" rel=\"noopener\" data-w=\"optimistic\" data-pos=\"adj.\" data-en=\"expecting good things to happen\" data-zh=\"樂觀的\">optimistic<\/a>. The second sentence observes that this <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicate<\/a> earlier readings.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A literary analysis begins by noting that a novel's ending has often been described as optimistic. The second sentence observes that this interpretation is difficult to sustain because the final chapter contains several images of confinement. The rest of the paragraph explains how those images complicate earlier readings.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一篇文學分析開頭指出，一部小說的結局常被形容為樂觀的。第二句觀察到，這種詮釋難以成立，因為最後一章包含了好幾個象徵禁錮的意象。段落其餘部分說明這些意象如何使先前的解讀變得複雜。", "opts": {"A": "It introduces an unrelated theme.", "B": "It raises a difficulty with a common interpretation.", "C": "It provides biographical information about the novelist.", "D": "It summarizes the novel's publication history."}, "optsZh": {"A": "它引入一個不相關的主題。", "B": "它提出一個常見詮釋的難處。", "C": "它提供有關這位小說家的生平資料。", "D": "它概述這部小說的出版歷史。"}, "answer": "B", "expl": "The sentence challenges a prior view and sets up analysis.", "explZh": ""}, {"id": "7.5", "label": "Mock 7.5", "n": 7, "concept": "Text Function: discrepancy between studies and events.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technology<\/a> passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A technology passage first says that autonomous underwater vehicles can map the ocean floor. The next sentence explains that they often fail in narrow caves, where GPS signals are absent and currents are unpredictable. The final sentence describes engineers testing a new guidance system for those conditions.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫底線的句子在全文中的功能？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。一篇科技文章首先說，自主水下載具能夠繪製海床地圖。下一句說明，它們在狹窄的洞穴中經常失靈，因為那裡沒有 GPS 訊號，水流也難以預測。最後一句描述工程師為這些環境測試一套新的導航系統。", "opts": {"A": "It explains the limitation that the new system is meant to address.", "B": "It compares underwater vehicles with aircraft.", "C": "It gives a personal anecdote about engineers.", "D": "It announces that the technology is already flawless."}, "optsZh": {"A": "它說明新系統要解決的限制。", "B": "它把水下載具和飛機做比較。", "C": "它講述一則關於工程師的個人軼事。", "D": "它宣稱這項技術已經完美無缺。"}, "answer": "A", "expl": "The sentence identifies the practical limitation motivating the work.", "explZh": ""}, {"id": "o8", "label": "Original Q8", "n": 8, "concept": "Paired Texts: language role in graphic novels.", "vocab": false, "body": "Text 1<br>Graphic novels are increasingly popular in bookstores and libraries, but they shouldn&#x27;t be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classified\" target=\"_blank\" rel=\"noopener\" data-w=\"classified\" data-pos=\"v.\" data-en=\"arranged things into groups (past tense of classify)\" data-zh=\"分類（classify 的過去式／過去分詞）\">classified<\/a> as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>. By definition, literature tells a story or conveys meaning through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a> only; graphic novels tell stories through illustrations and use language only sparingly, in captions and dialogue. Graphic novels are experienced as series of images and not as language, making them more similar to film than to literature.<br><br>Text 2<br>Graphic novels present their stories through both language and images. Without captions and dialogue, readers would be unable to understand what is depicted in the illustrations: the story results from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interaction<\/a> of text and image. Moreover, Alison Bechdel&#x27;s Fun Home and many other graphic novels feature text that is as beautifully written as the prose found in many standard novels. Therefore, graphic novels qualify as literary texts.", "bodyPlain": "Text 1\nGraphic novels are increasingly popular in bookstores and libraries, but they shouldn't be classified as literature. By definition, literature tells a story or conveys meaning through language only; graphic novels tell stories through illustrations and use language only sparingly, in captions and dialogue. Graphic novels are experienced as series of images and not as language, making them more similar to film than to literature.\n\nText 2\nGraphic novels present their stories through both language and images. Without captions and dialogue, readers would be unable to understand what is depicted in the illustrations: the story results from the interaction of text and image. Moreover, Alison Bechdel's Fun Home and many other graphic novels feature text that is as beautifully written as the prose found in many standard novels. Therefore, graphic novels qualify as literary texts.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the overall argument presented in Text 1?", "stemZh": "根據這兩篇文本，文本 2 的作者最可能如何回應文本 1 的整體論點？", "bodyZh": "文本 1\n圖像小說在書店和圖書館越來越受歡迎，但它們不應該被歸類為文學。按照定義，文學只透過語言來講故事或傳達意義；圖像小說則透過插圖講故事，只在圖說和對白中少量使用語言。人們是以一連串圖像而非語言的方式來體驗圖像小說，這使它們更接近電影，而不是文學。\n文本 2\n圖像小說同時透過語言和圖像來呈現故事。少了圖說和對白，讀者將無法理解插圖所描繪的內容：故事是由文字與圖像之間的互動所產生的。此外，Alison Bechdel 的《Fun Home》以及許多其他圖像小說中的文字，寫得和許多一般小說中的散文一樣優美。因此，圖像小說符合文學作品的資格。", "opts": {"A": "By asserting that language plays a more important role in graphic novels than the author of Text 1 recognizes", "B": "By acknowledging that the author of Text 1 has identified a flaw that is common to all graphic novels", "C": "By suggesting that the story lines of certain graphic novels are more difficult to understand than the author of Text 1 claims", "D": "By agreeing with the author of Text 1 that most graphic novels aren't as well crafted as most literary works are"}, "optsZh": {"A": "主張語言在圖像小說中所扮演的角色比文本 1 作者所認為的更重要", "B": "承認文本 1 的作者指出了所有圖像小說共有的缺陷", "C": "暗示某些圖像小說的故事情節比文本 1 作者所說的更難理解", "D": "同意文本 1 作者的看法，認為大多數圖像小說的創作品質不如大多數文學作品"}, "answer": "A", "expl": "Text 1 says graphic novels use language only sparingly, but Text 2 argues the story depends on the interaction of text and image and that the writing can be excellent, so Text 2's author would say language matters more than Text 1 recognizes.", "explZh": "文本 1 認為圖像小說只少量使用語言；文本 2 則主張故事來自文字與圖像的互動，且文字可以寫得很優美，所以文本 2 作者會說語言的作用比文本 1 作者認為的更重要。"}, {"id": "8.1", "label": "Mock 8.1", "n": 8, "concept": "Paired Texts: language role in graphic novels.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/engl
