sZh": {"A": "family,（逗號，結束以 a family saga 開頭的同位語）", "B": "family（無標點）", "C": "family and（無標點＋and）", "D": "family, and（逗號＋and）"}, "answer": "B", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Standard English: plural subject with underlie.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free, in part because:", "B": "free, in part because,", "C": "free in part because", "D": "free. In part because"}, "optsZh": {"A": "free, in part because:（逗號＋in part because＋冒號）", "B": "free, in part because,（逗號＋in part because＋逗號）", "C": "free in part because（無標點，直接接原因子句）", "D": "free. In part because（句號，以 In part because 另起一句）"}, "answer": "D", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Standard English: modifier placement after proper noun.", "vocab": false, "body": "American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=abstract\" target=\"_blank\" rel=\"noopener\" data-w=\"abstract\" data-pos=\"adj.\" data-en=\"existing as an idea rather than a physical thing; (art) not showing real objects\" data-zh=\"抽象的\">abstract<\/a> artist Richard _______ his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> to make passersby keenly aware of how one&#x27;s movements are affected by the physical features of one&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, assembles large-scale steel plates into <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> that dominate the outdoor spaces they occupy.", "bodyPlain": "American abstract artist Richard _______ his installations to make passersby keenly aware of how one's movements are affected by the physical features of one's environment, assembles large-scale steel plates into sculptures that dominate the outdoor spaces they occupy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "美國抽象藝術家 Richard _______ 他的裝置作品要讓路人敏銳地意識到一個人的動作如何受到環境實體特徵的影響，他把大型鋼板組裝成雕塑，主宰了它們所在的戶外空間。", "opts": {"A": "Serra is intending", "B": "Serra, intends", "C": "Serra, intending", "D": "Serra intends"}, "optsZh": {"A": "Serra is intending（進行式限定動詞 → 句子出現兩個主要動詞：錯誤）", "B": "Serra, intends（逗號＋限定動詞 → 主詞與動詞間不當分隔，且出現兩個主要動詞：錯誤）", "C": "Serra, intending（逗號＋分詞片語，插入修飾 Serra，主要動詞為 assembles：正確）", "D": "Serra intends（無逗號，限定動詞 → 句子出現兩個主要動詞：錯誤）"}, "answer": "C", "expl": "The sentence's main verb is 'assembles,' so 'intending his installations…' must be a participial phrase set off by commas after 'Serra.'", "explZh": "句子的主要動詞是 assembles，所以 intending his installations… 必須是分詞片語，在 Serra 之後以逗號隔開作為插入語。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Standard English: modifier placement after proper noun.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。2022 年，該研究團隊 ______ 一篇論文，描述一種新發現的酶，能幫助某些細菌在高度酸性的水中存活。", "opts": {"A": "to publish", "B": "having published", "C": "published", "D": "publishing"}, "optsZh": {"A": "to publish（不定詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "B": "having published（完成式分詞，非限定動詞 → 句子缺少主要動詞：錯誤）", "C": "published（過去式限定動詞，作為主要動詞：正確）", "D": "publishing（現在分詞，非限定動詞 → 句子缺少主要動詞：錯誤）"}, "answer": "C", "expl": "A finite past-tense verb is needed after the time phrase.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Standard English: modifier placement after proper noun.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> a melody.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這個古董音樂盒看起來是裝飾品，但轉動把手時，______ 內部的針會撞擊細小的金屬齒片，奏出旋律。", "opts": {"A": "device", "B": "device--", "C": "device:", "D": "device,"}, "optsZh": {"A": "device（無標點，介系詞 inside the 的受詞直接接動詞 strike：正確）", "B": "device--（破折號 → 不當分隔主詞與動詞：錯誤）", "C": "device:（冒號 → 不當分隔主詞與動詞：錯誤）", "D": "device,（逗號 → 不當分隔主詞與動詞：錯誤）"}, "answer": "A", "expl": "No punctuation is needed between the noun and the verb phrase.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Standard English: modifier placement after proper noun.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。當口袋型計算機首次出現在教室時，有些老師拒絕使用這種裝置，因為他們認為 ______ 會干擾算術學習。", "opts": {"A": "that", "B": "it", "C": "this", "D": "them"}, "optsZh": {"A": "that（那個，單數代名詞 → 與複數名詞不一致：錯誤）", "B": "it（它，單數代名詞 → 與複數名詞不一致：錯誤）", "C": "this（這個，單數代名詞 → 與複數名詞不一致：錯誤）", "D": "them（它們，複數代名詞，指代複數名詞：正確）"}, "answer": "D", "expl": "Them correctly refers to the plural noun devices.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Standard English: modifier placement after proper noun.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Isabel Allende&#x27;s novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literature\" target=\"_blank\" rel=\"noopener\" data-w=\"literature\" data-pos=\"n.\" data-en=\"written works such as novels, poems, and plays\" data-zh=\"文學；文學作品\">literature<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。Isabel Allende 的小說《The House of the Spirits》是一部以 Trueba _______ 為中心的家族史詩，常常帶領讀者認識拉丁美洲文學中的魔幻寫實。", "opts": {"A": "family and", "B": "family, and", "C": "family,", "D": "family"}, "optsZh": {"A": "family and（無標點＋and）", "B": "family, and（逗號＋and）", "C": "family,（逗號，結束以 a family saga 開頭的同位語）", "D": "family（無標點）"}, "answer": "D", "expl": "No comma is needed before the verb when the phrase is restrictive.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Standard English: modifier placement after proper noun.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能完成本文，使其符合標準英文的規範？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。這艘受困的研究船花了三天才 _______ 它的船身卡在兩塊冰棚之間。", "opts": {"A": "free, in part because:", "B": "free. In part because", "C": "free, in part because,", "D": "free in part because"}, "optsZh": {"A": "free, in part because:（逗號＋in part because＋冒號）", "B": "free. In part because（句號，以 In part because 另起一句）", "C": "free, in part because,（逗號＋in part because＋逗號）", "D": "free in part because（無標點，直接接原因子句）"}, "answer": "B", "expl": "A sentence boundary is needed before the explanation.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Transitions: sequence in resurfacing process.", "vocab": false, "body": "In 1949, Frank Zamboni developed an ice rink <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resurface\" target=\"_blank\" rel=\"noopener\" data-w=\"resurface\" data-pos=\"v.\" data-en=\"to put a new surface on something\" data-zh=\"重鋪表面；整修表面\">resurfacing<\/a> machine. As Zamboni&#x27;s machine moved along the rink&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a>, it first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=scrape\" target=\"_blank\" rel=\"noopener\" data-w=\"scrape\" data-pos=\"v.\" data-en=\"to remove something by rubbing a hard edge across a surface\" data-zh=\"刮；刮除\">scraped<\/a> off the top layer of ice. _______ it sprayed water into the deep <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=groove\" target=\"_blank\" rel=\"noopener\" data-w=\"groove\" data-pos=\"n.\" data-en=\"a long, narrow cut in a surface\" data-zh=\"溝；凹槽\">grooves<\/a> left behind by customers&#x27; skates. Lastly, it smoothed over the newly formed ice.", "bodyPlain": "In 1949, Frank Zamboni developed an ice rink resurfacing machine. As Zamboni's machine moved along the rink's surface, it first scraped off the top layer of ice. _______ it sprayed water into the deep grooves left behind by customers' skates. Lastly, it smoothed over the newly formed ice.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "1949 年，Frank Zamboni 研發了一台冰場整冰機。當 Zamboni 的機器沿著冰面移動時，它首先刮掉最上層的冰。_______ 它把水噴進顧客的冰刀留下的深溝裡。最後，它把新形成的冰面抹平。", "opts": {"A": "For example,", "B": "Next,", "C": "Similarly,", "D": "In contrast,"}, "optsZh": {"A": "For example,（例如：舉例）", "B": "Next,（接下來：表步驟順序）", "C": "Similarly,（同樣地：表相似）", "D": "In contrast,（相反地：表對比）"}, "answer": "B", "expl": "The machine 'first' scraped the ice and 'lastly' smoothed it, so the middle step is introduced with 'Next.'", "explZh": "機器「首先」刮冰、「最後」把冰面抹平，所以中間的步驟要用 Next（接下來）引出。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Transitions: sequence in resurfacing process.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The restoration team first removed loose paint from the ceiling. ______ they applied a reversible adhesive to stabilize the remaining pigments.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The restoration team first removed loose paint from the ceiling. ______ they applied a reversible adhesive to stabilize the remaining pigments.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。修復團隊首先清除天花板上鬆脫的油漆。______ 他們塗上一種可逆的黏著劑來穩固剩餘的顏料。", "opts": {"A": "In contrast,", "B": "Next,", "C": "For example,", "D": "Similarly,"}, "optsZh": {"A": "In contrast,（相反地：表對比）", "B": "Next,（接下來：表步驟順序）", "C": "For example,（例如：舉例）", "D": "Similarly,（同樣地：表相似）"}, "answer": "B", "expl": "Next marks the second step in a sequence.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Transitions: sequence in resurfacing process.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The chef chilled the dough for two hours. ______ she rolled it thinly and cut it into narrow strips.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The chef chilled the dough for two hours. ______ she rolled it thinly and cut it into narrow strips.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。廚師把麵團冷藏了兩個小時。______ 她把麵團擀薄，切成細長條。", "opts": {"A": "Similarly,", "B": "Nevertheless,", "C": "For example,", "D": "Then,"}, "optsZh": {"A": "Similarly,（同樣地：表相似）", "B": "Nevertheless,（儘管如此：表讓步轉折）", "C": "For example,（例如：舉例）", "D": "Then,（然後：表步驟順序）"}, "answer": "D", "expl": "Then indicates the next step.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Transitions: sequence in resurfacing process.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The technician shut down the old server. ______ he transferred the data to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=replacement\" target=\"_blank\" rel=\"noopener\" data-w=\"replacement\" data-pos=\"n.\" data-en=\"a thing that takes the place of another\" data-zh=\"替代品\">replacement<\/a> system.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The technician shut down the old server. ______ he transferred the data to the replacement system.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。技術人員關閉了舊伺服器。______ 他把資料轉移到替換的系統上。", "opts": {"A": "Afterward,", "B": "By contrast,", "C": "Likewise,", "D": "For instance,"}, "optsZh": {"A": "Afterward,（之後：表時間順序）", "B": "By contrast,（相較之下：表對比）", "C": "Likewise,（同樣地：表相似）", "D": "For instance,（例如：舉例）"}, "answer": "A", "expl": "Afterward introduces the next action.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Transitions: sequence in resurfacing process.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The gardener loosened the soil around each seedling. ______ she watered the roots and covered the bed with straw.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The gardener loosened the soil around each seedling. ______ she watered the roots and covered the bed with straw.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。園丁鬆開每株幼苗周圍的土壤。______ 她為根部澆水，並用稻草覆蓋苗床。", "opts": {"A": "Next,", "B": "Instead,", "C": "Similarly,", "D": "For example,"}, "optsZh": {"A": "Next,（接下來：表步驟順序）", "B": "Instead,（反而、取而代之：表替代）", "C": "Similarly,（同樣地：表相似）", "D": "For example,（例如：舉例）"}, "answer": "A", "expl": "Next marks sequence.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Transitions: sequence in resurfacing process.", "vocab": false, "body": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographed<\/a> the wall before touching it. ______ they brushed away loose sand with soft tools.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologists photographed the wall before touching it. ______ they brushed away loose sand with soft tools.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。考古學家在碰觸牆面之前先拍了照。______ 他們用柔軟的工具刷掉鬆散的沙子。", "opts": {"A": "Likewise,", "B": "For example,", "C": "Subsequently,", "D": "In contrast,"}, "optsZh": {"A": "Likewise,（同樣地：表相似）", "B": "For example,（例如：舉例）", "C": "Subsequently,（隨後：表時間順序）", "D": "In contrast,（相反地：表對比）"}, "answer": "C", "expl": "Subsequently means later in sequence.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Transitions: later event.", "vocab": false, "body": "In 2014, Nestor Gomez won his first-ever <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=storytelling\" target=\"_blank\" rel=\"noopener\" data-w=\"storytelling\" data-pos=\"n.\" data-en=\"the activity of telling stories\" data-zh=\"說故事\">storytelling<\/a> competition, relating a tale about his life as a Guatemalan <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=immigrant\" target=\"_blank\" rel=\"noopener\" data-w=\"immigrant\" data-pos=\"n.\" data-en=\"a person who comes to live in a new country\" data-zh=\"移民\">immigrant<\/a> living in Chicago. _______ in 2017, Gomez created the show 80 Minutes Around the World as a platform for others to share <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=story\" target=\"_blank\" rel=\"noopener\" data-w=\"story\" data-pos=\"n.\" data-en=\"a description of events, real or imagined, told or written\" data-zh=\"故事；小說\">stories<\/a> about their immigration experiences.", "bodyPlain": "In 2014, Nestor Gomez won his first-ever storytelling competition, relating a tale about his life as a Guatemalan immigrant living in Chicago. _______ in 2017, Gomez created the show 80 Minutes Around the World as a platform for others to share stories about their immigration experiences.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "2014 年，Nestor Gomez 贏得了他人生第一場說故事比賽，講述了他作為瓜地馬拉移民在芝加哥生活的故事。_______ 在 2017 年，Gomez 創立了節目《80 Minutes Around the World》，作為讓其他人分享移民經驗故事的平台。", "opts": {"A": "Instead,", "B": "For example,", "C": "Later,", "D": "In other words,"}, "optsZh": {"A": "Instead,（反而、取而代之：表替代）", "B": "For example,（例如：舉例）", "C": "Later,（後來：表時間較晚）", "D": "In other words,（換句話說：表重述）"}, "answer": "C", "expl": "Winning the competition in 2014 is followed by creating the show in 2017, so 'Later' signals the later event.", "explZh": "2014 年贏得比賽之後，2017 年創立節目，所以用 Later（後來）表示時間上較晚發生的事。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Transitions: later event.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. In 2018, the poet read at a small community festival. ______ in 2021, she founded a citywide series that invited immigrants to share poems in multiple languages.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2018, the poet read at a small community festival. ______ in 2021, she founded a citywide series that invited immigrants to share poems in multiple languages.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。2018 年，這位詩人在一個小型社區節慶中朗讀詩作。______ 在 2021 年，她創辦了一個全市性的系列活動，邀請移民以多種語言分享詩作。", "opts": {"A": "Instead,", "B": "Later,", "C": "For example,", "D": "In other words,"}, "optsZh": {"A": "Instead,（反而、取而代之：表替代）", "B": "Later,（後來：表時間較晚）", "C": "For example,（例如：舉例）", "D": "In other words,（換句話說：表重述）"}, "answer": "B", "expl": "Later introduces a later event.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Transitions: later event.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. The engineer won a student design prize in 2015. ______ he created a nonprofit that helps rural schools build low-cost weather stations.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The engineer won a student design prize in 2015. ______ he created a nonprofit that helps rural schools build low-cost weather stations.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。這位工程師在 2015 年贏得一項學生設計獎。______ 他創立了一個非營利組織，幫助鄉村學校建造低成本的氣象站。", "opts": {"A": "Similarly,", "B": "For instance,", "C": "Afterward,", "D": "Rather,"}, "optsZh": {"A": "Similarly,（同樣地：表相似）", "B": "For instance,（例如：舉例）", "C": "Afterward,（之後：表時間順序）", "D": "Rather,（而是、更確切地說：表修正）"}, "answer": "C", "expl": "Afterward marks a later development.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Transitions: later event.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The singer performed at local cafes for several years. ______ in 2020, she released an album featuring musicians from her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a>.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The singer performed at local cafes for several years. ______ in 2020, she released an album featuring musicians from her neighborhood.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這位歌手在當地咖啡館演出了好幾年。______ 在 2020 年，她發行了一張專輯，由她鄰里的音樂人參與演出。", "opts": {"A": "Eventually,", "B": "In other words,", "C": "For example,", "D": "Instead,"}, "optsZh": {"A": "Eventually,（最後、終於：表一段時間之後）", "B": "In other words,（換句話說：表重述）", "C": "For example,（例如：舉例）", "D": "Instead,（反而、取而代之：表替代）"}, "answer": "A", "expl": "Eventually introduces a later outcome.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Transitions: later event.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The museum first displayed the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a> in a temporary hallway exhibit. ______ it acquired the full series for its permanent <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The museum first displayed the photographs in a temporary hallway exhibit. ______ it acquired the full series for its permanent collection.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。博物館最初在一個臨時的走廊展覽中展出這些照片。______ 它為永久館藏購入了整個系列。", "opts": {"A": "Later,", "B": "Instead,", "C": "For instance,", "D": "Likewise,"}, "optsZh": {"A": "Later,（後來：表時間較晚）", "B": "Instead,（反而、取而代之：表替代）", "C": "For instance,（例如：舉例）", "D": "Likewise,（同樣地：表相似）"}, "answer": "A", "expl": "Later marks time sequence.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Transitions: later event.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The students presented their prototype at a regional fair. ______ they launched an online workshop to teach other schools how to build it.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The students presented their prototype at a regional fair. ______ they launched an online workshop to teach other schools how to build it.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。學生們在一場地區性展覽中展示了他們的原型。______ 他們開設了一個線上工作坊，教其他學校如何製作。", "opts": {"A": "For example,", "B": "By contrast,", "C": "In other words,", "D": "Then,"}, "optsZh": {"A": "For example,（例如：舉例）", "B": "By contrast,（相較之下：表對比）", "C": "In other words,（換句話說：表重述）", "D": "Then,（然後：表步驟順序）"}, "answer": "D", "expl": "Then introduces a later action.", "explZh": ""}, {"id": "o28", "label": "Original Q28", "n": 28, "concept": "Transitions: reason for creating SI.", "vocab": false, "body": "To guarantee the validity of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experimental\" target=\"_blank\" rel=\"noopener\" data-w=\"experimental\" data-pos=\"adj.\" data-en=\"trying new ideas or methods\" data-zh=\"實驗性的\">experimental<\/a> results, scientists rely on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=precise\" target=\"_blank\" rel=\"noopener\" data-w=\"precise\" data-pos=\"adj.\" data-en=\"exact and accurate\" data-zh=\"精確的\">precise<\/a>, unchanging standards of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a>. _______ metrologists (scientists who study measurement) developed the SI, or International System of Units. The SI&#x27;s units of measurement are based on unchanging values in nature, such as the mass of an electron or the speed of light.", "bodyPlain": "To guarantee the validity of experimental results, scientists rely on precise, unchanging standards of measurement. _______ metrologists (scientists who study measurement) developed the SI, or International System of Units. The SI's units of measurement are based on unchanging values in nature, such as the mass of an electron or the speed of light.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "為了確保實驗結果的有效性，科學家依賴精確、不變的測量標準。_______ 計量學家（研究測量的科學家）制定了 SI，也就是國際單位制。SI 的測量單位是以自然界中不變的數值為基礎，例如電子的質量或光速。", "opts": {"A": "In contrast,", "B": "Regardless,", "C": "In addition,", "D": "For this reason,"}, "optsZh": {"A": "In contrast,（相反地：表對比）", "B": "Regardless,（無論如何：表不受前述影響）", "C": "In addition,（此外：表補充）", "D": "For this reason,（因為這個原因：表因果）"}, "answer": "D", "expl": "Scientists' need for precise, unchanging standards is the reason metrologists developed the SI, so 'For this reason' fits.", "explZh": "科學家需要精確、不變的測量標準，這正是計量學家制定 SI 的原因，所以用 For this reason（因為這個原因）。"}, {"id": "28.1", "label": "Mock 28.1", "n": 28, "concept": "Transitions: reason for creating SI.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant background, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Reliable comparisons require <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> that remain stable across laboratories. ______ chemists agreed on a common calibration standard.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Reliable comparisons require measurements that remain stable across laboratories. ______ chemists agreed on a common calibration standard.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。可靠的比較需要在各實驗室間保持穩定的測量。______ 化學家們議定了一套共同的校準標準。", "opts": {"A": "For this reason,", "B": "In contrast,", "C": "In addition,", "D": "Regardless,"}, "optsZh": {"A": "For this reason,（因為這個原因：表因果）", "B": "In contrast,（相反地：表對比）", "C": "In addition,（此外：表補充）", "D": "Regardless,（無論如何：表不受前述影響）"}, "answer": "A", "expl": "For this reason introduces the result of the need stated before.", "explZh": ""}, {"id": "28.2", "label": "Mock 28.2", "n": 28, "concept": "Transitions: reason for creating SI.", "vocab": false, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Astronomers needed a consistent way to report distances between stars. ______ they adopted the parsec as a standard unit in professional <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publication\" target=\"_blank\" rel=\"noopener\" data-w=\"publication\" data-pos=\"n.\" data-en=\"a book, magazine, or article that is printed; the act of publishing\" data-zh=\"出版品；發表\">publications<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Astronomers needed a consistent way to report distances between stars. ______ they adopted the parsec as a standard unit in professional publications.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。天文學家需要一種一致的方式來報告恆星之間的距離。______ 他們在專業刊物中採用秒差距作為標準單位。", "opts": {"A": "For example,", "B": "Similarly,", "C": "Therefore,", "D": "Nevertheless,"}, "optsZh": {"A": "For example,（例如：舉例）", "B": "Similarly,（同樣地：表相似）", "C": "Therefore,（因此：表結果）", "D": "Nevertheless,（儘管如此：表讓步轉折）"}, "answer": "C", "expl": "Therefore introduces the result.", "explZh": ""}, {"id": "28.3", "label": "Mock 28.3", "n": 28, "concept": "Transitions: reason for creating SI.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The survey results could be compared only if every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> used the same age categories. ______ the committee created a shared coding system.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The survey results could be compared only if every researcher used the same age categories. ______ the committee created a shared coding system.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。只有在每位研究人員都使用相同年齡分組時，調查結果才能相互比較。______ 委員會建立了一套共用的編碼系統。", "opts": {"A": "In contrast,", "B": "Regardless,", "C": "Additionally,", "D": "Consequently,"}, "optsZh": {"A": "In contrast,（相反地：表對比）", "B": "Regardless,（無論如何：表不受前述影響）", "C": "Additionally,（此外：表補充）", "D": "Consequently,（因此：表結果）"}, "answer": "D", "expl": "Consequently gives the effect of the need.", "explZh": ""}, {"id": "28.4", "label": "Mock 28.4", "n": 28, "concept": "Transitions: reason for creating SI.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Precise timekeeping is essential for coordinating satellites. ______ engineers use atomic clocks rather than ordinary mechanical clocks.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Precise timekeeping is essential for coordinating satellites. ______ engineers use atomic clocks rather than ordinary mechanical clocks.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。精確的計時對於協調衛星至關重要。______ 工程師使用原子鐘，而不是一般的機械鐘。", "opts": {"A": "For this reason,", "B": "Meanwhile,", "C": "However,", "D": "For example,"}, "optsZh": {"A": "For this reason,（因為這個原因：表因果）", "B": "Meanwhile,（同時：表同一時間）", "C": "However,（然而：表轉折）", "D": "For example,（例如：舉例）"}, "answer": "A", "expl": "For this reason links cause to action.", "explZh": ""}, {"id": "28.5", "label": "Mock 28.5", "n": 28, "concept": "Transitions: reason for creating SI.", "vocab": false, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Medical dosages must be calculated from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> that are consistent from one hospital to another. ______ health agencies publish standardized dosing guidelines.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Medical dosages must be calculated from measurements that are consistent from one hospital to another. ______ health agencies publish standardized dosing guidelines.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。藥物劑量必須根據在各醫院之間一致的測量值來計算。______ 衛生機關發布標準化的給藥指引。", "opts": {"A": "Nevertheless,", "B": "Accordingly,", "C": "For instance,", "D": "In contrast,"}, "optsZh": {"A": "Nevertheless,（儘管如此：表讓步轉折）", "B": "Accordingly,（因此、據此：表結果）", "C": "For instance,（例如：舉例）", "D": "In contrast,（相反地：表對比）"}, "answer": "B", "expl": "Accordingly means as a result.", "explZh": ""}, {"id": "o29", "label": "Original Q29", "n": 29, "concept": "Transitions: consequence of new understanding.", "vocab": false, "body": "In retrospect, one of the lessons of the 2003 Human Genome Project is that a gene is affected by many factors, not the least of which is its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a> with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=protein\" target=\"_blank\" rel=\"noopener\" data-w=\"protein\" data-pos=\"n.\" data-en=\"a substance in living things that is needed for growth\" data-zh=\"蛋白質\">protein<\/a> products of other genes. _______ rather than just focusing on the human genome, efforts to better understand gene mutations related to disease have begun to consider the human proteome, the complete set of proteins <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=express\" target=\"_blank\" rel=\"noopener\" data-w=\"express\" data-pos=\"v.\" data-en=\"to show a feeling or opinion in words or actions\" data-zh=\"表達\">expressed<\/a> by human genes.", "bodyPlain": "In retrospect, one of the lessons of the 2003 Human Genome Project is that a gene is affected by many factors, not the least of which is its interactions with the protein products of other genes. _______ rather than just focusing on the human genome, efforts to better understand gene mutations related to disease have begun to consider the human proteome, the complete set of proteins expressed by human genes.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "回顧起來，2003 年人類基因體計畫的教訓之一是：一個基因會受到許多因素影響，其中相當重要的一項是它與其他基因之蛋白質產物的交互作用。_______ 為了更了解與疾病相關的基因突變，相關研究不再只聚焦於人類基因體，而開始考慮人類蛋白質體，也就是人類基因所表現的全部蛋白質。", "opts": {"A": "In other words,", "B": "That said,", "C": "For example,", "D": "Accordingly,"}, "optsZh": {"A": "In other words,（換句話說：表重述）", "B": "That said,（話雖如此：表讓步轉折）", "C": "For example,（例如：舉例）", "D": "Accordingly,（因此、據此：表結果）"}, "answer": "D", "expl": "Because genes are affected by interactions with other genes' proteins, research has accordingly begun to consider the proteome; 'Accordingly' shows this consequence.", "explZh": "因為基因會受到與其他基因之蛋白質產物交互作用的影響，研究因此開始考慮蛋白質體；Accordingly（因此）表示這個結果。"}, {"id": "29.1", "label": "Mock 29.1", "n": 29, "concept": "Transitions: consequence of new understanding.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. Scientists now know that coral health depends partly on the microbes living in coral tissue. ______ studies of reef decline increasingly examine microbial communities as well as coral genetics.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Scientists now know that coral health depends partly on the microbes living in coral tissue. ______ studies of reef decline increasingly examine microbial communities as well as coral genetics.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項能以最合乎邏輯的轉折語完成本文？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。科學家現在知道，珊瑚的健康部分取決於生活在珊瑚組織中的微生物。______ 對珊瑚礁衰退的研究，除了珊瑚遺傳學之外，也越來越常檢視微生物群落。", "opts": {"A": "In other words,", "B": "Accordingly,", "C": "That said,", "D": "For example,"}, "optsZh": {"A": "In other words,（換句話說：表重述）", "B": "Accordingly,（因此、據此：表結果）", "C": "That said,（話雖如此：表讓步轉折）", "D": "For example,（例如：舉例）"}, "answer": "B", "expl": "Accordingly introduces a consequence.", "explZh": ""}, {"id": "29.2", "label": "Mock 29.2", "n": 29, "concept": "Transitions: consequence of new understanding.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" da
