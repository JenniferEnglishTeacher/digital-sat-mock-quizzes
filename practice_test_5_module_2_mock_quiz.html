ish-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這些文本，哪一個回應最有根據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而不是務實的政策制定者來看待。哪一段引文最能說明這個主張？", "opts": {"A": "'The administration faced economic challenges from the beginning.'", "B": "'The leader signed several decrees during his first month in office.'", "C": "'The leader's speeches are preserved in several archives.'", "D": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'"}, "optsZh": {"A": "「這個政府從一開始就面臨經濟挑戰。」", "B": "「這位領導人在上任第一個月內簽署了數項法令。」", "C": "「這位領導人的演說保存在數個檔案館中。」", "D": "「這位領導人在建國過程中的象徵性角色，比他政府短暫且起伏不定的施政紀錄更重要。」"}, "answer": "D", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "8.2", "label": "Mock 8.2", "n": 8, "concept": "Paired Texts: language role in graphic novels.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-pos=\"v.\" data-en=\"to show that a claim is true or reasonable\" data-zh=\"支持；證實\">support<\/a> a claim about regional crop patterns?", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to support a claim about regional crop patterns?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這些文本，哪一個回應最有根據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。一張圖表顯示，女性農民在南部地區的蔬菜種植者中佔 64%，但在北部與中部地區的穀物種植者中佔不到 35%。哪一項陳述最能運用圖表來支持有關地區作物模式的主張？", "opts": {"A": "Some farmers grew vegetables, while others grew grain.", "B": "The southern region was included in the survey.", "C": "Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "D": "The graph contains information about three regions."}, "optsZh": {"A": "有些農民種蔬菜，有些則種穀物。", "B": "南部地區有被納入調查。", "C": "女性在南部蔬菜種植者中佔多數，但在北部或中部的穀物種植者中則不然。", "D": "這張圖表包含三個地區的資訊。"}, "answer": "C", "expl": "The answer uses a specific contrast in the data.", "explZh": ""}, {"id": "8.3", "label": "Mock 8.3", "n": 8, "concept": "Paired Texts: language role in graphic novels.", "vocab": false, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這些文本，哪一個回應最有根據？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。天文學家主張，岩石行星所含的鐵絕不會比其母恆星多。哪一項發現最能直接削弱這個主張？", "opts": {"A": "Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "B": "Some stars contain hydrogen and helium.", "C": "The method used to study stars requires a telescope.", "D": "One rocky planet has a thin atmosphere."}, "optsZh": {"A": "研究發現有好幾顆岩石行星所含的鐵，比例遠高於它們所環繞的恆星。", "B": "有些恆星含有氫和氦。", "C": "研究恆星的方法需要用到望遠鏡。", "D": "有一顆岩石行星的大氣層很稀薄。"}, "answer": "A", "expl": "A planet with more iron than its host star contradicts the claim.", "explZh": ""}, {"id": "8.4", "label": "Mock 8.4", "n": 8, "concept": "Paired Texts: language role in graphic novels.", "vocab": false, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這些文本，哪一個回應最有根據？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一位民俗學家主張，某項傳統是透過近期的文化交流發展而成，而不只是從遙遠國家原封不動地引進。哪一項發現最能支持這個論點？", "opts": {"A": "Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "B": "Some songs use a meter also found in older European poetry.", "C": "Many performers learned songs from relatives.", "D": "The tradition is studied by scholars in several countries."}, "optsZh": {"A": "有幾首民謠包含了在地的歷史事件，以及在不同社群長期接觸後才出現的混合音樂形式。", "B": "有些歌曲使用的格律也見於較古老的歐洲詩歌。", "C": "許多表演者是從親戚那裡學會歌曲的。", "D": "有好幾個國家的學者在研究這項傳統。"}, "answer": "A", "expl": "Recent blended features support cultural exchange.", "explZh": ""}, {"id": "8.5", "label": "Mock 8.5", "n": 8, "concept": "Paired Texts: language role in graphic novels.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. A table shows that the number of trained <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=volunteer\" target=\"_blank\" rel=\"noopener\" data-w=\"volunteer\" data-pos=\"n.\" data-en=\"a person who does work without being paid\" data-zh=\"志工\">volunteers<\/a> rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?", "stem": "Based on the texts, which response is best supported?", "stemZh": "根據這些文本，哪一個回應最有根據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。一張表格顯示，在一項社區計畫開始後，受過訓練的志工人數從 18 人增加到 46 人，而在一個沒有該計畫的類似城鎮，人數則維持在 20 人左右。哪一項結論最有根據？", "opts": {"A": "The table includes more than one year.", "B": "The program was associated with a clear increase in trained volunteers compared with the town without the program.", "C": "Both towns had some volunteers.", "D": "The program took place in a community."}, "optsZh": {"A": "這張表格包含不只一年的資料。", "B": "與沒有該計畫的城鎮相比，這項計畫與受訓志工人數明顯增加有關。", "C": "兩個城鎮都有一些志工。", "D": "這項計畫在一個社區中進行。"}, "answer": "B", "expl": "The comparison supports the program's effect.", "explZh": ""}, {"id": "o9", "label": "Original Q9", "n": 9, "concept": "Reading Detail: observing street scene.", "vocab": false, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Ann Petry&#x27;s 1946 novel The Street. Lutie lives in an apartment in Harlem, New York.<br><br>The glow from the sunset was making the street radiant. The street is nice in this light, [Lutie] thought. It was swarming with children who were playing ball and darting back and forth across the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sidewalk\" target=\"_blank\" rel=\"noopener\" data-w=\"sidewalk\" data-pos=\"n.\" data-en=\"a paved path for walking beside a street\" data-zh=\"人行道\">sidewalk<\/a> in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> games of tag. Girls were skipping double dutch rope, going <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tireless\" target=\"_blank\" rel=\"noopener\" data-w=\"tireless\" data-pos=\"adj.\" data-en=\"never seeming to get tired\" data-zh=\"不知疲倦的\">tirelessly<\/a> through the exact center of a pair of ropes, jumping first on one foot and then the other.", "bodyPlain": "The following text is adapted from Ann Petry's 1946 novel The Street. Lutie lives in an apartment in Harlem, New York.\n\nThe glow from the sunset was making the street radiant. The street is nice in this light, [Lutie] thought. It was swarming with children who were playing ball and darting back and forth across the sidewalk in complicated games of tag. Girls were skipping double dutch rope, going tirelessly through the exact center of a pair of ropes, jumping first on one foot and then the other.", "stem": "Which choice best describes what is happening in the text?", "stemZh": "哪一個選項最能描述文中正在發生的事？", "bodyZh": "以下文字改編自 Ann Petry 1946 年的小說《The Street》。Lutie 住在紐約哈林區的一間公寓裡。\n夕陽的餘暉讓街道閃閃發光。在這種光線下，這條街很美，〔Lutie〕心想。街上擠滿了孩子，他們在玩球，在人行道上來回穿梭，玩著複雜的捉人遊戲。女孩們在跳雙繩，不知疲倦地從兩條繩子的正中央穿過，先用一隻腳跳，再換另一隻腳。", "opts": {"A": "Lutie is observing the appearance of the street at a particular time of day and the events occurring on it.", "B": "Lutie is annoyed by the noise of children playing games on her street.", "C": "Lutie is puzzled by the rules of certain children's games.", "D": "Lutie is spending time alone in her apartment because she doesn't want to interact with her neighbors."}, "optsZh": {"A": "Lutie 正在觀察街道在一天中某個特定時刻的樣貌，以及街上發生的事情。", "B": "Lutie 被在她街上玩遊戲的孩子們的吵鬧聲惹惱了。", "C": "Lutie 對某些兒童遊戲的規則感到困惑。", "D": "Lutie 獨自待在公寓裡，因為她不想和鄰居互動。"}, "answer": "A", "expl": "Lutie is looking at the street in the sunset glow and noticing the children playing ball, tag, and double dutch.", "explZh": "Lutie 在夕陽餘暉下看著街道，注意到孩子們在玩球、玩捉人遊戲和跳雙繩。"}, {"id": "9.1", "label": "Mock 9.1", "n": 9, "concept": "Reading Detail: observing street scene.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一部十九世紀小說描述一位年輕女子，她才十八歲，卻經常給年長的親戚建議，因為在其他人衝動反應時，她依然保持冷靜。敘述者強調她的感情是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She refuses to give advice to others.", "B": "She lacks affection for her family.", "C": "She is admired mainly for her wealth.", "D": "She shows unusual maturity and self-command."}, "optsZh": {"A": "她拒絕給別人建議。", "B": "她對家人缺乏感情。", "C": "她主要因為財富而受人欽佩。", "D": "她展現出不尋常的成熟與自制。"}, "answer": "D", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "9.2", "label": "Mock 9.2", "n": 9, "concept": "Reading Detail: observing street scene.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當祖母終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而不是強勢。", "opts": {"A": "The grandmother avoids family matters entirely.", "B": "The narrator thinks patience is useless.", "C": "The grandmother's influence is quiet but substantial.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "祖母完全避開家務事。", "B": "敘述者認為耐心沒有用。", "C": "祖母的影響力雖然低調，卻相當大。", "D": "家人忽視祖母的意見。"}, "answer": "C", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "9.3", "label": "Mock 9.3", "n": 9, "concept": "Reading Detail: observing street scene.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一個故事描述一名職員，他會注意到別人已經核准的帳簿中的細微錯誤。雖然同事有時覺得他的謹慎令人厭煩，敘述者說這家公司正是因為他的精確才得以存續。", "opts": {"A": "The coworkers are more accurate than the clerk.", "B": "The business fails because of excessive caution.", "C": "The clerk's carefulness is valuable despite being inconvenient.", "D": "The clerk intentionally creates errors."}, "optsZh": {"A": "同事們比這名職員更精確。", "B": "這家公司因為過度謹慎而失敗。", "C": "這名職員的細心雖然帶來不便，卻很有價值。", "D": "這名職員故意製造錯誤。"}, "answer": "C", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "9.4", "label": "Mock 9.4", "n": 9, "concept": "Reading Detail: observing street scene.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一段文字指出，一位村莊領袖在做決定之前會聆聽每一位發言者，即使答案似乎顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader makes decisions without hearing others.", "B": "The leader values inclusive deliberation.", "C": "The leader is unable to reach conclusions.", "D": "The leader dislikes public meetings."}, "optsZh": {"A": "這位領導人不聽取他人意見就做決定。", "B": "這位領導人重視包容各方意見的審議。", "C": "這位領導人無法得出結論。", "D": "這位領導人不喜歡公開會議。"}, "answer": "B", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "9.5", "label": "Mock 9.5", "n": 9, "concept": "Reading Detail: observing street scene.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。在一段節錄中，一位科學家被描述為對學生慷慨，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，但在每一項測量都經過檢查之前，她不會發表任何主張。", "opts": {"A": "She combines intellectual openness with rigorous standards.", "B": "She avoids working with students.", "C": "She publishes claims before testing them.", "D": "She rejects all imaginative thinking."}, "optsZh": {"A": "她兼具思想上的開放與嚴格的標準。", "B": "她避免與學生合作。", "C": "她在檢驗之前就發表主張。", "D": "她排斥一切富有想像力的思考。"}, "answer": "A", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o10", "label": "Original Q10", "n": 10, "concept": "Reading Detail: skepticism about Bosco Verticale plant survival.", "vocab": false, "body": "Since its completion in 2014, Bosco Verticale (Vertical Forest)--a pair of residential towers in Milan, Italy, covered by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a>--has become a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=striking\" target=\"_blank\" rel=\"noopener\" data-w=\"striking\" data-pos=\"adj.\" data-en=\"very noticeable or impressive\" data-zh=\"引人注目的；醒目的\">striking<\/a> symbol of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> sustainability in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=architecture\" target=\"_blank\" rel=\"noopener\" data-w=\"architecture\" data-pos=\"n.\" data-en=\"the design of buildings\" data-zh=\"建築\">architecture<\/a>. Stefano Boeri intended his design, which features balconies that are home to hundreds of trees, to serve as a model for promoting urban biodiversity. However, the concept has faced skepticism: critics note that although the trees used in Bosco Verticale were specifically cultivated for the project, it&#x27;s too early to tell if they can thrive in this unusual setting.", "bodyPlain": "Since its completion in 2014, Bosco Verticale (Vertical Forest)--a pair of residential towers in Milan, Italy, covered by vegetation--has become a striking symbol of environmental sustainability in architecture. Stefano Boeri intended his design, which features balconies that are home to hundreds of trees, to serve as a model for promoting urban biodiversity. However, the concept has faced skepticism: critics note that although the trees used in Bosco Verticale were specifically cultivated for the project, it's too early to tell if they can thrive in this unusual setting.", "stem": "According to the text, why are some critics skeptical of the concept behind Bosco Verticale?", "stemZh": "根據本文，為什麼有些批評者對 Bosco Verticale 背後的概念抱持懷疑？", "bodyZh": "自 2014 年完工以來，Bosco Verticale（垂直森林）——義大利米蘭一對覆蓋植物的住宅大樓——已成為建築環境永續的醒目象徵。Stefano Boeri 希望他的設計——其陽臺上種植了數百棵樹——能成為促進都市生物多樣性的典範。然而，這個概念也受到懷疑：批評者指出，雖然 Bosco Verticale 所用的樹木是專為此計畫培育的，但現在判斷它們能否在這種不尋常的環境中茁壯生長還言之過早。", "opts": {"A": "Some essential aspects of Bosco Verticale's design are difficult to adapt to locations other than Milan.", "B": "The plant life on Bosco Verticale ended up being less varied than Boeri had envisioned it would be.", "C": "The construction of Bosco Verticale was no less environmentally damaging than the construction of more conventional buildings is.", "D": "It is unclear whether Bosco Verticale can support the plant life included in its design."}, "optsZh": {"A": "Bosco Verticale 設計中的某些關鍵要素，很難套用到米蘭以外的地方。", "B": "Bosco Verticale 上的植物最後不如 Boeri 原本設想的那樣多樣。", "C": "Bosco Verticale 的建造對環境造成的破壞，並不比較傳統建築的建造來得少。", "D": "目前還不清楚 Bosco Verticale 能否維持其設計中所包含的植物生長。"}, "answer": "D", "expl": "Critics say it is too early to tell whether the trees can thrive in this unusual setting, so it is unclear whether the building can support its plant life.", "explZh": "批評者說現在判斷這些樹能否在這種不尋常的環境中茁壯還言之過早，所以還不清楚這棟建築能否維持其植物生長。"}, {"id": "10.1", "label": "Mock 10.1", "n": 10, "concept": "Reading Detail: skepticism about Bosco Verticale plant survival.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一部十九世紀小說描述一位年輕女子，她才十八歲，卻經常給年長的親戚建議，因為在其他人衝動反應時，她依然保持冷靜。敘述者強調她的感情是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She lacks affection for her family.", "B": "She shows unusual maturity and self-command.", "C": "She is admired mainly for her wealth.", "D": "She refuses to give advice to others."}, "optsZh": {"A": "她對家人缺乏感情。", "B": "她展現出不尋常的成熟與自制。", "C": "她主要因為財富而受人欽佩。", "D": "她拒絕給別人建議。"}, "answer": "B", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "10.2", "label": "Mock 10.2", "n": 10, "concept": "Reading Detail: skepticism about Bosco Verticale plant survival.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當祖母終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而不是強勢。", "opts": {"A": "The narrator thinks patience is useless.", "B": "The grandmother's influence is quiet but substantial.", "C": "The grandmother avoids family matters entirely.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "敘述者認為耐心沒有用。", "B": "祖母的影響力雖然低調，卻相當大。", "C": "祖母完全避開家務事。", "D": "家人忽視祖母的意見。"}, "answer": "B", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "10.3", "label": "Mock 10.3", "n": 10, "concept": "Reading Detail: skepticism about Bosco Verticale plant survival.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一個故事描述一名職員，他會注意到別人已經核准的帳簿中的細微錯誤。雖然同事有時覺得他的謹慎令人厭煩，敘述者說這家公司正是因為他的精確才得以存續。", "opts": {"A": "The clerk's carefulness is valuable despite being inconvenient.", "B": "The clerk intentionally creates errors.", "C": "The coworkers are more accurate than the clerk.", "D": "The business fails because of excessive caution."}, "optsZh": {"A": "這名職員的細心雖然帶來不便，卻很有價值。", "B": "這名職員故意製造錯誤。", "C": "同事們比這名職員更精確。", "D": "這家公司因為過度謹慎而失敗。"}, "answer": "A", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "10.4", "label": "Mock 10.4", "n": 10, "concept": "Reading Detail: skepticism about Bosco Verticale plant survival.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一段文字指出，一位村莊領袖在做決定之前會聆聽每一位發言者，即使答案似乎顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader is unable to reach conclusions.", "B": "The leader makes decisions without hearing others.", "C": "The leader dislikes public meetings.", "D": "The leader values inclusive deliberation."}, "optsZh": {"A": "這位領導人無法得出結論。", "B": "這位領導人不聽取他人意見就做決定。", "C": "這位領導人不喜歡公開會議。", "D": "這位領導人重視包容各方意見的審議。"}, "answer": "D", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "10.5", "label": "Mock 10.5", "n": 10, "concept": "Reading Detail: skepticism about Bosco Verticale plant survival.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。在一段節錄中，一位科學家被描述為對學生慷慨，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，但在每一項測量都經過檢查之前，她不會發表任何主張。", "opts": {"A": "She publishes claims before testing them.", "B": "She avoids working with students.", "C": "She combines intellectual openness with rigorous standards.", "D": "She rejects all imaginative thinking."}, "optsZh": {"A": "她在檢驗之前就發表主張。", "B": "她避免與學生合作。", "C": "她兼具思想上的開放與嚴格的標準。", "D": "她排斥一切富有想像力的思考。"}, "answer": "C", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o11", "label": "Original Q11", "n": 11, "concept": "Main Idea: Bakhtin says fabula and syuzhet are insufficient.", "vocab": false, "body": "Many literary theorists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between fabula, a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrative\" target=\"_blank\" rel=\"noopener\" data-w=\"narrative\" data-pos=\"n.\" data-en=\"a story or account of events\" data-zh=\"敘事；故事\">narrative<\/a>&#x27;s content, and syuzhet, a narrative&#x27;s arrangement and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=presentation\" target=\"_blank\" rel=\"noopener\" data-w=\"presentation\" data-pos=\"n.\" data-en=\"a talk that gives information to an audience\" data-zh=\"報告；簡報\">presentation<\/a> of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative--he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a> between the artist, the work, and the audience.", "bodyPlain": "Many literary theorists distinguish between fabula, a narrative's content, and syuzhet, a narrative's arrangement and presentation of events. In the film The Godfather Part II, the fabula is the story of the Corleone family, and the syuzhet is the presentation of the story as it alternates between two timelines in 1901 and 1958. But literary theorist Mikhail Bakhtin maintained that fabula and syuzhet are insufficient to completely describe a narrative--he held that systematic categorizations of artistic phenomena discount the subtle way in which meaning is created by interactions between the artist, the work, and the audience.", "stem": "Which choice best states the main idea of the text?", "stemZh": "哪一個選項最能陳述本文的主旨？", "bodyZh": "許多文學理論家區分 fabula（敘事的內容）與 syuzhet（敘事對事件的安排與呈現）。在電影《The Godfather Part II》中，fabula 是 Corleone 家族的故事，而 syuzhet 則是這個故事在 1901 年與 1958 年兩條時間線之間交替的呈現方式。但文學理論家 Mikhail Bakhtin 主張，fabula 和 syuzhet 不足以完整描述一個敘事——他認為，對藝術現象的系統化分類忽略了藝術家、作品與觀眾之間的互動如何微妙地創造出意義。", "opts": {"A": "Literary theorist Mikhail Bakhtin argued that there are important characteristics of narratives that are not fully encompassed by two concepts that other theorists have used to analyze narratives.", "B": "Literary theorist Mikhail Bakhtin claimed that meaning is not inherent in a narrative but is created when an audience encounters a narrative so that narratives are interpreted differently by different people.", "C": "The storytelling methods used in The Godfather Part II may seem unusually complicated, but they can be easily understood when two concepts from literary theory are utilized.", "D": "Narratives that are told out of chronological order are more difficult for audiences to understand than are narratives presented chronologically."}, "optsZh": {"A": "文學理論家 Mikhail Bakhtin 主張，敘事中有一些重要特徵，無法被其他理論家用來分析敘事的兩個概念完全涵蓋。", "B": "文學理論家 Mikhail Bakhtin 宣稱，意義並非敘事本身固有，而是在觀眾接觸敘事時產生的，因此不同的人對敘事會有不同的詮釋。", "C": "《The Godfather Part II》所使用的敘事手法或許看似異常複雜，但只要運用文學理論中的兩個概念，就能輕鬆理解。", "D": "不按時間順序講述的敘事，比按時間順序呈現的敘事更難讓觀眾理解。"}, "answer": "A", "expl": "Bakhtin held that fabula and syuzhet, two concepts other theorists use, are insufficient to completely describe a narrative because they miss how meaning arises from interactions.", "explZh": "Bakhtin 認為其他理論家使用的 fabula 和 syuzhet 這兩個概念，不足以完整描述敘事，因為它們忽略了意義如何從互動中產生。"}, {"id": "11.1", "label": "Mock 11.1", "n": 11, "concept": "Main Idea: Bakhtin says fabula and syuzhet are insufficient.", "vocab": false, "body": "A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "bodyPlain": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A nineteenth-century novel describes a young woman who is only eighteen but regularly advises older relatives because she remains calm when others react impulsively. The narrator stresses that her affection is sincere, yet she can restrain her emotions when judgment is needed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一部十九世紀小說描述一位年輕女子，她才十八歲，卻經常給年長的親戚建議，因為在其他人衝動反應時，她依然保持冷靜。敘述者強調她的感情是真誠的，但在需要判斷力的時候，她能克制自己的情緒。", "opts": {"A": "She refuses to give advice to others.", "B": "She lacks affection for her family.", "C": "She is admired mainly for her wealth.", "D": "She shows unusual maturity and self-command."}, "optsZh": {"A": "她拒絕給別人建議。", "B": "她對家人缺乏感情。", "C": "她主要因為財富而受人欽佩。", "D": "她展現出不尋常的成熟與自制。"}, "answer": "D", "expl": "The text emphasizes judgment, calmness, and emotional control.", "explZh": ""}, {"id": "11.2", "label": "Mock 11.2", "n": 11, "concept": "Main Idea: Bakhtin says fabula and syuzhet are insufficient.", "vocab": false, "body": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> explains that the grandmother&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a> comes from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=patience\" target=\"_blank\" rel=\"noopener\" data-w=\"patience\" data-pos=\"n.\" data-en=\"the ability to wait or accept problems calmly\" data-zh=\"耐心\">patience<\/a> rather than force.", "bodyPlain": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. In a memoir, a child observes that her grandmother rarely speaks during family disputes, but when she finally offers a suggestion, everyone in the room accepts it. The narrator explains that the grandmother's authority comes from patience rather than force.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。在一本回憶錄中，一個孩子觀察到她的祖母在家庭爭執時很少說話，但當祖母終於提出建議時，房間裡的每個人都會接受。敘述者解釋，祖母的權威來自耐心，而不是強勢。", "opts": {"A": "The narrator thinks patience is useless.", "B": "The grandmother avoids family matters entirely.", "C": "The grandmother's influence is quiet but substantial.", "D": "The family ignores the grandmother's opinions."}, "optsZh": {"A": "敘述者認為耐心沒有用。", "B": "祖母完全避開家務事。", "C": "祖母的影響力雖然低調，卻相當大。", "D": "家人忽視祖母的意見。"}, "answer": "C", "expl": "The family respects her careful judgment.", "explZh": ""}, {"id": "11.3", "label": "Mock 11.3", "n": 11, "concept": "Main Idea: Bakhtin says fabula and syuzhet are insufficient.", "vocab": false, "body": "A museum catalog presents an artist, object, or performance in relation to the social and technical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> that shaped it. Instead of merely naming the work, the catalog connects materials, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=audience\" target=\"_blank\" rel=\"noopener\" data-w=\"audience\" data-pos=\"n.\" data-en=\"the people who read, watch, or listen to something\" data-zh=\"讀者；觀眾\">audience<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "bodyPlain": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. A story describes a clerk who notices tiny errors in ledgers that others have already approved. Although his coworkers sometimes find his caution irritating, the narrator says that the business survives because of his exactness.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。一個故事描述一名職員，他會注意到別人已經核准的帳簿中的細微錯誤。雖然同事有時覺得他的謹慎令人厭煩，敘述者說這家公司正是因為他的精確才得以存續。", "opts": {"A": "The clerk intentionally creates errors.", "B": "The clerk's carefulness is valuable despite being inconvenient.", "C": "The business fails because of excessive caution.", "D": "The coworkers are more accurate than the clerk."}, "optsZh": {"A": "這名職員故意製造錯誤。", "B": "這名職員的細心雖然帶來不便，卻很有價值。", "C": "這家公司因為過度謹慎而失敗。", "D": "同事們比這名職員更精確。"}, "answer": "B", "expl": "The passage praises his precision.", "explZh": ""}, {"id": "11.4", "label": "Mock 11.4", "n": 11, "concept": "Main Idea: Bakhtin says fabula and syuzhet are insufficient.", "vocab": false, "body": "A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "bodyPlain": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A passage states that a village leader listens to every speaker before making decisions, even when the answer seems obvious. The narrator suggests that this habit slows meetings but prevents resentment among people who might otherwise feel dismissed.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。一段文字指出，一位村莊領袖在做決定之前會聆聽每一位發言者，即使答案似乎顯而易見。敘述者暗示，這個習慣雖然拖慢了會議，卻能避免那些原本可能覺得被忽視的人心生怨恨。", "opts": {"A": "The leader values inclusive deliberation.", "B": "The leader dislikes public meetings.", "C": "The leader makes decisions without hearing others.", "D": "The leader is unable to reach conclusions."}, "optsZh": {"A": "這位領導人重視包容各方意見的審議。", "B": "這位領導人不喜歡公開會議。", "C": "這位領導人不聽取他人意見就做決定。", "D": "這位領導人無法得出結論。"}, "answer": "A", "expl": "The evidence shows patience and inclusion.", "explZh": ""}, {"id": "11.5", "label": "Mock 11.5", "n": 11, "concept": "Main Idea: Bakhtin says fabula and syuzhet are insufficient.", "vocab": false, "body": "In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurement<\/a> has been checked.", "bodyPlain": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. In an excerpt, a scientist is described as generous with students but uncompromising about evidence. She encourages speculation in early discussions, yet she will not publish a claim until every measurement has been checked.", "stem": "According to the text, which choice is best supported?", "stemZh": "根據本文，哪一個選項最有根據？", "bodyZh": "在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。在一段節錄中，一位科學家被描述為對學生慷慨，但對證據毫不妥協。她在早期討論中鼓勵大膽推測，但在每一項測量都經過檢查之前，她不會發表任何主張。", "opts": {"A": "She rejects all imaginative thinking.", "B": "She publishes claims before testing them.", "C": "She avoids working with students.", "D": "She combines intellectual openness with rigorous standards."}, "optsZh": {"A": "她排斥一切富有想像力的思考。", "B": "她在檢驗之前就發表主張。", "C": "她避免與學生合作。", "D": "她兼具思想上的開放與嚴格的標準。"}, "answer": "D", "expl": "The contrast shows openness and rigor.", "explZh": ""}, {"id": "o12", "label": "Original Q12", "n": 12, "concept": "Quantitative Evidence: medicine and health highest in 2019.", "vocab": false, "body": "Total Science Research <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=submission\" target=\"_blank\" rel=\"noopener\" data-w=\"submission\" data-pos=\"n.\" data-en=\"something sent in to be judged or considered\" data-zh=\"提交的作品；投稿\">Submissions<\/a> by Topic, 2016-2019<br><br>A student is researching the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=trend\" target=\"_blank\" rel=\"noopener\" data-w=\"trend\" data-pos=\"n.\" data-en=\"a general direction in which something is changing\" data-zh=\"趨勢\">trends<\/a> in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topics<\/a> submitted to a national science fair for high school students. The graph shows the number of submissions by topic that were made each year. Based on the data in the graph, the student <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claims<\/a> that <u>there were more medicine and health research topics submitted in 2019 than in any other year<\/u>.", "bodyPlain": "Total Science Research Submissions by Topic, 2016-2019\n\nA student is researching the trends in the topics submitted to a national science fair for high school students. The graph shows the number of submissions by topic that were made each year. Based on the data in the graph, the student claims that there were more medicine and health research topics submitted in 2019 than in any other year.", "stem": "Which choice most effectively uses data from the graph to support the underlined claim?", "stemZh": "哪一個選項最能有效運用圖表數據來支持畫底線的主張？", "bodyZh": "2016–2019 年各主題的科學研究投稿總數\n一名學生正在研究某全國高中科展投稿主題的趨勢。圖表顯示每年各主題的投稿數量。根據圖表中的數據，這名學生主張 2019 年醫學與健康類的研究主題投稿數量比其他任何一年都多。", "opts": {"A": "In 2016, the number of cellular and molecular biology topic submissions was the same as the number of animal science topic submissions.", "B": "In 2019, there were more physics and space science topic submissions than there were medicine and health topic submissions.", "C": "The lowest number of animal science topic submissions in a year was approximately 95 in 2016.", "D": "The highest number of medicine and health topic submissions during the period shown is approximately 285 in 2019."}, "optsZh": {"A": "2016 年，細胞與分子生物學類主題的投稿數量與動物科學類主題的投稿數量相同。", "B": "2019 年，物理與太空科學類主題的投稿數量多於醫學與健康類主題的投稿數量。", "C": "動物科學類主題投稿數量最低的一年是 2016 年，約為 95 件。", "D": "在所示期間內，醫學與健康類主題投稿數量最高的一年是 2019 年，約為 285 件。"}, "answer": "D", "expl": "The claim is that 2019 had more medicine and health submissions than any other year; stating that the highest number for that topic occurred in 2019 directly supports it.", "explZh": "主張是 2019 年醫學與健康類的投稿比其他任何一年都多；指出該主題投稿數量最高的一年是 2019 年，直接支持了這個主張。"}, {"id": "12.1", "label": "Mock 12.1", "n": 12, "concept": "Quantitative Evidence: medicine and health highest in 2019.", "vocab": false, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?", "stem": "Which choice most effectively uses evidence from the text, graph, quotation, or study?", "stemZh": "哪一個選項最能有效運用文本、圖表、引文或研究中的證據？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。一名學生主張，某位歷史學家把一位革命領袖更多地當作國家象徵，而不是務實的政策制定者來看待。哪一段引文最能說明這個主張？", "opts": {"A": "'The leader signed several decrees during his first month in office.'", "B": "'The leader's speeches are preserved in several archives.'", "C": "'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'", "D": "'The administration faced economic challenges from the beginning.'"}, "optsZh": {"A": "「這位領導人在上任第一個月內簽署了數項法令。」", "B": "「這位領導人的演說保存在數個檔案館中。」", "C": "「這位領導人在建國過程中的象徵性角色，比他政府短暫且起伏不定的施政紀錄更重要。」", "D": "「這個政府從一開始就面臨經濟挑戰。」"}, "answer": "C", "expl": "The quotation emphasizes symbolism over concrete actions.", "explZh": ""}, {"id": "12.2", "label": "Mock 12.2", "n": 12, "concept": "Quantitative Evidence: medicine and health highest in 2019.", "vocab": false, "body": "In a university <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a>, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% of grain growers in the northern and central regions. Which statement best uses the graph to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=support\" target=\"_blank\" rel=\"noopener\" data-w=\"support\" data-
