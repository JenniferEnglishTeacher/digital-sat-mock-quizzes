rs grew grain.\nD) Women formed a majority of southern vegetable growers but not of northern or central grain growers.", "answer": "D", "explanation": "The answer uses a specific contrast in the data."}, {"id": "14.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Astronomers claim that rocky planets never contain more iron than their host stars. Which finding would most directly weaken the claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Some stars contain hydrogen and helium.\nB) One rocky planet has a thin atmosphere.\nC) The method used to study stars requires a telescope.\nD) Several rocky planets are found to contain a substantially higher proportion of iron than the stars they orbit.", "answer": "D", "explanation": "A planet with more iron than its host star contradicts the claim."}, {"id": "14.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nC) The tradition is studied by scholars in several countries.\nD) Many performers learned songs from relatives.", "answer": "B", "explanation": "Recent blended features support cultural exchange."}, {"id": "14.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nB) Both towns had some volunteers.\nC) The program took place in a community.\nD) The table includes more than one year.", "answer": "A", "explanation": "The comparison supports the program's effect."}]}, {"n": 15, "concept": "Command of Evidence: quotation showing ambivalence.", "original": "\"Poetry\" is a 1919 poem by Marianne Moore. The poem highlights an ambivalence toward poetry as the speaker acknowledges its merits while also expressing a sense of displeasure, writing _______\n\nWhich quotation from \"Poetry\" most effectively illustrates the claim?\nA) \"nor is it valid / to discriminate against 'business documents and / school-books'; all these phenomena are important.\"\nB) \"One must make a distinction / however: when dragged into prominence by half poets, the result is not / poetry\"\nC) \"when [poems] become so derivative as to become unintelligible, the / same thing may be said for all of us--that we / do not admire what / we cannot understand.\"\nD) \"Reading [poetry], however, with a perfect contempt for it, one discovers that there is in / it after all, a place for the genuine.\"", "generated": [{"id": "15.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The leader signed several decrees during his first month in office.'\nB) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nC) 'The leader's speeches are preserved in several archives.'\nD) 'The administration faced economic challenges from the beginning.'", "answer": "B", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "15.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the sou itions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The tradition is studied by scholars in several countries.\nB) Many performers learned songs from relatives.\nC) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.\nD) Some songs use a meter also found in older European poetry.", "answer": "C", "explanation": "Recent blended features support cultural exchange."}, {"id": "15.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The table includes more than one year.\nB) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nC) The program took place in a community.\nD) Both towns had some volunteers.", "answer": "B", "explanation": "The comparison supports the program's effect."}]}, {"n": 16, "concept": "Quantitative Evidence: irrigation output sensitive to baseline precipitation.", "original": "Simulated Change in Annual Aquifer Input and Irrigation Output if Precipitation Concentration Increases as Climate Models Predict\n\nIf baseline precipitation is currently somewhat concentrated: water entering aquifers increases 4.9%; surface water used for irrigation increases 0.4%; groundwater used for irrigation increases 0.9%.\nIf baseline precipitation is currently evenly distributed: water entering aquifers increases 11.0%; surface water used for irrigation increases 9.0%; groundwater used for irrigation increases 7.9%.\n\nSome climate models for the western United States predict that while total annual precipitation may remain unchanged from the present level, precipitation will become concentrated into fewer but more intense rain and snow events. University of Texas climate scientist Geeta Persad and her colleagues simulated how the amount of water entering aquifers and the amount being used for irrigation purposes would change if this were to occur. Persad and her colleagues concluded that concentration of precipitation into fewer events would result in a higher number of dry days, triggering more irrigation, but that this change in irrigation output is highly sensitive to the baseline concentration of precipitation that currently exists in an area.\n\nWhich choice best describes data from the table that support Persad and her colleagues' conclusion?\nA) If baseline precipitation is somewhat concentrated, the amount of water being used for irrigation will increase 0.4% for surface water and 0.9% for groundwater, whereas the amount of water entering aquifers will increase 11.0% if baseline precipitation is evenly distributed.\nB) If baseline precipitation is somewhat concentrated, water use for irrigation will increase only slightly, whereas it will increase 9.0% for surface water and 7.9% for groundwater if baseline precipitation is evenly distributed.\nC) If baseline precipitation is somewhat concentrated, the amount of water entering aquifers will increase 4.9%, while the amount being used for irrigation will increase 0.4% for surface water and 0.9% for groundwater.\nD) If baseline precipitation is somewhat concentrated, water use for irrigation will decline by a small amount, whereas it will increase 11.0% for surface water and 9.0% for groundwater if baseline precipitation is evenly distributed.", "generated": [{"id": "16.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. A student claims that a historian treats a revolutionary leader more as a national emblem than as a practical policymaker. Which quotation would best illustrate that claim?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) 'The leader's symbolic role in the birth of the nation matters more than the brief and uneven record of his administration.'\nB) 'The administration faced economic challenges from the beginning.'\nC) 'The leader signed several decrees during his first month in office.'\nD) 'The leader's speeches are preserved in several archives.'", "answer": "A", "explanation": "The quotation emphasizes symbolism over concrete actions."}, {"id": "16.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A graph shows that female farmers made up 64% of vegetable growers in the southern region but less than 35% cludes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. A folklorist argues that a tradition developed through recent cultural exchange rather than being merely imported unchanged from a distant country. Which finding would best support the argument?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) Some songs use a meter also found in older European poetry.\nB) Many performers learned songs from relatives.\nC) The tradition is studied by scholars in several countries.\nD) Several ballads include local historical events and blended musical forms that arose after different communities came into sustained contact.", "answer": "D", "explanation": "Recent blended features support cultural exchange."}, {"id": "16.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. A table shows that the number of trained volunteers rose from 18 to 46 after a community program began, while the number in a comparable town without the program stayed near 20. Which conclusion is best supported?\n\nWhich choice most effectively uses evidence from the text, graph, quotation, or study?\n\nA) The table includes more than one year.\nB) The program took place in a community.\nC) The program was associated with a clear increase in trained volunteers compared with the town without the program.\nD) Both towns had some volunteers.", "answer": "C", "explanation": "The comparison supports the program's effect."}]}, {"n": 17, "concept": "Logical Completion: dialect similarity from Scottish settlement.", "original": "In dialects of English spoken in Scotland, the \"r\" sound is strongly emphasized when it appears at the end of syllables (as in \"car\") or before other consonant sounds (as in \"bird\"). English dialects of the Upland South, a region stretching from Oklahoma to western Virginia, place similar emphasis on \"r\" at the ends of syllables and before other consonant sounds. Historical records show that the Upland South was colonized largely by people whose ancestors came from Scotland. Thus, linguists have concluded that _______\n\nWhich choice most logically completes the text?\nA) the English dialects spoken in the Upland South acquired their emphasis on the \"r\" sound from dialects spoken in Scotland.\nB) emphasis on the \"r\" sound will eventually spread from English dialects spoken in the Upland South to dialects spoken elsewhere.\nC) the English dialects spoken in Scotland were influenced by dialects spoken in the Upland South.\nD) people from Scotland abandoned their emphasis on the \"r\" sound after relocating to the Upland South.", "generated": [{"id": "17.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Seeds of a coastal plant occur on two islands separated by hundreds of kilometers of ocean. Genetic analyses indicate that the island populations diverged from mainland populations thousands of years before humans reached either island; therefore, the researchers concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the island populations were domesticated before mainland populations.\nB) the plant probably reached the islands without human assistance.\nC) human traders must have transported the seeds recently.\nD) all island plants descended from a single cultivated variety.", "answer": "B", "explanation": "The divergence predates human arrival, so human transport is unlikely."}, {"id": "17.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. A species of beetle is found both on a continental coast and on a remote volcanic island. DNA evidence suggests that the island beetles split from the coastal population long before people first sailed to the island, so the team inferred that ______\n\nWhich choice most logically completes the text?\n\nA) the island beetles must be younger than the coastal beetles.\nB) humans carried the beetles to the island during early trade voyages.\nC) the beetles were likely introduced by natural dispersal rather than by humans.\nD) the beetles were domesticated by island communities.", "answer": "C", "explanation": "The timing rules out human introduction."}, {"id": "17.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Linguists once proposed that a ceremonial song reached an archipelago through recent migration, but a comparison of related oral traditions suggests that the song's core phrases developed before the migration occurred. The linguists therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the migration must have begun earlier than any other human movement.\nB) all versions of the song are identical.\nC) the song could not have changed after the migration.\nD) the song was probably not introduced to the archipelago by that migration.", "answer": "D", "explanation": "If the tradition predates the migration, that migration did not introduce it."}, {"id": "17.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Botanists studying a crop on a remote island found that the island variety diverged from its mainland relatives tens of thousands of years before humans settled the island. This evidence led them to argue that ______\n\nWhich choice most logically completes the text?\n\nA) the island variety must be genetically identical to wild mainland plants.\nB) human settlement probably did not account for the plant's original arrival on the island.\nC) the crop was first domesticated on the island.\nD) mainland farmers acquired the crop from island communities.", "answer": "B", "explanation": "The plant's arrival predates human settlement."}, {"id": "17.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Researchers had assumed that a freshwater snail reached a chain of lakes when people began moving boats among them. However, genetic data showed that the lake populations separated from one another long before boating began. The researchers therefore concluded that ______\n\nWhich choice most logically completes the text?\n\nA) the snails likely spread through an earlier nonhuman mechanism.\nB) human activity made the populations genetically identical.\nC) the lakes did not contain snails until boating began.\nD) boats probably explain every modern snail population.", "answer": "A", "explanation": "Earlier divergence points to a nonhuman mechanism."}]}, {"n": 18, "concept": "Standard English: finite verb after time phrase.", "original": "How did whales, once no bigger than seals, evolve to become the largest animals on Earth? Brazilian biologist Mariana Nery believes the answer might be found in whales' DNA. In January 2023, Nery and her colleagues _______ a study showing changes over time in four whale genes associated with body size.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) published\nB) publishing\nC) having published\nD) to publish", "generated": [{"id": "18.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) having published\nC) published\nD) publishing", "answer": "C", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "18.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpreta s wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family,\nB) family\nC) family and\nD) family, and", "answer": "B", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "24.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free, in part because,\nC) free in part because\nD) free. In part because", "answer": "D", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 25, "concept": "Standard English: modifier placement after proper noun.", "original": "American abstract artist Richard _______ his installations to make passersby keenly aware of how one's movements are affected by the physical features of one's environment, assembles large-scale steel plates into sculptures that dominate the outdoor spaces they occupy.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\nA) Serra is intending\nB) Serra, intends\nC) Serra, intending\nD) Serra intends", "generated": [{"id": "25.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2022, the research team ______ a paper describing a newly identified enzyme that helps certain bacteria survive in highly acidic water.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) to publish\nB) having published\nC) published\nD) publishing", "answer": "C", "explanation": "A finite past-tense verb is needed after the time phrase."}, {"id": "25.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The antique music box looks decorative, but when its handle is turned, the pins inside the ______ strike tiny metal teeth to produce a melody.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) device\nB) device--\nC) device:\nD) device,", "answer": "A", "explanation": "No punctuation is needed between the noun and the verb phrase."}, {"id": "25.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. When pocket calculators first appeared in classrooms, some teachers rejected the devices because they considered ______ distractions from learning arithmetic.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) that\nB) it\nC) this\nD) them", "answer": "D", "explanation": "Them correctly refers to the plural noun devices."}, {"id": "25.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Isabel Allende's novel The House of the Spirits, a family saga centered on the Trueba _______ often introduces readers to magical realism in Latin American literature.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) family and\nB) family, and\nC) family,\nD) family", "answer": "D", "explanation": "No comma is needed before the verb when the phrase is restrictive."}, {"id": "25.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The stranded research vessel took three days to _______ its hull had become wedged between two shelves of ice.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) free, in part because:\nB) free. In part because\nC) free, in part because,\nD) free in part because", "answer": "B", "explanation": "A sentence boundary is needed before the explanation."}]}, {"n": 26, "concept": "Transitions: sequence in resurfacing process.", "original": "In 1949, Frank Zamboni developed an ice rink resurfacing machine. As Zamboni's machine moved along the rink's surface, it first scraped off the top layer of ice. _______ it sprayed water into the deep grooves left behind by customers' skates. Lastly, it smoothed over the newly formed ice.\n\nWhich choice completes the text with the most logical transition?\nA) For example,\nB) Next,\nC) Similarly,\nD) In contrast,", "generated": [{"id": "26.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The restoration team first removed loose paint from the ceiling. ______ they applied a reversible adhesive to stabilize the remaining pigments.\n\nWhich choice completes the text with the most logical transition?\n\nA) In contrast,\nB) Next,\nC) For example,\nD) Similarly,", "answer": "B", "explanation": "Next marks the second step in a sequence."}, {"id": "26.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The chef chilled the dough for two hours. ______ she rolled it thinly and cut it into narrow strips.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) Nevertheless,\nC) For example,\nD) Then,", "answer": "D", "explanation": "Then indicates the next step."}, {"id": "26.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The technician shut down the old server. ______ he transferred the data to the replacement system.\n\nWhich choice completes the text with the most logical transition?\n\nA) Afterward,\nB) By contrast,\nC) Likewise,\nD) For instance,", "answer": "A", "explanation": "Afterward introduces the next action."}, {"id": "26.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The gardener loosened the soil around each seedling. ______ she watered the roots and covered the bed with straw.\n\nWhich choice completes the text with the most logical transition?\n\nA) Next,\nB) Instead,\nC) Similarly,\nD) For example,", "answer": "A", "explanation": "Next marks sequence."}, {"id": "26.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The archaeologists photographed the wall before touching it. ______ they brushed away loose sand with soft tools.\n\nWhich choice completes the text with the most logical transition?\n\nA) Likewise,\nB) For example,\nC) Subsequently,\nD) In contrast,", "answer": "C", "explanation": "Subsequently means later in sequence."}]}, {"n": 27, "concept": "Transitions: later event.", "original": "In 2014, Nestor Gomez won his first-ever storytelling competition, relating a tale about his life as a Guatemalan immigrant living in Chicago. _______ in 2017, Gomez created the show 80 Minutes Around the World as a platform for others to share stories about their immigration experiences.\n\nWhich choice completes the text with the most logical transition?\nA) Instead,\nB) For example,\nC) Later,\nD) In other words,", "generated": [{"id": "27.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. In 2018, the poet read at a small community festival. ______ in 2021, she founded a citywide series that invited immigrants to share poems in multiple languages.\n\nWhich choice completes the text with the most logical transition?\n\nA) Instead,\nB) Later,\nC) For example,\nD) In other words,", "answer": "B", "explanation": "Later introduces a later event."}, {"id": "27.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. The engineer won a student design prize in 2015. ______ he created a nonprofit that helps rural schools build low-cost weather stations.\n\nWhich choice completes the text with the most logical transition?\n\nA) Similarly,\nB) For instance,\nC) Afterward,\nD) Rather,", "answer": "C", "explanation": "Afterward marks a later development."}, {"id": "27.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The singer performed at local cafes for several years. ______ in 2020, she released an album featuring musicians from her neighborhood.\n\nWhich choice completes the text with the most logical transition?\n\nA) Eventually,\nB) In other words,\nC) For example,\nD) Instead,", "answer": "A", "explanation": "Eventually introduces a later outcome."}, {"id": "27.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The museum first displayed the photographs in a temporary hallway exhibit. ______ it acquired the full series for its permanent collection.\n\nWhich choice completes the text with the most logical transition?\n\nA) Later,\nB) Instead,\nC) For instance,\nD) Likewise,", "answer": "A", "explanation": "Later marks time sequence."}, {"id": "27.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The students presented their prototype at a regional fair. ______ they launched an online workshop to teach other schools how to build it.\n\nWhich choice completes the text with the most logical transition?\n\nA) For example,\nB) By contrast,\nC) In other words,\nD) Then,", "answer": "D", "explanation": "Then introduces a later action."}]}, {"n": 28, "concept": "Transitions: reason for creating SI.", "original": "To guarantee the validity of experimental results, scientists rely on precise, unchanging standards of measurement. _______ metrologists (scientists who study measurement) developed the SI, or International System of Units. The SI's units of measurement are based on unchanging values in nature, such as the mass of an electron or the speed of light.\n\nWhich choice completes the text with the most logical transition?\nA) In contrast,\nB) Regardless,\nC) In addition,\nD) For this reason,", "generated": [{"id": "28.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Reliable comparisons require measurements that remain stable across laboratories. ______ chemists agreed on a common calibration standard.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) In contrast,\nC) In addition,\nD) Regardless,", "answer": "A", "explanation": "For this reason introduces the result of the need stated before."}, {"id": "28.2", "text": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Astronomers needed a consistent way to report distances between stars. ______ they adopted the parsec as a standard unit in professional publications.\n\nWhich choice completes the text with the most logical transition?\n\nA) For example,\nB) Similarly,\nC) Therefore,\nD) Nevertheless,", "answer": "C", "explanation": "Therefore introduces the result."}, {"id": "28.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The survey results could be compared only if every researcher used the same age categories. ______ the committee created a shared coding system.\n\nWhich choice completes the text with the most logical transition?\n\nA) In contrast,\nB) Regardless,\nC) Additionally,\nD) Consequently,", "answer": "D", "explanation": "Consequently gives the effect of the need."}, {"id": "28.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Precise timekeeping is essential for coordinating satellites. ______ engineers use atomic clocks rather than ordinary mechanical clocks.\n\nWhich choice completes the text with the most logical transition?\n\nA) For this reason,\nB) Meanwhile,\nC) However,\nD) For example,", "answer": "A", "explanation": "For this reason links cause to action."}, {"id": "28.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Medical dosages must be calculated from measurements that are consistent from one hospital to another. ______ health agencies publish standardized dosing guidelines.\n\nWhich choice completes the text with the most logical transition?\n\nA) Nevertheless,\nB) Accordingly,\nC) For instance,\nD) In contrast,", "answer": "B", "explanation": "Accordingly means as a result."}]}, {"n": 29, "concept": "Transitions: consequence of new understanding.", "original": "In retrospect, one of the lessons of the 2003 Human Genome Project is that a gene is affected by many factors, not the least of which is its interactions with the protein products of other genes. _______ rather than just focusing on the human genome, efforts to better understand gene mutations related to disease have begun to consider the human proteome, the complete set of proteins expressed by human genes.\n\nWhich choice completes the text with the most logical transition?\nA) In other words,\nB) That said,\nC) For example,\nD) Accordingly,", "generated": [{"id": "29.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Scientists now know that coral health depends partly on the microbes living in coral tissue. ______ studies of reef decline increasingly examine microbial communities as well as coral genetics.\n\nWhich choice completes the text with the most logical transition?\n\nA) In other words,\nB) Accordingly,\nC) That said,\nD) For example,", "answer": "B", "explanation": "Accordingly introduces a consequence."}, {"id": "29.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Researchers found that memory is shaped not only by neurons but also by support cells in the brain. ______ new studies of memory disorders often investigate those support cells.\n\nWhich choice completes the text with the most logical transition?\n\nA) However,\nB) For example,\nC) Therefore,\nD) In contrast,", "answer": "C", "explanation": "Therefore introduces the consequence of the finding."}, {"id": "29.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Climate models show that soil moisture can affect regional temperatures. ______ some climate studies now include detailed soil data instead of focusing only on air patterns.\n\nWhich choice completes the text with the most logical transition?\n\nA) In other words,\nB) For instance,\nC) That said,\nD) As a result,", "answer": "D", "explanation": "As a result introduces the outcome."}, {"id": "29.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The team discovered that the drug interacts with enzymes produced by gut bacteria. ______ clinical trials of the drug now track patients' microbiomes.\n\nWhich choice completes the text with the most logical transition?\n\nA) By contrast,\nB) Nevertheless,\nC) For example,\nD) Accordingly,", "answer": "D", "explanation": "Accordingly links the discovery to the change in research approach."}, {"id": "29.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Historians increasingly recognize that trade routes carried ideas as well as goods. ______ research on ancient cities now often examines merchant networks alongside political records.\n\nWhich choice completes the text with the most logical transition?\n\nA) Consequently,\nB) In other words,\nC) For instance,\nD) That said,", "answer": "A", "explanation": "Consequently introduces the result."}]}, {"n": 30, "concept": "Student Notes: specify publication date.", "original": "While researching a topic, a student has taken the following notes:\n- Iranian scholar Abu Rayhan al-Biruni studied Earth's physical features.\n- He theorized that a large landmass existed west of Europe and east of Asia.\n- Al-Biruni published his landmass theory in 1037 CE.\n\nThe student wants to specify when al-Biruni published his landmass theory. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) In 1037 CE, al-Biruni published his theory that a large landmass existed west of Europe and east of Asia.\nB) Al-Biruni, who studied Earth's physical features, published a theory about a large landmass.\nC) Al-Biruni was an Iranian scholar who studied Earth's physical features.\nD) An Iranian scholar who studied Earth's physical features, al-Biruni theorized that a large landmass existed west of Europe and east of Asia.", "generated": [{"id": "30.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Mathematician Leila Noor proposed a calendar reform in 1984; the reform divided the year into equal quarters; Noor published the proposal in 1984; the goal is to specify when the proposal was published.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) In 1984, Leila Noor published her proposal to divide the year into equal quarters.\nB) Calendar reforms can change how dates are organized.\nC) The proposal divided the year into equal quarters.\nD) Leila Noor was a mathematician interested in calendars.", "answer": "A", "explanation": "The answer specifies the date."}, {"id": "30.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Botanist Kenji Mori studied alpine mosses; he argued that one species survived the last ice age in coastal refuges; Mori published the refuge theory in 1976; the goal is to specify when Mori published the theory.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Mori's theory concerned the last ice age.\nB) In 1976, Mori published his theory that one moss species survived the last ice age in coastal refuges.\nC) A refuge is an area where a species can survive difficult conditions.\nD) Kenji Mori studied alpine mosses in coastal regions.", "answer": "B", "explanation": "The answer gives the publication date."}, {"id": "30.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Historian Amara Patel studied trade across the Sahara; she theorized that salt traders helped spread musical instruments; Patel published the theory in 2008; the goal is to specify when the theory was published.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The Sahara was crossed by many trade routes.\nB) Patel published her theory about salt traders and musical instruments in 2008.\nC) Salt traders may have helped spread musical instruments.\nD) Patel studied trade across the Sahara.", "answer": "B", "explanation": "The answer specifies when the theory appeared."}, {"id": "30.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Engineer Sofia Bell designed a low-cost water pump; the pump used bicycle parts; Bell published the pump design in 2015; the goal is to specify when Bell published the design.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Sofia Bell was an engineer who designed a water pump.\nB) The pump used bicycle parts to lower its cost.\nC) Low-cost pumps can be useful in rural areas.\nD) In 2015, Sofia Bell published her design for a water pump made with bicycle parts.", "answer": "D", "explanation": "The answer identifies the publication year."}, {"id": "30.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Geographer Omar Chen studied island settlement patterns; he theorized that sailors used seasonal winds to reach the islands; Chen published the theory in 1992; the goal is to specify when the theory was published.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The theory concerns how sailors reached the islands.\nB) Seasonal winds can affect sailing routes.\nC) In 1992, Omar Chen published his theory that sailors used seasonal winds to reach the islands.\nD) Omar Chen studied settlement patterns on islands.", "answer": "C", "explanation": "The answer specifies the date."}]}, {"n": 31, "concept": "Student Notes: emphasize mass of Sirius A.", "original": "While researching a topic, a student has taken the following notes:\n- In astronomy, the mass of stars can be described in units called solar masses.\n- One solar mass is roughly equal to the mass of the Sun.\n- The mass of the star Proxima Centauri is 0.122 solar masses.\n- The mass of the star Sirius A is 2.063 solar masses.\n\nThe student wants to emphasize the mass of Sirius A. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) The mass of stars, like Proxima Centauri, can be described in units called solar masses.\nB) In astronomy, the mass of stars can be described in units called solar masses, and one solar mass is roughly equal to the mass of the Sun.\nC) The Sun is more massive than Proxima Centauri, which has a mass of 0.122 solar masses.\nD) With a mass of 2.063 solar masses, Sirius A is more massive than the Sun.", "generated": [{"id": "31.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: The mass of Star Vega B is 1.74 solar masses; one solar mass is roughly equal to the mass of the Sun; the mass of Proxima D is 0.18 solar masses; the goal is to emphasize the mass of Vega B.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The mass of stars can be described in solar masses.\nB) Proxima D has a mass of 0.18 solar masses.\nC) One solar mass is roughly equal to the Sun's mass.\nD) With a mass of 1.74 solar masses, Vega B is more massive than the Sun.", "answer": "D", "explanation": "The answer emphasizes the target star's mass."}, {"id": "31.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: The exoplanet Kepler-99b has a mass of 6.15 Earth masses; Earth mass is a unit based on Earth's mass; Mars has 0.107 Earth masses; the goal is to emphasize Kepler-99b's mass.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Mars has a mass of 0.107 Earth masses.\nB) Planets outside the solar system are called exoplanets.\nC) At 6.15 Earth masses, Kepler-99b is far more massive than Earth.\nD) Earth mass is a unit used to describe planets.", "answer": "C", "explanation": "The answer emphasizes the mass directly."}, {"id": "31.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: The galaxy Cluster A contains 900 trillion solar masses; Cluster B contains 120 trillion solar masses; solar mass is used to describe astronomical mass; the goal is to emphasize Cluster A's mass.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Cluster B contains 120 trillion solar masses.\nB) A galaxy cluster contains many galaxies.\nC) Astronomers use solar masses to describe very large objects.\nD) With 900 trillion solar masses, Cluster A is much more massive than Cluster B.", "answer": "D", "explanation": "The answer emphasizes the target mass."}, {"id": "31.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A neutron star has a mass of 1.8 solar masses; it is only about 20 kilometers wide; one solar mass equals roughly the mass of the Sun; the goal is to emphasize the neutron star's mass.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The neutron star is only about 20 kilometers wide.\nB) Despite being only about 20 kilometers wide, the neutron star has a mass of 1.8 solar masses.\nC) Neutron stars are very compact astronomical objects.\nD) Solar masses are used to describe star masses.", "answer": "B", "explanation": "The answer emphasizes the mass."}, {"id": "31.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: The star Deneb has a mass of about 19 solar masses; one solar mass is the Sun's mass; the star Barnard's Star has about 0.16 solar masses; the goal is to emphasize Deneb's mass.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) At about 19 solar masses, Deneb is vastly more massive than the Sun.\nB) Barnard's Star has about 0.16 solar masses.\nC) Astronomers compare stars using solar masses.\nD) The Sun's mass defines one solar mass.", "answer": "A", "explanation": "The answer emphasizes Deneb's mass."}]}, {"n": 32, "concept": "Student Notes: contrast first- and second-class levers.", "original": "While researching a topic, a student has taken the following notes:\n- A lever is a simple machine consisting of a rigid beam and a fulcrum.\n- The fulcrum is the point about which the beam pivots.\n- The input force (effort) is the force applied to the lever.\n- The output force (load) is the force that the lever exerts on another object.\n- In first-class levers, the fulcrum is located between the effort and the load.\n- In second-class levers, the load is located between the effort and the fulcrum.\n\nThe student wants to contrast first-class levers and second-class levers. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) In levers, the effort is the force applied to the lever; the load, in contrast, is the force that the lever exerts on another object.\nB) In first-class and second-class levers, the fulcrum and the load are in different locations.\nC) First-class levers are simple machines consisting of a rigid beam and a fulcrum, but then again, the same is true of second-class levers.\nD) In first-class levers, the fulcrum is located between the effort and the load, but in second-class levers, the load is located between the effort and the fulcrum.", "generated": [{"id": "32.1", "text": "A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: A seesaw is a lever; in a first-class lever, the fulcrum is between effort and load; in a second-class lever, the load is between effort and fulcrum; the goal is to contrast the two lever types.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The fulcrum is the point about which a lever turns.\nB) A seesaw is one example of a lever.\nC) First-class and second-class levers are both simple machines.\nD) In first-class levers, the fulcrum is between effort and load, whereas in second-class levers, the load is between effort and fulcrum.", "answer": "D", "explanation": "The answer directly contrasts the locations."}, {"id": "32.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: Type A hinges have the pin between the two plates; Type B hinges have one plate between the pin and the other plate; both allow doors to rotate; the goal is to contrast Type A and Type B hinges.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Type A hinges place the pin between the plates, while Type B hinges place one plate between the pin and the other plate.\nB) Both hinge types include plates and a pin.\nC) Hinges allow doors to rotate.\nD) The pin is important in any hinge.", "answer": "A", "explanation": "The answer contrasts the two designs."}, {"id": "32.3", "text": "A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: In class-one pulleys, the wheel is fixed overhead; in class-two pulleys, the wheel moves with the load; both systems use rope tension; the goal is to contrast the pulley types.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) A pulley system can reduce effort.\nB) Class-one pulleys have a fixed wheel, whereas class-two pulleys have a wheel that moves with the load.\nC) Loads can be lifted with several pulley designs.\nD) Both pulley types use rope tension to move a load.", "answer": "B", "explanation": "The answer directly contrasts the types."}, {"id": "32.4", "text": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: A first-order stream has no tributaries; a second-order stream forms when two first-order streams meet; both are part of river networks; the goal is to contrast the stream types.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) River networks may contain many streams.\nB) Both first- and second-order streams occur in river networks.\nC) Unlike a first-order stream, which has no tributaries, a second-order stream forms when two first-order streams meet.\nD) Streams can be classified by order.", "answer": "C", "explanation": "The answer contrasts first and second order."}, {"id": "32.5", "text": "In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: In direct democracy, citizens vote on laws themselves; in representative democracy, citizens elect officials to vote on laws; both are democratic systems; the goal is to contrast the systems.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Both direct and representative democracy are democratic systems.\nB) Elections are important in representative democracies.\nC) In direct democracy, citizens vote on laws themselves, whereas in representative democracy, elected officials vote on laws.\nD) Citizens participate in both systems.", "answer": "C", "explanation": "The answer contrasts the decision makers."}]}, {"n": 33, "concept": "Student Notes: emphasize similarity between P and S waves.", "original": "While researching a topic, a student has taken the following notes:\n- Earthquakes start at a point called a \"focus\" and spread out from there as seismic waves.\n- The two types of seismic waves that travel beneath Earth's surface are primary waves (P waves) and secondary waves (S waves).\n- P waves travel more quickly beneath Earth's surface than do S waves.\n- P waves compress and expand the ground, causing it to move backward and forward.\n- S waves cause the ground to move from side to side.\n\nThe student wants to emphasize a similarity between P waves and S waves. Which choice most effectively uses relevant information from the notes to accomplish this goal?\nA) P waves and S waves both travel beneath Earth's surface, causing the ground to move.\nB) P waves travel away from an earthquake's starting point at a higher rate of speed than do S waves.\nC) Spreading out from the focus of an earthquake, P waves move the ground backward and forward.\nD) Although P waves and S waves start at the same point, they behave very differently.", "generated": [{"id": "33.1", "text": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. Notes: Sound waves and light waves both transfer energy; sound waves require a medium; light waves can travel through a vacuum; the goal is to emphasize a similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The two wave types differ in whether they need a medium.\nB) Sound waves require air or another medium.\nC) Light waves can travel through space.\nD) Both sound waves and light waves transfer energy.", "answer": "D", "explanation": "The answer states the shared feature."}, {"id": "33.2", "text": "In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Notes: P waves and S waves travel through Earth; both begin at an earthquake's focus; P waves are faster; S waves move the ground side to side; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) S waves move the ground side to side.\nB) Earthquakes produce several kinds of seismic waves.\nC) Both P waves and S waves begin at an earthquake's focus and travel through Earth.\nD) P waves travel faster than S waves.", "answer": "C", "explanation": "The answer emphasizes the similarity."}, {"id": "33.3", "text": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. Notes: Xylem and phloem are plant tissues; xylem transports water; phloem transports sugars; both move materials through a plant; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Phloem transports sugars produced in leaves.\nB) Both xylem and phloem move materials through a plant.\nC) Plant tissues perform many specialized functions.\nD) Xylem transports water upward from the roots.", "answer": "B", "explanation": "The answer states the shared function."}, {"id": "33.4", "text": "A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Notes: Arteries and veins are blood vessels; arteries carry blood away from the heart; veins carry blood toward the heart; both transport blood through the body; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Both arteries and veins are vessels that transport blood through the body.\nB) Arteries and veins move blood in opposite directions.\nC) Arteries carry blood away from the heart.\nD) Veins carry blood back toward the heart.", "answer": "A", "explanation": "The answer emphasizes the shared role."}, {"id": "33.5", "text": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Notes: Comets and asteroids orbit the Sun; comets contain ice; asteroids are mostly rocky or metallic; both are small solar-system bodies; the goal is to emphasize similarity.\n\nWhich choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Comets contain ice that can form tails.\nB) Some comets are visible from Earth.\nC) Comets and asteroids both orbit the Sun as small bodies in the solar system.\nD) Asteroids are mostly rocky or metallic.", "answer": "C", "explanation": "The answer states the similarity."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
