<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital SAT English Mock Quiz - Practice Test 5, Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>
<body>
  <header>
    <h1>Digital SAT English Mock Quiz - Practice Test 5, Module 2</h1>
    <p class="subtitle">33 original questions (now interactive) + mock variations = 198 items · 中英對照 · 錯題本 · Cambridge 字典連結</p>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="btnWrong">錯題本 Wrong Qs (<span id="wrongCount">0</span>)</button>
      <button type="button" id="btnRetest">Retest wrong only 重測錯題</button>
      <button type="button" id="btnDlTxt">⬇ Download wrong (.txt)</button>
      <button type="button" id="btnDlCsv">⬇ Download wrong (.csv)</button>
      <button type="button" id="btnClear">Clear wrong list</button>
      <button type="button" id="resetQuiz">Reset answers</button>
      <span class="stat" id="stat"></span>
    </div>
    <div class="panel" id="wrongPanel"></div>
    <div id="quiz"></div>
  </main>
  <div id="tip" role="tooltip"></div>
  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: reaching across means stretching toward.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from Elizabeth von Arnim&#x27;s 1922 novel The Enchanted April. Mrs. Wilkins and her friend Rose are traveling in Italy.<br><br>&quot;I&#x27;m going to have one of these <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gorgeous\" target=\"_blank\" rel=\"noopener\" data-w=\"gorgeous\" data-pos=\"adj.\" data-en=\"very beautiful or attractive\" data-zh=\"非常漂亮的；華麗的\">gorgeous<\/a> oranges,&quot; said Mrs. Wilkins, staying where she was and reaching across to a black bowl <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pile\" target=\"_blank\" rel=\"noopener\" data-w=\"pile\" data-pos=\"v.\" data-en=\"to put things on top of each other in a heap\" data-zh=\"堆放；堆積\">piled<\/a> with them. &quot;Rose, how can you <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=resist\" target=\"_blank\" rel=\"noopener\" data-w=\"resist\" data-pos=\"v.\" data-en=\"to stop yourself from doing or having something you want\" data-zh=\"抗拒；忍住\">resist<\/a> them. Look--have this one. Do have this beauty--&quot; And she held out a big one.", "bodyPlain": "The following text is adapted from Elizabeth von Arnim's 1922 novel The Enchanted April. Mrs. Wilkins and her friend Rose are traveling in Italy.\n\n\"I'm going to have one of these gorgeous oranges,\" said Mrs. Wilkins, staying where she was and reaching across to a black bowl piled with them. \"Rose, how can you resist them. Look--have this one. Do have this beauty--\" And she held out a big one.", "stem": "As used in the text, what does the phrase \"reaching across to\" most nearly mean?", "stemZh": "依文中用法，片語 \"reaching across to\" 最接近什麼意思？", "bodyZh": "以下文字改編自 Elizabeth von Arnim 1922 年的小說《The Enchanted April》。Wilkins 太太和她的朋友 Rose 正在義大利旅行。\n「我要吃一顆這種漂亮的柳橙，」Wilkins 太太說，她仍坐在原位，伸手越過桌面去拿一個堆滿柳橙的黑色碗。「Rose，妳怎麼忍得住不吃呢。看——拿這一顆吧。一定要嚐嚐這顆漂亮的——」她說著遞出一顆大柳橙。", "opts": {"A": "Joining with", "B": "Gaining on", "C": "Stretching toward", "D": "Arriving at"}, "optsZh": {"A": "Joining with（與……結合、加入）", "B": "Gaining on（逐漸追上）", "C": "Stretching toward（伸向、朝……伸出）", "D": "Arriving at（抵達）"}, "answer": "C", "expl": "Mrs. Wilkins stays in her seat and extends her arm across to the bowl, so 'reaching across to' most nearly means 'stretching toward.'", "explZh": "Wilkins 太太坐在原位，伸手越過桌面去拿碗裡的柳橙，所以 reaching across to 最接近「Stretching toward」（伸向）。", "defs": {"A": {"w": "join with", "pos": "phr. v.", "en": "coming together with someone to do something", "zh": "與……結合；與……聯手", "word": "join with"}, "B": {"w": "gain on", "pos": "phr. v.", "en": "getting closer to someone or something you are chasing", "zh": "逐漸追上；逼近", "word": "gain on"}, "C": {"w": "stretch toward", "pos": "phr. v.", "en": "extending your arm or body in the direction of something", "zh": "伸向；朝……伸出", "word": "stretch toward"}, "D": {"w": "arrive at", "pos": "phr. v.", "en": "reaching a place at the end of a trip", "zh": "抵達；到達", "word": "arrive at"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: reaching across means stretching toward.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The archivist leaned over the display case and ______ the brittle map, careful not to touch the glass while checking a faded inscription near the edge.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The archivist leaned over the display case and ______ the brittle map, careful not to touch the glass while checking a faded inscription near the edge.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。檔案管理員俯身在展示櫃上方，______ 那張易碎的地圖，小心不碰到玻璃，同時查看邊緣一段褪色的題字。", "opts": {"A": "arrived at", "B": "caught up to", "C": "joined with", "D": "stretched toward"}, "optsZh": {"A": "arrived at（抵達）", "B": "caught up to（追上）", "C": "joined with（與……結合）", "D": "stretched toward（伸向）"}, "answer": "D", "expl": "Stretched toward means reached across to.", "explZh": "", "defs": {"A": {"w": "arrive at", "pos": "phr. v.", "en": "reached a place (past tense)", "zh": "抵達（過去式）", "word": "arrive at"}, "B": {"w": "catch up to", "pos": "phr. v.", "en": "reached someone who was ahead of you (past tense)", "zh": "追上（過去式）", "word": "catch up to"}, "C": {"w": "join with", "pos": "phr. v.", "en": "came together with someone (past tense)", "zh": "與……結合（過去式）", "word": "join with"}, "D": {"w": "stretch toward", "pos": "phr. v.", "en": "extended the arm or body in the direction of something (past tense)", "zh": "伸向（過去式）", "word": "stretch toward"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: reaching across means stretching toward.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Unable to leave her seat during the ceremony, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=researcher\" target=\"_blank\" rel=\"noopener\" data-w=\"researcher\" data-pos=\"n.\" data-en=\"a person who studies a subject carefully to discover facts\" data-zh=\"研究人員\">researcher<\/a> ______ the side table to retrieve the program that had slid just beyond her chair.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Unable to leave her seat during the ceremony, the researcher ______ the side table to retrieve the program that had slid just beyond her chair.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。典禮進行時無法離開座位，這位研究人員 ______ 旁邊的小桌，去拿那份滑到她椅子稍遠處的節目單。", "opts": {"A": "overtook", "B": "arrived beside", "C": "reached toward", "D": "collaborated with"}, "optsZh": {"A": "overtook（超越；追過）", "B": "arrived beside（來到……旁邊）", "C": "reached toward（伸向）", "D": "collaborated with（與……合作）"}, "answer": "C", "expl": "Reached toward means extended one's body or arm toward something.", "explZh": "", "defs": {"A": {"w": "overtake", "pos": "v.", "en": "went past someone moving in the same direction (past tense of overtake)", "zh": "超越；追過（overtake 的過去式）", "word": "overtake"}, "B": {"w": "arrive beside", "pos": "phr. v.", "en": "came to a place next to something (past tense)", "zh": "來到……旁邊（過去式）", "word": "arrive beside"}, "C": {"w": "reach toward", "pos": "phr. v.", "en": "stretched an arm in the direction of something (past tense)", "zh": "伸向（過去式）", "word": "reach toward"}, "D": {"w": "collaborate with", "pos": "phr. v.", "en": "worked together with someone (past tense)", "zh": "與……合作（過去式）", "word": "collaborate with"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: reaching across means stretching toward.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=encounter\" target=\"_blank\" rel=\"noopener\" data-w=\"encounter\" data-pos=\"v.\" data-en=\"to meet or experience something, often unexpectedly\" data-zh=\"遇到\">encountered<\/a> sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The child stayed on the blanket but ______ the basket of shells, extending one arm as far as possible to choose the largest one.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The child stayed on the blanket but ______ the basket of shells, extending one arm as far as possible to choose the largest one.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。孩子仍待在毯子上，但 ______ 那籃貝殼，把一隻手臂盡量伸長，挑選最大的一個。", "opts": {"A": "extended toward", "B": "approached", "C": "united with", "D": "arrived at"}, "optsZh": {"A": "extended toward（伸向）", "B": "approached（接近；靠近）", "C": "united with（與……聯合）", "D": "arrived at（抵達）"}, "answer": "A", "expl": "Extended toward means stretched toward.", "explZh": "", "defs": {"A": {"w": "extend toward", "pos": "phr. v.", "en": "reached or stretched out in the direction of something (past tense)", "zh": "伸向（過去式）", "word": "extend toward"}, "B": {"pos": "v.", "en": "came near to something (past tense of approach)", "zh": "接近；靠近（approach 的過去式）", "word": "approached"}, "C": {"w": "unite with", "pos": "phr. v.", "en": "joined together with someone as one group (past tense)", "zh": "與……聯合（過去式）", "word": "unite with"}, "D": {"w": "arrive at", "pos": "phr. v.", "en": "reached a place (past tense)", "zh": "抵達（過去式）", "word": "arrive at"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: reaching across means stretching toward.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. From the back row, the technician ______ the control panel to silence the alarm without stepping away from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=microscope\" target=\"_blank\" rel=\"noopener\" data-w=\"microscope\" data-pos=\"n.\" data-en=\"an instrument that makes very small things look larger\" data-zh=\"顯微鏡\">microscope<\/a>.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. From the back row, the technician ______ the control panel to silence the alarm without stepping away from the microscope.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。技術人員從後排 ______ 控制面板，在不離開顯微鏡的情況下讓警報聲停止。", "opts": {"A": "visited", "B": "reached over to", "C": "joined", "D": "gained on"}, "optsZh": {"A": "visited（拜訪；參觀）", "B": "reached over to（伸手越過去拿）", "C": "joined（加入；連接）", "D": "gained on（逐漸追上）"}, "answer": "B", "expl": "Reached over to means reached across toward something.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "went to see a person or place (past tense of visit)", "zh": "拜訪；參觀（visit 的過去式）", "word": "visited"}, "B": {"w": "reach over to", "pos": "phr. v.", "en": "stretched an arm across something to get it (past tense)", "zh": "伸手越過去拿（過去式）", "word": "reach over to"}, "C": {"pos": "v.", "en": "connected or became part of a group (past tense of join)", "zh": "加入；連接（join 的過去式）", "word": "joined"}, "D": {"w": "gain on", "pos": "phr. v.", "en": "got closer to someone being chased (past tense)", "zh": "逐漸追上（過去式）", "word": "gain on"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: reaching across means stretching toward.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The painter, unwilling to move the wet canvas, ______ the tray of brushes and selected the thinnest one for the final line.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The painter, unwilling to move the wet canvas, ______ the tray of brushes and selected the thinnest one for the final line.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。畫家不願移動還沒乾的畫布，於是 ______ 那盤畫筆，挑出最細的一支來畫最後一筆。", "opts": {"A": "caught up with", "B": "leaned toward", "C": "combined with", "D": "arrived near"}, "optsZh": {"A": "caught up with（趕上；追上）", "B": "leaned toward（傾身靠向）", "C": "combined with（與……結合）", "D": "arrived near（來到……附近）"}, "answer": "B", "expl": "Leaned toward can mean reached or stretched in the direction of something.", "explZh": "", "defs": {"A": {"w": "catch up with", "pos": "phr. v.", "en": "reached the same level or place as someone ahead (past tense)", "zh": "趕上；追上（過去式）", "word": "catch up with"}, "B": {"w": "lean toward", "pos": "phr. v.", "en": "bent the body in the direction of something (past tense)", "zh": "傾身靠向（過去式）", "word": "lean toward"}, "C": {"w": "combine with", "pos": "phr. v.", "en": "joined or mixed together with something (past tense)", "zh": "與……結合（過去式）", "word": "combine with"}, "D": {"w": "arrive near", "pos": "phr. v.", "en": "came to a place close to something (past tense)", "zh": "來到……附近（過去式）", "word": "arrive near"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: obtain information.", "vocab": true, "body": "A team of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=paleontologist\" target=\"_blank\" rel=\"noopener\" data-w=\"paleontologist\" data-pos=\"n.\" data-en=\"a scientist who studies fossils and ancient life\" data-zh=\"古生物學家\">paleontologists<\/a> has found a rich <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fossil\" target=\"_blank\" rel=\"noopener\" data-w=\"fossil\" data-pos=\"n.\" data-en=\"the remains of a prehistoric plant or animal preserved in rock\" data-zh=\"化石\">fossil<\/a> deposit near Gulgong, Australia. The fossils are so well <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserved<\/a> that the team has been able to _______ detailed information about the life forms that left them behind, such as color patterns and how they interacted with other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>.", "bodyPlain": "A team of paleontologists has found a rich fossil deposit near Gulgong, Australia. The fossils are so well preserved that the team has been able to _______ detailed information about the life forms that left them behind, such as color patterns and how they interacted with other species.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "一組古生物學家在澳洲 Gulgong 附近發現了一處豐富的化石沉積層。這些化石保存得非常好，讓研究團隊得以 _______ 有關留下化石之生物的詳細資訊，例如牠們的色彩花紋以及如何與其他物種互動。", "opts": {"A": "occupy", "B": "hoard", "C": "reserve", "D": "obtain"}, "optsZh": {"A": "occupy（佔據；佔用）", "B": "hoard（囤積；貯藏）", "C": "reserve（保留；預訂）", "D": "obtain（獲得；取得）"}, "answer": "D", "expl": "Because the fossils are so well preserved, the team has been able to get detailed information from them, so 'obtain' fits.", "explZh": "化石保存得非常好，研究團隊因此能從中取得詳細資訊，所以用「obtain」（獲得）。", "defs": {"A": {"pos": "v.", "en": "to fill or use a space or time", "zh": "佔據；佔用", "word": "occupy"}, "B": {"pos": "v.", "en": "to collect and hide a large amount of something", "zh": "囤積；貯藏", "word": "hoard"}, "C": {"pos": "v.", "en": "to keep something for later or for a special purpose", "zh": "保留；預訂", "word": "reserve"}, "D": {"pos": "v.", "en": "to get something, especially through effort", "zh": "獲得；取得", "word": "obtain"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: obtain information.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The newly digitized ship logs allowed historians to ______ information about trade routes that had previously been available only in scattered handwritten records.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The newly digitized ship logs allowed historians to ______ information about trade routes that had previously been available only in scattered handwritten records.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。新數位化的航海日誌讓歷史學家得以 ______ 有關貿易路線的資訊，這些資訊過去只散見於零星的手寫紀錄中。", "opts": {"A": "occupy", "B": "obtain", "C": "reserve", "D": "hoard"}, "optsZh": {"A": "occupy（佔據；佔用）", "B": "obtain（獲得；取得）", "C": "reserve（保留；預訂）", "D": "hoard（囤積；貯藏）"}, "answer": "B", "expl": "Obtain means get or acquire.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to fill or use a space or time", "zh": "佔據；佔用", "word": "occupy"}, "B": {"pos": "v.", "en": "to get something, especially through effort", "zh": "獲得；取得", "word": "obtain"}, "C": {"pos": "v.", "en": "to keep something for later or for a special purpose", "zh": "保留；預訂", "word": "reserve"}, "D": {"pos": "v.", "en": "to collect and hide a large amount of something", "zh": "囤積；貯藏", "word": "hoard"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: obtain information.", "vocab": true, "body": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. By comparing pollen trapped in lake <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sediment\" target=\"_blank\" rel=\"noopener\" data-w=\"sediment\" data-pos=\"n.\" data-en=\"material that settles at the bottom of a liquid\" data-zh=\"沉積物\">sediment<\/a>, researchers were able to ______ <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> about the region&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=vegetation\" target=\"_blank\" rel=\"noopener\" data-w=\"vegetation\" data-pos=\"n.\" data-en=\"plants in general, especially in a particular area\" data-zh=\"植被\">vegetation<\/a> before large-scale farming began.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. By comparing pollen trapped in lake sediment, researchers were able to ______ evidence about the region's vegetation before large-scale farming began.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。透過比對湖泊沉積物中保存的花粉，研究人員得以 ______ 有關該地區在大規模農業開始之前植被狀況的證據。", "opts": {"A": "hoard", "B": "occupy", "C": "reserve", "D": "extract"}, "optsZh": {"A": "hoard（囤積；貯藏）", "B": "occupy（佔據；佔用）", "C": "reserve（保留；預訂）", "D": "extract（取得；提取）"}, "answer": "D", "expl": "Extract means obtain from a source.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to collect and hide a large amount of something", "zh": "囤積；貯藏", "word": "hoard"}, "B": {"pos": "v.", "en": "to fill or use a space or time", "zh": "佔據；佔用", "word": "occupy"}, "C": {"pos": "v.", "en": "to keep something for later or for a special purpose", "zh": "保留；預訂", "word": "reserve"}, "D": {"pos": "v.", "en": "to get information or a substance out of something", "zh": "取得；提取", "word": "extract"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: obtain information.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The telescope&#x27;s improved sensors helped astronomers ______ precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=measurement\" target=\"_blank\" rel=\"noopener\" data-w=\"measurement\" data-pos=\"n.\" data-en=\"the act or result of measuring\" data-zh=\"測量；測量值\">measurements<\/a> of a planet whose atmosphere had been too faint to study with older equipment.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The telescope's improved sensors helped astronomers ______ precise measurements of a planet whose atmosphere had been too faint to study with older equipment.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。望遠鏡改良後的感測器幫助天文學家 ______ 一顆行星的精確測量數據；這顆行星的大氣過去太微弱，無法用舊設備研究。", "opts": {"A": "stockpile", "B": "derive", "C": "withhold", "D": "inhabit"}, "optsZh": {"A": "stockpile（儲存；囤積）", "B": "derive（取得；推導出）", "C": "withhold（扣留；保留不給）", "D": "inhabit（居住於）"}, "answer": "B", "expl": "Derive means obtain from evidence or a source.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to collect a large supply of something for future use", "zh": "儲存；囤積", "word": "stockpile"}, "B": {"pos": "v.", "en": "to get something from a particular source", "zh": "取得；推導出", "word": "derive"}, "C": {"pos": "v.", "en": "to refuse to give something", "zh": "扣留；保留不給", "word": "withhold"}, "D": {"pos": "v.", "en": "to live in a place", "zh": "居住於", "word": "inhabit"}}}, {"id": "2.4", "label": "Mock 2.4", "n": 2, "concept": "Words in Context: obtain information.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. Although the damaged tablets were difficult to read, the team managed to ______ useful details about the city&#x27;s legal system from repeated phrases in the surviving text.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. Although the damaged tablets were difficult to read, the team managed to ______ useful details about the city's legal system from repeated phrases in the surviving text.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。雖然受損的泥板難以辨讀，研究團隊仍設法從殘存文字中重複出現的詞句 ______ 有關這座城市法律制度的有用細節。", "opts": {"A": "occupy", "B": "hoard", "C": "acquire", "D": "reserve"}, "optsZh": {"A": "occupy（佔據；佔用）", "B": "hoard（囤積；貯藏）", "C": "acquire（取得；獲得）", "D": "reserve（保留；預訂）"}, "answer": "C", "expl": "Acquire means obtain.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to fill or use a space or time", "zh": "佔據；佔用", "word": "occupy"}, "B": {"pos": "v.", "en": "to collect and hide a large amount of something", "zh": "囤積；貯藏", "word": "hoard"}, "C": {"pos": "v.", "en": "to get or gain something", "zh": "取得；獲得", "word": "acquire"}, "D": {"pos": "v.", "en": "to keep something for later or for a special purpose", "zh": "保留；預訂", "word": "reserve"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: obtain information.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. The researchers used interviews, satellite images, and tax records to ______ a fuller picture of how the coastline community had changed after the storm.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. The researchers used interviews, satellite images, and tax records to ______ a fuller picture of how the coastline community had changed after the storm.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。研究人員利用訪談、衛星影像和稅務紀錄來 ______ 一幅更完整的圖像，說明這個沿海社區在暴風雨之後如何改變。", "opts": {"A": "gain", "B": "conceal", "C": "occupy", "D": "reserve"}, "optsZh": {"A": "gain（獲得）", "B": "conceal（隱藏）", "C": "occupy（佔據；佔用）", "D": "reserve（保留；預訂）"}, "answer": "A", "expl": "Gain means obtain.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "to get or obtain something", "zh": "獲得", "word": "gain"}, "B": {"pos": "v.", "en": "to hide something", "zh": "隱藏", "word": "conceal"}, "C": {"pos": "v.", "en": "to fill or use a space or time", "zh": "佔據；佔用", "word": "occupy"}, "D": {"pos": "v.", "en": "to keep something for later or for a special purpose", "zh": "保留；預訂", "word": "reserve"}}}, {"id": "o3", "label": "Original Q3", "n": 3, "concept": "Words in Context: reduced information flow.", "vocab": true, "body": "According to a team of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neuroeconomist\" target=\"_blank\" rel=\"noopener\" data-w=\"neuroeconomist\" data-pos=\"n.\" data-en=\"a scientist who studies how the brain makes economic decisions\" data-zh=\"神經經濟學家\">neuroeconomists<\/a> from the University of Zurich, ease of decision making may be linked to communication between two brain regions, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prefrontal\" target=\"_blank\" rel=\"noopener\" data-w=\"prefrontal\" data-pos=\"adj.\" data-en=\"in the front part of the brain&#x27;s frontal lobe\" data-zh=\"前額葉的\">prefrontal<\/a> cortex and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=parietal\" target=\"_blank\" rel=\"noopener\" data-w=\"parietal\" data-pos=\"adj.\" data-en=\"relating to the upper middle part of the brain\" data-zh=\"頂葉的\">parietal<\/a> cortex. Individuals tend to be more decisive if the information flow between the regions is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intensify\" target=\"_blank\" rel=\"noopener\" data-w=\"intensify\" data-pos=\"v.\" data-en=\"to become or make something stronger\" data-zh=\"增強；加劇\">intensified<\/a>, whereas they make choices more slowly when information flow is _______.", "bodyPlain": "According to a team of neuroeconomists from the University of Zurich, ease of decision making may be linked to communication between two brain regions, the prefrontal cortex and the parietal cortex. Individuals tend to be more decisive if the information flow between the regions is intensified, whereas they make choices more slowly when information flow is _______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "根據蘇黎世大學一組神經經濟學家的說法，做決定的難易程度可能與兩個腦區——前額葉皮質與頂葉皮質——之間的溝通有關。當這兩個區域之間的資訊流增強時，人們往往比較果斷；而當資訊流 _______ 時，他們做選擇就比較慢。", "opts": {"A": "reduced", "B": "evaluated", "C": "determined", "D": "acquired"}, "optsZh": {"A": "reduced（減少；降低）", "B": "evaluated（評估）", "C": "determined（確定；決定）", "D": "acquired（取得；獲得）"}, "answer": "A", "expl": "The sentence contrasts intensified information flow (more decisive) with the opposite condition (slower choices), so the flow must be 'reduced.'", "explZh": "句子把資訊流「增強」（較果斷）與相反的情況（做選擇較慢）作對比，所以資訊流應是「reduced」（減少）。", "defs": {"A": {"pos": "v.", "en": "made smaller or less (past tense of reduce)", "zh": "減少；降低（reduce 的過去式／過去分詞）", "word": "reduced"}, "B": {"pos": "v.", "en": "judged the quality or value of something (past tense of evaluate)", "zh": "評估（evaluate 的過去式／過去分詞）", "word": "evaluated"}, "C": {"pos": "v.", "en": "found out or decided exactly (past tense of determine)", "zh": "確定；決定（determine 的過去式／過去分詞）", "word": "determined"}, "D": {"pos": "v.", "en": "got or gained something (past tense of acquire)", "zh": "取得；獲得（acquire 的過去式／過去分詞）", "word": "acquired"}}}, {"id": "3.1", "label": "Mock 3.1", "n": 3, "concept": "Words in Context: reduced information flow.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The patients solved the puzzle more quickly when activity in the two regions increased, but their responses slowed when the signal between those regions was ______.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The patients solved the puzzle more quickly when activity in the two regions increased, but their responses slowed when the signal between those regions was ______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。當這兩個區域的活動增加時，患者解謎的速度更快；但當這兩區之間的訊號被 ______ 時，他們的反應就變慢了。", "opts": {"A": "reduced", "B": "determined", "C": "evaluated", "D": "acquired"}, "optsZh": {"A": "reduced（減少；降低）", "B": "determined（確定；決定）", "C": "evaluated（評估）", "D": "acquired（取得；獲得）"}, "answer": "A", "expl": "Reduced means made smaller or less intense.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "made smaller or less (past tense of reduce)", "zh": "減少；降低（reduce 的過去式／過去分詞）", "word": "reduced"}, "B": {"pos": "v.", "en": "found out or decided exactly (past tense of determine)", "zh": "確定；決定（determine 的過去式／過去分詞）", "word": "determined"}, "C": {"pos": "v.", "en": "judged the quality or value of something (past tense of evaluate)", "zh": "評估（evaluate 的過去式／過去分詞）", "word": "evaluated"}, "D": {"pos": "v.", "en": "got or gained something (past tense of acquire)", "zh": "取得；獲得（acquire 的過去式／過去分詞）", "word": "acquired"}}}, {"id": "3.2", "label": "Mock 3.2", "n": 3, "concept": "Words in Context: reduced information flow.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=revise\" target=\"_blank\" rel=\"noopener\" data-w=\"revise\" data-pos=\"v.\" data-en=\"to change something to improve or correct it\" data-zh=\"修改；修訂\">revised<\/a> several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">revealed<\/a> how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Traffic moved freely while all lanes were open, but it slowed sharply when construction ______ the road&#x27;s capacity during the morning commute.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple interpretation seem less adequate. Traffic moved freely while all lanes were open, but it slowed sharply when construction ______ the road's capacity during the morning commute.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "檔案中後來的註記顯示，在計畫形成最終公開版本之前，編輯和合作者已修改了好幾項主張。在一所大學的檔案館裡，學者們檢視了書信、田野筆記和早期草稿，這些資料揭示了一項計畫如何隨時間改變。這些資料並未推翻該計畫的基本歷史，但釐清了幾位參與者的角色，也讓一個原本簡單的詮釋顯得不夠充分。所有車道都開放時交通暢通，但在早上通勤時段，施工 ______ 道路容量時，車流就大幅變慢。", "opts": {"A": "diminished", "B": "measured", "C": "expanded", "D": "obtained"}, "optsZh": {"A": "diminished（減少；減弱）", "B": "measured（測量）", "C": "expanded（擴大；擴展）", "D": "obtained（獲得；取得）"}, "answer": "A", "expl": "Diminished means reduced.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "made or became smaller or weaker (past tense of diminish)", "zh": "減少；減弱（diminish 的過去式／過去分詞）", "word": "diminished"}, "B": {"pos": "v.", "en": "found the size or amount of something (past tense of measure)", "zh": "測量（measure 的過去式／過去分詞）", "word": "measured"}, "C": {"pos": "v.", "en": "made or became larger (past tense of expand)", "zh": "擴大；擴展（expand 的過去式／過去分詞）", "word": "expanded"}, "D": {"pos": "v.", "en": "got something (past tense of obtain)", "zh": "獲得；取得（obtain 的過去式／過去分詞）", "word": "obtained"}}}, {"id": "3.3", "label": "Mock 3.3", "n": 3, "concept": "Words in Context: reduced information flow.", "vocab": true, "body": "Visitors to the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> moment, and purpose so readers can understand why a particular description or <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> is warranted. The plant grew well in bright light, whereas its growth rate declined when the light reaching the leaves was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> ______.", "bodyPlain": "Visitors to the exhibition encountered sketches, recordings, and explanatory labels that showed how the work developed through repeated experimentation. A museum catalog presents an artist, object, or performance in relation to the social and technical conditions that shaped it. Instead of merely naming the work, the catalog connects materials, audience, historical moment, and purpose so readers can understand why a particular description or conclusion is warranted. The plant grew well in bright light, whereas its growth rate declined when the light reaching the leaves was deliberately ______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "展覽的參觀者看到了素描、錄音和說明標籤，這些展示了作品如何透過反覆實驗逐步發展。博物館的展覽目錄會將一位藝術家、一件物品或一場表演，放在形塑它的社會與技術條件中來介紹。目錄不只是為作品命名，而是把材料、觀眾、歷史時刻和目的連結起來，讓讀者能理解為什麼某種描述或結論是有根據的。這種植物在強光下長得很好，而當照到葉子上的光被刻意 ______ 時，它的生長速度就下降了。", "opts": {"A": "classified", "B": "collected", "C": "measured", "D": "decreased"}, "optsZh": {"A": "classified（分類）", "B": "collected（收集）", "C": "measured（測量）", "D": "decreased（減少；降低）"}, "answer": "D", "expl": "Decreased means reduced.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "arranged things into groups (past tense of classify)", "zh": "分類（classify 的過去式／過去分詞）", "word": "classified"}, "B": {"pos": "v.", "en": "gathered things together (past tense of collect)", "zh": "收集（collect 的過去式／過去分詞）", "word": "collected"}, "C": {"pos": "v.", "en": "found the size or amount of something (past tense of measure)", "zh": "測量（measure 的過去式／過去分詞）", "word": "measured"}, "D": {"pos": "v.", "en": "became or was made smaller (past tense of decrease)", "zh": "減少；降低（decrease 的過去式／過去分詞）", "word": "decreased"}}}, {"id": "3.4", "label": "Mock 3.4", "n": 3, "concept": "Words in Context: reduced information flow.", "vocab": true, "body": "The study notes that the same policy may produce different results when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=transportation\" target=\"_blank\" rel=\"noopener\" data-w=\"transportation\" data-pos=\"n.\" data-en=\"the system of moving people or goods\" data-zh=\"交通運輸\">transportation<\/a>, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Because the evidence includes <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exception\" target=\"_blank\" rel=\"noopener\" data-w=\"exception\" data-pos=\"n.\" data-en=\"something that does not follow the general rule\" data-zh=\"例外\">exceptions<\/a> as well as broad patterns, the researchers choose cautious wording and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinguish\" target=\"_blank\" rel=\"noopener\" data-w=\"distinguish\" data-pos=\"v.\" data-en=\"to recognize the difference between things\" data-zh=\"區分；辨別\">distinguish<\/a> between what the data directly show and what they merely suggest. The wireless connection remained stable at close range but became unreliable when thick walls ______ the strength of the signal.", "bodyPlain": "The study notes that the same policy may produce different results when transportation, housing, funding, and public trust vary from place to place. A public-policy study compares outcomes across several communities that adopted similar measures under different local conditions. Because the evidence includes exceptions as well as broad patterns, the researchers choose cautious wording and distinguish between what the data directly show and what they merely suggest. The wireless connection remained stable at close range but became unreliable when thick walls ______ the strength of the signal.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "這項研究指出，當交通、住房、經費和民眾信任因地而異時，同一項政策可能產生不同的結果。一項公共政策研究比較了幾個社區的成果，這些社區在不同的在地條件下採取了類似的措施。由於證據中既有例外也有大致的趨勢，研究人員選擇了謹慎的措辭，並區分資料直接顯示的內容與僅僅暗示的內容。無線網路在近距離時保持穩定，但當厚牆 ______ 訊號強度時就變得不可靠。", "opts": {"A": "acquired", "B": "weakened", "C": "evaluated", "D": "determined"}, "optsZh": {"A": "acquired（取得；獲得）", "B": "weakened（減弱；削弱）", "C": "evaluated（評估）", "D": "determined（確定；決定）"}, "answer": "B", "expl": "Weakened means reduced in strength.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "got or gained something (past tense of acquire)", "zh": "取得；獲得（acquire 的過去式／過去分詞）", "word": "acquired"}, "B": {"pos": "v.", "en": "made or became less strong (past tense of weaken)", "zh": "減弱；削弱（weaken 的過去式／過去分詞）", "word": "weakened"}, "C": {"pos": "v.", "en": "judged the quality or value of something (past tense of evaluate)", "zh": "評估（evaluate 的過去式／過去分詞）", "word": "evaluated"}, "D": {"pos": "v.", "en": "found out or decided exactly (past tense of determine)", "zh": "確定；決定（determine 的過去式／過去分詞）", "word": "determined"}}}, {"id": "3.5", "label": "Mock 3.5", "n": 3, "concept": "Words in Context: reduced information flow.", "vocab": true, "body": "Additional trials were conducted under slightly changed <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a> so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conclusion\" target=\"_blank\" rel=\"noopener\" data-w=\"conclusion\" data-pos=\"n.\" data-en=\"a judgment reached after thinking about the evidence\" data-zh=\"結論\">conclusion<\/a> that must be stated with both precision and restraint. Participants struggled when <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a> noise was loud, but their recall improved when the distracting sound was ______ during the task.", "bodyPlain": "Additional trials were conducted under slightly changed conditions so the researchers could determine whether the initial pattern was stable or accidental. In a scientific investigation, the outcome depends on a sequence of observations rather than on one dramatic discovery. The researchers describe the method, the comparison group, and the limits of the evidence before drawing a conclusion that must be stated with both precision and restraint. Participants struggled when background noise was loud, but their recall improved when the distracting sound was ______ during the task.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究人員在稍微改變的條件下進行了額外的試驗，以判斷最初的模式是穩定的還是偶然的。在科學研究中，結果取決於一連串的觀察，而不是某一個戲劇性的發現。研究人員先說明方法、對照組以及證據的限制，再提出一個必須既精確又克制地陳述的結論。背景噪音很大時，參與者表現吃力；但當令人分心的聲音在作業期間被 ______ 時，他們的記憶表現就改善了。", "opts": {"A": "measured", "B": "acquired", "C": "muted", "D": "resolved"}, "optsZh": {"A": "measured（測量）", "B": "acquired（取得；獲得）", "C": "muted（減弱；使變小聲）", "D": "resolved（解決；決定）"}, "answer": "C", "expl": "Muted means reduced in volume or intensity.", "explZh": "", "defs": {"A": {"pos": "v.", "en": "found the size or amount of something (past tense of measure)", "zh": "測量（measure 的過去式／過去分詞）", "word": "measured"}, "B": {"pos": "v.", "en": "got or gained something (past tense of acquire)", "zh": "取得；獲得（acquire 的過去式／過去分詞）", "word": "acquired"}, "C": {"pos": "v.", "en": "made a sound or signal quieter or weaker (past tense of mute)", "zh": "減弱；使變小聲（mute 的過去式／過去分詞）", "word": "muted"}, "D": {"pos": "v.", "en": "solved a problem or made a decision (past tense of resolve)", "zh": "解決；決定（resolve 的過去式／過去分詞）", "word": "resolved"}}}, {"id": "o4", "label": "Original Q4", "n": 4, "concept": "Words in Context: tenuous place in memory.", "vocab": true, "body": "The War of 1812 has _______ place in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> memory in Britain, partly because it is overshadowed by the much larger concurrent conflict against Napoleonic France and partly because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essentially<\/a> maintained the geopolitical status quo for Britain: the country neither gained nor lost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> territory or position as a result of its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=participation\" target=\"_blank\" rel=\"noopener\" data-w=\"participation\" data-pos=\"n.\" data-en=\"the act of taking part in something\" data-zh=\"參與\">participation<\/a> in the war.", "bodyPlain": "The War of 1812 has _______ place in historical memory in Britain, partly because it is overshadowed by the much larger concurrent conflict against Napoleonic France and partly because it essentially maintained the geopolitical status quo for Britain: the country neither gained nor lost significant territory or position as a result of its participation in the war.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "1812 年戰爭在英國的歷史記憶中佔有 _______ 地位，部分原因是它被同時期與拿破崙法國之間規模大得多的衝突所掩蓋，部分原因是它基本上維持了英國的地緣政治現狀：英國並未因參戰而獲得或失去重要的領土或地位。", "opts": {"A": "a tenuous", "B": "an enduring", "C": "a contentious", "D": "a conspicuous"}, "optsZh": {"A": "a tenuous（薄弱的；不穩固的）", "B": "an enduring（持久的；長存的）", "C": "a contentious（有爭議的；引起爭論的）", "D": "a conspicuous（顯眼的；引人注目的）"}, "answer": "A", "expl": "The war is overshadowed by a larger conflict and changed little for Britain, so it has a weak, easily overlooked—'tenuous'—place in memory.", "explZh": "這場戰爭被更大的衝突掩蓋，對英國也沒帶來什麼改變，所以它在歷史記憶中的地位薄弱、容易被忽略，即「a tenuous」（薄弱的）。", "defs": {"A": {"w": "tenuous", "pos": "adj.", "en": "very weak or slight; easily lost", "zh": "薄弱的；不穩固的", "word": "tenuous"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的；長存的", "word": "enduring"}, "C": {"w": "contentious", "pos": "adj.", "en": "causing a lot of disagreement or argument", "zh": "有爭議的；引起爭論的", "word": "contentious"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice; standing out", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "4.1", "label": "Mock 4.1", "n": 4, "concept": "Words in Context: tenuous place in memory.", "vocab": true, "body": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=complicate\" target=\"_blank\" rel=\"noopener\" data-w=\"complicate\" data-pos=\"v.\" data-en=\"to make something more difficult or confusing\" data-zh=\"使複雜\">complicated<\/a> the earlier account. Their report describes the relevant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=background\" target=\"_blank\" rel=\"noopener\" data-w=\"background\" data-pos=\"n.\" data-en=\"the setting behind the main subject; a person&#x27;s past experience\" data-zh=\"背景\">background<\/a>, compares several possible <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretations<\/a>, and narrows toward a claim whose wording depends on the precise <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=relationship\" target=\"_blank\" rel=\"noopener\" data-w=\"relationship\" data-pos=\"n.\" data-en=\"the way two things are connected\" data-zh=\"關係\">relationship<\/a> among the details rather than on a single isolated keyword. The sculptor&#x27;s early notebooks occupy ______ place in art history: they are occasionally cited by specialists but are mostly overshadowed by her later public murals.", "bodyPlain": "The team also checked whether the pattern held across different sites, since a result that appears persuasive in one setting may look less certain when the sample is widened. A research team revisited a familiar explanation after new evidence complicated the earlier account. Their report describes the relevant background, compares several possible interpretations, and narrows toward a claim whose wording depends on the precise relationship among the details rather than on a single isolated keyword. The sculptor's early notebooks occupy ______ place in art history: they are occasionally cited by specialists but are mostly overshadowed by her later public murals.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項能以最合乎邏輯且最精確的字詞完成本文？", "bodyZh": "研究團隊也檢查了這個模式在不同地點是否依然成立，因為在某一情境中看似有說服力的結果，一旦擴大樣本，可能就顯得不那麼確定。在新證據使先前的說法變得複雜之後，一個研究團隊重新檢視了一個常見的解釋。他們的報告描述了相關背景，比較了幾種可能的詮釋，並逐步聚焦到一個主張；這個主張的措辭取決於各細節之間的確切關係，而不是單一孤立的關鍵字。這位雕塑家早期的筆記本在藝術史上佔有 ______ 地位：專家偶爾會引用，但大多被她後期的公共壁畫所掩蓋。", "opts": {"A": "a prominent", "B": "an enduring", "C": "a heated", "D": "a marginal"}, "optsZh": {"A": "a prominent（顯著的；重要的）", "B": "an enduring（持久的；長存的）", "C": "a heated（激烈的；熱烈的）", "D": "a marginal（邊緣的；次要的）"}, "answer": "D", "expl": "Marginal means slight or not central, like tenuous in context.", "explZh": "", "defs": {"A": {"w": "prominent", "pos": "adj.", "en": "important and well known; easy to see", "zh": "顯著的；重要的", "word": "prominent"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的；長存的", "word": "enduring"}, "C": {"w": "heated", "pos": "adj.", "en": "full of strong feeling or angry argument", "zh": "激烈的；熱烈的", "word": "heated"}, "D": {"w": "marginal", "pos": "adj.", "en": "small and not very important; at the edge", "zh": "邊緣的；次要的", "word": "marginal"}}}, {"id": "4.2", "label": "Mock 4.2", "n": 4, "concept": "Words in Context: tenuous place in memory.", "vocab": true, "body": "Later annotations in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archive\" target=\"_blank\" rel=\"noopener\" data-w=\"archive\" data-pos=\"n.\" data-en=\"a collection of historical documents or records\" data-zh=\"檔案館；檔案\">archive<\/a> showed that editors and collaborators had revised several claims before the project reached its final public form. In a university archive, scholars examined correspondence, field notes, and early drafts that revealed how a project changed over time. The materials did not overturn the basic history of the project, but they clarified the roles of several participants and made one previously simple <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interpretation\" target=\"_blank\" rel=\"noopener\" data-w=\"interpretation\" data-pos=\"n.\" data-en=\"an explanation of the meaning of something\" data-zh=\"詮釋；解釋\">interpretation<\/a> seem less adequate. Because few letters from the expedition <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">survived<\/a> and later accounts contradict one another, the event has ______ status in the museum&#x27;s official <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrative\" target=\"_blank\" rel=\"noopener\" data-w=\"narrative\" data-pos=\"n.\" data-en=\"a story or account of events\" data-zh=\"敘事；故事\">narrative<\/a>.", "bodyPlain": "Later annotations in the archive showed that editors and collaborators had revised several claims befo
