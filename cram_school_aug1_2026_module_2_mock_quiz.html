hotographs—both of the veterans and the small objects they ______ to quiet effect in her exhibition What Remained.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "2011 年，藝術家 Priya Chandran 將退伍軍人的手寫信件與照片配對——照片中既有退伍軍人，也有他們 ______ 在她的展覽《What Remained》中產生了安靜而深刻的效果。", "opts": {"A": "kept, from dog tags to pressed flowers to torn maps", "B": "kept, from dog tags to pressed flowers to torn maps—", "C": "kept—from dog tags to pressed flowers to torn maps,", "D": "kept: from dog tags to pressed flowers to torn maps"}, "optsZh": {"A": "保存的，從兵籍牌到押花到撕破的地圖（逗號，結尾無標點）", "B": "保存的，從兵籍牌到押花到撕破的地圖——（逗號，結尾破折號）", "C": "保存的——從兵籍牌到押花到撕破的地圖，（破折號，結尾逗號）", "D": "保存的：從兵籍牌到押花到撕破的地圖（冒號）"}, "answer": "B", "expl": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list.", "explZh": ""}, {"id": "18.4", "label": "Mock 18.4", "n": 18, "concept": "Standard English Conventions (Boundaries): close a sentence's opening em dash with a matching dash, using a comma to introduce the internal example list.", "vocab": false, "body": "In 1994, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographer<\/a> Tomas Elguera paired interviews with retired sailors with photographs—both of the sailors themselves and the knots they ______ to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fascinate\" target=\"_blank\" rel=\"noopener\" data-w=\"fascinate\" data-pos=\"v.\" data-en=\"to attract and hold someone&#x27;s strong interest\" data-zh=\"使著迷\">fascinating<\/a> effect in his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> Rope and Memory.", "bodyPlain": "In 1994, photographer Tomas Elguera paired interviews with retired sailors with photographs—both of the sailors themselves and the knots they ______ to fascinating effect in his exhibition Rope and Memory.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "1994 年，攝影師 Tomas Elguera 將退休水手的訪談與照片配對——照片中既有水手本人，也有他們 ______ 在他的展覽《Rope and Memory》中產生了引人入勝的效果。", "opts": {"A": "demonstrated, from bowlines to clove hitches to sheet bends", "B": "demonstrated, from bowlines to clove hitches to sheet bends—", "C": "demonstrated—from bowlines to clove hitches to sheet bends,", "D": "demonstrated: from bowlines to clove hitches to sheet bends"}, "optsZh": {"A": "示範的，從單套結到雙套結再到接繩結（逗號，結尾無標點）", "B": "示範的，從單套結到雙套結再到接繩結——（逗號，結尾破折號）", "C": "示範的——從單套結到雙套結再到接繩結，（破折號，結尾逗號）", "D": "示範的：從單套結到雙套結再到接繩結（冒號）"}, "answer": "B", "expl": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list.", "explZh": ""}, {"id": "18.5", "label": "Mock 18.5", "n": 18, "concept": "Standard English Conventions (Boundaries): close a sentence's opening em dash with a matching dash, using a comma to introduce the internal example list.", "vocab": false, "body": "In 2016, artist Ines Cardoso paired interviews with elderly seamstresses with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a>—both of the women themselves and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fabric\" target=\"_blank\" rel=\"noopener\" data-w=\"fabric\" data-pos=\"n.\" data-en=\"cloth\" data-zh=\"布料；織物\">fabrics<\/a> they ______ to poignant effect in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> Thread by Thread.", "bodyPlain": "In 2016, artist Ines Cardoso paired interviews with elderly seamstresses with photographs—both of the women themselves and the fabrics they ______ to poignant effect in her exhibition Thread by Thread.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "2016 年，藝術家 Ines Cardoso 將年長裁縫女工的訪談與照片配對——照片中既有這些女性本人，也有她們 ______ 在她的展覽《Thread by Thread》中產生了令人心酸的效果。", "opts": {"A": "favored, from raw silk to indigo cotton to hand-loomed wool", "B": "favored, from raw silk to indigo cotton to hand-loomed wool—", "C": "favored—from raw silk to indigo cotton to hand-loomed wool,", "D": "favored: from raw silk to indigo cotton to hand-loomed wool"}, "optsZh": {"A": "偏愛的，從生絲到靛藍棉布到手織羊毛（逗號，結尾無標點）", "B": "偏愛的，從生絲到靛藍棉布到手織羊毛——（逗號，結尾破折號）", "C": "偏愛的——從生絲到靛藍棉布到手織羊毛，（破折號，結尾逗號）", "D": "偏愛的：從生絲到靛藍棉布到手織羊毛（冒號）"}, "answer": "B", "expl": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list.", "explZh": ""}, {"id": "o19", "label": "Original Q19", "n": 19, "concept": "Standard English Conventions (Boundaries): no comma should separate a proper-noun subject from its main verb.", "vocab": false, "body": "American <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=abstract\" target=\"_blank\" rel=\"noopener\" data-w=\"abstract\" data-pos=\"adj.\" data-en=\"existing as an idea rather than a physical thing; (art) not showing real objects\" data-zh=\"抽象的\">abstract<\/a> artist Richard ______ his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> to make passersby keenly aware of how one&#x27;s movements are affected by the physical features of one&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>, assembles large-scale steel plates into <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> that dominate the outdoor spaces they occupy.", "bodyPlain": "American abstract artist Richard ______ his installations to make passersby keenly aware of how one's movements are affected by the physical features of one's environment, assembles large-scale steel plates into sculptures that dominate the outdoor spaces they occupy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "美國抽象藝術家 Richard ______ 他的裝置作品讓路人敏銳地察覺一個人的動作如何受到環境實體特徵的影響，他把大型鋼板組裝成雕塑，主宰著它們所在的戶外空間。", "opts": {"A": "Serra is intending", "B": "Serra, intends", "C": "Serra, intending", "D": "Serra intends"}, "optsZh": {"A": "Serra 正在打算（無逗號＋is intending）", "B": "Serra，打算（逗號＋intends）", "C": "Serra，打算（逗號＋intending）", "D": "Serra 打算（無逗號＋intends）"}, "answer": "C", "expl": "'Intending his installations to make passersby ... aware ...' is a modifying phrase set off by commas; the main verb is 'assembles.'", "explZh": "「intending his installations…」是分詞修飾語，用逗號前後隔開；句子的主要動詞是「assembles」。"}, {"id": "19.1", "label": "Mock 19.1", "n": 19, "concept": "Standard English Conventions (Boundaries): no comma should separate a proper-noun subject from its main verb.", "vocab": false, "body": "American conceptual artist Naledi ______ her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> to remind <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=viewer\" target=\"_blank\" rel=\"noopener\" data-w=\"viewer\" data-pos=\"n.\" data-en=\"a person who looks at something, such as art or television\" data-zh=\"觀看者；觀眾\">viewers<\/a> of vanished industrial sites; she arranges rusted machine parts into freestanding <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sculpture\" target=\"_blank\" rel=\"noopener\" data-w=\"sculpture\" data-pos=\"n.\" data-en=\"a three-dimensional work of art\" data-zh=\"雕塑\">sculptures<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=display\" target=\"_blank\" rel=\"noopener\" data-w=\"display\" data-pos=\"v.\" data-en=\"to show something publicly so people can see it\" data-zh=\"展示；陳列\">displayed<\/a> in public parks.", "bodyPlain": "American conceptual artist Naledi ______ her installations to remind viewers of vanished industrial sites; she arranges rusted machine parts into freestanding sculptures displayed in public parks.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "美國觀念藝術家 Naledi ______ 她的裝置作品提醒觀眾那些已消失的工業遺址；她把生鏽的機械零件排列成獨立的雕塑，在公園中展示。", "opts": {"A": "is intending", "B": ", intends", "C": ", intending", "D": "intends"}, "optsZh": {"A": "正在打算（現在進行式，單數）", "B": "，打算（逗號＋動詞 intends）", "C": "，打算（逗號＋分詞 intending）", "D": "打算（第三人稱單數）"}, "answer": "D", "expl": "No comma should separate the subject \"Naledi\" from its main verb \"intends.\"", "explZh": ""}, {"id": "19.2", "label": "Mock 19.2", "n": 19, "concept": "Standard English Conventions (Boundaries): no comma should separate a proper-noun subject from its main verb.", "vocab": false, "body": "British land artist Desmond ______ his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=earthworks\" target=\"_blank\" rel=\"noopener\">earthworks<\/a> to make <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visitors\" target=\"_blank\" rel=\"noopener\">visitors<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reconsider\" target=\"_blank\" rel=\"noopener\">reconsider<\/a> the scale of their own bodies; he carves spiral trenches into open hillsides using only hand tools.", "bodyPlain": "British land artist Desmond ______ his earthworks to make visitors reconsider the scale of their own bodies; he carves spiral trenches into open hillsides using only hand tools.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "英國地景藝術家 Desmond ______ 他的大地作品讓參觀者重新思考自己身體的尺度；他只用手工工具在空曠的山坡上挖出螺旋狀的溝渠。", "opts": {"A": "is intending", "B": ", intends", "C": ", intending", "D": "intends"}, "optsZh": {"A": "正在打算（現在進行式，單數）", "B": "，打算（逗號＋動詞 intends）", "C": "，打算（逗號＋分詞 intending）", "D": "打算（第三人稱單數）"}, "answer": "D", "expl": "No comma should separate the subject \"Desmond\" from its main verb \"intends.\"", "explZh": ""}, {"id": "19.3", "label": "Mock 19.3", "n": 19, "concept": "Standard English Conventions (Boundaries): no comma should separate a proper-noun subject from its main verb.", "vocab": false, "body": "Japanese sound artist Emi ______ her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> to make <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=listeners\" target=\"_blank\" rel=\"noopener\">listeners<\/a> notice <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ambient\" target=\"_blank\" rel=\"noopener\">ambient<\/a> noise they usually ignore; she places hidden microphones throughout ordinary public spaces.", "bodyPlain": "Japanese sound artist Emi ______ her installations to make listeners notice ambient noise they usually ignore; she places hidden microphones throughout ordinary public spaces.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "日本聲音藝術家 Emi ______ 她的裝置作品讓聆聽者注意到平常忽略的環境噪音；她把隱藏式麥克風放在一般的公共空間中。", "opts": {"A": "is intending", "B": ", intends", "C": ", intending", "D": "intends"}, "optsZh": {"A": "正在打算（現在進行式，單數）", "B": "，打算（逗號＋動詞 intends）", "C": "，打算（逗號＋分詞 intending）", "D": "打算（第三人稱單數）"}, "answer": "D", "expl": "No comma should separate the subject \"Emi\" from its main verb \"intends.\"", "explZh": ""}, {"id": "19.4", "label": "Mock 19.4", "n": 19, "concept": "Standard English Conventions (Boundaries): no comma should separate a proper-noun subject from its main verb.", "vocab": false, "body": "Brazilian light artist Otavio ______ his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> to make <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pedestrians\" target=\"_blank\" rel=\"noopener\">pedestrians<\/a> aware of how shadows shift throughout the day; he suspends <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=translucent\" target=\"_blank\" rel=\"noopener\" data-w=\"translucent\" data-pos=\"adj.\" data-en=\"allowing some light to pass through but not clear enough to see through\" data-zh=\"半透明的\">translucent<\/a> panels above busy plazas.", "bodyPlain": "Brazilian light artist Otavio ______ his installations to make pedestrians aware of how shadows shift throughout the day; he suspends translucent panels above busy plazas.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "巴西光影藝術家 Otavio ______ 他的裝置作品讓行人察覺影子如何在一天中移動；他在繁忙的廣場上方懸掛半透明的面板。", "opts": {"A": "is intending", "B": ", intends", "C": ", intending", "D": "intends"}, "optsZh": {"A": "正在打算（現在進行式，單數）", "B": "，打算（逗號＋動詞 intends）", "C": "，打算（逗號＋分詞 intending）", "D": "打算（第三人稱單數）"}, "answer": "D", "expl": "No comma should separate the subject \"Otavio\" from its main verb \"intends.\"", "explZh": ""}, {"id": "19.5", "label": "Mock 19.5", "n": 19, "concept": "Standard English Conventions (Boundaries): no comma should separate a proper-noun subject from its main verb.", "vocab": false, "body": "Canadian textile artist Priya ______ her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> to make museum visitors reconsider the labor behind everyday <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=fabric\" target=\"_blank\" rel=\"noopener\" data-w=\"fabric\" data-pos=\"n.\" data-en=\"cloth\" data-zh=\"布料；織物\">fabric<\/a>; she suspends hand-loomed panels from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=gallery\" target=\"_blank\" rel=\"noopener\" data-w=\"gallery\" data-pos=\"n.\" data-en=\"a room or building where art is shown\" data-zh=\"展覽廳；美術館\">gallery<\/a> ceilings.", "bodyPlain": "Canadian textile artist Priya ______ her installations to make museum visitors reconsider the labor behind everyday fabric; she suspends hand-loomed panels from gallery ceilings.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "加拿大纖維藝術家 Priya ______ 她的裝置作品讓博物館參觀者重新思考日常布料背後的勞動；她從展廳天花板垂掛手工織成的布片。", "opts": {"A": "is intending", "B": ", intends", "C": ", intending", "D": "intends"}, "optsZh": {"A": "正在打算（現在進行式，單數）", "B": "，打算（逗號＋動詞 intends）", "C": "，打算（逗號＋分詞 intending）", "D": "打算（第三人稱單數）"}, "answer": "D", "expl": "No comma should separate the subject \"Priya\" from its main verb \"intends.\"", "explZh": ""}, {"id": "o20", "label": "Original Q20", "n": 20, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a reduced relative clause.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of Byropsis algae produces toxins to avoid being eaten by <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a>. However, in some cases, the toxins the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organism\" target=\"_blank\" rel=\"noopener\" data-w=\"organism\" data-pos=\"n.\" data-en=\"a living thing\" data-zh=\"生物\">organism<\/a> uses to protect itself from predation actually ______ its attractiveness to predators. The Hawaiian sea slug, for example, not only <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tolerate\" target=\"_blank\" rel=\"noopener\" data-w=\"tolerate\" data-pos=\"v.\" data-en=\"to accept something unpleasant without complaint\" data-zh=\"容忍\">tolerates<\/a> Byropsis toxins but actually uses them for protection in the same way the algae does.", "bodyPlain": "A species of Byropsis algae produces toxins to avoid being eaten by predators. However, in some cases, the toxins the organism uses to protect itself from predation actually ______ its attractiveness to predators. The Hawaiian sea slug, for example, not only tolerates Byropsis toxins but actually uses them for protection in the same way the algae does.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一種 Byropsis 藻類會產生毒素，以避免被掠食者吃掉。然而，在某些情況下，這種生物用來保護自己免於被捕食的毒素，反而 ______ 它對掠食者的吸引力。例如，夏威夷海蛞蝓不僅能耐受 Byropsis 的毒素，還會像這種藻類一樣利用這些毒素來保護自己。", "opts": {"A": "is increasing", "B": "increase", "C": "increases", "D": "has increased"}, "optsZh": {"A": "正在增加（現在進行式，單數）", "B": "增加（原形）", "C": "增加（第三人稱單數）", "D": "已經增加（現在完成式，單數）"}, "answer": "B", "expl": "The subject 'the toxins' is plural (the clause 'the organism uses...' is in between), and the text is present tense, so 'increase.'", "explZh": "主詞「the toxins」是複數（中間插入關係子句），且為現在式，所以用「increase」。"}, {"id": "20.1", "label": "Mock 20.1", "n": 20, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a reduced relative clause.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of desert shrub <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> thorns to deter grazing animals. However, in some cases, the thorns the plant grows to protect its leaves actually ______ its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=visibility\" target=\"_blank\" rel=\"noopener\" data-w=\"visibility\" data-pos=\"n.\" data-en=\"the degree to which something can be seen or noticed\" data-zh=\"能見度；曝光度\">visibility<\/a> to animals searching for shade, since the thorny silhouette stands out starkly against the open sand.", "bodyPlain": "A species of desert shrub produces thorns to deter grazing animals. However, in some cases, the thorns the plant grows to protect its leaves actually ______ its visibility to animals searching for shade, since the thorny silhouette stands out starkly against the open sand.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一種沙漠灌木會長出刺來嚇阻吃草的動物。然而，在某些情況下，這種植物為保護葉子而長出的刺，反而 ______ 它對尋找陰涼處之動物的醒目程度，因為多刺的輪廓在開闊沙地上格外明顯。", "opts": {"A": "is increasing", "B": "increase", "C": "increases", "D": "has increased"}, "optsZh": {"A": "正在增加（現在進行式，單數）", "B": "增加（原形）", "C": "增加（第三人稱單數）", "D": "已經增加（現在完成式，單數）"}, "answer": "B", "expl": "The plural subject \"thorns\" requires the plural verb \"increase.\"", "explZh": ""}, {"id": "20.2", "label": "Mock 20.2", "n": 20, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a reduced relative clause.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of tropical frog <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> bright skin pigments to warn <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a> of its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=toxicity\" target=\"_blank\" rel=\"noopener\" data-w=\"toxicity\" data-pos=\"n.\" data-en=\"the degree to which something is poisonous\" data-zh=\"毒性\">toxicity<\/a>. However, in some cases, the pigments the frog develops to advertise danger actually ______ its appeal to collectors seeking unusually colorful specimens.", "bodyPlain": "A species of tropical frog produces bright skin pigments to warn predators of its toxicity. However, in some cases, the pigments the frog develops to advertise danger actually ______ its appeal to collectors seeking unusually colorful specimens.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一種熱帶蛙類會產生鮮豔的皮膚色素，警告掠食者它有毒。然而，在某些情況下，這種蛙用來宣告危險的色素，反而 ______ 它對尋找顏色特別鮮豔標本之收藏者的吸引力。", "opts": {"A": "is increasing", "B": "increase", "C": "increases", "D": "has increased"}, "optsZh": {"A": "正在增加（現在進行式，單數）", "B": "增加（原形）", "C": "增加（第三人稱單數）", "D": "已經增加（現在完成式，單數）"}, "answer": "B", "expl": "The plural subject \"pigments\" requires the plural verb \"increase.\"", "explZh": ""}, {"id": "20.3", "label": "Mock 20.3", "n": 20, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a reduced relative clause.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of burrowing beetle produces a strong <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=chemical\" target=\"_blank\" rel=\"noopener\" data-w=\"chemical\" data-pos=\"n.\" data-en=\"a substance produced by or used in chemistry\" data-zh=\"化學物質\">chemical<\/a> odor to repel would-be <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predator\" target=\"_blank\" rel=\"noopener\" data-w=\"predator\" data-pos=\"n.\" data-en=\"an animal that kills and eats other animals\" data-zh=\"掠食者\">predators<\/a>. However, in some cases, the compounds the beetle releases to defend itself actually ______ its detectability to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> predators that have evolved to track that exact scent.", "bodyPlain": "A species of burrowing beetle produces a strong chemical odor to repel would-be predators. However, in some cases, the compounds the beetle releases to defend itself actually ______ its detectability to specialized predators that have evolved to track that exact scent.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一種穴居甲蟲會產生強烈的化學氣味來驅退可能的掠食者。然而，在某些情況下，這種甲蟲用來自我防衛而釋放的化合物，反而 ______ 它被專門演化來追蹤這種氣味的掠食者發現的機率。", "opts": {"A": "is increasing", "B": "increase", "C": "increases", "D": "has increased"}, "optsZh": {"A": "正在增加（現在進行式，單數）", "B": "增加（原形）", "C": "增加（第三人稱單數）", "D": "已經增加（現在完成式，單數）"}, "answer": "B", "expl": "The plural subject \"compounds\" requires the plural verb \"increase.\"", "explZh": ""}, {"id": "20.4", "label": "Mock 20.4", "n": 20, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a reduced relative clause.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of coral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> a bitter-tasting compound to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=discourage\" target=\"_blank\" rel=\"noopener\" data-w=\"discourage\" data-pos=\"v.\" data-en=\"to make something less likely to happen\" data-zh=\"抑制；使不易發生\">discourage<\/a> grazing fish. However, in some cases, the compounds the coral secretes to deter feeding actually ______ its attractiveness to a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> fish species that has evolved to seek out that exact taste.", "bodyPlain": "A species of coral produces a bitter-tasting compound to discourage grazing fish. However, in some cases, the compounds the coral secretes to deter feeding actually ______ its attractiveness to a specialized fish species that has evolved to seek out that exact taste.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一種珊瑚會產生苦味化合物，以阻止魚類啃食。然而，在某些情況下，這種珊瑚為阻止被啃食而分泌的化合物，反而 ______ 它對一種專門演化來尋找這種味道的魚類的吸引力。", "opts": {"A": "is increasing", "B": "increase", "C": "increases", "D": "has increased"}, "optsZh": {"A": "正在增加（現在進行式，單數）", "B": "增加（原形）", "C": "增加（第三人稱單數）", "D": "已經增加（現在完成式，單數）"}, "answer": "B", "expl": "The plural subject \"compounds\" requires the plural verb \"increase.\"", "explZh": ""}, {"id": "20.5", "label": "Mock 20.5", "n": 20, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a reduced relative clause.", "vocab": false, "body": "A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a> of nocturnal moth <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produces<\/a> a high-pitched clicking sound to startle approaching bats. However, in some cases, the clicks the moth emits to defend itself actually ______ its detectability to bats that have learned to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=associate\" target=\"_blank\" rel=\"noopener\" data-w=\"associate\" data-pos=\"v.\" data-en=\"to connect in the mind\" data-zh=\"使聯想；與……有關\">associate<\/a> the sound with an easy meal.", "bodyPlain": "A species of nocturnal moth produces a high-pitched clicking sound to startle approaching bats. However, in some cases, the clicks the moth emits to defend itself actually ______ its detectability to bats that have learned to associate the sound with an easy meal.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "一種夜行性蛾類會發出高頻的喀噠聲來驚嚇逼近的蝙蝠。然而，在某些情況下，這種蛾為自我防衛而發出的喀噠聲，反而 ______ 它被那些已學會把這種聲音與容易到手之獵物聯想在一起的蝙蝠發現的機率。", "opts": {"A": "is increasing", "B": "increase", "C": "increases", "D": "has increased"}, "optsZh": {"A": "正在增加（現在進行式，單數）", "B": "增加（原形）", "C": "增加（第三人稱單數）", "D": "已經增加（現在完成式，單數）"}, "answer": "B", "expl": "The plural subject \"clicks\" requires the plural verb \"increase.\"", "explZh": ""}, {"id": "o21", "label": "Original Q21", "n": 21, "concept": "Transitions: choose the logical connector introducing a concession.", "vocab": false, "body": "Historians agree that the jazz pianist Jelly Roll Morton was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exaggerate\" target=\"_blank\" rel=\"noopener\" data-w=\"exaggerate\" data-pos=\"v.\" data-en=\"to make something seem larger or more important than it is\" data-zh=\"誇大\">exaggerating<\/a> when he claimed to have <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invent\" target=\"_blank\" rel=\"noopener\" data-w=\"invent\" data-pos=\"v.\" data-en=\"to create something that did not exist before\" data-zh=\"發明\">invented<\/a> jazz music. No one can deny, ______, that Morton&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=innovative\" target=\"_blank\" rel=\"noopener\" data-w=\"innovative\" data-pos=\"adj.\" data-en=\"using new methods or ideas\" data-zh=\"創新的\">innovative<\/a> compositions and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=remarkable\" target=\"_blank\" rel=\"noopener\" data-w=\"remarkable\" data-pos=\"adj.\" data-en=\"unusual and worth noticing\" data-zh=\"非凡的；值得注意的\">remarkable<\/a> improvisational skills helped shape jazz as a genre during its early years.", "bodyPlain": "Historians agree that the jazz pianist Jelly Roll Morton was exaggerating when he claimed to have invented jazz music. No one can deny, ______, that Morton's innovative compositions and remarkable improvisational skills helped shape jazz as a genre during its early years.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "歷史學家一致認為，爵士鋼琴家 Jelly Roll Morton 宣稱自己發明了爵士樂是誇大其詞。______，沒有人能否認 Morton 創新的作曲與出色的即興技巧，在爵士樂早期幫助塑造了這個音樂類型。", "opts": {"A": "therefore,", "B": "in the second place,", "C": "in other words,", "D": "though,"}, "optsZh": {"A": "因此，", "B": "其次，", "C": "換句話說，", "D": "不過，"}, "answer": "D", "expl": "Morton exaggerated, but no one can deny his real contribution; 'though' signals this contrast/concession.", "explZh": "Morton 雖然誇大其詞，但他的貢獻無法否認；「though」表示轉折、讓步。"}, {"id": "21.1", "label": "Mock 21.1", "n": 21, "concept": "Transitions: choose the logical connector introducing a concession.", "vocab": false, "body": "Historians agree that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=inventor\" target=\"_blank\" rel=\"noopener\">inventor<\/a> Otto Lindqvist was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exaggerate\" target=\"_blank\" rel=\"noopener\" data-w=\"exaggerate\" data-pos=\"v.\" data-en=\"to make something seem larger or more important than it is\" data-zh=\"誇大\">exaggerating<\/a> when he <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claimed<\/a> to have single-handedly designed the city&#x27;s entire subway system. No one can deny, ______, that Lindqvist&#x27;s engineering innovations solved several of the project&#x27;s most difficult technical problems.", "bodyPlain": "Historians agree that inventor Otto Lindqvist was exaggerating when he claimed to have single-handedly designed the city's entire subway system. No one can deny, ______, that Lindqvist's engineering innovations solved several of the project's most difficult technical problems.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "歷史學家一致認為，發明家 Otto Lindqvist 宣稱自己獨力設計了全市整個地鐵系統是誇大其詞。______，沒有人能否認 Lindqvist 的工程創新解決了這項工程中幾個最困難的技術問題。", "opts": {"A": "therefore,", "B": "in the second place,", "C": "in other words,", "D": "though,"}, "optsZh": {"A": "因此，", "B": "其次，", "C": "換句話說，", "D": "不過，"}, "answer": "D", "expl": "The sentence concedes a real contribution despite the exaggeration, calling for \"though.\"", "explZh": ""}, {"id": "21.2", "label": "Mock 21.2", "n": 21, "concept": "Transitions: choose the logical connector introducing a concession.", "vocab": false, "body": "Critics agree that memoirist Adaeze Okonkwo was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exaggerate\" target=\"_blank\" rel=\"noopener\" data-w=\"exaggerate\" data-pos=\"v.\" data-en=\"to make something seem larger or more important than it is\" data-zh=\"誇大\">exaggerating<\/a> when she <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claimed<\/a> to have predicted the region&#x27;s political collapse years in advance. No one can deny, ______, that her early essays captured <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=widespread\" target=\"_blank\" rel=\"noopener\" data-w=\"widespread\" data-pos=\"adj.\" data-en=\"existing or happening in many places or among many people\" data-zh=\"普遍的；廣泛的\">widespread<\/a> frustrations that most commentators at the time overlooked.", "bodyPlain": "Critics agree that memoirist Adaeze Okonkwo was exaggerating when she claimed to have predicted the region's political collapse years in advance. No one can deny, ______, that her early essays captured widespread frustrations that most commentators at the time overlooked.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "評論家一致認為，回憶錄作家 Adaeze Okonkwo 宣稱自己早在數年前就預言了該地區的政治崩潰是誇大其詞。______，沒有人能否認她早期的文章捕捉到了當時大多數評論者忽略的普遍不滿。", "opts": {"A": "therefore,", "B": "in the second place,", "C": "in other words,", "D": "though,"}, "optsZh": {"A": "因此，", "B": "其次，", "C": "換句話說，", "D": "不過，"}, "answer": "D", "expl": "The sentence concedes a real insight despite the exaggeration, calling for \"though.\"", "explZh": ""}, {"id": "21.3", "label": "Mock 21.3", "n": 21, "concept": "Transitions: choose the logical connector introducing a concession.", "vocab": false, "body": "Scholars agree that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=explorer\" target=\"_blank\" rel=\"noopener\" data-w=\"explorer\" data-pos=\"n.\" data-en=\"a person who travels to unknown places to learn about them\" data-zh=\"探險家\">explorer<\/a> Bram Visser was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exaggerate\" target=\"_blank\" rel=\"noopener\" data-w=\"exaggerate\" data-pos=\"v.\" data-en=\"to make something seem larger or more important than it is\" data-zh=\"誇大\">exaggerating<\/a> when he claimed to be the first European to reach the remote valley. No one can deny, ______, that his detailed maps of the region were more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accurate\" target=\"_blank\" rel=\"noopener\" data-w=\"accurate\" data-pos=\"adj.\" data-en=\"correct and exact, without mistakes\" data-zh=\"準確的\">accurate<\/a> than any <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produced<\/a> before them.", "bodyPlain": "Scholars agree that explorer Bram Visser was exaggerating when he claimed to be the first European to reach the remote valley. No one can deny, ______, that his detailed maps of the region were more accurate than any produced before them.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "學者一致認為，探險家 Bram Visser 宣稱自己是第一位抵達那座偏遠山谷的歐洲人是誇大其詞。______，沒有人能否認他繪製的該地區詳細地圖比之前任何地圖都更準確。", "opts": {"A": "therefore,", "B": "in the second place,", "C": "in other words,", "D": "though,"}, "optsZh": {"A": "因此，", "B": "其次，", "C": "換句話說，", "D": "不過，"}, "answer": "D", "expl": "The sentence concedes a real achievement despite the exaggeration, calling for \"though.\"", "explZh": ""}, {"id": "21.4", "label": "Mock 21.4", "n": 21, "concept": "Transitions: choose the logical connector introducing a concession.", "vocab": false, "body": "Economists agree that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entrepreneur\" target=\"_blank\" rel=\"noopener\" data-w=\"entrepreneur\" data-pos=\"n.\" data-en=\"a person who starts a business\" data-zh=\"企業家；創業者\">entrepreneur<\/a> Delia Vasquez was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exaggerate\" target=\"_blank\" rel=\"noopener\" data-w=\"exaggerate\" data-pos=\"v.\" data-en=\"to make something seem larger or more important than it is\" data-zh=\"誇大\">exaggerating<\/a> when she <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=claim\" target=\"_blank\" rel=\"noopener\" data-w=\"claim\" data-pos=\"n./v.\" data-en=\"a statement that something is true; to state as true\" data-zh=\"主張；聲稱\">claimed<\/a> to have single-handedly revived the town&#x27;s economy. No one can deny, ______, that her factory created hundreds of jobs during a period of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=severe\" target=\"_blank\" rel=\"noopener\" data-w=\"severe\" data-pos=\"adj.\" data-en=\"very serious or harmful\" data-zh=\"嚴重的\">severe<\/a> local unemployment.", "bodyPlain": "Economists agree that entrepreneur Delia Vasquez was exaggerating when she claimed to have single-handedly revived the town's economy. No one can deny, ______, that her factory created hundreds of jobs during a period of severe local unemployment.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "經濟學家一致認為，企業家 Delia Vasquez 宣稱自己獨力振興了這座小鎮的經濟是誇大其詞。______，沒有人能否認她的工廠在當地嚴重失業期間創造了數百個工作機會。", "opts": {"A": "therefore,", "B": "in the second place,", "C": "in other words,", "D": "though,"}, "optsZh": {"A": "因此，", "B": "其次，", "C": "換句話說，", "D": "不過，"}, "answer": "D", "expl": "The sentence concedes a real accomplishment despite the exaggeration, calling for \"though.\"", "explZh": ""}, {"id": "21.5", "label": "Mock 21.5", "n": 21, "concept": "Transitions: choose the logical connector introducing a concession.", "vocab": false, "body": "Musicologists agree that bandleader Cassius Reid was <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exaggerate\" target=\"_blank\" rel=\"noopener\" data-w=\"exaggerate\" data-pos=\"v.\" data-en=\"to make something seem larger or more important than it is\" data-zh=\"誇大\">exaggerating<\/a> when he claimed to have invented an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> new musical genre. No one can deny, ______, that his unconventional arrangements influenced an entire <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generation\" target=\"_blank\" rel=\"noopener\" data-w=\"generation\" data-pos=\"n.\" data-en=\"the production of something, such as electricity\" data-zh=\"產生；發電\">generation<\/a> of younger <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=composer\" target=\"_blank\" rel=\"noopener\" data-w=\"composer\" data-pos=\"n.\" data-en=\"a person who writes music\" data-zh=\"作曲家\">composers<\/a>.", "bodyPlain": "Musicologists agree that bandleader Cassius Reid was exaggerating when he claimed to have invented an entirely new musical genre. No one can deny, ______, that his unconventional arrangements influenced an entire generation of younger composers.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "音樂學家一致認為，樂團領班 Cassius Reid 宣稱自己發明了一個全新的音樂類型是誇大其詞。______，沒有人能否認他非傳統的編曲影響了整整一代年輕作曲家。", "opts": {"A": "therefore,", "B": "in the second place,", "C": "in other words,", "D": "though,"}, "optsZh": {"A": "因此，", "B": "其次，", "C": "換句話說，", "D": "不過，"}, "answer": "D", "expl": "The sentence concedes a real influence despite the exaggeration, calling for \"though.\"", "explZh": ""}, {"id": "o22", "label": "Original Q22", "n": 22, "concept": "Transitions: choose the logical connector that intensifies a claim about the extremity of a difference.", "vocab": false, "body": "Biographer Michael Gorra notes that the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novelist\" target=\"_blank\" rel=\"noopener\" data-w=\"novelist\" data-pos=\"n.\" data-en=\"a person who writes novels\" data-zh=\"小說家\">novelist<\/a> Henry James lived in a world of second thoughts, frequently <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tinkering\" target=\"_blank\" rel=\"noopener\" data-w=\"tinkering\" data-pos=\"n.\" data-en=\"making small changes to something to try to improve it\" data-zh=\"小修小改；修補\">tinkering<\/a> with his novels and stories after their initial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publication\" target=\"_blank\" rel=\"noopener\" data-w=\"publication\" data-pos=\"n.\" data-en=\"a book, magazine, or article that is printed; the act of publishing\" data-zh=\"出版品；發表\">publication<\/a>. However, the differences between the 1881 first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=edition\" target=\"_blank\" rel=\"noopener\" data-w=\"edition\" data-pos=\"n.\" data-en=\"a particular version of a book printed at one time\" data-zh=\"版本；版次\">edition<\/a> and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James&#x27;s standards; ______ some critics regard the two editions as two different novels altogether.", "bodyPlain": "Biographer Michael Gorra notes that the novelist Henry James lived in a world of second thoughts, frequently tinkering with his novels and stories after their initial publication. However, the differences between the 1881 first edition and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James's standards; ______ some critics regard the two editions as two different novels altogether.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "傳記作家 Michael Gorra 指出，小說家 Henry James 活在一個不斷反覆思量的世界裡，經常在小說和故事首次出版後還修修改改。然而，他的小說《仕女圖》1881 年初版與 1908 年版本之間的差異極大，即使以 James 的標準來看也是如此；______ 有些評論家把這兩個版本視為兩部完全不同的小說。", "opts": {"A": "by contrast,", "B": "in fact,", "C": "nevertheless,", "D": "in other words,"}, "optsZh": {"A": "相比之下，", "B": "事實上，", "C": "儘管如此，", "D": "換句話說，"}, "answer": "B", "expl": "Saying critics see the editions as two different novels strengthens the claim that the differences are extreme; 'in fact' intensifies.", "explZh": "批評家認為兩個版本根本是兩部不同小說，進一步強化「差異極大」的說法，所以用「in fact」。"}, {"id": "22.1", "label": "Mock 22.1", "n": 22, "concept": "Transitions: choose the logical connector that intensifies a claim about the extremity of a difference.", "vocab": false, "body": "Biographer Elin Torvald notes that architect Soren Aas was known for revising his blueprints even after <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=construction\" target=\"_blank\" rel=\"noopener\" data-w=\"construction\" data-pos=\"n.\" data-en=\"the process of building something\" data-zh=\"建造；營建\">construction<\/a> had begun. However, the differences between his 1922 design for the concert hall and the building as it was ultimately completed are extreme, even by Aas&#x27;s standards; ______ some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> regard the finished building as an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> different <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> from what he originally proposed.", "bodyPlain": "Biographer Elin Torvald notes that architect Soren Aas was known for revising his blueprints even after construction had begun. However, the differences between his 1922 design for the concert hall and the building as it was ultimately completed are extreme, even by Aas's standards; ______ some historians regard the finished building as an entirely different structure from what he originally proposed.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "傳記作家 Elin Torvald 指出，建築師 Soren Aas 以即使在施工開始後仍會修改藍圖而聞名。然而，他 1922 年的音樂廳設計與最終完工的建築之間差異極大，即使以 Aas 的標準來看也是如此；______ 有些歷史學家把完工的建築視為與他原本提案完全不同的結構。", "opts": {"A": "by contrast,", "B": "in fact,", "C": "nevertheless,", "D": "in other words,"}, "optsZh": {"A": "相比之下，", "B": "事實上，", "C": "儘管如此，", "D": "換句話說，"}, "answer": "B", "expl": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail.", "explZh": ""}, {"id": "22.2", "label": "Mock 22.2", "n": 22, "concept": "Transitions: choose the logical connector that intensifies a claim about the extremity of a difference.", "vocab": false, "body": "Biographer Marcus Whitfield notes that playwright Odalys Ferreira frequently rewrote her plays after opening night. However, the differences between the 1965 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=premiere\" target=\"_blank\" rel=\"noopener\" data-w=\"premiere\" data-pos=\"v./n.\" data-en=\"to perform or show for the first time; a first performance\" data-zh=\"首演；首映\">premiere<\/a> script and the 1978 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publish\" target=\"_blank\" rel=\"noopener\" data-w=\"publish\" data-pos=\"v.\" data-en=\"to prepare and print a book, article, etc. for the public\" data-zh=\"出版；發表\">published<\/a> edition of her play Salt Water are extreme, even by Ferreira&#x27;s standards; ______ some critics regard the two versions as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=separate\" target=\"_blank\" rel=\"noopener\" data-w=\"separate\" data-pos=\"v.\" data-en=\"to divide or move things apart\" data-zh=\"分開；分離\">separate<\/a> plays.", "bodyPlain": "Biographer Marcus Whitfield notes that playwright Odalys Ferreira frequently rewrote her plays after opening night. However, the differences between the 1965 premiere script and the 1978 published edition of her play Salt Water are extreme, even by Ferreira's standards; ______ some critics regard the two versions as entirely separate plays.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "傳記作家 Marcus Whitfield 指出，劇作家 Odalys Ferreira 經常在首演後重寫她的劇本。然而，她的劇作《Salt Water》1965 年首演劇本與 1978 年出版版本之間的差異極大，即使以 Ferreira 的標準來看也是如此；______ 有些評論家把這兩個版本視為完全不同的劇作。", "opts": {"A": "by contrast,", "B": "in fact,", "C": "nevertheless,", "D": "in other words,"}, "optsZh": {"A": "相比之下，", "B": "事實上，", "C": "儘管如此，", "D": "換句話說，"}, "answer": "B", "expl": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail.", "explZh": ""}, {"id": "22.3", "label": "Mock 22.3", "n": 22, "concept": "Transitions: choose the logical connector that intensifies a claim about the extremity of a difference.", "vocab": false, "body": "Biographer Naledi Khumalo notes that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=composer\" target=\"_blank\" rel=\"noopener\" data-w=\"composer\" data-pos=\"n.\" data-en=\"a person who writes music\" data-zh=\"作曲家\">composer<\/a> Tobias Renner <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=habitually\" target=\"_blank\" rel=\"noopener\">habitually<\/a> reworked his symphonies for years after their first performance. However, the differences between the 1901 and the 1924 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=version\" target=\"_blank\" rel=\"noopener\" data-w=\"version\" data-pos=\"n.\" data-en=\"a form of something that is slightly different from others\" data-zh=\"版本\">versions<\/a> of his Symphony No. 3 are extreme, even by Renner&#x27;s standards; ______ some musicologists regard the two versions as fundamentally different compositions.", "bodyPlain": "Biographer Naledi Khumalo notes that composer Tobias Renner habitually reworked his symphonies for years after their first performance. However, the differences between the 1901 and the 1924 versions of his Symphony No. 3 are extreme, even by Renner's standards; ______ some musicologists regard the two versions as fundamentally different compositions.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "傳記作家 Naledi Khumalo 指出，作曲家 Tobias Renner 習慣在交響曲首演後的數年間持續修改。然而，他《第三號交響曲》1901 年與 1924 年版本之間的差異極大，即使以 Renner 的標準來看也是如此；______ 有些音樂學家把這兩個版本視為本質上不同的作品。", "opts": {"A": "by contrast,", "B": "in fact,", "C": "nevertheless,", "D": "in other words,"}, "optsZh": {"A": "相比之下，", "B": "事實上，", "C": "儘管如此，", "D": "換句話說，"}, "answer": "B", "expl": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail.", "explZh": ""}, {"id": "22.4", "label": "Mock 22.4", "n": 22, "concept": "Transitions: choose the logical connector that intensifies a claim about the extremity of a difference.", "vocab": false, "body": "Biographer Priya Deshmukh notes that painter Henrik Solberg often repainted sections of his canvases years after their first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a>. However, the differences between the 1889 exhibited version and the 1910 final version of his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">painting<\/a> Harbor at Dusk are extreme, even by Solberg&#x27;s standards; ______ some art <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> regard the two versions as two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=separate\" target=\"_blank\" rel=\"noopener\" data-w=\"separate\" data-pos=\"v.\" data-en=\"to divide or move things apart\" data-zh=\"分開；分離\">separate<\/a> paintings.", "bodyPlain": "Biographer Priya Deshmukh notes that painter Henrik Solberg often repainted sections of his canvases years after their first exhibition. However, the differences between the 1889 exhibited version and the 1910 final version of his painting Harbor at Dusk are extreme, even by Solberg's standards; ______ some art historians regard the two versions as two separate paintings.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "傳記作家 Priya Deshmukh 指出，畫家 Henrik Solberg 常在畫作首次展出多年後重畫部分畫面。然而，他的畫作《黃昏港口》1889 年展出版本與 1910 年最終版本之間的差異極大，即使以 Solberg 的標準來看也是如此；______ 有些藝術史學家把這兩個版本視為兩幅不同的畫作。", "opts": {"A": "by contrast,", "B": "in fact,", "C": "nevertheless,", "D": "in other words,"}, "optsZh": {"A": "相比之下，", "B": "事實上，", "C": "儘管如此，", "D": "換句話說，"}, "answer": "B", "expl": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail.", "explZh": ""}, {"id": "22.5", "label": "Mock 22.5", "n": 22, "concept": "Transitions: choose the logical connector that intensifies a claim about the extremity of a difference.", "vocab": false, "body": "Biographer Camille Duvall notes that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novelist\" target=\"_blank\" rel=\"noopener\" data-w=\"novelist\" data-pos=\"n.\" data-en=\"a person who writes novels\" data-zh=\"小說家\">novelist<\/a> Idris Bakr routinely revised his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a> long after their initial <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publication\" target=\"_blank\" rel=\"noopener\" data-w=\"publication\" data-pos=\"n.\" data-en=\"a book, magazine, or article that is printed; the act of publishing\" data-zh=\"出版品；發表\">publication<\/a>. However, the differences between the 1954 first edition and the 1971 revised edition of his novel The Long Season are extreme, even by Bakr&#x27;s standards; ______ some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=literary\" target=\"_blank\" rel=\"noopener\" data-w=\"literary\" data-pos=\"adj.\" data-en=\"relating to literature\" data-zh=\"文學的\">literary<\/a> scholars regard the two editions as entirely separate novels.", "bodyPlain": "Biographer Camille Duvall notes that novelist Idris Bakr routinely revised his manuscripts long after their initial publication. However, the differences between the 1954 first edition and the 1971 revised edition of his novel The Long Season are extreme, even by Bakr's standards; ______ some literary scholars regard the two editions as entirely separate novels.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "傳記作家 Camille Duvall 指出，小說家 Idris Bakr 習慣在手稿首次出版很久之後仍持續修訂。然而，他的小說《The Long Season》1954 年初版與 1971 年修訂版之間的差異極大，即使以 Bakr 的標準來看也是如此；______ 有些文學學者把這兩個版本視為完全不同的小說。", "opts": {"A": "by contrast,", "B": "in fact,", "C": "nevertheless,", "D": "in other words,"}, "optsZh": {"A": "相比之下，", "B": "事實上，", "C": "儘管如此，", "D": "換句話說，"}, "answer": "B", "expl": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail.", "explZh": ""}, {"id": "o23", "label": "Original Q23", "n": 23, "concept": "Transitions: choose the logical connector adding further support to a claim of unsurprising coincidence.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hindsight\" target=\"_blank\" rel=\"noopener\" data-w=\"hindsight\" data-pos=\"n.\" data-en=\"understanding of an event only after it has happened\" data-zh=\"事後的認識\">hindsight<\/a>, given the ideas about the natural world <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulating<\/a> among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coincidence\" target=\"_blank\" rel=\"noopener\" data-w=\"coincidence\" data-pos=\"n.\" data-en=\"a surprising situation where things happen together by chance\" data-zh=\"巧合\">coincidence<\/a>, ______, that Charles Darwin and Alfred Wallace arrived at the concept <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.", "bodyPlain": "In hindsight, given the ideas about the natural world circulating among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a coincidence, ______, that Charles Darwin and Alfred Wallace arrived at the concept independently. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "事後看來，考量到 1800 年代英國科學家之間流傳的自然界觀念，天擇理論是顯而易見的下一步。______，Charles Darwin 與 Alfred Wallace 各自獨立得出這個概念，可能並非巧合。確實，與孤獨天才的流行迷思相反，他們並不是第一個由多位學者同時平行研究而產生的典範轉移理論。", "opts": {"A": "however,", "B": "then,", "C": "moreover,", "D": "for example,"}, "optsZh": {"A": "然而，", "B": "那麼，", "C": "此外，", "D": "例如，"}, "answer": "B", "expl": "Because the theory was an obvious next step, it follows that the independent discovery was probably not a coincidence; 'then' signals this conclusion.", "explZh": "既然這個理論是顯而易見的下一步，那麼兩人各自發現它可能就不是巧合；「then」表示由此推得的結論。"}, {"id": "23.1", "label": "Mock 23.1", "n": 23, "concept": "Transitions: choose the logical connector adding further support to a claim of unsurprising coincidence.", "vocab": false, "body": "In hindsight, given the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=mathematical\" target=\"_blank\" rel=\"noopener\" data-w=\"mathematical\" data-pos=\"adj.\" data-en=\"relating to mathematics\" data-zh=\"數學的\">mathematical<\/a> techniques circulating among European scholars in the 1670s, the development of calculus was an obvious next step. It may not have been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coincidence\" target=\"_blank\" rel=\"noopener\" data-w=\"coincidence\" data-pos=\"n.\" data-en=\"a surprising situation where things happen together by chance\" data-zh=\"巧合\">coincidence<\/a>, ______, that Isaac Newton and Gottfried Leibniz arrived at the method <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foundation\" target=\"_blank\" rel=\"noopener\" data-w=\"foundation\" data-pos=\"n.\" data-en=\"the basis or starting point on which something is built\" data-zh=\"基礎\">foundational<\/a> mathematical idea to have emerged from multiple scholars working in parallel.", "bodyPlain": "In hindsight, given the mathematical techniques circulating among European scholars in the 1670s, the development of calculus was an obvious next step. It may not have been a coincidence, ______, that Isaac Newton and Gottfried Leibniz arrived at the method independently. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first foundational mathematical idea to have emerged from multiple scholars working in parallel.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "事後看來，考量到 1670 年代歐洲學者之間流傳的數學技巧，微積分的發展是顯而易見的下一步。______，Isaac Newton 與 Gottfried Leibniz 各自獨立得出這個方法，可能並非巧合。確實，與孤獨天才的流行迷思相反，他們並不是第一個由多位學者同時平行研究而產生的基礎數學概念。", "opts": {"A": "however,", "B": "then,", "C": "moreover,", "D": "for example,"}, "optsZh": {"A": "然而，", "B": "那麼，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence.", "explZh": ""}, {"id": "23.2", "label": "Mock 23.2", "n": 23, "concept": "Transitions: choose the logical connector adding further support to a claim of unsurprising coincidence.", "vocab": false, "body": "In hindsight, given the chemical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiments<\/a> circulating among researchers in the 1770s, the discovery of oxygen&#x27;s role in combustion was an obvious next step. It may not have been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coincidence\" target=\"_blank\" rel=\"noopener\" data-w=\"coincidence\" data-pos=\"n.\" data-en=\"a surprising situation where things happen together by chance\" data-zh=\"巧合\">coincidence<\/a>, ______, that Carl Wilhelm Scheele and Joseph Priestley isolated the gas <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foundation\" target=\"_blank\" rel=\"noopener\" data-w=\"foundation\" data-pos=\"n.\" data-en=\"the basis or starting point on which something is built\" data-zh=\"基礎\">foundational<\/a> scientific finding to have emerged from multiple scholars working in parallel.", "bodyPlain": "In hindsight, given the chemical experiments circulating among researchers in the 1770s, the discovery of oxygen's role in combustion was an obvious next step. It may not have been a coincidence, ______, that Carl Wilhelm Scheele and Joseph Priestley isolated the gas independently. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first foundational scientific finding to have emerged from multiple scholars working in parallel.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "事後看來，考量到 1770 年代研究人員之間流傳的化學實驗，發現氧在燃燒中的作用是顯而易見的下一步。______，Carl Wilhelm Scheele 與 Joseph Priestley 各自獨立分離出這種氣體，可能並非巧合。確實，與孤獨天才的流行迷思相反，他們並不是第一個由多位學者同時平行研究而產生的基礎科學發現。", "opts": {"A": "however,", "B": "then,", "C": "moreover,", "D": "for example,"}, "optsZh": {"A": "然而，", "B": "那麼，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence.", "explZh": ""}, {"id": "23.3", "label": "Mock 23.3", "n": 23, "concept": "Transitions: choose the logical connector adding further support to a claim of unsurprising coincidence.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hindsight\" target=\"_blank\" rel=\"noopener\" data-w=\"hindsight\" data-pos=\"n.\" data-en=\"understanding of an event only after it has happened\" data-zh=\"事後的認識\">hindsight<\/a>, given the astronomical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=observation\" target=\"_blank\" rel=\"noopener\" data-w=\"observation\" data-pos=\"n.\" data-en=\"the act of watching carefully; a remark based on it\" data-zh=\"觀察\">observations<\/a> circulating among scholars in the 1840s, the prediction of a new planet beyond Uranus was an obvious next step. It may not have been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coincidence\" target=\"_blank\" rel=\"noopener\" data-w=\"coincidence\" data-pos=\"n.\" data-en=\"a surprising situation where things happen together by chance\" data-zh=\"巧合\">coincidence<\/a>, ______, that Urbain Le Verrier and John Couch Adams calculated its position <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=independently\" target=\"_blank\" rel=\"noopener\" data-w=\"independently\" data-pos=\"adv.\" data-en=\"separately, without help from or connection to others\" data-zh=\"獨立地；各自地\">independently<\/a>. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major scientific prediction to have emerged from multiple scholars working in parallel.", "bodyPlain": "In hindsight, given the astronomical observations circulating among scholars in the 1840s, the prediction of a new planet beyond Uranus was an obvious next step. It may not have been a coincidence, ______, that Urbain Le Verrier and John Couch Adams calculated its position independently. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major scientific prediction to have emerged from multiple scholars working in parallel.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "事後看來，考量到 1840 年代學者之間流傳的天文觀測，預測天王星外還有一顆新行星是顯而易見的下一步。______，Urbain Le Verrier 與 John Couch Adams 各自獨立計算出它的位置，可能並非巧合。確實，與孤獨天才的流行迷思相反，他們並不是第一個由多位學者同時平行研究而產生的重大科學預測。", "opts": {"A": "however,", "B": "then,", "C": "moreover,", "D": "for example,"}, "optsZh": {"A": "然而，", "B": "那麼，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence.", "explZh": ""}, {"id": "23.4", "label": "Mock 23.4", "n": 23, "concept": "Transitions: choose the logical connector adding further support to a claim of unsurprising coincidence.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hindsight\" target=\"_blank\" rel=\"noopener\" data-w=\"hindsight\" data-pos=\"n.\" data-en=\"understanding of an event only after it has happened\" data-zh=\"事後的認識\">hindsight<\/a>, given the electrical <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experiment\" target=\"_blank\" rel=\"noopener\" data-w=\"experiment\" data-pos=\"v.\" data-en=\"to try new ideas or methods to see what happens\" data-zh=\"實驗；嘗試\">experiments<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulating<\/a> among inventors in the 1870s, the development of a practical telephone was an obvious next step. It may not have been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coincidence\" target=\"_blank\" rel=\"noopener\" data-w=\"coincidence\" data-pos=\"n.\" data-en=\"a surprising situation where things happen together by chance\" data-zh=\"巧合\">coincidence<\/a>, ______, that Alexander Graham Bell and Elisha Gray filed their patent claims within hours of each other. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major invention to have emerged from multiple inventors working in parallel.", "bodyPlain": "In hindsight, given the electrical experiments circulating among inventors in the 1870s, the development of a practical telephone was an obvious next step. It may not have been a coincidence, ______, that Alexander Graham Bell and Elisha Gray filed their patent claims within hours of each other. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major invention to have emerged from multiple inventors working in parallel.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "事後看來，考量到 1870 年代發明家之間流傳的電學實驗，發展出實用的電話是顯而易見的下一步。______，Alexander Graham Bell 與 Elisha Gray 在相隔僅數小時內提出專利申請，可能並非巧合。確實，與孤獨天才的流行迷思相反，他們並不是第一個由多位發明家同時平行研究而產生的重大發明。", "opts": {"A": "however,", "B": "then,", "C": "moreover,", "D": "for example,"}, "optsZh": {"A": "然而，", "B": "那麼，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence.", "explZh": ""}, {"id": "23.5", "label": "Mock 23.5", "n": 23, "concept": "Transitions: choose the logical connector adding further support to a claim of unsurprising coincidence.", "vocab": false, "body": "In <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hindsight\" target=\"_blank\" rel=\"noopener\" data-w=\"hindsight\" data-pos=\"n.\" data-en=\"understanding of an event only after it has happened\" data-zh=\"事後的認識\">hindsight<\/a>, given the genetic research <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulating<\/a> among <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=biologist\" target=\"_blank\" rel=\"noopener\" data-w=\"biologist\" data-pos=\"n.\" data-en=\"a scientist who studies living things\" data-zh=\"生物學家\">biologists<\/a> in the early 1950s, the discovery of DNA&#x27;s double-helix structure was an obvious next step. It may not have been a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=coincidence\" target=\"_blank\" rel=\"noopener\" data-w=\"coincidence\" data-pos=\"n.\" data-en=\"a surprising situation where things happen together by chance\" data-zh=\"巧合\">coincidence<\/a>, ______, that James Watson and Francis Crick reached their model around the same time that Rosalind Franklin&#x27;s data pointed toward a similar structure. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major biological breakthrough to have emerged from multiple researchers working in parallel.", "bodyPlain": "In hindsight, given the genetic research circulating among biologists in the early 1950s, the discovery of DNA's double-helix structure was an obvious next step. It may not have been a coincidence, ______, that James Watson and Francis Crick reached their model around the same time that Rosalind Franklin's data pointed toward a similar structure. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major biological breakthrough to have emerged from multiple researchers working in parallel.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "事後看來，考量到 1950 年代初生物學家之間流傳的遺傳研究，發現 DNA 的雙螺旋結構是顯而易見的下一步。______，James Watson 與 Francis Crick 提出他們的模型時，正好與 Rosalind Franklin 的數據指向類似結構的時間相近，可能並非巧合。確實，與孤獨天才的流行迷思相反，他們並不是第一個由多位研究人員同時平行研究而產生的重大生物學突破。", "opts": {"A": "however,", "B": "then,", "C": "moreover,", "D": "for example,"}, "optsZh": {"A": "然而，", "B": "那麼，", "C": "此外，", "D": "例如，"}, "answer": "C", "expl": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence.", "explZh": ""}, {"id": "o24", "label": "Original Q24", "n": 24, "concept": "Transitions: choose the logical connector that restates a technical claim in plainer terms.", "vocab": false, "body": "In a recent study, researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=examined\" target=\"_blank\" rel=\"noopener\">examined<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=sleeping\" target=\"_blank\" rel=\"noopener\">sleeping<\/a> and waking habits of a group of dairy cows to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> if the cows&#x27; patterns of activity suggested that the animals were diurnal, nocturnal, or crepuscular. ______ the researchers studied whether the cows were most active in the daytime (diurnal), nighttime (nocturnal), or at dawn and dusk (crepuscular).", "bodyPlain": "In a recent study, researchers examined the sleeping and waking habits of a group of dairy cows to determine if the cows' patterns of activity suggested that the animals were diurnal, nocturnal, or crepuscular. ______ the researchers studied whether the cows were most active in the daytime (diurnal), nighttime (nocturnal), or at dawn and dusk (crepuscular).", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "在最近的一項研究中，研究人員觀察一群乳牛的睡眠與清醒習慣，以判定牛的活動模式是否顯示這些動物屬於日行性、夜行性或晨昏性。______ 研究人員研究的是乳牛最活躍的時間是在白天（日行性）、夜晚（夜行性），還是黎明與黃昏（晨昏性）。", "opts": {"A": "Afterward,", "B": "In other words,", "C": "Additionally,", "D": "However,"}, "optsZh": {"A": "之後，", "B": "換句話說，", "C": "此外，", "D": "然而，"}, "answer": "B", "expl": "The second sentence restates the first in plain language by defining the three terms, so 'In other words.'", "explZh": "第二句用淺白的話重述第一句，並解釋三個術語，所以用「In other words」。"}, {"id": "24.1", "label": "Mock 24.1", "n": 24, "concept": "Transitions: choose the logical connector that restates a technical claim in plainer terms.", "vocab": false, "body": "In a recent study, researchers examined the vocalizations of a group of captive dolphins to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether their calls exhibited <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of individual signature patterns. ______ the researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> whether each dolphin produced a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinct\" target=\"_blank\" rel=\"noopener\" data-w=\"distinct\" data-pos=\"adj.\" data-en=\"clearly different or separate\" data-zh=\"不同的；明顯的\">distinct<\/a>, repeatable call that functioned like a name.", "bodyPlain": "In a recent study, researchers examined the vocalizations of a group of captive dolphins to determine whether their calls exhibited evidence of individual signature patterns. ______ the researchers investigated whether each dolphin p
