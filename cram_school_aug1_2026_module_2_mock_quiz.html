roduced a distinct, repeatable call that functioned like a name.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "在最近的一項研究中，研究人員分析一群圈養海豚的叫聲，以判定牠們的叫聲是否顯示個體專屬的標誌模式。______ 研究人員調查的是每隻海豚是否會發出獨特、可重複、功能像名字一樣的叫聲。", "opts": {"A": "Afterward,", "B": "In other words,", "C": "Additionally,", "D": "However,"}, "optsZh": {"A": "之後，", "B": "換句話說，", "C": "此外，", "D": "然而，"}, "answer": "B", "expl": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\"", "explZh": ""}, {"id": "24.2", "label": "Mock 24.2", "n": 24, "concept": "Transitions: choose the logical connector that restates a technical claim in plainer terms.", "vocab": false, "body": "In a recent study, researchers examined the foraging patterns of a colony of leafcutter ants to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether their trail-marking behavior <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibit\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibit\" data-pos=\"v.\" data-en=\"to show something publicly, especially in a museum\" data-zh=\"展出；展示\">exhibited<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of route optimization. ______ the researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> whether the ants gradually favored shorter, more efficient paths to food sources over time.", "bodyPlain": "In a recent study, researchers examined the foraging patterns of a colony of leafcutter ants to determine whether their trail-marking behavior exhibited evidence of route optimization. ______ the researchers investigated whether the ants gradually favored shorter, more efficient paths to food sources over time.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "在最近的一項研究中，研究人員觀察一群切葉蟻的覓食模式，以判定牠們標記路徑的行為是否顯示路線最佳化的跡象。______ 研究人員調查的是螞蟻是否會隨時間逐漸偏好較短、較有效率的覓食路徑。", "opts": {"A": "Afterward,", "B": "In other words,", "C": "Additionally,", "D": "However,"}, "optsZh": {"A": "之後，", "B": "換句話說，", "C": "此外，", "D": "然而，"}, "answer": "B", "expl": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\"", "explZh": ""}, {"id": "24.3", "label": "Mock 24.3", "n": 24, "concept": "Transitions: choose the logical connector that restates a technical claim in plainer terms.", "vocab": false, "body": "In a recent study, researchers examined the sleep patterns of a group of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=migratory\" target=\"_blank\" rel=\"noopener\" data-w=\"migratory\" data-pos=\"adj.\" data-en=\"moving from one region to another seasonally\" data-zh=\"遷徙的\">migratory<\/a> songbirds to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether their rest periods exhibited <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of unihemispheric sleep. ______ the researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> whether the birds could keep one half of the brain awake while the other half rested during flight.", "bodyPlain": "In a recent study, researchers examined the sleep patterns of a group of migratory songbirds to determine whether their rest periods exhibited evidence of unihemispheric sleep. ______ the researchers investigated whether the birds could keep one half of the brain awake while the other half rested during flight.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "在最近的一項研究中，研究人員觀察一群候鳥鳴禽的睡眠模式，以判定牠們的休息期是否顯示單半球睡眠的跡象。______ 研究人員調查的是這些鳥能否在飛行中讓半邊大腦保持清醒，而另一半休息。", "opts": {"A": "Afterward,", "B": "In other words,", "C": "Additionally,", "D": "However,"}, "optsZh": {"A": "之後，", "B": "換句話說，", "C": "此外，", "D": "然而，"}, "answer": "B", "expl": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\"", "explZh": ""}, {"id": "24.4", "label": "Mock 24.4", "n": 24, "concept": "Transitions: choose the logical connector that restates a technical claim in plainer terms.", "vocab": false, "body": "In a recent study, researchers examined the grooming behavior of a troop of wild baboons to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether social <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=interaction\" target=\"_blank\" rel=\"noopener\" data-w=\"interaction\" data-pos=\"n.\" data-en=\"the way things or people affect each other\" data-zh=\"交互作用；互動\">interactions<\/a> exhibited <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of reciprocal exchange. ______ the researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> whether baboons that groomed a particular troop member were more likely to receive grooming from that same individual later on.", "bodyPlain": "In a recent study, researchers examined the grooming behavior of a troop of wild baboons to determine whether social interactions exhibited evidence of reciprocal exchange. ______ the researchers investigated whether baboons that groomed a particular troop member were more likely to receive grooming from that same individual later on.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "在最近的一項研究中，研究人員觀察一群野生狒狒的理毛行為，以判定社交互動是否顯示互惠交換的跡象。______ 研究人員調查的是替某位群體成員理毛的狒狒，之後是否更可能得到同一隻狒狒的理毛回報。", "opts": {"A": "Afterward,", "B": "In other words,", "C": "Additionally,", "D": "However,"}, "optsZh": {"A": "之後，", "B": "換句話說，", "C": "此外，", "D": "然而，"}, "answer": "B", "expl": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\"", "explZh": ""}, {"id": "24.5", "label": "Mock 24.5", "n": 24, "concept": "Transitions: choose the logical connector that restates a technical claim in plainer terms.", "vocab": false, "body": "In a recent study, researchers examined the nest-building materials chosen by a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=population\" target=\"_blank\" rel=\"noopener\" data-w=\"population\" data-pos=\"n.\" data-en=\"the number of people living in a place\" data-zh=\"人口\">population<\/a> of urban crows to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determine<\/a> whether their selections exhibited <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=evidence\" target=\"_blank\" rel=\"noopener\" data-w=\"evidence\" data-pos=\"n.\" data-en=\"facts or signs that show something is true\" data-zh=\"證據\">evidence<\/a> of deliberate material preference. ______ the researchers <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=investigate\" target=\"_blank\" rel=\"noopener\" data-w=\"investigate\" data-pos=\"v.\" data-en=\"to examine something carefully to find out the truth\" data-zh=\"調查；研究\">investigated<\/a> whether the crows consistently chose certain materials over other, equally available options.", "bodyPlain": "In a recent study, researchers examined the nest-building materials chosen by a population of urban crows to determine whether their selections exhibited evidence of deliberate material preference. ______ the researchers investigated whether the crows consistently chose certain materials over other, equally available options.", "stem": "Which choice completes the text with the most logical transition?", "stemZh": "哪一個選項是最合乎邏輯的轉折詞？", "bodyZh": "在最近的一項研究中，研究人員觀察一群都市烏鴉選擇的築巢材料，以判定牠們的選擇是否顯示刻意偏好某些材料。______ 研究人員調查的是烏鴉是否會在其他同樣容易取得的選項中，一貫地選擇某些材料。", "opts": {"A": "Afterward,", "B": "In other words,", "C": "Additionally,", "D": "However,"}, "optsZh": {"A": "之後，", "B": "換句話說，", "C": "此外，", "D": "然而，"}, "answer": "B", "expl": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\"", "explZh": ""}, {"id": "o25", "label": "Original Q25", "n": 25, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a similarity between two things.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Earthquakes start at a point called a &quot;focus&quot; and spread out from there as <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=seismic\" target=\"_blank\" rel=\"noopener\" data-w=\"seismic\" data-pos=\"adj.\" data-en=\"relating to earthquakes\" data-zh=\"地震的\">seismic<\/a> waves.<br>- The two types of seismic waves that travel beneath Earth&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> are primary waves (P waves) and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=secondary\" target=\"_blank\" rel=\"noopener\" data-w=\"secondary\" data-pos=\"adj.\" data-en=\"less important than something else\" data-zh=\"次要的\">secondary<\/a> waves (S waves).<br>- P waves travel more quickly beneath Earth&#x27;s surface than do S waves.<br>- P waves compress and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expand\" target=\"_blank\" rel=\"noopener\" data-w=\"expand\" data-pos=\"v.\" data-en=\"to become or make larger\" data-zh=\"擴展\">expand<\/a> the ground, causing it to move backward and forward.<br>- S waves cause the ground to move from side to side.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Earthquakes start at a point called a \"focus\" and spread out from there as seismic waves.\n- The two types of seismic waves that travel beneath Earth's surface are primary waves (P waves) and secondary waves (S waves).\n- P waves travel more quickly beneath Earth's surface than do S waves.\n- P waves compress and expand the ground, causing it to move backward and forward.\n- S waves cause the ground to move from side to side.", "stem": "The student wants to emphasize a similarity between P waves and S waves. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調 P 波與 S 波的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 地震從一個稱為「震源」的點開始，並以地震波的形式從那裡向外擴散。\n- 在地表下傳播的兩種地震波是初波（P 波）與次波（S 波）。\n- P 波在地表下的傳播速度比 S 波快。\n- P 波會壓縮並擴張地面，使地面前後移動。\n- S 波會使地面左右移動。", "opts": {"A": "P waves and S waves both travel beneath Earth's surface, causing the ground to move.", "B": "P waves travel away from an earthquake's starting point at a higher rate of speed than do S waves.", "C": "Spreading out from the focus of an earthquake, P waves move the ground backward and forward.", "D": "Although P waves and S waves start at the same point, they behave very differently."}, "optsZh": {"A": "P 波與 S 波都在地表下傳播，並使地面移動。", "B": "P 波從地震起始點向外傳播的速度比 S 波快。", "C": "從地震震源向外擴散，P 波使地面前後移動。", "D": "雖然 P 波與 S 波從同一點開始，但它們的表現非常不同。"}, "answer": "A", "expl": "Choice A states what both wave types share: they travel beneath Earth's surface and make the ground move.", "explZh": "A 指出兩種波的共同點：都在地表下傳播，並使地面移動。"}, {"id": "25.1", "label": "Mock 25.1", "n": 25, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a similarity between two things.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Hurricanes and typhoons are both large rotating storm systems that form over warm ocean water.<br>- Hurricanes form over the Atlantic and northeastern Pacific; typhoons form over the northwestern Pacific.<br>- Hurricanes are categorized using the Saffir-Simpson scale; typhoons are categorized using a different regional scale.<br>- Both storm types draw energy from warm ocean <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=temperature\" target=\"_blank\" rel=\"noopener\" data-w=\"temperature\" data-pos=\"n.\" data-en=\"how hot or cold something is\" data-zh=\"溫度\">temperatures<\/a>.<br>- Both storm types can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> sustained winds exceeding 150 miles per hour.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Hurricanes and typhoons are both large rotating storm systems that form over warm ocean water.\n- Hurricanes form over the Atlantic and northeastern Pacific; typhoons form over the northwestern Pacific.\n- Hurricanes are categorized using the Saffir-Simpson scale; typhoons are categorized using a different regional scale.\n- Both storm types draw energy from warm ocean surface temperatures.\n- Both storm types can produce sustained winds exceeding 150 miles per hour.", "stem": "The student wants to emphasize a similarity between hurricanes and typhoons. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調颶風與颱風的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 颶風與颱風都是在溫暖海面上形成的大型旋轉風暴系統。\n- 颶風形成於大西洋與東北太平洋；颱風形成於西北太平洋。\n- 颶風以薩菲爾-辛普森等級分類；颱風則以另一套區域等級分類。\n- 兩種風暴都從溫暖的海面溫度中獲取能量。\n- 兩種風暴都可能產生每小時超過 150 英里的持續風速。", "opts": {"A": "Hurricanes and typhoons are both large rotating storm systems that draw their energy from warm ocean surface temperatures.", "B": "Hurricanes form over the Atlantic and northeastern Pacific, while typhoons form over the northwestern Pacific Ocean.", "C": "Typhoons are, unlike hurricanes, categorized using a regional intensity scale rather than the Saffir-Simpson scale.", "D": "Sustained winds exceeding 150 miles per hour occur in both hurricanes and typhoons, though the two form in different ocean basins."}, "optsZh": {"A": "颶風與颱風都是從溫暖海面溫度中獲取能量的大型旋轉風暴系統。", "B": "颶風形成於大西洋與東北太平洋，而颱風形成於西北太平洋。", "C": "颱風與颶風不同，是以區域強度等級而非薩菲爾-辛普森等級分類。", "D": "颶風與颱風都會出現每小時超過 150 英里的持續風速，雖然兩者形成於不同的海洋盆地。"}, "answer": "A", "expl": "Choice A states a shared feature as its main point without also foregrounding a difference.", "explZh": ""}, {"id": "25.2", "label": "Mock 25.2", "n": 25, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a similarity between two things.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Cellos and double basses are both string <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instruments<\/a> played with a bow.<br>- Cellos are tuned in fifths; double basses are tuned in fourths.<br>- Cellos are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=typically\" target=\"_blank\" rel=\"noopener\" data-w=\"typically\" data-pos=\"adv.\" data-en=\"usually; in most cases\" data-zh=\"通常；一般而言\">typically<\/a> played while seated with the instrument between the knees; double basses are typically played standing or on a stool.<br>- Both instruments have four main strings in their standard configuration.<br>- Both instruments provide the bass <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foundation\" target=\"_blank\" rel=\"noopener\" data-w=\"foundation\" data-pos=\"n.\" data-en=\"the basis or starting point on which something is built\" data-zh=\"基礎\">foundation<\/a> in an <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orchestral\" target=\"_blank\" rel=\"noopener\" data-w=\"orchestral\" data-pos=\"adj.\" data-en=\"written for or played by an orchestra\" data-zh=\"管弦樂的\">orchestral<\/a> string section.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Cellos and double basses are both string instruments played with a bow.\n- Cellos are tuned in fifths; double basses are tuned in fourths.\n- Cellos are typically played while seated with the instrument between the knees; double basses are typically played standing or on a stool.\n- Both instruments have four main strings in their standard configuration.\n- Both instruments provide the bass foundation in an orchestral string section.", "stem": "The student wants to emphasize a similarity between cellos and double basses. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調大提琴與低音大提琴的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 大提琴與低音大提琴都是用弓演奏的弦樂器。\n- 大提琴以五度定弦；低音大提琴以四度定弦。\n- 大提琴通常坐著演奏，樂器夾在雙膝之間；低音大提琴通常站著或坐在高凳上演奏。\n- 兩種樂器在標準配置中都有四條主弦。\n- 兩種樂器都在管弦樂團的弦樂組中提供低音基礎。", "opts": {"A": "Cellos and double basses both provide the bass foundation in an orchestral string section.", "B": "Cellos are tuned in fifths, while double basses are tuned in fourths.", "C": "Double basses are typically played standing, unlike cellos, which are played seated.", "D": "Although cellos and double basses are tuned differently, both instruments have four main strings."}, "optsZh": {"A": "大提琴與低音大提琴都在管弦樂團弦樂組中提供低音基礎。", "B": "大提琴以五度定弦，而低音大提琴以四度定弦。", "C": "低音大提琴通常站著演奏，不像大提琴是坐著演奏。", "D": "雖然大提琴與低音大提琴的定弦方式不同，但兩種樂器都有四條主弦。"}, "answer": "A", "expl": "Choice A states a shared feature as its main point without also foregrounding a difference.", "explZh": ""}, {"id": "25.3", "label": "Mock 25.3", "n": 25, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a similarity between two things.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Octopuses and cuttlefish are both cephalopods capable of rapidly changing the color and texture of their skin.<br>- Octopuses have eight arms; cuttlefish have eight arms plus two longer feeding tentacles.<br>- Octopuses generally lack an internal shell; cuttlefish have an internal <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> called a cuttlebone.<br>- Both animals use <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=specialize\" target=\"_blank\" rel=\"noopener\" data-w=\"specialize\" data-pos=\"v.\" data-en=\"to focus on one particular area of work\" data-zh=\"專門從事\">specialized<\/a> skin cells called chromatophores to change color almost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instant\" target=\"_blank\" rel=\"noopener\" data-w=\"instant\" data-pos=\"adj.\" data-en=\"happening immediately\" data-zh=\"即時的；立即的\">instantly<\/a>.<br>- Octopuses are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=typically\" target=\"_blank\" rel=\"noopener\" data-w=\"typically\" data-pos=\"adv.\" data-en=\"usually; in most cases\" data-zh=\"通常；一般而言\">typically<\/a> solitary, while cuttlefish are sometimes found in small groups.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Octopuses and cuttlefish are both cephalopods capable of rapidly changing the color and texture of their skin.\n- Octopuses have eight arms; cuttlefish have eight arms plus two longer feeding tentacles.\n- Octopuses generally lack an internal shell; cuttlefish have an internal structure called a cuttlebone.\n- Both animals use specialized skin cells called chromatophores to change color almost instantly.\n- Octopuses are typically solitary, while cuttlefish are sometimes found in small groups.", "stem": "The student wants to emphasize a similarity between octopuses and cuttlefish. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調章魚與烏賊的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 章魚與烏賊都是能迅速改變皮膚顏色與紋理的頭足類動物。\n- 章魚有八隻腕；烏賊有八隻腕加上兩條較長的捕食觸腕。\n- 章魚通常沒有內殼；烏賊有一種稱為烏賊骨的內部構造。\n- 兩種動物都使用稱為色素細胞的特化皮膚細胞，幾乎能瞬間改變顏色。\n- 章魚通常獨居，而烏賊有時會小群出現。", "opts": {"A": "Octopuses and cuttlefish both use specialized skin cells called chromatophores to change color almost instantly.", "B": "Octopuses have eight arms, while cuttlefish have eight arms plus two longer feeding tentacles.", "C": "Cuttlefish, unlike octopuses, have an internal structure called a cuttlebone.", "D": "Although octopuses are typically solitary, cuttlefish are sometimes found in small groups."}, "optsZh": {"A": "章魚與烏賊都使用稱為色素細胞的特化皮膚細胞，幾乎能瞬間改變顏色。", "B": "章魚有八隻腕，而烏賊有八隻腕加上兩條較長的捕食觸腕。", "C": "烏賊與章魚不同，有一種稱為烏賊骨的內部構造。", "D": "雖然章魚通常獨居，但烏賊有時會小群出現。"}, "answer": "A", "expl": "Choice A states a shared feature as its main point without also foregrounding a difference.", "explZh": ""}, {"id": "25.4", "label": "Mock 25.4", "n": 25, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a similarity between two things.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Maple syrup and agave syrup are both natural liquid sweeteners <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=derive\" target=\"_blank\" rel=\"noopener\" data-w=\"derive\" data-pos=\"v.\" data-en=\"to get or develop something from a source\" data-zh=\"取得；推導出\">derived<\/a> from plants.<br>- Maple syrup is made by boiling down the sap of maple trees; agave syrup is made by processing the sap of the agave plant.<br>- Maple syrup has a moderate glycemic index; agave syrup has a lower glycemic index.<br>- Both sweeteners can be substituted for refined sugar in most baking recipes.<br>- Maple syrup is primarily <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produced<\/a> in North America; agave syrup is primarily produced in Mexico.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Maple syrup and agave syrup are both natural liquid sweeteners derived from plants.\n- Maple syrup is made by boiling down the sap of maple trees; agave syrup is made by processing the sap of the agave plant.\n- Maple syrup has a moderate glycemic index; agave syrup has a lower glycemic index.\n- Both sweeteners can be substituted for refined sugar in most baking recipes.\n- Maple syrup is primarily produced in North America; agave syrup is primarily produced in Mexico.", "stem": "The student wants to emphasize a similarity between maple syrup and agave syrup. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調楓糖漿與龍舌蘭糖漿的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 楓糖漿與龍舌蘭糖漿都是從植物提取的天然液態甜味劑。\n- 楓糖漿是熬煮楓樹樹液製成的；龍舌蘭糖漿是加工龍舌蘭植物的汁液製成的。\n- 楓糖漿的升糖指數中等；龍舌蘭糖漿的升糖指數較低。\n- 兩種甜味劑在大多數烘焙食譜中都能取代精製糖。\n- 楓糖漿主要產於北美洲；龍舌蘭糖漿主要產於墨西哥。", "opts": {"A": "Maple syrup and agave syrup can both be substituted for refined sugar in most baking recipes.", "B": "Maple syrup is made from tree sap, while agave syrup is made from the sap of the agave plant.", "C": "Agave syrup has a lower glycemic index than maple syrup does.", "D": "Although maple syrup is produced mainly in North America, agave syrup is produced mainly in Mexico."}, "optsZh": {"A": "楓糖漿與龍舌蘭糖漿在大多數烘焙食譜中都能取代精製糖。", "B": "楓糖漿是用樹液製成，而龍舌蘭糖漿是用龍舌蘭植物的汁液製成。", "C": "龍舌蘭糖漿的升糖指數比楓糖漿低。", "D": "楓糖漿主要產於北美洲，而龍舌蘭糖漿主要產於墨西哥。"}, "answer": "A", "expl": "Choice A states a shared feature as its main point without also foregrounding a difference.", "explZh": ""}, {"id": "25.5", "label": "Mock 25.5", "n": 25, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a similarity between two things.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Solar panels and wind turbines are both renewable energy <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=technology\" target=\"_blank\" rel=\"noopener\" data-w=\"technology\" data-pos=\"n.\" data-en=\"scientific knowledge used to make tools and machines\" data-zh=\"科技；技術\">technologies<\/a> that generate <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=electricity\" target=\"_blank\" rel=\"noopener\" data-w=\"electricity\" data-pos=\"n.\" data-en=\"a form of energy used for light, heat, and power\" data-zh=\"電；電力\">electricity<\/a> without burning fossil fuels.<br>- Solar panels convert sunlight directly into electricity; wind turbines convert the kinetic energy of moving air.<br>- Solar panels produce more consistently during daylight hours; wind turbines can generate power at any time of day.<br>- Both technologies require little water to operate compared with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> power plants.<br>- Solar panel <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=installation\" target=\"_blank\" rel=\"noopener\" data-w=\"installation\" data-pos=\"n.\" data-en=\"a large artwork built for a particular space\" data-zh=\"裝置藝術\">installations<\/a> are often placed on rooftops; wind turbines are typically installed in open, elevated areas.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Solar panels and wind turbines are both renewable energy technologies that generate electricity without burning fossil fuels.\n- Solar panels convert sunlight directly into electricity; wind turbines convert the kinetic energy of moving air.\n- Solar panels produce more consistently during daylight hours; wind turbines can generate power at any time of day.\n- Both technologies require little water to operate compared with traditional power plants.\n- Solar panel installations are often placed on rooftops; wind turbines are typically installed in open, elevated areas.", "stem": "The student wants to emphasize a similarity between solar panels and wind turbines. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想強調太陽能板與風力渦輪機的相似之處。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 太陽能板與風力渦輪機都是不燃燒化石燃料就能發電的再生能源技術。\n- 太陽能板直接將陽光轉換為電力；風力渦輪機則轉換流動空氣的動能。\n- 太陽能板在白天的發電較穩定；風力渦輪機在一天中任何時間都能發電。\n- 與傳統發電廠相比，兩種技術運作時都只需要很少的水。\n- 太陽能板通常裝在屋頂上；風力渦輪機通常裝在開闊的高處。", "opts": {"A": "Solar panels and wind turbines both require little water to operate compared with traditional power plants.", "B": "Solar panels convert sunlight into electricity, while wind turbines convert the kinetic energy of moving air.", "C": "Wind turbines, unlike solar panels, can generate power at any time of day.", "D": "Although solar panels are often installed on rooftops, wind turbines are typically installed in open, elevated areas."}, "optsZh": {"A": "與傳統發電廠相比，太陽能板與風力渦輪機運作時都只需要很少的水。", "B": "太陽能板將陽光轉換為電力，而風力渦輪機則轉換流動空氣的動能。", "C": "風力渦輪機與太陽能板不同，在一天中任何時間都能發電。", "D": "雖然太陽能板通常裝在屋頂上，但風力渦輪機通常裝在開闊的高處。"}, "answer": "A", "expl": "Choice A states a shared feature as its main point without also foregrounding a difference.", "explZh": ""}, {"id": "o26", "label": "Original Q26", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies which classification category a specific example falls into.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The US Fish and Wildlife Service (FWS) keeps a list of all at-risk <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=species\" target=\"_blank\" rel=\"noopener\" data-w=\"species\" data-pos=\"n.\" data-en=\"a group of living things of the same kind\" data-zh=\"物種\">species<\/a>.<br>- Species on the list are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classified<\/a> as either <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=endangered\" target=\"_blank\" rel=\"noopener\" data-w=\"endangered\" data-pos=\"adj.\" data-en=\"at risk of disappearing completely\" data-zh=\"瀕臨絕種的\">endangered<\/a> or threatened.<br>- A species that is in danger of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extinction\" target=\"_blank\" rel=\"noopener\" data-w=\"extinction\" data-pos=\"n.\" data-en=\"the dying out of a whole species\" data-zh=\"滅絕\">extinction<\/a> throughout most or all of its range is classified as endangered.<br>- A species that is likely to soon become endangered is classified as threatened.<br>- The California red-legged frog (Rana draytonii) is likely to soon become endangered, according to the FWS.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The US Fish and Wildlife Service (FWS) keeps a list of all at-risk species.\n- Species on the list are classified as either endangered or threatened.\n- A species that is in danger of extinction throughout most or all of its range is classified as endangered.\n- A species that is likely to soon become endangered is classified as threatened.\n- The California red-legged frog (Rana draytonii) is likely to soon become endangered, according to the FWS.", "stem": "The student wants to indicate the California red-legged frog's FWS classification category. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出加州紅腿蛙在 FWS 的分類類別。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 美國魚類及野生動物管理局（FWS）保有一份所有瀕危風險物種的名單。\n- 名單上的物種被分類為瀕危（endangered）或受威脅（threatened）。\n- 在其大部分或全部分布範圍內面臨滅絕危險的物種，被分類為瀕危。\n- 可能很快會變成瀕危的物種，被分類為受威脅。\n- 根據 FWS，加州紅腿蛙（Rana draytonii）可能很快會變成瀕危。", "opts": {"A": "Species on the FWS list, which includes the California red-legged frog (Rana draytonii), are classified as either endangered or threatened.", "B": "The California red-legged frog (Rana draytonii) appears on the FWS list of at-risk species.", "C": "According to the FWS, the California red-legged frog is in the endangered category, in danger of extinction throughout most or all of its range.", "D": "Likely to soon become endangered, the California red-legged frog is classified as threatened by the FWS."}, "optsZh": {"A": "FWS 名單（包括加州紅腿蛙）上的物種被分類為瀕危或受威脅。", "B": "加州紅腿蛙（Rana draytonii）出現在 FWS 的瀕危風險物種名單上。", "C": "根據 FWS，加州紅腿蛙屬於瀕危類別，在其大部分或全部分布範圍內面臨滅絕危險。", "D": "可能很快會變成瀕危，加州紅腿蛙被 FWS 分類為受威脅。"}, "answer": "D", "expl": "The frog is 'likely to soon become endangered,' which is the definition of 'threatened'; D states this category.", "explZh": "這種蛙「可能很快變成瀕危」，正是「threatened（易危）」的定義，D 清楚說明其分類。"}, {"id": "26.1", "label": "Mock 26.1", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies which classification category a specific example falls into.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The International Union for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">Conservation<\/a> of Nature (IUCN) maintains a Red List of species conservation status.<br>- Species are <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classified<\/a> in several <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=category\" target=\"_blank\" rel=\"noopener\" data-w=\"category\" data-pos=\"n.\" data-en=\"a group of things that share similar qualities\" data-zh=\"類別；範疇\">categories<\/a>, including &quot;Vulnerable&quot; and &quot;Endangered.&quot;<br>- A species facing a high risk of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extinction\" target=\"_blank\" rel=\"noopener\" data-w=\"extinction\" data-pos=\"n.\" data-en=\"the dying out of a whole species\" data-zh=\"滅絕\">extinction<\/a> in the wild is classified as Vulnerable.<br>- A species facing a very high risk of extinction in the wild is classified as Endangered.<br>- The Sumatran orangutan faces an extremely high risk of extinction in the wild, according to the IUCN.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The International Union for Conservation of Nature (IUCN) maintains a Red List of species conservation status.\n- Species are classified in several categories, including \"Vulnerable\" and \"Endangered.\"\n- A species facing a high risk of extinction in the wild is classified as Vulnerable.\n- A species facing a very high risk of extinction in the wild is classified as Endangered.\n- The Sumatran orangutan faces an extremely high risk of extinction in the wild, according to the IUCN.", "stem": "The student wants to indicate the Sumatran orangutan's IUCN classification category. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出蘇門答臘紅毛猩猩在 IUCN 的分類類別。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 國際自然保護聯盟（IUCN）維護一份記錄物種保育狀態的紅色名錄。\n- 物種被分類為幾個等級，包括「易危」與「瀕危」。\n- 在野外面臨高度滅絕風險的物種，被分類為易危。\n- 在野外面臨極高度滅絕風險的物種，被分類為瀕危。\n- 根據 IUCN，蘇門答臘紅毛猩猩在野外面臨極高的滅絕風險。", "opts": {"A": "Species on the IUCN Red List, which includes the Sumatran orangutan, are classified in several categories.", "B": "The Sumatran orangutan appears on the IUCN Red List of species facing conservation concern.", "C": "According to the IUCN, a species facing a high risk of extinction in the wild is classified as Vulnerable.", "D": "Facing an extremely high risk of extinction in the wild, the Sumatran orangutan is classified as Endangered by the IUCN."}, "optsZh": {"A": "IUCN 紅色名錄（包括蘇門答臘紅毛猩猩）上的物種被分為幾個等級。", "B": "蘇門答臘紅毛猩猩出現在 IUCN 保育關注物種的紅色名錄上。", "C": "根據 IUCN，在野外面臨高度滅絕風險的物種被分類為易危。", "D": "在野外面臨極高的滅絕風險，蘇門答臘紅毛猩猩被 IUCN 分類為瀕危。"}, "answer": "D", "expl": "Choice D states the specific classification the frog example falls into, matching the notes' criterion.", "explZh": ""}, {"id": "26.2", "label": "Mock 26.2", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies which classification category a specific example falls into.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> weather service <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> winter storm warnings into two levels: &quot;Advisory&quot; and &quot;Warning.&quot;<br>- An Advisory is issued when snowfall is expected to cause <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> inconvenience but not a serious hazard.<br>- A Warning is issued when snowfall is expected to create a serious hazard to life and property.<br>- Meteorologists <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=forecast\" target=\"_blank\" rel=\"noopener\" data-w=\"forecast\" data-pos=\"n.\" data-en=\"a statement of what is expected to happen in the future\" data-zh=\"預測\">forecast<\/a> that the approaching storm will drop enough snow to create a serious hazard to life and property in the region.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- A national weather service classifies winter storm warnings into two levels: \"Advisory\" and \"Warning.\"\n- An Advisory is issued when snowfall is expected to cause significant inconvenience but not a serious hazard.\n- A Warning is issued when snowfall is expected to create a serious hazard to life and property.\n- Meteorologists forecast that the approaching storm will drop enough snow to create a serious hazard to life and property in the region.", "stem": "The student wants to indicate which classification level the approaching storm falls into. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出即將來臨的風暴屬於哪一個分類等級。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 某國家氣象局將冬季風暴警報分為兩個等級：「特報」（Advisory）與「警報」（Warning）。\n- 預期降雪會造成重大不便但不構成嚴重危險時，發布特報。\n- 預期降雪會對生命財產造成嚴重危險時，發布警報。\n- 氣象學家預測，即將來臨的風暴降雪量將足以對該地區的生命財產造成嚴重危險。", "opts": {"A": "The national weather service, which issues both Advisories and Warnings, classifies winter storms into two levels.", "B": "The approaching storm has been forecast by meteorologists to drop significant snowfall on the region.", "C": "According to the weather service, an Advisory is issued when snowfall causes significant inconvenience but not a serious hazard.", "D": "Expected to create a serious hazard to life and property, the approaching storm has been classified as a Warning."}, "optsZh": {"A": "同時發布特報與警報的國家氣象局將冬季風暴分為兩個等級。", "B": "氣象學家預測即將來臨的風暴會在該地區降下大量的雪。", "C": "根據氣象局，當降雪造成重大不便但不構成嚴重危險時，會發布特報。", "D": "預計會造成生命財產的嚴重危險，即將來臨的風暴已被列為警報等級。"}, "answer": "D", "expl": "Choice D states the specific classification the storm falls into, matching the notes' criterion.", "explZh": ""}, {"id": "26.3", "label": "Mock 26.3", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies which classification category a specific example falls into.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- A city&#x27;s building code <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> structural repairs as either &quot;Minor&quot; or &quot;Major.&quot;<br>- A Minor repair does not affect a building&#x27;s structural load-bearing capacity.<br>- A Major repair does affect a building&#x27;s structural load-bearing capacity.<br>- Inspectors <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that replacing the cracked support beam in the old warehouse would affect the building&#x27;s structural load-bearing capacity.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- A city's building code classifies structural repairs as either \"Minor\" or \"Major.\"\n- A Minor repair does not affect a building's structural load-bearing capacity.\n- A Major repair does affect a building's structural load-bearing capacity.\n- Inspectors determined that replacing the cracked support beam in the old warehouse would affect the building's structural load-bearing capacity.", "stem": "The student wants to indicate which classification the beam replacement falls into under the building code. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出依建築法規，更換支撐樑屬於哪一個類別。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 某城市的建築法規將結構修繕分為「小型」或「大型」。\n- 小型修繕不影響建築的結構承重能力。\n- 大型修繕會影響建築的結構承重能力。\n- 檢查人員判定，更換舊倉庫中有裂縫的支撐樑會影響建築的結構承重能力。", "opts": {"A": "The city's building code, which inspectors must follow, classifies structural repairs into two categories.", "B": "Inspectors examined the cracked support beam in the old warehouse as part of a routine inspection.", "C": "According to the building code, a Minor repair does not affect a building's structural load-bearing capacity.", "D": "Affecting the building's structural load-bearing capacity, the beam replacement is classified as a Major repair under the code."}, "optsZh": {"A": "檢查人員必須遵守的城市建築法規將結構修繕分為兩類。", "B": "檢查人員在例行檢查中檢視了舊倉庫中有裂縫的支撐樑。", "C": "根據建築法規，小型修繕不影響建築的結構承重能力。", "D": "由於會影響建築的結構承重能力，更換支撐樑依法規被分類為大型修繕。"}, "answer": "D", "expl": "Choice D states the specific classification the repair falls into, matching the notes' criterion.", "explZh": ""}, {"id": "26.4", "label": "Mock 26.4", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies which classification category a specific example falls into.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- A hospital&#x27;s triage system sorts incoming patients into &quot;Urgent&quot; and &quot;Non-Urgent&quot; categories.<br>- A patient is classified as Urgent if their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">condition<\/a> could worsen <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significantly<\/a> without <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=treatment\" target=\"_blank\" rel=\"noopener\" data-w=\"treatment\" data-pos=\"n.\" data-en=\"medical care for an illness\" data-zh=\"治療\">treatment<\/a> within the hour.<br>- A patient is classified as Non-Urgent if their condition is unlikely to worsen significantly without immediate treatment.<br>- Physicians <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determined<\/a> that a patient&#x27;s condition could worsen significantly without treatment within the hour.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- A hospital's triage system sorts incoming patients into \"Urgent\" and \"Non-Urgent\" categories.\n- A patient is classified as Urgent if their condition could worsen significantly without treatment within the hour.\n- A patient is classified as Non-Urgent if their condition is unlikely to worsen significantly without immediate treatment.\n- Physicians determined that a patient's condition could worsen significantly without treatment within the hour.", "stem": "The student wants to indicate which triage category the patient falls into. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出這位病患屬於哪一個檢傷類別。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 某醫院的檢傷系統將來診病患分為「緊急」與「非緊急」兩類。\n- 若病患的狀況在一小時內未接受治療可能明顯惡化，就被分類為緊急。\n- 若病患的狀況在未立即治療的情況下不太可能明顯惡化，就被分類為非緊急。\n- 醫師判定某位病患的狀況在一小時內未接受治療可能明顯惡化。", "opts": {"A": "The hospital's triage system, which physicians rely on daily, sorts patients into two categories.", "B": "Physicians examined the patient shortly after arrival at the hospital.", "C": "According to the triage system, a patient is classified as Non-Urgent if immediate treatment is not required.", "D": "Likely to worsen significantly without treatment within the hour, the patient is classified as Urgent."}, "optsZh": {"A": "醫師每天依賴的醫院檢傷系統將病患分為兩類。", "B": "醫師在病患抵達醫院後不久進行了檢查。", "C": "根據檢傷系統，若不需要立即治療，病患被分類為非緊急。", "D": "在一小時內未接受治療可能明顯惡化，這位病患被分類為緊急。"}, "answer": "D", "expl": "Choice D states the specific classification the patient falls into, matching the notes' criterion.", "explZh": ""}, {"id": "26.5", "label": "Mock 26.5", "n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies which classification category a specific example falls into.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- A <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=national\" target=\"_blank\" rel=\"noopener\" data-w=\"national\" data-pos=\"adj.\" data-en=\"relating to a whole country\" data-zh=\"國家的；全國的\">national<\/a> parks agency <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=classify\" target=\"_blank\" rel=\"noopener\" data-w=\"classify\" data-pos=\"v.\" data-en=\"to arrange in groups by type\" data-zh=\"分類\">classifies<\/a> hiking trails as either &quot;Easy&quot; or &quot;Strenuous.&quot;<br>- An Easy trail has a total <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elevation\" target=\"_blank\" rel=\"noopener\" data-w=\"elevation\" data-pos=\"n.\" data-en=\"the height of a place above sea level\" data-zh=\"海拔；高度\">elevation<\/a> gain of less than 500 feet.<br>- A Strenuous trail has a total elevation gain of 500 feet or more.<br>- Park surveyors measured the new ridge trail&#x27;s total elevation gain at 1,200 feet.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- A national parks agency classifies hiking trails as either \"Easy\" or \"Strenuous.\"\n- An Easy trail has a total elevation gain of less than 500 feet.\n- A Strenuous trail has a total elevation gain of 500 feet or more.\n- Park surveyors measured the new ridge trail's total elevation gain at 1,200 feet.", "stem": "The student wants to indicate which classification the new ridge trail falls into. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想指出新的山脊步道屬於哪一個分類。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 某國家公園管理單位將健行步道分為「輕鬆」或「費力」。\n- 輕鬆步道的總爬升高度低於 500 英尺。\n- 費力步道的總爬升高度為 500 英尺以上。\n- 公園測量人員測得新的山脊步道總爬升高度為 1,200 英尺。", "opts": {"A": "The national parks agency, which maintains the new ridge trail, classifies hiking trails into two categories.", "B": "Park surveyors recently completed measuring the new ridge trail's total elevation gain.", "C": "According to the agency, an Easy trail has a total elevation gain of less than 500 feet.", "D": "With a total elevation gain of 1,200 feet, the new ridge trail is classified as Strenuous by the agency."}, "optsZh": {"A": "負責維護新山脊步道的國家公園管理單位將健行步道分為兩類。", "B": "公園測量人員最近完成了新山脊步道總爬升高度的測量。", "C": "根據該管理單位，輕鬆步道的總爬升高度低於 500 英尺。", "D": "總爬升高度達 1,200 英尺，新的山脊步道被該管理單位分類為費力。"}, "answer": "D", "expl": "Choice D states the specific classification the trail falls into, matching the notes' criterion.", "explZh": ""}, {"id": "o27", "label": "Original Q27", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that makes a generalization following a \"most, but some\" pattern.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> Arab dhow was a sailing vessel distinguishable by its triangular sails and stitched hull <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=construction\" target=\"_blank\" rel=\"noopener\" data-w=\"construction\" data-pos=\"n.\" data-en=\"the process of building something\" data-zh=\"建造；營建\">construction<\/a>.<br>- Dhows were used primarily for trade along the coasts of Arab, South Asian, and East African <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=country\" target=\"_blank\" rel=\"noopener\" data-w=\"country\" data-pos=\"n.\" data-en=\"an area of land with its own government; a nation\" data-zh=\"國家\">countries<\/a>.<br>- Contemporary shipbuilders in Oman use a mix of modern and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> materials to build replicas of ancient dhows.<br>- Most of the materials used are traditional.<br>- Replica hulls are stitched together using the same traditional coconut palm fiber rope used on the hulls of ancient dhows.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- The ancient Arab dhow was a sailing vessel distinguishable by its triangular sails and stitched hull construction.\n- Dhows were used primarily for trade along the coasts of Arab, South Asian, and East African countries.\n- Contemporary shipbuilders in Oman use a mix of modern and traditional materials to build replicas of ancient dhows.\n- Most of the materials used are traditional.\n- Replica hulls are stitched together using the same traditional coconut palm fiber rope used on the hulls of ancient dhows.", "stem": "The student wants to make a generalization about the materials used in dhow replicas. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想對三角帆船複製品使用的材料作出概括性陳述。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 古代阿拉伯的三角帆船（dhow）是一種帆船，以三角形船帆與縫合船體結構為特徵。\n- 三角帆船主要用於阿拉伯、南亞與東非國家沿岸的貿易。\n- 阿曼的當代造船師混合使用現代與傳統材料來建造古代三角帆船的複製品。\n- 使用的材料大多是傳統材料。\n- 複製品的船體是用與古代三角帆船船體相同的傳統椰子纖維繩縫合而成的。", "opts": {"A": "A traditional material that was used to stitch together the hulls of ancient dhows, coconut palm fiber rope is still used by shipbuilders.", "B": "The ancient Arab dhow was a sailing vessel used primarily for trade and distinguishable by its triangular sails.", "C": "Although most materials used in dhow replicas are traditional, some modern materials are used.", "D": "Contemporary shipbuilders in Oman build replicas of the dhow, which was an ancient sailing vessel with a stitched hull construction."}, "optsZh": {"A": "椰子纖維繩是古代三角帆船用來縫合船體的傳統材料，至今仍被造船師使用。", "B": "古代阿拉伯三角帆船是一種主要用於貿易的帆船，以三角形船帆為特徵。", "C": "雖然三角帆船複製品使用的材料大多是傳統材料，但也使用了一些現代材料。", "D": "阿曼的當代造船師建造三角帆船的複製品，而三角帆船是一種具有縫合船體結構的古代帆船。"}, "answer": "C", "expl": "A generalization covers the materials overall: most are traditional, but some are modern.", "explZh": "概括性陳述要涵蓋整體材料：大多為傳統材料，但也使用部分現代材料。"}, {"id": "27.1", "label": "Mock 27.1", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that makes a generalization following a \"most, but some\" pattern.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Traditional Andean weavers use natural plant and mineral dyes to color wool yarn.<br>- Cochineal insects are used to produce a deep red dye still common in many workshops today.<br>- Some <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=contemporary\" target=\"_blank\" rel=\"noopener\" data-w=\"contemporary\" data-pos=\"adj.\" data-en=\"belonging to the present time; modern\" data-zh=\"當代的\">contemporary<\/a> weaving cooperatives have begun <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=incorporate\" target=\"_blank\" rel=\"noopener\" data-w=\"incorporate\" data-pos=\"v.\" data-en=\"to include something as part of a whole\" data-zh=\"納入；融合\">incorporating<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=synthetic\" target=\"_blank\" rel=\"noopener\" data-w=\"synthetic\" data-pos=\"adj.\" data-en=\"made artificially, not natural\" data-zh=\"合成的；人造的\">synthetic<\/a> dyes for certain bright colors not achievable naturally.<br>- Most workshops surveyed in a recent study still rely primarily on natural dyes for the bulk of their <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a>.<br>- A small number of workshops have switched entirely to synthetic dyes for cost reasons.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Traditional Andean weavers use natural plant and mineral dyes to color wool yarn.\n- Cochineal insects are used to produce a deep red dye still common in many workshops today.\n- Some contemporary weaving cooperatives have begun incorporating synthetic dyes for certain bright colors not achievable naturally.\n- Most workshops surveyed in a recent study still rely primarily on natural dyes for the bulk of their production.\n- A small number of workshops have switched entirely to synthetic dyes for cost reasons.", "stem": "The student wants to make a generalization about the dyes used in contemporary Andean weaving. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想對當代安地斯紡織使用的染料作出概括性陳述。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 傳統安地斯織工使用天然植物與礦物染料為羊毛紗線染色。\n- 胭脂蟲被用來製作深紅色染料，至今仍在許多工坊中很常見。\n- 一些當代紡織合作社已開始加入合成染料，用於某些天然染料做不出來的鮮豔顏色。\n- 在最近一項研究中受調查的工坊，大多數在大部分產品上仍主要使用天然染料。\n- 少數工坊為了成本考量已完全改用合成染料。", "opts": {"A": "Cochineal insects are used to produce a deep red dye still common in many Andean weaving workshops today.", "B": "A recent study surveyed workshops to determine which dyes were used in contemporary Andean weaving.", "C": "Although most contemporary Andean weaving workshops rely primarily on natural dyes, some use synthetic dyes.", "D": "A small number of Andean weaving workshops have switched entirely to synthetic dyes for cost reasons."}, "optsZh": {"A": "胭脂蟲被用來製作深紅色染料，至今仍在許多安地斯紡織工坊中很常見。", "B": "最近一項研究調查了工坊，以判定當代安地斯紡織使用哪些染料。", "C": "雖然大多數當代安地斯紡織工坊主要使用天然染料，但有些使用合成染料。", "D": "少數安地斯紡織工坊為了成本考量已完全改用合成染料。"}, "answer": "C", "expl": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization.", "explZh": ""}, {"id": "27.2", "label": "Mock 27.2", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that makes a generalization following a \"most, but some\" pattern.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Community bakeries in a coastal region <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> bake bread in wood-fired brick ovens.<br>- Wood-fired baking gives the bread a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=distinctive\" target=\"_blank\" rel=\"noopener\" data-w=\"distinctive\" data-pos=\"adj.\" data-en=\"easy to recognize because it is different\" data-zh=\"獨特的；有特色的\">distinctive<\/a> smoky flavor prized by longtime customers.<br>- Some newer bakeries in the same region have adopted gas-fired ovens for greater consistency and lower fuel costs.<br>- Most bakeries surveyed in the region still use wood-fired ovens for their signature loaves.<br>- A handful of bakeries use gas-fired ovens exclusively.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Community bakeries in a coastal region traditionally bake bread in wood-fired brick ovens.\n- Wood-fired baking gives the bread a distinctive smoky flavor prized by longtime customers.\n- Some newer bakeries in the same region have adopted gas-fired ovens for greater consistency and lower fuel costs.\n- Most bakeries surveyed in the region still use wood-fired ovens for their signature loaves.\n- A handful of bakeries use gas-fired ovens exclusively.", "stem": "The student wants to make a generalization about how bread is baked in the region. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想對該地區烤麵包的方式作出概括性陳述。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 某沿海地區的社區麵包店傳統上使用柴燒磚窯烤麵包。\n- 柴燒烘焙使麵包帶有老顧客珍視的獨特煙燻風味。\n- 同一地區一些較新的麵包店採用瓦斯爐，以求品質更穩定、燃料成本更低。\n- 該地區受調查的麵包店，大多數仍用柴燒窯烤製招牌麵包。\n- 少數麵包店只使用瓦斯爐。", "opts": {"A": "Wood-fired baking gives bread a distinctive smoky flavor prized by longtime customers in the region.", "B": "A survey was conducted to determine which ovens bakeries in the region used.", "C": "Although most bakeries in the region still use wood-fired ovens, some use gas-fired ovens.", "D": "A handful of bakeries in the region use gas-fired ovens exclusively."}, "optsZh": {"A": "柴燒烘焙使麵包帶有該地區老顧客珍視的獨特煙燻風味。", "B": "進行了一項調查，以判定該地區麵包店使用哪種烤爐。", "C": "雖然該地區大多數麵包店仍使用柴燒窯，但有些使用瓦斯爐。", "D": "該地區少數麵包店只使用瓦斯爐。"}, "answer": "C", "expl": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization.", "explZh": ""}, {"id": "27.3", "label": "Mock 27.3", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that makes a generalization following a \"most, but some\" pattern.", "vocab": false, "body": "While researching a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=topic\" target=\"_blank\" rel=\"noopener\" data-w=\"topic\" data-pos=\"n.\" data-en=\"a subject that people write or talk about\" data-zh=\"主題；題目\">topic<\/a>, a student has taken the following notes:<br>- Furniture makers in a rural woodworking town <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> join joints using hand-cut dovetails.<br>- Hand-cut dovetails are prized for their durability and fine appearance.<br>- Some newer furniture makers in the town have begun using machine-cut joints to speed up <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=production\" target=\"_blank\" rel=\"noopener\" data-w=\"production\" data-pos=\"n.\" data-en=\"the process of making or growing something; the amount made\" data-zh=\"生產；產量\">production<\/a>.<br>- Most workshops in the town still rely primarily on hand-cut joinery for their finished pieces.<br>- A few workshops now use machine-cut joinery exclusively.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Furniture makers in a rural woodworking town traditionally join joints using hand-cut dovetails.\n- Hand-cut dovetails are prized for their durability and fine appearance.\n- Some newer furniture makers in the town have begun using machine-cut joints to speed up production.\n- Most workshops in the town still rely primarily on hand-cut joinery for their finished pieces.\n- A few workshops now use machine-cut joinery exclusively.", "stem": "The student wants to make a generalization about how furniture is joined in the town. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想對鎮上家具的接合方式作出概括性陳述。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 某鄉村木工小鎮的家具師傅傳統上使用手工切割的鳩尾榫接合。\n- 手工鳩尾榫因其耐用與精美外觀而受到珍視。\n- 鎮上一些較新的家具師傅已開始使用機器切割的榫接以加快生產。\n- 鎮上大多數工坊的成品仍主要使用手工榫接。\n- 少數工坊現在只使用機器切割的榫接。", "opts": {"A": "Hand-cut dovetails are prized for their durability and fine appearance among furniture makers in the town.", "B": "Some newer furniture makers in the town have adopted machine-cut joints in recent years.", "C": "Although most workshops in the town still rely primarily on hand-cut joinery, some use machine-cut joinery.", "D": "A few workshops in the town now use machine-cut joinery exclusively."}, "optsZh": {"A": "手工鳩尾榫因其耐用與精美外觀而受到鎮上家具師傅的珍視。", "B": "鎮上一些較新的家具師傅近年來採用了機器切割的榫接。", "C": "雖然鎮上大多數工坊仍主要使用手工榫接，但有些使用機器切割的榫接。", "D": "鎮上少數工坊現在只使用機器切割的榫接。"}, "answer": "C", "expl": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization.", "explZh": ""}, {"id": "27.4", "label": "Mock 27.4", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that makes a generalization following a \"most, but some\" pattern.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Fishing crews along a northern coastline <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> navigate using <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landmark\" target=\"_blank\" rel=\"noopener\" data-w=\"landmark\" data-pos=\"adj.\" data-en=\"very important; marking a turning point\" data-zh=\"具里程碑意義的\">landmarks<\/a> and memorized currents.<br>- This <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> method has been passed down through <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generation\" target=\"_blank\" rel=\"noopener\" data-w=\"generation\" data-pos=\"n.\" data-en=\"the production of something, such as electricity\" data-zh=\"產生；發電\">generations<\/a> of local fishing families.<br>- Some younger crews have begun relying on GPS devices for navigation instead.<br>- Most crews surveyed in the region still navigate primarily using traditional landmark-based methods.<br>- A small number of crews rely on GPS devices exclusively.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Fishing crews along a northern coastline traditionally navigate using landmarks and memorized currents.\n- This traditional method has been passed down through generations of local fishing families.\n- Some younger crews have begun relying on GPS devices for navigation instead.\n- Most crews surveyed in the region still navigate primarily using traditional landmark-based methods.\n- A small number of crews rely on GPS devices exclusively.", "stem": "The student wants to make a generalization about how fishing crews navigate along the coastline. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想對沿岸漁船船員的導航方式作出概括性陳述。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 北方海岸線的漁船船員傳統上靠地標與記住的洋流來導航。\n- 這種傳統方法已在當地漁民家族中代代相傳。\n- 一些較年輕的船員已開始改用 GPS 裝置導航。\n- 該地區受調查的船員，大多數仍主要使用傳統的地標導航方法。\n- 少數船員只依賴 GPS 裝置。", "opts": {"A": "Traditional landmark-based navigation has been passed down through generations of local fishing families.", "B": "Some younger fishing crews along the coastline have begun relying on GPS devices instead.", "C": "Although most fishing crews along the coastline still navigate primarily using traditional methods, some use GPS devices.", "D": "A small number of fishing crews along the coastline rely on GPS devices exclusively."}, "optsZh": {"A": "傳統的地標導航方法已在當地漁民家族中代代相傳。", "B": "沿岸一些較年輕的漁船船員已開始改用 GPS 裝置。", "C": "雖然沿岸大多數漁船船員仍主要使用傳統方法導航，但有些使用 GPS 裝置。", "D": "沿岸少數漁船船員只依賴 GPS 裝置。"}, "answer": "C", "expl": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization.", "explZh": ""}, {"id": "27.5", "label": "Mock 27.5", "n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that makes a generalization following a \"most, but some\" pattern.", "vocab": false, "body": "While researching a topic, a student has taken the following notes:<br>- Potters in a highland village <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=traditionally\" target=\"_blank\" rel=\"noopener\" data-w=\"traditionally\" data-pos=\"adv.\" data-en=\"according to long-established custom\" data-zh=\"傳統上\">traditionally<\/a> shape clay vessels <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> by hand, without a wheel.<br>- Hand-shaping is considered <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essential<\/a> to the village&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> aesthetic.<br>- Some younger potters in the village have begun using a pottery wheel for certain simpler forms.<br>- Most potters surveyed in the village still shape the majority of their vessels entirely by hand.<br>- A few potters now use a wheel for all of their work.", "bodyPlain": "While researching a topic, a student has taken the following notes:\n- Potters in a highland village traditionally shape clay vessels entirely by hand, without a wheel.\n- Hand-shaping is considered essential to the village's traditional aesthetic.\n- Some younger potters in the village have begun using a pottery wheel for certain simpler forms.\n- Most potters surveyed in the village still shape the majority of their vessels entirely by hand.\n- A few potters now use a wheel for all of their work.", "stem": "The student wants to make a generalization about how vessels are shaped in the village. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "stemZh": "這名學生想對村裡陶器的塑形方式作出概括性陳述。哪一個選項最有效地運用筆記中的相關資訊來達成這個目標？", "bodyZh": "研究某個主題時，一名學生做了以下筆記：\n- 某高地村落的陶工傳統上完全用手塑形陶器，不使用拉坯機。\n- 手工塑形被認為是村落傳統美學不可或缺的一部分。\n- 村裡一些較年輕的陶工已開始用拉坯機製作某些較簡單的器形。\n- 村裡受調查的陶工，大多數仍完全用手塑形大部分的陶器。\n- 少數陶工現在所有作品都使用拉坯機。", "opts": {"A": "Hand-shaping is considered essential to the village's traditional pottery aesthetic.", "B": "Some younger potters in the village have begun using a pottery wheel for certain simpler forms.", "C": "Although most potters in the village still shape the majority of their vessels entirely by hand, some use a wheel.", "D": "A few potters in the village now use a wheel for all of their work."}, "optsZh": {"A": "手工塑形被認為是村落傳統陶藝美學不可或缺的一部分。", "B": "村裡一些較年輕的陶工已開始用拉坯機製作某些較簡單的器形。", "C": "雖然村裡大多數陶工仍完全用手塑形大部分陶器，但有些使用拉坯機。", "D": "村裡少數陶工現在所有作品都使用拉坯機。"}, "answer": "C", "expl": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization.", "explZh": ""}];
    const SLUG = 'dsat_tcramm2';
    const SOURCE = 'Cram School Mock Test (Aug 1, 2026), Module 2';
    const KEY = 'dsat_wrong_' + SLUG;
    const byId = Object.fromEntries(DATA.map(q => [q.id, q]));
    const quiz = document.getElementById('quiz');
    let retest = false;
    let answered = {};  // id -> {picked, ok}

    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function loadWrong() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
    function saveWrong(w) { try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {} updateCount(); }
    function updateCount() {
      const n = Object.keys(loadWrong()).length;
      document.getElementById('wrongCount').textContent = n;
      const a = Object.values(answered); const ok = a.filter(x => x.ok).length;
      document.getElementById('stat').textContent = a.length ? `${ok}/${a.length} correct` : '';
    }
    function speak(text) {
      if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音朗讀'); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      const v = speechSynthesis.getVoices().find(v => /en-US/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    function itemHtml(q, wrong) {
      const prev = wrong[q.id];
      const cls = q.id.startsWith('o') ? 'orig' : '';
      return `
        <article class="mock" id="item-${esc(q.id)}" data-id="${esc(q.id)}">
          <h3>${esc(q.label)} <span class="badge ${cls}">${q.id.startsWith('o') ? 'Official original' : 'Mock'}</span>
            ${q.vocab ? '<span class="badge">vocabulary</span>' : ''}
            ${prev ? `<span class="badge wrong">✗ wrong before (${prev.count || 1}×)</span>` : ''}</h3>
          <div class="question">${q.body}</div>
          ${q.stem ? `<div class="stem">${esc(q.stem)}</div>` : ''}
          <div class="rowbtns">
            <button type="button" class="mini speakBody">🔊 Listen 朗讀</button>
            <button type="button" class="mini toggleTrans">中文翻譯 Show translation</button>
          </div>
          <div class="choices">
            ${['A','B','C','D'].map(L => `<button type="button" class="choice" data-choice="${L}"><b>${L})</b> ${esc(q.opts[L] || '')}</button>`).join('')}
          </div>
          <div class="feedback" aria-live="polite"></div>
          <div class="trans">
            <h4>中文翻譯 Chinese translation</h4>
            <div class="zhbody">${esc(q.bodyZh)}</div>
            ${q.stemZh ? `<div class="zhbody"><b>${esc(q.stemZh)}</b></div>` : ''}
            <ol type="A">
              ${['A','B','C','D'].map(L => `<li data-l="${L}"><span class="en">${esc(q.opts[L] || '')}</span><br><span class="cn">${esc(q.optsZh[L] || '')}</span></li>`).join('')}
            </ol>
            ${q.vocab ? `<h4 style="margin-top:10px">單字 Vocabulary（點擊發音 click to hear）</h4>
            <div class="defs">
              ${['A','B','C','D'].map(L => { const d = q.defs[L] || {}; const w = d.word || q.opts[L];
                return `<button type="button" class="word" data-l="${L}" data-word="${esc(w)}"><span class="w">🔊 ${esc(w)}<small>${esc(d.pos || '')}</small></span><span class="en">${esc(d.en || '')}</span><span class="cn">${esc(d.zh || '')}</span></button>`; }).join('')}
            </div>` : ''}
          </div>
        </article>`;
    }

    function mockLabel(open, n) { return `${open ? '▾ Hide' : '▸ Show'} mock Q 1–${n} 模擬題`; }
    function setMocks(btn, open) {
      const w = btn.parentElement.nextElementSibling; w.classList.toggle('show', open);
      btn.setAttribute('aria-expanded', open); btn.textContent = mockLabel(open, btn.dataset.n);
    }
    function revealItem(id) {
      const el = document.getElementById(id); if (!el) return;
      const w = el.closest('.mockwrap');
      if (w && !w.classList.contains('show')) setMocks(w.previousElementSibling.querySelector('.mockBtn'), true);
      el.scrollIntoView({ block: 'start' });
    }
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#item-"]'); if (!a) return;
      e.preventDefault(); revealItem(a.getAttribute('href').slice(1)); history.replaceState(null, '', a.getAttribute('href'));
    });

    function render() {
      const wrong = loadWrong();
      answered = {};
      const groups = new Map();
      for (const q of DATA) {
        if (retest && !wrong[q.id]) continue;
        if (!groups.has(q.n)) groups.set(q.n, { concept: q.concept, items: [] });
        groups.get(q.n).items.push(q);
      }
      if (!groups.size) {
        quiz.innerHTML = `<div class="card"><div class="card-head"><h2>${retest ? '錯題本是空的 — No wrong questions saved yet.' : 'No items'}</h2></div></div>`;
        updateCount(); return;
      }
      quiz.innerHTML = [...groups.entries()].map(([n, g]) => `
        <section class="card">
          <div class="card-head"><h2>Question ${n}</h2><div class="concept">${esc(g.concept)}</div></div>
          ${(() => {
            const o = g.items.filter(q => q.id.startsWith('o')), m = g.items.filter(q => !q.id.startsWith('o'));
            if (!o.length || !m.length) return g.items.map(q => itemHtml(q, wrong)).join('');
            const open = retest;
            return o.map(q => itemHtml(q, wrong)).join('') +
              `<div class="mocktoggle"><button type="button" class="mockBtn" data-n="${m.length}" aria-expanded="${open}">${mockLabel(open, m.length)}</button>
                <span class="mockhint">先作答原題，再選擇練習模擬題或直接做下一題 · Answer the original first, then try the mocks or move on.</span></div>
              <div class="mockwrap${open ? ' show' : ''}">${m.map(q => itemHtml(q, wrong)).join('')}</div>`;
          })()}
        </section>`).join('');
      updateCount();
    }

    quiz.addEventListener('click', e => {
      const mb = e.target.closest('.mockBtn');
      if (mb) { setMocks(mb, mb.getAttribute('aria-expanded') !== 'true'); return; }
      const art = e.target.closest('.mock'); if (!art) return;
      const q = byId[art.dataset.id];
      if (e.target.closest('.speakBody')) { speak(q.bodyPlain + ' ' + (q.stem || '')); return; }
      if (e.target.closest('.toggleTrans')) { art.querySelector('.trans').classList.toggle('show'); return; }
      const wb = e.target.closest('.word');
      if (wb) { speak(wb.dataset.word); return; }
      const btn = e.target.closest('.choice'); if (!btn || btn.disabled) return;
      const picked = btn.dataset.choice, ans = q.answer, ok = picked === ans;
      art.querySelectorAll('.choice').forEach(c => { c.disabled = true; if (c.dataset.choice === ans) c.classList.add('correct'); });
      if (!ok) btn.classList.add('incorrect');
      const fb = art.querySelector('.feedback');
      fb.className = 'feedback ' + (ok ? 'good' : 'bad');
      fb.innerHTML = (ok ? 'Correct. ' : `Not quite. Correct answer: ${ans}. `) + esc(q.expl) + (q.explZh ? `<span class="zh">${esc(q.explZh)}</span>` : '');
      const tr = art.querySelector('.trans'); tr.classList.add('show');
      tr.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.l === ans));
      tr.querySelectorAll('.word').forEach(w => w.classList.toggle('ok', w.dataset.l === ans));
      if (q.vocab) speak(q.opts[ans]);
      answered[q.id] = { picked, ok };
