resulting in a focused projected image. A ray diagram reveals how this ______ the hole's small size restricts light to a single ray, all light passing through the hole can only arrive at a single destination, eliminating diffraction and ensuring a clear image.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) works because\nB) works. Because\nC) works, it's because\nD) works: it's because", "generated": [{"id": "16.1", "text": "Consider the mechanics of a simple lever: a small force applied far from the pivot lifts a much larger weight placed close to it. A force diagram reveals how this ______ the pivot's position determines how far each end must travel, all the force applied at the long end is multiplied at the short end, producing greater lifting power.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) works because\nB) works. Because\nC) works, it's because\nD) works: it's because", "answer": "B", "explanation": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences."}, {"id": "16.2", "text": "Consider the mechanics of a prism: white light entering one face exits the other split into a visible band of colors. A ray diagram reveals how this ______ each wavelength of light bends by a slightly different amount, all the colors that entered together spread apart as they exit, producing a visible spectrum.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) works because\nB) works. Because\nC) works, it's because\nD) works: it's because", "answer": "B", "explanation": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences."}, {"id": "16.3", "text": "Consider the mechanics of a suspension bridge: the roadway hangs from cables anchored at towers on either end. A load diagram reveals how this ______ the curved cables convert the roadway's weight into tension, all the downward force on the deck is redirected along the cables to the towers, keeping the structure stable.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) works because\nB) works. Because\nC) works, it's because\nD) works: it's because", "answer": "B", "explanation": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences."}, {"id": "16.4", "text": "Consider the mechanics of a refrigerator: a warm kitchen stays separate from a cold interior compartment. A cycle diagram reveals how this ______ a circulating refrigerant absorbs heat inside the compartment and releases it outside, all the warmth removed from the food is carried away and expelled into the room, keeping the interior cold.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) works because\nB) works. Because\nC) works, it's because\nD) works: it's because", "answer": "B", "explanation": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences."}, {"id": "16.5", "text": "Consider the mechanics of a telescope: distant, dim objects appear brighter and larger than they do to the naked eye. An optical diagram reveals how this ______ a large primary lens or mirror gathers far more light than the human eye can on its own, all the collected light is focused into a single, magnified image, revealing detail invisible without the instrument.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) works because\nB) works. Because\nC) works, it's because\nD) works: it's because", "answer": "B", "explanation": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences."}]}, {"n": 17, "concept": "Standard English Conventions (Boundaries): no punctuation between a role/title noun and the proper name identifying who holds it.", "original": "Long attributed to Jacques-Louis David, the preeminent Neoclassical painter of his day, the 1801 painting Marie Josephine Charlotte du Val d'Ognes gained fresh attention in the 1990s when art historians discovered that the painting—which depicts a solitary young woman sketching—was actually the work of little-known French portrait ______ Marie-Denise Villers (1774-1821).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) artist—\nB) artist\nC) artist:\nD) artist,", "generated": [{"id": "17.1", "text": "Long credited to master luthier Antonio Rossi, the celebrated violin housed at the regional museum was recently found, after extensive restoration work, to be the creation of little-known apprentice ______ Concetta Farina (1802-1856).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) luthier—\nB) luthier\nC) luthier:\nD) luthier,", "answer": "B", "explanation": "No punctuation should separate the role \"luthier\" from the name that identifies who holds it."}, {"id": "17.2", "text": "Long attributed to celebrated engraver Heinrich Voss, the intricate frontispiece in the rare edition was recently discovered, after archival research, to be the work of little-known apprentice ______ Marta Kessler (1780-1834).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) engraver—\nB) engraver\nC) engraver:\nD) engraver,", "answer": "B", "explanation": "No punctuation should separate the role \"engraver\" from the name that identifies who holds it."}, {"id": "17.3", "text": "Long attributed to well-known cabinetmaker Louis Fontaine, the ornately carved chest in the collection was recently discovered, after close examination, to be the work of little-known journeyman ______ Pierre Aubert (1795-1841).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) journeyman—\nB) journeyman\nC) journeyman:\nD) journeyman,", "answer": "B", "explanation": "No punctuation should separate the role \"journeyman\" from the name that identifies who holds it."}, {"id": "17.4", "text": "Long credited to renowned muralist Diego Salazar, the fresco discovered beneath the plaster wall was recently confirmed, after pigment analysis, to be the work of little-known assistant ______ Beatriz Nunez (1888-1942).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) assistant—\nB) assistant\nC) assistant:\nD) assistant,", "answer": "B", "explanation": "No punctuation should separate the role \"assistant\" from the name that identifies who holds it."}, {"id": "17.5", "text": "Long attributed to celebrated composer Anton Reimer, the newly rediscovered manuscript was confirmed, after handwriting analysis, to be the work of little-known copyist ______ Ilse Brandt (1810-1867).\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) copyist—\nB) copyist\nC) copyist:\nD) copyist,", "answer": "B", "explanation": "No punctuation should separate the role \"copyist\" from the name that identifies who holds it."}]}, {"n": 18, "concept": "Standard English Conventions (Boundaries): close a sentence's opening em dash with a matching dash, using a comma to introduce the internal example list.", "original": "In 1986, conceptual artist Sophie Calle asked twenty-three people, some of whom had been born without sight, to describe their image of beauty in rich detail. Calle paired excerpts of these conversations with photographs—both of interviewees and the items they ______ to powerful effect in her exhibition The Blind.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) described, from hair to grass to sculptures\nB) described, from hair to grass to sculptures—\nC) described—from hair to grass to sculptures,\nD) described: from hair to grass to sculptures", "generated": [{"id": "18.1", "text": "In 1998, curator Renata Osei paired oral histories from factory retirees with photographs—both of the workers themselves and the tools they ______ to striking effect in her exhibition Hands That Built It.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) used, from wrenches to rivet guns to soldering irons\nB) used, from wrenches to rivet guns to soldering irons—\nC) used—from wrenches to rivet guns to soldering irons,\nD) used: from wrenches to rivet guns to soldering irons", "answer": "B", "explanation": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list."}, {"id": "18.2", "text": "In 2003, folklorist Amos Reinholt paired grandmothers' recorded recipes with photographs—both of the cooks themselves and the ingredients they ______ to moving effect in his exhibition What We Kept.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) named, from saffron to sorrel to salted plums\nB) named, from saffron to sorrel to salted plums—\nC) named—from saffron to sorrel to salted plums,\nD) named: from saffron to sorrel to salted plums", "answer": "B", "explanation": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list."}, {"id": "18.3", "text": "In 2011, artist Priya Chandran paired handwritten letters from war veterans with photographs—both of the veterans and the small objects they ______ to quiet effect in her exhibition What Remained.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) kept, from dog tags to pressed flowers to torn maps\nB) kept, from dog tags to pressed flowers to torn maps—\nC) kept—from dog tags to pressed flowers to torn maps,\nD) kept: from dog tags to pressed flowers to torn maps", "answer": "B", "explanation": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list."}, {"id": "18.4", "text": "In 1994, photographer Tomas Elguera paired interviews with retired sailors with photographs—both of the sailors themselves and the knots they ______ to fascinating effect in his exhibition Rope and Memory.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) demonstrated, from bowlines to clove hitches to sheet bends\nB) demonstrated, from bowlines to clove hitches to sheet bends—\nC) demonstrated—from bowlines to clove hitches to sheet bends,\nD) demonstrated: from bowlines to clove hitches to sheet bends", "answer": "B", "explanation": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list."}, {"id": "18.5", "text": "In 2016, artist Ines Cardoso paired interviews with elderly seamstresses with photographs—both of the women themselves and the fabrics they ______ to poignant effect in her exhibition Thread by Thread.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) favored, from raw silk to indigo cotton to hand-loomed wool\nB) favored, from raw silk to indigo cotton to hand-loomed wool—\nC) favored—from raw silk to indigo cotton to hand-loomed wool,\nD) favored: from raw silk to indigo cotton to hand-loomed wool", "answer": "B", "explanation": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list."}]}, {"n": 19, "concept": "Standard English Conventions (Boundaries): no comma should separate a proper-noun subject from its main verb.", "original": "American abstract artist Richard ______ his installations to make passersby keenly aware of how one's movements are affected by the physical features of one's environment, assembles large-scale steel plates into sculptures that dominate the outdoor spaces they occupy.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) Serra is intending\nB) Serra, intends\nC) Serra, intending\nD) Serra intends", "generated": [{"id": "19.1", "text": "American conceptual artist Naledi ______ her installations to remind viewers of vanished industrial sites; she arranges rusted machine parts into freestanding sculptures displayed in public parks.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is intending\nB) , intends\nC) , intending\nD) intends", "answer": "D", "explanation": "No comma should separate the subject \"Naledi\" from its main verb \"intends.\""}, {"id": "19.2", "text": "British land artist Desmond ______ his earthworks to make visitors reconsider the scale of their own bodies; he carves spiral trenches into open hillsides using only hand tools.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is intending\nB) , intends\nC) , intending\nD) intends", "answer": "D", "explanation": "No comma should separate the subject \"Desmond\" from its main verb \"intends.\""}, {"id": "19.3", "text": "Japanese sound artist Emi ______ her installations to make listeners notice ambient noise they usually ignore; she places hidden microphones throughout ordinary public spaces.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is intending\nB) , intends\nC) , intending\nD) intends", "answer": "D", "explanation": "No comma should separate the subject \"Emi\" from its main verb \"intends.\""}, {"id": "19.4", "text": "Brazilian light artist Otavio ______ his installations to make pedestrians aware of how shadows shift throughout the day; he suspends translucent panels above busy plazas.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is intending\nB) , intends\nC) , intending\nD) intends", "answer": "D", "explanation": "No comma should separate the subject \"Otavio\" from its main verb \"intends.\""}, {"id": "19.5", "text": "Canadian textile artist Priya ______ her installations to make museum visitors reconsider the labor behind everyday fabric; she suspends hand-loomed panels from gallery ceilings.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is intending\nB) , intends\nC) , intending\nD) intends", "answer": "D", "explanation": "No comma should separate the subject \"Priya\" from its main verb \"intends.\""}]}, {"n": 20, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a reduced relative clause.", "original": "A species of Byropsis algae produces toxins to avoid being eaten by predators. However, in some cases, the toxins the organism uses to protect itself from predation actually ______ its attractiveness to predators. The Hawaiian sea slug, for example, not only tolerates Byropsis toxins but actually uses them for protection in the same way the algae does.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is increasing\nB) increase\nC) increases\nD) has increased", "generated": [{"id": "20.1", "text": "A species of desert shrub produces thorns to deter grazing animals. However, in some cases, the thorns the plant grows to protect its leaves actually ______ its visibility to animals searching for shade, since the thorny silhouette stands out starkly against the open sand.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is increasing\nB) increase\nC) increases\nD) has increased", "answer": "B", "explanation": "The plural subject \"thorns\" requires the plural verb \"increase.\""}, {"id": "20.2", "text": "A species of tropical frog produces bright skin pigments to warn predators of its toxicity. However, in some cases, the pigments the frog develops to advertise danger actually ______ its appeal to collectors seeking unusually colorful specimens.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is increasing\nB) increase\nC) increases\nD) has increased", "answer": "B", "explanation": "The plural subject \"pigments\" requires the plural verb \"increase.\""}, {"id": "20.3", "text": "A species of burrowing beetle produces a strong chemical odor to repel would-be predators. However, in some cases, the compounds the beetle releases to defend itself actually ______ its detectability to specialized predators that have evolved to track that exact scent.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is increasing\nB) increase\nC) increases\nD) has increased", "answer": "B", "explanation": "The plural subject \"compounds\" requires the plural verb \"increase.\""}, {"id": "20.4", "text": "A species of coral produces a bitter-tasting compound to discourage grazing fish. However, in some cases, the compounds the coral secretes to deter feeding actually ______ its attractiveness to a specialized fish species that has evolved to seek out that exact taste.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is increasing\nB) increase\nC) increases\nD) has increased", "answer": "B", "explanation": "The plural subject \"compounds\" requires the plural verb \"increase.\""}, {"id": "20.5", "text": "A species of nocturnal moth produces a high-pitched clicking sound to startle approaching bats. However, in some cases, the clicks the moth emits to defend itself actually ______ its detectability to bats that have learned to associate the sound with an easy meal.\n\nWhich choice completes the text so that it conforms to the conventions of Standard English?\n\nA) is increasing\nB) increase\nC) increases\nD) has increased", "answer": "B", "explanation": "The plural subject \"clicks\" requires the plural verb \"increase.\""}]}, {"n": 21, "concept": "Transitions: choose the logical connector introducing a concession.", "original": "Historians agree that the jazz pianist Jelly Roll Morton was exaggerating when he claimed to have invented jazz music. No one can deny, ______, that Morton's innovative compositions and remarkable improvisational skills helped shape jazz as a genre during its early years.\n\nWhich choice completes the text with the most logical transition?\n\nA) therefore,\nB) in the second place,\nC) in other words,\nD) though,", "generated": [{"id": "21.1", "text": "Historians agree that inventor Otto Lindqvist was exaggerating when he claimed to have single-handedly designed the city's entire subway system. No one can deny, ______, that Lindqvist's engineering innovations solved several of the project's most difficult technical problems.\n\nWhich choice completes the text with the most logical transition?\n\nA) therefore,\nB) in the second place,\nC) in other words,\nD) though,", "answer": "D", "explanation": "The sentence concedes a real contribution despite the exaggeration, calling for \"though.\""}, {"id": "21.2", "text": "Critics agree that memoirist Adaeze Okonkwo was exaggerating when she claimed to have predicted the region's political collapse years in advance. No one can deny, ______, that her early essays captured widespread frustrations that most commentators at the time overlooked.\n\nWhich choice completes the text with the most logical transition?\n\nA) therefore,\nB) in the second place,\nC) in other words,\nD) though,", "answer": "D", "explanation": "The sentence concedes a real insight despite the exaggeration, calling for \"though.\""}, {"id": "21.3", "text": "Scholars agree that explorer Bram Visser was exaggerating when he claimed to be the first European to reach the remote valley. No one can deny, ______, that his detailed maps of the region were more accurate than any produced before them.\n\nWhich choice completes the text with the most logical transition?\n\nA) therefore,\nB) in the second place,\nC) in other words,\nD) though,", "answer": "D", "explanation": "The sentence concedes a real achievement despite the exaggeration, calling for \"though.\""}, {"id": "21.4", "text": "Economists agree that entrepreneur Delia Vasquez was exaggerating when she claimed to have single-handedly revived the town's economy. No one can deny, ______, that her factory created hundreds of jobs during a period of severe local unemployment.\n\nWhich choice completes the text with the most logical transition?\n\nA) therefore,\nB) in the second place,\nC) in other words,\nD) though,", "answer": "D", "explanation": "The sentence concedes a real accomplishment despite the exaggeration, calling for \"though.\""}, {"id": "21.5", "text": "Musicologists agree that bandleader Cassius Reid was exaggerating when he claimed to have invented an entirely new musical genre. No one can deny, ______, that his unconventional arrangements influenced an entire generation of younger composers.\n\nWhich choice completes the text with the most logical transition?\n\nA) therefore,\nB) in the second place,\nC) in other words,\nD) though,", "answer": "D", "explanation": "The sentence concedes a real influence despite the exaggeration, calling for \"though.\""}]}, {"n": 22, "concept": "Transitions: choose the logical connector that intensifies a claim about the extremity of a difference.", "original": "Biographer Michael Gorra notes that the novelist Henry James lived in a world of second thoughts, frequently tinkering with his novels and stories after their initial publication. However, the differences between the 1881 first edition and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James's standards; ______ some critics regard the two editions as two different novels altogether.\n\nWhich choice completes the text with the most logical transition?\n\nA) by contrast,\nB) in fact,\nC) nevertheless,\nD) in other words,", "generated": [{"id": "22.1", "text": "Biographer Elin Torvald notes that architect Soren Aas was known for revising his blueprints even after construction had begun. However, the differences between his 1922 design for the concert hall and the building as it was ultimately completed are extreme, even by Aas's standards; ______ some historians regard the finished building as an entirely different structure from what he originally proposed.\n\nWhich choice completes the text with the most logical transition?\n\nA) by contrast,\nB) in fact,\nC) nevertheless,\nD) in other words,", "answer": "B", "explanation": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail."}, {"id": "22.2", "text": "Biographer Marcus Whitfield notes that playwright Odalys Ferreira frequently rewrote her plays after opening night. However, the differences between the 1965 premiere script and the 1978 published edition of her play Salt Water are extreme, even by Ferreira's standards; ______ some critics regard the two versions as entirely separate plays.\n\nWhich choice completes the text with the most logical transition?\n\nA) by contrast,\nB) in fact,\nC) nevertheless,\nD) in other words,", "answer": "B", "explanation": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail."}, {"id": "22.3", "text": "Biographer Naledi Khumalo notes that composer Tobias Renner habitually reworked his symphonies for years after their first performance. However, the differences between the 1901 and the 1924 versions of his Symphony No. 3 are extreme, even by Renner's standards; ______ some musicologists regard the two versions as fundamentally different compositions.\n\nWhich choice completes the text with the most logical transition?\n\nA) by contrast,\nB) in fact,\nC) nevertheless,\nD) in other words,", "answer": "B", "explanation": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail."}, {"id": "22.4", "text": "Biographer Priya Deshmukh notes that painter Henrik Solberg often repainted sections of his canvases years after their first exhibition. However, the differences between the 1889 exhibited version and the 1910 final version of his painting Harbor at Dusk are extreme, even by Solberg's standards; ______ some art historians regard the two versions as two separate paintings.\n\nWhich choice completes the text with the most logical transition?\n\nA) by contrast,\nB) in fact,\nC) nevertheless,\nD) in other words,", "answer": "B", "explanation": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail."}, {"id": "22.5", "text": "Biographer Camille Duvall notes that novelist Idris Bakr routinely revised his manuscripts long after their initial publication. However, the differences between the 1954 first edition and the 1971 revised edition of his novel The Long Season are extreme, even by Bakr's standards; ______ some literary scholars regard the two editions as entirely separate novels.\n\nWhich choice completes the text with the most logical transition?\n\nA) by contrast,\nB) in fact,\nC) nevertheless,\nD) in other words,", "answer": "B", "explanation": "\"In fact\" intensifies the claim of extremity by adding an even stronger supporting detail."}]}, {"n": 23, "concept": "Transitions: choose the logical connector adding further support to a claim of unsurprising coincidence.", "original": "In hindsight, given the ideas about the natural world circulating among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a coincidence, ______, that Charles Darwin and Alfred Wallace arrived at the concept independently. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) then,\nC) moreover,\nD) for example,", "generated": [{"id": "23.1", "text": "In hindsight, given the mathematical techniques circulating among European scholars in the 1670s, the development of calculus was an obvious next step. It may not have been a coincidence, ______, that Isaac Newton and Gottfried Leibniz arrived at the method independently. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first foundational mathematical idea to have emerged from multiple scholars working in parallel.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) then,\nC) moreover,\nD) for example,", "answer": "C", "explanation": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence."}, {"id": "23.2", "text": "In hindsight, given the chemical experiments circulating among researchers in the 1770s, the discovery of oxygen's role in combustion was an obvious next step. It may not have been a coincidence, ______, that Carl Wilhelm Scheele and Joseph Priestley isolated the gas independently. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first foundational scientific finding to have emerged from multiple scholars working in parallel.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) then,\nC) moreover,\nD) for example,", "answer": "C", "explanation": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence."}, {"id": "23.3", "text": "In hindsight, given the astronomical observations circulating among scholars in the 1840s, the prediction of a new planet beyond Uranus was an obvious next step. It may not have been a coincidence, ______, that Urbain Le Verrier and John Couch Adams calculated its position independently. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major scientific prediction to have emerged from multiple scholars working in parallel.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) then,\nC) moreover,\nD) for example,", "answer": "C", "explanation": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence."}, {"id": "23.4", "text": "In hindsight, given the electrical experiments circulating among inventors in the 1870s, the development of a practical telephone was an obvious next step. It may not have been a coincidence, ______, that Alexander Graham Bell and Elisha Gray filed their patent claims within hours of each other. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major invention to have emerged from multiple inventors working in parallel.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) then,\nC) moreover,\nD) for example,", "answer": "C", "explanation": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence."}, {"id": "23.5", "text": "In hindsight, given the genetic research circulating among biologists in the early 1950s, the discovery of DNA's double-helix structure was an obvious next step. It may not have been a coincidence, ______, that James Watson and Francis Crick reached their model around the same time that Rosalind Franklin's data pointed toward a similar structure. Indeed, contrary to the popular myth of the solitary genius, theirs is not the first major biological breakthrough to have emerged from multiple researchers working in parallel.\n\nWhich choice completes the text with the most logical transition?\n\nA) however,\nB) then,\nC) moreover,\nD) for example,", "answer": "C", "explanation": "\"Moreover\" adds a further supporting point to the claim that the discovery was not a coincidence."}]}, {"n": 24, "concept": "Transitions: choose the logical connector that restates a technical claim in plainer terms.", "original": "In a recent study, researchers examined the sleeping and waking habits of a group of dairy cows to determine if the cows' patterns of activity suggested that the animals were diurnal, nocturnal, or crepuscular. ______ the researchers studied whether the cows were most active in the daytime (diurnal), nighttime (nocturnal), or at dawn and dusk (crepuscular).\n\nWhich choice completes the text with the most logical transition?\n\nA) Afterward,\nB) In other words,\nC) Additionally,\nD) However,", "generated": [{"id": "24.1", "text": "In a recent study, researchers examined the vocalizations of a group of captive dolphins to determine whether their calls exhibited evidence of individual signature patterns. ______ the researchers investigated whether each dolphin produced a distinct, repeatable call that functioned like a name.\n\nWhich choice completes the text with the most logical transition?\n\nA) Afterward,\nB) In other words,\nC) Additionally,\nD) However,", "answer": "B", "explanation": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\""}, {"id": "24.2", "text": "In a recent study, researchers examined the foraging patterns of a colony of leafcutter ants to determine whether their trail-marking behavior exhibited evidence of route optimization. ______ the researchers investigated whether the ants gradually favored shorter, more efficient paths to food sources over time.\n\nWhich choice completes the text with the most logical transition?\n\nA) Afterward,\nB) In other words,\nC) Additionally,\nD) However,", "answer": "B", "explanation": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\""}, {"id": "24.3", "text": "In a recent study, researchers examined the sleep patterns of a group of migratory songbirds to determine whether their rest periods exhibited evidence of unihemispheric sleep. ______ the researchers investigated whether the birds could keep one half of the brain awake while the other half rested during flight.\n\nWhich choice completes the text with the most logical transition?\n\nA) Afterward,\nB) In other words,\nC) Additionally,\nD) However,", "answer": "B", "explanation": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\""}, {"id": "24.4", "text": "In a recent study, researchers examined the grooming behavior of a troop of wild baboons to determine whether social interactions exhibited evidence of reciprocal exchange. ______ the researchers investigated whether baboons that groomed a particular troop member were more likely to receive grooming from that same individual later on.\n\nWhich choice completes the text with the most logical transition?\n\nA) Afterward,\nB) In other words,\nC) Additionally,\nD) However,", "answer": "B", "explanation": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\""}, {"id": "24.5", "text": "In a recent study, researchers examined the nest-building materials chosen by a population of urban crows to determine whether their selections exhibited evidence of deliberate material preference. ______ the researchers investigated whether the crows consistently chose certain materials over other, equally available options.\n\nWhich choice completes the text with the most logical transition?\n\nA) Afterward,\nB) In other words,\nC) Additionally,\nD) However,", "answer": "B", "explanation": "The second sentence restates the technical goal in plainer terms, calling for \"In other words.\""}]}, {"n": 25, "concept": "Rhetorical Synthesis: combine notes into a sentence that emphasizes a similarity between two things.", "original": "While researching a topic, a student has taken the following notes:\n- Earthquakes start at a point called a \"focus\" and spread out from there as seismic waves.\n- The two types of seismic waves that travel beneath Earth's surface are primary waves (P waves) and secondary waves (S waves).\n- P waves travel more quickly beneath Earth's surface than do S waves.\n- P waves compress and expand the ground, causing it to move backward and forward.\n- S waves cause the ground to move from side to side.\n\nThe student wants to emphasize a similarity between P waves and S waves. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) P waves and S waves both travel beneath Earth's surface, causing the ground to move.\nB) P waves travel away from an earthquake's starting point at a higher rate of speed than do S waves.\nC) Spreading out from the focus of an earthquake, P waves move the ground backward and forward.\nD) Although P waves and S waves start at the same point, they behave very differently.", "generated": [{"id": "25.1", "text": "While researching a topic, a student has taken the following notes:\n- Hurricanes and typhoons are both large rotating storm systems that form over warm ocean water.\n- Hurricanes form over the Atlantic and northeastern Pacific; typhoons form over the northwestern Pacific.\n- Hurricanes are categorized using the Saffir-Simpson scale; typhoons are categorized using a different regional scale.\n- Both storm types draw energy from warm ocean surface temperatures.\n- Both storm types can produce sustained winds exceeding 150 miles per hour.\n\nThe student wants to emphasize a similarity between hurricanes and typhoons. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Hurricanes and typhoons are both large rotating storm systems that draw their energy from warm ocean surface temperatures.\nB) Hurricanes form over the Atlantic and northeastern Pacific, while typhoons form over the northwestern Pacific Ocean.\nC) Typhoons are, unlike hurricanes, categorized using a regional intensity scale rather than the Saffir-Simpson scale.\nD) Sustained winds exceeding 150 miles per hour occur in both hurricanes and typhoons, though the two form in different ocean basins.", "answer": "A", "explanation": "Choice A states a shared feature as its main point without also foregrounding a difference."}, {"id": "25.2", "text": "While researching a topic, a student has taken the following notes:\n- Cellos and double basses are both string instruments played with a bow.\n- Cellos are tuned in fifths; double basses are tuned in fourths.\n- Cellos are typically played while seated with the instrument between the knees; double basses are typically played standing or on a stool.\n- Both instruments have four main strings in their standard configuration.\n- Both instruments provide the bass foundation in an orchestral string section.\n\nThe student wants to emphasize a similarity between cellos and double basses. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Cellos and double basses both provide the bass foundation in an orchestral string section.\nB) Cellos are tuned in fifths, while double basses are tuned in fourths.\nC) Double basses are typically played standing, unlike cellos, which are played seated.\nD) Although cellos and double basses are tuned differently, both instruments have four main strings.", "answer": "A", "explanation": "Choice A states a shared feature as its main point without also foregrounding a difference."}, {"id": "25.3", "text": "While researching a topic, a student has taken the following notes:\n- Octopuses and cuttlefish are both cephalopods capable of rapidly changing the color and texture of their skin.\n- Octopuses have eight arms; cuttlefish have eight arms plus two longer feeding tentacles.\n- Octopuses generally lack an internal shell; cuttlefish have an internal structure called a cuttlebone.\n- Both animals use specialized skin cells called chromatophores to change color almost instantly.\n- Octopuses are typically solitary, while cuttlefish are sometimes found in small groups.\n\nThe student wants to emphasize a similarity between octopuses and cuttlefish. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Octopuses and cuttlefish both use specialized skin cells called chromatophores to change color almost instantly.\nB) Octopuses have eight arms, while cuttlefish have eight arms plus two longer feeding tentacles.\nC) Cuttlefish, unlike octopuses, have an internal structure called a cuttlebone.\nD) Although octopuses are typically solitary, cuttlefish are sometimes found in small groups.", "answer": "A", "explanation": "Choice A states a shared feature as its main point without also foregrounding a difference."}, {"id": "25.4", "text": "While researching a topic, a student has taken the following notes:\n- Maple syrup and agave syrup are both natural liquid sweeteners derived from plants.\n- Maple syrup is made by boiling down the sap of maple trees; agave syrup is made by processing the sap of the agave plant.\n- Maple syrup has a moderate glycemic index; agave syrup has a lower glycemic index.\n- Both sweeteners can be substituted for refined sugar in most baking recipes.\n- Maple syrup is primarily produced in North America; agave syrup is primarily produced in Mexico.\n\nThe student wants to emphasize a similarity between maple syrup and agave syrup. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Maple syrup and agave syrup can both be substituted for refined sugar in most baking recipes.\nB) Maple syrup is made from tree sap, while agave syrup is made from the sap of the agave plant.\nC) Agave syrup has a lower glycemic index than maple syrup does.\nD) Although maple syrup is produced mainly in North America, agave syrup is produced mainly in Mexico.", "answer": "A", "explanation": "Choice A states a shared feature as its main point without also foregrounding a difference."}, {"id": "25.5", "text": "While researching a topic, a student has taken the following notes:\n- Solar panels and wind turbines are both renewable energy technologies that generate electricity without burning fossil fuels.\n- Solar panels convert sunlight directly into electricity; wind turbines convert the kinetic energy of moving air.\n- Solar panels produce more consistently during daylight hours; wind turbines can generate power at any time of day.\n- Both technologies require little water to operate compared with traditional power plants.\n- Solar panel installations are often placed on rooftops; wind turbines are typically installed in open, elevated areas.\n\nThe student wants to emphasize a similarity between solar panels and wind turbines. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Solar panels and wind turbines both require little water to operate compared with traditional power plants.\nB) Solar panels convert sunlight into electricity, while wind turbines convert the kinetic energy of moving air.\nC) Wind turbines, unlike solar panels, can generate power at any time of day.\nD) Although solar panels are often installed on rooftops, wind turbines are typically installed in open, elevated areas.", "answer": "A", "explanation": "Choice A states a shared feature as its main point without also foregrounding a difference."}]}, {"n": 26, "concept": "Rhetorical Synthesis: combine notes into a sentence that specifies which classification category a specific example falls into.", "original": "While researching a topic, a student has taken the following notes:\n- The US Fish and Wildlife Service (FWS) keeps a list of all at-risk species.\n- Species on the list are classified as either endangered or threatened.\n- A species that is in danger of extinction throughout most or all of its range is classified as endangered.\n- A species that is likely to soon become endangered is classified as threatened.\n- The California red-legged frog (Rana draytonii) is likely to soon become endangered, according to the FWS.\n\nThe student wants to indicate the California red-legged frog's FWS classification category. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Species on the FWS list, which includes the California red-legged frog (Rana draytonii), are classified as either endangered or threatened.\nB) The California red-legged frog (Rana draytonii) appears on the FWS list of at-risk species.\nC) According to the FWS, the California red-legged frog is in the endangered category, in danger of extinction throughout most or all of its range.\nD) Likely to soon become endangered, the California red-legged frog is classified as threatened by the FWS.", "generated": [{"id": "26.1", "text": "While researching a topic, a student has taken the following notes:\n- The International Union for Conservation of Nature (IUCN) maintains a Red List of species conservation status.\n- Species are classified in several categories, including \"Vulnerable\" and \"Endangered.\"\n- A species facing a high risk of extinction in the wild is classified as Vulnerable.\n- A species facing a very high risk of extinction in the wild is classified as Endangered.\n- The Sumatran orangutan faces an extremely high risk of extinction in the wild, according to the IUCN.\n\nThe student wants to indicate the Sumatran orangutan's IUCN classification category. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Species on the IUCN Red List, which includes the Sumatran orangutan, are classified in several categories.\nB) The Sumatran orangutan appears on the IUCN Red List of species facing conservation concern.\nC) According to the IUCN, a species facing a high risk of extinction in the wild is classified as Vulnerable.\nD) Facing an extremely high risk of extinction in the wild, the Sumatran orangutan is classified as Endangered by the IUCN.", "answer": "D", "explanation": "Choice D states the specific classification the frog example falls into, matching the notes' criterion."}, {"id": "26.2", "text": "While researching a topic, a student has taken the following notes:\n- A national weather service classifies winter storm warnings into two levels: \"Advisory\" and \"Warning.\"\n- An Advisory is issued when snowfall is expected to cause significant inconvenience but not a serious hazard.\n- A Warning is issued when snowfall is expected to create a serious hazard to life and property.\n- Meteorologists forecast that the approaching storm will drop enough snow to create a serious hazard to life and property in the region.\n\nThe student wants to indicate which classification level the approaching storm falls into. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The national weather service, which issues both Advisories and Warnings, classifies winter storms into two levels.\nB) The approaching storm has been forecast by meteorologists to drop significant snowfall on the region.\nC) According to the weather service, an Advisory is issued when snowfall causes significant inconvenience but not a serious hazard.\nD) Expected to create a serious hazard to life and property, the approaching storm has been classified as a Warning.", "answer": "D", "explanation": "Choice D states the specific classification the storm falls into, matching the notes' criterion."}, {"id": "26.3", "text": "While researching a topic, a student has taken the following notes:\n- A city's building code classifies structural repairs as either \"Minor\" or \"Major.\"\n- A Minor repair does not affect a building's structural load-bearing capacity.\n- A Major repair does affect a building's structural load-bearing capacity.\n- Inspectors determined that replacing the cracked support beam in the old warehouse would affect the building's structural load-bearing capacity.\n\nThe student wants to indicate which classification the beam replacement falls into under the building code. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The city's building code, which inspectors must follow, classifies structural repairs into two categories.\nB) Inspectors examined the cracked support beam in the old warehouse as part of a routine inspection.\nC) According to the building code, a Minor repair does not affect a building's structural load-bearing capacity.\nD) Affecting the building's structural load-bearing capacity, the beam replacement is classified as a Major repair under the code.", "answer": "D", "explanation": "Choice D states the specific classification the repair falls into, matching the notes' criterion."}, {"id": "26.4", "text": "While researching a topic, a student has taken the following notes:\n- A hospital's triage system sorts incoming patients into \"Urgent\" and \"Non-Urgent\" categories.\n- A patient is classified as Urgent if their condition could worsen significantly without treatment within the hour.\n- A patient is classified as Non-Urgent if their condition is unlikely to worsen significantly without immediate treatment.\n- Physicians determined that a patient's condition could worsen significantly without treatment within the hour.\n\nThe student wants to indicate which triage category the patient falls into. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The hospital's triage system, which physicians rely on daily, sorts patients into two categories.\nB) Physicians examined the patient shortly after arrival at the hospital.\nC) According to the triage system, a patient is classified as Non-Urgent if immediate treatment is not required.\nD) Likely to worsen significantly without treatment within the hour, the patient is classified as Urgent.", "answer": "D", "explanation": "Choice D states the specific classification the patient falls into, matching the notes' criterion."}, {"id": "26.5", "text": "While researching a topic, a student has taken the following notes:\n- A national parks agency classifies hiking trails as either \"Easy\" or \"Strenuous.\"\n- An Easy trail has a total elevation gain of less than 500 feet.\n- A Strenuous trail has a total elevation gain of 500 feet or more.\n- Park surveyors measured the new ridge trail's total elevation gain at 1,200 feet.\n\nThe student wants to indicate which classification the new ridge trail falls into. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) The national parks agency, which maintains the new ridge trail, classifies hiking trails into two categories.\nB) Park surveyors recently completed measuring the new ridge trail's total elevation gain.\nC) According to the agency, an Easy trail has a total elevation gain of less than 500 feet.\nD) With a total elevation gain of 1,200 feet, the new ridge trail is classified as Strenuous by the agency.", "answer": "D", "explanation": "Choice D states the specific classification the trail falls into, matching the notes' criterion."}]}, {"n": 27, "concept": "Rhetorical Synthesis: combine notes into a sentence that makes a generalization following a \"most, but some\" pattern.", "original": "While researching a topic, a student has taken the following notes:\n- The ancient Arab dhow was a sailing vessel distinguishable by its triangular sails and stitched hull construction.\n- Dhows were used primarily for trade along the coasts of Arab, South Asian, and East African countries.\n- Contemporary shipbuilders in Oman use a mix of modern and traditional materials to build replicas of ancient dhows.\n- Most of the materials used are traditional.\n- Replica hulls are stitched together using the same traditional coconut palm fiber rope used on the hulls of ancient dhows.\n\nThe student wants to make a generalization about the materials used in dhow replicas. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) A traditional material that was used to stitch together the hulls of ancient dhows, coconut palm fiber rope is still used by shipbuilders.\nB) The ancient Arab dhow was a sailing vessel used primarily for trade and distinguishable by its triangular sails.\nC) Although most materials used in dhow replicas are traditional, some modern materials are used.\nD) Contemporary shipbuilders in Oman build replicas of the dhow, which was an ancient sailing vessel with a stitched hull construction.", "generated": [{"id": "27.1", "text": "While researching a topic, a student has taken the following notes:\n- Traditional Andean weavers use natural plant and mineral dyes to color wool yarn.\n- Cochineal insects are used to produce a deep red dye still common in many workshops today.\n- Some contemporary weaving cooperatives have begun incorporating synthetic dyes for certain bright colors not achievable naturally.\n- Most workshops surveyed in a recent study still rely primarily on natural dyes for the bulk of their production.\n- A small number of workshops have switched entirely to synthetic dyes for cost reasons.\n\nThe student wants to make a generalization about the dyes used in contemporary Andean weaving. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Cochineal insects are used to produce a deep red dye still common in many Andean weaving workshops today.\nB) A recent study surveyed workshops to determine which dyes were used in contemporary Andean weaving.\nC) Although most contemporary Andean weaving workshops rely primarily on natural dyes, some use synthetic dyes.\nD) A small number of Andean weaving workshops have switched entirely to synthetic dyes for cost reasons.", "answer": "C", "explanation": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization."}, {"id": "27.2", "text": "While researching a topic, a student has taken the following notes:\n- Community bakeries in a coastal region traditionally bake bread in wood-fired brick ovens.\n- Wood-fired baking gives the bread a distinctive smoky flavor prized by longtime customers.\n- Some newer bakeries in the same region have adopted gas-fired ovens for greater consistency and lower fuel costs.\n- Most bakeries surveyed in the region still use wood-fired ovens for their signature loaves.\n- A handful of bakeries use gas-fired ovens exclusively.\n\nThe student wants to make a generalization about how bread is baked in the region. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Wood-fired baking gives bread a distinctive smoky flavor prized by longtime customers in the region.\nB) A survey was conducted to determine which ovens bakeries in the region used.\nC) Although most bakeries in the region still use wood-fired ovens, some use gas-fired ovens.\nD) A handful of bakeries in the region use gas-fired ovens exclusively.", "answer": "C", "explanation": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization."}, {"id": "27.3", "text": "While researching a topic, a student has taken the following notes:\n- Furniture makers in a rural woodworking town traditionally join joints using hand-cut dovetails.\n- Hand-cut dovetails are prized for their durability and fine appearance.\n- Some newer furniture makers in the town have begun using machine-cut joints to speed up production.\n- Most workshops in the town still rely primarily on hand-cut joinery for their finished pieces.\n- A few workshops now use machine-cut joinery exclusively.\n\nThe student wants to make a generalization about how furniture is joined in the town. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Hand-cut dovetails are prized for their durability and fine appearance among furniture makers in the town.\nB) Some newer furniture makers in the town have adopted machine-cut joints in recent years.\nC) Although most workshops in the town still rely primarily on hand-cut joinery, some use machine-cut joinery.\nD) A few workshops in the town now use machine-cut joinery exclusively.", "answer": "C", "explanation": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization."}, {"id": "27.4", "text": "While researching a topic, a student has taken the following notes:\n- Fishing crews along a northern coastline traditionally navigate using landmarks and memorized currents.\n- This traditional method has been passed down through generations of local fishing families.\n- Some younger crews have begun relying on GPS devices for navigation instead.\n- Most crews surveyed in the region still navigate primarily using traditional landmark-based methods.\n- A small number of crews rely on GPS devices exclusively.\n\nThe student wants to make a generalization about how fishing crews navigate along the coastline. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Traditional landmark-based navigation has been passed down through generations of local fishing families.\nB) Some younger fishing crews along the coastline have begun relying on GPS devices instead.\nC) Although most fishing crews along the coastline still navigate primarily using traditional methods, some use GPS devices.\nD) A small number of fishing crews along the coastline rely on GPS devices exclusively.", "answer": "C", "explanation": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization."}, {"id": "27.5", "text": "While researching a topic, a student has taken the following notes:\n- Potters in a highland village traditionally shape clay vessels entirely by hand, without a wheel.\n- Hand-shaping is considered essential to the village's traditional aesthetic.\n- Some younger potters in the village have begun using a pottery wheel for certain simpler forms.\n- Most potters surveyed in the village still shape the majority of their vessels entirely by hand.\n- A few potters now use a wheel for all of their work.\n\nThe student wants to make a generalization about how vessels are shaped in the village. Which choice most effectively uses relevant information from the notes to accomplish this goal?\n\nA) Hand-shaping is considered essential to the village's traditional pottery aesthetic.\nB) Some younger potters in the village have begun using a pottery wheel for certain simpler forms.\nC) Although most potters in the village still shape the majority of their vessels entirely by hand, some use a wheel.\nD) A few potters in the village now use a wheel for all of their work.", "answer": "C", "explanation": "Choice C states the overall \"most, but some\" pattern the notes describe, forming a true generalization."}]}];
    const quiz = document.getElementById('quiz');
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      quiz.innerHTML = DATA.map(item => `
        <section class="card">
          <div class="card-head">
            <h2>Original Question ${item.n}</h2>
            <div class="concept">${escapeHtml(item.concept || '')}</div>
          </div>
          <details>
            <summary>Show original test question text</summary>
            <pre>${escapeHtml(item.original || '')}</pre>
          </details>
          ${item.generated.map(mock => `
            <article class="mock" data-answer="${escapeHtml(mock.answer)}">
              <h3>Mock ${escapeHtml(mock.id)}</h3>
              <div class="question">${escapeHtml(mock.text)}</div>
              <div class="choices">
                ${['A','B','C','D'].map(letter => `<button type="button" class="choice" data-choice="${letter}">${letter}</button>`).join('')}
              </div>
              <div class="feedback" aria-live="polite"></div>
              <template class="explanation">${escapeHtml(mock.explanation || '')}</template>
            </article>`).join('')}
        </section>`).join('');
    }
    quiz.addEventListener('click', event => {
      const button = event.target.closest('.choice');
      if (!button) return;
      const mock = button.closest('.mock');
      const answer = mock.dataset.answer;
      const picked = button.dataset.choice;
      mock.querySelectorAll('.choice').forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.choice === answer) choice.classList.add('correct');
      });
      const feedback = mock.querySelector('.feedback');
      const explanation = mock.querySelector('.explanation').innerHTML;
      if (picked === answer) {
        feedback.className = 'feedback good';
        feedback.innerHTML = `Correct. ${explanation}`;
      } else {
        button.classList.add('incorrect');
        feedback.className = 'feedback bad';
        feedback.innerHTML = `Not quite. Correct answer: ${answer}. ${explanation}`;
      }
    });
    document.getElementById('expandAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => document.querySelectorAll('details').forEach(d => d.open = false);
    document.getElementById('resetQuiz').onclick = render;
    render();
  </script>
</body>
