to water loss; yet certain desert beetles have adapted to survive such heat. Studies have found a positive correlation between the temperatures desert beetles can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=withstand\" target=\"_blank\" rel=\"noopener\" data-w=\"withstand\" data-pos=\"v.\" data-en=\"to resist or survive something\" data-zh=\"承受；抵擋\">withstand<\/a> and concentrations of a wax-like compound in their cuticle, leading a team of researchers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that this compound reduces the cuticle&#x27;s tendency to soften in extreme heat.", "bodyPlain": "Under normal temperatures, insect cuticle maintains a hardened, protective structure. Extreme heat, such as found during heat waves, softens this structure and can leave insects vulnerable to water loss; yet certain desert beetles have adapted to survive such heat. Studies have found a positive correlation between the temperatures desert beetles can withstand and concentrations of a wax-like compound in their cuticle, leading a team of researchers to hypothesize that this compound reduces the cuticle's tendency to soften in extreme heat.", "stem": "Which finding, if true, would most directly support the researchers' hypothesis?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員的假設？", "bodyZh": "在正常溫度下，昆蟲的外骨骼角質層維持堅硬的保護結構。極端高溫（例如熱浪期間）會使這個結構軟化，並可能使昆蟲容易流失水分；然而，某些沙漠甲蟲已經適應了在這種高溫下存活。研究發現，沙漠甲蟲能承受的溫度，與其角質層中一種類似蠟之化合物的濃度呈正相關，使一支研究團隊提出假設：這種化合物會降低角質層在極端高溫下軟化的傾向。", "opts": {"A": "Cuticle structure is found to be unaffected by the wax-like compound even when the cuticle's arrangement has been altered by high heat.", "B": "Examination of the wax-like compound's molecular structure shows that it retains its shape even as temperature increases.", "C": "A positive correlation is found between concentrations of the wax-like compound and the rate at which cuticle softens as temperature increases.", "D": "Analysis of cuticle structure at high temperature reveals that it remains more rigid when the wax-like compound is present than when it is not."}, "optsZh": {"A": "研究發現，即使角質層的排列已因高溫而改變，它仍不受這種類似蠟之化合物影響。", "B": "檢視這種類似蠟之化合物的分子結構顯示，即使溫度升高，它仍保持其形狀。", "C": "研究發現這種類似蠟之化合物的濃度與角質層隨溫度升高而軟化的速率呈正相關。", "D": "分析高溫下角質層的結構顯示，有這種類似蠟之化合物時角質層比沒有時更堅硬。"}, "answer": "D", "expl": "Direct evidence that the cuticle stays more rigid with the compound present most directly supports the hypothesis.", "explZh": ""}, {"id": "12.4", "label": "Mock 12.4", "n": 12, "concept": "Command of Evidence (Research Finding): identify the direct molecular-level finding that would support a hypothesis about a compound stabilizing structure under stress.", "vocab": false, "body": "Under normal light levels, the pigment-protein complexes in certain algae maintain a stable folded <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a>. Extreme sunlight, such as found near the ocean&#x27;s surface at midday, destabilizes these complexes and can impair photosynthesis; yet some surface-dwelling algae have adapted to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=withstand\" target=\"_blank\" rel=\"noopener\" data-w=\"withstand\" data-pos=\"v.\" data-en=\"to resist or survive something\" data-zh=\"承受；抵擋\">withstand<\/a> intense light. Studies have found a positive correlation between the light intensities algae can <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tolerate\" target=\"_blank\" rel=\"noopener\" data-w=\"tolerate\" data-pos=\"v.\" data-en=\"to accept something unpleasant without complaint\" data-zh=\"容忍\">tolerate<\/a> and concentrations of a carotenoid pigment within their cells, leading a team of researchers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that this carotenoid reduces the complexes&#x27; vulnerability to light-induced damage.", "bodyPlain": "Under normal light levels, the pigment-protein complexes in certain algae maintain a stable folded structure. Extreme sunlight, such as found near the ocean's surface at midday, destabilizes these complexes and can impair photosynthesis; yet some surface-dwelling algae have adapted to withstand intense light. Studies have found a positive correlation between the light intensities algae can tolerate and concentrations of a carotenoid pigment within their cells, leading a team of researchers to hypothesize that this carotenoid reduces the complexes' vulnerability to light-induced damage.", "stem": "Which finding, if true, would most directly support the researchers' hypothesis?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員的假設？", "bodyZh": "在正常光照下，某些藻類中的色素-蛋白質複合體維持穩定的摺疊結構。極強的陽光（例如正午時海面附近）會破壞這些複合體，並可能妨礙光合作用；然而，一些生活在表層的藻類已經適應了承受強光。研究發現，藻類能耐受的光照強度，與其細胞內一種類胡蘿蔔素色素的濃度呈正相關，使一支研究團隊提出假設：這種類胡蘿蔔素會降低複合體受光損傷的脆弱性。", "opts": {"A": "Pigment-protein complexes are found to be unaffected by the carotenoid even when the complexes' structure has been altered by intense light.", "B": "Examination of the carotenoid's molecular structure shows that it retains its shape even as light intensity increases.", "C": "A positive correlation is found between concentrations of the carotenoid and the rate at which complexes become damaged as light intensity increases.", "D": "Analysis of complex structure under intense light reveals that the folded structure remains more stable when the carotenoid is present than when it is not."}, "optsZh": {"A": "研究發現，即使色素-蛋白質複合體的結構已因強光而改變，它們仍不受這種類胡蘿蔔素影響。", "B": "檢視這種類胡蘿蔔素的分子結構顯示，即使光照強度增加，它仍保持其形狀。", "C": "研究發現這種類胡蘿蔔素濃度與複合體隨光照增強而受損的速率呈正相關。", "D": "分析強光下複合體的結構顯示，有這種類胡蘿蔔素時摺疊結構比沒有時更穩定。"}, "answer": "D", "expl": "Direct evidence that the complex stays more stable with the carotenoid present most directly supports the hypothesis.", "explZh": ""}, {"id": "12.5", "label": "Mock 12.5", "n": 12, "concept": "Command of Evidence (Research Finding): identify the direct molecular-level finding that would support a hypothesis about a compound stabilizing structure under stress.", "vocab": false, "body": "Under normal humidity, spider silk maintains a tightly coiled molecular <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> that gives it its strength. Extreme dryness, such as found in arid habitats, disrupts this structure and can make the silk brittle; yet certain desert spiders produce silk that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=withstand\" target=\"_blank\" rel=\"noopener\" data-w=\"withstand\" data-pos=\"v.\" data-en=\"to resist or survive something\" data-zh=\"承受；抵擋\">withstands<\/a> such <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=condition\" target=\"_blank\" rel=\"noopener\" data-w=\"condition\" data-pos=\"n.\" data-en=\"the state or situation something is in\" data-zh=\"條件；狀況\">conditions<\/a>. Studies have found a positive correlation between the dryness levels a spider&#x27;s habitat reaches and concentrations of a particular protein in its silk, leading a team of researchers to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=hypothesize\" target=\"_blank\" rel=\"noopener\" data-w=\"hypothesize\" data-pos=\"v.\" data-en=\"to suggest a possible explanation that has not been proven\" data-zh=\"提出假設\">hypothesize<\/a> that this protein reduces the silk&#x27;s tendency to become brittle in dry conditions.", "bodyPlain": "Under normal humidity, spider silk maintains a tightly coiled molecular structure that gives it its strength. Extreme dryness, such as found in arid habitats, disrupts this structure and can make the silk brittle; yet certain desert spiders produce silk that withstands such conditions. Studies have found a positive correlation between the dryness levels a spider's habitat reaches and concentrations of a particular protein in its silk, leading a team of researchers to hypothesize that this protein reduces the silk's tendency to become brittle in dry conditions.", "stem": "Which finding, if true, would most directly support the researchers' hypothesis?", "stemZh": "下列哪一項發現若為真，最能直接支持研究人員的假設？", "bodyZh": "在正常濕度下，蜘蛛絲維持緊密捲曲的分子結構，賦予它強度。極度乾燥（例如乾旱棲地）會破壞這個結構，並可能使蛛絲變脆；然而，某些沙漠蜘蛛能吐出經得起這種環境的絲。研究發現，蜘蛛棲地的乾燥程度，與其蛛絲中一種特定蛋白質的濃度呈正相關，使一支研究團隊提出假設：這種蛋白質會降低蛛絲在乾燥環境中變脆的傾向。", "opts": {"A": "Silk structure is found to be unaffected by the protein even when the structure has been altered by low humidity.", "B": "Examination of the protein's molecular structure shows that it retains its shape even as humidity decreases.", "C": "A positive correlation is found between concentrations of the protein and the rate at which silk becomes brittle as humidity decreases.", "D": "Analysis of silk structure under low humidity reveals that the coiled structure remains more stable when the protein is present than when it is not."}, "optsZh": {"A": "研究發現，即使蛛絲結構已因低濕度而改變，它仍不受這種蛋白質影響。", "B": "檢視這種蛋白質的分子結構顯示，即使濕度降低，它仍保持其形狀。", "C": "研究發現這種蛋白質濃度與蛛絲隨濕度降低而變脆的速率呈正相關。", "D": "分析低濕度下蛛絲的結構顯示，有這種蛋白質時捲曲結構比沒有時更穩定。"}, "answer": "D", "expl": "Direct evidence that the silk stays more stable with the protein present most directly supports the hypothesis.", "explZh": ""}, {"id": "o14", "label": "Original Q14", "n": 14, "concept": "Inferences: complete a research finding that parallels an expectation set up by prior findings about captivity and purposeless repetitive behavior.", "vocab": false, "body": "In a 2013 study, Agness Gidna, Jose Yravedra, and Manuel Dominguez-Rodrigo compared the feeding behaviors of wild lions in Tanzania&#x27;s Tarangire National Park with those of captive lions in Spain&#x27;s Cabarceno Reserve. The researchers noted that previous studies focused on other carnivores have shown that providing animals with food at regular intervals, as is common in captive settings, may inadvertently facilitate the development of novel stereotypic (i.e., purposeless repetitive) behaviors by reducing the need for a high degree of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=cognitive\" target=\"_blank\" rel=\"noopener\" data-w=\"cognitive\" data-pos=\"adj.\" data-en=\"related to thinking, learning, and understanding\" data-zh=\"認知的\">cognitive<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=engagement\" target=\"_blank\" rel=\"noopener\" data-w=\"engagement\" data-pos=\"n.\" data-en=\"the act of being involved with something\" data-zh=\"參與；投入\">engagement<\/a> with the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environment<\/a>; the researchers were therefore not altogether surprised to find that ______", "bodyPlain": "In a 2013 study, Agness Gidna, Jose Yravedra, and Manuel Dominguez-Rodrigo compared the feeding behaviors of wild lions in Tanzania's Tarangire National Park with those of captive lions in Spain's Cabarceno Reserve. The researchers noted that previous studies focused on other carnivores have shown that providing animals with food at regular intervals, as is common in captive settings, may inadvertently facilitate the development of novel stereotypic (i.e., purposeless repetitive) behaviors by reducing the need for a high degree of cognitive engagement with the environment; the researchers were therefore not altogether surprised to find that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2013 年的一項研究中，Agness Gidna、Jose Yravedra 與 Manuel Dominguez-Rodrigo 比較了坦尚尼亞 Tarangire 國家公園野生獅子與西班牙 Cabarceno 保護區圈養獅子的進食行為。研究人員指出，先前針對其他肉食動物的研究顯示，定時供應食物給動物（這在圈養環境中很常見），可能因為減少了與環境高度認知互動的需求，而無意間促成新的刻板（即無目的的重複）行為；因此，研究人員發現以下結果時並不太意外：______", "opts": {"A": "bones from carcasses provided to captive lions showed signs of extensive gnawing beyond the point of nutrient extraction, whereas bones from prey hunted by wild lions did not.", "B": "during feeding episodes, captive male lions showed much more aggression than did wild male lions, whereas female captive and wild lions showed similar levels of aggression.", "C": "when caretakers placed food in boxes that were cognitively demanding to open, captive lions showed repeated behaviors similar to those that wild lions show when stalking prey.", "D": "captive lions showed a stereotypic behavior of pacing in their enclosures as feeding times approached, whereas wild lions showed a stereotypic behavior of pacing before embarking on a hunt."}, "optsZh": {"A": "提供給圈養獅子的屍體骨頭，顯示出在已無營養可取之後仍被大量啃咬的痕跡，而野生獅子獵殺之獵物的骨頭則沒有。", "B": "在進食過程中，圈養雄獅比野生雄獅表現出高得多的攻擊性，而圈養與野生母獅的攻擊程度相近。", "C": "當照顧者把食物放在需要動腦才能打開的箱子裡時，圈養獅子會出現類似野生獅子跟蹤獵物時的重複行為。", "D": "在餵食時間接近時，圈養獅子會在圍欄中出現踱步的刻板行為，而野生獅子在出發狩獵前也會出現踱步的刻板行為。"}, "answer": "A", "expl": "Gnawing bones beyond the point of getting nutrients is a purposeless repetitive behavior seen in captive, regularly fed lions, as expected.", "explZh": "在已無營養可取之後仍不斷啃咬骨頭，是一種無目的的重複行為，出現在定時餵食的圈養獅子身上，符合預期。"}, {"id": "14.1", "label": "Mock 14.1", "n": 14, "concept": "Inferences: complete a research finding that parallels an expectation set up by prior findings about captivity and purposeless repetitive behavior.", "vocab": false, "body": "In a 2015 study, Marcus Webb and Aline Duarte <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compared\" target=\"_blank\" rel=\"noopener\">compared<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=foraging\" target=\"_blank\" rel=\"noopener\">foraging<\/a> behaviors of wild capuchin monkeys in Costa Rica&#x27;s rainforests with those of captive capuchins in a large zoo enclosure. The researchers noted that previous studies focused on other primates have shown that providing animals with food at <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predictable\" target=\"_blank\" rel=\"noopener\" data-w=\"predictable\" data-pos=\"adj.\" data-en=\"able to be known in advance\" data-zh=\"可預測的\">predictable<\/a> times and locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active searching; the researchers were therefore not altogether surprised to find that ______", "bodyPlain": "In a 2015 study, Marcus Webb and Aline Duarte compared the foraging behaviors of wild capuchin monkeys in Costa Rica's rainforests with those of captive capuchins in a large zoo enclosure. The researchers noted that previous studies focused on other primates have shown that providing animals with food at predictable times and locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active searching; the researchers were therefore not altogether surprised to find that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2015 年的一項研究中，Marcus Webb 與 Aline Duarte 比較了哥斯大黎加雨林中野生捲尾猴與大型動物園圍欄中圈養捲尾猴的覓食行為。研究人員指出，先前針對其他靈長類的研究顯示，在可預期的時間和地點供應食物給動物（這在圈養環境中很常見），可能因為減少了主動搜尋的需求，而無意間促成新的重複行為；因此，研究人員發現以下結果時並不太意外：______", "opts": {"A": "captive capuchins repeatedly turned over the same empty feeding dishes long after any food had been removed, whereas wild capuchins moved on quickly once a foraging site was exhausted.", "B": "during feeding episodes, captive capuchins showed much more aggression toward each other than wild capuchins did toward members of their own troop.", "C": "when caretakers hid food inside puzzle feeders, captive capuchins solved the puzzles more quickly than wild capuchins located comparable hidden food sources.", "D": "captive capuchins showed a repetitive pacing behavior near enclosure walls as feeding times approached, whereas wild capuchins showed no comparable behavior before a successful hunt."}, "optsZh": {"A": "在食物被移走很久之後，圈養捲尾猴仍一再翻動同樣的空食盤，而野生捲尾猴在覓食地點被吃光後會很快離開。", "B": "在進食過程中，圈養捲尾猴彼此之間的攻擊性比野生捲尾猴對同群成員高得多。", "C": "當照顧者把食物藏在益智餵食器中時，圈養捲尾猴解開謎題的速度比野生捲尾猴找到類似隱藏食物更快。", "D": "在餵食時間接近時，圈養捲尾猴會在圍欄牆邊出現重複踱步的行為，而野生捲尾猴在成功獵食前沒有類似行為。"}, "answer": "A", "expl": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced cognitive engagement.", "explZh": ""}, {"id": "14.2", "label": "Mock 14.2", "n": 14, "concept": "Inferences: complete a research finding that parallels an expectation set up by prior findings about captivity and purposeless repetitive behavior.", "vocab": false, "body": "In a 2012 study, Renata Silva and Owen Blackwood <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compared\" target=\"_blank\" rel=\"noopener\">compared<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nest-building\" target=\"_blank\" rel=\"noopener\">nest-building<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=behaviors\" target=\"_blank\" rel=\"noopener\">behaviors<\/a> of wild orangutans in Borneo with those of captive orangutans at a large sanctuary. The researchers noted that previous studies focused on other great apes have shown that providing animals with pre-cut nesting materials at fixed times, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active material selection; the researchers were therefore not altogether surprised to find that ______", "bodyPlain": "In a 2012 study, Renata Silva and Owen Blackwood compared the nest-building behaviors of wild orangutans in Borneo with those of captive orangutans at a large sanctuary. The researchers noted that previous studies focused on other great apes have shown that providing animals with pre-cut nesting materials at fixed times, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active material selection; the researchers were therefore not altogether surprised to find that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2012 年的一項研究中，Renata Silva 與 Owen Blackwood 比較了婆羅洲野生紅毛猩猩與大型保育區圈養紅毛猩猩的築巢行為。研究人員指出，先前針對其他大型猿類的研究顯示，在固定時間提供預先裁好的築巢材料給動物（這在圈養環境中很常見），可能因為減少了主動挑選材料的需求，而無意間促成新的重複行為；因此，研究人員發現以下結果時並不太意外：______", "opts": {"A": "captive orangutans repeatedly rearranged the same small pile of nesting material without ever completing a usable nest, whereas wild orangutans built complete, structurally sound nests each evening.", "B": "during nest-building episodes, captive orangutans showed much less vocalization than wild orangutans did while gathering branches.", "C": "when caretakers scattered fresh branches unpredictably, captive orangutans located them more quickly than wild orangutans located naturally growing branches.", "D": "captive orangutans showed a repetitive swaying behavior near feeding stations as mealtimes approached, whereas wild orangutans showed no comparable behavior before building a nest."}, "optsZh": {"A": "圈養紅毛猩猩一再整理同一小堆築巢材料，卻從未完成可用的巢，而野生紅毛猩猩每天傍晚都會築出完整、結構穩固的巢。", "B": "在築巢過程中，圈養紅毛猩猩的發聲比野生紅毛猩猩採集樹枝時少得多。", "C": "當照顧者不可預測地散放新鮮樹枝時，圈養紅毛猩猩找到它們的速度比野生紅毛猩猩找到自然生長之樹枝更快。", "D": "在進食時間接近時，圈養紅毛猩猩會在餵食站附近出現重複搖晃的行為，而野生紅毛猩猩在築巢前沒有類似行為。"}, "answer": "A", "expl": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced material-selection engagement.", "explZh": ""}, {"id": "14.3", "label": "Mock 14.3", "n": 14, "concept": "Inferences: complete a research finding that parallels an expectation set up by prior findings about captivity and purposeless repetitive behavior.", "vocab": false, "body": "In a 2018 study, Idris Osei and Camila Rocha <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compared\" target=\"_blank\" rel=\"noopener\">compared<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=digging\" target=\"_blank\" rel=\"noopener\">digging<\/a> behaviors of wild meerkats in the Kalahari with those of captive meerkats at a wildlife park. The researchers noted that previous studies focused on other burrowing mammals have shown that providing animals with pre-dug shelters, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active burrow <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=construction\" target=\"_blank\" rel=\"noopener\" data-w=\"construction\" data-pos=\"n.\" data-en=\"the process of building something\" data-zh=\"建造；營建\">construction<\/a>; the researchers were therefore not altogether surprised to find that ______", "bodyPlain": "In a 2018 study, Idris Osei and Camila Rocha compared the digging behaviors of wild meerkats in the Kalahari with those of captive meerkats at a wildlife park. The researchers noted that previous studies focused on other burrowing mammals have shown that providing animals with pre-dug shelters, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active burrow construction; the researchers were therefore not altogether surprised to find that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2018 年的一項研究中，Idris Osei 與 Camila Rocha 比較了喀拉哈里沙漠野生狐獴與野生動物園圈養狐獴的挖掘行為。研究人員指出，先前針對其他穴居哺乳類的研究顯示，提供預先挖好的庇護所給動物（這在圈養環境中很常見），可能因為減少了主動建造洞穴的需求，而無意間促成新的重複行為；因此，研究人員發現以下結果時並不太意外：______", "opts": {"A": "captive meerkats repeatedly scraped at the same patch of soil near their shelter entrance without ever extending the burrow, whereas wild meerkats continuously extended their burrow systems.", "B": "during digging episodes, captive meerkats showed much more aggression toward each other than wild meerkats did toward members of their own group.", "C": "when caretakers buried food at unpredictable depths, captive meerkats located it more quickly than wild meerkats located naturally buried insects.", "D": "captive meerkats showed a repetitive sentry-posture behavior near enclosure walls as feeding times approached, whereas wild meerkats showed no comparable behavior before digging for food."}, "optsZh": {"A": "圈養狐獴一再刨挖庇護所入口附近同一塊土，卻從未擴展洞穴，而野生狐獴會持續擴展牠們的洞穴系統。", "B": "在挖掘過程中，圈養狐獴彼此之間的攻擊性比野生狐獴對同群成員高得多。", "C": "當照顧者把食物埋在不可預測的深度時，圈養狐獴找到食物的速度比野生狐獴找到自然埋藏之昆蟲更快。", "D": "在餵食時間接近時，圈養狐獴會在圍欄牆邊出現重複的站哨姿勢，而野生狐獴在挖掘食物前沒有類似行為。"}, "answer": "A", "expl": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced construction engagement.", "explZh": ""}, {"id": "14.4", "label": "Mock 14.4", "n": 14, "concept": "Inferences: complete a research finding that parallels an expectation set up by prior findings about captivity and purposeless repetitive behavior.", "vocab": false, "body": "In a 2020 study, Fatima Al-Rashid and Dmitri Volkov <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compared\" target=\"_blank\" rel=\"noopener\">compared<\/a> the nut-caching behaviors of wild <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=squirrel\" target=\"_blank\" rel=\"noopener\" data-w=\"squirrel\" data-pos=\"n.\" data-en=\"a small animal with a long bushy tail that lives in trees\" data-zh=\"松鼠\">squirrels<\/a> in a temperate forest with those of captive squirrels at a research facility. The researchers noted that previous studies focused on other rodents have shown that providing animals with food at fixed, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=predictable\" target=\"_blank\" rel=\"noopener\" data-w=\"predictable\" data-pos=\"adj.\" data-en=\"able to be known in advance\" data-zh=\"可預測的\">predictable<\/a> locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active spatial memory use; the researchers were therefore not altogether surprised to find that ______", "bodyPlain": "In a 2020 study, Fatima Al-Rashid and Dmitri Volkov compared the nut-caching behaviors of wild squirrels in a temperate forest with those of captive squirrels at a research facility. The researchers noted that previous studies focused on other rodents have shown that providing animals with food at fixed, predictable locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active spatial memory use; the researchers were therefore not altogether surprised to find that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2020 年的一項研究中，Fatima Al-Rashid 與 Dmitri Volkov 比較了溫帶森林中野生松鼠與研究機構中圈養松鼠的藏堅果行為。研究人員指出，先前針對其他囓齒動物的研究顯示，在固定、可預期的地點供應食物給動物（這在圈養環境中很常見），可能因為減少了主動運用空間記憶的需求，而無意間促成新的重複行為；因此，研究人員發現以下結果時並不太意外：______", "opts": {"A": "captive squirrels repeatedly dug and re-covered the same small patch of substrate without ever caching a nut there, whereas wild squirrels cached nuts across dozens of distinct, spatially separated sites.", "B": "during caching episodes, captive squirrels showed much less vigilance for predators than wild squirrels did while burying nuts.", "C": "when caretakers hid nuts in unpredictable locations, captive squirrels located them more quickly than wild squirrels located naturally hidden seeds.", "D": "captive squirrels showed a repetitive tail-flicking behavior near feeding stations as mealtimes approached, whereas wild squirrels showed no comparable behavior before caching food."}, "optsZh": {"A": "圈養松鼠一再挖掘又覆蓋同一小塊底材，卻從未在那裡藏過堅果，而野生松鼠會把堅果藏在數十個彼此分開的不同地點。", "B": "在藏食過程中，圈養松鼠對掠食者的警覺性比野生松鼠埋堅果時低得多。", "C": "當照顧者把堅果藏在不可預測的地點時，圈養松鼠找到它們的速度比野生松鼠找到自然隱藏之種子更快。", "D": "在進食時間接近時，圈養松鼠會在餵食站附近出現重複甩尾的行為，而野生松鼠在藏食物前沒有類似行為。"}, "answer": "A", "expl": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced spatial-memory engagement.", "explZh": ""}, {"id": "14.5", "label": "Mock 14.5", "n": 14, "concept": "Inferences: complete a research finding that parallels an expectation set up by prior findings about captivity and purposeless repetitive behavior.", "vocab": false, "body": "In a 2017 study, Leilani Kahale and Tobias Reinholt <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=compared\" target=\"_blank\" rel=\"noopener\">compared<\/a> the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=nest-defense\" target=\"_blank\" rel=\"noopener\">nest-defense<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=behaviors\" target=\"_blank\" rel=\"noopener\">behaviors<\/a> of wild gulls on a remote island colony with those of captive gulls at a coastal aviary. The researchers noted that previous studies focused on other seabirds have shown that providing animals with food at fixed times and locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active territorial patrolling; the researchers were therefore not altogether surprised to find that ______", "bodyPlain": "In a 2017 study, Leilani Kahale and Tobias Reinholt compared the nest-defense behaviors of wild gulls on a remote island colony with those of captive gulls at a coastal aviary. The researchers noted that previous studies focused on other seabirds have shown that providing animals with food at fixed times and locations, as is common in captive settings, may inadvertently facilitate the development of novel repetitive behaviors by reducing the need for active territorial patrolling; the researchers were therefore not altogether surprised to find that ______", "stem": "Which choice most logically completes the text?", "stemZh": "哪一個選項最合乎邏輯地完成本文？", "bodyZh": "在 2017 年的一項研究中，Leilani Kahale 與 Tobias Reinholt 比較了偏遠島嶼群落中野生海鷗與海岸鳥園中圈養海鷗的護巢行為。研究人員指出，先前針對其他海鳥的研究顯示，在固定時間和地點供應食物給動物（這在圈養環境中很常見），可能因為減少了主動巡視領域的需求，而無意間促成新的重複行為；因此，研究人員發現以下結果時並不太意外：______", "opts": {"A": "captive gulls repeatedly circled the same small perch near the feeding station without ever establishing a defended territory, whereas wild gulls actively patrolled and defended distinct nesting territories.", "B": "during feeding episodes, captive gulls showed much more aggression toward caretakers than wild gulls showed toward researchers observing their colony.", "C": "when caretakers scattered food unpredictably, captive gulls located it more quickly than wild gulls located naturally available fish.", "D": "captive gulls showed a repetitive head-bobbing behavior near enclosure walls as feeding times approached, whereas wild gulls showed no comparable behavior before defending a nest."}, "optsZh": {"A": "圈養海鷗一再繞著餵食站附近同一個小棲木打轉，卻從未建立需要防衛的領域，而野生海鷗會主動巡視並防衛各自的築巢領域。", "B": "在進食過程中，圈養海鷗對照顧者的攻擊性比野生海鷗對觀察其群落之研究人員高得多。", "C": "當照顧者不可預測地撒放食物時，圈養海鷗找到食物的速度比野生海鷗找到自然出現之魚類更快。", "D": "在餵食時間接近時，圈養海鷗會在圍欄牆邊出現重複點頭的行為，而野生海鷗在護巢前沒有類似行為。"}, "answer": "A", "expl": "Choice A describes a purposeless repetitive behavior unique to captivity, matching the setup about reduced patrolling engagement.", "explZh": ""}, {"id": "o15", "label": "Original Q15", "n": 15, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a comma-set-off descriptive phrase.", "vocab": false, "body": "In Auguste Escoffier&#x27;s 1903 cookbook titled Le Guide Culinaire, the chef included over 5,000 dishes, including Oeufs Aurore (baked eggs), Gambas (jumbo shrimp) in garlic sauce, and Tarte aux Pignons (pine nut tart). Such <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=iconic\" target=\"_blank\" rel=\"noopener\" data-w=\"iconic\" data-pos=\"adj.\" data-en=\"very famous and seen as a symbol of something\" data-zh=\"具代表性的；標誌性的\">iconic<\/a> French recipes, described in surprisingly brief <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detail<\/a> in Le Guide Culinaire, ______ the Victorian French cuisine Escoffier sought to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserve<\/a> in his encyclopedic book.", "bodyPlain": "In Auguste Escoffier's 1903 cookbook titled Le Guide Culinaire, the chef included over 5,000 dishes, including Oeufs Aurore (baked eggs), Gambas (jumbo shrimp) in garlic sauce, and Tarte aux Pignons (pine nut tart). Such iconic French recipes, described in surprisingly brief detail in Le Guide Culinaire, ______ the Victorian French cuisine Escoffier sought to preserve in his encyclopedic book.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在 Auguste Escoffier 1903 年出版的食譜《Le Guide Culinaire》中，這位主廚收錄了超過 5,000 道菜，包括 Oeufs Aurore（焗蛋）、蒜味醬大蝦（Gambas）和 Tarte aux Pignons（松子塔）。這些在《Le Guide Culinaire》中描述得出奇簡短的經典法國食譜，______ Escoffier 想在他這本百科全書式的著作中保存的維多利亞時代法國料理。", "opts": {"A": "epitomize", "B": "has epitomized", "C": "epitomizes", "D": "was epitomizing"}, "optsZh": {"A": "體現；作為典型（原形）", "B": "已經體現（現在完成式，單數）", "C": "體現；作為典型（第三人稱單數）", "D": "當時正在體現（過去進行式）"}, "answer": "A", "expl": "The subject 'Such iconic French recipes' is plural and the text is in present tense, so 'epitomize' is correct.", "explZh": "主詞「Such iconic French recipes」是複數，且為現在式，所以用「epitomize」。"}, {"id": "15.1", "label": "Mock 15.1", "n": 15, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a comma-set-off descriptive phrase.", "vocab": false, "body": "Such <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricate\" target=\"_blank\" rel=\"noopener\" data-w=\"intricate\" data-pos=\"adj.\" data-en=\"having many small parts or details arranged in a complicated way\" data-zh=\"錯綜複雜的；精細的\">intricate<\/a> mosaic floors, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=uncovered\" target=\"_blank\" rel=\"noopener\">uncovered<\/a> only recently beneath a much later marble <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=surface\" target=\"_blank\" rel=\"noopener\" data-w=\"surface\" data-pos=\"n.\" data-en=\"the outside or top layer of something\" data-zh=\"表面\">surface<\/a>, ______ the wealth and craftsmanship of the villa&#x27;s original owners.", "bodyPlain": "Such intricate mosaic floors, uncovered only recently beneath a much later marble surface, ______ the wealth and craftsmanship of the villa's original owners.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這些最近才在年代晚得多的大理石地面下被發現的精緻馬賽克地板，______ 這座別墅原始主人的財富與工藝水準。", "opts": {"A": "reveal", "B": "has revealed", "C": "reveals", "D": "was revealing"}, "optsZh": {"A": "揭示（原形）", "B": "已經揭示（現在完成式，單數）", "C": "揭示（第三人稱單數）", "D": "當時正在揭示（過去進行式）"}, "answer": "A", "expl": "The plural subject \"floors\" requires the plural verb \"reveal.\"", "explZh": ""}, {"id": "15.2", "label": "Mock 15.2", "n": 15, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a comma-set-off descriptive phrase.", "vocab": false, "body": "Such carefully <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserved<\/a> letters, stored for decades in a nondescript attic trunk, ______ a side of the family&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=history\" target=\"_blank\" rel=\"noopener\" data-w=\"history\" data-pos=\"n.\" data-en=\"the study or record of past events\" data-zh=\"歷史\">history<\/a> that no <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=publish\" target=\"_blank\" rel=\"noopener\" data-w=\"publish\" data-pos=\"v.\" data-en=\"to prepare and print a book, article, etc. for the public\" data-zh=\"出版；發表\">published<\/a> biography had ever mentioned.", "bodyPlain": "Such carefully preserved letters, stored for decades in a nondescript attic trunk, ______ a side of the family's history that no published biography had ever mentioned.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這些在一個不起眼的閣樓箱子裡存放了數十年、保存良好的信件，______ 家族歷史中任何已出版傳記都從未提過的一面。", "opts": {"A": "illuminate", "B": "has illuminated", "C": "illuminates", "D": "was illuminating"}, "optsZh": {"A": "闡明（原形）", "B": "已經闡明（現在完成式，單數）", "C": "闡明（第三人稱單數）", "D": "當時正在闡明（過去進行式）"}, "answer": "A", "expl": "The plural subject \"letters\" requires the plural verb \"illuminate.\"", "explZh": ""}, {"id": "15.3", "label": "Mock 15.3", "n": 15, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a comma-set-off descriptive phrase.", "vocab": false, "body": "Such <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=elaborate\" target=\"_blank\" rel=\"noopener\">elaborate<\/a> carved <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=doorways\" target=\"_blank\" rel=\"noopener\">doorways<\/a>, found only in the oldest quarter of the city, ______ a building <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">tradition<\/a> that largely disappeared after the region&#x27;s later conquest.", "bodyPlain": "Such elaborate carved doorways, found only in the oldest quarter of the city, ______ a building tradition that largely disappeared after the region's later conquest.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這些只出現在城市最古老街區的精緻雕刻門廊，______ 一種在該地區後來被征服後大致消失的建築傳統。", "opts": {"A": "represent", "B": "has represented", "C": "represents", "D": "was representing"}, "optsZh": {"A": "代表（原形）", "B": "已經代表（現在完成式，單數）", "C": "代表（第三人稱單數）", "D": "當時正在代表（過去進行式）"}, "answer": "A", "expl": "The plural subject \"doorways\" requires the plural verb \"represent.\"", "explZh": ""}, {"id": "15.4", "label": "Mock 15.4", "n": 15, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a comma-set-off descriptive phrase.", "vocab": false, "body": "Such meticulously kept ledgers, maintained by the same family for nearly two <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=century\" target=\"_blank\" rel=\"noopener\" data-w=\"century\" data-pos=\"n.\" data-en=\"a period of 100 years\" data-zh=\"世紀\">centuries<\/a>, ______ shifts in the local economy that no other <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=survive\" target=\"_blank\" rel=\"noopener\" data-w=\"survive\" data-pos=\"v.\" data-en=\"to continue to live or exist\" data-zh=\"存活\">surviving<\/a> record captures in such <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detail<\/a>.", "bodyPlain": "Such meticulously kept ledgers, maintained by the same family for nearly two centuries, ______ shifts in the local economy that no other surviving record captures in such detail.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這些由同一個家族保存了將近兩個世紀、記錄一絲不苟的帳簿，______ 當地經濟的變遷，而且沒有其他現存紀錄能如此詳細地記錄這些變遷。", "opts": {"A": "document", "B": "has documented", "C": "documents", "D": "was documenting"}, "optsZh": {"A": "記錄（原形）", "B": "已經記錄（現在完成式，單數）", "C": "記錄（第三人稱單數）", "D": "當時正在記錄（過去進行式）"}, "answer": "A", "expl": "The plural subject \"ledgers\" requires the plural verb \"document.\"", "explZh": ""}, {"id": "15.5", "label": "Mock 15.5", "n": 15, "concept": "Standard English Conventions: subject-verb agreement with a plural subject separated from its verb by a comma-set-off descriptive phrase.", "vocab": false, "body": "Such tightly woven baskets, traded widely along the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ancient\" target=\"_blank\" rel=\"noopener\" data-w=\"ancient\" data-pos=\"adj.\" data-en=\"belonging to the very distant past\" data-zh=\"古代的\">ancient<\/a> river route, ______ a level of technical skill that <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=archaeologist\" target=\"_blank\" rel=\"noopener\" data-w=\"archaeologist\" data-pos=\"n.\" data-en=\"a scientist who studies past human life through remains and objects\" data-zh=\"考古學家\">archaeologists<\/a> had not previously <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributed<\/a> to the region&#x27;s early inhabitants.", "bodyPlain": "Such tightly woven baskets, traded widely along the ancient river route, ______ a level of technical skill that archaeologists had not previously attributed to the region's early inhabitants.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "這些沿著古代河道廣泛交易、編織緊密的籃子，______ 一種考古學家過去未曾歸功於該地區早期居民的技術水準。", "opts": {"A": "demonstrate", "B": "has demonstrated", "C": "demonstrates", "D": "was demonstrating"}, "optsZh": {"A": "展現（原形）", "B": "已經展現（現在完成式，單數）", "C": "展現（第三人稱單數）", "D": "當時正在展現（過去進行式）"}, "answer": "A", "expl": "The plural subject \"baskets\" requires the plural verb \"demonstrate.\"", "explZh": ""}, {"id": "o16", "label": "Original Q16", "n": 16, "concept": "Standard English Conventions (Boundaries): correctly divide a sentence so the second sentence opens with a subordinating conjunction plus a main clause.", "vocab": false, "body": "Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this ______ the hole&#x27;s small size <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=restrict\" target=\"_blank\" rel=\"noopener\" data-w=\"restrict\" data-pos=\"v.\" data-en=\"to limit something\" data-zh=\"限制\">restricts<\/a> light to a single ray, all light passing through the hole can only arrive at a single <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=destination\" target=\"_blank\" rel=\"noopener\" data-w=\"destination\" data-pos=\"n.\" data-en=\"the place where someone or something is going\" data-zh=\"目的地\">destination<\/a>, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=eliminate\" target=\"_blank\" rel=\"noopener\" data-w=\"eliminate\" data-pos=\"v.\" data-en=\"to remove or get rid of something completely\" data-zh=\"消除；排除\">eliminating<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=diffraction\" target=\"_blank\" rel=\"noopener\" data-w=\"diffraction\" data-pos=\"n.\" data-en=\"the spreading of light or waves as they pass an edge or opening\" data-zh=\"繞射\">diffraction<\/a> and ensuring a clear image.", "bodyPlain": "Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this ______ the hole's small size restricts light to a single ray, all light passing through the hole can only arrive at a single destination, eliminating diffraction and ensuring a clear image.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "想想針孔相機的原理：光線穿過一個小孔，形成聚焦的投影影像。光線圖揭示了這是如何 ______ 小孔的尺寸很小，把光線限制為單一光束，所有穿過小孔的光只能抵達單一終點，消除繞射並確保影像清晰。", "opts": {"A": "works because", "B": "works. Because", "C": "works, it's because", "D": "works: it's because"}, "optsZh": {"A": "運作，因為（無標點）", "B": "運作。因為（句號分開）", "C": "運作，那是因為（逗號連接兩個獨立子句）", "D": "運作：那是因為（冒號）"}, "answer": "B", "expl": "'This works' is a complete sentence; 'Because ... , all light ... can only arrive ...' starts a new sentence.", "explZh": "「this works」是完整句子；「Because…, all light…」是另一個新句子，所以用句號分開。"}, {"id": "16.1", "label": "Mock 16.1", "n": 16, "concept": "Standard English Conventions (Boundaries): correctly divide a sentence so the second sentence opens with a subordinating conjunction plus a main clause.", "vocab": false, "body": "Consider the mechanics of a simple lever: a small force applied far from the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=pivot\" target=\"_blank\" rel=\"noopener\" data-w=\"pivot\" data-pos=\"v.\" data-en=\"to turn around a central point\" data-zh=\"以……為軸旋轉\">pivot<\/a> lifts a much larger weight placed close to it. A force diagram <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveals<\/a> how this ______ the pivot&#x27;s position <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=determine\" target=\"_blank\" rel=\"noopener\" data-w=\"determine\" data-pos=\"v.\" data-en=\"to discover the facts about something; to decide\" data-zh=\"判定；確定\">determines<\/a> how far each end must travel, all the force applied at the long end is multiplied at the short end, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">producing<\/a> greater lifting power.", "bodyPlain": "Consider the mechanics of a simple lever: a small force applied far from the pivot lifts a much larger weight placed close to it. A force diagram reveals how this ______ the pivot's position determines how far each end must travel, all the force applied at the long end is multiplied at the short end, producing greater lifting power.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "想想簡單槓桿的原理：在遠離支點處施加的小力，可以舉起放在支點附近、重得多的物體。力圖揭示了這是如何 ______ 支點的位置決定兩端各需移動多遠，施加在長端的所有力量會在短端被放大，產生更大的舉升力。", "opts": {"A": "works because", "B": "works. Because", "C": "works, it's because", "D": "works: it's because"}, "optsZh": {"A": "運作，因為（無標點）", "B": "運作。因為（句號分開）", "C": "運作，那是因為（逗號連接兩個獨立子句）", "D": "運作：那是因為（冒號）"}, "answer": "B", "expl": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences.", "explZh": ""}, {"id": "16.2", "label": "Mock 16.2", "n": 16, "concept": "Standard English Conventions (Boundaries): correctly divide a sentence so the second sentence opens with a subordinating conjunction plus a main clause.", "vocab": false, "body": "Consider the mechanics of a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prism\" target=\"_blank\" rel=\"noopener\" data-w=\"prism\" data-pos=\"n.\" data-en=\"a band of rainbow colors made by light\" data-zh=\"稜鏡光；光譜\">prism<\/a>: white light entering one face exits the other split into a visible band of colors. A ray diagram <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveals<\/a> how this ______ each wavelength of light bends by a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=slightly\" target=\"_blank\" rel=\"noopener\" data-w=\"slightly\" data-pos=\"adv.\" data-en=\"a little\" data-zh=\"稍微；略微\">slightly<\/a> different amount, all the colors that entered together spread apart as they exit, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">producing<\/a> a visible spectrum.", "bodyPlain": "Consider the mechanics of a prism: white light entering one face exits the other split into a visible band of colors. A ray diagram reveals how this ______ each wavelength of light bends by a slightly different amount, all the colors that entered together spread apart as they exit, producing a visible spectrum.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "想想稜鏡的原理：從一面射入的白光，從另一面射出時會分散成可見的色帶。光線圖揭示了這是如何 ______ 每種波長的光彎折的程度略有不同，一起射入的所有顏色在射出時會分散開來，產生可見光譜。", "opts": {"A": "works because", "B": "works. Because", "C": "works, it's because", "D": "works: it's because"}, "optsZh": {"A": "運作，因為（無標點）", "B": "運作。因為（句號分開）", "C": "運作，那是因為（逗號連接兩個獨立子句）", "D": "運作：那是因為（冒號）"}, "answer": "B", "expl": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences.", "explZh": ""}, {"id": "16.3", "label": "Mock 16.3", "n": 16, "concept": "Standard English Conventions (Boundaries): correctly divide a sentence so the second sentence opens with a subordinating conjunction plus a main clause.", "vocab": false, "body": "Consider the mechanics of a suspension bridge: the roadway hangs from cables anchored at towers on either end. A load diagram <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveals<\/a> how this ______ the curved cables <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=convert\" target=\"_blank\" rel=\"noopener\" data-w=\"convert\" data-pos=\"v.\" data-en=\"to change something into a different form\" data-zh=\"轉換\">convert<\/a> the roadway&#x27;s weight into <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tension\" target=\"_blank\" rel=\"noopener\" data-w=\"tension\" data-pos=\"n.\" data-en=\"a feeling of strain between different forces or ideas\" data-zh=\"張力；緊張關係\">tension<\/a>, all the downward force on the deck is redirected along the cables to the towers, keeping the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structure<\/a> stable.", "bodyPlain": "Consider the mechanics of a suspension bridge: the roadway hangs from cables anchored at towers on either end. A load diagram reveals how this ______ the curved cables convert the roadway's weight into tension, all the downward force on the deck is redirected along the cables to the towers, keeping the structure stable.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "想想吊橋的原理：橋面懸吊在兩端高塔所固定的纜索上。載重圖揭示了這是如何 ______ 弧形纜索把橋面的重量轉換為張力，橋面上所有向下的力會沿著纜索被導向高塔，使結構保持穩定。", "opts": {"A": "works because", "B": "works. Because", "C": "works, it's because", "D": "works: it's because"}, "optsZh": {"A": "運作，因為（無標點）", "B": "運作。因為（句號分開）", "C": "運作，那是因為（逗號連接兩個獨立子句）", "D": "運作：那是因為（冒號）"}, "answer": "B", "expl": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences.", "explZh": ""}, {"id": "16.4", "label": "Mock 16.4", "n": 16, "concept": "Standard English Conventions (Boundaries): correctly divide a sentence so the second sentence opens with a subordinating conjunction plus a main clause.", "vocab": false, "body": "Consider the mechanics of a refrigerator: a warm kitchen stays <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=separate\" target=\"_blank\" rel=\"noopener\" data-w=\"separate\" data-pos=\"v.\" data-en=\"to divide or move things apart\" data-zh=\"分開；分離\">separate<\/a> from a cold interior compartment. A cycle diagram <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveals<\/a> how this ______ a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=circulate\" target=\"_blank\" rel=\"noopener\" data-w=\"circulate\" data-pos=\"v.\" data-en=\"to pass or spread from person to person\" data-zh=\"流傳；傳播\">circulating<\/a> refrigerant <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=absorb\" target=\"_blank\" rel=\"noopener\" data-w=\"absorb\" data-pos=\"v.\" data-en=\"to take in a substance\" data-zh=\"吸收\">absorbs<\/a> heat inside the compartment and releases it outside, all the warmth removed from the food is carried away and expelled into the room, keeping the interior cold.", "bodyPlain": "Consider the mechanics of a refrigerator: a warm kitchen stays separate from a cold interior compartment. A cycle diagram reveals how this ______ a circulating refrigerant absorbs heat inside the compartment and releases it outside, all the warmth removed from the food is carried away and expelled into the room, keeping the interior cold.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "想想冰箱的原理：溫暖的廚房與寒冷的內部冷藏室保持隔絕。循環圖揭示了這是如何 ______ 循環的冷媒在冷藏室內吸收熱量並在外部釋放，從食物中移除的所有熱都被帶走並排到室內，使內部保持低溫。", "opts": {"A": "works because", "B": "works. Because", "C": "works, it's because", "D": "works: it's because"}, "optsZh": {"A": "運作，因為（無標點）", "B": "運作。因為（句號分開）", "C": "運作，那是因為（逗號連接兩個獨立子句）", "D": "運作：那是因為（冒號）"}, "answer": "B", "expl": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences.", "explZh": ""}, {"id": "16.5", "label": "Mock 16.5", "n": 16, "concept": "Standard English Conventions (Boundaries): correctly divide a sentence so the second sentence opens with a subordinating conjunction plus a main clause.", "vocab": false, "body": "Consider the mechanics of a telescope: distant, dim objects appear brighter and larger than they do to the naked eye. An optical diagram <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=reveal\" target=\"_blank\" rel=\"noopener\" data-w=\"reveal\" data-pos=\"v.\" data-en=\"to show something that was hidden\" data-zh=\"揭示；顯露\">reveals<\/a> how this ______ a large primary lens or mirror gathers far more light than the human eye can on its own, all the collected light is focused into a single, magnified image, revealing <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detail<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=invisible\" target=\"_blank\" rel=\"noopener\" data-w=\"invisible\" data-pos=\"adj.\" data-en=\"impossible to see\" data-zh=\"看不見的；無形的\">invisible<\/a> without the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=instrument\" target=\"_blank\" rel=\"noopener\" data-w=\"instrument\" data-pos=\"n.\" data-en=\"an object used for producing music\" data-zh=\"樂器；器具\">instrument<\/a>.", "bodyPlain": "Consider the mechanics of a telescope: distant, dim objects appear brighter and larger than they do to the naked eye. An optical diagram reveals how this ______ a large primary lens or mirror gathers far more light than the human eye can on its own, all the collected light is focused into a single, magnified image, revealing detail invisible without the instrument.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "想想望遠鏡的原理：遙遠、昏暗的物體看起來比肉眼所見更亮、更大。光學圖揭示了這是如何 ______ 大型主透鏡或主鏡收集的光遠多於人眼本身所能收集的，所有收集到的光被聚焦成單一、放大的影像，顯示出沒有儀器就看不到的細節。", "opts": {"A": "works because", "B": "works. Because", "C": "works, it's because", "D": "works: it's because"}, "optsZh": {"A": "運作，因為（無標點）", "B": "運作。因為（句號分開）", "C": "運作，那是因為（逗號連接兩個獨立子句）", "D": "運作：那是因為（冒號）"}, "answer": "B", "expl": "A period followed by a subordinate clause plus main clause correctly forms two complete sentences.", "explZh": ""}, {"id": "o17", "label": "Original Q17", "n": 17, "concept": "Standard English Conventions (Boundaries): no punctuation between a role/title noun and the proper name identifying who holds it.", "vocab": false, "body": "Long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributed<\/a> to Jacques-Louis David, the preeminent Neoclassical painter of his day, the 1801 <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=painting\" target=\"_blank\" rel=\"noopener\" data-w=\"painting\" data-pos=\"n.\" data-en=\"a picture made with paint\" data-zh=\"畫作\">painting<\/a> Marie Josephine Charlotte du Val d&#x27;Ognes gained fresh attention in the 1990s when art <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> discovered that the painting—which depicts a solitary young woman sketching—was actually the work of little-known French <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=portrait\" target=\"_blank\" rel=\"noopener\" data-w=\"portrait\" data-pos=\"n.\" data-en=\"a painting, drawing, or photograph of a person\" data-zh=\"肖像；畫像\">portrait<\/a> ______ Marie-Denise Villers (1774-1821).", "bodyPlain": "Long attributed to Jacques-Louis David, the preeminent Neoclassical painter of his day, the 1801 painting Marie Josephine Charlotte du Val d'Ognes gained fresh attention in the 1990s when art historians discovered that the painting—which depicts a solitary young woman sketching—was actually the work of little-known French portrait ______ Marie-Denise Villers (1774-1821).", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "1801 年的畫作《Marie Josephine Charlotte du Val d'Ognes》長期被認為出自當時首屈一指的新古典主義畫家 Jacques-Louis David 之手；1990 年代藝術史學家發現這幅描繪一名年輕女子獨自素描的畫作，其實是鮮為人知的法國肖像 ______ Marie-Denise Villers（1774–1821）的作品，使它重新受到關注。", "opts": {"A": "artist—", "B": "artist", "C": "artist:", "D": "artist,"}, "optsZh": {"A": "畫家（加破折號）", "B": "畫家（無標點）", "C": "畫家（加冒號）", "D": "畫家（加逗號）"}, "answer": "B", "expl": "'Little-known French portrait artist' is a title directly before the name Marie-Denise Villers, so no punctuation is used.", "explZh": "「little-known French portrait artist」是緊接在人名前的頭銜描述，中間不加標點。"}, {"id": "17.1", "label": "Mock 17.1", "n": 17, "concept": "Standard English Conventions (Boundaries): no punctuation between a role/title noun and the proper name identifying who holds it.", "vocab": false, "body": "Long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=credit\" target=\"_blank\" rel=\"noopener\" data-w=\"credit\" data-pos=\"n.\" data-en=\"public recognition for work done, e.g., on a film\" data-zh=\"（作品的）署名；功勞\">credited<\/a> to master luthier Antonio Rossi, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrate\" data-pos=\"v.\" data-en=\"to praise someone or something publicly\" data-zh=\"讚揚；頌揚\">celebrated<\/a> violin housed at the regional museum was recently found, after <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=extensive\" target=\"_blank\" rel=\"noopener\" data-w=\"extensive\" data-pos=\"adj.\" data-en=\"covering a large area or amount\" data-zh=\"廣泛的；大面積的\">extensive<\/a> restoration work, to be the creation of little-known apprentice ______ Concetta Farina (1802-1856).", "bodyPlain": "Long credited to master luthier Antonio Rossi, the celebrated violin housed at the regional museum was recently found, after extensive restoration work, to be the creation of little-known apprentice ______ Concetta Farina (1802-1856).", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "收藏在地區博物館、長期被認為出自製琴大師 Antonio Rossi 之手的著名小提琴，最近在大規模修復後被發現其實是鮮為人知的學徒 ______ Concetta Farina（1802–1856）的作品。", "opts": {"A": "luthier—", "B": "luthier", "C": "luthier:", "D": "luthier,"}, "optsZh": {"A": "製琴師（加破折號）", "B": "製琴師（無標點）", "C": "製琴師（加冒號）", "D": "製琴師（加逗號）"}, "answer": "B", "expl": "No punctuation should separate the role \"luthier\" from the name that identifies who holds it.", "explZh": ""}, {"id": "17.2", "label": "Mock 17.2", "n": 17, "concept": "Standard English Conventions (Boundaries): no punctuation between a role/title noun and the proper name identifying who holds it.", "vocab": false, "body": "Long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributed<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrate\" data-pos=\"v.\" data-en=\"to praise someone or something publicly\" data-zh=\"讚揚；頌揚\">celebrated<\/a> engraver Heinrich Voss, the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricate\" target=\"_blank\" rel=\"noopener\" data-w=\"intricate\" data-pos=\"adj.\" data-en=\"having many small parts or details arranged in a complicated way\" data-zh=\"錯綜複雜的；精細的\">intricate<\/a> frontispiece in the rare <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=edition\" target=\"_blank\" rel=\"noopener\" data-w=\"edition\" data-pos=\"n.\" data-en=\"a particular version of a book printed at one time\" data-zh=\"版本；版次\">edition<\/a> was recently discovered, after archival research, to be the work of little-known apprentice ______ Marta Kessler (1780-1834).", "bodyPlain": "Long attributed to celebrated engraver Heinrich Voss, the intricate frontispiece in the rare edition was recently discovered, after archival research, to be the work of little-known apprentice ______ Marta Kessler (1780-1834).", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "那本珍本中長期被認為出自著名雕版師 Heinrich Voss 之手的精緻卷首插畫，最近經檔案研究後被發現其實是鮮為人知的學徒 ______ Marta Kessler（1780–1834）的作品。", "opts": {"A": "engraver—", "B": "engraver", "C": "engraver:", "D": "engraver,"}, "optsZh": {"A": "雕版師（加破折號）", "B": "雕版師（無標點）", "C": "雕版師（加冒號）", "D": "雕版師（加逗號）"}, "answer": "B", "expl": "No punctuation should separate the role \"engraver\" from the name that identifies who holds it.", "explZh": ""}, {"id": "17.3", "label": "Mock 17.3", "n": 17, "concept": "Standard English Conventions (Boundaries): no punctuation between a role/title noun and the proper name identifying who holds it.", "vocab": false, "body": "Long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributed<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=well-known\" target=\"_blank\" rel=\"noopener\">well-known<\/a> cabinetmaker Louis Fontaine, the ornately carved chest in the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=collection\" target=\"_blank\" rel=\"noopener\" data-w=\"collection\" data-pos=\"n.\" data-en=\"a group of poems, stories, or objects gathered together\" data-zh=\"選集；收藏\">collection<\/a> was recently discovered, after close examination, to be the work of little-known journeyman ______ Pierre Aubert (1795-1841).", "bodyPlain": "Long attributed to well-known cabinetmaker Louis Fontaine, the ornately carved chest in the collection was recently discovered, after close examination, to be the work of little-known journeyman ______ Pierre Aubert (1795-1841).", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "收藏中那個長期被認為出自知名家具師傅 Louis Fontaine 之手、雕工華麗的櫃子，最近經仔細檢驗後被發現其實是鮮為人知的熟練工 ______ Pierre Aubert（1795–1841）的作品。", "opts": {"A": "journeyman—", "B": "journeyman", "C": "journeyman:", "D": "journeyman,"}, "optsZh": {"A": "熟練工（加破折號）", "B": "熟練工（無標點）", "C": "熟練工（加冒號）", "D": "熟練工（加逗號）"}, "answer": "B", "expl": "No punctuation should separate the role \"journeyman\" from the name that identifies who holds it.", "explZh": ""}, {"id": "17.4", "label": "Mock 17.4", "n": 17, "concept": "Standard English Conventions (Boundaries): no punctuation between a role/title noun and the proper name identifying who holds it.", "vocab": false, "body": "Long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=credit\" target=\"_blank\" rel=\"noopener\" data-w=\"credit\" data-pos=\"n.\" data-en=\"public recognition for work done, e.g., on a film\" data-zh=\"（作品的）署名；功勞\">credited<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=renowned\" target=\"_blank\" rel=\"noopener\" data-w=\"renowned\" data-pos=\"adj.\" data-en=\"famous and respected\" data-zh=\"著名的；享有聲譽的\">renowned<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=muralist\" target=\"_blank\" rel=\"noopener\">muralist<\/a> Diego Salazar, the fresco discovered beneath the plaster wall was recently confirmed, after pigment analysis, to be the work of little-known assistant ______ Beatriz Nunez (1888-1942).", "bodyPlain": "Long credited to renowned muralist Diego Salazar, the fresco discovered beneath the plaster wall was recently confirmed, after pigment analysis, to be the work of little-known assistant ______ Beatriz Nunez (1888-1942).", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "在灰泥牆下發現、長期被認為出自著名壁畫家 Diego Salazar 之手的濕壁畫，最近經顏料分析後被證實其實是鮮為人知的助手 ______ Beatriz Nunez（1888–1942）的作品。", "opts": {"A": "assistant—", "B": "assistant", "C": "assistant:", "D": "assistant,"}, "optsZh": {"A": "助手（加破折號）", "B": "助手（無標點）", "C": "助手（加冒號）", "D": "助手（加逗號）"}, "answer": "B", "expl": "No punctuation should separate the role \"assistant\" from the name that identifies who holds it.", "explZh": ""}, {"id": "17.5", "label": "Mock 17.5", "n": 17, "concept": "Standard English Conventions (Boundaries): no punctuation between a role/title noun and the proper name identifying who holds it.", "vocab": false, "body": "Long <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=attribute\" target=\"_blank\" rel=\"noopener\" data-w=\"attribute\" data-pos=\"v.\" data-en=\"to say that something is caused by a particular thing\" data-zh=\"把…歸因於\">attributed<\/a> to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrate\" data-pos=\"v.\" data-en=\"to praise someone or something publicly\" data-zh=\"讚揚；頌揚\">celebrated<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=composer\" target=\"_blank\" rel=\"noopener\" data-w=\"composer\" data-pos=\"n.\" data-en=\"a person who writes music\" data-zh=\"作曲家\">composer<\/a> Anton Reimer, the newly rediscovered <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscript<\/a> was confirmed, after handwriting analysis, to be the work of little-known copyist ______ Ilse Brandt (1810-1867).", "bodyPlain": "Long attributed to celebrated composer Anton Reimer, the newly rediscovered manuscript was confirmed, after handwriting analysis, to be the work of little-known copyist ______ Ilse Brandt (1810-1867).", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "長期被認為出自著名作曲家 Anton Reimer 之手、最近重新被發現的手稿，經筆跡分析後被證實其實是鮮為人知的抄譜員 ______ Ilse Brandt（1810–1867）的作品。", "opts": {"A": "copyist—", "B": "copyist", "C": "copyist:", "D": "copyist,"}, "optsZh": {"A": "抄譜員（加破折號）", "B": "抄譜員（無標點）", "C": "抄譜員（加冒號）", "D": "抄譜員（加逗號）"}, "answer": "B", "expl": "No punctuation should separate the role \"copyist\" from the name that identifies who holds it.", "explZh": ""}, {"id": "o18", "label": "Original Q18", "n": 18, "concept": "Standard English Conventions (Boundaries): close a sentence's opening em dash with a matching dash, using a comma to introduce the internal example list.", "vocab": false, "body": "In 1986, conceptual artist Sophie Calle asked twenty-three people, some of whom had been born without sight, to describe their image of beauty in rich <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=detail\" target=\"_blank\" rel=\"noopener\" data-w=\"detail\" data-pos=\"v.\" data-en=\"to describe something fully\" data-zh=\"詳述\">detail<\/a>. Calle paired <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=excerpt\" target=\"_blank\" rel=\"noopener\" data-w=\"excerpt\" data-pos=\"n.\" data-en=\"a short part taken from a longer text\" data-zh=\"節選；摘錄\">excerpts<\/a> of these conversations with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a>—both of interviewees and the items they ______ to powerful effect in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> The Blind.", "bodyPlain": "In 1986, conceptual artist Sophie Calle asked twenty-three people, some of whom had been born without sight, to describe their image of beauty in rich detail. Calle paired excerpts of these conversations with photographs—both of interviewees and the items they ______ to powerful effect in her exhibition The Blind.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "1986 年，觀念藝術家 Sophie Calle 請二十三個人（其中有些人天生失明）詳細描述他們心目中美的形象。Calle 將這些對話的節錄與照片配對——照片中既有受訪者，也有他們 ______ 在她的展覽《The Blind》中產生了強大的效果。", "opts": {"A": "described, from hair to grass to sculptures", "B": "described, from hair to grass to sculptures—", "C": "described—from hair to grass to sculptures,", "D": "described: from hair to grass to sculptures"}, "optsZh": {"A": "描述的，從頭髮到青草到雕塑（逗號，結尾無標點）", "B": "描述的，從頭髮到青草到雕塑——（逗號，結尾破折號）", "C": "描述的——從頭髮到青草到雕塑，（破折號，結尾逗號）", "D": "描述的：從頭髮到青草到雕塑（冒號）"}, "answer": "B", "expl": "The interruption 'both of interviewees and the items they described, from hair to grass to sculptures' opens with a dash after 'photographs,' so it must close with a matching dash before 'to powerful effect.'", "explZh": "「both of interviewees and the items they described」是由前面破折號開頭的插入語，所以要用破折號結束，選 B。"}, {"id": "18.1", "label": "Mock 18.1", "n": 18, "concept": "Standard English Conventions (Boundaries): close a sentence's opening em dash with a matching dash, using a comma to introduce the internal example list.", "vocab": false, "body": "In 1998, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=curator\" target=\"_blank\" rel=\"noopener\" data-w=\"curator\" data-pos=\"n.\" data-en=\"a person in charge of a museum collection or exhibition\" data-zh=\"策展人\">curator<\/a> Renata Osei paired oral histories from factory retirees with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a>—both of the workers themselves and the tools they ______ to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=striking\" target=\"_blank\" rel=\"noopener\" data-w=\"striking\" data-pos=\"adj.\" data-en=\"very noticeable or impressive\" data-zh=\"引人注目的；醒目的\">striking<\/a> effect in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> Hands That Built It.", "bodyPlain": "In 1998, curator Renata Osei paired oral histories from factory retirees with photographs—both of the workers themselves and the tools they ______ to striking effect in her exhibition Hands That Built It.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "1998 年，策展人 Renata Osei 將工廠退休人員的口述歷史與照片配對——照片中既有工人本身，也有他們 ______ 在她的展覽《Hands That Built It》中產生了驚人的效果。", "opts": {"A": "used, from wrenches to rivet guns to soldering irons", "B": "used, from wrenches to rivet guns to soldering irons—", "C": "used—from wrenches to rivet guns to soldering irons,", "D": "used: from wrenches to rivet guns to soldering irons"}, "optsZh": {"A": "使用的，從扳手到鉚釘槍到焊鐵（逗號，結尾無標點）", "B": "使用的，從扳手到鉚釘槍到焊鐵——（逗號，結尾破折號）", "C": "使用的——從扳手到鉚釘槍到焊鐵，（破折號，結尾逗號）", "D": "使用的：從扳手到鉚釘槍到焊鐵（冒號）"}, "answer": "B", "expl": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list.", "explZh": ""}, {"id": "18.2", "label": "Mock 18.2", "n": 18, "concept": "Standard English Conventions (Boundaries): close a sentence's opening em dash with a matching dash, using a comma to introduce the internal example list.", "vocab": false, "body": "In 2003, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=folklorist\" target=\"_blank\" rel=\"noopener\" data-w=\"folklorist\" data-pos=\"n.\" data-en=\"a person who studies the traditional stories and customs of a people\" data-zh=\"民俗學者\">folklorist<\/a> Amos Reinholt paired grandmothers&#x27; recorded recipes with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a>—both of the cooks themselves and the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingredient\" target=\"_blank\" rel=\"noopener\" data-w=\"ingredient\" data-pos=\"n.\" data-en=\"one of the foods used to make a dish\" data-zh=\"成分；原料\">ingredients<\/a> they ______ to moving effect in his <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> What We Kept.", "bodyPlain": "In 2003, folklorist Amos Reinholt paired grandmothers' recorded recipes with photographs—both of the cooks themselves and the ingredients they ______ to moving effect in his exhibition What We Kept.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "stemZh": "哪一個選項能使句子符合標準英語的規則？", "bodyZh": "2003 年，民俗學家 Amos Reinholt 將祖母們錄下的食譜與照片配對——照片中既有廚師本人，也有她們 ______ 在他的展覽《What We Kept》中產生了動人的效果。", "opts": {"A": "named, from saffron to sorrel to salted plums", "B": "named, from saffron to sorrel to salted plums—", "C": "named—from saffron to sorrel to salted plums,", "D": "named: from saffron to sorrel to salted plums"}, "optsZh": {"A": "說出名字的，從番紅花到酸模到鹽漬梅（逗號，結尾無標點）", "B": "說出名字的，從番紅花到酸模到鹽漬梅——（逗號，結尾破折號）", "C": "說出名字的——從番紅花到酸模到鹽漬梅，（破折號，結尾逗號）", "D": "說出名字的：從番紅花到酸模到鹽漬梅（冒號）"}, "answer": "B", "expl": "The sentence's opening dash must be closed with a matching dash, and a comma introduces the example list.", "explZh": ""}, {"id": "18.3", "label": "Mock 18.3", "n": 18, "concept": "Standard English Conventions (Boundaries): close a sentence's opening em dash with a matching dash, using a comma to introduce the internal example list.", "vocab": false, "body": "In 2011, artist Priya Chandran paired <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=handwritten\" target=\"_blank\" rel=\"noopener\">handwritten<\/a> letters from war veterans with <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=photograph\" target=\"_blank\" rel=\"noopener\" data-w=\"photograph\" data-pos=\"n.\" data-en=\"a picture made with a camera\" data-zh=\"照片\">photographs<\/a>—both of the veterans and the small objects they ______ to quiet effect in her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=exhibition\" target=\"_blank\" rel=\"noopener\" data-w=\"exhibition\" data-pos=\"n.\" data-en=\"a public display of art or objects\" data-zh=\"展覽\">exhibition<\/a> What Remained.", "bodyPlain": "In 2011, artist Priya Chandran paired handwritten letters from war veterans with p
