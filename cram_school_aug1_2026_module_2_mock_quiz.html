<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cram School Digital SAT Mock Test (Aug 1, 2026) - Module 2</title>
  <style>
    :root { --ink:#1f2937; --muted:#5b6677; --line:#d6dee9; --accent:#366994; --good:#116149; --bad:#a32727; --bg:#f5f7fa; --zh:#5b3f8a; --zhbg:#f7f3fc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:white; border-bottom:1px solid var(--line); padding:24px clamp(20px, 5vw, 54px); }
    h1 { margin:0; font-size:clamp(1.5rem, 3vw, 2.2rem); line-height:1.1; }
    .subtitle { margin:.45rem 0 0; color:var(--muted); font-size:1.05rem; }
    main { width:min(1120px, 100%); margin:0 auto; padding:20px clamp(14px, 3vw, 28px) 48px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; border-bottom:1px solid var(--line); }
    .toolbar button, .mini { border:1px solid var(--line); background:white; color:var(--ink); padding:8px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; }
    .toolbar button:hover, .mini:hover { border-color:var(--accent); }
    .toolbar button.active { background:var(--accent); color:white; border-color:var(--accent); }
    .toolbar .stat { margin-left:auto; color:var(--muted); font-weight:700; }
    .card { background:white; border:1px solid var(--line); border-radius:8px; margin:18px 0; overflow:hidden; }
    .card-head { padding:16px 22px; border-bottom:1px solid var(--line); background:#fbfcfe; }
    .card-head h2 { margin:0 0 4px; font-size:1.2rem; }
    .concept { color:var(--accent); font-weight:700; font-size:1rem; }
    .mock { padding:18px 22px 22px; border-bottom:1px solid #e7edf4; }
    .mock:last-child { border-bottom:0; }
    .mock h3 { margin:0 0 10px; font-size:1.08rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-weight:700; }
    .badge.orig { background:#fff6e5; color:#8a5a00; border-color:#f0d9a8; }
    .badge.wrong { background:#fff0f0; color:var(--bad); border-color:#f2c4c4; }
    .badge.mastered { background:#edf8f3; color:var(--good); border-color:#b9e2cf; }
    .question { margin-bottom:10px; font-size:1.02rem; }
    .stem { font-weight:700; margin:8px 0 12px; }
    a.dict { color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; font-weight:600; }
    a.dict:hover { background:#e8f1f9; }
    #tip { position:absolute; z-index:50; display:none; width:min(320px, 90vw); background:white; border:1px solid #c9b8e8; border-radius:10px; box-shadow:0 8px 24px rgba(40,20,80,.18); padding:12px 14px; font-size:.95rem; line-height:1.4; }
    #tip.show { display:block; }
    #tip .tw { font-weight:800; font-size:1.15rem; color:var(--zh); cursor:pointer; }
    #tip .tw small { color:var(--muted); font-weight:500; margin-left:6px; font-size:.8rem; }
    #tip .ten { display:block; margin-top:4px; color:#222; }
    #tip .tzh { display:block; color:var(--zh); font-weight:700; margin-top:2px; }
    #tip .tlink { display:inline-block; margin-top:8px; color:var(--accent); font-weight:700; font-size:.9rem; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:7px; padding:10px 12px; cursor:pointer; font-size:1rem; font-family:inherit; color:var(--ink); }
    .choice:hover { border-color:var(--accent); }
    .choice b { display:inline-block; min-width:1.6em; }
    .choice.correct { border-color:var(--good); background:#edf8f3; }
    .choice.incorrect { border-color:var(--bad); background:#fff0f0; }
    .choice:disabled { cursor:default; }
    .feedback { margin-top:10px; font-weight:700; min-height:1.4em; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback .zh { display:block; color:var(--zh); font-weight:500; margin-top:3px; }
    .trans { display:none; margin-top:12px; border:1px solid #e3d9f3; background:var(--zhbg); border-radius:8px; padding:12px 14px; }
    .trans.show { display:block; }
    .trans h4 { margin:0 0 6px; font-size:.95rem; color:var(--zh); }
    .trans .zhbody { white-space:pre-wrap; color:#3b2a5e; margin-bottom:8px; }
    .trans ol { margin:0; padding-left:1.2em; }
    .trans li { margin:4px 0; }
    .trans li .en { font-weight:600; }
    .trans li .cn { color:var(--zh); }
    .trans li.ok { background:#e9f6ef; border-radius:5px; padding:2px 6px; }
    .defs { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:8px; margin-top:8px; }
    .word { border:1px solid #d9cdf0; background:white; border-radius:8px; padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit; }
    .word:hover { border-color:var(--zh); background:#fbf8ff; }
    .word .w { font-weight:800; font-size:1.05rem; color:var(--ink); }
    .word .w small { color:var(--muted); font-weight:500; margin-left:4px; }
    .word .en { display:block; margin-top:3px; color:#333; }
    .word .cn { display:block; color:var(--zh); font-weight:600; }
    .word.ok { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good); }
    .rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 2px; }
    .mini { padding:5px 9px; font-size:.85rem; font-weight:600; }
    .panel { display:none; background:white; border:1px solid var(--line); border-radius:8px; padding:14px 18px; margin-bottom:14px; }
    .panel.show { display:block; }
    .panel table { width:100%; border-collapse:collapse; font-size:.95rem; }
    .panel th, .panel td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .empty { color:var(--muted); }
    .mocktoggle { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:#f8fafc; border-bottom:1px solid #e7edf4; }
    .mockBtn { border:1px dashed var(--accent); background:white; color:var(--accent); padding:8px 14px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.95rem; font-family:inherit; }
    .mockBtn:hover { background:#e8f1f9; }
    .mockBtn[aria-expanded="true"] { border-style:solid; background:#e8f1f9; }
    .mockhint { color:var(--muted); font-size:.9rem; }
    .mocktoggle.ready { background:#edf8f3; }
    .mocktoggle.ready .mockhint { color:var(--good); font-weight:700; }
    .mockwrap { display:none; }
    .mockwrap.show { display:block; }
    @media print { .toolbar, .rowbtns { display:none; } }
  </style>
</head>

  <script>
    const DATA = [{"id": "o1", "label": "Original Q1", "n": 1, "concept": "Words in Context: choose an adjective meaning fleeting/insubstantial for a place in historical memory.", "vocab": true, "body": "The War of 1812 has ______ place in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historical\" target=\"_blank\" rel=\"noopener\" data-w=\"historical\" data-pos=\"adj.\" data-en=\"related to history or the past\" data-zh=\"歷史的\">historical<\/a> memory in Britain, partly because it is overshadowed by the much larger concurrent conflict against Napoleonic France and partly because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essentially<\/a> maintained the geopolitical status quo for Britain: the country neither gained nor lost <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=significant\" target=\"_blank\" rel=\"noopener\" data-w=\"significant\" data-pos=\"adj.\" data-en=\"important or large enough to notice\" data-zh=\"顯著的；重要的\">significant<\/a> territory or position as a result of its <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=participation\" target=\"_blank\" rel=\"noopener\" data-w=\"participation\" data-pos=\"n.\" data-en=\"the act of taking part in something\" data-zh=\"參與\">participation<\/a> in the war.", "bodyPlain": "The War of 1812 has ______ place in historical memory in Britain, partly because it is overshadowed by the much larger concurrent conflict against Napoleonic France and partly because it essentially maintained the geopolitical status quo for Britain: the country neither gained nor lost significant territory or position as a result of its participation in the war.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1812 年戰爭在英國的歷史記憶中佔有 ______ 地位，一部分是因為它被同時期規模大得多的對拿破崙法國戰爭所掩蓋，另一部分是因為它基本上維持了英國的地緣政治現狀：英國並未因參戰而獲得或失去重要的領土或地位。", "opts": {"A": "a tenuous", "B": "an enduring", "C": "a contentious", "D": "a conspicuous"}, "optsZh": {"A": "一個薄弱的；不穩固的", "B": "一個持久的", "C": "一個有爭議的", "D": "一個顯眼的"}, "answer": "A", "expl": "The war is overshadowed and changed little for Britain, so its place in British memory is weak, or 'tenuous.'", "explZh": "這場戰爭被更大的戰爭掩蓋，對英國影響也不大，所以它在英國歷史記憶中的地位很薄弱（tenuous）。", "defs": {"A": {"w": "tenuous", "pos": "adj.", "en": "very weak or slight", "zh": "薄弱的；微弱的", "word": "tenuous"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的", "word": "enduring"}, "C": {"w": "contentious", "pos": "adj.", "en": "causing a lot of disagreement", "zh": "有爭議的", "word": "contentious"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "1.1", "label": "Mock 1.1", "n": 1, "concept": "Words in Context: choose an adjective meaning fleeting/insubstantial for a place in historical memory.", "vocab": true, "body": "The 1904 city referendum has ______ place in local memory, partly because it is overshadowed by the far larger municipal reforms passed the following decade and partly because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essentially<\/a> changed nothing about how the city was governed: the vote neither <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=expand\" target=\"_blank\" rel=\"noopener\" data-w=\"expand\" data-pos=\"v.\" data-en=\"to become or make larger\" data-zh=\"擴展\">expanded<\/a> nor <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=restrict\" target=\"_blank\" rel=\"noopener\" data-w=\"restrict\" data-pos=\"v.\" data-en=\"to limit something\" data-zh=\"限制\">restricted<\/a> any existing office&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=authority\" target=\"_blank\" rel=\"noopener\" data-w=\"authority\" data-pos=\"n.\" data-en=\"the power to make decisions or give orders\" data-zh=\"權力；權威\">authority<\/a>.", "bodyPlain": "The 1904 city referendum has ______ place in local memory, partly because it is overshadowed by the far larger municipal reforms passed the following decade and partly because it essentially changed nothing about how the city was governed: the vote neither expanded nor restricted any existing office's authority.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1904 年的市公投在地方記憶中佔有 ______ 地位，一部分是因為它被之後十年通過、規模大得多的市政改革所掩蓋，另一部分是因為它基本上沒有改變城市的治理方式：這次投票既未擴大也未限制任何既有職位的權力。", "opts": {"A": "a tenuous", "B": "an enduring", "C": "a contentious", "D": "a conspicuous"}, "optsZh": {"A": "一個薄弱的；不穩固的", "B": "一個持久的", "C": "一個有爭議的", "D": "一個顯眼的"}, "answer": "A", "expl": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial.", "explZh": "", "defs": {"A": {"w": "tenuous", "pos": "adj.", "en": "very weak or slight", "zh": "薄弱的；微弱的", "word": "tenuous"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的", "word": "enduring"}, "C": {"w": "contentious", "pos": "adj.", "en": "causing a lot of disagreement", "zh": "有爭議的", "word": "contentious"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "1.2", "label": "Mock 1.2", "n": 1, "concept": "Words in Context: choose an adjective meaning fleeting/insubstantial for a place in historical memory.", "vocab": true, "body": "The minor treaty of 1873 has ______ place in diplomatic <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=history\" target=\"_blank\" rel=\"noopener\" data-w=\"history\" data-pos=\"n.\" data-en=\"the study or record of past events\" data-zh=\"歷史\">history<\/a>, partly because it is overshadowed by the much larger peace <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> signed only two years later and partly because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essentially<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserved<\/a> the prewar borders: neither side gained nor ceded any meaningful territory as a result.", "bodyPlain": "The minor treaty of 1873 has ______ place in diplomatic history, partly because it is overshadowed by the much larger peace settlement signed only two years later and partly because it essentially preserved the prewar borders: neither side gained nor ceded any meaningful territory as a result.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1873 年的那項小條約在外交史上佔有 ______ 地位，一部分是因為它被僅僅兩年後簽署、規模大得多的和平協議所掩蓋，另一部分是因為它基本上維持了戰前的邊界：雙方都沒有因此獲得或割讓任何有意義的領土。", "opts": {"A": "a tenuous", "B": "an enduring", "C": "a contentious", "D": "a conspicuous"}, "optsZh": {"A": "一個薄弱的；不穩固的", "B": "一個持久的", "C": "一個有爭議的", "D": "一個顯眼的"}, "answer": "A", "expl": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial.", "explZh": "", "defs": {"A": {"w": "tenuous", "pos": "adj.", "en": "very weak or slight", "zh": "薄弱的；微弱的", "word": "tenuous"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的", "word": "enduring"}, "C": {"w": "contentious", "pos": "adj.", "en": "causing a lot of disagreement", "zh": "有爭議的", "word": "contentious"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "1.3", "label": "Mock 1.3", "n": 1, "concept": "Words in Context: choose an adjective meaning fleeting/insubstantial for a place in historical memory.", "vocab": true, "body": "The band&#x27;s 1998 farewell tour has ______ place in music <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=history\" target=\"_blank\" rel=\"noopener\" data-w=\"history\" data-pos=\"n.\" data-en=\"the study or record of past events\" data-zh=\"歷史\">history<\/a>, partly because it is overshadowed by the group&#x27;s far more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=celebrate\" target=\"_blank\" rel=\"noopener\" data-w=\"celebrate\" data-pos=\"v.\" data-en=\"to praise someone or something publicly\" data-zh=\"讚揚；頌揚\">celebrated<\/a> reunion a decade later and partly because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essentially<\/a> changed nothing about the band&#x27;s standing: their record sales and public profile remained about the same afterward.", "bodyPlain": "The band's 1998 farewell tour has ______ place in music history, partly because it is overshadowed by the group's far more celebrated reunion a decade later and partly because it essentially changed nothing about the band's standing: their record sales and public profile remained about the same afterward.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這個樂團 1998 年的告別巡演在音樂史上佔有 ______ 地位，一部分是因為它被十年後備受讚譽的重組所掩蓋，另一部分是因為它基本上沒有改變樂團的地位：之後他們的唱片銷量與知名度大致維持不變。", "opts": {"A": "a tenuous", "B": "an enduring", "C": "a contentious", "D": "a conspicuous"}, "optsZh": {"A": "一個薄弱的；不穩固的", "B": "一個持久的", "C": "一個有爭議的", "D": "一個顯眼的"}, "answer": "A", "expl": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial.", "explZh": "", "defs": {"A": {"w": "tenuous", "pos": "adj.", "en": "very weak or slight", "zh": "薄弱的；微弱的", "word": "tenuous"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的", "word": "enduring"}, "C": {"w": "contentious", "pos": "adj.", "en": "causing a lot of disagreement", "zh": "有爭議的", "word": "contentious"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "1.4", "label": "Mock 1.4", "n": 1, "concept": "Words in Context: choose an adjective meaning fleeting/insubstantial for a place in historical memory.", "vocab": true, "body": "The 1962 merger between the two small shipping <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=company\" target=\"_blank\" rel=\"noopener\" data-w=\"company\" data-pos=\"n.\" data-en=\"a business that makes or sells goods or services\" data-zh=\"公司\">companies<\/a> has ______ place in business history, partly because it is overshadowed by the much larger <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industry\" target=\"_blank\" rel=\"noopener\" data-w=\"industry\" data-pos=\"n.\" data-en=\"the businesses that make a particular product\" data-zh=\"產業；工業\">industry<\/a> consolidation that followed in the 1970s and partly because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essentially<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=preserve\" target=\"_blank\" rel=\"noopener\" data-w=\"preserve\" data-pos=\"v.\" data-en=\"to keep something safe from harm or change\" data-zh=\"保存\">preserved<\/a> each company&#x27;s original routes: neither firm expanded nor lost any of its existing shipping lanes.", "bodyPlain": "The 1962 merger between the two small shipping companies has ______ place in business history, partly because it is overshadowed by the much larger industry consolidation that followed in the 1970s and partly because it essentially preserved each company's original routes: neither firm expanded nor lost any of its existing shipping lanes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1962 年兩家小航運公司的合併在商業史上佔有 ______ 地位，一部分是因為它被 1970 年代規模大得多的產業整併所掩蓋，另一部分是因為它基本上保留了各公司原本的航線：兩家公司都沒有擴張或失去任何既有的航道。", "opts": {"A": "a tenuous", "B": "an enduring", "C": "a contentious", "D": "a conspicuous"}, "optsZh": {"A": "一個薄弱的；不穩固的", "B": "一個持久的", "C": "一個有爭議的", "D": "一個顯眼的"}, "answer": "A", "expl": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial.", "explZh": "", "defs": {"A": {"w": "tenuous", "pos": "adj.", "en": "very weak or slight", "zh": "薄弱的；微弱的", "word": "tenuous"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的", "word": "enduring"}, "C": {"w": "contentious", "pos": "adj.", "en": "causing a lot of disagreement", "zh": "有爭議的", "word": "contentious"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "1.5", "label": "Mock 1.5", "n": 1, "concept": "Words in Context: choose an adjective meaning fleeting/insubstantial for a place in historical memory.", "vocab": true, "body": "The senator&#x27;s first term has ______ place in the state&#x27;s political <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=history\" target=\"_blank\" rel=\"noopener\" data-w=\"history\" data-pos=\"n.\" data-en=\"the study or record of past events\" data-zh=\"歷史\">history<\/a>, partly because it is overshadowed by the far more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=consequential\" target=\"_blank\" rel=\"noopener\" data-w=\"consequential\" data-pos=\"adj.\" data-en=\"important; having significant results\" data-zh=\"重大的；影響深遠的\">consequential<\/a> term that followed and partly because it <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=essential\" target=\"_blank\" rel=\"noopener\" data-w=\"essential\" data-pos=\"adj.\" data-en=\"absolutely necessary\" data-zh=\"必要的；不可或缺的\">essentially<\/a> maintained the legislative status quo: no major law was passed or repealed as a result of her time in office.", "bodyPlain": "The senator's first term has ______ place in the state's political history, partly because it is overshadowed by the far more consequential term that followed and partly because it essentially maintained the legislative status quo: no major law was passed or repealed as a result of her time in office.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "這位參議員的第一個任期在該州政治史上佔有 ______ 地位，一部分是因為它被之後影響深遠得多的任期所掩蓋，另一部分是因為它基本上維持了立法現狀：她任內沒有通過或廢除任何重大法律。", "opts": {"A": "a tenuous", "B": "an enduring", "C": "a contentious", "D": "a conspicuous"}, "optsZh": {"A": "一個薄弱的；不穩固的", "B": "一個持久的", "C": "一個有爭議的", "D": "一個顯眼的"}, "answer": "A", "expl": "Being overshadowed and inconsequential points to a word meaning fleeting or insubstantial.", "explZh": "", "defs": {"A": {"w": "tenuous", "pos": "adj.", "en": "very weak or slight", "zh": "薄弱的；微弱的", "word": "tenuous"}, "B": {"w": "enduring", "pos": "adj.", "en": "lasting for a long time", "zh": "持久的", "word": "enduring"}, "C": {"w": "contentious", "pos": "adj.", "en": "causing a lot of disagreement", "zh": "有爭議的", "word": "contentious"}, "D": {"w": "conspicuous", "pos": "adj.", "en": "very easy to notice", "zh": "顯眼的；引人注目的", "word": "conspicuous"}}}, {"id": "o2", "label": "Original Q2", "n": 2, "concept": "Words in Context: choose a phrase meaning \"expressed through/shown in\" a set of concrete features.", "vocab": true, "body": "In 1891, design artist William Morris cofounded the Kelmscott Press, which printed editions of books using preindustrial methods. Historians argue that Morris&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=repudiation\" target=\"_blank\" rel=\"noopener\" data-w=\"repudiation\" data-pos=\"n.\" data-en=\"the act of rejecting or refusing to accept something\" data-zh=\"否定；拒絕接受\">repudiation<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=industrialization\" target=\"_blank\" rel=\"noopener\" data-w=\"industrialization\" data-pos=\"n.\" data-en=\"the development of industries in a country\" data-zh=\"工業化\">industrialization<\/a> is ______ the Kelmscott editions&#x27; use of handmade materials and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=intricate\" target=\"_blank\" rel=\"noopener\" data-w=\"intricate\" data-pos=\"adj.\" data-en=\"having many small parts or details arranged in a complicated way\" data-zh=\"錯綜複雜的；精細的\">intricate<\/a> ornamentation reminiscent of medieval <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=manuscript\" target=\"_blank\" rel=\"noopener\" data-w=\"manuscript\" data-pos=\"n.\" data-en=\"an author&#x27;s original text before it is published\" data-zh=\"手稿\">manuscripts<\/a>; these meticulously handcrafted elements exemplify the artistry involved.", "bodyPlain": "In 1891, design artist William Morris cofounded the Kelmscott Press, which printed editions of books using preindustrial methods. Historians argue that Morris's repudiation of industrialization is ______ the Kelmscott editions' use of handmade materials and intricate ornamentation reminiscent of medieval manuscripts; these meticulously handcrafted elements exemplify the artistry involved.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1891 年，設計藝術家 William Morris 共同創辦了 Kelmscott 出版社，以前工業時代的方法印製書籍。歷史學家認為，Morris 對工業化的排斥 ______ Kelmscott 版本使用的手工材料與令人聯想到中世紀手抄本的精緻裝飾；這些精心手工製作的元素正體現了其中的藝術性。", "opts": {"A": "insensible to", "B": "manifest in", "C": "scrutinized by", "D": "complicated by"}, "optsZh": {"A": "對……無感的", "B": "顯現於", "C": "受到……仔細審查", "D": "因……而複雜化"}, "answer": "B", "expl": "The handmade materials and medieval ornament show Morris's rejection of industry, so his repudiation is 'manifest in' (shown in) the editions.", "explZh": "手工材料與中世紀風格裝飾呈現了 Morris 對工業化的排斥，所以這種排斥「顯現於（manifest in）」這些版本中。", "defs": {"A": {"pos": "phr.", "en": "not aware of or not affected by", "zh": "對……無感的；未察覺的", "word": "insensible to"}, "B": {"pos": "phr.", "en": "clearly shown in", "zh": "顯現於……", "word": "manifest in"}, "C": {"pos": "phr.", "en": "examined very carefully by", "zh": "受到……仔細審查", "word": "scrutinized by"}, "D": {"pos": "phr.", "en": "made more difficult or confusing by", "zh": "因……而複雜化", "word": "complicated by"}}}, {"id": "2.1", "label": "Mock 2.1", "n": 2, "concept": "Words in Context: choose a phrase meaning \"expressed through/shown in\" a set of concrete features.", "vocab": true, "body": "In 1925, architect Elin Karlsson designed a house <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=entirely\" target=\"_blank\" rel=\"noopener\" data-w=\"entirely\" data-pos=\"adv.\" data-en=\"completely\" data-zh=\"完全地\">entirely<\/a> without electrical wiring. Historians argue that Karlsson&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rejection\" target=\"_blank\" rel=\"noopener\" data-w=\"rejection\" data-pos=\"n.\" data-en=\"the act of refusing to accept something\" data-zh=\"拒絕；否定\">rejection<\/a> of modern conveniences is ______ the house&#x27;s reliance on skylights, thick stone walls, and hand-cranked ventilation shafts; these <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> old-fashioned elements exemplify her design philosophy.", "bodyPlain": "In 1925, architect Elin Karlsson designed a house entirely without electrical wiring. Historians argue that Karlsson's rejection of modern conveniences is ______ the house's reliance on skylights, thick stone walls, and hand-cranked ventilation shafts; these deliberately old-fashioned elements exemplify her design philosophy.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1925 年，建築師 Elin Karlsson 設計了一棟完全沒有電線配置的房子。歷史學家認為，Karlsson 對現代便利設施的拒絕 ______ 這棟房子對天窗、厚石牆與手搖通風井的依賴；這些刻意復古的元素正體現了她的設計理念。", "opts": {"A": "insensible to", "B": "manifest in", "C": "scrutinized by", "D": "complicated by"}, "optsZh": {"A": "對……無感的", "B": "顯現於", "C": "受到……仔細審查", "D": "因……而複雜化"}, "answer": "B", "expl": "The listed design features are where Karlsson's rejection of convenience is expressed, calling for \"manifest in.\"", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "not aware of or not affected by", "zh": "對……無感的；未察覺的", "word": "insensible to"}, "B": {"pos": "phr.", "en": "clearly shown in", "zh": "顯現於……", "word": "manifest in"}, "C": {"pos": "phr.", "en": "examined very carefully by", "zh": "受到……仔細審查", "word": "scrutinized by"}, "D": {"pos": "phr.", "en": "made more difficult or confusing by", "zh": "因……而複雜化", "word": "complicated by"}}}, {"id": "2.2", "label": "Mock 2.2", "n": 2, "concept": "Words in Context: choose a phrase meaning \"expressed through/shown in\" a set of concrete features.", "vocab": true, "body": "In 1978, chef Antoine Rousseau opened a restaurant that refused to use any imported <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ingredient\" target=\"_blank\" rel=\"noopener\" data-w=\"ingredient\" data-pos=\"n.\" data-en=\"one of the foods used to make a dish\" data-zh=\"成分；原料\">ingredients<\/a>. Critics argue that Rousseau&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rejection\" target=\"_blank\" rel=\"noopener\" data-w=\"rejection\" data-pos=\"n.\" data-en=\"the act of refusing to accept something\" data-zh=\"拒絕；否定\">rejection<\/a> of <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=global\" target=\"_blank\" rel=\"noopener\" data-w=\"global\" data-pos=\"adj.\" data-en=\"relating to the whole world\" data-zh=\"全球的；世界的\">global<\/a> trade is ______ the menu&#x27;s exclusive reliance on <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produce<\/a> grown within fifty kilometers of the restaurant; these locally sourced dishes exemplify his culinary philosophy.", "bodyPlain": "In 1978, chef Antoine Rousseau opened a restaurant that refused to use any imported ingredients. Critics argue that Rousseau's rejection of global trade is ______ the menu's exclusive reliance on produce grown within fifty kilometers of the restaurant; these locally sourced dishes exemplify his culinary philosophy.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1978 年，主廚 Antoine Rousseau 開了一家拒絕使用任何進口食材的餐廳。評論家認為，Rousseau 對全球貿易的拒絕 ______ 菜單完全只使用餐廳方圓五十公里內種植的農產品；這些在地取材的菜餚正體現了他的烹飪理念。", "opts": {"A": "insensible to", "B": "manifest in", "C": "scrutinized by", "D": "complicated by"}, "optsZh": {"A": "對……無感的", "B": "顯現於", "C": "受到……仔細審查", "D": "因……而複雜化"}, "answer": "B", "expl": "The menu's local sourcing is where Rousseau's rejection of global trade is expressed, calling for \"manifest in.\"", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "not aware of or not affected by", "zh": "對……無感的；未察覺的", "word": "insensible to"}, "B": {"pos": "phr.", "en": "clearly shown in", "zh": "顯現於……", "word": "manifest in"}, "C": {"pos": "phr.", "en": "examined very carefully by", "zh": "受到……仔細審查", "word": "scrutinized by"}, "D": {"pos": "phr.", "en": "made more difficult or confusing by", "zh": "因……而複雜化", "word": "complicated by"}}}, {"id": "2.3", "label": "Mock 2.3", "n": 2, "concept": "Words in Context: choose a phrase meaning \"expressed through/shown in\" a set of concrete features.", "vocab": true, "body": "In 1932, typographer Ilse Brandt designed a typeface intended to reject the ornate lettering styles then <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=popular\" target=\"_blank\" rel=\"noopener\" data-w=\"popular\" data-pos=\"adj.\" data-en=\"liked or enjoyed by many people\" data-zh=\"受歡迎的；流行的\">popular<\/a> in advertising. Design <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historians<\/a> argue that Brandt&#x27;s <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=rejection\" target=\"_blank\" rel=\"noopener\" data-w=\"rejection\" data-pos=\"n.\" data-en=\"the act of refusing to accept something\" data-zh=\"拒絕；否定\">rejection<\/a> of decorative excess is ______ the typeface&#x27;s stark, uniform strokes and complete absence of serifs; these austere features exemplify her design <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=principle\" target=\"_blank\" rel=\"noopener\" data-w=\"principle\" data-pos=\"n.\" data-en=\"a basic rule or belief that guides behavior\" data-zh=\"原則\">principles<\/a>.", "bodyPlain": "In 1932, typographer Ilse Brandt designed a typeface intended to reject the ornate lettering styles then popular in advertising. Design historians argue that Brandt's rejection of decorative excess is ______ the typeface's stark, uniform strokes and complete absence of serifs; these austere features exemplify her design principles.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1932 年，字體設計師 Ilse Brandt 設計了一款字體，意在拒絕當時廣告中流行的華麗字形。設計史學家認為，Brandt 對裝飾過度的拒絕 ______ 這款字體簡潔一致的筆畫與完全沒有襯線的設計；這些樸素的特徵正體現了她的設計原則。", "opts": {"A": "insensible to", "B": "manifest in", "C": "scrutinized by", "D": "complicated by"}, "optsZh": {"A": "對……無感的", "B": "顯現於", "C": "受到……仔細審查", "D": "因……而複雜化"}, "answer": "B", "expl": "The typeface's stark features are where Brandt's rejection of ornament is expressed, calling for \"manifest in.\"",  1955, urban planner Rafael Duarte proposed a neighborhood built entirely around pedestrian paths rather than roads. Planning historians argue that Duarte's rejection of car-centered design is ______ the neighborhood's narrow walkways and complete absence of parking lots; these deliberate choices exemplify his planning philosophy.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "stemZh": "哪一個選項填入後，用字最合乎邏輯且最精確？", "bodyZh": "1955 年，都市規劃師 Rafael Duarte 提出一個完全以步道而非道路為中心的社區設計。規劃史學家認為，Duarte 對以汽車為中心之設計的拒絕 ______ 這個社區狹窄的步道與完全沒有停車場；這些刻意的選擇正體現了他的規劃理念。", "opts": {"A": "insensible to", "B": "manifest in", "C": "scrutinized by", "D": "complicated by"}, "optsZh": {"A": "對……無感的", "B": "顯現於", "C": "受到……仔細審查", "D": "因……而複雜化"}, "answer": "B", "expl": "The neighborhood's design choices are where Duarte's rejection of car-centered planning is expressed, calling for \"manifest in.\"", "explZh": "", "defs": {"A": {"pos": "phr.", "en": "not aware of or not affected by", "zh": "對……無感的；未察覺的", "word": "insensible to"}, "B": {"pos": "phr.", "en": "clearly shown in", "zh": "顯現於……", "word": "manifest in"}, "C": {"pos": "phr.", "en": "examined very carefully by", "zh": "受到……仔細審查", "word": "scrutinized by"}, "D": {"pos": "phr.", "en": "made more difficult or confusing by", "zh": "因……而複雜化", "word": "complicated by"}}}, {"id": "2.5", "label": "Mock 2.5", "n": 2, "concept": "Words in Context: choose a phrase meaning \"expressed through/shown in\" a set of concrete features.", "vocab": true, "body": "In 1969, potter Naomi Fielding began firing her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ceramic\" target=\"_blank\" rel=\"noopener\" data-w=\"ceramic\" data-pos=\"adj.\" data-en=\"made of clay that has been fired\" data-zh=\"陶瓷的\">ceramics<\/a> using only wood-burning kilns she built herself. Craft <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direc .", "en": "to act against or block something", "zh": "提供阻力；阻擋", "word": "provide resistance to"}}}, {"id": "4.5", "label": "Mock 4.5", "n": 4, "concept": "Words in Context: identify the meaning of a word used to describe obstacles providing resistance to forward movement.", "vocab": true, "body": "The following text is <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=adapted\" target=\"_blank\" rel=\"noopener\" data-w=\"adapted\" data-pos=\"adj.\" data-en=\"changed to suit a new purpose or audience\" data-zh=\"改編的\">adapted<\/a> from a novel. The <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=narrator\" target=\"_blank\" rel=\"noopener\" data-w=\"narrator\" data-pos=\"n.\" data-en=\"the person who tells a story\" data-zh=\"敘述者\">narrator<\/a> is wading through a <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=crowded\" target=\"_blank\" rel=\"noopener\">crowded<\/a> harbor market at midday. Baskets, coiled ropes, and idle fishermen were disputing every step toward the dock, and I had to turn sideways more than once just to keep moving forward.", "bodyPlain": "The following text is adapted from a novel. The narrator is wading through a crowded harbor market at midday. Baskets, coiled ropes, and idle fishermen were disputing every step toward the dock, and I had to turn sideways more than once just to keep moving forward.", "stem": "As used in the text, what does the word disputing most nearly mean?", "stemZh": "根據文中的用法，disputing 這個字的意思最接近什麼？", "bodyZh": "以下文字改編自一部小說。正午時分，敘述者正艱難地穿過擁擠的港口市場。籃子、盤繞的繩索和閒晃的漁夫阻擋著通往碼頭的每一步，我不只一次得側身才能繼續往前走。", "opts": {"A": "Arguing about", "B": "Disapproving of", "C": "Asserting possession of", "D": "Providing resistance to"}, "optsZh": {"A": "爭論；爭辯", "B": "不贊成", "C": "宣稱擁有", "D": "提供阻力；阻擋"}, "answer": "D", "expl": "The crowd and obstacles physically block the narrator's path, so \"disputing\" means providing resistance to.", "explZh": "", "defs": {"A": {"w": "argue about", "pos": "phr.", "en": "to disagree with someone in words about something", "zh": "爭論；爭辯", "word": "argue about"}, "B": {"w": "disapprove of", "pos": "phr.", "en": "to think something is bad or wrong", "zh": "不贊成", "word": "disapprove of"}, "C": {"w": "assert possession of", "pos": "phr.", "en": "to claim that something belongs to you", "zh": "宣稱擁有", "word": "assert possession of"}, "D": {"w": "provide resistance to", "pos": "phr.", "en": "to act against or block something", "zh": "提供阻力；阻擋", "word": "provide resistance to"}}}, {"id": "o5", "label": "Original Q5", "n": 5, "concept": "Command of Evidence (Function): identify how an underlined sentence elaborates on a previous sentence's claim about a transitional moment.", "vocab": false, "body": "On painter William H. Johnson&#x27;s return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. <u>Turning away from <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscapes<\/a> painted in an expressionist style—a style that often involves using fluid, distorted shapes and thick, textured <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=brushstroke\" target=\"_blank\" rel=\"noopener\" data-w=\"brushstroke\" data-pos=\"n.\" data-en=\"a mark made by a paintbrush on a surface\" data-zh=\"筆觸\">brushstrokes<\/a> to express the artist&#x27;s subjective <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=experience\" target=\"_blank\" rel=\"noopener\" data-w=\"experience\" data-pos=\"v.\" data-en=\"to have something happen to you; to feel or live through\" data-zh=\"經歷；體驗\">experience<\/a> of reality—Johnson began painting portraits of Black Americans in a bold new way.<\/u> Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> oversimplified figures in a vibrant but limited color palette.", "bodyPlain": "On painter William H. Johnson's return to the United States in 1938 after a decade in Europe, his style underwent an abrupt transformation. Turning away from landscapes painted in an expressionist style—a style that often involves using fluid, distorted shapes and thick, textured brushstrokes to express the artist's subjective experience of reality—Johnson began painting portraits of Black Americans in a bold new way. Evocative of African sculpture and American and Scandinavian folk art, these portraits feature flat, deliberately oversimplified figures in a vibrant but limited color palette.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "畫家 William H. Johnson 在歐洲待了十年、於 1938 年返回美國後，他的風格發生了突然的轉變。Johnson 不再畫表現主義風格的風景畫——這種風格常用流動、變形的形狀與厚重、有質感的筆觸來表達藝術家對現實的主觀感受——而開始以大膽的新方式描繪美國黑人的肖像。這些肖像令人聯想到非洲雕塑以及美國與斯堪地那維亞的民間藝術，以鮮豔但有限的色彩呈現扁平、刻意簡化的人物。", "opts": {"A": "It elaborates on the previous sentence's statement about a transitional moment in Johnson's artistic career.", "B": "It provides information about Johnson's travels in support of a claim about his artistic influences, which is advanced in the following sentence.", "C": "It recounts a moment in Johnson's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.", "D": "It presents evidence that calls into question the previous sentence's characterization of Johnson's artistic development."}, "optsZh": {"A": "它詳細說明前一句關於 Johnson 藝術生涯轉折時刻的敘述。", "B": "它提供關於 Johnson 旅行的資訊，以支持下一句提出的關於他藝術影響來源的主張。", "C": "它敘述 Johnson 個人生活中的一個時刻，這個時刻促成了他之後的事業成功，而下一句對此作了總結。", "D": "它提出證據，質疑前一句對 Johnson 藝術發展的描述。"}, "answer": "A", "expl": "The first sentence says his style changed abruptly; the underlined sentence explains that change (from landscapes to bold portraits).", "explZh": "第一句說他的風格突然轉變；畫線句詳細說明這個轉變（從風景畫轉向大膽的人像畫）。"}, {"id": "5.1", "label": "Mock 5.1", "n": 5, "concept": "Command of Evidence (Function): identify how an underlined sentence elaborates on a previous sentence's claim about a transitional moment.", "vocab": false, "body": "On composer Ingrid Falk&#x27;s return to Norway in 1952 after years abroad, her musical style underwent an abrupt transformation. Turning away from the dense <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orchestral\" target=\"_blank\" rel=\"noopener\" data-w=\"orchestral\" data-pos=\"adj.\" data-en=\"written for or played by an orchestra\" data-zh=\"管弦樂的\">orchestral<\/a> scores she had written throughout the 1940s, Falk began composing sparse chamber pieces built around long silences and single sustained notes. Evocative of Norwegian folk fiddle <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> and the natural acoustics of fjord <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=landscape\" target=\"_blank\" rel=\"noopener\" data-w=\"landscape\" data-pos=\"n.\" data-en=\"a large area of land as seen from one place\" data-zh=\"風景；地景\">landscapes<\/a>, these pieces feature minimal instrumentation and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> unresolved harmonies.", "bodyPlain": "On composer Ingrid Falk's return to Norway in 1952 after years abroad, her musical style underwent an abrupt transformation. Turning away from the dense orchestral scores she had written throughout the 1940s, Falk began composing sparse chamber pieces built around long silences and single sustained notes. Evocative of Norwegian folk fiddle traditions and the natural acoustics of fjord landscapes, these pieces feature minimal instrumentation and deliberately unresolved harmonies.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "作曲家 Ingrid Falk 在旅居國外多年、於 1952 年返回挪威後，她的音樂風格發生了突然的轉變。Falk 不再寫她整個 1940 年代所創作的繁複管弦樂譜，而開始創作以長時間靜默與單一持續音為核心的簡約室內樂。這些作品令人聯想到挪威民間提琴傳統與峽灣地景的自然聲響，以極少的樂器編制和刻意未解決的和聲為特色。", "opts": {"A": "It elaborates on the previous sentence's statement about a transitional moment in Falk's musical career.", "B": "It provides information about Falk's travels in support of a claim about her musical influences, which is advanced in the following sentence.", "C": "It recounts a moment in Falk's personal life that enabled the success of her subsequent career, which is summarized in the following sentence.", "D": "It presents evidence that calls into question the previous sentence's characterization of Falk's musical development."}, "optsZh": {"A": "它詳細說明前一句關於 Falk 音樂生涯轉折時刻的敘述。", "B": "它提供關於 Falk 旅行的資訊，以支持下一句提出的關於她音樂影響來源的主張。", "C": "它敘述 Falk 個人生活中的一個時刻，這個時刻促成了她之後的事業成功，而下一句對此作了總結。", "D": "它提出證據，質疑前一句對 Falk 音樂發展的描述。"}, "answer": "A", "expl": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence.", "explZh": ""}, {"id": "5.2", "label": "Mock 5.2", "n": 5, "concept": "Command of Evidence (Function): identify how an underlined sentence elaborates on a previous sentence's claim about a transitional moment.", "vocab": false, "body": "Upon <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=novelist\" target=\"_blank\" rel=\"noopener\" data-w=\"novelist\" data-pos=\"n.\" data-en=\"a person who writes novels\" data-zh=\"小說家\">novelist<\/a> Teodor Basescu&#x27;s release from a decade in political exile in 1987, his writing style underwent an abrupt transformation. Turning away from the dense, allegorical prose he had published before his exile, Basescu began writing spare, plainly narrated short stories centered on ordinary daily routines. Evocative of oral <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=storytelling\" target=\"_blank\" rel=\"noopener\" data-w=\"storytelling\" data-pos=\"n.\" data-en=\"the activity of telling stories\" data-zh=\"說故事\">storytelling<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> and postwar minimalist fiction, these stories feature unadorned sentences and almost no figurative <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=language\" target=\"_blank\" rel=\"noopener\" data-w=\"language\" data-pos=\"n.\" data-en=\"a system of communication used by a particular group of people\" data-zh=\"語言\">language<\/a>.", "bodyPlain": "Upon novelist Teodor Basescu's release from a decade in political exile in 1987, his writing style underwent an abrupt transformation. Turning away from the dense, allegorical prose he had published before his exile, Basescu began writing spare, plainly narrated short stories centered on ordinary daily routines. Evocative of oral storytelling traditions and postwar minimalist fiction, these stories feature unadorned sentences and almost no figurative language.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "小說家 Teodor Basescu 在 1987 年結束十年政治流亡後，他的寫作風格發生了突然的轉變。Basescu 不再寫他流亡前出版的那種繁複、寓言式的散文，而開始寫以日常生活為中心、敘述平實簡潔的短篇小說。這些故事令人聯想到口述說故事的傳統與戰後的極簡主義小說，以樸素的句子和幾乎沒有比喻的語言為特色。", "opts": {"A": "It elaborates on the previous sentence's statement about a transitional moment in Basescu's literary career.", "B": "It provides information about Basescu's exile in support of a claim about his literary influences, which is advanced in the following sentence.", "C": "It recounts a moment in Basescu's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.", "D": "It presents evidence that calls into question the previous sentence's characterization of Basescu's literary development."}, "optsZh": {"A": "它詳細說明前一句關於 Basescu 文學生涯轉折時刻的敘述。", "B": "它提供關於 Basescu 流亡的資訊，以支持下一句提出的關於他文學影響來源的主張。", "C": "它敘述 Basescu 個人生活中的一個時刻，這個時刻促成了他之後的事業成功，而下一句對此作了總結。", "D": "它提出證據，質疑前一句對 Basescu 文學發展的描述。"}, "answer": "A", "expl": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence.", "explZh": ""}, {"id": "5.3", "label": "Mock 5.3", "n": 5, "concept": "Command of Evidence (Function): identify how an underlined sentence elaborates on a previous sentence's claim about a transitional moment.", "vocab": false, "body": "After designer Naomi Achterberg relocated her studio from Paris to Lagos in 1975, her design style underwent an abrupt transformation. Turning away from the closely tailored, monochrome silhouettes she had built her early reputation on, Achterberg began designing loose, brightly patterned <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=garment\" target=\"_blank\" rel=\"noopener\" data-w=\"garment\" data-pos=\"n.\" data-en=\"a piece of clothing\" data-zh=\"衣服；服裝\">garments<\/a> cut from hand-dyed cotton. Evocative of regional textile <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditions<\/a> and the bright light of the West African coast, these garments <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=feature\" target=\"_blank\" rel=\"noopener\" data-w=\"feature\" data-pos=\"v.\" data-en=\"to include something as an important part\" data-zh=\"以…為特色；包含\">feature<\/a> bold geometric prints and asymmetrical draping.", "bodyPlain": "After designer Naomi Achterberg relocated her studio from Paris to Lagos in 1975, her design style underwent an abrupt transformation. Turning away from the closely tailored, monochrome silhouettes she had built her early reputation on, Achterberg began designing loose, brightly patterned garments cut from hand-dyed cotton. Evocative of regional textile traditions and the bright light of the West African coast, these garments feature bold geometric prints and asymmetrical draping.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "設計師 Naomi Achterberg 在 1975 年將工作室從巴黎遷到拉哥斯後，她的設計風格發生了突然的轉變。Achterberg 不再設計讓她早期成名的合身、單色剪裁，而開始設計用手染棉布裁製、寬鬆且色彩鮮豔的服裝。這些服裝令人聯想到當地的紡織傳統與西非海岸的明亮陽光，以大膽的幾何印花和不對稱的垂墜為特色。", "opts": {"A": "It elaborates on the previous sentence's statement about a transitional moment in Achterberg's design career.", "B": "It provides information about Achterberg's relocation in support of a claim about her design influences, which is advanced in the following sentence.", "C": "It recounts a moment in Achterberg's personal life that enabled the success of her subsequent career, which is summarized in the following sentence.", "D": "It presents evidence that calls into question the previous sentence's characterization of Achterberg's design development."}, "optsZh": {"A": "它詳細說明前一句關於 Achterberg 設計生涯轉折時刻的敘述。", "B": "它提供關於 Achterberg 遷居的資訊，以支持下一句提出的關於她設計影響來源的主張。", "C": "它敘述 Achterberg 個人生活中的一個時刻，這個時刻促成了她之後的事業成功，而下一句對此作了總結。", "D": "它提出證據，質疑前一句對 Achterberg 設計發展的描述。"}, "answer": "A", "expl": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence.", "explZh": ""}, {"id": "5.4", "label": "Mock 5.4", "n": 5, "concept": "Command of Evidence (Function): identify how an underlined sentence elaborates on a previous sentence's claim about a transitional moment.", "vocab": false, "body": "Following <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=director\" target=\"_blank\" rel=\"noopener\" data-w=\"director\" data-pos=\"n.\" data-en=\"the person who controls how a film or play is made\" data-zh=\"導演；主任\">director<\/a> Hassan Idrissi&#x27;s return to Morocco in 1968 after film school abroad, his directing style underwent an abrupt transformation. Turning away from the tightly scripted, dialogue-heavy films he had made as a student, Idrissi began directing loosely <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=structure\" target=\"_blank\" rel=\"noopener\" data-w=\"structure\" data-pos=\"n.\" data-en=\"the way parts are arranged or put together\" data-zh=\"結構\">structured<\/a> films built around long, unscripted takes of everyday street life. Evocative of Italian neorealism and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=tradition\" target=\"_blank\" rel=\"noopener\" data-w=\"tradition\" data-pos=\"n.\" data-en=\"a custom or belief passed down over many years\" data-zh=\"傳統\">traditional<\/a> Moroccan <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=storytelling\" target=\"_blank\" rel=\"noopener\" data-w=\"storytelling\" data-pos=\"n.\" data-en=\"the activity of telling stories\" data-zh=\"說故事\">storytelling<\/a>, these films feature nonprofessional actors and minimal editing.", "bodyPlain": "Following director Hassan Idrissi's return to Morocco in 1968 after film school abroad, his directing style underwent an abrupt transformation. Turning away from the tightly scripted, dialogue-heavy films he had made as a student, Idrissi began directing loosely structured films built around long, unscripted takes of everyday street life. Evocative of Italian neorealism and traditional Moroccan storytelling, these films feature nonprofessional actors and minimal editing.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "導演 Hassan Idrissi 在國外念完電影學校、於 1968 年返回摩洛哥後，他的導演風格發生了突然的轉變。Idrissi 不再拍他學生時期那種劇本嚴謹、對白密集的電影，而開始導演結構鬆散、以街頭日常生活的長時間即興鏡頭為核心的電影。這些電影令人聯想到義大利新寫實主義與摩洛哥傳統說故事方式，以非職業演員和極少的剪輯為特色。", "opts": {"A": "It elaborates on the previous sentence's statement about a transitional moment in Idrissi's directing career.", "B": "It provides information about Idrissi's film schooling in support of a claim about his directing influences, which is advanced in the following sentence.", "C": "It recounts a moment in Idrissi's personal life that enabled the success of his subsequent career, which is summarized in the following sentence.", "D": "It presents evidence that calls into question the previous sentence's characterization of Idrissi's directing development."}, "optsZh": {"A": "它詳細說明前一句關於 Idrissi 導演生涯轉折時刻的敘述。", "B": "它提供關於 Idrissi 電影學校教育的資訊，以支持下一句提出的關於他導演影響來源的主張。", "C": "它敘述 Idrissi 個人生活中的一個時刻，這個時刻促成了他之後的事業成功，而下一句對此作了總結。", "D": "它提出證據，質疑前一句對 Idrissi 導演發展的描述。"}, "answer": "A", "expl": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence.", "explZh": ""}, {"id": "5.5", "label": "Mock 5.5", "n": 5, "concept": "Command of Evidence (Function): identify how an underlined sentence elaborates on a previous sentence's claim about a transitional moment.", "vocab": false, "body": "After potter Junko Aoyama took over her family&#x27;s workshop in 1990, her <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=ceramic\" target=\"_blank\" rel=\"noopener\" data-w=\"ceramic\" data-pos=\"adj.\" data-en=\"made of clay that has been fired\" data-zh=\"陶瓷的\">ceramic<\/a> style underwent an abrupt transformation. Turning away from the delicately painted porcelain her family had <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=produce\" target=\"_blank\" rel=\"noopener\" data-w=\"produce\" data-pos=\"v.\" data-en=\"to make or create something, especially in large numbers\" data-zh=\"生產；製造\">produced<\/a> for <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=generation\" target=\"_blank\" rel=\"noopener\" data-w=\"generation\" data-pos=\"n.\" data-en=\"the production of something, such as electricity\" data-zh=\"產生；發電\">generations<\/a>, Aoyama began firing rough, unglazed stoneware left <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=deliberately\" target=\"_blank\" rel=\"noopener\" data-w=\"deliberately\" data-pos=\"adv.\" data-en=\"on purpose; intentionally\" data-zh=\"刻意地；故意地\">deliberately<\/a> asymmetrical. Evocative of centuries-old wabi-sabi aesthetics and the coastal clay of her hometown, these pieces feature visible cracks and uneven surfaces left exposed rather than smoothed away.", "bodyPlain": "After potter Junko Aoyama took over her family's workshop in 1990, her ceramic style underwent an abrupt transformation. Turning away from the delicately painted porcelain her family had produced for generations, Aoyama began firing rough, unglazed stoneware left deliberately asymmetrical. Evocative of centuries-old wabi-sabi aesthetics and the coastal clay of her hometown, these pieces feature visible cracks and uneven surfaces left exposed rather than smoothed away.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "stemZh": "哪一個選項最能描述畫線句子在全文中的功能？", "bodyZh": "陶藝家青山純子在 1990 年接手家族工坊後，她的陶藝風格發生了突然的轉變。青山不再製作家族世代生產的精緻彩繪瓷器，而開始燒製粗糙、無釉、刻意不對稱的炻器。這些作品令人聯想到數百年歷史的侘寂美學與她家鄉的海岸黏土，以保留可見的裂痕與不平整的表面、而非將其磨平為特色。", "opts": {"A": "It elaborates on the previous sentence's statement about a transitional moment in Aoyama's ceramic career.", "B": "It provides information about Aoyama's family workshop in support of a claim about her ceramic influences, which is advanced in the following sentence.", "C": "It recounts a moment in Aoyama's personal life that enabled the success of her subsequent career, which is summarized in the following sentence.", "D": "It presents evidence that calls into question the previous sentence's characterization of Aoyama's ceramic development."}, "optsZh": {"A": "它詳細說明前一句關於青山陶藝生涯轉折時刻的敘述。", "B": "它提供關於青山家族工坊的資訊，以支持下一句提出的關於她陶藝影響來源的主張。", "C": "它敘述青山個人生活中的一個時刻，這個時刻促成了她之後的事業成功，而下一句對此作了總結。", "D": "它提出證據，質疑前一句對青山陶藝發展的描述。"}, "answer": "A", "expl": "The underlined sentence spells out the specific shift referred to as an \"abrupt transformation\" in the prior sentence.", "explZh": ""}, {"id": "o6", "label": "Original Q6", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion describes a common scholarly approach that obscures a group's diversity.", "vocab": false, "body": "Scholarly accounts of the Chicano movement—a movement that advocated for the social, political, and cultural empowerment of Mexican Americans and reached its zenith in the 1960s and 1970s—<u>tend to focus on the most militant, outspoken figures in the movement, making it seem uniformly radical<\/u>. Geographer Juan Herrera has shown, however, that if we shift our focus toward the way the movement manifested in <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=comparatively\" target=\"_blank\" rel=\"noopener\" data-w=\"comparatively\" data-pos=\"adv.\" data-en=\"when compared with something else\" data-zh=\"相對地；比較而言\">comparatively<\/a> low-profile <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=institution\" target=\"_blank\" rel=\"noopener\" data-w=\"institution\" data-pos=\"n.\" data-en=\"a large organization such as a university or hospital\" data-zh=\"機構\">institutions<\/a> and projects, we see participants espousing an array of political <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orientation\" target=\"_blank\" rel=\"noopener\" data-w=\"orientation\" data-pos=\"n.\" data-en=\"a person&#x27;s basic beliefs or attitudes\" data-zh=\"傾向；取向\">orientations<\/a> and approaches to community activism.", "bodyPlain": "Scholarly accounts of the Chicano movement—a movement that advocated for the social, political, and cultural empowerment of Mexican Americans and reached its zenith in the 1960s and 1970s—tend to focus on the most militant, outspoken figures in the movement, making it seem uniformly radical. Geographer Juan Herrera has shown, however, that if we shift our focus toward the way the movement manifested in comparatively low-profile neighborhood institutions and projects, we see participants espousing an array of political orientations and approaches to community activism.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫線部分在全文中的功能？", "bodyZh": "關於奇卡諾運動的學術論述——這場運動倡導墨西哥裔美國人在社會、政治與文化上的賦權，並在 1960 與 1970 年代達到巔峰——往往聚焦於運動中最激進、最敢言的人物，使這場運動看起來一律都很激進。然而，地理學家 Juan Herrera 已經證明，如果我們把焦點轉向這場運動在相對低調的社區機構與計畫中的表現，就會看到參與者抱持各式各樣的政治立場與社區行動方式。", "opts": {"A": "It presents a trend in scholarship on the Chicano movement that the text claims has been reevaluated by researchers in light of Herrera's work on the movement's participants.", "B": "It identifies an aspect of the Chicano movement that the text implies was overemphasized by scholars due to their own political orientations.", "C": "It describes a common approach to studying the Chicano movement that, according to the text, obscures the ideological diversity of the movement's participants.", "D": "It summarizes the conventional method for analyzing the Chicano movement, which the text suggests creates a misleading impression of the effectiveness of neighborhood institutions and projects."}, "optsZh": {"A": "它呈現奇卡諾運動研究中的一種趨勢，而本文聲稱研究人員已根據 Herrera 對運動參與者的研究重新評估了這種趨勢。", "B": "它指出奇卡諾運動的某個面向，而本文暗示學者因自身的政治立場而過度強調這個面向。", "C": "它描述一種研究奇卡諾運動的常見方式，而根據本文，這種方式掩蓋了運動參與者在意識形態上的多樣性。", "D": "它總結分析奇卡諾運動的傳統方法，而本文暗示這種方法對社區機構與計畫的成效造成誤導的印象。"}, "answer": "C", "expl": "The underlined portion describes how scholars usually study the movement, and the text says this hides the variety of participants' views.", "explZh": "畫線部分描述學者通常研究這場運動的方式，而文章指出這種方式掩蓋了參與者政治立場的多樣性。"}, {"id": "6.1", "label": "Mock 6.1", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion describes a common scholarly approach that obscures a group's diversity.", "vocab": false, "body": "Standard accounts of the guild movement in medieval textile towns tend to focus on the wealthiest master weavers, making the guilds seem uniformly prosperous. <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=economic\" target=\"_blank\" rel=\"noopener\" data-w=\"economic\" data-pos=\"adj.\" data-en=\"related to money, trade, and industry\" data-zh=\"經濟的\">Economic<\/a> <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=historian\" target=\"_blank\" rel=\"noopener\" data-w=\"historian\" data-pos=\"n.\" data-en=\"a person who studies or writes about history\" data-zh=\"歷史學家\">historian<\/a> Ana Beltran has shown, however, that if we shift focus toward the far more <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=numerous\" target=\"_blank\" rel=\"noopener\" data-w=\"numerous\" data-pos=\"adj.\" data-en=\"many\" data-zh=\"眾多的\">numerous<\/a> apprentice and journeyman weavers, we see participants facing a wide range of economic circumstances, from comfortable <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=stability\" target=\"_blank\" rel=\"noopener\" data-w=\"stability\" data-pos=\"n.\" data-en=\"the state of being steady and not changing suddenly\" data-zh=\"穩定\">stability<\/a> to persistent hardship.", "bodyPlain": "Standard accounts of the guild movement in medieval textile towns tend to focus on the wealthiest master weavers, making the guilds seem uniformly prosperous. Economic historian Ana Beltran has shown, however, that if we shift focus toward the far more numerous apprentice and journeyman weavers, we see participants facing a wide range of economic circumstances, from comfortable stability to persistent hardship.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫線部分在全文中的功能？", "bodyZh": "關於中世紀紡織城鎮行會運動的標準論述，往往聚焦於最富有的紡織師傅，使行會看起來一律都很富裕。然而，經濟史學家 Ana Beltran 已經證明，如果我們把焦點轉向人數多得多的學徒與熟練工紡織工，就會看到參與者面臨各種不同的經濟處境，從安穩富足到長期困苦都有。", "opts": {"A": "It presents a trend in scholarship on the guild movement that the text claims has been reevaluated by researchers in light of Beltran's work on the guilds' members.", "B": "It identifies an aspect of the guild movement that the text implies was overemphasized by scholars due to their own economic backgrounds.", "C": "It describes a common approach to studying the guild movement that, according to the text, obscures the range of economic circumstances among its members.", "D": "It summarizes the conventional method for analyzing the guild movement, which the text suggests creates a misleading impression of the effectiveness of apprenticeship programs."}, "optsZh": {"A": "它呈現行會運動研究中的一種趨勢，而本文聲稱研究人員已根據 Beltran 對行會成員的研究重新評估了這種趨勢。", "B": "它指出行會運動的某個面向，而本文暗示學者因自身的經濟背景而過度強調這個面向。", "C": "它描述一種研究行會運動的常見方式，而根據本文，這種方式掩蓋了成員經濟處境的多樣性。", "D": "它總結分析行會運動的傳統方法，而本文暗示這種方法對學徒制度的成效造成誤導的印象。"}, "answer": "C", "expl": "The underlined portion names the standard scholarly focus that Beltran's work shows obscures real economic diversity.", "explZh": ""}, {"id": "6.2", "label": "Mock 6.2", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion describes a common scholarly approach that obscures a group's diversity.", "vocab": false, "body": "Standard accounts of the abolitionist movement in a particular state tend to focus on its most <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=prominent\" target=\"_blank\" rel=\"noopener\" data-w=\"prominent\" data-pos=\"adj.\" data-en=\"important and easy to notice\" data-zh=\"突出的；顯著的\">prominent<\/a> public <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=speaker\" target=\"_blank\" rel=\"noopener\" data-w=\"speaker\" data-pos=\"n.\" data-en=\"the voice that talks in a poem; a person who speaks\" data-zh=\"說話者；（詩中的）敘述者\">speakers<\/a>, making the movement seem uniformly confrontational in its tactics. Historian Marcus DeWitt has shown, however, that if we shift focus toward the movement&#x27;s local church-based and <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> organizing efforts, we see participants employing a wide range of strategies, from quiet fundraising to direct legal challenges.", "bodyPlain": "Standard accounts of the abolitionist movement in a particular state tend to focus on its most prominent public speakers, making the movement seem uniformly confrontational in its tactics. Historian Marcus DeWitt has shown, however, that if we shift focus toward the movement's local church-based and neighborhood organizing efforts, we see participants employing a wide range of strategies, from quiet fundraising to direct legal challenges.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫線部分在全文中的功能？", "bodyZh": "關於某州廢奴運動的標準論述，往往聚焦於最著名的公開演說者，使這場運動在策略上看起來一律都很對立衝突。然而，歷史學家 Marcus DeWitt 已經證明，如果我們把焦點轉向這場運動在地方教會與社區的組織工作，就會看到參與者採用各式各樣的策略，從低調募款到直接提出法律挑戰都有。", "opts": {"A": "It presents a trend in scholarship on the abolitionist movement that the text claims has been reevaluated by researchers in light of DeWitt's work on the movement's participants.", "B": "It identifies an aspect of the abolitionist movement that the text implies was overemphasized by scholars due to their own political views.", "C": "It describes a common approach to studying the abolitionist movement that, according to the text, obscures the range of strategies used by its participants.", "D": "It summarizes the conventional method for analyzing the abolitionist movement, which the text suggests creates a misleading impression of the effectiveness of local organizing."}, "optsZh": {"A": "它呈現廢奴運動研究中的一種趨勢，而本文聲稱研究人員已根據 DeWitt 對運動參與者的研究重新評估了這種趨勢。", "B": "它指出廢奴運動的某個面向，而本文暗示學者因自身的政治觀點而過度強調這個面向。", "C": "它描述一種研究廢奴運動的常見方式，而根據本文，這種方式掩蓋了參與者所使用策略的多樣性。", "D": "它總結分析廢奴運動的傳統方法，而本文暗示這種方法對地方組織工作的成效造成誤導的印象。"}, "answer": "C", "expl": "The underlined portion names the standard scholarly focus that DeWitt's work shows obscures real strategic diversity.", "explZh": ""}, {"id": "6.3", "label": "Mock 6.3", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion describes a common scholarly approach that obscures a group's diversity.", "vocab": false, "body": "Standard accounts of the early <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=environment\" target=\"_blank\" rel=\"noopener\" data-w=\"environment\" data-pos=\"n.\" data-en=\"the conditions or surroundings in which something exists\" data-zh=\"環境\">environmental<\/a> movement tend to focus on its national lobbying <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=organization\" target=\"_blank\" rel=\"noopener\" data-w=\"organization\" data-pos=\"n.\" data-en=\"a group of people working together for a shared purpose\" data-zh=\"組織；機構\">organizations<\/a>, making the movement seem uniformly focused on federal legislation. Sociologist Priya Ramaswamy has shown, however, that if we shift focus toward small, community-led <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=conservation\" target=\"_blank\" rel=\"noopener\" data-w=\"conservation\" data-pos=\"n.\" data-en=\"the protection of nature\" data-zh=\"保育；保護\">conservation<\/a> projects of the same period, we see participants pursuing a wide range of goals, from local land trusts to <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=neighborhood\" target=\"_blank\" rel=\"noopener\" data-w=\"neighborhood\" data-pos=\"n.\" data-en=\"an area of a town where people live\" data-zh=\"社區；街區\">neighborhood<\/a> recycling programs.", "bodyPlain": "Standard accounts of the early environmental movement tend to focus on its national lobbying organizations, making the movement seem uniformly focused on federal legislation. Sociologist Priya Ramaswamy has shown, however, that if we shift focus toward small, community-led conservation projects of the same period, we see participants pursuing a wide range of goals, from local land trusts to neighborhood recycling programs.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫線部分在全文中的功能？", "bodyZh": "關於早期環保運動的標準論述，往往聚焦於全國性的遊說組織，使這場運動看起來一律只關注聯邦立法。然而，社會學家 Priya Ramaswamy 已經證明，如果我們把焦點轉向同一時期由社區主導的小型保育計畫，就會看到參與者追求各式各樣的目標，從地方土地信託到社區回收計畫都有。", "opts": {"A": "It presents a trend in scholarship on the environmental movement that the text claims has been reevaluated by researchers in light of Ramaswamy's work on the movement's participants.", "B": "It identifies an aspect of the environmental movement that the text implies was overemphasized by scholars due to their own institutional affiliations.", "C": "It describes a common approach to studying the environmental movement that, according to the text, obscures the range of goals pursued by its participants.", "D": "It summarizes the conventional method for analyzing the environmental movement, which the text suggests creates a misleading impression of the effectiveness of national lobbying."}, "optsZh": {"A": "它呈現環保運動研究中的一種趨勢，而本文聲稱研究人員已根據 Ramaswamy 對運動參與者的研究重新評估了這種趨勢。", "B": "它指出環保運動的某個面向，而本文暗示學者因自身的機構隸屬而過度強調這個面向。", "C": "它描述一種研究環保運動的常見方式，而根據本文，這種方式掩蓋了參與者所追求目標的多樣性。", "D": "它總結分析環保運動的傳統方法，而本文暗示這種方法對全國遊說的成效造成誤導的印象。"}, "answer": "C", "expl": "The underlined portion names the standard scholarly focus that Ramaswamy's work shows obscures real diversity of goals.", "explZh": ""}, {"id": "6.4", "label": "Mock 6.4", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion describes a common scholarly approach that obscures a group's diversity.", "vocab": false, "body": "Standard <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accounts\" target=\"_blank\" rel=\"noopener\">accounts<\/a> of the early computer hobbyist movement tend to focus on a handful of well-known garage inventors, making the movement seem uniformly <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=orient\" target=\"_blank\" rel=\"noopener\" data-w=\"orient\" data-pos=\"v.\" data-en=\"to position something in a particular direction\" data-zh=\"使朝向；定向\">oriented<\/a> toward <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=commercial\" target=\"_blank\" rel=\"noopener\" data-w=\"commercial\" data-pos=\"adj.\" data-en=\"relating to buying and selling for profit\" data-zh=\"商業的\">commercial<\/a> success. Historian Wei Chen has shown, however, that if we shift focus toward the many small hobbyist clubs that met in libraries and community centers, we see participants pursuing a wide range of motivations, from pure curiosity to educational outreach.", "bodyPlain": "Standard accounts of the early computer hobbyist movement tend to focus on a handful of well-known garage inventors, making the movement seem uniformly oriented toward commercial success. Historian Wei Chen has shown, however, that if we shift focus toward the many small hobbyist clubs that met in libraries and community centers, we see participants pursuing a wide range of motivations, from pure curiosity to educational outreach.", "stem": "Which choice best describes the function of the underlined portion in the text as a whole?", "stemZh": "哪一個選項最能描述畫線部分在全文中的功能？", "bodyZh": "關於早期電腦愛好者運動的標準論述，往往聚焦於少數知名的車庫發明家，使這場運動看起來一律以商業成功為導向。然而，歷史學家 Wei Chen 已經證明，如果我們把焦點轉向許多在圖書館和社區中心聚會的小型愛好者社團，就會看到參與者懷有各式各樣的動機，從純粹的好奇心到教育推廣都有。", "opts": {"A": "It presents a trend in scholarship on the computer hobbyist movement that the text claims has been reevaluated by researchers in light of Chen's work on the movement's participants.", "B": "It identifies an aspect of the computer hobbyist movement that the text implies was overemphasized by scholars due to their own professional backgrounds.", "C": "It describes a common approach to studying the computer hobbyist movement that, according to the text, obscures the range of motivations among its participants.", "D": "It summarizes the conventional method for analyzing the computer hobbyist movement, which the text suggests creates a misleading impression of the effectiveness of garage inventors."}, "optsZh": {"A": "它呈現電腦愛好者運動研究中的一種趨勢，而本文聲稱研究人員已根據 Chen 對運動參與者的研究重新評估了這種趨勢。", "B": "它指出電腦愛好者運動的某個面向，而本文暗示學者因自身的專業背景而過度強調這個面向。", "C": "它描述一種研究電腦愛好者運動的常見方式，而根據本文，這種方式掩蓋了參與者動機的多樣性。", "D": "它總結分析電腦愛好者運動的傳統方法，而本文暗示這種方法對車庫發明家的成效造成誤導的印象。"}, "answer": "C", "expl": "The underlined portion names the standard scholarly focus that Chen's work shows obscures real diversity of motivation.", "explZh": ""}, {"id": "6.5", "label": "Mock 6.5", "n": 6, "concept": "Command of Evidence (Function): identify how an underlined portion describes a common scholarly approach that obscures a group's diversity.", "vocab": false, "body": "Standard <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=accounts\" target=\"_blank\" rel=\"noopener\">accounts<\/a> of the <a class=\"dict\" href=\"https://dictionary.cambridge.org/search/english-chinese-traditional/direct/?q=settlement\" target=\"_blank\" rel=\"noopener\" data-w=\"settlement\" data-pos=\"n.\" data-en=\"a place where people have come to live\" data-zh=\"聚落；定居地\">settlement<\/a> house movement tend to focus on its most famous founders, making the movement seem uniformly shaped by a single reform philosophy. Historian Odalys Ferreira has shown, however, that if we shift focus toward the day-to-day staff who ran individual settlement houses, we see
